sans-serif\" text-anchor=\"middle\">M<\/text><text x=\"240\" y=\"16\" font-size=\"16\" font-family=\"sans-serif\" text-anchor=\"middle\">モーター<\/text><text x=\"120\" y=\"56\" font-size=\"16\" font-family=\"sans-serif\" text-anchor=\"end\">金属板R<\/text><text x=\"360\" y=\"56\" font-size=\"16\" font-family=\"sans-serif\" text-anchor=\"start\">金属板P<\/text><text x=\"130\" y=\"288\" font-size=\"16\" font-family=\"sans-serif\" text-anchor=\"middle\">水溶液r<\/text><text x=\"240\" y=\"288\" font-size=\"16\" font-family=\"sans-serif\" text-anchor=\"middle\">セロハン<\/text><text x=\"350\" y=\"288\" font-size=\"16\" font-family=\"sans-serif\" text-anchor=\"middle\">水溶液p<\/text><\/svg><figcaption>図　〔実験2〕の装置<\/figcaption><\/figure>","qs":[{"k":"思","text":"〔実験1〕の結果から、金属P、Q、Rの組み合わせはどれか。最も適するものを1つ選びなさい。","sel":["P：銅　Q：マグネシウム　R：亜鉛","P：銅　Q：亜鉛　R：マグネシウム","P：亜鉛　Q：マグネシウム　R：銅","P：亜鉛　Q：銅　R：マグネシウム","P：マグネシウム　Q：亜鉛　R：銅","P：マグネシウム　Q：銅　R：亜鉛"],"ans":[1],"kai":"固体が付着するのは、入れた金属の方が水溶液中の金属よりイオンになりやすいときである。QはPとRのどちらよりも、RはPよりもイオンになりやすいので、Qがマグネシウム、Rが亜鉛、Pが銅である。"},{"k":"知","text":"〔実験1〕で、金属Qを水溶液pに入れたときに起こった変化の説明はどれか。最も適するものを1つ選びなさい。","sel":["金属Qの原子が電子を失って陽イオンになり、水溶液p中の金属のイオンが電子を受けとって原子になった。","金属Qの原子が電子を受けとって陽イオンになり、水溶液p中の金属のイオンが電子を失って原子になった。","金属Qの原子が電子を失って陰イオンになり、水溶液p中の金属のイオンが電子を受けとって原子になった。","金属Qの原子が電子を受けとって陰イオンになり、水溶液p中の金属のイオンが電子を失って原子になった。"],"ans":[1],"kai":"金属の原子は電子を失って陽イオンになる。水溶液中の金属のイオンはその電子を受けとって原子になり、金属Qの表面に付着する。"},{"k":"思","text":"〔実験2〕でモーターが回っているときのようすの説明はどれか。最も適するものを1つ選びなさい。","sel":["金属板Rが－極であり、金属板Rはとけて質量が減り、金属板Pの表面には固体が付着する。","金属板Rが－極であり、金属板Rの表面には固体が付着し、金属板Pはとけて質量が減る。","金属板Pが－極であり、金属板Pはとけて質量が減り、金属板Rの表面には固体が付着する。","金属板Pが－極であり、金属板Pの表面には固体が付着し、金属板Rはとけて質量が減る。"],"ans":[1],"kai":"イオンになりやすい方の金属板Rが電子を失ってとけ出し、－極になる。電子は導線を通って金属板Pへ移動し、水溶液p中の金属のイオンが電子を受けとって金属板Pに付着する。"},{"k":"思","text":"〔実験2〕の装置の金属板Pと水溶液pを、金属板Qと水溶液qにとりかえた。このとき－極になる金属板と、モーターの回る向きの組み合わせはどれか。最も適するものを1つ選びなさい。","sel":["金属板Qが－極になり、モーターはとりかえる前と逆向きに回る。","金属板Qが－極になり、モーターはとりかえる前と同じ向きに回る。","金属板Rが－極になり、モーターはとりかえる前と逆向きに回る。","金属板Rが－極になり、モーターはとりかえる前と同じ向きに回る。"],"ans":[1],"kai":"QはRよりイオンになりやすいので、金属板Qが－極、金属板Rが＋極になる。金属板Rは－極から＋極に変わり、電流の向きが逆になるので、モーターは逆向きに回る。"}]},{"id":"kanagawa_r8-d3","src":"神奈川県 2026年 問7","kind":"dai","field":"生物","grade":2,"topic":"光合成と呼吸","ctx":"<p class=\"lead\">キャベツの外側の緑色の葉と、内側の白色の葉のはたらきのちがいを調べるために、次の実験を行った。<br>〔実験〕同じ大きさのポリエチレンの袋A～Hを用意し、表のように、緑色の葉または白色の葉を入れた。袋Gと袋Hには葉を入れなかった。すべての袋に息を吹きこんで、袋の中の二酸化炭素の濃度を0.80％にしてから密閉した。袋を明るい場所または暗い場所に2時間置いたあと、袋の中の二酸化炭素の濃度を気体検知管ではかった。表は、その結果をまとめたものである。ただし、袋の中の気体の体積はすべて同じで、葉の体積は考えないものとする。<\/p><table><caption>表　袋に入れたものと2時間後の二酸化炭素の濃度<\/caption><tr><th>袋<\/th><th>入れた葉<\/th><th>葉の質量〔g〕<\/th><th>置いた場所<\/th><th>2時間後の濃度〔％〕<\/th><\/tr><tr><th>A<\/th><td>緑色<\/td><td>20<\/td><td>明るい場所<\/td><td>0.50<\/td><\/tr><tr><th>B<\/th><td>緑色<\/td><td>40<\/td><td>明るい場所<\/td><td>0.20<\/td><\/tr><tr><th>C<\/th><td>緑色<\/td><td>20<\/td><td>暗い場所<\/td><td>0.95<\/td><\/tr><tr><th>D<\/th><td>白色<\/td><td>20<\/td><td>明るい場所<\/td><td>0.90<\/td><\/tr><tr><th>E<\/th><td>白色<\/td><td>40<\/td><td>明るい場所<\/td><td>1.00<\/td><\/tr><tr><th>F<\/th><td>白色<\/td><td>20<\/td><td>暗い場所<\/td><td>0.90<\/td><\/tr><tr><th>G<\/th><td>なし<\/td><td>0<\/td><td>明るい場所<\/td><td>0.80<\/td><\/tr><tr><th>H<\/th><td>なし<\/td><td>0<\/td><td>暗い場所<\/td><td>0.80<\/td><\/tr><\/table>","qs":[{"k":"思","text":"袋Aで二酸化炭素の濃度が下がった原因が、「光が当たったこと」と「緑色の葉を入れたこと」にあることを確かめたい。それぞれ、袋Aとどの袋の結果を比べればよいか。最も適するものを1つ選びなさい。","sel":["光が当たったこと：袋C　緑色の葉を入れたこと：袋G","光が当たったこと：袋C　緑色の葉を入れたこと：袋H","光が当たったこと：袋G　緑色の葉を入れたこと：袋C","光が当たったこと：袋F　緑色の葉を入れたこと：袋G","光が当たったこと：袋H　緑色の葉を入れたこと：袋D"],"ans":[1],"kai":"調べたい条件だけがちがい、ほかの条件が同じ袋と比べる。袋Aと光の条件だけがちがうのは袋C、葉があるかないかだけがちがうのは袋Gである。"},{"k":"思","text":"袋Aの緑色の葉20gが、2時間の光合成で吸収した二酸化炭素の量は、袋の中の二酸化炭素の濃度を何％下げる量にあたるか。濃度の値の差（たとえば0.80％が0.70％になるなら0.10％）で表し、小数第2位まで答えなさい。ただし、葉が呼吸で出す二酸化炭素の量は、光が当たっているかどうかに関係なく同じであるとする。","num":"0.45","unit":"％","kai":"袋Cから、緑色の葉20gは呼吸で濃度を0.15％分上げる。袋Aでは差し引き0.30％分下がったので、光合成で吸収したのは0.30＋0.15＝0.45％分である。"},{"k":"思","text":"白色の葉60gと緑色の葉を同じ袋に入れ、〔実験〕と同じように明るい場所に2時間置く。2時間後の二酸化炭素の濃度が0.80％のまま変わらないようにするには、緑色の葉を何g入れればよいか。ただし、濃度の変化は葉の質量に比例し、2種類の葉をいっしょに入れても、それぞれの葉のはたらきは変わらないものとする。整数で答えなさい。","num":"20","unit":"g","kai":"袋D、Eから、白色の葉は20gあたり0.10％分上げるので、60gでは0.30％分上げる。袋A、Bから、緑色の葉は明るい場所で20gあたり0.30％分下げるので、20g入れればつり合う。"},{"k":"思","text":"袋D、E、Fの結果からわかることはどれか。最も適するものを1つ選びなさい。","sel":["白色の葉は光合成を行わず、呼吸で出す二酸化炭素の量は葉の質量に比例する。","白色の葉は光合成を行わず、呼吸で出す二酸化炭素の量は葉の質量に関係しない。","白色の葉は光合成を行い、光合成で吸収する二酸化炭素の量は葉の質量に比例する。","白色の葉は、光合成も呼吸も行わない。"],"ans":[1],"kai":"袋Dと袋Fの濃度が同じなので、白色の葉は光が当たっても二酸化炭素を吸収していない。また、袋Dと袋Eから、濃度の上がり方は葉の質量が2倍になると2倍になっている。"}]},{"id":"kanagawa_r8-d4","src":"神奈川県 2026年 問8","kind":"dai","field":"地学","grade":3,"topic":"太陽の黒点の観察","ctx":"<p class=\"lead\">天体望遠鏡に太陽投影板をとりつけ、直径12cmの円をかいた記録用紙を固定して、円に太陽の像を合わせ、黒点Pの位置と形を3日おきに同じ時刻に記録した。像を円に合わせても、記録しているあいだに太陽の像は円からずれていった。<br>黒点Pの位置は、太陽の像の中央を通る南北の線を0°として、太陽の中心から見て東または西へ何度はなれているかで表した。表は、その結果をまとめたものである。黒点Pは、像の中央付近では円形に見えたが、像の周辺部ではだ円形に見えた。<\/p><table><caption>表　黒点Pの位置<\/caption><tr><th>観察した日<\/th><td>5月8日<\/td><td>5月11日<\/td><td>5月14日<\/td><td>5月17日<\/td><\/tr><tr><th>黒点Pの位置<\/th><td>東60°<\/td><td>東20°<\/td><td>西20°<\/td><td>西60°<\/td><\/tr><\/table>","qs":[{"k":"知","text":"黒点Pの位置が日ごとに一定の向きに変わったことと、黒点Pの形が像の中央付近と周辺部でちがって見えたことからわかることはどれか。最も適するものを1つ選びなさい。","sel":["太陽は球形で、自転している。","太陽は球形で、地球のまわりを公転している。","太陽は平らな円盤の形で、自転している。","太陽は平らな円盤の形で、地球のまわりを公転している。"],"ans":[1],"kai":"黒点の位置が一定の向きに変わるのは太陽が自転しているからである。周辺部で黒点がだ円形に見えるのは、太陽が球形で、周辺部の表面をななめから見ることになるからである。"},{"k":"思","text":"記録しているあいだに太陽の像が記録用紙の円からずれていったことと、同じ原因で起こる現象はどれか。最も適するものを1つ選びなさい。","sel":["北の空の星が、北極星付近を中心に1時間に約15°ずつ回って見える。","真夜中に南中する星座が、季節によって変わる。","太陽の南中高度が、夏至の日と冬至の日でちがう。","月が、約1か月の周期で満ち欠けする。"],"ans":[1],"kai":"太陽の像がずれていくのは、地球の自転によって太陽が日周運動をしているからである。北の空の星が北極星付近を中心に回って見えるのも、地球の自転による見かけの動きである。"},{"k":"思","text":"像の中央付近に見えたときの黒点Pは、記録用紙上で直径2.2mmの円形であった。太陽の直径を地球の直径の109倍とすると、黒点Pの実際の直径は地球の直径の約何倍か。小数第1位を四捨五入して整数で答えなさい。","num":"2","unit":"倍","kai":"直径120mmの像が地球の直径の109倍にあたるので、2.2mmは109×2.2÷120＝1.99…倍にあたり、約2倍である。"},{"k":"思","text":"黒点Pが表と同じ速さで動き続けるとすると、黒点Pが太陽を1周して、5月8日と同じ位置に再び見えるのは、5月8日の何日後と考えられるか。整数で答えなさい。","num":"27","unit":"日後","kai":"5月8日から17日までの9日間で、東60°から西60°まで120°動いている。1周360°は120°の3倍なので、9日×3＝27日後である。"}]},{"id":"kanagawa_r8-s1","src":"神奈川県 2026年 問1","kind":"sho","field":"物理","grade":1,"topic":"音の大きさと高さ","ctx":"<p class=\"lead\">ある音Xをマイクで拾い、コンピュータの画面に波形を表示させた。次に、条件を変えて出した音A～Dの波形を、音Xのときと同じ設定で表示させた。図は、それらの波形を示したものであり、横軸は時間、縦軸は振動のはばを表している。<\/p><figure><svg viewBox=\"0 0 520 420\"><defs><pattern id=\"kr8s1g\" width=\"20\" height=\"20\" patternUnits=\"userSpaceOnUse\"><path d=\"M20,0 H0 V20\" fill=\"none\" stroke=\"#bbb\" stroke-width=\"1\"/><\/pattern><\/defs><g transform=\"translate(10,34)\"><rect width=\"160\" height=\"160\" fill=\"url(#kr8s1g)\" stroke=\"#000\" stroke-width=\"1.5\"/><line x1=\"0\" y1=\"80\" x2=\"160\" y2=\"80\" stroke=\"#666\" stroke-width=\"1\"/><path d=\"M0,80 Q20,0 40,80 T80,80 T120,80 T160,80\" fill=\"none\" stroke=\"#000\" stroke-width=\"2.5\"/><text x=\"80\" y=\"-10\" font-size=\"18\" font-family=\"sans-serif\" text-anchor=\"middle\">音X<\/text><\/g><g transform=\"translate(180,34)\"><rect width=\"160\" height=\"160\" fill=\"url(#kr8s1g)\" stroke=\"#000\" stroke-width=\"1.5\"/><line x1=\"0\" y1=\"80\" x2=\"160\" y2=\"80\" stroke=\"#666\" stroke-width=\"1\"/><path d=\"M0,80 Q10,40 20,80 T40,80 T60,80 T80,80 T100,80 T120,80 T140,80 T160,80\" fill=\"none\" stroke=\"#000\" stroke-width=\"2.5\"/><text x=\"80\" y=\"-10\" font-size=\"18\" font-family=\"sans-serif\" text-anchor=\"middle\">音A<\/text><\/g><g transform=\"translate(350,34)\"><rect width=\"160\" height=\"160\" fill=\"url(#kr8s1g)\" stroke=\"#000\" stroke-width=\"1.5\"/><line x1=\"0\" y1=\"80\" x2=\"160\" y2=\"80\" stroke=\"#666\" stroke-width=\"1\"/><path d=\"M0,80 Q10,-40 20,80 T40,80 T60,80 T80,80 T100,80 T120,80 T140,80 T160,80\" fill=\"none\" stroke=\"#000\" stroke-width=\"2.5\"/><text x=\"80\" y=\"-10\" font-size=\"18\" font-family=\"sans-serif\" text-anchor=\"middle\">音B<\/text><\/g><g transform=\"translate(95,244)\"><rect width=\"160\" height=\"160\" fill=\"url(#kr8s1g)\" stroke=\"#000\" stroke-width=\"1.5\"/><line x1=\"0\" y1=\"80\" x2=\"160\" y2=\"80\" stroke=\"#666\" stroke-width=\"1\"/><path d=\"M0,80 Q40,40 80,80 T160,80\" fill=\"none\" stroke=\"#000\" stroke-width=\"2.5\"/><text x=\"80\" y=\"-10\" font-size=\"18\" font-family=\"sans-serif\" text-anchor=\"middle\">音C<\/text><\/g><g transform=\"translate(265,244)\"><rect width=\"160\" height=\"160\" fill=\"url(#kr8s1g)\" stroke=\"#000\" stroke-width=\"1.5\"/><line x1=\"0\" y1=\"80\" x2=\"160\" y2=\"80\" stroke=\"#666\" stroke-width=\"1\"/><path d=\"M0,80 Q40,-40 80,80 T160,80\" fill=\"none\" stroke=\"#000\" stroke-width=\"2.5\"/><text x=\"80\" y=\"-10\" font-size=\"18\" font-family=\"sans-serif\" text-anchor=\"middle\">音D<\/text><\/g><\/svg><figcaption>図　音の波形<\/figcaption><\/figure>","qs":[{"k":"思","text":"音Xと比べて、高く、小さい音はどれか。最も適するものを1つ選びなさい。","sel":["音A","音B","音C","音D"],"ans":[1],"fix":true,"kai":"音が高いほど振動数が多く、同じ時間の波の数が多くなる。音が小さいほど振幅が小さくなる。音Xより波の数が多く、振幅が小さいのは音Aである。"}]},{"id":"kanagawa_r8-s2","src":"神奈川県 2026年 問1","kind":"sho","field":"物理","grade":1,"topic":"ばねののびと力","ctx":"<p class=\"lead\">2種類のばねP、Qにおもりをつるし、ばねを引く力の大きさとばねののびの関係を調べたところ、図のようになった。<\/p><figure><svg viewBox=\"0 0 480 320\"><defs><pattern id=\"kr8s2g\" x=\"80\" y=\"50\" width=\"70\" height=\"35\" patternUnits=\"userSpaceOnUse\"><path d=\"M70,0 H0 V35\" fill=\"none\" stroke=\"#aaa\" stroke-width=\"1\"/><\/pattern><\/defs><rect x=\"80\" y=\"50\" width=\"350\" height=\"210\" fill=\"url(#kr8s2g)\" stroke=\"#000\" stroke-width=\"1.5\"/><line x1=\"80\" y1=\"260\" x2=\"290\" y2=\"50\" stroke=\"#000\" stroke-width=\"2\"/><line x1=\"80\" y1=\"260\" x2=\"430\" y2=\"172.5\" stroke=\"#000\" stroke-width=\"2\"/><circle cx=\"150\" cy=\"190\" r=\"4\"/><circle cx=\"220\" cy=\"120\" r=\"4\"/><circle cx=\"290\" cy=\"50\" r=\"4\"/><circle cx=\"220\" cy=\"225\" r=\"4\"/><circle cx=\"360\" cy=\"190\" r=\"4\"/><text x=\"302\" y=\"76\" font-size=\"18\" font-family=\"sans-serif\">P<\/text><text x=\"438\" y=\"168\" font-size=\"18\" font-family=\"sans-serif\">Q<\/text><g font-size=\"16\" font-family=\"sans-serif\" text-anchor=\"middle\"><text x=\"80\" y=\"280\">0<\/text><text x=\"150\" y=\"280\">0.5<\/text><text x=\"220\" y=\"280\">1.0<\/text><text x=\"290\" y=\"280\">1.5<\/text><text x=\"360\" y=\"280\">2.0<\/text><text x=\"430\" y=\"280\">2.5<\/text><text x=\"255\" y=\"308\">力の大きさ〔N〕<\/text><\/g><g font-size=\"16\" font-family=\"sans-serif\" text-anchor=\"end\"><text x=\"72\" y=\"230\">2<\/text><text x=\"72\" y=\"195\">4<\/text><text x=\"72\" y=\"160\">6<\/text><text x=\"72\" y=\"125\">8<\/text><text x=\"72\" y=\"90\">10<\/text><text x=\"72\" y=\"55\">12<\/text><\/g><text transform=\"translate(24,155) rotate(-90)\" font-size=\"16\" font-family=\"sans-serif\" text-anchor=\"middle\">ばねののび〔cm〕<\/text><\/svg><figcaption>図　力の大きさとばねののび<\/figcaption><\/figure>","qs":[{"k":"思","text":"ばねPとばねQを別々に使って、ばねののびが8.0cmになるところまで目盛りをつけたばねばかりを2つ作る。より大きな力まではかれるのはどちらのばねを使ったばねばかりで、それは何Nまではかれるか。最も適するものを1つ選びなさい。ただし、どちらのばねも、のびが8.0cmになるまで図の関係が成り立つものとする。","sel":["ばねQを使ったもので、4.0 Nまではかれる。","ばねQを使ったもので、1.0 Nまではかれる。","ばねPを使ったもので、4.0 Nまではかれる。","ばねPを使ったもので、1.0 Nまではかれる。"],"ans":[1],"kai":"ばねののびは力の大きさに比例する。のびが8.0cmになる力は、ばねPが1.0N、ばねQが1.0N×(8.0÷2.0)＝4.0Nなので、のびにくいばねQの方が大きな力まではかれる。"}]},{"id":"kanagawa_r8-s3","src":"神奈川県 2026年 問1","kind":"sho","field":"物理","grade":3,"topic":"力の合成とつり合い","ctx":"<p class=\"lead\">図は、点Oにはたらく2つの力A、Bを矢印で表したものである。方眼の1目盛りは1Nを表している。点Oに3つ目の力Cを加えて、力Aと力Bの合力と力Cがつり合うようにする。<\/p><figure><svg viewBox=\"0 0 520 360\"><defs><pattern id=\"kr8s3g\" x=\"100\" y=\"20\" width=\"40\" height=\"40\" patternUnits=\"userSpaceOnUse\"><path d=\"M40,0 H0 V40\" fill=\"none\" stroke=\"#aaa\" stroke-width=\"1\"/><\/pattern><\/defs><rect x=\"100\" y=\"20\" width=\"320\" height=\"320\" fill=\"url(#kr8s3g)\" stroke=\"#000\" stroke-width=\"1.5\"/><line x1=\"180\" y1=\"180\" x2=\"216\" y2=\"72\" stroke=\"#000\" stroke-width=\"2.5\"/><polygon points=\"220,60 220.3,74.9 210.9,71.7\"/><line x1=\"180\" y1=\"180\" x2=\"291\" y2=\"291\" stroke=\"#000\" stroke-width=\"2.5\"/><polygon points=\"300,300 293.6,286.6 286.6,293.6\"/><circle cx=\"180\" cy=\"180\" r=\"5\"/><text x=\"156\" y=\"174\" font-size=\"18\" font-family=\"sans-serif\">O<\/text><text x=\"230\" y=\"58\" font-size=\"18\" font-family=\"sans-serif\">A<\/text><text x=\"308\" y=\"316\" font-size=\"18\" font-family=\"sans-serif\">B<\/text><\/svg><figcaption>図　点Oにはたらく力<\/figcaption><\/figure>","qs":[{"k":"思","text":"力Cの向きと大きさの組み合わせはどれか。最も適するものを1つ選びなさい。","sel":["図の左向きで、4 N","図の右向きで、4 N","図の左向きで、6 N","図の右向きで、6 N"],"ans":[1],"kai":"力Aと力Bを2辺とする平行四辺形の対角線が合力で、点Oから右向きに4目盛り分の4Nになる。つり合う力Cは、合力と一直線上で逆向き、同じ大きさなので、左向きに4Nである。"}]},{"id":"kanagawa_r8-s4","src":"神奈川県 2026年 問2","kind":"sho","field":"化学","grade":3,"topic":"白い粉末の区別","ctx":"<p class=\"lead\">白い粉末A、B、Cは、砂糖、食塩、デンプンのいずれかである。これらを区別するために、次の実験を行った。<br>・粉末A～Cを別々のビーカーの水に入れてよくかき混ぜると、AとCはとけて透明になったが、Bはとけ残って白くにごった。<br>・AとCの水溶液にそれぞれ電極を入れて電圧を加えると、Cの水溶液には電流が流れたが、Aの水溶液には電流が流れなかった。<\/p>","qs":[{"k":"思","text":"粉末Aの物質名と、粉末Aを燃焼さじにのせてガスバーナーで加熱したときのようすの組み合わせはどれか。最も適するものを1つ選びなさい。","sel":["砂糖であり、加熱すると黒くこげて炭になる。","砂糖であり、加熱してもこげずに白いままである。","食塩であり、加熱すると黒くこげて炭になる。","食塩であり、加熱してもこげずに白いままである。","デンプンであり、加熱すると黒くこげて炭になる。","デンプンであり、加熱してもこげずに白いままである。"],"ans":[1],"kai":"水にとけないBがデンプン、水溶液に電流が流れるCが電解質の食塩なので、Aは砂糖である。砂糖は炭素をふくむ有機物なので、加熱すると黒くこげて炭になる。"}]},{"id":"kanagawa_r8-s5","src":"神奈川県 2026年 問2","kind":"sho","field":"化学","grade":1,"topic":"質量パーセント濃度と密度","ctx":"","qs":[{"k":"思","text":"砂糖27gを水108gにすべてとかして砂糖水をつくり、メスシリンダーに入れて体積をはかったところ、125cm<sup>3<\/sup>であった。この砂糖水の質量パーセント濃度と密度の組み合わせはどれか。最も適するものを1つ選びなさい。ただし、密度は小数第3位を四捨五入した値とする。","sel":["20％、1.08 g/cm<sup>3<\/sup>","25％、1.08 g/cm<sup>3<\/sup>","20％、0.93 g/cm<sup>3<\/sup>","25％、0.93 g/cm<sup>3<\/sup>"],"ans":[1],"kai":"砂糖水の質量は27＋108＝135gなので、濃度は27÷135×100＝20％である。密度は135g÷125cm<sup>3<\/sup>＝1.08g/cm<sup>3<\/sup>である。"}]},{"id":"kanagawa_r8-s6","src":"神奈川県 2026年 問2","kind":"sho","field":"化学","grade":2,"topic":"化学反応式と分子のモデル","ctx":"<p class=\"lead\">分子A 1個と分子B 4個が反応して、分子C 1個と分子D 2個ができる化学変化がある。この化学変化は、A～Dをそれぞれの分子の化学式として、次のように表される。<br>　A ＋ 4B → C ＋ 2D<br>図は、分子Aと分子Dのモデルを表したものである。これらの分子をつくる3種類の原子を、●、○、◎で表している。<\/p><figure><svg viewBox=\"0 0 400 130\"><circle cx=\"60\" cy=\"55\" r=\"16\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"2\"/><circle cx=\"124\" cy=\"55\" r=\"16\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"2\"/><circle cx=\"92\" cy=\"55\" r=\"16\" fill=\"#333\" stroke=\"#000\" stroke-width=\"2\"/><text x=\"92\" y=\"110\" font-size=\"17\" font-family=\"sans-serif\" text-anchor=\"middle\">分子A<\/text><circle cx=\"260\" cy=\"55\" r=\"16\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"2\"/><circle cx=\"260\" cy=\"55\" r=\"9\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"2\"/><circle cx=\"324\" cy=\"55\" r=\"16\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"2\"/><circle cx=\"324\" cy=\"55\" r=\"9\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"2\"/><circle cx=\"292\" cy=\"55\" r=\"16\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"2\"/><text x=\"292\" y=\"110\" font-size=\"17\" font-family=\"sans-serif\" text-anchor=\"middle\">分子D<\/text><\/svg><figcaption>図　分子のモデル<\/figcaption><\/figure>","qs":[{"k":"思","text":"分子Bと分子Cをつくっている原子の組み合わせはどれか。最も適するものを1つ選びなさい。","sel":["分子B：◎が2個　分子C：●が1個と◎が4個","分子B：◎が2個　分子C：●が1個と◎が2個","分子B：◎が2個　分子C：●が1個と○が1個と◎が2個","分子B：○が2個　分子C：●が1個と◎が4個","分子B：○が1個と◎が1個　分子C：●が1個と◎が4個"],"ans":[1],"kai":"化学変化の前後で、原子の種類と数は変わらない。右辺の分子D 2個に○が2個、◎が4個あり、左辺の分子Aに●が1個、○が2個あるので、分子B 4個で◎が8個、分子Cは●が1個と◎が4個になる。"}]},{"id":"kanagawa_r8-s7","src":"神奈川県 2026年 問3","kind":"sho","field":"生物","grade":1,"topic":"被子植物のなかま分け","ctx":"","qs":[{"k":"知","text":"ある被子植物の茎をうすく輪切りにして顕微鏡で観察したところ、維管束が輪のように並んでいた。この植物の子葉の数、葉脈、根のようすの組み合わせはどれか。最も適するものを1つ選びなさい。","sel":["子葉は2枚で、葉脈は網目状であり、根は主根と側根からなる。","子葉は2枚で、葉脈は平行であり、根はひげ根である。","子葉は2枚で、葉脈は網目状であり、根はひげ根である。","子葉は1枚で、葉脈は平行であり、根はひげ根である。","子葉は1枚で、葉脈は網目状であり、根は主根と側根からなる。","子葉は1枚で、葉脈は平行であり、根は主根と側根からなる。"],"ans":[1],"kai":"茎の維管束が輪のように並ぶのは双子葉類である。双子葉類は子葉が2枚で、葉脈は網目状（網状脈）、根は主根と側根からなる。"}]},{"id":"kanagawa_r8-s8","src":"神奈川県 2026年 問3","kind":"sho","field":"生物","grade":3,"topic":"遺伝の規則性と無性生殖","ctx":"<p class=\"lead\">チューリップは、球根が分かれてふえるほかに、種子によってもふえる。あるチューリップの花の色には赤色と黄色があり、花の色を赤色にする遺伝子Rと黄色にする遺伝子rが、メンデルが発見した遺伝の規則性にしたがって伝わり、赤色が顕性形質であるものとする。次のA～Eの株がある。<br>A　赤色の花をさかせる純系の株<br>B　黄色の花をさかせる純系の株<br>C　AとBをかけ合わせてできた種子から育った株<br>D　Cの球根が分かれてできた球根から育った株<br>E　Cの自家受粉でできた種子から育った株<\/p>","qs":[{"k":"思","text":"A～Eの株についての説明はどれか。最も適するものを1つ選びなさい。","sel":["Dの株がもつ遺伝子の組み合わせはRrであり、Cの株と同じである。","Dの株には、赤色の花をさかせる株と黄色の花をさかせる株が、およそ3：1の割合で現れる。","Cの株がつくる花粉の中の精細胞がもつ遺伝子は、すべてRである。","Eの株がもつ遺伝子の組み合わせは、すべてRrである。"],"ans":[1],"kai":"CはRRとrrをかけ合わせたのでRrである。Dは無性生殖でできたので、親のCと同じ遺伝子の組み合わせRrをもつ。Cの精細胞にはRとrがあり、EにはRR、Rr、rrが現れる。"}]},{"id":"kanagawa_r8-s9","src":"神奈川県 2026年 問3","kind":"sho","field":"生物","grade":3,"topic":"生物の数量のつり合い","ctx":"<p class=\"lead\">ある地域で、植物、草食動物、肉食動物の数量のつり合いが保たれていた。あるとき、何らかの原因で肉食動物の数量が一時的に減少した。その後、次のP～Rの変化が順に起こり、最後に植物の数量が増加して肉食動物の数量が減少し、もとのつり合いのとれた状態にもどった。<br>P　草食動物の数量が減少する。<br>Q　草食動物の数量が増加する。<br>R　植物の数量が減少し、肉食動物の数量が増加する。<\/p>","qs":[{"k":"思","text":"P～Rを、変化が起こった順に並べたものはどれか。最も適するものを1つ選びなさい。","sel":["Q → R → P","Q → P → R","P → Q → R","P → R → Q","R → P → Q","R → Q → P"],"ans":[1],"kai":"肉食動物が減ると、食べられる数が減って草食動物が増える。すると、食べられる植物が減り、えさが増えた肉食動物が増える。その結果、草食動物は減る。"}]},{"id":"kanagawa_r8-s10","src":"神奈川県 2026年 問4","kind":"sho","field":"地学","grade":1,"topic":"火成岩のつくりとでき方","ctx":"","qs":[{"k":"知","text":"ある火成岩をルーペで観察したところ、肉眼でも見分けられる同じくらいの大きさの鉱物が、すき間なく組み合わさっていた。この岩石のつくりの名前、マグマの冷え方、この岩石の例の組み合わせはどれか。最も適するものを1つ選びなさい。","sel":["等粒状組織、地下の深いところでゆっくり冷えた、花こう岩","等粒状組織、地下の深いところでゆっくり冷えた、安山岩","等粒状組織、地表や地表付近で急に冷えた、花こう岩","斑状組織、地表や地表付近で急に冷えた、安山岩","斑状組織、地下の深いところでゆっくり冷えた、花こう岩","斑状組織、地表や地表付近で急に冷えた、花こう岩"],"ans":[1],"kai":"同じくらいの大きさの鉱物が組み合わさったつくりは等粒状組織で、マグマが地下の深いところでゆっくり冷えてできた深成岩に見られる。花こう岩は深成岩、安山岩は火山岩である。"}]},{"id":"kanagawa_r8-s11","src":"神奈川県 2026年 問4","kind":"sho","field":"地学","grade":1,"topic":"地層のでき方","ctx":"<p class=\"lead\">あるがけで、地層が下から順に、れき岩の層、砂岩の層、泥岩の層、凝灰岩の層と重なっているのが見られた。これらの層は、海底で下の層から順に連続して堆積したもので、地層の上下の逆転はないものとする。<\/p>","qs":[{"k":"思","text":"これらの層が堆積したあいだに、この場所で起こったことの説明はどれか。最も適するものを1つ選びなさい。","sel":["河口からの距離がしだいに遠くなって海が深くなり、その後、火山の噴火があった。","河口からの距離がしだいに近くなって海が浅くなり、その後、火山の噴火があった。","河口からの距離がしだいに遠くなって海が深くなり、その後、大きな洪水があった。","河口からの距離がしだいに近くなって海が浅くなり、その後、大きな洪水があった。"],"ans":[1],"kai":"粒の大きいものほど河口の近くに、小さいものほど沖の深いところに堆積する。下かられき、砂、泥の順に粒が小さくなっているので、海はしだいに深くなった。凝灰岩は火山灰が堆積してできるので、その後に火山の噴火があった。"}]},{"id":"kanagawa_r8-s12","src":"神奈川県 2026年 問4","kind":"sho","field":"地学","grade":2,"topic":"気圧と空気の体積","ctx":"<p class=\"lead\">山のふもとで買った、口が閉じられた菓子の袋を持って山に登った。山頂で見ると、袋はふもとにいたときよりも大きくふくらんでいた。山頂の気温は、ふもとの気温よりも低かった。<\/p>","qs":[{"k":"思","text":"袋がふくらんだことについての説明はどれか。最も適するものを1つ選びなさい。","sel":["山頂はふもとより気圧が低いので、袋の中の空気が膨張した。気温の変化だけを考えれば袋はしぼむはずなので、気圧の変化の影響の方が大きかった。","山頂はふもとより気圧が低いので、袋の中の空気が膨張した。気温の変化だけを考えても袋はふくらむはずなので、気圧と気温の変化がどちらも袋をふくらませた。","山頂はふもとより気圧が高いので、袋の中の空気が膨張した。気温の変化だけを考えれば袋はしぼむはずなので、気圧の変化の影響の方が大きかった。","山頂はふもとより気圧が高いので、袋の中の空気が収縮するはずである。それでも袋がふくらんだので、気温の変化の影響の方が大きかった。"],"ans":[1],"kai":"標高が高いほど上にある空気が少なく、気圧は低い。まわりの気圧が下がると袋の中の空気は膨張する。空気は冷やされると収縮するので、気温の変化だけなら袋はしぼむはずである。"}]},{"id":"kanagawa_r8tui-d1","src":"神奈川県 2026年（追検査） 問5","kind":"dai","field":"物理","grade":1,"topic":"凸レンズと像","ctx":"<p class=\"lead\">図のように、光学台の上に、Ｌ字形に発光ダイオードを並べた光源、凸レンズ、スクリーンを置いた。光源と凸レンズの距離を a、凸レンズとスクリーンの距離を b とし、a を決めてからスクリーンを動かして、はっきりした像が映るときの b を調べた。焦点距離の異なる2つの凸レンズＰ、Ｑについて調べた結果が表１、表２である。<\/p><figure><svg viewBox=\"0 0 480 190\"><g font-family='sans-serif' font-size='16' fill='#000'><rect x='0' y='0' width='480' height='190' fill='#fff'/><rect x='30' y='120' width='420' height='10' fill='#ddd' stroke='#000'/><rect x='80' y='62' width='22' height='58' fill='#fff' stroke='#000' stroke-width='2'/><ellipse cx='240' cy='78' rx='9' ry='40' fill='#eee' stroke='#000' stroke-width='2'/><line x1='400' y1='36' x2='400' y2='120' stroke='#000' stroke-width='4'/><text x='91' y='50' text-anchor='middle'>光源<\/text><text x='240' y='28' text-anchor='middle'>凸レンズ<\/text><text x='400' y='26' text-anchor='middle'>スクリーン<\/text><g stroke='#000' stroke-width='1.5'><line x1='91' y1='142' x2='91' y2='162'/><line x1='240' y1='142' x2='240' y2='162'/><line x1='400' y1='142' x2='400' y2='162'/><line x1='91' y1='152' x2='240' y2='152'/><line x1='240' y1='152' x2='400' y2='152'/><\/g><text x='165' y='176' text-anchor='middle'>a<\/text><text x='320' y='176' text-anchor='middle'>b<\/text><\/g><\/svg><figcaption>図　装置を横から見たようす<\/figcaption><\/figure><table><caption>表１　凸レンズＰ<\/caption><tr><th>a〔cm〕<\/th><td>18<\/td><td>24<\/td><td>36<\/td><\/tr><tr><th>b〔cm〕<\/th><td>36<\/td><td>24<\/td><td>18<\/td><\/tr><\/table><table><caption>表２　凸レンズＱ<\/caption><tr><th>a〔cm〕<\/th><td>12<\/td><td>16<\/td><td>24<\/td><\/tr><tr><th>b〔cm〕<\/th><td>24<\/td><td>16<\/td><td>12<\/td><\/tr><\/table>","qs":[{"k":"思","text":"表１から、凸レンズＰの焦点距離は何cmか。整数で答えなさい。","num":"12","unit":"cm","kai":"a と b が等しくなるのは、光源を焦点距離の2倍の位置に置いたときである。表１で a＝b＝24cm だから、焦点距離は 24÷2＝12cm である。"},{"k":"思","text":"凸レンズＰを使い、a を18cmにしてスクリーンに像を映した。スクリーンに映った像を光源の側から見たとき、凸レンズの側から光源を見たときと比べて、像の大きさと向きはどうなっているか。最も適するものを1つ選びなさい。","sel":["光源より大きく、上下・左右がともに逆向きである。","光源より大きく、上下だけが逆向きである。","光源より小さく、上下・左右がともに逆向きである。","光源より小さく、上下だけが逆向きである。"],"ans":[1],"kai":"a＝18cm は焦点距離（12cm）と、その2倍（24cm）の間なので、実像は光源より大きくなる。実像は上下も左右も逆向きにできる。"},{"k":"思","text":"凸レンズＱを使い、a を次の1つの値にしたところ、スクリーンをどこに動かしても像は映らなかった。スクリーンをはずして凸レンズを通して光源を見ると、光源より大きな像が見えた。このときの a はどれか。最も適するものを1つ選びなさい。","sel":["6cm","10cm","16cm","20cm"],"ans":[1],"fix":true,"kai":"表２で a＝b＝16cm だから、凸レンズＱの焦点距離は8cmである。光源が焦点より凸レンズに近いときだけ実像ができず、虚像が見えるので、8cmより短い6cmである。"},{"k":"思","text":"凸レンズＰ、Ｑのそれぞれで、b が24cmになるようにして像を映した。このときの2つを比べた文として最も適するものを1つ選びなさい。","sel":["凸レンズＱのほうが光源と凸レンズの距離が短く、像は大きい。","凸レンズＱのほうが光源と凸レンズの距離が短く、像は小さい。","凸レンズＰのほうが光源と凸レンズの距離が短く、像は大きい。","凸レンズＰのほうが光源と凸レンズの距離が短く、像は小さい。"],"ans":[1],"kai":"b＝24cm のとき、Ｐでは a＝24cm で像は光源と同じ大きさ、Ｑでは a＝12cm で光源が焦点距離の2倍より内側にあるので像は光源より大きい。"}]},{"id":"kanagawa_r8tui-d2","src":"神奈川県 2026年（追検査） 問6","kind":"dai","field":"化学","grade":2,"topic":"金属の酸化と質量","ctx":"<p class=\"lead\">質量32.50gのステンレス皿に銅の粉末1.20gをうすく広げ、ガスバーナーで一定時間加熱し、よく冷ましてから皿全体の質量をはかった。粉末をよくかき混ぜてから加熱して質量をはかる操作をくり返したところ、表のようになり、皿の上には黒色の酸化銅だけが残った。<\/p><table><caption>表　銅の粉末1.20gを加熱したときの結果<\/caption><tr><th>加熱の回数〔回〕<\/th><td>0<\/td><td>1<\/td><td>2<\/td><td>3<\/td><td>4<\/td><td>5<\/td><\/tr><tr><th>皿全体の質量〔g〕<\/th><td>33.70<\/td><td>33.85<\/td><td>33.94<\/td><td>33.99<\/td><td>34.00<\/td><td>34.00<\/td><\/tr><\/table><p class=\"lead\">次に、銅の粉末の質量を変えて、またマグネシウムの粉末でも同じ操作を行い、金属の質量と、質量が変化しなくなるまで加熱したあとにできた酸化物の質量の関係を図にまとめた。<\/p><figure><svg viewBox=\"0 0 460 330\"><g font-family='sans-serif' font-size='15' fill='#000'><rect x='0' y='0' width='460' height='330' fill='#fff'/><g stroke='#bbb' stroke-width='1'><line x1='130' y1='30' x2='130' y2='270'/><line x1='190' y1='30' x2='190' y2='270'/><line x1='250' y1='30' x2='250' y2='270'/><line x1='310' y1='30' x2='310' y2='270'/><line x1='370' y1='30' x2='370' y2='270'/><line x1='430' y1='30' x2='430' y2='270'/><line x1='70' y1='210' x2='430' y2='210'/><line x1='70' y1='150' x2='430' y2='150'/><line x1='70' y1='90' x2='430' y2='90'/><line x1='70' y1='30' x2='430' y2='30'/><\/g><g stroke='#000' stroke-width='1.5'><line x1='70' y1='30' x2='70' y2='270'/><line x1='70' y1='270' x2='430' y2='270'/><\/g><g stroke='#000' stroke-width='2'><line x1='70' y1='270' x2='430' y2='30'/><line x1='70' y1='270' x2='430' y2='90'/><\/g><circle cx='250' cy='150' r='4.5'/><circle cx='430' cy='30' r='4.5'/><circle cx='190' cy='210' r='4.5'/><circle cx='310' cy='150' r='4.5'/><circle cx='430' cy='90' r='4.5'/><g text-anchor='middle'><text x='70' y='290'>0<\/text><text x='130' y='290'>0.2<\/text><text x='190' y='290'>0.4<\/text><text x='250' y='290'>0.6<\/text><text x='310' y='290'>0.8<\/text><text x='370' y='290'>1.0<\/text><text x='430' y='290'>1.2<\/text><text x='250' y='318'>金属の質量〔g〕<\/text><\/g><g text-anchor='end'><text x='62' y='275'>0<\/text><text x='62' y='215'>0.5<\/text><text x='62' y='155'>1.0<\/text><text x='62' y='95'>1.5<\/text><text x='62' y='35'>2.0<\/text><\/g><text transform='translate(22,150) rotate(-90)' text-anchor='middle'>酸化物の質量〔g〕<\/text><text x='325' y='72' text-anchor='end'>マグネシウム<\/text><text x='385' y='148'>銅<\/text><\/g><\/svg><figcaption>図　金属の質量とできた酸化物の質量<\/figcaption><\/figure>","qs":[{"k":"知","text":"銅を空気中で加熱して酸化銅ができる化学変化を表した化学反応式はどれか。最も適するものを1つ選びなさい。","sel":["2Cu ＋ O<sub>2<\/sub> → 2CuO","Cu ＋ O → CuO","Cu ＋ O<sub>2<\/sub> → CuO<sub>2<\/sub>","Cu<sub>2<\/sub> ＋ O<sub>2<\/sub> → 2CuO"],"ans":[1],"kai":"銅は原子がそのまま集まった物質で Cu、酸素は分子で O<sub>2<\/sub>、酸化銅は CuO と表す。矢印の左右で原子の種類と数を合わせると 2Cu＋O<sub>2<\/sub>→2CuO となる。"},{"k":"思","text":"表で、2回目の加熱を終えたときまでに、銅と結びついた酸素の質量は何gか。小数第2位まで答えなさい。","num":"0.24","unit":"g","kai":"皿全体の質量がふえた分が、結びついた酸素の質量である。33.94－33.70＝0.24g である。"},{"k":"思","text":"図から、同じ質量の酸素と結びつくマグネシウムの質量と銅の質量の比（マグネシウム：銅）はどうなるか。最も簡単な整数の比で表したものとして最も適するものを1つ選びなさい。","sel":["3：8","3：4","8：3","2：1","4：3"],"ans":[1],"kai":"図より、マグネシウム0.6gは酸素0.4gと、銅0.8gは酸素0.2gと結びつく。酸素0.4gと結びつく銅は1.6gだから、0.6：1.6＝3：8 である。"},{"k":"思","text":"別の班が銅の粉末2.00gを1回だけ加熱し、よく冷ましてから皿の上の物質の質量をはかると2.30gであった。このとき、酸素と結びつかずに残っている銅は何gか。小数第2位まで答えなさい。","num":"0.80","unit":"g","kai":"結びついた酸素は 2.30－2.00＝0.30g である。銅と酸素は質量の比 4：1 で結びつくので、反応した銅は 0.30×4＝1.20g、残っている銅は 2.00－1.20＝0.80g である。"}]},{"id":"kanagawa_r8tui-d3","src":"神奈川県 2026年（追検査） 問7","kind":"dai","field":"生物","grade":3,"topic":"遺伝の規則性","ctx":"<p class=\"lead\">ある植物の花の色には赤色と白色があり、エンドウの種子の形と同じ規則性で遺伝する。花の色を赤色にする遺伝子をＡ、白色にする遺伝子をａとして、次の実験を行った。<\/p><p class=\"lead\">〔実験１〕赤色の花をさかせる純系の個体と、白色の花をさかせる純系の個体をかけ合わせたところ、できた種子（子）を育てた個体はすべて赤色の花をさかせた。<br>〔実験２〕実験１の子を自家受粉させ、できた種子（孫）をすべて育てて花の色を調べた。<br>〔実験３〕実験２の孫のうち、赤色の花をさかせた個体を1つ選んで個体Ｘとし、白色の花をさかせる個体とかけ合わせ、できた種子をすべて育てて花の色を調べた。<\/p><table><caption>表　実験２、実験３でできた個体の数<\/caption><tr><th><\/th><th>赤色の花<\/th><th>白色の花<\/th><\/tr><tr><th>実験２<\/th><td>603<\/td><td>199<\/td><\/tr><tr><th>実験３<\/th><td>52<\/td><td>49<\/td><\/tr><\/table>","qs":[{"k":"知","text":"この植物の体細胞1つにふくまれる染色体の数は18本である。精細胞1つ、受精卵1つにふくまれる染色体の数の組み合わせとして最も適するものを1つ選びなさい。","sel":["精細胞：9本　受精卵：18本","精細胞：9本　受精卵：9本","精細胞：18本　受精卵：18本","精細胞：18本　受精卵：36本"],"ans":[1],"kai":"生殖細胞は減数分裂でつくられるので、染色体の数は体細胞の半分の9本になる。精細胞と卵細胞が受精すると、受精卵は体細胞と同じ18本になる。"},{"k":"思","text":"実験２で赤色の花をさかせた603個体のうち、実験１の子と同じ遺伝子の組み合わせをもつ個体は、およそ何個体あると考えられるか。最も適するものを1つ選びなさい。","sel":["約150個体","約200個体","約300個体","約400個体"],"ans":[4],"fix":true,"kai":"子はＡａで、孫はＡＡ：Ａａ：ａａ＝1：2：1 の割合でできる。赤色の花の個体はＡＡとＡａが 1：2 だから、Ａａは 603×2/3 でおよそ400個体である。"},{"k":"思","text":"実験３の結果から、個体Ｘの遺伝子の組み合わせについていえることはどれか。最も適するものを1つ選びなさい。","sel":["ＡＡである。","Ａａである。","ａａである。","ＡＡとＡａのどちらであるかは、この結果からは決められない。"],"ans":[2],"kai":"白色の花の個体はａａで、ａだけを伝える。できた個体に白色の花（ａａ）があるので、個体Ｘはａをもち、赤色の花をさかせるからＡａである。Ａａとａａからは赤色：白色がおよそ 1：1 でできる。"},{"k":"思","text":"実験２の孫のうち、赤色の花をさかせた個体だけをすべて残し、それぞれを自家受粉させた。どの個体にも同じ数の種子ができ、すべて育つものとすると、できる個体の数の比（赤色の花：白色の花）はどうなるか。最も適するものを1つ選びなさい。","sel":["1：1","2：1","3：1","5：1","8：1"],"ans":[4],"fix":true,"kai":"赤色の花の個体はＡＡ：Ａａ＝1：2 である。1個体に種子が4個できるとすると、ＡＡからは赤色4、Ａａ2個体からは赤色6と白色2ができるので、赤色：白色＝10：2＝5：1 である。"}]},{"id":"kanagawa_r8tui-d4","src":"神奈川県 2026年（追検査） 問8","kind":"dai","field":"地学","grade":1,"topic":"地層の重なりと広がり","ctx":"<p class=\"lead\">図１は、ある地域の地点Ａ〜Ｄの位置を真上から見て示したもので、かっこ内は各地点の標高である。ＢはＡの真東、ＣはＡの真南、ＤはＢの真南にある。図２は、地点Ａ、Ｂ、Ｃで行ったボーリング調査の結果を柱状図で表したものである。泥岩の層からはアンモナイトの化石が見つかった。この地域の地層は、それぞれ同じ厚さで平行に重なり、ある一方向に一定の傾きで低くなっている。凝灰岩の層は1つしかなく、地層の上下の逆転や断層はない。<\/p><figure><svg viewBox=\"0 0 440 300\"><g font-family='sans-serif' font-size='16' fill='#000'><rect x='0' y='0' width='440' height='300' fill='#fff'/><g stroke='#777' stroke-width='1.5' stroke-dasharray='6 4'><line x1='100' y1='90' x2='260' y2='90'/><line x1='100' y1='230' x2='260' y2='230'/><line x1='100' y1='90' x2='100' y2='230'/><line x1='260' y1='90' x2='260' y2='230'/><\/g><circle cx='100' cy='90' r='5'/><circle cx='260' cy='90' r='5'/><circle cx='100' cy='230' r='5'/><circle cx='260' cy='230' r='5'/><g text-anchor='middle'><text x='100' y='72'>Ａ（80m）<\/text><text x='260' y='72'>Ｂ（90m）<\/text><text x='100' y='258'>Ｃ（85m）<\/text><text x='260' y='258'>Ｄ（75m）<\/text><text x='180' y='112'>200m<\/text><text x='380' y='40'>北<\/text><\/g><text x='92' y='166' text-anchor='end'>200m<\/text><line x1='380' y1='110' x2='380' y2='58' stroke='#000' stroke-width='2'/><polygon points='380,48 373,64 387,64'/><\/g><\/svg><figcaption>図１　地点Ａ〜Ｄの位置と標高<\/figcaption><\/figure><figure><svg viewBox=\"0 0 480 320\"><defs><pattern id='kt8m' width='8' height='6' patternUnits='userSpaceOnUse'><rect width='8' height='6' fill='#fff'/><line x1='0' y1='3' x2='8' y2='3' stroke='#333' stroke-width='1'/><\/pattern><pattern id='kt8s' width='6' height='6' patternUnits='userSpaceOnUse'><rect width='6' height='6' fill='#fff'/><circle cx='2' cy='2' r='0.9' fill='#333'/><circle cx='5' cy='5' r='0.9' fill='#333'/><\/pattern><pattern id='kt8r' width='16' height='16' patternUnits='userSpaceOnUse'><rect width='16' height='16' fill='#fff'/><circle cx='5' cy='5' r='3.2' fill='none' stroke='#333'/><circle cx='12' cy='12' r='2.2' fill='none' stroke='#333'/><\/pattern><\/defs><g font-family='sans-serif' font-size='16' fill='#000'><rect x='0' y='0' width='480' height='320' fill='#fff'/><g stroke='#000' stroke-width='1.2'><rect x='90' y='40' width='60' height='80' fill='url(#kt8s)'/><rect x='90' y='120' width='60' height='40' fill='#aaa'/><rect x='90' y='160' width='60' height='120' fill='url(#kt8r)'/><rect x='190' y='40' width='60' height='40' fill='url(#kt8m)'/><rect x='190' y='80' width='60' height='120' fill='url(#kt8s)'/><rect x='190' y='200' width='60' height='40' fill='#aaa'/><rect x='190' y='240' width='60' height='40' fill='url(#kt8r)'/><rect x='290' y='40' width='60' height='80' fill='url(#kt8m)'/><rect x='290' y='120' width='60' height='120' fill='url(#kt8s)'/><rect x='290' y='240' width='60' height='40' fill='#aaa'/><\/g><g stroke='#999' stroke-width='1' stroke-dasharray='3 3'><line x1='70' y1='80' x2='360' y2='80'/><line x1='70' y1='120' x2='360' y2='120'/><line x1='70' y1='160' x2='360' y2='160'/><line x1='70' y1='200' x2='360' y2='200'/><line x1='70' y1='240' x2='360' y2='240'/><\/g><g stroke='#000' stroke-width='1.5'><line x1='70' y1='40' x2='70' y2='280'/><line x1='64' y1='40' x2='70' y2='40'/><line x1='64' y1='120' x2='70' y2='120'/><line x1='64' y1='200' x2='70' y2='200'/><line x1='64' y1='280' x2='70' y2='280'/><\/g><g text-anchor='end'><text x='60' y='46'>0<\/text><text x='60' y='126'>10<\/text><text x='60' y='206'>20<\/text><text x='60' y='286'>30<\/text><\/g><text transform='translate(20,160) rotate(-90)' text-anchor='middle'>地表からの深さ〔m〕<\/text><g text-anchor='middle'><text x='120' y='28'>Ａ<\/text><text x='220' y='28'>Ｂ<\/text><text x='320' y='28'>Ｃ<\/text><\/g><g stroke='#000' stroke-width='1.2'><rect x='378' y='60' width='30' height='20' fill='url(#kt8m)'/><rect x='378' y='100' width='30' height='20' fill='url(#kt8s)'/><rect x='378' y='140' width='30' height='20' fill='#aaa'/><rect x='378' y='180' width='30' height='20' fill='url(#kt8r)'/><\/g><text x='414' y='76'>泥岩<\/text><text x='414' y='116'>砂岩<\/text><text x='414' y='156'>凝灰岩<\/text><text x='414' y='196'>れき岩<\/text><\/g><\/svg><figcaption>図２　地点Ａ、Ｂ、Ｃの柱状図<\/figcaption><\/figure>","qs":[{"k":"思","text":"図２の砂岩の層が堆積してから泥岩の層が堆積するまでの間に、この地域の海の深さはどのように変化したと考えられるか。最も適するものを1つ選びなさい。","sel":["堆積した粒が小さくなっているので、しだいに深くなった。","堆積した粒が小さくなっているので、しだいに浅くなった。","堆積した粒が大きくなっているので、しだいに深くなった。","堆積した粒が大きくなっているので、しだいに浅くなった。"],"ans":[1],"kai":"地層は下から上へ順に堆積するので、砂のあとに泥が堆積した。粒の小さい泥は河口から遠い深い海まで運ばれて堆積するので、海はしだいに深くなったと考えられる。"},{"k":"知","text":"泥岩の層が堆積した地質年代に栄えていた生物はどれか。最も適するものを1つ選びなさい。","sel":["サンヨウチュウ","フズリナ","恐竜","ビカリア","ナウマンゾウ"],"ans":[3],"kai":"アンモナイトは中生代の示準化石である。中生代には恐竜が栄えていた。サンヨウチュウとフズリナは古生代、ビカリアとナウマンゾウは新生代の生物である。"},{"k":"思","text":"図１と図２から、この地域の地層はどの方角に向かって低くなっていると考えられるか。最も適するものを1つ選びなさい。","sel":["東","西","南","北"],"ans":[3],"fix":true,"kai":"凝灰岩の層の上面の標高は、Ａが 80－10＝70m、Ｂが 90－20＝70m、Ｃが 85－25＝60m である。東西に並ぶＡとＢで同じで、南のＣで低いので、南に向かって低くなっている。"},{"k":"思","text":"地点Ｄでボーリング調査を行うと、地表から何mの深さで凝灰岩の層の上面に達すると考えられるか。整数で答えなさい。","num":"15","unit":"m","kai":"地層は東西には傾いていないので、Ｄの凝灰岩の層の上面の標高は真西のＣと同じ60mである。Ｄの標高は75mだから、75－60＝15m の深さである。"}]},{"id":"kanagawa_r8tui-s1","src":"神奈川県 2026年（追検査） 問1","kind":"sho","field":"物理","grade":2,"topic":"直列・並列回路と電力","ctx":"","qs":[{"k":"思","text":"抵抗の大きさが20Ωの抵抗器と30Ωの抵抗器を1個ずつ用意し、2個を直列につないだ回路Ａと、2個を並列につないだ回路Ｂをつくり、それぞれの回路全体に6.0Ｖの電圧を加えた。回路Ａ、回路Ｂのそれぞれで、2個の抵抗器が消費する電力の合計の組み合わせとして最も適するものを1つ選びなさい。","sel":["回路Ａ：0.72Ｗ　回路Ｂ：3.0Ｗ","回路Ａ：0.72Ｗ　回路Ｂ：1.8Ｗ","回路Ａ：3.0Ｗ　回路Ｂ：0.72Ｗ","回路Ａ：1.8Ｗ　回路Ｂ：3.0Ｗ"],"ans":[1],"kai":"回路Ａは全体の抵抗が50Ωで電流は0.12Ａ、電力は 6.0×0.12＝0.72Ｗ である。回路Ｂは各抵抗器に6.0Ｖが加わり、電流は0.30Ａと0.20Ａだから、電力の合計は 6.0×0.50＝3.0Ｗ である。"}]},{"id":"kanagawa_r8tui-s2","src":"神奈川県 2026年（追検査） 問1","kind":"sho","field":"物理","grade":2,"topic":"力と圧力","ctx":"","qs":[{"k":"思","text":"片側だけをけずってとがらせた鉛筆を水平にし、とがった先を右手の人さし指で、平らな端を左手の人さし指で両側から押して静止させた。このとき、鉛筆が指を押す力と圧力について述べた文として最も適するものを1つ選びなさい。ただし、鉛筆にはたらく重力は考えないものとする。","sel":["力の大きさは左右の指で等しく、圧力は右手の指のほうが大きい。","力の大きさは左右の指で等しく、圧力も左右の指で等しい。","力の大きさは右手の指のほうが大きく、圧力も右手の指のほうが大きい。","力の大きさは右手の指のほうが大きく、圧力は左右の指で等しい。"],"ans":[1],"kai":"鉛筆は静止しているので、左右の指が鉛筆を押す力はつり合っていて、鉛筆が左右の指を押し返す力の大きさも等しい。力が同じなら、力を受ける面積が小さいとがった先のほうが圧力は大きい。"}]},{"id":"kanagawa_r8tui-s3","src":"神奈川県 2026年（追検査） 問1","kind":"sho","field":"物理","grade":3,"topic":"記録タイマーと速さ","ctx":"<p class=\"lead\">斜面を下る台車の運動を、1秒間に50回打点する記録タイマーでテープに記録した。打点のはっきりした点を基準点として、テープを5打点ごとに切り、基準点に近いほうから順に区間１〜４とした。表は、それぞれのテープの長さである。<\/p><table><caption>表　テープの長さ<\/caption><tr><th>区間<\/th><td>１<\/td><td>２<\/td><td>３<\/td><td>４<\/td><\/tr><tr><th>テープの長さ〔cm〕<\/th><td>2.4<\/td><td>4.0<\/td><td>5.6<\/td><td>7.2<\/td><\/tr><\/table>","qs":[{"k":"思","text":"区間３での台車の平均の速さは何cm/sか。整数で答えなさい。","num":"56","unit":"cm/s","kai":"1秒間に50回打点するので、5打点にかかる時間は0.1秒である。区間３では0.1秒間に5.6cm進んだから、5.6÷0.1＝56cm/s である。"}]},{"id":"kanagawa_r8tui-s4","src":"神奈川県 2026年（追検査） 問2","kind":"sho","field":"化学","grade":1,"topic":"気体の性質と集め方","ctx":"","qs":[{"k":"知","text":"気体の性質や発生方法、集め方について述べた文として正しいものを、次の中からすべて選びなさい。","sel":["アンモニアは水に非常に溶けやすく、空気より密度が小さいので、上方置換法で集める。","二酸化炭素は、亜鉛にうすい塩酸を加えると発生する。","酸素にはものを燃やすはたらきがあるが、酸素そのものは燃えない。","水素は空気より密度が大きいので、下方置換法で集める。","二酸化炭素が水に溶けた水溶液は、アルカリ性を示す。"],"ans":[1,3],"multi":true,"kai":"亜鉛にうすい塩酸を加えて発生するのは水素である。水素は最も密度が小さい気体で、水に溶けにくいので水上置換法で集める。二酸化炭素の水溶液は酸性を示す。"}]},{"id":"kanagawa_r8tui-s5","src":"神奈川県 2026年（追検査） 問2","kind":"sho","field":"化学","grade":3,"topic":"アルカリとイオンの移動","ctx":"","qs":[{"k":"思","text":"硫酸ナトリウム水溶液でしめらせたろ紙をガラス板にのせ、その上に赤色リトマス紙と青色リトマス紙を並べて置いた。2枚のリトマス紙の中央に、うすい水酸化ナトリウム水溶液をしみこませた糸を置き、ろ紙の両端をクリップではさんで電圧を加えた。このときのリトマス紙の変化と、その原因について述べた文として最も適するものを1つ選びなさい。","sel":["赤色リトマス紙の青色に変わった部分が陽極側に広がった。これは水酸化物イオンが移動したためである。","赤色リトマス紙の青色に変わった部分が陰極側に広がった。これはナトリウムイオンが移動したためである。","青色リトマス紙の赤色に変わった部分が陽極側に広がった。これは水酸化物イオンが移動したためである。","青色リトマス紙の赤色に変わった部分が陰極側に広がった。これはナトリウムイオンが移動したためである。"],"ans":[1],"kai":"アルカリ性を示すもとになるのは水酸化物イオンで、赤色リトマス紙を青色に変える。水酸化物イオンは－の電気を帯びた陰イオンなので、陽極側に移動する。"}]},{"id":"kanagawa_r8tui-s6","src":"神奈川県 2026年（追検査） 問2","kind":"sho","field":"化学","grade":2,"topic":"反応する物質の質量の割合","ctx":"<p class=\"lead\">5個のビーカーにうすい塩酸を20cm<sup>3<\/sup>ずつ入れ、それぞれに質量の異なる石灰石を加えて、発生した二酸化炭素の質量を調べたところ、表のようになった。<\/p><table><caption>表　加えた石灰石と発生した二酸化炭素の質量<\/caption><tr><th>加えた石灰石の質量〔g〕<\/th><td>0.50<\/td><td>1.00<\/td><td>1.50<\/td><td>2.00<\/td><td>2.50<\/td><\/tr><tr><th>発生した二酸化炭素の質量〔g〕<\/th><td>0.22<\/td><td>0.44<\/td><td>0.66<\/td><td>0.66<\/td><td>0.66<\/td><\/tr><\/table>","qs":[{"k":"思","text":"同じ濃度のうすい塩酸40cm<sup>3<\/sup>に石灰石2.50gを加えたとき、発生する二酸化炭素の質量は何gと考えられるか。最も適するものを1つ選びなさい。","sel":["0.66g","0.88g","1.10g","1.32g"],"ans":[3],"fix":true,"kai":"表より、うすい塩酸20cm<sup>3<\/sup>と過不足なく反応する石灰石は1.50gだから、40cm<sup>3<\/sup>では3.00gまで反応できる。石灰石2.50gはすべて反応するので、0.22×5＝1.10g である。"}]},{"id":"kanagawa_r8tui-s7","src":"神奈川県 2026年（追検査） 問3","kind":"sho","field":"生物","grade":2,"topic":"血液の循環","ctx":"","qs":[{"k":"知","text":"ヒトの血管や血液について述べた文として最も適するものを1つ選びなさい。","sel":["肺動脈には、二酸化炭素を多くふくむ血液が流れている。","心臓の左心室から出た血液は、まず肺に送られる。","動脈は静脈より壁がうすく、ところどころに逆流を防ぐ弁がある。","血液中で酸素を運ぶはたらきをしているのは、血しょうである。"],"ans":[1],"kai":"肺動脈は、全身から心臓にもどった血液を右心室から肺へ送る血管なので、二酸化炭素を多くふくむ血液が流れる。左心室からは全身へ送られ、弁があるのは壁のうすい静脈、酸素を運ぶのは赤血球である。"}]},{"id":"kanagawa_r8tui-s8","src":"神奈川県 2026年（追検査） 問3","kind":"sho","field":"生物","grade":2,"topic":"刺激と反応","ctx":"","qs":[{"k":"知","text":"次の反応のうち、反射であるものをすべて選びなさい。","sel":["熱いものにふれて、思わず手を引っこめた。","信号が青に変わったのを見て、横断歩道をわたり始めた。","暗い部屋から明るい屋外に出ると、ひとみが小さくなった。","後ろから名前を呼ばれたので、ふり向いた。","食べ物を口に入れると、だ液が出てきた。"],"ans":[1,3,5],"multi":true,"kai":"反射は、刺激に対して意識と関係なく起こる反応である。信号を見て歩き出す反応や、呼ばれてふり向く反応は、脳で判断してから命令を出す意識して起こす反応である。"}]},{"id":"kanagawa_r8tui-s9","src":"神奈川県 2026年（追検査） 問3","kind":"sho","field":"生物","grade":3,"topic":"生物の進化と相同器官","ctx":"","qs":[{"k":"知","text":"相同器官について述べた文として最も適するものを1つ選びなさい。","sel":["ヒトのうでとクジラの胸びれは、はたらきは異なるが骨格の基本的なつくりが同じで、相同器官である。","ハトの翼とチョウのはねは、どちらも空を飛ぶための器官なので、相同器官である。","相同器官は、同じ環境で生活している生物どうしにだけ見られる。","相同器官とは、もとは別の器官であったものが、同じはたらきをするようになったものをいう。"],"ans":[1],"kai":"相同器官は、現在の形やはたらきは異なっていても、もとは同じ器官であったと考えられるものである。セキツイ動物の前あしにあたる器官がその例で、共通の祖先から進化した証拠の1つとされる。"}]},{"id":"kanagawa_r8tui-s10","src":"神奈川県 2026年（追検査） 問4","kind":"sho","field":"地学","grade":2,"topic":"台風と日本の天気","ctx":"","qs":[{"k":"知","text":"台風について述べた文として最も適するものを1つ選びなさい。","sel":["前線をともなわず、地上では中心に向かって反時計回りに風がふきこむ。","温帯低気圧が、日本の南の海上で発達したものである。","シベリア高気圧のふちに沿って北上することが多い。","日本付近で進路を東寄りに変えることが多いのは、季節風に流されるためである。"],"ans":[1],"kai":"台風は熱帯低気圧が発達したもので、前線をともなわない。低気圧なので、北半球の地上では反時計回りに風がふきこむ。太平洋高気圧のふちに沿って北上し、偏西風に流されて東寄りに進む。"}]},{"id":"kanagawa_r8tui-s11","src":"神奈川県 2026年（追検査） 問4","kind":"sho","field":"地学","grade":2,"topic":"露点と湿度","ctx":"<p class=\"lead\">気温26℃の理科室で、くみ置きの水を入れた金属製のコップに氷水を少しずつ加えてかき混ぜ、水温を下げていったところ、水温が18℃になったときにコップの表面がくもり始めた。表は、気温と飽和水蒸気量の関係を示したものである。<\/p><table><caption>表　気温と飽和水蒸気量<\/caption><tr><th>気温〔℃〕<\/th><td>16<\/td><td>18<\/td><td>20<\/td><td>22<\/td><td>24<\/td><td>26<\/td><\/tr><tr><th>飽和水蒸気量〔g/m<sup>3<\/sup>〕<\/th><td>13.6<\/td><td>15.4<\/td><td>17.3<\/td><td>19.4<\/td><td>21.8<\/td><td>24.4<\/td><\/tr><\/table>","qs":[{"k":"思","text":"このときの理科室の空気の湿度は何％か。小数第1位を四捨五入して、整数で答えなさい。","num":"63","unit":"％","kai":"露点が18℃だから、空気1m<sup>3<\/sup>中の水蒸気量は15.4gである。26℃の飽和水蒸気量は24.4g/m<sup>3<\/sup>なので、15.4÷24.4×100＝63.1…で、63％である。"}]},{"id":"kanagawa_r8tui-s12","src":"神奈川県 2026年（追検査） 問4","kind":"sho","field":"地学","grade":3,"topic":"金星の見え方","ctx":"<p class=\"lead\">図は、太陽、金星、地球の位置関係を、地球の北極側から見て模式的に表したものである。内側の円は金星の公転軌道、外側の円は地球の公転軌道で、Ｐ〜Ｓは金星の位置を示している。<\/p><figure><svg viewBox=\"0 0 500 360\"><g font-family='sans-serif' font-size='16' fill='#000'><rect x='0' y='0' width='500' height='360' fill='#fff'/><circle cx='250' cy='170' r='100' fill='none' stroke='#555' stroke-width='1.5'/><circle cx='250' cy='170' r='140' fill='none' stroke='#555' stroke-width='1.5'/><circle cx='250' cy='170' r='12'/><text x='250' y='148' text-anchor='middle'>太陽<\/text><g fill='#fff' stroke='#000' stroke-width='1.5'><circle cx='193' cy='252' r='7'/><circle cx='168' cy='113' r='7'/><circle cx='307' cy='252' r='7'/><circle cx='332' cy='113' r='7'/><circle cx='250' cy='310' r='9'/><\/g><g text-anchor='middle'><text x='170' y='272'>Ｐ<\/text><text x='148' y='108'>Ｑ<\/text><text x='330' y='272'>Ｒ<\/text><text x='352' y='108'>Ｓ<\/text><text x='250' y='350'>地球<\/text><\/g><path d='M 273 316 A 24 24 0 0 0 229 298' fill='none' stroke='#000' stroke-width='1.5'/><polygon points='225,305 237,297 226,290'/><text x='300' y='318'>地球の自転の向き<\/text><\/g><\/svg><figcaption>図　太陽・金星・地球の位置関係<\/figcaption><\/figure>","qs":[{"k":"思","text":"日本で、夕方の西の空に、細く欠けた形で大きく見える金星は、図のＰ〜Ｓのどの位置にあるときか。最も適するものを1つ選びなさい。","sel":["Ｐ","Ｑ","Ｒ","Ｓ"],"ans":[1],"fix":true,"kai":"地球の自転の向きから、夕方に見えるのは太陽の左側にあるＰとＱである。そのうち地球に近いＰは、太陽に照らされた面があまり地球を向かないので細く欠け、近いので大きく見える。"}]},{"id":"kanagawa_r7tui-d1","src":"神奈川県 2025年（追検査） 問5","kind":"dai","field":"物理","grade":2,"topic":"スイッチと並列につないだ電熱線","ctx":"<p class=\"lead\">抵抗の大きさがわからない電熱線a，bと電源装置，電流計，スイッチを用いて，図のような回路をつくった。電源装置の電圧を6.0Vにして，スイッチを切ったときと入れたときのそれぞれについて，電流計の示す値と，電熱線a，bそれぞれの両端に加わる電圧を調べた。表は，その結果をまとめたものである。ただし，電流計，導線，スイッチの抵抗は考えないものとし，電圧をはかるための電圧計は図に示していない。<\/p><figure><svg viewBox=\"0 0 480 260\"><rect x=\"0\" y=\"0\" width=\"480\" height=\"260\" fill=\"#fff\"/><g stroke=\"#111\" stroke-width=\"2\" fill=\"none\"><line x1=\"40\" y1=\"60\" x2=\"228\" y2=\"60\"/><line x1=\"242\" y1=\"60\" x2=\"440\" y2=\"60\"/><line x1=\"228\" y1=\"42\" x2=\"228\" y2=\"78\"/><line x1=\"242\" y1=\"51\" x2=\"242\" y2=\"69\" stroke-width=\"4\"/><line x1=\"40\" y1=\"60\" x2=\"40\" y2=\"160\"/><line x1=\"440\" y1=\"60\" x2=\"440\" y2=\"160\"/><line x1=\"40\" y1=\"160\" x2=\"82\" y2=\"160\"/><circle cx=\"100\" cy=\"160\" r=\"18\" fill=\"#fff\"/><line x1=\"118\" y1=\"160\" x2=\"170\" y2=\"160\"/><rect x=\"170\" y=\"150\" width=\"70\" height=\"20\" fill=\"#fff\"/><line x1=\"240\" y1=\"160\" x2=\"310\" y2=\"160\"/><rect x=\"310\" y=\"150\" width=\"70\" height=\"20\" fill=\"#fff\"/><line x1=\"380\" y1=\"160\" x2=\"440\" y2=\"160\"/><polyline points=\"285,160 285,220 325,220\"/><line x1=\"325\" y1=\"220\" x2=\"362\" y2=\"203\"/><polyline points=\"368,220 405,220 405,160\"/><\/g><circle cx=\"285\" cy=\"160\" r=\"4\" fill=\"#111\"/><circle cx=\"405\" cy=\"160\" r=\"4\" fill=\"#111\"/><circle cx=\"325\" cy=\"220\" r=\"3\" fill=\"#111\"/><circle cx=\"368\" cy=\"220\" r=\"3\" fill=\"#111\"/><text x=\"100\" y=\"166\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#111\" >A<\/text><text x=\"235\" y=\"28\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#111\" >電源装置<\/text><text x=\"100\" y=\"132\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#111\" >電流計<\/text><text x=\"205\" y=\"138\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#111\" >電熱線a<\/text><text x=\"345\" y=\"138\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#111\" >電熱線b<\/text><text x=\"346\" y=\"248\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#111\" >スイッチ<\/text><\/svg><figcaption>図　回路のようす<\/figcaption><\/figure><table><caption>表　結果<\/caption><tr><th><\/th><th>電流計の値〔mA〕<\/th><th>電熱線aの電圧〔V〕<\/th><th>電熱線bの電圧〔V〕<\/th><\/tr><tr><th>スイッチを切ったとき<\/th><td>150<\/td><td>1.5<\/td><td>4.5<\/td><\/tr><tr><th>スイッチを入れたとき<\/th><td>（ X ）<\/td><td>6.0<\/td><td>0<\/td><\/tr><\/table>","qs":[{"k":"知","text":"表のスイッチを切ったときの結果から，電熱線bの抵抗は何Ωか。整数で答えなさい。","num":"30","unit":"Ω","kai":"スイッチを切ると電熱線aとbは直列になり，bには0.15Aの電流が流れて4.5Vの電圧が加わる。よって抵抗は4.5V÷0.15A＝30Ωである。"},{"k":"思","text":"スイッチを入れたとき，電熱線bの両端に加わる電圧が0Vになったのはなぜか。最も適するものを1つ選びなさい。","sel":["電流が，抵抗のないスイッチのある導線を流れ，電熱線bを流れなくなるから。","スイッチを入れると，電熱線bの抵抗が大きくなるから。","電熱線aが電流をすべて使ってしまい，電熱線bまで電流がとどかなくなるから。","電源装置の電圧が，すべてスイッチに加わるようになるから。"],"ans":[1],"kai":"スイッチを入れると，電熱線bと並列に抵抗のない道すじができる。電流はこの道すじを流れて電熱線bには流れないので，bに加わる電圧は0Vになる。"},{"k":"思","text":"表の（ X ）にあてはまる値は何mAか。整数で答えなさい。","num":"600","unit":"mA","kai":"電熱線aの抵抗は1.5V÷0.15A＝10Ωである。スイッチを入れるとaに6.0Vが加わるので，電流は6.0V÷10Ω＝0.60A＝600mAである。"},{"k":"思","text":"電熱線aが消費する電力は，スイッチを入れたときには，スイッチを切ったときの何倍になるか。整数で答えなさい。","num":"16","unit":"倍","kai":"スイッチを切ったときは1.5V×0.15A＝0.225W，入れたときは6.0V×0.60A＝3.6Wである。3.6÷0.225＝16倍である。"}]},{"id":"kanagawa_r7tui-d2","src":"神奈川県 2025年（追検査） 問6","kind":"dai","field":"化学","grade":3,"topic":"中和と金属の反応","ctx":"<p class=\"lead\">6個のビーカーA～Fに，同じ濃度のうすい塩酸を20cm<sup>3<\/sup>ずつ入れ，同じ濃度の水酸化ナトリウム水溶液を，Aには加えず，Bに4cm<sup>3<\/sup>，Cに8cm<sup>3<\/sup>，Dに12cm<sup>3<\/sup>，Eに16cm<sup>3<\/sup>，Fに20cm<sup>3<\/sup>加えてよくかき混ぜた。次に，それぞれのビーカーに十分な量の亜鉛の粒を入れ，気体が発生しなくなるまでに発生した水素の体積をはかった。図は，その結果をまとめたものである。亜鉛の粒は，どのビーカーでも反応が終わったあとに残っていた。ただし，水酸化ナトリウム水溶液と亜鉛は反応しないものとする。<\/p><p class=\"lead\">塩酸と亜鉛の反応は，Zn ＋ 2HCl → ZnCl<sub>2<\/sub> ＋ H<sub>2<\/sub> と表され，生じた塩化亜鉛ZnCl<sub>2<\/sub>は，水溶液中で亜鉛イオンZn<sup>2+<\/sup>と塩化物イオンCl<sup>－<\/sup>に電離している。<\/p><figure><svg viewBox=\"0 0 480 330\"><rect x=\"0\" y=\"0\" width=\"480\" height=\"330\" fill=\"#fff\"/><g stroke=\"#bbb\" stroke-width=\"1\"><line x1=\"95\" y1=\"30\" x2=\"95\" y2=\"250\"/><line x1=\"130\" y1=\"30\" x2=\"130\" y2=\"250\"/><line x1=\"165\" y1=\"30\" x2=\"165\" y2=\"250\"/><line x1=\"200\" y1=\"30\" x2=\"200\" y2=\"250\"/><line x1=\"235\" y1=\"30\" x2=\"235\" y2=\"250\"/><line x1=\"270\" y1=\"30\" x2=\"270\" y2=\"250\"/><line x1=\"305\" y1=\"30\" x2=\"305\" y2=\"250\"/><line x1=\"340\" y1=\"30\" x2=\"340\" y2=\"250\"/><line x1=\"375\" y1=\"30\" x2=\"375\" y2=\"250\"/><line x1=\"410\" y1=\"30\" x2=\"410\" y2=\"250\"/><line x1=\"445\" y1=\"30\" x2=\"445\" y2=\"250\"/><line x1=\"95\" y1=\"30\" x2=\"445\" y2=\"30\"/><line x1=\"95\" y1=\"57.5\" x2=\"445\" y2=\"57.5\"/><line x1=\"95\" y1=\"85\" x2=\"445\" y2=\"85\"/><line x1=\"95\" y1=\"112.5\" x2=\"445\" y2=\"112.5\"/><line x1=\"95\" y1=\"140\" x2=\"445\" y2=\"140\"/><line x1=\"95\" y1=\"167.5\" x2=\"445\" y2=\"167.5\"/><line x1=\"95\" y1=\"195\" x2=\"445\" y2=\"195\"/><line x1=\"95\" y1=\"222.5\" x2=\"445\" y2=\"222.5\"/><line x1=\"95\" y1=\"250\" x2=\"445\" y2=\"250\"/><\/g><g stroke=\"#111\" stroke-width=\"2\"><line x1=\"95\" y1=\"30\" x2=\"95\" y2=\"250\"/><line x1=\"95\" y1=\"250\" x2=\"445\" y2=\"250\"/><\/g><text x=\"95\" y=\"270\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#111\" >0<\/text><text x=\"165\" y=\"270\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#111\" >4<\/text><text x=\"235\" y=\"270\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#111\" >8<\/text><text x=\"305\" y=\"270\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#111\" >12<\/text><text x=\"375\" y=\"270\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#111\" >16<\/text><text x=\"445\" y=\"270\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#111\" >20<\/text><text x=\"87\" y=\"256\" text-anchor=\"end\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#111\" >0<\/text><text x=\"87\" y=\"201\" text-anchor=\"end\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#111\" >60<\/text><text x=\"87\" y=\"146\" text-anchor=\"end\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#111\" >120<\/text><text x=\"87\" y=\"91\" text-anchor=\"end\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#111\" >180<\/text><text x=\"87\" y=\"36\" text-anchor=\"end\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#111\" >240<\/text><circle cx=\"95\" cy=\"30\" r=\"5\" fill=\"#111\"/><text x=\"104\" y=\"21\" text-anchor=\"start\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#111\" >A<\/text><circle cx=\"165\" cy=\"85\" r=\"5\" fill=\"#111\"/><text x=\"174\" y=\"76\" text-anchor=\"start\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#111\" >B<\/text><circle cx=\"235\" cy=\"140\" r=\"5\" fill=\"#111\"/><text x=\"244\" y=\"131\" text-anchor=\"start\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#111\" >C<\/text><circle cx=\"305\" cy=\"195\" r=\"5\" fill=\"#111\"/><text x=\"314\" y=\"186\" text-anchor=\"start\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#111\" >D<\/text><circle cx=\"375\" cy=\"250\" r=\"5\" fill=\"#111\"/><text x=\"384\" y=\"241\" text-anchor=\"start\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#111\" >E<\/text><circle cx=\"445\" cy=\"250\" r=\"5\" fill=\"#111\"/><text x=\"454\" y=\"241\" text-anchor=\"start\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#111\" >F<\/text><text x=\"270\" y=\"305\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#111\" >加えた水酸化ナトリウム水溶液の体積〔cm³〕<\/text><text x=\"28\" y=\"140\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#111\" transform=\"rotate(-90 28 140)\">発生した水素の体積〔cm³〕<\/text><\/svg><figcaption>図　加えた水酸化ナトリウム水溶液の体積と発生した水素の体積<\/figcaption><\/figure>","qs":[{"k":"知","text":"亜鉛の粒を入れる前のビーカーBとビーカーFの水溶液に，それぞれBTB溶液を加えたとすると，水溶液は何色になるか。最も適するものを1つ選びなさい。","sel":["Bは黄色，Fは青色","Bは黄色，Fは緑色","Bは緑色，Fは青色","Bは青色，Fは黄色"],"ans":[1],"kai":"水素が発生しなくなるEでちょうど中性になっている。Bは塩酸が残っていて酸性なので黄色，Fは水酸化ナトリウム水溶液が余ってアルカリ性なので青色になる。"},{"k":"思","text":"亜鉛の粒を入れる前のビーカーFの水溶液を中性にするには，実験で用いたものと同じうすい塩酸を，あと何cm<sup>3<\/sup>加えればよいか。整数で答えなさい。","num":"5","unit":"cm³","kai":"塩酸20cm<sup>3<\/sup>は水酸化ナトリウム水溶液16cm<sup>3<\/sup>とちょうど中和する。Fでは水酸化ナトリウム水溶液が4cm<sup>3<\/sup>余っているので，必要な塩酸は20×4÷16＝5cm<sup>3<\/sup>である。"},{"k":"思","text":"実験で用いたものと同じうすい塩酸30cm<sup>3<\/sup>に，同じ水酸化ナトリウム水溶液12cm<sup>3<\/sup>を加えてよくかき混ぜ，十分な量の亜鉛の粒を入れた。このとき発生する水素の体積は何cm<sup>3<\/sup>か。整数で答えなさい。","num":"180","unit":"cm³","kai":"水酸化ナトリウム水溶液12cm<sup>3<\/sup>と中和する塩酸は20×12÷16＝15cm<sup>3<\/sup>なので，塩酸は15cm<sup>3<\/sup>残る。塩酸20cm<sup>3<\/sup>から水素が240cm<sup>3<\/sup>発生するので，240×15÷20＝180cm<sup>3<\/sup>である。"},{"k":"思","text":"気体の発生が終わったあとのビーカーCの水溶液中にあるイオンの数について述べたものはどれか。最も適するものを1つ選びなさい。","sel":["最も多いのは塩化物イオンで，ナトリウムイオンの数は亜鉛イオンの数の2倍である。","最も多いのは塩化物イオンで，ナトリウムイオンの数は亜鉛イオンの数と等しい。","最も多いのは塩化物イオンで，ナトリウムイオンの数は亜鉛イオンの数の半分である。","最も多いのはナトリウムイオンで，塩化物イオンの数は亜鉛イオンの数の2倍である。"],"ans":[1],"kai":"塩酸20cm<sup>3<\/sup>中の水素イオンと塩化物イオンを2n個ずつとすると，Cに加えたナトリウムイオンはn個で，中和後に水素イオンがn個残る。この水素イオン2個につき亜鉛イオンが1個できるので，塩化物イオン2n個，ナトリウムイオンn個，亜鉛イオン0.5n個となる。"}]},{"id":"kanagawa_r7tui-d3","src":"神奈川県 2025年（追検査） 問7","kind":"dai","field":"生物","grade":2,"topic":"蒸散と水の通り道","ctx":"<p class=\"lead\">〔実験1〕葉の枚数や大きさ，茎の太さがほぼ同じトマトの枝A～Dを用意し，表のように処理した。水を入れた4本の試験管に枝を1本ずつさし，水面に少量の油を注いでから，それぞれ全体の質量をはかった。明るく風通しのよい場所に3時間置いたあと，再び全体の質量をはかり，質量の減少量を求めた。ワセリンは気孔をふさぐためにぬったものであり，質量の減少量は，枝の蒸散量と等しいものとする。<\/p><table><caption>表　枝の処理と質量の減少量<\/caption><tr><th>枝<\/th><th>処理<\/th><th>質量の減少量〔g〕<\/th><\/tr><tr><td>A<\/td><td>すべての葉の表側にワセリンをぬる<\/td><td>5.7<\/td><\/tr><tr><td>B<\/td><td>すべての葉の裏側にワセリンをぬる<\/td><td>1.5<\/td><\/tr><tr><td>C<\/td><td>すべての葉の表側と裏側にワセリンをぬる<\/td><td>0.3<\/td><\/tr><tr><td>D<\/td><td>ワセリンをぬらない<\/td><td>（ X ）<\/td><\/tr><\/table><p class=\"lead\">〔実験2〕別のトマトの枝を，赤インクをとかした水にさして数時間置いたあと，茎をうすく輪切りにして顕微鏡で観察したところ，一部が赤く染まっていた。図は，このときの茎の横断面を模式的に示したものである。<\/p><figure><svg viewBox=\"0 0 400 270\"><rect x=\"0\" y=\"0\" width=\"400\" height=\"270\" fill=\"#fff\"/><circle cx=\"170\" cy=\"135\" r=\"110\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"232.0\" cy=\"135.0\" r=\"10\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.5\"/><circle cx=\"252.0\" cy=\"135.0\" r=\"10\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.5\"/><circle cx=\"213.8\" cy=\"178.8\" r=\"10\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.5\"/><circle cx=\"228.0\" cy=\"193.0\" r=\"10\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.5\"/><circle cx=\"170.0\" cy=\"197.0\" r=\"10\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.5\"/><circle cx=\"170.0\" cy=\"217.0\" r=\"10\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.5\"/><circle cx=\"126.2\" cy=\"178.8\" r=\"10\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.5\"/><circle cx=\"112.0\" cy=\"193.0\" r=\"10\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.5\"/><circle cx=\"108.0\" cy=\"135.0\" r=\"10\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.5\"/><circle cx=\"88.0\" cy=\"135.0\" r=\"10\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.5\"/><circle cx=\"126.2\" cy=\"91.2\" r=\"10\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.5\"/><circle cx=\"112.0\" cy=\"77.0\" r=\"10\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.5\"/><circle cx=\"170.0\" cy=\"73.0\" r=\"10\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.5\"/><circle cx=\"170.0\" cy=\"53.0\" r=\"10\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.5\"/><circle cx=\"213.8\" cy=\"91.2\" r=\"10\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.5\"/><circle cx=\"228.0\" cy=\"77.0\" r=\"10\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.5\"/><line x1=\"236\" y1=\"128\" x2=\"322\" y2=\"50\" stroke=\"#111\" stroke-width=\"1.5\"/><text x=\"334\" y=\"48\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#111\" >P<\/text><line x1=\"234\" y1=\"197\" x2=\"322\" y2=\"226\" stroke=\"#111\" stroke-width=\"1.5\"/><text x=\"334\" y=\"233\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#111\" >Q<\/text><\/svg><figcaption>図　茎の横断面<\/figcaption><\/figure>","qs":[{"k":"知","text":"〔実験1〕で，試験管の水面に油を注いだのはなぜか。最も適するものを1つ選びなさい。","sel":["水面から水が蒸発するのを防ぐため。","枝が水を吸い上げやすくするため。","試験管の水の温度が上がるのを防ぐため。","水に空気中の二酸化炭素がとけるのを防ぐため。"],"ans":[1],"kai":"水面から水が蒸発すると，その分も質量が減ってしまう。油で水面をおおうと，質量の減少量を枝の蒸散量とみなせる。"},{"k":"思","text":"表の（ X ）にあてはまる値は何gか。小数第1位まで答えなさい。","num":"6.9","unit":"g","kai":"葉の表側からの蒸散量はB－C＝1.2g，裏側からはA－C＝5.4g，葉以外からは0.3gである。Dはこれらの和で，1.2＋5.4＋0.3＝6.9gである。"},{"k":"思","text":"〔実験1〕の結果から，葉の裏側からの蒸散量は，葉の表側からの蒸散量の何倍か。小数第1位まで答えなさい。","num":"4.5","unit":"倍","kai":"葉の裏側からの蒸散量は5.7－0.3＝5.4g，表側からの蒸散量は1.5－0.3＝1.2gである。5.4÷1.2＝4.5倍である。"},{"k":"知","text":"〔実験2〕で赤く染まっていた部分は，図のP，Qのどちらか。また，その部分にある管を何というか。最も適するものを1つ選びなさい。","sel":["Pで，道管という。","Pで，師管という。","Qで，道管という。","Qで，師管という。"],"ans":[1],"kai":"根から吸収した水は道管を通る。茎の維管束では，道管は中心に近い側，師管は外側にある。"}]},{"id":"kanagawa_r7tui-d4","src":"神奈川県 2025年（追検査） 問8","kind":"dai","field":"地学","grade":2,"topic":"山をこえる空気の温度と湿度","ctx":"<p class=\"lead\">しめった空気が山をこえてふき下りると，風下側のふもとの気温が高くなることがある。このしくみを，図のようなモデルで考えた。標高0mの地点Pにある気温28℃の空気が，山の斜面に沿って上昇し，標高1200mの地点Qで雲ができ始めた。地点Qから標高2200mの山頂Rまでは雲ができて雨が降り，山頂Rをこえると雲は消え，空気は標高0mの地点Sまで下降した。<\/p><p class=\"lead\">空気の温度は，雲ができていないときは，100m上昇するごとに1.0℃下がり，100m下降するごとに1.0℃上がる。雲ができているときは，空気は水蒸気で飽和していて，100m上昇するごとに0.5℃下がる。表は，気温と飽和水蒸気量の関係の一部である。ただし，空気1m<sup>3<\/sup>にふくまれる水蒸気の質量は，空気の上昇や下降にともなう体積の変化によっては変わらないものとする。<\/p><figure><svg viewBox=\"0 0 500 250\"><defs><marker id=\"ar\" markerWidth=\"10\" markerHeight=\"10\" refX=\"8\" refY=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"#111\"/><\/marker><\/defs><rect x=\"0\" y=\"0\" width=\"500\" height=\"250\" fill=\"#fff\"/><line x1=\"30\" y1=\"200\" x2=\"470\" y2=\"200\" stroke=\"#888\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"/><path d=\"M80 200 C 170 200 200 60 250 60 C 300 60 330 200 420 200\" fill=\"none\" stroke=\"#111\" stroke-width=\"2\"/><ellipse cx=\"178\" cy=\"108\" rx=\"22\" ry=\"11\" fill=\"#ccc\" stroke=\"#888\" stroke-width=\"1\"/><ellipse cx=\"196\" cy=\"84\" rx=\"22\" ry=\"11\" fill=\"#ccc\" stroke=\"#888\" stroke-width=\"1\"/><ellipse cx=\"218\" cy=\"62\" rx=\"22\" ry=\"11\" fill=\"#ccc\" stroke=\"#888\" stroke-width=\"1\"/><circle cx=\"80\" cy=\"200\" r=\"4.5\" fill=\"#111\"/><circle cx=\"181\" cy=\"129\" r=\"4.5\" fill=\"#111\"/><circle cx=\"250\" cy=\"60\" r=\"4.5\" fill=\"#111\"/><circle cx=\"420\" cy=\"200\" r=\"4.5\" fill=\"#111\"/><line x1=\"95\" y1=\"180\" x2=\"140\" y2=\"160\" stroke=\"#111\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"345\" y1=\"140\" x2=\"385\" y2=\"172\" stroke=\"#111\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><text x=\"80\" y=\"224\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#111\" >P（0m）<\/text><text x=\"420\" y=\"224\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#111\" >S（0m）<\/text><text x=\"193\" y=\"150\" text-anchor=\"start\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#111\" >Q（1200m）<\/text><text x=\"268\" y=\"50\" text-anchor=\"start\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#111\" >R（2200m）<\/text><text x=\"150\" y=\"82\" text-anchor=\"end\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#111\" >雲<\/text><text x=\"250\" y=\"190\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#111\" >山<\/text><\/svg><figcaption>図　山をこえる空気のモデル<\/figcaption><\/figure><table><caption>表　気温と飽和水蒸気量<\/caption><tr><th>気温〔℃〕<\/th><td>9<\/td><td>11<\/td><td>13<\/td><td>16<\/td><td>18<\/td><\/tr><tr><th>飽和水蒸気量〔g/m<sup>3<\/sup>〕<\/th><td>8.8<\/td><td>10.0<\/td><td>11.4<\/td><td>13.6<\/td><td>15.4<\/td><\/tr><tr><th>気温〔℃〕<\/th><td>23<\/td><td>28<\/td><td>30<\/td><td>33<\/td><td>35<\/td><\/tr><tr><th>飽和水蒸気量〔g/m<sup>3<\/sup>〕<\/th><td>20.6<\/td><td>27.2<\/td><td>30.4<\/td><td>35.7<\/td><td>39.6<\/td><\/tr><\/table>","qs":[{"k":"知","text":"空気が上昇すると温度が下がる理由を説明したものはどれか。最も適するものを1つ選びなさい。","sel":["上空ほどまわりの気圧が低いので，空気が膨張するから。","上空ほどまわりの気圧が低いので，空気が圧縮されるから。","上空ほどまわりの気圧が高いので，空気が膨張するから。","上空ほどまわりの気圧が高いので，空気が圧縮されるから。"],"ans":[1],"kai":"上空ほど気圧が低いので，上昇した空気は膨張する。空気は膨張すると温度が下がる。"},{"k":"思","text":"地点Sに達したときの空気の温度は何℃か。整数で答えなさい。","num":"33","unit":"℃","kai":"PからQまでで12℃下がって16℃，QからRまでは1000mで5℃下がって11℃になる。RからSまでは2200m下降して22℃上がるので，11＋22＝33℃である。"},{"k":"思","text":"地点Pにあるときの空気の湿度は何％か。整数で答えなさい。","num":"50","unit":"％","kai":"地点Qでの温度は28－12＝16℃で，ここで雲ができ始めるので，空気1m<sup>3<\/sup>中の水蒸気は16℃の飽和水蒸気量13.6gである。湿度は13.6÷27.2×100＝50％である。"},{"k":"思","text":"地点Sに達したときの空気の湿度は何％か。小数第1位を四捨五入して，整数で答えなさい。","num":"28","unit":"％","kai":"山頂Rでは11℃で飽和しているので，空気1m<sup>3<\/sup>中の水蒸気は10.0gである。地点Sでは33℃になるので，湿度は10.0÷35.7×100＝28.0…より28％である。"}]},{"id":"kanagawa_r7tui-s1","src":"神奈川県 2025年（追検査） 問1","kind":"sho","field":"物理",
