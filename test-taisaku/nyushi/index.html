":"力のつり合い","ctx":"","qs":[{"k":"思","text":"質量800gの箱を水平な床に置き，箱の上面につけた糸を真上に3Nの力で引いたところ，箱は床から離れずに静止していた。このとき，床が箱を押す力（垂直抗力）の大きさは何Nか。整数で答えなさい。ただし，質量100gの物体にはたらく重力の大きさを1Nとし，糸の質量は考えないものとする。","num":"5","unit":"N","kai":"箱にはたらく重力は8Nで下向きである。箱は静止しているので，上向きの糸が引く力3Nと垂直抗力の和が8Nとつり合い，垂直抗力は8－3＝5Nである。"}]},{"id":"kanagawa_r7tui-s3","src":"神奈川県 2025年（追検査） 問1","kind":"sho","field":"物理","grade":3,"topic":"仕事と仕事率","ctx":"","qs":[{"k":"思","text":"質量6.0kgの荷物を動滑車1個につるし，動滑車にかけたひもの一端を天井に固定して，もう一端を手で真上に一定の速さで引き，15秒かけて荷物を1.5m引き上げた。このとき，手がした仕事の仕事率は何Wか。整数で答えなさい。ただし，動滑車とひもの質量，摩擦は考えないものとし，質量100gの物体にはたらく重力の大きさを1Nとする。","num":"6","unit":"W","kai":"動滑車を使っても仕事の大きさは変わらず，60N×1.5m＝90Jである（手は30Nの力で3.0m引く）。仕事率は90J÷15s＝6Wである。"}]},{"id":"kanagawa_r7tui-s4","src":"神奈川県 2025年（追検査） 問2","kind":"sho","field":"化学","grade":1,"topic":"ガスバーナーの使い方","ctx":"","qs":[{"k":"知","text":"ガスバーナーに点火したところ，炎がオレンジ色でゆらいでいた。炎の大きさを変えずに，青色の安定した炎にするための操作はどれか。最も適するものを1つ選びなさい。","sel":["ガス調節ねじをおさえて動かないようにし，空気調節ねじだけを開く向きに回す。","ガス調節ねじをおさえて動かないようにし，空気調節ねじだけを閉じる向きに回す。","空気調節ねじをおさえて動かないようにし，ガス調節ねじだけを開く向きに回す。","空気調節ねじをおさえて動かないようにし，ガス調節ねじだけを閉じる向きに回す。"],"ans":[1],"kai":"オレンジ色の炎は空気が不足している。ガスの量を変えないようにガス調節ねじをおさえ，空気調節ねじだけを開いて空気の量をふやす。"}]},{"id":"kanagawa_r7tui-s5","src":"神奈川県 2025年（追検査） 問2","kind":"sho","field":"化学","grade":2,"topic":"酸化銅の還元と質量","ctx":"","qs":[{"k":"思","text":"酸化銅4.0gと炭素の粉末0.3gをよく混ぜて試験管に入れて加熱すると，どちらも余ることなく反応して，試験管には銅3.2gだけが残った。次に，酸化銅6.0gと炭素の粉末0.3gをよく混ぜて同じように加熱し，炭素をすべて反応させた。このとき，加熱後の試験管に残った固体の質量は何gか。小数第1位まで答えなさい。ただし，炭素は酸化銅とだけ反応し，発生した二酸化炭素はすべて試験管の外に出たものとする。","num":"5.2","unit":"g","kai":"炭素0.3gと反応する酸化銅は4.0gで，このとき発生する二酸化炭素は4.0＋0.3－3.2＝1.1gである。加熱前の全体6.3gから1.1gが出ていくので，残る固体（銅3.2gと酸化銅2.0g）は5.2gである。"}]},{"id":"kanagawa_r7tui-s6","src":"神奈川県 2025年（追検査） 問2","kind":"sho","field":"化学","grade":1,"topic":"密度と浮き沈み","ctx":"<table><caption>表1　固体の質量と体積<\/caption><tr><th>固体<\/th><th>質量〔g〕<\/th><th>体積〔cm<sup>3<\/sup>〕<\/th><\/tr><tr><td>A<\/td><td>4.2<\/td><td>4.0<\/td><\/tr><tr><td>B<\/td><td>3.0<\/td><td>4.0<\/td><\/tr><tr><td>C<\/td><td>5.6<\/td><td>4.0<\/td><\/tr><tr><td>D<\/td><td>2.7<\/td><td>3.0<\/td><\/tr><\/table><table><caption>表2　液体の密度<\/caption><tr><th>液体<\/th><th>密度〔g/cm<sup>3<\/sup>〕<\/th><\/tr><tr><td>エタノール<\/td><td>0.79<\/td><\/tr><tr><td>水<\/td><td>1.00<\/td><\/tr><tr><td>飽和食塩水<\/td><td>1.20<\/td><\/tr><\/table>","qs":[{"k":"思","text":"表1は，4種類のプラスチックでできた固体A～Dの質量と体積を，表2は，3種類の液体の密度をまとめたものである。固体A～Dのうち，エタノールに入れると沈み，飽和食塩水に入れると浮くものを<b>すべて<\/b>選びなさい。ただし，固体は液体にとけず，中に空どうはないものとする。","sel":["A","B","C","D"],"ans":[1,4],"multi":true,"fix":true,"kai":"密度はAが1.05，Bが0.75，Cが1.40，Dが0.90g/cm<sup>3<\/sup>である。密度が0.79g/cm<sup>3<\/sup>より大きく1.20g/cm<sup>3<\/sup>より小さいAとDがあてはまる。"}]},{"id":"kanagawa_r7tui-s7","src":"神奈川県 2025年（追検査） 問3","kind":"sho","field":"生物","grade":1,"topic":"軟体動物","ctx":"","qs":[{"k":"知","text":"次の動物のうち，内臓が外とう膜でおおわれているものを<b>すべて<\/b>選びなさい。","sel":["アサリ","バッタ","タコ","ミミズ","エビ","マイマイ"],"ans":[1,3,6],"multi":true,"kai":"外とう膜をもつのは軟体動物で，アサリ，タコ，マイマイがあてはまる。バッタとエビは外骨格をもつ節足動物，ミミズはそのどちらでもない無脊椎動物である。"}]},{"id":"kanagawa_r7tui-s8","src":"神奈川県 2025年（追検査） 問3","kind":"sho","field":"生物","grade":3,"topic":"遺伝の規則性","ctx":"","qs":[{"k":"思","text":"エンドウの子葉の色には黄色と緑色があり，黄色が顕性形質である。子葉が黄色の純系と緑色の純系を交配して子の種子を得た。さらに，この子の種子を育てて自家受粉させたところ，孫の種子が1200個できた。孫の種子のうち，子と同じ遺伝子の組み合わせをもつものは，およそ何個と考えられるか。整数で答えなさい。","num":"600","unit":"個","kai":"黄色にする遺伝子をA，緑色にする遺伝子をaとすると，子はすべてAaである。孫はAA：Aa：aa＝1：2：1になるので，Aaは1200×2÷4＝600個である。"}]},{"id":"kanagawa_r7tui-s9","src":"神奈川県 2025年（追検査） 問3","kind":"sho","field":"生物","grade":3,"topic":"体細胞分裂","ctx":"","qs":[{"k":"知","text":"タマネギの根で見られる体細胞分裂について述べたものはどれか。最も適するものを1つ選びなさい。","sel":["染色体は分裂が始まる前に複製され，2つの細胞に等しく分けられるので，分裂後の細胞1個の染色体の数は，もとの細胞と同じになる。","染色体は複製されずに2つの細胞に分けられるので，分裂後の細胞1個の染色体の数は，もとの細胞の半分になる。","分裂してできた直後の細胞1個の大きさは，分裂する前のもとの細胞と同じである。","細胞分裂は根もとに近い部分でさかんに行われ，根の先端近くではほとんど行われない。"],"ans":[1],"kai":"体細胞分裂では，複製されて2倍になった染色体が2等分されるので，染色体の数は変わらない。分裂直後の細胞はもとより小さく，分裂は根の先端近くでさかんである。"}]},{"id":"kanagawa_r7tui-s10","src":"神奈川県 2025年（追検査） 問4","kind":"sho","field":"地学","grade":1,"topic":"示準化石","ctx":"","qs":[{"k":"知","text":"ある地層からアンモナイトの化石が見つかった。この地層が堆積した地質年代と，アンモナイトのように地層が堆積した年代を知る手がかりになる化石となった生物の特徴の組み合わせはどれか。最も適するものを1つ選びなさい。","sel":["中生代 ／ 広い範囲にすみ，短い期間だけ栄えた。","中生代 ／ 限られた環境にすみ，長い期間栄えた。","古生代 ／ 広い範囲にすみ，短い期間だけ栄えた。","古生代 ／ 限られた環境にすみ，長い期間栄えた。","新生代 ／ 広い範囲にすみ，短い期間だけ栄えた。","新生代 ／ 限られた環境にすみ，長い期間栄えた。"],"ans":[1],"kai":"アンモナイトは中生代の示準化石である。示準化石には，広い範囲にすみ，短い期間だけ栄えて絶滅した生物の化石が適している。"}]},{"id":"kanagawa_r7tui-s11","src":"神奈川県 2025年（追検査） 問4","kind":"sho","field":"地学","grade":1,"topic":"地層の傾き","ctx":"<table><caption>表　ボーリング調査の結果<\/caption><tr><th>地点<\/th><th>位置<\/th><th>地表の標高〔m〕<\/th><th>凝灰岩の層の上面までの深さ〔m〕<\/th><\/tr><tr><td>P<\/td><td>―<\/td><td>60<\/td><td>10<\/td><\/tr><tr><td>Q<\/td><td>Pの真東200m<\/td><td>70<\/td><td>20<\/td><\/tr><tr><td>R<\/td><td>Pの真北200m<\/td><td>55<\/td><td>20<\/td><\/tr><\/table>","qs":[{"k":"思","text":"表は，ある地域の3地点P，Q，Rで行ったボーリング調査の結果をまとめたものである。この地域の地層は，どの方位に向かって低くなるように傾いているか。最も適するものを1つ選びなさい。ただし，3地点の凝灰岩の層は同じものであり，この地域の地層は平行に重なって一定の方向に傾いており，断層やしゅう曲はないものとする。","sel":["東","西","南","北"],"ans":[4],"fix":true,"kai":"凝灰岩の層の上面の標高は，Pが60－10＝50m，Qが70－20＝50m，Rが55－20＝35mである。東西では同じ高さで，北のRで低いので，北に向かって低くなっている。"}]},{"id":"kanagawa_r7tui-s12","src":"神奈川県 2025年（追検査） 問4","kind":"sho","field":"地学","grade":3,"topic":"緯度と太陽の動き","ctx":"","qs":[{"k":"思","text":"秋分の日に，日本の北緯36°の地点Xと北緯40°の地点Yで，太陽の1日の動きを観察した。その結果について述べたものはどれか。最も適するものを1つ選びなさい。","sel":["太陽の南中高度は地点Xのほうが4°高く，日の出の方位はどちらの地点も真東である。","太陽の南中高度は地点Xのほうが4°高く，日の出の方位は地点Xのほうが南寄りである。","太陽の南中高度は地点Yのほうが4°高く，日の出の方位はどちらの地点も真東である。","太陽の南中高度は地点Yのほうが4°高く，日の出の方位は地点Yのほうが南寄りである。"],"ans":[1],"kai":"春分・秋分の日の南中高度は90°－緯度で求められ，地点Xは54°，地点Yは50°である。この日は，どの地点でも太陽は真東からのぼり，真西に沈む。"}]},{"id":"kanagawa_r7-d1","src":"神奈川県 2025年 問5","kind":"dai","field":"物理","grade":3,"topic":"斜面を下る台車の運動","ctx":"<p class=\"lead\">台車の運動を調べるために、斜面と水平面をなめらかにつないだコースを水平な机の上に固定し、次の実験を行った。ただし、台車にはたらく摩擦や空気の抵抗は考えないものとする。<br>〔実験〕斜面上の点Pに台車を置き、静かに手をはなした。手をはなした瞬間から0.1秒ごとに台車の位置を記録し、0.1秒ごとの区間の移動距離を求めた。表は、その結果をまとめたものである。なお、区間1は手をはなしてから0.1秒後までを表す。<\/p><table><caption>表　0.1秒ごとの区間の移動距離<\/caption><tr><th>区間<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><th>6<\/th><th>7<\/th><th>8<\/th><\/tr><tr><th>移動距離〔cm〕<\/th><td>1.2<\/td><td>3.6<\/td><td>6.0<\/td><td>8.4<\/td><td>10.8<\/td><td>12.9<\/td><td>13.2<\/td><td>13.2<\/td><\/tr><\/table>","qs":[{"k":"知","text":"台車が斜面を下っているときの、台車にはたらく力についての説明はどれか。最も適するものを1つ選びなさい。","sel":["台車の運動の向きにはたらく力の大きさは、速さが増すにつれて大きくなる。","台車にはたらく重力と垂直抗力はつり合っている。","重力の斜面に平行な分力は、垂直抗力とつり合っている。","台車の運動の向きにはたらく力の大きさは、斜面上のどの位置でも変わらない。"],"ans":[4],"kai":"台車の運動の向きにはたらく力は重力の斜面に平行な分力であり、斜面の傾きが一定なので大きさは変わらない。重力の斜面に垂直な分力が垂直抗力とつり合っている。"},{"k":"思","text":"区間2のはじめから区間4の終わりまでの、台車の平均の速さは何cm/sか。整数で答えなさい。","num":"60","unit":"cm/s","kai":"区間2〜4の移動距離は3.6＋6.0＋8.4＝18.0cmで、かかった時間は0.3秒である。18.0÷0.3＝60cm/sとなる。"},{"k":"思","text":"表から、台車が水平面に達したのはどの区間の途中だと考えられるか。最も適するものを1つ選びなさい。","sel":["区間4の途中","区間5の途中","区間6の途中","区間7の途中"],"ans":[3],"fix":true,"kai":"斜面上では移動距離が区間ごとに2.4cmずつ増えるが、区間6は前の区間より2.1cmしか増えていない。区間7以降は一定なので、区間6の途中で水平面に達したといえる。"},{"k":"思","text":"斜面の傾きだけを大きくし、台車をはなす位置の水平面からの高さは点Pと同じにして、同様の実験を行った。このとき、斜面上で台車の速さが増加する割合と、水平面上での台車の速さは、はじめの実験と比べてどうなるか。最も適するものを1つ選びなさい。","sel":["速さが増加する割合：大きくなる　水平面上での速さ：大きくなる","速さが増加する割合：大きくなる　水平面上での速さ：変わらない","速さが増加する割合：変わらない　水平面上での速さ：大きくなる","速さが増加する割合：小さくなる　水平面上での速さ：変わらない","速さが増加する割合：変わらない　水平面上での速さ：変わらない"],"ans":[2],"kai":"傾きが大きいほど重力の斜面に平行な分力が大きくなるので、速さが増加する割合は大きくなる。はなす高さが同じなので位置エネルギーは同じで、水平面上での速さは変わらない。"}]},{"id":"kanagawa_r7-d2","src":"神奈川県 2025年 問6","kind":"dai","field":"化学","grade":2,"topic":"炭酸カルシウムと塩酸の反応と質量","ctx":"<p class=\"lead\">炭酸カルシウムとうすい塩酸の反応について調べるために、次の実験を行った。<br>〔実験1〕うすい塩酸40cm<sup>3<\/sup>を入れたビーカーと、炭酸カルシウムの粉末1.0gを入れた薬包紙を一緒に電子てんびんにのせ、全体の質量をはかった。次に、炭酸カルシウムをすべてビーカーに入れたところ、気体が発生した。反応が終わった後、薬包紙もふくめた全体の質量をはかり、発生した気体の質量を求めた。<br>〔実験2〕炭酸カルシウムの質量を2.0g、3.0g、4.0g、5.0gに変えて、〔実験1〕と同様の操作を行った。うすい塩酸はいずれも同じ濃さのものを40cm<sup>3<\/sup>ずつ用いた。表は、〔実験1〕、〔実験2〕の結果をまとめたものである。<br>ただし、発生した気体はすべて空気中に出ていったものとする。<\/p><table><caption>表　炭酸カルシウムの質量と発生した気体の質量<\/caption><tr><th>炭酸カルシウムの質量〔g〕<\/th><td>1.0<\/td><td>2.0<\/td><td>3.0<\/td><td>4.0<\/td><td>5.0<\/td><\/tr><tr><th>発生した気体の質量〔g〕<\/th><td>0.44<\/td><td>0.88<\/td><td>1.32<\/td><td>1.54<\/td><td>1.54<\/td><\/tr><\/table>","qs":[{"k":"知","text":"〔実験1〕で発生した気体と同じ気体が発生するものはどれか。最も適するものを1つ選びなさい。","sel":["炭酸水素ナトリウムを加熱する。","二酸化マンガンにうすい過酸化水素水を加える。","亜鉛にうすい塩酸を加える。","塩化アンモニウムと水酸化カルシウムを混ぜて加熱する。"],"ans":[1],"kai":"炭酸カルシウムとうすい塩酸の反応で発生する気体は二酸化炭素であり、炭酸水素ナトリウムを加熱しても二酸化炭素が発生する。ほかは酸素、水素、アンモニアが発生する。"},{"k":"思","text":"うすい塩酸40cm<sup>3<\/sup>と過不足なく反応する炭酸カルシウムの質量は何gか。小数第1位まで答えなさい。","num":"3.5","unit":"g","kai":"炭酸カルシウム1.0gあたり0.44gの気体が発生し、塩酸40cm<sup>3<\/sup>では最大1.54gまでしか発生しない。1.54÷0.44＝3.5より、3.5gと過不足なく反応する。"},{"k":"思","text":"同じ濃さのうすい塩酸80cm<sup>3<\/sup>に炭酸カルシウム6.0gを入れ、〔実験1〕と同様の操作を行うと、発生する気体の質量は何gになると考えられるか。小数第2位まで答えなさい。","num":"2.64","unit":"g","kai":"塩酸80cm<sup>3<\/sup>は炭酸カルシウム7.0gまで反応できるので、6.0gはすべて反応する。0.44×6.0＝2.64gとなる。"},{"k":"思","text":"炭酸カルシウムをふくむ貝殻の粉末4.0gを、同じ濃さのうすい塩酸40cm<sup>3<\/sup>に入れて〔実験1〕と同様の操作を行ったところ、発生した気体の質量は1.32gであった。この貝殻の粉末にふくまれる炭酸カルシウムの質量の割合は何％か。整数で答えなさい。ただし、貝殻の粉末にふくまれる炭酸カルシウム以外の物質は、塩酸と反応しないものとする。","num":"75","unit":"％","kai":"1.32gは1.54gより小さいので、炭酸カルシウムはすべて反応している。1.32÷0.44＝3.0gの炭酸カルシウムがふくまれ、3.0÷4.0×100＝75％となる。"}]},{"id":"kanagawa_r7-d3","src":"神奈川県 2025年 問7","kind":"dai","field":"生物","grade":3,"topic":"土の中の微生物のはたらき","ctx":"<p class=\"lead\">土の中の微生物のはたらきについて調べるために、次の実験を行った。<br>〔実験〕林の落ち葉の下から土を採取し、その一部をじゅうぶんに加熱した。デンプンをふくむ寒天培地を入れたペトリ皿A〜Cを用意し、Aには採取したままの土を、Bには加熱した土を少量ずつのせ、Cには何ものせなかった。A〜Cにふたをして25℃で3日間置いた後、土を取り除き、培地全体にヨウ素液を加えた。表は、その結果をまとめたものである。<br>また、Aの培地のうち色が変化しなかった部分を取って水を加えて加熱し、とかした液にベネジクト液を加えて加熱したところ、赤褐色の沈殿ができた。<br>なお、土の中の微生物は熱に弱く、じゅうぶんに加熱すると死ぬ。土にふくまれる微生物以外の成分は、加熱しても変化しないものとする。<\/p><table><caption>表　ヨウ素液を加えたときの培地のようす<\/caption><tr><th>ペトリ皿<\/th><th>のせたもの<\/th><th>培地のようす<\/th><\/tr><tr><th>A<\/th><td>採取したままの土<\/td><td>土をのせていた部分とその周りは色が変化せず、それ以外は青紫色になった。<\/td><\/tr><tr><th>B<\/th><td>加熱した土<\/td><td>全体が青紫色になった。<\/td><\/tr><tr><th>C<\/th><td>なし<\/td><td>全体が青紫色になった。<\/td><\/tr><\/table>","qs":[{"k":"思","text":"表とベネジクト液を用いた結果から、Aの培地の色が変化しなかった部分では何が起こったと考えられるか。最も適するものを1つ選びなさい。","sel":["デンプンが変化せず、そのまま残っていた。","糖が結びついてデンプンがつくられた。","デンプンが分解されて糖ができた。","デンプンが分解され、デンプンも糖もなくなった。"],"ans":[3],"kai":"ヨウ素液で色が変化しなかったのでデンプンはなく、ベネジクト液で赤褐色の沈殿ができたので糖がある。デンプンが分解されて糖ができたと考えられる。"},{"k":"思","text":"ペトリ皿AとCの結果<b>だけ<\/b>を比べてわかることはどれか。最も適するものを1つ選びなさい。","sel":["土の中の微生物がデンプンを分解したこと","土にふくまれる何かがデンプンを分解したこと","土をのせなくても培地のデンプンは分解されること","加熱した土ではデンプンが分解されないこと"],"ans":[2],"kai":"AとCのちがいは土をのせたかどうかだけなので、土にふくまれる何かがデンプンを分解したことまではわかる。それが微生物かどうかは、加熱した土をのせたBと比べないとわからない。"},{"k":"思","text":"ペトリ皿Bを用意した目的はどれか。最も適するものを1つ選びなさい。","sel":["ヨウ素液がデンプンと反応して青紫色になることを確かめるため。","土をのせないときに培地がどう変化するかを調べるため。","加熱によって土にふくまれるデンプンがふえることを確かめるため。","Aでデンプンが分解されたのが、土の中の熱に弱いもののはたらきによるかどうかを確かめるため。"],"ans":[4],"kai":"加熱すると微生物は死ぬが、微生物以外の成分は変化しない。Bでデンプンが分解されなかったことから、Aの変化は熱に弱い微生物のはたらきによるといえる。"},{"k":"知","text":"土の中で分解者としてはたらく生物はどれか。あてはまるものをすべて選びなさい。","sel":["ゼニゴケ","アオカビ","モズ","ススキ","ダンゴムシ"],"ans":[2,5],"multi":true,"kai":"アオカビなどの菌類や、落ち葉などを食べるダンゴムシは、生物の死がいやふんなどの有機物を無機物に分解するのにかかわる分解者である。ゼニゴケとススキは生産者、モズは消費者である。"}]},{"id":"kanagawa_r7-d4","src":"神奈川県 2025年 問8","kind":"dai","field":"地学","grade":1,"topic":"地震のゆれの伝わり方と緊急地震速報","ctx":"<p class=\"lead\">ある地震について、震源からの距離が異なる地点A、Bで、地震計によってP波とS波が届いた時刻を調べた。表は、その結果をまとめたものである。なお、地震計は、台に固定した記録紙と、ばねでつるしたおもりにつけた針からできている。ただし、この地震のP波とS波の伝わる速さはそれぞれ一定であるものとする。<\/p><table><caption>表　地点A、Bの観測結果<\/caption><tr><th>地点<\/th><th>震源からの距離<\/th><th>P波が届いた時刻<\/th><th>S波が届いた時刻<\/th><\/tr><tr><th>A<\/th><td>48km<\/td><td>10時15分08秒<\/td><td>10時15分14秒<\/td><\/tr><tr><th>B<\/th><td>96km<\/td><td>10時15分14秒<\/td><td>10時15分26秒<\/td><\/tr><\/table>","qs":[{"k":"知","text":"地震計で地面のゆれが記録されるしくみについての説明はどれか。最も適するものを1つ選びなさい。","sel":["地面がゆれると、おもりも記録紙も地面とともに動くため。","地面がゆれると、記録紙は地面とともに動くが、おもりはほとんど動かないため。","地面がゆれると、おもりは地面とともに動くが、記録紙はほとんど動かないため。","地面がゆれても、おもりも記録紙もほとんど動かないため。"],"ans":[2],"kai":"記録紙は台に固定されているので地面とともに動くが、ばねでつるしたおもりとそれにつけた針はほとんど動かない。そのため、記録紙の上に地面のゆれが記録される。"},{"k":"思","text":"この地震が発生した時刻はいつか。最も適するものを1つ選びなさい。","sel":["10時15分00秒","10時15分02秒","10時15分04秒","10時15分06秒"],"ans":[2],"fix":true,"kai":"AとBの差から、P波は48kmを6秒で伝わるので速さは8km/sである。48kmの地点Aまで6秒かかるので、発生時刻は10時15分08秒の6秒前の10時15分02秒である。"},{"k":"思","text":"この地震で、初期微動継続時間が15秒であった地点は、震源から何kmの距離にあると考えられるか。整数で答えなさい。","num":"120","unit":"km","kai":"初期微動継続時間は震源からの距離に比例し、48kmの地点Aでは6秒である。15秒では48×15÷6＝120kmとなる。"},{"k":"思","text":"この地震では、震源からの距離が24kmの地点でP波を観測してから4秒後に、緊急地震速報が出された。震源からの距離が72kmの地点では、緊急地震速報が出されてから何秒後にS波が届くと考えられるか。整数で答えなさい。ただし、緊急地震速報は各地に瞬時に伝わるものとする。","num":"11","unit":"秒後","kai":"P波は8km/s、S波は4km/sで伝わる。24kmの地点にP波が届くのは発生の3秒後で、速報は発生の7秒後に出た。72kmの地点にS波が届くのは発生の18秒後なので、速報の11秒後である。"}]},{"id":"kanagawa_r7-s1","src":"神奈川県 2025年 問1","kind":"sho","field":"物理","grade":1,"topic":"光の屈折とレンズのはたらき","ctx":"","qs":[{"k":"思","text":"空気中で、光軸に平行な光を当てたとき、光を1点に集めるはたらきをするものはどれか。あてはまるものをすべて選びなさい。ただし、空洞の中は空気で満たされており、光の反射は考えないものとする。なお、光は空気からガラスへ進むときは境界面に垂直な線に近づくように屈折し、ガラスから空気へ進むときは境界面に垂直な線から遠ざかるように屈折する。","sel":["厚さが一様な平らなガラス板","中央が周辺より厚い形の、ガラスでできたレンズ","ガラスの直方体の中に、中央が周辺より厚い形の空洞があるもの","ガラスの直方体の中に、中央が周辺よりうすい形の空洞があるもの","中央が周辺よりうすい形の、ガラスでできたレンズ"],"ans":[2,4],"multi":true,"kai":"光は空気からガラスに入るときと、ガラスから空気に出るときで屈折する向きが逆になる。ガラスの中の空洞は、まわりと屈折の向きが逆になるので、中央がうすい形の空洞が凸レンズと同じはたらきをする。"}]},{"id":"kanagawa_r7-s2","src":"神奈川県 2025年 問1","kind":"sho","field":"物理","grade":2,"topic":"電圧と電流の関係","ctx":"<p class=\"lead\">抵抗器P、Qにそれぞれ加える電圧を変えながら、流れる電流の大きさを測定した。図は、その結果を表したものである。<\/p><figure><svg viewBox=\"0 0 480 330\"><g stroke=\"#bbb\" stroke-width=\"1\"><line x1=\"115\" y1=\"60\" x2=\"115\" y2=\"270\"/><line x1=\"150\" y1=\"60\" x2=\"150\" y2=\"270\"/><line x1=\"185\" y1=\"60\" x2=\"185\" y2=\"270\"/><line x1=\"220\" y1=\"60\" x2=\"220\" y2=\"270\"/><line x1=\"255\" y1=\"60\" x2=\"255\" y2=\"270\"/><line x1=\"290\" y1=\"60\" x2=\"290\" y2=\"270\"/><line x1=\"325\" y1=\"60\" x2=\"325\" y2=\"270\"/><line x1=\"360\" y1=\"60\" x2=\"360\" y2=\"270\"/><line x1=\"395\" y1=\"60\" x2=\"395\" y2=\"270\"/><line x1=\"80\" y1=\"235\" x2=\"430\" y2=\"235\"/><line x1=\"80\" y1=\"200\" x2=\"430\" y2=\"200\"/><line x1=\"80\" y1=\"165\" x2=\"430\" y2=\"165\"/><line x1=\"80\" y1=\"130\" x2=\"430\" y2=\"130\"/><line x1=\"80\" y1=\"95\" x2=\"430\" y2=\"95\"/><\/g><rect x=\"80\" y=\"60\" width=\"350\" height=\"210\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\"/><line x1=\"80\" y1=\"270\" x2=\"290\" y2=\"60\" stroke=\"#000\" stroke-width=\"2\"/><line x1=\"80\" y1=\"270\" x2=\"430\" y2=\"130\" stroke=\"#000\" stroke-width=\"2\"/><text x=\"298\" y=\"82\" font-size=\"18\" font-family=\"sans-serif\">P<\/text><text x=\"404\" y=\"124\" font-size=\"18\" font-family=\"sans-serif\">Q<\/text><g font-size=\"15\" font-family=\"sans-serif\" text-anchor=\"middle\"><text x=\"80\" y=\"290\">0<\/text><text x=\"150\" y=\"290\">2<\/text><text x=\"220\" y=\"290\">4<\/text><text x=\"290\" y=\"290\">6<\/text><text x=\"360\" y=\"290\">8<\/text><text x=\"430\" y=\"290\">10<\/text><text x=\"255\" y=\"318\">電圧〔V〕<\/text><\/g><g font-size=\"15\" font-family=\"sans-serif\" text-anchor=\"end\"><text x=\"72\" y=\"275\">0<\/text><text x=\"72\" y=\"205\">100<\/text><text x=\"72\" y=\"135\">200<\/text><text x=\"72\" y=\"65\">300<\/text><\/g><text x=\"80\" y=\"40\" font-size=\"15\" font-family=\"sans-serif\" text-anchor=\"middle\">電流〔mA〕<\/text><\/svg><figcaption>図　電圧と電流の関係<\/figcaption><\/figure>","qs":[{"k":"思","text":"図の抵抗器PとQを直列につなぎ、電源の電圧を7.0Vにしたとき、回路に流れる電流は何mAか。整数で答えなさい。","num":"100","unit":"mA","kai":"図から、Pは6.0Vで300mA流れるので20Ω、Qは10Vで200mA流れるので50Ωである。直列回路全体の抵抗は70Ωなので、7.0÷70＝0.1A＝100mAとなる。"}]},{"id":"kanagawa_r7-s3","src":"神奈川県 2025年 問1","kind":"sho","field":"物理","grade":2,"topic":"静電気の性質","ctx":"<p class=\"lead\">異なる物質でできた3本のストローP、Q、Rをそれぞれ布でこすって静電気を帯びさせ、2本ずつ近づけて、そのようすを調べた。PとQを近づけるとしりぞけ合い、QとRを近づけると引き合った。また、Pは－の電気を帯びていることがわかっている。<\/p>","qs":[{"k":"思","text":"Rが帯びている電気の種類と、PとRを近づけたときのようすの組み合わせはどれか。最も適するものを1つ選びなさい。","sel":["Rが帯びている電気：＋　PとRのようす：引き合う","Rが帯びている電気：＋　PとRのようす：しりぞけ合う","Rが帯びている電気：－　PとRのようす：引き合う","Rが帯びている電気：－　PとRのようす：しりぞけ合う"],"ans":[1],"kai":"PとQはしりぞけ合うので同じ種類の電気を帯びており、Qは－である。QとRは引き合うのでRは＋であり、－のPと＋のRは引き合う。"}]},{"id":"kanagawa_r7-s4","src":"神奈川県 2025年 問2","kind":"sho","field":"化学","grade":3,"topic":"塩化銅の電離と電気分解","ctx":"","qs":[{"k":"知","text":"塩化銅水溶液中の陽イオンと陰イオンの数の比（陽イオン：陰イオン）と、この水溶液に電流を流したときに陽極に出てくる物質の組み合わせはどれか。最も適するものを1つ選びなさい。","sel":["数の比 2：1　陽極に出てくる物質 塩素","数の比 1：1　陽極に出てくる物質 塩素","数の比 1：2　陽極に出てくる物質 銅","数の比 1：2　陽極に出てくる物質 塩素","数の比 2：1　陽極に出てくる物質 銅"],"ans":[4],"kai":"塩化銅はCuCl<sub>2<\/sub>→Cu<sup>2＋<\/sup>＋2Cl<sup>－<\/sup>と電離するので、銅イオンと塩化物イオンの数の比は1：2である。陰イオンの塩化物イオンが陽極に引かれて電子を失い、塩素が出てくる。"}]},{"id":"kanagawa_r7-s5","src":"神奈川県 2025年 問2","kind":"sho","field":"化学","grade":3,"topic":"中和とイオンの数","ctx":"<p class=\"lead\">BTB溶液を加えたうすい水酸化ナトリウム水溶液20cm<sup>3<\/sup>に、うすい塩酸を少しずつ加えたところ、塩酸を15cm<sup>3<\/sup>加えたときに水溶液は緑色になった。はじめの水酸化ナトリウム水溶液にふくまれるナトリウムイオンの数を60個とし、加えた塩酸1cm<sup>3<\/sup>あたりにふくまれる水素イオンの数は一定であるとモデルで考える。<\/p>","qs":[{"k":"思","text":"塩酸を21cm<sup>3<\/sup>加えたとき、水溶液中にあるイオンの数の総数は何個か。整数で答えなさい。","num":"168","unit":"個","kai":"塩酸1cm<sup>3<\/sup>あたり水素イオンと塩化物イオンが4個ずつある。21cm<sup>3<\/sup>では水素イオン84個のうち60個が水酸化物イオンと結びついて水になり、ナトリウムイオン60個、水素イオン24個、塩化物イオン84個で168個となる。"}]},{"id":"kanagawa_r7-s6","src":"神奈川県 2025年 問6","kind":"sho","field":"化学","grade":2,"topic":"発熱反応と吸熱反応","ctx":"","qs":[{"k":"知","text":"次の化学変化のうち、吸熱反応であるものはどれか。あてはまるものをすべて選びなさい。","sel":["塩化アンモニウムと水酸化バリウムを混ぜる。","鉄粉と活性炭を混ぜ、食塩水を加える。","酸化カルシウムに水を加える。","炭酸水素ナトリウムとクエン酸を混ぜ、水を加える。","うすい塩酸にうすい水酸化ナトリウム水溶液を加える。"],"ans":[1,4],"multi":true,"kai":"塩化アンモニウムと水酸化バリウム、炭酸水素ナトリウムとクエン酸の反応は、周囲から熱を吸収して温度が下がる吸熱反応である。鉄の酸化、酸化カルシウムと水、中和は発熱反応である。"}]},{"id":"kanagawa_r7-s7","src":"神奈川県 2025年 問3","kind":"sho","field":"生物","grade":1,"topic":"顕微鏡の倍率と視野","ctx":"","qs":[{"k":"知","text":"接眼レンズの倍率が15倍、対物レンズの倍率が10倍のときの顕微鏡の倍率と、対物レンズを高倍率のものにかえたときの視野のようすの組み合わせはどれか。最も適するものを1つ選びなさい。","sel":["倍率 150倍　視野 せまく暗くなる","倍率 25倍　視野 せまく暗くなる","倍率 150倍　視野 広く明るくなる","倍率 150倍　視野 せまく明るくなる","倍率 25倍　視野 広く暗くなる"],"ans":[1],"kai":"顕微鏡の倍率は接眼レンズの倍率と対物レンズの倍率の積なので15×10＝150倍である。高倍率にすると、見える範囲はせまくなり、視野は暗くなる。"}]},{"id":"kanagawa_r7-s8","src":"神奈川県 2025年 問3","kind":"sho","field":"生物","grade":2,"topic":"脊椎動物の分類の観点","ctx":"<p class=\"lead\">ペンギン、ウミガメ、マグロ、サンショウウオ、イルカを、5つの異なるグループに分けたい。表は、そのための観点を1つ調べたものである（○はあてはまる、×はあてはまらないことを示す）。<\/p><table><caption>表　調べた観点<\/caption><tr><th>観点<\/th><th>ペンギン<\/th><th>ウミガメ<\/th><th>マグロ<\/th><th>サンショウウオ<\/th><th>イルカ<\/th><\/tr><tr><th>一生を通して肺で呼吸する<\/th><td>○<\/td><td>○<\/td><td>×<\/td><td>×<\/td><td>○<\/td><\/tr><\/table><p class=\"lead\">a　胎生である。<br>b　からだの表面の大部分がうろこでおおわれている。<br>c　殻のある卵をうむ。<br>d　体温をほぼ一定に保つことができる。<\/p>","qs":[{"k":"思","text":"表の観点に、a〜dのうち2つの観点を追加して、5種類の動物を異なるグループに分けたい。追加する観点の組み合わせとして適するものはどれか。あてはまるものをすべて選びなさい。","sel":["aとb","aとc","aとd","bとc","cとd"],"ans":[1,4],"multi":true,"kai":"aとbではペンギン、ウミガメ、イルカ、マグロ、サンショウウオの○×がすべて異なり、bとcでも同様にすべて異なる。aとcではペンギンとウミガメが、aとd、cとdではマグロとサンショウウオが分けられない。"}]},{"id":"kanagawa_r7-s9","src":"神奈川県 2025年 問3","kind":"sho","field":"生物","grade":2,"topic":"血液による酸素の運搬","ctx":"","qs":[{"k":"知","text":"ヒトのからだで、酸素が全身の細胞にわたされるしくみについての説明はどれか。最も適するものを1つ選びなさい。","sel":["赤血球が毛細血管のかべを通りぬけて血管の外に出て、細胞に直接酸素をわたす。","毛細血管を流れる赤血球からはなれた酸素が、血しょうにとけ、毛細血管からしみ出した組織液を通して細胞にわたされる。","動脈を流れる白血球が酸素を運び、動脈のかべを通して細胞にわたす。","静脈を流れる血しょうにとけた酸素が、静脈のかべを通して細胞にわたされる。"],"ans":[2],"kai":"酸素は赤血球のヘモグロビンによって運ばれ、酸素の少ない毛細血管ではなれる。血しょうにとけた酸素は、毛細血管からしみ出した組織液を通して細胞にわたされる。"}]},{"id":"kanagawa_r7-s10","src":"神奈川県 2025年 問4","kind":"sho","field":"地学","grade":2,"topic":"露点と湿度","ctx":"<p class=\"lead\">部屋Aの空気は気温24℃で、1m<sup>3<\/sup>あたり13.6gの水蒸気をふくんでいる。部屋Bの空気は気温14℃で、1m<sup>3<\/sup>あたり9.4gの水蒸気をふくんでいる。表は、気温と飽和水蒸気量の関係を示したものである。<\/p><table><caption>表　気温と飽和水蒸気量<\/caption><tr><th>気温〔℃〕<\/th><td>10<\/td><td>12<\/td><td>14<\/td><td>16<\/td><td>18<\/td><td>20<\/td><td>22<\/td><td>24<\/td><\/tr><tr><th>飽和水蒸気量〔g/m<sup>3<\/sup>〕<\/th><td>9.4<\/td><td>10.7<\/td><td>12.1<\/td><td>13.6<\/td><td>15.4<\/td><td>17.3<\/td><td>19.4<\/td><td>21.8<\/td><\/tr><\/table>","qs":[{"k":"思","text":"部屋A、Bの空気のうち、露点が高いほうと、湿度が高いほうの組み合わせはどれか。最も適するものを1つ選びなさい。","sel":["露点が高い：B　湿度が高い：A","露点が高い：A　湿度が高い：A","露点が高い：B　湿度が高い：B","露点が高い：A　湿度が高い：B"],"ans":[4],"kai":"露点はAが16℃、Bが10℃でAが高い。湿度はAが13.6÷21.8×100で約62％、Bが9.4÷12.1×100で約78％でBが高い。"}]},{"id":"kanagawa_r7-s11","src":"神奈川県 2025年 問4","kind":"sho","field":"地学","grade":3,"topic":"太陽系の惑星","ctx":"","qs":[{"k":"知","text":"太陽系の惑星についての説明として正しいものはどれか。あてはまるものをすべて選びなさい。","sel":["土星は、自ら光を出して輝いている。","木星型惑星は地球型惑星に比べて、半径が大きく、平均密度が小さい。","金星は、真夜中に南の空に見えることがある。","太陽系の惑星の中で、公転周期が最も長いのは水星である。","火星の表面は岩石でできており、大気の主成分は二酸化炭素である。"],"ans":[2,5],"multi":true,"kai":"惑星は太陽の光を反射して輝く。金星は地球より内側を公転するので真夜中には見えず、公転周期は太陽から遠い惑星ほど長いので水星が最も短い。"}]},{"id":"kanagawa_r7-s12","src":"神奈川県 2025年 問4","kind":"sho","field":"地学","grade":3,"topic":"地軸の傾きと極夜","ctx":"<p class=\"lead\">地球の地軸は、公転面に垂直な方向に対して23.4°傾いている。地球上のある地域では、時期によって一日中太陽がのぼらないことがあり、このような現象を極夜という。<\/p>","qs":[{"k":"思","text":"次の地点のうち、1年の間に極夜がある地点はどれか。あてはまるものをすべて選びなさい。ただし、大気による光の屈折は考えないものとする。","sel":["南緯70°の地点","北緯60°の地点","赤道上の地点","北緯80°の地点","南緯50°の地点"],"ans":[1,4],"multi":true,"kai":"地軸が23.4°傾いているので、緯度が90°－23.4°＝66.6°より高い地点では、冬至のころ（南半球では夏至のころ）に一日中太陽がのぼらない日がある。北緯80°と南緯70°があてはまる。"}]},{"id":"saitama_r8-d1","src":"埼玉県 2026年 大問2","kind":"dai","field":"地学","grade":2,"topic":"気圧と大気の動き","ctx":"<p class=\"lead\">〔実験〕 内側を少量の水でぬらした炭酸飲料用のペットボトルに線香の煙を少し入れ、簡易加圧ポンプつきの栓をした。ポンプを何度も押して中の空気を圧縮したあと、栓をゆるめて空気を一気に外へ出したところ、ペットボトルの中が白くくもった。このとき、ペットボトルの中に入れておいたデジタル温度計の示度は、21.5℃から20.6℃に変化した。<\/p><p class=\"lead\">〔観察〕 縦12cm、横10cmの長方形のゴム製の吸着板を、平らな机の面に空気が入らないように置いた。吸着板の持ち手を真上に引いても、吸着板は机からはなれなかった。この部屋の大気圧の大きさは100000Paであった。<\/p><p class=\"lead\">〔調べたこと〕 アネロイド気圧計は、中が真空になっている金属製の容器（空ごう）の厚みの変化を、てこを通して指針に伝えて気圧を示すしくみである。表は、ある山の登山道の地点A〜Dの標高と、その日の気圧である。<\/p><table><caption>表　地点A〜Dの標高と気圧<\/caption><tr><th>地点<\/th><th>A<\/th><th>B<\/th><th>C<\/th><th>D<\/th><\/tr><tr><th>標高〔m〕<\/th><td>40<\/td><td>780<\/td><td>1450<\/td><td>2280<\/td><\/tr><tr><th>気圧〔hPa〕<\/th><td>1010<\/td><td>928<\/td><td>857<\/td><td>775<\/td><\/tr><\/table>","qs":[{"k":"知","text":"〔実験〕で、ペットボトルの中が白くくもった理由として最も適するものはどれか。1つ選びなさい。","sel":["空気が圧縮されて温度が上がり、水蒸気が水滴に変わったから。","空気が膨張して温度が下がり、露点に達して水蒸気が水滴に変わったから。","空気が膨張して温度が下がり、水滴が水蒸気に変わったから。","空気が圧縮されて温度が下がり、露点に達して水蒸気が水滴に変わったから。"],"ans":[2],"kai":"栓をゆるめると中の空気が膨張して温度が下がる。温度が露点より下がると、空気中の水蒸気が線香の煙の粒を核にして水滴になり、白くくもる。"},{"k":"思","text":"〔観察〕で、吸着板の上面全体に大気圧によってはたらく力の大きさは何Nか。整数で答えなさい。","num":"1200","unit":"N","kai":"吸着板の面積は0.12m×0.10m＝0.012m²である。力の大きさは100000Pa×0.012m²＝1200Nである。"},{"k":"知","text":"日本付近の低気圧の中心付近における、地上付近の風のふき方と大気の動きについて述べたものとして最も適するものはどれか。1つ選びなさい。","sel":["中心から外へ時計回りにふき出し、中心付近では下降気流が生じている。","中心から外へ反時計回りにふき出し、中心付近では上昇気流が生じている。","中心に向かって時計回りにふきこみ、中心付近では下降気流が生じている。","中心に向かって反時計回りにふきこみ、中心付近では上昇気流が生じている。"],"ans":[4],"kai":"北半球の低気圧では、地上付近の風は中心に向かって反時計回りにふきこむ。集まった空気は中心付近で上昇気流となる。"},{"k":"思","text":"アネロイド気圧計を持って、表の地点Aから地点Dまで登った。地点Dでの空ごうの厚みと、そのしくみについて述べたものとして最も適するものはどれか。1つ選びなさい。","sel":["まわりの気圧が低くなるので、空ごうを外から押す力が小さくなり、空ごうの厚みは地点Aより増加する。","まわりの気圧が低くなるので、空ごうを外から押す力が大きくなり、空ごうの厚みは地点Aより減少する。","まわりの気圧が高くなるので、空ごうを外から押す力が大きくなり、空ごうの厚みは地点Aより減少する。","まわりの気圧が高くなるので、空ごうを外から押す力が小さくなり、空ごうの厚みは地点Aより増加する。"],"ans":[1],"kai":"表より地点Dの気圧は地点Aより235hPa低い。空ごうを外から押す力が小さくなるので、空ごうはふくらんで厚みが増加する。"}]},{"id":"saitama_r8-d2","src":"埼玉県 2026年 大問3","kind":"dai","field":"生物","grade":2,"topic":"蒸散のはたらき","ctx":"<p class=\"lead\">葉の枚数と大きさ、茎の太さと長さがほぼ同じアジサイの枝E〜Hを用意し、次のようにワセリンを塗った。ワセリンは水や水蒸気を通さない。<\/p><p class=\"lead\">E：すべての葉の表側に塗る　F：すべての葉の裏側に塗る　G：すべての葉の表側と裏側に塗る　H：塗らない<\/p><p class=\"lead\">同じ量の水を入れた4本の試験管にE〜Hを1本ずつさし、水面に少量の油を注いだ。明るく風通しのよい場所に4時間置き、水の減少量を調べた結果が表である。ただし、水の減少量は、枝から蒸散した水の量と等しいものとする。<\/p><table><caption>表　水の減少量<\/caption><tr><th>枝<\/th><th>E<\/th><th>F<\/th><th>G<\/th><th>H<\/th><\/tr><tr><th>水の減少量〔g〕<\/th><td>4.8<\/td><td>2.0<\/td><td>0.6<\/td><td>6.2<\/td><\/tr><\/table>","qs":[{"k":"知","text":"葉の表皮を顕微鏡で観察すると、2つの三日月形の細胞に囲まれたすきまが見られる。この三日月形の細胞とすきまの名称の組み合わせとして最も適するものはどれか。1つ選びなさい。","sel":["三日月形の細胞…表皮細胞　すきま…気孔","三日月形の細胞…孔辺細胞　すきま…道管","三日月形の細胞…孔辺細胞　すきま…気孔","三日月形の細胞…さく状組織　すきま…気孔"],"ans":[3],"kai":"2つの三日月形の細胞は孔辺細胞で、その間のすきまを気孔という。蒸散では、水蒸気が主に気孔から出ていく。"},{"k":"思","text":"表から、アジサイの枝Hで、すべての葉の裏側から蒸散した水の量は何gと考えられるか。小数第1位まで答えなさい。","num":"4.2","unit":"g","kai":"Fは裏側以外（表側と葉以外）、Hはすべての部分から蒸散している。裏側からの量は6.2g−2.0g＝4.2gで、E−Gの4.8g−0.6g＝4.2gとも一致する。"},{"k":"思","text":"表から考えられることとして最も適するものはどれか。1つ選びなさい。","sel":["葉の表側からの蒸散量のほうが多く、葉以外の部分からは蒸散が行われていない。","葉の裏側からの蒸散量は表側の約2.4倍で、葉以外の部分からも蒸散が行われている。","葉の裏側からの蒸散量は表側の3倍で、葉以外の部分からは蒸散が行われていない。","葉の表側と裏側の蒸散量はほぼ等しく、葉以外の部分からも蒸散が行われている。","葉の裏側からの蒸散量は表側の3倍で、葉以外の部分からも蒸散が行われている。"],"ans":[5],"kai":"表側は2.0g−0.6g＝1.4g、裏側は4.2gで、裏側は表側の3倍である。すべての葉に塗ったGでも0.6g減っているので、茎など葉以外の部分からも蒸散している。"},{"k":"思","text":"蒸散と光合成について述べた文として正しいものはどれか。<b>すべて<\/b>選びなさい。","sel":["光合成に使われる二酸化炭素は、主に根から吸収される。","蒸散がさかんになると、根からの吸水もさかんになる。","気孔は蒸散を行うときだけ開き、光合成を行うときは閉じている。","根から吸い上げられた水の一部は、光合成の材料として使われる。","根から吸い上げられた水は、師管を通って葉まで運ばれる。"],"ans":[2,4],"multi":true,"kai":"蒸散で葉から水が出ていくと、根からの吸水がさかんになり、その水の一部は光合成の材料になる。二酸化炭素は気孔から取り入れ、水は道管を通る。"}]},{"id":"saitama_r8-d3","src":"埼玉県 2026年 大問4","kind":"dai","field":"化学","grade":3,"topic":"中和とイオン","ctx":"<p class=\"lead\">6本の試験管P〜Uに、同じ濃度の水酸化ナトリウム水溶液を4.0cm³ずつ入れ、BTB溶液を数滴加えた。次に、同じ濃度のうすい塩酸を、Pには加えず、Q〜Uには表の体積だけ加えてよく混ぜ、水溶液の色を調べた。表はその結果である。<\/p><table><caption>表　結果<\/caption><tr><th>試験管<\/th><th>P<\/th><th>Q<\/th><th>R<\/th><th>S<\/th><th>T<\/th><th>U<\/th><\/tr><tr><th>加えた塩酸〔cm³〕<\/th><td>0<\/td><td>2.0<\/td><td>4.0<\/td><td>6.0<\/td><td>8.0<\/td><td>10.0<\/td><\/tr><tr><th>水溶液の色<\/th><td>青<\/td><td>青<\/td><td>青<\/td><td>緑<\/td><td>黄<\/td><td>黄<\/td><\/tr><\/table>","qs":[{"k":"知","text":"BTB溶液を加えたとき、試験管T、Uの水溶液と同じ色を示す水溶液はどれか。最も適するものを1つ選びなさい。","sel":["石灰水","アンモニア水","食塩水","炭酸水","砂糖水"],"ans":[4],"kai":"T、Uは塩酸が余って酸性になり黄色を示した。炭酸水は酸性なので黄色を示す。"},{"k":"思","text":"加えた塩酸の体積と、試験管の水溶液中の水素イオンの数の関係について述べたものとして最も適するものはどれか。1つ選びなさい。","sel":["6.0cm³までは水溶液中にほとんど存在せず、6.0cm³より多くなると増えていく。","加えた塩酸の体積に比例して増えていく。","加えた塩酸の体積にかかわらず、一定である。","6.0cm³までは減っていき、6.0cm³より多くなると水溶液中にほとんど存在しなくなる。"],"ans":[1],"kai":"Sで緑色になったので、6.0cm³までは加えたH⁺がOH⁻と結びついて水になり、水溶液中にほとんど残らない。6.0cm³をこえると中和する相手がなく、H⁺は増えていく。"},{"k":"思","text":"表について述べた文として<b>誤っているもの<\/b>はどれか。1つ選びなさい。","sel":["試験管P、Q、Rの水溶液に赤色リトマス紙をつけると、青色に変わる。","試験管Sの水溶液を蒸発させると、白色の結晶が残る。","試験管Rの水溶液では、水酸化物イオンの数がナトリウムイオンの数より多い。","試験管T、Uの水溶液にマグネシウムリボンを入れると、気体が発生する。"],"ans":[3],"kai":"ナトリウムイオンの数は加えた塩酸の量によらず一定だが、水酸化物イオンは中和で減る。Rでは一部が中和されているので、水酸化物イオンはナトリウムイオンより少ない。"},{"k":"思","text":"この実験と {"k":"思","text":"モーターを使って、質量3.0kgの物体を一定の速さで0.80mの高さまで4.0秒かけて真上に持ち上げた。このときのモーターの仕事率は何Wか。整数で答えなさい。ただし、質量100gの物体にはたらく重力の大きさを1Nとする。","num":"6","unit":"W","kai":"物体にはたらく重力は30Nで、仕事は30N×0.80m＝24Jである。仕事率は24J÷4.0s＝6Wである。"}]},{"id":"saitama_r8-s2","src":"埼玉県 2026年 大問1","kind":"sho","field":"物理","grade":2,"topic":"電流計と電圧計のつなぎ方","ctx":"","qs":[{"k":"知","text":"電熱線に流れる電流と、電熱線に加わる電圧を同時にはかる。電流計と電圧計のつなぎ方として最も適するものはどれか。1つ選びなさい。","sel":["電流計も電圧計も、電熱線に直列につなぐ。","電流計は電熱線に並列に、電圧計は電熱線に直列につなぐ。","電流計は電熱線に直列に、電圧計は電熱線に並列につなぐ。","電流計も電圧計も、電熱線に並列につなぐ。"],"ans":[3],"kai":"電流計ははかりたい部分に流れる電流がすべて通るように直列につなぐ。電圧計ははかりたい部分の両端に並列につなぐ。"}]},{"id":"saitama_r8-s3","src":"埼玉県 2026年 大問1","kind":"sho","field":"化学","grade":2,"topic":"気体の発生","ctx":"","qs":[{"k":"知","text":"水を電気分解したとき、陰極に発生する気体と同じ気体が発生する操作はどれか。最も適するものを1つ選びなさい。","sel":["石灰石にうすい塩酸を加える。","二酸化マンガンにうすい過酸化水素水を加える。","塩化アンモニウムと水酸化カルシウムの混合物を加熱する。","亜鉛にうすい塩酸を加える。"],"ans":[4],"kai":"水の電気分解で陰極に発生するのは水素である。亜鉛にうすい塩酸を加えると水素が発生する。"}]},{"id":"saitama_r8-s4","src":"埼玉県 2026年 大問1","kind":"sho","field":"化学","grade":1,"topic":"アンモニアの性質","ctx":"","qs":[{"k":"知","text":"アンモニアを集める方法と、その方法を用いる理由の組み合わせとして最も適するものはどれか。1つ選びなさい。","sel":["水上置換法…水にとけにくいから。","上方置換法…水にとけやすく、空気より密度が小さいから。","下方置換法…水にとけやすく、空気より密度が大きいから。","上方置換法…水にとけにくく、空気より密度が小さいから。"],"ans":[2],"kai":"アンモニアは水に非常にとけやすいので水上置換法は使えない。空気より密度が小さいので上方置換法で集める。"}]},{"id":"saitama_r8-s5","src":"埼玉県 2026年 大問1","kind":"sho","field":"生物","grade":1,"topic":"動物の分類","ctx":"","qs":[{"k":"知","text":"は虫類と鳥類に共通する特徴として最も適するものはどれか。1つ選びなさい。","sel":["殻のある卵を陸上に産む。","体表が羽毛でおおわれている。","まわりの温度が変化しても体温がほぼ一定に保たれる。","子は水中でえらで呼吸する。"],"ans":[1],"kai":"は虫類も鳥類も、乾燥にたえる殻のある卵を陸上に産む卵生である。羽毛と恒温は鳥類だけ、子がえらで呼吸するのは両生類の特徴である。"}]},{"id":"saitama_r8-s6","src":"埼玉県 2026年 大問1","kind":"sho","field":"生物","grade":3,"topic":"染色体と生殖細胞","ctx":"","qs":[{"k":"思","text":"ある被子植物の体細胞1個にふくまれる染色体の数は24本である。この植物の卵細胞1個にふくまれる染色体の数は何本か。整数で答えなさい。","num":"12","unit":"本","kai":"卵細胞などの生殖細胞は減数分裂でつくられるので、染色体の数は体細胞の半分になる。24÷2＝12本である。"}]},{"id":"saitama_r8-s7","src":"埼玉県 2026年 大問1","kind":"sho","field":"地学","grade":1,"topic":"火山灰にふくまれる鉱物","ctx":"","qs":[{"k":"知","text":"火山灰にふくまれる鉱物のうち、黒色または褐色で、うすくはがれる板状の形をした鉱物はどれか。最も適するものを1つ選びなさい。","sel":["長石","石英","黒雲母","カンラン石","輝石"],"ans":[3],"kai":"黒雲母は黒色〜褐色で、板状でうすくはがれる性質がある。石英と長石は無色や白色、カンラン石は黄緑色、輝石は緑色〜褐色の短い柱状である。"}]},{"id":"saitama_r8-s8","src":"埼玉県 2026年 大問1","kind":"sho","field":"地学","grade":3,"topic":"銀河系","ctx":"","qs":[{"k":"知","text":"夜空に見られる天の川について述べたものとして最も適するものはどれか。1つ選びなさい。","sel":["太陽系の惑星が、太陽のまわりに帯状に集まって見えているものである。","太陽をふくむ銀河系の恒星の集まりを、銀河系の内側から見たものである。","銀河系の外にある別の銀河が、帯状に見えているものである。","地球の大気中の水蒸気が、月の光を反射して帯状に見えているものである。"],"ans":[2],"kai":"太陽系は円盤状の銀河系の中にあり、円盤の方向を見ると多くの恒星が重なって帯状に見える。これが天の川で、銀河系の外にある別の銀河ではない。"}]},{"id":"saitama_r8tui-d1","src":"埼玉県 2026年（追検査） 大問2","kind":"dai","field":"地学","grade":3,"topic":"地球の公転と季節","ctx":"<p class=\"lead\">図は、太陽のまわりを公転する地球と、天球上の太陽の通り道付近にある4つの星座の位置を、地球の北極側から見て模式的に表したものである。Aは、日本で夏至の日の地球の位置である。地球の地軸は、公転面に垂直な方向に対して23.4°傾いている。<\/p><figure><svg viewBox=\"0 0 480 330\" font-family=\"sans-serif\" font-size=\"15\"><ellipse cx=\"240\" cy=\"165\" rx=\"135\" ry=\"95\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.5\"/><circle cx=\"240\" cy=\"165\" r=\"18\" fill=\"#ddd\" stroke=\"#000\"/><text x=\"240\" y=\"207\" text-anchor=\"middle\">太陽<\/text><circle cx=\"105\" cy=\"165\" r=\"9\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.5\"/><circle cx=\"240\" cy=\"260\" r=\"9\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.5\"/><circle cx=\"375\" cy=\"165\" r=\"9\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.5\"/><circle cx=\"240\" cy=\"70\" r=\"9\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.5\"/><text x=\"90\" y=\"150\" text-anchor=\"end\">A<\/text><text x=\"258\" y=\"257\">B<\/text><text x=\"390\" y=\"150\">C<\/text><text x=\"258\" y=\"66\">D<\/text><text x=\"12\" y=\"171\">いて座<\/text><text x=\"468\" y=\"171\" text-anchor=\"end\">ふたご座<\/text><text x=\"240\" y=\"28\" text-anchor=\"middle\">おとめ座<\/text><text x=\"240\" y=\"320\" text-anchor=\"middle\">うお座<\/text><polygon points=\"345,226 339.5,236.9 332.5,227.1\" fill=\"#000\"/><text x=\"345\" y=\"262\">公転の向き<\/text><\/svg><figcaption>図　地球の公転と星座（北極側から見た模式図）<\/figcaption><\/figure><p class=\"lead\">北緯35°の地点Pで、1年のうちの6日（ア〜カ）について、日の出と日の入りの時刻を調べ、表にまとめた。また、北緯43°の地点Qと地点Pに、真南に向けて太陽光パネルを設置することを考えた。<\/p><table><caption>表　地点Pの日の出と日の入りの時刻<\/caption><tr><th>日<\/th><th>ア<\/th><th>イ<\/th><th>ウ<\/th><th>エ<\/th><th>オ<\/th><th>カ<\/th><\/tr><tr><th>日の出<\/th><td>6時20分<\/td><td>5時00分<\/td><td>6時40分<\/td><td>5時25分<\/td><td>4時30分<\/td><td>5時55分<\/td><\/tr><tr><th>日の入り<\/th><td>17時10分<\/td><td>18時40分<\/td><td>16時35分<\/td><td>18時15分<\/td><td>19時00分<\/td><td>17時25分<\/td><\/tr><\/table>","qs":[{"k":"思","text":"地球が図のDの位置にあるとき、地点Pで真夜中に南の空に見える星座はどれか。最も適するものを1つ選びなさい。","sel":["うお座","いて座","おとめ座","ふたご座"],"ans":[3],"kai":"真夜中に南の空に見えるのは、地球から見て太陽と反対の方向にある星座である。Dの位置の地球から見て太陽と反対の方向にあるのはおとめ座である。"},{"k":"思","text":"地点Pにおける夏至の日の太陽の南中高度は何度か。小数第1位まで答えなさい。","num":"78.4","unit":"°","kai":"夏至の日の南中高度は、90°−緯度＋23.4°で求められる。90−35＋23.4＝78.4より、78.4°である。"},{"k":"思","text":"表のア〜カの日のうち、地点Pで日の入りの位置が真西より北寄りになる日をすべて選びなさい。","sel":["ア","イ","ウ","エ","オ","カ"],"ans":[2,4,5],"multi":true,"fix":true,"kai":"日の入りの位置が真西より北寄りになるのは、春分から秋分までの、昼の長さが12時間より長い日である。昼の長さはアが10時間50分、イが13時間40分、ウが9時間55分、エが12時間50分、オが14時間30分、カが11時間30分なので、イ・エ・オである。"},{"k":"思","text":"同じ日の正午に、太陽の光がパネルの面にできるだけ垂直に当たるようにしたい。地点Qと地点Pでのパネルの地面に対する傾きについて述べたものとして最も適するものはどれか。1つ選びなさい。","sel":["地点Qは地点Pより緯度が高く、太陽の南中高度が高いので、パネルの傾きを地点Pより大きくする。","地点Qは地点Pより緯度が高く、太陽の南中高度が低いので、パネルの傾きを地点Pより大きくする。","地点Qは地点Pより緯度が高く、太陽の南中高度が低いので、パネルの傾きを地点Pより小さくする。","地点Qは地点Pより緯度が高く、太陽の南中高度が高いので、パネルの傾きを地点Pより小さくする。"],"ans":[2],"kai":"同じ日の南中高度は、緯度が高いほど低くなる。太陽の高度が低いほど光は地面に対して斜めに当たるので、パネルを大きく傾けると光が垂直に近い角度で当たる。"}]},{"id":"saitama_r8tui-d2","src":"埼玉県 2026年（追検査） 大問3","kind":"dai","field":"生物","grade":3,"topic":"生態系と炭素の循環","ctx":"<p class=\"lead\">図１は、ある生態系における炭素の流れを矢印で模式的に表したものである。<\/p><figure><svg viewBox=\"0 0 500 310\" font-family=\"sans-serif\" font-size=\"15\"><defs><marker id=\"ah\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#000\"/><\/marker><\/defs><rect x=\"20\" y=\"10\" width=\"450\" height=\"36\" fill=\"#fff\" stroke=\"#000\"/><text x=\"245\" y=\"34\" text-anchor=\"middle\">大気中の二酸化炭素<\/text><rect x=\"20\" y=\"130\" width=\"110\" height=\"36\" fill=\"#fff\" stroke=\"#000\"/><text x=\"75\" y=\"154\" text-anchor=\"middle\">植物<\/text><rect x=\"195\" y=\"130\" width=\"110\" height=\"36\" fill=\"#fff\" stroke=\"#000\"/><text x=\"250\" y=\"154\" text-anchor=\"middle\">草食動物<\/text><rect x=\"350\" y=\"130\" width=\"110\" height=\"36\" fill=\"#fff\" stroke=\"#000\"/><text x=\"405\" y=\"154\" text-anchor=\"middle\">肉食動物<\/text><rect x=\"195\" y=\"245\" width=\"110\" height=\"36\" fill=\"#fff\" stroke=\"#000\"/><text x=\"250\" y=\"269\" text-anchor=\"middle\">分解者<\/text><g stroke=\"#000\" stroke-width=\"1.5\" fill=\"none\"><line x1=\"55\" y1=\"46\" x2=\"55\" y2=\"127\" marker-end=\"url(#ah)\"/><line x1=\"95\" y1=\"130\" x2=\"95\" y2=\"49\" marker-end=\"url(#ah)\"/><line x1=\"130\" y1=\"148\" x2=\"192\" y2=\"148\" marker-end=\"url(#ah)\"/><line x1=\"250\" y1=\"130\" x2=\"250\" y2=\"49\" marker-end=\"url(#ah)\"/><line x1=\"305\" y1=\"148\" x2=\"347\" y2=\"148\" marker-end=\"url(#ah)\"/><line x1=\"405\" y1=\"130\" x2=\"405\" y2=\"49\" marker-end=\"url(#ah)\"/><line x1=\"75\" y1=\"166\" x2=\"193\" y2=\"253\" marker-end=\"url(#ah)\"/><line x1=\"250\" y1=\"166\" x2=\"250\" y2=\"242\" marker-end=\"url(#ah)\"/><line x1=\"405\" y1=\"166\" x2=\"307\" y2=\"253\" marker-end=\"url(#ah)\"/><polyline points=\"305,272 485,272 485,28 473,28\" marker-end=\"url(#ah)\"/><\/g><text x=\"38\" y=\"94\" text-anchor=\"middle\">①<\/text><text x=\"112\" y=\"94\" text-anchor=\"middle\">②<\/text><text x=\"161\" y=\"140\" text-anchor=\"middle\">③<\/text><text x=\"422\" y=\"94\" text-anchor=\"middle\">④<\/text><text x=\"372\" y=\"226\" text-anchor=\"middle\">⑤<\/text><text x=\"395\" y=\"296\" text-anchor=\"middle\">⑥<\/text><\/svg><figcaption>図１　生態系における炭素の流れ<\/figcaption><\/figure><p class=\"lead\">図２は、ある島で、草食動物のシカと、シカを食べる肉食動物のオオカミの個体数を調べた結果である。<\/p><figure><svg viewBox=\"0 0 480 320\" font-family=\"sans-serif\" font-size=\"15\"><line x1=\"70\" y1=\"60\" x2=\"410\" y2=\"60\" stroke=\"#bbb\" stroke-dasharray=\"3 3\"/><line x1=\"70\" y1=\"120\" x2=\"410\" y2=\"120\" stroke=\"#bbb\" stroke-dasharray=\"3 3\"/><line x1=\"70\" y1=\"180\" x2=\"410\" y2=\"180\" stroke=\"#bbb\" stroke-dasharray=\"3 3\"/><line x1=\"138\" y1=\"60\" x2=\"138\" y2=\"240\" stroke=\"#bbb\" stroke-dasharray=\"3 3\"/><line x1=\"206\" y1=\"60\" x2=\"206\" y2=\"240\" stroke=\"#bbb\" stroke-dasharray=\"3 3\"/><line x1=\"274\" y1=\"60\" x2=\"274\" y2=\"240\" stroke=\"#bbb\" stroke-dasharray=\"3 3\"/><line x1=\"342\" y1=\"60\" x2=\"342\" y2=\"240\" stroke=\"#bbb\" stroke-dasharray=\"3 3\"/><line x1=\"410\" y1=\"60\" x2=\"410\" y2=\"240\" stroke=\"#bbb\" stroke-dasharray=\"3 3\"/><rect x=\"70\" y=\"60\" width=\"340\" height=\"180\" fill=\"none\" stroke=\"#000\"/><text x=\"62\" y=\"245\" text-anchor=\"end\">0<\/text><text x=\"62\" y=\"185\" text-anchor=\"end\">4<\/text><text x=\"62\" y=\"125\" text-anchor=\"end\">8<\/text><text x=\"62\" y=\"65\" text-anchor=\"end\">12<\/text><text x=\"418\" y=\"245\">0<\/text><text x=\"418\" y=\"185\">10<\/text><text x=\"418\" y=\"125\">20<\/text><text x=\"418\" y=\"65\">30<\/text><text x=\"70\" y=\"260\" text-anchor=\"middle\">0<\/text><text x=\"138\" y=\"260\" text-anchor=\"middle\">2<\/text><text x=\"206\" y=\"260\" text-anchor=\"middle\">4<\/text><text x=\"274\" y=\"260\" text-anchor=\"middle\">6<\/text><text x=\"342\" y=\"260\" text-anchor=\"middle\">8<\/text><text x=\"410\" y=\"260\" text-anchor=\"middle\">10<\/text><text x=\"20\" y=\"40\">シカ〔百頭〕<\/text><text x=\"470\" y=\"40\" text-anchor=\"end\">オオカミ〔頭〕<\/text><text x=\"240\" y=\"282\" text-anchor=\"middle\">調査を始めてからの年数〔年〕<\/text><polyline points=\"70,180 104,120 138,60 172,120 206,180 240,180 274,120 308,60 342,120 376,180 410,180\" fill=\"none\" stroke=\"#000\" stroke-width=\"2.5\"/><polyline points=\"70,180 104,180 138,120 172,60 206,120 240,180 274,180 308,120 342,60 376,120 410,180\" fill=\"none\" stroke=\"#555\" stroke-width=\"2.5\" stroke-dasharray=\"8 5\"/><line x1=\"110\" y1=\"303\" x2=\"145\" y2=\"303\" stroke=\"#000\" stroke-width=\"2.5\"/><text x=\"152\" y=\"308\">シカ<\/text><line x1=\"250\" y1=\"303\" x2=\"285\" y2=\"303\" stroke=\"#555\" stroke-width=\"2.5\" stroke-dasharray=\"8 5\"/><text x=\"292\" y=\"308\">オオカミ<\/text><\/svg><figcaption>図２　シカとオオカミの個体数の変化<\/figcaption><\/figure><p class=\"lead\">表１は、ある観測地点での大気中の二酸化炭素濃度の、ある年の2か月ごとの月平均値である。表２は、同じ地点での年平均値である。<\/p><table><caption>表１　二酸化炭素濃度の月平均値〔ppm〕<\/caption><tr><th>月<\/th><th>1月<\/th><th>3月<\/th><th>5月<\/th><th>7月<\/th><th>9月<\/th><th>11月<\/th><\/tr><tr><th>濃度<\/th><td>421.0<\/td><td>423.4<\/td><td>424.6<\/td><td>418.2<\/td><td>414.8<\/td><td>418.6<\/td><\/tr><\/table><table><caption>表２　二酸化炭素濃度の年平均値〔ppm〕<\/caption><tr><th>年<\/th><th>2014年<\/th><th>2022年<\/th><\/tr><tr><th>濃度<\/th><td>398.0<\/td><td>417.2<\/td><\/tr><\/table>","qs":[{"k":"思","text":"図１の①〜⑥のうち、炭素が有機物として移動している流れを表すものをすべて選びなさい。","sel":["①","②","③","④","⑤","⑥"],"ans":[3,5],"multi":true,"fix":true,"kai":"①は光合成による二酸化炭素の吸収、②・④・⑥は呼吸による二酸化炭素の放出で、炭素は気体として移動する。③は食べる・食べられるの関係、⑤は死がいやふんの分解者への移動で、炭素は有機物として移動する。"},{"k":"思","text":"図２から読みとれることとして正しいものをすべて選びなさい。","sel":["シカの個体数は年々減少している。","シカの個体数が増えたあと、少しおくれてオオカミの個体数が増えている。","オオカミの個体数が最も多い年に、シカの個体数も最も多い。","シカとオオカミの個体数は、どちらも増減をくり返している。","オオカミの個体数の最大値は、およそ300頭である。"],"ans":[2,4],"multi":true,"kai":"シカは2年目と7年目、オオカミは1年おくれの3年目と8年目に最大になり、どちらも増減をくり返している。オオカミの最大値は右の目盛りで30頭である。"},{"k":"思","text":"表１で、5月から9月にかけて二酸化炭素濃度が低下している理由として最も適するものはどれか。1つ選びなさい。","sel":["夏は生物の呼吸がさかんになり、大気中に放出される二酸化炭素の量が多くなるから。","夏は分解者のはたらきがさかんになり、分解者が二酸化炭素を吸収する量が多くなるから。","夏は植物が光合成をほとんど行わなくなり、二酸化炭素を吸収しなくなるから。","夏は植物の光合成がさかんになり、植物が吸収する二酸化炭素の量が、生物が放出する量より多くなるから。"],"ans":[4],"kai":"夏は日光が強く植物がよく育つので、光合成による二酸化炭素の吸収量が、呼吸などによる放出量を上回る。そのため大気中の濃度が下がる。"},{"k":"思","text":"表２で、2014年から2022年までの間、二酸化炭素濃度の年平均値は1年あたり平均何ppmずつ増加したか。小数第1位まで答えなさい。","num":"2.4","unit":"ppm","kai":"8年間で417.2−398.0＝19.2ppm増加している。19.2÷8＝2.4より、1年あたり2.4ppmである。"}]},{"id":"saitama_r8tui-d3","src":"埼玉県 2026年（追検査） 大問4","kind":"dai","field":"化学","grade":1,"topic":"溶解度と再結晶・質量パーセント濃度","ctx":"<p class=\"lead\">〔実験〕 試験管Xと試験管Yに20℃の水を10.0gずつ入れ、Xにはミョウバンを4.0g、Yには塩化ナトリウムを4.0g加えてよく振ったところ、どちらも溶け残った。次に、X、Yを60℃の湯で湯せんしながらよく振ると、Xはすべて溶けたが、Yは溶け残った。その後、X、Yを20℃までゆっくり冷やした。ただし、水の蒸発は考えないものとする。表は、100gの水に溶ける物質の質量（溶解度）である。<\/p><table><caption>表　100gの水に溶ける物質の質量〔g〕<\/caption><tr><th>水の温度〔℃〕<\/th><th>0<\/th><th>20<\/th><th>40<\/th><th>60<\/th><\/tr><tr><th>ミョウバン<\/th><td>5.7<\/td><td>11.4<\/td><td>23.8<\/td><td>57.4<\/td><\/tr><tr><th>塩化ナトリウム<\/th><td>35.7<\/td><td>35.8<\/td><td>36.3<\/td><td>37.1<\/td><\/tr><\/table><p class=\"lead\">〔調べたこと〕 粉末を水に溶かしてつくる飲み物がある。この粉末30gを水500gにすべて溶かして飲み物をつくった。<\/p>","qs":[{"k":"思","text":"〔実験〕の結果と表について述べたものとして最も適するものはどれか。1つ選びなさい。","sel":["Xを冷やすと結晶が出てきたのは、温度が下がるとミョウバンの溶解度が大きくなるからである。","Yが60℃でも溶け残ったのは、塩化ナトリウムの溶解度が温度によってほとんど変わらず、60℃の水10.0gには約3.7gしか溶けないからである。","塩化ナトリウムは、水溶液の温度を下げて結晶をとり出す方法に適している。","Xが60℃ですべて溶けたのは、ミョウバンが水と反応して別の物質に変わったからである。"],"ans":[2],"kai":"塩化ナトリウムの溶解度は温度でほとんど変わらず、60℃の水10.0gには3.71gしか溶けないので、4.0gは溶けきらない。ミョウバンは温度が下がると溶解度が小さくなるので、冷やすと結晶が出てくる。"},{"k":"思","text":"〔実験〕で、試験管Xを20℃まで冷やしたときに出てくるミョウバンの結晶は何gか。小数第2位まで答えなさい。","num":"2.86","unit":"g","kai":"20℃の水10.0gに溶けるミョウバンは11.4×10.0÷100＝1.14gである。4.0−1.14＝2.86gが結晶として出てくる。"},{"k":"知","text":"〔実験〕で、試験管を直接ガスバーナーで加熱せず湯せんで温める理由として<b>誤っているもの<\/b>はどれか。1つ選びなさい。","sel":["試験管の中の水溶液全体を、ゆっくり均一に温めることができるから。","急に沸騰したり試験管が割れたりする危険を減らせるから。","水溶液の温度を、短い時間で100℃より高くすることができるから。","水溶液の温度が湯の温度より高くならず、温度を調節しやすいから。"],"ans":[3],"kai":"湯せんでは水溶液の温度は湯の温度より高くならないので、100℃より高くすることはできない。ゆっくり均一に温められ、安全に温度を調節できるのが湯せんの利点である。"},{"k":"思","text":"〔調べたこと〕でつくった飲み物の質量パーセント濃度は何％か。小数第2位を四捨五入して小数第1位まで答えなさい。","num":"5.7","unit":"％","kai":"溶液の質量は溶質と溶媒の質量の和なので、30＋500＝530gである。30÷530×100＝5.66…より、5.7％である。"}]},{"id":"saitama_r8tui-d4","src":"埼玉県 2026年（追検査） 大問5","kind":"dai","field":"物理","grade":3,"topic":"静電気・陰極線・放射線","ctx":"<p class=\"lead\">〔実験１〕 ポリ塩化ビニルのパイプをティッシュペーパーで摩擦したところ、パイプは−の電気を帯びた。<\/p><p class=\"lead\">〔実験２〕 図のような、蛍光板と電極P、Qが入った放電管の両端に大きな電圧を加えたところ、蛍光板に明るいすじ（陰極線）がまっすぐに現れた。<\/p><figure><svg viewBox=\"0 0 480 225\" font-family=\"sans-serif\" font-size=\"15\"><rect x=\"40\" y=\"70\" width=\"400\" height=\"80\" rx=\"30\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\"/><line x1=\"58\" y1=\"92\" x2=\"58\" y2=\"128\" stroke=\"#000\" stroke-width=\"4\"/><line x1=\"422\" y1=\"92\" x2=\"422\" y2=\"128\" stroke=\"#000\" stroke-width=\"4\"/><text x=\"58\" y=\"180\" text-anchor=\"middle\">−極<\/text><text x=\"422\" y=\"180\" text-anchor=\"middle\">＋極<\/text><rect x=\"110\" y=\"111\" width=\"300\" height=\"6\" fill=\"#ccc\" stroke=\"#888\"/><line x1=\"70\" y1=\"110\" x2=\"410\" y2=\"110\" stroke=\"#000\" stroke-width=\"2\"/><line x1=\"160\" y1=\"22\" x2=\"160\" y2=\"92\" stroke=\"#000\" stroke-width=\"1.5\"/><line x1=\"142\" y1=\"92\" x2=\"178\" y2=\"92\" stroke=\"#000\" stroke-width=\"3\"/><line x1=\"160\" y1=\"198\" x2=\"160\" y2=\"128\" stroke=\"#000\" stroke-width=\"1.5\"/><line x1=\"142\" y1=\"128\" x2=\"178\" y2=\"128\" stroke=\"#000\" stroke-width=\"3\"/><text x=\"160\" y=\"17\" text-anchor=\"middle\">P<\/text><text x=\"160\" y=\"217\" text-anchor=\"middle\">Q<\/text><text x=\"300\" y=\"100\" text-anchor=\"middle\">陰極線<\/text><text x=\"330\" y=\"140\" text-anchor=\"middle\">蛍光板<\/text><\/svg><figcaption>図　放電管（電極P、Qには電圧を加えていない）<\/figcaption><\/figure><p class=\"lead\">〔調べたこと〕 X線は放射線の一種で、物質を通りぬける性質（透過性）をもつ。X線写真をとるときに使うフィルムは、X線が当たった部分ほど黒くなる。<\/p>","qs":[{"k":"知","text":"異なる物質を摩擦したときに、一方の物質から他方の物質へ移動する、−の電気をもった粒子はどれか。最も適するものを1つ選びなさい。","sel":["陽子","中性子","原子核","電子"],"ans":[4],"kai":"物質を摩擦すると、−の電気をもつ電子が一方の物質から他方の物質へ移動し、電子を受けとった方が−、失った方が＋の電気を帯びる。"},{"k":"思","text":"〔実験１〕と同じ方法で、パイプAとパイプBをそれぞれ別のティッシュペーパーで摩擦した。AとBを近づけたとき、AとAの摩擦に使ったティッシュペーパーを近づけたときに、それぞれはたらく力の組み合わせとして最も適するものはどれか。1つ選びなさい。","sel":["AとB：しりぞけ合う　Aとティッシュペーパー：引き合う","AとB：引き合う　Aとティッシュペーパー：しりぞけ合う","AとB：引き合う　Aとティッシュペーパー：引き合う","AとB：しりぞけ合う　Aとティッシュペーパー：しりぞけ合う"],"ans":[1],"kai":"AもBも−の電気を帯びるので、同じ種類の電気どうしでしりぞけ合う。摩擦に使ったティッシュペーパーはパイプと反対の＋の電気を帯びるので、Aと引き合う。"},{"k":"思","text":"〔実験２〕で、陰極線が現れている状態のまま、電極Pを電源の＋極に、電極Qを−極につないで電圧を加えた。陰極線の道すじはどうなるか。最も適するものを1つ選びなさい。","sel":["電極Q側（下）に曲がる。","曲がらずにまっすぐ進む。","電極P側（上）に曲がる。","−極側にもどるように折れ曲がる。"],"ans":[3],"kai":"陰極線は−の電気をもった電子の流れである。−の電気は＋極に引かれるので、陰極線は＋極につないだ電極Pの側に曲がる。"},{"k":"思","text":"〔調べたこと〕のフィルムを使って手のX線写真をとると、骨は筋肉より白くうつる。その理由として最も適するものはどれか。1つ選びなさい。","sel":["骨は筋肉よりX線を透過しやすく、骨の後ろのフィルムに届くX線が多いから。","骨は筋肉よりX線を透過しにくく、骨の後ろのフィルムに届くX線が少ないから。","骨はX線を受けると自らX線を出し、骨の後ろのフィルムに届くX線が多くなるから。","骨は筋肉よりX線を透過しにくく、骨の後ろのフィルムに届くX線が多いから。"],"ans":[2],"kai":"フィルムはX線が当たった部分ほど黒くなる。骨はX線を透過しにくいので、骨の後ろのフィルムにはX線があまり届かず、白くうつる。"}]},{"id":"saitama_r8tui-s1","src":"埼玉県 2026年（追検査） 大問1","kind":"sho","field":"物理","grade":3,"topic":"記録タイマーと平均の速さ","ctx":"","qs":[{"k":"思","text":"1秒間に60回打点する記録タイマーを使って台車の運動を記録した。記録テープを6打点ごとに切ったところ、ある区間のテープの長さは4.8cmであった。この区間における台車の平均の速さは何cm/sか。整数で答えなさい。","num":"48","unit":"cm/s","kai":"6打点にかかる時間は6÷60＝0.1秒である。4.8cm÷0.1s＝48cm/sである。"}]},{"id":"saitama_r8tui-s2","src":"埼玉県 2026年（追検査） 大問1","kind":"sho","field":"物理","grade":1,"topic":"光の屈折","ctx":"","qs":[{"k":"知","text":"空気中から厚い直方体のガラスの面に斜めに光を当てたところ、光はガラスの中を通り、反対側の平行な面から空気中へ出た。ガラスから出ていく光について述べたものとして最も適するものはどれか。1つ選びなさい。","sel":["ガラスから空気中へ出るときは屈折せず、ガラスの中と同じ向きに進む。","ガラスから空気中へ出るときに屈折し、ガラスに入る前の光と平行な向きに進む。","ガラスから空気中へ出るときに屈折し、ガラスの面に垂直な向きに進む。","ガラスから空気中へ出るときにすべて反射し、空気中へは出ていかない。"],"ans":[2],"kai":"光は空気からガラスへ入るときと、ガラスから空気へ出るときの両方で屈折する。面が平行なので、出ていく光は入る前の光と平行になる。"}]},{"id":"saitama_r8tui-s3","src":"埼玉県 2026年（追検査） 大問1","kind":"sho","field":"化学","grade":2,"topic":"化学変化のモデル","ctx":"","qs":[{"k":"知","text":"炭素を空気中で燃焼させて二酸化炭素ができる化学変化を、原子のモデルで表したものとして最も適するものはどれか。ただし、●は炭素原子1個を、○は酸素原子1個を表す。1つ選びなさい。","sel":["●　＋　○　→　●○","●　＋　○○　→　●○　＋　○","●　＋　○○　→　○●○","●●　＋　○○　→　○●○"],"ans":[3],"kai":"酸素は酸素原子2個が結びついた分子として存在する。炭素原子1個と酸素分子1個から、二酸化炭素分子（炭素原子1個と酸素原子2個）が1個でき、原子の種類と数が反応の前後で等しい。"}]},{"id":"saitama_r8tui-s4","src":"埼玉県 2026年（追検査） 大問4","kind":"sho","field":"化学","grade":3,"topic":"電離のようす","ctx":"","qs":[{"k":"知","text":"塩化銅が水に溶けて電離するようすを、化学式とイオンの化学式で表したものとして最も適するものはどれか。1つ選びなさい。","sel":["CuCl₂ → Cu²⁺ ＋ 2Cl⁻","CuCl₂ → Cu⁺ ＋ Cl₂⁻","CuCl₂ → Cu²⁻ ＋ 2Cl⁺","CuCl₂ → Cu ＋ Cl₂"],"ans":[1],"kai":"塩化銅は水溶液中で、銅イオンCu²⁺と塩化物イオンCl⁻に分かれる。Cl⁻は2個できるので、＋と−の電気の量がつり合う。"}]},{"id":"saitama_r8tui-s5","src":"埼玉県 2026年（追検査） 大問1","kind":"sho","field":"生物","grade":2,"topic":"表面積を大きくするつくり","ctx":"","qs":[{"k":"知","text":"小腸の内側のかべにある柔毛は、表面積を大きくすることで養分を効率よく吸収している。これと同じように、表面積を大きくすることで物質のやりとりを効率よく行っているヒトのつくりはどれか。最も適するものを1つ選びなさい。","sel":["気管","心臓の弁","大動脈","肺胞"],"ans":[4],"kai":"肺は、小さな袋である肺胞がたくさん集まったつくりで、空気にふれる表面積が大きい。そのため酸素と二酸化炭素の交換を効率よく行うことができる。"}]},{"id":"saitama_r8tui-s6","src":"埼玉県 2026年（追検査） 大問1","kind":"sho","field":"生物","grade":1,"topic":"ルーペの使い方","ctx":"","qs":[{"k":"知","text":"手に持って動かせる花を、ルーペを使って観察するときの方法として最も適するものはどれか。1つ選びなさい。","sel":["ルーペを目に近づけて持ち、観察する花を前後に動かして、よく見える位置をさがす。","ルーペを花に近づけて持ち、顔を前後に動かして、よく見える位置をさがす。","ルーペを目から離して持ち、ルーペだけを前後に動かして、よく見える位置をさがす。","ルーペで太陽を見て明るさを確かめてから、花を観察する。"],"ans":[1],"kai":"ルーペは目に近づけて持ち、観察するものが動かせるときは観察するものを前後に動かしてピントを合わせる。ルーペで太陽を見ると目をいためるので、絶対に見てはいけない。"}]},{"id":"saitama_r8tui-s7","src":"埼玉県 2026年（追検査） 大問1","kind":"sho","field":"地学","grade":1,"topic":"地震の波の速さ","ctx":"<table><caption>表　地点X、Yでのゆれの記録<\/caption><tr><th>地点<\/th><th>震源からの距離<\/th><th>P波が届いた時刻<\/th><th>S波が届いた時刻<\/th><\/tr><tr><td>X<\/td><td>36km<\/td><td>10時15分06秒<\/td><td>10時15分09秒<\/td><\/tr><tr><td>Y<\/td><td>84km<\/td><td>10時15分14秒<\/td><td>10時15分21秒<\/td><\/tr><\/table>","qs":[{"k":"思","text":"表は、ある地震について、震源からの距離が異なる地点X、YでP波とS波が届いた時刻をまとめたものである。この地震のS波が伝わる速さは何km/sか。小数第1位まで答えなさい。ただし、地震の波が伝わる速さは一定とする。","num":"4.0","unit":"km/s","kai":"S波はXからYまでの84−36＝48kmを、21−9＝12秒で伝わっている。48÷12＝4.0km/sである。"}]},{"id":"saitama_r8tui-s8","src":"埼玉県 2026年（追検査） 大問1","kind":"sho","field":"地学","grade":2,"topic":"天気図の記号","ctx":"<figure><svg viewBox=\"0 0 260 220\" font-family=\"sans-serif\" font-size=\"15\"><circle cx=\"110\" cy=\"130\" r=\"18\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"2\"/><circle cx=\"110\" cy=\"130\" r=\"9\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"2\"/><g stroke=\"#000\" stroke-width=\"2\"><line x1=\"122.7\" y1=\"117.3\" x2=\"177.2\" y2=\"62.8\"/><line x1=\"177.2\" y1=\"62.8\" x2=\"188.5\" y2=\"74.1\"/><line x1=\"168.7\" y1=\"71.3\" x2=\"180\" y2=\"82.6\"/><line x1=\"160.2\" y1=\"79.8\" x2=\"171.5\" y2=\"91.1\"/><\/g><line x1=\"230\" y1=\"110\" x2=\"230\" y2=\"50\" stroke=\"#000\" stroke-width=\"1.5\"/><polygon points=\"230,42 224,56 236,56\" fill=\"#000\"/><text x=\"230\" y=\"34\" text-anchor=\"middle\">北<\/text><\/svg><figcaption>図　ある地点の天気図の記号<\/figcaption><\/figure>","qs":[{"k":"知","text":"図の天気図の記号が表す風向・風力・天気の組み合わせとして最も適するものはどれか。1つ選びなさい。","sel":["南西の風、風力3、くもり","北東の風、風力3、晴れ","北東の風、風力2、くもり","北東の風、風力3、くもり","南西の風、風力2、晴れ"],"ans":[4],"kai":"矢の向きは風がふいてくる方位を表し、北東に向いているので北東の風である。矢羽根の数が3本なので風力3、◎はくもりを表す。"}]},{"id":"akita_r8-d1","src":"秋田県 2026年 大問4","kind":"dai","field":"物理","grade":3,"topic":"斜面を下る台車の運動","ctx":"<p class=\"lead\">斜面を下る台車の運動を調べるため，次の実験1〜3を行った。斜面と台車の間の摩擦や空気の抵抗，記録タイマーと記録テープの間の摩擦は考えないものとする。実験1〜3では同じ斜面を用い，斜面には上から順に点P，点Q，点Rの印を付けてある。点Qは点Pと点Rのちょうど中間にある。<\/p><p class=\"lead\">〔実験1〕台車Xにばねばかりをつなぎ，ばねばかりを斜面に平行にして持って，台車Xを点P，点Q，点Rのそれぞれの位置で静止させ，ばねばかりの値p，q，rを読んだ。<br>〔実験2〕1秒間に60回打点する記録タイマーを用いて，斜面上で静かに手をはなした台車Xの運動を記録した。台車Xの前面が点Pを通過したときの打点から6打点ごとに記録テープを切り，順に①〜⑧とした。台車Xの前面は，テープ⑧の最後の打点のときに点Rを通過した。<br>〔実験3〕台車Xより質量が大きい台車Yを用いて，実験2と同じように記録した。<\/p><table><caption>表　実験2，3の各テープの長さ〔cm〕<\/caption><tr><th>テープ<\/th><th>①<\/th><th>②<\/th><th>③<\/th><th>④<\/th><th>⑤<\/th><th>⑥<\/th><th>⑦<\/th><th>⑧<\/th><\/tr><tr><th>台車X<\/th><td>8.0<\/td><td>10.0<\/td><td>12.0<\/td><td>14.0<\/td><td>16.0<\/td><td>18.0<\/td><td>20.0<\/td><td>22.0<\/td><\/tr><tr><th>台車Y<\/th><td>6.0<\/td><td>8.0<\/td><td>10.0<\/td><td>12.0<\/td><td>14.0<\/td><td>16.0<\/td><td>18.0<\/td><td>20.0<\/td><\/tr><\/table>","qs":[{"k":"知","text":"実験1で読んだばねばかりの値p，q，rの関係として最も適するものはどれか。最も適するものを1つ選びなさい。","sel":["p＞q＞r","r＞q＞p","p＝q＝r","q＞p＝r"],"ans":[3],"kai":"斜面の傾きが同じなら，台車にはたらく重力の斜面に平行な分力の大きさは斜面上のどの位置でも同じである。だから，ばねばかりの値はp＝q＝rになる。"},{"k":"思","text":"実験2で，台車Xの前面が点Pを通過してから点Rを通過するまでの平均の速さは何m/sか。小数第1位まで答えなさい。","num":"1.5","unit":"m/s","kai":"6打点は0.1秒なので，8本で0.8秒である。点Pから点Rまでの距離は8.0＋10.0＋…＋22.0＝120cm＝1.20mだから，1.20÷0.8＝1.5m/sである。"},{"k":"思","text":"実験2で，台車Xの前面が点Qを通過したのは，点Pを通過してから何秒後か。小数第1位まで答えなさい。","num":"0.5","unit":"秒","kai":"点Qは点Pから120cmの半分の60cmの位置にある。8.0＋10.0＋12.0＋14.0＋16.0＝60cmなので，テープ5本分の0.5秒後である。"},{"k":"思","text":"台車Xと台車Yの前面を点Pにそろえて並べ，同時に静かに手をはなしたところ，2台は点Q，点Rをそれぞれ同時に通過した。また，摩擦や空気の抵抗がない場合，物体の速さが変化する割合は物体の質量によらないことがわかっている。表で，台車Yの各テープが台車Xの同じ番号のテープより短い理由として最も適するものを1つ選びなさい。","sel":["台車Yは質量が大きいので，速さが変化する割合が台車Xより小さかったから。","台車Yは質量が大きいので，重力の斜面に平行な分力が台車Xより小さかったから。","台車Yをはなした位置が台車Xより点Pから遠く，点Pを通過するときの速さが台車Xより小さかったから。","台車Yをはなした位置が台車Xより点Pに近く，点Pを通過するときの速さが台車Xより小さかったから。"],"ans":[4],"kai":"表ではどちらのテープも0.1秒ごとに2.0cmずつ長くなっていて，速さが変化する割合は同じである。それでもYのテープが短いのは，Yが点Pを通過するときの速さが小さかったからで，Yは点Pに近い位置ではなされ，点Pまでに加速した時間が短かったと考えられる。"}]},{"id":"akita_r8-d2","src":"秋田県 2026年 大問2","kind":"dai","field":"化学","grade":2,"topic":"化学変化と質量の保存","ctx":"<p class=\"lead\">化学変化の前後で物質全体の質量が変わるかを調べるため，次の実験を行った。ただし，実験中の室温と気圧は一定であるものとする。<\/p><p class=\"lead\">〔実験〕丸底フラスコにマグネシウムの粉末1.20gを入れ，ゴム管とピンチコックで密閉して全体の質量をはかった。次に，丸底フラスコを加熱したところ，マグネシウムが激しく反応して白い物質ができた。丸底フラスコが冷えてから全体の質量をはかった。その後，ピンチコックを開くと，ゴム管を気体が通る音がした。音がしなくなってからピンチコックを閉じ，再び全体の質量をはかった。表はその結果である。<\/p><table><caption>表　実験の結果<\/caption><tr><th>加熱前の全体の質量〔g〕<\/th><td>268.40<\/td><\/tr><tr><th>加熱して冷えたあとの全体の質量〔g〕<\/th><td>268.40<\/td><\/tr><tr><th>ピンチコックを開いて閉じたあとの全体の質量〔g〕<\/th><td>268.60<\/td><\/tr><\/table><p class=\"lead\">資料：室温と気圧が一定のとき，同じ体積で比べると，酸素の質量は空気の質量の1.1倍である。また，マグネシウムと酸素は，いつも質量の比が3：2で結びつく。<\/p>","qs":[{"k":"知","text":"マグネシウムにあてはまるものはどれか。<b>すべて<\/b>選びなさい。","sel":["有機物","金属","非金属","無機物"],"ans":[2,4],"multi":true,"kai":"マグネシウムは電気をよく通し，みがくと光る金属である。炭素をふくむ有機物ではないので，無機物である。"},{"k":"知","text":"この実験でマグネシウムに起きた化学変化を表す化学反応式と，化学変化の前後で変化するものの組み合わせとして最も適するものを1つ選びなさい。","sel":["Mg＋O₂ → MgO₂，原子の組み合わせ","2Mg＋O₂ → 2MgO，原子の種類","Mg＋O → MgO，原子の数","2Mg＋O₂ → 2MgO，原子の数","2Mg＋O₂ → 2MgO，原子の組み合わせ"],"ans":[5],"kai":"酸素は分子O₂で，できる酸化マグネシウムはMgOなので，両辺の原子の数をそろえると2Mg＋O₂→2MgOとなる。化学変化では原子の種類と数は変わらず，原子の組み合わせが変わる。"},{"k":"思","text":"ピンチコックを開いて閉じたあとに全体の質量が増えた理由として最も適するものを1つ選びなさい。","sel":["加熱によってできた白い物質が，ゴム管から入った空気中の水蒸気と結びついたから。","マグネシウムと結びついた分だけフラスコ内の酸素が減り，減った分の体積の空気がフラスコに入ったから。","加熱によって膨張していたフラスコ内の気体が，ピンチコックを開いたときに外へ出たから。","フラスコ内に残っていたマグネシウムが，入ってきた空気中の酸素とすぐに結びついたから。"],"ans":[2],"kai":"フラスコ内の酸素の一部がマグネシウムと結びついて固体になったので，フラスコ内の気体が減った。ピンチコックを開くと，その分の空気が外から入ったので質量が増えた。"},{"k":"思","text":"この実験で酸素と反応したマグネシウムの質量は何gか。四捨五入して小数第2位まで答えなさい。","num":"0.33","unit":"g","kai":"入った空気は268.60−268.40＝0.20gで，これと同じ体積の酸素が反応したので，反応した酸素は0.20×1.1＝0.22gである。マグネシウムと酸素の質量の比は3：2だから，0.22×3÷2＝0.33gである。"}]},{"id":"akita_r8-d3","src":"秋田県 2026年 大問3","kind":"dai","field":"地学","grade":3,"topic":"金星と月の見え方","ctx":"<p class=\"lead\">3月1日から3月15日まで，毎日午前5時に東の空の金星と南の空の月を観察した。金星は望遠鏡でも観察した。<\/p><p class=\"lead\">・金星は地球型惑星である。観察した期間では，金星は細く欠けた形から少しずつ丸みを増し，見かけの大きさは少しずつ小さくなった。<br>・3月1日の月は南の空に見え，左側の半分が光っていた。<\/p><p class=\"lead\">図１は太陽と金星と地球の位置関係を，図２は地球と月の位置関係を表した模式図で，どちらも地球を静止させた状態で北極側から見たものである。<\/p><figure><svg viewBox=\"0 0 320 320\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\"><rect x=\"0\" y=\"0\" width=\"320\" height=\"320\" fill=\"#fff\"/><circle cx=\"160\" cy=\"150\" r=\"130\" fill=\"none\" stroke=\"#555\" stroke-width=\"1.5\"/><circle cx=\"160\" cy=\"150\" r=\"70\" fill=\"none\" stroke=\"#555\" stroke-width=\"1.5\"/><circle cx=\"160\" cy=\"150\" r=\"22\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"2\"/><text x=\"160\" y=\"156\" font-size=\"15\" text-anchor=\"middle\">太陽<\/text><circle cx=\"230\" cy=\"150\" r=\"7\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.5\"/><circle cx=\"160\" cy=\"80\" r=\"7\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.5\"/><circle cx=\"90\" cy=\"150\" r=\"7\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.5\"/><circle cx=\"160\" cy=\"220\" r=\"7\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.5\"/><text x=\"244\" y=\"156\" font-size=\"16\">A<\/text><text x=\"160\" y=\"66\" font-size=\"16\" text-anchor=\"middle\">B<\/text><text x=\"76\" y=\"156\" font-size=\"16\" text-anchor=\"end\">C<\/text><text x=\"174\" y=\"216\" font-size=\"16\">D<\/text><circle cx=\"160\" cy=\"280\" r=\"10\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"2\"/><text x=\"178\" y=\"302\" font-size=\"15\">地球<\/text><\/svg><figcaption>図１　太陽・金星・地球（内側の円は金星の公転軌道，外側の円は地球の公転軌道，A〜Dは金星の位置）<\/figcaption><\/figure><figure><svg viewBox=\"0 0 420 300\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\"><rect x=\"0\" y=\"0\" width=\"420\" height=\"300\" fill=\"#fff\"/><circle cx=\"170\" cy=\"150\" r=\"100\" fill=\"none\" stroke=\"#555\" stroke-width=\"1.5\"/><circle cx=\"170\" cy=\"150\" r=\"22\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"2\"/><text x=\"170\" y=\"156\" font-size=\"15\" text-anchor=\"middle\">地球<\/text><circle cx=\"270\" cy=\"150\" r=\"7\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.5\"/><circle cx=\"240.7\" cy=\"79.3\" r=\"7\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.5\"/><circle cx=\"170\" cy=\"50\" r=\"7\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.5\"/><circle cx=\"99.3\" cy=\"79.3\" r=\"7\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.5\"/><circle cx=\"70\" cy=\"150\" r=\"7\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.5\"/><circle cx=\"99.3\" cy=\"220.7\" r=\"7\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.5\"/><circle cx=\"170\" cy=\"250\" r=\"7\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.5\"/><circle cx=\"240.7\" cy=\"220.7\" r=\"7\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.5\"/><text x=\"284\" y=\"156\" font-size=\"16\">E<\/text><text x=\"254\" y=\"68\" font-size=\"16\">F<\/text><text x=\"170\" y=\"36\" font-size=\"16\" text-anchor=\"middle\">G<\/text><text x=\"86\" y=\"68\" font-size=\"16\" text-anchor=\"end\">H<\/text><text x=\"56\" y=\"156\" font-size=\"16\" text-anchor=\"end\">I<\/text><text x=\"86\" y=\"244\" font-size=\"16\" text-anchor=\"end\">J<\/text><text x=\"170\" y=\"280\" font-size=\"16\" text-anchor=\"middle\">K<\/text><text x=\"254\" y=\"244\" font-size=\"16\">L<\/text><g stroke=\"#000\" stroke-width=\"1.5\" fill=\"none\"><line x1=\"410\" y1=\"90\" x2=\"335\" y2=\"90\"/><polyline points=\"345,84 335,90 345,96\"/><line x1=\"410\" y1=\"130\" x2=\"335\" y2=\"130\"/><polyline points=\"345,124 335,130 345,136\"/><line x1=\"410\" y1=\"170\" x2=\"335\" y2=\"170\"/><polyline points=\"345,164 335,170 345,176\"/><line x1=\"410\" y1=\"210\" x2=\"335\" y2=\"210\"/><polyline points=\"345,204 335,210 345,216\"/><\/g><text x=\"372\" y=\"70\" font-size=\"15\" text-anchor=\"middle\">太陽の光<\/text><\/svg><figcaption>図２　地球と月（円は月の公転軌道，E〜Lは月の位置）<\/figcaption><\/figure>","qs":[{"k":"知","text":"地球型惑星の特徴として適するものはどれか。<b>すべて<\/b>選びなさい。","sel":["密度が大きい","主に気体でできている","環をもつ","表面が岩石でできている","半径が大きい"],"ans":[1,4],"multi":true,"kai":"地球型惑星は主に岩石や金属でできていて，半径は小さいが密度が大きい。主に気体でできていて半径が大きく，環をもつのは木星型惑星である。"},{"k":"思","text":"観察した期間に，金星は図１のどこにあったと考えられるか。最も適するものを1つ選びなさい。","sel":["AとBの間","BとCの間","CとDの間","DとAの間"],"ans":[4],"fix":true,"kai":"明け方の東の空に見える金星は，地球から見て太陽の右側にあるAまたはDの側にある。細く欠けた形から丸みを増し，見かけの大きさが小さくなったのは，地球に近いDを過ぎて地球から遠ざかっているからなので，DとAの間である。"},{"k":"思","text":"3月6日の午前5時に，月は図２のどこにあると考えられるか。ただし，図２で月の位置が1周して同じ位置にもどるまで（月の満ち欠けの周期）を29.5日とする。最も適するものを1つ選びなさい。","sel":["JとKの間","KとLの間","LとEの間","EとFの間"],"ans":[3],"fix":true,"kai":"明け方に南の空に見え，左側の半分が光る月は下弦の月で，図２のKの位置にある。地球を静止させた図２では，月は29.5日で1周するので1日に約360÷29.5≒12°進み，5日後には約61°進んで，Kから45°のLを過ぎ，90°のEの手前にある。"},{"k":"思","text":"金星の公転周期は約225日である。地球が太陽のまわりを1周する間に金星は約何周するか。また，1年後の同じ日の同じ時刻に，同じ場所で同じ形と大きさの金星が見られるか。組み合わせとして最も適するものを1つ選びなさい。","sel":["約1.6周・太陽と金星と地球の位置関係が変わるので，見られない","約0.6周・太陽と金星と地球の位置関係が変わるので，見られない","約1.6周・太陽と金星と地球の位置関係が変わらないので，見られる","約1周・太陽と金星と地球の位置関係が変わらないので，見られる","約2.6周・太陽と金星と地球の位置関係が変わるので，見られない"],"ans":[1],"kai":"365÷225≒1.6なので，地球が1周する間に金星は約1.6周する。金星は1周に0.6周分ずれた位置にあり，太陽と金星と地球の位置関係が変わるので，同じ形と大きさの金星は見られない。"}]},{"id":"akita_r8-d4","src":"秋田県 2026年 大問1","kind":"dai","field":"生物","grade":1,"topic":"種子植物の分類","ctx":"<p class=\"lead\">校庭の植物を観察したり図鑑で調べたりして，種子植物A〜Cの特徴を表にまとめた。また，種子から育てた植物Xを観察し，その記録を下のようにまとめた。<\/p><table><caption>表　植物A〜Cの特徴<\/caption><tr><th><\/th><th>植物A<\/th><th>植物B<\/th><th>植物C<\/th><\/tr><tr><th>葉脈のようす<\/th><td>平行に並ぶ<\/td><td>網目状に広がる<\/td><td>根もとから扇形に広がる<\/td><\/tr><tr><th>根のようす<\/th><td>多数の細い根<\/td><td>太い根と細い根<\/td><td>太い根と細い根<\/td><\/tr><tr><th>胚珠のようす<\/th><td>子房の中にある<\/td><td>子房の中にある<\/td><td>むき出しになっている<\/td><\/tr><\/table><p class=\"lead\">植物Xの記録：発芽したときの子葉は2枚であった。根は太い根から細い根が出ていて，根の先端近くには細い毛のようなものが多数見られた。花を分解すると，胚珠は子房の中にあった。<\/p>","qs":[{"k":"知","text":"植物Xの葉を1枚とって手に持ち，ルーペで観察するときのルーペの使い方として最も適するものを1つ選びなさい。","sel":["ルーペを目から離して持ち，葉を動かさずにルーペを前後に動かす。","ルーペを目に近づけて持ち，葉を前後に動かしてよく見える位置をさがす。","ルーペを葉に近づけて持ち，顔だけを前後に動かす。","ルーペを葉と目の中間に持ち，ルーペだけを前後に動かす。"],"ans":[2],"kai":"ルーペは目に近づけて持つ。観察するものが動かせるときは，観察するものを前後に動かしてピントを合わせる。"},{"k":"知","text":"植物Xの根の先端近くに見られた細い毛のようなもののはたらきとして最も適するものを1つ選びなさい。","sel":["根の表面積を広くして，水や水にとけた養分を吸収しやすくする。","光を受けて，デンプンなどの養分をつくる。","葉でつくられた養分を，からだ全体に運ぶ。","空気中の二酸化炭素を取り入れやすくする。"],"ans":[1],"kai":"根の先端近くの細い毛のようなものは根毛である。根毛があると根の表面積が広くなり，土の中の水や水にとけた養分を吸収しやすくなる。"},{"k":"思","text":"植物Xは，根のようすが植物Bと植物Cのどちらとも似ているが，植物Bと同じなかまに分類できる。その根拠として最も適するものを1つ選びなさい。","sel":["植物Xと植物Bはどちらも根毛があるが，植物Cには根毛がないから。","植物Xと植物Bはどちらも葉脈が網目状だが，植物Cは葉脈が平行だから。","植物Xと植物Bはどちらも胚珠が子房の中にあるが，植物Cは胚珠がむき出しだから。","植物Xと植物Bはどちらも子葉が1枚だが，植物Cは子葉が2枚だから。"],"ans":[3],"kai":"記録と表から比べられるのは胚珠のようすで，XとBは胚珠が子房の中にある被子植物，Cは胚珠がむき出しの裸子植物である。Xの葉脈やCの根毛は記録や表に書かれておらず，Cの葉脈は平行でもない。"},{"k":"思","text":"植物Xの分類と，植物Xの葉脈のようすとして考えられるものの組み合わせとして最も適するものを1つ選びなさい。","sel":["被子植物の単子葉類・平行に並ぶ","被子植物の双子葉類・網目状に広がる","裸子植物・網目状に広がる","被子植物の単子葉類・網目状に広がる","被子植物の双子葉類・平行に並ぶ"],"ans":[2],"kai":"Xは胚珠が子房の中にあるので被子植物で，子葉が2枚で太い根と細い根をもつので双子葉類である。双子葉類の葉脈は網目状に広がる。"}]},{"id":"akita_r8-s1","src":"秋田県 2026年 大問5","kind":"sho","field":"物理","grade":1,"topic":"音の大きさと高さ","ctx":"","qs":[{"k":"思","text":"モノコードの弦をはじき，出た音の波形をオシロスコープで観察した。次に，弦の振動する部分をはじめより長くし，はじめより強く弦をはじいた。このときの波形は，はじめの波形と比べてどうなるか。ただし，オシロスコープの目盛りのとり方は変えないものとする。最も適するものを1つ選びなさい。","sel":["同じ時間に表示される波の数が多くなり，振幅は大きくなる。","同じ時間に表示される波の数が多くなり，振幅は小さくなる。","同じ時間に表示される波の数が少なくなり，振幅は大きくなる。","同じ時間に表示される波の数が少なくなり，振幅は小さくなる。"],"ans":[3],"kai":"弦の振動する部分を長くすると振動数が少なくなるので，同じ時間に表示される波の数が少なくなる。強くはじくと振幅が大きくなる。"}]},{"id":"akita_r8-s2","src":"秋田県 2026年 大問5","kind":"sho","field":"物理","grade":1,"topic":"振動数","ctx":"","qs":[{"k":"知","text":"ある動物が出す音は，1回の振動にかかる時間が0.000025秒である。この音の振動数は何Hzか。整数で答えなさい。","num":"40000","unit":"Hz","kai":"振動数は1秒間に振動する回数なので，1÷0.000025＝40000Hzである。"}]},{"id":"akita_r8-s3","src":"秋田県 2026年 大問2","kind":"sho","field":"化学","grade":1,"topic":"ガスバーナーの使い方","ctx":"","qs":[{"k":"知","text":"ガスバーナーに火をつけて炎の大きさを調節したところ，炎が赤色で不安定だった。青色の安定した炎にするための操作として最も適するものを1つ選びなさい。","sel":["空気調節ねじを押さえて，ガス調節ねじを少しずつ開く。","ガス調節ねじを押さえて，空気調節ねじを少しずつ開く。","ガス調節ねじを押さえて，空気調節ねじを少しずつ閉じる。","空気調節ねじとガス調節ねじを同時に少しずつ閉じる。"],"ans":[2],"kai":"炎が赤いのは空気が足りないからである。炎の大きさを変えないようにガス調節ねじを押さえ，空気調節ねじだけを少しずつ開いて空気を入れる。"}]},{"id":"akita_r8-s4","src":"秋田県 2026年 大問6","kind":"sho","field":"化学","grade":1,"topic":"状態変化と体積","ctx":"","qs":[{"k":"思","text":"水46.0gをすべて氷にした。水の密度を1.00g/cm³，氷の密度を0.92g/cm³とすると，体積は何cm³増えるか。整数で答えなさい。","num":"4","unit":"cm³","kai":"状態変化では質量は変わらない。水の体積は46.0÷1.00＝46.0cm³，氷の体積は46.0÷0.92＝50.0cm³なので，4cm³増える。"}]},{"id":"akita_r8-s5","src":"秋田県 2026年 大問5","kind":"sho","field":"生物","grade":2,"topic":"反射","ctx":"","qs":[{"k":"知","text":"熱いものに手がふれたとき，熱いと感じる前に思わず手を引っこめた。このときの信号が伝わる経路として最も適するものを1つ選びなさい。","sel":["皮膚→感覚神経→脳→運動神経→筋肉","皮膚→感覚神経→せきずい→脳→せきずい→運動神経→筋肉","皮膚→感覚神経→せきずい→運動神経→筋肉","皮膚→運動神経→せきずい→感覚神経→筋肉"],"ans":[3],"kai":"意識とは無関係に起こる反射では，信号は脳を通らず，せきずいから直接，運動神経を通って筋肉に命令が伝わる。そのため，意識して起こす反応より反応までの時間が短い。"}]},{"id":"akita_r8-s6","src":"秋田県 2026年 大問5","kind":"sho","field":"生物","grade":2,"topic":"耳のつくり","ctx":"","qs":[{"k":"知","text":"音の刺激が耳で受けとられて脳に伝わるまでの順として最も適するものを1つ選びなさい。","sel":["耳小骨→鼓膜→うずまき管→神経→脳","うずまき管→鼓膜→耳小骨→神経→脳","鼓膜→うずまき管→耳小骨→神経→脳","鼓膜→耳小骨→うずまき管→神経→脳"],"ans":[4],"kai":"空気の振動はまず鼓膜を振動させ，その振動が耳小骨を通してうずまき管に伝わる。うずまき管で刺激が信号に変えられ，神経を通って脳に伝わる。"}]},{"id":"akita_r8-s7","src":"秋田県 2026年 大問6","kind":"sho","field":"地学","grade":2,"topic":"湿度と水蒸気量","ctx":"<table><caption>表　気温と飽和水蒸気量<\/caption><tr><th>気温〔℃〕<\/th><td>10<\/td><td>12<\/td><td>14<\/td><td>16<\/td><td>18<\/td><td>20<\/td><td>22<\/td><\/tr><tr><th>飽和水蒸気量〔g/m³〕<\/th><td>9.4<\/td><td>10.7<\/td><td>12.1<\/td><td>13.6<\/td><td>15.4<\/td><td>17.3<\/td><td>19.4<\/td><\/tr><\/table>","qs":[{"k":"思","text":"気温20℃，湿度60％の空気1m³にふくまれる水蒸気の質量は何gか。表を用いて，四捨五入して小数第1位まで答えなさい。","num":"10.4","unit":"g","kai":"20℃の飽和水蒸気量は17.3g/m³なので，17.3×0.60＝10.38より，10.4gである。"}]},{"id":"akita_r8-s8","src":"秋田県 2026年 大問6","kind":"sho","field":"地学","grade":2,"topic":"雲のでき方","ctx":"","qs":[{"k":"知","text":"水蒸気をふくむ空気のかたまりが山の斜面にそって上昇すると，雲ができることがある。このしくみを説明したものとして最も適するものを1つ選びなさい。","sel":["上空ほど気圧が高いので，空気は圧縮されて温度が下がり，露点より低くなると水蒸気が水滴になる。","上空ほど気圧が低いので，空気は膨張して温度が下がり，露点より低くなると水蒸気が水滴になる。","上空ほど気圧が低いので，空気は膨張して温度が上がり，露点より高くなると水蒸気が水滴になる。","上空ほど気圧が高いので，空気は圧縮されて温度が上がり，露点より高くなると水蒸気が水滴になる。"],"ans":[2],"kai":"上空ほど気圧が低いので，上昇した空気は膨張して温度が下がる。温度が露点より低くなると，ふくみきれなくなった水蒸気が水滴になり，雲ができる。"}]}];
const INFO = {"q":280,"prefs":["三重県","青森県","長野県","宮城県","神奈川県","埼玉県","秋田県"]};
const KEY = 'testprep_nyushi_rika_v1';
const FIELDS = ['物理', '化学', '生物', '地学'];
const KANA = 'アイウエオカキクケコサシ';
const MODES = {
  hon:   { name: '本番', limit: 50, sho: 3, dai: 4 },
  puchi: { name: 'プチ番', limit: 12, sho: 1, dai: 1 },
  bun:   { name: '分野しぼり', limit: 12, sho: 3, dai: 1 },
};
const ONWEB = location.protocol.startsWith('http');
function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
function save(o){ try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {} }
const Z = '０１２３４５６７８９';
const zen = n => String(n).length === 1 ? Z[n] : String(n);
const $ = s => document.querySelector(s);
let QS = [], ALL = [], mode = 'hon', seed = 0, grade = 3, bunF = '物理', partial = false, playing = false;
let idx = 0, score = 0, rec = [], picked = [], done = false, t0 = 0, timer = null;

function fmt(sec){ const m = Math.floor(sec / 60), s = sec % 60; return m + '分' + String(s).padStart(2, '0') + '秒'; }
function tick(){ const s = Math.floor((Date.now() - t0) / 1000); $('#st-time').textContent = '時間 ' + fmt(s); $('#st-time').classList.toggle('over', !partial && s > MODES[mode].limit * 60); }
function hb(text, fn){ const b = $('#hb'); b.hidden = !text; b.textContent = text || ''; b.onclick = fn || null; }
function total(qs){ return qs.reduce((x, q) => x + q.ten, 0); }

function mkrnd(s){
  let a = s * 2654435761 >>> 0;
  return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function shuffle(arr, rnd){ const a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// テスト番号・モード・範囲から、使うユニットを決める（同じ番号なら同じ問題）
function choose(s, m, g, bf){
  const rnd = mkrnd(s * 7 + ({ hon: 1, puchi: 2, bun: 3 })[m] + g * 100003 + (m === 'bun' ? FIELDS.indexOf(bf) * 1009 : 0));
  const pool = (kind, f) => UNITS.filter(u => u.kind === kind && u.field === f && u.grade <= g);
  const M = MODES[m], sho = [], dai = [];
  const fs = m === 'bun' ? [bf] : FIELDS;
  fs.forEach(f => sho.push(...shuffle(pool('sho', f), rnd).slice(0, M.sho)));
  if (m === 'hon') FIELDS.forEach(f => dai.push(...shuffle(pool('dai', f), rnd).slice(0, 1)));
  else if (m === 'bun') dai.push(...shuffle(pool('dai', bf), rnd).slice(0, 1));
  else dai.push(...shuffle(UNITS.filter(u => u.kind === 'dai' && u.grade <= g), rnd).slice(0, 1));
  return { sho, dai, rnd };
}

function makeTest(s){
  seed = s;
  const { sho, dai, rnd } = choose(s, mode, grade, bunF);
  const qs = [];
  let mon = 0;
  const push = (u, q, no, dn) => {
    const d = { uid: u.id, f: u.field, src: u.src, kind: u.kind, k: q.k, text: q.text, kai: q.kai, ctx: u.ctx || '',
                ten: u.kind === 'dai' ? 4 : 3, mon, no, dn };
    if (q.sel){
      const order = q.fix ? q.sel.map((_, i) => i) : shuffle(q.sel.map((_, i) => i), rnd);
      d.sel = order.map(i => q.sel[i]);
      d.ans = q.ans.map(a => order.indexOf(a - 1) + 1).sort((a, b) => a - b);
      d.multi = !!q.multi;
    } else { d.num = q.num; d.unit = q.unit; }
    qs.push(d);
  };
  FIELDS.forEach(f => {
    const us = sho.filter(u => u.field === f); if (!us.length) return;
    mon++; us.forEach((u, i) => push(u, u.qs[0], KANA[i], f + '（小問）'));
  });
  dai.forEach(u => { mon++; u.qs.forEach((q, i) => push(u, q, KANA[i], u.field + '　' + u.topic)); });
  QS = qs; ALL = qs.slice();
}

function newSeed(){
  // まだ解いていない問題がいちばん多く入る番号を選ぶ
  const seen = load().seen || {};
  let best = 1, bs = -1;
  for (let i = 0; i < 40; i++){
    const s = 1 + Math.floor(Math.random() * 9999), c = choose(s, mode, grade, bunF);
    const n = c.sho.concat(c.dai).filter(u => !seen[u.id]).reduce((x, u) => x + u.qs.length, 0);
    if (n > bs){ bs = n; best = s; }
  }
  return best;
}

function recLine(r){
  if (!r || !r.n) return 'まだ記録なし';
  return `最高 <b>${r.best}</b>％　／　前回 ${r.last}％　／　${r.n} 回`;
}
function count(m, g, bf){ const c = choose(1, m, g, bf); return c.sho.length + c.dai.length * 4; }

function start(){
  playing = false; clearInterval(timer);
  const R = load();
  grade = R.grade || 3; bunF = R.bunF || '物理';
  hb(ONWEB ? '← テスト対策' : '', () => { location.href = '../index.html'; });
  $('#sub').textContent = '';
  const fr = R.f || {};
  const frows = FIELDS.map(f => { const x = fr[f]; return `<td>${x && x.all ? Math.round(x.ok / x.all * 100) + '％<br><span class="hint">' + x.ok + ' / ' + x.all + ' 問</span>' : '—'}</td>`; }).join('');
  const nSeen = Object.keys(R.seen || {}).filter(id => UNITS.some(u => u.id === id)).length;
  $('#main').innerHTML = `<div class="card home">
    <h1>高校入試 仮想テスト（理科）</h1>
    <p class="meta">全国の公立高校入試の問題をもとに作った類題から、毎回ちがう組み合わせで仮想の入試を作る。答えるとその場で正解・不正解と解説が出て、最後に点数が出る。</p>
    <p class="meta">いま入っている問題：${INFO.q}問（${INFO.prefs.join('・')} の入試をもとにした類題）　／　解いたことのある問題：${nSeen} / ${UNITS.length} 組</p>
    <div class="opts"><span>出題範囲</span>
      <label><input type="radio" name="g" value="1"> 中1まで</label>
      <label><input type="radio" name="g" value="2"> 中2まで</label>
      <label><input type="radio" name="g" value="3"> 中3まで（全部）</label>
      <label>テスト番号 <input type="text" id="seed" inputmode="numeric" maxlength="4" placeholder="おまかせ"></label></div>
    <div class="modes">
      <div class="mode"><b>本番</b><span>入試1回分。小問12問＋大問4本。<span id="n-hon"></span>・50分。</span>
        <div class="rec">${recLine(R.hon)}</div><button class="btn" data-m="hon">はじめる</button></div>
      <div class="mode"><b>プチ番</b><span>時間がないとき用。小問4問＋大問1本。<span id="n-puchi"></span>・10分ほど。</span>
        <div class="rec">${recLine(R.puchi)}</div><button class="btn" data-m="puchi">はじめる</button></div>
      <div class="mode"><b>分野しぼり</b><span>1つの分野だけ。小問3問＋大問1本。<span id="n-bun"></span>・10分ほど。</span>
        <select id="bunf">${FIELDS.map(f => `<option${f === bunF ? ' selected' : ''}>${f}</option>`).join('')}</select>
        <div class="rec">${recLine(R.bun)}</div><button class="btn" data-m="bun">はじめる</button></div>
    </div>
    <h2>これまでの分野ごとの正答率</h2>
    <table class="tbl"><tr>${FIELDS.map(f => `<th>${f}</th>`).join('')}</tr><tr>${frows}</tr></table>
    <details><summary>答え方・しくみ</summary><ul>
      <li>選択肢は、おして選ぶ。パソコンでは数字キーでも選べる。Enter キーで次へ進める。</li>
      <li>「すべて選びなさい」の問題は、当てはまるものを全部選んでから「答える」をおす。全部合って正解。</li>
      <li>計算の問題は、数字を入力して「答える」をおす。</li>
      <li>配点は神奈川県の入試と同じ形（小問は1問3点、大問の中の問いは1問4点）。記録は100点満点に直した数字（％）で残る。</li>
      <li>テスト番号が同じなら同じ問題が出る。友だちと同じ番号で解いて、点数を比べられる。番号を入れなければ、まだ解いていない問題が多く入るように選ぶ。</li>
      <li>問題は、それぞれの県の入試問題そのものではない。同じ考え方を使う別の問題に作りかえてある。</li>
      <li>記録は、この端末のこのブラウザに残る。</li>
    </ul></details></div>`;
  const setN = () => {
    ['hon', 'puchi', 'bun'].forEach(m => { const n = count(m, grade, bunF); $('#n-' + m).textContent = n + '問'; document.querySelector(`button[data-m=${m}]`).disabled = n === 0; });
  };
  document.querySelectorAll('input[name=g]').forEach(r => { r.checked = +r.value === grade; r.onchange = () => { grade = +r.value; const o = load(); o.grade = grade; save(o); setN(); }; });
  $('#bunf').onchange = e => { bunF = e.target.value; const o = load(); o.bunF = bunF; save(o); setN(); };
  setN();
  document.querySelectorAll('button[data-m]').forEach(b => b.onclick = () => {
    mode = b.dataset.m;
    const v = parseInt(norm($('#seed').value), 10);
    makeTest(v >= 1 && v <= 9999 ? v : newSeed()); begin();
  });
  $('#st-pos').textContent = ''; $('#st-score').textContent = '0'; $('#st-time').textContent = ''; $('#bar').style.width = '0';
  window.scrollTo(0, 0);
}

function label(){ return MODES[mode].name + (mode === 'bun' ? '（' + bunF + '）' : '') + (grade < 3 ? '・中' + grade + 'まで' : '') + '　番号 ' + seed; }

function begin(part){
  partial = !!part; playing = true; idx = 0; score = 0; rec = []; t0 = Date.now();
  clearInterval(timer); timer = setInterval(tick, 1000); tick();
  hb('やめる', () => { if (confirm('このテストをやめて、最初の画面にもどる？（ここまでの点数は残らない）')) start(); });
  $('#sub').textContent = label() + (partial ? '（解き直し）' : '');
  show();
}

function show(){
  const q = QS[idx]; picked = []; done = false;
  $('#st-pos').textContent = (idx + 1) + ' / ' + QS.length + ' 問';
  $('#st-score').textContent = score;
  $('#bar').style.width = (idx / QS.length * 100) + '%';
  let body;
  if (q.sel){
    body = '<div class="sel">' + q.sel.map((s, i) =>
      `<button data-i="${i + 1}"><span class="n">${zen(i + 1)}</span><span>${s}</span></button>`).join('') + '</div>'
      + (q.multi ? '<div class="act"><button class="btn" id="ok" disabled>答える</button><span class="hint">当てはまるものを全部選ぶ</span></div>' : '');
  } else {
    body = `<div class="numrow"><input id="num" inputmode="decimal" autocomplete="off"><span>${q.unit}</span></div>
      <div class="act"><button class="btn" id="ok">答える</button></div>`;
  }
  $('#main').innerHTML = `<div class="wrap${q.ctx ? '' : ' noctx'}">
    ${q.ctx ? `<div class="card ctx">${q.ctx}</div>` : ''}
    <div class="card">
      <div><span class="tag">問${zen(q.mon)}　${q.dn}</span><span class="tag">（${q.no}）　${q.ten}点</span><span class="tag src">${q.src.split(' ')[0]}の入試の類題</span></div>
      <p class="qtext">${q.text}</p>${body}
      <div id="res"></div>
    </div></div>`;
  window.scrollTo(0, 0);
  // スマホの幅では、同じ資料の2問目からは問いの所まで送る（資料は上に残る）
  if (idx > 0 && q.ctx && QS[idx - 1].uid === q.uid && matchMedia('(max-width:820px)').matches)
    $('.qtext').parentElement.scrollIntoView({ block: 'start' });
  if (q.sel){
    document.querySelectorAll('.sel button').forEach(b => b.onclick = () => pick(+b.dataset.i));
    if (q.multi) $('#ok').onclick = judge;
  } else {
    $('#ok').onclick = judge;
    if (matchMedia('(min-width:821px)').matches) $('#num').focus();
  }
}

function pick(i){
  const q = QS[idx]; if (done || !q.sel || i > q.sel.length) return;
  if (q.multi){
    picked = picked.includes(i) ? picked.filter(x => x !== i) : picked.concat(i).sort((a, b) => a - b);
    document.querySelectorAll('.sel button').forEach(b => b.classList.toggle('on', picked.includes(+b.dataset.i)));
    $('#ok').disabled = picked.length === 0;
  } else { picked = [i]; judge(); }
}

function norm(s){ return s.replace(/[０-９]/g, c => Z.indexOf(c)).replace(/[．。]/g, '.').replace(/[−ー―]/g, '-').replace(/\s/g, ''); }

function judge(){
  const q = QS[idx]; if (done) return;
  let ok, mine, right;
  if (q.sel){
    if (!picked.length) return;
    ok = picked.join() === q.ans.join();
    mine = picked.map(zen).join('・'); right = q.ans.map(zen).join('・');
    document.querySelectorAll('.sel button').forEach(b => {
      const i = +b.dataset.i; b.disabled = true;
      if (q.ans.includes(i)) b.classList.add('right'); else if (picked.includes(i)) b.classList.add('wrong');
    });
    if (q.multi) $('#ok').disabled = true;
  } else {
    const v = norm($('#num').value); if (v === '' || isNaN(Number(v))) { $('#num').focus(); return; }
    ok = Math.abs(Number(v) - Number(q.num)) < 1e-9;
    mine = v + ' ' + q.unit; right = q.num + ' ' + q.unit;
    $('#num').disabled = true; $('#ok').disabled = true;
  }
  done = true;
  if (ok) score += q.ten;
  rec.push({ ok, mine, right });
  $('#st-score').textContent = score;
  const last = idx === QS.length - 1;
  $('#res').innerHTML = `<div class="judge ${ok ? 'ok' : 'ng'}">${ok ? '〇 正解　＋' + q.ten + '点' : '× 不正解　正しい答えは ' + right}</div>
    <p class="kai">${q.kai}</p>
    <div class="act"><button class="btn" id="next">${last ? '結果を見る' : '次の問題へ'}</button></div>`;
  $('#next').onclick = next; $('#next').focus({ preventScroll: true });
  $('#res').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

function next(){ if (idx < QS.length - 1){ idx++; show(); } else result(); }

function result(){
  clearInterval(timer); playing = false;
  const sec = Math.floor((Date.now() - t0) / 1000);
  $('#bar').style.width = '100%'; $('#st-pos').textContent = '結果';
  hb('最初の画面へ', start);
  const all = total(QS), pct = Math.round(score / all * 100);
  let newBest = false;
  if (!partial){
    const R = load(), r = R[mode] || { n: 0, best: 0, last: 0 };
    newBest = r.n > 0 && pct > r.best;
    r.n++; r.last = pct; r.best = Math.max(r.best, pct); R[mode] = r;
    R.f = R.f || {}; R.seen = R.seen || {};
    QS.forEach((q, i) => { const x = R.f[q.f] = R.f[q.f] || { ok: 0, all: 0 }; x.all++; if (rec[i].ok) x.ok++; R.seen[q.uid] = 1; });
    save(R);
  }
  let chi = 0, shi = 0, chiA = 0, shiA = 0;
  QS.forEach((q, i) => { if (q.k === '知'){ chiA += q.ten; if (rec[i].ok) chi += q.ten; } else { shiA += q.ten; if (rec[i].ok) shi += q.ten; } });
  const stat = FIELDS.map(f => {
    const ix = QS.map((q, i) => i).filter(i => QS[i].f === f);
    const got = ix.reduce((a, i) => a + (rec[i].ok ? QS[i].ten : 0), 0), al = ix.reduce((a, i) => a + QS[i].ten, 0);
    return { f, ix, got, all: al, rate: al ? got / al : 1 };
  }).filter(s => s.ix.length);
  const low = Math.min(...stat.map(s => s.rate));
  const rows = stat.map(s => `<tr class="${stat.length > 1 && s.rate === low && low < 1 ? 'weak' : ''}"><th>${s.f}</th><td>${s.ix.filter(i => rec[i].ok).length} / ${s.ix.length} 問</td><td>${s.got} / ${s.all} 点</td></tr>`).join('');
  const miss = QS.map((q, i) => i).filter(i => !rec[i].ok);
  const text = i => { const q = QS[i]; let a = rec[i].right, m = rec[i].mine;
    if (q.sel && !q.multi){ a += '　' + q.sel[q.ans[0] - 1]; }
    return `<div class="miss"><p class="q"><b>問${zen(q.mon)}（${q.no}）</b>　${q.text}</p><p class="a">あなたの答え <s>${m}</s>　／　正しい答え <b>${a}</b></p><p class="kai">${q.kai}</p>${q.ctx ? `<details><summary>資料を見る</summary>${q.ctx}</details>` : ''}</div>`; };
  const over = !partial && sec > MODES[mode].limit * 60;
  $('#main').innerHTML = `<div class="card result" style="max-width:1000px;margin:0 auto">
    <h2>結果　<span class="hint">${label()}${partial ? '（解き直し・記録には入らない）' : ''}${newBest ? '　最高記録を更新' : ''}</span></h2>
    <div class="big">${score}<small> 点 / ${all}点${all !== 100 ? '（' + pct + '％）' : ''}　${QS.length - miss.length} / ${QS.length} 問正解・${fmt(sec)}${over ? '（時間オーバー）' : ''}</small></div>
    <table class="tbl"><tr><th>知識・技能</th><td>${chi} / ${chiA} 点</td><th>思考・判断・表現</th><td>${shi} / ${shiA} 点</td></tr></table>
    <table class="tbl">${rows}</table>
    ${stat.length > 1 && low < 1 ? '<p class="hint">色のついた分野が、いちばん点を落としたところ。「分野しぼり」でその分野だけ解ける。</p>' : ''}
    <div class="act"><button class="btn" id="other">別の問題でもう一度</button><button class="btn ghost" id="again">同じ番号をもう一度</button>${miss.length ? '<button class="btn ghost" id="retry">まちがえた問題だけ解き直す</button>' : ''}</div>
    <h2 style="margin-top:22px">${miss.length ? 'まちがえた問題（' + miss.length + '問）' : '全問正解'}</h2>
    ${miss.map(text).join('')}</div>`;
  window.scrollTo(0, 0);
  $('#again').onclick = () => { QS = ALL.slice(); begin(); };
  $('#other').onclick = () => { makeTest(newSeed()); begin(); };
  if (miss.length) $('#retry').onclick = () => { QS = miss.map(i => QS[i]); begin(true); };
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter'){
    if ($('#next')){ e.preventDefault(); next(); }
    else if ($('#ok') && !$('#ok').disabled){ e.preventDefault(); judge(); }
    return;
  }
  if (/^[1-9]$/.test(e.key) && document.activeElement.tagName !== 'INPUT') pick(+e.key);
});
window.addEventListener('beforeunload', e => { if (playing && idx > 0){ e.preventDefault(); e.returnValue = ''; } });
start();
</script>
</body>
</html>
