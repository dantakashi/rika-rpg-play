<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>高校入試 仮想テスト（理科）</title>
<style>
:root{ --ink:#1b1b1b; --sub:#5a6470; --line:#c9d1da; --bg:#f3f5f8; --card:#fff; --blue:#1e5a8c; --ok:#1c7c3c; --okbg:#e6f5ea; --ng:#b3261e; --ngbg:#fdeceb; }
*{ box-sizing:border-box; }
html,body{ margin:0; }
body{ font-family:"UD Digi Kyokasho NK","UD デジタル 教科書体 NK","BIZ UDPGothic","Yu Gothic UI","Hiragino Sans",sans-serif;
  color:var(--ink); background:var(--bg); font-size:20px; line-height:1.7; }
header{ position:sticky; top:0; z-index:5; background:var(--blue); color:#fff; padding:8px 20px; display:flex; gap:6px 18px; align-items:center; flex-wrap:wrap; }
header .ttl{ font-weight:bold; font-size:17px; flex:1 1 auto; }
header .ttl span{ font-weight:normal; font-size:15px; margin-left:12px; opacity:.9; }
.hbtn{ font:inherit; font-size:15px; color:#fff; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.5); border-radius:8px; padding:3px 12px; cursor:pointer; }
.hbtn[hidden]{ display:none; }
#st-time.over{ color:#ffd1cc; }
header .stat{ font-size:17px; white-space:nowrap; }
header .stat b{ font-size:22px; }
.bar{ height:8px; background:#d7dee6; }
.bar i{ display:block; height:100%; width:0; background:#f2b632; transition:width .25s; }
main{ max-width:1500px; margin:0 auto; padding:18px 20px 60px; }
.card{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px 22px; }
.home{ max-width:1000px; margin:20px auto; }
.home h1{ font-size:26px; margin:0 0 4px; }
.home h2{ font-size:20px; margin:22px 0 4px; }
.meta{ color:var(--sub); font-size:17px; margin:0 0 6px; }
.rec{ font-size:16px; color:var(--sub); border-top:1px dashed var(--line); padding-top:8px; width:100%; }
.rec b{ color:var(--ink); font-size:19px; }
details{ margin-top:18px; font-size:17px; } summary{ cursor:pointer; color:var(--blue); font-weight:bold; }
.opts{ display:flex; gap:8px 22px; flex-wrap:wrap; align-items:center; font-size:18px; margin-top:10px; padding:10px 14px; background:#f6f8fb; border-radius:10px; }
.opts label{ white-space:nowrap; cursor:pointer; }
.opts input[type=text]{ font:inherit; width:6em; padding:2px 8px; border:2px solid var(--line); border-radius:8px; }
.opts input[type=radio]{ width:1.1em; height:1.1em; vertical-align:-2px; }
.modes{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:14px; }
.mode{ border:2px solid var(--line); border-radius:12px; padding:14px 16px; display:flex; flex-direction:column; gap:8px; align-items:flex-start; }
.mode b{ font-size:22px; color:var(--blue); } .mode span{ font-size:17px; flex:1; }
.mode select{ font:inherit; font-size:18px; padding:4px 8px; border:2px solid var(--line); border-radius:8px; }
.wrap{ display:grid; grid-template-columns:minmax(0,5fr) minmax(0,6fr); gap:18px; align-items:start; }
.wrap > .card{ scroll-margin-top:110px; }
.wrap.noctx{ grid-template-columns:minmax(0,1fr); max-width:900px; margin:0 auto; }
.ctx{ position:sticky; top:70px; max-height:calc(100vh - 90px); overflow:auto; }
.ctx .lead, .miss .lead{ margin:0 0 10px; font-size:18px; }
figure{ margin:8px 0 4px; text-align:center; }
figure svg{ width:100%; max-width:520px; height:auto; }
figcaption, caption{ font-size:16px; color:var(--sub); padding:4px 0; }
.ctx table{ border-collapse:collapse; margin:8px auto; font-size:17px; }
.ctx th,.ctx td{ border:1px solid #777; padding:5px 10px; text-align:center; }
.ctx th{ background:#eef2f6; font-weight:normal; }
.tag{ display:inline-block; font-size:15px; color:var(--blue); border:1px solid var(--blue); border-radius:999px; padding:0 12px; margin:0 8px 8px 0; }
.tag.src{ color:var(--sub); border-color:var(--line); }
.qtext{ margin:0 0 14px; font-size:21px; }
.qtext b{ text-decoration:underline; text-underline-offset:4px; }
.sel{ display:grid; gap:10px; }
.sel button{ font:inherit; text-align:left; background:#fff; border:2px solid var(--line); border-radius:10px; padding:10px 14px; cursor:pointer; display:flex; gap:12px; align-items:baseline; color:var(--ink); }
.sel button .n{ flex:none; width:1.9em; height:1.9em; line-height:1.9em; text-align:center; border-radius:50%; background:#e8edf3; font-weight:bold; }
.sel button:hover:not(:disabled){ border-color:var(--blue); background:#f4f8fc; }
.sel button.on{ border-color:var(--blue); background:#e4eef8; }
.sel button.on .n{ background:var(--blue); color:#fff; }
.sel button:disabled{ cursor:default; }
.sel button.right{ border-color:var(--ok); background:var(--okbg); }
.sel button.right .n{ background:var(--ok); color:#fff; }
.sel button.wrong{ border-color:var(--ng); background:var(--ngbg); }
.sel button.wrong .n{ background:var(--ng); color:#fff; }
.numrow{ display:flex; gap:10px; align-items:center; font-size:22px; }
.numrow input{ font:inherit; width:7em; padding:8px 12px; border:2px solid var(--line); border-radius:10px; }
.act{ display:flex; gap:12px; align-items:center; margin-top:16px; flex-wrap:wrap; }
.btn{ font:inherit; font-weight:bold; background:var(--blue); color:#fff; border:0; border-radius:10px; padding:10px 28px; cursor:pointer; }
.btn:disabled{ background:#aab4bf; cursor:default; }
.btn.ghost{ background:#fff; color:var(--blue); border:2px solid var(--blue); }
.judge{ font-weight:bold; font-size:22px; padding:8px 16px; border-radius:10px; margin-top:16px; }
.judge.ok{ color:var(--ok); background:var(--okbg); }
.judge.ng{ color:var(--ng); background:var(--ngbg); }
.kai{ font-size:18px; margin:10px 0 0; padding:8px 14px; border-left:5px solid var(--line); background:#f8fafc; }
.hint{ font-size:16px; color:var(--sub); }
.result h2{ margin:0 0 6px; font-size:26px; }
.big{ font-size:64px; font-weight:bold; color:var(--blue); line-height:1.2; }
.big small{ font-size:24px; color:var(--sub); font-weight:normal; }
.tbl{ border-collapse:collapse; margin:10px 0 18px; font-size:18px; }
.tbl th,.tbl td{ border:1px solid var(--line); padding:6px 14px; text-align:center; }
.tbl th{ background:#eef2f6; font-weight:normal; }
tr.weak th, tr.weak td{ background:#fff4e0; }
.miss{ border-top:1px solid var(--line); padding:12px 0; }
.miss .q{ margin:0 0 4px; font-size:18px; }
.miss .a{ margin:0; font-size:18px; }
.miss .a b{ color:var(--ok); } .miss .a s{ color:var(--ng); text-decoration:none; }
.miss details{ margin-top:4px; }
@media (max-width:820px){
  body{ font-size:18px; }
  main{ padding:10px 10px 50px; }
  .card{ padding:14px 14px; }
  .wrap{ grid-template-columns:minmax(0,1fr); }
  .ctx{ position:static; max-height:none; }
  .modes{ grid-template-columns:1fr; }
  .qtext{ font-size:19px; }
  .big{ font-size:48px; } .big small{ font-size:18px; display:block; }
  header{ padding:6px 10px; } header .ttl span{ display:block; margin:0; }
  .ctx table{ font-size:15px; } .ctx th,.ctx td{ padding:3px 5px; }
  .tbl{ font-size:16px; } .tbl th,.tbl td{ padding:4px 8px; }
}
</style>
</head>
<body>
<header>
  <button class="hbtn" id="hb" hidden></button>
  <div class="ttl">高校入試 仮想テスト（理科）<span id="sub"></span></div>
  <div class="stat" id="st-pos"></div>
  <div class="stat">得点 <b id="st-score">0</b> 点</div>
  <div class="stat" id="st-time"></div>
</header>
<div class="bar"><i id="bar"></i></div>
<main id="main"></main>
<script>
const UNITS = [{"id":"mie_r8-d1","src":"三重県 2026年 大問8","kind":"dai","field":"物理","grade":2,"topic":"電熱線の発熱と電力","ctx":"<p class=\"lead\">電熱線の発熱について調べるために、抵抗が3Ωの電熱線Pと、6Ωの電熱線Qを用いて、次の実験1〜3を行った。ただし、水の上昇温度は、電熱線が消費する電力と、電流を流した時間のそれぞれに比例するものとし、電熱線以外の抵抗は考えないものとする。<\/p><p class=\"lead\">〔実験1〕 室温と同じ温度の水150gを入れた容器に電熱線Pを入れ、電熱線Pに6Vの電圧を加えて電流を流し、水をかき混ぜながら水の上昇温度を調べた。電熱線Qについても、同じように調べた。図は、その結果をグラフに表したものである。<\/p><p class=\"lead\">〔実験2〕 電熱線Pと電熱線Qを直列につなぎ、電熱線Pを容器Aに、電熱線Qを容器Bに入れた。容器A、Bには、室温と同じ温度の水が150gずつ入っている。電源装置の電圧を9Vにして、電流を流した。<\/p><p class=\"lead\">〔実験3〕 電熱線Pと電熱線Qを並列につなぎ、電熱線Pを容器Cに、電熱線Qを容器Dに入れた。容器C、Dには、室温と同じ温度の水が150gずつ入っている。電源装置の電圧を6Vにして、電流を流した。<\/p><figure><svg viewBox=\"0 0 430 330\"><rect x=\"0\" y=\"0\" width=\"430\" height=\"330\" fill=\"#fff\"/><g stroke=\"#bbb\" stroke-width=\"1\"><line x1=\"130\" y1=\"44\" x2=\"130\" y2=\"260\"/><line x1=\"190\" y1=\"44\" x2=\"190\" y2=\"260\"/><line x1=\"250\" y1=\"44\" x2=\"250\" y2=\"260\"/><line x1=\"310\" y1=\"44\" x2=\"310\" y2=\"260\"/><line x1=\"370\" y1=\"44\" x2=\"370\" y2=\"260\"/><line x1=\"70\" y1=\"224\" x2=\"370\" y2=\"224\"/><line x1=\"70\" y1=\"188\" x2=\"370\" y2=\"188\"/><line x1=\"70\" y1=\"152\" x2=\"370\" y2=\"152\"/><line x1=\"70\" y1=\"116\" x2=\"370\" y2=\"116\"/><line x1=\"70\" y1=\"80\" x2=\"370\" y2=\"80\"/><line x1=\"70\" y1=\"44\" x2=\"370\" y2=\"44\"/><\/g><g stroke=\"#000\" stroke-width=\"2\" fill=\"none\"><line x1=\"70\" y1=\"260\" x2=\"370\" y2=\"260\"/><line x1=\"70\" y1=\"260\" x2=\"70\" y2=\"44\"/><line x1=\"70\" y1=\"260\" x2=\"370\" y2=\"80\"/><line x1=\"70\" y1=\"260\" x2=\"370\" y2=\"170\"/><\/g><g font-family=\"sans-serif\" font-size=\"15\" fill=\"#000\"><text x=\"70\" y=\"280\" text-anchor=\"middle\">0<\/text><text x=\"130\" y=\"280\" text-anchor=\"middle\">1<\/text><text x=\"190\" y=\"280\" text-anchor=\"middle\">2<\/text><text x=\"250\" y=\"280\" text-anchor=\"middle\">3<\/text><text x=\"310\" y=\"280\" text-anchor=\"middle\">4<\/text><text x=\"370\" y=\"280\" text-anchor=\"middle\">5<\/text><text x=\"60\" y=\"265\" text-anchor=\"end\">0<\/text><text x=\"60\" y=\"229\" text-anchor=\"end\">1.0<\/text><text x=\"60\" y=\"193\" text-anchor=\"end\">2.0<\/text><text x=\"60\" y=\"157\" text-anchor=\"end\">3.0<\/text><text x=\"60\" y=\"121\" text-anchor=\"end\">4.0<\/text><text x=\"60\" y=\"85\" text-anchor=\"end\">5.0<\/text><text x=\"60\" y=\"49\" text-anchor=\"end\">6.0<\/text><text x=\"220\" y=\"312\" text-anchor=\"middle\">電流を流した時間〔分〕<\/text><text x=\"18\" y=\"152\" text-anchor=\"middle\" transform=\"rotate(-90 18 152)\">水の上昇温度〔℃〕<\/text><text x=\"380\" y=\"85\" font-size=\"17\">P<\/text><text x=\"380\" y=\"175\" font-size=\"17\">Q<\/text><\/g><\/svg><figcaption>図　実験1の結果<\/figcaption><\/figure>","qs":[{"k":"思","text":"実験1で、電熱線Pに5分間電流を流したとき、電熱線Pから発生した熱量は何Jか。整数で答えなさい。","num":"3600","unit":"J","kai":"電熱線Pに流れる電流は6V÷3Ω＝2Aで、電力は6V×2A＝12Wである。5分は300秒なので、熱量は12W×300s＝3600Jである。"},{"k":"思","text":"実験1で、電熱線Qに加える電圧を12Vにかえ、ほかの条件は変えずに電流を流した。電流を流しはじめてから4分後の水の上昇温度は何℃になるか。小数第1位まで答えなさい。","num":"8.0","unit":"℃","kai":"電圧を2倍にすると電流も2倍になり、電力は4倍になる。図から電熱線Qの4分後の上昇温度は2.0℃なので、2.0℃×4＝8.0℃である。"},{"k":"思","text":"実験2で、電熱線Pが消費する電力は何Wか。整数で答えなさい。","num":"3","unit":"W","kai":"直列回路の全体の抵抗は3Ω＋6Ω＝9Ωで、流れる電流は9V÷9Ω＝1Aである。電熱線Pに加わる電圧は3Ω×1A＝3Vなので、電力は3V×1A＝3Wである。"},{"k":"思","text":"実験2と実験3で同じ時間だけ電流を流したとき、水の上昇温度が等しくなる容器の組み合わせはどれか。最も適するものを1つ選びなさい。","sel":["容器Aと容器B","容器Aと容器C","容器Aと容器D","容器Bと容器C","容器Bと容器D","容器Cと容器D"],"ans":[5],"fix":true,"kai":"電力は、容器Aが3W、容器Bが6V×1A＝6W、容器Cが6V×2A＝12W、容器Dが6V×1A＝6Wである。電力が等しい容器Bと容器Dで、上昇温度が等しくなる。"}]},{"id":"mie_r8-d2","src":"三重県 2026年 大問7","kind":"dai","field":"化学","grade":3,"topic":"金属のイオンへのなりやすさと電池","ctx":"<p class=\"lead\">金属のイオンへのなりやすさと電池について調べるために、次の実験1、2を行った。<\/p><p class=\"lead\">〔実験1〕 3種類の金属片X、Y、Zを用意した。X、Y、Zは、亜鉛、銅、マグネシウムのいずれかである。それぞれの金属片を3種類の水溶液に入れて、金属片の表面のようすを観察した。表は、その結果をまとめたものである。<\/p><table><caption>表　実験1の結果<\/caption><tr><th><\/th><th>硫酸亜鉛水溶液<\/th><th>硫酸銅水溶液<\/th><th>硫酸マグネシウム水溶液<\/th><\/tr><tr><th>金属片X<\/th><td>変化しなかった<\/td><td>赤色の物質が付着した<\/td><td>変化しなかった<\/td><\/tr><tr><th>金属片Y<\/th><td>灰色の物質が付着した<\/td><td>赤色の物質が付着した<\/td><td>変化しなかった<\/td><\/tr><tr><th>金属片Z<\/th><td>変化しなかった<\/td><td>変化しなかった<\/td><td>変化しなかった<\/td><\/tr><\/table><p class=\"lead\">〔実験2〕 ビーカーの中をセロハンで2つに仕切り、一方に硫酸亜鉛水溶液と亜鉛板を、もう一方に硫酸銅水溶液と銅板を入れて電池をつくった。亜鉛板と銅板を導線でモーターにつなぐと、モーターが回った。<\/p>","qs":[{"k":"思","text":"表から、金属片X、Y、Zはそれぞれ何であると考えられるか。最も適する組み合わせを1つ選びなさい。","sel":["X－亜鉛　Y－銅　Z－マグネシウム","X－亜鉛　Y－マグネシウム　Z－銅","X－銅　Y－亜鉛　Z－マグネシウム","X－銅　Y－マグネシウム　Z－亜鉛","X－マグネシウム　Y－亜鉛　Z－銅","X－マグネシウム　Y－銅　Z－亜鉛"],"ans":[2],"kai":"どの水溶液でも変化しなかったZは最もイオンになりにくい銅、2種類の水溶液で物質が付着したYは最もイオンになりやすいマグネシウムである。残るXが亜鉛である。"},{"k":"知","text":"実験1で、金属片Yを硫酸亜鉛水溶液に入れたときに起こった変化の説明はどれか。最も適するものを1つ選びなさい。","sel":["金属片Yの原子が電子を2個失って陽イオンになり、亜鉛イオンが電子を2個受けとって亜鉛原子になった。","金属片Yの原子が電子を2個受けとって陽イオンになり、亜鉛イオンが電子を2個失って亜鉛原子になった。","金属片Yの原子が電子を2個失って陰イオンになり、亜鉛原子が電子を2個受けとって亜鉛イオンになった。","金属片Yの原子が電子を1個失って陽イオンになり、亜鉛イオンが電子を1個受けとって亜鉛原子になった。"],"ans":[1],"kai":"金属片Yの原子は電子を2個失って陽イオンになってとけ出し、水溶液中の亜鉛イオンZn<sup>2+<\/sup>がその電子を2個受けとって亜鉛原子になり、金属片に付着する。"},{"k":"知","text":"実験2の電池で、モーターが回っているときの電子の移動の向きと、＋極になる金属板の組み合わせはどれか。最も適するものを1つ選びなさい。","sel":["電子は亜鉛板から導線を通って銅板へ移動し、銅板が＋極になる。","電子は亜鉛板から導線を通って銅板へ移動し、亜鉛板が＋極になる。","電子は銅板から導線を通って亜鉛板へ移動し、銅板が＋極になる。","電子は銅板から導線を通って亜鉛板へ移動し、亜鉛板が＋極になる。"],"ans":[1],"kai":"イオンになりやすい亜鉛が電子を失って亜鉛イオンになり、電子は導線を通って銅板へ移動する。電子が出ていく亜鉛板が－極、電子が入ってくる銅板が＋極である。"},{"k":"思","text":"実験2の電池で、硫酸亜鉛水溶液と亜鉛板を、硫酸マグネシウム水溶液とマグネシウム板にかえ、銅板側はそのままにしてモーターにつないだ。このときの＋極になる金属板と、モーターの回る向きの組み合わせはどれか。実験1の結果をもとに、最も適するものを1つ選びなさい。","sel":["銅板が＋極になり、モーターはかえる前と同じ向きに回る。","銅板が＋極になり、モーターはかえる前と逆の向きに回る。","マグネシウム板が＋極になり、モーターはかえる前と同じ向きに回る。","マグネシウム板が＋極になり、モーターはかえる前と逆の向きに回る。"],"ans":[1],"kai":"マグネシウムは銅よりイオンになりやすいので、マグネシウム板が電子を出す－極、銅板が＋極になる。極の向きがかえる前と同じなので、電流の向きもモーターの回る向きも変わらない。"}]},{"id":"mie_r8-d3","src":"三重県 2026年 大問6","kind":"dai","field":"生物","grade":2,"topic":"光合成と呼吸","ctx":"<p class=\"lead\">植物のはたらきについて調べるために、次の実験を行った。<\/p><p class=\"lead\">〔実験〕 青色のBTB溶液に息をふきこんで緑色にし、これを4本の試験管A〜Dに入れた。試験管A、B、Cには同じ大きさのオオカナダモを入れ、試験管Dには何も入れずに、すべての試験管にゴム栓をした。次に、試験管Bは全体をアルミニウムはくでおおい、試験管Cは全体をうすい布でおおって、中に弱い光だけがとどくようにした。4本の試験管に同じ強さの光を3時間当てた後、BTB溶液の色を調べた。表は、条件と結果をまとめたものである。<\/p><table><caption>表　条件と結果<\/caption><tr><th>試験管<\/th><th>オオカナダモ<\/th><th>おおい<\/th><th>3時間後のBTB溶液の色<\/th><\/tr><tr><th>A<\/th><td>あり<\/td><td>なし<\/td><td>青色<\/td><\/tr><tr><th>B<\/th><td>あり<\/td><td>アルミニウムはく<\/td><td>黄色<\/td><\/tr><tr><th>C<\/th><td>あり<\/td><td>うすい布<\/td><td>緑色<\/td><\/tr><tr><th>D<\/th><td>なし<\/td><td>なし<\/td><td>緑色<\/td><\/tr><\/table>","qs":[{"k":"知","text":"試験管AのBTB溶液が青色になったのは、溶液がどのように変化したからか。最も適するものを1つ選びなさい。","sel":["溶液中の二酸化炭素が減って、アルカリ性になった。","溶液中の二酸化炭素が増えて、酸性になった。","溶液中の酸素が減って、アルカリ性になった。","溶液中の酸素が増えて、酸性になった。"],"ans":[1],"kai":"BTB溶液は、酸性で黄色、中性で緑色、アルカリ性で青色を示す。水にとけると酸性を示す二酸化炭素が減ったので、溶液はアルカリ性になり青色になった。"},{"k":"思","text":"試験管Aの結果と試験管Dの結果を比べると、どのようなことがわかるか。最も適するものを1つ選びなさい。","sel":["BTB溶液の色の変化は、光が当たっただけでは起こらず、オオカナダモのはたらきによって起こったこと。","BTB溶液の色の変化は、オオカナダモがなくても、光が当たるだけで起こること。","オオカナダモは、光が当たらないときには二酸化炭素を出すこと。","オオカナダモは、光が弱いときには光合成を行わないこと。"],"ans":[1],"kai":"試験管AとDのちがいはオオカナダモがあるかないかだけである。オオカナダモのないDでは色が変化しなかったので、Aの色の変化はオオカナダモのはたらきによるものだとわかる。"},{"k":"思","text":"試験管CのBTB溶液の色が緑色のままであった理由はどれか。表のほかの試験管の結果をもとに、最も適するものを1つ選びなさい。","sel":["オオカナダモが呼吸で出した二酸化炭素の量と、光合成でとり入れた二酸化炭素の量が、ほぼ等しかったから。","オオカナダモが、光合成も呼吸も行わなかったから。","オオカナダモが、呼吸を行わず、光合成だけを行ったから。","オオカナダモが光合成で出した酸素が、呼吸で出した二酸化炭素を打ち消したから。"],"ans":[1],"kai":"試験管Bの結果から、オオカナダモは呼吸でつねに二酸化炭素を出していることがわかる。弱い光では光合成でとり入れる二酸化炭素の量が少なくなり、呼吸で出す量とほぼつり合ったため、色が変化しなかった。"},{"k":"思","text":"試験管Cをおおう布の枚数を増やして、中にとどく光をさらに弱くし、ほかの条件は変えずに同じ実験を行った。3時間後のBTB溶液の色はどうなると考えられるか。最も適するものを1つ選びなさい。","sel":["黄色になる。","青色になる。","緑色のまま変化しない。","無色になる。"],"ans":[1],"kai":"光がさらに弱くなると、光合成でとり入れる二酸化炭素の量が、呼吸で出す二酸化炭素の量より少なくなる。溶液中の二酸化炭素が増えて酸性になるので、黄色になる。"}]},{"id":"mie_r8-d4","src":"三重県 2026年 大問5","kind":"dai","field":"地学","grade":1,"topic":"地震のゆれの伝わり方","ctx":"<p class=\"lead\">ある地震について、地点A、B、Cでの記録を調べた。表は、それぞれの地点の震源からの距離と、P波とS波が到達した時刻をまとめたものである。ただし、P波とS波は、震源からすべての方向にそれぞれ一定の速さで伝わったものとする。<\/p><table><caption>表　各地点の記録<\/caption><tr><th>地点<\/th><th>震源からの距離<\/th><th>P波が到達した時刻<\/th><th>S波が到達した時刻<\/th><\/tr><tr><th>A<\/th><td>40km<\/td><td>7時24分55秒<\/td><td>7時25分00秒<\/td><\/tr><tr><th>B<\/th><td>96km<\/td><td>7時25分02秒<\/td><td>7時25分14秒<\/td><\/tr><tr><th>C<\/th><td>160km<\/td><td>7時25分10秒<\/td><td>7時25分30秒<\/td><\/tr><\/table>","qs":[{"k":"思","text":"この地震のP波の速さは何km/sか。整数で答えなさい。","num":"8","unit":"km/s","kai":"地点Aと地点Bで、震源からの距離の差は96km－40km＝56km、P波の到達時刻の差は7秒である。したがって、P波の速さは56km÷7s＝8km/sである。"},{"k":"思","text":"この地震が発生した時刻は、7時24分何秒か。整数で答えなさい。","num":"50","unit":"秒","kai":"P波の速さは8km/sなので、震源から40kmの地点AにP波がとどくまでに40km÷8km/s＝5秒かかる。発生時刻は7時24分55秒の5秒前の、7時24分50秒である。"},{"k":"思","text":"この地震で、初期微動継続時間が15秒であった地点は、震源から何kmの距離にあるか。整数で答えなさい。","num":"120","unit":"km","kai":"初期微動継続時間は、地点Aで5秒、地点Bで12秒、地点Cで20秒で、震源からの距離に比例し、8kmごとに1秒ずつ長くなっている。したがって、15秒の地点は8km×15＝120kmである。"},{"k":"思","text":"この地震では、震源からの距離が16kmの地点にある地震計がP波を感知し、その6秒後に緊急地震速報が発表された。震源からの距離が100kmの地点では、緊急地震速報が発表されてから何秒後にS波が到達したか。ただし、緊急地震速報は発表と同時に各地にとどくものとする。整数で答えなさい。","num":"17","unit":"秒後","kai":"地震計がP波を感知したのは発生の16km÷8km/s＝2秒後で、速報の発表は発生の8秒後である。S波の速さは4km/sなので、100kmの地点にS波がとどくのは発生の25秒後であり、25秒－8秒＝17秒後となる。"}]},{"id":"mie_r8-s1","src":"三重県 2026年 大問2","kind":"sho","field":"物理","grade":1,"topic":"音の速さ","ctx":"","qs":[{"k":"思","text":"花火が開いた位置から、Aさんは510m、Bさんは1190m離れた場所にいた。花火が開いたときの音は、Aさんに聞こえてから2.0秒後にBさんに聞こえた。このときの音の速さは何m/sか。整数で答えなさい。","num":"340","unit":"m/s","kai":"2人の花火からの距離の差は1190m－510m＝680mで、音がこの距離を進むのに2.0秒かかっている。したがって、音の速さは680m÷2.0s＝340m/sである。"}]},{"id":"mie_r8-s2","src":"三重県 2026年 大問8","kind":"sho","field":"物理","grade":2,"topic":"電力と熱量","ctx":"","qs":[{"k":"思","text":"消費電力が1000Wの電気ケトルに、20℃の水500gを入れて加熱した。水の温度が80℃になるまでにかかる時間は何秒か。ただし、水1gの温度を1℃上げるのに必要な熱量を4.2Jとし、電気ケトルはつねに1000Wの電力を消費して、発生した熱はすべて水の温度を上げるのに使われるものとする。整数で答えなさい。","num":"126","unit":"秒","kai":"必要な熱量は4.2J×500×(80－20)＝126000Jである。1000Wでは1秒間に1000Jの熱が発生するので、126000J÷1000W＝126秒かかる。"}]},{"id":"mie_r8-s3","src":"三重県 2026年 大問4","kind":"sho","field":"化学","grade":1,"topic":"蒸留","ctx":"","qs":[{"k":"思","text":"水とエタノールの混合物を枝つきフラスコに入れて弱火で加熱し、出てきた気体を冷やして液体にし、出てきた順に3本の試験管に同じ量ずつ集めた。1本目の試験管に集めた液体について述べた文はどれか。最も適するものを1つ選びなさい。","sel":["エタノールは水より沸点が低いので、3本目の液体よりエタノールを多くふくみ、火をつけるとよく燃える。","エタノールは水より沸点が高いので、3本目の液体よりエタノールを多くふくみ、火をつけるとよく燃える。","水はエタノールより沸点が低いので、3本目の液体より水を多くふくみ、火をつけても燃えにくい。","水はエタノールより沸点が高いので、3本目の液体より水を多くふくみ、火をつけても燃えにくい。"],"ans":[1],"kai":"エタノールの沸点は約78℃で、水の沸点100℃より低い。そのため、はじめに出てくる気体にはエタノールが多くふくまれ、1本目の液体は火をつけるとよく燃える。"}]},{"id":"mie_r8-s4","src":"三重県 2026年 大問4","kind":"sho","field":"化学","grade":1,"topic":"ガスバーナーの使い方","ctx":"","qs":[{"k":"知","text":"ガスバーナーに点火して炎の大きさを調節したところ、炎はオレンジ色でゆらいでいた。この炎を、加熱に適した青色の炎にするための操作はどれか。最も適するものを1つ選びなさい。","sel":["ガス調節ねじを動かさないように押さえて、空気調節ねじだけをゆるめる。","空気調節ねじを動かさないように押さえて、ガス調節ねじだけをゆるめる。","ガス調節ねじを動かさないように押さえて、空気調節ねじだけをしめる。","ガス調節ねじと空気調節ねじを、いっしょにしめる。"],"ans":[1],"kai":"オレンジ色の炎は空気が不足している。ガス調節ねじを押さえてガスの量を変えずに、空気調節ねじだけをゆるめて空気の量を増やすと、青色の炎になる。"}]},{"id":"mie_r8-s5","src":"三重県 2026年 大問3","kind":"sho","field":"生物","grade":3,"topic":"減数分裂と染色体の数","ctx":"","qs":[{"k":"知","text":"タマネギの1つの体細胞にある染色体の数は16本である。タマネギの1つの精細胞、1つの卵細胞、1つの受精卵にある染色体の数の組み合わせはどれか。最も適するものを1つ選びなさい。","sel":["精細胞－8本　卵細胞－8本　受精卵－16本","精細胞－8本　卵細胞－8本　受精卵－8本","精細胞－16本　卵細胞－16本　受精卵－32本","精細胞－16本　卵細胞－16本　受精卵－16本"],"ans":[1],"kai":"生殖細胞は減数分裂によってつくられ、染色体の数は体細胞の半分の8本になる。精細胞と卵細胞が受精すると、8本＋8本＝16本で、体細胞と同じ数にもどる。"}]},{"id":"mie_r8-s6","src":"三重県 2026年 大問3","kind":"sho","field":"生物","grade":3,"topic":"無性生殖と形質","ctx":"","qs":[{"k":"知","text":"ジャガイモは、いもを土に植えると芽が出て、新しい個体をつくることができる。このようにしてできた新しい個体の形質について述べた文はどれか。最も適するものを1つ選びなさい。","sel":["体細胞分裂によってできるので、親と同じ遺伝子を受けつぎ、親と同じ形質が現れる。","体細胞分裂によってできるので、親の遺伝子の半分を受けつぎ、親と異なる形質が現れることがある。","減数分裂によってできるので、親と同じ遺伝子を受けつぎ、親と同じ形質が現れる。","減数分裂によってできるので、親の遺伝子の半分を受けつぎ、親と異なる形質が現れることがある。"],"ans":[1],"kai":"いもから新しい個体ができるのは、受精を行わない無性生殖である。体細胞分裂によって子ができるので、子は親と同じ遺伝子を受けつぎ、形質も親と同じになる。"}]},{"id":"mie_r8-s7","src":"三重県 2026年 大問1","kind":"sho","field":"地学","grade":3,"topic":"黒点の大きさ","ctx":"","qs":[{"k":"思","text":"天体望遠鏡に太陽投影板をとりつけ、記録用紙にかいた直径12cmの円に太陽の像を合わせて黒点をスケッチしたところ、ほぼ円形の黒点の直径は2.4mmであった。この黒点の実際の直径は、地球の直径の何倍か。ただし、太陽の直径は地球の直径の109倍であるものとし、答えは小数第2位を四捨五入して、小数第1位まで求めなさい。","num":"2.2","unit":"倍","kai":"黒点の直径は太陽の像の直径の2.4mm÷120mm＝0.02倍である。太陽の直径は地球の109倍なので、109×0.02＝2.18より、約2.2倍である。"}]},{"id":"mie_r8-s8","src":"三重県 2026年 大問1","kind":"sho","field":"地学","grade":3,"topic":"黒点の観察からわかること","ctx":"","qs":[{"k":"知","text":"太陽の黒点を数日間続けて観察した。黒点について述べた文として正しいものを、次の中からすべて選びなさい。","sel":["黒点が暗く見えるのは、周囲より温度が低いからである。","黒点の位置が日がたつにつれて一方向へ移動するのは、太陽が自転しているからである。","中央部で円形に見えた黒点が周辺部でだ円形に見えるのは、太陽が平らな円盤の形をしているからである。","黒点の位置が日がたつにつれて一方向へ移動するのは、地球が自転しているからである。","黒点は、太陽の表面にうかぶ雲が影になって見えるものである。"],"ans":[1,2],"multi":true,"kai":"黒点は周囲（約6000℃）より温度が低い（約4000℃）ので暗く見える。黒点の位置の移動は太陽の自転によるもので、周辺部でだ円形に見えるのは太陽が球形だからである。"}]},{"id":"aomori_r8-d1","src":"青森県 2026年 大問5","kind":"dai","field":"物理","grade":2,"topic":"電流と発熱","ctx":"<p class=\"lead\">電熱線の発熱について調べるために、次の実験1〜4を行った。ただし、どの実験でも水の量と電流を流し始めたときの水の温度は同じで、電熱線で発生した熱はすべて水の温度を上げるのに使われるものとする。<\/p><p class=\"lead\">〔実験1〕抵抗が2Ωの電熱線Xを、発泡ポリスチレンのカップに入れた水の中に沈め、電熱線Xに6Vの電圧を加えて電流を流した。水をゆっくりかき混ぜながら、電流を流し始めてからの時間と水の上昇温度を調べた。表はその結果である。<br>〔実験2〕電熱線Xを、抵抗が6Ωの電熱線Yにかえて、実験1と同じように6Vの電圧を加えた。<br>〔実験3〕電熱線XとYを直列につなぎ、2本とも、実験1と同じ量の水を入れた1つのカップの中に沈め、その全体に6Vの電圧を加えた。<br>〔実験4〕電熱線XとYを並列につなぎ、2本とも、実験1と同じ量の水を入れた1つのカップの中に沈め、その全体に6Vの電圧を加えた。<\/p><table><caption>表　実験1の結果<\/caption><tr><th>時間〔分〕<\/th><td>0<\/td><td>1<\/td><td>2<\/td><td>3<\/td><td>4<\/td><td>5<\/td><\/tr><tr><th>水の上昇温度〔℃〕<\/th><td>0<\/td><td>1.2<\/td><td>2.4<\/td><td>3.6<\/td><td>4.8<\/td><td>6.0<\/td><\/tr><\/table>","qs":[{"k":"知","text":"実験1で、電熱線Xが消費する電力は何Wか。整数で答えなさい。","num":"18","unit":"W","kai":"電熱線Xに流れる電流は 6V÷2Ω＝3A である。電力は 6V×3A＝18W である。"},{"k":"思","text":"実験2で、電流を流し始めてから5分間の水の上昇温度は何℃か。小数第1位まで答えなさい。","num":"2.0","unit":"℃","kai":"電熱線Yの電力は 6V×1A＝6W で、電熱線Xの3分の1である。同じ時間の水の上昇温度は電力に比例するから、6.0℃÷3＝2.0℃ である。"},{"k":"思","text":"実験3で、電流を流し始めてから5分間の水の上昇温度は、実験1の5分間の水の上昇温度の何倍か。最も適するものを1つ選びなさい。","sel":["4倍","3分の4倍","4分の3倍","3分の1倍","4分の1倍"],"ans":[5],"fix":true,"kai":"直列につなぐと全体の抵抗は 2Ω＋6Ω＝8Ω になり、流れる電流は 0.75A、全体の電力は 6V×0.75A＝4.5W である。実験1の18Wの4分の1だから、上昇温度も4分の1になる。"},{"k":"思","text":"実験4で、電流を流し始めてから5分間の水の上昇温度は何℃か。小数第1位まで答えなさい。","num":"8.0","unit":"℃","kai":"並列につなぐと、XとYのそれぞれに6Vが加わるので、全体の電力は 18W＋6W＝24W である。実験1の18Wの3分の4倍だから、6.0℃×<sup>4<\/sup>／<sub>3<\/sub>＝8.0℃ である。"}]},{"id":"aomori_r8-d2","src":"青森県 2026年 大問4","kind":"dai","field":"化学","grade":1,"topic":"溶解度と再結晶","ctx":"<p class=\"lead\">ミョウバンと塩化ナトリウムを用いて、次の実験を行った。表は、それぞれの物質が100gの水に溶ける限度の質量を、水の温度ごとに示したものである。ただし、実験の間に水は蒸発しないものとする。<\/p><p class=\"lead\">〔実験〕60℃の水200gを入れたビーカーを2つ用意し、一方にミョウバン40.0gを、もう一方に塩化ナトリウム40.0gを入れてかき混ぜたところ、どちらもすべて溶けた。次に、2つの水溶液をゆっくり冷やして20℃まで温度を下げたところ、ミョウバンの水溶液からは結晶が出てきたが、塩化ナトリウムの水溶液からは結晶が出てこなかった。<\/p><table><caption>表　100gの水に溶ける限度の質量〔g〕<\/caption><tr><th>水の温度〔℃〕<\/th><th>0<\/th><th>20<\/th><th>40<\/th><th>60<\/th><\/tr><tr><th>ミョウバン<\/th><td>5.7<\/td><td>11.4<\/td><td>23.8<\/td><td>57.4<\/td><\/tr><tr><th>塩化ナトリウム<\/th><td>35.7<\/td><td>35.8<\/td><td>36.3<\/td><td>37.1<\/td><\/tr><\/table>","qs":[{"k":"思","text":"実験で水溶液を冷やしていったとき、ミョウバンの結晶が出始めたのは、水溶液の温度がどの範囲にあるときか。最も適するものを1つ選びなさい。","sel":["60℃から冷やし始めてすぐ","40℃より高く、60℃より低い範囲","20℃より高く、40℃より低い範囲","ちょうど20℃になったとき"],"ans":[3],"fix":true,"kai":"水200gに溶ける限度は、40℃で 23.8g×2＝47.6g、20℃で 11.4g×2＝22.8g である。40.0gは40℃ではすべて溶けているが20℃では溶けきれないので、その間の温度で結晶が出始める。"},{"k":"思","text":"実験で、20℃まで冷やしたときに出てきたミョウバンの結晶は何gか。小数第1位まで答えなさい。","num":"17.2","unit":"g","kai":"20℃の水200gに溶けるミョウバンは 11.4g×2＝22.8g までである。溶けきれなくなった 40.0g−22.8g＝17.2g が結晶として出てくる。"},{"k":"思","text":"実験のあとの20℃の塩化ナトリウム水溶液から、塩化ナトリウムの結晶をとり出す方法はどれか。最も適するものを1つ選びなさい。","sel":["水溶液を加熱して、水を蒸発させる。","水溶液をさらに冷やして、0℃まで温度を下げる。","水溶液に20℃の水を加えて、よくかき混ぜる。","水溶液をろ紙でろ過する。"],"ans":[1],"kai":"塩化ナトリウムは温度による溶ける限度の変化が小さく、0℃でも水200gに 35.7g×2＝71.4g まで溶けるので、冷やしても結晶は出ない。水を蒸発させて減らせば、溶けきれなくなった分が結晶になる。"},{"k":"思","text":"60℃の水にミョウバンを溶かして、質量パーセント濃度が25%の水溶液を200gつくった。温度を60℃に保ったとき、この水溶液には、ミョウバンをあと何g溶かすことができるか。小数第1位まで答えなさい。","num":"36.1","unit":"g","kai":"この水溶液は、ミョウバン 200g×0.25＝50g と水150gからできている。60℃の水150gに溶ける限度は 57.4g×1.5＝86.1g だから、あと 86.1g−50g＝36.1g 溶ける。"}]},{"id":"aomori_r8-d3","src":"青森県 2026年 大問3","kind":"dai","field":"生物","grade":3,"topic":"遺伝の規則性","ctx":"<p class=\"lead\">エンドウの草たけには「高い」と「低い」があり、1つの個体にはそのどちらかが現れる。草たけを高くする遺伝子をA、低くする遺伝子をaとして、表の実験1〜4を行った。ただし、どの個体も同じ数の種子をつくり、種子はすべて育つものとする。<\/p><table><caption>表　かけ合わせと結果<\/caption><tr><th>実験<\/th><th>かけ合わせ<\/th><th>できた種子から育った個体の草たけ<\/th><\/tr><tr><th>1<\/th><td>草たけが高い純系と、草たけが低い純系をかけ合わせた。<\/td><td>子はすべて高い<\/td><\/tr><tr><th>2<\/th><td>実験1でできた子を自家受粉させた。<\/td><td>孫は、高いものが600個体、低いものが200個体<\/td><\/tr><tr><th>3<\/th><td>実験2の孫のうち、草たけが高い個体Pと、草たけが低い個体をかけ合わせた。<\/td><td>すべて高い<\/td><\/tr><tr><th>4<\/th><td>実験2の孫のうち、草たけが高い個体Qと、草たけが低い個体をかけ合わせた。<\/td><td>高いものと低いものが同じ数<\/td><\/tr><\/table>","qs":[{"k":"知","text":"実験1でできた子がつくる生殖細胞について述べた文はどれか。最も適するものを1つ選びなさい。","sel":["Aをもつ生殖細胞と、aをもつ生殖細胞が、同じ数ずつできる。","すべての生殖細胞が、Aだけをもつ。","すべての生殖細胞が、Aとaの両方をもつ。","Aをもつ生殖細胞が、aをもつ生殖細胞の3倍できる。"],"ans":[1],"kai":"子の遺伝子の組み合わせはAaである。減数分裂のとき、対になっている遺伝子は分かれて別々の生殖細胞に入るので、Aをもつものとaをもつものが同じ数ずつできる。"},{"k":"思","text":"実験2でできた孫のうち、草たけが高い600個体の中に、実験1の子と同じ遺伝子の組み合わせをもつものは、およそ何個体あると考えられるか。整数で答えなさい。","num":"400","unit":"個体","kai":"孫の遺伝子の組み合わせは AA：Aa：aa＝1：2：1 の数の比になる。草たけが高いのはAAとAaで、そのうちAaは3分の2だから、600×<sup>2<\/sup>／<sub>3<\/sub>＝400個体である。"},{"k":"思","text":"個体Pと個体Qをかけ合わせたとき、できた種子から育つ個体の草たけはどうなるか。最も適するものを1つ選びなさい。","sel":["すべて高い。","高いものと低いものの数の比が、およそ3：1になる。","高いものと低いものの数の比が、およそ1：1になる。","高いものと低いものの数の比が、およそ1：3になる。","すべて低い。"],"ans":[1],"kai":"低い個体aaとかけ合わせて、すべて高くなった個体PはAA、高いものと低いものが同じ数になった個体QはAaである。AAとAaをかけ合わせると子はAAかAaになり、すべて高くなる。"},{"k":"思","text":"実験2でできた孫の800個体を、すべて自家受粉させた。できた種子から育つ個体全体では、草たけが高いものと低いものの数の比はどうなるか。最も適するものを1つ選びなさい。","sel":["3：1","2：1","5：3","1：1","7：1"],"ans":[3],"kai":"孫は AA：Aa：aa＝1：2：1 である。1個体が4個の種子をつくるとすると、AAからは高いものが4、Aaの2個体からは高いものが6と低いものが2、aaからは低いものが4できる。合わせると高いもの10に対して低いもの6で、5：3になる。"}]},{"id":"aomori_r8-d4","src":"青森県 2026年 大問6","kind":"dai","field":"地学","grade":3,"topic":"金星の見え方","ctx":"<p class=\"lead\">図は、地球の北極側から見た、太陽・金星・地球の位置関係を模式的に表したものである。内側の円は金星の公転軌道、外側の円は地球の公転軌道で、a〜dは金星の位置を示している。aとdは、地球から見て、金星が太陽から最も離れて見える位置である。<\/p><p class=\"lead\">日本のある場所で、金星がaの位置にある日に天体望遠鏡で金星を観察し、その45日後にもう一度観察した。ただし、地球は360日で、金星は225日で、それぞれ太陽のまわりを1周するものとする。<\/p><figure><svg viewBox=\"0 0 500 400\" font-family=\"sans-serif\" font-size=\"17\"><defs><marker id=\"ao8d4ar\" markerWidth=\"10\" markerHeight=\"10\" refX=\"8\" refY=\"5\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" fill=\"#222\"/><\/marker><\/defs><rect x=\"0\" y=\"0\" width=\"500\" height=\"400\" fill=\"#fff\"/><circle cx=\"230\" cy=\"180\" r=\"160\" fill=\"none\" stroke=\"#444\" stroke-width=\"1.5\"/><circle cx=\"230\" cy=\"180\" r=\"115\" fill=\"none\" stroke=\"#444\" stroke-width=\"1.5\"/><circle cx=\"230\" cy=\"180\" r=\"13\" fill=\"#fff\" stroke=\"#222\" stroke-width=\"2\"/><text x=\"230\" y=\"216\" text-anchor=\"middle\">太陽<\/text><circle cx=\"230\" cy=\"340\" r=\"10\" fill=\"#fff\" stroke=\"#222\" stroke-width=\"2\"/><text x=\"198\" y=\"328\" text-anchor=\"end\">地球<\/text><path d=\"M212 358 A24 24 0 0 0 248 358\" fill=\"none\" stroke=\"#222\" stroke-width=\"1.5\" marker-end=\"url(#ao8d4ar)\"/><text x=\"262\" y=\"388\">地球の自転の向き<\/text><path d=\"M399 225 A175 175 0 0 0 399 135\" fill=\"none\" stroke=\"#222\" stroke-width=\"1.5\" marker-end=\"url(#ao8d4ar)\"/><text x=\"410\" y=\"176\">公転の<\/text><text x=\"410\" y=\"196\">向き<\/text><circle cx=\"310\" cy=\"263\" r=\"7\" fill=\"#fff\" stroke=\"#222\" stroke-width=\"2\"/><text x=\"292\" y=\"252\" text-anchor=\"middle\">a<\/text><circle cx=\"311\" cy=\"99\" r=\"7\" fill=\"#fff\" stroke=\"#222\" stroke-width=\"2\"/><text x=\"293\" y=\"122\" text-anchor=\"middle\">b<\/text><circle cx=\"149\" cy=\"99\" r=\"7\" fill=\"#fff\" stroke=\"#222\" stroke-width=\"2\"/><text x=\"167\" y=\"122\" text-anchor=\"middle\">c<\/text><circle cx=\"150\" cy=\"263\" r=\"7\" fill=\"#fff\" stroke=\"#222\" stroke-width=\"2\"/><text x=\"168\" y=\"252\" text-anchor=\"middle\">d<\/text><\/svg><figcaption>図　太陽・金星・地球の位置関係<\/figcaption><\/figure>","qs":[{"k":"思","text":"金星がaの位置にある日、金星が見える時間帯と方位、天体望遠鏡で見た金星の形の組み合わせはどれか。最も適するものを1つ選びなさい。ただし、形は肉眼で見たときの向きに直したものとする。","sel":["明け方の東の空に、半月のような形に見える。","明け方の東の空に、満月に近い丸い形に見える。","夕方の西の空に、半月のような形に見える。","夕方の西の空に、満月に近い丸い形に見える。","夕方の東の空に、半月のような形に見える。"],"ans":[1],"kai":"地球の自転の向きから、図の地球では右側が明け方、左側が夕方の地点になる。aは太陽の右側にあるので明け方の東の空に見え、太陽から最も離れて見える位置では、金星の太陽に照らされた面のおよそ半分が地球を向くので半月のような形に見える。"},{"k":"思","text":"45日の間に、金星が公転する角度は、地球が公転する角度より何度大きいか。整数で答えなさい。","num":"27","unit":"度","kai":"45日で、地球は 360度×<sup>45<\/sup>／<sub>360<\/sub>＝45度、金星は 360度×<sup>45<\/sup>／<sub>225<\/sub>＝72度 公転する。差は 72度−45度＝27度 である。"},{"k":"思","text":"45日後に観察した金星は、aの位置にある日に観察したときと比べて、見かけの大きさと形がどうなっているか。最も適するものを1つ選びなさい。","sel":["見かけの大きさは小さくなり、欠けている部分は小さくなっている。","見かけの大きさは小さくなり、欠けている部分は大きくなっている。","見かけの大きさは大きくなり、欠けている部分は小さくなっている。","見かけの大きさは大きくなり、欠けている部分は大きくなっている。"],"ans":[1],"kai":"金星は地球より速く公転するので、aの位置からは地球を引きはなして太陽の向こう側へ回っていく。地球からの距離が大きくなるので小さく見え、太陽に照らされた面が地球のほうを向くようになるので欠けている部分は小さくなる。"},{"k":"知","text":"金星は、真夜中には見ることができない。その理由はどれか。最も適するものを1つ選びなさい。","sel":["金星は地球より内側を公転していて、地球から見て太陽と反対の方向に来ることがないから。","金星は地球より公転の速さが速く、夜の間に地平線の下へしずんでしまうから。","金星は自ら光を出していないので、太陽の光が当たらない真夜中には光らないから。","金星は地球のまわりを公転していて、真夜中には地球のかげに入るから。"],"ans":[1],"kai":"真夜中に見える天体は、地球から見て太陽と反対の方向にある。金星は地球より内側を公転しているので、いつも太陽に近い方向にあり、明け方の東の空か夕方の西の空にしか見えない。"}]},{"id":"aomori_r8-s1","src":"青森県 2026年 大問1","kind":"sho","field":"生物","grade":1,"topic":"脊椎動物の分類","ctx":"<p class=\"lead\">表は、コウモリ、ペンギン、ヤモリ、イモリ、フナの5種類の動物について、4つの特徴があてはまるものに○、あてはまらないものに×を付けたものである。A〜Eは、5種類の動物のいずれかである。<\/p><table><caption>表　動物の特徴<\/caption><tr><th>特徴<\/th><th>A<\/th><th>B<\/th><th>C<\/th><th>D<\/th><th>E<\/th><\/tr><tr><th>子は母親の体内である程度育ってからうまれる<\/th><td>×<\/td><td>×<\/td><td>○<\/td><td>×<\/td><td>×<\/td><\/tr><tr><th>殻のある卵を陸上にうむ<\/th><td>×<\/td><td>○<\/td><td>×<\/td><td>×<\/td><td>○<\/td><\/tr><tr><th>からだの表面がうろこでおおわれている<\/th><td>○<\/td><td>○<\/td><td>×<\/td><td>×<\/td><td>×<\/td><\/tr><tr><th>一生えらで呼吸する<\/th><td>○<\/td><td>×<\/td><td>×<\/td><td>×<\/td><td>×<\/td><\/tr><\/table>","qs":[{"k":"思","text":"表のA〜Eのうち、ヤモリとイモリにあてはまるものの組み合わせはどれか。最も適するものを1つ選びなさい。","sel":["ヤモリ…B　イモリ…D","ヤモリ…D　イモリ…B","ヤモリ…B　イモリ…A","ヤモリ…E　イモリ…D","ヤモリ…A　イモリ…E"],"ans":[1],"kai":"ヤモリはは虫類で、殻のある卵を陸上にうみ、からだの表面はうろこでおおわれているのでBである。イモリは両生類で、殻のない卵を水中にうみ、皮膚はしめっていてうろこがなく、成体は肺と皮膚で呼吸するのでDである。"}]},{"id":"aomori_r8-s2","src":"青森県 2026年 大問1","kind":"sho","field":"生物","grade":2,"topic":"呼吸のしくみ","ctx":"","qs":[{"k":"思","text":"底を切りとったペットボトルの口に、先にゴム風船を付けたガラス管を通したゴム栓をはめ、切りとった底にはゴム膜を張って、ヒトの胸部のモデルをつくった。ゴム膜の中央をつまんで下に引いたときのゴム風船のようすと、それがヒトのからだではどのような動きにあたるかを述べた文はどれか。最も適するものを1つ選びなさい。","sel":["ゴム風船はふくらむ。これは、横隔膜が下がって息を吸うときにあたる。","ゴム風船はふくらむ。これは、横隔膜が上がって息を吸うときにあたる。","ゴム風船はしぼむ。これは、横隔膜が下がって息をはくときにあたる。","ゴム風船はしぼむ。これは、横隔膜が上がって息をはくときにあたる。"],"ans":[1],"kai":"ゴム膜は横隔膜、ゴム風船は肺にあたる。ゴム膜を下に引くとペットボトルの中の空間が広がり、外から空気が入ってゴム風船がふくらむ。これは、横隔膜が下がって胸の空間が広がり、肺に空気が入るときと同じである。"}]},{"id":"aomori_r8-s3","src":"青森県 2026年 大問1","kind":"sho","field":"地学","grade":1,"topic":"柱状図と地層の広がり","ctx":"<p class=\"lead\">図は、ある地域の地点Pと地点Qでボーリング調査を行って得られた柱状図である。この地域の地層は、どの層も水平に重なっていて、断層やしゅう曲はない。また、凝灰岩の層は、この地域に1つしかない。<\/p><figure><svg viewBox=\"0 0 470 310\" font-family=\"sans-serif\" font-size=\"16\"><defs><pattern id=\"ao8s3mud\" width=\"8\" height=\"8\" patternUnits=\"userSpaceOnUse\"><path d=\"M0 8L8 0\" stroke=\"#333\" stroke-width=\"1\"/><\/pattern><pattern id=\"ao8s3sand\" width=\"10\" height=\"10\" patternUnits=\"userSpaceOnUse\"><circle cx=\"3\" cy=\"3\" r=\"1.2\" fill=\"#333\"/><circle cx=\"8\" cy=\"8\" r=\"1.2\" fill=\"#333\"/><\/pattern><pattern id=\"ao8s3grv\" width=\"20\" height=\"20\" patternUnits=\"userSpaceOnUse\"><circle cx=\"6\" cy=\"6\" r=\"4\" fill=\"none\" stroke=\"#333\" stroke-width=\"1\"/><circle cx=\"15\" cy=\"15\" r=\"3\" fill=\"none\" stroke=\"#333\" stroke-width=\"1\"/><\/pattern><\/defs><rect x=\"0\" y=\"0\" width=\"470\" height=\"310\" fill=\"#fff\"/><g stroke=\"#999\" stroke-width=\"1\" stroke-dasharray=\"3 3\"><line x1=\"62\" y1=\"40\" x2=\"280\" y2=\"40\"/><line x1=\"62\" y1=\"60\" x2=\"280\" y2=\"60\"/><line x1=\"62\" y1=\"80\" x2=\"280\" y2=\"80\"/><line x1=\"62\" y1=\"100\" x2=\"280\" y2=\"100\"/><line x1=\"62\" y1=\"120\" x2=\"280\" y2=\"120\"/><line x1=\"62\" y1=\"140\" x2=\"280\" y2=\"140\"/><line x1=\"62\" y1=\"160\" x2=\"280\" y2=\"160\"/><line x1=\"62\" y1=\"180\" x2=\"280\" y2=\"180\"/><line x1=\"62\" y1=\"200\" x2=\"280\" y2=\"200\"/><line x1=\"62\" y1=\"220\" x2=\"280\" y2=\"220\"/><line x1=\"62\" y1=\"240\" x2=\"280\" y2=\"240\"/><line x1=\"62\" y1=\"260\" x2=\"280\" y2=\"260\"/><line x1=\"62\" y1=\"280\" x2=\"280\" y2=\"280\"/><\/g><g text-anchor=\"end\"><text x=\"56\" y=\"46\">0<\/text><text x=\"56\" y=\"86\">2<\/text><text x=\"56\" y=\"126\">4<\/text><text x=\"56\" y=\"166\">6<\/text><text x=\"56\" y=\"206\">8<\/text><text x=\"56\" y=\"246\">10<\/text><text x=\"56\" y=\"286\">12<\/text><\/g><text x=\"4\" y=\"306\">地表からの深さ〔m〕<\/text><text x=\"130\" y=\"26\" text-anchor=\"middle\">地点P<\/text><text x=\"240\" y=\"26\" text-anchor=\"middle\">地点Q<\/text><rect x=\"100\" y=\"40\" width=\"60\" height=\"240\" fill=\"#fff\"/><rect x=\"100\" y=\"40\" width=\"60\" height=\"60\" fill=\"url(#ao8s3mud)\" stroke=\"#111\"/><rect x=\"100\" y=\"100\" width=\"60\" height=\"100\" fill=\"url(#ao8s3sand)\" stroke=\"#111\"/><rect x=\"100\" y=\"200\" width=\"60\" height=\"20\" fill=\"#666\" stroke=\"#111\"/><rect x=\"100\" y=\"220\" width=\"60\" height=\"60\" fill=\"url(#ao8s3grv)\" stroke=\"#111\"/><rect x=\"210\" y=\"40\" width=\"60\" height=\"240\" fill=\"#fff\"/><rect x=\"210\" y=\"40\" width=\"60\" height=\"60\" fill=\"url(#ao8s3sand)\" stroke=\"#111\"/><rect x=\"210\" y=\"100\" width=\"60\" height=\"20\" fill=\"#666\" stroke=\"#111\"/><rect x=\"210\" y=\"120\" width=\"60\" height=\"100\" fill=\"url(#ao8s3grv)\" stroke=\"#111\"/><rect x=\"210\" y=\"220\" width=\"60\" height=\"60\" fill=\"url(#ao8s3mud)\" stroke=\"#111\"/><rect x=\"320\" y=\"60\" width=\"36\" height=\"22\" fill=\"url(#ao8s3mud)\" stroke=\"#111\"/><text x=\"366\" y=\"77\">泥岩<\/text><rect x=\"320\" y=\"100\" width=\"36\" height=\"22\" fill=\"url(#ao8s3sand)\" stroke=\"#111\"/><text x=\"366\" y=\"117\">砂岩<\/text><rect x=\"320\" y=\"140\" width=\"36\" height=\"22\" fill=\"url(#ao8s3grv)\" stroke=\"#111\"/><text x=\"366\" y=\"157\">れき岩<\/text><rect x=\"320\" y=\"180\" width=\"36\" height=\"22\" fill=\"#666\" stroke=\"#111\"/><text x=\"366\" y=\"197\">凝灰岩<\/text><\/svg><figcaption>図　地点Pと地点Qの柱状図<\/figcaption><\/figure>","qs":[{"k":"思","text":"地点Pの地表の標高が120mであるとき、地点Qの地表の標高は何mか。整数で答えなさい。","num":"115","unit":"m","kai":"凝灰岩の層の上の面は、地点Pでは地表から8mの深さにあるので、標高は 120m−8m＝112m である。地層は水平だから地点Qでも同じ標高にあり、地点Qでは地表から3mの深さにあるので、地表の標高は 112m＋3m＝115m である。"}]},{"id":"aomori_r8-s4","src":"青森県 2026年 大問1","kind":"sho","field":"地学","grade":2,"topic":"雲のでき方","ctx":"","qs":[{"k":"思","text":"地表付近にある気温24℃の空気のかたまりが上昇した。この空気のかたまりの露点は15℃である。空気のかたまりの温度は、雲ができ始めるまでは100m上昇するごとに1℃ずつ下がり、上昇しても露点は変わらないものとすると、雲ができ始めるのは地表から何mの高さか。整数で答えなさい。","num":"900","unit":"m","kai":"空気のかたまりは、上昇すると周りの気圧が低くなるために膨張して温度が下がり、露点に達すると水蒸気が水滴になって雲ができ始める。24℃から15℃まで9℃下がればよいので、100m×9＝900m の高さである。"}]},{"id":"aomori_r8-s5","src":"青森県 2026年 大問2","kind":"sho","field":"化学","grade":2,"topic":"酸化銅の還元","ctx":"","qs":[{"k":"思","text":"酸化銅の粉末と炭素の粉末を混ぜて試験管に入れ、加熱すると、銅ができて二酸化炭素が発生する。酸化銅4.00gと炭素0.30gはちょうど反応して、銅3.20gができる。酸化銅6.00gと炭素0.60gをよく混ぜて、気体が発生しなくなるまで加熱したとき、試験管の中に残る固体の質量は何gか。小数第2位まで答えなさい。ただし、炭素は酸化銅との反応だけに使われ、発生した二酸化炭素はすべて試験管の外に出るものとする。","num":"4.95","unit":"g","kai":"酸化銅6.00gとちょうど反応する炭素は 0.30g×1.5＝0.45g で、銅は 3.20g×1.5＝4.80g できる。炭素が 0.60g−0.45g＝0.15g 残るので、固体の質量は 4.80g＋0.15g＝4.95g である。"}]},{"id":"aomori_r8-s6","src":"青森県 2026年 大問2","kind":"sho","field":"化学","grade":3,"topic":"中和と沈殿","ctx":"<p class=\"lead\">うすい水酸化バリウム水溶液を20cm<sup>3<\/sup>ずつ入れたビーカーA〜Dに、うすい硫酸を体積を変えて加えたところ、どのビーカーにも白い沈殿ができた。表は、加えたうすい硫酸の体積と、沈殿をろ過して乾燥させてからはかった質量をまとめたものである。<\/p><table><caption>表　加えた硫酸の体積と沈殿の質量<\/caption><tr><th>ビーカー<\/th><th>A<\/th><th>B<\/th><th>C<\/th><th>D<\/th><\/tr><tr><th>加えたうすい硫酸の体積〔cm<sup>3<\/sup>〕<\/th><td>4<\/td><td>8<\/td><td>12<\/td><td>16<\/td><\/tr><tr><th>沈殿の質量〔g〕<\/th><td>0.50<\/td><td>1.00<\/td><td>1.25<\/td><td>1.25<\/td><\/tr><\/table>","qs":[{"k":"思","text":"ビーカーCと同じ操作をして、うすい水酸化バリウム水溶液20cm<sup>3<\/sup>にうすい硫酸12cm<sup>3<\/sup>を加えた水溶液をもう1つつくった。この水溶液をちょうど中性にするには、同じうすい水酸化バリウム水溶液をさらに何cm<sup>3<\/sup>加えればよいか。整数で答えなさい。","num":"4","unit":"cm³","kai":"硫酸1cm<sup>3<\/sup>あたり沈殿が0.125gできるので、沈殿が1.25gで増えなくなるのは硫酸を10cm<sup>3<\/sup>加えたときで、水酸化バリウム水溶液20cm<sup>3<\/sup>と硫酸10cm<sup>3<\/sup>がちょうど中和する。ビーカーCでは硫酸が2cm<sup>3<\/sup>分余っているので、水酸化バリウム水溶液をあと4cm<sup>3<\/sup>加えればよい。"}]},{"id":"aomori_r8-s7","src":"青森県 2026年 大問2","kind":"sho","field":"物理","grade":1,"topic":"凸レンズと像","ctx":"","qs":[{"k":"思","text":"光学台の上に、光源、矢印の形の穴をあけた板（物体）、凸レンズ、スクリーンをこの順に並べた。物体と凸レンズの距離を24cm、凸レンズとスクリーンの距離を24cmにしたとき、スクリーンに物体と同じ大きさのはっきりした像がうつった。次に、凸レンズは動かさずに、物体を凸レンズに6cm近づけた。このとき、スクリーンにはっきりした像をうつすためのスクリーンの動かし方と、うつる像の大きさについて述べた文はどれか。最も適するものを1つ選びなさい。","sel":["スクリーンを凸レンズから遠ざける。像は物体より大きい。","スクリーンを凸レンズから遠ざける。像は物体より小さい。","スクリーンを凸レンズに近づける。像は物体より大きい。","スクリーンを凸レンズに近づける。像は物体より小さい。","スクリーンをどこに動かしても、像はうつらない。"],"ans":[1],"kai":"物体と同じ大きさの実像ができるのは、物体が焦点距離の2倍の位置にあるときだから、この凸レンズの焦点距離は12cmである。物体を18cmの位置（焦点距離の2倍より近く、焦点より遠い位置）に置くと、実像は焦点距離の2倍の位置より遠くにでき、物体より大きくなる。"}]},{"id":"aomori_r8-s8","src":"青森県 2026年 大問2","kind":"sho","field":"物理","grade":3,"topic":"位置エネルギーと仕事","ctx":"<p class=\"lead\">斜面と水平面をなめらかにつないだレールを使い、質量のちがう小球を斜面上のいろいろな高さから静かにはなして、水平面に置いた木片に当て、木片が動いた距離を調べた。表はその結果である。高さは、水平面から小球をはなした位置までの高さである。<\/p><table><caption>表　木片が動いた距離〔cm〕<\/caption><tr><th>小球の質量<\/th><th>高さ5cm<\/th><th>高さ10cm<\/th><th>高さ15cm<\/th><\/tr><tr><th>20g<\/th><td>2<\/td><td>4<\/td><td>6<\/td><\/tr><tr><th>40g<\/th><td>4<\/td><td>8<\/td><td>12<\/td><\/tr><tr><th>60g<\/th><td>6<\/td><td>12<\/td><td>18<\/td><\/tr><\/table>","qs":[{"k":"思","text":"質量30gの小球を当てて、木片を15cm動かしたい。小球を何cmの高さからはなせばよいか。ただし、表から分かる関係は、表にない質量や高さでも成り立つものとする。整数で答えなさい。","num":"25","unit":"cm","kai":"木片が動いた距離は、小球の質量と高さのそれぞれに比例している。質量30gの小球は、高さ5cmのとき 2cm×1.5＝3cm 動かすので、15cm動かすには 5cm×<sup>15<\/sup>／<sub>3<\/sub>＝25cm の高さからはなせばよい。"}]},{"id":"nagano_r8-d1","src":"長野県 2026年 問4","kind":"dai","field":"物理","grade":3,"topic":"斜面を下る台車の運動とエネルギー","ctx":"<p class=\"lead\">台車の運動を調べるため、次の実験を行った。ただし、摩擦や空気の抵抗は考えず、台車は斜面の下端をなめらかに通過するものとする。<\/p><p>〔実験〕図のように、斜面と水平面をなめらかにつないだコースをつくり、台車の先端を斜面上の点Pに合わせて静かにはなした。点Pから斜面の下端の点Qまでの長さは24.0cmである。台車の運動を、1秒間に50回打点する記録タイマーで記録し、テープを、台車をはなした瞬間の打点から5打点ごとに切って、順にa〜hとした。表は、それぞれのテープの長さである。<\/p><figure><svg viewBox=\"0 0 480 200\" font-family=\"sans-serif\" font-size=\"16\"><g fill=\"none\" stroke=\"#222\"><path d=\"M30 31.25 L220 150 L465 150\" stroke-width=\"3\"/><g transform=\"translate(95,72) rotate(32)\" stroke-width=\"2\"><rect x=\"-78\" y=\"-20\" width=\"26\" height=\"20\" fill=\"#bbb\"/><line x1=\"-52\" y1=\"-13\" x2=\"-22\" y2=\"-13\"/><rect x=\"-22\" y=\"-24\" width=\"44\" height=\"14\" fill=\"#fff\"/><circle cx=\"-12\" cy=\"-5.5\" r=\"5\" fill=\"#fff\"/><circle cx=\"12\" cy=\"-5.5\" r=\"5\" fill=\"#fff\"/><line x1=\"22\" y1=\"2\" x2=\"22\" y2=\"14\"/><\/g><line x1=\"220\" y1=\"152\" x2=\"220\" y2=\"164\" stroke-width=\"2\"/><line x1=\"70\" y1=\"20\" x2=\"48\" y2=\"30\" stroke-width=\"1\"/><\/g><g fill=\"#111\"><text x=\"74\" y=\"22\">記録タイマー<\/text><text x=\"136\" y=\"62\">台車<\/text><text x=\"94\" y=\"112\">P<\/text><text x=\"214\" y=\"182\">Q<\/text><text x=\"330\" y=\"176\">水平面<\/text><text x=\"150\" y=\"140\">斜面<\/text><\/g><\/svg><figcaption>図　実験のようす<\/figcaption><\/figure><table><caption>表　テープの長さ<\/caption><tr><th>テープ<\/th><td>a<\/td><td>b<\/td><td>c<\/td><td>d<\/td><td>e<\/td><td>f<\/td><td>g<\/td><td>h<\/td><\/tr><tr><th>長さ〔cm〕<\/th><td>1.5<\/td><td>4.5<\/td><td>7.5<\/td><td>10.5<\/td><td>12.0<\/td><td>12.0<\/td><td>12.0<\/td><td>12.0<\/td><\/tr><\/table>","qs":[{"k":"知","text":"テープcを記録している間の、台車の平均の速さは何cm/sか。整数で答えなさい。","num":"75","unit":"cm/s","kai":"5打点分は0.1秒間にあたる。0.1秒間に7.5cm進んだので、7.5÷0.1＝75cm/sである。"},{"k":"思","text":"台車が斜面を下っている間の、台車にはたらく重力の斜面に平行な分力の大きさと、台車の速さについて、表から考えられることはどれか。最も適するものを1つ選びなさい。","sel":["分力の大きさは変わらず、速さは一定の割合で大きくなる。","分力の大きさはしだいに大きくなり、速さの増え方もしだいに大きくなる。","分力の大きさはしだいに小さくなり、速さの増え方もしだいに小さくなる。","分力の大きさは変わらず、速さも変わらない。"],"ans":[1],"kai":"テープa〜dの長さは3.0cmずつ長くなっていて、速さは0.1秒ごとに同じだけ増えている。斜面の傾きが一定なので、重力の斜面に平行な分力の大きさは変わらず、一定の力がはたらき続けるからである。"},{"k":"思","text":"台車をはなしてから、台車の先端が、水平面上で点Qから84cmはなれた点に達するまでの時間は何秒か。小数第1位まで答えなさい。","num":"1.1","unit":"秒","kai":"テープa〜dの長さの合計は24.0cmなので、台車は0.4秒後に点Qに達する。水平面上では0.1秒間に12.0cm、つまり120cm/sの等速直線運動をするので、84÷120＝0.7秒かかり、合わせて1.1秒である。"},{"k":"思","text":"斜面の傾きだけを大きくし、点Pと同じ高さになる斜面上の点から台車を静かにはなした。水平面上での台車の速さと、台車をはなしてから斜面の下端に達するまでの時間は、もとの実験と比べてどうなるか。最も適するものを1つ選びなさい。","sel":["水平面上での速さは同じで、下端に達するまでの時間は短くなる。","水平面上での速さは同じで、下端に達するまでの時間も同じである。","水平面上での速さは大きくなり、下端に達するまでの時間は短くなる。","水平面上での速さは大きくなり、下端に達するまでの時間は同じである。","水平面上での速さは小さくなり、下端に達するまでの時間は長くなる。"],"ans":[1],"kai":"はじめの高さが同じなので位置エネルギーが同じで、水平面で移り変わった運動エネルギーも同じになり、速さは変わらない。傾きが大きいと重力の斜面に平行な分力が大きく、斜面の長さも短くなるので、下端に達するまでの時間は短くなる。"}]},{"id":"nagano_r8-d2","src":"長野県 2026年 問2","kind":"dai","field":"化学","grade":3,"topic":"アルカリの性質と中和","ctx":"<p class=\"lead\">アルカリ性の水溶液の性質と中和について調べるため、次の実験を行った。<\/p><p>〔実験1〕図のように、硝酸カリウム水溶液でしめらせたろ紙と赤色リトマス紙をスライドガラスにのせ、両端を金属のクリップではさんで電源装置につないだ。赤色リトマス紙の中央に、うすい水酸化ナトリウム水溶液をしみこませた糸を置き、電圧を加えて、リトマス紙の色の変化を観察した。<\/p><figure><svg viewBox=\"0 0 480 180\" font-family=\"sans-serif\" font-size=\"16\"><g stroke=\"#222\" stroke-width=\"2\"><rect x=\"90\" y=\"70\" width=\"300\" height=\"76\" fill=\"#fff\"/><rect x=\"112\" y=\"82\" width=\"256\" height=\"52\" fill=\"#ddd\"/><rect x=\"150\" y=\"96\" width=\"180\" height=\"24\" fill=\"#fff\"/><line x1=\"240\" y1=\"90\" x2=\"240\" y2=\"126\" stroke-width=\"4\"/><rect x=\"84\" y=\"92\" width=\"34\" height=\"32\" fill=\"#777\"/><rect x=\"362\" y=\"92\" width=\"34\" height=\"32\" fill=\"#777\"/><g stroke-width=\"1\"><line x1=\"240\" y1=\"88\" x2=\"240\" y2=\"50\"/><line x1=\"300\" y1=\"100\" x2=\"330\" y2=\"50\"/><line x1=\"130\" y1=\"88\" x2=\"120\" y2=\"50\"/><\/g><\/g><g fill=\"#111\"><text x=\"232\" y=\"44\">糸<\/text><text x=\"296\" y=\"44\">赤色リトマス紙<\/text><text x=\"100\" y=\"44\">ろ紙<\/text><text x=\"30\" y=\"114\">陰極<\/text><text x=\"406\" y=\"114\">陽極<\/text><text x=\"180\" y=\"170\">スライドガラス<\/text><\/g><\/svg><figcaption>図　実験1の装置<\/figcaption><\/figure><p>〔実験2〕うすい水酸化ナトリウム水溶液10.0cm<sup>3<\/sup>をビーカーにとり、BTB溶液を数滴加えると、水溶液は青色になった。ここに、うすい塩酸を少しずつ加えていくと、12.0cm<sup>3<\/sup>加えたところで水溶液は緑色になり、さらに加えると黄色になった。うすい塩酸は、合計で16.0cm<sup>3<\/sup>加えた。<\/p>","qs":[{"k":"思","text":"実験1の結果と、そのようになる理由を述べた文はどれか。最も適するものを1つ選びなさい。","sel":["青色に変わった部分が陽極側に広がる。水酸化物イオンが－の電気を帯びているからである。","青色に変わった部分が陰極側に広がる。水酸化物イオンが＋の電気を帯びているからである。","青色に変わった部分が陽極側に広がる。ナトリウムイオンが－の電気を帯びているからである。","青色に変わった部分が陰極側に広がる。ナトリウムイオンが＋の電気を帯びているからである。"],"ans":[1],"kai":"赤色リトマス紙を青色に変えるのは、アルカリ性を示す水酸化物イオンである。水酸化物イオンは－の電気を帯びた陰イオンなので、陽極側に引かれて移動する。"},{"k":"知","text":"実験2で、水溶液が緑色になったとき、水溶液中に最も多くふくまれているイオンの組み合わせはどれか。最も適するものを1つ選びなさい。","sel":["Na<sup>+<\/sup> と Cl<sup>-<\/sup>","Na<sup>+<\/sup> と OH<sup>-<\/sup>","H<sup>+<\/sup> と Cl<sup>-<\/sup>","H<sup>+<\/sup> と OH<sup>-<\/sup>"],"ans":[1],"kai":"緑色は中性を示し、水素イオンと水酸化物イオンはたがいに結びついて水になっている。塩化ナトリウムは水溶液中で電離しているので、ナトリウムイオンと塩化物イオンが残る。"},{"k":"思","text":"実験2で、うすい塩酸を加える前の水溶液中の水酸化物イオンの数をn個とする。うすい塩酸を9.0cm<sup>3<\/sup>加えたとき、水溶液中の水酸化物イオンの数は、nの何％か。整数で答えなさい。","num":"25","unit":"％","kai":"12.0cm<sup>3<\/sup>の塩酸でn個の水酸化物イオンがすべて中和される。9.0cm<sup>3<\/sup>では全体の4分の3が中和されるので、残りは4分の1、つまり25％である。"},{"k":"思","text":"実験2で、うすい塩酸を加え始めてから16.0cm<sup>3<\/sup>加え終わるまでの、水溶液中のイオンの総数の変化はどれか。最も適するものを1つ選びなさい。","sel":["12.0cm<sup>3<\/sup>加えるまでは変わらず、その後は増える。","12.0cm<sup>3<\/sup>加えるまでは減り、その後は増える。","12.0cm<sup>3<\/sup>加えるまでは減り、その後は変わらない。","12.0cm<sup>3<\/sup>加えるまでは増え、その後は変わらない。","加え始めから加え終わりまで、増え続ける。"],"ans":[1],"kai":"中性になるまでは、水酸化物イオンが1個減るたびに塩化物イオンが1個増えるので、総数は変わらない。中性になった後は、加えた塩酸の水素イオンと塩化物イオンがそのまま増える。"}]},{"id":"nagano_r8-d3","src":"長野県 2026年 問1","kind":"dai","field":"生物","grade":2,"topic":"だ液のはたらきと粒の大きさ","ctx":"<p class=\"lead\">だ液のはたらきと、デンプンや糖の粒の大きさについて調べるため、次の実験を行った。セロハンには目に見えない小さなあながたくさんあいていて、あなより小さい粒だけが通りぬける。<\/p><p>〔実験〕① セロハンの袋Aにデンプン溶液10cm<sup>3<\/sup>と水2cm<sup>3<\/sup>を、セロハンの袋Bにデンプン溶液10cm<sup>3<\/sup>と水でうすめただ液2cm<sup>3<\/sup>を入れ、図のように、それぞれ約40℃の湯が入ったビーカーに15分間つけた。<br>② それぞれについて、袋の内側の液と、袋の外側の液（ビーカーの湯）を2本ずつの試験管にとり、一方にはヨウ素液を加え、もう一方にはベネジクト液を加えて加熱して、変化を調べた。表は、その結果である。<\/p><figure><svg viewBox=\"0 0 480 220\" font-family=\"sans-serif\" font-size=\"16\"><g fill=\"none\" stroke=\"#222\" stroke-width=\"2\"><rect x=\"62\" y=\"92\" width=\"136\" height=\"96\" fill=\"#eee\" stroke=\"none\"/><path d=\"M60 50 L60 190 L200 190 L200 50\"/><line x1=\"60\" y1=\"92\" x2=\"200\" y2=\"92\" stroke-width=\"1\"/><path d=\"M112 36 L112 150 Q112 170 130 170 Q148 170 148 150 L148 36\" fill=\"#bbb\"/><rect x=\"282\" y=\"92\" width=\"136\" height=\"96\" fill=\"#eee\" stroke=\"none\"/><path d=\"M280 50 L280 190 L420 190 L420 50\"/><line x1=\"280\" y1=\"92\" x2=\"420\" y2=\"92\" stroke-width=\"1\"/><path d=\"M332 36 L332 150 Q332 170 350 170 Q368 170 368 150 L368 36\" fill=\"#bbb\"/><g stroke-width=\"1\"><line x1=\"148\" y1=\"60\" x2=\"222\" y2=\"30\"/><line x1=\"190\" y1=\"150\" x2=\"216\" y2=\"130\"/><\/g><\/g><g fill=\"#111\"><text x=\"124\" y=\"212\">A<\/text><text x=\"344\" y=\"212\">B<\/text><text x=\"206\" y=\"24\">セロハンの袋<\/text><text x=\"206\" y=\"126\">約40℃<\/text><text x=\"206\" y=\"146\">の湯<\/text><\/g><\/svg><figcaption>図　実験のようす<\/figcaption><\/figure><table><caption>表　結果<\/caption><tr><th><\/th><th>Aの内側<\/th><th>Aの外側<\/th><th>Bの内側<\/th><th>Bの外側<\/th><\/tr><tr><th>ヨウ素液<\/th><td>青紫色になった<\/td><td>変化なし<\/td><td>変化なし<\/td><td>変化なし<\/td><\/tr><tr><th>ベネジクト液<\/th><td>変化なし<\/td><td>変化なし<\/td><td>赤褐色の沈殿ができた<\/td><td>赤褐色の沈殿ができた<\/td><\/tr><\/table>","qs":[{"k":"思","text":"「デンプンがなくなって糖ができたのは、だ液のはたらきによる」ことは、表のどの結果を比べると分かるか。最も適するものを1つ選びなさい。","sel":["Aの内側の液とBの内側の液の結果","Aの内側の液とAの外側の液の結果","Bの内側の液とBの外側の液の結果","Aの外側の液とBの外側の液の結果"],"ans":[1],"kai":"AとBのちがいはだ液があるかないかだけである。内側の液どうしを比べると、だ液を入れたBだけでデンプンがなくなり、糖ができていることが分かる。"},{"k":"思","text":"表から考えられる、デンプンの粒、セロハンのあな、だ液のはたらきでできた糖の粒の大きさの関係はどれか。最も適するものを1つ選びなさい。","sel":["デンプンの粒 ＞ セロハンのあな ＞ 糖の粒","糖の粒 ＞ セロハンのあな ＞ デンプンの粒","デンプンの粒 ＞ 糖の粒 ＞ セロハンのあな","セロハンのあな ＞ デンプンの粒 ＞ 糖の粒"],"ans":[1],"kai":"Aの外側の液でヨウ素液が変化しないので、デンプンの粒はあなを通りぬけていない。Bの外側の液でベネジクト液が反応したので、糖の粒はあなを通りぬけている。"},{"k":"思","text":"袋Bで起こったことを、デンプンの粒1個が分解されると糖の粒5個になるというモデルで考える。はじめ、袋の内側にデンプンの粒が12個あり、糖の粒はどこにもなかった。実験の途中（15分たつ前）のある時点で、袋の内側にデンプンの粒が4個、糖の粒が16個あったとすると、このとき袋の外側にある糖の粒は何個か。整数で答えなさい。","num":"24","unit":"個","kai":"分解されたデンプンの粒は12－4＝8個なので、できた糖の粒は8×5＝40個である。内側に16個あるので、外側には40－16＝24個ある。"},{"k":"知","text":"ヒトの体内で、デンプンが最終的に分解されてできる物質と、その物質が小腸の柔毛で吸収されて入る管の組み合わせはどれか。最も適するものを1つ選びなさい。","sel":["ブドウ糖 ― 毛細血管","ブドウ糖 ― リンパ管","アミノ酸 ― 毛細血管","モノグリセリド ― リンパ管"],"ans":[1],"kai":"デンプンは、だ液やすい液、小腸のかべの消化酵素のはたらきでブドウ糖にまで分解される。ブドウ糖は柔毛で吸収されて毛細血管に入る。"}]},{"id":"nagano_r8-d4","src":"長野県 2026年 問3","kind":"dai","field":"地学","grade":1,"topic":"地震のゆれの伝わり方","ctx":"<p class=\"lead\">ある地震について、震源からの距離がちがう地点A〜Cで、ゆれが始まった時刻を調べた。表は、その記録である。ただし、P波とS波は、それぞれ一定の速さで伝わるものとする。<\/p><table><caption>表　地点A〜Cの記録<\/caption><tr><th>地点<\/th><th>震源からの距離<\/th><th>初期微動が始まった時刻<\/th><th>主要動が始まった時刻<\/th><\/tr><tr><td>A<\/td><td>48km<\/td><td>10時15分26秒<\/td><td>10時15分32秒<\/td><\/tr><tr><td>B<\/td><td>96km<\/td><td>10時15分32秒<\/td><td>10時15分44秒<\/td><\/tr><tr><td>C<\/td><td>144km<\/td><td>10時15分38秒<\/td><td>10時15分56秒<\/td><\/tr><\/table>","qs":[{"k":"知","text":"この地震のP波の伝わる速さは何km/sか。整数で答えなさい。","num":"8","unit":"km/s","kai":"初期微動を伝えるのはP波である。地点AとBの距離の差48kmを、初期微動が始まった時刻の差6秒で伝わっているので、48÷6＝8km/sである。"},{"k":"思","text":"この地震が発生した時刻は、10時15分何秒か。整数で答えなさい。","num":"20","unit":"秒","kai":"P波は8km/sで伝わるので、震源から48kmの地点Aに届くまでに6秒かかる。地点Aで初期微動が始まった10時15分26秒の6秒前の、10時15分20秒である。"},{"k":"思","text":"この地震で、震源からの距離が120kmの地点の初期微動継続時間は何秒か。整数で答えなさい。","num":"15","unit":"秒","kai":"初期微動継続時間は、地点Aで6秒、Bで12秒、Cで18秒と、震源からの距離に比例している。48kmで6秒なので、120kmでは6×120÷48＝15秒である。"},{"k":"思","text":"この地震と震央がほぼ同じで、マグニチュードもほぼ同じ別の地震では、地点A〜Cのどこでも、震度がこの地震より小さかった。その理由として最も適するものを1つ選びなさい。","sel":["別の地震は、震源がより深かったから。","別の地震は、震源がより浅かったから。","別の地震は、地震の規模がずっと小さかったから。","別の地震は、P波とS波の速さの差が小さかったから。"],"ans":[1],"kai":"マグニチュードが同じなら地震の規模は同じである。震央が同じでも震源が深いと、各地点の震源からの距離が大きくなり、ゆれは小さくなる。"}]},{"id":"nagano_r8-s1","src":"長野県 2026年 問4","kind":"sho","field":"物理","grade":2,"topic":"電流が磁界から受ける力","ctx":"","qs":[{"k":"思","text":"U字形磁石の間に、導線でつくったコイルをつるし、電熱線と電源装置につないで電流を流したところ、コイルは磁石の奥のほうへ動いた。次に、電源装置の電圧は変えずに電熱線を抵抗の小さいものにかえ、さらに、U字形磁石のN極とS極が入れかわるように磁石を置き直して、はじめと同じ向きに電流を流した。このとき、コイルの動く向きと動く大きさは、はじめと比べてどうなるか。最も適するものを1つ選びなさい。","sel":["はじめと逆の向きに、はじめより大きく動く。","はじめと逆の向きに、はじめより小さく動く。","はじめと同じ向きに、はじめより大きく動く。","はじめと同じ向きに、はじめより小さく動く。","はじめと逆の向きに、はじめと同じ大きさで動く。"],"ans":[1],"kai":"磁界の向きが逆になるので、電流が受ける力の向きは逆になる。電圧が同じで抵抗が小さいと電流が大きくなるので、受ける力は大きくなる。"}]},{"id":"nagano_r8-s2","src":"長野県 2026年 問4","kind":"sho","field":"物理","grade":2,"topic":"コイルのまわりの磁界","ctx":"<figure><svg viewBox=\"0 0 440 200\" font-family=\"sans-serif\" font-size=\"16\"><g stroke=\"#222\" fill=\"none\"><rect x=\"120\" y=\"80\" width=\"204\" height=\"60\" fill=\"#f4f4f4\" stroke=\"#999\" stroke-width=\"1.5\"/><g stroke-width=\"2.5\"><line x1=\"130\" y1=\"140\" x2=\"142\" y2=\"80\"/><line x1=\"154\" y1=\"140\" x2=\"166\" y2=\"80\"/><line x1=\"178\" y1=\"140\" x2=\"190\" y2=\"80\"/><line x1=\"202\" y1=\"140\" x2=\"214\" y2=\"80\"/><line x1=\"226\" y1=\"140\" x2=\"238\" y2=\"80\"/><line x1=\"250\" y1=\"140\" x2=\"262\" y2=\"80\"/><line x1=\"274\" y1=\"140\" x2=\"286\" y2=\"80\"/><line x1=\"298\" y1=\"140\" x2=\"310\" y2=\"80\"/><line x1=\"130\" y1=\"140\" x2=\"130\" y2=\"185\"/><line x1=\"322\" y1=\"140\" x2=\"322\" y2=\"185\"/><\/g><\/g><g fill=\"#111\"><polygon points=\"161.6,100 166.5,117.5 151.5,114.5\"/><polygon points=\"233.6,100 238.5,117.5 223.5,114.5\"/><polygon points=\"305.6,100 310.5,117.5 295.5,114.5\"/><circle cx=\"385\" cy=\"110\" r=\"4\"/><circle cx=\"226\" cy=\"40\" r=\"4\"/><text x=\"394\" y=\"104\">P<\/text><text x=\"236\" y=\"36\">Q<\/text><text x=\"200\" y=\"168\">コイル<\/text><\/g><\/svg><figcaption>図　コイルと点P、Q<\/figcaption><\/figure>","qs":[{"k":"思","text":"図のように、コイルに電流を流した。図の矢印は、コイルの手前側の導線を流れる電流の向きを表している。コイルの右側の点Pと、コイルの真上の点Qに方位磁針を置いたとき、それぞれのN極がさす向きの組み合わせはどれか。最も適するものを1つ選びなさい。ただし、地球の磁界の影響は考えないものとする。","sel":["点Pでは図の左向き、点Qでは図の右向き","点Pでは図の左向き、点Qでも図の左向き","点Pでは図の右向き、点Qでは図の左向き","点Pでは図の右向き、点Qでも図の右向き"],"ans":[1],"kai":"右手の4本の指を電流の向きに合わせてコイルをにぎると、親指は左を向くので、コイルの内側の磁界は左向きである。磁界はコイルの左端から出て外側を回り、右端に入るので、点Pでは左向き、コイルの外側の点Qでは右向きになる。"}]},{"id":"nagano_r8-s3","src":"長野県 2026年 問2","kind":"sho","field":"化学","grade":2,"topic":"金属と結びつく酸素の質量","ctx":"<p class=\"lead\">銅の粉末とマグネシウムの粉末を、それぞれステンレス皿にうすく広げて十分に加熱し、完全に酸化させた。表は、加熱前の金属の質量と、できた酸化物の質量の関係である。<\/p><table><caption>表　金属の質量と酸化物の質量<\/caption><tr><th>銅の粉末の質量〔g〕<\/th><td>0.4<\/td><td>0.8<\/td><td>1.2<\/td><\/tr><tr><th>酸化銅の質量〔g〕<\/th><td>0.5<\/td><td>1.0<\/td><td>1.5<\/td><\/tr><tr><th>マグネシウムの粉末の質量〔g〕<\/th><td>0.3<\/td><td>0.6<\/td><td>1.2<\/td><\/tr><tr><th>酸化マグネシウムの質量〔g〕<\/th><td>0.5<\/td><td>1.0<\/td><td>2.0<\/td><\/tr><\/table>","qs":[{"k":"思","text":"マグネシウムの粉末0.9gを完全に酸化させるときに結びつく酸素と、同じ質量の酸素は、何gの銅と過不足なく結びつくか。小数第1位まで答えなさい。","num":"2.4","unit":"g","kai":"マグネシウム0.3gは酸素0.2gと結びつくので、0.9gでは酸素0.6gと結びつく。銅0.4gは酸素0.1gと結びつくので、酸素0.6gと結びつく銅は0.4×6＝2.4gである。"}]},{"id":"nagano_r8-s4","src":"長野県 2026年 問2","kind":"sho","field":"化学","grade":1,"topic":"ガスバーナーの使い方","ctx":"","qs":[{"k":"知","text":"青色の炎で加熱していたガスバーナーの火を消すとき、閉じる順として最も適するものを1つ選びなさい。","sel":["空気調節ねじ → ガス調節ねじ → 元栓","ガス調節ねじ → 空気調節ねじ → 元栓","元栓 → 空気調節ねじ → ガス調節ねじ","元栓 → ガス調節ねじ → 空気調節ねじ"],"ans":[1],"kai":"火を消すときは、火をつけるときと逆の順に操作する。空気調節ねじ、ガス調節ねじの順に閉じ、最後に元栓を閉じる。"}]},{"id":"nagano_r8-s5","src":"長野県 2026年 問1","kind":"sho","field":"生物","grade":3,"topic":"細胞分裂の順序","ctx":"<p class=\"lead\">ネギの根の先端近くを染色して顕微鏡で観察すると、次のa〜dのような、細胞分裂のいろいろな段階の細胞が見られた。<\/p><p>a　染色体が細胞の中央付近に並んでいる。<br>b　核の形が見えなくなり、ひものような染色体が現れている。<br>c　細胞の中央にしきりができ始め、両端に核の形が現れている。<br>d　染色体が2つに分かれて、細胞の両端に移動している。<\/p>","qs":[{"k":"知","text":"a〜dを、細胞分裂が進む順に並べたものはどれか。最も適するものを1つ選びなさい。","sel":["b → a → d → c","b → d → a → c","a → b → d → c","a → d → b → c","b → a → c → d"],"ans":[1],"kai":"細胞分裂では、まず染色体が見えるようになり、中央付近に並んだあと、分かれて両端に移動する。その後、両端に核ができ、中央にしきりができて2つの細胞になる。"}]},{"id":"nagano_r8-s6","src":"長野県 2026年 問1","kind":"sho","field":"生物","grade":3,"topic":"根がのびるしくみ","ctx":"<p class=\"lead\">発芽したソラマメの根に、先端から2mmおきに印をつけ、2日後に観察すると、先端に近い印の間隔だけが広がっていた。この根の、先端近くの部分Xと、先端から少しはなれた、印の間隔が広がった部分Yを、同じ倍率の顕微鏡で観察した。Xでは小さい細胞がすき間なく並び、染色体が見える細胞もあった。Yでは、Xより大きく縦に長い細胞が並び、染色体が見える細胞はなかった。<\/p>","qs":[{"k":"思","text":"この観察から考えられる、根がのびるしくみはどれか。最も適するものを1つ選びなさい。","sel":["先端近くで細胞分裂によって細胞の数がふえ、ふえた細胞の1つ1つが大きくなることでのびる。","先端近くの細胞が、細胞分裂をしないで大きくなり続けることでのびる。","根のどの部分でも細胞分裂が同じようにさかんに行われ、細胞の数がふえることだけでのびる。","先端からはなれた部分で細胞分裂によって細胞の数がふえ、先端近くの細胞を押し出すことでのびる。"],"ans":[1],"kai":"染色体が見える細胞があるXでは細胞分裂が行われ、小さい細胞がふえている。Yの細胞はXより大きいので、分裂でふえた細胞が大きくなることで根がのびるといえる。"}]},{"id":"nagano_r8-s7","src":"長野県 2026年 問3","kind":"sho","field":"地学","grade":3,"topic":"月の1日の動き","ctx":"","qs":[{"k":"知","text":"日本のある地点で、満月が午前0時ごろに真南の空に見えた。同じ日の午前3時ごろ、この月が見える方位と高さはどれか。最も適するものを1つ選びなさい。","sel":["南西の空に、午前0時ごろより低く見える。","南西の空に、午前0時ごろより高く見える。","南東の空に、午前0時ごろより低く見える。","南東の空に、午前0時ごろより高く見える。"],"ans":[1],"kai":"月は、地球の自転によって、太陽や星と同じように東からのぼり、南の空を通って西にしずむように見える。真南にあるときが最も高いので、3時間後には南西の空に低く見える。"}]},{"id":"nagano_r8-s8","src":"長野県 2026年 問3","kind":"sho","field":"地学","grade":3,"topic":"月の位置と見え方","ctx":"<figure><svg viewBox=\"0 0 480 300\" font-family=\"sans-serif\" font-size=\"16\"><g stroke=\"#222\" fill=\"none\"><circle cx=\"260\" cy=\"150\" r=\"105\" stroke=\"#888\" stroke-dasharray=\"4 4\"/><g stroke-width=\"2\"><line x1=\"15\" y1=\"115\" x2=\"88\" y2=\"115\"/><line x1=\"15\" y1=\"150\" x2=\"88\" y2=\"150\"/><line x1=\"15\" y1=\"185\" x2=\"88\" y2=\"185\"/><path d=\"M292 164 A 35 35 0 0 0 268 116\"/><\/g><circle cx=\"260\" cy=\"150\" r=\"22\" fill=\"#999\" stroke-width=\"1.5\"/><path d=\"M260 128 A 22 22 0 0 0 260 172 Z\" fill=\"#fff\" stroke-width=\"1.5\"/><g stroke-width=\"1.5\"><circle cx=\"155\" cy=\"150\" r=\"13\" fill=\"#444\"/><path d=\"M155 137 A 13 13 0 0 0 155 163 Z\" fill=\"#fff\"/><circle cx=\"186\" cy=\"224\" r=\"13\" fill=\"#444\"/><path d=\"M186 211 A 13 13 0 0 0 186 237 Z\" fill=\"#fff\"/><circle cx=\"260\" cy=\"255\" r=\"13\" fill=\"#444\"/><path d=\"M260 242 A 13 13 0 0 0 260 268 Z\" fill=\"#fff\"/><circle cx=\"334\" cy=\"224\" r=\"13\" fill=\"#444\"/><path d=\"M334 211 A 13 13 0 0 0 334 237 Z\" fill=\"#fff\"/><circle cx=\"365\" cy=\"150\" r=\"13\" fill=\"#444\"/><path d=\"M365 137 A 13 13 0 0 0 365 163 Z\" fill=\"#fff\"/><circle cx=\"334\" cy=\"76\" r=\"13\" fill=\"#444\"/><path d=\"M334 63 A 13 13 0 0 0 334 89 Z\" fill=\"#fff\"/><circle cx=\"260\" cy=\"45\" r=\"13\" fill=\"#444\"/><path d=\"M260 32 A 13 13 0 0 0 260 58 Z\" fill=\"#fff\"/><circle cx=\"186\" cy=\"76\" r=\"13\" fill=\"#444\"/><path d=\"M186 63 A 13 13 0 0 0 186 89 Z\" fill=\"#fff\"/><\/g><\/g><g fill=\"#111\"><polygon points=\"98,115 86,109 86,121\"/><polygon points=\"98,150 86,144 86,156\"/><polygon points=\"98,185 86,179 86,191\"/><polygon points=\"257,115 270,108 270,123\"/><text x=\"12\" y=\"96\">太陽の光<\/text><text x=\"122\" y=\"156\">A<\/text><text x=\"158\" y=\"246\">B<\/text><text x=\"254\" y=\"290\">C<\/text><text x=\"352\" y=\"246\">D<\/text><text x=\"386\" y=\"156\">E<\/text><text x=\"352\" y=\"68\">F<\/text><text x=\"254\" y=\"26\">G<\/text><text x=\"158\" y=\"68\">H<\/text><text x=\"244\" y=\"194\">地球<\/text><text x=\"292\" y=\"110\" font-size=\"15\">自転の向き<\/text><\/g><\/svg><figcaption>図　地球の北極側から見た、月の位置と太陽の光<\/figcaption><\/figure>","qs":[{"k":"思","text":"図は、地球のまわりを公転する月の位置A〜Hと太陽の光の向きを、地球の北極側から見て表したものである。日本のある地点で、日の出のころに月が真南の空に見えた。このときの月の位置と、月の見え方の組み合わせはどれか。最も適するものを1つ選びなさい。","sel":["Gの位置にあり、左半分が光って見える。","Gの位置にあり、右半分が光って見える。","Cの位置にあり、左半分が光って見える。","Cの位置にあり、右半分が光って見える。"],"ans":[1],"kai":"日の出のころの地点は、地球の昼と夜の境目のうち、自転によってこれから昼の側に入る所で、図では地球の上側にあたり、真南の空はGの方向になる。このとき太陽は東、つまり南を向いて左側にあるので、月は左半分が光って見える。"}]},{"id":"miyagi_r8-d1","src":"宮城県 2026年 第二問","kind":"dai","field":"物理","grade":3,"topic":"運動エネルギーと仕事","ctx":"<p class=\"lead\">小球がもつエネルギーについて調べるために、次の実験を行った。<\/p><p class=\"lead\">〔実験〕図のように、水平な台に固定したレールの上に木片を置き、質量100gの小球を転がして木片に当てた。小球が木片に当たる直前の速さを速さ測定器ではかり、木片が動いた距離をものさしではかった。小球は木片に当たったあと、木片を押しながらいっしょに動いて止まった。小球の速さをかえて同じ操作を行い、次に、質量200gの小球にかえて同じ操作を行った。表は、その結果をまとめたものである。<\/p><figure><svg viewBox=\"0 0 500 215\"><rect x=\"0\" y=\"0\" width=\"500\" height=\"215\" fill=\"#fff\"/><line x1=\"15\" y1=\"150\" x2=\"485\" y2=\"150\" stroke=\"#000\" stroke-width=\"2\"/><rect x=\"35\" y=\"141\" width=\"430\" height=\"9\" fill=\"#ccc\" stroke=\"#000\"/><circle cx=\"80\" cy=\"129\" r=\"12\" fill=\"#888\" stroke=\"#000\"/><line x1=\"100\" y1=\"129\" x2=\"140\" y2=\"129\" stroke=\"#000\" stroke-width=\"2\"/><polygon points=\"150,129 138,123 138,135\" fill=\"#000\"/><path d=\"M195,141 L195,95 L235,95 L235,141\" fill=\"none\" stroke=\"#000\" stroke-width=\"3\"/><rect x=\"310\" y=\"111\" width=\"50\" height=\"30\" fill=\"#eee\" stroke=\"#000\" stroke-width=\"2\"/><line x1=\"310\" y1=\"172\" x2=\"465\" y2=\"172\" stroke=\"#000\"/><line x1=\"310\" y1=\"172\" x2=\"310\" y2=\"160\" stroke=\"#000\"/><line x1=\"341\" y1=\"172\" x2=\"341\" y2=\"165\" stroke=\"#000\"/><line x1=\"372\" y1=\"172\" x2=\"372\" y2=\"165\" stroke=\"#000\"/><line x1=\"403\" y1=\"172\" x2=\"403\" y2=\"165\" stroke=\"#000\"/><line x1=\"434\" y1=\"172\" x2=\"434\" y2=\"165\" stroke=\"#000\"/><line x1=\"465\" y1=\"172\" x2=\"465\" y2=\"160\" stroke=\"#000\"/><text x=\"80\" y=\"105\" font-size=\"16\" font-family=\"sans-serif\" text-anchor=\"middle\">小球<\/text><text x=\"215\" y=\"85\" font-size=\"16\" font-family=\"sans-serif\" text-anchor=\"middle\">速さ測定器<\/text><text x=\"335\" y=\"100\" font-size=\"16\" font-family=\"sans-serif\" text-anchor=\"middle\">木片<\/text><text x=\"388\" y=\"195\" font-size=\"16\" font-family=\"sans-serif\" text-anchor=\"middle\">ものさし<\/text><text x=\"55\" y=\"172\" font-size=\"16\" font-family=\"sans-serif\">レール<\/text><text x=\"440\" y=\"130\" font-size=\"16\" font-family=\"sans-serif\">台<\/text><line x1=\"448\" y1=\"134\" x2=\"475\" y2=\"149\" stroke=\"#000\"/><\/svg><figcaption>図　実験の装置<\/figcaption><\/figure><table><caption>表　木片が動いた距離〔cm〕<\/caption><tr><th>小球の速さ〔m/s〕<\/th><th>0.4<\/th><th>0.8<\/th><th>1.2<\/th><\/tr><tr><th>質量100gの小球<\/th><td>2.0<\/td><td>8.0<\/td><td>18.0<\/td><\/tr><tr><th>質量200gの小球<\/th><td>4.0<\/td><td>16.0<\/td><td>36.0<\/td><\/tr><\/table>","qs":[{"k":"知","text":"小球が木片に当たったあと、小球と木片がいっしょに動いている間にはたらく力について述べたものはどれか。最も適するものを1つ選びなさい。","sel":["木片には、レールから、木片が動く向きと反対向きの摩擦力がはたらく。","木片には、レールから、木片が動く向きと同じ向きの摩擦力がはたらく。","木片が小球から受ける力は、小球が木片から受ける力より大きい。","小球には、木片から、小球が動く向きと同じ向きの力がはたらく。"],"ans":[1],"kai":"摩擦力は、物体が動く向きと反対向きにはたらく。小球と木片がおし合う力は作用・反作用の関係にあり、大きさが等しく向きが反対である。"},{"k":"思","text":"表からわかることをまとめた次の文の（ X ）、（ Y ）に入るものの組み合わせはどれか。最も適するものを1つ選びなさい。<br>「小球の質量が同じとき、小球の速さを2倍にすると、木片が動いた距離は（ X ）になる。小球の速さが同じとき、小球の質量を2倍にすると、木片が動いた距離は（ Y ）になる。」","sel":["X：2倍　Y：2倍","X：2倍　Y：4倍","X：4倍　Y：2倍","X：4倍　Y：4倍"],"ans":[3],"kai":"質量100gで速さが0.4m/sから0.8m/sになると、距離は2.0cmから8.0cmと4倍になる。速さ0.4m/sで質量が100gから200gになると、距離は2.0cmから4.0cmと2倍になる。"},{"k":"思","text":"質量100gの小球を1.6m/sの速さで木片に当てたとすると、木片が動く距離は何cmになると考えられるか。表の関係がそのまま成り立つものとして、整数で答えなさい。","num":"32","unit":"cm","kai":"速さは0.4m/sの4倍なので、木片が動く距離は4×4＝16倍になる。2.0cm×16＝32cmである。"},{"k":"思","text":"質量400gの小球を0.6m/sの速さで木片に当てたとき、木片が動き始めてから止まるまでに、小球が木片にした仕事は何Jか。表の関係がそのまま成り立ち、小球が木片をおす力の大きさはつねに0.4Nであるものとして、小数第3位まで答えなさい。","num":"0.072","unit":"J","kai":"質量は100gの4倍、速さは0.4m/sの1.5倍なので、木片が動く距離は2.0cm×4×1.5×1.5＝18.0cm＝0.18mになる。仕事は0.4N×0.18m＝0.072Jである。"}]},{"id":"miyagi_r8-d2","src":"宮城県 2026年 第五問","kind":"dai","field":"化学","grade":2,"topic":"銅の酸化と質量の変化","ctx":"<p class=\"lead\">銅を空気中で加熱したときの質量の変化を調べるために、次の実験1、実験2を行った。<\/p><p class=\"lead\">〔実験1〕銅の粉末0.80gをステンレス皿全体にうすく広げ、ガスバーナーで5分間加熱した。よく冷ましてから、加熱後の粉末の質量をはかった。この粉末をよくかき混ぜてから再び5分間加熱し、冷まして質量をはかる操作をくり返した。表1は、その結果をまとめたものである。<\/p><table><caption>表1<\/caption><tr><th>加熱した回数〔回〕<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><\/tr><tr><th>加熱後の粉末の質量〔g〕<\/th><td>0.92<\/td><td>0.97<\/td><td>1.00<\/td><td>1.00<\/td><td>1.00<\/td><\/tr><\/table><p class=\"lead\">〔実験2〕銅の粉末の質量をかえて、それぞれ質量が変化しなくなるまで加熱をくり返した。表2は、その結果をまとめたものである。<\/p><table><caption>表2<\/caption><tr><th>銅の粉末の質量〔g〕<\/th><td>0.40<\/td><td>0.80<\/td><td>1.20<\/td><td>1.60<\/td><\/tr><tr><th>加熱後の粉末の質量〔g〕<\/th><td>0.50<\/td><td>1.00<\/td><td>1.50<\/td><td>2.00<\/td><\/tr><\/table>","qs":[{"k":"知","text":"銅を空気中で加熱したときに起こる化学変化を表した化学反応式はどれか。最も適するものを1つ選びなさい。","sel":["Cu ＋ O → CuO","2Cu ＋ O<sub>2<\/sub> → 2CuO","Cu ＋ O<sub>2<\/sub> → CuO<sub>2<\/sub>","Cu<sub>2<\/sub> ＋ O<sub>2<\/sub> → 2CuO"],"ans":[2],"kai":"銅は原子がたくさん集まってできているのでCuと表し、酸素は分子O<sub>2<\/sub>で表す。矢印の左右で原子の種類と数が等しくなるのは、2Cu＋O<sub>2<\/sub>→2CuOである。"},{"k":"思","text":"実験1の結果について述べたものはどれか。最も適するものを1つ選びなさい。","sel":["粉末の質量が増えたのは、銅が空気中の酸素と結びついたからであり、3回目から質量が変化しなくなったのは、すべての銅が酸素と結びついたからである。","粉末の質量が増えたのは、銅が空気中の酸素と結びついたからであり、3回目から質量が変化しなくなったのは、まわりの空気中の酸素がなくなったからである。","粉末の質量が増えたのは、銅がステンレス皿と結びついたからであり、加熱をさらにくり返せば、粉末の質量はふたたび増えていく。","粉末の質量が増えたのは、銅が空気中の二酸化炭素と結びついたからであり、3回目から質量が変化しなくなったのは、すべての銅が反応したからである。"],"ans":[1],"kai":"銅は加熱すると空気中の酸素と結びつき、その酸素の分だけ質量が増える。一定の質量の銅と結びつく酸素の質量には限りがあるので、すべての銅が酸素と結びつくと質量は変化しなくなる。"},{"k":"思","text":"表2から、銅の質量と、その銅と結びつく酸素の質量の比（銅：酸素）を最も簡単な整数の比で表したものはどれか。最も適するものを1つ選びなさい。","sel":["4：1","4：5","5：1","5：4","1：4"],"ans":[1],"kai":"銅0.40gを加熱すると0.50gになるので、結びついた酸素は0.50－0.40＝0.10gである。銅：酸素＝0.40：0.10＝4：1となる。"},{"k":"思","text":"実験1で、1回目の加熱が終わったとき、酸素と結びつかずに残っている銅は何gか。小数第2位まで答えなさい。","num":"0.32","unit":"g","kai":"1回目までに結びついた酸素は0.92－0.80＝0.12gである。銅と酸素は4：1の質量の比で結びつくので、酸素と結びついた銅は0.12×4＝0.48gであり、残っている銅は0.80－0.48＝0.32gである。"}]},{"id":"miyagi_r8-d3","src":"宮城県 2026年 第四問","kind":"dai","field":"生物","grade":2,"topic":"発芽した種子の呼吸","ctx":"<p class=\"lead\">インゲンマメの種子が呼吸をしているかどうかを調べるために、次の実験1、実験2を行った。<\/p><p class=\"lead\">〔実験1〕ポリエチレンの袋Aには水をふくませて発芽させた種子を、袋Bには乾燥した種子を、それぞれ40個ずつ入れた。袋Cには何も入れなかった。袋A～Cに同じ量の空気を入れて口を閉じ、光の当たらない場所に置いた。置く前と3時間後に、袋の中の酸素と二酸化炭素の体積の割合を気体検知管で調べた。表1は、その結果をまとめたものである。<\/p><table><caption>表1<\/caption><tr><th rowspan=\"2\">袋<\/th><th colspan=\"2\">酸素〔％〕<\/th><th colspan=\"2\">二酸化炭素〔％〕<\/th><\/tr><tr><th>置く前<\/th><th>3時間後<\/th><th>置く前<\/th><th>3時間後<\/th><\/tr><tr><th>A<\/th><td>21.0<\/td><td>19.5<\/td><td>0.04<\/td><td>1.5<\/td><\/tr><tr><th>B<\/th><td>21.0<\/td><td>21.0<\/td><td>0.04<\/td><td>0.04<\/td><\/tr><tr><th>C<\/th><td>21.0<\/td><td>21.0<\/td><td>0.04<\/td><td>0.04<\/td><\/tr><\/table><p class=\"lead\">〔実験2〕図のように、三角フラスコの中に小さな容器を置き、色水を1滴入れたガラス管をつけたゴム栓でふたをした装置を3つ用意し、P、Q、Rとした。フラスコと小さな容器に表2のものを入れ、光の当たらない場所に20分間置いて、色水の動きを調べた。フラスコ内の気体の体積が変わると、色水が動く。<\/p><figure><svg viewBox=\"0 0 500 250\"><rect x=\"0\" y=\"0\" width=\"500\" height=\"250\" fill=\"#fff\"/><path d=\"M110,60 L110,105 L45,225 L205,225 L140,105 L140,60\" fill=\"none\" stroke=\"#000\" stroke-width=\"2\"/><rect x=\"106\" y=\"42\" width=\"38\" height=\"24\" fill=\"#bbb\" stroke=\"#000\"/><path d=\"M121,80 L121,26 L440,26\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\"/><path d=\"M129,80 L129,34 L440,34\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\"/><rect x=\"330\" y=\"26\" width=\"22\" height=\"8\" fill=\"#444\"/><rect x=\"110\" y=\"180\" width=\"30\" height=\"43\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.5\"/><ellipse cx=\"70\" cy=\"217\" rx=\"9\" ry=\"5\" fill=\"#999\" stroke=\"#000\"/><ellipse cx=\"92\" cy=\"217\" rx=\"9\" ry=\"5\" fill=\"#999\" stroke=\"#000\"/><ellipse cx=\"81\" cy=\"207\" rx=\"9\" ry=\"5\" fill=\"#999\" stroke=\"#000\"/><ellipse cx=\"158\" cy=\"217\" rx=\"9\" ry=\"5\" fill=\"#999\" stroke=\"#000\"/><ellipse cx=\"180\" cy=\"217\" rx=\"9\" ry=\"5\" fill=\"#999\" stroke=\"#000\"/><ellipse cx=\"169\" cy=\"207\" rx=\"9\" ry=\"5\" fill=\"#999\" stroke=\"#000\"/><line x1=\"341\" y1=\"36\" x2=\"341\" y2=\"58\" stroke=\"#000\"/><text x=\"341\" y=\"76\" font-size=\"16\" font-family=\"sans-serif\" text-anchor=\"middle\">色水<\/text><text x=\"440\" y=\"58\" font-size=\"16\" font-family=\"sans-serif\" text-anchor=\"middle\">ガラス管<\/text><line x1=\"425\" y1=\"42\" x2=\"415\" y2=\"35\" stroke=\"#000\"/><line x1=\"144\" y1=\"54\" x2=\"200\" y2=\"70\" stroke=\"#000\"/><text x=\"204\" y=\"78\" font-size=\"16\" font-family=\"sans-serif\">ゴム栓<\/text><line x1=\"172\" y1=\"160\" x2=\"250\" y2=\"130\" stroke=\"#000\"/><text x=\"254\" y=\"132\" font-size=\"16\" font-family=\"sans-serif\">三角フラスコ<\/text><line x1=\"132\" y1=\"195\" x2=\"250\" y2=\"172\" stroke=\"#000\"/><text x=\"254\" y=\"176\" font-size=\"16\" font-family=\"sans-serif\">小さな容器<\/text><line x1=\"188\" y1=\"217\" x2=\"250\" y2=\"214\" stroke=\"#000\"/><text x=\"254\" y=\"220\" font-size=\"16\" font-family=\"sans-serif\">種子<\/text><\/svg><figcaption>図　実験2の装置P、Qのつくり（小さな容器の中身は表2）<\/figcaption><\/figure><table><caption>表2<\/caption><tr><th>装置<\/th><th>フラスコに入れたもの<\/th><th>小さな容器に入れたもの<\/th><th>色水の動き<\/th><\/tr><tr><th>P<\/th><td>発芽させた種子40個<\/td><td>水<\/td><td>動かなかった<\/td><\/tr><tr><th>Q<\/th><td>発芽させた種子40個<\/td><td>二酸化炭素を吸収する薬品<\/td><td>フラスコ側へ動いた<\/td><\/tr><tr><th>R<\/th><td>なし<\/td><td>二酸化炭素を吸収する薬品<\/td><td>動かなかった<\/td><\/tr><\/table>","qs":[{"k":"思","text":"実験1の結果からわかることについて述べたものはどれか。最も適するものを1つ選びなさい。","sel":["袋Aと袋Cの結果を比べると、発芽させた種子が酸素をとり入れ、二酸化炭素を出したことがわかる。","袋Aと袋Bの結果を比べると、ポリエチレンの袋そのものは酸素や二酸化炭素を出し入れしないことがわかる。","袋Bと袋Cの結果を比べると、乾燥した種子が光合成を行ったことがわかる。","袋Aの結果だけから、気体の割合の変化が種子のはたらきによることがわかる。"],"ans":[1],"kai":"種子を入れない袋Cでは気体の割合が変わらず、袋Aだけで酸素が減り二酸化炭素が増えている。種子があるかどうかだけがちがう袋Aと袋Cを比べることで、変化が発芽させた種子のはたらきによるといえる。"},{"k":"思","text":"実験2の装置Qで、色水がフラスコ側へ動いた理由として最も適するものはどれか。1つ選びなさい。","sel":["種子が酸素をとり入れ、種子が出した二酸化炭素は薬品に吸収されたので、フラスコ内の気体の体積が減ったから。","種子が二酸化炭素を出し、種子は酸素をとり入れなかったので、フラスコ内の気体の体積が増えたから。","種子は気体を出し入れせず、薬品がフラスコ内の酸素を吸収したので、フラスコ内の気体の体積が減ったから。","種子が光合成を行って二酸化炭素をとり入れたので、フラスコ内の気体の体積が減ったから。"],"ans":[1],"kai":"色水がフラスコ側へ動いたのは、フラスコ内の気体の体積が減ったからである。種子がとり入れた酸素の分だけ気体が減り、出された二酸化炭素は薬品に吸収されるので、その分が補われない。種子のない装置Rで色水が動かないので、薬品だけでは体積は変わらない。"},{"k":"思","text":"実験2の結果から、発芽させた種子の呼吸について考えられることはどれか。最も適するものを1つ選びなさい。","sel":["装置Pで色水が動かなかったことと装置Qの結果から、種子がとり入れる酸素の体積と、出す二酸化炭素の体積は、ほぼ等しいと考えられる。","装置Pで色水が動かなかったことから、種子は、近くに水があると呼吸をしないと考えられる。","装置Qで色水がフラスコ側へ動いたことから、種子がとり入れる酸素の体積は、出す二酸化炭素の体積よりも多いと考えられる。","装置Rで色水が動かなかったことから、種子は、二酸化炭素を出さないと考えられる。"],"ans":[1],"kai":"装置Qの結果から種子は酸素をとり入れているが、二酸化炭素が吸収されない装置Pでは気体の体積が変わっていない。減った酸素と同じくらいの体積の二酸化炭素が出されたと考えられる。"},{"k":"知","text":"乾燥した種子と、発芽して数日たった種子をそれぞれ半分に切り、切り口にヨウ素液をつけると、発芽して数日たった種子のほうが青紫色がうすかった。その理由として最も適するものはどれか。1つ選びなさい。","sel":["種子にたくわえられていたデンプンが、呼吸によって分解され、発芽や成長のためのエネルギーをとり出すのに使われたから。","芽が光合成でつくったデンプンが、種子まで運ばれなかったから。","根から吸収した水にデンプンがとけて、そのまま種子の外へ流れ出たから。","呼吸で出された二酸化炭素が、デンプンをヨウ素液と反応しにくい色に変えたから。"],"ans":[1],"kai":"種子にはデンプンなどの養分がたくわえられている。発芽した種子は、とり入れた酸素を使って養分を分解し、生きるためのエネルギーをとり出すので、デンプンが減る。"}]},{"id":"miyagi_r8-d4","src":"宮城県 2026年 第三問","kind":"dai","field":"地学","grade":3,"topic":"月の見え方と月食","ctx":"<p class=\"lead\">日本のある地点で、ある日の午前6時に月を観察すると、図1のように、左半分が光って見える月が南中していた。この日の日の出は午前6時、日の入りは午後6時であった。図2は、地球の北極側から見た、太陽の光の向き、地球、月の位置の関係を模式的に表したもので、A～Hは月の位置を示している。同じ時刻に見える月の位置は、1日につき約12°ずつ東へ移っていく。<\/p><figure><svg viewBox=\"0 0 500 140\"><rect x=\"0\" y=\"0\" width=\"500\" height=\"140\" fill=\"#fff\"/><path d=\"M250,24 A18,18 0 0 0 250,60 Z\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"2\"/><path d=\"M30,100 L90,92 L150,98 L230,90 L300,97 L380,88 L470,100\" fill=\"none\" stroke=\"#000\" stroke-width=\"2\"/><text x=\"70\" y=\"126\" font-size=\"16\" font-family=\"sans-serif\" text-anchor=\"middle\">南東<\/text><text x=\"250\" y=\"126\" font-size=\"16\" font-family=\"sans-serif\" text-anchor=\"middle\">南<\/text><text x=\"430\" y=\"126\" font-size=\"16\" font-family=\"sans-serif\" text-anchor=\"middle\">南西<\/text><\/svg><figcaption>図1　午前6時の月<\/figcaption><\/figure><figure><svg viewBox=\"0 0 500 300\"><rect x=\"0\" y=\"0\" width=\"500\" height=\"300\" fill=\"#fff\"/><circle cx=\"220\" cy=\"150\" r=\"105\" fill=\"none\" stroke=\"#666\" stroke-dasharray=\"5 4\"/><circle cx=\"220\" cy=\"150\" r=\"20\" fill=\"#ddd\" stroke=\"#000\" stroke-width=\"2\"/><text x=\"220\" y=\"192\" font-size=\"16\" font-family=\"sans-serif\" text-anchor=\"middle\">地球<\/text><circle cx=\"325\" cy=\"150\" r=\"10\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"2\"/><circle cx=\"294\" cy=\"76\" r=\"10\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"2\"/><circle cx=\"220\" cy=\"45\" r=\"10\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"2\"/><circle cx=\"146\" cy=\"76\" r=\"10\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"2\"/><circle cx=\"115\" cy=\"150\" r=\"10\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"2\"/><circle cx=\"146\" cy=\"224\" r=\"10\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"2\"/><circle cx=\"220\" cy=\"255\" r=\"10\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"2\"/><circle cx=\"294\" cy=\"224\" r=\"10\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"2\"/><text x=\"347\" y=\"156\" font-size=\"17\" font-family=\"sans-serif\" text-anchor=\"middle\">A<\/text><text x=\"313\" y=\"68\" font-size=\"17\" font-family=\"sans-serif\" text-anchor=\"middle\">B<\/text><text x=\"220\" y=\"27\" font-size=\"17\" font-family=\"sans-serif\" text-anchor=\"middle\">C<\/text><text x=\"127\" y=\"68\" font-size=\"17\" font-family=\"sans-serif\" text-anchor=\"middle\">D<\/text><text x=\"93\" y=\"156\" font-size=\"17\" font-family=\"sans-serif\" text-anchor=\"middle\">E<\/text><text x=\"127\" y=\"246\" font-size=\"17\" font-family=\"sans-serif\" text-anchor=\"middle\">F<\/text><text x=\"220\" y=\"287\" font-size=\"17\" font-family=\"sans-serif\" text-anchor=\"middle\">G<\/text><text x=\"313\" y=\"246\" font-size=\"17\" font-family=\"sans-serif\" text-anchor=\"middle\">H<\/text><path d=\"M190,75 A80,80 0 0 0 151,110\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\"/><polygon points=\"147,119 147,106 157,112\" fill=\"#000\"/><text x=\"192\" y=\"95\" font-size=\"15\" font-family=\"sans-serif\">公転の向き<\/text><path d=\"M252,138 A34,34 0 0 0 232,118\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\"/><polygon points=\"225,115 234,113 231,122\" fill=\"#000\"/><text x=\"246\" y=\"122\" font-size=\"15\" font-family=\"sans-serif\">自転の<\/text><text x=\"258\" y=\"140\" font-size=\"15\" font-family=\"sans-serif\">向き<\/text><line x1=\"485\" y1=\"100\" x2=\"420\" y2=\"100\" stroke=\"#000\" stroke-width=\"2\"/><polygon points=\"410,100 422,94 422,106\" fill=\"#000\"/><line x1=\"485\" y1=\"150\" x2=\"420\" y2=\"150\" stroke=\"#000\" stroke-width=\"2\"/><polygon points=\"410,150 422,144 422,156\" fill=\"#000\"/><line x1=\"485\" y1=\"200\" x2=\"420\" y2=\"200\" stroke=\"#000\" stroke-width=\"2\"/><polygon points=\"410,200 422,194 422,206\" fill=\"#000\"/><text x=\"450\" y=\"70\" font-size=\"16\" font-family=\"sans-serif\" text-anchor=\"middle\">太陽の光<\/text><\/svg><figcaption>図2　地球の北極側から見た地球と月<\/figcaption><\/figure>","qs":[{"k":"思","text":"図1の月を観察したとき、月は図2のどの位置にあったか。最も適するものを1つ選びなさい。","sel":["A","C","E","F","G","H"],"ans":[5],"fix":true,"kai":"日の出のころ、観察者は地球上で昼と夜の境目のうち、これから昼に入る側にいる。地球は図2で反時計回りに自転しているので、その位置は地球の下側であり、そのとき南中している月はGの位置にある。"},{"k":"思","text":"図1の月を観察した日から3日後の午前6時に、同じ地点で月を観察した。このときの月の位置と形について述べたものはどれか。最も適するものを1つ選びなさい。","sel":["真南よりも東よりの空に、図1よりも光って見える部分が細くなった月が見えた。","真南よりも東よりの空に、図1よりも光って見える部分が広くなった月が見えた。","真南よりも西よりの空に、図1よりも光って見える部分が細くなった月が見えた。","真南よりも西よりの空に、図1よりも光って見える部分が広くなった月が見えた。"],"ans":[1],"kai":"同じ時刻に見える月の位置は1日に約12°ずつ東へ移るので、3日後は真南より東よりに見える。月は公転して太陽のある側へ近づいていくので、光って見える部分は細くなる。"},{"k":"思","text":"同じ時刻に見える月の位置が1日につき12°ずつ東へ移り、月が空を東から西へ動く速さは太陽の日周運動の速さと同じであるとする。このとき、月が南中する時刻は、1日につき何分ずつおそくなるか。整数で答えなさい。","num":"48","unit":"分","kai":"日周運動では天体は1時間（60分）に15°動く。12°動くのにかかる時間は60×12÷15＝48分なので、南中する時刻は1日に48分ずつおそくなる。"},{"k":"知","text":"月食が起こるときの月の位置と、月食のしくみについて述べたものはどれか。最も適するものを1つ選びなさい。","sel":["月が図2のEの位置にあり、月が地球の影に入る。","月が図2のAの位置にあり、月が地球の影に入る。","月が図2のEの位置にあり、地球の一部が月の影に入る。","月が図2のAの位置にあり、地球の一部が月の影に入る。"],"ans":[1],"kai":"月食は、太陽・地球・月の順に一直線に並び、月が地球の影に入る現象である。地球から見て太陽と反対側のEの位置にあるときに起こる。"}]},{"id":"miyagi_r8-s1","src":"宮城県 2026年 第一問","kind":"sho","field":"物理","grade":1,"topic":"音の波形と振動数","ctx":"<figure><svg viewBox=\"0 0 440 250\"><rect x=\"0\" y=\"0\" width=\"440\" height=\"250\" fill=\"#fff\"/><g stroke=\"#aaa\" stroke-width=\"1\"><line x1=\"40\" y1=\"30\" x2=\"40\" y2=\"210\"/><line x1=\"70\" y1=\"30\" x2=\"70\" y2=\"210\"/><line x1=\"100\" y1=\"30\" x2=\"100\" y2=\"210\"/><line x1=\"130\" y1=\"30\" x2=\"130\" y2=\"210\"/><line x1=\"160\" y1=\"30\" x2=\"160\" y2=\"210\"/><line x1=\"190\" y1=\"30\" x2=\"190\" y2=\"210\"/><line x1=\"220\" y1=\"30\" x2=\"220\" y2=\"210\"/><line x1=\"250\" y1=\"30\" x2=\"250\" y2=\"210\"/><line x1=\"280\" y1=\"30\" x2=\"280\" y2=\"210\"/><line x1=\"310\" y1=\"30\" x2=\"310\" y2=\"210\"/><line x1=\"340\" y1=\"30\" x2=\"340\" y2=\"210\"/><line x1=\"370\" y1=\"30\" x2=\"370\" y2=\"210\"/><line x1=\"400\" y1=\"30\" x2=\"400\" y2=\"210\"/><line x1=\"40\" y1=\"30\" x2=\"400\" y2=\"30\"/><line x1=\"40\" y1=\"60\" x2=\"400\" y2=\"60\"/><line x1=\"40\" y1=\"90\" x2=\"400\" y2=\"90\"/><line x1=\"40\" y1=\"120\" x2=\"400\" y2=\"120\"/><line x1=\"40\" y1=\"150\" x2=\"400\" y2=\"150\"/><line x1=\"40\" y1=\"180\" x2=\"400\" y2=\"180\"/><line x1=\"40\" y1=\"210\" x2=\"400\" y2=\"210\"/><\/g><path d=\"M40,120 Q70,0 100,120 T160,120 T220,120 T280,120 T340,120 T400,120\" fill=\"none\" stroke=\"#000\" stroke-width=\"3\"/><line x1=\"300\" y1=\"232\" x2=\"390\" y2=\"232\" stroke=\"#000\" stroke-width=\"1.5\"/><polygon points=\"400,232 388,226 388,238\" fill=\"#000\"/><text x=\"270\" y=\"238\" font-size=\"16\" font-family=\"sans-serif\" text-anchor=\"middle\">時間<\/text><\/svg><figcaption>図　コンピュータの画面に表示された音の波形<\/figcaption><\/figure>","qs":[{"k":"思","text":"図は、モノコードの弦をはじいて出した音を、マイクロホンを通してコンピュータの画面に表示させたものである。図の横軸の1目盛りが0.0005秒を表しているとき、この音の振動数は何Hzか。整数で答えなさい。","num":"500","unit":"Hz","kai":"図から、1回の振動は横軸の4目盛り分なので、1回の振動にかかる時間は0.0005×4＝0.002秒である。振動数は1秒間に振動する回数なので、1÷0.002＝500Hzである。"}]},{"id":"miyagi_r8-s2","src":"宮城県 2026年 第一問","kind":"sho","field":"物理","grade":1,"topic":"音の大きさ・高さと振動","ctx":"","qs":[{"k":"知","text":"モノコードの弦をはじいて音を出した。次に、弦の張りの強さはかえずに、弦の振動する部分を短くして、はじめよりも弱くはじいた。このとき、はじめの音と比べて、弦の振動の振幅と振動数はどうなるか。最も適するものを1つ選びなさい。","sel":["振幅は小さくなり、振動数は多くなる。","振幅は小さくなり、振動数は少なくなる。","振幅は大きくなり、振動数は多くなる。","振幅は大きくなり、振動数は少なくなる。"],"ans":[1],"kai":"弦を弱くはじくと振幅が小さくなり、音は小さくなる。弦の振動する部分を短くすると振動数が多くなり、音は高くなる。"}]},{"id":"miyagi_r8-s3","src":"宮城県 2026年 第一問","kind":"sho","field":"化学","grade":1,"topic":"蒸留","ctx":"","qs":[{"k":"思","text":"水20cm<sup>3<\/sup>とエタノール5cm<sup>3<\/sup>の混合物を枝つきフラスコに入れて弱火で加熱し、出てきた気体を冷やして、液体を3cm<sup>3<\/sup>ずつ、集めた順に試験管X、Y、Zにとった。それぞれの液体をろ紙にひたして火を近づけると、Xの液体はよく燃え、Yの液体は少し燃えてすぐ消え、Zの液体は燃えなかった。この結果について述べたものはどれか。最も適するものを1つ選びなさい。","sel":["エタノールは水よりも沸点が低いので、はじめに出てくる気体にはエタノールが多くふくまれ、Xの液体にはエタノールが最も多くふくまれる。","エタノールは水よりも沸点が高いので、はじめに出てくる気体にはエタノールが多くふくまれ、Xの液体にはエタノールが最も多くふくまれる。","エタノールは水よりも沸点が低いので、はじめに出てくる気体には水が多くふくまれ、Xの液体には水が最も多くふくまれる。","エタノールは水よりも密度が小さいので、はじめにエタノールだけがすべて気体になり、Xの液体には水がまったくふくまれない。"],"ans":[1],"kai":"エタノールの沸点は約78℃で、水の沸点100℃よりも低い。混合物を加熱すると、沸点の低いエタノールを多くふくむ気体が先に出てくるので、はじめに集めた液体ほどよく燃える。"}]},{"id":"miyagi_r8-s4","src":"宮城県 2026年 第一問","kind":"sho","field":"化学","grade":1,"topic":"ガスバーナーの使い方","ctx":"","qs":[{"k":"知","text":"ガスバーナーには、上下に2つのねじがある。ガスバーナーに火をつけたところ、炎がオレンジ色で長くのびていた。炎の大きさはかえずに、青色の炎にするための操作はどれか。最も適するものを1つ選びなさい。","sel":["下側のねじを動かないようにおさえて、上側のねじだけを開く向きに回す。","上側のねじを動かないようにおさえて、下側のねじだけを開く向きに回す。","下側のねじを動かないようにおさえて、上側のねじだけを閉じる向きに回す。","上側のねじを動かないようにおさえて、下側のねじだけを閉じる向きに回す。"],"ans":[1],"kai":"上側のねじが空気調節ねじ、下側のねじがガス調節ねじである。オレンジ色の炎は空気が足りないので、ガス調節ねじをおさえて空気調節ねじだけを開き、空気の量をふやす。"}]},{"id":"miyagi_r8-s5","src":"宮城県 2026年 第一問","kind":"sho","field":"生物","grade":2,"topic":"刺激に対する反応の時間","ctx":"<p class=\"lead\">10人が手をつないで輪になり、全員が目を閉じた。1人目がストップウォッチをスタートさせると同時に、となりの人の手をにぎった。手をにぎられた人は、すぐに次の人の手をにぎり、これを順に続けた。1人目は、10人目に自分の手をにぎられたら、すぐにストップウォッチを止めた。この操作を3回行うと、表のようになった。<\/p><table><caption>表<\/caption><tr><th>回<\/th><th>1回目<\/th><th>2回目<\/th><th>3回目<\/th><\/tr><tr><th>かかった時間〔秒〕<\/th><td>2.52<\/td><td>2.37<\/td><td>2.31<\/td><\/tr><\/table>","qs":[{"k":"思","text":"表の3回の結果の平均を使うと、1人が手をにぎられてから反応するまでにかかった時間は、1人あたり何秒になるか。10人全員が1回ずつ反応したものとして、小数第2位まで答えなさい。","num":"0.24","unit":"秒","kai":"3回の平均は（2.52＋2.37＋2.31）÷3＝2.40秒である。この間に10人が1回ずつ反応しているので、1人あたり2.40÷10＝0.24秒である。"}]},{"id":"miyagi_r8-s6","src":"宮城県 2026年 第一問","kind":"sho","field":"生物","grade":2,"topic":"骨と筋肉のはたらき","ctx":"","qs":[{"k":"知","text":"ヒトのうでの骨と筋肉について述べたものはどれか。最も適するものを1つ選びなさい。","sel":["筋肉の両端はけんになっていて、関節をまたいで2つの別々の骨についている。","筋肉の両端はけんになっていて、両端とも同じ1つの骨についている。","うでを曲げるときは、骨をはさんで向かい合う2つの筋肉が、両方とも縮む。","うでをのばすときは、骨をはさんで向かい合う2つの筋肉が、両方ともゆるむ。"],"ans":[1],"kai":"筋肉の両端のけんは、関節をまたいで別々の骨についている。向かい合う筋肉の一方が縮み、もう一方がゆるむことで、うでを曲げたりのばしたりできる。"}]},{"id":"miyagi_r8-s7","src":"宮城県 2026年 第一問","kind":"sho","field":"地学","grade":1,"topic":"火成岩のつくりとでき方","ctx":"","qs":[{"k":"知","text":"ある火成岩をルーペで観察すると、全体が黒っぽく、同じくらいの大きさの大きな鉱物が、すきまなく組み合わさっていた。この火成岩の名前と、できた場所や冷え方の組み合わせはどれか。最も適するものを1つ選びなさい。","sel":["はんれい岩で、マグマが地下の深いところでゆっくり冷え固まってできた。","はんれい岩で、マグマが地表や地表付近で急に冷え固まってできた。","玄武岩で、マグマが地下の深いところでゆっくり冷え固まってできた。","玄武岩で、マグマが地表や地表付近で急に冷え固まってできた。"],"ans":[1],"kai":"大きな鉱物がすきまなく組み合わさったつくりは等粒状組織で、マグマが地下の深いところでゆっくり冷え固まった深成岩に見られる。黒っぽい深成岩ははんれい岩であり、玄武岩は黒っぽい火山岩である。"}]},{"id":"miyagi_r8-s8","src":"宮城県 2026年 第三問","kind":"sho","field":"地学","grade":3,"topic":"天体の日周運動","ctx":"","qs":[{"k":"知","text":"日本のある地点で、南の空に見える木星を天体望遠鏡の視野の中央に入れ、望遠鏡を動かないように固定した。数分後にのぞくと、木星は視野の外へ出ていた。木星が視野の外へ出たおもな理由と、この数分の間に木星が空を動いた向きの組み合わせはどれか。最も適するものを1つ選びなさい。","sel":["地球が自転しているからで、木星は空を東から西へ動いた。","地球が自転しているからで、木星は空を西から東へ動いた。","地球が公転しているからで、木星は空を東から西へ動いた。","地球が公転しているからで、木星は空を西から東へ動いた。"],"ans":[1],"kai":"地球が西から東へ自転しているので、天体は1時間に約15°ずつ東から西へ動いて見える。望遠鏡で拡大すると、この動きが数分でも大きく見える。"}]},{"id":"kanagawa_r8-d1","src":"神奈川県 2026年 問5","kind":"dai","field":"物理","grade":2,"topic":"電流と発熱","ctx":"<p class=\"lead\">電熱線の発熱について調べるために、次の実験を行った。<br>〔実験〕発泡ポリスチレンのコップに水120gを入れ、水温が室温と同じになるまで置いた。抵抗が2.0Ωの電熱線Pを水に入れ、6.0Vの電圧を加えて電流を流し、水をゆっくりかき混ぜながら、1分ごとに5分後まで水温をはかった。次に、水を同じ温度の新しい水120gにとりかえ、電熱線Pを、抵抗が3.0Ωの電熱線Q、抵抗が6.0Ωの電熱線Rにかえて、それぞれ6.0Vの電圧を加えて同じ操作を行った。表は、その結果をまとめたものである。<\/p><table><caption>表　電流を流した時間と水温〔℃〕<\/caption><tr><th>電熱線<\/th><th>抵抗<\/th><th>0分<\/th><th>1分<\/th><th>2分<\/th><th>3分<\/th><th>4分<\/th><th>5分<\/th><\/tr><tr><th>P<\/th><td>2.0Ω<\/td><td>18.0<\/td><td>19.5<\/td><td>21.0<\/td><td>22.5<\/td><td>24.0<\/td><td>25.5<\/td><\/tr><tr><th>Q<\/th><td>3.0Ω<\/td><td>18.0<\/td><td>19.0<\/td><td>20.0<\/td><td>21.0<\/td><td>22.0<\/td><td>23.0<\/td><\/tr><tr><th>R<\/th><td>6.0Ω<\/td><td>18.0<\/td><td>18.5<\/td><td>19.0<\/td><td>19.5<\/td><td>20.0<\/td><td>20.5<\/td><\/tr><\/table>","qs":[{"k":"知","text":"〔実験〕で、電熱線Rに流れた電流の大きさと、電熱線Rが消費した電力の組み合わせはどれか。最も適するものを1つ選びなさい。","sel":["1.0 A、6.0 W","1.0 A、36 W","6.0 A、6.0 W","6.0 A、36 W"],"ans":[1],"kai":"電流は6.0V÷6.0Ω＝1.0A、電力は6.0V×1.0A＝6.0Wである。"},{"k":"思","text":"電熱線Pを使い、〔実験〕と同じ条件で6分間電流を流し続けたとすると、水温は電流を流し始めたときから何℃上昇すると考えられるか。小数第1位まで答えなさい。","num":"9.0","unit":"℃","kai":"電熱線Pでは水温が1分間に1.5℃ずつ上昇しているので、6分間では1.5℃×6＝9.0℃上昇する。"},{"k":"思","text":"抵抗が1.5Ωの電熱線Sを使い、〔実験〕と同じ条件で電流を流したとすると、水温が10℃上昇するまでに何分かかると考えられるか。ただし、表の結果と同じ規則性が成り立つものとする。整数で答えなさい。","num":"5","unit":"分","kai":"表から、1分間の上昇温度は電力に比例し、6.0Wで0.5℃である。電熱線Sの電力は6.0V×4.0A＝24Wなので1分間に2.0℃上昇し、10℃上昇するには5分かかる。"},{"k":"思","text":"電熱線Qに5分間電流を流したとき、水が得た熱量は、電熱線Qが5分間に消費した電力量の何％か。ただし、水1gの温度を1℃上げるのに必要な熱量を4.2Jとする。整数で答えなさい。","num":"70","unit":"％","kai":"電力量は12W×300秒＝3600J、水が得た熱量は4.2J×120×5.0＝2520Jである。2520÷3600×100＝70％となる。"}]},{"id":"kanagawa_r8-d2","src":"神奈川県 2026年 問6","kind":"dai","field":"化学","grade":3,"topic":"金属のイオンへのなりやすさと電池","ctx":"<p class=\"lead\">金属P、Q、Rは、亜鉛、銅、マグネシウムのいずれかである。また、水溶液p、q、rは、それぞれ金属P、Q、Rのイオンをふくむ硫酸塩の水溶液である。これらを使って、次の実験を行った。<br>〔実験1〕マイクロプレートのくぼみに水溶液p、q、rを入れ、それぞれに金属P、Q、Rの小片を入れて、金属の表面のようすを観察した。表は、その結果をまとめたものである。<br>〔実験2〕図のように、セロハンで仕切ったビーカーの一方に水溶液rと金属板Rを、もう一方に水溶液pと金属板Pを入れ、金属板をモーターにつないだところ、モーターが回った。<\/p><table><caption>表　〔実験1〕の結果（○：金属の表面に固体が付着した　×：変化がなかった）<\/caption><tr><th><\/th><th>水溶液p<\/th><th>水溶液q<\/th><th>水溶液r<\/th><\/tr><tr><th>金属P<\/th><td>×<\/td><td>×<\/td><td>×<\/td><\/tr><tr><th>金属Q<\/th><td>○<\/td><td>×<\/td><td>○<\/td><\/tr><tr><th>金属R<\/th><td>○<\/td><td>×<\/td><td>×<\/td><\/tr><\/table><figure><svg viewBox=\"0 0 480 300\"><rect x=\"61\" y=\"120\" width=\"358\" height=\"144\" fill=\"#eee\"/><path d=\"M60,80 V265 H420 V80\" fill=\"none\" stroke=\"#000\" stroke-width=\"2\"/><line x1=\"60\" y1=\"120\" x2=\"420\" y2=\"120\" stroke=\"#555\" stroke-width=\"1\"/><line x1=\"240\" y1=\"100\" x2=\"240\" y2=\"265\" stroke=\"#000\" stroke-width=\"2\" stroke-dasharray=\"6 4\"/><rect x=\"130\" y=\"62\" width=\"20\" height=\"180\" fill=\"#bbb\" stroke=\"#000\" stroke-width=\"1.5\"/><rect x=\"330\" y=\"62\" width=\"20\" height=\"180\" fill=\"#bbb\" stroke=\"#000\" stroke-width=\"1.5\"/><path d=\"M140,62 V40 H222\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\"/><path d=\"M340,62 V40 H258\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\"/><circle cx=\"240\" cy=\"40\" r=\"18\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.5\"/><text x=\"240\" y=\"46\" font-size=\"16\" font-family=\"
