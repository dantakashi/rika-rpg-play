<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>テスト対策</title>
<style>
:root{ --ink:#1b1b1b; --sub:#5a6470; --line:#c9d1da; --bg:#f3f5f8; --card:#fff; --blue:#1e5a8c; --ok:#1c7c3c; --okbg:#e6f5ea; --ng:#b3261e; --ngbg:#fdeceb; }
*{ box-sizing:border-box; }
html,body{ margin:0; }
body{ font-family:"UD Digi Kyokasho NK","UD デジタル 教科書体 NK","BIZ UDPGothic","Yu Gothic UI","Hiragino Sans",sans-serif;
  color:var(--ink); background:var(--bg); font-size:20px; line-height:1.7; }
header{ position:sticky; top:0; z-index:5; background:var(--blue); color:#fff; padding:8px 20px; display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
header .ttl{ font-weight:bold; font-size:17px; flex:1 1 auto; }
header .ttl span{ font-weight:normal; font-size:15px; margin-left:12px; opacity:.9; }
.hbtn{ font:inherit; font-size:15px; color:#fff; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.5); border-radius:8px; padding:3px 12px; cursor:pointer; }
.hbtn[hidden]{ display:none; }
#st-time.over{ color:#ffd1cc; }
.home{ max-width:980px; margin:20px auto; }
.home h1{ font-size:26px; margin:0 0 4px; }
.home .unit{ font-size:21px; font-weight:bold; margin:18px 0 2px; }
.home .meta{ color:var(--sub); font-size:17px; margin:0 0 6px; }
.rec{ font-size:16px; color:var(--sub); border-top:1px dashed var(--line); padding-top:8px; width:100%; }
.rec b{ color:var(--ink); font-size:19px; }
details{ margin-top:18px; font-size:17px; } summary{ cursor:pointer; color:var(--blue); font-weight:bold; }
tr.weak th, tr.weak td{ background:#fff4e0; }
.result td.pg{ color:var(--sub); font-size:16px; }
header .stat{ font-size:17px; white-space:nowrap; }
header .stat b{ font-size:22px; }
.bar{ height:8px; background:#d7dee6; }
.bar i{ display:block; height:100%; width:0; background:#f2b632; transition:width .25s; }
main{ max-width:1500px; margin:0 auto; padding:18px 20px 60px; }
.wrap{ display:grid; grid-template-columns:minmax(0,5fr) minmax(0,6fr); gap:18px; align-items:start; }
.wrap.noctx{ grid-template-columns:minmax(0,1fr); max-width:900px; margin:0 auto; }
.card{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px 22px; }
.ctx{ position:sticky; top:70px; max-height:calc(100vh - 90px); overflow:auto; }
.ctx .lead{ margin:0 0 10px; font-size:18px; }
.ctx figure{ margin:8px 0 4px; text-align:center; }
.ctx img{ max-width:100%; max-height:46vh; }
.ctx figcaption, .ctx caption{ font-size:16px; color:var(--sub); padding:4px 0; }
.ctx table{ border-collapse:collapse; margin:8px auto; font-size:17px; }
.ctx th,.ctx td{ border:1px solid #777; padding:5px 10px; text-align:center; white-space:nowrap; }
.ctx th{ background:#eef2f6; font-weight:normal; }
.tag{ display:inline-block; font-size:15px; color:var(--blue); border:1px solid var(--blue); border-radius:999px; padding:0 12px; margin:0 8px 8px 0; }
.qtext{ margin:0 0 14px; font-size:21px; }
.kyoucho{ font-weight:bold; text-decoration:underline; text-underline-offset:4px; }
.sel{ display:grid; gap:10px; }
.sel.yoko{ grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); }
.sel button{ font:inherit; text-align:left; background:#fff; border:2px solid var(--line); border-radius:10px; padding:10px 14px; cursor:pointer; display:flex; gap:12px; align-items:baseline; color:var(--ink); }
.sel button .n{ flex:none; width:1.9em; height:1.9em; line-height:1.9em; text-align:center; border-radius:50%; background:#e8edf3; font-weight:bold; }
.sel button:hover:not(:disabled){ border-color:var(--blue); background:#f4f8fc; }
.sel button.on{ border-color:var(--blue); background:#e4eef8; }
.sel button.on .n{ background:var(--blue); color:#fff; }
.sel button:disabled{ cursor:default; }
.sel button.right{ border-color:var(--ok); background:var(--okbg); }
.sel button.right .n{ background:var(--ok); color:#fff; }
.sel button.wrong{ border-color:var(--ng); background:var(--ngbg); }
.sel button.wrong .n{ background:var(--ng); color:#fff; }
.numrow{ display:flex; gap:10px; align-items:center; font-size:22px; }
.numrow input{ font:inherit; width:7em; padding:8px 12px; border:2px solid var(--line); border-radius:10px; }
.act{ display:flex; gap:12px; align-items:center; margin-top:16px; flex-wrap:wrap; }
.btn{ font:inherit; font-weight:bold; background:var(--blue); color:#fff; border:0; border-radius:10px; padding:10px 28px; cursor:pointer; }
.btn:disabled{ background:#aab4bf; cursor:default; }
.btn.ghost{ background:#fff; color:var(--blue); border:2px solid var(--blue); }
.judge{ font-weight:bold; font-size:22px; padding:8px 16px; border-radius:10px; margin-top:16px; }
.judge.ok{ color:var(--ok); background:var(--okbg); }
.judge.ng{ color:var(--ng); background:var(--ngbg); }
.hint{ font-size:16px; color:var(--sub); }
.result h2{ margin:0 0 6px; font-size:26px; }
.big{ font-size:64px; font-weight:bold; color:var(--blue); line-height:1.2; }
.big small{ font-size:26px; color:var(--sub); font-weight:normal; }
.result table{ border-collapse:collapse; margin:10px 0 18px; font-size:18px; }
.result th,.result td{ border:1px solid var(--line); padding:6px 14px; text-align:center; }
.result th{ background:#eef2f6; font-weight:normal; }
.miss{ border-top:1px solid var(--line); padding:12px 0; }
.miss .q{ margin:0 0 4px; font-size:18px; }
.miss .a{ margin:0; font-size:18px; }
.miss .a b{ color:var(--ok); } .miss .a s{ color:var(--ng); text-decoration:none; }
.start{ max-width:900px; margin:30px auto; }
.start li{ margin:4px 0; }
.modes{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:14px; }
.mode{ border:2px solid var(--line); border-radius:12px; padding:14px 16px; display:flex; flex-direction:column; gap:8px; align-items:flex-start; }
.mode b{ font-size:22px; color:var(--blue); } .mode span{ font-size:17px; flex:1; }
.mode input{ font:inherit; width:6em; padding:4px 10px; border:2px solid var(--line); border-radius:8px; }
.seq{ font-size:20px; } .seq b{ letter-spacing:.05em; }
@media (max-width:700px){ .modes{ grid-template-columns:1fr; } }
@media (max-width:900px){ body{ font-size:18px; } .wrap{ grid-template-columns:minmax(0,1fr); } .ctx{ position:static; max-height:none; } .qtext{ font-size:19px; } }
</style>
</head>
<body>
<header>
  <button class="hbtn" id="hb"></button>
  <div class="ttl">テスト対策<span id="sub"></span></div>
  <div class="stat" id="st-pos"></div>
  <div class="stat">得点 <b id="st-score">0</b> 点</div>
  <div class="stat" id="st-time"></div>
</header>
<div class="bar"><i id="bar"></i></div>
<main id="main"></main>
<script>
const SRC = {"T": [{"d": 1, "dn": "細胞と生物のからだ", "no": "(1)", "k": "知", "ten": 2, "text": "細胞を酢酸オルセインで染めると、赤く染まるまるいつくりが見られる。このつくりを何というか。最も適切なものを次の１〜４の中から一つ選び、数字で答えなさい。", "ctx": "<p class=\"lead\">図１は、植物の細胞と動物の細胞のつくりを模式的に表したものである。ａ〜ｅは細胞の中のつくりを示している。</p><figure><img data-k=\"cell-b.png\" alt=\"\"><figcaption>図１　植物の細胞と動物の細胞（模式図）</figcaption></figure>", "sel": ["液胞", "核", "細胞壁", "細胞膜"], "ans": [2], "multi": false, "yoko": true, "u": "1-g0"}, {"d": 1, "dn": "細胞と生物のからだ", "no": "(2)", "k": "知", "ten": 2, "text": "図１のａ〜ｅのうち、植物の細胞と動物の細胞に共通して見られるつくりはどれか。次の１〜５の中から<span class=\"kyoucho\">すべて選び</span>、数字で答えなさい。", "ctx": "<p class=\"lead\">図１は、植物の細胞と動物の細胞のつくりを模式的に表したものである。ａ〜ｅは細胞の中のつくりを示している。</p><figure><img data-k=\"cell-b.png\" alt=\"\"><figcaption>図１　植物の細胞と動物の細胞（模式図）</figcaption></figure>", "sel": ["ａ", "ｂ", "ｃ", "ｄ", "ｅ"], "ans": [3, 5], "multi": true, "yoko": true, "u": "1-g0"}, {"d": 1, "dn": "細胞と生物のからだ", "no": "(3)", "k": "知", "ten": 2, "text": "「多細胞生物」を説明した文として、最も適切なものを次の１〜４の中から一つ選び、数字で答えなさい。", "ctx": "<p class=\"lead\">図１は、植物の細胞と動物の細胞のつくりを模式的に表したものである。ａ〜ｅは細胞の中のつくりを示している。</p><figure><img data-k=\"cell-b.png\" alt=\"\"><figcaption>図１　植物の細胞と動物の細胞（模式図）</figcaption></figure>", "sel": ["からだが1つの細胞でできている生物。", "多くの細胞が集まって、からだができている生物。", "1つの細胞の中に、多くの核をもつ生物。", "顕微鏡を使わないと見ることができない生物。"], "ans": [2], "multi": false, "yoko": false, "u": "1-g0"}, {"d": 1, "dn": "細胞と生物のからだ", "no": "(4)", "k": "思", "ten": 2, "text": "オオカナダモの葉の細胞を観察した。この細胞のつくりは、図１の細胞Ｐと細胞Ｑのどちらに近いか。また、そう判断できる理由は何か。最も適切なものを次の１〜４の中から一つ選び、数字で答えなさい。", "ctx": "<p class=\"lead\">図１は、植物の細胞と動物の細胞のつくりを模式的に表したものである。ａ〜ｅは細胞の中のつくりを示している。</p><figure><img data-k=\"cell-b.png\" alt=\"\"><figcaption>図１　植物の細胞と動物の細胞（模式図）</figcaption></figure>", "sel": ["細胞Ｐ。細胞の中にｃのつくりがあるから。", "細胞Ｐ。ａ・ｂ・ｄのつくりが見られるから。", "細胞Ｑ。細胞の中にｃのつくりがあるから。", "細胞Ｑ。ａ・ｂ・ｄのつくりが見られないから。"], "ans": [2], "multi": false, "yoko": false, "u": "1-g0"}, {"d": 1, "dn": "細胞と生物のからだ", "no": "(5)", "k": "知", "ten": 2, "text": "多細胞生物はどれか。次の１〜５の中から<span class=\"kyoucho\">すべて選び</span>、数字で答えなさい。", "ct 消化器官", "排出器官", "運動器官", "感覚器官"], "ans": [4], "multi": false, "yoko": true, "u": "6-1"}, {"d": 6, "dn": "刺激と反応・骨と筋肉", "no": "(2)", "k": "知", "ten": 2, "text": "脳やせきずいは、判断や命令などを行う重要な役割をになっている。脳やせきずいをまとめて何というか。最も適切なものを次の１〜４の中から一つ選び、数字で答えなさい。", "ctx": "", "sel": ["中枢神経", "中枢神径", "中数神経", "末しょう神経"], "ans": [1], "multi": false, "yoko": true, "u": "6-2"}, {"d": 6, "dn": "刺激と反応・骨と筋肉", "no": "(3)", "k": "思", "ten": 1, "text": "10人が輪になって手をつないだ。最初の人は、右手でストップウォッチをスタートさせると同時に、左手でとなりの人の右手をにぎった。右手をにぎられた人は、すぐに左手でとなりの人の右手をにぎり、これを順に行った。最後の人は、最初の人の右の手首をにぎり、最初の人は、にぎられたらすぐにストップウォッチを止めた。ストップウォッチは2.8秒を示していた。10人全員が1回ずつ反応したと考えると、1人あたりにかかった時間は何秒か。数字を入力しなさい。", "ctx": "", "num": "0.28", "unit": "秒", "u": "6-3"}, {"d": 6, "dn": "刺激と反応・骨と筋肉", "no": "(4)", "k": "知", "ten": 2, "text": "熱いやかんに手がふれて、思わず手を引っこめた。このとき、刺激を受けとってから反応が起こるまでに信号が伝わった道すじとして、最も適切なものを次の１〜４の中から一つ選び、数字で答えなさい。", "ctx": "<p class=\"lead\">図７は、刺激を受けとってから反応が起こるまでの、信号が伝わる道すじを模式的に表したものである。Ａ〜Ｄは信号の伝わる道すじを示している。</p><figure><img data-k=\"nerve.png\" alt=\"\"><figcaption>図７　信号が伝わる道すじ（模式図）</figcaption></figure>", "sel": ["皮膚 → Ｂ → 脳 → Ｃ → 筋肉", "皮膚 → Ａ → せきずい → Ｄ → 筋肉", "皮膚 → Ａ → せきずい → Ｂ → 脳 → Ｃ → せきずい → Ｄ → 筋肉", "皮膚 → Ｄ → せきずい → Ａ → 筋肉"], "ans": [2], "multi": false, "yoko": false, "u": "6-g1"}, {"d": 6, "dn": "刺激と反応・骨と筋肉", "no": "(5)", "k": "思", "ten": 2, "text": "(4)のような反応は、(3)の「手をにぎられてからにぎる」反応よりも短い時間で起こる。その理由として、最も適切なものを次の１〜４の中から一つ選び、数字で答えなさい。", "ctx": "<p class=\"lead\">図７は、刺激を受けとってから反応が起こるまでの、信号が伝わる道すじを模式的に表したものである。Ａ〜Ｄは信号の伝わる道すじを示している。</p><figure><img data-k=\"nerve.png\" alt=\"\"><figcaption>図７　信号が伝わる道すじ（模式図）</figcaption></figure>", "sel": ["信号が脳に伝わる前に、せきずいから命令の信号が出されるから。", "脳が、ほかの反応よりも急いで命令の信号を出すから。", "信号が神経を伝わる速さが、熱いときだけ速くなるから。", "信号が感覚神経を通らず、皮膚から筋肉へ直接伝わるから。"], "ans": [1], "multi": false, "yoko": false, "u": "6-g1"}, {"d": 6, "dn": "刺激と反応・骨と筋肉", "no": "(6)", "k": "思", "ten": 2, "text": "次の１〜５の反応のうち、反射はどれか。<span class=\"kyoucho\">すべて選び</span>、数字で答えなさい。", "ctx": "<p class=\"lead\">図７は、刺激を受けとってから反応が起こるまでの、信号が伝わる道すじを模式的に表したものである。Ａ〜Ｄは信号の伝わる道すじを示している。</p><figure><img data-k=\"nerve.png\" alt=\"\"><figcaption>図７　信号が伝わる道すじ（模式図）</figcaption></figure>", "sel": ["信号が青に変わったので、歩き出した。", "飛んできたボールを見て、手をのばしてとった。", "後ろから名前を呼ばれたので、ふり向いた。", "いすに座ってひざの下をたたかれると、あしが勝手にはね上がった。", "熱いなべに手がふれて、思わず手を引っこめた。"], "ans": [4, 5], "multi": true, "yoko": false, "u": "6-g2"}, {"d": 6, "dn": "刺激と反応・骨と筋肉", "no": "(7)", "k": "知", "ten": 2, "text": "図８のうでを、ひじのところでさらに曲げるとき、筋肉Ｘと筋肉Ｙはそれぞれどうなるか。最も適切なものを次の１〜４の中から一つ選び、数字で答えなさい。", "ctx": "<p class=\"lead\">図８は、ヒトのうでの骨と筋肉のようすを模式的に表したものである。</p><figure><img data-k=\"arm.png\" alt=\"\"><figcaption>図８　ヒトのうでの骨と筋肉（模式図）</figcaption></figure>", "sel": ["筋肉Ｘも筋肉Ｙも縮む。", "筋肉Ｘも筋肉Ｙものばされる。", "筋肉Ｘが縮み、筋肉Ｙがのばされる。", "筋肉Ｘがのばされ、筋肉Ｙが縮む。"], "ans": [3], "multi": false, "yoko": false, "u": "6-7"}, {"d": 6, "dn": "刺激と反応・骨と筋肉", "no": "(8)", "k": "知", "ten": 2, "text": "筋肉が骨についているようすを正しく述べた文として、最も適切なものを次の１〜４の中から一つ選び、数字で答えなさい。", "ctx": "<p class=\"lead\">図８は、ヒトのうでの骨と筋肉のようすを模式的に表したものである。</p><figure><img data-k=\"arm.png\" alt=\"\"><figcaption>図８　ヒトのうでの骨と筋肉（模式図）</figcaption></figure>", "sel": ["筋肉の両端は関節の中に入りこみ、骨と骨の間にはさまれている。", "筋肉の両端はけんになっていて、両方とも同じ1本の骨についている。", "筋肉は骨にはついておらず、皮膚の内側についている。", "筋肉の両端はけんになっていて、関節をまたいで別々の骨についている。"], "ans": [4], "multi": false, "yoko": false, "u": "6-8"}]};

const PAGES = {"1": "p.88〜103", "2": "p.106〜115", "3": "p.116〜125", "4": "p.128〜135", "5": "p.136〜143", "6": "p.148〜157"};
const KEY = 'testprep_chu2_seibutsu_v1';
let QS = SRC.T.slice(), ALL = QS.slice(), mode = 'print', seed = 0, partial = false, playing = false;
const ONWEB = location.protocol.startsWith('http');
function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
function save(o){ try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {} }
const Z = '０１２３４５６７８９';
const zen = n => String(n).length === 1 ? Z[n] : String(n);
const $ = s => document.querySelector(s);
let idx = 0, score = 0, rec = [], picked = [], done = false, t0 = 0, timer = null;

function fmt(sec){ const m = Math.floor(sec / 60), s = sec % 60; return m + '分' + String(s).padStart(2, '0') + '秒'; }
function tick(){ const s = Math.floor((Date.now() - t0) / 1000); $('#st-time').textContent = '時間 ' + fmt(s); $('#st-time').classList.toggle('over', s > 40 * 60); }
function hb(text, fn){ const b = $('#hb'); b.hidden = !text; b.textContent = text || ''; b.onclick = fn || null; }

function recLine(r){
  if (!r || !r.n) return 'まだ記録なし';
  return `最高 <b>${r.best}</b> 点　／　前回 ${r.last} 点　／　${r.n} 回`;
}

function start(){
  playing = false; clearInterval(timer);
  const R = load();
  hb(ONWEB ? '← 学びポータル' : '', () => { location.href = '../index.html'; });
  $('#sub').textContent = '';
  $('#main').innerHTML = `<div class="card home">
    <h1>テスト対策</h1>
    <p class="meta">本番のテストと同じ形式の問題を、1問ずつ解く。答えるとその場で正解・不正解が出て、最後に点数が出る。</p>
    <p class="unit">中2 理科　単元2「生物のからだのつくりとはたらき」</p>
    <p class="meta">全${SRC.T.length}問・100点　／　本番のテスト時間は40分　／　教科書 p.88〜157</p>
    <div class="modes">
      <div class="mode"><b>固定テスト</b><span>対策プリントと同じ${SRC.T.length}問。まずはこちら。</span>
        <div class="rec">${recLine(R.fixed)}</div>
        <button class="btn" id="go">はじめる</button></div>
      <div class="mode"><b>ランダムテスト</b><span>同じ形式・同じ配点で、問題の組み合わせが毎回変わる。固定テストに無い問題も出る。</span>
        <div class="rec">${recLine(R.random)}</div>
        <label>テスト番号 <input id="seed" inputmode="numeric" maxlength="4" placeholder="おまかせ"></label>
        <button class="btn" id="rnd">はじめる</button></div>
    </div>
    <p class="unit">高校入試 仮想テスト（理科）</p>
    <p class="meta">全国の公立高校入試をもとにした類題から、毎回ちがう入試を作る。本番（50分）・プチ番（10分ほど）・分野しぼり。<a href="nyushi/" style="display:inline-block;margin-left:10px;font-weight:bold;color:#fff;background:var(--blue);border-radius:10px;padding:4px 20px;text-decoration:none">ひらく</a></p>
    <details><summary>答え方</summary><ul>
      <li>選択肢は、クリックか、キーボードの数字キーで選ぶ。Enter キーで次へ進める。</li>
      <li>「すべて選び」の問題は、当てはまるものを全部選んでから「答える」をおす。全部合って正解。</li>
      <li>順番に並べる問題は、選択肢を順番におしてから「答える」をおす。</li>
      <li>計算の問題は、数字を入力して「答える」をおす。</li>
      <li>ランダムテストは、テスト番号が同じなら同じ問題が出る。友だちと同じ番号で解いて、点数を比べられる。</li>
      <li>点数の記録は、この端末のこのブラウザに残る。</li>
    </ul></details></div>`;
  $('#go').onclick = () => { mode = 'print'; QS = SRC.T.slice(); ALL = QS.slice(); begin(); };
  $('#rnd').onclick = () => { const v = parseInt(norm($('#seed').value), 10); makeRandom(v >= 1 && v <= 9999 ? v : 1 + Math.floor(Math.random() * 9999)); begin(); };
  $('#st-pos').textContent = ''; $('#st-score').textContent = '0'; $('#st-time').textContent = ''; $('#bar').style.width = '0';
  window.scrollTo(0, 0);
}

function begin(part){
  partial = !!part; playing = true; idx = 0; score = 0; rec = []; t0 = Date.now();
  clearInterval(timer); timer = setInterval(tick, 1000); tick();
  hb('やめる', () => { if (confirm('このテストをやめて、最初の画面にもどる？（ここまでの点数は残らない）')) start(); });
  $('#sub').textContent = label() + (partial ? '（解き直し）' : '');
  show();
}

function makeRandom(s){
  // テスト番号から決まる乱数。入れかえの単位（u）ごとに、2つの版のどちらかを選ぶ
  seed = s; mode = 'random';
  let a = s * 2654435761 >>> 0;
  const rnd = () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const use = {};
  QS = SRC.T.map((q, i) => { if (!(q.u in use)) use[q.u] = rnd() < 0.5; return use[q.u] ? SRC.H[i] : q; });
  ALL = QS.slice();
}

function label(){ return mode === 'random' ? 'ランダムテスト　番号 ' + seed : '固定テスト'; }

function show(){
  const q = QS[idx]; picked = []; done = false;
  $('#st-pos').textContent = (idx + 1) + ' / ' + QS.length + ' 問';
  $('#st-score').textContent = score;
  $('#bar').style.width = (idx / QS.length * 100) + '%';
  let body;
  if (q.sel){
    body = `<div class="sel${q.yoko ? ' yoko' : ''}">` + q.sel.map((s, i) =>
      `<button data-i="${i + 1}"><span class="n">${zen(i + 1)}</span><span>${s}</span></button>`).join('') + '</div>'
      + (q.multi ? '<div class="act"><button class="btn" id="ok" disabled>答える</button><span class="hint">当てはまるものを全部選ぶ</span></div>' : '')
      + (q.order ? '<div class="act"><span class="seq">並べた順：<b id="seq">　</b></span><button class="btn" id="ok" disabled>答える</button><span class="hint">順番におす。もう一度おすと取り消し</span></div>' : '');
  } else {
    body = `<div class="numrow"><input id="num" inputmode="decimal" autocomplete="off"><span>${q.unit}</span></div>
      <div class="act"><button class="btn" id="ok">答える</button></div>`;
  }
  $('#main').innerHTML = `<div class="wrap${q.ctx ? '' : ' noctx'}">
    ${q.ctx ? `<div class="card ctx">${q.ctx}</div>` : ''}
    <div class="card">
      <div><span class="tag">大問${zen(q.d)}　${q.dn}</span><span class="tag">${q.no}　${q.ten}点</span></div>
      <p class="qtext">${q.text}</p>${body}
      <div id="res"></div>
    </div></div>`;
  document.querySelectorAll('img[data-k]').forEach(im => im.src = IMGS[im.dataset.k]);
  window.scrollTo(0, 0);
  if (q.sel){
    document.querySelectorAll('.sel button').forEach(b => b.onclick = () => pick(+b.dataset.i));
    if (q.multi || q.order) $('#ok').onclick = judge;
  } else {
    $('#ok').onclick = judge; $('#num').focus();
  }
}

function pick(i){
  const q = QS[idx]; if (done || !q.sel || i > q.sel.length) return;
  if (q.order){
    picked = picked.includes(i) ? picked.filter(x => x !== i) : picked.concat(i);
    document.querySelectorAll('.sel button').forEach(b => b.classList.toggle('on', picked.includes(+b.dataset.i)));
    $('#seq').textContent = picked.map(zen).join(' → ') || '　';
    $('#ok').disabled = picked.length !== q.sel.length;
  } else if (q.multi){
    picked = picked.includes(i) ? picked.filter(x => x !== i) : picked.concat(i).sort();
    document.querySelectorAll('.sel button').forEach(b => b.classList.toggle('on', picked.includes(+b.dataset.i)));
    $('#ok').disabled = picked.length === 0;
  } else { picked = [i]; judge(); }
}

function norm(s){ return s.replace(/[０-９]/g, c => Z.indexOf(c)).replace(/[．。]/g, '.').replace(/\s/g, ''); }

function judge(){
  const q = QS[idx]; if (done) return;
  let ok, mine, right;
  if (q.sel){
    if (!picked.length) return;
    ok = picked.join() === q.ans.join();
    mine = picked.map(zen).join(''); right = q.ans.map(zen).join('');
    document.querySelectorAll('.sel button').forEach(b => {
      const i = +b.dataset.i; b.disabled = true;
      if (q.order) return;
      if (q.ans.includes(i)) b.classList.add('right'); else if (picked.includes(i)) b.classList.add('wrong');
    });
    if (q.multi || q.order) $('#ok').disabled = true;
  } else {
    const v = norm($('#num').value); if (v === '' || isNaN(Number(v))) { $('#num').focus(); return; }
    ok = Math.abs(Number(v) - Number(q.num)) < 1e-9;
    mine = v + ' ' + q.unit; right = q.num + ' ' + q.unit;
    $('#num').disabled = true; $('#ok').disabled = true;
  }
  done = true;
  if (ok) score += q.ten;
  rec.push({ ok, mine, right });
  $('#st-score').textContent = score;
  const last = idx === QS.length - 1;
  $('#res').innerHTML = `<div class="judge ${ok ? 'ok' : 'ng'}">${ok ? '〇 正解！　＋' + q.ten + '点' : '× 不正解　正しい答えは ' + right}</div>
    <div class="act"><button class="btn" id="next">${last ? '結果を見る' : '次の問題へ'}</button><span class="hint">Enter キーでも進める</span></div>`;
  $('#next').onclick = next; $('#next').focus();
}

function next(){ if (idx < QS.length - 1){ idx++; show(); } else result(); }

function result(){
  clearInterval(timer); playing = false;
  const sec = Math.floor((Date.now() - t0) / 1000);
  $('#bar').style.width = '100%'; $('#st-pos').textContent = '結果';
  hb('最初の画面へ', start);
  let newBest = false;
  if (!partial){
    const R = load(), k = mode === 'random' ? 'random' : 'fixed', r = R[k] || { n: 0, best: 0, last: 0 };
    newBest = r.n > 0 && score > r.best;
    r.n++; r.last = score; r.best = Math.max(r.best, score); if (k === 'random') r.seed = seed;
    R[k] = r; save(R);
  }
  const dms = [...new Set(QS.map(q => q.d))];
  let chi = 0, shi = 0, chiA = 0, shiA = 0, rows = '';
  QS.forEach((q, i) => { if (q.k === '知'){ chiA += q.ten; if (rec[i].ok) chi += q.ten; } else { shiA += q.ten; if (rec[i].ok) shi += q.ten; } });
  const stat = dms.map(d => {
    const ix = QS.map((q, i) => i).filter(i => QS[i].d === d);
    const got = ix.reduce((a, i) => a + (rec[i].ok ? QS[i].ten : 0), 0), all = ix.reduce((a, i) => a + QS[i].ten, 0);
    return { d, ix, got, all, rate: got / all };
  });
  const low = Math.min(...stat.map(s => s.rate));
  stat.forEach(s => {
    rows += `<tr class="${s.rate === low && low < 1 ? 'weak' : ''}"><th>大問${zen(s.d)}　${QS[s.ix[0]].dn}</th><td>${s.ix.filter(i => rec[i].ok).length} / ${s.ix.length} 問</td><td>${s.got} / ${s.all} 点</td><td class="pg">教科書 ${PAGES[s.d] || ''}</td></tr>`;
  });
  const miss = QS.map((q, i) => i).filter(i => !rec[i].ok);
  const text = i => { const q = QS[i]; let a = rec[i].right, m = rec[i].mine;
    if (q.sel && !q.multi && !q.order){ a += '　' + q.sel[q.ans[0] - 1]; }
    return `<div class="miss"><p class="q"><b>大問${zen(q.d)} ${q.no}</b>　${q.text}</p><p class="a">あなたの答え <s>${m}</s>　／　正しい答え <b>${a}</b></p></div>`; };
  $('#main').innerHTML = `<div class="card result" style="max-width:1000px;margin:0 auto">
    <h2>結果　<span class="hint">${label()}${partial ? '（解き直し・記録には入らない）' : ''}${newBest ? '　最高点を更新！' : ''}</span></h2>
    <div class="big">${score}<small> 点 / ${QS.reduce((x, q) => x + q.ten, 0)}点　（${QS.length - miss.length} / ${QS.length} 問正解・${fmt(sec)}）</small></div>
    <table><tr><th>知識・技能</th><td>${chi} / ${chiA} 点</td><th>思考・判断・表現</th><td>${shi} / ${shiA} 点</td></tr></table>
    <table>${rows}</table>
    ${low < 1 ? '<p class="hint">色のついた大問が、いちばん点を落としたところ。教科書のそのページから見直そう。</p>' : ''}
    <div class="act"><button class="btn" id="again">${mode === 'random' ? '同じ番号をもう一度' : 'もう一度はじめから'}</button>${mode === 'random' ? '<button class="btn" id="other">別のランダムテスト</button>' : ''}${miss.length ? '<button class="btn ghost" id="retry">まちがえた問題だけ解き直す</button>' : ''}</div>
    <h2 style="margin-top:22px">${miss.length ? 'まちがえた問題（' + miss.length + '問）' : '全問正解！'}</h2>
    ${miss.length ? '<p class="hint">教科書で確かめてから、解き直そう。</p>' : ''}
    ${miss.map(text).join('')}</div>`;
  window.scrollTo(0, 0);
  $('#again').onclick = () => { QS = ALL.slice(); begin(); };
  if (mode === 'random') $('#other').onclick = () => { makeRandom(1 + Math.floor(Math.random() * 9999)); begin(); };
  if (miss.length) $('#retry').onclick = () => { QS = miss.map(i => QS[i]); begin(true); };
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter'){
    if ($('#next')){ e.preventDefault(); next(); }
    else if ($('#ok') && !$('#ok').disabled){ e.preventDefault(); judge(); }
    return;
  }
  if (/^[1-9]$/.test(e.key) && document.activeElement.tagName !== 'INPUT') pick(+e.key);
});
window.addEventListener('beforeunload', e => { if (playing && idx > 0){ e.preventDefault(); e.returnValue = ''; } });
start();
</script>
</body>
