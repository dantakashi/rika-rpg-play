<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>ボス選別 — 理科RPG2</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0f1014;color:#e7e7ea;font-family:system-ui,"Hiragino Kaku Gothic ProN",sans-serif;overflow:hidden;height:100dvh}
header{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;background:#1a1c22;border-bottom:1px solid #2c2f3a}
header b{color:#ffe27a}.count{font-size:13px;color:#9aa0ad}
.stage{position:relative;height:calc(100dvh - 150px);display:flex;align-items:center;justify-content:center;padding:10px}
.card{position:absolute;width:min(92vw,440px);max-height:100%;background:#1d1f26;border:1px solid #2c2f3a;border-radius:18px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5);touch-action:none}
.imgbox{aspect-ratio:1/1;
  background-image:linear-gradient(45deg,#cfcfcf 25%,transparent 25%),linear-gradient(-45deg,#cfcfcf 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#cfcfcf 75%),linear-gradient(-45deg,transparent 75%,#cfcfcf 75%);
  background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0;background-color:#e9e9e9}
.imgbox img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.info{padding:12px 16px}
.nm{font-size:22px;font-weight:800}
.nm .tier{font-size:14px;font-weight:700;padding:2px 10px;border-radius:999px;margin-left:8px;vertical-align:3px}
.t序盤{background:#2bd47a;color:#06210f}.t中盤{background:#4aa3ff;color:#04203f}.t終盤{background:#ff9a3c;color:#311600}.tラスボス級{background:#ff5a7a;color:#33000d}
.el{font-size:12px;color:#9aa0ad;margin-top:2px}
.fl{font-size:14px;color:#cfd3db;margin-top:8px;line-height:1.55}
.stamp{position:absolute;top:18px;font-size:34px;font-weight:900;padding:4px 14px;border:4px solid;border-radius:12px;opacity:0;transform:rotate(-15deg)}
.yes{left:18px;color:#2bd47a;border-color:#2bd47a}.no{right:18px;color:#ff5a7a;border-color:#ff5a7a}
.bar{position:fixed;bottom:0;left:0;right:0;height:90px;display:flex;align-items:center;justify-content:center;gap:22px;background:#13141a;border-top:1px solid #2c2f3a}
.fab{width:62px;height:62px;border-radius:50%;border:none;font-size:26px;cursor:pointer;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.fab.no{background:#2a1d23;color:#ff5a7a;border:2px solid #ff5a7a}.fab.yes{background:#16271c;color:#2bd47a;border:2px solid #2bd47a}
.fab.undo{width:48px;height:48px;font-size:18px;background:#23242c;color:#cfd3db;border:1px solid #3a3f4c}
.done{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.done h2{color:#ffe27a;margin:0 0 8px}
.btn{margin-top:14px;background:#ffe27a;color:#15161a;border:none;border-radius:10px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
#out{margin-top:12px;width:min(92vw,520px);height:160px;font-family:ui-monospace,monospace;font-size:11px;display:none;background:#0b0c10;color:#cfd3db;border:1px solid #3a3f4c;border-radius:8px;padding:8px}
.hint{font-size:11px;color:#6b7280;margin-top:6px}
.toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%);background:#2bd47a;color:#08210f;padding:8px 16px;border-radius:999px;font-weight:700;opacity:0;transition:.3s;pointer-events:none}.toast.show{opacity:1}
</style></head><body>
<header><div><b>ボス選別</b> <span style="font-size:12px;color:#9aa0ad">← 無し / 有り → ・ドラッグもOK</span></div>
  <div class="count"><span id="done_n">0</span>/<span id="total_n">0</span> ・有り<span id="yes_n">0</span></div></header>
<div class="stage" id="stage">
  <div class="done" id="doneScreen">
    <h2>選別おわり！</h2>
    <div id="summary" style="color:#cfd3db"></div>
    <button class="btn" id="copyBtn">結果をコピー</button>
    <div class="hint">コピーしたテキストをチャットに貼ってください（採用の系統を学習して次の50枚へ）。</div>
    <textarea id="out" readonly></textarea>
    <button class="btn" id="restartBtn" style="background:#3a3f4c;color:#e7e7ea">最初からやり直す</button>
  </div>
</div>
<div class="bar">
  <button class="fab no" id="bNo">✗</button>
  <button class="fab undo" id="bUndo">↶</button>
  <button class="fab yes" id="bYes">♥</button>
  <button class="btn" id="bCopy" style="position:fixed;right:12px;bottom:104px;padding:8px 12px;font-size:12px">途中保存コピー</button>
</div>
<div class="toast" id="toast">コピーしました！</div>
<script>
const BOSSES=[{"id": "six-winged-lantern-warden-n6", "name_ja": "ロクヨク・ミハリ", "tier": "序盤", "element": "聖光", "flavor_ja": "天界の門を見はる、生まれたての小さな番。六枚の翼を体に巻きつけて丸くなり、こぼれる光でまわりをほのかに照らす。", "img": "gacha_n6/six-winged-lantern-warden-n6.png"}, {"id": "censer-acolyte-imp-n6", "name_ja": "コウロのトモシビ", "tier": "序盤", "element": "聖香", "flavor_ja": "祭壇の灯を絶やさぬよう、ちいさな体で香炉を抱えて歩く侍祭。胸からこぼれる清い煙が、悪しきものを遠ざける。", "img": "gacha_n6/censer-acolyte-imp-n6.png"}, {"id": "scroll-keeper-cherub-n6", "name_ja": "オフミの ケルブ", "tier": "序盤", "element": "聖句", "flavor_ja": "天界の戒めを肌に刻んで運ぶ、おさない書記の天使。腕に巻かれた聖句が光るとき、うそはすべて見やぶられる。", "img": "gacha_n6/scroll-keeper-cherub-n6.png"}, {"id": "lion-faced-sanctum-guard-n6", "name_ja": "シシガオ・セイヘイ", "tier": "中盤", "element": "聖威", "flavor_ja": "聖域の最奥を守る、獅子の顔をもつ大天使の衛士。四枚の翼を背に重ね、近づく不浄を一閃で焼き払う。", "img": "gacha_n6/lion-faced-sanctum-guard-n6.png"}, {"id": "many-eyed-watcher-ophan-n6", "name_ja": "メノオオキ・ミハリ", "tier": "中盤", "element": "聖眼", "flavor_ja": "幾重もの光の輪に無数の眼を宿す見張りの天使。決して眠らず、世界のすべてを同時に見つめている。", "img": "gacha_n6/many-eyed-watcher-ophan-n6.png"}, {"id": "bull-headed-altar-colossus-n6", "name_ja": "ウシガミ・サイダン", "tier": "中盤", "element": "聖鉄", "flavor_ja": "古き祭壇に縛られた、牛の頭をもつ守護神。胸の聖火が燃えるかぎり、その祭壇は何者にも侵させない。", "img": "gacha_n6/bull-headed-altar-colossus-n6.png"}, {"id": "tetramorph-throne-beast-n6", "name_ja": "ヨンメンの ミクラ", "tier": "終盤", "element": "聖座", "flavor_ja": "獅子・牛・鷲・人、四つの顔をめぐらせる神の御座を担う獣。その四面が同時に見開くとき、天の裁きが下る。", "img": "gacha_n6/tetramorph-throne-beast-n6.png"}, {"id": "wheel-of-flame-dominion-n6", "name_ja": "ホノオノワ・スベラギ", "tier": "終盤", "element": "聖炎", "flavor_ja": "燃えさかる車輪と化した支配の天使。四本の腕に聖旗をかかげ、転がりすすむ先のすべてを清い炎で焼き浄める。", "img": "gacha_n6/wheel-of-flame-dominion-n6.png"}, {"id": "empyrean-sovereign-of-radiance-n6", "name_ja": "テンノウ・コウリン", "tier": "ラスボス級", "element": "聖光・終焉", "flavor_ja": "天界のいただきに座す至高の神。六枚の翼を身にまとい、その胸に小さな太陽を抱く。御前に立つ者は、その光に焼かれて影すら残らぬという。", "img": "gacha_n6/empyrean-sovereign-of-radiance-n6.png"}, {"id": "abyss-fallen-judgment-host-n6", "name_ja": "ツミサバキ・ダテン", "tier": "ラスボス級", "element": "聖罰・闇", "flavor_ja": "天を追われ、おのれの裁きに焼かれつづける審判の天軍。くすんだ六翼を体に巻きつけ、折れた剣と骨の天秤で、いまも罪なき者まで量りつづける。", "img": "gacha_n6/abyss-fallen-judgment-host-n6.png"}, {"id": "storm-thunderbird-n6", "name_ja": "ライガルーダ", "tier": "序盤", "element": "電気", "flavor_ja": "羽ばたきで雷雲を呼ぶと伝わる雷鳥。翼の縁に放電がまとわりつき、近づくと静電気で髪が逆立つ。", "img": "gacha_n6/storm-thunderbird-n6.png"}, {"id": "saltmarsh-bunyip-n6", "name_ja": "ヌマドロ", "tier": "序盤", "element": "水", "flavor_ja": "よどんだ沼の底にひそむ伝承の獣。体から滴る水とぬめる藻が、近づく者を底へ引き込むという。", "img": "gacha_n6/saltmarsh-bunyip-n6.png"}, {"id": "ember-firebird-ashen-n6", "name_ja": "ハイヅル", "tier": "序盤", "element": "火", "flavor_ja": "灰から半ばよみがえった不死鳥の変種。燃えきらぬ熾火が羽の内でくすぶり、まとう熱で空気が揺らぐ。", "img": "gacha_n6/ember-firebird-ashen-n6.png"}, {"id": "manticore-spineflail-n6", "name_ja": "マンティガ", "tier": "中盤", "element": "無", "flavor_ja": "獅子の胴と毒の尾を持つ伝承の合成獣。背びれの棘を矢のように放ち、近づくほど尾が高く構える。", "img": "gacha_n6/manticore-spineflail-n6.png"}, {"id": "basilisk-stonegaze-n6", "name_ja": "バシリオン", "tier": "中盤", "element": "土", "flavor_ja": "その眼に見られた者は石に化すという冠の蛇。とぐろを重く据え、自らの鱗さえ徐々に石へと変じてゆく。", "img": "gacha_n6/basilisk-stonegaze-n6.png"}, {"id": "griffon-bronzewing-n6", "name_ja": "グリュフォーン", "tier": "中盤", "element": "風", "flavor_ja": "鷲の翼と獅子の体を持つ気高き守護獣。風をまといながらも翼は背に畳み、どっしりと大地を踏みしめる。", "img": "gacha_n6/griffon-bronzewing-n6.png"}, {"id": "wendigo-frostgaunt-n6", "name_ja": "ウェンディガ", "tier": "終盤", "element": "氷", "flavor_ja": "飢えと寒気の化身とされる森の禍つ獣。骨の角と凍てつく霜を身にまとい、肋からは冷気が漏れ出す。", "img": "gacha_n6/wendigo-frostgaunt-n6.png"}, {"id": "sphinx-riddlemaw-n6", "name_ja": "スフィンガ", "tier": "終盤", "element": "光", "flavor_ja": "謎をかける古の守護獣。胸に灯る黄金の文字を体にまとい、伏せた姿勢でなお威厳が漂う。", "img": "gacha_n6/sphinx-riddlemaw-n6.png"}, {"id": "cerberus-warden-triune-n6", "name_ja": "ケルベロガ", "tier": "ラスボス級", "element": "闇", "flavor_ja": "三つの頭で冥府の門を守る番獣。首には黒蛇がまとわりつき、顎からは冷たい霊気が漏れる。", "img": "gacha_n6/cerberus-warden-triune-n6.png"}, {"id": "qilin-sovereign-jade-n6", "name_ja": "キリンオウ", "tier": "ラスボス級", "element": "無", "flavor_ja": "聖王の世にのみ現れるという瑞獣の王。蹄と背に碧と金の神火をまとい、踏む大地に災いを許さぬ。", "img": "gacha_n6/qilin-sovereign-jade-n6.png"}, {"id": "starling-ram-aries-n6", "name_ja": "ホシヅノ・ラム", "tier": "序盤", "element": "星の光", "flavor_ja": "夜空の最初の星座から生まれた、生まれたての星霊。もこもこの毛は星くずでできていて、歩くたびにきらきらこぼれる。", "img": "gacha_n6/starling-ram-aries-n6.png"}, {"id": "comet-pup-foxfire-n6", "name_ja": "スイセイギツネ", "tier": "序盤", "element": "彗星の尾", "flavor_ja": "空をかけぬける小さな彗星の子ぎつね。ふさふさのしっぽは凍った星の光をひいて、夜空にすうっと一本の線をのこす。", "img": "gacha_n6/comet-pup-foxfire-n6.png"}, {"id": "crab-of-the-summer-sky-n6", "name_ja": "ナツゾラ・カニ", "tier": "序盤", "element": "蒼天の星屑", "flavor_ja": "夏の夜空にかかる星のむれを背負った、ずんぐりした星の蟹。低く構えてどっしりと砂に張りつき、星の甲羅をきらめかせる。", "img": "gacha_n6/crab-of-the-summer-sky-n6.png"}, {"id": "twin-star-jackals-n6", "name_ja": "フタゴ・ホシイヌ", "tier": "中盤", "element": "双子星", "flavor_ja": "金と銀、ふたつの星をやどす双頭の星獣。決して離れない二つの頭は、たがいに光をおくり合い、夜を照らす。", "img": "gacha_n6/twin-star-jackals-n6.png"}, {"id": "celestial-scale-balancer-n6", "name_ja": "テンビン・セイレイ", "tier": "中盤", "element": "天秤の星", "flavor_ja": "天秤座を司る星の守護獣。胸の星天秤が世界の均衡をはかり、かたむきを正すまで決して動かない。", "img": "gacha_n6/celestial-scale-balancer-n6.png"}, {"id": "starfeather-archer-beast-n6", "name_ja": "イテボシ・ケンタウル", "tier": "中盤", "element": "射手の星矢", "flavor_ja": "天をかける半人半馬の星の射手。引きしぼる弓は星の光でできていて、放たれた矢は流れ星となって夜空を裂く。", "img": "gacha_n6/starfeather-archer-beast-n6.png"}, {"id": "sea-goat-of-the-deep-stars-n6", "name_ja": "ウミヤギ・カプリコス", "tier": "終盤", "element": "深淵の星海", "flavor_ja": "天と深海の境を支配する、山羊と魚の異形の星獣。星の海をくぐり、地に立つときその巻いた尾は星々を巻き込む。", "img": "gacha_n6/sea-goat-of-the-deep-stars-n6.png"}, {"id": "water-bearer-titan-beast-n6", "name_ja": "ミズガメ・アクアリオス", "tier": "終盤", "element": "星河の水", "flavor_ja": "天の川の水をたたえし巨神。四本の腕にかかえた星瓶からあふれる星の水は、世界をうるおし、また飲みこむ。", "img": "gacha_n6/water-bearer-titan-beast-n6.png"}, {"id": "great-bear-of-the-pole-star-n6", "name_ja": "ホッキョク・グレートベア", "tier": "ラスボス級", "element": "北極星", "flavor_ja": "天の北の頂に座し、すべての星を従える巨熊。その背に輝く七つの星は、迷う者を導く永遠のしるべ。動かぬ北極星の化身。", "img": "gacha_n6/great-bear-of-the-pole-star-n6.png"}, {"id": "zodiac-serpent-bearer-deity-n6", "name_ja": "ヘビツカイ・コスモクラトル", "tier": "ラスボス級", "element": "黄道十三の星輪", "flavor_ja": "黄道十三の星輪を頭上にいただく、星天をつかさどる半神の巨神。六腕に二匹の星蛇をしたがえ、天球そのものを回す者。世界の終わりと始まりを握る。", "img": "gacha_n6/zodiac-serpent-bearer-deity-n6.png"}, {"id": "mossback-boulder-jotun-n6", "name_ja": "コケむしのイワヌシ", "tier": "序盤", "element": "大地", "flavor_ja": "森の谷間で何百年も眠っていた、こけだらけの小さな岩の巨人。動きはのろいが、ふんばった足は山ほど重い。背中のこけは、生きものが住むほど古い証。", "img": "gacha_n6/mossback-boulder-jotun-n6.png"}, {"id": "geode-marrow-colossus-n6", "name_ja": "ショウニュウのオオワラベ", "tier": "序盤", "element": "結晶・鉱物", "flavor_ja": "鍾乳洞の奥でしずくがつくった、まだ幼い鉱物の巨人。胸の空どうにはむらさきの結晶が育っていて、動くたびにちりんと鳴る。割れると中はもっときれい。", "img": "gacha_n6/geode-marrow-colossus-n6.png"}, {"id": "tidepool-reef-giant-n6", "name_ja": "イソだまりのアラガネ", "tier": "序盤", "element": "水・地学", "flavor_ja": "潮が引いたあとの岩場が立ちあがったような巨人。体のくぼみには小さな潮だまりがたまり、フジツボやヒトデがびっしり住みついている。波打ちぎわの番人。", "img": "gacha_n6/tidepool-reef-giant-n6.png"}, {"id": "strata-bearer-jotun-n6", "name_ja": "チソウのセオイビト", "tier": "中盤", "element": "地層・大地", "flavor_ja": "大地の地層をそのまま背負って歩く、四本腕の巨人。体に刻まれた縞模様は何万年もの時間そのもの。化石を体に閉じこめたまま、ゆっくりと世界を運ぶ。", "img": "gacha_n6/strata-bearer-jotun-n6.png"}, {"id": "permafrost-hoarfrost-jotun-n6", "name_ja": "シモバシラのフユガミ", "tier": "中盤", "element": "氷・寒冷", "flavor_ja": "永久凍土の底から目覚めた、霜柱の冬神。歩いた跡には氷の柱がせり上がり、息は世界を白く凍らせる。背に張りついた霜は、決してとけることがない。", "img": "gacha_n6/permafrost-hoarfrost-jotun-n6.png"}, {"id": "thunderhead-storm-titan-n6", "name_ja": "セキランのカミナリオウ", "tier": "中盤", "element": "気圧・雷", "flavor_ja": "立ちのぼる積乱雲がそのまま神の姿をとったもの。体じゅうを稲妻が這いまわり、こぶしを振り下ろせば大地に雷が落ちる。空気の重さと電気をまとう、嵐そのものの巨神。", "img": "gacha_n6/thunderhead-storm-titan-n6.png"}, {"id": "molten-forge-jotun-n6", "name_ja": "ようがんのカジビト", "tier": "終盤", "element": "溶岩・火山", "flavor_ja": "火山の心臓から這い出た溶岩の巨人。冷えて黒くなった体のひび割れから、灼熱のマグマが脈打って流れる。こぶしが触れたものは、すべて溶けて灰になる。", "img": "gacha_n6/molten-forge-jotun-n6.png"}, {"id": "magnetite-lodestone-colossus-n6", "name_ja": "ジテツのオオガミ", "tier": "終盤", "element": "磁力・鉱物", "flavor_ja": "地中の磁鉄鉱がかたまって生まれた巨神。体に引き寄せられた鉄くぎや鉄粉が、トゲのよろいとなって全身を覆う。近づく金属はすべて、その体に吸い寄せられてしまう。", "img": "gacha_n6/magnetite-lodestone-colossus-n6.png"}, {"id": "world-pillar-atlas-deity-n6", "name_ja": "テンチュウをになうオオミコト", "tier": "ラスボス級", "element": "重力・大地", "flavor_ja": "天と地のはざまで、世界の柱を六本の腕でになう巨神。その肩には大陸の重みがのしかかり、もし膝をつけば空が落ちるという。動かず、ただ世界を支えつづける荘厳なる存在。", "img": "gacha_n6/world-pillar-atlas-deity-n6.png"}, {"id": "primeval-genesis-jotun-god-n6", "name_ja": "ゲンショのオヤガミ・イマス", "tier": "ラスボス級", "element": "原初・天地創造", "flavor_ja": "天も地もまだ分かれていなかった頃に生まれた、すべての巨人の祖。岩と星と炎が一つの体に混じりあい、三つの顔が世界の始まりを見つめる。その腕がふるわれるとき、新しい世界が生まれ、古い世界が終わる。", "img": "gacha_n6/primeval-genesis-jotun-god-n6.png"}, {"id": "starpelt-prowler-lynx-n6", "name_ja": "ホシモリ・ヤマネコ", "tier": "序盤", "element": "光", "flavor_ja": "夜空のかけらをまとった山猫の霊。毛なみに小さな星々がまたたき、暗がりでもそのもようで星座を読みとれる。光がまっすぐ進むことを知る者だけが、その瞳の輝きの正体に気づく。", "img": "gacha_n6/starpelt-prowler-lynx-n6.png"}, {"id": "coralplate-mudskipper-guard-n6", "name_ja": "サンゴヨロイ・トビハゼ", "tier": "序盤", "element": "水", "flavor_ja": "潮だまりの主。背に生きたサンゴをまとい、ひれを腕のようにして岩場を這う守り手。水のなかと外、どちらでも息ができるその体は、生き物が陸へ上がった大昔の冒険を今に伝えている。", "img": "gacha_n6/coralplate-mudskipper-guard-n6.png"}, {"id": "geode-scale-pangolin-n6", "name_ja": "ショウドウ・センザンコウ", "tier": "序盤", "element": "土", "flavor_ja": "岩の鱗の内がわに、紫の結晶をびっしりと育てた穴掘りの獣。身を丸めれば、ただの大きな石ころにしか見えない。地面の下でゆっくり結晶が育つ時間の長さを、その背中だけが知っている。", "img": "gacha_n6/geode-scale-pangolin-n6.png"}, {"id": "emberforge-sphinx-lioness-n6", "name_ja": "ヨウガン・スフィンカ", "tier": "中盤", "element": "火", "flavor_ja": "冷えた溶岩の体に、消えぬ火の血すじを通わせた有翼の獅子。問いに答えられぬ者を通さぬ門番として、火山のふもとの古い道に座すという。岩がいちど溶けて固まったしるしを、その体ぜんぶでまとっている。", "img": "gacha_n6/emberforge-sphinx-lioness-n6.png"}, {"id": "stormglass-grove-elemental-n6", "name_ja": "ライセン・コダマヌシ", "tier": "中盤", "element": "電", "flavor_ja": "幾度も雷に打たれ、幹が砂ガラスに変わってしまった森の主。体のみぞには今も稲妻が走り、根を大地にしっかりと張っている。電気が枝分かれして流れる道すじは、地面のなかへ続いている。", "img": "gacha_n6/stormglass-grove-elemental-n6.png"}, {"id": "resonance-conch-behemoth-n6", "name_ja": "キョウメイ・ホラガイベヒモス", "tier": "中盤", "element": "音", "flavor_ja": "背に巨大なほら貝を背負い、歩くたびにその体が低く鳴りひびく重厚な獣。空気をふるわせて音を伝えるそのからだは、遠くの仲間の声を貝で聞き分けるという。重い足どりが、地のひびきとなって伝わっていく。", "img": "gacha_n6/resonance-conch-behemoth-n6.png"}, {"id": "obsidian-war-deva-n6", "name_ja": "コクヨウ・アシュラジン", "tier": "終盤", "element": "闇", "flavor_ja": "黒曜石の肌をもつ、三つの顔と六つの腕の戦神。冷たい紫の光をその身の奥に灯し、いくさの古い掟を守るために異界からあらわれるという。人のかたちをしていながら、人ならざるものの威をまとっている。", "img": "gacha_n6/obsidian-war-deva-n6.png"}, {"id": "entropy-maw-colossus-n6", "name_ja": "シュウソク・ノ・オオグチ", "tier": "終盤", "element": "無", "flavor_ja": "熱がやがて散り、すべてが冷たく散らばっていくさだめそのものが、獣のかたちをとったもの。その大口に近づいた火は、ぬくもりを奪われ静かに消える。あたたかさが低い方へ流れていくのを、この獣は決して逆らわせない。", "img": "gacha_n6/entropy-maw-colossus-n6.png"}, {"id": "solar-archon-titan-n6", "name_ja": "ニチリン・コウシン・タイタス", "tier": "ラスボス級", "element": "光", "flavor_ja": "太陽そのものをまつる、黄金の巨神。その甲冑のすき間からあふれる光は、見上げる者の影を四方に伸ばす。一つの星が燃えつづけることで、どれほど遠くまで光と熱が届くのか――その答えが、神のかたちで立っている。", "img": "gacha_n6/solar-archon-titan-n6.png"}, {"id": "abyssal-origin-godking-n6", "name_ja": "ゲンカイ・シンノウ・バシレウス", "tier": "ラスボス級", "element": "水", "flavor_ja": "光もとどかぬ海の底、おそろしい水圧の世界に君臨する原初の神王。その肌に走る青い光は、いのちが最初に灯った深みの記憶だという。押しつぶす重さに耐えうる体だけが、この玉座にたどりつける。", "img": "gacha_n6/abyssal-origin-godking-n6.png"}]; const KEY="rika2_boss_swipe_gacha_n6";
let st=JSON.parse(localStorage.getItem(KEY)||"null")||{idx:0,dec:{}};
function save(){localStorage.setItem(KEY,JSON.stringify(st));}
const stage=document.getElementById("stage");
document.getElementById("total_n").textContent=BOSSES.length;
let card=null,startX=0,curX=0,dragging=false;

function counts(){const y=Object.values(st.dec).filter(v=>v==="yes").length;
  document.getElementById("done_n").textContent=Object.keys(st.dec).length;
  document.getElementById("yes_n").textContent=y;}

function build(idx){
  const b=BOSSES[idx]; const el=document.createElement("div"); el.className="card";
  el.innerHTML=`<div class="stamp yes">有り</div><div class="stamp no">無し</div>
    <div class="imgbox"><img src="${b.img}" alt=""></div>
    <div class="info"><div class="nm">${b.name_ja}<span class="tier t${b.tier}">${b.tier}</span></div>
    <div class="el">${b.element}</div><div class="fl">${b.flavor_ja}</div></div>`;
  el.addEventListener("pointerdown",down); el.addEventListener("pointermove",move);
  el.addEventListener("pointerup",up); el.addEventListener("pointercancel",up);
  return el;
}
function show(){
  if(card){card.remove();card=null;}
  if(st.idx>=BOSSES.length){document.getElementById("doneScreen").style.display="flex";finish();return;}
  document.getElementById("doneScreen").style.display="none";
  card=build(st.idx); stage.appendChild(card); counts();
}
function down(e){dragging=true;startX=e.clientX;curX=0;card.setPointerCapture(e.pointerId);card.style.transition="none";}
function move(e){if(!dragging)return;curX=e.clientX-startX;card.style.transform=`translateX(${curX}px) rotate(${curX/18}deg)`;
  card.querySelector(".yes").style.opacity=Math.max(0,Math.min(1,curX/90));
  card.querySelector(".no").style.opacity=Math.max(0,Math.min(1,-curX/90));}
function up(){if(!dragging)return;dragging=false;
  if(curX>90)decide("yes");else if(curX<-90)decide("no");
  else{card.style.transition=".2s";card.style.transform="";card.querySelector(".yes").style.opacity=0;card.querySelector(".no").style.opacity=0;}}
function decide(v){
  st.dec[BOSSES[st.idx].id]=v; save();
  const dir=v==="yes"?1:-1;
  card.style.transition=".3s ease-out";
  card.style.transform=`translateX(${dir*140}vw) rotate(${dir*25}deg)`;
  card.style.opacity="0";
  setTimeout(()=>{st.idx++;save();show();},260);
}
function undo(){if(st.idx<=0)return;st.idx--;delete st.dec[BOSSES[st.idx].id];save();show();}
function summaryText(){
  const yes=BOSSES.filter(b=>st.dec[b.id]==="yes"),no=BOSSES.filter(b=>st.dec[b.id]==="no");
  let s=`=== ボス選別 結果 (有り${yes.length} / 無し${no.length} / 計${BOSSES.length}) ===\n【有り】\n`;
  yes.forEach(b=>s+=`- ${b.name_ja} (${b.tier}/${b.element}) [${b.id}]\n`);
  s+="【無し】\n"; no.forEach(b=>s+=`- ${b.name_ja} (${b.tier}/${b.element}) [${b.id}]\n`);
  return s;
}
function finish(){
  const yes=BOSSES.filter(b=>st.dec[b.id]==="yes").length;
  document.getElementById("summary").textContent=`有り ${yes} 体 / 無し ${BOSSES.length-yes} 体`;
}
function copyOut(){const s=summaryText();const o=document.getElementById("out");o.style.display="block";o.value=s;
  if(navigator.clipboard)navigator.clipboard.writeText(s).then(()=>{const t=document.getElementById("toast");t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1500);},()=>{});o.select();}
document.getElementById("bNo").onclick=()=>{if(st.idx<BOSSES.length)decide("no");};
document.getElementById("bYes").onclick=()=>{if(st.idx<BOSSES.length)decide("yes");};
document.getElementById("bUndo").onclick=undo;
document.getElementById("bCopy").onclick=copyOut;
document.getElementById("copyBtn").onclick=copyOut;
document.getElementById("restartBtn").onclick=()=>{st={idx:0,dec:{}};save();show();};
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"&&st.idx<BOSSES.length)decide("no");
  else if(e.key==="ArrowRight"&&st.idx<BOSSES.length)decide("yes");else if(e.key==="Backspace")undo();});
show();
</script></body></html>
