<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>ボス選別 — 理科RPG2</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0f1014;color:#e7e7ea;font-family:system-ui,"Hiragino Kaku Gothic ProN",sans-serif;overflow:hidden;height:100dvh}
header{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;background:#1a1c22;border-bottom:1px solid #2c2f3a}
header b{color:#ffe27a}.count{font-size:13px;color:#9aa0ad}
.stage{position:relative;height:calc(100dvh - 150px);display:flex;align-items:center;justify-content:center;padding:10px}
.card{position:absolute;width:min(92vw,440px);max-height:100%;background:#1d1f26;border:1px solid #2c2f3a;border-radius:18px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5);touch-action:none}
.imgbox{aspect-ratio:1/1;
  background-image:linear-gradient(45deg,#cfcfcf 25%,transparent 25%),linear-gradient(-45deg,#cfcfcf 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#cfcfcf 75%),linear-gradient(-45deg,transparent 75%,#cfcfcf 75%);
  background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0;background-color:#e9e9e9}
.imgbox img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.info{padding:12px 16px}
.nm{font-size:22px;font-weight:800}
.nm .tier{font-size:14px;font-weight:700;padding:2px 10px;border-radius:999px;margin-left:8px;vertical-align:3px}
.t序盤{background:#2bd47a;color:#06210f}.t中盤{background:#4aa3ff;color:#04203f}.t終盤{background:#ff9a3c;color:#311600}.tラスボス級{background:#ff5a7a;color:#33000d}
.el{font-size:12px;color:#9aa0ad;margin-top:2px}
.fl{font-size:14px;color:#cfd3db;margin-top:8px;line-height:1.55}
.stamp{position:absolute;top:18px;font-size:34px;font-weight:900;padding:4px 14px;border:4px solid;border-radius:12px;opacity:0;transform:rotate(-15deg)}
.yes{left:18px;color:#2bd47a;border-color:#2bd47a}.no{right:18px;color:#ff5a7a;border-color:#ff5a7a}
.bar{position:fixed;bottom:0;left:0;right:0;height:90px;display:flex;align-items:center;justify-content:center;gap:22px;background:#13141a;border-top:1px solid #2c2f3a}
.fab{width:62px;height:62px;border-radius:50%;border:none;font-size:26px;cursor:pointer;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.fab.no{background:#2a1d23;color:#ff5a7a;border:2px solid #ff5a7a}.fab.yes{background:#16271c;color:#2bd47a;border:2px solid #2bd47a}
.fab.undo{width:48px;height:48px;font-size:18px;background:#23242c;color:#cfd3db;border:1px solid #3a3f4c}
.done{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.done h2{color:#ffe27a;margin:0 0 8px}
.btn{margin-top:14px;background:#ffe27a;color:#15161a;border:none;border-radius:10px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
#out{margin-top:12px;width:min(92vw,520px);height:160px;font-family:ui-monospace,monospace;font-size:11px;display:none;background:#0b0c10;color:#cfd3db;border:1px solid #3a3f4c;border-radius:8px;padding:8px}
.hint{font-size:11px;color:#6b7280;margin-top:6px}
.toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%);background:#2bd47a;color:#08210f;padding:8px 16px;border-radius:999px;font-weight:700;opacity:0;transition:.3s;pointer-events:none}.toast.show{opacity:1}
</style></head><body>
<header><div><b>ボス選別</b> <span style="font-size:12px;color:#9aa0ad">← 無し / 有り → ・ドラッグもOK</span></div>
  <div class="count"><span id="done_n">0</span>/<span id="total_n">0</span> ・有り<span id="yes_n">0</span></div></header>
<div class="stage" id="stage">
  <div class="done" id="doneScreen">
    <h2>選別おわり！</h2>
    <div id="summary" style="color:#cfd3db"></div>
    <button class="btn" id="copyBtn">結果をコピー</button>
    <div class="hint">コピーしたテキストをチャットに貼ってください（採用の系統を学習して次の50枚へ）。</div>
    <textarea id="out" readonly></textarea>
    <button class="btn" id="restartBtn" style="background:#3a3f4c;color:#e7e7ea">最初からやり直す</button>
  </div>
</div>
<div class="bar">
  <button class="fab no" id="bNo">✗</button>
  <button class="fab undo" id="bUndo">↶</button>
  <button class="fab yes" id="bYes">♥</button>
  <button class="btn" id="bCopy" style="position:fixed;right:12px;bottom:104px;padding:8px 12px;font-size:12px">途中保存コピー</button>
</div>
<div class="toast" id="toast">コピーしました！</div>
<script>
const BOSSES=[{"id": "cinder-moth-rv3", "name_ja": "ホムラガ", "tier": "序盤", "element": "灰と熱", "flavor_ja": "あたたかい光に集まる、燃える羽の大きな蛾。羽ばたくたびに灰がはらりと舞い、夜空に小さな火花を散らす。", "img": "gacha_rv3_1/cinder-moth-rv3.png"}, {"id": "magma-hatchling-rv3", "name_ja": "ようがんのこりゅう", "tier": "序盤", "element": "溶岩", "flavor_ja": "溶岩だまりの底でかえったばかりの子竜。体のひび割れから赤い光がもれ、鼻からぽふっと煙を吐く姿が愛らしい。", "img": "gacha_rv3_1/magma-hatchling-rv3.png"}, {"id": "blaze-stag-rv3", "name_ja": "エンカジカ", "tier": "中盤", "element": "業火", "flavor_ja": "森を焼く炎の角を戴く気高き牡鹿。駆け抜けた跡には金色の火が残り、その角は夜を昼に変えるという。", "img": "gacha_rv3_1/blaze-stag-rv3.png"}, {"id": "obsidian-golem-rv3", "name_ja": "ヨウガングウ", "tier": "中盤", "element": "火山岩", "flavor_ja": "火山の地割れから立ち上がった岩の巨人。胸の奥でたぎるマグマが核となり、踏み出すたび大地が裂ける。", "img": "gacha_rv3_1/obsidian-golem-rv3.png"}, {"id": "solar-leviathan-rv3", "name_ja": "タイヨウグジラ", "tier": "終盤", "element": "太陽", "flavor_ja": "太陽そのものを身にまとう巨大な海獣。ひれをひと振りすれば炎の津波が空を渡り、その背からは恒星のフレアが噴き上がる。", "img": "gacha_rv3_1/solar-leviathan-rv3.png"}, {"id": "infernal-hydra-rv3", "name_ja": "ゴクエンノオロチ", "tier": "ラスボス級", "element": "獄炎", "flavor_ja": "七つの首それぞれに色の違う獄炎を宿す大蛇。ひとつの首を断っても炎から再び生え、その咆哮は山々を溶かし尽くす。", "img": "gacha_rv3_1/infernal-hydra-rv3.png"}, {"id": "mist-fox-kit-rv3", "name_ja": "キリワラベ", "tier": "序盤", "element": "霧", "flavor_ja": "朝もやの中からひょっこり現れる、霧でできた子ぎつね。さわろうとすると、ふわりとほどけて消えてしまう。", "img": "gacha_rv3_1/mist-fox-kit-rv3.png"}, {"id": "abyss-anglerfish-rv3", "name_ja": "シンカイ・アンコウ", "tier": "中盤", "element": "深海", "flavor_ja": "光ひとつ届かぬ深海に潜む、巨大なアンコウの怪物。頭上に灯る青白い提灯にさそわれた者は、二度と戻らぬという。", "img": "gacha_rv3_1/abyss-anglerfish-rv3.png"}, {"id": "leviathan-eel-rv3", "name_ja": "ウミナリ・リヴァイア", "tier": "終盤", "element": "海・大波", "flavor_ja": "うねる大海原をひと巻きにする、海そのものの化身たる大海蛇。その身が波打つたび、沿岸の町は飲み込まれてゆく。", "img": "gacha_rv3_1/leviathan-eel-rv3.png"}, {"id": "maelstrom-kraken-rv3", "name_ja": "ナラク・クラーケン", "tier": "ラスボス級", "element": "嵐・大渦・深海", "flavor_ja": "海の底のさらに底、奈落の大渦から這い出る災厄の巨怪。無数の触手が空を裂き、嵐と渦をしたがえて、世界をまるごと飲み干さんとする。", "img": "gacha_rv3_1/maelstrom-kraken-rv3.png"}, {"id": "spark-hopper-rv3", "name_ja": "パチパチホタル", "tier": "序盤", "element": "電気", "flavor_ja": "おしりの電球がパチパチと光る、ちいさな電気のホタル。なでようとすると静電気でピリッとくる、いたずら好きの妖精だ。", "img": "gacha_rv3_1/spark-hopper-rv3.png"}, {"id": "thunder-pup-fox-rv3", "name_ja": "カミナリギツネ", "tier": "序盤", "element": "雷", "flavor_ja": "走るたびに足あとがバチッと光る、やんちゃな雷のキツネ。しっぽを振ると小さな稲妻がほとばしる。", "img": "gacha_rv3_1/thunder-pup-fox-rv3.png"}, {"id": "storm-roc-rv3", "name_ja": "ライデン・グリフォン", "tier": "中盤", "element": "雷・空", "flavor_ja": "嵐雲を翼にまとい、爪の先から稲妻を放つ天空の獅子鷲。その羽ばたきは雷鳴となって大地を震わせる。", "img": "gacha_rv3_1/storm-roc-rv3.png"}, {"id": "prism-golem-rv3", "name_ja": "プリズムゴーレム", "tier": "中盤", "element": "光", "flavor_ja": "全身が水晶でできた巨大なゴーレム。胸の核から放たれる光は七色に分かれ、見る者の目をくらませる。", "img": "gacha_rv3_1/prism-golem-rv3.png"}, {"id": "comet-serpent-rv3", "name_ja": "スイセイ・サーペント", "tier": "中盤", "element": "宇宙・星", "flavor_ja": "夜空を切り裂いて飛ぶ、彗星の頭をもつ大蛇。その長い尾は星屑をまき散らし、願いごとをのみこんでしまう。", "img": "gacha_rv3_1/comet-serpent-rv3.png"}, {"id": "void-leviathan-rv3", "name_ja": "アンコク・リヴァイア", "tier": "終盤", "element": "宇宙", "flavor_ja": "その体内には銀河がうずまく、宇宙そのものを泳ぐ巨鯨。口を開ければ星々さえ吸いこまれ、闇へと帰っていく。", "img": "gacha_rv3_1/void-leviathan-rv3.png"}, {"id": "plasma-phoenix-rv3", "name_ja": "プラズマ・フェニクス", "tier": "終盤", "element": "電気・光", "flavor_ja": "電気と光が燃えあがって生まれた不死鳥。その翼は太陽のフレアのごとくゆらめき、灰の代わりに稲妻を残して蘇る。", "img": "gacha_rv3_1/plasma-phoenix-rv3.png"}, {"id": "galaxy-titan-beast-rv3", "name_ja": "テンクウ・ベヒモス", "tier": "ラスボス級", "element": "星・宇宙", "flavor_ja": "星々を体にやどす、山のごとき天空の守護神獣。その六つの瞳が開くとき、空からは無数の流星がふりそそぐ。", "img": "gacha_rv3_1/galaxy-titan-beast-rv3.png"}, {"id": "singularity-wyrm-rv3", "name_ja": "テイオウ・コスモドラゴン", "tier": "ラスボス級", "element": "宇宙・雷", "flavor_ja": "胸にブラックホールを宿し、すべてをのみこむ宇宙の帝竜。その咆哮は時空をゆがめ、稲妻と星々を闇の彼方へ引きずりこむ。", "img": "gacha_rv3_1/singularity-wyrm-rv3.png"}, {"id": "sandhopper-scarab-rv3", "name_ja": "スナホリ・コガネ", "tier": "序盤", "element": "砂", "flavor_ja": "砂をかき分けて進む小さなコガネムシ。陽を浴びると甲羅が黄金にきらめき、後ろに砂の道を残す。", "img": "gacha_rv3_1/sandhopper-scarab-rv3.png"}, {"id": "claygolem-cub-rv3", "name_ja": "ツチコネ・ゴーレム", "tier": "序盤", "element": "粘土", "flavor_ja": "こねた粘土から生まれた、まんまるなゴーレム。体にぺたぺたと指のあとが残っている。叩くとぽよんと弾む。", "img": "gacha_rv3_1/claygolem-cub-rv3.png"}, {"id": "crystal-stag-rv3", "name_ja": "スイショウ・ロクシカ", "tier": "中盤", "element": "結晶", "flavor_ja": "体の透きとおった結晶の鹿。角の宝石が光を屈折させ、森に七色の光をふりまく。胸の核がほのかに輝く。", "img": "gacha_rv3_1/crystal-stag-rv3.png"}, {"id": "void-crystal-leviathan-rv3", "name_ja": "シュウエン・クリスタグランド", "tier": "ラスボス級", "element": "終焉結晶", "flavor_ja": "崩れた黒結晶と腐食した金属が融合した、形なき終焉の巨獣。砕けた破片が重力を歪めて漂い、近づくものすべてを結晶へと変えてしまう。", "img": "gacha_rv3_1/void-crystal-leviathan-rv3.png"}, {"id": "spore-toad-rv3", "name_ja": "ホウシガエル", "tier": "序盤", "element": "胞子", "flavor_ja": "湿った森の奥に住む、ぷくぷくした胞子ガエル。ふくれた背中の袋からきらきらした胞子をまき散らし、近づくと思わずくしゃみが出てしまう。", "img": "gacha_rv3_1/spore-toad-rv3.png"}, {"id": "rot-grub-rv3", "name_ja": "クサレウジムシ", "tier": "序盤", "element": "腐敗", "flavor_ja": "落ち葉の下でうごめく腐敗のうじ虫。なんでも溶かして食べてしまうので、通った跡はどろどろに溶けている。見た目はちょっと気持ち悪いけど臆病。", "img": "gacha_rv3_1/rot-grub-rv3.png"}, {"id": "gloom-bat-swarm-rv3", "name_ja": "ヤミコウモリ", "tier": "序盤", "element": "闇", "flavor_ja": "夜の洞窟をふわふわ漂う、影をまとった小さなコウモリ。暗闇では姿が溶けて見えなくなるが、まんまるの紫の目だけがぽつんと光る。", "img": "gacha_rv3_1/gloom-bat-swarm-rv3.png"}, {"id": "myco-colossus-rv3", "name_ja": "キノコゴーレム", "tier": "中盤", "element": "菌類", "flavor_ja": "倒れた巨木に菌糸が根づき、立ち上がった森の番人。体じゅうに光るキノコが生え、歩くたびに胞子の霧をふりまく。森を守るためなら岩をも砕く。", "img": "gacha_rv3_1/myco-colossus-rv3.png"}, {"id": "abyss-tendril-rv3", "name_ja": "シンエンノショクシュ", "tier": "終盤", "element": "異形", "flavor_ja": "世界の裂け目からあふれ出た、無数の目を持つ深淵の異形。決まった形を持たず、見つめ返してくる眼の群れに正気を奪われる者もいる。", "img": "gacha_rv3_1/abyss-tendril-rv3.png"}, {"id": "plague-hydra-rv3", "name_ja": "エキビョウノドクヘビ", "tier": "終盤", "element": "毒・病", "flavor_ja": "七つの首それぞれが異なる病をまき散らす、疫病の多頭竜。一つ首を倒しても、毒の霧の中から新たな首が生えてくる。近づく大気そのものが澱む。", "img": "gacha_rv3_1/plague-hydra-rv3.png"}, {"id": "decay-leviathan-rv3", "name_ja": "フハイノ・グランド", "tier": "ラスボス級", "element": "腐敗・生命", "flavor_ja": "死と再生が同居する、腐敗の巨獣。その朽ちた体には森が芽吹き、寄生する命がうごめく。倒れることなく腐り続け、腐りながら新たな命を生み出す終わらぬ循環の化身。", "img": "gacha_rv3_1/decay-leviathan-rv3.png"}, {"id": "abyssal-life-tree-rv3", "name_ja": "ヤミノセイメイジュ", "tier": "ラスボス級", "element": "生命・闇", "flavor_ja": "あらゆる生命の源にして、闇に染まりし世界樹。その幹には全ての命の鼓動が脈打ち、枝先からは腐敗と再生の胞子が降り注ぐ。生と死、光と闇、すべてを呑みこむ荘厳なる終焉の樹。", "img": "gacha_rv3_1/abyssal-life-tree-rv3.png"}, {"id": "ember-fox-pup-b2-rv3", "name_ja": "ひのこギツネ", "tier": "序盤", "element": "火", "flavor_ja": "しっぽの先に小さな火がともる子ギツネ。まだ火あそびの加減を知らず、走るたびに足あとがちりちり焦げる。", "img": "gacha_rv3_1/ember-fox-pup-b2-rv3.png"}, {"id": "candle-snail-b2-rv3", "name_ja": "ともしびマイマイ", "tier": "序盤", "element": "火", "flavor_ja": "からの先に小さなろうそくの火をともすカタツムリ。夜道をのんびり歩いて、暗がりをぽっと照らす。", "img": "gacha_rv3_1/candle-snail-b2-rv3.png"}, {"id": "magma-boar-b2-rv3", "name_ja": "マグマイノシシ", "tier": "中盤", "element": "溶岩", "flavor_ja": "体が冷えた溶岩のよろいに包まれた猛イノシシ。突進すると地面が割れ、すきまから赤い光がもれる。", "img": "gacha_rv3_1/magma-boar-b2-rv3.png"}, {"id": "blaze-tiger-b2-rv3", "name_ja": "ほのおトラ", "tier": "中盤", "element": "炎", "flavor_ja": "しまもようが炎のように燃えるトラ。しのび足で近づき、ひと吠えするとあたりの空気がゆらめいて熱くなる。", "img": "gacha_rv3_1/blaze-tiger-b2-rv3.png"}, {"id": "volcano-titan-golem-b2-rv3", "name_ja": "かざんゴーレム", "tier": "ラスボス級", "element": "溶岩", "flavor_ja": "山ほどもある岩でできた巨人ゴーレム。岩のすきまを溶岩の川が流れ、胸には火口のように火が燃えさかる。歩くたび大地がゆれる。", "img": "gacha_rv3_1/volcano-titan-golem-b2-rv3.png"}, {"id": "sun-flame-emperor-dragon-b2-rv3", "name_ja": "えんてい大竜", "tier": "ラスボス級", "element": "炎", "flavor_ja": "深紅と金のうろこをまとい、炎でできたつばさを広げる王の大竜。ひと吠えで空が燃え、その背には太陽のような火の輪が輝く。", "img": "gacha_rv3_1/sun-flame-emperor-dragon-b2-rv3.png"}, {"id": "frost-pufferfish-b2-rv3", "name_ja": "こおりフグ", "tier": "序盤", "element": "氷", "flavor_ja": "ふくらむと体じゅうのトゲが氷柱になる、まんまるで愛嬌のある小型のフグ。怒るとプクッとふくれて冷気をまき散らす。", "img": "gacha_rv3_1/frost-pufferfish-b2-rv3.png"}, {"id": "tidepool-hermit-crab-b2-rv3", "name_ja": "しおだまりヤドカリ", "tier": "序盤", "element": "水", "flavor_ja": "水滴の形をした巻き貝を背負った、ちいさなヤドカリ。潮だまりの水をハサミにためてピュッと飛ばす。", "img": "gacha_rv3_1/tidepool-hermit-crab-b2-rv3.png"}, {"id": "baby-snow-seal-b2-rv3", "name_ja": "ゆきあざらし", "tier": "序盤", "element": "氷", "flavor_ja": "雪のように白くてふわふわの、子どものアザラシ。ヒゲについた霜を飛ばして冷やしてくる、まだ小さなボス。", "img": "gacha_rv3_1/baby-snow-seal-b2-rv3.png"}, {"id": "glacier-stag-elk-b2-rv3", "name_ja": "ひょうがオオジカ", "tier": "中盤", "element": "氷", "flavor_ja": "枝分かれした角がすべて透きとおった氷でできた、堂々たる大鹿。歩くたびに地面が凍りつく中盤の主。", "img": "gacha_rv3_1/glacier-stag-elk-b2-rv3.png"}, {"id": "frostfang-orca-b2-rv3", "name_ja": "こおりばシャチ", "tier": "終盤", "element": "氷", "flavor_ja": "背びれと牙に分厚い氷をまとった、巨大で獰猛なシャチ。氷の海を割って跳びかかる終盤の捕食者。", "img": "gacha_rv3_1/frostfang-orca-b2-rv3.png"}, {"id": "abyss-anglerfish-b2-rv3", "name_ja": "しんかいアンコウ", "tier": "終盤", "element": "水", "flavor_ja": "頭の光るちょうちんで獲物をおびき寄せる、巨大で恐ろしい深海のアンコウ。針のような牙でひと飲みにする。", "img": "gacha_rv3_1/abyss-anglerfish-b2-rv3.png"}, {"id": "breeze-foxtail-b2-rv3", "name_ja": "かぜきりキツネ", "tier": "序盤", "element": "風", "flavor_ja": "草原を疾風のように駆ける子ぎつね。通り過ぎたあとに小さなつむじ風を残す。", "img": "gacha_rv3_1/breeze-foxtail-b2-rv3.png"}, {"id": "puff-pigeon-drake-b2-rv3", "name_ja": "つむじポポロ", "tier": "序盤", "element": "風", "flavor_ja": "まんまるでかわいい風の小鳥。羽ばたくと足元から小さなつむじ風が立つ、はじめての風ボス。", "img": "gacha_rv3_1/puff-pigeon-drake-b2-rv3.png"}, {"id": "cyclone-stag-b2-rv3", "name_ja": "かまいたちオオシカ", "tier": "中盤", "element": "風", "flavor_ja": "風を切り裂く角を持つ大鹿。駆け抜けるとあたりに見えない刃の突風が舞う。", "img": "gacha_rv3_1/cyclone-stag-b2-rv3.png"}, {"id": "clockwork-mole-b2-rv3", "name_ja": "ねじまきモグラ", "tier": "序盤", "element": "機械", "flavor_ja": "背中のねじを巻くと土を掘り進む、ずんぐりした真鍮のからくりモグラ。", "img": "gacha_rv3_1/clockwork-mole-b2-rv3.png"}, {"id": "iron-rhino-beetle-b2-rv3", "name_ja": "鋼角カブトムシ", "tier": "中盤", "element": "金", "flavor_ja": "鉄骨のような一本角を持つ重装甲のカブトムシ。継ぎ目には赤錆がにじむ。", "img": "gacha_rv3_1/iron-rhino-beetle-b2-rv3.png"}, {"id": "magma-golem-b2-rv3", "name_ja": "溶岩岩塊ゴーレム", "tier": "中盤", "element": "地", "flavor_ja": "黒い溶岩石を積み上げた四つ足のゴーレム。岩の隙間からマグマが脈打つ。", "img": "gacha_rv3_1/magma-golem-b2-rv3.png"}, {"id": "scorpion-stinger-b2-rv3", "name_ja": "ドクサソリ", "tier": "序盤", "element": "毒", "flavor_ja": "しっぽの先に緑色の毒をためたサソリ。小さいが油断は禁物。", "img": "gacha_rv3_1/scorpion-stinger-b2-rv3.png"}]; const KEY="rika2_boss_swipe_gacha_rv3_1";
let st=JSON.parse(localStorage.getItem(KEY)||"null")||{idx:0,dec:{}};
function save(){localStorage.setItem(KEY,JSON.stringify(st));}
const stage=document.getElementById("stage");
document.getElementById("total_n").textContent=BOSSES.length;
let card=null,startX=0,curX=0,dragging=false;

function counts(){const y=Object.values(st.dec).filter(v=>v==="yes").length;
  document.getElementById("done_n").textContent=Object.keys(st.dec).length;
  document.getElementById("yes_n").textContent=y;}

function build(idx){
  const b=BOSSES[idx]; const el=document.createElement("div"); el.className="card";
  el.innerHTML=`<div class="stamp yes">有り</div><div class="stamp no">無し</div>
    <div class="imgbox"><img src="${b.img}" alt=""></div>
    <div class="info"><div class="nm">${b.name_ja}<span class="tier t${b.tier}">${b.tier}</span></div>
    <div class="el">${b.element}</div><div class="fl">${b.flavor_ja}</div></div>`;
  el.addEventListener("pointerdown",down); el.addEventListener("pointermove",move);
  el.addEventListener("pointerup",up); el.addEventListener("pointercancel",up);
  return el;
}
function show(){
  if(card){card.remove();card=null;}
  if(st.idx>=BOSSES.length){document.getElementById("doneScreen").style.display="flex";finish();return;}
  document.getElementById("doneScreen").style.display="none";
  card=build(st.idx); stage.appendChild(card); counts();
}
function down(e){dragging=true;startX=e.clientX;curX=0;card.setPointerCapture(e.pointerId);card.style.transition="none";}
function move(e){if(!dragging)return;curX=e.clientX-startX;card.style.transform=`translateX(${curX}px) rotate(${curX/18}deg)`;
  card.querySelector(".yes").style.opacity=Math.max(0,Math.min(1,curX/90));
  card.querySelector(".no").style.opacity=Math.max(0,Math.min(1,-curX/90));}
function up(){if(!dragging)return;dragging=false;
  if(curX>90)decide("yes");else if(curX<-90)decide("no");
  else{card.style.transition=".2s";card.style.transform="";card.querySelector(".yes").style.opacity=0;card.querySelector(".no").style.opacity=0;}}
function decide(v){
  st.dec[BOSSES[st.idx].id]=v; save();
  const dir=v==="yes"?1:-1;
  card.style.transition=".3s ease-out";
  card.style.transform=`translateX(${dir*140}vw) rotate(${dir*25}deg)`;
  card.style.opacity="0";
  setTimeout(()=>{st.idx++;save();show();},260);
}
function undo(){if(st.idx<=0)return;st.idx--;delete st.dec[BOSSES[st.idx].id];save();show();}
function summaryText(){
  const yes=BOSSES.filter(b=>st.dec[b.id]==="yes"),no=BOSSES.filter(b=>st.dec[b.id]==="no");
  let s=`=== ボス選別 結果 (有り${yes.length} / 無し${no.length} / 計${BOSSES.length}) ===\n【有り】\n`;
  yes.forEach(b=>s+=`- ${b.name_ja} (${b.tier}/${b.element}) [${b.id}]\n`);
  s+="【無し】\n"; no.forEach(b=>s+=`- ${b.name_ja} (${b.tier}/${b.element}) [${b.id}]\n`);
  return s;
}
function finish(){
  const yes=BOSSES.filter(b=>st.dec[b.id]==="yes").length;
  document.getElementById("summary").textContent=`有り ${yes} 体 / 無し ${BOSSES.length-yes} 体`;
}
function copyOut(){const s=summaryText();const o=document.getElementById("out");o.style.display="block";o.value=s;
  if(navigator.clipboard)navigator.clipboard.writeText(s).then(()=>{const t=document.getElementById("toast");t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1500);},()=>{});o.select();}
document.getElementById("bNo").onclick=()=>{if(st.idx<BOSSES.length)decide("no");};
document.getElementById("bYes").onclick=()=>{if(st.idx<BOSSES.length)decide("yes");};
document.getElementById("bUndo").onclick=undo;
document.getElementById("bCopy").onclick=copyOut;
document.getElementById("copyBtn").onclick=copyOut;
document.getElementById("restartBtn").onclick=()=>{st={idx:0,dec:{}};save();show();};
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"&&st.idx<BOSSES.length)decide("no");
  else if(e.key==="ArrowRight"&&st.idx<BOSSES.length)decide("yes");else if(e.key==="Backspace")undo();});
show();
</script></body></html>
