<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>ボス選別 — 理科RPG2</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0f1014;color:#e7e7ea;font-family:system-ui,"Hiragino Kaku Gothic ProN",sans-serif;overflow:hidden;height:100dvh}
header{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;background:#1a1c22;border-bottom:1px solid #2c2f3a}
header b{color:#ffe27a}.count{font-size:13px;color:#9aa0ad}
.stage{position:relative;height:calc(100dvh - 150px);display:flex;align-items:center;justify-content:center;padding:10px}
.card{position:absolute;width:min(92vw,440px);max-height:100%;background:#1d1f26;border:1px solid #2c2f3a;border-radius:18px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5);touch-action:none}
.imgbox{aspect-ratio:1/1;
  background-image:linear-gradient(45deg,#cfcfcf 25%,transparent 25%),linear-gradient(-45deg,#cfcfcf 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#cfcfcf 75%),linear-gradient(-45deg,transparent 75%,#cfcfcf 75%);
  background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0;background-color:#e9e9e9}
.imgbox img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.info{padding:12px 16px}
.nm{font-size:22px;font-weight:800}
.nm .tier{font-size:14px;font-weight:700;padding:2px 10px;border-radius:999px;margin-left:8px;vertical-align:3px}
.t序盤{background:#2bd47a;color:#06210f}.t中盤{background:#4aa3ff;color:#04203f}.t終盤{background:#ff9a3c;color:#311600}.tラスボス級{background:#ff5a7a;color:#33000d}
.el{font-size:12px;color:#9aa0ad;margin-top:2px}
.fl{font-size:14px;color:#cfd3db;margin-top:8px;line-height:1.55}
.stamp{position:absolute;top:18px;font-size:34px;font-weight:900;padding:4px 14px;border:4px solid;border-radius:12px;opacity:0;transform:rotate(-15deg)}
.yes{left:18px;color:#2bd47a;border-color:#2bd47a}.no{right:18px;color:#ff5a7a;border-color:#ff5a7a}
.bar{position:fixed;bottom:0;left:0;right:0;height:90px;display:flex;align-items:center;justify-content:center;gap:22px;background:#13141a;border-top:1px solid #2c2f3a}
.fab{width:62px;height:62px;border-radius:50%;border:none;font-size:26px;cursor:pointer;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.fab.no{background:#2a1d23;color:#ff5a7a;border:2px solid #ff5a7a}.fab.yes{background:#16271c;color:#2bd47a;border:2px solid #2bd47a}
.fab.undo{width:48px;height:48px;font-size:18px;background:#23242c;color:#cfd3db;border:1px solid #3a3f4c}
.done{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.done h2{color:#ffe27a;margin:0 0 8px}
.btn{margin-top:14px;background:#ffe27a;color:#15161a;border:none;border-radius:10px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
#out{margin-top:12px;width:min(92vw,520px);height:160px;font-family:ui-monospace,monospace;font-size:11px;display:none;background:#0b0c10;color:#cfd3db;border:1px solid #3a3f4c;border-radius:8px;padding:8px}
.hint{font-size:11px;color:#6b7280;margin-top:6px}
.toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%);background:#2bd47a;color:#08210f;padding:8px 16px;border-radius:999px;font-weight:700;opacity:0;transition:.3s;pointer-events:none}.toast.show{opacity:1}
</style></head><body>
<header><div><b>ボス選別</b> <span style="font-size:12px;color:#9aa0ad">← 無し / 有り → ・ドラッグもOK</span></div>
  <div class="count"><span id="done_n">0</span>/<span id="total_n">0</span> ・有り<span id="yes_n">0</span></div></header>
<div class="stage" id="stage">
  <div class="done" id="doneScreen">
    <h2>選別おわり！</h2>
    <div id="summary" style="color:#cfd3db"></div>
    <button class="btn" id="copyBtn">結果をコピー</button>
    <div class="hint">コピーしたテキストをチャットに貼ってください（採用の系統を学習して次の50枚へ）。</div>
    <textarea id="out" readonly></textarea>
    <button class="btn" id="restartBtn" style="background:#3a3f4c;color:#e7e7ea">最初からやり直す</button>
  </div>
</div>
<div class="bar">
  <button class="fab no" id="bNo">✗</button>
  <button class="fab undo" id="bUndo">↶</button>
  <button class="fab yes" id="bYes">♥</button>
  <button class="btn" id="bCopy" style="position:fixed;right:12px;bottom:104px;padding:8px 12px;font-size:12px">途中保存コピー</button>
</div>
<div class="toast" id="toast">コピーしました！</div>
<script>
const BOSSES=[{"id": "spark-fang-beetle-b6", "name_ja": "スパークファング", "tier": "序盤", "element": "電気", "flavor_ja": "二本の大あごの間で青白い火花を散らす甲虫型の機械獣。触れたものに静電気の刃を放つ、入門者の前に立ちはだかる最初の電撃獣。", "img": "gacha6/spark-fang-beetle-b6.png"}, {"id": "rust-acid-crawler-b6", "name_ja": "アシッドクローラー", "tier": "序盤", "element": "酸", "flavor_ja": "腐食した金属の殻から強酸をしたたらせる這行獣。通った跡は溶け、鎧すら穴だらけにする。序盤を阻む溶解の魔獣。", "img": "gacha6/rust-acid-crawler-b6.png"}, {"id": "gear-shell-tortoise-b6", "name_ja": "ギアシェルガード", "tier": "序盤", "element": "歯車", "flavor_ja": "回転する真鍮の歯車で甲羅を組んだ時計仕掛けの守り獣。噛み合う無数のギアが鎧となり、生半可な攻撃を弾き返す。", "img": "gacha6/gear-shell-tortoise-b6.png"}, {"id": "magnet-lord-manta-b6", "name_ja": "マグネリオン", "tier": "中盤", "element": "磁力", "flavor_ja": "黒い磁鉄鉱の体に無数の鉄片を従えて宙を舞う磁力の覇獣。引き寄せた金属を鎧とし、弾を吸い、剣を奪う。中盤の難敵。", "img": "gacha6/magnet-lord-manta-b6.png"}, {"id": "crystal-prism-dragon-b6", "name_ja": "プリズムドラゴン", "tier": "中盤", "element": "結晶・光学", "flavor_ja": "全身が多面体の宝石で結晶化した光の幻竜。鱗が光を分け、虹色の屈折ビームを放つ。美しくも鋭い中盤の魔竜。", "img": "gacha6/crystal-prism-dragon-b6.png"}, {"id": "flame-forge-lion-b6", "name_ja": "イグニスフォージ", "tier": "中盤", "element": "燃焼", "flavor_ja": "鋳鉄の体内で炎を燃やし続ける溶鉱炉の獅子。たてがみは噴き上がる火炎、あぎとからは白熱した溶岩がしたたる。燃焼の猛獣。", "img": "gacha6/flame-forge-lion-b6.png"}, {"id": "gravity-void-leviathan-b6", "name_ja": "グラヴィオス", "tier": "終盤", "element": "重力", "flavor_ja": "体に小さな重力の核をいくつも宿し、岩も金属も光さえねじ曲げて吸い込む超巨大幻獣。間合いそのものを支配する終盤の脅威。", "img": "gacha6/gravity-void-leviathan-b6.png"}, {"id": "thunder-circuit-hydra-b6", "name_ja": "サーキュラ・ヒュドラ", "tier": "終盤", "element": "電磁・回路", "flavor_ja": "高圧ケーブルの首をうねらせ、回路の頭から頭へ稲妻を連鎖させる多頭の機械竜。一つ斬っても電流が回り込む、終盤の電磁の魔竜。", "img": "gacha6/thunder-circuit-hydra-b6.png"}, {"id": "titan-alloy-colossus-b6", "name_ja": "アロイ・タイタン", "tier": "ラスボス級", "element": "合金・圧力", "flavor_ja": "幾層もの超合金を鍛え合わせて立つ巨神級の構造体。油圧の腕で万物を圧し潰し、胸の炉心が赤熱する。物理と化学の極み、ラスボス格。", "img": "gacha6/titan-alloy-colossus-b6.png"}, {"id": "resonance-omega-serpent-b6", "name_ja": "オメガ・レゾナンス", "tier": "ラスボス級", "element": "音響・光学・触媒", "flavor_ja": "音と光と触媒を一身に束ねた鬼神の蛇竜。鳴り響く刃で衝撃波を放ち、レンズで光を集め、触媒の紋で反応を爆発させる。すべての終わりに君臨する最終決戦の神獣。", "img": "gacha6/resonance-omega-serpent-b6.png"}, {"id": "ember-fang-lizard-b6", "name_ja": "ほむらキバトカゲ", "tier": "序盤", "element": "炎", "flavor_ja": "体の割れ目からマグマがにじむ火トカゲ。背びれの炎口から熱気を噴き、キバはいつも赤く灼けている。燃焼の熱を宿した序盤の魔獣。", "img": "gacha6/ember-fang-lizard-b6.png"}, {"id": "gale-horn-tusker-b6", "name_ja": "かぜホーン・ウォーボア", "tier": "序盤", "element": "風", "flavor_ja": "らせんの角で風を切り裂く突進獣。走ると渦が巻き起こり、ぶつかる前に風圧で吹き飛ばす。風の力を体当たりに変える序盤の暴れ者。", "img": "gacha6/gale-horn-tusker-b6.png"}, {"id": "sprout-maw-chimera-b6", "name_ja": "わかばマウ・キメラ", "tier": "序盤", "element": "草", "flavor_ja": "獅子の体に生きたツルと葉を生やした植物キメラ。たてがみの葉で光を浴び、いばらのキバでかみつく。光合成する緑の合成獣。", "img": "gacha6/sprout-maw-chimera-b6.png"}, {"id": "tide-coil-serpent-b6", "name_ja": "うずしお・サーペント", "tier": "中盤", "element": "水", "flavor_ja": "とぐろを巻くたびに渦潮を生む大海蛇。半透明の体で水流を操り、巻き込んで沈める。水の流れを支配する中盤のワーム。", "img": "gacha6/tide-coil-serpent-b6.png"}, {"id": "voltaic-gear-drake-b6", "name_ja": "ボルテージ・ギアドレイク", "tier": "中盤", "element": "雷", "flavor_ja": "歯車と銅コイルで組まれた機械竜。背中のコイルから青い放電が走り、回路の心臓部が脈打つように光る。電磁と歯車を宿した中盤のメカ竜。", "img": "gacha6/voltaic-gear-drake-b6.png"}, {"id": "acid-shell-ogre-b6", "name_ja": "ゆうかいオーガ", "tier": "中盤", "element": "毒", "flavor_ja": "腐食した甲殻をまとう大鬼。割れ目から緑の酸がしたたり、触れたものを溶かす。腹の中で酸が泡立つ毒の鬼。中盤の壁役。", "img": "gacha6/acid-shell-ogre-b6.png"}, {"id": "crystal-hydra-prism-b6", "name_ja": "プリズム・クリスタヒドラ", "tier": "終盤", "element": "光", "flavor_ja": "七つの首がすべて水晶でできた多頭竜。うろこが光を虹に分け、口から屈折した光線を放つ。結晶と光学を宿した終盤の幻竜。", "img": "gacha6/crystal-hydra-prism-b6.png"}, {"id": "frost-titan-saur-b6", "name_ja": "ひょうが・タイタンザウルス", "tier": "終盤", "element": "氷", "flavor_ja": "氷河の鎧をまとう巨大暴竜。背に氷の結晶の山脈をそびやかし、吐く息で地を凍らせる。氷点下の威圧を放つ終盤の巨竜。", "img": "gacha6/frost-titan-saur-b6.png"}, {"id": "magnetar-lion-core-b6", "name_ja": "マグネター・コアレオ", "tier": "ラスボス級", "element": "磁力", "flavor_ja": "鉄でできた巨大獅子王。磁力で金属片を引き寄せ、たてがみのように体のまわりを巡らせる。胸の磁芯が赤熱する、磁力を統べるラスボス級の獣王。", "img": "gacha6/magnetar-lion-core-b6.png"}, {"id": "supernova-wyrm-omega-b6", "name_ja": "オメガ・スーパーノヴァワーム", "tier": "ラスボス級", "element": "無", "flavor_ja": "宇宙の果てから来た終焉の超巨大ワーム。体節の隙間で星が崩れ、超新星の光があふれ出す。重力で空間をゆがめる、すべての元素を呑む真の最終ラスボス。", "img": "gacha6/supernova-wyrm-omega-b6.png"}, {"id": "carapace-pillbug-fortress-b6", "name_ja": "鋼殻のダンゴロード", "tier": "序盤", "element": "地", "flavor_ja": "幾重もの鋼板で身を固めた大ダンゴムシ。丸まれば鉄球と化し、どんな一撃もはじき返す。守りに入った姿は小さな要塞そのもの。", "img": "gacha6/carapace-pillbug-fortress-b6.png"}, {"id": "crystal-stag-beetle-b6", "name_ja": "晶角のクワガノヴァ", "tier": "序盤", "element": "地", "flavor_ja": "鉱物の結晶を鎧にまとった巨大クワガタ。水晶の大顎で岩をも断ち割る。日の光を浴びると全身がきらめき、宝石のように輝く。", "img": "gacha6/crystal-stag-beetle-b6.png"}, {"id": "acid-scorpion-b6", "name_ja": "溶解のアシッドスコルプ", "tier": "序盤", "element": "水", "flavor_ja": "強酸を滴らせる装甲サソリ。尾の毒嚢から噴く液は鋼さえ溶かす。触れたものを残らず溶解する、近づくな危険の魔物。", "img": "gacha6/acid-scorpion-b6.png"}, {"id": "magnet-hercules-beetle-b6", "name_ja": "磁極のヘラクレオン", "tier": "中盤", "element": "雷", "flavor_ja": "磁力をまとう鋼鉄のヘラクレスオオカブト。N極とS極の大角の間で青い火花が踊る。砂鉄や金属を引き寄せ、鎧のように身にまとう。", "img": "gacha6/magnet-hercules-beetle-b6.png"}, {"id": "gear-mantis-b6", "name_ja": "歯車のギアマンティス", "tier": "中盤", "element": "無", "flavor_ja": "全身が歯車仕掛けの機械カマキリ。回転する鋸刃の前脚で何でも切り刻む。体内では無数の歯車が休みなく噛み合い、時を刻むように動く。", "img": "gacha6/gear-mantis-b6.png"}, {"id": "alloy-chimera-beast-b6", "name_ja": "合金のキメロイド", "tier": "中盤", "element": "無", "flavor_ja": "幾種もの金属を溶かし合わせて造られた合成獣。獅子の胴、サソリの尾、昆虫の腕——ちぐはぐな鎧の隙間から溶けた合金が漏れ出す。", "img": "gacha6/alloy-chimera-beast-b6.png"}, {"id": "combustion-rhino-beetle-b6", "name_ja": "業火のフレイムソリス", "tier": "終盤", "element": "火", "flavor_ja": "背の炉から猛火を噴く、鎧と化した巨甲虫の合成獣。突進の角は炎をまとい、踏み出すたびに火の粉を散らす。鋼を赤熱させる焼き付くような熱気の魔獣。", "img": "gacha6/combustion-rhino-beetle-b6.png"}, {"id": "catalyst-trilobite-b6", "name_ja": "触媒のカタリス・ロード", "tier": "終盤", "element": "光", "flavor_ja": "プラチナの甲羅を持つ巨大な古生代の魔獣。体の下では化学反応が渦巻き、ふれるだけで万物の変化を加速させる。自らは変わらず、世界だけを変えていく触媒の主。", "img": "gacha6/catalyst-trilobite-b6.png"}, {"id": "geode-titan-colossus-b6", "name_ja": "晶洞のクリスタロス", "tier": "ラスボス級", "element": "地", "flavor_ja": "全身が結晶と鉱物の鎧でできた、歩く山のような巨獣。胸に抱いた晶洞からは無数の宝石が育ち続け、まばゆい光を放つ。砕いても砕いても結晶は再び伸びる、不滅の鉱物要塞。", "img": "gacha6/geode-titan-colossus-b6.png"}, {"id": "omega-armament-leviathan-b6", "name_ja": "甲鉄のオメガリヴァイア", "tier": "ラスボス級", "element": "闇", "flavor_ja": "昆虫・獣・兵器のすべてを鋼鉄で繋ぎ合わせた、究極の装甲合成竜。幾つもの甲虫の頭が鎌首をもたげ、鎧の隙間からは紅蓮の力が脈打つ。胸の炉心が燃える限り、この甲鉄の魔竜は決して倒れない。", "img": "gacha6/omega-armament-leviathan-b6.png"}, {"id": "korogari-doseki-chibi-b6", "name_ja": "コロコロどせき", "tier": "序盤", "element": "地学", "flavor_ja": "ころころ転がる小さな石のあかちゃん。たたくとカチン、と音がする。", "img": "gacha6/korogari-doseki-chibi-b6.png"}, {"id": "fukufuku-suiteki-chibi-b6", "name_ja": "フクフクすいてき", "tier": "序盤", "element": "化学", "flavor_ja": "ぷよぷよ揺れる水のしずく。さわるとひんやり、つるん。", "img": "gacha6/fukufuku-suiteki-chibi-b6.png"}, {"id": "kasaobake-tubono-yokai-b6", "name_ja": "からかさ坪婆", "tier": "序盤", "element": "物理", "flavor_ja": "百年たった古傘に魂が宿った妖怪。雨の夜、片足でぴょんと跳ねる。", "img": "gacha6/kasaobake-tubono-yokai-b6.png"}, {"id": "raijinmushi-kaminari-yokai-b6", "name_ja": "雷神むし", "tier": "中盤", "element": "物理", "flavor_ja": "腰の太鼓を打ち鳴らすたび、空に稲妻が走る。古えの雷の妖。", "img": "gacha6/raijinmushi-kaminari-yokai-b6.png"}, {"id": "nano-kessho-mecha-b6", "name_ja": "ナノ＝クリスタ", "tier": "中盤", "element": "化学", "flavor_ja": "無数のナノマシンが結晶のように組み上がった機械獣。分子を組み替えて姿を変える。", "img": "gacha6/nano-kessho-mecha-b6.png"}, {"id": "kido-saibou-mecha-b6", "name_ja": "サイバ細胞ドローン", "tier": "中盤", "element": "生物", "flavor_ja": "細胞のしくみを機械でまねた偵察ドローン。核の炉が脈打つように光る。", "img": "gacha6/kido-saibou-mecha-b6.png"}, {"id": "fuhai-kinrui-grotesque-b6", "name_ja": "腐肺キノコ憑き", "tier": "終盤", "element": "生物", "flavor_ja": "あらゆる物を分解しながら殖えていく菌の化け物。近づくと胞子の霧でむせる。", "img": "gacha6/fuhai-kinrui-grotesque-b6.png"}, {"id": "yotai-yugou-grotesque-b6", "name_ja": "溶融ガラクタ獣", "tier": "終盤", "element": "化学", "flavor_ja": "溶け合った金属と肉がひとつの怪物になった。触れたものを溶かして取り込む。", "img": "gacha6/yotai-yugou-grotesque-b6.png"}, {"id": "seiryu-tenkou-reijuu-b6", "name_ja": "天蒼霊龍", "tier": "ラスボス級", "element": "地学", "flavor_ja": "天の気をあやつる気高い龍。その身をくねらせるたび、空に虹と雲が生まれる。", "img": "gacha6/seiryu-tenkou-reijuu-b6.png"}, {"id": "kourin-houou-reijuu-b6", "name_ja": "煌燐ほうおう", "tier": "ラスボス級", "element": "物理", "flavor_ja": "羽ばたくたび光を七色に分ける神々しい鳥。その輝きは闇を払うという。", "img": "gacha6/kourin-houou-reijuu-b6.png"}, {"id": "tardigrade-pilgrim-b6", "name_ja": "クマムシの巡礼者", "tier": "序盤", "element": "生物", "flavor_ja": "氷の中でも宇宙でも眠って生き延びる、ちいさな旅びと。ぷにぷにの八本足でのそのそ歩く。", "img": "gacha6/tardigrade-pilgrim-b6.png"}, {"id": "geode-hatchling-b6", "name_ja": "ジオードのこども", "tier": "序盤", "element": "地学", "flavor_ja": "ただの石ころに見えて、わると中はキラキラの結晶。割られるのがちょっとこわい。", "img": "gacha6/geode-hatchling-b6.png"}, {"id": "spore-cap-trio-b6", "name_ja": "ほうしのキノコ三兄弟", "tier": "序盤", "element": "生物", "flavor_ja": "じめじめした森の床から、なかよく三つならんで生えてきた。ポフッと胞子をふく。", "img": "gacha6/spore-cap-trio-b6.png"}, {"id": "echo-leviathan-b6", "name_ja": "やまびこの大鯨", "tier": "中盤", "element": "物理", "flavor_ja": "声をあげると海ぜんたいがふるえる。すがたは音そのもの、波となって泳ぐ。", "img": "gacha6/echo-leviathan-b6.png"}, {"id": "synapse-colony-b6", "name_ja": "シナプスの群体", "tier": "中盤", "element": "生物", "flavor_ja": "数えきれない細胞が手をつなぎ、ひとつの考えを生む。ピリッと光が走る。", "img": "gacha6/synapse-colony-b6.png"}, {"id": "catalyst-djinn-b6", "name_ja": "ふれて変える反応霊", "tier": "中盤", "element": "化学", "flavor_ja": "ふれたものをみるみる別の色・別のものに変えてしまう。あわ立ちながら笑う。", "img": "gacha6/catalyst-djinn-b6.png"}, {"id": "barycenter-twins-b6", "name_ja": "重力の双つ星", "tier": "終盤", "element": "地学", "flavor_ja": "ふたつの星が、たがいに引き合いながらぐるぐる回り続ける。間に光の橋がかかる。", "img": "gacha6/barycenter-twins-b6.png"}, {"id": "aurora-serpent-b6", "name_ja": "オーロラの蛇神", "tier": "終盤", "element": "物理", "flavor_ja": "夜空にゆらめく光のカーテンが、するりと蛇となって舞いおりる。さわると静電気がパチッ。", "img": "gacha6/aurora-serpent-b6.png"}, {"id": "mycorrhiza-warden-b6", "name_ja": "共生の森番", "tier": "ラスボス級", "element": "生物", "flavor_ja": "木と菌が地中で手をつなぎ、栄養をわかち合う。森ぜんたいが一体となった、いのちの守り神。", "img": "gacha6/mycorrhiza-warden-b6.png"}, {"id": "ouroboros-cell-b6", "name_ja": "始まりを喰らう環", "tier": "ラスボス級", "element": "無", "flavor_ja": "おのれの尾を喰らい、終わりが始まりへとつながる輪。その身は数えきれぬ細胞でできている。生命そのものの神話。", "img": "gacha6/ouroboros-cell-b6.png"}]; const KEY="rika2_boss_swipe_v1";
let st=JSON.parse(localStorage.getItem(KEY)||"null")||{idx:0,dec:{}};
function save(){localStorage.setItem(KEY,JSON.stringify(st));}
const stage=document.getElementById("stage");
document.getElementById("total_n").textContent=BOSSES.length;
let card=null,startX=0,curX=0,dragging=false;

function counts(){const y=Object.values(st.dec).filter(v=>v==="yes").length;
  document.getElementById("done_n").textContent=Object.keys(st.dec).length;
  document.getElementById("yes_n").textContent=y;}

function build(idx){
  const b=BOSSES[idx]; const el=document.createElement("div"); el.className="card";
  el.innerHTML=`<div class="stamp yes">有り</div><div class="stamp no">無し</div>
    <div class="imgbox"><img src="${b.img}" alt=""></div>
    <div class="info"><div class="nm">${b.name_ja}<span class="tier t${b.tier}">${b.tier}</span></div>
    <div class="el">${b.element}</div><div class="fl">${b.flavor_ja}</div></div>`;
  el.addEventListener("pointerdown",down); el.addEventListener("pointermove",move);
  el.addEventListener("pointerup",up); el.addEventListener("pointercancel",up);
  return el;
}
function show(){
  if(card){card.remove();card=null;}
  if(st.idx>=BOSSES.length){document.getElementById("doneScreen").style.display="flex";finish();return;}
  document.getElementById("doneScreen").style.display="none";
  card=build(st.idx); stage.appendChild(card); counts();
}
function down(e){dragging=true;startX=e.clientX;curX=0;card.setPointerCapture(e.pointerId);card.style.transition="none";}
function move(e){if(!dragging)return;curX=e.clientX-startX;card.style.transform=`translateX(${curX}px) rotate(${curX/18}deg)`;
  card.querySelector(".yes").style.opacity=Math.max(0,Math.min(1,curX/90));
  card.querySelector(".no").style.opacity=Math.max(0,Math.min(1,-curX/90));}
function up(){if(!dragging)return;dragging=false;
  if(curX>90)decide("yes");else if(curX<-90)decide("no");
  else{card.style.transition=".2s";card.style.transform="";card.querySelector(".yes").style.opacity=0;card.querySelector(".no").style.opacity=0;}}
function decide(v){
  st.dec[BOSSES[st.idx].id]=v; save();
  const dir=v==="yes"?1:-1;
  card.style.transition=".3s ease-out";
  card.style.transform=`translateX(${dir*140}vw) rotate(${dir*25}deg)`;
  card.style.opacity="0";
  setTimeout(()=>{st.idx++;save();show();},260);
}
function undo(){if(st.idx<=0)return;st.idx--;delete st.dec[BOSSES[st.idx].id];save();show();}
function summaryText(){
  const yes=BOSSES.filter(b=>st.dec[b.id]==="yes"),no=BOSSES.filter(b=>st.dec[b.id]==="no");
  let s=`=== ボス選別 結果 (有り${yes.length} / 無し${no.length} / 計${BOSSES.length}) ===\n【有り】\n`;
  yes.forEach(b=>s+=`- ${b.name_ja} (${b.tier}/${b.element}) [${b.id}]\n`);
  s+="【無し】\n"; no.forEach(b=>s+=`- ${b.name_ja} (${b.tier}/${b.element}) [${b.id}]\n`);
  return s;
}
function finish(){
  const yes=BOSSES.filter(b=>st.dec[b.id]==="yes").length;
  document.getElementById("summary").textContent=`有り ${yes} 体 / 無し ${BOSSES.length-yes} 体`;
}
function copyOut(){const s=summaryText();const o=document.getElementById("out");o.style.display="block";o.value=s;
  if(navigator.clipboard)navigator.clipboard.writeText(s).then(()=>{const t=document.getElementById("toast");t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1500);},()=>{});o.select();}
document.getElementById("bNo").onclick=()=>{if(st.idx<BOSSES.length)decide("no");};
document.getElementById("bYes").onclick=()=>{if(st.idx<BOSSES.length)decide("yes");};
document.getElementById("bUndo").onclick=undo;
document.getElementById("bCopy").onclick=copyOut;
document.getElementById("copyBtn").onclick=copyOut;
document.getElementById("restartBtn").onclick=()=>{st={idx:0,dec:{}};save();show();};
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"&&st.idx<BOSSES.length)decide("no");
  else if(e.key==="ArrowRight"&&st.idx<BOSSES.length)decide("yes");else if(e.key==="Backspace")undo();});
show();
</script></body></html>
