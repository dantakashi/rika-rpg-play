mochi-c5", "name": "✨️もちくじら", "img": "tentative/foam-whale-mochi-c5.png"}], [{"id": "honoware-ember-wisp-c5", "name": "✨️ホノワレ", "img": "tentative/honoware-ember-wisp-c5.png"}, {"id": "pikara-spark-fairy-c5", "name": "✨️ピカラ", "img": "tentative/pikara-spark-fairy-c5.png"}, {"id": "awawa-foam-sprite-c5", "name": "✨️アワワ", "img": "tentative/awawa-foam-sprite-c5.png"}, {"id": "yukimaru-frost-sprite-c5", "name": "✨️ユキマル", "img": "tentative/yukimaru-frost-sprite-c5.png"}, {"id": "niji-aurora-fae-c5", "name": "✨️ニジカ", "img": "tentative/niji-aurora-fae-c5.png"}, {"id": "blaze-newt-puff-c5", "name": "✨️ぽかぽかサラマン", "img": "tentative/blaze-newt-puff-c5.png"}, {"id": "puchi-volt-bunny-c6", "name": "✨️ピカうさ", "img": "tentative/puchi-volt-bunny-c6.png"}, {"id": "spark-tadpole-cell-c6", "name": "✨️ピリオタマ", "img": "tentative/spark-tadpole-cell-c6.png"}, {"id": "crystal-mame-tengu-c6", "name": "✨️きらり豆天狗", "img": "tentative/crystal-mame-tengu-c6.png"}], [{"id": "marshmallow-puff-slime-b3", "name": "ぷにまろ", "img": "tentative/marshmallow-puff-slime-b3.png"}, {"id": "pressure-deepsea-tortoise-b7", "name": "アツリョク・ガメイデス", "img": "tentative/pressure-deepsea-tortoise-b7.png"}, {"id": "puyo-bubble-sprite-b13", "name": "あわぷにん", "img": "tentative/puyo-bubble-sprite-b13.png"}, {"id": "spring-cricket-piston-b16", "name": "バネコオロギ", "img": "tentative/spring-cricket-piston-b16.png"}, {"id": "genome-titan-beetle-b19", "name": "ゲノムカブト", "img": "tentative/genome-titan-beetle-b19.png"}, {"id": "cavitation-strike-mantis-shrimp-b8-rv2", "name": "ハカイダンシャコ", "img": "tentative/cavitation-strike-mantis-shrimp-b8-rv2.png"}, {"id": "piston-boar-forge-b21", "name": "ピストンボア", "img": "tentative/piston-boar-forge-b21.png"}, {"id": "scale-bearer-sentinel-n3", "name": "はかりの番兵", "img": "tentative/scale-bearer-sentinel-n3.png"}, {"id": "manticore-spineflail-n6", "name": "マンティガ", "img": "tentative/manticore-spineflail-n6.png"}, {"id": "celestial-scale-balancer-n6", "name": "テンビン・セイレイ", "img": "tentative/celestial-scale-balancer-n6.png"}]], L=["ファイア（1/2・50枚）", "ファイア（2/2・9枚）", "エレキ（1/2・50枚）", "エレキ（2/2・46枚）", "ウィンド（1/2・50枚）", "ウィンド（2/2・9枚）", "アース（1/2・50枚）", "アース（2/2・9枚）", "アクア（28）", "アイス（50）", "ダーク（1/3・50枚）", "ダーク（2/3・50枚）", "ダーク（3/3・10枚）", "シャイン（1/2・50枚）", "シャイン（2/2・20枚）", "メタル（37）", "コスモ（4）", "アシッド（17）", "クリスタル（29）", "アビス（1）", "シック（28）", "龍人（24）", "和妖（26）", "鉱物（21）", "化石（11）", "ファラオ（13）", "神々（5）", "イビル（24）", "✨可愛い（1/2・50枚）", "✨可愛い（2/2・9枚）", "その他（10）"], KEY="rika2_group_pick_v1";
let st=JSON.parse(localStorage.getItem(KEY)||"null")||{gi:0,dec:{}};
function save(){localStorage.setItem(KEY,JSON.stringify(st));}
const $=id=>document.getElementById(id);
$("gn").textContent=G.length;
function rec(id){ if(!st.dec[id])st.dec[id]={keep:true,name:""}; return st.dec[id]; }  // 既定=残す
function render(){
  if(st.gi>=G.length){$("grp").style.display="none";$("nav").style.display="none";$("done").style.display="block";finish();return;}
  $("grp").style.display="";$("nav").style.display="flex";$("done").style.display="none";
  $("gi").textContent=st.gi+1; $("glabel").textContent=L[st.gi]||"系統";
  const grp=G[st.gi]; const grid=$("grid"); grid.innerHTML=""; let kc=0;
  grp.forEach(b=>{ const r=rec(b.id); if(r.keep)kc++;
    const c=document.createElement("div"); c.className="card"+(r.keep?" on":"");
    c.innerHTML=`<div class="badge">${r.keep?"✓":"✕"}</div><div class="imgbox"><img src="${b.img}"></div>
      <div class="dname">${b.name}</div><div class="rn"><input type="text" placeholder="${b.name}" value="${(r.name||'').replace(/"/g,'&quot;')}"></div>`;
    c.querySelector(".imgbox").onclick=()=>{r.keep=!r.keep;save();render();};
    const inp=c.querySelector("input"); inp.oninput=()=>{r.name=inp.value;save();};
    grid.appendChild(c);
  });
  $("kc").textContent=kc;
}
$("all").onclick=()=>{const grp=G[st.gi];const anyon=grp.some(b=>rec(b.id).keep);grp.forEach(b=>{rec(b.id).keep=!anyon;});save();render();};
$("next").onclick=()=>{st.gi++;save();render();};
$("prev").onclick=()=>{if(st.gi>0)st.gi--;save();render();};
function csv(){let s="id,keep,new_name\n";G.forEach(g=>g.forEach(b=>{const r=st.dec[b.id]||{keep:true,name:""};s+=[b.id,r.keep?1:0,(r.name||"").replace(/,/g,"")].join(",")+"\n";}));return s;}
function finish(){let k=0,t=0;G.forEach(g=>g.forEach(b=>{t++;if((st.dec[b.id]||{keep:true}).keep)k++;}));$("sum").textContent=`候補${t}枚 中 残す${k}（外す${t-k}）`;$("out").value=csv();}
function copyCsv(){const s=csv();$("out").value=s;if(navigator.clipboard)navigator.clipboard.writeText(s).then(()=>{const e=$("toast");e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1500);});$("out").select();}
function dlCsv(){const s=csv();const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([s],{type:"text/csv"}));a.download="group_pick_result.csv";a.click();}
$("dl").onclick=dlCsv;$("cp").onclick=copyCsv;
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")$("next").click();else if(e.key==="ArrowLeft")$("prev").click();});
render();
</script></body></html>
