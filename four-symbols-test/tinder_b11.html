<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>ボス選別 — 理科RPG2</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0f1014;color:#e7e7ea;font-family:system-ui,"Hiragino Kaku Gothic ProN",sans-serif;overflow:hidden;height:100dvh}
header{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;background:#1a1c22;border-bottom:1px solid #2c2f3a}
header b{color:#ffe27a}.count{font-size:13px;color:#9aa0ad}
.stage{position:relative;height:calc(100dvh - 150px);display:flex;align-items:center;justify-content:center;padding:10px}
.card{position:absolute;width:min(92vw,440px);max-height:100%;background:#1d1f26;border:1px solid #2c2f3a;border-radius:18px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5);touch-action:none}
.imgbox{aspect-ratio:1/1;
  background-image:linear-gradient(45deg,#cfcfcf 25%,transparent 25%),linear-gradient(-45deg,#cfcfcf 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#cfcfcf 75%),linear-gradient(-45deg,transparent 75%,#cfcfcf 75%);
  background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0;background-color:#e9e9e9}
.imgbox img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.info{padding:12px 16px}
.nm{font-size:22px;font-weight:800}
.nm .tier{font-size:14px;font-weight:700;padding:2px 10px;border-radius:999px;margin-left:8px;vertical-align:3px}
.t序盤{background:#2bd47a;color:#06210f}.t中盤{background:#4aa3ff;color:#04203f}.t終盤{background:#ff9a3c;color:#311600}.tラスボス級{background:#ff5a7a;color:#33000d}
.el{font-size:12px;color:#9aa0ad;margin-top:2px}
.fl{font-size:14px;color:#cfd3db;margin-top:8px;line-height:1.55}
.stamp{position:absolute;top:18px;font-size:34px;font-weight:900;padding:4px 14px;border:4px solid;border-radius:12px;opacity:0;transform:rotate(-15deg)}
.yes{left:18px;color:#2bd47a;border-color:#2bd47a}.no{right:18px;color:#ff5a7a;border-color:#ff5a7a}
.bar{position:fixed;bottom:0;left:0;right:0;height:90px;display:flex;align-items:center;justify-content:center;gap:22px;background:#13141a;border-top:1px solid #2c2f3a}
.fab{width:62px;height:62px;border-radius:50%;border:none;font-size:26px;cursor:pointer;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.fab.no{background:#2a1d23;color:#ff5a7a;border:2px solid #ff5a7a}.fab.yes{background:#16271c;color:#2bd47a;border:2px solid #2bd47a}
.fab.undo{width:48px;height:48px;font-size:18px;background:#23242c;color:#cfd3db;border:1px solid #3a3f4c}
.done{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.done h2{color:#ffe27a;margin:0 0 8px}
.btn{margin-top:14px;background:#ffe27a;color:#15161a;border:none;border-radius:10px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
#out{margin-top:12px;width:min(92vw,520px);height:160px;font-family:ui-monospace,monospace;font-size:11px;display:none;background:#0b0c10;color:#cfd3db;border:1px solid #3a3f4c;border-radius:8px;padding:8px}
.hint{font-size:11px;color:#6b7280;margin-top:6px}
.toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%);background:#2bd47a;color:#08210f;padding:8px 16px;border-radius:999px;font-weight:700;opacity:0;transition:.3s;pointer-events:none}.toast.show{opacity:1}
</style></head><body>
<header><div><b>ボス選別</b> <span style="font-size:12px;color:#9aa0ad">← 無し / 有り → ・ドラッグもOK</span></div>
  <div class="count"><span id="done_n">0</span>/<span id="total_n">0</span> ・有り<span id="yes_n">0</span></div></header>
<div class="stage" id="stage">
  <div class="done" id="doneScreen">
    <h2>選別おわり！</h2>
    <div id="summary" style="color:#cfd3db"></div>
    <button class="btn" id="copyBtn">結果をコピー</button>
    <div class="hint">コピーしたテキストをチャットに貼ってください（採用の系統を学習して次の50枚へ）。</div>
    <textarea id="out" readonly></textarea>
    <button class="btn" id="restartBtn" style="background:#3a3f4c;color:#e7e7ea">最初からやり直す</button>
  </div>
</div>
<div class="bar">
  <button class="fab no" id="bNo">✗</button>
  <button class="fab undo" id="bUndo">↶</button>
  <button class="fab yes" id="bYes">♥</button>
  <button class="btn" id="bCopy" style="position:fixed;right:12px;bottom:104px;padding:8px 12px;font-size:12px">途中保存コピー</button>
</div>
<div class="toast" id="toast">コピーしました！</div>
<script>
const BOSSES=[{"id": "puni-droplet-b11", "name_ja": "ぷにしずく", "tier": "序盤", "element": "水", "flavor_ja": "理科の世界にいちばん多い、ただの水のかたまり。まるくてぷにぷに、まだ何にも染まっていない一番やさしいスライム。", "img": "gacha_b11/puni-droplet-b11.png"}, {"id": "salt-cube-ooze-b11", "name_ja": "しおキューブ", "tier": "序盤", "element": "結晶", "flavor_ja": "海の水がかわいてできた、しおのかたまりスライム。なめると本当にしょっぱい。たたくとパラパラ結晶がこぼれる。", "img": "gacha_b11/salt-cube-ooze-b11.png"}, {"id": "bubble-foam-pudding-b11", "name_ja": "あわプリン", "tier": "序盤", "element": "水", "flavor_ja": "せっけん水からうまれた、あわあわのプリンスライム。ふるふるゆれるたびに頭の泡がふくらむ。さわるとつるん。", "img": "gacha_b11/bubble-foam-pudding-b11.png"}, {"id": "acid-eater-ooze-b11", "name_ja": "さんしょくウーズ", "tier": "中盤", "element": "酸", "flavor_ja": "ふれたものをジュッととかす、酸性のウーズ。金属もコンクリも大好物。出会ったら中和してやっつけよう。", "img": "gacha_b11/acid-eater-ooze-b11.png"}, {"id": "magnet-fluid-blob-b11", "name_ja": "じせいスライム", "tier": "中盤", "element": "磁性流体", "flavor_ja": "磁石にひかれてトゲトゲにとがる、まっ黒な磁性流体スライム。N極S極で形を変える不思議な液体。", "img": "gacha_b11/magnet-fluid-blob-b11.png"}, {"id": "rust-iron-sludge-b11", "name_ja": "さびスラッジ", "tier": "中盤", "element": "金属", "flavor_ja": "さびた鉄がどろどろにとけて生まれた、重たいスラッジ。中にくぎや歯車がうもれている。酸化って強いんだ。", "img": "gacha_b11/rust-iron-sludge-b11.png"}, {"id": "crystal-geode-golem-slime-b11", "name_ja": "ジオードゴーレム", "tier": "終盤", "element": "結晶", "flavor_ja": "長い時間をかけて結晶が育った、宝石のかたまりゴーレムスライム。割ると中はキラキラの空洞。重くて固い。", "img": "gacha_b11/crystal-geode-golem-slime-b11.png"}, {"id": "lava-magma-blob-b11", "name_ja": "マグマぷよ", "tier": "終盤", "element": "溶岩", "flavor_ja": "火山の底からのぼってきた、どろどろの溶岩ぷよ。外はかたい岩、中はあつあつのマグマ。近づくと熱い。", "img": "gacha_b11/lava-magma-blob-b11.png"}, {"id": "plasma-state-king-ooze-b11", "name_ja": "プラズマキング", "tier": "ラスボス級", "element": "雷", "flavor_ja": "すべてのスライムを束ねる王。固体・液体・気体をこえた第四の状態＝プラズマをまとう。バチバチと電気をはなつ。", "img": "gacha_b11/plasma-state-king-ooze-b11.png"}, {"id": "primordial-soup-leviathan-b11", "name_ja": "げんしスープ・リヴァイア", "tier": "ラスボス級", "element": "酸", "flavor_ja": "命がうまれる前の海＝原始スープそのものが意思をもった怪物。体の中で細胞や生命のもとがうずまく。すべての始まり。", "img": "gacha_b11/primordial-soup-leviathan-b11.png"}, {"id": "spark-goblin-grunt-b11", "name_ja": "スパーク・ゴブリン", "tier": "序盤", "element": "電気", "flavor_ja": "銅の穂先に電気をためてビリッと刺してくる小鬼。群れで湧く。", "img": "gacha_b11/spark-goblin-grunt-b11.png"}, {"id": "acid-pot-kobold-b11", "name_ja": "アシッド・コボルト", "tier": "序盤", "element": "化学", "flavor_ja": "酸の壺を抱えた小型のトカゲ鬼。中身をかけて防具を溶かす。", "img": "gacha_b11/acid-pot-kobold-b11.png"}, {"id": "gear-imp-tinker-b11", "name_ja": "ギア・インプ", "tier": "序盤", "element": "物理", "flavor_ja": "歯車を体に打ち付けた小鬼の修理屋。からくり武器でちまちま殴る。", "img": "gacha_b11/gear-imp-tinker-b11.png"}, {"id": "magnet-orc-pikeman-b11", "name_ja": "マグネット・オーク", "tier": "中盤", "element": "電気", "flavor_ja": "磁石の槍で鉄くずを吸い寄せ、刃を生やす重装オーク。", "img": "gacha_b11/magnet-orc-pikeman-b11.png"}, {"id": "flask-hobgoblin-alchemist-b11", "name_ja": "フラスコ・ホブゴブリン", "tier": "中盤", "element": "化学", "flavor_ja": "薬瓶帯を提げた大型ゴブリンの錬金術師。混ぜた薬をぶちまける。", "img": "gacha_b11/flask-hobgoblin-alchemist-b11.png"}, {"id": "piston-ogre-bruiser-b11", "name_ja": "ピストン・オーガ", "tier": "中盤", "element": "物理", "flavor_ja": "蒸気ピストンの籠手で殴りつける鈍重なオーガ。一撃が重い。", "img": "gacha_b11/piston-ogre-bruiser-b11.png"}, {"id": "voltage-orc-warlord-b11", "name_ja": "ヴォルテージ・ウォーロード", "tier": "終盤", "element": "電気", "flavor_ja": "二又の放電グレイブを構える歴戦のオーク将。雷をまとって突進する。", "img": "gacha_b11/voltage-orc-warlord-b11.png"}, {"id": "corrosion-troll-warden-b11", "name_ja": "コロージョン・トロール", "tier": "終盤", "element": "化学", "flavor_ja": "胸に大釜を埋め込んだ巨大トロール。腐食液をまとって近づくものを溶かす。", "img": "gacha_b11/corrosion-troll-warden-b11.png"}, {"id": "thunderking-overlord-b11", "name_ja": "サンダーキング・オーバーロード", "tier": "ラスボス級", "element": "電気", "flavor_ja": "小鬼たちを束ねる電磁の王。巨大な雷槌を振るい全身に稲妻をまとう。", "img": "gacha_b11/thunderking-overlord-b11.png"}, {"id": "transmute-demon-sovereign-b11", "name_ja": "トランスミュート・ソブリン", "tier": "ラスボス級", "element": "化学", "flavor_ja": "体に錬成炉を埋め込んだ鬼の覇王。あらゆる物質を変えて操る最終の敵。", "img": "gacha_b11/transmute-demon-sovereign-b11.png"}, {"id": "rust-rubble-golem-b11", "name_ja": "サビカワラのゴーレム", "tier": "序盤", "element": "鉄", "flavor_ja": "うち捨てられた鉄くずが、なぜか動きだした。サビをこぼしながら、のっそりと迫る。", "img": "gacha_b11/rust-rubble-golem-b11.png"}, {"id": "salt-crystal-gargoyle-b11", "name_ja": "しおの結晶ガーゴイル", "tier": "序盤", "element": "結晶", "flavor_ja": "塩の結晶がガーゴイルの形に育った。固くて、なめると…いや、やめておこう。", "img": "gacha_b11/salt-crystal-gargoyle-b11.png"}, {"id": "scrap-cog-sentry-b11", "name_ja": "ガラクタ歯車ガード", "tier": "序盤", "element": "合金", "flavor_ja": "持ち主のいない鎧の中で、歯車だけが回り続けている。カチカチと音が鳴る。", "img": "gacha_b11/scrap-cog-sentry-b11.png"}, {"id": "magnetite-ironclad-beast-b11", "name_ja": "磁鉄鉱のアイアンビースト", "tier": "中盤", "element": "磁鉄", "flavor_ja": "磁石の力で鉄くずを毛皮のようにまとう獣。近づく刃物が、吸い寄せられていく。", "img": "gacha_b11/magnetite-ironclad-beast-b11.png"}, {"id": "molten-core-golem-b11", "name_ja": "ようがん炉心ゴーレム", "tier": "中盤", "element": "溶岩", "flavor_ja": "体の割れ目から溶けた岩がのぞく。中心の炉は、まだ冷めていない。", "img": "gacha_b11/molten-core-golem-b11.png"}, {"id": "alloy-warden-armor-b11", "name_ja": "合金ウォーデンの鎧", "tier": "中盤", "element": "合金", "flavor_ja": "中身は空っぽ。それでも、騎士のように剣をかまえる。誰の意志で動くのか。", "img": "gacha_b11/alloy-warden-armor-b11.png"}, {"id": "circuit-titan-construct-b11", "name_ja": "回路タイタンの構造体", "tier": "終盤", "element": "回路", "flavor_ja": "全身を電流が駆けめぐる、機械仕掛けの巨人。胸の炉心が脈打つたび、回路が光る。", "img": "gacha_b11/circuit-titan-construct-b11.png"}, {"id": "obsidian-cathedral-gargoyle-b11", "name_ja": "黒曜大聖堂のガーゴイル", "tier": "終盤", "element": "結晶", "flavor_ja": "教会の屋根で雨ざらしだった黒い守り神。割れた体のすき間から、紫の光がもれる。", "img": "gacha_b11/obsidian-cathedral-gargoyle-b11.png"}, {"id": "primordial-colossus-of-strata-b11", "name_ja": "原初の地層コロッサス", "tier": "ラスボス級", "element": "溶岩", "flavor_ja": "億年の地層が、ついに立ち上がった。歩くたびに大地が割れ、溶けた核がうなる。", "img": "gacha_b11/primordial-colossus-of-strata-b11.png"}, {"id": "world-engine-sovereign-b11", "name_ja": "世界機関のソブリン", "tier": "ラスボス級", "element": "回路", "flavor_ja": "鉄と結晶と電気、すべての構造体の頂点に立つ王。回る歯車は世界の心臓だという。", "img": "gacha_b11/world-engine-sovereign-b11.png"}, {"id": "bone-cinder-slug-b11", "name_ja": "ホネトカゲもどき", "tier": "序盤", "element": "毒", "flavor_ja": "骨のからを背おった小さな腐れ虫。すき間からじわりと毒のけむりがにじむ。序盤の練習相手にちょうどいいザコ。", "img": "gacha_b11/bone-cinder-slug-b11.png"}, {"id": "frost-rib-skitter-b11", "name_ja": "コオリホネガニ", "tier": "序盤", "element": "氷", "flavor_ja": "ろっ骨を寄せあつめたような小さな骨ガニ。霜をまとってカチカチと歩く。氷ぞくの入門ザコ。", "img": "gacha_b11/frost-rib-skitter-b11.png"}, {"id": "wisp-lantern-spook-b11", "name_ja": "あおびガイコツ", "tier": "序盤", "element": "闇", "flavor_ja": "ぼろ布をまとった小さなガイコツの亡霊。目のおくで青むらさきの魂火がゆれる。やみぞくの最初の一体。", "img": "gacha_b11/wisp-lantern-spook-b11.png"}, {"id": "gravewax-toad-corpse-b11", "name_ja": "ドクヌマゾンビ", "tier": "中盤", "element": "毒", "flavor_ja": "毒のふくろをふくらませた腐れガエルの死がい。皮のさけ目から毒のヘドロがしみ出す。中盤の毒ボス。", "img": "gacha_b11/gravewax-toad-corpse-b11.png"}, {"id": "obsidian-shard-revenant-b11", "name_ja": "コクヨウのきし", "tier": "中盤", "element": "闇", "flavor_ja": "黒曜石とほねで組まれた不死の騎士。よろいのすき間から冷たい紫の光がもれる。中盤の手ごわい闇ボス。", "img": "gacha_b11/obsidian-shard-revenant-b11.png"}, {"id": "permafrost-bone-hound-b11", "name_ja": "ホネオオカミ・れいとう", "tier": "中盤", "element": "氷", "flavor_ja": "氷の結晶と骨でできた不死の魔狼。背骨から氷のトゲがのびる。四つ足でどっしり構える氷の中ボス。", "img": "gacha_b11/permafrost-bone-hound-b11.png"}, {"id": "graviton-lich-warden-b11", "name_ja": "ジュウリョクのししゃ", "tier": "終盤", "element": "重力", "flavor_ja": "胸に重力の核をかかえた死の魔導士。まわりの空間がねじれ、ローブが核へ引きこまれる。終盤の重力ボス。", "img": "gacha_b11/graviton-lich-warden-b11.png"}, {"id": "plague-ossuary-colossus-b11", "name_ja": "シガイのきょしん", "tier": "終盤", "element": "毒", "flavor_ja": "無数の死がいを寄せ集めた巨大不死像。すき間から毒の瘴気がふき出す。終盤の重量級ボス。", "img": "gacha_b11/plague-ossuary-colossus-b11.png"}, {"id": "void-monarch-deathlord-b11", "name_ja": "メツボウのまおう", "tier": "ラスボス級", "element": "重力", "flavor_ja": "胸に滅びの特異点をいだく不死の魔王。六本の骨の腕が核へとじこむ。世界をのみこむ重力のラスボス。", "img": "gacha_b11/void-monarch-deathlord-b11.png"}, {"id": "eternal-glacier-wraithking-b11", "name_ja": "えいとうのれいおう", "tier": "ラスボス級", "element": "氷", "flavor_ja": "黒い骨と氷河をまとう不死の霊王。背からは氷のやりが生え、冷たい霊気が体を包む。永久凍土を治める氷のラスボス。", "img": "gacha_b11/eternal-glacier-wraithking-b11.png"}, {"id": "ember-coal-pup-wyvern-b11", "name_ja": "スミビの仔ワイバーン", "tier": "序盤", "element": "火", "flavor_ja": "炭が燃えるように体のすき間から炎がもれる、まだ小さなワイバーン。ものが燃えるのは酸素とむすびつくから。", "img": "gacha_b11/ember-coal-pup-wyvern-b11.png"}, {"id": "copper-shell-cockatrice-b11", "name_ja": "ドウメッキ・コカトリス", "tier": "序盤", "element": "金属", "flavor_ja": "銅の体が緑色にさびていくコカトリス。金属は空気や水でさびて色が変わる。", "img": "gacha_b11/copper-shell-cockatrice-b11.png"}, {"id": "sprout-vine-mini-griffon-b11", "name_ja": "ふたばグリフォン", "tier": "序盤", "element": "植物", "flavor_ja": "双葉が翼になった小さなグリフォン。植物は芽を出して葉で日光から養分をつくる。", "img": "gacha_b11/sprout-vine-mini-griffon-b11.png"}, {"id": "voltaic-mane-manticore-b11", "name_ja": "ライデン・マンティコア", "tier": "中盤", "element": "電気", "flavor_ja": "たてがみが電気の火花でできたマンティコア。電気は+と−の間を流れ、金属をよく通る。", "img": "gacha_b11/voltaic-mane-manticore-b11.png"}, {"id": "crystal-claw-chimera-crab-b11", "name_ja": "ケッショウ・キメラガニ", "tier": "中盤", "element": "結晶", "flavor_ja": "体じゅうから結晶が育つ甲殻のキメラ。結晶はきまった形に原子がならんでできる。", "img": "gacha_b11/crystal-claw-chimera-crab-b11.png"}, {"id": "acid-drool-cerberus-b11", "name_ja": "ヨウカイ・ケルベロス", "tier": "中盤", "element": "化学", "flavor_ja": "三つの口から強い酸を垂らす番犬。酸は金属やものをとかし、アルカリで中和される。", "img": "gacha_b11/acid-drool-cerberus-b11.png"}, {"id": "obsidian-gear-dragon-b11", "name_ja": "ハグルマ・オブシディアンドラゴン", "tier": "終盤", "element": "機械", "flavor_ja": "歯車とピストンで動く黒曜の機械竜。歯車はかみ合って力と回転を伝える。", "img": "gacha_b11/obsidian-gear-dragon-b11.png"}, {"id": "magnet-horn-minotaur-b11", "name_ja": "ジリョク・ミノタウロス", "tier": "終盤", "element": "磁力", "flavor_ja": "磁石の角に鉄くずを吸いつかせた巨牛。磁石にはN極とS極があり鉄を引きよせる。", "img": "gacha_b11/magnet-horn-minotaur-b11.png"}, {"id": "prism-aurora-leviathan-b11", "name_ja": "ヒカリ・オーロラドラゴン", "tier": "ラスボス級", "element": "光", "flavor_ja": "うろこが光を七色に分けるオーロラの大竜。光はプリズムで色に分かれ、これが虹の正体。", "img": "gacha_b11/prism-aurora-leviathan-b11.png"}, {"id": "singularity-core-chimera-b11", "name_ja": "ジュウリョク・テンシンキメラ", "tier": "ラスボス級", "element": "重力", "flavor_ja": "胸の重力核がすべてを引きよせる天地のキメラ。重さは引力で生まれ、強いほど光さえ曲げる。", "img": "gacha_b11/singularity-core-chimera-b11.png"}]; const KEY="rika2_boss_swipe_gacha_b11";
let st=JSON.parse(localStorage.getItem(KEY)||"null")||{idx:0,dec:{}};
function save(){localStorage.setItem(KEY,JSON.stringify(st));}
const stage=document.getElementById("stage");
document.getElementById("total_n").textContent=BOSSES.length;
let card=null,startX=0,curX=0,dragging=false;

function counts(){const y=Object.values(st.dec).filter(v=>v==="yes").length;
  document.getElementById("done_n").textContent=Object.keys(st.dec).length;
  document.getElementById("yes_n").textContent=y;}

function build(idx){
  const b=BOSSES[idx]; const el=document.createElement("div"); el.className="card";
  el.innerHTML=`<div class="stamp yes">有り</div><div class="stamp no">無し</div>
    <div class="imgbox"><img src="${b.img}" alt=""></div>
    <div class="info"><div class="nm">${b.name_ja}<span class="tier t${b.tier}">${b.tier}</span></div>
    <div class="el">${b.element}</div><div class="fl">${b.flavor_ja}</div></div>`;
  el.addEventListener("pointerdown",down); el.addEventListener("pointermove",move);
  el.addEventListener("pointerup",up); el.addEventListener("pointercancel",up);
  return el;
}
function show(){
  if(card){card.remove();card=null;}
  if(st.idx>=BOSSES.length){document.getElementById("doneScreen").style.display="flex";finish();return;}
  document.getElementById("doneScreen").style.display="none";
  card=build(st.idx); stage.appendChild(card); counts();
}
function down(e){dragging=true;startX=e.clientX;curX=0;card.setPointerCapture(e.pointerId);card.style.transition="none";}
function move(e){if(!dragging)return;curX=e.clientX-startX;card.style.transform=`translateX(${curX}px) rotate(${curX/18}deg)`;
  card.querySelector(".yes").style.opacity=Math.max(0,Math.min(1,curX/90));
  card.querySelector(".no").style.opacity=Math.max(0,Math.min(1,-curX/90));}
function up(){if(!dragging)return;dragging=false;
  if(curX>90)decide("yes");else if(curX<-90)decide("no");
  else{card.style.transition=".2s";card.style.transform="";card.querySelector(".yes").style.opacity=0;card.querySelector(".no").style.opacity=0;}}
function decide(v){
  st.dec[BOSSES[st.idx].id]=v; save();
  const dir=v==="yes"?1:-1;
  card.style.transition=".3s ease-out";
  card.style.transform=`translateX(${dir*140}vw) rotate(${dir*25}deg)`;
  card.style.opacity="0";
  setTimeout(()=>{st.idx++;save();show();},260);
}
function undo(){if(st.idx<=0)return;st.idx--;delete st.dec[BOSSES[st.idx].id];save();show();}
function summaryText(){
  const yes=BOSSES.filter(b=>st.dec[b.id]==="yes"),no=BOSSES.filter(b=>st.dec[b.id]==="no");
  let s=`=== ボス選別 結果 (有り${yes.length} / 無し${no.length} / 計${BOSSES.length}) ===\n【有り】\n`;
  yes.forEach(b=>s+=`- ${b.name_ja} (${b.tier}/${b.element}) [${b.id}]\n`);
  s+="【無し】\n"; no.forEach(b=>s+=`- ${b.name_ja} (${b.tier}/${b.element}) [${b.id}]\n`);
  return s;
}
function finish(){
  const yes=BOSSES.filter(b=>st.dec[b.id]==="yes").length;
  document.getElementById("summary").textContent=`有り ${yes} 体 / 無し ${BOSSES.length-yes} 体`;
}
function copyOut(){const s=summaryText();const o=document.getElementById("out");o.style.display="block";o.value=s;
  if(navigator.clipboard)navigator.clipboard.writeText(s).then(()=>{const t=document.getElementById("toast");t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1500);},()=>{});o.select();}
document.getElementById("bNo").onclick=()=>{if(st.idx<BOSSES.length)decide("no");};
document.getElementById("bYes").onclick=()=>{if(st.idx<BOSSES.length)decide("yes");};
document.getElementById("bUndo").onclick=undo;
document.getElementById("bCopy").onclick=copyOut;
document.getElementById("copyBtn").onclick=copyOut;
document.getElementById("restartBtn").onclick=()=>{st={idx:0,dec:{}};save();show();};
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"&&st.idx<BOSSES.length)decide("no");
  else if(e.key==="ArrowRight"&&st.idx<BOSSES.length)decide("yes");else if(e.key==="Backspace")undo();});
show();
</script></body></html>
