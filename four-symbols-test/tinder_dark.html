<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>ボス選別 — 理科RPG2</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0f1014;color:#e7e7ea;font-family:system-ui,"Hiragino Kaku Gothic ProN",sans-serif;overflow:hidden;height:100dvh}
header{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;background:#1a1c22;border-bottom:1px solid #2c2f3a}
header b{color:#ffe27a}.count{font-size:13px;color:#9aa0ad}
.stage{position:relative;height:calc(100dvh - 150px);display:flex;align-items:center;justify-content:center;padding:10px}
.card{position:absolute;width:min(92vw,440px);max-height:100%;background:#1d1f26;border:1px solid #2c2f3a;border-radius:18px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5);touch-action:none}
.imgbox{aspect-ratio:1/1;
  background-image:linear-gradient(45deg,#cfcfcf 25%,transparent 25%),linear-gradient(-45deg,#cfcfcf 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#cfcfcf 75%),linear-gradient(-45deg,transparent 75%,#cfcfcf 75%);
  background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0;background-color:#e9e9e9}
.imgbox img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.info{padding:12px 16px}
.nm{font-size:22px;font-weight:800}
.nm .tier{font-size:14px;font-weight:700;padding:2px 10px;border-radius:999px;margin-left:8px;vertical-align:3px}
.t序盤{background:#2bd47a;color:#06210f}.t中盤{background:#4aa3ff;color:#04203f}.t終盤{background:#ff9a3c;color:#311600}.tラスボス級{background:#ff5a7a;color:#33000d}
.el{font-size:12px;color:#9aa0ad;margin-top:2px}
.fl{font-size:14px;color:#cfd3db;margin-top:8px;line-height:1.55}
.stamp{position:absolute;top:18px;font-size:34px;font-weight:900;padding:4px 14px;border:4px solid;border-radius:12px;opacity:0;transform:rotate(-15deg)}
.yes{left:18px;color:#2bd47a;border-color:#2bd47a}.no{right:18px;color:#ff5a7a;border-color:#ff5a7a}
.bar{position:fixed;bottom:0;left:0;right:0;height:90px;display:flex;align-items:center;justify-content:center;gap:22px;background:#13141a;border-top:1px solid #2c2f3a}
.fab{width:62px;height:62px;border-radius:50%;border:none;font-size:26px;cursor:pointer;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.fab.no{background:#2a1d23;color:#ff5a7a;border:2px solid #ff5a7a}.fab.yes{background:#16271c;color:#2bd47a;border:2px solid #2bd47a}
.fab.undo{width:48px;height:48px;font-size:18px;background:#23242c;color:#cfd3db;border:1px solid #3a3f4c}
.done{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.done h2{color:#ffe27a;margin:0 0 8px}
.btn{margin-top:14px;background:#ffe27a;color:#15161a;border:none;border-radius:10px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
#out{margin-top:12px;width:min(92vw,520px);height:160px;font-family:ui-monospace,monospace;font-size:11px;display:none;background:#0b0c10;color:#cfd3db;border:1px solid #3a3f4c;border-radius:8px;padding:8px}
.hint{font-size:11px;color:#6b7280;margin-top:6px}
.toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%);background:#2bd47a;color:#08210f;padding:8px 16px;border-radius:999px;font-weight:700;opacity:0;transition:.3s;pointer-events:none}.toast.show{opacity:1}
</style></head><body>
<header><div><b>ボス選別</b> <span style="font-size:12px;color:#9aa0ad">← 無し / 有り → ・ドラッグもOK</span></div>
  <div class="count"><span id="done_n">0</span>/<span id="total_n">0</span> ・有り<span id="yes_n">0</span></div></header>
<div class="stage" id="stage">
  <div class="done" id="doneScreen">
    <h2>選別おわり！</h2>
    <div id="summary" style="color:#cfd3db"></div>
    <button class="btn" id="copyBtn">結果をコピー</button>
    <div class="hint">コピーしたテキストをチャットに貼ってください（採用の系統を学習して次の50枚へ）。</div>
    <textarea id="out" readonly></textarea>
    <button class="btn" id="restartBtn" style="background:#3a3f4c;color:#e7e7ea">最初からやり直す</button>
  </div>
</div>
<div class="bar">
  <button class="fab no" id="bNo">✗</button>
  <button class="fab undo" id="bUndo">↶</button>
  <button class="fab yes" id="bYes">♥</button>
  <button class="btn" id="bCopy" style="position:fixed;right:12px;bottom:104px;padding:8px 12px;font-size:12px">途中保存コピー</button>
</div>
<div class="toast" id="toast">コピーしました！</div>
<script>
const BOSSES=[{"id": "ash-bone-imp-dark01", "name_ja": "ダーク・ホネコビト", "tier": "序盤", "element": "ダーク", "flavor_ja": "小さな骨のこびと。目のあなで紫の火がゆれている。よわいけれど、いつもニコニコしている。", "img": "gacha_dark/ash-bone-imp-dark01.png"}, {"id": "violet-wisp-dark02", "name_ja": "ダーク・ムラサキビ", "tier": "序盤", "element": "ダーク", "flavor_ja": "まるい影のおばけ。むらさき色にうっすら光る。さわると少しひんやりする。", "img": "gacha_dark/violet-wisp-dark02.png"}, {"id": "cinder-rot-rat-dark03", "name_ja": "ダーク・クサリネズミ", "tier": "序盤", "element": "ダーク", "flavor_ja": "くさりかけた毛皮の小さなネズミ。ほねが少し見えているが、すばしっこい。", "img": "gacha_dark/cinder-rot-rat-dark03.png"}, {"id": "obsidian-shard-pup-dark04", "name_ja": "ダーク・コクヨウコイヌ", "tier": "序盤", "element": "ダーク", "flavor_ja": "黒曜石でできた小さな子犬。すきまから紫の光がもれる。ぶつかると少しかたい。", "img": "gacha_dark/obsidian-shard-pup-dark04.png"}, {"id": "spore-toad-dark05", "name_ja": "ダーク・キノコガエル", "tier": "序盤", "element": "ダーク", "flavor_ja": "せなかにキノコが生えたカエル。じめじめした場所が好き。ぷよぷよしている。", "img": "gacha_dark/spore-toad-dark05.png"}, {"id": "shadow-crow-dark06", "name_ja": "ダーク・カゲガラス", "tier": "序盤", "element": "ダーク", "flavor_ja": "羽が紫がかった黒いカラス。かげをまとって飛ぶ。よくものを集める。", "img": "gacha_dark/shadow-crow-dark06.png"}, {"id": "husk-beetle-dark07", "name_ja": "ダーク・カラベゾウムシ", "tier": "序盤", "element": "ダーク", "flavor_ja": "からっぽの黒い虫。からだのひびから緑の光がもれる。じっとしていることが多い。", "img": "gacha_dark/husk-beetle-dark07.png"}, {"id": "grave-mole-dark08", "name_ja": "ダーク・ハカモグラ", "tier": "序盤", "element": "ダーク", "flavor_ja": "目をとじたまま土をほる小さなモグラ。ほねのようなツメをもつ。よわいけれど力もち。", "img": "gacha_dark/grave-mole-dark08.png"}, {"id": "pale-larva-dark09", "name_ja": "ダーク・アオジロウジ", "tier": "序盤", "element": "ダーク", "flavor_ja": "半とうめいの白いいもむし。中の血管がぼんやり紫に光る。これから大きくなるらしい。", "img": "gacha_dark/pale-larva-dark09.png"}, {"id": "ember-skull-snake-dark10", "name_ja": "ダーク・ドクロヘビ", "tier": "序盤", "element": "ダーク", "flavor_ja": "ほねでできた小さなヘビ。ぐるぐるまいて休む。かむと少しいたい。", "img": "gacha_dark/ember-skull-snake-dark10.png"}, {"id": "moss-wraithling-dark11", "name_ja": "ダーク・コケユウレイ", "tier": "序盤", "element": "ダーク", "flavor_ja": "こけ色のぼろをまとった小さなゆうれい。顔のかわりに光が二つ見える。さみしがりや。", "img": "gacha_dark/moss-wraithling-dark11.png"}, {"id": "plague-hopper-dark12", "name_ja": "ダーク・ヤミバッタ", "tier": "序盤", "element": "ダーク", "flavor_ja": "やみ色のバッタ。あしから病気のような気がのぼる。とぶ力はつよい。", "img": "gacha_dark/plague-hopper-dark12.png"}, {"id": "obsidian-crab-dark13", "name_ja": "ダーク・コクヨウガニ", "tier": "序盤", "element": "ダーク", "flavor_ja": "黒曜石のからをもつ小さなカニ。ハサミはかたくてするどい。横歩きが得意。", "img": "gacha_dark/obsidian-crab-dark13.png"}, {"id": "dim-bat-dark14", "name_ja": "ダーク・ヨイコウモリ", "tier": "序盤", "element": "ダーク", "flavor_ja": "夕やみ色のコウモリ。大きな目で暗やみがよく見える。羽をたたんでぶらさがる。", "img": "gacha_dark/dim-bat-dark14.png"}, {"id": "rot-slime-dark15", "name_ja": "ダーク・グサレスライム", "tier": "序盤", "element": "ダーク", "flavor_ja": "むらさき色のドロドロした体。中にほねのかけらが浮いている。さわるとべたべた。", "img": "gacha_dark/rot-slime-dark15.png"}, {"id": "bone-warden-dark16", "name_ja": "ダーク・ホネバンチョウ", "tier": "中盤", "element": "ダーク", "flavor_ja": "ほねの体に黒い鎧をつけた戦士。目に紫の火がもえる。守りがとてもかたい。", "img": "gacha_dark/bone-warden-dark16.png"}, {"id": "obsidian-panther-dark17", "name_ja": "ダーク・コクヨウヒョウ", "tier": "中盤", "element": "ダーク", "flavor_ja": "黒曜石のうろこを背に持つ黒ヒョウ。とても速く、音もなくせまる。", "img": "gacha_dark/obsidian-panther-dark17.png"}, {"id": "plague-mantis-dark18", "name_ja": "ダーク・エキビョウカマキリ", "tier": "中盤", "element": "ダーク", "flavor_ja": "病気をふりまく大きなカマキリ。するどいカマから緑のしるがしたたる。", "img": "gacha_dark/plague-mantis-dark18.png"}, {"id": "wraith-knight-dark19", "name_ja": "ダーク・ボウレイキシ", "tier": "中盤", "element": "ダーク", "flavor_ja": "よろいだけが動く亡霊の騎士。中身はからっぽで、青い火がともる。", "img": "gacha_dark/wraith-knight-dark19.png"}, {"id": "fungal-bear-dark20", "name_ja": "ダーク・キノコグマ", "tier": "中盤", "element": "ダーク", "flavor_ja": "せなか一面にキノコが生えた大きなクマ。胞子をまき散らしながら歩く。", "img": "gacha_dark/fungal-bear-dark20.png"}, {"id": "obsidian-serpent-dark21", "name_ja": "ダーク・コクヨウオロチ", "tier": "中盤", "element": "ダーク", "flavor_ja": "黒曜石のうろこを持つ小さな竜ヘビ。ぐるぐるまいて獲物をねらう。", "img": "gacha_dark/obsidian-serpent-dark21.png"}, {"id": "corpse-vulture-dark22", "name_ja": "ダーク・シガイハゲワシ", "tier": "中盤", "element": "ダーク", "flavor_ja": "羽がぬけ落ちた大きなハゲワシ。ほねが少し見えている。死んだものを片づける。", "img": "gacha_dark/corpse-vulture-dark22.png"}, {"id": "shade-stag-dark23", "name_ja": "ダーク・カゲジカ", "tier": "中盤", "element": "ダーク", "flavor_ja": "影のような毛なみの大きなシカ。ほねの角が紫に光る。森の主のような風格がある。", "img": "gacha_dark/shade-stag-dark23.png"}, {"id": "parasite-host-dark24", "name_ja": "ダーク・キセイヌケガラ", "tier": "中盤", "element": "ダーク", "flavor_ja": "体の中に寄生虫がすみついた抜けがら。むねからにょろにょろと顔を出す。すこしこわい。", "img": "gacha_dark/parasite-host-dark24.png"}, {"id": "obsidian-golem-dark25", "name_ja": "ダーク・コクヨウゴーレム", "tier": "中盤", "element": "ダーク", "flavor_ja": "黒曜石の岩でできた人形。むねの文字が紫に光る。一発がとても重い。", "img": "gacha_dark/obsidian-golem-dark25.png"}, {"id": "rot-hound-dark26", "name_ja": "ダーク・クサレイヌ", "tier": "中盤", "element": "ダーク", "flavor_ja": "くさった体の大きな犬。あばらが見えているが、走るのはとても速い。", "img": "gacha_dark/rot-hound-dark26.png"}, {"id": "shadow-weaver-dark27", "name_ja": "ダーク・カゲグモ", "tier": "中盤", "element": "ダーク", "flavor_ja": "紫のもようを持つ大きなクモ。黒い糸であみをはる。八つの目で見はる。", "img": "gacha_dark/shadow-weaver-dark27.png"}, {"id": "bone-centaur-dark28", "name_ja": "ダーク・ホネケンタウロス", "tier": "中盤", "element": "ダーク", "flavor_ja": "上半身が骨の戦士、下半身が骨の馬。四本足でどっしり立つ。やりの名手。", "img": "gacha_dark/bone-centaur-dark28.png"}, {"id": "mutant-frog-dark29", "name_ja": "ダーク・ヘンイガエル", "tier": "中盤", "element": "ダーク", "flavor_ja": "おかしな数の足が生えた巨大なカエル。体のふくろが緑に光る。じめじめが好き。", "img": "gacha_dark/mutant-frog-dark29.png"}, {"id": "obsidian-scorpion-dark30", "name_ja": "ダーク・コクヨウサソリ", "tier": "中盤", "element": "ダーク", "flavor_ja": "黒曜石のからを持つ大きなサソリ。しっぽのはりに毒がある。ハサミも強力。", "img": "gacha_dark/obsidian-scorpion-dark30.png"}, {"id": "cursed-treant-dark31", "name_ja": "ダーク・ノロイジュ", "tier": "終盤", "element": "ダーク", "flavor_ja": "のろいに飲まれた黒い大樹。みきの文字が紫に光る。根っこで大地をつかむ。", "img": "gacha_dark/cursed-treant-dark31.png"}, {"id": "plague-leviathan-dark32", "name_ja": "ダーク・エキビョウオオウオ", "tier": "終盤", "element": "ダーク", "flavor_ja": "病気にむしばまれた巨大魚。うろこがはがれ、ほねが見える。大きな口でのみこむ。", "img": "gacha_dark/plague-leviathan-dark32.png"}, {"id": "obsidian-wyvern-dark33", "name_ja": "ダーク・コクヨウワイバーン", "tier": "終盤", "element": "ダーク", "flavor_ja": "黒曜石のうろこを持つ強い飛竜。羽をたたんでにらみつける。一撃が重い。", "img": "gacha_dark/obsidian-wyvern-dark33.png"}, {"id": "lich-sovereign-dark34", "name_ja": "ダーク・シハイノシシャ", "tier": "終盤", "element": "ダーク", "flavor_ja": "王かんをかぶった骨の魔導士。つえに黒い水晶がはまる。死の魔法をあやつる。", "img": "gacha_dark/lich-sovereign-dark34.png"}, {"id": "shadow-behemoth-dark35", "name_ja": "ダーク・カゲキョジュウ", "tier": "終盤", "element": "ダーク", "flavor_ja": "影でできた巨大なけもの。背中にほねの板がならぶ。地ひびきを立てて歩く。", "img": "gacha_dark/shadow-behemoth-dark35.png"}, {"id": "obsidian-hydra-dark36", "name_ja": "ダーク・コクヨウヒュドラ", "tier": "終盤", "element": "ダーク", "flavor_ja": "黒曜石のうろこを持つ三つ首の竜。三つの頭が別々にねらう。とても手ごわい。", "img": "gacha_dark/obsidian-hydra-dark36.png"}, {"id": "fungal-titan-dark37", "name_ja": "ダーク・キンシキョジン", "tier": "終盤", "element": "ダーク", "flavor_ja": "キノコと菌糸がかたまった巨人。肩に大きなキノコが生える。胞子で森をのみこむ。", "img": "gacha_dark/fungal-titan-dark37.png"}, {"id": "bone-colossus-dark38", "name_ja": "ダーク・ホネノキョヘイ", "tier": "終盤", "element": "ダーク", "flavor_ja": "無数のほねが組み上がった巨大戦士。角のあるどくろから紫の火が出る。", "img": "gacha_dark/bone-colossus-dark38.png"}, {"id": "obsidian-chimera-dark39", "name_ja": "ダーク・コクヨウキマイラ", "tier": "終盤", "element": "ダーク", "flavor_ja": "黒曜石をまとった合成獣。背中に二つめの頭、しっぽはヘビ。三つの力を持つ。", "img": "gacha_dark/obsidian-chimera-dark39.png"}, {"id": "rot-leviathan-worm-dark40", "name_ja": "ダーク・グサレオオミミズ", "tier": "終盤", "element": "ダーク", "flavor_ja": "くさった巨大なミミズ。まるい口にほねの歯がぐるりとならぶ。地面の中から現れる。", "img": "gacha_dark/rot-leviathan-worm-dark40.png"}, {"id": "shadow-revenant-knight-dark41b", "name_ja": "ダーク・ボウレイタイショウ", "tier": "終盤", "element": "ダーク", "flavor_ja": "骨と黒い鎧が一体になった亡霊の大将。兜のおくで紫の炎がもえる。死者の軍をひきいる。", "img": "gacha_dark/shadow-revenant-knight-dark41b.png"}, {"id": "obsidian-overlord-dark41", "name_ja": "ダーク・コクヨウマオウ", "tier": "終盤", "element": "ダーク", "flavor_ja": "黒曜石の鎧をまとった竜の王。むねに紫の力がながれる。王者の風格をはなつ。", "img": "gacha_dark/obsidian-overlord-dark41.png"}, {"id": "void-dragon-darkmaster", "name_ja": "ダーク・コクエンノシンリュウ", "tier": "ラスボス級", "element": "ダーク", "flavor_ja": "虚空の黒をまとった巨大な神竜。むねに紫の文字がもえ上がる。すべてを飲み込む闇の王。", "img": "gacha_dark/void-dragon-darkmaster.png"}, {"id": "plague-mother-darkboss02", "name_ja": "ダーク・エキビョウノハハ", "tier": "ラスボス級", "element": "ダーク", "flavor_ja": "病気をうみ出す巨大な女王虫。体ぜんたいが緑の病でひかる。たくさんの卵をかかえる。", "img": "gacha_dark/plague-mother-darkboss02.png"}, {"id": "bone-emperor-darkboss03", "name_ja": "ダーク・ホネノダイテイ", "tier": "ラスボス級", "element": "ダーク", "flavor_ja": "骨の玉座にすわる巨大な皇帝。王かんと紫の炎をいただく。死者の軍をひきいる。", "img": "gacha_dark/bone-emperor-darkboss03.png"}, {"id": "obsidian-leviathan-darkboss04", "name_ja": "ダーク・コクヨウノカイジュウ", "tier": "ラスボス級", "element": "ダーク", "flavor_ja": "黒曜石の巨大なよろいガニ。ハサミは家ほど大きい。ひびから紫のマグマ光がもれる。", "img": "gacha_dark/obsidian-leviathan-darkboss04.png"}, {"id": "shadow-archon-darkboss05", "name_ja": "ダーク・カゲノシハイシャ", "tier": "ラスボス級", "element": "ダーク", "flavor_ja": "影がかたまって生まれた支配者。よろいの中で紫の目が一つ光る。逃げ場をうばう。", "img": "gacha_dark/shadow-archon-darkboss05.png"}, {"id": "rot-god-darkboss06", "name_ja": "ダーク・フハイノカミ", "tier": "ラスボス級", "element": "ダーク", "flavor_ja": "腐敗から生まれた巨大な神獣。たくさんの目が緑に光る。ふれたものをくさらせる。", "img": "gacha_dark/rot-god-darkboss06.png"}, {"id": "obsidian-worldserpent-darkboss07", "name_ja": "ダーク・コクヨウノダイジャ", "tier": "ラスボス級", "element": "ダーク", "flavor_ja": "黒曜石の巨大なヘビ竜。とぐろを巻いて山のようにそびえる。にらまれると動けない。", "img": "gacha_dark/obsidian-worldserpent-darkboss07.png"}, {"id": "void-warlord-darkboss08", "name_ja": "ダーク・キョムノグンオウ", "tier": "ラスボス級", "element": "ダーク", "flavor_ja": "虚空の金属でできた巨大な軍王。むねの核が紫に光る。大剣の一振りで大地がさける。", "img": "gacha_dark/void-warlord-darkboss08.png"}]; const KEY="rika2_boss_swipe_gacha_dark";
let st=JSON.parse(localStorage.getItem(KEY)||"null")||{idx:0,dec:{}};
function save(){localStorage.setItem(KEY,JSON.stringify(st));}
const stage=document.getElementById("stage");
document.getElementById("total_n").textContent=BOSSES.length;
let card=null,startX=0,curX=0,dragging=false;

function counts(){const y=Object.values(st.dec).filter(v=>v==="yes").length;
  document.getElementById("done_n").textContent=Object.keys(st.dec).length;
  document.getElementById("yes_n").textContent=y;}

function build(idx){
  const b=BOSSES[idx]; const el=document.createElement("div"); el.className="card";
  el.innerHTML=`<div class="stamp yes">有り</div><div class="stamp no">無し</div>
    <div class="imgbox"><img src="${b.img}" alt=""></div>
    <div class="info"><div class="nm">${b.name_ja}<span class="tier t${b.tier}">${b.tier}</span></div>
    <div class="el">${b.element}</div><div class="fl">${b.flavor_ja}</div></div>`;
  el.addEventListener("pointerdown",down); el.addEventListener("pointermove",move);
  el.addEventListener("pointerup",up); el.addEventListener("pointercancel",up);
  return el;
}
function show(){
  if(card){card.remove();card=null;}
  if(st.idx>=BOSSES.length){document.getElementById("doneScreen").style.display="flex";finish();return;}
  document.getElementById("doneScreen").style.display="none";
  card=build(st.idx); stage.appendChild(card); counts();
}
function down(e){dragging=true;startX=e.clientX;curX=0;card.setPointerCapture(e.pointerId);card.style.transition="none";}
function move(e){if(!dragging)return;curX=e.clientX-startX;card.style.transform=`translateX(${curX}px) rotate(${curX/18}deg)`;
  card.querySelector(".yes").style.opacity=Math.max(0,Math.min(1,curX/90));
  card.querySelector(".no").style.opacity=Math.max(0,Math.min(1,-curX/90));}
function up(){if(!dragging)return;dragging=false;
  if(curX>90)decide("yes");else if(curX<-90)decide("no");
  else{card.style.transition=".2s";card.style.transform="";card.querySelector(".yes").style.opacity=0;card.querySelector(".no").style.opacity=0;}}
function decide(v){
  st.dec[BOSSES[st.idx].id]=v; save();
  const dir=v==="yes"?1:-1;
  card.style.transition=".3s ease-out";
  card.style.transform=`translateX(${dir*140}vw) rotate(${dir*25}deg)`;
  card.style.opacity="0";
  setTimeout(()=>{st.idx++;save();show();},260);
}
function undo(){if(st.idx<=0)return;st.idx--;delete st.dec[BOSSES[st.idx].id];save();show();}
function summaryText(){
  const yes=BOSSES.filter(b=>st.dec[b.id]==="yes"),no=BOSSES.filter(b=>st.dec[b.id]==="no");
  let s=`=== ボス選別 結果 (有り${yes.length} / 無し${no.length} / 計${BOSSES.length}) ===\n【有り】\n`;
  yes.forEach(b=>s+=`- ${b.name_ja} (${b.tier}/${b.element}) [${b.id}]\n`);
  s+="【無し】\n"; no.forEach(b=>s+=`- ${b.name_ja} (${b.tier}/${b.element}) [${b.id}]\n`);
  return s;
}
function finish(){
  const yes=BOSSES.filter(b=>st.dec[b.id]==="yes").length;
  document.getElementById("summary").textContent=`有り ${yes} 体 / 無し ${BOSSES.length-yes} 体`;
}
function copyOut(){const s=summaryText();const o=document.getElementById("out");o.style.display="block";o.value=s;
  if(navigator.clipboard)navigator.clipboard.writeText(s).then(()=>{const t=document.getElementById("toast");t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1500);},()=>{});o.select();}
document.getElementById("bNo").onclick=()=>{if(st.idx<BOSSES.length)decide("no");};
document.getElementById("bYes").onclick=()=>{if(st.idx<BOSSES.length)decide("yes");};
document.getElementById("bUndo").onclick=undo;
document.getElementById("bCopy").onclick=copyOut;
document.getElementById("copyBtn").onclick=copyOut;
document.getElementById("restartBtn").onclick=()=>{st={idx:0,dec:{}};save();show();};
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"&&st.idx<BOSSES.length)decide("no");
  else if(e.key==="ArrowRight"&&st.idx<BOSSES.length)decide("yes");else if(e.key==="Backspace")undo();});
show();
</script></body></html>
