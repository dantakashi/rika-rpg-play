<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>ボス選別 — 理科RPG2</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0f1014;color:#e7e7ea;font-family:system-ui,"Hiragino Kaku Gothic ProN",sans-serif;overflow:hidden;height:100dvh}
header{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;background:#1a1c22;border-bottom:1px solid #2c2f3a}
header b{color:#ffe27a}.count{font-size:13px;color:#9aa0ad}
.stage{position:relative;height:calc(100dvh - 150px);display:flex;align-items:center;justify-content:center;padding:10px}
.card{position:absolute;width:min(92vw,440px);max-height:100%;background:#1d1f26;border:1px solid #2c2f3a;border-radius:18px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5);touch-action:none}
.imgbox{aspect-ratio:1/1;
  background-image:linear-gradient(45deg,#cfcfcf 25%,transparent 25%),linear-gradient(-45deg,#cfcfcf 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#cfcfcf 75%),linear-gradient(-45deg,transparent 75%,#cfcfcf 75%);
  background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0;background-color:#e9e9e9}
.imgbox img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.info{padding:12px 16px}
.nm{font-size:22px;font-weight:800}
.nm .tier{font-size:14px;font-weight:700;padding:2px 10px;border-radius:999px;margin-left:8px;vertical-align:3px}
.t序盤{background:#2bd47a;color:#06210f}.t中盤{background:#4aa3ff;color:#04203f}.t終盤{background:#ff9a3c;color:#311600}.tラスボス級{background:#ff5a7a;color:#33000d}
.el{font-size:12px;color:#9aa0ad;margin-top:2px}
.fl{font-size:14px;color:#cfd3db;margin-top:8px;line-height:1.55}
.stamp{position:absolute;top:18px;font-size:34px;font-weight:900;padding:4px 14px;border:4px solid;border-radius:12px;opacity:0;transform:rotate(-15deg)}
.yes{left:18px;color:#2bd47a;border-color:#2bd47a}.no{right:18px;color:#ff5a7a;border-color:#ff5a7a}
.bar{position:fixed;bottom:0;left:0;right:0;height:90px;display:flex;align-items:center;justify-content:center;gap:22px;background:#13141a;border-top:1px solid #2c2f3a}
.fab{width:62px;height:62px;border-radius:50%;border:none;font-size:26px;cursor:pointer;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.fab.no{background:#2a1d23;color:#ff5a7a;border:2px solid #ff5a7a}.fab.yes{background:#16271c;color:#2bd47a;border:2px solid #2bd47a}
.fab.undo{width:48px;height:48px;font-size:18px;background:#23242c;color:#cfd3db;border:1px solid #3a3f4c}
.done{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.done h2{color:#ffe27a;margin:0 0 8px}
.btn{margin-top:14px;background:#ffe27a;color:#15161a;border:none;border-radius:10px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
#out{margin-top:12px;width:min(92vw,520px);height:160px;font-family:ui-monospace,monospace;font-size:11px;display:none;background:#0b0c10;color:#cfd3db;border:1px solid #3a3f4c;border-radius:8px;padding:8px}
.hint{font-size:11px;color:#6b7280;margin-top:6px}
.toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%);background:#2bd47a;color:#08210f;padding:8px 16px;border-radius:999px;font-weight:700;opacity:0;transition:.3s;pointer-events:none}.toast.show{opacity:1}
</style></head><body>
<header><div><b>ボス選別</b> <span style="font-size:12px;color:#9aa0ad">← 無し / 有り → ・ドラッグもOK</span></div>
  <div class="count"><span id="done_n">0</span>/<span id="total_n">0</span> ・有り<span id="yes_n">0</span></div></header>
<div class="stage" id="stage">
  <div class="done" id="doneScreen">
    <h2>選別おわり！</h2>
    <div id="summary" style="color:#cfd3db"></div>
    <button class="btn" id="copyBtn">結果をコピー</button>
    <div class="hint">コピーしたテキストをチャットに貼ってください（採用の系統を学習して次の50枚へ）。</div>
    <textarea id="out" readonly></textarea>
    <button class="btn" id="restartBtn" style="background:#3a3f4c;color:#e7e7ea">最初からやり直す</button>
  </div>
</div>
<div class="bar">
  <button class="fab no" id="bNo">✗</button>
  <button class="fab undo" id="bUndo">↶</button>
  <button class="fab yes" id="bYes">♥</button>
  <button class="btn" id="bCopy" style="position:fixed;right:12px;bottom:104px;padding:8px 12px;font-size:12px">途中保存コピー</button>
</div>
<div class="toast" id="toast">コピーしました！</div>
<script>
const BOSSES=[{"id": "acid-drip-slime-b22", "name_ja": "とけだしスライム", "tier": "序盤", "element": "酸", "flavor_ja": "ふれたものを溶かす酸性のスライム。体じゅうから泡を立て、ジュウと音がする。", "img": "gacha_b22/acid-drip-slime-b22.png"}, {"id": "iron-bead-ooze-b22", "name_ja": "てつくずスライム", "tier": "序盤", "element": "金属", "flavor_ja": "鉄くずを取りこんで重たくなったスライム。磁石にくっつくらしい。", "img": "gacha_b22/iron-bead-ooze-b22.png"}, {"id": "puyo-spore-jelly-b22", "name_ja": "ぷにほうし", "tier": "序盤", "element": "生物", "flavor_ja": "頭にコケのほうしを生やした、人なつっこい小さなゼリー。ぷにぷに弾む。", "img": "gacha_b22/puyo-spore-jelly-b22.png"}, {"id": "ferrofluid-spike-slime-b22", "name_ja": "じりょくスライム", "tier": "中盤", "element": "磁性", "flavor_ja": "磁力で全身にトゲを立てる黒い磁性流体のスライム。近づくと針が向く。", "img": "gacha_b22/ferrofluid-spike-slime-b22.png"}, {"id": "crystal-cluster-gel-b22", "name_ja": "けっしょうスライム", "tier": "中盤", "element": "結晶", "flavor_ja": "体の中で結晶が育ったスライム。光をうけて鉱物のようにきらめく。", "img": "gacha_b22/crystal-cluster-gel-b22.png"}, {"id": "voltage-plasma-ooze-b22", "name_ja": "でんりゅうスライム", "tier": "中盤", "element": "電気", "flavor_ja": "体内に電気をためこんだ黄色いスライム。さわると感電する。バチバチ鳴る。", "img": "gacha_b22/voltage-plasma-ooze-b22.png"}, {"id": "magma-core-slime-b22", "name_ja": "マグマスライム", "tier": "終盤", "element": "溶岩", "flavor_ja": "冷えた岩のからの下で溶岩が煮えたぎる巨大スライム。割れ目から赤い光がもれる。", "img": "gacha_b22/magma-core-slime-b22.png"}, {"id": "alloy-mimic-blob-b22", "name_ja": "ごうきんメタルス", "tier": "終盤", "element": "合金", "flavor_ja": "金属を溶かして取りこむ液体合金の塊。鏡のような体は剣をはじき返す。", "img": "gacha_b22/alloy-mimic-blob-b22.png"}, {"id": "neutralize-twin-king-b22", "name_ja": "ちゅうわキングスライム", "tier": "ラスボス級", "element": "酸", "flavor_ja": "酸とアルカリの体をあわせ持つ巨大なスライムの王。境目で中和がたえず泡立つ。", "img": "gacha_b22/neutralize-twin-king-b22.png"}, {"id": "primordial-ooze-leviathan-b22", "name_ja": "げんしスライムジャ", "tier": "ラスボス級", "element": "生物", "flavor_ja": "生命のはじまりの原始スープが意思をもった超巨大スライム。体内で無数の細胞がうごめく。", "img": "gacha_b22/primordial-ooze-leviathan-b22.png"}, {"id": "spark-goblin-scout-b22", "name_ja": "ビリビリゴブリン", "tier": "序盤", "element": "電気", "flavor_ja": "村はずれの送電線をかじって電気を覚えた小鬼。槍先のビリビリは触れた相手をしびれさせる。群れで現れる雑魚だが油断は禁物。", "img": "gacha_b22/spark-goblin-scout-b22.png"}, {"id": "acid-pot-kobold-b22", "name_ja": "すっぱツボコボルト", "tier": "序盤", "element": "化学", "flavor_ja": "酸の壺を抱えた小型のコボルト。中身は金属も溶かす。投げつけられると鎧がジュウジュウ溶ける。穴ぐらに大量発生。", "img": "gacha_b22/acid-pot-kobold-b22.png"}, {"id": "gear-armor-grunt-b22", "name_ja": "ハグルマこおに", "tier": "序盤", "element": "物理", "flavor_ja": "歯車を体に直接ボルト止めした小鬼。動くたび鎧がカチカチ回る。硬いが鈍重。新米冒険者の最初の壁。", "img": "gacha_b22/gear-armor-grunt-b22.png"}, {"id": "magnet-spear-orc-b22", "name_ja": "ジリョクオーク", "tier": "中盤", "element": "電気", "flavor_ja": "磁力で武器に鉄くずを吸い寄せ、棘だらけの槍にして振り回す中堅オーク。鉄製の鎧を着た相手ほど引き寄せられて不利。", "img": "gacha_b22/magnet-spear-orc-b22.png"}, {"id": "flame-flask-shaman-b22", "name_ja": "ほのおフラスコシャーマン", "tier": "中盤", "element": "化学", "flavor_ja": "薬品をフラスコで燃やして操る祈祷師ゴブリン。炎の色で威力が変わる。中盤の小ボス格で、群れを率いることも。", "img": "gacha_b22/flame-flask-shaman-b22.png"}, {"id": "ice-hammer-brute-b22", "name_ja": "こおりヅチオーク", "tier": "中盤", "element": "物理", "flavor_ja": "氷の塊を鎚にした重量級オーク。一撃が重く、当たると凍りつく。腕にも霜がびっしり張り付いている。中盤の壁。", "img": "gacha_b22/ice-hammer-brute-b22.png"}, {"id": "voltage-warlord-orc-b22", "name_ja": "ライデンオークロード", "tier": "終盤", "element": "電気", "flavor_ja": "雷をまとう小鬼たちの大将。鎧の電極から放たれる稲妻を身にまとう。配下のビリビリゴブリンを束ねる終盤の大物。", "img": "gacha_b22/voltage-warlord-orc-b22.png"}, {"id": "toxin-alchemist-hexer-b22", "name_ja": "もうどくレンキンゴブリン", "tier": "終盤", "element": "化学", "flavor_ja": "禁断の毒薬を生み出す錬金ゴブリン。体から立ちのぼる毒の霧が触れたものを蝕む。終盤に立ちはだかる狡猾な化学者。", "img": "gacha_b22/toxin-alchemist-hexer-b22.png"}, {"id": "great-gear-titan-king-b22", "name_ja": "キカイじかけのゴブリンキング", "tier": "ラスボス級", "element": "物理", "flavor_ja": "蒸気と歯車で全身を強化した小鬼たちの王。体に組み込まれた巨大な機械が回るたび地が揺れる。すべての小鬼を統べる機械仕掛けの王者。", "img": "gacha_b22/great-gear-titan-king-b22.png"}, {"id": "abyssal-reactor-overlord-b22", "name_ja": "ガンセキロのオーバーロード", "tier": "ラスボス級", "element": "電気", "flavor_ja": "胸に灼熱の炉心を埋め込んだ最強格のオーク王。割れた肌から漏れる光とプラズマが全身を駆けめぐる。膨大な力を制御しきれぬまま君臨する終局の支配者。", "img": "gacha_b22/abyssal-reactor-overlord-b22.png"}, {"id": "iron-scrap-golem-b22", "name_ja": "くずてつゴーレム", "tier": "序盤", "element": "金属", "flavor_ja": "捨てられた鉄くずが寄り集まって動き出したゴーレム。表面の赤さびは鉄が酸素と結びついた酸化鉄。重い拳でゆっくり殴ってくる。", "img": "gacha_b22/iron-scrap-golem-b22.png"}, {"id": "quartz-shard-construct-b22", "name_ja": "すいしょうガード", "tier": "序盤", "element": "結晶", "flavor_ja": "六角柱の水晶があつまってできた番人。光を屈折させてキラキラ光る。結晶は同じ形がくり返される規則正しさをもつ。", "img": "gacha_b22/quartz-shard-construct-b22.png"}, {"id": "clay-kiln-gargoyle-b22", "name_ja": "せっこうガーゴイル", "tier": "序盤", "element": "土", "flavor_ja": "粘土を高温の窯で焼いて固めたガーゴイル。焼くと土はかたく丈夫になる。背中の小さな翼はかざりで飛べない。", "img": "gacha_b22/clay-kiln-gargoyle-b22.png"}, {"id": "magnetite-sentinel-b22", "name_ja": "じてつのまもりて", "tier": "中盤", "element": "磁石", "flavor_ja": "天然の磁石である磁鉄鉱でできた守り手。体には鉄粉がびっしり貼りついている。N極とS極を持ち、鉄を引き寄せる。", "img": "gacha_b22/magnetite-sentinel-b22.png"}, {"id": "circuit-rune-armor-b22", "name_ja": "かいろのよろい", "tier": "中盤", "element": "回路", "flavor_ja": "中身は空っぽなのに動く鎧。表面の回路に電流が流れている。電気は導線の通り道を通ってぐるりと回る。", "img": "gacha_b22/circuit-rune-armor-b22.png"}, {"id": "alloy-forge-titan-b22", "name_ja": "ごうきんタイタン", "tier": "中盤", "element": "合金", "flavor_ja": "ちがう金属をとかして混ぜ合わせた合金のタイタン。混ぜると元の金属よりかたく丈夫になる。体の割れ目から溶けた金属がにじむ。", "img": "gacha_b22/alloy-forge-titan-b22.png"}, {"id": "obsidian-lava-colossus-b22", "name_ja": "ようがんコロッサス", "tier": "終盤", "element": "溶岩", "flavor_ja": "黒い火山岩と溶けた溶岩でできた巨像。地の底のマグマが冷えて固まると火山岩になる。体の割れ目から赤いマグマが流れる。", "img": "gacha_b22/obsidian-lava-colossus-b22.png"}, {"id": "tungsten-warden-gargoyle-b22", "name_ja": "ちょうこうガーゴイル", "tier": "終盤", "element": "超硬", "flavor_ja": "もっとも硬く溶けにくい金属タングステンで彫られたガーゴイル。重くて頑丈で、ふつうの炎ではびくともしない。刃のような縁を持つ。", "img": "gacha_b22/tungsten-warden-gargoyle-b22.png"}, {"id": "superconductor-aegis-king-b22", "name_ja": "ちょうでんどうのおうがい", "tier": "ラスボス級", "element": "超伝導", "flavor_ja": "ある温度まで冷やすと電気抵抗がゼロになる超伝導物質でできた王の鎧。流れた電気は永遠に止まらず体をめぐる。凍てつく霧をまとう。", "img": "gacha_b22/superconductor-aegis-king-b22.png"}, {"id": "primordial-bedrock-deity-b22", "name_ja": "だいちのいわがみ", "tier": "ラスボス級", "element": "鉱物", "flavor_ja": "惑星の大地そのものが神となった巨像。体は岩石・鉱石・結晶・とけた鉄の核が積み重なった地層になっている。山のように動かない。", "img": "gacha_b22/primordial-bedrock-deity-b22.png"}, {"id": "bone-shamble-pup-b22", "name_ja": "ホネコロ", "tier": "序盤", "element": "闇", "flavor_ja": "墓地の片隅でカタカタ動き出した子犬ほどの骨のかたまり。さびしがりやで、生きものの後をついてくる。", "img": "gacha_b22/bone-shamble-pup-b22.png"}, {"id": "moss-skull-toad-b22", "name_ja": "ドクロガエル", "tier": "序盤", "element": "毒", "flavor_ja": "沼の底で骨と化したカエル。鳴くたびに毒の霧を吐く、ぷっくり丸い小悪党。", "img": "gacha_b22/moss-skull-toad-b22.png"}, {"id": "frost-rib-crawler-b22", "name_ja": "コオリホネムシ", "tier": "序盤", "element": "氷", "flavor_ja": "凍った墓場でカサカサ這う、氷の殻をまとった骨の虫。冷たい息で足を凍らせる。", "img": "gacha_b22/frost-rib-crawler-b22.png"}, {"id": "obsidian-wraith-hound-b22", "name_ja": "クロガネレイ犬", "tier": "中盤", "element": "闇", "flavor_ja": "黒曜の骨でできた亡霊の猟犬。墓を守るために蘇り、紫の鬼火を眼にともす。", "img": "gacha_b22/obsidian-wraith-hound-b22.png"}, {"id": "gravity-tomb-golem-b22", "name_ja": "ハカイシゴーレム", "tier": "中盤", "element": "重力", "flavor_ja": "墓石とくさりが集まって動き出した重い石の番人。近づくものを重力で押しつぶす。", "img": "gacha_b22/gravity-tomb-golem-b22.png"}, {"id": "venom-bone-serpent-b22", "name_ja": "ドクボネヘビ", "tier": "中盤", "element": "毒", "flavor_ja": "骨だけになっても毒は消えない。とぐろを巻いて獲物を狙う、緑に光る骨の大蛇。", "img": "gacha_b22/venom-bone-serpent-b22.png"}, {"id": "glacier-lich-warden-b22", "name_ja": "ヒョウガのリッチ", "tier": "終盤", "element": "氷", "flavor_ja": "氷の墓所を統べる不死の魔術師。永遠の冷気をその骨に宿し、近づく者を凍てつかせる。", "img": "gacha_b22/glacier-lich-warden-b22.png"}, {"id": "shadow-bone-leviathan-b22", "name_ja": "ホネのリヴァイア", "tier": "終盤", "element": "闇", "flavor_ja": "古の獣が骨だけの巨獣となって甦った。闇をまとう骨の城のごとき威容。", "img": "gacha_b22/shadow-bone-leviathan-b22.png"}, {"id": "void-crown-sovereign-b22", "name_ja": "ムソウの骨王", "tier": "ラスボス級", "element": "重力", "flavor_ja": "すべての不死を統べる骨の王。その重力の威圧の前では、光すら膝をつく。", "img": "gacha_b22/void-crown-sovereign-b22.png"}, {"id": "plague-ossuary-titan-b22", "name_ja": "シガイのタイタン", "tier": "ラスボス級", "element": "毒", "flavor_ja": "無数のなきがらが寄り集まって生まれた巨像。歩くたびに毒の瘴気をまき散らす、骨の山の終末。", "img": "gacha_b22/plague-ossuary-titan-b22.png"}, {"id": "ember-cockatrice-spark-b22", "name_ja": "セキネツのコカトリス", "tier": "序盤", "element": "fire", "flavor_ja": "目を合わせると体温が一気に上がる。燃焼で熱が生まれるしくみを、にらみつけて教えてくる小型の幻獣。", "img": "gacha_b22/ember-cockatrice-spark-b22.png"}, {"id": "static-gryphon-cub-b22", "name_ja": "おびれの子グリフォン", "tier": "序盤", "element": "electric", "flavor_ja": "羽ばたくたびにパチッと火花。羽の先にたまった静電気で、こすれて電気が起きるしくみを見せてくれる。", "img": "gacha_b22/static-gryphon-cub-b22.png"}, {"id": "moss-troll-runt-b22", "name_ja": "コケむしのトロル", "tier": "序盤", "element": "earth", "flavor_ja": "じめじめした洞窟の主。体に菌類が住みつき、コケが養分を分解するすがたで分解者のはたらきを語る。", "img": "gacha_b22/moss-troll-runt-b22.png"}, {"id": "frost-manticore-glacier-b22", "name_ja": "ヒョウケツのマンティコア", "tier": "中盤", "element": "ice", "flavor_ja": "息を吐けば白く凍る。氷の結晶が規則正しく並ぶようすで、固体のつくりと状態変化を見せる中堅の幻獣。", "img": "gacha_b22/frost-manticore-glacier-b22.png"}, {"id": "magma-minotaur-forge-b22", "name_ja": "ようがんのミノタウロス", "tier": "中盤", "element": "fire", "flavor_ja": "炉のように熱い体。岩がとけてマグマになり、冷えて固まるしくみを、ふみしめる蹄で見せつける。", "img": "gacha_b22/magma-minotaur-forge-b22.png"}, {"id": "venom-cerberus-acid-b22", "name_ja": "さんえきのケルベロス", "tier": "中盤", "element": "poison", "flavor_ja": "三つの口からしたたる緑のしずく。酸が金属をとかすようすで、酸性の性質をうなり声とともに教える。", "img": "gacha_b22/venom-cerberus-acid-b22.png"}, {"id": "prism-dragon-refract-b22", "name_ja": "コウリンのドラゴン", "tier": "終盤", "element": "light", "flavor_ja": "うろこを通った光が七色に分かれる。プリズムで白い光がスペクトルに分かれるしくみを背負った荘厳な竜。", "img": "gacha_b22/prism-dragon-refract-b22.png"}, {"id": "gravity-chimera-collapse-b22", "name_ja": "じゅうりょくのキメラ", "tier": "終盤", "element": "dark", "flavor_ja": "近づくものを引きずり込む重い体。質量が大きいほど引く力が強い、その重さを三つの頭でうならせる。", "img": "gacha_b22/gravity-chimera-collapse-b22.png"}, {"id": "thunder-wyvern-sovereign-b22", "name_ja": "ライテイのワイバーン王", "tier": "ラスボス級", "element": "electric", "flavor_ja": "翼を打つたびに雷鳴がとどろく天空の覇者。電流が走り、放電で空気がさけるしくみを玉座から見おろす。", "img": "gacha_b22/thunder-wyvern-sovereign-b22.png"}, {"id": "primordial-hydra-genesis-b22", "name_ja": "ゲンショのヒュドラ", "tier": "ラスボス級", "element": "water", "flavor_ja": "切られても再び生える五つの首。細胞が分かれて再生するふしぎを、命の源の海から見せつける終局の魔獣。", "img": "gacha_b22/primordial-hydra-genesis-b22.png"}]; const KEY="rika2_boss_swipe_gacha_b22";
let st=JSON.parse(localStorage.getItem(KEY)||"null")||{idx:0,dec:{}};
function save(){localStorage.setItem(KEY,JSON.stringify(st));}
const stage=document.getElementById("stage");
document.getElementById("total_n").textContent=BOSSES.length;
let card=null,startX=0,curX=0,dragging=false;

function counts(){const y=Object.values(st.dec).filter(v=>v==="yes").length;
  document.getElementById("done_n").textContent=Object.keys(st.dec).length;
  document.getElementById("yes_n").textContent=y;}

function build(idx){
  const b=BOSSES[idx]; const el=document.createElement("div"); el.className="card";
  el.innerHTML=`<div class="stamp yes">有り</div><div class="stamp no">無し</div>
    <div class="imgbox"><img src="${b.img}" alt=""></div>
    <div class="info"><div class="nm">${b.name_ja}<span class="tier t${b.tier}">${b.tier}</span></div>
    <div class="el">${b.element}</div><div class="fl">${b.flavor_ja}</div></div>`;
  el.addEventListener("pointerdown",down); el.addEventListener("pointermove",move);
  el.addEventListener("pointerup",up); el.addEventListener("pointercancel",up);
  return el;
}
function show(){
  if(card){card.remove();card=null;}
  if(st.idx>=BOSSES.length){document.getElementById("doneScreen").style.display="flex";finish();return;}
  document.getElementById("doneScreen").style.display="none";
  card=build(st.idx); stage.appendChild(card); counts();
}
function down(e){dragging=true;startX=e.clientX;curX=0;card.setPointerCapture(e.pointerId);card.style.transition="none";}
function move(e){if(!dragging)return;curX=e.clientX-startX;card.style.transform=`translateX(${curX}px) rotate(${curX/18}deg)`;
  card.querySelector(".yes").style.opacity=Math.max(0,Math.min(1,curX/90));
  card.querySelector(".no").style.opacity=Math.max(0,Math.min(1,-curX/90));}
function up(){if(!dragging)return;dragging=false;
  if(curX>90)decide("yes");else if(curX<-90)decide("no");
  else{card.style.transition=".2s";card.style.transform="";card.querySelector(".yes").style.opacity=0;card.querySelector(".no").style.opacity=0;}}
function decide(v){
  st.dec[BOSSES[st.idx].id]=v; save();
  const dir=v==="yes"?1:-1;
  card.style.transition=".3s ease-out";
  card.style.transform=`translateX(${dir*140}vw) rotate(${dir*25}deg)`;
  card.style.opacity="0";
  setTimeout(()=>{st.idx++;save();show();},260);
}
function undo(){if(st.idx<=0)return;st.idx--;delete st.dec[BOSSES[st.idx].id];save();show();}
function summaryText(){
  const yes=BOSSES.filter(b=>st.dec[b.id]==="yes"),no=BOSSES.filter(b=>st.dec[b.id]==="no");
  let s=`=== ボス選別 結果 (有り${yes.length} / 無し${no.length} / 計${BOSSES.length}) ===\n【有り】\n`;
  yes.forEach(b=>s+=`- ${b.name_ja} (${b.tier}/${b.element}) [${b.id}]\n`);
  s+="【無し】\n"; no.forEach(b=>s+=`- ${b.name_ja} (${b.tier}/${b.element}) [${b.id}]\n`);
  return s;
}
function finish(){
  const yes=BOSSES.filter(b=>st.dec[b.id]==="yes").length;
  document.getElementById("summary").textContent=`有り ${yes} 体 / 無し ${BOSSES.length-yes} 体`;
}
function copyOut(){const s=summaryText();const o=document.getElementById("out");o.style.display="block";o.value=s;
  if(navigator.clipboard)navigator.clipboard.writeText(s).then(()=>{const t=document.getElementById("toast");t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1500);},()=>{});o.select();}
document.getElementById("bNo").onclick=()=>{if(st.idx<BOSSES.length)decide("no");};
document.getElementById("bYes").onclick=()=>{if(st.idx<BOSSES.length)decide("yes");};
document.getElementById("bUndo").onclick=undo;
document.getElementById("bCopy").onclick=copyOut;
document.getElementById("copyBtn").onclick=copyOut;
document.getElementById("restartBtn").onclick=()=>{st={idx:0,dec:{}};save();show();};
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"&&st.idx<BOSSES.length)decide("no");
  else if(e.key==="ArrowRight"&&st.idx<BOSSES.length)decide("yes");else if(e.key==="Backspace")undo();});
show();
</script></body></html>
