<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>ボス選別 — 理科RPG2</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0f1014;color:#e7e7ea;font-family:system-ui,"Hiragino Kaku Gothic ProN",sans-serif;overflow:hidden;height:100dvh}
header{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;background:#1a1c22;border-bottom:1px solid #2c2f3a}
header b{color:#ffe27a}.count{font-size:13px;color:#9aa0ad}
.stage{position:relative;height:calc(100dvh - 150px);display:flex;align-items:center;justify-content:center;padding:10px}
.card{position:absolute;width:min(92vw,440px);max-height:100%;background:#1d1f26;border:1px solid #2c2f3a;border-radius:18px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5);touch-action:none}
.imgbox{aspect-ratio:1/1;
  background-image:linear-gradient(45deg,#cfcfcf 25%,transparent 25%),linear-gradient(-45deg,#cfcfcf 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#cfcfcf 75%),linear-gradient(-45deg,transparent 75%,#cfcfcf 75%);
  background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0;background-color:#e9e9e9}
.imgbox img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.info{padding:12px 16px}
.nm{font-size:22px;font-weight:800}
.nm .tier{font-size:14px;font-weight:700;padding:2px 10px;border-radius:999px;margin-left:8px;vertical-align:3px}
.t序盤{background:#2bd47a;color:#06210f}.t中盤{background:#4aa3ff;color:#04203f}.t終盤{background:#ff9a3c;color:#311600}.tラスボス級{background:#ff5a7a;color:#33000d}
.el{font-size:12px;color:#9aa0ad;margin-top:2px}
.fl{font-size:14px;color:#cfd3db;margin-top:8px;line-height:1.55}
.stamp{position:absolute;top:18px;font-size:34px;font-weight:900;padding:4px 14px;border:4px solid;border-radius:12px;opacity:0;transform:rotate(-15deg)}
.yes{left:18px;color:#2bd47a;border-color:#2bd47a}.no{right:18px;color:#ff5a7a;border-color:#ff5a7a}
.bar{position:fixed;bottom:0;left:0;right:0;height:90px;display:flex;align-items:center;justify-content:center;gap:22px;background:#13141a;border-top:1px solid #2c2f3a}
.fab{width:62px;height:62px;border-radius:50%;border:none;font-size:26px;cursor:pointer;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.fab.no{background:#2a1d23;color:#ff5a7a;border:2px solid #ff5a7a}.fab.yes{background:#16271c;color:#2bd47a;border:2px solid #2bd47a}
.fab.undo{width:48px;height:48px;font-size:18px;background:#23242c;color:#cfd3db;border:1px solid #3a3f4c}
.done{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.done h2{color:#ffe27a;margin:0 0 8px}
.btn{margin-top:14px;background:#ffe27a;color:#15161a;border:none;border-radius:10px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
#out{margin-top:12px;width:min(92vw,520px);height:160px;font-family:ui-monospace,monospace;font-size:11px;display:none;background:#0b0c10;color:#cfd3db;border:1px solid #3a3f4c;border-radius:8px;padding:8px}
.hint{font-size:11px;color:#6b7280;margin-top:6px}
.toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%);background:#2bd47a;color:#08210f;padding:8px 16px;border-radius:999px;font-weight:700;opacity:0;transition:.3s;pointer-events:none}.toast.show{opacity:1}
</style></head><body>
<header><div><b>ボス選別</b> <span style="font-size:12px;color:#9aa0ad">← 無し / 有り → ・ドラッグもOK</span></div>
  <div class="count"><span id="done_n">0</span>/<span id="total_n">0</span> ・有り<span id="yes_n">0</span></div></header>
<div class="stage" id="stage">
  <div class="done" id="doneScreen">
    <h2>選別おわり！</h2>
    <div id="summary" style="color:#cfd3db"></div>
    <button class="btn" id="copyBtn">結果をコピー</button>
    <div class="hint">コピーしたテキストをチャットに貼ってください（採用の系統を学習して次の50枚へ）。</div>
    <textarea id="out" readonly></textarea>
    <button class="btn" id="restartBtn" style="background:#3a3f4c;color:#e7e7ea">最初からやり直す</button>
  </div>
</div>
<div class="bar">
  <button class="fab no" id="bNo">✗</button>
  <button class="fab undo" id="bUndo">↶</button>
  <button class="fab yes" id="bYes">♥</button>
  <button class="btn" id="bCopy" style="position:fixed;right:12px;bottom:104px;padding:8px 12px;font-size:12px">途中保存コピー</button>
</div>
<div class="toast" id="toast">コピーしました！</div>
<script>
const BOSSES=[{"id": "thunder-king-aegis-n4", "name_ja": "雷帝アイギオン", "tier": "終盤", "element": "でんき", "flavor_ja": "四つの腕に砕けた雷霆をにぎる雷神。鎧の継ぎ目を稲妻が這い、肩には嵐の雲をまとう。電気のエネルギーを学べ。", "img": "gacha_n4/thunder-king-aegis-n4.png"}, {"id": "abyssal-sea-sovereign-n4", "name_ja": "深海帝コリュンドス", "tier": "終盤", "element": "みず", "flavor_ja": "触手を地に据える海神。肩から海水と白い泡があふれ落ち、銛をかまえる。水と圧力の力をおさめよ。", "img": "gacha_n4/abyssal-sea-sovereign-n4.png"}, {"id": "underworld-warden-n4", "name_ja": "冥府番ネクロアス", "tier": "ラスボス級", "element": "やみ", "flavor_ja": "六つの腕に黒き双股槍と鍵をにぎる冥府の神。肋を青白い魂の炎が這う。光と影、エネルギーの行方を見極めよ。", "img": "gacha_n4/underworld-warden-n4.png"}, {"id": "war-god-bronzehelm-n4", "name_ja": "戦神ブロンテオス", "tier": "中盤", "element": "ほのお", "flavor_ja": "焦げた青銅をまとう戦神。鎧の裂け目から溶けた金属がにじむ。燃焼と金属、化学の力を試せ。", "img": "gacha_n4/war-god-bronzehelm-n4.png"}, {"id": "dawn-radiant-archer-n4", "name_ja": "暁光神ヘリオデス", "tier": "中盤", "element": "ひかり", "flavor_ja": "金の翼を畳む光の神。胸から放たれる光が腕に密着して輝く。光の屈折と速さの謎を解け。", "img": "gacha_n4/dawn-radiant-archer-n4.png"}, {"id": "harvest-titan-stonewreath-n4", "name_ja": "豊穣巨神ガイオラ", "tier": "序盤", "element": "つち", "flavor_ja": "苔むす花崗岩の巨神。胸からあふれる土と泉が腕にしたたる。大地と岩石、地学の入口を歩け。", "img": "gacha_n4/harvest-titan-stonewreath-n4.png"}, {"id": "hearth-flame-keeper-n4", "name_ja": "炉火神ヘスタリア", "tier": "序盤", "element": "ほのお", "flavor_ja": "胸に炉をいだく炉火の神。やわらかな炎と煙が肩をショールのように包む。火と熱、燃焼のはじまりを灯せ。", "img": "gacha_n4/hearth-flame-keeper-n4.png"}, {"id": "winged-messenger-mercurio-n4", "name_ja": "伝令神メルクリオ", "tier": "序盤", "element": "かぜ", "flavor_ja": "足首に翼をたたむ伝令の神。銀の風が体に帯のように密着する。速さと運動、力のつり合いを知れ。", "img": "gacha_n4/winged-messenger-mercurio-n4.png"}, {"id": "primordial-titan-chronarch-n4", "name_ja": "原初巨神クロナルク", "tier": "ラスボス級", "element": "むめい", "flavor_ja": "星石と歯車でできた原初の巨神。胸に星雲と機構が渦巻き、宇宙の光が腕に密着する。時と天体、終局を見据えよ。", "img": "gacha_n4/primordial-titan-chronarch-n4.png"}, {"id": "moonlit-huntress-selvana-n4", "name_ja": "月狩神セルヴァナ", "tier": "中盤", "element": "こおり", "flavor_ja": "三日月の弓をひく月の女神。冷たい月光と霜が腕に氷膜のように密着する。光の反射と状態変化を狩れ。", "img": "gacha_n4/moonlit-huntress-selvana-n4.png"}, {"id": "rune-carved-storm-herald-n4", "name_ja": "ルーンのいくさめがらす", "tier": "序盤", "element": "雷光", "flavor_ja": "戦いの神に仕える、よろいを着たいくさ烏。からだのルーンが青く光ると、羽根のすきまから小さな稲妻がぱちぱちはぜる。", "img": "gacha_n4/rune-carved-storm-herald-n4.png"}, {"id": "frost-mail-shieldmaiden-wight-n4", "name_ja": "こおりのたてめいど", "tier": "序盤", "element": "氷霜", "flavor_ja": "凍てつく北の地で討たれた戦乙女のなれの果て。鎧にびっしりと霜をまとい、息は白い冷気となって肩を包む。", "img": "gacha_n4/frost-mail-shieldmaiden-wight-n4.png"}, {"id": "bog-king-antlered-druid-n4", "name_ja": "ぬまの王かんむり", "tier": "序盤", "element": "毒沼", "flavor_ja": "ケルトの古い沼を守る、角の生えた森の主。体からは毒の沼気がもれ、ふれた草を緑色に腐らせる。", "img": "gacha_n4/bog-king-antlered-druid-n4.png"}, {"id": "thunder-gauntlet-warforged-n4", "name_ja": "らいごうのいくさがみ", "tier": "中盤", "element": "雷鳴", "flavor_ja": "雷を握りしめる四本腕の戦神。鎧の上を白い稲妻が這い、こぶしを打ち合わせると、空が割れるような雷鳴がとどろく。", "img": "gacha_n4/thunder-gauntlet-warforged-n4.png"}, {"id": "valkyrie-stormwing-seraph-n4", "name_ja": "せんおとめストルムウィング", "tier": "中盤", "element": "嵐風", "flavor_ja": "戦場の死者をえらぶ天空の戦乙女。鋼の翼を背にたたみ、体には嵐の渦と火花がまとわりつく。槍をかまえる姿は荘厳そのもの。", "img": "gacha_n4/valkyrie-stormwing-seraph-n4.png"}, {"id": "carnyx-roar-war-goddess-n4", "name_ja": "いくさのめがみモリガン型", "tier": "中盤", "element": "戦塵", "flavor_ja": "三つの顔をもつケルトの戦の女神。肩には黒い羽根のマントがまとわりつき、体のまわりを赤い戦塵と烏の羽が渦巻く。", "img": "gacha_n4/carnyx-roar-war-goddess-n4.png"}, {"id": "geyser-jotun-frost-giant-n4", "name_ja": "みなもとのきょじんヨトゥン", "tier": "終盤", "element": "氷蒸気", "flavor_ja": "氷と岩でできた山のような巨人。体のひびから凍える蒸気がふき出し、肩にまとわりつく。一歩あるくたびに大地が凍りつく。", "img": "gacha_n4/geyser-jotun-frost-giant-n4.png"}, {"id": "iron-tusked-boar-of-the-hunt-n4", "name_ja": "おうごんのいくさいのしし", "tier": "終盤", "element": "黄金雷", "flavor_ja": "神々の狩りに駆る黄金のいくさ猪。背の毛は金色に輝き、鉄の牙からは雷火が散る。低くかまえた姿はまさに突進寸前。", "img": "gacha_n4/iron-tusked-boar-of-the-hunt-n4.png"}, {"id": "allfather-raven-throne-deity-n4", "name_ja": "もろはのおうカラスのみたま", "tier": "ラスボス級", "element": "知の雷", "flavor_ja": "片目を捧げ、すべての知を得た主神の化身。黒い大鴉のマントを背に、体には輝くルーン文字と稲妻がまとわりつく。荘厳にして近寄りがたい巨神。", "img": "gacha_n4/allfather-raven-throne-deity-n4.png"}, {"id": "world-serpent-warden-titan-n4", "name_ja": "せかいをだくよろいへびおう", "tier": "ラスボス級", "element": "海雷", "flavor_ja": "世界をぐるりと取り巻くと伝わる、よろいをまとった海蛇の神。体をきつくとぐろに巻いて立ち、鱗の上を青い海の雷と毒の霧が走る。", "img": "gacha_n4/world-serpent-warden-titan-n4.png"}, {"id": "jackal-warden-of-the-scales-n4", "name_ja": "アヌバステト", "tier": "序盤", "element": "土", "flavor_ja": "魂の重さをはかる、犬の頭をもつ砂漠の番神。天秤はけっして傾かない。", "img": "gacha_n4/jackal-warden-of-the-scales-n4.png"}, {"id": "falcon-sky-judge-n4", "name_ja": "ホルファルク", "tier": "序盤", "element": "風", "flavor_ja": "空の裁きをくだす隼神。風をまとった四本の槍は決して的を外さない。", "img": "gacha_n4/falcon-sky-judge-n4.png"}, {"id": "lioness-flame-warden-n4", "name_ja": "セクメグナ", "tier": "序盤", "element": "火", "flavor_ja": "怒りの吐息で病をやく雌獅子の女神。たてがみそのものが炎でできている。", "img": "gacha_n4/lioness-flame-warden-n4.png"}, {"id": "ibis-tide-arbiter-n4", "name_ja": "トトメリス", "tier": "中盤", "element": "水", "flavor_ja": "知のことばを記す朱鷺神。流れる水で時の流れすら書きかえる。", "img": "gacha_n4/ibis-tide-arbiter-n4.png"}, {"id": "cobra-naga-empress-n4", "name_ja": "ナーガディヤ", "tier": "中盤", "element": "毒", "flavor_ja": "七つの蛇頭をいただく毒の女帝。六本の腕がたわむれに毒をしたたらせる。", "img": "gacha_n4/cobra-naga-empress-n4.png"}, {"id": "six-arm-storm-asura-n4", "name_ja": "ラセツアスラ", "tier": "中盤", "element": "雷", "flavor_ja": "三つの顔と六つの腕で嵐をふるう戦神。打ち鳴らす太鼓が雷鳴をよぶ。", "img": "gacha_n4/six-arm-storm-asura-n4.png"}, {"id": "primeval-salt-leviathaness-n4", "name_ja": "ティアマーレ", "tier": "終盤", "element": "水", "flavor_ja": "万物を生んだ原初の海の母神。塩の渦をまとい、八本の腕で運命の石板をにぎる。", "img": "gacha_n4/primeval-salt-leviathaness-n4.png"}, {"id": "plague-storm-archfiend-n4", "name_ja": "パズーゴル", "tier": "終盤", "element": "風", "flavor_ja": "熱病の南風をはこぶ魔神。けものと猛禽が入りまじった異形の体から悪疫がしたたる。", "img": "gacha_n4/plague-storm-archfiend-n4.png"}, {"id": "scarab-sun-colossus-n4", "name_ja": "ケプリオーン", "tier": "ラスボス級", "element": "光", "flavor_ja": "昇る朝日そのものを運ぶ甲虫頭の巨神。六本の腕で太陽をかかげ、夜を焼きはらう。", "img": "gacha_n4/scarab-sun-colossus-n4.png"}, {"id": "omega-godking-of-the-many-arms-n4", "name_ja": "オメガ・デヴァ", "tier": "ラスボス級", "element": "無", "flavor_ja": "千の手をもつ究極の神王。四つの顔と十二の腕で創造と破壊をかねそなえる、終焉の異神。", "img": "gacha_n4/omega-godking-of-the-many-arms-n4.png"}, {"id": "ashura-six-arm-warlord-n4", "name_ja": "六臂の修羅王アシュラント", "tier": "中盤", "element": "闘気", "flavor_ja": "三つの顔は怒・闘・哀。六本の腕がそれぞれ得物を構え、闘気が腕に巻きつく。理科の問いに答えるたび、修羅は一つ表情を変える。", "img": "gacha_n4/ashura-six-arm-warlord-n4.png"}, {"id": "rakshasa-tiger-maw-eater-n4", "name_ja": "羅刹の喰王ラクシャ＝ヴァール", "tier": "終盤", "element": "呪詛", "flavor_ja": "人を喰らう森の羅刹。獣の頭に四本の腕、肌を這う呪いの紋様。喰われたくなければ、知識で身を守れ。", "img": "gacha_n4/rakshasa-tiger-maw-eater-n4.png"}, {"id": "ifrit-emberforge-titan-n4", "name_ja": "焔神イフリーテ・ガルム", "tier": "終盤", "element": "業火", "flavor_ja": "煙の中から立ち上る焔の魔神。肌の下を溶岩が流れ、肩には燻る煙のたてがみ。地獄絵図ではない、ただ静かに灼ける神威。", "img": "gacha_n4/ifrit-emberforge-titan-n4.png"}, {"id": "jinn-brass-bound-djinn-n4", "name_ja": "封印の魔人ジンナ＝カウル", "tier": "序盤", "element": "黄銅", "flavor_ja": "壺に封じられし黄銅の魔人。手枷の封印が淡く光る。下半身は渦巻く霧が地に固まり、どっしりと座す。", "img": "gacha_n4/jinn-brass-bound-djinn-n4.png"}, {"id": "kishin-thunder-ogre-king-n4", "name_ja": "鬼神ライゴウ＝オーガ", "tier": "中盤", "element": "雷鳴", "flavor_ja": "雷を纏う鬼神。骨の角、鉄の金棒、肩を這う稲妻。和の妖魔のなかでも別格の荘厳さで生徒を試す。", "img": "gacha_n4/kishin-thunder-ogre-king-n4.png"}, {"id": "fallen-seraph-six-wing-n4", "name_ja": "堕天使ネファリエル", "tier": "ラスボス級", "element": "堕光", "flavor_ja": "光を失った六枚翼の熾天使。割れた後光、煤けた羽、錆びた荘厳な甲冑。哀しみを湛えて静かに裁きを下す最強格。", "img": "gacha_n4/fallen-seraph-six-wing-n4.png"}, {"id": "maou-throne-horned-devil-n4", "name_ja": "魔王ガルゴルディウス", "tier": "ラスボス級", "element": "魔威", "flavor_ja": "枝角の冠を戴く四腕の魔王。鎧と鱗が一体化し、纏う影は肩からマントのごとく垂れる。全てを統べる最終格。", "img": "gacha_n4/maou-throne-horned-devil-n4.png"}, {"id": "yaksha-stone-sentinel-fiend-n4", "name_ja": "夜叉ヴィドラ＝ガン", "tier": "序盤", "element": "石牙", "flavor_ja": "寺門を守りし石肌の夜叉。出目に牙、突き出た腹、玉の光を纏う拳。序盤の門番として生徒の前に立ちはだかる。", "img": "gacha_n4/yaksha-stone-sentinel-fiend-n4.png"}, {"id": "preta-hunger-wraith-n4", "name_ja": "餓鬼憑きグレズマ", "tier": "序盤", "element": "飢餓", "flavor_ja": "満たされぬ飢えの亡者。腫れた腹に細い手足、欠けた鉢を抱える。口から漏れる飢餓の靄が顎に纏わりつく序盤の鬼。", "img": "gacha_n4/preta-hunger-wraith-n4.png"}, {"id": "asura-storm-vajra-deva-n4", "name_ja": "阿修羅雷帝アシュヴァジュラ", "tier": "終盤", "element": "金剛雷", "flavor_ja": "金剛杵を握る三面四臂の雷帝。金色の肌に蒼玉の宝冠、腕に這う金雷。神々しき阿修羅として終盤の試練を司る。", "img": "gacha_n4/asura-storm-vajra-deva-n4.png"}, {"id": "acolyte-shieldwarden-n4", "name_ja": "守りの盾兵ガルディン", "tier": "序盤", "element": "光", "flavor_ja": "見習いの盾兵。光の加護をまとい、まだ小さな体で前線を守る。光は反射して四方へ広がる——盾の表面はまさに光の反射の教材だ。", "img": "gacha_n4/acolyte-shieldwarden-n4.png"}, {"id": "spark-page-valkyrie-n4", "name_ja": "雷光の従騎士ヴェルナ", "tier": "序盤", "element": "雷", "flavor_ja": "雷をまとう若き従騎士。槍を伝う火花は導体の銅から散る。まだ半人前だが、雷の道は確かに彼女の体を流れている。", "img": "gacha_n4/spark-page-valkyrie-n4.png"}, {"id": "moss-warden-sentinel-n4", "name_ja": "苔むす番兵モスガード", "tier": "序盤", "element": "草", "flavor_ja": "森を見守る古い石の番兵。岩肌に根を張った苔は、岩が風化して土になる過程そのもの。動かぬ守りの象徴。", "img": "gacha_n4/moss-warden-sentinel-n4.png"}, {"id": "molten-anvil-paladin-n4", "name_ja": "熔鉄の聖騎士イグナル", "tier": "中盤", "element": "炎", "flavor_ja": "鍛冶炉の守護を担う熔鉄の聖騎士。鎧の溝を流れる橙の光は、固体の鉄が熱で液体へ変わる融解の証。槌を下ろせば大地が鳴る。", "img": "gacha_n4/molten-anvil-paladin-n4.png"}, {"id": "frost-bulwark-colossus-n4", "name_ja": "氷塁の守護巨人フリゲル", "tier": "中盤", "element": "氷", "flavor_ja": "万年雪の砦を守る氷の巨人。体を覆う霜は水蒸気が冷えて凍りつく昇華・凝固のあらわれ。決して退かぬ守りの壁。", "img": "gacha_n4/frost-bulwark-colossus-n4.png"}, {"id": "thunderforge-myrmidon-n4", "name_ja": "雷鍛の重騎ケラウン", "tier": "中盤", "element": "雷", "flavor_ja": "四腕に雷を宿す雷鍛の半神。鎧を走る金の象嵌は電気をよく通す導体。稲妻は体の回路を巡り、決して外へ逃げない。", "img": "gacha_n4/thunderforge-myrmidon-n4.png"}, {"id": "aegis-lionheart-guardian-n4", "name_ja": "獅子頭の守護神アイギオン", "tier": "終盤", "element": "光", "flavor_ja": "陽光を司る獅子頭の守護神。後光は層をなす光の輪——光が幾重にも重なるさまを纏う。四腕に槍と盾を構え、悪を寄せつけぬ終盤の壁。", "img": "gacha_n4/aegis-lionheart-guardian-n4.png"}, {"id": "abyssal-fallen-templar-n4", "name_ja": "堕ちた聖堂騎士ノクスファル", "tier": "終盤", "element": "闇", "flavor_ja": "信を喪い堕ちた聖堂騎士。割れた後光と体を這う亡霊の炎は、冷たく洗練された闇。地獄火ではない——骨と呪いの静かな絶望。", "img": "gacha_n4/abyssal-fallen-templar-n4.png"}, {"id": "world-pillar-titan-throne-n4", "name_ja": "世界柱の巨神アトラント", "tier": "ラスボス級", "element": "地", "flavor_ja": "天と地を支える世界柱の巨神。体を裂く金の割れ目はプレートのひずみ、纏う輝きは重力。六腕で天球を担い、揺るがぬ終末の守護者。", "img": "gacha_n4/world-pillar-titan-throne-n4.png"}, {"id": "empyrean-archseraph-sovereign-n4", "name_ja": "天稟の大守護神エンピレオ", "tier": "ラスボス級", "element": "光", "flavor_ja": "天の頂に立つ多翼の大守護神。翼を透ける光は屈折してプリズムの色に分かれる。四腕に剣・盾・天秤・角笛を携え、世界の理を裁く最終守護者。", "img": "gacha_n4/empyrean-archseraph-sovereign-n4.png"}]; const KEY="rika2_boss_swipe_gacha_n4";
let st=JSON.parse(localStorage.getItem(KEY)||"null")||{idx:0,dec:{}};
function save(){localStorage.setItem(KEY,JSON.stringify(st));}
const stage=document.getElementById("stage");
document.getElementById("total_n").textContent=BOSSES.length;
let card=null,startX=0,curX=0,dragging=false;

function counts(){const y=Object.values(st.dec).filter(v=>v==="yes").length;
  document.getElementById("done_n").textContent=Object.keys(st.dec).length;
  document.getElementById("yes_n").textContent=y;}

function build(idx){
  const b=BOSSES[idx]; const el=document.createElement("div"); el.className="card";
  el.innerHTML=`<div class="stamp yes">有り</div><div class="stamp no">無し</div>
    <div class="imgbox"><img src="${b.img}" alt=""></div>
    <div class="info"><div class="nm">${b.name_ja}<span class="tier t${b.tier}">${b.tier}</span></div>
    <div class="el">${b.element}</div><div class="fl">${b.flavor_ja}</div></div>`;
  el.addEventListener("pointerdown",down); el.addEventListener("pointermove",move);
  el.addEventListener("pointerup",up); el.addEventListener("pointercancel",up);
  return el;
}
function show(){
  if(card){card.remove();card=null;}
  if(st.idx>=BOSSES.length){document.getElementById("doneScreen").style.display="flex";finish();return;}
  document.getElementById("doneScreen").style.display="none";
  card=build(st.idx); stage.appendChild(card); counts();
}
function down(e){dragging=true;startX=e.clientX;curX=0;card.setPointerCapture(e.pointerId);card.style.transition="none";}
function move(e){if(!dragging)return;curX=e.clientX-startX;card.style.transform=`translateX(${curX}px) rotate(${curX/18}deg)`;
  card.querySelector(".yes").style.opacity=Math.max(0,Math.min(1,curX/90));
  card.querySelector(".no").style.opacity=Math.max(0,Math.min(1,-curX/90));}
function up(){if(!dragging)return;dragging=false;
  if(curX>90)decide("yes");else if(curX<-90)decide("no");
  else{card.style.transition=".2s";card.style.transform="";card.querySelector(".yes").style.opacity=0;card.querySelector(".no").style.opacity=0;}}
function decide(v){
  st.dec[BOSSES[st.idx].id]=v; save();
  const dir=v==="yes"?1:-1;
  card.style.transition=".3s ease-out";
  card.style.transform=`translateX(${dir*140}vw) rotate(${dir*25}deg)`;
  card.style.opacity="0";
  setTimeout(()=>{st.idx++;save();show();},260);
}
function undo(){if(st.idx<=0)return;st.idx--;delete st.dec[BOSSES[st.idx].id];save();show();}
function summaryText(){
  const yes=BOSSES.filter(b=>st.dec[b.id]==="yes"),no=BOSSES.filter(b=>st.dec[b.id]==="no");
  let s=`=== ボス選別 結果 (有り${yes.length} / 無し${no.length} / 計${BOSSES.length}) ===\n【有り】\n`;
  yes.forEach(b=>s+=`- ${b.name_ja} (${b.tier}/${b.element}) [${b.id}]\n`);
  s+="【無し】\n"; no.forEach(b=>s+=`- ${b.name_ja} (${b.tier}/${b.element}) [${b.id}]\n`);
  return s;
}
function finish(){
  const yes=BOSSES.filter(b=>st.dec[b.id]==="yes").length;
  document.getElementById("summary").textContent=`有り ${yes} 体 / 無し ${BOSSES.length-yes} 体`;
}
function copyOut(){const s=summaryText();const o=document.getElementById("out");o.style.display="block";o.value=s;
  if(navigator.clipboard)navigator.clipboard.writeText(s).then(()=>{const t=document.getElementById("toast");t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1500);},()=>{});o.select();}
document.getElementById("bNo").onclick=()=>{if(st.idx<BOSSES.length)decide("no");};
document.getElementById("bYes").onclick=()=>{if(st.idx<BOSSES.length)decide("yes");};
document.getElementById("bUndo").onclick=undo;
document.getElementById("bCopy").onclick=copyOut;
document.getElementById("copyBtn").onclick=copyOut;
document.getElementById("restartBtn").onclick=()=>{st={idx:0,dec:{}};save();show();};
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"&&st.idx<BOSSES.length)decide("no");
  else if(e.key==="ArrowRight"&&st.idx<BOSSES.length)decide("yes");else if(e.key==="Backspace")undo();});
show();
</script></body></html>
