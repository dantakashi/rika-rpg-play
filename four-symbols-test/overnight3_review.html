<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>夜間ボスまとめ選別3(系統拡充) — 理科RPG2</title><style>
:root{color-scheme:dark}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0f1014;color:#e7e7ea;font-family:system-ui,sans-serif;overflow:hidden;height:100dvh}
header{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;background:#1a1c22;border-bottom:1px solid #2c2f3a}
header b{color:#ffe27a}.count{font-size:13px;color:#9aa0ad}
.stage{position:relative;height:calc(100dvh - 150px);display:flex;align-items:center;justify-content:center;padding:10px}
.card{position:absolute;width:min(92vw,440px);max-height:100%;background:#1d1f26;border:1px solid #2c2f3a;border-radius:18px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5);touch-action:none}
.imgbox{aspect-ratio:1/1;background-image:linear-gradient(45deg,#cfcfcf 25%,transparent 25%),linear-gradient(-45deg,#cfcfcf 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#cfcfcf 75%),linear-gradient(-45deg,transparent 75%,#cfcfcf 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0;background-color:#e9e9e9}
.imgbox img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.info{padding:12px 16px}.nm{font-size:22px;font-weight:800}
.nm .tier{font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;margin-left:8px;vertical-align:3px}
.t序盤{background:#2bd47a;color:#06210f}.t中盤{background:#4aa3ff;color:#04203f}.t終盤{background:#ff9a3c;color:#311600}.tラスボス級{background:#ff5a7a;color:#33000d}
.el{font-size:12px;color:#9aa0ad;margin-top:2px}.bt{font-size:11px;color:#8a8f9c;margin-top:4px}
.stamp{position:absolute;top:18px;font-size:34px;font-weight:900;padding:4px 14px;border:4px solid;border-radius:12px;opacity:0;transform:rotate(-15deg)}
.yes{left:18px;color:#2bd47a;border-color:#2bd47a}.no{right:18px;color:#ff5a7a;border-color:#ff5a7a}
.bar{position:fixed;bottom:0;left:0;right:0;height:90px;display:flex;align-items:center;justify-content:center;gap:22px;background:#13141a;border-top:1px solid #2c2f3a}
.fab{width:62px;height:62px;border-radius:50%;border:none;font-size:26px;cursor:pointer;font-weight:800}
.fab.no{background:#2a1d23;color:#ff5a7a;border:2px solid #ff5a7a}.fab.yes{background:#16271c;color:#2bd47a;border:2px solid #2bd47a}.fab.undo{width:48px;height:48px;font-size:18px;background:#23242c;color:#cfd3db;border:1px solid #3a3f4c}
.btn{background:#ffe27a;color:#15161a;border:none;border-radius:10px;padding:10px 14px;font-size:13px;font-weight:700;cursor:pointer}
.done{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.done h2{color:#ffe27a;margin:0 0 8px}#out{margin-top:12px;width:min(92vw,560px);height:180px;font-family:ui-monospace,monospace;font-size:11px;background:#0b0c10;color:#cfd3db;border:1px solid #3a3f4c;border-radius:8px;padding:8px}
.hint{font-size:12px;color:#9aa0ad;margin-top:8px;max-width:560px}.toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%);background:#2bd47a;color:#08210f;padding:8px 16px;border-radius:999px;font-weight:700;opacity:0;transition:.3s;pointer-events:none}.toast.show{opacity:1}
</style></head><body>
<header><div><b>系統拡充 まとめ選別</b> <span style="font-size:12px;color:#9aa0ad">← 無し / 有り → ・ドラッグ/←→キー</span></div>
<div class="count"><span id="dn">0</span>/<span id="tn">0</span> ・有り<span id="yn">0</span></div></header>
<div class="stage" id="stage"><div class="done" id="done"><h2>選別おわり！</h2><div id="sum" style="color:#cfd3db"></div>
<div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class="btn" id="dl">CSVをダウンロード</button><button class="btn" id="cp" style="background:#3a3f4c;color:#e7e7ea">CSVをコピー</button><button class="btn" id="rs" style="background:#3a3f4c;color:#e7e7ea">最初から</button></div>
<div class="hint">CSV(id,verdict)をダウンロード or コピーして、チャットに貼るか保存してください。Claudeが一括でlibrary反映します。</div><textarea id="out" readonly></textarea></div></div>
<div class="bar"><button class="fab no" id="bno">✗</button><button class="fab undo" id="bu">↶</button><button class="fab yes" id="by">♥</button>
<button class="btn" id="bcsv" style="position:fixed;right:12px;bottom:104px;padding:8px 12px;font-size:12px">途中CSV</button></div>
<div class="toast" id="toast">コピーしました！</div>
<script>
const BOSSES=[{"id": "ash-bone-imp-dark01", "name_ja": "ダーク・ホネコビト", "tier": "序盤", "element": "ダーク", "img": "gacha_dark/ash-bone-imp-dark01.png", "batch": "dark"}, {"id": "violet-wisp-dark02", "name_ja": "ダーク・ムラサキビ", "tier": "序盤", "element": "ダーク", "img": "gacha_dark/violet-wisp-dark02.png", "batch": "dark"}, {"id": "cinder-rot-rat-dark03", "name_ja": "ダーク・クサリネズミ", "tier": "序盤", "element": "ダーク", "img": "gacha_dark/cinder-rot-rat-dark03.png", "batch": "dark"}, {"id": "obsidian-shard-pup-dark04", "name_ja": "ダーク・コクヨウコイヌ", "tier": "序盤", "element": "ダーク", "img": "gacha_dark/obsidian-shard-pup-dark04.png", "batch": "dark"}, {"id": "spore-toad-dark05", "name_ja": "ダーク・キノコガエル", "tier": "序盤", "element": "ダーク", "img": "gacha_dark/spore-toad-dark05.png", "batch": "dark"}, {"id": "shadow-crow-dark06", "name_ja": "ダーク・カゲガラス", "tier": "序盤", "element": "ダーク", "img": "gacha_dark/shadow-crow-dark06.png", "batch": "dark"}, {"id": "husk-beetle-dark07", "name_ja": "ダーク・カラベゾウムシ", "tier": "序盤", "element": "ダーク", "img": "gacha_dark/husk-beetle-dark07.png", "batch": "dark"}, {"id": "grave-mole-dark08", "name_ja": "ダーク・ハカモグラ", "tier": "序盤", "element": "ダーク", "img": "gacha_dark/grave-mole-dark08.png", "batch": "dark"}, {"id": "pale-larva-dark09", "name_ja": "ダーク・アオジロウジ", "tier": "序盤", "element": "ダーク", "img": "gacha_dark/pale-larva-dark09.png", "batch": "dark"}, {"id": "ember-skull-snake-dark10", "name_ja": "ダーク・ドクロヘビ", "tier": "序盤", "element": "ダーク", "img": "gacha_dark/ember-skull-snake-dark10.png", "batch": "dark"}, {"id": "moss-wraithling-dark11", "name_ja": "ダーク・コケユウレイ", "tier": "序盤", "element": "ダーク", "img": "gacha_dark/moss-wraithling-dark11.png", "batch": "dark"}, {"id": "plague-hopper-dark12", "name_ja": "ダーク・ヤミバッタ", "tier": "序盤", "element": "ダーク", "img": "gacha_dark/plague-hopper-dark12.png", "batch": "dark"}, {"id": "obsidian-crab-dark13", "name_ja": "ダーク・コクヨウガニ", "tier": "序盤", "element": "ダーク", "img": "gacha_dark/obsidian-crab-dark13.png", "batch": "dark"}, {"id": "dim-bat-dark14", "name_ja": "ダーク・ヨイコウモリ", "tier": "序盤", "element": "ダーク", "img": "gacha_dark/dim-bat-dark14.png", "batch": "dark"}, {"id": "rot-slime-dark15", "name_ja": "ダーク・グサレスライム", "tier": "序盤", "element": "ダーク", "img": "gacha_dark/rot-slime-dark15.png", "batch": "dark"}, {"id": "bone-warden-dark16", "name_ja": "ダーク・ホネバンチョウ", "tier": "中盤", "element": "ダーク", "img": "gacha_dark/bone-warden-dark16.png", "batch": "dark"}, {"id": "obsidian-panther-dark17", "name_ja": "ダーク・コクヨウヒョウ", "tier": "中盤", "element": "ダーク", "img": "gacha_dark/obsidian-panther-dark17.png", "batch": "dark"}, {"id": "plague-mantis-dark18", "name_ja": "ダーク・エキビョウカマキリ", "tier": "中盤", "element": "ダーク", "img": "gacha_dark/plague-mantis-dark18.png", "batch": "dark"}, {"id": "wraith-knight-dark19", "name_ja": "ダーク・ボウレイキシ", "tier": "中盤", "element": "ダーク", "img": "gacha_dark/wraith-knight-dark19.png", "batch": "dark"}, {"id": "fungal-bear-dark20", "name_ja": "ダーク・キノコグマ", "tier": "中盤", "element": "ダーク", "img": "gacha_dark/fungal-bear-dark20.png", "batch": "dark"}, {"id": "obsidian-serpent-dark21", "name_ja": "ダーク・コクヨウオロチ", "tier": "中盤", "element": "ダーク", "img": "gacha_dark/obsidian-serpent-dark21.png", "batch": "dark"}, {"id": "corpse-vulture-dark22", "name_ja": "ダーク・シガイハゲワシ", "tier": "中盤", "element": "ダーク", "img": "gacha_dark/corpse-vulture-dark22.png", "batch": "dark"}, {"id": "shade-stag-dark23", "name_ja": "ダーク・カゲジカ", "tier": "中盤", "element": "ダーク", "img": "gacha_dark/shade-stag-dark23.png", "batch": "dark"}, {"id": "parasite-host-dark24", "name_ja": "ダーク・キセイヌケガラ", "tier": "中盤", "element": "ダーク", "img": "gacha_dark/parasite-host-dark24.png", "batch": "dark"}, {"id": "obsidian-golem-dark25", "name_ja": "ダーク・コクヨウゴーレム", "tier": "中盤", "element": "ダーク", "img": "gacha_dark/obsidian-golem-dark25.png", "batch": "dark"}, {"id": "rot-hound-dark26", "name_ja": "ダーク・クサレイヌ", "tier": "中盤", "element": "ダーク", "img": "gacha_dark/rot-hound-dark26.png", "batch": "dark"}, {"id": "shadow-weaver-dark27", "name_ja": "ダーク・カゲグモ", "tier": "中盤", "element": "ダーク", "img": "gacha_dark/shadow-weaver-dark27.png", "batch": "dark"}, {"id": "bone-centaur-dark28", "name_ja": "ダーク・ホネケンタウロス", "tier": "中盤", "element": "ダーク", "img": "gacha_dark/bone-centaur-dark28.png", "batch": "dark"}, {"id": "mutant-frog-dark29", "name_ja": "ダーク・ヘンイガエル", "tier": "中盤", "element": "ダーク", "img": "gacha_dark/mutant-frog-dark29.png", "batch": "dark"}, {"id": "obsidian-scorpion-dark30", "name_ja": "ダーク・コクヨウサソリ", "tier": "中盤", "element": "ダーク", "img": "gacha_dark/obsidian-scorpion-dark30.png", "batch": "dark"}, {"id": "cursed-treant-dark31", "name_ja": "ダーク・ノロイジュ", "tier": "終盤", "element": "ダーク", "img": "gacha_dark/cursed-treant-dark31.png", "batch": "dark"}, {"id": "plague-leviathan-dark32", "name_ja": "ダーク・エキビョウオオウオ", "tier": "終盤", "element": "ダーク", "img": "gacha_dark/plague-leviathan-dark32.png", "batch": "dark"}, {"id": "obsidian-wyvern-dark33", "name_ja": "ダーク・コクヨウワイバーン", "tier": "終盤", "element": "ダーク", "img": "gacha_dark/obsidian-wyvern-dark33.png", "batch": "dark"}, {"id": "lich-sovereign-dark34", "name_ja": "ダーク・シハイノシシャ", "tier": "終盤", "element": "ダーク", "img": "gacha_dark/lich-sovereign-dark34.png", "batch": "dark"}, {"id": "shadow-behemoth-dark35", "name_ja": "ダーク・カゲキョジュウ", "tier": "終盤", "element": "ダーク", "img": "gacha_dark/shadow-behemoth-dark35.png", "batch": "dark"}, {"id": "obsidian-hydra-dark36", "name_ja": "ダーク・コクヨウヒュドラ", "tier": "終盤", "element": "ダーク", "img": "gacha_dark/obsidian-hydra-dark36.png", "batch": "dark"}, {"id": "fungal-titan-dark37", "name_ja": "ダーク・キンシキョジン", "tier": "終盤", "element": "ダーク", "img": "gacha_dark/fungal-titan-dark37.png", "batch": "dark"}, {"id": "bone-colossus-dark38", "name_ja": "ダーク・ホネノキョヘイ", "tier": "終盤", "element": "ダーク", "img": "gacha_dark/bone-colossus-dark38.png", "batch": "dark"}, {"id": "obsidian-chimera-dark39", "name_ja": "ダーク・コクヨウキマイラ", "tier": "終盤", "element": "ダーク", "img": "gacha_dark/obsidian-chimera-dark39.png", "batch": "dark"}, {"id": "rot-leviathan-worm-dark40", "name_ja": "ダーク・グサレオオミミズ", "tier": "終盤", "element": "ダーク", "img": "gacha_dark/rot-leviathan-worm-dark40.png", "batch": "dark"}, {"id": "shadow-revenant-knight-dark41b", "name_ja": "ダーク・ボウレイタイショウ", "tier": "終盤", "element": "ダーク", "img": "gacha_dark/shadow-revenant-knight-dark41b.png", "batch": "dark"}, {"id": "obsidian-overlord-dark41", "name_ja": "ダーク・コクヨウマオウ", "tier": "終盤", "element": "ダーク", "img": "gacha_dark/obsidian-overlord-dark41.png", "batch": "dark"}, {"id": "void-dragon-darkmaster", "name_ja": "ダーク・コクエンノシンリュウ", "tier": "ラスボス級", "element": "ダーク", "img": "gacha_dark/void-dragon-darkmaster.png", "batch": "dark"}, {"id": "plague-mother-darkboss02", "name_ja": "ダーク・エキビョウノハハ", "tier": "ラスボス級", "element": "ダーク", "img": "gacha_dark/plague-mother-darkboss02.png", "batch": "dark"}, {"id": "bone-emperor-darkboss03", "name_ja": "ダーク・ホネノダイテイ", "tier": "ラスボス級", "element": "ダーク", "img": "gacha_dark/bone-emperor-darkboss03.png", "batch": "dark"}, {"id": "obsidian-leviathan-darkboss04", "name_ja": "ダーク・コクヨウノカイジュウ", "tier": "ラスボス級", "element": "ダーク", "img": "gacha_dark/obsidian-leviathan-darkboss04.png", "batch": "dark"}, {"id": "shadow-archon-darkboss05", "name_ja": "ダーク・カゲノシハイシャ", "tier": "ラスボス級", "element": "ダーク", "img": "gacha_dark/shadow-archon-darkboss05.png", "batch": "dark"}, {"id": "rot-god-darkboss06", "name_ja": "ダーク・フハイノカミ", "tier": "ラスボス級", "element": "ダーク", "img": "gacha_dark/rot-god-darkboss06.png", "batch": "dark"}, {"id": "obsidian-worldserpent-darkboss07", "name_ja": "ダーク・コクヨウノダイジャ", "tier": "ラスボス級", "element": "ダーク", "img": "gacha_dark/obsidian-worldserpent-darkboss07.png", "batch": "dark"}, {"id": "void-warlord-darkboss08", "name_ja": "ダーク・キョムノグンオウ", "tier": "ラスボス級", "element": "ダーク", "img": "gacha_dark/void-warlord-darkboss08.png", "batch": "dark"}];const KEY="rika2_overnight3_review_v1";
let st=JSON.parse(localStorage.getItem(KEY)||"null")||{idx:0,dec:{}};
function save(){localStorage.setItem(KEY,JSON.stringify(st));}
const stage=document.getElementById("stage");document.getElementById("tn").textContent=BOSSES.length;
let card=null,sx=0,cx=0,drag=false;
function counts(){const y=Object.values(st.dec).filter(v=>v==="yes").length;document.getElementById("dn").textContent=Object.keys(st.dec).length;document.getElementById("yn").textContent=y;}
function build(i){const b=BOSSES[i];const el=document.createElement("div");el.className="card";
el.innerHTML=`<div class="stamp yes">有り</div><div class="stamp no">無し</div><div class="imgbox"><img src="${b.img}" alt=""></div><div class="info"><div class="nm">${b.name_ja}<span class="tier t${b.tier}">${b.tier}</span></div><div class="el">${b.element}</div><div class="bt">${b.batch}</div></div>`;
el.addEventListener("pointerdown",dn);el.addEventListener("pointermove",mv);el.addEventListener("pointerup",up);el.addEventListener("pointercancel",up);return el;}
function show(){if(card){card.remove();card=null;}if(st.idx>=BOSSES.length){document.getElementById("done").style.display="flex";finish();return;}document.getElementById("done").style.display="none";card=build(st.idx);stage.appendChild(card);counts();}
function dn(e){drag=true;sx=e.clientX;cx=0;card.setPointerCapture(e.pointerId);card.style.transition="none";}
function mv(e){if(!drag)return;cx=e.clientX-sx;card.style.transform=`translateX(${cx}px) rotate(${cx/18}deg)`;card.querySelector(".yes").style.opacity=Math.max(0,Math.min(1,cx/90));card.querySelector(".no").style.opacity=Math.max(0,Math.min(1,-cx/90));}
function up(){if(!drag)return;drag=false;if(cx>90)dec("yes");else if(cx<-90)dec("no");else{card.style.transition=".2s";card.style.transform="";card.querySelector(".yes").style.opacity=0;card.querySelector(".no").style.opacity=0;}}
function dec(v){st.dec[BOSSES[st.idx].id]=v;save();const d=v==="yes"?1:-1;card.style.transition=".3s ease-out";card.style.transform=`translateX(${d*140}vw) rotate(${d*25}deg)`;card.style.opacity="0";setTimeout(()=>{st.idx++;save();show();},250);}
function undo(){if(st.idx<=0)return;st.idx--;delete st.dec[BOSSES[st.idx].id];save();show();}
function csv(){let s="id,verdict\n";BOSSES.forEach(b=>{if(st.dec[b.id])s+=b.id+","+st.dec[b.id]+"\n";});return s;}
function finish(){const y=BOSSES.filter(b=>st.dec[b.id]==="yes").length;document.getElementById("sum").textContent=`有り ${y} / 無し ${Object.keys(st.dec).length-y} / 計 ${BOSSES.length}`;document.getElementById("out").value=csv();}
function copyCsv(){const s=csv();const o=document.getElementById("out");o.value=s;if(navigator.clipboard)navigator.clipboard.writeText(s).then(()=>{const t=document.getElementById("toast");t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1500);});o.select();}
function dlCsv(){const s=csv();const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([s],{type:"text/csv"}));a.download="overnight3_result.csv";a.click();}
document.getElementById("bno").onclick=()=>{if(st.idx<BOSSES.length)dec("no");};
document.getElementById("by").onclick=()=>{if(st.idx<BOSSES.length)dec("yes");};
document.getElementById("bu").onclick=undo;document.getElementById("bcsv").onclick=copyCsv;
document.getElementById("cp").onclick=copyCsv;document.getElementById("dl").onclick=dlCsv;
document.getElementById("rs").onclick=()=>{st={idx:0,dec:{}};save();show();};
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"&&st.idx<BOSSES.length)dec("no");else if(e.key==="ArrowRight"&&st.idx<BOSSES.length)dec("yes");else if(e.key==="Backspace")undo();});
show();
</script></body></html>
