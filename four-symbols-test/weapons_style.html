<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>武器 画風くらべ — 理科RPG2</title><style>
:root{color-scheme:dark}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0f1014;color:#e7e7ea;font-family:system-ui,"Hiragino Kaku Gothic ProN",sans-serif;padding-bottom:90px}
header{position:sticky;top:0;z-index:5;padding:10px 14px;background:#1a1c22;border-bottom:1px solid #2c2f3a}
header b{color:#ffe27a}.sub{font-size:12px;color:#9aa0ad;margin-top:4px;line-height:1.5}
table{border-collapse:collapse;width:max-content;min-width:100%}
th,td{padding:4px;text-align:center}
th.col{cursor:pointer;font-size:13px;color:#ffe27a;background:#1a1c22;border:2px solid #2c2f3a;border-radius:10px;padding:8px 6px;position:sticky;top:54px}
th.col.win{background:#16271c;border-color:#2bd47a;color:#2bd47a}
th.col .pk{display:block;font-size:10px;color:#9aa0ad}
td img{width:200px;height:200px;object-fit:contain;background:#e9e9e9;border-radius:8px}
td.win img{outline:3px solid #2bd47a}
th.row{font-size:12px;color:#cfd3db;writing-mode:vertical-rl;white-space:nowrap}
.bar{position:fixed;bottom:0;left:0;right:0;height:70px;display:flex;align-items:center;justify-content:center;gap:14px;background:#13141a;border-top:1px solid #2c2f3a}
.cur{font-size:14px}.cur b{color:#2bd47a}
.btn{background:#ffe27a;color:#15161a;border:none;border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer}
#out{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);width:min(92vw,520px);height:120px;display:none;background:#0b0c10;color:#cfd3db;border:1px solid #3a3f4c;border-radius:8px;padding:8px;font-family:ui-monospace,monospace;font-size:12px}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#2bd47a;color:#08210f;padding:8px 16px;border-radius:999px;font-weight:700;opacity:0;transition:.3s}.toast.show{opacity:1}
</style></head><body>
<header><b>武器 画風くらべ</b>（列＝画風A〜E／行＝英雄3本・形は固定で塗りだけ違う）
<div class="sub">狙い＝『剣と魔法のログレス』の鮮やか・派手・明瞭。<b>一番ログレスっぽい列のヘッダをタップ</b>→下のコピーで結果を貼ってください。列に無ければチャットで指示でOK。</div></header>
<div style="overflow:auto"><table id="tb"><thead><tr><th></th><th class="col" data-r="A_clean">A clean-vivid<span class="pk">タップで選ぶ</span></th><th class="col" data-r="B_paint">B painterly<span class="pk">タップで選ぶ</span></th><th class="col" data-r="C_anima">C Animagine<span class="pk">タップで選ぶ</span></th><th class="col" data-r="D_glow">D glow-bg<span class="pk">タップで選ぶ</span></th><th class="col" data-r="E_prism">E prismatic-max<span class="pk">タップで選ぶ</span></th></tr></thead><tbody><tr><th class="row">天魔滅却の大剣 (LR)</th><td class="cell" data-r="A_clean"><img src="weap_style/eq257__A_clean.jpg" loading="lazy"></td><td class="cell" data-r="B_paint"><img src="weap_style/eq257__B_paint.jpg" loading="lazy"></td><td class="cell" data-r="C_anima"><img src="weap_style/eq257__C_anima.jpg" loading="lazy"></td><td class="cell" data-r="D_glow"><img src="weap_style/eq257__D_glow.jpg" loading="lazy"></td><td class="cell" data-r="E_prism"><img src="weap_style/eq257__E_prism.jpg" loading="lazy"></td></tr><tr><th class="row">裁きと慈悲の聖杖 (LR)</th><td class="cell" data-r="A_clean"><img src="weap_style/eq293__A_clean.jpg" loading="lazy"></td><td class="cell" data-r="B_paint"><img src="weap_style/eq293__B_paint.jpg" loading="lazy"></td><td class="cell" data-r="C_anima"><img src="weap_style/eq293__C_anima.jpg" loading="lazy"></td><td class="cell" data-r="D_glow"><img src="weap_style/eq293__D_glow.jpg" loading="lazy"></td><td class="cell" data-r="E_prism"><img src="weap_style/eq293__E_prism.jpg" loading="lazy"></td></tr><tr><th class="row">終焉の杖 (UR)</th><td class="cell" data-r="A_clean"><img src="weap_style/eq116__A_clean.jpg" loading="lazy"></td><td class="cell" data-r="B_paint"><img src="weap_style/eq116__B_paint.jpg" loading="lazy"></td><td class="cell" data-r="C_anima"><img src="weap_style/eq116__C_anima.jpg" loading="lazy"></td><td class="cell" data-r="D_glow"><img src="weap_style/eq116__D_glow.jpg" loading="lazy"></td><td class="cell" data-r="E_prism"><img src="weap_style/eq116__E_prism.jpg" loading="lazy"></td></tr></tbody></table></div>
<div class="bar"><div class="cur">選んだ画風: <b id="cur">なし</b></div><button class="btn" id="copyBtn">結果をコピー</button></div>
<textarea id="out" readonly></textarea><div class="toast" id="toast">コピーしました！</div>
<script>
const RECIPES=[["A_clean", "A clean-vivid"], ["B_paint", "B painterly"], ["C_anima", "C Animagine"], ["D_glow", "D glow-bg"], ["E_prism", "E prismatic-max"]]; const KEY="rika2_style_pick";
let win=localStorage.getItem(KEY)||"";
function paint(){
  document.querySelectorAll("th.col").forEach(th=>th.classList.toggle("win",th.dataset.r===win));
  document.querySelectorAll("td.cell").forEach(td=>td.classList.toggle("win",td.dataset.r===win));
  const r=RECIPES.find(x=>x[0]===win);
  document.getElementById("cur").textContent=r?r[1]:"なし";
}
document.querySelectorAll("th.col").forEach(th=>th.onclick=()=>{win=(win===th.dataset.r)?"":th.dataset.r;localStorage.setItem(KEY,win);paint();});
document.getElementById("copyBtn").onclick=()=>{
  const r=RECIPES.find(x=>x[0]===win);
  const s="=== 武器 画風くらべ 結果 ===\n選んだ画風: "+(r?r[1]+" ["+r[0]+"]":"なし(チャットで指示)")+"\n";
  const o=document.getElementById("out");o.style.display="block";o.value=s;o.select();
  if(navigator.clipboard)navigator.clipboard.writeText(s).then(()=>{const t=document.getElementById("toast");t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1400);},()=>{});
};
paint();
</script></body></html>
