<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>ボス選別 — 理科RPG2</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0f1014;color:#e7e7ea;font-family:system-ui,"Hiragino Kaku Gothic ProN",sans-serif;overflow:hidden;height:100dvh}
header{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;background:#1a1c22;border-bottom:1px solid #2c2f3a}
header b{color:#ffe27a}.count{font-size:13px;color:#9aa0ad}
.stage{position:relative;height:calc(100dvh - 150px);display:flex;align-items:center;justify-content:center;padding:10px}
.card{position:absolute;width:min(92vw,440px);max-height:100%;background:#1d1f26;border:1px solid #2c2f3a;border-radius:18px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5);touch-action:none}
.imgbox{aspect-ratio:1/1;
  background-image:linear-gradient(45deg,#cfcfcf 25%,transparent 25%),linear-gradient(-45deg,#cfcfcf 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#cfcfcf 75%),linear-gradient(-45deg,transparent 75%,#cfcfcf 75%);
  background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0;background-color:#e9e9e9}
.imgbox img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.info{padding:12px 16px}
.nm{font-size:22px;font-weight:800}
.nm .tier{font-size:14px;font-weight:700;padding:2px 10px;border-radius:999px;margin-left:8px;vertical-align:3px}
.t序盤{background:#2bd47a;color:#06210f}.t中盤{background:#4aa3ff;color:#04203f}.t終盤{background:#ff9a3c;color:#311600}.tラスボス級{background:#ff5a7a;color:#33000d}
.el{font-size:12px;color:#9aa0ad;margin-top:2px}
.fl{font-size:14px;color:#cfd3db;margin-top:8px;line-height:1.55}
.stamp{position:absolute;top:18px;font-size:34px;font-weight:900;padding:4px 14px;border:4px solid;border-radius:12px;opacity:0;transform:rotate(-15deg)}
.yes{left:18px;color:#2bd47a;border-color:#2bd47a}.no{right:18px;color:#ff5a7a;border-color:#ff5a7a}
.bar{position:fixed;bottom:0;left:0;right:0;height:90px;display:flex;align-items:center;justify-content:center;gap:22px;background:#13141a;border-top:1px solid #2c2f3a}
.fab{width:62px;height:62px;border-radius:50%;border:none;font-size:26px;cursor:pointer;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.fab.no{background:#2a1d23;color:#ff5a7a;border:2px solid #ff5a7a}.fab.yes{background:#16271c;color:#2bd47a;border:2px solid #2bd47a}
.fab.undo{width:48px;height:48px;font-size:18px;background:#23242c;color:#cfd3db;border:1px solid #3a3f4c}
.done{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.done h2{color:#ffe27a;margin:0 0 8px}
.btn{margin-top:14px;background:#ffe27a;color:#15161a;border:none;border-radius:10px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
#out{margin-top:12px;width:min(92vw,520px);height:160px;font-family:ui-monospace,monospace;font-size:11px;display:none;background:#0b0c10;color:#cfd3db;border:1px solid #3a3f4c;border-radius:8px;padding:8px}
.hint{font-size:11px;color:#6b7280;margin-top:6px}
.toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%);background:#2bd47a;color:#08210f;padding:8px 16px;border-radius:999px;font-weight:700;opacity:0;transition:.3s;pointer-events:none}.toast.show{opacity:1}
</style></head><body>
<header><div><b>ボス選別</b> <span style="font-size:12px;color:#9aa0ad">← 無し / 有り → ・ドラッグもOK</span></div>
  <div class="count"><span id="done_n">0</span>/<span id="total_n">0</span> ・有り<span id="yes_n">0</span></div></header>
<div class="stage" id="stage">
  <div class="done" id="doneScreen">
    <h2>選別おわり！</h2>
    <div id="summary" style="color:#cfd3db"></div>
    <button class="btn" id="copyBtn">結果をコピー</button>
    <div class="hint">コピーしたテキストをチャットに貼ってください（採用の系統を学習して次の50枚へ）。</div>
    <textarea id="out" readonly></textarea>
    <button class="btn" id="restartBtn" style="background:#3a3f4c;color:#e7e7ea">最初からやり直す</button>
  </div>
</div>
<div class="bar">
  <button class="fab no" id="bNo">✗</button>
  <button class="fab undo" id="bUndo">↶</button>
  <button class="fab yes" id="bYes">♥</button>
  <button class="btn" id="bCopy" style="position:fixed;right:12px;bottom:104px;padding:8px 12px;font-size:12px">途中保存コピー</button>
</div>
<div class="toast" id="toast">コピーしました！</div>
<script>
const BOSSES=[{"id": "coil-mole-solenoid-b16", "name_ja": "コイルモグラ", "tier": "序盤", "element": "電磁", "flavor_ja": "電気を流すと胴のコイルが磁石に変わるモグラ。掘った先の鉄くぎを体じゅうに吸いつける。", "img": "gacha_b16/coil-mole-solenoid-b16.png"}, {"id": "lens-tortoise-optics-b16", "name_ja": "レンズガメ", "tier": "序盤", "element": "光学", "flavor_ja": "甲羅の凸レンズで日ざしを一点に集めて焼く亀。体表に虹色の光がゆらめいてまとわりつく。", "img": "gacha_b16/lens-tortoise-optics-b16.png"}, {"id": "spring-cricket-piston-b16", "name_ja": "バネコオロギ", "tier": "序盤", "element": "圧力", "flavor_ja": "後ろ脚の圧縮バネをためて跳ねる虫。継ぎ目から白い圧縮空気をシュッと吹き出す。", "img": "gacha_b16/spring-cricket-piston-b16.png"}, {"id": "speaker-toad-resonator-b16", "name_ja": "スピーカーヒキガエル", "tier": "中盤", "element": "音響", "flavor_ja": "腹いっぱいのスピーカーから重低音をぶつける蛙。鳴くたび体表に音の波紋がにじむ。", "img": "gacha_b16/speaker-toad-resonator-b16.png"}, {"id": "alloy-rhino-bulwark-b16", "name_ja": "ゴウキンサイ", "tier": "中盤", "element": "合金", "flavor_ja": "二種の金属を打ち合わせた装甲をまとう犀。継ぎ目には鍛えたての熱がにじみ、何ものも通さない。", "img": "gacha_b16/alloy-rhino-bulwark-b16.png"}, {"id": "magnet-crab-polarity-b16", "name_ja": "ジキョクガニ", "tier": "中盤", "element": "磁力", "flavor_ja": "赤と青の磁石ハサミでN極S極を操るカニ。甲羅には鉄粉が逆立ち、磁力線が体に巻きつく。", "img": "gacha_b16/magnet-crab-polarity-b16.png"}, {"id": "gravity-orb-beetle-collapse-b16", "name_ja": "ジュウリョクオオカブト", "tier": "終盤", "element": "重力", "flavor_ja": "背に小さな重い核を背負う甲虫。踏みしめた地に亀裂が走り、まわりのものを重さで引きずり込む。", "img": "gacha_b16/gravity-orb-beetle-collapse-b16.png"}, {"id": "circuit-serpent-mainboard-b16", "name_ja": "カイロオロチ", "tier": "終盤", "element": "回路", "flavor_ja": "全身が一枚の巨大基板の蛇竜。とぐろを巻いて据わり、配線を走る電流が体じゅうに光の筋を描く。", "img": "gacha_b16/circuit-serpent-mainboard-b16.png"}, {"id": "turbine-titan-dynamo-b16", "name_ja": "ハツデンキョジン", "tier": "ラスボス級", "element": "電磁", "flavor_ja": "胸の発電タービンを唸らせて稲妻をまとう機械の巨獣。コイルと歯車の体に青い電弧が走る。", "img": "gacha_b16/turbine-titan-dynamo-b16.png"}, {"id": "singularity-leviathan-allforge-b16", "name_ja": "シュウソクリヴァイア", "tier": "ラスボス級", "element": "重力", "flavor_ja": "歯車も磁石もレンズも回路も呑みこんだ機械獣の終焉体。胸の収束核がすべてを引き寄せ、体表をゆがめる。", "img": "gacha_b16/singularity-leviathan-allforge-b16.png"}, {"id": "ember-drake-whelp-b16", "name_ja": "ひばしらドレイク", "tier": "序盤", "element": "火", "flavor_ja": "背中のひび割れから熱がもれる、ちいさな火竜。まだ翼はないが、口からこぼれる炎はもう一人前。", "img": "gacha_b16/ember-drake-whelp-b16.png"}, {"id": "spark-wyrmling-b16", "name_ja": "ぱちぱちワイバーン", "tier": "序盤", "element": "電気", "flavor_ja": "鱗のあいだを電気がぱちぱち走る、若いワイバーン。さわるとビリッとくるので注意。", "img": "gacha_b16/spark-wyrmling-b16.png"}, {"id": "moss-shell-dragonet-b16", "name_ja": "こけがらドラゴネット", "tier": "序盤", "element": "植物", "flavor_ja": "せなかに苔と花が生えた、まんまるの草竜。日なたぼっこが大すき。", "img": "gacha_b16/moss-shell-dragonet-b16.png"}, {"id": "magnet-iron-drake-b16", "name_ja": "じりょくテツドレイク", "tier": "中盤", "element": "磁力", "flavor_ja": "体じゅうに鉄くずを吸いつけた、磁力の鋼竜。N極とS極の角でモノを引きよせる。", "img": "gacha_b16/magnet-iron-drake-b16.png"}, {"id": "acid-mire-hydra-b16", "name_ja": "ようかいヒュドラ", "tier": "中盤", "element": "酸", "flavor_ja": "三つの口から酸をたらす、ぬめる沼のヒュドラ。ふれたものを溶かしながらにじり寄る。", "img": "gacha_b16/acid-mire-hydra-b16.png"}, {"id": "crystal-prism-wyvern-b16", "name_ja": "プリズムワイバーン", "tier": "中盤", "element": "光", "flavor_ja": "体じゅうがプリズムの結晶でできた竜。光をうけると、鱗が虹色に分かれて輝く。", "img": "gacha_b16/crystal-prism-wyvern-b16.png"}, {"id": "magma-core-drake-b16", "name_ja": "ようがんコアドレイク", "tier": "終盤", "element": "炎・地", "flavor_ja": "体の奥にマグマだまりを抱えた、火山の大竜。ひびのあいだから溶岩が川のように流れる。", "img": "gacha_b16/magma-core-drake-b16.png"}, {"id": "frost-glacier-wyrm-b16", "name_ja": "ひょうがウィルム", "tier": "終盤", "element": "氷", "flavor_ja": "氷河そのものが竜になったような巨体。背中の氷柱からは、つめたい霧が立ちのぼる。", "img": "gacha_b16/frost-glacier-wyrm-b16.png"}, {"id": "plasma-storm-sovereign-b16", "name_ja": "プラズマりゅうおう", "tier": "ラスボス級", "element": "雷・プラズマ", "flavor_ja": "嵐そのものをまとった竜の王。全身をプラズマがおおい、近づくものを雷で焼きつくす。", "img": "gacha_b16/plasma-storm-sovereign-b16.png"}, {"id": "void-singularity-dragon-b16", "name_ja": "じゅうりょくのおう", "tier": "ラスボス級", "element": "重力", "flavor_ja": "光すらのみこむ漆黒の古竜。その身のまわりで空間がゆがみ、すべてが中心へと引きよせられる。", "img": "gacha_b16/void-singularity-dragon-b16.png"}, {"id": "tidepool-snapper-crab-b16", "name_ja": "シオダマリガニ", "tier": "序盤", "element": "水", "flavor_ja": "潮だまりの石にまぎれる入門級のカニ。ふくらんだ片方のハサミでパチンと水を弾く。理科の最初の一歩、まずはここから。", "img": "gacha_b16/tidepool-snapper-crab-b16.png"}, {"id": "fizz-shrimp-larva-b16", "name_ja": "アワフキエビ", "tier": "序盤", "element": "水", "flavor_ja": "背中からシュワシュワと泡を吹き出す小エビ。化学の「気体が出る反応」の使い。つつくと泡だらけで逃げる。", "img": "gacha_b16/fizz-shrimp-larva-b16.png"}, {"id": "pebble-hermit-snailshell-b16", "name_ja": "コイシヤドカリ", "tier": "序盤", "element": "土", "flavor_ja": "石ころの殻を背負ったずんぐりヤドカリ。重い殻でどっしり構える。岩石・地学の入り口にいる温和な相手。", "img": "gacha_b16/pebble-hermit-snailshell-b16.png"}, {"id": "voltaic-mantis-shrimp-b16", "name_ja": "デンゲキシャコ", "tier": "中盤", "element": "雷", "flavor_ja": "目にも止まらぬ一撃を雷で増幅するシャコ。クラブパンチが電撃をまとう。中盤、電流と力の単元を背負う武闘派。", "img": "gacha_b16/voltaic-mantis-shrimp-b16.png"}, {"id": "geode-armor-crab-b16", "name_ja": "ショウセキガニ", "tier": "中盤", "element": "土", "flavor_ja": "甲羅に紫水晶を育てた重装のカニ。硬い結晶の鎧で攻撃をはじく。鉱物・結晶の知識で弱点を突け。", "img": "gacha_b16/geode-armor-crab-b16.png"}, {"id": "deepsea-lantern-prawn-b16", "name_ja": "チョウコウエビ", "tier": "中盤", "element": "光", "flavor_ja": "深海でみずから光る小エビ。体の発光点がぼうっと青く照らす。光・発光の単元の使い、暗い洞窟の主。", "img": "gacha_b16/deepsea-lantern-prawn-b16.png"}, {"id": "magma-forge-crab-b16", "name_ja": "ヨウガンガニ", "tier": "終盤", "element": "火", "flavor_ja": "甲羅の割れ目から溶岩を滲ませる巨大ガニ。鋼のハサミは打ち下ろすたび火花を散らす。終盤、火と熱の試練。", "img": "gacha_b16/magma-forge-crab-b16.png"}, {"id": "cryo-glacier-mantis-b16", "name_ja": "ヒョウケツシャコ", "tier": "終盤", "element": "氷", "flavor_ja": "氷河の鎧をまとう大シャコ。凍てつく一撃は水を一瞬で氷に変える。終盤、状態変化と熱量の難敵。", "img": "gacha_b16/cryo-glacier-mantis-b16.png"}, {"id": "abyssal-crown-king-crab-b16", "name_ja": "シンカイオウガニ", "tier": "ラスボス級", "element": "闇", "flavor_ja": "深海の底に君臨する甲殻の王。冠のごとき棘を戴き、闇の蒸気をまとう。学びの集大成を試す巨大な壁。", "img": "gacha_b16/abyssal-crown-king-crab-b16.png"}, {"id": "prismatic-omega-carapace-b16", "name_ja": "オメガ・カラペイス", "tier": "ラスボス級", "element": "無", "flavor_ja": "あらゆる科学の力を結晶させた究極の甲殻獣。虹色の装甲に式が走る。すべての単元を修めた者だけが挑める最終試練。", "img": "gacha_b16/prismatic-omega-carapace-b16.png"}, {"id": "spark-ladybug-led-b16", "name_ja": "ピカテンとうむし", "tier": "序盤", "element": "電気", "flavor_ja": "黒い点のかわりに小さな豆電球が光る、まんまるの甲虫。びっくりするとパチッと放電する。", "img": "gacha_b16/spark-ladybug-led-b16.png"}, {"id": "gear-stag-beetle-b16", "name_ja": "ハガネクワガタ", "tier": "序盤", "element": "無", "flavor_ja": "あごが歯車になっていて、カチカチ噛み合わせて回す。鉄のにおいがする働き者。", "img": "gacha_b16/gear-stag-beetle-b16.png"}, {"id": "crystal-ant-soldier-b16", "name_ja": "ケッショウアリへい", "tier": "序盤", "element": "無", "flavor_ja": "体じゅうが紫の結晶でできた小さなアリ。光を当てるとキラキラ屈折してきれい。", "img": "gacha_b16/crystal-ant-soldier-b16.png"}, {"id": "voltage-hornet-b16", "name_ja": "デンアツスズメバチ", "tier": "中盤", "element": "電気", "flavor_ja": "おしりの針が電極になっていて、高電圧をバチバチ流すスズメバチ。羽は銅のあみ。", "img": "gacha_b16/voltage-hornet-b16.png"}, {"id": "magnet-mantis-b16", "name_ja": "ジリョクカマキリ", "tier": "中盤", "element": "無", "flavor_ja": "両うでが赤青の磁石になったカマキリ。砂鉄をまとって、近づくものを引き寄せる。", "img": "gacha_b16/magnet-mantis-b16.png"}, {"id": "prism-dragonfly-b16", "name_ja": "ニジイロヤンマ", "tier": "中盤", "element": "光", "flavor_ja": "ガラスの羽が光をプリズムみたいに虹色に分ける、ずんぐりしたトンボ。", "img": "gacha_b16/prism-dragonfly-b16.png"}, {"id": "reactor-cicada-b16", "name_ja": "ロカクセミ", "tier": "終盤", "element": "炎", "flavor_ja": "背中に小さな炉をかかえ、ジリジリと熱を発する重装甲のセミ。鳴くたび熱波が出る。", "img": "gacha_b16/reactor-cicada-b16.png"}, {"id": "thunder-rhino-beetle-b16", "name_ja": "ライメイカブト", "tier": "終盤", "element": "電気", "flavor_ja": "大きな角が避雷針になった巨大カブトムシ。角からドカンと雷を落とす理科の王者。", "img": "gacha_b16/thunder-rhino-beetle-b16.png"}, {"id": "atomic-empress-mantis-b16", "name_ja": "ゲンシジョオウ", "tier": "ラスボス級", "element": "光", "flavor_ja": "原子の輝きをまとう女王カマキリ。結晶の体に金の回路が走り、ラスボスの威厳を放つ。", "img": "gacha_b16/atomic-empress-mantis-b16.png"}, {"id": "omega-hive-titan-b16", "name_ja": "オメガ・ハイヴ", "tier": "ラスボス級", "element": "無", "flavor_ja": "歯車と六角形の回路でできた、巣そのものが怪物になった最終形態。すべての昆虫兵器の頂点。", "img": "gacha_b16/omega-hive-titan-b16.png"}, {"id": "iron-shell-tortoise-b16", "name_ja": "てっこうリクガメ", "tier": "序盤", "element": "土", "flavor_ja": "甲羅がまるごと鉄板でできたリクガメ。動きはのろいが、生半可な攻撃は『キンッ』とはじき返す。さびた甲羅は長く生きた証。", "img": "gacha_b16/iron-shell-tortoise-b16.png"}, {"id": "pebble-armadillo-pup-b16", "name_ja": "つぶてアルマジロ", "tier": "序盤", "element": "土", "flavor_ja": "石ころが固まってできた甲羅をもつ小さなアルマジロ。まるくなって転がってくる。ぶつかると小石がパラパラとこぼれる。", "img": "gacha_b16/pebble-armadillo-pup-b16.png"}, {"id": "trilobite-scout-b16", "name_ja": "サンヨウムシ・ヘイ", "tier": "序盤", "element": "水", "flavor_ja": "大昔の海にいた三葉虫のすがた。化石のような青灰色の殻をもち、岩のすきまをカサカサと歩く。理科室の標本がうごきだしたみたい。", "img": "gacha_b16/trilobite-scout-b16.png"}, {"id": "magnetite-rhino-b16", "name_ja": "じてつサイ", "tier": "中盤", "element": "土", "flavor_ja": "体じゅうが磁鉄鉱（じてっこう）でできたサイ。角に砂鉄がびっしりと吸いついている。近づいた金属はみんな引き寄せられる。", "img": "gacha_b16/magnetite-rhino-b16.png"}, {"id": "fortress-hermit-crab-b16", "name_ja": "ようさいヤドカリ", "tier": "中盤", "element": "水", "flavor_ja": "貝がらのかわりに、石づくりの小さな要塞を背負ったヤドカリ。中にこもると、ぶ厚いハサミでフタをして守りはカンペキ。", "img": "gacha_b16/fortress-hermit-crab-b16.png"}, {"id": "geode-snapper-b16", "name_ja": "しょうせきガメ", "tier": "中盤", "element": "土", "flavor_ja": "甲羅の中に水晶のつぶがびっしり育った大ガメ。割れ目からむらさき色の結晶がのぞく。重そうな甲羅を引きずって歩く。", "img": "gacha_b16/geode-snapper-b16.png"}, {"id": "pressure-isopod-titan-b16", "name_ja": "しんかいダイオウ", "tier": "終盤", "element": "水", "flavor_ja": "深い海の底のすさまじい水圧にたえる、巨大なダンゴムシのすがた。ぶ厚い殻がプレートのように重なり、丸まればどんな攻撃もはね返す。", "img": "gacha_b16/pressure-isopod-titan-b16.png"}, {"id": "tungsten-dreadshell-b16", "name_ja": "ごうきんダイガメ", "tier": "終盤", "element": "土", "flavor_ja": "戦車のような合金の甲羅をまとった超大型のカメ。つなぎ目がオレンジ色に熱で光る。一歩あるくだけで地ひびきがする、動く要塞。", "img": "gacha_b16/tungsten-dreadshell-b16.png"}, {"id": "diamond-anvil-trilobite-king-b16", "name_ja": "ダイヤサンヨウオウ", "tier": "ラスボス級", "element": "土", "flavor_ja": "太古の海を支配した三葉虫の王。ダイヤモンドの結晶と鍛えた鉄が一体になった殻は、あらゆる衝撃を受け流す。どんな攻撃もはじく無敵の装甲。", "img": "gacha_b16/diamond-anvil-trilobite-king-b16.png"}, {"id": "core-pressure-leviathan-b16", "name_ja": "ちかくのぬし・アトラス", "tier": "ラスボス級", "element": "土", "flavor_ja": "地殻そのものを背負う、亀と甲殻の合体した最強の主（ぬし）。甲羅のひび割れからマグマがあふれる。地球の重さでどっしりと根を張り、決して倒れない。", "img": "gacha_b16/core-pressure-leviathan-b16.png"}]; const KEY="rika2_boss_swipe_gacha_b16";
let st=JSON.parse(localStorage.getItem(KEY)||"null")||{idx:0,dec:{}};
function save(){localStorage.setItem(KEY,JSON.stringify(st));}
const stage=document.getElementById("stage");
document.getElementById("total_n").textContent=BOSSES.length;
let card=null,startX=0,curX=0,dragging=false;

function counts(){const y=Object.values(st.dec).filter(v=>v==="yes").length;
  document.getElementById("done_n").textContent=Object.keys(st.dec).length;
  document.getElementById("yes_n").textContent=y;}

function build(idx){
  const b=BOSSES[idx]; const el=document.createElement("div"); el.className="card";
  el.innerHTML=`<div class="stamp yes">有り</div><div class="stamp no">無し</div>
    <div class="imgbox"><img src="${b.img}" alt=""></div>
    <div class="info"><div class="nm">${b.name_ja}<span class="tier t${b.tier}">${b.tier}</span></div>
    <div class="el">${b.element}</div><div class="fl">${b.flavor_ja}</div></div>`;
  el.addEventListener("pointerdown",down); el.addEventListener("pointermove",move);
  el.addEventListener("pointerup",up); el.addEventListener("pointercancel",up);
  return el;
}
function show(){
  if(card){card.remove();card=null;}
  if(st.idx>=BOSSES.length){document.getElementById("doneScreen").style.display="flex";finish();return;}
  document.getElementById("doneScreen").style.display="none";
  card=build(st.idx); stage.appendChild(card); counts();
}
function down(e){dragging=true;startX=e.clientX;curX=0;card.setPointerCapture(e.pointerId);card.style.transition="none";}
function move(e){if(!dragging)return;curX=e.clientX-startX;card.style.transform=`translateX(${curX}px) rotate(${curX/18}deg)`;
  card.querySelector(".yes").style.opacity=Math.max(0,Math.min(1,curX/90));
  card.querySelector(".no").style.opacity=Math.max(0,Math.min(1,-curX/90));}
function up(){if(!dragging)return;dragging=false;
  if(curX>90)decide("yes");else if(curX<-90)decide("no");
  else{card.style.transition=".2s";card.style.transform="";card.querySelector(".yes").style.opacity=0;card.querySelector(".no").style.opacity=0;}}
function decide(v){
  st.dec[BOSSES[st.idx].id]=v; save();
  const dir=v==="yes"?1:-1;
  card.style.transition=".3s ease-out";
  card.style.transform=`translateX(${dir*140}vw) rotate(${dir*25}deg)`;
  card.style.opacity="0";
  setTimeout(()=>{st.idx++;save();show();},260);
}
function undo(){if(st.idx<=0)return;st.idx--;delete st.dec[BOSSES[st.idx].id];save();show();}
function summaryText(){
  const yes=BOSSES.filter(b=>st.dec[b.id]==="yes"),no=BOSSES.filter(b=>st.dec[b.id]==="no");
  let s=`=== ボス選別 結果 (有り${yes.length} / 無し${no.length} / 計${BOSSES.length}) ===\n【有り】\n`;
  yes.forEach(b=>s+=`- ${b.name_ja} (${b.tier}/${b.element}) [${b.id}]\n`);
  s+="【無し】\n"; no.forEach(b=>s+=`- ${b.name_ja} (${b.tier}/${b.element}) [${b.id}]\n`);
  return s;
}
function finish(){
  const yes=BOSSES.filter(b=>st.dec[b.id]==="yes").length;
  document.getElementById("summary").textContent=`有り ${yes} 体 / 無し ${BOSSES.length-yes} 体`;
}
function copyOut(){const s=summaryText();const o=document.getElementById("out");o.style.display="block";o.value=s;
  if(navigator.clipboard)navigator.clipboard.writeText(s).then(()=>{const t=document.getElementById("toast");t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1500);},()=>{});o.select();}
document.getElementById("bNo").onclick=()=>{if(st.idx<BOSSES.length)decide("no");};
document.getElementById("bYes").onclick=()=>{if(st.idx<BOSSES.length)decide("yes");};
document.getElementById("bUndo").onclick=undo;
document.getElementById("bCopy").onclick=copyOut;
document.getElementById("copyBtn").onclick=copyOut;
document.getElementById("restartBtn").onclick=()=>{st={idx:0,dec:{}};save();show();};
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"&&st.idx<BOSSES.length)decide("no");
  else if(e.key==="ArrowRight"&&st.idx<BOSSES.length)decide("yes");else if(e.key==="Backspace")undo();});
show();
</script></body></html>
