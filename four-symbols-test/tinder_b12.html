<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>ボス選別 — 理科RPG2</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0f1014;color:#e7e7ea;font-family:system-ui,"Hiragino Kaku Gothic ProN",sans-serif;overflow:hidden;height:100dvh}
header{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;background:#1a1c22;border-bottom:1px solid #2c2f3a}
header b{color:#ffe27a}.count{font-size:13px;color:#9aa0ad}
.stage{position:relative;height:calc(100dvh - 150px);display:flex;align-items:center;justify-content:center;padding:10px}
.card{position:absolute;width:min(92vw,440px);max-height:100%;background:#1d1f26;border:1px solid #2c2f3a;border-radius:18px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5);touch-action:none}
.imgbox{aspect-ratio:1/1;
  background-image:linear-gradient(45deg,#cfcfcf 25%,transparent 25%),linear-gradient(-45deg,#cfcfcf 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#cfcfcf 75%),linear-gradient(-45deg,transparent 75%,#cfcfcf 75%);
  background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0;background-color:#e9e9e9}
.imgbox img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.info{padding:12px 16px}
.nm{font-size:22px;font-weight:800}
.nm .tier{font-size:14px;font-weight:700;padding:2px 10px;border-radius:999px;margin-left:8px;vertical-align:3px}
.t序盤{background:#2bd47a;color:#06210f}.t中盤{background:#4aa3ff;color:#04203f}.t終盤{background:#ff9a3c;color:#311600}.tラスボス級{background:#ff5a7a;color:#33000d}
.el{font-size:12px;color:#9aa0ad;margin-top:2px}
.fl{font-size:14px;color:#cfd3db;margin-top:8px;line-height:1.55}
.stamp{position:absolute;top:18px;font-size:34px;font-weight:900;padding:4px 14px;border:4px solid;border-radius:12px;opacity:0;transform:rotate(-15deg)}
.yes{left:18px;color:#2bd47a;border-color:#2bd47a}.no{right:18px;color:#ff5a7a;border-color:#ff5a7a}
.bar{position:fixed;bottom:0;left:0;right:0;height:90px;display:flex;align-items:center;justify-content:center;gap:22px;background:#13141a;border-top:1px solid #2c2f3a}
.fab{width:62px;height:62px;border-radius:50%;border:none;font-size:26px;cursor:pointer;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.fab.no{background:#2a1d23;color:#ff5a7a;border:2px solid #ff5a7a}.fab.yes{background:#16271c;color:#2bd47a;border:2px solid #2bd47a}
.fab.undo{width:48px;height:48px;font-size:18px;background:#23242c;color:#cfd3db;border:1px solid #3a3f4c}
.done{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.done h2{color:#ffe27a;margin:0 0 8px}
.btn{margin-top:14px;background:#ffe27a;color:#15161a;border:none;border-radius:10px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
#out{margin-top:12px;width:min(92vw,520px);height:160px;font-family:ui-monospace,monospace;font-size:11px;display:none;background:#0b0c10;color:#cfd3db;border:1px solid #3a3f4c;border-radius:8px;padding:8px}
.hint{font-size:11px;color:#6b7280;margin-top:6px}
.toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%);background:#2bd47a;color:#08210f;padding:8px 16px;border-radius:999px;font-weight:700;opacity:0;transition:.3s;pointer-events:none}.toast.show{opacity:1}
</style></head><body>
<header><div><b>ボス選別</b> <span style="font-size:12px;color:#9aa0ad">← 無し / 有り → ・ドラッグもOK</span></div>
  <div class="count"><span id="done_n">0</span>/<span id="total_n">0</span> ・有り<span id="yes_n">0</span></div></header>
<div class="stage" id="stage">
  <div class="done" id="doneScreen">
    <h2>選別おわり！</h2>
    <div id="summary" style="color:#cfd3db"></div>
    <button class="btn" id="copyBtn">結果をコピー</button>
    <div class="hint">コピーしたテキストをチャットに貼ってください（採用の系統を学習して次の50枚へ）。</div>
    <textarea id="out" readonly></textarea>
    <button class="btn" id="restartBtn" style="background:#3a3f4c;color:#e7e7ea">最初からやり直す</button>
  </div>
</div>
<div class="bar">
  <button class="fab no" id="bNo">✗</button>
  <button class="fab undo" id="bUndo">↶</button>
  <button class="fab yes" id="bYes">♥</button>
  <button class="btn" id="bCopy" style="position:fixed;right:12px;bottom:104px;padding:8px 12px;font-size:12px">途中保存コピー</button>
</div>
<div class="toast" id="toast">コピーしました！</div>
<script>
const BOSSES=[{"id": "bubble-puffer-pop-b12", "name_ja": "あわぷくフグ", "tier": "序盤", "element": "水", "flavor_ja": "ぷくっとふくらむと体じゅうから泡をまとう、表面張力のいたずらっ子。割れても本人はけろっとしている。", "img": "gacha_b12/bubble-puffer-pop-b12.png"}, {"id": "spark-hatchling-pop-b12", "name_ja": "ピリピリひよこ", "tier": "序盤", "element": "雷", "flavor_ja": "なでるとパチッとくる静電気のかたまり。本人は気づかずニコニコしている。", "img": "gacha_b12/spark-hatchling-pop-b12.png"}, {"id": "geode-pebble-pop-b12", "name_ja": "ジオードころ太", "tier": "序盤", "element": "土", "flavor_ja": "外は地味な石ころ、中はキラキラの晶洞。割られるのを少し恥ずかしがる。", "img": "gacha_b12/geode-pebble-pop-b12.png"}, {"id": "prism-fox-pop-b12", "name_ja": "プリズムこぎつね", "tier": "中盤", "element": "光", "flavor_ja": "ひたいのプリズムで光を七色に分ける、まぶしがりやの子ぎつね。曇りの日は元気がない。", "img": "gacha_b12/prism-fox-pop-b12.png"}, {"id": "magnet-beetle-pop-b12", "name_ja": "マグネかぶと", "tier": "中盤", "element": "磁", "flavor_ja": "つのが磁石になっていて、鉄のかけらをいつも背中にくっつけている働き者。N極とS極でケンカしない。", "img": "gacha_b12/magnet-beetle-pop-b12.png"}, {"id": "fizz-cauldron-pop-b12", "name_ja": "シュワポット", "tier": "中盤", "element": "化学", "flavor_ja": "おなかの中でいつも反応がシュワシュワ進んでいる、ごきげんな小なべ。中身は混ぜると色が変わる。", "img": "gacha_b12/fizz-cauldron-pop-b12.png"}, {"id": "plasma-jelly-king-pop-b12", "name_ja": "プラズマくらげ王", "tier": "終盤", "element": "雷", "flavor_ja": "ドームの中で稲妻をうずまかせる海の王。怒ると体じゅうがピンクと水色に輝く。", "img": "gacha_b12/plasma-jelly-king-pop-b12.png"}, {"id": "crystal-bloom-golem-pop-b12", "name_ja": "クリスタル花ゴーレム", "tier": "終盤", "element": "結晶", "flavor_ja": "体じゅうに結晶を咲かせる温厚な巨人。鉱物の花は割れてもまた生えてくる。", "img": "gacha_b12/crystal-bloom-golem-pop-b12.png"}, {"id": "aurora-spectrum-sovereign-pop-b12", "name_ja": "オーロラ光帝", "tier": "ラスボス級", "element": "光", "flavor_ja": "全ての色をまとう光の帝王。その輝きは虹を従え、見る者を圧倒する。", "img": "gacha_b12/aurora-spectrum-sovereign-pop-b12.png"}, {"id": "voltaic-storm-titan-pop-b12", "name_ja": "雷神ボルテックス", "tier": "ラスボス級", "element": "雷", "flavor_ja": "こぶしから雷の鎖を放つ電磁の巨神。その一歩で大地が震え、空気が帯電する。", "img": "gacha_b12/voltaic-storm-titan-pop-b12.png"}, {"id": "prism-beetle-cub-b12", "name_ja": "プリズムビートル", "tier": "序盤", "element": "光学", "flavor_ja": "背中の結晶が光をわけて、いつも小さな虹をまとっている。ぶつかるとキラッと七色にはじける。", "img": "gacha_b12/prism-beetle-cub-b12.png"}, {"id": "neon-slime-glow-b12", "name_ja": "ネオンスライム", "tier": "序盤", "element": "発光", "flavor_ja": "体の中でひかる小さなプランクトンが、ぷるぷる光って道をてらす。さわるとひんやり光る。", "img": "gacha_b12/neon-slime-glow-b12.png"}, {"id": "spark-mochi-frog-b12", "name_ja": "スパークもちガエル", "tier": "序盤", "element": "プラズマ", "flavor_ja": "しめったお肌の上を、小さな電気がぴりぴり走る。びっくりするとパチッと光る。", "img": "gacha_b12/spark-mochi-frog-b12.png"}, {"id": "candy-crystal-snail-b12", "name_ja": "キャンディクリスタルマイマイ", "tier": "中盤", "element": "結晶", "flavor_ja": "せなかの貝がらは虹のお砂糖の結晶。ゆっくり進むたびに、きらきら光がこぼれる。", "img": "gacha_b12/candy-crystal-snail-b12.png"}, {"id": "aurora-jelly-ray-b12", "name_ja": "オーロラジェリー", "tier": "中盤", "element": "発光", "flavor_ja": "かさの中をオーロラの光がゆらゆら流れる。ふれると色がさざ波みたいに広がる。", "img": "gacha_b12/aurora-jelly-ray-b12.png"}, {"id": "plasma-puffer-orb-b12", "name_ja": "プラズマフグ", "tier": "中盤", "element": "プラズマ", "flavor_ja": "おこるとぷくっとふくらみ、体じゅうのトゲがプラズマでぼうっと光る。まんまるで重たい。", "img": "gacha_b12/plasma-puffer-orb-b12.png"}, {"id": "diffraction-mantis-lord-b12", "name_ja": "ディフラクトマンティス", "tier": "終盤", "element": "光学", "flavor_ja": "鎧のすじが光を回折させ、動くたびに虹のしまもようが走る。たたずまいだけで圧がある。", "img": "gacha_b12/diffraction-mantis-lord-b12.png"}, {"id": "magma-opal-tortoise-b12", "name_ja": "オパールマグマガメ", "tier": "終盤", "element": "結晶", "flavor_ja": "甲らはオパールの炎。割れ目の奥でマグマみたいな光がゆっくり脈打つ。どっしり動かない。", "img": "gacha_b12/magma-opal-tortoise-b12.png"}, {"id": "spectrum-archdragon-b12", "name_ja": "スペクトラム・アークドラゴン", "tier": "ラスボス級", "element": "光学", "flavor_ja": "全身のガラス鱗が光をすべての色に分けて流す。にらむだけで虹の波がうねる、頂点の竜。", "img": "gacha_b12/spectrum-archdragon-b12.png"}, {"id": "primordia-plasma-core-b12", "name_ja": "プリモルディア・プラズマコア", "tier": "ラスボス級", "element": "プラズマ", "flavor_ja": "極彩色のプラズマを結晶のからに閉じこめた、小さな星のような芯。ひび割れから光があふれ出す。", "img": "gacha_b12/primordia-plasma-core-b12.png"}, {"id": "ember-sprout-spirit-b12", "name_ja": "ひのこチビ", "tier": "序盤", "element": "炎", "flavor_ja": "ぽっと燃えるちっちゃな炎の精霊。頭のてっぺんでチョロチョロ火が揺れる。さわるとあったかい。", "img": "gacha_b12/ember-sprout-spirit-b12.png"}, {"id": "dewdrop-blob-spirit-b12", "name_ja": "しずくプニ", "tier": "序盤", "element": "水", "flavor_ja": "ぷにぷに揺れる水のしずく精霊。さわるとひんやり気持ちいい。中に小さなあぶくが浮く。", "img": "gacha_b12/dewdrop-blob-spirit-b12.png"}, {"id": "puff-breeze-spirit-b12", "name_ja": "そよかぜポフ", "tier": "序盤", "element": "風", "flavor_ja": "ふわふわ漂う風の精霊。ほっぺをふくらませてそよ風をはく。のんびり屋でよく眠る。", "img": "gacha_b12/puff-breeze-spirit-b12.png"}, {"id": "spark-zappy-spirit-b12", "name_ja": "ビリビリパチ", "tier": "中盤", "element": "雷", "flavor_ja": "パチパチはじける雷の精霊。元気いっぱいで体じゅうに静電気がはしる。さわるとビリッ！", "img": "gacha_b12/spark-zappy-spirit-b12.png"}, {"id": "frost-mochi-spirit-b12", "name_ja": "こおりモチ", "tier": "中盤", "element": "氷", "flavor_ja": "つるんと冷たい氷の精霊。表面にうっすら霜がついている。ほっぺが冷たくて赤い。", "img": "gacha_b12/frost-mochi-spirit-b12.png"}, {"id": "pebble-clod-spirit-b12", "name_ja": "つちころコロ", "tier": "中盤", "element": "土", "flavor_ja": "どっしり構える土の精霊。背中にちょこっと苔が生えている。重そうだけど意外とすばしっこい。", "img": "gacha_b12/pebble-clod-spirit-b12.png"}, {"id": "lantern-glow-spirit-b12", "name_ja": "ひかりポワ", "tier": "終盤", "element": "光", "flavor_ja": "ほんわか光る光の精霊。体の内側からやさしく発光する。近くにいるとなんだか安心する。", "img": "gacha_b12/lantern-glow-spirit-b12.png"}, {"id": "magma-tot-spirit-b12", "name_ja": "マグマちび王", "tier": "終盤", "element": "炎", "flavor_ja": "ちっちゃいのに貫禄たっぷりのマグマ精霊。体のひび割れから溶岩がにじむ。精霊たちの兄貴分。", "img": "gacha_b12/magma-tot-spirit-b12.png"}, {"id": "prism-monarch-spirit-b12", "name_ja": "ななついろ大精霊", "tier": "ラスボス級", "element": "光", "flavor_ja": "七つの元素をその身にまとう精霊たちの王。ちっちゃくても王さま。全属性の力をあやつる。", "img": "gacha_b12/prism-monarch-spirit-b12.png"}, {"id": "voidcore-element-spirit-b12", "name_ja": "そうげん・コアちび", "tier": "ラスボス級", "element": "雷", "flavor_ja": "あらゆる元素のおおもと、宇宙のかけらから生まれたコア精霊。小さな体に途方もない力を秘める。", "img": "gacha_b12/voidcore-element-spirit-b12.png"}, {"id": "pop-axolotl-bubble-sprout-b12", "name_ja": "ポチャ・ウパまる", "tier": "序盤", "element": "水・生命", "flavor_ja": "ぷにぷにのまるい赤ちゃん怪物。エラからあわをぷくぷく出して、見ているだけでにっこりしてしまう。", "img": "gacha_b12/pop-axolotl-bubble-sprout-b12.png"}, {"id": "pop-clownfish-anemone-buddy-b12", "name_ja": "クマノミ・ぷりん", "tier": "序盤", "element": "水・毒", "flavor_ja": "イソギンチャクのフードをかぶった、まんまるオレンジのおさかな。さわると毒のしびれがピリッ。", "img": "gacha_b12/pop-clownfish-anemone-buddy-b12.png"}, {"id": "pop-frog-spark-tongue-b12", "name_ja": "ビリゲコ", "tier": "序盤", "element": "電気・生命", "flavor_ja": "ぷっくりお腹のカエル怪物。しめった肌にビリビリの静電気をためて、舌でパチッとしびれさせる。", "img": "gacha_b12/pop-frog-spark-tongue-b12.png"}, {"id": "pop-pufferfish-pressure-orb-b12", "name_ja": "フグばくだん", "tier": "中盤", "element": "圧力・毒", "flavor_ja": "パンパンにふくらんだトゲのボール。中の圧力でいまにもはちきれそう、トゲには毒がしみている。", "img": "gacha_b12/pop-pufferfish-pressure-orb-b12.png"}, {"id": "pop-jellyfish-glow-bell-b12", "name_ja": "ヒカリクラ", "tier": "中盤", "element": "発光・毒", "flavor_ja": "中からぼうっと光る、まるいゼリーのかさ。短い触手にはチクッとくる毒の光がともる。", "img": "gacha_b12/pop-jellyfish-glow-bell-b12.png"}, {"id": "pop-seahorse-current-coil-b12", "name_ja": "タツノうずまき", "tier": "中盤", "element": "電気・水", "flavor_ja": "ずんぐりしたタツノオトシゴ。とぐろを巻いたしっぽでどっしり立ち、体のうろこに電気が走る。", "img": "gacha_b12/pop-seahorse-current-coil-b12.png"}, {"id": "pop-sunfish-deep-titan-b12", "name_ja": "マンボウ・ぬし", "tier": "終盤", "element": "圧力・水", "flavor_ja": "深い海の主となった巨大マンボウ。平たい体が壁のようにそびえ、まわりの水を圧でゆがめる。", "img": "gacha_b12/pop-sunfish-deep-titan-b12.png"}, {"id": "pop-axolotl-venom-elder-b12", "name_ja": "ウパ・ベノマ", "tier": "終盤", "element": "毒・発光", "flavor_ja": "おとなになったウーパールーパーの王。エラから毒の光がしたたり、体の中を毒の血管が脈打つ。", "img": "gacha_b12/pop-axolotl-venom-elder-b12.png"}, {"id": "pop-pufferfish-storm-sovereign-b12", "name_ja": "フグ大魔王・ゼツアツ", "tier": "ラスボス級", "element": "圧力・電気", "flavor_ja": "極限まで膨れ上がった圧力と雷をまとうフグの大魔王。トゲの間に稲妻が走り、近づくだけで圧がのしかかる。", "img": "gacha_b12/pop-pufferfish-storm-sovereign-b12.png"}, {"id": "pop-jellyfish-abyss-monarch-b12", "name_ja": "シンカイ・クラゲ帝", "tier": "ラスボス級", "element": "発光・圧力", "flavor_ja": "深海の底でまばゆく輝くクラゲの帝。透きとおる体の奥で光が燃え、まわりの水を圧でゆがめる。", "img": "gacha_b12/pop-jellyfish-abyss-monarch-b12.png"}, {"id": "chick-sparkfeather-b12", "name_ja": "ヒナホムラ", "tier": "序盤", "element": "炎", "flavor_ja": "まだ飛べない火の鳥のあかちゃん。羽がふわふわで、おしりからちいさな火がこぼれる。", "img": "gacha_b12/chick-sparkfeather-b12.png"}, {"id": "peafowl-poult-b12", "name_ja": "クジャクっこ", "tier": "序盤", "element": "風", "flavor_ja": "おうぎを広げる練習中のクジャクのこども。羽の目玉もようがまだ小さくてかわいい。", "img": "gacha_b12/peafowl-poult-b12.png"}, {"id": "wisp-piskie-b12", "name_ja": "ピスケのとも", "tier": "序盤", "element": "光", "flavor_ja": "てのひらサイズの森の妖精。羽からきらきらの光のこなをこぼしながらついてくる。", "img": "gacha_b12/wisp-piskie-b12.png"}, {"id": "kirin-foal-b12", "name_ja": "キリンのこ", "tier": "中盤", "element": "光", "flavor_ja": "縁起のよい聖獣・麒麟のこども。あんよのまわりにやさしい光がともる。", "img": "gacha_b12/kirin-foal-b12.png"}, {"id": "dracling-jade-b12", "name_ja": "ヒスイの子竜", "tier": "中盤", "element": "水", "flavor_ja": "川にすむ東洋の子竜。からだを丸めてちょこんと座る。うろこがいつもしっとり光る。", "img": "gacha_b12/dracling-jade-b12.png"}, {"id": "thunder-peacock-b12", "name_ja": "イカヅチクジャク", "tier": "中盤", "element": "雷", "flavor_ja": "羽の目玉から雷を放つ大きなクジャク。おうぎを広げると空気がぴりぴりする。", "img": "gacha_b12/thunder-peacock-b12.png"}, {"id": "phoenix-ascendant-b12", "name_ja": "ホウオウ・燃", "tier": "終盤", "element": "炎", "flavor_ja": "炎をまとってよみがえる不死の鳳凰。羽の一枚一枚が燃えている。", "img": "gacha_b12/phoenix-ascendant-b12.png"}, {"id": "kirin-sovereign-b12", "name_ja": "麒麟・聖王", "tier": "終盤", "element": "光", "flavor_ja": "天下泰平のしるしとされる聖獣・麒麟の成獣。歩いたあとに花が咲くという。", "img": "gacha_b12/kirin-sovereign-b12.png"}, {"id": "feng-empress-b12", "name_ja": "鳳凰帝・瑞光", "tier": "ラスボス級", "element": "光", "flavor_ja": "鳳凰と孔雀の力をあわせもつ瑞鳥の女帝。広げた尾は虹の目玉でかがやく。", "img": "gacha_b12/feng-empress-b12.png"}, {"id": "tenryu-godking-b12", "name_ja": "天龍麒神王", "tier": "ラスボス級", "element": "雷", "flavor_ja": "竜と麒麟が一つになった雷の神王。咆哮ひとつで天が割れるという最終の守護神。", "img": "gacha_b12/tenryu-godking-b12.png"}]; const KEY="rika2_boss_swipe_gacha_b12";
let st=JSON.parse(localStorage.getItem(KEY)||"null")||{idx:0,dec:{}};
function save(){localStorage.setItem(KEY,JSON.stringify(st));}
const stage=document.getElementById("stage");
document.getElementById("total_n").textContent=BOSSES.length;
let card=null,startX=0,curX=0,dragging=false;

function counts(){const y=Object.values(st.dec).filter(v=>v==="yes").length;
  document.getElementById("done_n").textContent=Object.keys(st.dec).length;
  document.getElementById("yes_n").textContent=y;}

function build(idx){
  const b=BOSSES[idx]; const el=document.createElement("div"); el.className="card";
  el.innerHTML=`<div class="stamp yes">有り</div><div class="stamp no">無し</div>
    <div class="imgbox"><img src="${b.img}" alt=""></div>
    <div class="info"><div class="nm">${b.name_ja}<span class="tier t${b.tier}">${b.tier}</span></div>
    <div class="el">${b.element}</div><div class="fl">${b.flavor_ja}</div></div>`;
  el.addEventListener("pointerdown",down); el.addEventListener("pointermove",move);
  el.addEventListener("pointerup",up); el.addEventListener("pointercancel",up);
  return el;
}
function show(){
  if(card){card.remove();card=null;}
  if(st.idx>=BOSSES.length){document.getElementById("doneScreen").style.display="flex";finish();return;}
  document.getElementById("doneScreen").style.display="none";
  card=build(st.idx); stage.appendChild(card); counts();
}
function down(e){dragging=true;startX=e.clientX;curX=0;card.setPointerCapture(e.pointerId);card.style.transition="none";}
function move(e){if(!dragging)return;curX=e.clientX-startX;card.style.transform=`translateX(${curX}px) rotate(${curX/18}deg)`;
  card.querySelector(".yes").style.opacity=Math.max(0,Math.min(1,curX/90));
  card.querySelector(".no").style.opacity=Math.max(0,Math.min(1,-curX/90));}
function up(){if(!dragging)return;dragging=false;
  if(curX>90)decide("yes");else if(curX<-90)decide("no");
  else{card.style.transition=".2s";card.style.transform="";card.querySelector(".yes").style.opacity=0;card.querySelector(".no").style.opacity=0;}}
function decide(v){
  st.dec[BOSSES[st.idx].id]=v; save();
  const dir=v==="yes"?1:-1;
  card.style.transition=".3s ease-out";
  card.style.transform=`translateX(${dir*140}vw) rotate(${dir*25}deg)`;
  card.style.opacity="0";
  setTimeout(()=>{st.idx++;save();show();},260);
}
function undo(){if(st.idx<=0)return;st.idx--;delete st.dec[BOSSES[st.idx].id];save();show();}
function summaryText(){
  const yes=BOSSES.filter(b=>st.dec[b.id]==="yes"),no=BOSSES.filter(b=>st.dec[b.id]==="no");
  let s=`=== ボス選別 結果 (有り${yes.length} / 無し${no.length} / 計${BOSSES.length}) ===\n【有り】\n`;
  yes.forEach(b=>s+=`- ${b.name_ja} (${b.tier}/${b.element}) [${b.id}]\n`);
  s+="【無し】\n"; no.forEach(b=>s+=`- ${b.name_ja} (${b.tier}/${b.element}) [${b.id}]\n`);
  return s;
}
function finish(){
  const yes=BOSSES.filter(b=>st.dec[b.id]==="yes").length;
  document.getElementById("summary").textContent=`有り ${yes} 体 / 無し ${BOSSES.length-yes} 体`;
}
function copyOut(){const s=summaryText();const o=document.getElementById("out");o.style.display="block";o.value=s;
  if(navigator.clipboard)navigator.clipboard.writeText(s).then(()=>{const t=document.getElementById("toast");t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1500);},()=>{});o.select();}
document.getElementById("bNo").onclick=()=>{if(st.idx<BOSSES.length)decide("no");};
document.getElementById("bYes").onclick=()=>{if(st.idx<BOSSES.length)decide("yes");};
document.getElementById("bUndo").onclick=undo;
document.getElementById("bCopy").onclick=copyOut;
document.getElementById("copyBtn").onclick=copyOut;
document.getElementById("restartBtn").onclick=()=>{st={idx:0,dec:{}};save();show();};
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"&&st.idx<BOSSES.length)decide("no");
  else if(e.key==="ArrowRight"&&st.idx<BOSSES.length)decide("yes");else if(e.key==="Backspace")undo();});
show();
</script></body></html>
