let st=JSON.parse(localStorage.getItem(KEY)||"null")||{i:0,d:{}};
function save(){localStorage.setItem(KEY,JSON.stringify(st));}
document.getElementById("tn").textContent=B.length;
const $=id=>document.getElementById(id);
function rec(id){ if(!st.d[id]){const b=B.find(x=>x.id===id),s=b.sugg||{}; st.d[id]={dec:"本採用",stars:s.stars||2,role:s.role||"わからない",strength:s.strength||5,attrs:(s.attrs||[]).slice(),species:(s.species||["その他"]).slice()};} return st.d[id]; }
function chips(host,items,sel,multi,onpick,sugg){ host.innerHTML=""; items.forEach(v=>{const c=document.createElement("span");c.className="chip"+((multi?sel.includes(v):sel===v)?" on":"")+((sugg&&sugg.includes(v))?" sg":"");c.textContent=v;c.onclick=()=>onpick(v);host.appendChild(c);}); }
function render(){
  if(st.i>=B.length){$("card").style.display="none";$("nav").style.display="none";$("done").style.display="block";finish();return;}
  $("card").style.display="";$("nav").style.display="flex";$("done").style.display="none";
  const b=B[st.i], r=rec(b.id); $("img").src=b.img; $("nm").textContent=b.name_ja;
  $("meta").textContent=[b.tier,b.element,b.creature_type].filter(Boolean).join(" / ");
  document.querySelectorAll(".dec .chip").forEach(c=>c.classList.toggle("on",c.dataset.dec===r.dec));
  $("tags").classList.toggle("hide",r.dec!=="本採用");
  document.querySelectorAll(".star").forEach(s=>s.classList.toggle("on",+s.dataset.s<=r.stars));
  chips($("role"),ROLES,r.role,false,v=>{r.role=v;save();render();});
  chips($("str"),Array.from({length:5},(_,k)=>String(k+1)),String(r.strength),false,v=>{r.strength=+v;save();render();});
  chips($("attr"),ATTRS,r.attrs,true,v=>{toggle(r.attrs,v);save();render();},(b.sugg||{}).attrs);
  chips($("spec"),SPECIES,r.species,true,v=>{toggle(r.species,v);save();render();},(b.sugg||{}).species);
  $("dn").textContent=Object.keys(st.d).length;
}
function toggle(a,v){const k=a.indexOf(v);if(k<0)a.push(v);else a.splice(k,1);}
document.querySelectorAll(".dec .chip").forEach(c=>c.onclick=()=>{const r=rec(B[st.i].id);r.dec=c.dataset.dec;save();render();});
document.querySelectorAll(".star").forEach(s=>s.onclick=()=>{const r=rec(B[st.i].id);r.stars=+s.dataset.s;save();render();});
$("next").onclick=()=>{rec(B[st.i].id);st.i++;save();render();};
$("prev").onclick=()=>{if(st.i>0)st.i--;save();render();};
function csv(){let s="id,decision,stars,role,strength,attributes,species\n";B.forEach(b=>{const r=st.d[b.id];if(!r)return;const at=r.dec==="本採用"?r.attrs.join("|"):"";const sp=r.dec==="本採用"?r.species.join("|"):"";const st_=r.dec==="本採用"?r.stars:"";const rl=r.dec==="本採用"?r.role:"";const sg=r.dec==="本採用"?r.strength:"";s+=[b.id,r.dec,st_,rl,sg,at,sp].join(",")+"\n";});return s;}
function finish(){const v=Object.values(st.d);const a=v.filter(x=>x.dec==="本採用").length,g=v.filter(x=>x.dec==="再生成希望").length,n=v.filter(x=>x.dec==="不採用").length;$("sum").textContent=`本採用 ${a} / 再生成 ${g} / 不採用 ${n} / 計 ${B.length}`;$("out").value=csv();}
function copyCsv(){const s=csv();$("out").value=s;if(navigator.clipboard)navigator.clipboard.writeText(s).then(()=>{const t=$("toast");t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1500);});$("out").select();}
function dlCsv(){const s=csv();const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([s],{type:"text/csv"}));a.download="tag_result.csv";a.click();}
$("dl").onclick=dlCsv;$("cp").onclick=copyCsv;
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight"){$("next").click();}else if(e.key==="ArrowLeft"){$("prev").click();}});
render();
</script></body></html>
