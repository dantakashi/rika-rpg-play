<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>ボス選別 — 理科RPG2</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0f1014;color:#e7e7ea;font-family:system-ui,"Hiragino Kaku Gothic ProN",sans-serif;overflow:hidden;height:100dvh}
header{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;background:#1a1c22;border-bottom:1px solid #2c2f3a}
header b{color:#ffe27a}.count{font-size:13px;color:#9aa0ad}
.stage{position:relative;height:calc(100dvh - 150px);display:flex;align-items:center;justify-content:center;padding:10px}
.card{position:absolute;width:min(92vw,440px);max-height:100%;background:#1d1f26;border:1px solid #2c2f3a;border-radius:18px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5);touch-action:none}
.imgbox{aspect-ratio:1/1;
  background-image:linear-gradient(45deg,#cfcfcf 25%,transparent 25%),linear-gradient(-45deg,#cfcfcf 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#cfcfcf 75%),linear-gradient(-45deg,transparent 75%,#cfcfcf 75%);
  background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0;background-color:#e9e9e9}
.imgbox img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.info{padding:12px 16px}
.nm{font-size:22px;font-weight:800}
.nm .tier{font-size:14px;font-weight:700;padding:2px 10px;border-radius:999px;margin-left:8px;vertical-align:3px}
.t序盤{background:#2bd47a;color:#06210f}.t中盤{background:#4aa3ff;color:#04203f}.t終盤{background:#ff9a3c;color:#311600}.tラスボス級{background:#ff5a7a;color:#33000d}
.el{font-size:12px;color:#9aa0ad;margin-top:2px}
.fl{font-size:14px;color:#cfd3db;margin-top:8px;line-height:1.55}
.stamp{position:absolute;top:18px;font-size:34px;font-weight:900;padding:4px 14px;border:4px solid;border-radius:12px;opacity:0;transform:rotate(-15deg)}
.yes{left:18px;color:#2bd47a;border-color:#2bd47a}.no{right:18px;color:#ff5a7a;border-color:#ff5a7a}
.bar{position:fixed;bottom:0;left:0;right:0;height:90px;display:flex;align-items:center;justify-content:center;gap:22px;background:#13141a;border-top:1px solid #2c2f3a}
.fab{width:62px;height:62px;border-radius:50%;border:none;font-size:26px;cursor:pointer;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.fab.no{background:#2a1d23;color:#ff5a7a;border:2px solid #ff5a7a}.fab.yes{background:#16271c;color:#2bd47a;border:2px solid #2bd47a}
.fab.undo{width:48px;height:48px;font-size:18px;background:#23242c;color:#cfd3db;border:1px solid #3a3f4c}
.done{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.done h2{color:#ffe27a;margin:0 0 8px}
.btn{margin-top:14px;background:#ffe27a;color:#15161a;border:none;border-radius:10px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
#out{margin-top:12px;width:min(92vw,520px);height:160px;font-family:ui-monospace,monospace;font-size:11px;display:none;background:#0b0c10;color:#cfd3db;border:1px solid #3a3f4c;border-radius:8px;padding:8px}
.hint{font-size:11px;color:#6b7280;margin-top:6px}
.toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%);background:#2bd47a;color:#08210f;padding:8px 16px;border-radius:999px;font-weight:700;opacity:0;transition:.3s;pointer-events:none}.toast.show{opacity:1}
</style></head><body>
<header><div><b>ボス選別</b> <span style="font-size:12px;color:#9aa0ad">← 無し / 有り → ・ドラッグもOK</span></div>
  <div class="count"><span id="done_n">0</span>/<span id="total_n">0</span> ・有り<span id="yes_n">0</span></div></header>
<div class="stage" id="stage">
  <div class="done" id="doneScreen">
    <h2>選別おわり！</h2>
    <div id="summary" style="color:#cfd3db"></div>
    <button class="btn" id="copyBtn">結果をコピー</button>
    <div class="hint">コピーしたテキストをチャットに貼ってください（採用の系統を学習して次の50枚へ）。</div>
    <textarea id="out" readonly></textarea>
    <button class="btn" id="restartBtn" style="background:#3a3f4c;color:#e7e7ea">最初からやり直す</button>
  </div>
</div>
<div class="bar">
  <button class="fab no" id="bNo">✗</button>
  <button class="fab undo" id="bUndo">↶</button>
  <button class="fab yes" id="bYes">♥</button>
  <button class="btn" id="bCopy" style="position:fixed;right:12px;bottom:104px;padding:8px 12px;font-size:12px">途中保存コピー</button>
</div>
<div class="toast" id="toast">コピーしました！</div>
<script>
const BOSSES=[{"id": "gear-ram-ironox-b21", "name_ja": "ハグルマオクス", "tier": "序盤", "element": "magnetism", "flavor_ja": "歯車がかみ合うたび火花を散らす鋼鉄の牛。まわるトルクをそのまま角の一突きに変える、どっしりした序盤の機械獣。", "img": "gacha_b21/gear-ram-ironox-b21.png"}, {"id": "circuit-tick-chip-b21", "name_ja": "カイロダニ", "tier": "序盤", "element": "circuit", "flavor_ja": "回路基板を背負った小さな機械ダニ。配線を伝う光がチカチカ流れる、つつくと痺れるザコ枠の電子虫。", "img": "gacha_b21/circuit-tick-chip-b21.png"}, {"id": "solenoid-shellcrab-b21", "name_ja": "コイルガニ", "tier": "序盤", "element": "magnetism", "flavor_ja": "ハサミにコイルを巻きつけた重たいカニ。鉄粉をまとった磁力のハサミでガッチリ挟む、安定感ばつぐんの機械甲殻。", "img": "gacha_b21/solenoid-shellcrab-b21.png"}, {"id": "piston-boar-forge-b21", "name_ja": "ピストンボア", "tier": "中盤", "element": "pressure", "flavor_ja": "ピストンが胴を脈打たせる鋳鉄の猪。蒸気を噴いて圧力をためこみ、鋼の牙で突進する中堅の機械獣。", "img": "gacha_b21/piston-boar-forge-b21.png"}, {"id": "resonance-mantis-tuner-b21", "name_ja": "オンパカマキリ", "tier": "中盤", "element": "acoustic", "flavor_ja": "音叉の腕を持つ金属のカマキリ。共鳴で空気を震わせ、振動の刃で斬りつける中盤の機械虫。", "img": "gacha_b21/resonance-mantis-tuner-b21.png"}, {"id": "voltaic-serpent-cable-b21", "name_ja": "ハイデンオロチ", "tier": "中盤", "element": "electricity", "flavor_ja": "とぐろを巻いた高圧ケーブルの大蛇。継ぎ目から電弧を這わせ、絶縁碍子の首をもたげる中盤の機械蛇。", "img": "gacha_b21/voltaic-serpent-cable-b21.png"}, {"id": "lens-owl-prism-b21", "name_ja": "プリズムアウル", "tier": "終盤", "element": "optics", "flavor_ja": "プリズムの瞳を持つ白い機械フクロウ。光を屈折させ虹色の閃光を放つ、終盤に立ちはだかる光学獣。", "img": "gacha_b21/lens-owl-prism-b21.png"}, {"id": "gravity-tortoise-core-b21", "name_ja": "ジュウリョクガメ", "tier": "終盤", "element": "gravity", "flavor_ja": "甲羅に重力炉をいだく超重量の機械亀。まわりの空間をゆがめ、押しつぶす圧でにじり寄る終盤の獣。", "img": "gacha_b21/gravity-tortoise-core-b21.png"}, {"id": "alloy-emperor-titan-b21", "name_ja": "ゴウキンタイタン", "tier": "ラスボス級", "element": "alloy", "flavor_ja": "あらゆる金属を鍛え合わせた巨神。継ぎ目から溶けた光をしたたらせ、炉の胸を燃やして君臨するラスボス級の合金獣。", "img": "gacha_b21/alloy-emperor-titan-b21.png"}, {"id": "fusion-leviathan-reactor-b21", "name_ja": "カクユウゴウクジラ", "tier": "ラスボス級", "element": "plasma", "flavor_ja": "背に核融合炉をいだく超巨大な機械クジラ。トーラスの輪に閉じこめたプラズマを燃やし、白紫の光をまとって沈座するラスボス級。", "img": "gacha_b21/fusion-leviathan-reactor-b21.png"}, {"id": "ember-scale-drake-b21", "name_ja": "ねっこうドレイク", "tier": "序盤", "element": "火", "flavor_ja": "うろこの すきまから ねつが もれる ちいさな ドレイク。からだは あつく、ふれると やけどする。", "img": "gacha_b21/ember-scale-drake-b21.png"}, {"id": "pebble-shell-dragonling-b21", "name_ja": "がんせきドラゴリン", "tier": "序盤", "element": "地", "flavor_ja": "せなかが いわで できた こりゅう。じめんに どっしり すわって、なかなか うごかない。", "img": "gacha_b21/pebble-shell-dragonling-b21.png"}, {"id": "tide-fin-wyrmling-b21", "name_ja": "しおなみワイバ", "tier": "序盤", "element": "水", "flavor_ja": "ひれの ような はねを もつ こワイバーン。からだを みずの まくが おおっている。", "img": "gacha_b21/tide-fin-wyrmling-b21.png"}, {"id": "voltaic-circuit-drake-b21", "name_ja": "ていこうドレイク", "tier": "中盤", "element": "電", "flavor_ja": "からだに かいろが はしる ドレイク。せぼねを でんりゅうが かけぬける。", "img": "gacha_b21/voltaic-circuit-drake-b21.png"}, {"id": "acid-maw-hydra-b21", "name_ja": "ようかいヒュドラ", "tier": "中盤", "element": "毒", "flavor_ja": "みつの くちから さんが したたる ヒュドラ。とけた じめんが けむりを あげる。", "img": "gacha_b21/acid-maw-hydra-b21.png"}, {"id": "gearwork-iron-wyvern-b21", "name_ja": "はぐるまワイバーン", "tier": "中盤", "element": "鋼", "flavor_ja": "むねで はぐるまが かみあう きこうの ワイバーン。うごくたびに きしむ おとが する。", "img": "gacha_b21/gearwork-iron-wyvern-b21.png"}, {"id": "magma-core-behemoth-drake-b21", "name_ja": "ようがんドレイクオウ", "tier": "終盤", "element": "火", "flavor_ja": "はだの われめから ようがんが あふれる りゅうおう。ちかづくものを ねつで ほろぼす。", "img": "gacha_b21/magma-core-behemoth-drake-b21.png"}, {"id": "frost-crystal-leviathan-b21", "name_ja": "ひょうしょうレヴィア", "tier": "終盤", "element": "氷", "flavor_ja": "うろこが こおりの けっしょうに おおわれた りゅう。いきを はくと あたりが しもで しろくなる。", "img": "gacha_b21/frost-crystal-leviathan-b21.png"}, {"id": "storm-sovereign-wyrm-b21", "name_ja": "らいていワイバーンてい", "tier": "ラスボス級", "element": "雷", "flavor_ja": "らいうんを まとう しはいの ワイバーンてい。とどろく いかずちが ぜんしんを かけめぐる。", "img": "gacha_b21/storm-sovereign-wyrm-b21.png"}, {"id": "void-prism-dragon-god-b21", "name_ja": "こうりんドラゴンしん", "tier": "ラスボス級", "element": "光", "flavor_ja": "ひかりの けっしょうを いただく りゅうしん。からだから にじいろの ひかりが あふれだす。", "img": "gacha_b21/void-prism-dragon-god-b21.png"}, {"id": "saltshell-hermit-crab-b21", "name_ja": "シオカラやどかり", "tier": "序盤", "element": "地学", "flavor_ja": "潮だまりで岩塩のからをせおったヤドカリ。塩の結晶がギラギラかがやく。", "img": "gacha_b21/saltshell-hermit-crab-b21.png"}, {"id": "verdigris-mantis-shrimp-b21", "name_ja": "ろくしょうシャコ", "tier": "序盤", "element": "化学", "flavor_ja": "銅がさびて青緑になったシャコ。パンチの腕に電気がパチパチはしる。", "img": "gacha_b21/verdigris-mantis-shrimp-b21.png"}, {"id": "chalk-barnacle-crawler-b21", "name_ja": "チョークふじつぼガニ", "tier": "序盤", "element": "地学", "flavor_ja": "せっかいの岩とフジツボでできた小さなカニ。じめんにどっしりへばりつく。", "img": "gacha_b21/chalk-barnacle-crawler-b21.png"}, {"id": "amber-resin-crayfish-b21", "name_ja": "こはくザリガニ", "tier": "中盤", "element": "化学", "flavor_ja": "こはくの樹脂でできたザリガニ。中に虫やあわがとじこめられている。", "img": "gacha_b21/amber-resin-crayfish-b21.png"}, {"id": "clockwork-swimmer-crab-b21", "name_ja": "ぜんまいワタリガニ", "tier": "中盤", "element": "物理", "flavor_ja": "こうらが真ちゅうの歯車になったワタリガニ。ぜんまいでカチカチ動く。", "img": "gacha_b21/clockwork-swimmer-crab-b21.png"}, {"id": "lodestone-spiny-lobster-b21", "name_ja": "じりょくイセエビ", "tier": "中盤", "element": "物理", "flavor_ja": "磁石の鉱石でできたイセエビ。鉄のすながトゲにくっついて逆立つ。", "img": "gacha_b21/lodestone-spiny-lobster-b21.png"}, {"id": "obsidian-coconut-crab-b21", "name_ja": "こくようヤシガニ", "tier": "終盤", "element": "地学", "flavor_ja": "黒曜石とマグマでできた巨大ヤシガニ。割れ目から溶岩が赤く光る。", "img": "gacha_b21/obsidian-coconut-crab-b21.png"}, {"id": "abyssal-glow-prawn-b21", "name_ja": "しんかいホタルエビ", "tier": "終盤", "element": "生物", "flavor_ja": "自分で光る深海のエビ。体じゅうの発光器が青く明滅する。", "img": "gacha_b21/abyssal-glow-prawn-b21.png"}, {"id": "cryo-king-crab-b21", "name_ja": "ひょうけつタラバ王", "tier": "ラスボス級", "element": "地学", "flavor_ja": "氷河でできた巨大なタラバガニの王。れいきと霜が体をおおう。", "img": "gacha_b21/cryo-king-crab-b21.png"}, {"id": "prism-mantis-sovereign-b21", "name_ja": "プリズムシャコ覇王", "tier": "ラスボス級", "element": "物理", "flavor_ja": "光を七色に分ける水晶の鎧をまとったシャコの覇王。プラズマが虹色にきらめく。", "img": "gacha_b21/prism-mantis-sovereign-b21.png"}, {"id": "gearback-stag-beetle-b21", "name_ja": "ハグルマクワガタ", "tier": "序盤", "element": "物理", "flavor_ja": "外骨格に歯車を抱えた小型のクワガタ。あごの歯車がかみ合うたびにカチリと鳴く。", "img": "gacha_b21/gearback-stag-beetle-b21.png"}, {"id": "circuit-ladybug-spark-b21", "name_ja": "キバンテントウ", "tier": "序盤", "element": "電気", "flavor_ja": "甲羅が回路基板になった豆テントウ。背中をパチパチと電気が走る。", "img": "gacha_b21/circuit-ladybug-spark-b21.png"}, {"id": "ant-rivet-worker-b21", "name_ja": "リベットアリ", "tier": "序盤", "element": "物理", "flavor_ja": "鉄板をリベットで組んだ働きアリ。あごはレンチ。地面をしっかり踏みしめる。", "img": "gacha_b21/ant-rivet-worker-b21.png"}, {"id": "crystal-mantis-prism-b21", "name_ja": "プリズムカマキリ", "tier": "中盤", "element": "光", "flavor_ja": "鎌が水晶の刃になったカマキリ。体の結晶が光を七色に分ける。", "img": "gacha_b21/crystal-mantis-prism-b21.png"}, {"id": "magnet-hornet-coil-b21", "name_ja": "ジリョクスズメバチ", "tier": "中盤", "element": "電気", "flavor_ja": "腹に銅線コイルを巻いた磁力のスズメバチ。鉄粉が体に貼りつく。", "img": "gacha_b21/magnet-hornet-coil-b21.png"}, {"id": "cicada-resonance-drum-b21", "name_ja": "オンパゼミ", "tier": "中盤", "element": "音", "flavor_ja": "腹が太鼓のセミ。膜を震わせて衝撃の音波を出す。地面にどっしり止まる。", "img": "gacha_b21/cicada-resonance-drum-b21.png"}, {"id": "titan-gear-rhino-beetle-b21", "name_ja": "ギアタイタンカブト", "tier": "終盤", "element": "物理", "flavor_ja": "巨大な歯車のツノを持つ重装カブトムシ。重い装甲で大地を踏み割る。", "img": "gacha_b21/titan-gear-rhino-beetle-b21.png"}, {"id": "plasma-dragonfly-reactor-b21", "name_ja": "プラズマヤンマ", "tier": "終盤", "element": "電気", "flavor_ja": "胸に核融合炉を抱えたヤンマ。体にまとわりつくプラズマで焼き尽くす。", "img": "gacha_b21/plasma-dragonfly-reactor-b21.png"}, {"id": "obsidian-locust-swarmlord-b21", "name_ja": "クロヨウバッタ", "tier": "ラスボス級", "element": "闇", "flavor_ja": "黒曜石でできた巨大なバッタの王。割れ目から呪いの紫光がにじむ。", "img": "gacha_b21/obsidian-locust-swarmlord-b21.png"}, {"id": "genesis-scarab-singularity-b21", "name_ja": "ソウセイスカラベ", "tier": "ラスボス級", "element": "重力", "flavor_ja": "背に特異点を宿す黄金の聖なるオオスカラベ。重力で光すら捻じ曲げる。", "img": "gacha_b21/genesis-scarab-singularity-b21.png"}, {"id": "magnetite-tortoise-bulwark-b21", "name_ja": "磁鉄甲ガメ", "tier": "序盤", "element": "magnet", "flavor_ja": "砂鉄をびっしりまとった鉄甲の亀。近づくと方位磁針が狂う。", "img": "gacha_b21/magnetite-tortoise-bulwark-b21.png"}, {"id": "crystal-scute-armadillo-b21", "name_ja": "晶甲アルマジロ", "tier": "序盤", "element": "crystal", "flavor_ja": "背中に結晶を育てた装甲獣。丸まると割れない原石になる。", "img": "gacha_b21/crystal-scute-armadillo-b21.png"}, {"id": "trilobite-sentinel-b21", "name_ja": "サンヨウチュウ衛兵", "tier": "序盤", "element": "earth", "flavor_ja": "太古の海から這い出た三葉虫。石の鎧で身を守る古代の歩兵。", "img": "gacha_b21/trilobite-sentinel-b21.png"}, {"id": "alloy-rhino-juggernaut-b21", "name_ja": "合金サイ重砲", "tier": "中盤", "element": "metal", "flavor_ja": "鋼の鎧をまとった突撃のサイ。一突きで城壁を砕く。", "img": "gacha_b21/alloy-rhino-juggernaut-b21.png"}, {"id": "hermit-fortress-crab-b21", "name_ja": "ヤドカリ要塞", "tier": "中盤", "element": "metal", "flavor_ja": "鉄の砦を背負って歩くヤドカリ。動く城そのもの。", "img": "gacha_b21/hermit-fortress-crab-b21.png"}, {"id": "pressure-vault-isopod-b21", "name_ja": "高圧ダンゴムシ", "tier": "中盤", "element": "pressure", "flavor_ja": "深海の圧に耐える鉄の団子虫。丸まれば鉄球になる。", "img": "gacha_b21/pressure-vault-isopod-b21.png"}, {"id": "obsidian-shell-leviathan-b21", "name_ja": "黒曜甲リヴァイア", "tier": "終盤", "element": "crystal", "flavor_ja": "黒曜石の山を背負う巨甲の獣。割れ目から溶岩が滲む。", "img": "gacha_b21/obsidian-shell-leviathan-b21.png"}, {"id": "ferrite-gear-trilobite-b21", "name_ja": "磁鉄歯車三葉", "tier": "終盤", "element": "magnet", "flavor_ja": "歯車と磁鉄で組み上がった古代兵器三葉虫。回転する装甲が鉄を吸う。", "img": "gacha_b21/ferrite-gear-trilobite-b21.png"}, {"id": "adamant-shell-titan-b21", "name_ja": "剛甲ガメの王", "tier": "ラスボス級", "element": "metal", "flavor_ja": "あらゆる鎧の頂点に立つ剛甲の王。背に世界を載せる不動の城。", "img": "gacha_b21/adamant-shell-titan-b21.png"}, {"id": "primordial-pressure-isopod-god-b21", "name_ja": "深淵圧潰神", "tier": "ラスボス級", "element": "pressure", "flavor_ja": "深海の底で圧を喰らい肥えた等脚の神。近づく全てを潰す living fortress。", "img": "gacha_b21/primordial-pressure-isopod-god-b21.png"}]; const KEY="rika2_boss_swipe_gacha_b21";
let st=JSON.parse(localStorage.getItem(KEY)||"null")||{idx:0,dec:{}};
function save(){localStorage.setItem(KEY,JSON.stringify(st));}
const stage=document.getElementById("stage");
document.getElementById("total_n").textContent=BOSSES.length;
let card=null,startX=0,curX=0,dragging=false;

function counts(){const y=Object.values(st.dec).filter(v=>v==="yes").length;
  document.getElementById("done_n").textContent=Object.keys(st.dec).length;
  document.getElementById("yes_n").textContent=y;}

function build(idx){
  const b=BOSSES[idx]; const el=document.createElement("div"); el.className="card";
  el.innerHTML=`<div class="stamp yes">有り</div><div class="stamp no">無し</div>
    <div class="imgbox"><img src="${b.img}" alt=""></div>
    <div class="info"><div class="nm">${b.name_ja}<span class="tier t${b.tier}">${b.tier}</span></div>
    <div class="el">${b.element}</div><div class="fl">${b.flavor_ja}</div></div>`;
  el.addEventListener("pointerdown",down); el.addEventListener("pointermove",move);
  el.addEventListener("pointerup",up); el.addEventListener("pointercancel",up);
  return el;
}
function show(){
  if(card){card.remove();card=null;}
  if(st.idx>=BOSSES.length){document.getElementById("doneScreen").style.display="flex";finish();return;}
  document.getElementById("doneScreen").style.display="none";
  card=build(st.idx); stage.appendChild(card); counts();
}
function down(e){dragging=true;startX=e.clientX;curX=0;card.setPointerCapture(e.pointerId);card.style.transition="none";}
function move(e){if(!dragging)return;curX=e.clientX-startX;card.style.transform=`translateX(${curX}px) rotate(${curX/18}deg)`;
  card.querySelector(".yes").style.opacity=Math.max(0,Math.min(1,curX/90));
  card.querySelector(".no").style.opacity=Math.max(0,Math.min(1,-curX/90));}
function up(){if(!dragging)return;dragging=false;
  if(curX>90)decide("yes");else if(curX<-90)decide("no");
  else{card.style.transition=".2s";card.style.transform="";card.querySelector(".yes").style.opacity=0;card.querySelector(".no").style.opacity=0;}}
function decide(v){
  st.dec[BOSSES[st.idx].id]=v; save();
  const dir=v==="yes"?1:-1;
  card.style.transition=".3s ease-out";
  card.style.transform=`translateX(${dir*140}vw) rotate(${dir*25}deg)`;
  card.style.opacity="0";
  setTimeout(()=>{st.idx++;save();show();},260);
}
function undo(){if(st.idx<=0)return;st.idx--;delete st.dec[BOSSES[st.idx].id];save();show();}
function summaryText(){
  const yes=BOSSES.filter(b=>st.dec[b.id]==="yes"),no=BOSSES.filter(b=>st.dec[b.id]==="no");
  let s=`=== ボス選別 結果 (有り${yes.length} / 無し${no.length} / 計${BOSSES.length}) ===\n【有り】\n`;
  yes.forEach(b=>s+=`- ${b.name_ja} (${b.tier}/${b.element}) [${b.id}]\n`);
  s+="【無し】\n"; no.forEach(b=>s+=`- ${b.name_ja} (${b.tier}/${b.element}) [${b.id}]\n`);
  return s;
}
function finish(){
  const yes=BOSSES.filter(b=>st.dec[b.id]==="yes").length;
  document.getElementById("summary").textContent=`有り ${yes} 体 / 無し ${BOSSES.length-yes} 体`;
}
function copyOut(){const s=summaryText();const o=document.getElementById("out");o.style.display="block";o.value=s;
  if(navigator.clipboard)navigator.clipboard.writeText(s).then(()=>{const t=document.getElementById("toast");t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1500);},()=>{});o.select();}
document.getElementById("bNo").onclick=()=>{if(st.idx<BOSSES.length)decide("no");};
document.getElementById("bYes").onclick=()=>{if(st.idx<BOSSES.length)decide("yes");};
document.getElementById("bUndo").onclick=undo;
document.getElementById("bCopy").onclick=copyOut;
document.getElementById("copyBtn").onclick=copyOut;
document.getElementById("restartBtn").onclick=()=>{st={idx:0,dec:{}};save();show();};
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"&&st.idx<BOSSES.length)decide("no");
  else if(e.key==="ArrowRight"&&st.idx<BOSSES.length)decide("yes");else if(e.key==="Backspace")undo();});
show();
</script></body></html>
