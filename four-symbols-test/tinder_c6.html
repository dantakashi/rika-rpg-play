<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>ボス選別 — 理科RPG2</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0f1014;color:#e7e7ea;font-family:system-ui,"Hiragino Kaku Gothic ProN",sans-serif;overflow:hidden;height:100dvh}
header{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;background:#1a1c22;border-bottom:1px solid #2c2f3a}
header b{color:#ffe27a}.count{font-size:13px;color:#9aa0ad}
.stage{position:relative;height:calc(100dvh - 150px);display:flex;align-items:center;justify-content:center;padding:10px}
.card{position:absolute;width:min(92vw,440px);max-height:100%;background:#1d1f26;border:1px solid #2c2f3a;border-radius:18px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5);touch-action:none}
.imgbox{aspect-ratio:1/1;
  background-image:linear-gradient(45deg,#cfcfcf 25%,transparent 25%),linear-gradient(-45deg,#cfcfcf 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#cfcfcf 75%),linear-gradient(-45deg,transparent 75%,#cfcfcf 75%);
  background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0;background-color:#e9e9e9}
.imgbox img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.info{padding:12px 16px}
.nm{font-size:22px;font-weight:800}
.nm .tier{font-size:14px;font-weight:700;padding:2px 10px;border-radius:999px;margin-left:8px;vertical-align:3px}
.t序盤{background:#2bd47a;color:#06210f}.t中盤{background:#4aa3ff;color:#04203f}.t終盤{background:#ff9a3c;color:#311600}.tラスボス級{background:#ff5a7a;color:#33000d}
.el{font-size:12px;color:#9aa0ad;margin-top:2px}
.fl{font-size:14px;color:#cfd3db;margin-top:8px;line-height:1.55}
.stamp{position:absolute;top:18px;font-size:34px;font-weight:900;padding:4px 14px;border:4px solid;border-radius:12px;opacity:0;transform:rotate(-15deg)}
.yes{left:18px;color:#2bd47a;border-color:#2bd47a}.no{right:18px;color:#ff5a7a;border-color:#ff5a7a}
.bar{position:fixed;bottom:0;left:0;right:0;height:90px;display:flex;align-items:center;justify-content:center;gap:22px;background:#13141a;border-top:1px solid #2c2f3a}
.fab{width:62px;height:62px;border-radius:50%;border:none;font-size:26px;cursor:pointer;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.fab.no{background:#2a1d23;color:#ff5a7a;border:2px solid #ff5a7a}.fab.yes{background:#16271c;color:#2bd47a;border:2px solid #2bd47a}
.fab.undo{width:48px;height:48px;font-size:18px;background:#23242c;color:#cfd3db;border:1px solid #3a3f4c}
.done{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.done h2{color:#ffe27a;margin:0 0 8px}
.btn{margin-top:14px;background:#ffe27a;color:#15161a;border:none;border-radius:10px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
#out{margin-top:12px;width:min(92vw,520px);height:160px;font-family:ui-monospace,monospace;font-size:11px;display:none;background:#0b0c10;color:#cfd3db;border:1px solid #3a3f4c;border-radius:8px;padding:8px}
.hint{font-size:11px;color:#6b7280;margin-top:6px}
.toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%);background:#2bd47a;color:#08210f;padding:8px 16px;border-radius:999px;font-weight:700;opacity:0;transition:.3s;pointer-events:none}.toast.show{opacity:1}
</style></head><body>
<header><div><b>ボス選別</b> <span style="font-size:12px;color:#9aa0ad">← 無し / 有り → ・ドラッグもOK</span></div>
  <div class="count"><span id="done_n">0</span>/<span id="total_n">0</span> ・有り<span id="yes_n">0</span></div></header>
<div class="stage" id="stage">
  <div class="done" id="doneScreen">
    <h2>選別おわり！</h2>
    <div id="summary" style="color:#cfd3db"></div>
    <button class="btn" id="copyBtn">結果をコピー</button>
    <div class="hint">コピーしたテキストをチャットに貼ってください（採用の系統を学習して次の50枚へ）。</div>
    <textarea id="out" readonly></textarea>
    <button class="btn" id="restartBtn" style="background:#3a3f4c;color:#e7e7ea">最初からやり直す</button>
  </div>
</div>
<div class="bar">
  <button class="fab no" id="bNo">✗</button>
  <button class="fab undo" id="bUndo">↶</button>
  <button class="fab yes" id="bYes">♥</button>
  <button class="btn" id="bCopy" style="position:fixed;right:12px;bottom:104px;padding:8px 12px;font-size:12px">途中保存コピー</button>
</div>
<div class="toast" id="toast">コピーしました！</div>
<script>
const BOSSES=[{"id": "puchi-volt-bunny-c6", "name_ja": "ピカうさ", "tier": "序盤", "element": "電気", "flavor_ja": "ほっぺにためた電気でパチパチ光る、まんまる電気うさぎ。なでると静電気でしっぽがふくらむ。", "img": "gacha_c6/puchi-volt-bunny-c6.png"}, {"id": "bubblo-foam-otter-c6", "name_ja": "アワぽこ", "tier": "序盤", "element": "泡", "flavor_ja": "せっけんみたいなアワをモコモコまとった、つやつやカワウソの精霊。さわるとフワッと泡がはじける。", "img": "gacha_c6/bubblo-foam-otter-c6.png"}, {"id": "gemmy-crystal-cub-c6", "name_ja": "キラほし", "tier": "序盤", "element": "結晶", "flavor_ja": "背中に宝石をのせて生まれた、まんまるクリスタルの子。光を当てるとキラキラまたたく。", "img": "gacha_c6/gemmy-crystal-cub-c6.png"}, {"id": "pyon-ember-chick-c6", "name_ja": "ぽっぴよ", "tier": "序盤", "element": "炎", "flavor_ja": "とさかとしっぽが小さな炎になっている、ぽかぽかヒヨコのモンスター。あったかくて抱きしめたくなる。", "img": "gacha_c6/pyon-ember-chick-c6.png"}, {"id": "lumi-glow-jellybear-c6", "name_ja": "ぴかゼリィ", "tier": "中盤", "element": "光", "flavor_ja": "体の中からやさしく光る、ぷるぷるの発光ゼリー獣。暗い場所では小さな星みたいにともる。", "img": "gacha_c6/lumi-glow-jellybear-c6.png"}, {"id": "moko-magnet-hamster-c6", "name_ja": "くっつきモグ", "tier": "中盤", "element": "磁石", "flavor_ja": "体じゅうに砂鉄やクギがくっつく、もこもこ磁石ハムスター。なかまの金属を集めてふくらむ。", "img": "gacha_c6/moko-magnet-hamster-c6.png"}, {"id": "tama-droplet-axolotl-c6", "name_ja": "しずくっち", "tier": "中盤", "element": "水", "flavor_ja": "ぷるんとした水のしずくみたいなウーパールーパー。エラがちいさな水しぶきの形でひらひらゆれる。", "img": "gacha_c6/tama-droplet-axolotl-c6.png"}, {"id": "fuwa-prism-foxkit-c6", "name_ja": "にじこぎつね", "tier": "終盤", "element": "光", "flavor_ja": "白い毛が光をあびると虹色にきらめく、ふわふわの三尾ぎつね。プリズムのしっぽで七色をふりまく。", "img": "gacha_c6/fuwa-prism-foxkit-c6.png"}, {"id": "goro-plasma-dragonpup-c6", "name_ja": "ゴロでんりゅう", "tier": "終盤", "element": "電気", "flavor_ja": "まんまる体に電気をためこんだ、ちびっこ雷ドラゴン。怒るとせなかのトゲがバチバチ光る。", "img": "gacha_c6/goro-plasma-dragonpup-c6.png"}, {"id": "marudaio-star-king-mochi-c6", "name_ja": "おだいり・ぽふ王", "tier": "ラスボス級", "element": "光", "flavor_ja": "星のかんむりをいただく、まんまる愛らしいモチモチの王。やさしい光をふりまく、かわいくも堂々たる大王さま。", "img": "gacha_c6/marudaio-star-king-mochi-c6.png"}, {"id": "baby-spark-dragonling-c6", "name_ja": "ピカドラちゃん", "tier": "序盤", "element": "電気", "flavor_ja": "くしゃみをするたびに、ほっぺからパチッと小さないなずまがこぼれる。まだ飛べないけど、元気だけは100まんボルト。", "img": "gacha_c6/baby-spark-dragonling-c6.png"}, {"id": "crystal-griffin-chick-c6", "name_ja": "クリスフィーくん", "tier": "序盤", "element": "結晶・鉱物", "flavor_ja": "はねの先っぽから、ちいさな水晶がキラキラ生えてくる。あつめた石をじまんしたくて、いつも胸をはっている。", "img": "gacha_c6/crystal-griffin-chick-c6.png"}, {"id": "pebble-golem-sprout-c6", "name_ja": "ころゴーレム", "tier": "序盤", "element": "土・岩石", "flavor_ja": "あたまのふたばが、お日さまのほうへちょこんと向く。ねむると本物の小石とまちがえられて、よく踏まれそうになる。", "img": "gacha_c6/pebble-golem-sprout-c6.png"}, {"id": "ember-phoenix-hatchling-c6", "name_ja": "ぽぽフェニ", "tier": "序盤", "element": "炎", "flavor_ja": "あくびをすると、ほっぺからぽんっとちいさな火の粉がはじける。やけどはしないよ、あったかいだけ。", "img": "gacha_c6/ember-phoenix-hatchling-c6.png"}, {"id": "bubble-kelpie-foal-c6", "name_ja": "あわプカ", "tier": "中盤", "element": "水・泡", "flavor_ja": "たてがみはぜんぶ泡でできていて、ぷちぷちはじけては、すぐにまた生えてくる。水たまりが大好きな、おっとり水馬の赤ちゃん。", "img": "gacha_c6/bubble-kelpie-foal-c6.png"}, {"id": "glimmer-unicorn-fawn-c6", "name_ja": "ひかりんこ", "tier": "中盤", "element": "光", "flavor_ja": "おでこの角がぼうっと光ると、まわりに小さな虹がちらつく。まぶしいのが苦手で、自分の光でよく目をぱちぱちさせる。", "img": "gacha_c6/glimmer-unicorn-fawn-c6.png"}, {"id": "glacier-yeti-cub-c6", "name_ja": "こおりっこ", "tier": "中盤", "element": "氷・状態変化", "flavor_ja": "だっこすると、ほっぺがひんやり。さわった水たまりがすぐにツルッと氷になるので、お友だちはちょっとびっくりする。", "img": "gacha_c6/glacier-yeti-cub-c6.png"}, {"id": "magma-salamander-pip-c6", "name_ja": "マグぴよ", "tier": "終盤", "element": "火・地学(マグマ)", "flavor_ja": "せなかのひびから、ぽうっとオレンジ色のマグマがのぞく。ねむい時ほど体がじんわり熱くなる、火山生まれの甘えんぼう。", "img": "gacha_c6/magma-salamander-pip-c6.png"}, {"id": "tide-leviathan-tot-c6", "name_ja": "うみのこリヴァ", "tier": "終盤", "element": "水・深海", "flavor_ja": "体じゅうの青い光がぽつぽつ灯ると、まるで小さな星空。深い海の底でうまれたばかりで、まだ世界がぜんぶキラキラに見えている。", "img": "gacha_c6/tide-leviathan-tot-c6.png"}, {"id": "prism-thunderbird-monarch-c6", "name_ja": "にじらいオウ", "tier": "ラスボス級", "element": "光・電気(雷)", "flavor_ja": "はばたくたびに、虹色のはねから七色のいなずまが走る。まだ赤ちゃんなのに、空の王さまになる風格をびりびりと身にまとっている。", "img": "gacha_c6/prism-thunderbird-monarch-c6.png"}, {"id": "puni-droplet-slime-c6", "name_ja": "ぷにしずく", "tier": "序盤", "element": "水", "flavor_ja": "ぷにっと押すとぷるんと戻る、しずく形のあかちゃんスライム。さわると指がひんやり。", "img": "gacha_c6/puni-droplet-slime-c6.png"}, {"id": "marshmochi-pillow-c6", "name_ja": "もちまろ", "tier": "序盤", "element": "光", "flavor_ja": "もちもちの体の中からほわっと光る、ふくふくの精霊。ぎゅっと抱きしめたくなる。", "img": "gacha_c6/marshmochi-pillow-c6.png"}, {"id": "bubble-frothpup-c6", "name_ja": "あわぽこ", "tier": "序盤", "element": "泡", "flavor_ja": "あわあわの体でぽこぽこ歩く、せっけんの妖精いぬ。つつくとぱちんと弾けてまた生える。", "img": "gacha_c6/bubble-frothpup-c6.png"}, {"id": "jelly-tadpole-puni-c6", "name_ja": "ぷるたま", "tier": "序盤", "element": "水", "flavor_ja": "おたまじゃくしのしっぽが生えた、まんまるゼリーのこども。中の色つぶがぷかぷか見える。", "img": "gacha_c6/jelly-tadpole-puni-c6.png"}, {"id": "lumi-jellybell-c6", "name_ja": "ぴかくらげ", "tier": "中盤", "element": "光", "flavor_ja": "ぷよんとした傘の中からじんわり光る、くらげの精。光がゆっくり脈打つ。", "img": "gacha_c6/lumi-jellybell-c6.png"}, {"id": "puni-foam-cat-c6", "name_ja": "あわにゃ", "tier": "中盤", "element": "泡", "flavor_ja": "あわのクリームでできた、ぷにぷにのこねこ。なでると泡がきゅっと縮んでまたふくらむ。", "img": "gacha_c6/puni-foam-cat-c6.png"}, {"id": "gummy-droplet-king-c6", "name_ja": "ぷるおうじ", "tier": "中盤", "element": "水", "flavor_ja": "ゼリーの体からそのまま王冠が生えた、ちょっと生意気なスライムの王子。ぷるぷる威張る。", "img": "gacha_c6/gummy-droplet-king-c6.png"}, {"id": "mochi-cloud-whale-c6", "name_ja": "もちくじら", "tier": "終盤", "element": "光", "flavor_ja": "もちもちの雲でできた、大きくてやさしい霊獣くじら。背にのると体がふわっと沈む。", "img": "gacha_c6/mochi-cloud-whale-c6.png"}, {"id": "prism-gel-dragon-c6", "name_ja": "ぷるどらこ", "tier": "終盤", "element": "光", "flavor_ja": "ゼリーの体が虹色に光を分ける、まんまるな赤ちゃん竜。動くたびにきらきら色が変わる。", "img": "gacha_c6/prism-gel-dragon-c6.png"}, {"id": "grand-puni-monarch-c6", "name_ja": "だいぷにさま", "tier": "ラスボス級", "element": "水", "flavor_ja": "海のように巨大で、それでもまんまるで愛嬌のあるスライムの女王。体の中に小さなぷにたちを抱いている。", "img": "gacha_c6/grand-puni-monarch-c6.png"}, {"id": "flicker-flame-sprite-cute-c6", "name_ja": "ぽぷリラ", "tier": "序盤", "element": "炎", "flavor_ja": "ぽっと火がともると、うれしくてほっぺがもっと赤くなる炎のあかちゃん精霊。", "img": "gacha_c6/flicker-flame-sprite-cute-c6.png"}, {"id": "droplet-dewfae-cute-c6", "name_ja": "しずくぴ", "tier": "序盤", "element": "水", "flavor_ja": "ころんと丸い水のしずくの妖精。さわるとぷるぷる、笑うとちょっとはねる。", "img": "gacha_c6/droplet-dewfae-cute-c6.png"}, {"id": "breeze-puffling-cute-c6", "name_ja": "そよまる", "tier": "序盤", "element": "風", "flavor_ja": "くるくる回るそよ風の精霊。あくびするだけでまわりがふわっと涼しくなる。", "img": "gacha_c6/breeze-puffling-cute-c6.png"}, {"id": "sparkle-spark-wisp-cute-c6", "name_ja": "ぴりっこ", "tier": "序盤", "element": "電気", "flavor_ja": "うれしくなるとパチパチはじける、ちっちゃな電気のおにだま。", "img": "gacha_c6/sparkle-spark-wisp-cute-c6.png"}, {"id": "glow-lumin-fae-cute-c6", "name_ja": "ぴかりん", "tier": "中盤", "element": "光", "flavor_ja": "暗いところで会うとぽわっと照らしてくれる、やさしい光の妖精。", "img": "gacha_c6/glow-lumin-fae-cute-c6.png"}, {"id": "bubble-foam-spirit-cute-c6", "name_ja": "あわぽよ", "tier": "中盤", "element": "水", "flavor_ja": "ぷくぷくのあわでできた精霊。はじけそうではじけない、ふしぎなぽよぽよ。", "img": "gacha_c6/bubble-foam-spirit-cute-c6.png"}, {"id": "crystal-gemling-cute-c6", "name_ja": "きらまる", "tier": "中盤", "element": "結晶", "flavor_ja": "光をあてるとキラキラ反射してごきげんになる、宝石みたいな結晶の精霊。", "img": "gacha_c6/crystal-gemling-cute-c6.png"}, {"id": "frost-snowfae-cute-c6", "name_ja": "こなゆき", "tier": "終盤", "element": "氷", "flavor_ja": "息をはくとちいさな雪の結晶がほっぺにくっつく、つめたくてやさしい氷の妖精。", "img": "gacha_c6/frost-snowfae-cute-c6.png"}, {"id": "prism-rainbow-wisp-cute-c6", "name_ja": "にじたま", "tier": "終盤", "element": "光", "flavor_ja": "光をくぐると七色にかがやく、虹のかけらが集まってできたごきげんウィスプ。", "img": "gacha_c6/prism-rainbow-wisp-cute-c6.png"}, {"id": "grand-elemental-queen-cute-c6", "name_ja": "せいれいひめロロ", "tier": "ラスボス級", "element": "光", "flavor_ja": "すべての精霊をたばねる、ちいさくてまんまるな精霊たちのおひめさま。怒らせると全部の力でぷんぷんする。", "img": "gacha_c6/grand-elemental-queen-cute-c6.png"}, {"id": "axolotl-bubble-bud-c6", "name_ja": "ウパポコ", "tier": "序盤", "element": "泡", "flavor_ja": "あわの中から生まれた、まんまるピンクのウーパールーパー。エラのあわがポコポコはじける。", "img": "gacha_c6/axolotl-bubble-bud-c6.png"}, {"id": "puddle-frog-droplet-c6", "name_ja": "ケロしずく", "tier": "序盤", "element": "水", "flavor_ja": "雨上がりの水たまりから生まれた、ぷくぷくのカエル。おなかの水のしずくがキラリと光る。", "img": "gacha_c6/puddle-frog-droplet-c6.png"}, {"id": "baby-seal-frost-c6", "name_ja": "コオリアザ", "tier": "序盤", "element": "氷", "flavor_ja": "流氷から生まれた、まんまるモフモフの赤ちゃんアザラシ。背中にこおりの花がさく。", "img": "gacha_c6/baby-seal-frost-c6.png"}, {"id": "spark-tadpole-cell-c6", "name_ja": "ピリオタマ", "tier": "序盤", "element": "電気", "flavor_ja": "池の電気から生まれた、ぷるぷる光るオタマジャクシ。さわるとピリッとしびれる。", "img": "gacha_c6/spark-tadpole-cell-c6.png"}, {"id": "otter-bubble-buddy-c6", "name_ja": "アワウソ", "tier": "中盤", "element": "泡", "flavor_ja": "川の泡から生まれた、つやつやのカワウソ。だいじな石をいつもおなかに抱えている。", "img": "gacha_c6/otter-bubble-buddy-c6.png"}, {"id": "jelly-lantern-light-c6", "name_ja": "ホタクラゲ", "tier": "中盤", "element": "光", "flavor_ja": "夜の海で光る、まんまるドームのクラゲ。やさしいあかりをポワッとともす。", "img": "gacha_c6/jelly-lantern-light-c6.png"}, {"id": "seahorse-coral-curl-c6", "name_ja": "タツノコロン", "tier": "中盤", "element": "結晶", "flavor_ja": "サンゴの海から生まれた、くるんと丸まったタツノオトシゴ。背中の結晶がプリズムみたいに光る。", "img": "gacha_c6/seahorse-coral-curl-c6.png"}, {"id": "axolotl-flame-king-c6", "name_ja": "ウパボーン", "tier": "終盤", "element": "炎", "flavor_ja": "あついマグマ水で育った、おっきなウーパールーパー。エラがゆらめく炎になってちょっぴり強気。", "img": "gacha_c6/axolotl-flame-king-c6.png"}, {"id": "jelly-storm-queen-c6", "name_ja": "カミナクラゲ", "tier": "終盤", "element": "電気", "flavor_ja": "嵐の海をおさめる、おおきなクラゲ。ドームの中で青いいなずまがバチバチ光る。", "img": "gacha_c6/jelly-storm-queen-c6.png"}, {"id": "axolotl-ocean-godling-c6", "name_ja": "ウパティアン", "tier": "ラスボス級", "element": "水", "flavor_ja": "ぜんぶの水をおさめる、伝説のウーパールーパー大王。まんまるなのに王さまのきはく。エラから清らかな水があふれる。", "img": "gacha_c6/axolotl-ocean-godling-c6.png"}, {"id": "spark-komainu-pup-c6", "name_ja": "ビリ狛犬", "tier": "序盤", "element": "電気", "flavor_ja": "神社の入り口を守る子の狛犬。なでると毛がパチッと静電気で光る、元気いっぱいの守り神。", "img": "gacha_c6/spark-komainu-pup-c6.png"}, {"id": "candle-kitsune-kit-c6", "name_ja": "ともしび子狐", "tier": "序盤", "element": "炎", "flavor_ja": "お稲荷さんに仕える子狐。しっぽの先にともしびを灯して、暗い参道をてくてく案内してくれる。", "img": "gacha_c6/candle-kitsune-kit-c6.png"}, {"id": "bubble-mame-tanuki-c6", "name_ja": "あわ豆狸", "tier": "序盤", "element": "水", "flavor_ja": "葉っぱの帽子をかぶった豆つぶサイズの豆狸。おなかをポンと叩くと、ぷくぷくの泡があふれ出す。", "img": "gacha_c6/bubble-mame-tanuki-c6.png"}, {"id": "crystal-mame-tengu-c6", "name_ja": "きらり豆天狗", "tier": "序盤", "element": "結晶", "flavor_ja": "山奥にすむちびっこ天狗。鼻はまだ短いけれど、肩には自慢のキラキラ結晶が育ちはじめている。", "img": "gacha_c6/crystal-mame-tengu-c6.png"}, {"id": "river-mame-kappa-c6", "name_ja": "ぷかぷか河童", "tier": "中盤", "element": "水", "flavor_ja": "頭のお皿に水をためた、きゅうり大好きな川の妖怪。お皿の水がこぼれないよう、いつも背筋ピン。", "img": "gacha_c6/river-mame-kappa-c6.png"}, {"id": "lantern-bake-neko-c6", "name_ja": "ちょうちん化け猫", "tier": "中盤", "element": "光", "flavor_ja": "夜道をぽうっと照らす二尾の化け猫。しっぽの先がちょうちんみたいに光り、迷子をそっと家まで導く。", "img": "gacha_c6/lantern-bake-neko-c6.png"}, {"id": "thunder-baby-raijin-c6", "name_ja": "ちび雷神さま", "tier": "中盤", "element": "電気", "flavor_ja": "太鼓をポコポコ叩いて雷を鳴らす赤ちゃん雷神。まだ小さな雷しか出せないけれど、やる気は満点。", "img": "gacha_c6/thunder-baby-raijin-c6.png"}, {"id": "ember-young-karasu-tengu-c6", "name_ja": "ほむら烏天狗", "tier": "終盤", "element": "炎", "flavor_ja": "修行を重ねた若き烏天狗。羽ばたくたびに羽の先から炎が走り、山を駆けるように戦う。", "img": "gacha_c6/ember-young-karasu-tengu-c6.png"}, {"id": "frost-koorin-yukinko-c6", "name_ja": "こおりん雪ん子", "tier": "終盤", "element": "氷", "flavor_ja": "深い雪山に住む、ほっぺの赤い雪の子。さわると指先がきんと冷たく、まわりに六角形の氷の花を咲かせる。", "img": "gacha_c6/frost-koorin-yukinko-c6.png"}, {"id": "ninetail-radiant-mikogitsune-c6", "name_ja": "光巫女狐ここの尾", "tier": "ラスボス級", "element": "光", "flavor_ja": "九つの尾を持つ気高い狐の巫女。社のいちばん奥に座し、九本の尾の先に神々しい光をともして里を見守る。", "img": "gacha_c6/ninetail-radiant-mikogitsune-c6.png"}]; const KEY="rika2_boss_swipe_gacha_c6";
let st=JSON.parse(localStorage.getItem(KEY)||"null")||{idx:0,dec:{}};
function save(){localStorage.setItem(KEY,JSON.stringify(st));}
const stage=document.getElementById("stage");
document.getElementById("total_n").textContent=BOSSES.length;
let card=null,startX=0,curX=0,dragging=false;

function counts(){const y=Object.values(st.dec).filter(v=>v==="yes").length;
  document.getElementById("done_n").textContent=Object.keys(st.dec).length;
  document.getElementById("yes_n").textContent=y;}

function build(idx){
  const b=BOSSES[idx]; const el=document.createElement("div"); el.className="card";
  el.innerHTML=`<div class="stamp yes">有り</div><div class="stamp no">無し</div>
    <div class="imgbox"><img src="${b.img}" alt=""></div>
    <div class="info"><div class="nm">${b.name_ja}<span class="tier t${b.tier}">${b.tier}</span></div>
    <div class="el">${b.element}</div><div class="fl">${b.flavor_ja}</div></div>`;
  el.addEventListener("pointerdown",down); el.addEventListener("pointermove",move);
  el.addEventListener("pointerup",up); el.addEventListener("pointercancel",up);
  return el;
}
function show(){
  if(card){card.remove();card=null;}
  if(st.idx>=BOSSES.length){document.getElementById("doneScreen").style.display="flex";finish();return;}
  document.getElementById("doneScreen").style.display="none";
  card=build(st.idx); stage.appendChild(card); counts();
}
function down(e){dragging=true;startX=e.clientX;curX=0;card.setPointerCapture(e.pointerId);card.style.transition="none";}
function move(e){if(!dragging)return;curX=e.clientX-startX;card.style.transform=`translateX(${curX}px) rotate(${curX/18}deg)`;
  card.querySelector(".yes").style.opacity=Math.max(0,Math.min(1,curX/90));
  card.querySelector(".no").style.opacity=Math.max(0,Math.min(1,-curX/90));}
function up(){if(!dragging)return;dragging=false;
  if(curX>90)decide("yes");else if(curX<-90)decide("no");
  else{card.style.transition=".2s";card.style.transform="";card.querySelector(".yes").style.opacity=0;card.querySelector(".no").style.opacity=0;}}
function decide(v){
  st.dec[BOSSES[st.idx].id]=v; save();
  const dir=v==="yes"?1:-1;
  card.style.transition=".3s ease-out";
  card.style.transform=`translateX(${dir*140}vw) rotate(${dir*25}deg)`;
  card.style.opacity="0";
  setTimeout(()=>{st.idx++;save();show();},260);
}
function undo(){if(st.idx<=0)return;st.idx--;delete st.dec[BOSSES[st.idx].id];save();show();}
function summaryText(){
  const yes=BOSSES.filter(b=>st.dec[b.id]==="yes"),no=BOSSES.filter(b=>st.dec[b.id]==="no");
  let s=`=== ボス選別 結果 (有り${yes.length} / 無し${no.length} / 計${BOSSES.length}) ===\n【有り】\n`;
  yes.forEach(b=>s+=`- ${b.name_ja} (${b.tier}/${b.element}) [${b.id}]\n`);
  s+="【無し】\n"; no.forEach(b=>s+=`- ${b.name_ja} (${b.tier}/${b.element}) [${b.id}]\n`);
  return s;
}
function finish(){
  const yes=BOSSES.filter(b=>st.dec[b.id]==="yes").length;
  document.getElementById("summary").textContent=`有り ${yes} 体 / 無し ${BOSSES.length-yes} 体`;
}
function copyOut(){const s=summaryText();const o=document.getElementById("out");o.style.display="block";o.value=s;
  if(navigator.clipboard)navigator.clipboard.writeText(s).then(()=>{const t=document.getElementById("toast");t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1500);},()=>{});o.select();}
document.getElementById("bNo").onclick=()=>{if(st.idx<BOSSES.length)decide("no");};
document.getElementById("bYes").onclick=()=>{if(st.idx<BOSSES.length)decide("yes");};
document.getElementById("bUndo").onclick=undo;
document.getElementById("bCopy").onclick=copyOut;
document.getElementById("copyBtn").onclick=copyOut;
document.getElementById("restartBtn").onclick=()=>{st={idx:0,dec:{}};save();show();};
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"&&st.idx<BOSSES.length)decide("no");
  else if(e.key==="ArrowRight"&&st.idx<BOSSES.length)decide("yes");else if(e.key==="Backspace")undo();});
show();
</script></body></html>
