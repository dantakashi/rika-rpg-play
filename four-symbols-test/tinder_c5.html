<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>ボス選別 — 理科RPG2</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0f1014;color:#e7e7ea;font-family:system-ui,"Hiragino Kaku Gothic ProN",sans-serif;overflow:hidden;height:100dvh}
header{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;background:#1a1c22;border-bottom:1px solid #2c2f3a}
header b{color:#ffe27a}.count{font-size:13px;color:#9aa0ad}
.stage{position:relative;height:calc(100dvh - 150px);display:flex;align-items:center;justify-content:center;padding:10px}
.card{position:absolute;width:min(92vw,440px);max-height:100%;background:#1d1f26;border:1px solid #2c2f3a;border-radius:18px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5);touch-action:none}
.imgbox{aspect-ratio:1/1;
  background-image:linear-gradient(45deg,#cfcfcf 25%,transparent 25%),linear-gradient(-45deg,#cfcfcf 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#cfcfcf 75%),linear-gradient(-45deg,transparent 75%,#cfcfcf 75%);
  background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0;background-color:#e9e9e9}
.imgbox img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.info{padding:12px 16px}
.nm{font-size:22px;font-weight:800}
.nm .tier{font-size:14px;font-weight:700;padding:2px 10px;border-radius:999px;margin-left:8px;vertical-align:3px}
.t序盤{background:#2bd47a;color:#06210f}.t中盤{background:#4aa3ff;color:#04203f}.t終盤{background:#ff9a3c;color:#311600}.tラスボス級{background:#ff5a7a;color:#33000d}
.el{font-size:12px;color:#9aa0ad;margin-top:2px}
.fl{font-size:14px;color:#cfd3db;margin-top:8px;line-height:1.55}
.stamp{position:absolute;top:18px;font-size:34px;font-weight:900;padding:4px 14px;border:4px solid;border-radius:12px;opacity:0;transform:rotate(-15deg)}
.yes{left:18px;color:#2bd47a;border-color:#2bd47a}.no{right:18px;color:#ff5a7a;border-color:#ff5a7a}
.bar{position:fixed;bottom:0;left:0;right:0;height:90px;display:flex;align-items:center;justify-content:center;gap:22px;background:#13141a;border-top:1px solid #2c2f3a}
.fab{width:62px;height:62px;border-radius:50%;border:none;font-size:26px;cursor:pointer;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.fab.no{background:#2a1d23;color:#ff5a7a;border:2px solid #ff5a7a}.fab.yes{background:#16271c;color:#2bd47a;border:2px solid #2bd47a}
.fab.undo{width:48px;height:48px;font-size:18px;background:#23242c;color:#cfd3db;border:1px solid #3a3f4c}
.done{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.done h2{color:#ffe27a;margin:0 0 8px}
.btn{margin-top:14px;background:#ffe27a;color:#15161a;border:none;border-radius:10px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
#out{margin-top:12px;width:min(92vw,520px);height:160px;font-family:ui-monospace,monospace;font-size:11px;display:none;background:#0b0c10;color:#cfd3db;border:1px solid #3a3f4c;border-radius:8px;padding:8px}
.hint{font-size:11px;color:#6b7280;margin-top:6px}
.toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%);background:#2bd47a;color:#08210f;padding:8px 16px;border-radius:999px;font-weight:700;opacity:0;transition:.3s;pointer-events:none}.toast.show{opacity:1}
</style></head><body>
<header><div><b>ボス選別</b> <span style="font-size:12px;color:#9aa0ad">← 無し / 有り → ・ドラッグもOK</span></div>
  <div class="count"><span id="done_n">0</span>/<span id="total_n">0</span> ・有り<span id="yes_n">0</span></div></header>
<div class="stage" id="stage">
  <div class="done" id="doneScreen">
    <h2>選別おわり！</h2>
    <div id="summary" style="color:#cfd3db"></div>
    <button class="btn" id="copyBtn">結果をコピー</button>
    <div class="hint">コピーしたテキストをチャットに貼ってください（採用の系統を学習して次の50枚へ）。</div>
    <textarea id="out" readonly></textarea>
    <button class="btn" id="restartBtn" style="background:#3a3f4c;color:#e7e7ea">最初からやり直す</button>
  </div>
</div>
<div class="bar">
  <button class="fab no" id="bNo">✗</button>
  <button class="fab undo" id="bUndo">↶</button>
  <button class="fab yes" id="bYes">♥</button>
  <button class="btn" id="bCopy" style="position:fixed;right:12px;bottom:104px;padding:8px 12px;font-size:12px">途中保存コピー</button>
</div>
<div class="toast" id="toast">コピーしました！</div>
<script>
const BOSSES=[{"id": "spark-puffball-c5", "name_ja": "バチピヨ", "tier": "序盤", "element": "電気", "flavor_ja": "バチッと帯電したヒヨコの精霊。さわると静電気でモフモフがふくらむ。電気がたまると目がキラキラ光る、序盤の人気者。", "img": "gacha_c5/spark-puffball-c5.png"}, {"id": "bubble-otter-c5", "name_ja": "アワウソ", "tier": "序盤", "element": "泡", "flavor_ja": "あわあわの泡をまとった水辺の精霊。なでると泡がパチパチはじけて石けんのいい匂い。きれい好きで序盤からよく出会う。", "img": "gacha_c5/bubble-otter-c5.png"}, {"id": "crystal-hammy-c5", "name_ja": "キラハム", "tier": "序盤", "element": "結晶", "flavor_ja": "ほっぺに結晶をためこむハムスターの精霊。きれいな鉱物を見つけると目を輝かせてコレクションする。序盤の癒やし枠。", "img": "gacha_c5/crystal-hammy-c5.png"}, {"id": "glow-froglet-c5", "name_ja": "ポワガエル", "tier": "序盤", "element": "光", "flavor_ja": "おなかの中からぽわっと光る小さなカエルの精霊。暗いところで仲間を照らす案内役。にっこり笑顔が序盤の定番。", "img": "gacha_c5/glow-froglet-c5.png"}, {"id": "flame-kit-c5", "name_ja": "ポッポギツネ", "tier": "中盤", "element": "炎", "flavor_ja": "しっぽの先がぽぽっと燃えるキツネの子の精霊。元気いっぱいで尾が増えるほど強くなる。中盤のアイドル枠。", "img": "gacha_c5/flame-kit-c5.png"}, {"id": "voltcat-pudgy-c5", "name_ja": "ビリニャン", "tier": "中盤", "element": "電気", "flavor_ja": "なでるとバチバチ放電するちょっと生意気な電気ネコの精霊。気分屋だけど懐くととても強い。中盤の人気どころ。", "img": "gacha_c5/voltcat-pudgy-c5.png"}, {"id": "prism-deer-c5", "name_ja": "ニジカモシカ", "tier": "中盤", "element": "光", "flavor_ja": "角がプリズムになっていて光を七色に分ける気高いカモシカの精霊。少し格好よさもある中盤の華。", "img": "gacha_c5/prism-deer-c5.png"}, {"id": "geode-bearcub-c5", "name_ja": "ゴロイシグマ", "tier": "終盤", "element": "結晶", "flavor_ja": "背中に巨大な晶洞をしょったクマの子の精霊。見た目はゴツいけど甘えん坊。終盤の頼れる相棒、ちょっと格好いい。", "img": "gacha_c5/geode-bearcub-c5.png"}, {"id": "foam-leviapup-c5", "name_ja": "アワリュウくん", "tier": "終盤", "element": "泡", "flavor_ja": "泡のたてがみをまとった子竜の精霊。まんまるでかわいいのに、怒ると泡が荒波になる終盤格。愛嬌と格好よさの両立。", "img": "gacha_c5/foam-leviapup-c5.png"}, {"id": "starcore-monarch-c5", "name_ja": "ホシノオウくん", "tier": "ラスボス級", "element": "光", "flavor_ja": "胸に小さな星を宿す王さまライオンの子の精霊。まんまるで愛らしいのに、星の力を解き放つと辺り一面を光で満たす。かわいさの頂点、ラスボス級。", "img": "gacha_c5/starcore-monarch-c5.png"}, {"id": "spark-hatchling-drake-c5", "name_ja": "ピリッとちびドラゴン", "tier": "序盤", "element": "電気", "flavor_ja": "まだ上手に飛べない、ちびっこ電気ドラゴン。ほっぺにパチパチ静電気をためてご機嫌。", "img": "gacha_c5/spark-hatchling-drake-c5.png"}, {"id": "bubble-griffon-chick-c5", "name_ja": "あわあわグリフォンの子", "tier": "序盤", "element": "水", "flavor_ja": "羽もくちばしもまだまだちっちゃい、あわをまとった子グリフォン。きれいな水のあわが大すき。", "img": "gacha_c5/bubble-griffon-chick-c5.png"}, {"id": "ember-phoenix-pip-c5", "name_ja": "ぽっぽフェニックス", "tier": "序盤", "element": "炎", "flavor_ja": "生まれたてのちびフェニックス。あったかいほのおをちょっぴりまとって、ぽかぽか元気いっぱい。", "img": "gacha_c5/ember-phoenix-pip-c5.png"}, {"id": "pebble-golem-baby-c5", "name_ja": "ころころ赤ちゃんゴーレム", "tier": "序盤", "element": "土", "flavor_ja": "つみきみたいにまるい石でできた赤ちゃんゴーレム。こけがちょっぴり生えていて、なでたくなる。", "img": "gacha_c5/pebble-golem-baby-c5.png"}, {"id": "prism-unicorn-foal-c5", "name_ja": "キラキラ子ユニコーン", "tier": "中盤", "element": "光", "flavor_ja": "ひたいのツノからにじ色の光がこぼれる、ちびユニコーン。ふわふわのたてがみがレインボー。", "img": "gacha_c5/prism-unicorn-foal-c5.png"}, {"id": "frost-kirin-cub-c5", "name_ja": "ひんやり麒麟の子", "tier": "中盤", "element": "氷", "flavor_ja": "雪の日に生まれたちびキリン。せなかにこおりのけっしょうがキラキラついて、すずしげ。", "img": "gacha_c5/frost-kirin-cub-c5.png"}, {"id": "leaf-fairy-sprout-c5", "name_ja": "ふたばの妖精ちゃん", "tier": "中盤", "element": "草", "flavor_ja": "あたまからふたばが生えた、緑の小さな精霊。お花のかふんをまとって、いいにおいがしそう。", "img": "gacha_c5/leaf-fairy-sprout-c5.png"}, {"id": "crystal-pup-pixie-c5", "name_ja": "ジェムわんこ精霊", "tier": "終盤", "element": "結晶", "flavor_ja": "からだがほうせきでできた、ちびっこ結晶わんこ。せなかからキラキラのクリスタルがにょきにょき。", "img": "gacha_c5/crystal-pup-pixie-c5.png"}, {"id": "thunder-wyrm-pup-c5", "name_ja": "ゴロゴロちびワイバーン", "tier": "終盤", "element": "電気", "flavor_ja": "雲の中から落ちてきた、ちびワイバーン。せなかをゴロゴロかみなりが走って、ちょっぴりやんちゃ。", "img": "gacha_c5/thunder-wyrm-pup-c5.png"}, {"id": "starlight-dragon-king-chibi-c5", "name_ja": "ちびっこ星竜の王", "tier": "ラスボス級", "element": "光", "flavor_ja": "夜空の星をまとった、ちびっこ星竜の王さま。小さくても王さまの風かく、いちばん星でいちばんかわいい。", "img": "gacha_c5/starlight-dragon-king-chibi-c5.png"}, {"id": "puni-droplet-slime-c5", "name_ja": "ぷにたまスライム", "tier": "序盤", "element": "水", "flavor_ja": "ぷにっと触ると水玉がぷるぷる揺れる、いちばん最初のお友だち。やわらかすぎてつかむとすり抜ける。", "img": "gacha_c5/puni-droplet-slime-c5.png"}, {"id": "mochi-bun-sprite-c5", "name_ja": "もちまる", "tier": "序盤", "element": "光", "flavor_ja": "ほっぺがもちもちで、つつくとへこんでゆっくり戻る。ほんのり光って暗いところを照らす。", "img": "gacha_c5/mochi-bun-sprite-c5.png"}, {"id": "bubble-pup-c5", "name_ja": "あわころ", "tier": "序盤", "element": "泡", "flavor_ja": "ぷくぷくの泡でできた子犬。なでると泡がはじけて、また新しい泡がふくらむ。", "img": "gacha_c5/bubble-pup-c5.png"}, {"id": "jelly-frog-puni-c5", "name_ja": "ぷるがえる", "tier": "序盤", "element": "水", "flavor_ja": "ぷるんぷるんのゼリーガエル。ジャンプするたびに全身がぷるぷる波打つ。", "img": "gacha_c5/jelly-frog-puni-c5.png"}, {"id": "dango-trio-spirit-c5", "name_ja": "みたらしトリオ", "tier": "中盤", "element": "光", "flavor_ja": "三色だんごが一つになった元気者。一番上の子がしゃべり、下の子たちはもちもち跳ねる。", "img": "gacha_c5/dango-trio-spirit-c5.png"}, {"id": "pudding-golem-puru-c5", "name_ja": "ぷりんゴーレム", "tier": "中盤", "element": "水", "flavor_ja": "プリンの体を持つ守り役。パンチするとカラメルの腕がぷるんと伸びて当たる。", "img": "gacha_c5/pudding-golem-puru-c5.png"}, {"id": "bubble-jelly-octo-c5", "name_ja": "あわたこぷに", "tier": "中盤", "element": "泡", "flavor_ja": "ぷにぷにの足から泡をぷくぷく出すミニだこ。びっくりすると全身泡まみれになる。", "img": "gacha_c5/bubble-jelly-octo-c5.png"}, {"id": "rainbow-jelly-cat-c5", "name_ja": "ぷるにゃこ", "tier": "終盤", "element": "光", "flavor_ja": "中から虹色に光るゼリーの子ねこ。ごろごろ鳴くたび体の中で光が踊る。", "img": "gacha_c5/rainbow-jelly-cat-c5.png"}, {"id": "foam-whale-mochi-c5", "name_ja": "もちくじら", "tier": "終盤", "element": "水", "flavor_ja": "もちもちの体に泡のしおふきを乗せた、おっとり大きなクジラ。背に乗るとぷにぷに沈む。", "img": "gacha_c5/foam-whale-mochi-c5.png"}, {"id": "puni-prism-monarch-c5", "name_ja": "ぷにぷに女王ぷりりん", "tier": "ラスボス級", "element": "光", "flavor_ja": "すべてのぷにぷにを治める、きらめくゼリーの女王。怒らせるとお城ぜんぶがぷるぷる揺れる。", "img": "gacha_c5/puni-prism-monarch-c5.png"}, {"id": "honoware-ember-wisp-c5", "name_ja": "ホノワレ", "tier": "序盤", "element": "炎", "flavor_ja": "ろうそくの灯火から生まれた、できたての炎の精。頭のちろちろ炎をゆらして、にこにこ近づいてくる。ぽっと触れるとあったかい。", "img": "gacha_c5/honoware-ember-wisp-c5.png"}, {"id": "shizuku-dew-sprite-c5", "name_ja": "シズクっこ", "tier": "序盤", "element": "水", "flavor_ja": "朝つゆからぽちゃんと生まれた水のしずく妖精。ぷるぷるの体で、ころんと転がりながらついてくる。さわるとひんやり気持ちいい。", "img": "gacha_c5/shizuku-dew-sprite-c5.png"}, {"id": "breeze-puff-spirit-c5", "name_ja": "そよプー", "tier": "序盤", "element": "風", "flavor_ja": "そよ風がくるんと丸まって生まれた風の精。ふわふわ体をゆらして、くるくる回りながらついてくる。なでるとくすぐったい。", "img": "gacha_c5/breeze-puff-spirit-c5.png"}, {"id": "pikara-spark-fairy-c5", "name_ja": "ピカラ", "tier": "序盤", "element": "雷", "flavor_ja": "夕立の雷から生まれた、元気いっぱいの火花妖精。バチッと光りながらぴょんぴょん跳ねて、いつもうれしそう。さわるとちょっとピリッ。", "img": "gacha_c5/pikara-spark-fairy-c5.png"}, {"id": "komorebi-lumi-wisp-c5", "name_ja": "コモレビ", "tier": "中盤", "element": "光", "flavor_ja": "木々のすき間からこぼれた光が集まって生まれた、おだやかな光の精。ほわっと体を光らせて、そっとそばに寄りそう。いるだけで心があったかくなる。", "img": "gacha_c5/komorebi-lumi-wisp-c5.png"}, {"id": "awawa-foam-sprite-c5", "name_ja": "アワワ", "tier": "中盤", "element": "泡", "flavor_ja": "せっけんの泡がいっぱい集まって生まれた、ぷくぷくの泡妖精。ぷわぷわ弾みながらついてきて、わらうと泡がぱちぱちはじける。", "img": "gacha_c5/awawa-foam-sprite-c5.png"}, {"id": "kira-prism-pixie-c5", "name_ja": "キラリン", "tier": "中盤", "element": "結晶", "flavor_ja": "鉱石のかけらに光がさして生まれた結晶の妖精。体じゅうがキラキラ光って、歩くたびに虹色がこぼれる。とびきりおしゃれ。", "img": "gacha_c5/kira-prism-pixie-c5.png"}, {"id": "yukimaru-frost-sprite-c5", "name_ja": "ユキマル", "tier": "終盤", "element": "氷", "flavor_ja": "初雪がふんわり丸まって生まれた氷の精。さらさらの体で、雪あそびが大すき。そばにいるとひんやり、でもなんだかぬくもりも感じる不思議な子。", "img": "gacha_c5/yukimaru-frost-sprite-c5.png"}, {"id": "niji-aurora-fae-c5", "name_ja": "ニジカ", "tier": "終盤", "element": "光", "flavor_ja": "夜空のオーロラがそっとひとつぶ宿って生まれた光の妖精。体をなびくオーロラに包んで、しずかに舞いおりる。見た者は思わず願いごとをしてしまう。", "img": "gacha_c5/niji-aurora-fae-c5.png"}, {"id": "seirei-no-ousama-c5", "name_ja": "セイレイ・オウサマ", "tier": "ラスボス級", "element": "全元素", "flavor_ja": "すべての元素の精霊たちが心をひとつにして生まれた、ちいさな精霊たちの王さま。まんまる体に全元素のリボンをまとい、いばっているけれど本当はみんなにやさしい。これぞ精霊界の頂点。", "img": "gacha_c5/seirei-no-ousama-c5.png"}, {"id": "puni-axolotl-sprout-c5", "name_ja": "ぷにあくしー", "tier": "序盤", "element": "水", "flavor_ja": "いつもにこにこ、ほっぺのエラがふわふわ揺れる赤ちゃんウーパールーパー。ぷにぷにの体に水がぴったり張りついている。", "img": "gacha_c5/puni-axolotl-sprout-c5.png"}, {"id": "keron-bubble-froggy-c5", "name_ja": "あわケロン", "tier": "序盤", "element": "水", "flavor_ja": "背中のあわをぷくぷく増やしてご機嫌なカエルの精。さわるとシャボンの香りがしそう。", "img": "gacha_c5/keron-bubble-froggy-c5.png"}, {"id": "mochi-seal-pup-c5", "name_ja": "もちあざらし", "tier": "序盤", "element": "氷", "flavor_ja": "こおりの上でころころ転がる、おもちみたいに真ん丸な赤ちゃんアザラシ。背中にうっすら霜が張りつく。", "img": "gacha_c5/mochi-seal-pup-c5.png"}, {"id": "chibi-seahorse-spark-c5", "name_ja": "ちびタツノコ", "tier": "序盤", "element": "電気", "flavor_ja": "くるんと丸めた尻尾でぷかぷか、体に小さな雷をパチパチまとった赤ちゃんタツノオトシゴ。", "img": "gacha_c5/chibi-seahorse-spark-c5.png"}, {"id": "kawa-otter-tide-c5", "name_ja": "うずまきカワッパ", "tier": "中盤", "element": "水", "flavor_ja": "両手にうずまく水をくるくる操る、わんぱくで陽気なカワウソ。体に水のリボンが巻きついている。", "img": "gacha_c5/kawa-otter-tide-c5.png"}, {"id": "puka-jelly-glow-c5", "name_ja": "ぷかりクラ坊", "tier": "中盤", "element": "光", "flavor_ja": "ぽわぽわ光るドーム型の体で、短いふさふさ触手をちょこんとたたんだ光のクラゲ。中からあかりがにじむ。", "img": "gacha_c5/puka-jelly-glow-c5.png"}, {"id": "crystal-axo-prince-c5", "name_ja": "クリスタルウパ", "tier": "中盤", "element": "結晶", "flavor_ja": "エラがキラキラの結晶になった、ちょっと得意げなウーパールーパー。背中に虹色のクリスタルが密生する。", "img": "gacha_c5/crystal-axo-prince-c5.png"}, {"id": "blaze-newt-puff-c5", "name_ja": "ぽかぽかサラマン", "tier": "終盤", "element": "炎", "flavor_ja": "背中にぽかぽかの炎をまとった、元気いっぱいの丸っこいサンショウウオ。火がやさしく体に寄りそう。", "img": "gacha_c5/blaze-newt-puff-c5.png"}, {"id": "frost-seal-guardian-c5", "name_ja": "こおりまるアザラシ", "tier": "終盤", "element": "氷", "flavor_ja": "分厚い氷のよろいを背負った、おだやかで頼もしい守り神アザラシ。体じゅうに氷の結晶が張りつく。", "img": "gacha_c5/frost-seal-guardian-c5.png"}, {"id": "tide-king-froggy-c5", "name_ja": "おうさまガマぷく", "tier": "ラスボス級", "element": "水", "flavor_ja": "渦巻く水の冠とマントをまとった、堂々たる水のカエル王。ぷくぷくの巨体に大波が巻きつく親しみやすき王者。", "img": "gacha_c5/tide-king-froggy-c5.png"}, {"id": "chibi-komainu-spark-guardian-c5", "name_ja": "コマちび", "tier": "序盤", "element": "静電気", "flavor_ja": "神社の入口でちょこんと座る、子どもの狛犬。なでると毛がふわっと逆立って、パチッと小さな静電気が走る。元気いっぱいに「あうん」と鳴く。", "img": "gacha_c5/chibi-komainu-spark-guardian-c5.png"}, {"id": "kogitsune-foxfire-pup-c5", "name_ja": "ポンこぎつね", "tier": "序盤", "element": "炎(きつね火)", "flavor_ja": "お稲荷さんのお社で生まれた、いたずら好きの子狐。鼻先にともした青い火の玉でみんなを驚かせるけれど、ほんとはさみしがり屋。", "img": "gacha_c5/kogitsune-foxfire-pup-c5.png"}, {"id": "mametanuki-leaf-trickster-c5", "name_ja": "マメだぬき", "tier": "序盤", "element": "葉っぱ(光合成)", "flavor_ja": "森のどんぐりが大好きな、まんまるの豆狸。頭の葉っぱを使って草や石に化けるけれど、おなかが鳴るとすぐにバレてしまう。", "img": "gacha_c5/mametanuki-leaf-trickster-c5.png"}, {"id": "chibi-kappa-bubble-sprite-c5", "name_ja": "カッぱちゃん", "tier": "序盤", "element": "水(泡)", "flavor_ja": "川辺の浅瀬に住む、はずかしがりの子河童。頭のお皿の水がこぼれると力が出ないので、いつもそうっと歩く。きゅうりが大こうぶつ。", "img": "gacha_c5/chibi-kappa-bubble-sprite-c5.png"}, {"id": "mame-tengu-windling-c5", "name_ja": "まめテング", "tier": "中盤", "element": "風(かまいたち)", "flavor_ja": "山おくの大杉で修行中の、見習い天狗。葉っぱのうちわで起こす風はまだ弱いけれど、その分すばしっこくて山じゅうを駆け回る。", "img": "gacha_c5/mame-tengu-windling-c5.png"}, {"id": "yukidaruma-frost-warabe-c5", "name_ja": "ユキんこ", "tier": "中盤", "element": "氷(雪結晶)", "flavor_ja": "雪国の夜にふわりと現れる、まんまるの雪わらべ。体じゅうに六角形の雪の結晶をきらめかせて、しんしんと降る雪の中で楽しそうに転がる。", "img": "gacha_c5/yukidaruma-frost-warabe-c5.png"}, {"id": "chochin-obake-glow-imp-c5", "name_ja": "ちょうちんポン", "tier": "中盤", "element": "光(発光)", "flavor_ja": "古い提灯に宿った、おどけ者の付喪神。中の灯りをぽわっとともして、暗い夜道をてくてくと照らしてくれる。本人はちょっとさみしがり。", "img": "gacha_c5/chochin-obake-glow-imp-c5.png"}, {"id": "kirin-crystal-calf-c5", "name_ja": "コきりん", "tier": "終盤", "element": "結晶(鉱物)", "flavor_ja": "聖なる山に千年にいちど生まれるという、まだ幼い麒麟。背の結晶が虹色に輝くとき、その土地は豊かに実るといわれる。気品ある聖獣の卵。", "img": "gacha_c5/kirin-crystal-calf-c5.png"}, {"id": "raiju-thunder-cub-c5", "name_ja": "ライちび", "tier": "終盤", "element": "電気(雷)", "flavor_ja": "雷雲の中で生まれた、やんちゃな雷獣の子。へそを取りにくるという言い伝えはこの子のしわざ。走るたびに毛から青白い稲妻がパチパチほとばしる。", "img": "gacha_c5/raiju-thunder-cub-c5.png"}, {"id": "kitsune-ninetail-sunqueen-c5", "name_ja": "オオキュウビ・ヒメ", "tier": "ラスボス級", "element": "炎・光(九尾の聖火)", "flavor_ja": "数えきれぬ星霜を生きた、九尾の大妖狐の姫君。九つの尾に灯る黄金の聖火が一斉に燃えあがるとき、その光は夜を昼に変え、すべての妖を従えるという。", "img": "gacha_c5/kitsune-ninetail-sunqueen-c5.png"}]; const KEY="rika2_boss_swipe_gacha_c5";
let st=JSON.parse(localStorage.getItem(KEY)||"null")||{idx:0,dec:{}};
function save(){localStorage.setItem(KEY,JSON.stringify(st));}
const stage=document.getElementById("stage");
document.getElementById("total_n").textContent=BOSSES.length;
let card=null,startX=0,curX=0,dragging=false;

function counts(){const y=Object.values(st.dec).filter(v=>v==="yes").length;
  document.getElementById("done_n").textContent=Object.keys(st.dec).length;
  document.getElementById("yes_n").textContent=y;}

function build(idx){
  const b=BOSSES[idx]; const el=document.createElement("div"); el.className="card";
  el.innerHTML=`<div class="stamp yes">有り</div><div class="stamp no">無し</div>
    <div class="imgbox"><img src="${b.img}" alt=""></div>
    <div class="info"><div class="nm">${b.name_ja}<span class="tier t${b.tier}">${b.tier}</span></div>
    <div class="el">${b.element}</div><div class="fl">${b.flavor_ja}</div></div>`;
  el.addEventListener("pointerdown",down); el.addEventListener("pointermove",move);
  el.addEventListener("pointerup",up); el.addEventListener("pointercancel",up);
  return el;
}
function show(){
  if(card){card.remove();card=null;}
  if(st.idx>=BOSSES.length){document.getElementById("doneScreen").style.display="flex";finish();return;}
  document.getElementById("doneScreen").style.display="none";
  card=build(st.idx); stage.appendChild(card); counts();
}
function down(e){dragging=true;startX=e.clientX;curX=0;card.setPointerCapture(e.pointerId);card.style.transition="none";}
function move(e){if(!dragging)return;curX=e.clientX-startX;card.style.transform=`translateX(${curX}px) rotate(${curX/18}deg)`;
  card.querySelector(".yes").style.opacity=Math.max(0,Math.min(1,curX/90));
  card.querySelector(".no").style.opacity=Math.max(0,Math.min(1,-curX/90));}
function up(){if(!dragging)return;dragging=false;
  if(curX>90)decide("yes");else if(curX<-90)decide("no");
  else{card.style.transition=".2s";card.style.transform="";card.querySelector(".yes").style.opacity=0;card.querySelector(".no").style.opacity=0;}}
function decide(v){
  st.dec[BOSSES[st.idx].id]=v; save();
  const dir=v==="yes"?1:-1;
  card.style.transition=".3s ease-out";
  card.style.transform=`translateX(${dir*140}vw) rotate(${dir*25}deg)`;
  card.style.opacity="0";
  setTimeout(()=>{st.idx++;save();show();},260);
}
function undo(){if(st.idx<=0)return;st.idx--;delete st.dec[BOSSES[st.idx].id];save();show();}
function summaryText(){
  const yes=BOSSES.filter(b=>st.dec[b.id]==="yes"),no=BOSSES.filter(b=>st.dec[b.id]==="no");
  let s=`=== ボス選別 結果 (有り${yes.length} / 無し${no.length} / 計${BOSSES.length}) ===\n【有り】\n`;
  yes.forEach(b=>s+=`- ${b.name_ja} (${b.tier}/${b.element}) [${b.id}]\n`);
  s+="【無し】\n"; no.forEach(b=>s+=`- ${b.name_ja} (${b.tier}/${b.element}) [${b.id}]\n`);
  return s;
}
function finish(){
  const yes=BOSSES.filter(b=>st.dec[b.id]==="yes").length;
  document.getElementById("summary").textContent=`有り ${yes} 体 / 無し ${BOSSES.length-yes} 体`;
}
function copyOut(){const s=summaryText();const o=document.getElementById("out");o.style.display="block";o.value=s;
  if(navigator.clipboard)navigator.clipboard.writeText(s).then(()=>{const t=document.getElementById("toast");t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1500);},()=>{});o.select();}
document.getElementById("bNo").onclick=()=>{if(st.idx<BOSSES.length)decide("no");};
document.getElementById("bYes").onclick=()=>{if(st.idx<BOSSES.length)decide("yes");};
document.getElementById("bUndo").onclick=undo;
document.getElementById("bCopy").onclick=copyOut;
document.getElementById("copyBtn").onclick=copyOut;
document.getElementById("restartBtn").onclick=()=>{st={idx:0,dec:{}};save();show();};
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"&&st.idx<BOSSES.length)decide("no");
  else if(e.key==="ArrowRight"&&st.idx<BOSSES.length)decide("yes");else if(e.key==="Backspace")undo();});
show();
</script></body></html>
