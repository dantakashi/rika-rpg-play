<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>ボス選別 — 理科RPG2</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0f1014;color:#e7e7ea;font-family:system-ui,"Hiragino Kaku Gothic ProN",sans-serif;overflow:hidden;height:100dvh}
header{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;background:#1a1c22;border-bottom:1px solid #2c2f3a}
header b{color:#ffe27a}.count{font-size:13px;color:#9aa0ad}
.stage{position:relative;height:calc(100dvh - 150px);display:flex;align-items:center;justify-content:center;padding:10px}
.card{position:absolute;width:min(92vw,440px);max-height:100%;background:#1d1f26;border:1px solid #2c2f3a;border-radius:18px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5);touch-action:none}
.imgbox{aspect-ratio:1/1;
  background-image:linear-gradient(45deg,#cfcfcf 25%,transparent 25%),linear-gradient(-45deg,#cfcfcf 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#cfcfcf 75%),linear-gradient(-45deg,transparent 75%,#cfcfcf 75%);
  background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0;background-color:#e9e9e9}
.imgbox img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.info{padding:12px 16px}
.nm{font-size:22px;font-weight:800}
.nm .tier{font-size:14px;font-weight:700;padding:2px 10px;border-radius:999px;margin-left:8px;vertical-align:3px}
.t序盤{background:#2bd47a;color:#06210f}.t中盤{background:#4aa3ff;color:#04203f}.t終盤{background:#ff9a3c;color:#311600}.tラスボス級{background:#ff5a7a;color:#33000d}
.el{font-size:12px;color:#9aa0ad;margin-top:2px}
.fl{font-size:14px;color:#cfd3db;margin-top:8px;line-height:1.55}
.stamp{position:absolute;top:18px;font-size:34px;font-weight:900;padding:4px 14px;border:4px solid;border-radius:12px;opacity:0;transform:rotate(-15deg)}
.yes{left:18px;color:#2bd47a;border-color:#2bd47a}.no{right:18px;color:#ff5a7a;border-color:#ff5a7a}
.bar{position:fixed;bottom:0;left:0;right:0;height:90px;display:flex;align-items:center;justify-content:center;gap:22px;background:#13141a;border-top:1px solid #2c2f3a}
.fab{width:62px;height:62px;border-radius:50%;border:none;font-size:26px;cursor:pointer;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.fab.no{background:#2a1d23;color:#ff5a7a;border:2px solid #ff5a7a}.fab.yes{background:#16271c;color:#2bd47a;border:2px solid #2bd47a}
.fab.undo{width:48px;height:48px;font-size:18px;background:#23242c;color:#cfd3db;border:1px solid #3a3f4c}
.done{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.done h2{color:#ffe27a;margin:0 0 8px}
.btn{margin-top:14px;background:#ffe27a;color:#15161a;border:none;border-radius:10px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
#out{margin-top:12px;width:min(92vw,520px);height:160px;font-family:ui-monospace,monospace;font-size:11px;display:none;background:#0b0c10;color:#cfd3db;border:1px solid #3a3f4c;border-radius:8px;padding:8px}
.hint{font-size:11px;color:#6b7280;margin-top:6px}
.toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%);background:#2bd47a;color:#08210f;padding:8px 16px;border-radius:999px;font-weight:700;opacity:0;transition:.3s;pointer-events:none}.toast.show{opacity:1}
</style></head><body>
<header><div><b>ボス選別</b> <span style="font-size:12px;color:#9aa0ad">← 無し / 有り → ・ドラッグもOK</span></div>
  <div class="count"><span id="done_n">0</span>/<span id="total_n">0</span> ・有り<span id="yes_n">0</span></div></header>
<div class="stage" id="stage">
  <div class="done" id="doneScreen">
    <h2>選別おわり！</h2>
    <div id="summary" style="color:#cfd3db"></div>
    <button class="btn" id="copyBtn">結果をコピー</button>
    <div class="hint">コピーしたテキストをチャットに貼ってください（採用の系統を学習して次の50枚へ）。</div>
    <textarea id="out" readonly></textarea>
    <button class="btn" id="restartBtn" style="background:#3a3f4c;color:#e7e7ea">最初からやり直す</button>
  </div>
</div>
<div class="bar">
  <button class="fab no" id="bNo">✗</button>
  <button class="fab undo" id="bUndo">↶</button>
  <button class="fab yes" id="bYes">♥</button>
  <button class="btn" id="bCopy" style="position:fixed;right:12px;bottom:104px;padding:8px 12px;font-size:12px">途中保存コピー</button>
</div>
<div class="toast" id="toast">コピーしました！</div>
<script>
const BOSSES=[{"id": "fizzy-bubblefrog-b20", "name_ja": "あわっぱフロッグ", "tier": "序盤", "element": "泡", "flavor_ja": "ぷくぷく泡を吹いて笑う、まんまるカエルの精。気が抜けるとしぼむ。", "img": "gacha_b20/fizzy-bubblefrog-b20.png"}, {"id": "spark-pup-voltkit-b20", "name_ja": "ビリころワン", "tier": "序盤", "element": "電気", "flavor_ja": "なでると静電気でパチッ。元気いっぱいの電気こいぬ。", "img": "gacha_b20/spark-pup-voltkit-b20.png"}, {"id": "gummy-prism-slime-b20", "name_ja": "プリズムぷるん", "tier": "序盤", "element": "光", "flavor_ja": "光をあびると体に虹がはしる、ぷるぷるのプリズムスライム。", "img": "gacha_b20/gummy-prism-slime-b20.png"}, {"id": "circuit-crab-amperon-b20", "name_ja": "アンペラガニ", "tier": "中盤", "element": "電気", "flavor_ja": "甲羅は生きた回路。ハサミでパチンと放電する電池ガニ。", "img": "gacha_b20/circuit-crab-amperon-b20.png"}, {"id": "crystal-tortoise-geode-b20", "name_ja": "ジオードガメ", "tier": "中盤", "element": "結晶", "flavor_ja": "背中の甲羅は宝石の洞窟。どっしり構えるクリスタルの守り神。", "img": "gacha_b20/crystal-tortoise-geode-b20.png"}, {"id": "lantern-bubble-jelly-b20", "name_ja": "ぽわりクラゲ", "tier": "中盤", "element": "光", "flavor_ja": "ぽわっと光る、まんまる提灯クラゲ。暗いところで道を照らす。", "img": "gacha_b20/lantern-bubble-jelly-b20.png"}, {"id": "thunderhead-golem-storm-b20", "name_ja": "イカヅチゴーレム", "tier": "終盤", "element": "電気", "flavor_ja": "雷雲を固めた巨人。一歩ふみだすたびに空がとどろく。", "img": "gacha_b20/thunderhead-golem-storm-b20.png"}, {"id": "magma-bubble-salamander-b20", "name_ja": "ぐつぐつサラマン", "tier": "終盤", "element": "泡", "flavor_ja": "体の中で溶岩がぐつぐつ煮える。火ぶくれを飛ばす岩のトカゲ。", "img": "gacha_b20/magma-bubble-salamander-b20.png"}, {"id": "prism-phoenix-spectra-b20", "name_ja": "スペクトラ・フェニックス", "tier": "ラスボス級", "element": "光", "flavor_ja": "全ての色をその身にまとう光の幻鳥。羽ばたきは虹の閃光。", "img": "gacha_b20/prism-phoenix-spectra-b20.png"}, {"id": "voltcore-leviathan-dynamo-b20", "name_ja": "ダイナモ・リヴァイア", "tier": "ラスボス級", "element": "電気", "flavor_ja": "体内で発電する電磁の竜王。コイルの胴がうなり、雷をまとう。", "img": "gacha_b20/voltcore-leviathan-dynamo-b20.png"}, {"id": "prism-puddle-slime-b20", "name_ja": "プリズムぷにすけ", "tier": "序盤", "element": "光", "flavor_ja": "光を七色に分けるぷにぷにスライム。プリズムの体に虹がとじこめられている。", "img": "gacha_b20/prism-puddle-slime-b20.png"}, {"id": "neon-tide-jelly-b20", "name_ja": "ネオンくらげ", "tier": "序盤", "element": "光", "flavor_ja": "深海の発光生物がネオンに進化した姿。やわらかな光がいやしをくれる。", "img": "gacha_b20/neon-tide-jelly-b20.png"}, {"id": "candy-shell-snail-b20", "name_ja": "キャンディかたつむり", "tier": "序盤", "element": "結晶", "flavor_ja": "あめ細工のような結晶の殻を背負う。光が当たるとキラキラ反射する。", "img": "gacha_b20/candy-shell-snail-b20.png"}, {"id": "spectra-mantis-crab-b20", "name_ja": "スペクトラガニ", "tier": "中盤", "element": "光", "flavor_ja": "甲羅が構造色でぎらつく光のカニ。プリズムのハサミが虹をまき散らす。", "img": "gacha_b20/spectra-mantis-crab-b20.png"}, {"id": "plasma-arc-fox-beetle-b20", "name_ja": "プラズマかぶと", "tier": "中盤", "element": "プラズマ", "flavor_ja": "角に極彩のプラズマをまとう甲虫。電気を放つたび色がはじける。", "img": "gacha_b20/plasma-arc-fox-beetle-b20.png"}, {"id": "glow-spore-toadling-b20", "name_ja": "ひかりキノコガエル", "tier": "中盤", "element": "発光", "flavor_ja": "背中の発光キノコと共生するカエル。夜になると体じゅうが光りだす。", "img": "gacha_b20/glow-spore-toadling-b20.png"}, {"id": "aurora-coil-serpent-b20", "name_ja": "オーロラコイル", "tier": "終盤", "element": "プラズマ", "flavor_ja": "極彩のオーロラを身にまとう霊蛇。とぐろの内に光のカーテンが揺れる。", "img": "gacha_b20/aurora-coil-serpent-b20.png"}, {"id": "crystal-prism-golem-b20", "name_ja": "プリズムゴーレム", "tier": "終盤", "element": "結晶", "flavor_ja": "極彩の結晶が寄り集まって動く巨像。体に入った光が虹色に砕ける。", "img": "gacha_b20/crystal-prism-golem-b20.png"}, {"id": "chromatic-radiance-dragon-b20", "name_ja": "クロマティックドラゴン", "tier": "ラスボス級", "element": "光", "flavor_ja": "全身の鱗が虹色に発光する光の竜王。一鱗ごとに違う色がまたたく。", "img": "gacha_b20/chromatic-radiance-dragon-b20.png"}, {"id": "supernova-mandala-leviathan-b20", "name_ja": "スーパーノヴァ・マンダラ", "tier": "ラスボス級", "element": "プラズマ", "flavor_ja": "超新星の極彩プラズマを背に負う神獣。曼荼羅の光輪が体を焼きながら巡る。", "img": "gacha_b20/supernova-mandala-leviathan-b20.png"}, {"id": "ember-puff-sprite-b20", "name_ja": "ポッ火（ぽっか）", "tier": "序盤", "element": "炎", "flavor_ja": "うまれたての炎の精霊。さわるとほんのりあったかい。やる気だけは一人前。", "img": "gacha_b20/ember-puff-sprite-b20.png"}, {"id": "droplet-bubbo-b20", "name_ja": "しずくん", "tier": "序盤", "element": "水", "flavor_ja": "コップ一杯ぶんの水の精霊。よく揺れるけどこぼれない。のどがかわいたら水をくれる。", "img": "gacha_b20/droplet-bubbo-b20.png"}, {"id": "breezel-gust-b20", "name_ja": "ふわっち", "tier": "序盤", "element": "風", "flavor_ja": "そよ風の精霊。ふわっと近づいてくる。前髪をやさしくゆらしてくる。", "img": "gacha_b20/breezel-gust-b20.png"}, {"id": "spark-zappy-b20", "name_ja": "ビリた", "tier": "中盤", "element": "雷", "flavor_ja": "ためた電気でほっぺがパチパチ鳴る雷の精霊。さわるとちょっとしびれる。元気いっぱい。", "img": "gacha_b20/spark-zappy-b20.png"}, {"id": "frost-mochi-imp-b20", "name_ja": "こおりもち", "tier": "中盤", "element": "氷", "flavor_ja": "ひんやりつめたい氷の精霊。だっこするとアイスみたいに冷たい。ねむそうだけど頑固。", "img": "gacha_b20/frost-mochi-imp-b20.png"}, {"id": "pebble-clod-tot-b20", "name_ja": "つちまる", "tier": "中盤", "element": "土", "flavor_ja": "畑からうまれた土の精霊。どっしりして動じない。頭から草が生えてのんびり育つ。", "img": "gacha_b20/pebble-clod-tot-b20.png"}, {"id": "lumen-glow-fae-b20", "name_ja": "ひかりちゃ", "tier": "終盤", "element": "光", "flavor_ja": "やさしい光の精霊。そばにいるとあたたかく照らしてくれる。すこし神々しい箸休め。", "img": "gacha_b20/lumen-glow-fae-b20.png"}, {"id": "verdant-spore-pixie-b20", "name_ja": "もりのこ", "tier": "終盤", "element": "土", "flavor_ja": "森の奥でそだった生命の精霊。背中から草花が生えている。なでると胞子がふわっと光る。", "img": "gacha_b20/verdant-spore-pixie-b20.png"}, {"id": "magma-king-blob-b20", "name_ja": "マグマおう", "tier": "ラスボス級", "element": "炎", "flavor_ja": "精霊たちを束ねる炎の王。岩のからだの割れ目からマグマがあふれる。重くて、つよくて、でもどこか愛嬌がある。", "img": "gacha_b20/magma-king-blob-b20.png"}, {"id": "prism-storm-monarch-b20", "name_ja": "ななついろ大精霊（だいせいれい）", "tier": "ラスボス級", "element": "光", "flavor_ja": "すべての元素の精霊をまとめる七色の大精霊。からだの中で炎・水・風・雷・氷・土・光が静かに渦巻いている。やさしいけれど、いちばんつよい。", "img": "gacha_b20/prism-storm-monarch-b20.png"}, {"id": "axolotl-pressure-tot-b20", "name_ja": "プカリン・ウーパー", "tier": "序盤", "element": "圧力", "flavor_ja": "おなかにいきおいよく水をためてふくらむ、まんまるウーパールーパー。圧力でぱんぱんのおなかは、たたくとポムッと音がする。", "img": "gacha_b20/axolotl-pressure-tot-b20.png"}, {"id": "clownfish-anemone-guard-b20", "name_ja": "アネモ・クマノミ", "tier": "序盤", "element": "毒", "flavor_ja": "毒のあるイソギンチャクをマフラーみたいに巻いた、くりくり目のカクレクマノミ。だっこされてるみたいで本人は平気。", "img": "gacha_b20/clownfish-anemone-guard-b20.png"}, {"id": "frog-charge-hopper-b20", "name_ja": "ビリッ・ガエル", "tier": "序盤", "element": "電気", "flavor_ja": "のどぶくろをふくらませるたびにバチバチ放電する、まんまるアマガエル。さわるとしびれるので友だちが少ない。", "img": "gacha_b20/frog-charge-hopper-b20.png"}, {"id": "pufferfish-spike-orb-b20", "name_ja": "トゲマル・フグ", "tier": "中盤", "element": "毒", "flavor_ja": "おこるとパンッとふくらんでトゲだらけの毒ボールになる、ぷんぷんフグ。中身はびびりなので、ふくらんで身を守る。", "img": "gacha_b20/pufferfish-spike-orb-b20.png"}, {"id": "seahorse-coral-knight-b20", "name_ja": "サンゴ・タツノコ", "tier": "中盤", "element": "圧力", "flavor_ja": "深海のすいあつにたえる、サンゴのよろいを着たタツノオトシゴの騎士。まいた尻尾でどっしり立つ。", "img": "gacha_b20/seahorse-coral-knight-b20.png"}, {"id": "jellyfish-volt-dome-b20", "name_ja": "ビリビリ・クラゲ", "tier": "中盤", "element": "発光", "flavor_ja": "体じゅうがぼんやり光り、ときどき電気を流すドーム形クラゲ。ぷるぷるだけど近づくとビリッとくる。", "img": "gacha_b20/jellyfish-volt-dome-b20.png"}, {"id": "mola-deep-colossus-b20", "name_ja": "オオウミ・マンボウ", "tier": "終盤", "element": "圧力", "flavor_ja": "深海のすいあつをまとった、見上げるほど巨大な円盤マンボウ。のんびり顔だがその一撃は重い。", "img": "gacha_b20/mola-deep-colossus-b20.png"}, {"id": "anglerfish-lantern-lord-b20", "name_ja": "ヒカリ・アンコウ", "tier": "終盤", "element": "発光", "flavor_ja": "ひたいのちょうちんが自分の顔を照らす、まんまるで巨大なアンコウの主。やみの中ではこの光がいちばん怖い。", "img": "gacha_b20/anglerfish-lantern-lord-b20.png"}, {"id": "abyss-pressure-leviathan-b20", "name_ja": "シンエン・プレッシャー", "tier": "ラスボス級", "element": "圧力", "flavor_ja": "フグ・ウーパー・タツノコが融合した、深海の水圧をまとう巨大な王。全身が圧力の鎧でつぶれそうなのに、平然と立っている。", "img": "gacha_b20/abyss-pressure-leviathan-b20.png"}, {"id": "abyss-volt-empress-b20", "name_ja": "ライコウ・アビス", "tier": "ラスボス級", "element": "電気", "flavor_ja": "クラゲ・カエル・クマノミが融合し、発光と電撃をまとう深海の女帝。光ったかと思うと全身からバチバチと雷を放つ。", "img": "gacha_b20/abyss-volt-empress-b20.png"}, {"id": "festival-peachick-b20", "name_ja": "コクジャク", "tier": "序盤", "element": "彩風", "flavor_ja": "尾羽がまだ生えそろわない、生まれたての孔雀の赤ちゃん。歩くたびにふわふわの羽がきらきら光り、お祭りみたいに賑やかな子。", "img": "gacha_b20/festival-peachick-b20.png"}, {"id": "lucky-koromo-sparrow-b20", "name_ja": "フクラスズメ", "tier": "序盤", "element": "幸風", "flavor_ja": "寒い日にぷくっとふくらんで福を呼ぶ、まんまるな縁起すずめ。ころんとした体に小判のお守りをつけて、ちょこちょこ歩く。", "img": "gacha_b20/lucky-koromo-sparrow-b20.png"}, {"id": "spring-kirin-calf-b20", "name_ja": "コキリン", "tier": "序盤", "element": "若葉", "flavor_ja": "まだ角が芽のように小さい、麒麟の赤ちゃん。やわらかな若葉色のうろこと、ぽわぽわの炎みたいなたてがみがチャームポイント。", "img": "gacha_b20/spring-kirin-calf-b20.png"}, {"id": "blossom-phoenix-fledgling-b20", "name_ja": "ハナホウオウ", "tier": "中盤", "element": "花炎", "flavor_ja": "羽の一枚一枚が花びらの形をした、若き鳳凰。羽ばたくと桜色の炎が体をつつみ、あたりにあたたかな春の気配をふりまく。", "img": "gacha_b20/blossom-phoenix-fledgling-b20.png"}, {"id": "thunder-fairy-dragonling-b20", "name_ja": "ライセイリュウ", "tier": "中盤", "element": "雷と虹", "flavor_ja": "背中の小さな水晶でちりちりと雷をためる、妖精のような子竜。羽はにじ色で、おどろくとぱちっと小さな火花を散らす甘えん坊。", "img": "gacha_b20/thunder-fairy-dragonling-b20.png"}, {"id": "cloud-koma-guardian-b20", "name_ja": "コマフク", "tier": "中盤", "element": "瑞雲", "flavor_ja": "もくもくの雲をまとった、こま犬の霊獣。守り神らしい堂々とした顔つきだけど、体はまんまるでふわふわ。首の鈴がちりんと鳴る。", "img": "gacha_b20/cloud-koma-guardian-b20.png"}, {"id": "auspice-crane-empress-b20", "name_ja": "ズイチョウヅル", "tier": "終盤", "element": "瑞祥", "flavor_ja": "千年を生きるという瑞祥の霊鶴。金色の冠羽をいただき、その羽ばたきは吉兆を告げる。気高くも、どこか愛らしい気品をたたえる。", "img": "gacha_b20/auspice-crane-empress-b20.png"}, {"id": "rainbow-peacock-sovereign-b20", "name_ja": "ニジオウジャク", "tier": "終盤", "element": "極彩", "flavor_ja": "あらゆる色をその羽に宿す孔雀の王。広げた尾羽には無数の虹色の目が輝き、見る者を魅了する。荘厳でありながら、まばゆくポップ。", "img": "gacha_b20/rainbow-peacock-sovereign-b20.png"}, {"id": "celestial-kirin-sovereign-b20", "name_ja": "テンガイキリン", "tier": "ラスボス級", "element": "天光", "flavor_ja": "聖王の世にのみ姿を見せるという至高の神獣・麒麟。一本角に天の光をやどし、その歩みは大地を清める。荘厳の極みにして、どこか温かい。", "img": "gacha_b20/celestial-kirin-sovereign-b20.png"}, {"id": "eternal-phoenix-monarch-b20", "name_ja": "フッカツホウオウ", "tier": "ラスボス級", "element": "不滅の炎", "flavor_ja": "幾度灰になっても甦る、不死鳥の頂点。全身を不滅の炎がつつみ、羽ばたきひとつで夜を黄金に染める。終わりなき命の王者にして、究極の縁起鳥。", "img": "gacha_b20/eternal-phoenix-monarch-b20.png"}]; const KEY="rika2_boss_swipe_gacha_b20";
let st=JSON.parse(localStorage.getItem(KEY)||"null")||{idx:0,dec:{}};
function save(){localStorage.setItem(KEY,JSON.stringify(st));}
const stage=document.getElementById("stage");
document.getElementById("total_n").textContent=BOSSES.length;
let card=null,startX=0,curX=0,dragging=false;

function counts(){const y=Object.values(st.dec).filter(v=>v==="yes").length;
  document.getElementById("done_n").textContent=Object.keys(st.dec).length;
  document.getElementById("yes_n").textContent=y;}

function build(idx){
  const b=BOSSES[idx]; const el=document.createElement("div"); el.className="card";
  el.innerHTML=`<div class="stamp yes">有り</div><div class="stamp no">無し</div>
    <div class="imgbox"><img src="${b.img}" alt=""></div>
    <div class="info"><div class="nm">${b.name_ja}<span class="tier t${b.tier}">${b.tier}</span></div>
    <div class="el">${b.element}</div><div class="fl">${b.flavor_ja}</div></div>`;
  el.addEventListener("pointerdown",down); el.addEventListener("pointermove",move);
  el.addEventListener("pointerup",up); el.addEventListener("pointercancel",up);
  return el;
}
function show(){
  if(card){card.remove();card=null;}
  if(st.idx>=BOSSES.length){document.getElementById("doneScreen").style.display="flex";finish();return;}
  document.getElementById("doneScreen").style.display="none";
  card=build(st.idx); stage.appendChild(card); counts();
}
function down(e){dragging=true;startX=e.clientX;curX=0;card.setPointerCapture(e.pointerId);card.style.transition="none";}
function move(e){if(!dragging)return;curX=e.clientX-startX;card.style.transform=`translateX(${curX}px) rotate(${curX/18}deg)`;
  card.querySelector(".yes").style.opacity=Math.max(0,Math.min(1,curX/90));
  card.querySelector(".no").style.opacity=Math.max(0,Math.min(1,-curX/90));}
function up(){if(!dragging)return;dragging=false;
  if(curX>90)decide("yes");else if(curX<-90)decide("no");
  else{card.style.transition=".2s";card.style.transform="";card.querySelector(".yes").style.opacity=0;card.querySelector(".no").style.opacity=0;}}
function decide(v){
  st.dec[BOSSES[st.idx].id]=v; save();
  const dir=v==="yes"?1:-1;
  card.style.transition=".3s ease-out";
  card.style.transform=`translateX(${dir*140}vw) rotate(${dir*25}deg)`;
  card.style.opacity="0";
  setTimeout(()=>{st.idx++;save();show();},260);
}
function undo(){if(st.idx<=0)return;st.idx--;delete st.dec[BOSSES[st.idx].id];save();show();}
function summaryText(){
  const yes=BOSSES.filter(b=>st.dec[b.id]==="yes"),no=BOSSES.filter(b=>st.dec[b.id]==="no");
  let s=`=== ボス選別 結果 (有り${yes.length} / 無し${no.length} / 計${BOSSES.length}) ===\n【有り】\n`;
  yes.forEach(b=>s+=`- ${b.name_ja} (${b.tier}/${b.element}) [${b.id}]\n`);
  s+="【無し】\n"; no.forEach(b=>s+=`- ${b.name_ja} (${b.tier}/${b.element}) [${b.id}]\n`);
  return s;
}
function finish(){
  const yes=BOSSES.filter(b=>st.dec[b.id]==="yes").length;
  document.getElementById("summary").textContent=`有り ${yes} 体 / 無し ${BOSSES.length-yes} 体`;
}
function copyOut(){const s=summaryText();const o=document.getElementById("out");o.style.display="block";o.value=s;
  if(navigator.clipboard)navigator.clipboard.writeText(s).then(()=>{const t=document.getElementById("toast");t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1500);},()=>{});o.select();}
document.getElementById("bNo").onclick=()=>{if(st.idx<BOSSES.length)decide("no");};
document.getElementById("bYes").onclick=()=>{if(st.idx<BOSSES.length)decide("yes");};
document.getElementById("bUndo").onclick=undo;
document.getElementById("bCopy").onclick=copyOut;
document.getElementById("copyBtn").onclick=copyOut;
document.getElementById("restartBtn").onclick=()=>{st={idx:0,dec:{}};save();show();};
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"&&st.idx<BOSSES.length)decide("no");
  else if(e.key==="ArrowRight"&&st.idx<BOSSES.length)decide("yes");else if(e.key==="Backspace")undo();});
show();
</script></body></html>
