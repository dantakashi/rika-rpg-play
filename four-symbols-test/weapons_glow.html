<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>武器グロー量くらべ (Zavy LoRA)</title><style>
:root{color-scheme:dark}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0f1014;color:#e7e7ea;font-family:system-ui,"Hiragino Kaku Gothic ProN",sans-serif;padding-bottom:88px}
header{position:sticky;top:0;z-index:5;padding:10px 14px;background:#1a1c22;border-bottom:1px solid #2c2f3a}
header b{color:#ffe27a}.sub{font-size:12px;color:#9aa0ad;margin-top:4px;line-height:1.5}
table{border-collapse:collapse;width:max-content;min-width:100%}th,td{padding:4px;text-align:center}
th.col{cursor:pointer;font-size:13px;color:#ffe27a;background:#1a1c22;border:2px solid #2c2f3a;border-radius:10px;padding:8px 6px;position:sticky;top:56px}
th.col.win{background:#16271c;border-color:#2bd47a;color:#2bd47a}.th.col .pk{display:block}
td img{width:230px;height:230px;object-fit:contain;background:#e9e9e9;border-radius:8px}
td.win img{outline:3px solid #2bd47a}th.row{font-size:12px;color:#cfd3db;writing-mode:vertical-rl;white-space:nowrap}
.bar{position:fixed;bottom:0;left:0;right:0;height:68px;display:flex;align-items:center;justify-content:center;gap:14px;background:#13141a;border-top:1px solid #2c2f3a}
.cur{font-size:14px}.cur b{color:#2bd47a}.btn{background:#ffe27a;color:#15161a;border:none;border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer}
#out{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);width:min(92vw,520px);height:110px;display:none;background:#0b0c10;color:#cfd3db;border:1px solid #3a3f4c;border-radius:8px;padding:8px;font-family:ui-monospace,monospace;font-size:12px}
.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:#2bd47a;color:#08210f;padding:8px 16px;border-radius:999px;font-weight:700;opacity:0;transition:.3s}.toast.show{opacity:1}
</style></head><body>
<header><b>武器グロー量くらべ (Zavy LoRA)</b><div class="sub">D(glow)確定＋game-icon LoRA(Zavy)採用。残る軸＝グロー量。G1明瞭↔G3派手。一番良い列ヘッダをタップ→コピー。混ぜ指示も可。</div></header>
<div style="overflow:auto"><table><thead><tr><th></th><th class="col" data-r="G1_clear">G1 clear 明瞭</th><th class="col" data-r="G2_aura">G2 aura 中</th><th class="col" data-r="G3_glow">G3 glow 派手</th></tr></thead><tbody><tr><th class="row">天魔滅却の大剣 (LR)</th><td class="cell" data-r="G1_clear"><img src="weap_glow/eq257__G1_clear.jpg" loading="lazy"></td><td class="cell" data-r="G2_aura"><img src="weap_glow/eq257__G2_aura.jpg" loading="lazy"></td><td class="cell" data-r="G3_glow"><img src="weap_glow/eq257__G3_glow.jpg" loading="lazy"></td></tr><tr><th class="row">裁きと慈悲の聖杖 (LR)</th><td class="cell" data-r="G1_clear"><img src="weap_glow/eq293__G1_clear.jpg" loading="lazy"></td><td class="cell" data-r="G2_aura"><img src="weap_glow/eq293__G2_aura.jpg" loading="lazy"></td><td class="cell" data-r="G3_glow"><img src="weap_glow/eq293__G3_glow.jpg" loading="lazy"></td></tr><tr><th class="row">終焉の杖 (UR)</th><td class="cell" data-r="G1_clear"><img src="weap_glow/eq116__G1_clear.jpg" loading="lazy"></td><td class="cell" data-r="G2_aura"><img src="weap_glow/eq116__G2_aura.jpg" loading="lazy"></td><td class="cell" data-r="G3_glow"><img src="weap_glow/eq116__G3_glow.jpg" loading="lazy"></td></tr></tbody></table></div>
<div class="bar"><div class="cur">選択: <b id="cur">なし</b></div><button class="btn" id="copyBtn">結果をコピー</button></div>
<textarea id="out" readonly></textarea><div class="toast" id="toast">コピーしました！</div>
<script>
const RECIPES=[["G1_clear", "G1 clear 明瞭"], ["G2_aura", "G2 aura 中"], ["G3_glow", "G3 glow 派手"]];const KEY="rika2_weapons_glow";let win=localStorage.getItem(KEY)||"";
function paint(){document.querySelectorAll("th.col").forEach(t=>t.classList.toggle("win",t.dataset.r===win));
 document.querySelectorAll("td.cell").forEach(t=>t.classList.toggle("win",t.dataset.r===win));
 const r=RECIPES.find(x=>x[0]===win);document.getElementById("cur").textContent=r?r[1]:"なし";}
document.querySelectorAll("th.col").forEach(t=>t.onclick=()=>{win=(win===t.dataset.r)?"":t.dataset.r;localStorage.setItem(KEY,win);paint();});
document.getElementById("copyBtn").onclick=()=>{const r=RECIPES.find(x=>x[0]===win);
 const s="=== 武器グロー量くらべ (Zavy LoRA) 結果 ===\n選択: "+(r?r[1]+" ["+r[0]+"]":"なし(チャットで指示)")+"\n";
 const o=document.getElementById("out");o.style.display="block";o.value=s;o.select();
 if(navigator.clipboard)navigator.clipboard.writeText(s).then(()=>{const t=document.getElementById("toast");t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1400);},()=>{});};
paint();
</script></body></html>
