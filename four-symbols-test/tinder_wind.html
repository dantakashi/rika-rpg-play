<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>ボス選別 — 理科RPG2</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0f1014;color:#e7e7ea;font-family:system-ui,"Hiragino Kaku Gothic ProN",sans-serif;overflow:hidden;height:100dvh}
header{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;background:#1a1c22;border-bottom:1px solid #2c2f3a}
header b{color:#ffe27a}.count{font-size:13px;color:#9aa0ad}
.stage{position:relative;height:calc(100dvh - 150px);display:flex;align-items:center;justify-content:center;padding:10px}
.card{position:absolute;width:min(92vw,440px);max-height:100%;background:#1d1f26;border:1px solid #2c2f3a;border-radius:18px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5);touch-action:none}
.imgbox{aspect-ratio:1/1;
  background-image:linear-gradient(45deg,#cfcfcf 25%,transparent 25%),linear-gradient(-45deg,#cfcfcf 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#cfcfcf 75%),linear-gradient(-45deg,transparent 75%,#cfcfcf 75%);
  background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0;background-color:#e9e9e9}
.imgbox img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.info{padding:12px 16px}
.nm{font-size:22px;font-weight:800}
.nm .tier{font-size:14px;font-weight:700;padding:2px 10px;border-radius:999px;margin-left:8px;vertical-align:3px}
.t序盤{background:#2bd47a;color:#06210f}.t中盤{background:#4aa3ff;color:#04203f}.t終盤{background:#ff9a3c;color:#311600}.tラスボス級{background:#ff5a7a;color:#33000d}
.el{font-size:12px;color:#9aa0ad;margin-top:2px}
.fl{font-size:14px;color:#cfd3db;margin-top:8px;line-height:1.55}
.stamp{position:absolute;top:18px;font-size:34px;font-weight:900;padding:4px 14px;border:4px solid;border-radius:12px;opacity:0;transform:rotate(-15deg)}
.yes{left:18px;color:#2bd47a;border-color:#2bd47a}.no{right:18px;color:#ff5a7a;border-color:#ff5a7a}
.bar{position:fixed;bottom:0;left:0;right:0;height:90px;display:flex;align-items:center;justify-content:center;gap:22px;background:#13141a;border-top:1px solid #2c2f3a}
.fab{width:62px;height:62px;border-radius:50%;border:none;font-size:26px;cursor:pointer;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.fab.no{background:#2a1d23;color:#ff5a7a;border:2px solid #ff5a7a}.fab.yes{background:#16271c;color:#2bd47a;border:2px solid #2bd47a}
.fab.undo{width:48px;height:48px;font-size:18px;background:#23242c;color:#cfd3db;border:1px solid #3a3f4c}
.done{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.done h2{color:#ffe27a;margin:0 0 8px}
.btn{margin-top:14px;background:#ffe27a;color:#15161a;border:none;border-radius:10px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
#out{margin-top:12px;width:min(92vw,520px);height:160px;font-family:ui-monospace,monospace;font-size:11px;display:none;background:#0b0c10;color:#cfd3db;border:1px solid #3a3f4c;border-radius:8px;padding:8px}
.hint{font-size:11px;color:#6b7280;margin-top:6px}
.toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%);background:#2bd47a;color:#08210f;padding:8px 16px;border-radius:999px;font-weight:700;opacity:0;transition:.3s;pointer-events:none}.toast.show{opacity:1}
</style></head><body>
<header><div><b>ボス選別</b> <span style="font-size:12px;color:#9aa0ad">← 無し / 有り → ・ドラッグもOK</span></div>
  <div class="count"><span id="done_n">0</span>/<span id="total_n">0</span> ・有り<span id="yes_n">0</span></div></header>
<div class="stage" id="stage">
  <div class="done" id="doneScreen">
    <h2>選別おわり！</h2>
    <div id="summary" style="color:#cfd3db"></div>
    <button class="btn" id="copyBtn">結果をコピー</button>
    <div class="hint">コピーしたテキストをチャットに貼ってください（採用の系統を学習して次の50枚へ）。</div>
    <textarea id="out" readonly></textarea>
    <button class="btn" id="restartBtn" style="background:#3a3f4c;color:#e7e7ea">最初からやり直す</button>
  </div>
</div>
<div class="bar">
  <button class="fab no" id="bNo">✗</button>
  <button class="fab undo" id="bUndo">↶</button>
  <button class="fab yes" id="bYes">♥</button>
  <button class="btn" id="bCopy" style="position:fixed;right:12px;bottom:104px;padding:8px 12px;font-size:12px">途中保存コピー</button>
</div>
<div class="toast" id="toast">コピーしました！</div>
<script>
const BOSSES=[{"id": "breeze-sprout-rabbit-wind01", "name_ja": "ウィンド・ソヨカゼラビット", "tier": "序盤", "element": "ウィンド", "flavor_ja": "そよ風をまとって跳ねるウサギ。耳が葉っぱの形をしていて、走ると小さな風のリボンが体に巻きつく。", "img": "gacha_wind/breeze-sprout-rabbit-wind01.png"}, {"id": "sprout-vine-fox-wind02", "name_ja": "ウィンド・ツルバキツネ", "tier": "序盤", "element": "ウィンド", "flavor_ja": "蔓と若葉を体に巻きつけた小ギツネ。風と一緒に草むらをすばやくかけぬける。", "img": "gacha_wind/sprout-vine-fox-wind02.png"}, {"id": "leaf-wing-sparrow-wind03", "name_ja": "ウィンド・コノハスズメ", "tier": "序盤", "element": "ウィンド", "flavor_ja": "羽が木の葉でできた小さなスズメ。羽ばたくと体に巻いた風がぱたぱた音を立てる。", "img": "gacha_wind/leaf-wing-sparrow-wind03.png"}, {"id": "whistle-beetle-wind04", "name_ja": "ウィンド・フエフキカブト", "tier": "序盤", "element": "ウィンド", "flavor_ja": "角が笛の形をした小さなカブトムシ。角を風が通ると、ヒューと音が鳴る。", "img": "gacha_wind/whistle-beetle-wind04.png"}, {"id": "meadow-lamb-wind05", "name_ja": "ウィンド・クサハラヒツジ", "tier": "序盤", "element": "ウィンド", "flavor_ja": "毛が草はらみたいな緑色の子ヒツジ。やわらかな風が毛をなでるように体に流れる。", "img": "gacha_wind/meadow-lamb-wind05.png"}, {"id": "gust-pup-wind06", "name_ja": "ウィンド・カゼコイヌ", "tier": "序盤", "element": "ウィンド", "flavor_ja": "いつも風をまとって走り回る子イヌ。しっぽに小さな風がぐるぐる巻きついている。", "img": "gacha_wind/gust-pup-wind06.png"}, {"id": "reed-mantis-wind07", "name_ja": "ウィンド・アシハラカマキリ", "tier": "序盤", "element": "ウィンド", "flavor_ja": "アシ原に立つ細いカマキリ。かまの腕に薄い風の刃をまとっている。", "img": "gacha_wind/reed-mantis-wind07.png"}, {"id": "puff-owlet-wind08", "name_ja": "ウィンド・ワタボウシフクロウ", "tier": "序盤", "element": "ウィンド", "flavor_ja": "わた毛みたいにふわふわした小さなフクロウ。羽に巻いた風で、音もなく飛ぶ。", "img": "gacha_wind/puff-owlet-wind08.png"}, {"id": "clover-mole-wind09", "name_ja": "ウィンド・クローバーモグラ", "tier": "序盤", "element": "ウィンド", "flavor_ja": "背中にクローバーを生やした丸いモグラ。掘った土から小さな風が舞い上がる。", "img": "gacha_wind/clover-mole-wind09.png"}, {"id": "chime-cricket-wind10", "name_ja": "ウィンド・スズムシリン", "tier": "序盤", "element": "ウィンド", "flavor_ja": "羽が鈴のように鳴くコオロギ。鳴くたびに体に巻いた風がきらきら震える。", "img": "gacha_wind/chime-cricket-wind10.png"}, {"id": "sapling-deer-wind11", "name_ja": "ウィンド・ワカギジカ", "tier": "序盤", "element": "ウィンド", "flavor_ja": "角から若葉が芽吹く子ジカ。歩くたび、体に巻いた風が新緑の匂いを運ぶ。", "img": "gacha_wind/sapling-deer-wind11.png"}, {"id": "swirl-squirrel-wind12", "name_ja": "ウィンド・ウズリス", "tier": "序盤", "element": "ウィンド", "flavor_ja": "大きなしっぽに風のうずを巻いたリス。木から木へ風に乗ってジャンプする。", "img": "gacha_wind/swirl-squirrel-wind12.png"}, {"id": "green-finch-wind13", "name_ja": "ウィンド・アオバヒワ", "tier": "序盤", "element": "ウィンド", "flavor_ja": "葉っぱ色の羽がかわいい小鳥。羽に風をためて、すいすい方向を変える。", "img": "gacha_wind/green-finch-wind13.png"}, {"id": "moss-toad-wind14", "name_ja": "ウィンド・コケガエル", "tier": "序盤", "element": "ウィンド", "flavor_ja": "背中にコケを生やしたカエル。のどをふくらませると、まわりに小さな風がうずまく。", "img": "gacha_wind/moss-toad-wind14.png"}, {"id": "feather-foal-wind15", "name_ja": "ウィンド・ハネウマノコ", "tier": "序盤", "element": "ウィンド", "flavor_ja": "たてがみが羽のような子ウマ。走ると、たてがみと体に巻いた風が一緒になびく。", "img": "gacha_wind/feather-foal-wind15.png"}, {"id": "gale-feather-griffon-wind16", "name_ja": "ウィンド・シッププウグリフォン", "tier": "中盤", "element": "ウィンド", "flavor_ja": "風をまとって空をかける疾風のグリフォン。羽ばたくたびに緑の葉が舞う。", "img": "gacha_wind/gale-feather-griffon-wind16.png"}, {"id": "twister-serpent-wind17", "name_ja": "ウィンド・ウズマキジャ", "tier": "中盤", "element": "ウィンド", "flavor_ja": "とぐろを巻いた体に、竜巻をまとった大蛇。巻きついた風がうなりを上げる。", "img": "gacha_wind/twister-serpent-wind17.png"}, {"id": "thornvine-wolf-wind18", "name_ja": "ウィンド・イバラオオカミ", "tier": "中盤", "element": "ウィンド", "flavor_ja": "いばらの蔓を体に巻いた荒々しいオオカミ。風の刃を背中にまとって牙をむく。", "img": "gacha_wind/thornvine-wolf-wind18.png"}, {"id": "tuning-stag-wind19", "name_ja": "ウィンド・オンサジカ", "tier": "中盤", "element": "ウィンド", "flavor_ja": "角が音叉になっている大ジカ。角を鳴らすと、体をめぐる風が共鳴して震える。", "img": "gacha_wind/tuning-stag-wind19.png"}, {"id": "hawk-knight-wind20", "name_ja": "ウィンド・タカナイト", "tier": "中盤", "element": "ウィンド", "flavor_ja": "風の鎧をまとったタカの戦士。羽ばたくたび、よろいの風がきらりと光る。", "img": "gacha_wind/hawk-knight-wind20.png"}, {"id": "bamboo-panda-wind21", "name_ja": "ウィンド・タケパンダ", "tier": "中盤", "element": "ウィンド", "flavor_ja": "背中から竹を生やしたたくましいパンダ。腕をふると、風が竹の葉を巻き上げる。", "img": "gacha_wind/bamboo-panda-wind21.png"}, {"id": "sickle-mantis-lord-wind22", "name_ja": "ウィンド・カマイタチロード", "tier": "中盤", "element": "ウィンド", "flavor_ja": "かまに風の刃をまとった大きなカマキリ。腕をふるうと、三日月の風が走る。", "img": "gacha_wind/sickle-mantis-lord-wind22.png"}, {"id": "cyclone-roc-wind23", "name_ja": "ウィンド・センプウロック", "tier": "中盤", "element": "ウィンド", "flavor_ja": "巨大な翼に旋風を巻いたロック鳥。翼を畳んでいても、まわりの風がうずを巻く。", "img": "gacha_wind/cyclone-roc-wind23.png"}, {"id": "echo-bat-wind24", "name_ja": "ウィンド・ヤマビココウモリ", "tier": "中盤", "element": "ウィンド", "flavor_ja": "山びこを操る大コウモリ。鳴き声が風になって、体のまわりで反響する。", "img": "gacha_wind/echo-bat-wind24.png"}, {"id": "ivy-golem-wind25", "name_ja": "ウィンド・ツタゴーレム", "tier": "中盤", "element": "ウィンド", "flavor_ja": "蔓と木の皮でできた緑のゴーレム。体のすき間を風が通りぬけて、ごうごう鳴る。", "img": "gacha_wind/ivy-golem-wind25.png"}, {"id": "falcon-dancer-wind26", "name_ja": "ウィンド・ハヤブサマイ", "tier": "中盤", "element": "ウィンド", "flavor_ja": "舞うように戦うハヤブサの踊り手。手足に巻いた風が、しなやかな帯になってひるがえる。", "img": "gacha_wind/falcon-dancer-wind26.png"}, {"id": "horn-buffalo-wind27", "name_ja": "ウィンド・ツノカゼスイギュウ", "tier": "中盤", "element": "ウィンド", "flavor_ja": "曲がった角に風を切る大スイギュウ。突進すると、角からびゅうと風が鳴る。", "img": "gacha_wind/horn-buffalo-wind27.png"}, {"id": "flute-serpent-wind28", "name_ja": "ウィンド・フエヘビ", "tier": "中盤", "element": "ウィンド", "flavor_ja": "体に笛の穴があるヘビ。体を風が通ると、メロディーのような音が鳴りひびく。", "img": "gacha_wind/flute-serpent-wind28.png"}, {"id": "leaf-blade-tiger-wind29", "name_ja": "ウィンド・ハガネバトラ", "tier": "中盤", "element": "ウィンド", "flavor_ja": "毛が葉の刃でできたトラ。体に巻いた風の刃で、ひと振りで草をなぎ倒す。", "img": "gacha_wind/leaf-blade-tiger-wind29.png"}, {"id": "storm-crane-wind30", "name_ja": "ウィンド・アラシヅル", "tier": "中盤", "element": "ウィンド", "flavor_ja": "嵐をまとった気高いツル。翼を畳んでいても、まわりで風がうずを巻いている。", "img": "gacha_wind/storm-crane-wind30.png"}, {"id": "sky-emperor-dragon-wind31", "name_ja": "ウィンド・テンクウリュウ", "tier": "終盤", "element": "ウィンド", "flavor_ja": "大空を支配する緑の竜。とぐろを巻いた体に、嵐の風をまとっている。", "img": "gacha_wind/sky-emperor-dragon-wind31.png"}, {"id": "thunder-roc-king-wind32", "name_ja": "ウィンド・ライメイロック", "tier": "終盤", "element": "ウィンド", "flavor_ja": "雷鳴をとどろかせる王のロック鳥。羽ばたきの風が雷のような音を立てる。", "img": "gacha_wind/thunder-roc-king-wind32.png"}, {"id": "verdant-behemoth-wind33", "name_ja": "ウィンド・ジュカイベヒモス", "tier": "終盤", "element": "ウィンド", "flavor_ja": "背中に大樹を背負う森のベヒモス。一歩ごとに、体に絡む蔓と風がざわめく。", "img": "gacha_wind/verdant-behemoth-wind33.png"}, {"id": "tempest-knight-wind34", "name_ja": "ウィンド・アラシキシン", "tier": "終盤", "element": "ウィンド", "flavor_ja": "嵐の鎧をまとった騎神。腕に巻いた風の刃で、ひと薙ぎに敵をなぎ払う。", "img": "gacha_wind/tempest-knight-wind34.png"}, {"id": "resonance-lion-wind35", "name_ja": "ウィンド・キョウメイライオン", "tier": "終盤", "element": "ウィンド", "flavor_ja": "たてがみが音波でできた獅子。ほえると、共鳴する風が体を駆けめぐる。", "img": "gacha_wind/resonance-lion-wind35.png"}, {"id": "hurricane-wyrm-wind36", "name_ja": "ウィンド・タイフウワーム", "tier": "終盤", "element": "ウィンド", "flavor_ja": "とぐろ全体に台風をまとった竜。巻きついた風の渦が、近づくものを吹き飛ばす。", "img": "gacha_wind/hurricane-wyrm-wind36.png"}, {"id": "world-tree-guardian-wind37", "name_ja": "ウィンド・セカイジュのモリビト", "tier": "終盤", "element": "ウィンド", "flavor_ja": "世界樹を守る森の番人。体じゅうの蔓と葉の間を、神々しい風が流れる。", "img": "gacha_wind/world-tree-guardian-wind37.png"}, {"id": "sonic-raptor-wind38", "name_ja": "ウィンド・オンソクラプトル", "tier": "終盤", "element": "ウィンド", "flavor_ja": "音速で駆けるラプトル竜。体にまとった風が、衝撃波となって唸りを上げる。", "img": "gacha_wind/sonic-raptor-wind38.png"}, {"id": "gale-kirin-wind39", "name_ja": "ウィンド・シップウキリン", "tier": "終盤", "element": "ウィンド", "flavor_ja": "疾風をまとった気高い麒麟。歩むたび、足元から神聖な風が立ちのぼる。", "img": "gacha_wind/gale-kirin-wind39.png"}, {"id": "thorn-titan-wind40", "name_ja": "ウィンド・イバラタイタン", "tier": "終盤", "element": "ウィンド", "flavor_ja": "いばらと根でできた巨人タイタン。体のとげの間を、風がごうごうと吹き荒れる。", "img": "gacha_wind/thorn-titan-wind40.png"}, {"id": "phoenix-of-gales-wind41", "name_ja": "ウィンド・シップウホウオウ", "tier": "終盤", "element": "ウィンド", "flavor_ja": "疾風をまとう緑の鳳凰。羽ばたくと、体を包む風が黄金の葉となって舞う。", "img": "gacha_wind/phoenix-of-gales-wind41.png"}, {"id": "howl-fenrir-wind42", "name_ja": "ウィンド・トオボエフェンリル", "tier": "終盤", "element": "ウィンド", "flavor_ja": "遠ぼえが嵐になる巨狼フェンリル。ほえると、声が風となって体を駆け抜ける。", "img": "gacha_wind/howl-fenrir-wind42.png"}, {"id": "storm-sovereign-dragon-wind43", "name_ja": "ウィンド・テイオウストームドラゴン", "tier": "ラスボス級", "element": "ウィンド", "flavor_ja": "嵐を支配する竜の帝王。とぐろを巻いた巨体を、生きた嵐がマントのように包む。", "img": "gacha_wind/storm-sovereign-dragon-wind43.png"}, {"id": "world-roc-emperor-wind44", "name_ja": "ウィンド・テンクウロックテイ", "tier": "ラスボス級", "element": "ウィンド", "flavor_ja": "天空に君臨するロックの帝。一度の羽ばたきで、世界を包む嵐を呼ぶ。", "img": "gacha_wind/world-roc-emperor-wind44.png"}, {"id": "ancient-tree-god-wind45", "name_ja": "ウィンド・タイコジュシン", "tier": "ラスボス級", "element": "ウィンド", "flavor_ja": "太古から立つ樹木の神。体じゅうの蔓と葉を、神々しい風が永遠に巡らせる。", "img": "gacha_wind/ancient-tree-god-wind45.png"}, {"id": "tempest-archon-wind46", "name_ja": "ウィンド・アラシのオウシン", "tier": "ラスボス級", "element": "ウィンド", "flavor_ja": "嵐そのものが姿をとった王神。腕に巻く風の刃が、ひと振りで空をふたつに裂く。", "img": "gacha_wind/tempest-archon-wind46.png"}, {"id": "sonic-leviathan-wind47", "name_ja": "ウィンド・オンパリヴァイアサン", "tier": "ラスボス級", "element": "ウィンド", "flavor_ja": "轟音をまとう巨竜リヴァイアサン。とぐろ全体から放つ音波が、嵐となって渦巻く。", "img": "gacha_wind/sonic-leviathan-wind47.png"}, {"id": "gale-kirin-god-wind48", "name_ja": "ウィンド・シンセイシップウキリン", "tier": "ラスボス級", "element": "ウィンド", "flavor_ja": "神聖な疾風の麒麟。歩むたび、足元から世界を清める神の風が立ちのぼる。", "img": "gacha_wind/gale-kirin-god-wind48.png"}, {"id": "hurricane-titan-king-wind49", "name_ja": "ウィンド・タイフウキョシンオウ", "tier": "ラスボス級", "element": "ウィンド", "flavor_ja": "台風を体にまとう巨神の王。一歩ごとに、体を包む嵐が大地を吹き飛ばす。", "img": "gacha_wind/hurricane-titan-king-wind49.png"}, {"id": "primordial-wind-deity-wind50", "name_ja": "ウィンド・ゲンショウフウシン", "tier": "ラスボス級", "element": "ウィンド", "flavor_ja": "風のはじまりから在る原初の神。その身は無数の緑の風が集まってできている。", "img": "gacha_wind/primordial-wind-deity-wind50.png"}]; const KEY="rika2_boss_swipe_gacha_wind";
let st=JSON.parse(localStorage.getItem(KEY)||"null")||{idx:0,dec:{}};
function save(){localStorage.setItem(KEY,JSON.stringify(st));}
const stage=document.getElementById("stage");
document.getElementById("total_n").textContent=BOSSES.length;
let card=null,startX=0,curX=0,dragging=false;

function counts(){const y=Object.values(st.dec).filter(v=>v==="yes").length;
  document.getElementById("done_n").textContent=Object.keys(st.dec).length;
  document.getElementById("yes_n").textContent=y;}

function build(idx){
  const b=BOSSES[idx]; const el=document.createElement("div"); el.className="card";
  el.innerHTML=`<div class="stamp yes">有り</div><div class="stamp no">無し</div>
    <div class="imgbox"><img src="${b.img}" alt=""></div>
    <div class="info"><div class="nm">${b.name_ja}<span class="tier t${b.tier}">${b.tier}</span></div>
    <div class="el">${b.element}</div><div class="fl">${b.flavor_ja}</div></div>`;
  el.addEventListener("pointerdown",down); el.addEventListener("pointermove",move);
  el.addEventListener("pointerup",up); el.addEventListener("pointercancel",up);
  return el;
}
function show(){
  if(card){card.remove();card=null;}
  if(st.idx>=BOSSES.length){document.getElementById("doneScreen").style.display="flex";finish();return;}
  document.getElementById("doneScreen").style.display="none";
  card=build(st.idx); stage.appendChild(card); counts();
}
function down(e){dragging=true;startX=e.clientX;curX=0;card.setPointerCapture(e.pointerId);card.style.transition="none";}
function move(e){if(!dragging)return;curX=e.clientX-startX;card.style.transform=`translateX(${curX}px) rotate(${curX/18}deg)`;
  card.querySelector(".yes").style.opacity=Math.max(0,Math.min(1,curX/90));
  card.querySelector(".no").style.opacity=Math.max(0,Math.min(1,-curX/90));}
function up(){if(!dragging)return;dragging=false;
  if(curX>90)decide("yes");else if(curX<-90)decide("no");
  else{card.style.transition=".2s";card.style.transform="";card.querySelector(".yes").style.opacity=0;card.querySelector(".no").style.opacity=0;}}
function decide(v){
  st.dec[BOSSES[st.idx].id]=v; save();
  const dir=v==="yes"?1:-1;
  card.style.transition=".3s ease-out";
  card.style.transform=`translateX(${dir*140}vw) rotate(${dir*25}deg)`;
  card.style.opacity="0";
  setTimeout(()=>{st.idx++;save();show();},260);
}
function undo(){if(st.idx<=0)return;st.idx--;delete st.dec[BOSSES[st.idx].id];save();show();}
function summaryText(){
  const yes=BOSSES.filter(b=>st.dec[b.id]==="yes"),no=BOSSES.filter(b=>st.dec[b.id]==="no");
  let s=`=== ボス選別 結果 (有り${yes.length} / 無し${no.length} / 計${BOSSES.length}) ===\n【有り】\n`;
  yes.forEach(b=>s+=`- ${b.name_ja} (${b.tier}/${b.element}) [${b.id}]\n`);
  s+="【無し】\n"; no.forEach(b=>s+=`- ${b.name_ja} (${b.tier}/${b.element}) [${b.id}]\n`);
  return s;
}
function finish(){
  const yes=BOSSES.filter(b=>st.dec[b.id]==="yes").length;
  document.getElementById("summary").textContent=`有り ${yes} 体 / 無し ${BOSSES.length-yes} 体`;
}
function copyOut(){const s=summaryText();const o=document.getElementById("out");o.style.display="block";o.value=s;
  if(navigator.clipboard)navigator.clipboard.writeText(s).then(()=>{const t=document.getElementById("toast");t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1500);},()=>{});o.select();}
document.getElementById("bNo").onclick=()=>{if(st.idx<BOSSES.length)decide("no");};
document.getElementById("bYes").onclick=()=>{if(st.idx<BOSSES.length)decide("yes");};
document.getElementById("bUndo").onclick=undo;
document.getElementById("bCopy").onclick=copyOut;
document.getElementById("copyBtn").onclick=copyOut;
document.getElementById("restartBtn").onclick=()=>{st={idx:0,dec:{}};save();show();};
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"&&st.idx<BOSSES.length)decide("no");
  else if(e.key==="ArrowRight"&&st.idx<BOSSES.length)decide("yes");else if(e.key==="Backspace")undo();});
show();
</script></body></html>
