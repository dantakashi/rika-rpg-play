<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>ボス選別 — 理科RPG2</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0f1014;color:#e7e7ea;font-family:system-ui,"Hiragino Kaku Gothic ProN",sans-serif;overflow:hidden;height:100dvh}
header{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;background:#1a1c22;border-bottom:1px solid #2c2f3a}
header b{color:#ffe27a}.count{font-size:13px;color:#9aa0ad}
.stage{position:relative;height:calc(100dvh - 150px);display:flex;align-items:center;justify-content:center;padding:10px}
.card{position:absolute;width:min(92vw,440px);max-height:100%;background:#1d1f26;border:1px solid #2c2f3a;border-radius:18px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5);touch-action:none}
.imgbox{aspect-ratio:1/1;
  background-image:linear-gradient(45deg,#cfcfcf 25%,transparent 25%),linear-gradient(-45deg,#cfcfcf 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#cfcfcf 75%),linear-gradient(-45deg,transparent 75%,#cfcfcf 75%);
  background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0;background-color:#e9e9e9}
.imgbox img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.info{padding:12px 16px}
.nm{font-size:22px;font-weight:800}
.nm .tier{font-size:14px;font-weight:700;padding:2px 10px;border-radius:999px;margin-left:8px;vertical-align:3px}
.t序盤{background:#2bd47a;color:#06210f}.t中盤{background:#4aa3ff;color:#04203f}.t終盤{background:#ff9a3c;color:#311600}.tラスボス級{background:#ff5a7a;color:#33000d}
.el{font-size:12px;color:#9aa0ad;margin-top:2px}
.fl{font-size:14px;color:#cfd3db;margin-top:8px;line-height:1.55}
.stamp{position:absolute;top:18px;font-size:34px;font-weight:900;padding:4px 14px;border:4px solid;border-radius:12px;opacity:0;transform:rotate(-15deg)}
.yes{left:18px;color:#2bd47a;border-color:#2bd47a}.no{right:18px;color:#ff5a7a;border-color:#ff5a7a}
.bar{position:fixed;bottom:0;left:0;right:0;height:90px;display:flex;align-items:center;justify-content:center;gap:22px;background:#13141a;border-top:1px solid #2c2f3a}
.fab{width:62px;height:62px;border-radius:50%;border:none;font-size:26px;cursor:pointer;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.fab.no{background:#2a1d23;color:#ff5a7a;border:2px solid #ff5a7a}.fab.yes{background:#16271c;color:#2bd47a;border:2px solid #2bd47a}
.fab.undo{width:48px;height:48px;font-size:18px;background:#23242c;color:#cfd3db;border:1px solid #3a3f4c}
.done{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.done h2{color:#ffe27a;margin:0 0 8px}
.btn{margin-top:14px;background:#ffe27a;color:#15161a;border:none;border-radius:10px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
#out{margin-top:12px;width:min(92vw,520px);height:160px;font-family:ui-monospace,monospace;font-size:11px;display:none;background:#0b0c10;color:#cfd3db;border:1px solid #3a3f4c;border-radius:8px;padding:8px}
.hint{font-size:11px;color:#6b7280;margin-top:6px}
.toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%);background:#2bd47a;color:#08210f;padding:8px 16px;border-radius:999px;font-weight:700;opacity:0;transition:.3s;pointer-events:none}.toast.show{opacity:1}
</style></head><body>
<header><div><b>ボス選別</b> <span style="font-size:12px;color:#9aa0ad">← 無し / 有り → ・ドラッグもOK</span></div>
  <div class="count"><span id="done_n">0</span>/<span id="total_n">0</span> ・有り<span id="yes_n">0</span></div></header>
<div class="stage" id="stage">
  <div class="done" id="doneScreen">
    <h2>選別おわり！</h2>
    <div id="summary" style="color:#cfd3db"></div>
    <button class="btn" id="copyBtn">結果をコピー</button>
    <div class="hint">コピーしたテキストをチャットに貼ってください（採用の系統を学習して次の50枚へ）。</div>
    <textarea id="out" readonly></textarea>
    <button class="btn" id="restartBtn" style="background:#3a3f4c;color:#e7e7ea">最初からやり直す</button>
  </div>
</div>
<div class="bar">
  <button class="fab no" id="bNo">✗</button>
  <button class="fab undo" id="bUndo">↶</button>
  <button class="fab yes" id="bYes">♥</button>
  <button class="btn" id="bCopy" style="position:fixed;right:12px;bottom:104px;padding:8px 12px;font-size:12px">途中保存コピー</button>
</div>
<div class="toast" id="toast">コピーしました！</div>
<script>
const BOSSES=[{"id": "pika-puff-cub-c1", "name_ja": "ビリころん", "tier": "序盤", "element": "電気", "flavor_ja": "なでると静電気でパチッ。おこるとほっぺの電気がふくらむ、まんまるな電気の子。", "img": "gacha_c1/pika-puff-cub-c1.png"}, {"id": "bubble-otter-pup-c1", "name_ja": "あわっこ", "tier": "序盤", "element": "泡", "flavor_ja": "せっけんみたいなあわをまとった、つるんとまるい水のマスコット。さわるとプチプチはじける。", "img": "gacha_c1/bubble-otter-pup-c1.png"}, {"id": "glow-fawn-sprite-c1", "name_ja": "ぴかフォン", "tier": "序盤", "element": "光", "flavor_ja": "体からほんわか光がにじむ、まんまるな光の小鹿。くらい部屋でぼうっと照らしてくれる。", "img": "gacha_c1/glow-fawn-sprite-c1.png"}, {"id": "crystal-hamster-gem-c1", "name_ja": "こりんハム", "tier": "序盤", "element": "結晶", "flavor_ja": "ほっぺに鉱石をためこむ、まんまるハムスター精霊。ためすぎるとキラキラあふれる。", "img": "gacha_c1/crystal-hamster-gem-c1.png"}, {"id": "thunder-mochi-bear-c1", "name_ja": "ゴロベア", "tier": "中盤", "element": "電気", "flavor_ja": "もちもちボディに雷をまとった、ちょっとカッコいい電気のクマ。パンチで小さなカミナリが落ちる。", "img": "gacha_c1/thunder-mochi-bear-c1.png"}, {"id": "prism-foxling-flare-c1", "name_ja": "にじキツネ", "tier": "中盤", "element": "光", "flavor_ja": "光をにじ色にわける、ちょっとイタズラ好きなキツネ精霊。しっぽをふるとプリズムがきらめく。", "img": "gacha_c1/prism-foxling-flare-c1.png"}, {"id": "frothy-seal-knight-c1", "name_ja": "あわまるアザラシ", "tier": "中盤", "element": "泡", "flavor_ja": "あわのよろいをまとった、勇ましいけど丸っこい泡のアザラシ。体当たりであわがしぶく。", "img": "gacha_c1/frothy-seal-knight-c1.png"}, {"id": "geode-tiger-cub-c1", "name_ja": "ジオタイガ", "tier": "終盤", "element": "結晶", "flavor_ja": "背中に巨大なジオードを背負った、まんまるでも歴戦の結晶トラ。一歩あるくとキラリと宝石が鳴る。", "img": "gacha_c1/geode-tiger-cub-c1.png"}, {"id": "stormlight-griffon-pup-c1", "name_ja": "ピカグリフ", "tier": "終盤", "element": "電気", "flavor_ja": "雷をまとった、丸っこくも気高い電気のグリフォン。羽ばたくと小さな稲妻がはじける。", "img": "gacha_c1/stormlight-griffon-pup-c1.png"}, {"id": "aurora-sovereign-beast-c1", "name_ja": "オーロラ・レガリ", "tier": "ラスボス級", "element": "光", "flavor_ja": "光と結晶をまとった、まんまるなのに王の風格をもつオーロラの守護獣。全身にオーロラの衣をまとう。", "img": "gacha_c1/aurora-sovereign-beast-c1.png"}, {"id": "hatchling-spark-dragon-c1", "name_ja": "ピカドラ", "tier": "序盤", "element": "電気", "flavor_ja": "たまごからかえったばかりの、ちびっこドラゴン。よろこぶとほっぺとしっぽからパチパチと小さな電気がはじける。なでるとちょっとビリッとくる。", "img": "gacha_c1/hatchling-spark-dragon-c1.png"}, {"id": "cloud-cub-griffon-c1", "name_ja": "モフリフォン", "tier": "序盤", "element": "光", "flavor_ja": "空のすきまでぬくぬく育った、もふもふの子グリフォン。からだに小さな雲をまとっていて、ねむくなるとふわふわ光る。まだ高くは飛べない。", "img": "gacha_c1/cloud-cub-griffon-c1.png"}, {"id": "pebble-baby-golem-c1", "name_ja": "コロイシくん", "tier": "序盤", "element": "結晶", "flavor_ja": "山のふもとでまるくなって眠っていた、生まれたてのゴーレム。背中からちいさな結晶がぽつぽつ生えてきて、本人はちょっと得意げ。", "img": "gacha_c1/pebble-baby-golem-c1.png"}, {"id": "ember-chick-phoenix-c1", "name_ja": "ヒヨホウ", "tier": "序盤", "element": "炎", "flavor_ja": "ちいさな焚き火から生まれた、不死鳥のヒヨコ。羽の先がぽわっとあたたかく光り、まだやけどしないやさしい火。よちよち歩くと火の粉がこぼれる。", "img": "gacha_c1/ember-chick-phoenix-c1.png"}, {"id": "bubble-pup-kelpie-c1", "name_ja": "アワウマ", "tier": "中盤", "element": "水", "flavor_ja": "きれいな泉で生まれた、ちびっこの水の馬。たてがみもしっぽも水でできていて、走るとあわをぶくぶく身にまとう。あそぶのが大すき。", "img": "gacha_c1/bubble-pup-kelpie-c1.png"}, {"id": "crystal-fawn-kirin-c1", "name_ja": "キララギ", "tier": "中盤", "element": "結晶", "flavor_ja": "聖なる山で生まれた、ちびっこの麒麟。ひたいの結晶のツノはまだ芽が出たばかり。せなかでキラキラ光る宝石がすこしずつ育っていく。", "img": "gacha_c1/crystal-fawn-kirin-c1.png"}, {"id": "frost-kit-fenrir-c1", "name_ja": "コオリヌ", "tier": "中盤", "element": "氷", "flavor_ja": "雪のどうくつで生まれた、もふもふの氷オオカミの子。毛のさきっぽに小さな氷のけっしょうがついていて、はしゃぐとちょっぴり冷たい。あまえんぼう。", "img": "gacha_c1/frost-kit-fenrir-c1.png"}, {"id": "glow-tot-unicorn-c1", "name_ja": "ホシポニー", "tier": "終盤", "element": "光", "flavor_ja": "星の光をあびて生まれた、ちびっこのユニコーン。ツノの先がやさしく光り、近づくとからだ全体がほんのりあたたかく輝く。なでると幸せな気もちになる。", "img": "gacha_c1/glow-tot-unicorn-c1.png"}, {"id": "magma-tot-salamander-drake-c1", "name_ja": "プニマグマ", "tier": "終盤", "element": "炎", "flavor_ja": "火山のおくで生まれた、ぷにぷにの溶岩ドレイク。ひび割れた肌のすきまからぽわっと光る。いたずらっこで、おこるとせなかからぽつぽつ火の玉をこぼす。", "img": "gacha_c1/magma-tot-salamander-drake-c1.png"}, {"id": "prism-baby-leviathan-c1", "name_ja": "ニジリヴァ", "tier": "ラスボス級", "element": "光", "flavor_ja": "海のいちばん深いところで眠っていた、伝説の海竜の赤ちゃん。まだ赤ちゃんなのにとてつもなく大きい。うろこが虹色にきらめき、世界を照らすほど光る日が来るという。", "img": "gacha_c1/prism-baby-leviathan-c1.png"}, {"id": "jelly-droplet-pudding-c1", "name_ja": "プルリン", "tier": "序盤", "element": "水", "flavor_ja": "ひとしずくのきれいな水から生まれた、ぷるんぷるんの子。さわるとぷよぷよゆれてつめたい。", "img": "gacha_c1/jelly-droplet-pudding-c1.png"}, {"id": "mochi-puff-cloud-c1", "name_ja": "モチフワ", "tier": "序盤", "element": "光", "flavor_ja": "ふわふわでもちもちの、あったかいおもちみたいな子。ぎゅっとすると中からやさしい光がにじむ。", "img": "gacha_c1/mochi-puff-cloud-c1.png"}, {"id": "bubble-tadpole-soap-c1", "name_ja": "アワオタマ", "tier": "序盤", "element": "泡", "flavor_ja": "せっけんの泡からうまれた、まんまるオタマジャクシ。およぐとあとからプチプチ泡がはじける。", "img": "gacha_c1/bubble-tadpole-soap-c1.png"}, {"id": "dewdrop-bunny-jelly-c1", "name_ja": "ツユピョン", "tier": "序盤", "element": "水", "flavor_ja": "あさつゆからうまれた、ぷるぷるのゼリーうさぎ。ぴょんとはねるたびにしずくがキラリと光る。", "img": "gacha_c1/dewdrop-bunny-jelly-c1.png"}, {"id": "candy-gummy-bear-light-c1", "name_ja": "グミラ", "tier": "中盤", "element": "光", "flavor_ja": "にじいろの光をとじこめた、ぷにぷにのグミのクマ。光にすかすとカラフルにきらめく。", "img": "gacha_c1/candy-gummy-bear-light-c1.png"}, {"id": "foam-octopus-bubble-c1", "name_ja": "アワダコ", "tier": "中盤", "element": "泡", "flavor_ja": "海のあわからうまれた、まんまるタコの子。あたまの泡がふくらんだりしぼんだりしてかわいい。", "img": "gacha_c1/foam-octopus-bubble-c1.png"}, {"id": "prism-slime-rainbow-c1", "name_ja": "ニジドロ", "tier": "中盤", "element": "光", "flavor_ja": "光をうけるとにじいろにかがやく、すきとおったぷるぷるスライム。ゆれるたびに色がかわる。", "img": "gacha_c1/prism-slime-rainbow-c1.png"}, {"id": "geyser-whale-mochi-c1", "name_ja": "モチクジラ", "tier": "終盤", "element": "水", "flavor_ja": "おもちみたいにやわらかい、まんまるクジラ。せなかからふきだす水しぶきもぷにぷに。", "img": "gacha_c1/geyser-whale-mochi-c1.png"}, {"id": "aurora-jellyfish-glow-c1", "name_ja": "オーロラクラ", "tier": "終盤", "element": "光", "flavor_ja": "ぷるぷるのかさにオーロラの光をとじこめた、ふわぷにクラゲ。ゆれるとやさしい光がうずまく。", "img": "gacha_c1/aurora-jellyfish-glow-c1.png"}, {"id": "great-mochi-king-tidal-c1", "name_ja": "プニ王オーシャ", "tier": "ラスボス級", "element": "水", "flavor_ja": "すべてのぷにぷにをおさめる、おおきくてまんまるなスライムの王さま。おなかの中に海をやどしている。", "img": "gacha_c1/great-mochi-king-tidal-c1.png"}, {"id": "candy-flame-wispling-c1", "name_ja": "ポポロウィスプ", "tier": "序盤", "element": "炎・燃焼", "flavor_ja": "ほっぺがぽかぽか、炎の妖精。小さな手のさきにちろちろ火がともる、燃焼を学ぶ最初の友だち。", "img": "gacha_c1/candy-flame-wispling-c1.png"}, {"id": "bubble-tide-faeling-c1", "name_ja": "アワプクル", "tier": "序盤", "element": "水・泡", "flavor_ja": "ぷくぷく泡をまとった水の妖精。さわると弾けてキラリ。表面張力の小さな先生。", "img": "gacha_c1/bubble-tide-faeling-c1.png"}, {"id": "zephyr-puff-pixie-c1", "name_ja": "フワリーノ", "tier": "序盤", "element": "風・気流", "flavor_ja": "ふわふわ転がる風の妖精。まわりにくるくる気流をまとう。空気の流れを運ぶいたずらっ子。", "img": "gacha_c1/zephyr-puff-pixie-c1.png"}, {"id": "sparklet-volt-fairy-c1", "name_ja": "ピリピリン", "tier": "序盤", "element": "電気・静電気", "flavor_ja": "ぱちぱち弾ける電気の妖精。さわると静電気でピリッ。回路と電流のかわいい案内役。", "img": "gacha_c1/sparklet-volt-fairy-c1.png"}, {"id": "glimmer-halo-lumie-c1", "name_ja": "ピカルム", "tier": "中盤", "element": "光・発光", "flavor_ja": "ほわっと光る光の精霊。まわりをやさしく照らす。光と影、明るさの不思議をつれてくる。", "img": "gacha_c1/glimmer-halo-lumie-c1.png"}, {"id": "dewbead-spring-sprite-c1", "name_ja": "シズクル", "tier": "中盤", "element": "水・状態変化", "flavor_ja": "ぷるんと揺れる水の精霊。露をまとってきらめく。水のすがた変わりを見せる優しい子。", "img": "gacha_c1/dewbead-spring-sprite-c1.png"}, {"id": "ember-cinder-mochiwisp-c1", "name_ja": "ホムラモチ", "tier": "中盤", "element": "炎・熱", "flavor_ja": "もちもち焼きあがる炎の精霊。やわらかな炎を毛布みたいにまとう。熱の伝わりをおしえてくれる。", "img": "gacha_c1/ember-cinder-mochiwisp-c1.png"}, {"id": "frostpetal-snow-fae-c1", "name_ja": "ユキハナン", "tier": "中盤", "element": "氷・結晶", "flavor_ja": "ひらひら舞いおりる氷の妖精。体に雪の結晶をまとう。凍る・とけるの不思議をはこぶ。", "img": "gacha_c1/frostpetal-snow-fae-c1.png"}, {"id": "breezy-cloudkin-pixie-c1", "name_ja": "クモリン", "tier": "終盤", "element": "風・天気", "flavor_ja": "もくもく膨らむ天気の精霊。風と雨つぶをまとってふわり。空もようの移ろいを司る。", "img": "gacha_c1/breezy-cloudkin-pixie-c1.png"}, {"id": "prism-droplet-lumifae-c1", "name_ja": "プリズミィ", "tier": "ラスボス級", "element": "光・スペクトル", "flavor_ja": "あらゆる光をあやつる虹の大精霊。体に七色のスペクトルをまとう、かわいくも荘厳な光の女王。", "img": "gacha_c1/prism-droplet-lumifae-c1.png"}, {"id": "bubble-axolotl-c1", "name_ja": "アワプクシー", "tier": "序盤", "element": "泡・水", "flavor_ja": "わき水のあわから生まれた、ぷくぷくのウーパールーパーの精。ほっぺのえらが泡でふくらんで、うれしいときに小さくはじける。", "img": "gacha_c1/bubble-axolotl-c1.png"}, {"id": "puddle-frog-c1", "name_ja": "ミズタマがえる", "tier": "序盤", "element": "水・しずく", "flavor_ja": "雨あがりの水たまりに住む、まんまるなカエルの精。頭にのせた水のたまをこぼさないよう、いつもそうっと歩いている。", "img": "gacha_c1/puddle-frog-c1.png"}, {"id": "candy-seal-c1", "name_ja": "コオリアザラ", "tier": "序盤", "element": "氷・水", "flavor_ja": "流氷のかけらから生まれた、まんまるな赤ちゃんアザラシの精。せなかに霜のかざりをまとい、すりすりすると少しひんやり。", "img": "gacha_c1/candy-seal-c1.png"}, {"id": "otter-spark-c1", "name_ja": "ビリカワウソ", "tier": "序盤", "element": "電気", "flavor_ja": "川のせせらぎで遊ぶうちに電気をためてしまった、いたずら好きのカワウソの精。なでるとパチッとくるので、みんなおっかなびっくり。", "img": "gacha_c1/otter-spark-c1.png"}, {"id": "jelly-lantern-c1", "name_ja": "ポワンクラゲ", "tier": "中盤", "element": "光・水", "flavor_ja": "深い海でぽうっと光る、やさしいクラゲの精。体の中のあかりがゆっくり明るくなったり暗くなったりして、暗い海をてらす道しるべ。", "img": "gacha_c1/jelly-lantern-c1.png"}, {"id": "crystal-seahorse-c1", "name_ja": "キララタツノコ", "tier": "中盤", "element": "結晶・水", "flavor_ja": "あたたかい海の底で、せなかに小さな結晶を育てるタツノオトシゴの精。光をあてるとせなかのトゲがきらきらと七色に輝く。", "img": "gacha_c1/crystal-seahorse-c1.png"}, {"id": "mochi-tadpole-c1", "name_ja": "オタマもち", "tier": "中盤", "element": "水・泡", "flavor_ja": "池のぬしになるほど大きくなった、もちもちのおたまじゃくしの精。やっと小さな足が生えはじめ、もうすぐカエルになる日を心待ちにしている。", "img": "gacha_c1/mochi-tadpole-c1.png"}, {"id": "prism-newt-c1", "name_ja": "ニジイモリン", "tier": "終盤", "element": "光（屈折）", "flavor_ja": "光を体の中で曲げて、せなかに虹をうかべるイモリの精。歩くたびにうろこがきらめいて、しっぽのあとに小さな虹をのこしてゆく。", "img": "gacha_c1/prism-newt-c1.png"}, {"id": "foam-pufferling-c1", "name_ja": "アワフグマル", "tier": "終盤", "element": "泡・水圧", "flavor_ja": "おどろくと水をすってまんまるに膨らみ、体じゅうの泡を立てて身を守るフグの精。ぷかっと膨らんだ姿が愛らしくて、つい何度も驚かせたくなる。", "img": "gacha_c1/foam-pufferling-c1.png"}, {"id": "tidal-leviakitten-c1", "name_ja": "ウミナリ・タツノオウ", "tier": "ラスボス級", "element": "水・潮流", "flavor_ja": "すべての海の精をたばねる、まるくて大きな水の王。とぐろを巻いてどっしりと構え、体に巻きついた潮の流れで、おだやかな海も荒れる海もあやつる。こわそうに見えて、その目はやさしい。", "img": "gacha_c1/tidal-leviakitten-c1.png"}, {"id": "chibi-komainu-spark-c1", "name_ja": "ぱちぱち子狛犬", "tier": "序盤", "element": "電気", "flavor_ja": "神社の入口でいねむりする子どもの狛犬。なでると静電気でぱちっとくる。まんなかの理科は静電気と放電のもと。", "img": "gacha_c1/chibi-komainu-spark-c1.png"}, {"id": "inari-kit-flame-c1", "name_ja": "おいなり子ぎつね", "tier": "序盤", "element": "炎", "flavor_ja": "稲荷神社のおつかいの子ぎつね。しっぽに小さなきつね火をともす。炎は燃焼と熱のしるし。", "img": "gacha_c1/inari-kit-flame-c1.png"}, {"id": "mame-tanuki-bubble-c1", "name_ja": "ぷくぷく豆だぬき", "tier": "序盤", "element": "水", "flavor_ja": "葉っぱをのせて化ける豆だぬき。おなかからしゃぼん玉みたいな泡をふくらませる。泡は気体と表面のふしぎ。", "img": "gacha_c1/mame-tanuki-bubble-c1.png"}, {"id": "mame-tengu-wind-c1", "name_ja": "ちび豆天狗", "tier": "序盤", "element": "風", "flavor_ja": "山おくにすむちびっこ天狗。はうちわのかわりに小さな風をまとう。風は空気の流れと圧力のべんきょう。", "img": "gacha_c1/mame-tengu-wind-c1.png"}, {"id": "chibi-kappa-water-c1", "name_ja": "ちゃぽん子河童", "tier": "中盤", "element": "水", "flavor_ja": "川にすむ人なつっこい子河童。頭のお皿の水をだいじにする。水は状態変化と表面張力のヒント。", "img": "gacha_c1/chibi-kappa-water-c1.png"}, {"id": "tama-kitsune-light-c1", "name_ja": "たまころ光ぎつね", "tier": "中盤", "element": "光", "flavor_ja": "光の玉をだく九尾の子ぎつね。まわりをやさしく照らす。光は反射・くっせつ・色のべんきょう。", "img": "gacha_c1/tama-kitsune-light-c1.png"}, {"id": "yuki-usagi-crystal-c1", "name_ja": "こおりんゆきうさぎ", "tier": "中盤", "element": "結晶", "flavor_ja": "冬の野で生まれるゆきうさぎの精。背中に六角の結晶が育つ。結晶は規則正しい形と凝固のふしぎ。", "img": "gacha_c1/yuki-usagi-crystal-c1.png"}, {"id": "kaminari-tatsu-baby-c1", "name_ja": "ごろぴか子龍", "tier": "終盤", "element": "電気", "flavor_ja": "雷雲から生まれたまんまるな子龍。鳴くたびに小さなかみなりがぴかっと光る。雷は電気と放電の大もと。", "img": "gacha_c1/kaminari-tatsu-baby-c1.png"}, {"id": "tsukumo-chochin-fire-c1", "name_ja": "ぽっと提灯こぞう", "tier": "終盤", "element": "炎", "flavor_ja": "百年たって命をもった古い提灯。にっこり笑って中であかりがゆれる。炎と燃焼、明るさのべんきょう。", "img": "gacha_c1/tsukumo-chochin-fire-c1.png"}, {"id": "ouji-kirin-prism-c1", "name_ja": "きらめき麒麟王子", "tier": "ラスボス級", "element": "光", "flavor_ja": "世のしあわせを照らす伝説の麒麟、まだ小さな王子さま。体の光を虹色に分ける。光のスペクトルと色のひみつ。", "img": "gacha_c1/ouji-kirin-prism-c1.png"}]; const KEY="rika2_boss_swipe_gacha_c1";
let st=JSON.parse(localStorage.getItem(KEY)||"null")||{idx:0,dec:{}};
function save(){localStorage.setItem(KEY,JSON.stringify(st));}
const stage=document.getElementById("stage");
document.getElementById("total_n").textContent=BOSSES.length;
let card=null,startX=0,curX=0,dragging=false;

function counts(){const y=Object.values(st.dec).filter(v=>v==="yes").length;
  document.getElementById("done_n").textContent=Object.keys(st.dec).length;
  document.getElementById("yes_n").textContent=y;}

function build(idx){
  const b=BOSSES[idx]; const el=document.createElement("div"); el.className="card";
  el.innerHTML=`<div class="stamp yes">有り</div><div class="stamp no">無し</div>
    <div class="imgbox"><img src="${b.img}" alt=""></div>
    <div class="info"><div class="nm">${b.name_ja}<span class="tier t${b.tier}">${b.tier}</span></div>
    <div class="el">${b.element}</div><div class="fl">${b.flavor_ja}</div></div>`;
  el.addEventListener("pointerdown",down); el.addEventListener("pointermove",move);
  el.addEventListener("pointerup",up); el.addEventListener("pointercancel",up);
  return el;
}
function show(){
  if(card){card.remove();card=null;}
  if(st.idx>=BOSSES.length){document.getElementById("doneScreen").style.display="flex";finish();return;}
  document.getElementById("doneScreen").style.display="none";
  card=build(st.idx); stage.appendChild(card); counts();
}
function down(e){dragging=true;startX=e.clientX;curX=0;card.setPointerCapture(e.pointerId);card.style.transition="none";}
function move(e){if(!dragging)return;curX=e.clientX-startX;card.style.transform=`translateX(${curX}px) rotate(${curX/18}deg)`;
  card.querySelector(".yes").style.opacity=Math.max(0,Math.min(1,curX/90));
  card.querySelector(".no").style.opacity=Math.max(0,Math.min(1,-curX/90));}
function up(){if(!dragging)return;dragging=false;
  if(curX>90)decide("yes");else if(curX<-90)decide("no");
  else{card.style.transition=".2s";card.style.transform="";card.querySelector(".yes").style.opacity=0;card.querySelector(".no").style.opacity=0;}}
function decide(v){
  st.dec[BOSSES[st.idx].id]=v; save();
  const dir=v==="yes"?1:-1;
  card.style.transition=".3s ease-out";
  card.style.transform=`translateX(${dir*140}vw) rotate(${dir*25}deg)`;
  card.style.opacity="0";
  setTimeout(()=>{st.idx++;save();show();},260);
}
function undo(){if(st.idx<=0)return;st.idx--;delete st.dec[BOSSES[st.idx].id];save();show();}
function summaryText(){
  const yes=BOSSES.filter(b=>st.dec[b.id]==="yes"),no=BOSSES.filter(b=>st.dec[b.id]==="no");
  let s=`=== ボス選別 結果 (有り${yes.length} / 無し${no.length} / 計${BOSSES.length}) ===\n【有り】\n`;
  yes.forEach(b=>s+=`- ${b.name_ja} (${b.tier}/${b.element}) [${b.id}]\n`);
  s+="【無し】\n"; no.forEach(b=>s+=`- ${b.name_ja} (${b.tier}/${b.element}) [${b.id}]\n`);
  return s;
}
function finish(){
  const yes=BOSSES.filter(b=>st.dec[b.id]==="yes").length;
  document.getElementById("summary").textContent=`有り ${yes} 体 / 無し ${BOSSES.length-yes} 体`;
}
function copyOut(){const s=summaryText();const o=document.getElementById("out");o.style.display="block";o.value=s;
  if(navigator.clipboard)navigator.clipboard.writeText(s).then(()=>{const t=document.getElementById("toast");t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1500);},()=>{});o.select();}
document.getElementById("bNo").onclick=()=>{if(st.idx<BOSSES.length)decide("no");};
document.getElementById("bYes").onclick=()=>{if(st.idx<BOSSES.length)decide("yes");};
document.getElementById("bUndo").onclick=undo;
document.getElementById("bCopy").onclick=copyOut;
document.getElementById("copyBtn").onclick=copyOut;
document.getElementById("restartBtn").onclick=()=>{st={idx:0,dec:{}};save();show();};
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"&&st.idx<BOSSES.length)decide("no");
  else if(e.key==="ArrowRight"&&st.idx<BOSSES.length)decide("yes");else if(e.key==="Backspace")undo();});
show();
</script></body></html>
