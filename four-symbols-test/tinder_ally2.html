<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>ボス選別 — 理科RPG2</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0f1014;color:#e7e7ea;font-family:system-ui,"Hiragino Kaku Gothic ProN",sans-serif;overflow:hidden;height:100dvh}
header{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;background:#1a1c22;border-bottom:1px solid #2c2f3a}
header b{color:#ffe27a}.count{font-size:13px;color:#9aa0ad}
.stage{position:relative;height:calc(100dvh - 150px);display:flex;align-items:center;justify-content:center;padding:10px}
.card{position:absolute;width:min(92vw,440px);max-height:100%;background:#1d1f26;border:1px solid #2c2f3a;border-radius:18px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5);touch-action:none}
.imgbox{aspect-ratio:1/1;
  background-image:linear-gradient(45deg,#cfcfcf 25%,transparent 25%),linear-gradient(-45deg,#cfcfcf 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#cfcfcf 75%),linear-gradient(-45deg,transparent 75%,#cfcfcf 75%);
  background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0;background-color:#e9e9e9}
.imgbox img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.info{padding:12px 16px}
.nm{font-size:22px;font-weight:800}
.nm .tier{font-size:14px;font-weight:700;padding:2px 10px;border-radius:999px;margin-left:8px;vertical-align:3px}
.t序盤{background:#2bd47a;color:#06210f}.t中盤{background:#4aa3ff;color:#04203f}.t終盤{background:#ff9a3c;color:#311600}.tラスボス級{background:#ff5a7a;color:#33000d}
.el{font-size:12px;color:#9aa0ad;margin-top:2px}
.fl{font-size:14px;color:#cfd3db;margin-top:8px;line-height:1.55}
.stamp{position:absolute;top:18px;font-size:34px;font-weight:900;padding:4px 14px;border:4px solid;border-radius:12px;opacity:0;transform:rotate(-15deg)}
.yes{left:18px;color:#2bd47a;border-color:#2bd47a}.no{right:18px;color:#ff5a7a;border-color:#ff5a7a}
.bar{position:fixed;bottom:0;left:0;right:0;height:90px;display:flex;align-items:center;justify-content:center;gap:22px;background:#13141a;border-top:1px solid #2c2f3a}
.fab{width:62px;height:62px;border-radius:50%;border:none;font-size:26px;cursor:pointer;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.fab.no{background:#2a1d23;color:#ff5a7a;border:2px solid #ff5a7a}.fab.yes{background:#16271c;color:#2bd47a;border:2px solid #2bd47a}
.fab.undo{width:48px;height:48px;font-size:18px;background:#23242c;color:#cfd3db;border:1px solid #3a3f4c}
.done{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.done h2{color:#ffe27a;margin:0 0 8px}
.btn{margin-top:14px;background:#ffe27a;color:#15161a;border:none;border-radius:10px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
#out{margin-top:12px;width:min(92vw,520px);height:160px;font-family:ui-monospace,monospace;font-size:11px;display:none;background:#0b0c10;color:#cfd3db;border:1px solid #3a3f4c;border-radius:8px;padding:8px}
.hint{font-size:11px;color:#6b7280;margin-top:6px}
.toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%);background:#2bd47a;color:#08210f;padding:8px 16px;border-radius:999px;font-weight:700;opacity:0;transition:.3s;pointer-events:none}.toast.show{opacity:1}
</style></head><body>
<header><div><b>ボス選別</b> <span style="font-size:12px;color:#9aa0ad">← 無し / 有り → ・ドラッグもOK</span></div>
  <div class="count"><span id="done_n">0</span>/<span id="total_n">0</span> ・有り<span id="yes_n">0</span></div></header>
<div class="stage" id="stage">
  <div class="done" id="doneScreen">
    <h2>選別おわり！</h2>
    <div id="summary" style="color:#cfd3db"></div>
    <button class="btn" id="copyBtn">結果をコピー</button>
    <div class="hint">コピーしたテキストをチャットに貼ってください（採用の系統を学習して次の50枚へ）。</div>
    <textarea id="out" readonly></textarea>
    <button class="btn" id="restartBtn" style="background:#3a3f4c;color:#e7e7ea">最初からやり直す</button>
  </div>
</div>
<div class="bar">
  <button class="fab no" id="bNo">✗</button>
  <button class="fab undo" id="bUndo">↶</button>
  <button class="fab yes" id="bYes">♥</button>
  <button class="btn" id="bCopy" style="position:fixed;right:12px;bottom:104px;padding:8px 12px;font-size:12px">途中保存コピー</button>
</div>
<div class="toast" id="toast">コピーしました！</div>
<script>
const BOSSES=[{"id": "mage-frost-girl-staff-al201", "name_ja": "帝国戦士・氷雪の少女魔導", "tier": "魔", "element": "帝国戦士", "flavor_ja": "帝国魔導院の若き氷使い。小柄だが、ひと振りで戦場を凍らせる才媛。", "img": "gacha_ally2/mage-frost-girl-staff-al201.png"}, {"id": "mage-old-fire-man-al202", "name_ja": "帝国戦士・炎の老賢者", "tier": "魔", "element": "帝国戦士", "flavor_ja": "炎を操って六十年。帝国最古参の老賢者は、頁をめくるだけで火柱を呼ぶ。", "img": "gacha_ally2/mage-old-fire-man-al202.png"}, {"id": "mage-blind-seer-woman-al203", "name_ja": "帝国戦士・盲目の予見者", "tier": "魔", "element": "帝国戦士", "flavor_ja": "目を布で覆った予見の巫女。視界を捨て、未来を読む帝国の知の柱。", "img": "gacha_ally2/mage-blind-seer-woman-al203.png"}, {"id": "mage-dwarf-rune-man-al204", "name_ja": "帝国戦士・ルーンのドワーフ術師", "tier": "魔", "element": "帝国戦士", "flavor_ja": "鍛冶と魔法を併せ持つドワーフ術師。彫り込んだルーンが地響きの呪文を放つ。", "img": "gacha_ally2/mage-dwarf-rune-man-al204.png"}, {"id": "mage-tall-storm-man-al205", "name_ja": "帝国戦士・嵐を呼ぶ長躯魔導", "tier": "魔", "element": "帝国戦士", "flavor_ja": "雷を統べる長身の魔導。杖を掲げれば、空が彼の味方になる。", "img": "gacha_ally2/mage-tall-storm-man-al205.png"}, {"id": "mage-elf-nature-woman-al206", "name_ja": "帝国戦士・森のエルフ魔女", "tier": "魔", "element": "帝国戦士", "flavor_ja": "草木の声を聞くエルフの魔女。彼女の杖は今も芽吹き、戦場に蔓を伸ばす。", "img": "gacha_ally2/mage-elf-nature-woman-al206.png"}, {"id": "mage-boy-apprentice-al207", "name_ja": "帝国戦士・見習い魔導の少年", "tier": "魔", "element": "帝国戦士", "flavor_ja": "ぶかぶかのローブを着た見習い少年。まだ呪文は半人前だが、その瞳は本物の魔導の星。", "img": "gacha_ally2/mage-boy-apprentice-al207.png"}, {"id": "mage-veiled-shadow-woman-al208", "name_ja": "帝国戦士・影呪のヴェール魔女", "tier": "魔", "element": "帝国戦士", "flavor_ja": "影を紡ぐヴェールの魔女。その杖からこぼれる闇が、敵の足元を呑み込む。", "img": "gacha_ally2/mage-veiled-shadow-woman-al208.png"}, {"id": "mage-scholar-glasses-man-al209", "name_ja": "帝国戦士・眼鏡の研究魔導", "tier": "魔", "element": "帝国戦士", "flavor_ja": "理論で魔法を語る帝国魔導院の研究者。数式が宙に並ぶとき、最強の呪文が完成する。", "img": "gacha_ally2/mage-scholar-glasses-man-al209.png"}, {"id": "mage-beastfolk-shaman-woman-al210", "name_ja": "帝国戦士・獣人の精霊術師", "tier": "魔", "element": "帝国戦士", "flavor_ja": "狐耳の精霊術師。祖霊の力を借り、骨と羽の杖で見えざる味方を呼び寄せる。", "img": "gacha_ally2/mage-beastfolk-shaman-woman-al210.png"}, {"id": "warrior-greatsword-girl-al211", "name_ja": "帝国戦士・大剣の少女剣士", "tier": "戦", "element": "帝国戦士", "flavor_ja": "自分の背丈ほどの大剣を軽々と担ぐ少女剣士。帝国軍の若き突撃の星。", "img": "gacha_ally2/warrior-greatsword-girl-al211.png"}, {"id": "warrior-giant-axe-man-al212", "name_ja": "帝国戦士・巨漢の斧戦士", "tier": "戦", "element": "帝国戦士", "flavor_ja": "両刃の大斧を片手で振り回す巨漢。彼が前に出れば、敵陣は真っ二つに割れる。", "img": "gacha_ally2/warrior-giant-axe-man-al212.png"}, {"id": "warrior-spear-veteran-man-al213", "name_ja": "帝国戦士・歴戦の槍兵", "tier": "戦", "element": "帝国戦士", "flavor_ja": "無数の戦を生き抜いた歴戦の槍兵。一本の槍で隊列を支える、帝国の背骨。", "img": "gacha_ally2/warrior-spear-veteran-man-al213.png"}, {"id": "warrior-dual-blade-woman-al214", "name_ja": "帝国戦士・双剣の女戦士", "tier": "戦", "element": "帝国戦士", "flavor_ja": "二刀を交差させて構える俊敏な女戦士。嵐のような連撃で敵を寄せ付けない。", "img": "gacha_ally2/warrior-dual-blade-woman-al214.png"}, {"id": "warrior-young-knight-man-al215", "name_ja": "帝国戦士・若き騎士", "tier": "戦", "element": "帝国戦士", "flavor_ja": "叙任されたばかりの若き騎士。磨き上げた鎧に映るのは、帝国を守る決意。", "img": "gacha_ally2/warrior-young-knight-man-al215.png"}, {"id": "warrior-onehanded-scarred-man-al216", "name_ja": "帝国戦士・隻腕の剣豪", "tier": "戦", "element": "帝国戦士", "flavor_ja": "片腕を失ってなお無双を誇る剣豪。残された一本の剣に、彼の全てが宿る。", "img": "gacha_ally2/warrior-onehanded-scarred-man-al216.png"}, {"id": "warrior-beastfolk-tiger-man-al217", "name_ja": "帝国戦士・虎獣人の戦士", "tier": "戦", "element": "帝国戦士", "flavor_ja": "帝国軍随一の猛者、虎獣人の戦士。獣の本能と剣技が一つになった生ける刃。", "img": "gacha_ally2/warrior-beastfolk-tiger-man-al217.png"}, {"id": "warrior-hammer-girl-al218", "name_ja": "帝国戦士・戦槌の小柄戦士", "tier": "戦", "element": "帝国戦士", "flavor_ja": "小柄ながら自分より大きい戦槌を振るう女戦士。一撃で兜ごと敵を打ち砕く。", "img": "gacha_ally2/warrior-hammer-girl-al218.png"}, {"id": "warrior-old-master-man-al219", "name_ja": "帝国戦士・老剣聖", "tier": "戦", "element": "帝国戦士", "flavor_ja": "老いてなお抜けば一閃の老剣聖。鞘に納めたまま、すでに勝負を読み切っている。", "img": "gacha_ally2/warrior-old-master-man-al219.png"}, {"id": "warrior-flag-bearer-man-al220", "name_ja": "帝国戦士・軍旗の旗手", "tier": "戦", "element": "帝国戦士", "flavor_ja": "帝国の旗を掲げて先頭を走る旗手。彼の旗が翻る限り、兵は退かない。", "img": "gacha_ally2/warrior-flag-bearer-man-al220.png"}, {"id": "warrior-lancer-woman-al221", "name_ja": "帝国戦士・突撃の女槍騎兵", "tier": "戦", "element": "帝国戦士", "flavor_ja": "槍を構えて突き進む女槍騎兵。彼女の一突きが、堅陣に風穴を開ける。", "img": "gacha_ally2/warrior-lancer-woman-al221.png"}, {"id": "warrior-katana-ronin-man-al222", "name_ja": "帝国戦士・流浪の刀使い", "tier": "戦", "element": "帝国戦士", "flavor_ja": "異国の片刃の剣を帯びた流浪の剣客。物静かな佇まいの裏に、抜き打ちの閃光を秘める。", "img": "gacha_ally2/warrior-katana-ronin-man-al222.png"}, {"id": "tank-shield-knight-woman-al223", "name_ja": "帝国戦士・大盾の女騎士", "tier": "盾", "element": "帝国戦士", "flavor_ja": "重装に身を固め大盾を構える女騎士。彼女の盾の後ろは、帝国で最も安全な場所だ。", "img": "gacha_ally2/tank-shield-knight-woman-al223.png"}, {"id": "tank-giant-guardian-man-al224", "name_ja": "帝国戦士・城門の巨人衛兵", "tier": "盾", "element": "帝国戦士", "flavor_ja": "城門を一人で塞ぐ巨人の衛兵。その鉄塊のごとき体は、決して一歩も退かない。", "img": "gacha_ally2/tank-giant-guardian-man-al224.png"}, {"id": "tank-veteran-bulwark-man-al225", "name_ja": "帝国戦士・歴戦の壁役", "tier": "盾", "element": "帝国戦士", "flavor_ja": "傷だらけの鎧を誇りに身につける老兵。何度倒れても立ち上がる、帝国の生きた防壁。", "img": "gacha_ally2/tank-veteran-bulwark-man-al225.png"}, {"id": "tank-dwarf-defender-man-al226", "name_ja": "帝国戦士・ドワーフの守り手", "tier": "盾", "element": "帝国戦士", "flavor_ja": "小柄でも誰より頑健なドワーフの守り手。低く構えた盾は、岩盤のごとく揺るがない。", "img": "gacha_ally2/tank-dwarf-defender-man-al226.png"}, {"id": "tank-young-shield-girl-al227", "name_ja": "帝国戦士・盾を構える少女衛士", "tier": "盾", "element": "帝国戦士", "flavor_ja": "少し大きい鎧を着た少女衛士。小さな体で仲間を守ろうとする勇気は、誰よりも大きい。", "img": "gacha_ally2/tank-young-shield-girl-al227.png"}, {"id": "tank-spiked-armor-man-al228", "name_ja": "帝国戦士・棘鎧の重騎士", "tier": "盾", "element": "帝国戦士", "flavor_ja": "棘だらけの黒鎧をまとう重騎士。盾に突っ込んだ敵すら、その身を貫く。", "img": "gacha_ally2/tank-spiked-armor-man-al228.png"}, {"id": "tank-paladin-woman-al229", "name_ja": "帝国戦士・聖盾の女聖騎士", "tier": "盾", "element": "帝国戦士", "flavor_ja": "聖なる紋章の盾を掲げる女聖騎士。その盾は刃を弾き、味方の心まで照らす。", "img": "gacha_ally2/tank-paladin-woman-al229.png"}, {"id": "tank-old-gatekeeper-man-al230", "name_ja": "帝国戦士・老門番", "tier": "盾", "element": "帝国戦士", "flavor_ja": "何十年も帝国の門を守り続ける老門番。動かぬ大盾は、彼の積み重ねた歳月そのもの。", "img": "gacha_ally2/tank-old-gatekeeper-man-al230.png"}, {"id": "tank-beastfolk-bear-man-al231", "name_ja": "帝国戦士・熊獣人の盾持ち", "tier": "盾", "element": "帝国戦士", "flavor_ja": "熊の血を引く巨躯の盾持ち。両腕で抱える大盾は、味方を丸ごと守る砦となる。", "img": "gacha_ally2/tank-beastfolk-bear-man-al231.png"}, {"id": "disrupt-assassin-hood-girl-al232", "name_ja": "帝国戦士・フードの暗殺者", "tier": "妨", "element": "帝国戦士", "flavor_ja": "フードに顔を隠したしのびの暗殺者。低く構えた逆手の短剣が、敵の隙を狙い澄ます。", "img": "gacha_ally2/disrupt-assassin-hood-girl-al232.png"}, {"id": "disrupt-archer-elf-woman-al233", "name_ja": "帝国戦士・森エルフの弓使い", "tier": "妨", "element": "帝国戦士", "flavor_ja": "片膝をついて弓を引き絞るエルフの狙撃手。彼女の一矢は、決して的を外さない。", "img": "gacha_ally2/disrupt-archer-elf-woman-al233.png"}, {"id": "disrupt-trapper-boy-al234", "name_ja": "帝国戦士・罠仕掛けの少年", "tier": "妨", "element": "帝国戦士", "flavor_ja": "足元に罠を仕掛ける身軽な少年。剣は持たずとも、敵を翻弄する仕掛けの天才。", "img": "gacha_ally2/disrupt-trapper-boy-al234.png"}, {"id": "disrupt-knife-thrower-woman-al235", "name_ja": "帝国戦士・投擲の女傭兵", "tier": "妨", "element": "帝国戦士", "flavor_ja": "投げナイフを腰に並べた女傭兵。身をひねる一瞬で、刃の雨を敵に降らせる。", "img": "gacha_ally2/disrupt-knife-thrower-woman-al235.png"}, {"id": "disrupt-cloak-spy-man-al236", "name_ja": "帝国戦士・隻眼の諜報傭兵", "tier": "妨", "element": "帝国戦士", "flavor_ja": "片目を眼帯で覆った諜報の傭兵。マントの影にまぎれ、敵陣の秘密を奪い去る。", "img": "gacha_ally2/disrupt-cloak-spy-man-al236.png"}, {"id": "disrupt-bombardier-dwarf-man-al237", "name_ja": "帝国戦士・爆弾のドワーフ技師", "tier": "妨", "element": "帝国戦士", "flavor_ja": "煤まみれのドワーフ爆弾技師。手のひらの爆弾ひとつで、敵の陣形をめちゃくちゃにする。", "img": "gacha_ally2/disrupt-bombardier-dwarf-man-al237.png"}, {"id": "disrupt-whip-tamer-woman-al238", "name_ja": "帝国戦士・鞭使いの女調教師", "tier": "妨", "element": "帝国戦士", "flavor_ja": "長い鞭をしならせる女調教師。間合いの外から敵を絡め取り、足を止めてしまう。", "img": "gacha_ally2/disrupt-whip-tamer-woman-al238.png"}, {"id": "disrupt-old-poisoner-man-al239", "name_ja": "帝国戦士・毒の老調合師", "tier": "妨", "element": "帝国戦士", "flavor_ja": "瓶を腰に並べた毒の老調合師。一滴の緑の薬が、屈強な敵をも蝕んでいく。", "img": "gacha_ally2/disrupt-old-poisoner-man-al239.png"}, {"id": "disrupt-net-snare-boy-al240", "name_ja": "帝国戦士・捕縛網の若兵", "tier": "妨", "element": "帝国戦士", "flavor_ja": "重り付きの網を振り回す若い兵士。敵を絡め捕り、身動きを封じてから仕留める。", "img": "gacha_ally2/disrupt-net-snare-boy-al240.png"}]; const KEY="rika2_boss_swipe_gacha_ally2";
let st=JSON.parse(localStorage.getItem(KEY)||"null")||{idx:0,dec:{}};
function save(){localStorage.setItem(KEY,JSON.stringify(st));}
const stage=document.getElementById("stage");
document.getElementById("total_n").textContent=BOSSES.length;
let card=null,startX=0,curX=0,dragging=false;

function counts(){const y=Object.values(st.dec).filter(v=>v==="yes").length;
  document.getElementById("done_n").textContent=Object.keys(st.dec).length;
  document.getElementById("yes_n").textContent=y;}

function build(idx){
  const b=BOSSES[idx]; const el=document.createElement("div"); el.className="card";
  el.innerHTML=`<div class="stamp yes">有り</div><div class="stamp no">無し</div>
    <div class="imgbox"><img src="${b.img}" alt=""></div>
    <div class="info"><div class="nm">${b.name_ja}<span class="tier t${b.tier}">${b.tier}</span></div>
    <div class="el">${b.element}</div><div class="fl">${b.flavor_ja}</div></div>`;
  el.addEventListener("pointerdown",down); el.addEventListener("pointermove",move);
  el.addEventListener("pointerup",up); el.addEventListener("pointercancel",up);
  return el;
}
function show(){
  if(card){card.remove();card=null;}
  if(st.idx>=BOSSES.length){document.getElementById("doneScreen").style.display="flex";finish();return;}
  document.getElementById("doneScreen").style.display="none";
  card=build(st.idx); stage.appendChild(card); counts();
}
function down(e){dragging=true;startX=e.clientX;curX=0;card.setPointerCapture(e.pointerId);card.style.transition="none";}
function move(e){if(!dragging)return;curX=e.clientX-startX;card.style.transform=`translateX(${curX}px) rotate(${curX/18}deg)`;
  card.querySelector(".yes").style.opacity=Math.max(0,Math.min(1,curX/90));
  card.querySelector(".no").style.opacity=Math.max(0,Math.min(1,-curX/90));}
function up(){if(!dragging)return;dragging=false;
  if(curX>90)decide("yes");else if(curX<-90)decide("no");
  else{card.style.transition=".2s";card.style.transform="";card.querySelector(".yes").style.opacity=0;card.querySelector(".no").style.opacity=0;}}
function decide(v){
  st.dec[BOSSES[st.idx].id]=v; save();
  const dir=v==="yes"?1:-1;
  card.style.transition=".3s ease-out";
  card.style.transform=`translateX(${dir*140}vw) rotate(${dir*25}deg)`;
  card.style.opacity="0";
  setTimeout(()=>{st.idx++;save();show();},260);
}
function undo(){if(st.idx<=0)return;st.idx--;delete st.dec[BOSSES[st.idx].id];save();show();}
function summaryText(){
  const yes=BOSSES.filter(b=>st.dec[b.id]==="yes"),no=BOSSES.filter(b=>st.dec[b.id]==="no");
  let s=`=== ボス選別 結果 (有り${yes.length} / 無し${no.length} / 計${BOSSES.length}) ===\n【有り】\n`;
  yes.forEach(b=>s+=`- ${b.name_ja} (${b.tier}/${b.element}) [${b.id}]\n`);
  s+="【無し】\n"; no.forEach(b=>s+=`- ${b.name_ja} (${b.tier}/${b.element}) [${b.id}]\n`);
  return s;
}
function finish(){
  const yes=BOSSES.filter(b=>st.dec[b.id]==="yes").length;
  document.getElementById("summary").textContent=`有り ${yes} 体 / 無し ${BOSSES.length-yes} 体`;
}
function copyOut(){const s=summaryText();const o=document.getElementById("out");o.style.display="block";o.value=s;
  if(navigator.clipboard)navigator.clipboard.writeText(s).then(()=>{const t=document.getElementById("toast");t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1500);},()=>{});o.select();}
document.getElementById("bNo").onclick=()=>{if(st.idx<BOSSES.length)decide("no");};
document.getElementById("bYes").onclick=()=>{if(st.idx<BOSSES.length)decide("yes");};
document.getElementById("bUndo").onclick=undo;
document.getElementById("bCopy").onclick=copyOut;
document.getElementById("copyBtn").onclick=copyOut;
document.getElementById("restartBtn").onclick=()=>{st={idx:0,dec:{}};save();show();};
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"&&st.idx<BOSSES.length)decide("no");
  else if(e.key==="ArrowRight"&&st.idx<BOSSES.length)decide("yes");else if(e.key==="Backspace")undo();});
show();
</script></body></html>
