<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>ボス選別 — 理科RPG2</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0f1014;color:#e7e7ea;font-family:system-ui,"Hiragino Kaku Gothic ProN",sans-serif;overflow:hidden;height:100dvh}
header{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;background:#1a1c22;border-bottom:1px solid #2c2f3a}
header b{color:#ffe27a}.count{font-size:13px;color:#9aa0ad}
.stage{position:relative;height:calc(100dvh - 150px);display:flex;align-items:center;justify-content:center;padding:10px}
.card{position:absolute;width:min(92vw,440px);max-height:100%;background:#1d1f26;border:1px solid #2c2f3a;border-radius:18px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5);touch-action:none}
.imgbox{aspect-ratio:1/1;
  background-image:linear-gradient(45deg,#cfcfcf 25%,transparent 25%),linear-gradient(-45deg,#cfcfcf 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#cfcfcf 75%),linear-gradient(-45deg,transparent 75%,#cfcfcf 75%);
  background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0;background-color:#e9e9e9}
.imgbox img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.info{padding:12px 16px}
.nm{font-size:22px;font-weight:800}
.nm .tier{font-size:14px;font-weight:700;padding:2px 10px;border-radius:999px;margin-left:8px;vertical-align:3px}
.t序盤{background:#2bd47a;color:#06210f}.t中盤{background:#4aa3ff;color:#04203f}.t終盤{background:#ff9a3c;color:#311600}.tラスボス級{background:#ff5a7a;color:#33000d}
.el{font-size:12px;color:#9aa0ad;margin-top:2px}
.fl{font-size:14px;color:#cfd3db;margin-top:8px;line-height:1.55}
.stamp{position:absolute;top:18px;font-size:34px;font-weight:900;padding:4px 14px;border:4px solid;border-radius:12px;opacity:0;transform:rotate(-15deg)}
.yes{left:18px;color:#2bd47a;border-color:#2bd47a}.no{right:18px;color:#ff5a7a;border-color:#ff5a7a}
.bar{position:fixed;bottom:0;left:0;right:0;height:90px;display:flex;align-items:center;justify-content:center;gap:22px;background:#13141a;border-top:1px solid #2c2f3a}
.fab{width:62px;height:62px;border-radius:50%;border:none;font-size:26px;cursor:pointer;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.fab.no{background:#2a1d23;color:#ff5a7a;border:2px solid #ff5a7a}.fab.yes{background:#16271c;color:#2bd47a;border:2px solid #2bd47a}
.fab.undo{width:48px;height:48px;font-size:18px;background:#23242c;color:#cfd3db;border:1px solid #3a3f4c}
.done{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.done h2{color:#ffe27a;margin:0 0 8px}
.btn{margin-top:14px;background:#ffe27a;color:#15161a;border:none;border-radius:10px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
#out{margin-top:12px;width:min(92vw,520px);height:160px;font-family:ui-monospace,monospace;font-size:11px;display:none;background:#0b0c10;color:#cfd3db;border:1px solid #3a3f4c;border-radius:8px;padding:8px}
.hint{font-size:11px;color:#6b7280;margin-top:6px}
.toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%);background:#2bd47a;color:#08210f;padding:8px 16px;border-radius:999px;font-weight:700;opacity:0;transition:.3s;pointer-events:none}.toast.show{opacity:1}
</style></head><body>
<header><div><b>ボス選別</b> <span style="font-size:12px;color:#9aa0ad">← 無し / 有り → ・ドラッグもOK</span></div>
  <div class="count"><span id="done_n">0</span>/<span id="total_n">0</span> ・有り<span id="yes_n">0</span></div></header>
<div class="stage" id="stage">
  <div class="done" id="doneScreen">
    <h2>選別おわり！</h2>
    <div id="summary" style="color:#cfd3db"></div>
    <button class="btn" id="copyBtn">結果をコピー</button>
    <div class="hint">コピーしたテキストをチャットに貼ってください（採用の系統を学習して次の50枚へ）。</div>
    <textarea id="out" readonly></textarea>
    <button class="btn" id="restartBtn" style="background:#3a3f4c;color:#e7e7ea">最初からやり直す</button>
  </div>
</div>
<div class="bar">
  <button class="fab no" id="bNo">✗</button>
  <button class="fab undo" id="bUndo">↶</button>
  <button class="fab yes" id="bYes">♥</button>
  <button class="btn" id="bCopy" style="position:fixed;right:12px;bottom:104px;padding:8px 12px;font-size:12px">途中保存コピー</button>
</div>
<div class="toast" id="toast">コピーしました！</div>
<script>
const BOSSES=[{"id": "pond-jelly-slime-b13", "name_ja": "みずたまスライム", "tier": "序盤", "element": "水", "flavor_ja": "池の水からうまれた、いちばん基本のスライム。体のなかに小さなあわと藻がただよう。", "img": "gacha_b13/pond-jelly-slime-b13.png"}, {"id": "acid-ooze-blob-b13", "name_ja": "さんせいウーズ", "tier": "序盤", "element": "酸", "flavor_ja": "金属をとかす酸のかたまり。さわるとジュッと泡をふく。リトマス紙を赤くする。", "img": "gacha_b13/acid-ooze-blob-b13.png"}, {"id": "puyo-bubble-sprite-b13", "name_ja": "あわぷにん", "tier": "序盤", "element": "無", "flavor_ja": "せっけんのあわがあつまった、ちいさなぷにぷに。光にあたると虹いろにきらめく。", "img": "gacha_b13/puyo-bubble-sprite-b13.png"}, {"id": "ferrofluid-spike-slime-b13", "name_ja": "じせいスライム", "tier": "中盤", "element": "磁性", "flavor_ja": "磁石に反応して全身がトゲのように逆立つ黒い流体。鉄粉をまとっている。", "img": "gacha_b13/ferrofluid-spike-slime-b13.png"}, {"id": "crystal-geode-slime-b13", "name_ja": "けっしょうスライム", "tier": "中盤", "element": "結晶", "flavor_ja": "体の中で結晶がそだつスライム。ゆっくり固まりながら紫の宝石へと変わっていく。", "img": "gacha_b13/crystal-geode-slime-b13.png"}, {"id": "lava-magma-blob-b13", "name_ja": "マグマウーズ", "tier": "中盤", "element": "溶岩", "flavor_ja": "地下からあふれた溶岩のかたまり。表面が冷えて黒くひび割れ、すきまから赤い熱がもれる。", "img": "gacha_b13/lava-magma-blob-b13.png"}, {"id": "mercury-metal-slime-b13", "name_ja": "すいぎんメタルスライム", "tier": "終盤", "element": "金属", "flavor_ja": "常温で液体の金属、水銀でできたスライム。鏡のように景色をうつし、ずっしりと重い。", "img": "gacha_b13/mercury-metal-slime-b13.png"}, {"id": "electro-plasma-ooze-b13", "name_ja": "でんきウーズ", "tier": "終盤", "element": "電気", "flavor_ja": "電気をたくわえた導電性のスライム。体じゅうに青白い電流が走り、近づくとバチッと放電する。", "img": "gacha_b13/electro-plasma-ooze-b13.png"}, {"id": "primordial-cell-leviathan-b13", "name_ja": "げんしのウーズ", "tier": "ラスボス級", "element": "生命", "flavor_ja": "生命のはじまりの原形質。巨大な細胞と核がうごめき、すべての生き物の源がそこにある。", "img": "gacha_b13/primordial-cell-leviathan-b13.png"}, {"id": "elemental-omega-amalgam-b13", "name_ja": "げんそスライム・オメガ", "tier": "ラスボス級", "element": "全", "flavor_ja": "あらゆる元素がまじりあった究極のスライム。溶岩・結晶・磁性・電気・酸が一つの体で渦巻く、王の中の王。", "img": "gacha_b13/elemental-omega-amalgam-b13.png"}, {"id": "spark-spear-goblin-b13", "name_ja": "ビリビリ槍ゴブリン", "tier": "序盤", "element": "雷", "flavor_ja": "コイルを巻いた槍で電気を流すいたずら小鬼。最初の森でよく出る雑魚。", "img": "gacha_b13/spark-spear-goblin-b13.png"}, {"id": "acid-jar-kobold-b13", "name_ja": "酸の壺コボルト", "tier": "序盤", "element": "毒", "flavor_ja": "背負った壺から酸をこぼしながら近づく卑屈な小型獣。装備を溶かしてくる。", "img": "gacha_b13/acid-jar-kobold-b13.png"}, {"id": "gearplate-imp-b13", "name_ja": "歯車よろい小鬼", "tier": "序盤", "element": "無", "flavor_ja": "拾った歯車を組み合わせて鎧にした小鬼。回る歯車で身を守る。", "img": "gacha_b13/gearplate-imp-b13.png"}, {"id": "magnet-fist-orc-b13", "name_ja": "磁鉄拳オーク", "tier": "中盤", "element": "雷", "flavor_ja": "磁力の鉄拳に鉄くずを吸い寄せて殴る大男。中盤の番兵。", "img": "gacha_b13/magnet-fist-orc-b13.png"}, {"id": "flask-bomber-goblin-b13", "name_ja": "フラスコ爆弾ゴブリン", "tier": "中盤", "element": "炎", "flavor_ja": "フラスコの薬品を投げ爆発させる科学好きの小鬼。火だるまになりがち。", "img": "gacha_b13/flask-bomber-goblin-b13.png"}, {"id": "voltcoil-kobold-pack-b13", "name_ja": "電圧コボルト隊長", "tier": "中盤", "element": "雷", "flavor_ja": "電池を背負い電極棒で痺れさせる小隊長。雑魚を率いて出る。", "img": "gacha_b13/voltcoil-kobold-pack-b13.png"}, {"id": "thermite-warboar-orc-b13", "name_ja": "テルミット猛火オーク", "tier": "終盤", "element": "炎", "flavor_ja": "鎧の継ぎ目から溶けた金属を滴らせる大将。終盤の砦の主。", "img": "gacha_b13/thermite-warboar-orc-b13.png"}, {"id": "cryo-canister-ogre-b13", "name_ja": "極低温ボンベ大鬼", "tier": "終盤", "element": "氷", "flavor_ja": "背中の極低温ボンベで凍てつく拳を作る大鬼。触れた者を凍らせる。", "img": "gacha_b13/cryo-canister-ogre-b13.png"}, {"id": "dynamo-warlord-king-b13", "name_ja": "発電機の鬼王", "tier": "ラスボス級", "element": "雷", "flavor_ja": "胸に巨大発電機を据えた鬼の王。全身に稲妻を纏い軍勢を統べる。", "img": "gacha_b13/dynamo-warlord-king-b13.png"}, {"id": "alchemy-overlord-rex-b13", "name_ja": "錬成の魔王ゴブレックス", "tier": "ラスボス級", "element": "毒", "flavor_ja": "体に錬成装置を取り込んだ巨大魔王。四本腕で猛毒を練り上げる小鬼軍の頂点。", "img": "gacha_b13/alchemy-overlord-rex-b13.png"}, {"id": "rust-iron-golem-b13", "name_ja": "サビテツゴーレム", "tier": "序盤", "element": "鉄", "flavor_ja": "湿った空気で錆びついた鉄の番人。鉄が酸素と結びついて赤茶色にボロボロになる「酸化」を体で語る、いちばん最初に出会う構造体。", "img": "gacha_b13/rust-iron-golem-b13.png"}, {"id": "quartz-shard-gargoyle-b13", "name_ja": "セキエイガーゴイル", "tier": "序盤", "element": "結晶", "flavor_ja": "鉱物が規則正しく並んでできる「結晶」のかたまりが目覚めた姿。六角柱のかけらをまとい、低くうずくまって獲物を待つ。", "img": "gacha_b13/quartz-shard-gargoyle-b13.png"}, {"id": "gear-clank-armor-b13", "name_ja": "ハグルマよろい", "tier": "序盤", "element": "合金", "flavor_ja": "歯車仕掛けで動く中身のない鎧。かみ合う歯車が力を伝える「てこ・歯車」の仕組みそのもの。カチャカチャと元気に動く序盤の相棒的ザコ。", "img": "gacha_b13/gear-clank-armor-b13.png"}, {"id": "magnetite-sentinel-b13", "name_ja": "ジテツのサーキュレーター", "tier": "中盤", "element": "磁鉄", "flavor_ja": "磁鉄鉱のかたまりが、鉄くぎや砂鉄を全身に吸い寄せて鎧にした構造体。N極S極の「磁界」を体表の鉄粉の模様で見せる中盤の壁。", "img": "gacha_b13/magnetite-sentinel-b13.png"}, {"id": "lava-core-colossus-b13", "name_ja": "ようがんゴーレム", "tier": "中盤", "element": "溶岩", "flavor_ja": "冷えて固まった黒い岩の中に、まだ溶けたマグマを抱えるゴーレム。「火成岩」と熱の対流を、ひび割れからもれる赤い光で表現する中盤ボス。", "img": "gacha_b13/lava-core-colossus-b13.png"}, {"id": "circuit-warden-armor-b13", "name_ja": "カイロのモノリス兵", "tier": "中盤", "element": "回路", "flavor_ja": "全身に電子回路を刻んだ装甲兵。電流が流れる「回路・電気」の道すじが、よろいの上を緑に光って走る。中盤の知的なボス。", "img": "gacha_b13/circuit-warden-armor-b13.png"}, {"id": "obsidian-alloy-titan-b13", "name_ja": "クロガネのジュウソウへい", "tier": "終盤", "element": "合金", "flavor_ja": "鋼と黒曜石を鍛えあわせた重装の構造体。複数の金属を混ぜて強くする「合金」の到達点。終盤の門番らしい黒鉄の威容。", "img": "gacha_b13/obsidian-alloy-titan-b13.png"}, {"id": "geode-crystal-behemoth-b13", "name_ja": "ショウニュウのコアベヒモス", "tier": "終盤", "element": "結晶", "flavor_ja": "岩の中に紫水晶のすきまをひそませた巨獣。鉱物が長い年月で育つ「晶洞(ジオード)」の神秘を背負う終盤ボス。胸の結晶が弱点に見える。", "img": "gacha_b13/geode-crystal-behemoth-b13.png"}, {"id": "primordial-forge-sovereign-b13", "name_ja": "ゲンソのゴウキンタイテイ", "tier": "ラスボス級", "element": "合金", "flavor_ja": "あらゆる金属元素が混ざり合って生まれた合金の帝。周期表のすべてを身にまとう、ゴーレム軍勢の頂点。動かざること山のごとし。", "img": "gacha_b13/primordial-forge-sovereign-b13.png"}, {"id": "world-core-monolith-b13", "name_ja": "チシンのダイモノリス", "tier": "ラスボス級", "element": "溶岩", "flavor_ja": "地殻・マントル・核という地球の層構造そのものが歩きだした究極のゴーレム。胸の奥で燃える核がすべての敵の源。世界の重みを体現するラスボス級。", "img": "gacha_b13/world-core-monolith-b13.png"}, {"id": "bone-rattle-imp-b13", "name_ja": "ホネガラ・コゾウ", "tier": "序盤", "element": "闇", "flavor_ja": "墓場をうろつく小さな骨小僧。眼窩でゆれる燐光が、夜の冷たさを連れてくる。", "img": "gacha_b13/bone-rattle-imp-b13.png"}, {"id": "frost-shroud-wisp-b13", "name_ja": "シモバシラ・ワタ", "tier": "序盤", "element": "氷", "flavor_ja": "霜柱のように冷気をまとう小さな亡霊。触れた水が、しんと凍りつく。", "img": "gacha_b13/frost-shroud-wisp-b13.png"}, {"id": "venom-grub-corpse-b13", "name_ja": "ドクウジ・ムクロ", "tier": "序盤", "element": "毒", "flavor_ja": "腐肉から湧いた毒の蛆。にじむ体液は、ふれると皮膚をただれさせる。", "img": "gacha_b13/venom-grub-corpse-b13.png"}, {"id": "obsidian-marrow-hound-b13", "name_ja": "クロガネ・ズイケン", "tier": "中盤", "element": "闇", "flavor_ja": "黒曜の骨でできた猟犬。砕けても、闇の髄が骨をつなぎ直す。", "img": "gacha_b13/obsidian-marrow-hound-b13.png"}, {"id": "gravewax-knight-b13", "name_ja": "ロウカン・ナキガラ", "tier": "中盤", "element": "毒", "flavor_ja": "蝋のように溶けかけた鎧の亡騎士。さびた刃から、毒のしずくがしたたる。", "img": "gacha_b13/gravewax-knight-b13.png"}, {"id": "permafrost-revenant-b13", "name_ja": "トコシエ・コオリビト", "tier": "中盤", "element": "氷", "flavor_ja": "永久凍土に閉じこめられた術師の亡骸。凍りついた呪文を、いまも唱えつづける。", "img": "gacha_b13/permafrost-revenant-b13.png"}, {"id": "necrotic-husk-colossus-b13", "name_ja": "クチハテ・キョシン", "tier": "終盤", "element": "毒", "flavor_ja": "無数の死骸が固まってできた巨躯。胸の奥で、毒の瘴気がぐつぐつと煮える。", "img": "gacha_b13/necrotic-husk-colossus-b13.png"}, {"id": "obsidian-bone-wyrm-b13", "name_ja": "コクヨウ・ホネリュウ", "tier": "終盤", "element": "氷", "flavor_ja": "黒曜の骨と氷でできた竜の亡骸。とぐろの奥から、凍てつく息がもれる。", "img": "gacha_b13/obsidian-bone-wyrm-b13.png"}, {"id": "void-sovereign-lich-b13", "name_ja": "ムナシキ・メイオウ", "tier": "ラスボス級", "element": "重力", "flavor_ja": "万物を虚無へ引きずりこむ不死の王。その手のひらに、空間さえもひざまずく。", "img": "gacha_b13/void-sovereign-lich-b13.png"}, {"id": "throne-of-the-dead-overlord-b13", "name_ja": "シシャノミクラ・タイテイ", "tier": "ラスボス級", "element": "闇", "flavor_ja": "幾千の死者を玉座とする不死の大帝。そのまなざしに、生者の影が震える。", "img": "gacha_b13/throne-of-the-dead-overlord-b13.png"}, {"id": "ember-pup-cockatrice-b13", "name_ja": "ヒバシリの仔コカトリス", "tier": "序盤", "element": "火", "flavor_ja": "燃焼には酸素が要る——その第一歩を教えるちいさな火の幻獣。", "img": "gacha_b13/ember-pup-cockatrice-b13.png"}, {"id": "leaf-gryphlet-b13", "name_ja": "わかばグリフレット", "tier": "序盤", "element": "草", "flavor_ja": "光合成で力をたくわえる若き獣王。葉が身体を覆う。", "img": "gacha_b13/leaf-gryphlet-b13.png"}, {"id": "pebble-minocub-b13", "name_ja": "つぶて小ミノタウロス", "tier": "序盤", "element": "土", "flavor_ja": "地層と岩石を背負う見習いの牛人。地面を踏みしめる。", "img": "gacha_b13/pebble-minocub-b13.png"}, {"id": "voltaic-cerberus-b13", "name_ja": "雷電ケルベロス", "tier": "中盤", "element": "雷", "flavor_ja": "電流は回路を巡る——三つの口から放電する番犬。", "img": "gacha_b13/voltaic-cerberus-b13.png"}, {"id": "tidal-mantibeast-b13", "name_ja": "うずしおマンティコア", "tier": "中盤", "element": "水", "flavor_ja": "水の流れと圧で襲う獅子。尾は渦を巻く。", "img": "gacha_b13/tidal-mantibeast-b13.png"}, {"id": "magnet-chimera-b13", "name_ja": "じりょくキメラ", "tier": "中盤", "element": "鋼", "flavor_ja": "N極とS極をその身に宿す合成獣。砂鉄が肌に張りつく。", "img": "gacha_b13/magnet-chimera-b13.png"}, {"id": "prism-wyvern-b13", "name_ja": "プリズム・ワイバーン", "tier": "終盤", "element": "光", "flavor_ja": "白い光を七色に分ける終盤の竜。身体がプリズムそのもの。", "img": "gacha_b13/prism-wyvern-b13.png"}, {"id": "abyssal-pressure-dragon-b13", "name_ja": "しんかいあつドラゴン", "tier": "終盤", "element": "水", "flavor_ja": "深海の水圧をまとう竜。光らぬ闇で発光する。", "img": "gacha_b13/abyssal-pressure-dragon-b13.png"}, {"id": "fusion-core-dragon-lord-b13", "name_ja": "核融合竜王イグニコア", "tier": "ラスボス級", "element": "火", "flavor_ja": "胸に小さな太陽を宿す竜の王——核融合の業火が世界を焼く。", "img": "gacha_b13/fusion-core-dragon-lord-b13.png"}, {"id": "entropy-chimera-king-b13", "name_ja": "終焉キメラ・オメガ", "tier": "ラスボス級", "element": "闇", "flavor_ja": "全てのエネルギーが行き着く終わり——熱と力が散り果てる多頭の王。", "img": "gacha_b13/entropy-chimera-king-b13.png"}]; const KEY="rika2_boss_swipe_gacha_b13";
let st=JSON.parse(localStorage.getItem(KEY)||"null")||{idx:0,dec:{}};
function save(){localStorage.setItem(KEY,JSON.stringify(st));}
const stage=document.getElementById("stage");
document.getElementById("total_n").textContent=BOSSES.length;
let card=null,startX=0,curX=0,dragging=false;

function counts(){const y=Object.values(st.dec).filter(v=>v==="yes").length;
  document.getElementById("done_n").textContent=Object.keys(st.dec).length;
  document.getElementById("yes_n").textContent=y;}

function build(idx){
  const b=BOSSES[idx]; const el=document.createElement("div"); el.className="card";
  el.innerHTML=`<div class="stamp yes">有り</div><div class="stamp no">無し</div>
    <div class="imgbox"><img src="${b.img}" alt=""></div>
    <div class="info"><div class="nm">${b.name_ja}<span class="tier t${b.tier}">${b.tier}</span></div>
    <div class="el">${b.element}</div><div class="fl">${b.flavor_ja}</div></div>`;
  el.addEventListener("pointerdown",down); el.addEventListener("pointermove",move);
  el.addEventListener("pointerup",up); el.addEventListener("pointercancel",up);
  return el;
}
function show(){
  if(card){card.remove();card=null;}
  if(st.idx>=BOSSES.length){document.getElementById("doneScreen").style.display="flex";finish();return;}
  document.getElementById("doneScreen").style.display="none";
  card=build(st.idx); stage.appendChild(card); counts();
}
function down(e){dragging=true;startX=e.clientX;curX=0;card.setPointerCapture(e.pointerId);card.style.transition="none";}
function move(e){if(!dragging)return;curX=e.clientX-startX;card.style.transform=`translateX(${curX}px) rotate(${curX/18}deg)`;
  card.querySelector(".yes").style.opacity=Math.max(0,Math.min(1,curX/90));
  card.querySelector(".no").style.opacity=Math.max(0,Math.min(1,-curX/90));}
function up(){if(!dragging)return;dragging=false;
  if(curX>90)decide("yes");else if(curX<-90)decide("no");
  else{card.style.transition=".2s";card.style.transform="";card.querySelector(".yes").style.opacity=0;card.querySelector(".no").style.opacity=0;}}
function decide(v){
  st.dec[BOSSES[st.idx].id]=v; save();
  const dir=v==="yes"?1:-1;
  card.style.transition=".3s ease-out";
  card.style.transform=`translateX(${dir*140}vw) rotate(${dir*25}deg)`;
  card.style.opacity="0";
  setTimeout(()=>{st.idx++;save();show();},260);
}
function undo(){if(st.idx<=0)return;st.idx--;delete st.dec[BOSSES[st.idx].id];save();show();}
function summaryText(){
  const yes=BOSSES.filter(b=>st.dec[b.id]==="yes"),no=BOSSES.filter(b=>st.dec[b.id]==="no");
  let s=`=== ボス選別 結果 (有り${yes.length} / 無し${no.length} / 計${BOSSES.length}) ===\n【有り】\n`;
  yes.forEach(b=>s+=`- ${b.name_ja} (${b.tier}/${b.element}) [${b.id}]\n`);
  s+="【無し】\n"; no.forEach(b=>s+=`- ${b.name_ja} (${b.tier}/${b.element}) [${b.id}]\n`);
  return s;
}
function finish(){
  const yes=BOSSES.filter(b=>st.dec[b.id]==="yes").length;
  document.getElementById("summary").textContent=`有り ${yes} 体 / 無し ${BOSSES.length-yes} 体`;
}
function copyOut(){const s=summaryText();const o=document.getElementById("out");o.style.display="block";o.value=s;
  if(navigator.clipboard)navigator.clipboard.writeText(s).then(()=>{const t=document.getElementById("toast");t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1500);},()=>{});o.select();}
document.getElementById("bNo").onclick=()=>{if(st.idx<BOSSES.length)decide("no");};
document.getElementById("bYes").onclick=()=>{if(st.idx<BOSSES.length)decide("yes");};
document.getElementById("bUndo").onclick=undo;
document.getElementById("bCopy").onclick=copyOut;
document.getElementById("copyBtn").onclick=copyOut;
document.getElementById("restartBtn").onclick=()=>{st={idx:0,dec:{}};save();show();};
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"&&st.idx<BOSSES.length)decide("no");
  else if(e.key==="ArrowRight"&&st.idx<BOSSES.length)decide("yes");else if(e.key==="Backspace")undo();});
show();
</script></body></html>
