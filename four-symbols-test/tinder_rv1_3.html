<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>ボス選別 — 理科RPG2</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0f1014;color:#e7e7ea;font-family:system-ui,"Hiragino Kaku Gothic ProN",sans-serif;overflow:hidden;height:100dvh}
header{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;background:#1a1c22;border-bottom:1px solid #2c2f3a}
header b{color:#ffe27a}.count{font-size:13px;color:#9aa0ad}
.stage{position:relative;height:calc(100dvh - 150px);display:flex;align-items:center;justify-content:center;padding:10px}
.card{position:absolute;width:min(92vw,440px);max-height:100%;background:#1d1f26;border:1px solid #2c2f3a;border-radius:18px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5);touch-action:none}
.imgbox{aspect-ratio:1/1;
  background-image:linear-gradient(45deg,#cfcfcf 25%,transparent 25%),linear-gradient(-45deg,#cfcfcf 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#cfcfcf 75%),linear-gradient(-45deg,transparent 75%,#cfcfcf 75%);
  background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0;background-color:#e9e9e9}
.imgbox img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.info{padding:12px 16px}
.nm{font-size:22px;font-weight:800}
.nm .tier{font-size:14px;font-weight:700;padding:2px 10px;border-radius:999px;margin-left:8px;vertical-align:3px}
.t序盤{background:#2bd47a;color:#06210f}.t中盤{background:#4aa3ff;color:#04203f}.t終盤{background:#ff9a3c;color:#311600}.tラスボス級{background:#ff5a7a;color:#33000d}
.el{font-size:12px;color:#9aa0ad;margin-top:2px}
.fl{font-size:14px;color:#cfd3db;margin-top:8px;line-height:1.55}
.stamp{position:absolute;top:18px;font-size:34px;font-weight:900;padding:4px 14px;border:4px solid;border-radius:12px;opacity:0;transform:rotate(-15deg)}
.yes{left:18px;color:#2bd47a;border-color:#2bd47a}.no{right:18px;color:#ff5a7a;border-color:#ff5a7a}
.bar{position:fixed;bottom:0;left:0;right:0;height:90px;display:flex;align-items:center;justify-content:center;gap:22px;background:#13141a;border-top:1px solid #2c2f3a}
.fab{width:62px;height:62px;border-radius:50%;border:none;font-size:26px;cursor:pointer;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.fab.no{background:#2a1d23;color:#ff5a7a;border:2px solid #ff5a7a}.fab.yes{background:#16271c;color:#2bd47a;border:2px solid #2bd47a}
.fab.undo{width:48px;height:48px;font-size:18px;background:#23242c;color:#cfd3db;border:1px solid #3a3f4c}
.done{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.done h2{color:#ffe27a;margin:0 0 8px}
.btn{margin-top:14px;background:#ffe27a;color:#15161a;border:none;border-radius:10px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
#out{margin-top:12px;width:min(92vw,520px);height:160px;font-family:ui-monospace,monospace;font-size:11px;display:none;background:#0b0c10;color:#cfd3db;border:1px solid #3a3f4c;border-radius:8px;padding:8px}
.hint{font-size:11px;color:#6b7280;margin-top:6px}
.toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%);background:#2bd47a;color:#08210f;padding:8px 16px;border-radius:999px;font-weight:700;opacity:0;transition:.3s;pointer-events:none}.toast.show{opacity:1}
</style></head><body>
<header><div><b>ボス選別</b> <span style="font-size:12px;color:#9aa0ad">← 無し / 有り → ・ドラッグもOK</span></div>
  <div class="count"><span id="done_n">0</span>/<span id="total_n">0</span> ・有り<span id="yes_n">0</span></div></header>
<div class="stage" id="stage">
  <div class="done" id="doneScreen">
    <h2>選別おわり！</h2>
    <div id="summary" style="color:#cfd3db"></div>
    <button class="btn" id="copyBtn">結果をコピー</button>
    <div class="hint">コピーしたテキストをチャットに貼ってください（採用の系統を学習して次の50枚へ）。</div>
    <textarea id="out" readonly></textarea>
    <button class="btn" id="restartBtn" style="background:#3a3f4c;color:#e7e7ea">最初からやり直す</button>
  </div>
</div>
<div class="bar">
  <button class="fab no" id="bNo">✗</button>
  <button class="fab undo" id="bUndo">↶</button>
  <button class="fab yes" id="bYes">♥</button>
  <button class="btn" id="bCopy" style="position:fixed;right:12px;bottom:104px;padding:8px 12px;font-size:12px">途中保存コピー</button>
</div>
<div class="toast" id="toast">コピーしました！</div>
<script>
const BOSSES=[{"id": "ember-phoenix-dragon-b4-rv1", "name_ja": "業火の鳳竜", "tier": "終盤", "element": "火", "flavor_ja": "火山の奥底で千年を生き、炎を翼に宿した荘厳な幻竜。一たび羽ばたけば天が紅蓮に染まる。", "img": "gacha_rv1_3/ember-phoenix-dragon-b4-rv1.png"}, {"id": "abyssal-storm-wyrm-b4-rv1", "name_ja": "嵐淵の三幻竜", "tier": "ラスボス級", "element": "風", "flavor_ja": "天空の彼方より降臨する三つ首の嵐の幻竜。三つの顎が放つ暴風と雷は、空をも引き裂く終局の災厄。", "img": "gacha_rv1_3/abyssal-storm-wyrm-b4-rv1.png"}, {"id": "infernal-iron-demon-construct-b4-rv1", "name_ja": "獄炎の鋼鉄魔神", "tier": "ラスボス級", "element": "金属", "flavor_ja": "地獄の炉で鍛えられた鋼鉄の魔神。継ぎ目から溶岩を噴き、四本の腕で全てを薙ぎ払う。これに挑む者は覚悟せよ。", "img": "gacha_rv1_3/infernal-iron-demon-construct-b4-rv1.png"}, {"id": "magnet-puff-cat-b4-rv1", "name_ja": "じしゃくにゃん", "tier": "序盤", "element": "雷", "flavor_ja": "しっぽが小さなじしゃくになっているまんまるネコ。クリップやピンを体にくっつけて、じまんげに歩いてくる。", "img": "gacha_rv1_3/magnet-puff-cat-b4-rv1.png"}, {"id": "thunder-raijin-tanuki-b4-rv1", "name_ja": "なるかみダヌキ", "tier": "中盤", "element": "雷", "flavor_ja": "背中に雷太鼓をしょった化け狸。バチを打ち鳴らすたびに空がゴロゴロ鳴り、いなずまが太鼓の輪をかけめぐる中盤の難敵。", "img": "gacha_rv1_3/thunder-raijin-tanuki-b4-rv1.png"}, {"id": "coolant-mech-mantis-b4-rv1", "name_ja": "クーラント・マンティス", "tier": "中盤", "element": "氷", "flavor_ja": "刃のうでから冷却剤の霧を吹き出す、つや消し白の機械カマキリ。間合いを凍らせてから一気に切りこむ精密な刺客。", "img": "gacha_rv1_3/coolant-mech-mantis-b4-rv1.png"}, {"id": "spore-flesh-bell-b4-rv1", "name_ja": "ほうしのつりがね", "tier": "中盤", "element": "毒", "flavor_ja": "天井からぶら下がる、つりがねの形をした菌のかたまり。ひだから緑の胞子をふきこぼし、揺れるたびに毒の霧が広がっていく。", "img": "gacha_rv1_3/spore-flesh-bell-b4-rv1.png"}, {"id": "pressure-deep-horror-b4-rv1", "name_ja": "しんかいのあぎと", "tier": "終盤", "element": "闇", "flavor_ja": "光の届かぬ水圧の底からせり上がる、巨大なあごの怪物。からだじゅうに散った青白い光で獲物を惑わせ、ガラスのような牙でのみこむ。", "img": "gacha_rv1_3/pressure-deep-horror-b4-rv1.png"}, {"id": "sun-radiance-lion-divine-b4-rv1", "name_ja": "こうりんの聖獅子", "tier": "ラスボス級", "element": "光", "flavor_ja": "夜明けとともに天から降り立つという光の聖獅子。たてがみは太陽そのもので、ひと吠えで闇をはらい、戦場を黄金の光で満たす最終決戦級の霊獣。", "img": "gacha_rv1_3/sun-radiance-lion-divine-b4-rv1.png"}, {"id": "paper-microbe-b4-rv1", "name_ja": "ゾウリむしのかみさま", "tier": "序盤", "element": "水", "flavor_ja": "池の水一てきの中にすむ、いちばん小さな生きもの。たくさんの毛をいっせいに動かしてスイスイ泳ぎ、こっそり王さまを名のっている。", "img": "gacha_rv1_3/paper-microbe-b4-rv1.png"}, {"id": "magnet-hound-b4-rv1", "name_ja": "じりょくのいぬ", "tier": "中盤", "element": "雷", "flavor_ja": "頭がU字じしゃくの形をした鉄の犬。近づく金属を体に貼りつけて鎧にする。まわりには見えない力の線がうずまいている。", "img": "gacha_rv1_3/magnet-hound-b4-rv1.png"}, {"id": "soundwave-bat-b4-rv1", "name_ja": "おとなみコウモリ", "tier": "中盤", "element": "風", "flavor_ja": "まっくらでも音のはね返りで物を見るコウモリのばけもの。鳴き声を波にして放ち、ぶつけてしびれさせる。", "img": "gacha_rv1_3/soundwave-bat-b4-rv1.png"}, {"id": "aurora-serpent-b4-rv1", "name_ja": "オーロラのへび", "tier": "終盤", "element": "雷", "flavor_ja": "夜空のオーロラがそのまま生きものになった大蛇。太陽からとどいた小さな粒が空気にぶつかって光り、体をかたちづくる。", "img": "gacha_rv1_3/aurora-serpent-b4-rv1.png"}, {"id": "mycelia-treant-b4-rv1", "name_ja": "きょうせいの森人", "tier": "終盤", "element": "木", "flavor_ja": "木とキノコと小さな生きものが、たがいに助け合って一つの巨人になった森のぬし。根の下では光る糸が森じゅうに栄養を配っている。", "img": "gacha_rv1_3/mycelia-treant-b4-rv1.png"}, {"id": "gravity-maw-b4-rv1", "name_ja": "じゅうりょくの口", "tier": "ラスボス級", "element": "闇", "flavor_ja": "あらゆる物も光ものみこむ、宇宙にあいた底なしの口。近づくものはぐにゃりと引きのばされ、回りながら吸いこまれていく。", "img": "gacha_rv1_3/gravity-maw-b4-rv1.png"}, {"id": "thunderbird-myth-b4-rv1", "name_ja": "らいめいの巨鳥", "tier": "ラスボス級", "element": "雷", "flavor_ja": "羽ばたきが雷鳴を、まばたきがいなずまを生むという伝説の大鳥。空気がはげしくこすれてプラズマとなり、体をつつむ。", "img": "gacha_rv1_3/thunderbird-myth-b4-rv1.png"}, {"id": "copper-coil-rhino-beetle-b5-rv1", "name_ja": "銅線コイル甲虫", "tier": "序盤", "element": "電", "flavor_ja": "コイルに電流を流すと磁石になる――その電磁石の原理を角に宿した甲虫。突進のたび角が磁化し、青い火花を散らす。", "img": "gacha_rv1_3/copper-coil-rhino-beetle-b5-rv1.png"}, {"id": "crystal-lattice-stag-b5-rv1", "name_ja": "結晶格子の角獣", "tier": "中盤", "element": "氷", "flavor_ja": "原子が規則正しく並んでできた結晶――その整然とした格子の美しさと硬さをまとう角獣。砕いても同じ形に割れる。", "img": "gacha_rv1_3/crystal-lattice-stag-b5-rv1.png"}, {"id": "alloy-titan-colossus-b5-rv1", "name_ja": "合金超巨神", "tier": "終盤", "element": "金属", "flavor_ja": "鉄に別の金属をまぜて造られた、純金属より硬く強い合金の巨神。継ぎ目から溶けた金属がにじみ、踏み出すたび大地が鳴る。", "img": "gacha_rv1_3/alloy-titan-colossus-b5-rv1.png"}, {"id": "gravity-core-leviathan-b5-rv1", "name_ja": "重力炉心の天体竜", "tier": "ラスボス級", "element": "闇", "flavor_ja": "胸の炉心がすべてを引き寄せる――重力をまとった天体竜。まわりの光すら曲げ、砕いた岩を環にして従える。最終決戦の象徴。", "img": "gacha_rv1_3/gravity-core-leviathan-b5-rv1.png"}, {"id": "combustion-furnace-overlord-b5-rv1", "name_ja": "完全燃焼の炉皇神獣", "tier": "ラスボス級", "element": "火", "flavor_ja": "酸素を十分に取り込み、青白く激しく燃え尽くす完全燃焼の化身。肋から噴き出す炎は最も高温で、近づく者をすべて灰にする。", "img": "gacha_rv1_3/combustion-furnace-overlord-b5-rv1.png"}, {"id": "gale-serpent-raptor-b5-rv1", "name_ja": "疾風蛇竜", "tier": "序盤", "element": "風", "flavor_ja": "細身でしなやかな風の蛇竜。体側の羽根状ヒレで突風をまとい、目にも止まらぬ速さで切りかかる。", "img": "gacha_rv1_3/gale-serpent-raptor-b5-rv1.png"}, {"id": "storm-tempest-hydra-b5-rv1", "name_ja": "雷嵐大蛇竜", "tier": "中盤", "element": "雷", "flavor_ja": "三つの首それぞれが稲妻をはらむ嵐の大蛇竜。首がうねるたびに雷鳴がとどろき、空が黒雲におおわれる。", "img": "gacha_rv1_3/storm-tempest-hydra-b5-rv1.png"}, {"id": "glacier-fang-chimera-b5-rv1", "name_ja": "氷牙キメラ", "tier": "終盤", "element": "氷", "flavor_ja": "獅子・蛇・角獣が氷で繋がれた異形のキメラ。三つの牙が獲物を凍てつかせ、近づくものを氷漬けにする。", "img": "gacha_rv1_3/glacier-fang-chimera-b5-rv1.png"}, {"id": "world-render-titan-dragon-b5-rv1", "name_ja": "天地砕きの覇王竜", "tier": "ラスボス級", "element": "無", "flavor_ja": "炎・雷・大地のすべての力をまとう覇王の竜。立ちはだかるその姿は要塞のごとく、四肢のひと振りで天地を砕く最強の敵。", "img": "gacha_rv1_3/world-render-titan-dragon-b5-rv1.png"}, {"id": "denji-iseebi-b5-rv1", "name_ja": "電磁イセエビ砲兵", "tier": "中盤", "element": "物理(電磁・回路)", "flavor_ja": "長いしょっ角を銅のコイルにかえた、イセエビのかいじゅう。せ中の回路もようがピカピカ光り、ためた電気をしょっ角からビリッと放つ。しっぽは電気の電池のかたまり。", "img": "gacha_rv1_3/denji-iseebi-b5-rv1.png"}, {"id": "san-suzumebachi-b5-rv1", "name_ja": "強酸スズメバチ毒将", "tier": "中盤", "element": "化学(酸)", "flavor_ja": "おなかに強い酸をためこんだ、巨大なスズメバチのかいじゅう。針からしたたる酸は、ふれた岩をジュウジュウととかす。よろいまで酸でうす緑に光っている。", "img": "gacha_rv1_3/san-suzumebachi-b5-rv1.png"}, {"id": "kokuyo-watarigani-b5-rv1", "name_ja": "黒曜ワタリガニ岩将", "tier": "中盤", "element": "地学(火山岩・鉱物)", "flavor_ja": "黒曜石の岩で全身をかためた、巨大なワタリガニのかいじゅう。よろいのすき間からマグマのようなオレンジの光がもれる。ガラスのようにするどい黒い岩のはさみは、ふれただけで切れる。", "img": "gacha_rv1_3/kokuyo-watarigani-b5-rv1.png"}, {"id": "kouriki-iseebi-b5-rv1", "name_ja": "光力イセエビ天将", "tier": "終盤", "element": "物理(光学・レンズ)", "flavor_ja": "体じゅうのよろいがプリズムになって、光を七色に分ける巨大イセエビ。レンズのような大きな目としょっ角の先で光を一点に集め、まばゆいビームを放つ。にじの輪をまとう天の将。", "img": "gacha_rv1_3/kouriki-iseebi-b5-rv1.png"}, {"id": "elegant-mist-deer-b5-rv1", "name_ja": "きりしか", "tier": "序盤", "element": "earth", "flavor_ja": "霧の谷をしずかに渡る。角に朝つゆの世界が映る。", "img": "gacha_rv1_3/elegant-mist-deer-b5-rv1.png"}, {"id": "cyber-helix-serpent-b5-rv1", "name_ja": "ジェノコイル", "tier": "中盤", "element": "biology", "flavor_ja": "生命の設計図を読みこんで自分を書きかえる。", "img": "gacha_rv1_3/cyber-helix-serpent-b5-rv1.png"}, {"id": "yokai-thunder-drum-b5-rv1", "name_ja": "なるかみだいこ", "tier": "中盤", "element": "physics", "flavor_ja": "太鼓を打つたび、雷がドンと落ちる。耳をふさげ。", "img": "gacha_rv1_3/yokai-thunder-drum-b5-rv1.png"}, {"id": "grotesque-eye-tumor-b5-rv1", "name_ja": "まなこのかたまり", "tier": "終盤", "element": "biology", "flavor_ja": "どこから見ても、こっちを見ている。まばたきが部屋に響く。", "img": "gacha_rv1_3/grotesque-eye-tumor-b5-rv1.png"}, {"id": "moss-snail-symbiont-b5-rv1", "name_ja": "苔むしカタツムリ獣", "tier": "序盤", "element": "biology", "flavor_ja": "背中の苔と持ちつ持たれつで生きる、のんびり屋の共生けもの。", "img": "gacha_rv1_3/moss-snail-symbiont-b5-rv1.png"}, {"id": "resonance-bell-serpent-b5-rv1", "name_ja": "共鳴の鐘ヘビ", "tier": "中盤", "element": "physics", "flavor_ja": "うなりを上げると空気がふるえる、音と振動をあやつる鐘の大蛇。", "img": "gacha_rv1_3/resonance-bell-serpent-b5-rv1.png"}, {"id": "tide-pulling-moon-toad-b5-rv1", "name_ja": "潮よびガマ", "tier": "終盤", "element": "earth", "flavor_ja": "背の月で潮を引き寄せる、重力をつかさどる太古のガマ。にらまれると体が重い。", "img": "gacha_rv1_3/tide-pulling-moon-toad-b5-rv1.png"}, {"id": "petri-bloom-leviathan-b5-rv1", "name_ja": "培養のリヴァイア", "tier": "終盤", "element": "biology", "flavor_ja": "一つの細胞が際限なく分かれて巨獣になった、培養皿生まれの怪物。", "img": "gacha_rv1_3/petri-bloom-leviathan-b5-rv1.png"}, {"id": "world-root-titan-b5-rv1", "name_ja": "世界樹の根の巨神", "tier": "ラスボス級", "element": "biology", "flavor_ja": "あらゆる根がひとつに絡まって立ち上がった、共生の頂点に立つ巨神。", "img": "gacha_rv1_3/world-root-titan-b5-rv1.png"}, {"id": "spark-fang-beetle-b6-rv1", "name_ja": "スパークファング", "tier": "序盤", "element": "電気", "flavor_ja": "二本の大あごの間で青白い火花を散らす甲虫型の機械獣。触れたものに静電気の刃を放つ、入門者の前に立ちはだかる最初の電撃獣。", "img": "gacha_rv1_3/spark-fang-beetle-b6-rv1.png"}, {"id": "magnet-lord-manta-b6-rv1", "name_ja": "マグネリオン", "tier": "中盤", "element": "磁力", "flavor_ja": "黒い磁鉄鉱の体に無数の鉄片を従えて宙を舞う磁力の覇獣。引き寄せた金属を鎧とし、弾を吸い、剣を奪う。中盤の難敵。", "img": "gacha_rv1_3/magnet-lord-manta-b6-rv1.png"}, {"id": "crystal-prism-dragon-b6-rv1", "name_ja": "プリズムドラゴン", "tier": "中盤", "element": "結晶・光学", "flavor_ja": "全身が多面体の宝石で結晶化した光の幻竜。鱗が光を分け、虹色の屈折ビームを放つ。美しくも鋭い中盤の魔竜。", "img": "gacha_rv1_3/crystal-prism-dragon-b6-rv1.png"}, {"id": "flame-forge-lion-b6-rv1", "name_ja": "イグニスフォージ", "tier": "中盤", "element": "燃焼", "flavor_ja": "鋳鉄の体内で炎を燃やし続ける溶鉱炉の獅子。たてがみは噴き上がる火炎、あぎとからは白熱した溶岩がしたたる。燃焼の猛獣。", "img": "gacha_rv1_3/flame-forge-lion-b6-rv1.png"}, {"id": "gravity-void-leviathan-b6-rv1", "name_ja": "グラヴィオス", "tier": "終盤", "element": "重力", "flavor_ja": "体に小さな重力の核をいくつも宿し、岩も金属も光さえねじ曲げて吸い込む超巨大幻獣。間合いそのものを支配する終盤の脅威。", "img": "gacha_rv1_3/gravity-void-leviathan-b6-rv1.png"}, {"id": "thunder-circuit-hydra-b6-rv1", "name_ja": "サーキュラ・ヒュドラ", "tier": "終盤", "element": "電磁・回路", "flavor_ja": "高圧ケーブルの首をうねらせ、回路の頭から頭へ稲妻を連鎖させる多頭の機械竜。一つ斬っても電流が回り込む、終盤の電磁の魔竜。", "img": "gacha_rv1_3/thunder-circuit-hydra-b6-rv1.png"}, {"id": "titan-alloy-colossus-b6-rv1", "name_ja": "アロイ・タイタン", "tier": "ラスボス級", "element": "合金・圧力", "flavor_ja": "幾層もの超合金を鍛え合わせて立つ巨神級の構造体。油圧の腕で万物を圧し潰し、胸の炉心が赤熱する。物理と化学の極み、ラスボス格。", "img": "gacha_rv1_3/titan-alloy-colossus-b6-rv1.png"}, {"id": "ember-fang-lizard-b6-rv1", "name_ja": "ほむらキバトカゲ", "tier": "序盤", "element": "炎", "flavor_ja": "体の割れ目からマグマがにじむ火トカゲ。背びれの炎口から熱気を噴き、キバはいつも赤く灼けている。燃焼の熱を宿した序盤の魔獣。", "img": "gacha_rv1_3/ember-fang-lizard-b6-rv1.png"}, {"id": "gale-horn-tusker-b6-rv1", "name_ja": "かぜホーン・ウォーボア", "tier": "序盤", "element": "風", "flavor_ja": "らせんの角で風を切り裂く突進獣。走ると渦が巻き起こり、ぶつかる前に風圧で吹き飛ばす。風の力を体当たりに変える序盤の暴れ者。", "img": "gacha_rv1_3/gale-horn-tusker-b6-rv1.png"}, {"id": "sprout-maw-chimera-b6-rv1", "name_ja": "わかばマウ・キメラ", "tier": "序盤", "element": "草", "flavor_ja": "獅子の体に生きたツルと葉を生やした植物キメラ。たてがみの葉で光を浴び、いばらのキバでかみつく。光合成する緑の合成獣。", "img": "gacha_rv1_3/sprout-maw-chimera-b6-rv1.png"}, {"id": "tide-coil-serpent-b6-rv1", "name_ja": "うずしお・サーペント", "tier": "中盤", "element": "水", "flavor_ja": "とぐろを巻くたびに渦潮を生む大海蛇。半透明の体で水流を操り、巻き込んで沈める。水の流れを支配する中盤のワーム。", "img": "gacha_rv1_3/tide-coil-serpent-b6-rv1.png"}, {"id": "crystal-hydra-prism-b6-rv1", "name_ja": "プリズム・クリスタヒドラ", "tier": "終盤", "element": "光", "flavor_ja": "七つの首がすべて水晶でできた多頭竜。うろこが光を虹に分け、口から屈折した光線を放つ。結晶と光学を宿した終盤の幻竜。", "img": "gacha_rv1_3/crystal-hydra-prism-b6-rv1.png"}]; const KEY="rika2_boss_swipe_gacha_rv1_3";
let st=JSON.parse(localStorage.getItem(KEY)||"null")||{idx:0,dec:{}};
function save(){localStorage.setItem(KEY,JSON.stringify(st));}
const stage=document.getElementById("stage");
document.getElementById("total_n").textContent=BOSSES.length;
let card=null,startX=0,curX=0,dragging=false;

function counts(){const y=Object.values(st.dec).filter(v=>v==="yes").length;
  document.getElementById("done_n").textContent=Object.keys(st.dec).length;
  document.getElementById("yes_n").textContent=y;}

function build(idx){
  const b=BOSSES[idx]; const el=document.createElement("div"); el.className="card";
  el.innerHTML=`<div class="stamp yes">有り</div><div class="stamp no">無し</div>
    <div class="imgbox"><img src="${b.img}" alt=""></div>
    <div class="info"><div class="nm">${b.name_ja}<span class="tier t${b.tier}">${b.tier}</span></div>
    <div class="el">${b.element}</div><div class="fl">${b.flavor_ja}</div></div>`;
  el.addEventListener("pointerdown",down); el.addEventListener("pointermove",move);
  el.addEventListener("pointerup",up); el.addEventListener("pointercancel",up);
  return el;
}
function show(){
  if(card){card.remove();card=null;}
  if(st.idx>=BOSSES.length){document.getElementById("doneScreen").style.display="flex";finish();return;}
  document.getElementById("doneScreen").style.display="none";
  card=build(st.idx); stage.appendChild(card); counts();
}
function down(e){dragging=true;startX=e.clientX;curX=0;card.setPointerCapture(e.pointerId);card.style.transition="none";}
function move(e){if(!dragging)return;curX=e.clientX-startX;card.style.transform=`translateX(${curX}px) rotate(${curX/18}deg)`;
  card.querySelector(".yes").style.opacity=Math.max(0,Math.min(1,curX/90));
  card.querySelector(".no").style.opacity=Math.max(0,Math.min(1,-curX/90));}
function up(){if(!dragging)return;dragging=false;
  if(curX>90)decide("yes");else if(curX<-90)decide("no");
  else{card.style.transition=".2s";card.style.transform="";card.querySelector(".yes").style.opacity=0;card.querySelector(".no").style.opacity=0;}}
function decide(v){
  st.dec[BOSSES[st.idx].id]=v; save();
  const dir=v==="yes"?1:-1;
  card.style.transition=".3s ease-out";
  card.style.transform=`translateX(${dir*140}vw) rotate(${dir*25}deg)`;
  card.style.opacity="0";
  setTimeout(()=>{st.idx++;save();show();},260);
}
function undo(){if(st.idx<=0)return;st.idx--;delete st.dec[BOSSES[st.idx].id];save();show();}
function summaryText(){
  const yes=BOSSES.filter(b=>st.dec[b.id]==="yes"),no=BOSSES.filter(b=>st.dec[b.id]==="no");
  let s=`=== ボス選別 結果 (有り${yes.length} / 無し${no.length} / 計${BOSSES.length}) ===\n【有り】\n`;
  yes.forEach(b=>s+=`- ${b.name_ja} (${b.tier}/${b.element}) [${b.id}]\n`);
  s+="【無し】\n"; no.forEach(b=>s+=`- ${b.name_ja} (${b.tier}/${b.element}) [${b.id}]\n`);
  return s;
}
function finish(){
  const yes=BOSSES.filter(b=>st.dec[b.id]==="yes").length;
  document.getElementById("summary").textContent=`有り ${yes} 体 / 無し ${BOSSES.length-yes} 体`;
}
function copyOut(){const s=summaryText();const o=document.getElementById("out");o.style.display="block";o.value=s;
  if(navigator.clipboard)navigator.clipboard.writeText(s).then(()=>{const t=document.getElementById("toast");t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1500);},()=>{});o.select();}
document.getElementById("bNo").onclick=()=>{if(st.idx<BOSSES.length)decide("no");};
document.getElementById("bYes").onclick=()=>{if(st.idx<BOSSES.length)decide("yes");};
document.getElementById("bUndo").onclick=undo;
document.getElementById("bCopy").onclick=copyOut;
document.getElementById("copyBtn").onclick=copyOut;
document.getElementById("restartBtn").onclick=()=>{st={idx:0,dec:{}};save();show();};
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"&&st.idx<BOSSES.length)decide("no");
  else if(e.key==="ArrowRight"&&st.idx<BOSSES.length)decide("yes");else if(e.key==="Backspace")undo();});
show();
</script></body></html>
