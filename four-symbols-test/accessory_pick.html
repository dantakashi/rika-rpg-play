.w.noned{opacity:.5}.w.noned .none{background:#ff5a7a;color:#33000d}

.cnt{font-size:13px;color:#cfd3db}.cnt b{color:#2bd47a;font-size:18px}
.btn{background:#ffe27a;color:#15161a;border:none;border-radius:10px;padding:11px 16px;font-size:14px;font-weight:700;cursor:pointer}

.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:#2bd47a;color:#08210f;padding:8px 16px;border-radius:999px;font-weight:700;opacity:0;transition:.3s;pointer-events:none}.toast.show{opacity:1}
</style></head><body>

<div id="root"></div>

W.forEach(w=>{

  if(st[w.id]==="NONE")box.classList.add("noned");
  box.innerHTML=`<div class="wh"><span class="nm">${w.name_ja}</span>
    <span class="badge">${w.band} / ${w.tag}</span>
    <span class="none" data-id="${w.id}">全部ダメ</span></div>`;
  const row=document.createElement("div");row.className="row";
  w.cands.forEach((c,k)=>{
    const el=document.createElement("div");el.className="cand"+(st[w.id]===k?" pick":"");
    el.innerHTML=`<div class="ib"><img src="${c.img}" loading="lazy" alt=""></div><div class="v">${c.v}</div>`;
    el.onclick=()=>{st[w.id]=k;box.classList.remove("noned");localStorage.setItem(KEY,JSON.stringify(st));render();};

  });
  box.appendChild(row);root.appendChild(box);
});
document.querySelectorAll(".none").forEach(b=>b.onclick=e=>{e.stopPropagation();const id=b.dataset.id;st[id]=(st[id]==="NONE")?undefined:"NONE";if(st[id]===undefined)delete st[id];localStorage.setItem(KEY,JSON.stringify(st));render();});
function render(){
  let n=0;
  W.forEach(w=>{
    const box=document.getElementById("w_"+w.id);
    box.classList.toggle("noned",st[w.id]==="NONE");
    box.querySelectorAll(".cand").forEach((el,k)=>el.classList.toggle("pick",st[w.id]===k));
    if(typeof st[w.id]==="number"||st[w.id]==="NONE")n++;
  });
  document.getElementById("pickn").textContent=n;
}
function copyOut(){
  let s=`=== 指輪(装飾品) 採用結果 ===\n`;
  W.forEach(w=>{const v=st[w.id];
    if(v==="NONE")s+=`- ${w.name_ja} [${w.id}] => 全部ダメ\n`;
    else if(typeof v==="number")s+=`- ${w.name_ja} [${w.id}] => 採用 ${w.cands[v].v}\n`;
    else s+=`- ${w.name_ja} [${w.id}] => 未選択\n`;});
  const o=document.getElementById("out");o.style.display="block";o.value=s;o.select();
  if(navigator.clipboard)navigator.clipboard.writeText(s).then(()=>{const t=document.getElementById("toast");t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1400);},()=>{});
}
document.getElementById("copyBtn").onclick=copyOut;
render();
