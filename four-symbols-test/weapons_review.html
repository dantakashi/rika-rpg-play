let flags=JSON.parse(localStorage.getItem(KEY)||"{}");
document.getElementById("total").textContent=ITEMS.length;
const root=document.getElementById("root");
const groups={};
ITEMS.forEach(it=>{(groups[it.batch]=groups[it.batch]||[]).push(it);});
for(const g in groups){
  const h=document.createElement("h2");h.textContent=g+`（${groups[g].length}本）`;root.appendChild(h);
  const grid=document.createElement("div");grid.className="grid";
  groups[g].forEach(it=>{
    const c=document.createElement("div");c.className="card"+(flags[it.id]?" flag":"");c.dataset.id=it.id;
    c.innerHTML=`<div class="imgbox"><img src="${it.img}" loading="lazy" alt=""></div>
      <div class="meta"><div class="nm">${it.name_ja}</div>
      <div class="tags">${it.cls} ・ ${it.tier} ・ ${it.role}</div><div class="id">${it.id}</div></div>`;
    c.onclick=()=>{if(flags[it.id]){delete flags[it.id];c.classList.remove("flag");}else{flags[it.id]=1;c.classList.add("flag");}
      localStorage.setItem(KEY,JSON.stringify(flags));upd();};
    grid.appendChild(c);
  });
  root.appendChild(grid);
}
function upd(){document.getElementById("flagn").textContent=Object.keys(flags).length;}
function copyOut(){
  const fl=ITEMS.filter(it=>flags[it.id]);
  let s=`=== 武器 要修正リスト (${fl.length}/${ITEMS.length}) ===\n`;
  fl.forEach(it=>s+=`- ${it.name_ja} [${it.id}] (${it.cls}/${it.batch})\n`);
  if(!fl.length)s+="(なし＝全部OK！)\n";
  const o=document.getElementById("out");o.style.display="block";o.value=s;o.select();
  if(navigator.clipboard)navigator.clipboard.writeText(s).then(()=>{const t=document.getElementById("toast");t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1400);},()=>{});
}
document.getElementById("copyBtn").onclick=copyOut;
document.getElementById("clearBtn").onclick=()=>{flags={};localStorage.setItem(KEY,"{}");document.querySelectorAll(".card.flag").forEach(c=>c.classList.remove("flag"));upd();document.getElementById("out").style.display="none";};
upd();
</script></body></html>
