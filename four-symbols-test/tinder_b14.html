<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>ボス選別 — 理科RPG2</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0f1014;color:#e7e7ea;font-family:system-ui,"Hiragino Kaku Gothic ProN",sans-serif;overflow:hidden;height:100dvh}
header{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;background:#1a1c22;border-bottom:1px solid #2c2f3a}
header b{color:#ffe27a}.count{font-size:13px;color:#9aa0ad}
.stage{position:relative;height:calc(100dvh - 150px);display:flex;align-items:center;justify-content:center;padding:10px}
.card{position:absolute;width:min(92vw,440px);max-height:100%;background:#1d1f26;border:1px solid #2c2f3a;border-radius:18px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5);touch-action:none}
.imgbox{aspect-ratio:1/1;
  background-image:linear-gradient(45deg,#cfcfcf 25%,transparent 25%),linear-gradient(-45deg,#cfcfcf 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#cfcfcf 75%),linear-gradient(-45deg,transparent 75%,#cfcfcf 75%);
  background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0;background-color:#e9e9e9}
.imgbox img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.info{padding:12px 16px}
.nm{font-size:22px;font-weight:800}
.nm .tier{font-size:14px;font-weight:700;padding:2px 10px;border-radius:999px;margin-left:8px;vertical-align:3px}
.t序盤{background:#2bd47a;color:#06210f}.t中盤{background:#4aa3ff;color:#04203f}.t終盤{background:#ff9a3c;color:#311600}.tラスボス級{background:#ff5a7a;color:#33000d}
.el{font-size:12px;color:#9aa0ad;margin-top:2px}
.fl{font-size:14px;color:#cfd3db;margin-top:8px;line-height:1.55}
.stamp{position:absolute;top:18px;font-size:34px;font-weight:900;padding:4px 14px;border:4px solid;border-radius:12px;opacity:0;transform:rotate(-15deg)}
.yes{left:18px;color:#2bd47a;border-color:#2bd47a}.no{right:18px;color:#ff5a7a;border-color:#ff5a7a}
.bar{position:fixed;bottom:0;left:0;right:0;height:90px;display:flex;align-items:center;justify-content:center;gap:22px;background:#13141a;border-top:1px solid #2c2f3a}
.fab{width:62px;height:62px;border-radius:50%;border:none;font-size:26px;cursor:pointer;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.fab.no{background:#2a1d23;color:#ff5a7a;border:2px solid #ff5a7a}.fab.yes{background:#16271c;color:#2bd47a;border:2px solid #2bd47a}
.fab.undo{width:48px;height:48px;font-size:18px;background:#23242c;color:#cfd3db;border:1px solid #3a3f4c}
.done{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.done h2{color:#ffe27a;margin:0 0 8px}
.btn{margin-top:14px;background:#ffe27a;color:#15161a;border:none;border-radius:10px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
#out{margin-top:12px;width:min(92vw,520px);height:160px;font-family:ui-monospace,monospace;font-size:11px;display:none;background:#0b0c10;color:#cfd3db;border:1px solid #3a3f4c;border-radius:8px;padding:8px}
.hint{font-size:11px;color:#6b7280;margin-top:6px}
.toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%);background:#2bd47a;color:#08210f;padding:8px 16px;border-radius:999px;font-weight:700;opacity:0;transition:.3s;pointer-events:none}.toast.show{opacity:1}
</style></head><body>
<header><div><b>ボス選別</b> <span style="font-size:12px;color:#9aa0ad">← 無し / 有り → ・ドラッグもOK</span></div>
  <div class="count"><span id="done_n">0</span>/<span id="total_n">0</span> ・有り<span id="yes_n">0</span></div></header>
<div class="stage" id="stage">
  <div class="done" id="doneScreen">
    <h2>選別おわり！</h2>
    <div id="summary" style="color:#cfd3db"></div>
    <button class="btn" id="copyBtn">結果をコピー</button>
    <div class="hint">コピーしたテキストをチャットに貼ってください（採用の系統を学習して次の50枚へ）。</div>
    <textarea id="out" readonly></textarea>
    <button class="btn" id="restartBtn" style="background:#3a3f4c;color:#e7e7ea">最初からやり直す</button>
  </div>
</div>
<div class="bar">
  <button class="fab no" id="bNo">✗</button>
  <button class="fab undo" id="bUndo">↶</button>
  <button class="fab yes" id="bYes">♥</button>
  <button class="btn" id="bCopy" style="position:fixed;right:12px;bottom:104px;padding:8px 12px;font-size:12px">途中保存コピー</button>
</div>
<div class="toast" id="toast">コピーしました！</div>
<script>
const BOSSES=[{"id": "bubble-pop-tadlet-b14", "name_ja": "アワまるオタマ", "tier": "序盤", "element": "水", "flavor_ja": "せっけんの泡をまとった人なつこいオタマジャクシ。表面張力で泡を割らずにぷかぷか運ぶ。", "img": "gacha_b14/bubble-pop-tadlet-b14.png"}, {"id": "spark-cell-pup-b14", "name_ja": "ビリっこ", "tier": "序盤", "element": "電気", "flavor_ja": "乾電池みたいな体に電気をためる元気なザコ。さわるとピリッと痛い。プラスとマイナスを取りちがえる。", "img": "gacha_b14/spark-cell-pup-b14.png"}, {"id": "sprout-snail-bud-b14", "name_ja": "ふたばマイマイ", "tier": "序盤", "element": "草", "flavor_ja": "背中の新芽で光合成しながらのんびり進む。日なたを見つけるとうれしそうに葉を広げる。", "img": "gacha_b14/sprout-snail-bud-b14.png"}, {"id": "prism-beetle-knight-b14", "name_ja": "プリズム甲虫", "tier": "中盤", "element": "光", "flavor_ja": "硬い甲羅が光をプリズムのように七色に分ける。怒ると虹色のフラッシュで目をくらませる。", "img": "gacha_b14/prism-beetle-knight-b14.png"}, {"id": "geo-crystal-frog-b14", "name_ja": "ジオードガエル", "tier": "中盤", "element": "地", "flavor_ja": "背中の晶洞でゆっくり結晶を育てる地味だが頼れる中堅。じっとして動かないと結晶がよく伸びる。", "img": "gacha_b14/geo-crystal-frog-b14.png"}, {"id": "magnet-hermit-clamp-b14", "name_ja": "マグネやどかり", "tier": "中盤", "element": "金属", "flavor_ja": "ひろった磁石を家にしているやどかり。鉄の砂を体じゅうにまとってジャラジャラ歩く。", "img": "gacha_b14/magnet-hermit-clamp-b14.png"}, {"id": "aurora-fox-flame-b14", "name_ja": "オーロラぎつね", "tier": "終盤", "element": "光", "flavor_ja": "夜空のオーロラを毛なみにまとう気高い霊狐。光のカーテンは体から決して離れず、まとわりつくように揺れる。", "img": "gacha_b14/aurora-fox-flame-b14.png"}, {"id": "voltaic-ram-coil-b14", "name_ja": "ボルテージひつじ", "tier": "終盤", "element": "電気", "flavor_ja": "巻き毛のフリースが巨大なコイルになっていて、ためた電気を角から放つ。突進する前に毛が逆立ち火花が散る。", "img": "gacha_b14/voltaic-ram-coil-b14.png"}, {"id": "reactor-tortoise-sovereign-b14", "name_ja": "リアクタ大亀王", "tier": "ラスボス級", "element": "化学", "flavor_ja": "甲羅そのものが巨大な化学プラントになった古の大亀王。体内で泡立つ反応液から、まとわりつく蒸気を吐き出す。", "img": "gacha_b14/reactor-tortoise-sovereign-b14.png"}, {"id": "spectrum-serpent-monarch-b14", "name_ja": "スペクトル蛇帝", "tier": "ラスボス級", "element": "光", "flavor_ja": "全ての色をうろこに宿す光の蛇帝。とぐろを巻いた体から七色のスペクトルがまとわりつくようにあふれ出す。", "img": "gacha_b14/spectrum-serpent-monarch-b14.png"}, {"id": "prism-shell-snail-b14", "name_ja": "プリズマイマイ", "tier": "序盤", "element": "光", "flavor_ja": "せなかの結晶のからを通った光が、虹色に分かれてキラキラこぼれる。ゆっくりだけど七色にまぶしい序盤のなかま。", "img": "gacha_b14/prism-shell-snail-b14.png"}, {"id": "neon-glow-frog-b14", "name_ja": "ネオングロウル", "tier": "序盤", "element": "発光", "flavor_ja": "体の中のひかる液がネオンみたいに光る。くらやみで一番たよれる、ぷにぷに発光のおともだち。", "img": "gacha_b14/neon-glow-frog-b14.png"}, {"id": "candy-bubble-pufferfish-b14", "name_ja": "シャボンフグ", "tier": "序盤", "element": "光", "flavor_ja": "ふくらんだ体がシャボン玉みたいに虹色にてかる。ぷかっと丸い、おどけたかわいい序盤のザコ。", "img": "gacha_b14/candy-bubble-pufferfish-b14.png"}, {"id": "plasma-arc-mantis-b14", "name_ja": "プラズマンティス", "tier": "中盤", "element": "プラズマ", "flavor_ja": "ふりあげたカマの間でプラズマがバチバチはじける。電光をまとった甲殻の狩人、中盤の難敵。", "img": "gacha_b14/plasma-arc-mantis-b14.png"}, {"id": "rainbow-shell-hermit-crab-b14", "name_ja": "スペクトルヤドカリ", "tier": "中盤", "element": "結晶", "flavor_ja": "オパールの結晶を宿にして背負う甲殻獣。動くたび貝がら全体が虹色にゆらめく、中盤の重量級。", "img": "gacha_b14/rainbow-shell-hermit-crab-b14.png"}, {"id": "aurora-axolotl-b14", "name_ja": "オーロラロトル", "tier": "中盤", "element": "発光", "flavor_ja": "せなかからオーロラのひかりがゆらめき立つ、にっこり顔の幻のいきもの。可愛いのに神秘的な中盤のぬし。", "img": "gacha_b14/aurora-axolotl-b14.png"}, {"id": "spectral-prism-dragon-b14", "name_ja": "プリズムドラゴン", "tier": "終盤", "element": "光", "flavor_ja": "全身のうろこがプリズムとなり、あびた光を虹の奔流へと砕く竜。極彩色にきらめく終盤の強敵。", "img": "gacha_b14/spectral-prism-dragon-b14.png"}, {"id": "neon-circuit-scarab-b14", "name_ja": "サーキスカラベ", "tier": "終盤", "element": "プラズマ", "flavor_ja": "甲羅にきざまれた回路に電流が走り、ネオンの紋様が脈打つ重甲の虫王。終盤を阻む難物。", "img": "gacha_b14/neon-circuit-scarab-b14.png"}, {"id": "supernova-phoenix-titan-b14", "name_ja": "スペクトロフェニクス", "tier": "ラスボス級", "element": "プラズマ", "flavor_ja": "全スペクトルの炎をまとい、虹のプラズマを噴きあげる不死の極彩鳥。世界を灼く荘厳なる王。", "img": "gacha_b14/supernova-phoenix-titan-b14.png"}, {"id": "prismatic-world-serpent-b14", "name_ja": "セブンカラーワーム", "tier": "ラスボス級", "element": "結晶", "flavor_ja": "とぐろを巻く巨躯のうろこが七色の波となって流れる、極彩の世界蛇。あらゆる光を呑む最後のぬし。", "img": "gacha_b14/prismatic-world-serpent-b14.png"}, {"id": "ember-pip-sprite-b14", "name_ja": "ヒノコちゃん", "tier": "序盤", "element": "炎", "flavor_ja": "燃えると赤くなるよ。すぐ消えちゃうから優しくしてね。ぽっと小さな火の精霊。", "img": "gacha_b14/ember-pip-sprite-b14.png"}, {"id": "dewdrop-puddle-spirit-b14", "name_ja": "ミズタマちゃん", "tier": "序盤", "element": "水", "flavor_ja": "ぷるぷるの水のしずく。さわるとちょっと冷たい。形がすぐ変わるよ。", "img": "gacha_b14/dewdrop-puddle-spirit-b14.png"}, {"id": "breezy-tuft-spritelet-b14", "name_ja": "ソヨちゃん", "tier": "序盤", "element": "風", "flavor_ja": "ふわふわの風のあかちゃん。ほっぺに空気をためてぷーっとふくらむよ。", "img": "gacha_b14/breezy-tuft-spritelet-b14.png"}, {"id": "sparklet-bolt-imp-b14", "name_ja": "ビリビリくん", "tier": "中盤", "element": "雷", "flavor_ja": "さわるとビリッ！いたずら好きな雷の精霊。怒るとほっぺが光るよ。", "img": "gacha_b14/sparklet-bolt-imp-b14.png"}, {"id": "frostbun-chill-sprite-b14", "name_ja": "コオリンちゃん", "tier": "中盤", "element": "氷", "flavor_ja": "ひんやり氷の精霊。ほっぺに雪のもようがあるよ。さわると手がかじかむ。", "img": "gacha_b14/frostbun-chill-sprite-b14.png"}, {"id": "loam-pebble-golemkin-b14", "name_ja": "ツチダンゴくん", "tier": "中盤", "element": "土", "flavor_ja": "どっしり土の精霊。頭にコケ、肩にきのこ。あったかい土のにおいがするよ。", "img": "gacha_b14/loam-pebble-golemkin-b14.png"}, {"id": "radiant-halo-cherub-sprite-b14", "name_ja": "ヒカリンちゃん", "tier": "終盤", "element": "光", "flavor_ja": "ぽわっと光る光の精霊。そばにいるとあったかい。星のかけらがほっぺで光るよ。", "img": "gacha_b14/radiant-halo-cherub-sprite-b14.png"}, {"id": "magma-tubby-tyrant-sprite-b14", "name_ja": "マグマだいおうちゃん", "tier": "終盤", "element": "炎", "flavor_ja": "炎の精霊の大将。体のひび割れからマグマがどろり。すごく熱いから近づきすぎ注意。", "img": "gacha_b14/magma-tubby-tyrant-sprite-b14.png"}, {"id": "primordia-aether-sovereign-b14", "name_ja": "セイレイおうセイレイ", "tier": "ラスボス級", "element": "光", "flavor_ja": "すべての精霊をたばねる王さま。体に七つの力をまとっている。ちびだけど風格はラスボス級。", "img": "gacha_b14/primordia-aether-sovereign-b14.png"}, {"id": "voidmaw-eclipse-spritelet-b14", "name_ja": "ヤミノちゃん", "tier": "ラスボス級", "element": "闇", "flavor_ja": "夜とおなじ色の精霊。体に星空をまとっているよ。こわそうに見えて実はさみしがりや。", "img": "gacha_b14/voidmaw-eclipse-spritelet-b14.png"}, {"id": "puffer-pressure-spinebloat-b14", "name_ja": "アツバリフグ", "tier": "序盤", "element": "圧力・水圧", "flavor_ja": "体内に水をため込んで風船のようにふくらむフグの怪。圧でビンと張った棘がいっせいに逆立つ。丸くて可愛いが触れば痛い。", "img": "gacha_b14/puffer-pressure-spinebloat-b14.png"}, {"id": "clownfish-venom-anemone-guard-b14", "name_ja": "ドクギンチャクマロ", "tier": "序盤", "element": "生物・毒（刺胞）", "flavor_ja": "イソギンチャクの毒触手を首にまとったクマノミの怪。ぷくっと丸い体に、紫に光る毒のしずくをまとう。", "img": "gacha_b14/clownfish-venom-anemone-guard-b14.png"}, {"id": "seahorse-static-curler-b14", "name_ja": "ビリビリタツノコ", "tier": "序盤", "element": "電磁・静電気", "flavor_ja": "巻いた尾を地につけて踏ん張る小さなタツノオトシゴ。背びれの毛が静電気で逆立ち、青い火花を散らす。", "img": "gacha_b14/seahorse-static-curler-b14.png"}, {"id": "axolotl-electrolyte-regen-b14", "name_ja": "デンカイウーパー", "tier": "中盤", "element": "電磁・電気分解", "flavor_ja": "外えらの電極で水を分解する電気ウーパー。継ぎ目から小さな泡を吹き、半透明の体が青く光る。ずっと笑っている。", "img": "gacha_b14/axolotl-electrolyte-regen-b14.png"}, {"id": "sunfish-bulwark-mola-b14", "name_ja": "オオダテマンボウ", "tier": "中盤", "element": "物理・圧力（浮力）", "flavor_ja": "壁のようにそびえる巨大マンボウ。ぼんやりした顔とは裏腹に、その巨体は圧そのもの。ぶつかれば水ごと押し潰される。", "img": "gacha_b14/sunfish-bulwark-mola-b14.png"}, {"id": "jelly-bioluminescent-belltoxin-b14", "name_ja": "ホタルクラゲヒメ", "tier": "中盤", "element": "生物発光・毒", "flavor_ja": "ドーム型の体が内から青く光るクラゲの姫。短い触手のさきに、紫に光る毒のしずくをぶらさげる。ぷるんと丸い。", "img": "gacha_b14/jelly-bioluminescent-belltoxin-b14.png"}, {"id": "toad-pressure-thunderbloat-b14", "name_ja": "ライメイガマ", "tier": "終盤", "element": "電磁・放電（圧）", "flavor_ja": "山のように据わった巨ガマ。ふくらむ喉袋に雷をため込み、鳴くたびに青白い稲妻が皮膚を走る。どっしり微動だにしない。", "img": "gacha_b14/toad-pressure-thunderbloat-b14.png"}, {"id": "anglerfish-abyss-lanternlure-b14", "name_ja": "シンカイチョウチンオー", "tier": "終盤", "element": "生物発光・圧力（深海）", "flavor_ja": "深海の圧でまんまるに膨れた提灯王。額の光球をぼうっと灯し、近づくものを大口で呑む。怖いのに少し可愛い。", "img": "gacha_b14/anglerfish-abyss-lanternlure-b14.png"}, {"id": "axolotl-king-regen-overlord-b14", "name_ja": "ウパロード・再生の王", "tier": "ラスボス級", "element": "生物・再生／毒", "flavor_ja": "巨大化した再生の王、ウーパールーパーの帝。傷つけても瞬く間に再び生え、たてがみのような外えらが妖しく光る。可愛い顔で見下ろす王。", "img": "gacha_b14/axolotl-king-regen-overlord-b14.png"}, {"id": "jelly-empress-bell-fortress-b14", "name_ja": "クラゲ大女帝ベルゲイザ", "tier": "ラスボス級", "element": "発光・電気・毒（複合）", "flavor_ja": "発光・電気・毒のすべてを束ねるクラゲの大女帝。ステンドグラスのように輝く巨大なドームに雷が走り、垂れた触手から毒が滴る。丸く荘厳。", "img": "gacha_b14/jelly-empress-bell-fortress-b14.png"}, {"id": "peacock-poppet-b14", "name_ja": "クジャクポー", "tier": "序盤", "element": "光", "flavor_ja": "つぶらな瞳と小さな羽根扇。歩くたび羽の目玉模様がキラリと光る、生まれたての幸運の使い。", "img": "gacha_b14/peacock-poppet-b14.png"}, {"id": "phoenix-hatchling-b14", "name_ja": "ヒナフェニ", "tier": "序盤", "element": "炎", "flavor_ja": "卵の殻をかぶったまま、ほわほわの羽から小さな炎をまとうヒヨコ。再生の物語はここから始まる。", "img": "gacha_b14/phoenix-hatchling-b14.png"}, {"id": "fae-sproutling-b14", "name_ja": "ヨウセイのめばえ", "tier": "序盤", "element": "風", "flavor_ja": "花びらの襟巻きをした手のひらサイズの妖精。歩くと足あとから小さな双葉が芽吹く。", "img": "gacha_b14/fae-sproutling-b14.png"}, {"id": "baby-kirin-b14", "name_ja": "キリンのこ", "tier": "中盤", "element": "光", "flavor_ja": "額の小さな角はまだ生えたて。歩いた場所に幸運の花が咲くという、子どもの聖獣。", "img": "gacha_b14/baby-kirin-b14.png"}, {"id": "prism-quetzal-b14", "name_ja": "プリズムケツァール", "tier": "中盤", "element": "光", "flavor_ja": "羽根の一枚一枚が虹を分けるプリズムの鳥。光をくぐらせ七色のきらめきを撒く。", "img": "gacha_b14/prism-quetzal-b14.png"}, {"id": "thunder-fledgling-b14", "name_ja": "ライジンのヒナ", "tier": "中盤", "element": "雷", "flavor_ja": "羽ばたくたびにパチパチと火花が散る雷鳥のヒナ。鳴き声は小さな雷鳴。", "img": "gacha_b14/thunder-fledgling-b14.png"}, {"id": "verdant-wyrmling-b14", "name_ja": "ミドリのこりゅう", "tier": "終盤", "element": "風", "flavor_ja": "ふくふくと丸まった翡翠の子竜。吐く息は春風で、まわりに花びらを舞わせる。", "img": "gacha_b14/verdant-wyrmling-b14.png"}, {"id": "celestial-phoenix-blaze-b14", "name_ja": "ホウオウ・ブレイズ", "tier": "終盤", "element": "炎", "flavor_ja": "灼熱の羽をまとう壮麗な鳳凰。たたんだ翼の隙間からも炎がこぼれ落ちる、終盤の守護者。", "img": "gacha_b14/celestial-phoenix-blaze-b14.png"}, {"id": "empyrean-kirin-sovereign-b14", "name_ja": "セイレイキリン", "tier": "ラスボス級", "element": "光", "flavor_ja": "金と翡翠の鱗をまとい聖なる炎を吹き上げる成獣の麒麟。乱世を鎮める伝説の王。", "img": "gacha_b14/empyrean-kirin-sovereign-b14.png"}, {"id": "vermillion-godbird-overlord-b14", "name_ja": "スザクオーバーロード", "tier": "ラスボス級", "element": "炎", "flavor_ja": "極彩の羽すべてが炎と化す神鳥の覇王。翼を畳んでなお燃え盛る、最後の試練。", "img": "gacha_b14/vermillion-godbird-overlord-b14.png"}]; const KEY="rika2_boss_swipe_gacha_b14";
let st=JSON.parse(localStorage.getItem(KEY)||"null")||{idx:0,dec:{}};
function save(){localStorage.setItem(KEY,JSON.stringify(st));}
const stage=document.getElementById("stage");
document.getElementById("total_n").textContent=BOSSES.length;
let card=null,startX=0,curX=0,dragging=false;

function counts(){const y=Object.values(st.dec).filter(v=>v==="yes").length;
  document.getElementById("done_n").textContent=Object.keys(st.dec).length;
  document.getElementById("yes_n").textContent=y;}

function build(idx){
  const b=BOSSES[idx]; const el=document.createElement("div"); el.className="card";
  el.innerHTML=`<div class="stamp yes">有り</div><div class="stamp no">無し</div>
    <div class="imgbox"><img src="${b.img}" alt=""></div>
    <div class="info"><div class="nm">${b.name_ja}<span class="tier t${b.tier}">${b.tier}</span></div>
    <div class="el">${b.element}</div><div class="fl">${b.flavor_ja}</div></div>`;
  el.addEventListener("pointerdown",down); el.addEventListener("pointermove",move);
  el.addEventListener("pointerup",up); el.addEventListener("pointercancel",up);
  return el;
}
function show(){
  if(card){card.remove();card=null;}
  if(st.idx>=BOSSES.length){document.getElementById("doneScreen").style.display="flex";finish();return;}
  document.getElementById("doneScreen").style.display="none";
  card=build(st.idx); stage.appendChild(card); counts();
}
function down(e){dragging=true;startX=e.clientX;curX=0;card.setPointerCapture(e.pointerId);card.style.transition="none";}
function move(e){if(!dragging)return;curX=e.clientX-startX;card.style.transform=`translateX(${curX}px) rotate(${curX/18}deg)`;
  card.querySelector(".yes").style.opacity=Math.max(0,Math.min(1,curX/90));
  card.querySelector(".no").style.opacity=Math.max(0,Math.min(1,-curX/90));}
function up(){if(!dragging)return;dragging=false;
  if(curX>90)decide("yes");else if(curX<-90)decide("no");
  else{card.style.transition=".2s";card.style.transform="";card.querySelector(".yes").style.opacity=0;card.querySelector(".no").style.opacity=0;}}
function decide(v){
  st.dec[BOSSES[st.idx].id]=v; save();
  const dir=v==="yes"?1:-1;
  card.style.transition=".3s ease-out";
  card.style.transform=`translateX(${dir*140}vw) rotate(${dir*25}deg)`;
  card.style.opacity="0";
  setTimeout(()=>{st.idx++;save();show();},260);
}
function undo(){if(st.idx<=0)return;st.idx--;delete st.dec[BOSSES[st.idx].id];save();show();}
function summaryText(){
  const yes=BOSSES.filter(b=>st.dec[b.id]==="yes"),no=BOSSES.filter(b=>st.dec[b.id]==="no");
  let s=`=== ボス選別 結果 (有り${yes.length} / 無し${no.length} / 計${BOSSES.length}) ===\n【有り】\n`;
  yes.forEach(b=>s+=`- ${b.name_ja} (${b.tier}/${b.element}) [${b.id}]\n`);
  s+="【無し】\n"; no.forEach(b=>s+=`- ${b.name_ja} (${b.tier}/${b.element}) [${b.id}]\n`);
  return s;
}
function finish(){
  const yes=BOSSES.filter(b=>st.dec[b.id]==="yes").length;
  document.getElementById("summary").textContent=`有り ${yes} 体 / 無し ${BOSSES.length-yes} 体`;
}
function copyOut(){const s=summaryText();const o=document.getElementById("out");o.style.display="block";o.value=s;
  if(navigator.clipboard)navigator.clipboard.writeText(s).then(()=>{const t=document.getElementById("toast");t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1500);},()=>{});o.select();}
document.getElementById("bNo").onclick=()=>{if(st.idx<BOSSES.length)decide("no");};
document.getElementById("bYes").onclick=()=>{if(st.idx<BOSSES.length)decide("yes");};
document.getElementById("bUndo").onclick=undo;
document.getElementById("bCopy").onclick=copyOut;
document.getElementById("copyBtn").onclick=copyOut;
document.getElementById("restartBtn").onclick=()=>{st={idx:0,dec:{}};save();show();};
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"&&st.idx<BOSSES.length)decide("no");
  else if(e.key==="ArrowRight"&&st.idx<BOSSES.length)decide("yes");else if(e.key==="Backspace")undo();});
show();
</script></body></html>
