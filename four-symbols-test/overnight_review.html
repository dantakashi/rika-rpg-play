rv1", "name_ja": "イグニスフォージ", "tier": "中盤", "element": "燃焼", "img": "gacha_rv1_3/flame-forge-lion-b6-rv1.png", "batch": "rv1_3"}, {"id": "gravity-void-leviathan-b6-rv1", "name_ja": "グラヴィオス", "tier": "終盤", "element": "重力", "img": "gacha_rv1_3/gravity-void-leviathan-b6-rv1.png", "batch": "rv1_3"}, {"id": "thunder-circuit-hydra-b6-rv1", "name_ja": "サーキュラ・ヒュドラ", "tier": "終盤", "element": "電磁・回路", "img": "gacha_rv1_3/thunder-circuit-hydra-b6-rv1.png", "batch": "rv1_3"}, {"id": "titan-alloy-colossus-b6-rv1", "name_ja": "アロイ・タイタン", "tier": "ラスボス級", "element": "合金・圧力", "img": "gacha_rv1_3/titan-alloy-colossus-b6-rv1.png", "batch": "rv1_3"}, {"id": "ember-fang-lizard-b6-rv1", "name_ja": "ほむらキバトカゲ", "tier": "序盤", "element": "炎", "img": "gacha_rv1_3/ember-fang-lizard-b6-rv1.png", "batch": "rv1_3"}, {"id": "gale-horn-tusker-b6-rv1", "name_ja": "かぜホーン・ウォーボア", "tier": "序盤", "element": "風", "img": "gacha_rv1_3/gale-horn-tusker-b6-rv1.png", "batch": "rv1_3"}, {"id": "sprout-maw-chimera-b6-rv1", "name_ja": "わかばマウ・キメラ", "tier": "序盤", "element": "草", "img": "gacha_rv1_3/sprout-maw-chimera-b6-rv1.png", "batch": "rv1_3"}, {"id": "tide-coil-serpent-b6-rv1", "name_ja": "うずしお・サーペント", "tier": "中盤", "element": "水", "img": "gacha_rv1_3/tide-coil-serpent-b6-rv1.png", "batch": "rv1_3"}, {"id": "crystal-hydra-prism-b6-rv1", "name_ja": "プリズム・クリスタヒドラ", "tier": "終盤", "element": "光", "img": "gacha_rv1_3/crystal-hydra-prism-b6-rv1.png", "batch": "rv1_3"}];const KEY="rika2_overnight_review_v1";
let st=JSON.parse(localStorage.getItem(KEY)||"null")||{idx:0,dec:{}};
function save(){localStorage.setItem(KEY,JSON.stringify(st));}
const stage=document.getElementById("stage");document.getElementById("tn").textContent=BOSSES.length;
let card=null,sx=0,cx=0,drag=false;
function counts(){const y=Object.values(st.dec).filter(v=>v==="yes").length;document.getElementById("dn").textContent=Object.keys(st.dec).length;document.getElementById("yn").textContent=y;}
function build(i){const b=BOSSES[i];const el=document.createElement("div");el.className="card";
el.innerHTML=`<div class="stamp yes">有り</div><div class="stamp no">無し</div><div class="imgbox"><img src="${b.img}" alt=""></div><div class="info"><div class="nm">${b.name_ja}<span class="tier t${b.tier}">${b.tier}</span></div><div class="el">${b.element}</div><div class="bt">${b.batch}</div></div>`;
el.addEventListener("pointerdown",dn);el.addEventListener("pointermove",mv);el.addEventListener("pointerup",up);el.addEventListener("pointercancel",up);return el;}
function show(){if(card){card.remove();card=null;}if(st.idx>=BOSSES.length){document.getElementById("done").style.display="flex";finish();return;}document.getElementById("done").style.display="none";card=build(st.idx);stage.appendChild(card);counts();}
function dn(e){drag=true;sx=e.clientX;cx=0;card.setPointerCapture(e.pointerId);card.style.transition="none";}
function mv(e){if(!drag)return;cx=e.clientX-sx;card.style.transform=`translateX(${cx}px) rotate(${cx/18}deg)`;card.querySelector(".yes").style.opacity=Math.max(0,Math.min(1,cx/90));card.querySelector(".no").style.opacity=Math.max(0,Math.min(1,-cx/90));}
function up(){if(!drag)return;drag=false;if(cx>90)dec("yes");else if(cx<-90)dec("no");else{card.style.transition=".2s";card.style.transform="";card.querySelector(".yes").style.opacity=0;card.querySelector(".no").style.opacity=0;}}
function dec(v){st.dec[BOSSES[st.idx].id]=v;save();const d=v==="yes"?1:-1;card.style.transition=".3s ease-out";card.style.transform=`translateX(${d*140}vw) rotate(${d*25}deg)`;card.style.opacity="0";setTimeout(()=>{st.idx++;save();show();},250);}
function undo(){if(st.idx<=0)return;st.idx--;delete st.dec[BOSSES[st.idx].id];save();show();}
function csv(){let s="id,verdict\n";BOSSES.forEach(b=>{if(st.dec[b.id])s+=b.id+","+st.dec[b.id]+"\n";});return s;}
function finish(){const y=BOSSES.filter(b=>st.dec[b.id]==="yes").length;document.getElementById("sum").textContent=`有り ${y} / 無し ${Object.keys(st.dec).length-y} / 計 ${BOSSES.length}`;document.getElementById("out").value=csv();}
function copyCsv(){const s=csv();const o=document.getElementById("out");o.value=s;if(navigator.clipboard)navigator.clipboard.writeText(s).then(()=>{const t=document.getElementById("toast");t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1500);});o.select();}
function dlCsv(){const s=csv();const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([s],{type:"text/csv"}));a.download="overnight_result.csv";a.click();}
document.getElementById("bno").onclick=()=>{if(st.idx<BOSSES.length)dec("no");};
document.getElementById("by").onclick=()=>{if(st.idx<BOSSES.length)dec("yes");};
document.getElementById("bu").onclick=undo;document.getElementById("bcsv").onclick=copyCsv;
document.getElementById("cp").onclick=copyCsv;document.getElementById("dl").onclick=dlCsv;
document.getElementById("rs").onclick=()=>{st={idx:0,dec:{}};save();show();};
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"&&st.idx<BOSSES.length)dec("no");else if(e.key==="ArrowRight"&&st.idx<BOSSES.length)dec("yes");else if(e.key==="Backspace")undo();});
show();
</script></body></html>
