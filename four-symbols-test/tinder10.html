<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>ボス選別 — 理科RPG2</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0f1014;color:#e7e7ea;font-family:system-ui,"Hiragino Kaku Gothic ProN",sans-serif;overflow:hidden;height:100dvh}
header{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;background:#1a1c22;border-bottom:1px solid #2c2f3a}
header b{color:#ffe27a}.count{font-size:13px;color:#9aa0ad}
.stage{position:relative;height:calc(100dvh - 150px);display:flex;align-items:center;justify-content:center;padding:10px}
.card{position:absolute;width:min(92vw,440px);max-height:100%;background:#1d1f26;border:1px solid #2c2f3a;border-radius:18px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5);touch-action:none}
.imgbox{aspect-ratio:1/1;
  background-image:linear-gradient(45deg,#cfcfcf 25%,transparent 25%),linear-gradient(-45deg,#cfcfcf 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#cfcfcf 75%),linear-gradient(-45deg,transparent 75%,#cfcfcf 75%);
  background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0;background-color:#e9e9e9}
.imgbox img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.info{padding:12px 16px}
.nm{font-size:22px;font-weight:800}
.nm .tier{font-size:14px;font-weight:700;padding:2px 10px;border-radius:999px;margin-left:8px;vertical-align:3px}
.t序盤{background:#2bd47a;color:#06210f}.t中盤{background:#4aa3ff;color:#04203f}.t終盤{background:#ff9a3c;color:#311600}.tラスボス級{background:#ff5a7a;color:#33000d}
.el{font-size:12px;color:#9aa0ad;margin-top:2px}
.fl{font-size:14px;color:#cfd3db;margin-top:8px;line-height:1.55}
.stamp{position:absolute;top:18px;font-size:34px;font-weight:900;padding:4px 14px;border:4px solid;border-radius:12px;opacity:0;transform:rotate(-15deg)}
.yes{left:18px;color:#2bd47a;border-color:#2bd47a}.no{right:18px;color:#ff5a7a;border-color:#ff5a7a}
.bar{position:fixed;bottom:0;left:0;right:0;height:90px;display:flex;align-items:center;justify-content:center;gap:22px;background:#13141a;border-top:1px solid #2c2f3a}
.fab{width:62px;height:62px;border-radius:50%;border:none;font-size:26px;cursor:pointer;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.fab.no{background:#2a1d23;color:#ff5a7a;border:2px solid #ff5a7a}.fab.yes{background:#16271c;color:#2bd47a;border:2px solid #2bd47a}
.fab.undo{width:48px;height:48px;font-size:18px;background:#23242c;color:#cfd3db;border:1px solid #3a3f4c}
.done{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.done h2{color:#ffe27a;margin:0 0 8px}
.btn{margin-top:14px;background:#ffe27a;color:#15161a;border:none;border-radius:10px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
#out{margin-top:12px;width:min(92vw,520px);height:160px;font-family:ui-monospace,monospace;font-size:11px;display:none;background:#0b0c10;color:#cfd3db;border:1px solid #3a3f4c;border-radius:8px;padding:8px}
.hint{font-size:11px;color:#6b7280;margin-top:6px}
.toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%);background:#2bd47a;color:#08210f;padding:8px 16px;border-radius:999px;font-weight:700;opacity:0;transition:.3s;pointer-events:none}.toast.show{opacity:1}
</style></head><body>
<header><div><b>ボス選別</b> <span style="font-size:12px;color:#9aa0ad">← 無し / 有り → ・ドラッグもOK</span></div>
  <div class="count"><span id="done_n">0</span>/<span id="total_n">0</span> ・有り<span id="yes_n">0</span></div></header>
<div class="stage" id="stage">
  <div class="done" id="doneScreen">
    <h2>選別おわり！</h2>
    <div id="summary" style="color:#cfd3db"></div>
    <button class="btn" id="copyBtn">結果をコピー</button>
    <div class="hint">コピーしたテキストをチャットに貼ってください（採用の系統を学習して次の50枚へ）。</div>
    <textarea id="out" readonly></textarea>
    <button class="btn" id="restartBtn" style="background:#3a3f4c;color:#e7e7ea">最初からやり直す</button>
  </div>
</div>
<div class="bar">
  <button class="fab no" id="bNo">✗</button>
  <button class="fab undo" id="bUndo">↶</button>
  <button class="fab yes" id="bYes">♥</button>
  <button class="btn" id="bCopy" style="position:fixed;right:12px;bottom:104px;padding:8px 12px;font-size:12px">途中保存コピー</button>
</div>
<div class="toast" id="toast">コピーしました！</div>
<script>
const BOSSES=[{"id": "neutralizer-foam-newt-b10", "name_ja": "ちゅうわナメクジウオ", "tier": "序盤", "element": "中和", "flavor_ja": "酸とアルカリを一身に宿し、触れたものをぶくぶくと無害な泡へ変えてしまう。", "img": "gacha10/neutralizer-foam-newt-b10.png"}, {"id": "resonance-shrill-cricket-b10", "name_ja": "きょうめいスズムシ", "tier": "序盤", "element": "音響", "flavor_ja": "羽をこすり合わせ、空気を震わせる金切り声で獲物の骨まで鳴らす。", "img": "gacha10/resonance-shrill-cricket-b10.png"}, {"id": "quartz-cluster-scorpion-b10", "name_ja": "けっしょうサソリ", "tier": "序盤", "element": "結晶", "flavor_ja": "岩盤の隙間で何百年も育ち、全身を鉱物の鎧で覆った。鋏は一枚岩の刃。", "img": "gacha10/quartz-cluster-scorpion-b10.png"}, {"id": "prism-refraction-tortoise-b10", "name_ja": "プリズムガメ", "tier": "中盤", "element": "光学", "flavor_ja": "甲羅のプリズムで陽光を七色に砕き、目をくらます虹を全身にまとう。", "img": "gacha10/prism-refraction-tortoise-b10.png"}, {"id": "catalyst-platinum-raptor-b10", "name_ja": "しょくばいハヤブサ", "tier": "中盤", "element": "触媒", "flavor_ja": "羽そのものが触媒。空気を撫でるだけで反応を起こし、泡を散らして加速する。", "img": "gacha10/catalyst-platinum-raptor-b10.png"}, {"id": "abyssal-pressure-crab-b10", "name_ja": "しんかいアツガニ", "tier": "中盤", "element": "圧力", "flavor_ja": "深海の万力の水圧で鍛えられた殻。鋏のひと挟みで岩をも砕く。", "img": "gacha10/abyssal-pressure-crab-b10.png"}, {"id": "gravity-collapse-wraith-b10", "name_ja": "じゅうりょくのもうりょう", "tier": "終盤", "element": "重力", "flavor_ja": "おのれの重さで光すら呑み、空間を歪ませながら這い寄る亡霊。", "img": "gacha10/gravity-collapse-wraith-b10.png"}, {"id": "induction-coil-serpent-b10", "name_ja": "でんじコイルヘビ", "tier": "終盤", "element": "電磁", "flavor_ja": "巻き付いた銅線に電流を走らせ、鉄を引き寄せ磁力の渦を生む鋼の大蛇。", "img": "gacha10/induction-coil-serpent-b10.png"}, {"id": "magnetite-bulwark-golem-b10", "name_ja": "じてつのきょしん", "tier": "ラスボス級", "element": "磁力", "flavor_ja": "山ひとつぶんの磁鉄鉱が意志を持った巨神。寄り集まる鉄片が全身に羽毛のような模様を描く。", "img": "gacha10/magnetite-bulwark-golem-b10.png"}, {"id": "standing-wave-leviathan-b10", "name_ja": "きょうしんのおおかみ", "tier": "ラスボス級", "element": "音響", "flavor_ja": "咆哮が大気に定常波を刻み、城壁ごと震わせ崩す音響の巨獣。", "img": "gacha10/standing-wave-leviathan-b10.png"}, {"id": "harmonic-sphinx-resonator-b10", "name_ja": "キョウメイ・スフィンクス", "tier": "序盤", "element": "音響・共鳴", "flavor_ja": "うなり声が大気を震わせ、まとう音の輪が敵をすくませる獅子の番人。", "img": "gacha10/harmonic-sphinx-resonator-b10.png"}, {"id": "static-peryton-stag-b10", "name_ja": "セイデン・ペリュトン", "tier": "序盤", "element": "電気・静電気", "flavor_ja": "枝角に静電気をため、触れた者を痺れさせて駆ける雷の牡鹿。", "img": "gacha10/static-peryton-stag-b10.png"}, {"id": "catalyst-catoblepas-bovine-b10", "name_ja": "ショクバイ・カトブレパス", "tier": "序盤", "element": "化学・触媒", "flavor_ja": "重い頭を垂らし、泡立つ触媒の息で鉄をも溶かす鈍重な猛牛。", "img": "gacha10/catalyst-catoblepas-bovine-b10.png"}, {"id": "lodestone-nue-chimera-b10", "name_ja": "ジリョク・ヌエ", "tier": "中盤", "element": "磁力・磁石", "flavor_ja": "鉄片を引き寄せ身にまとう、夜を統べる和の合成獣。", "img": "gacha10/lodestone-nue-chimera-b10.png"}, {"id": "infrasound-baku-beast-b10", "name_ja": "テイオン・バク", "tier": "中盤", "element": "音響・低周波", "flavor_ja": "腹に響く低い唸りで眠りも士気も喰らう、夢喰いの獣。", "img": "gacha10/infrasound-baku-beast-b10.png"}, {"id": "prism-orthrus-hound-b10", "name_ja": "クッセツ・オルトロス", "tier": "中盤", "element": "光学・屈折", "flavor_ja": "二つの頭が別々の角度で光を屈折させ、敵の目を眩ます水晶の番犬。", "img": "gacha10/prism-orthrus-hound-b10.png"}, {"id": "combustion-ammit-devourer-b10", "name_ja": "ネンショウ・アミット", "tier": "終盤", "element": "燃焼・火炎", "flavor_ja": "罪も鋼も丸呑みにし、腹の炉で燃やし尽くす合成の喰らい獣。", "img": "gacha10/combustion-ammit-devourer-b10.png"}, {"id": "photon-shisa-guardian-b10", "name_ja": "コウガク・シーサー", "tier": "終盤", "element": "光学・収束光", "flavor_ja": "額のレンズに光を集め、一条の閃光で邪を払う琉球の守護獅子。", "img": "gacha10/photon-shisa-guardian-b10.png"}, {"id": "magnetar-nemean-lion-sovereign-b10", "name_ja": "ジバ・ネメアー・ライオ", "tier": "ラスボス級", "element": "磁力・重力", "flavor_ja": "鋼を肌に引き寄せ、近づく全てを己の重力場へ引き込む不滅の巨獅子。", "img": "gacha10/magnetar-nemean-lion-sovereign-b10.png"}, {"id": "plasma-garuda-thunder-sovereign-b10", "name_ja": "プラズマ・カルラ", "tier": "ラスボス級", "element": "電気・プラズマ", "flavor_ja": "翼を広げれば天が裂け、まとうプラズマで万雷を従える金翅の霊鳥。", "img": "gacha10/plasma-garuda-thunder-sovereign-b10.png"}, {"id": "voltaic-firefly-lantern-b10", "name_ja": "ハツデンボタル", "tier": "序盤", "element": "生体発電", "flavor_ja": "おしりのカプセルで光をためる小さな甲虫。たくわえた電気がたりなくなると、ちかちかと点滅して身をふるわせる。", "img": "gacha10/voltaic-firefly-lantern-b10.png"}, {"id": "lather-foam-nudibranch-b10", "name_ja": "アワダチウミウシ", "tier": "序盤", "element": "中和（弱酸弱アルカリ）", "flavor_ja": "体の右と左から色のちがう汁を出し、まざるとあわになって泡だつ。あわが消えるとき、すっぱさもからさも消えている。", "img": "gacha10/lather-foam-nudibranch-b10.png"}, {"id": "spark-cricket-skirmisher-b10", "name_ja": "ハネツキコオロギ", "tier": "序盤", "element": "静電気（摩擦）", "flavor_ja": "後ろ足をこすり合わせて火花を散らすコオロギ。鳴き声のかわりに、バチバチと放電して相手をおどす。", "img": "gacha10/spark-cricket-skirmisher-b10.png"}, {"id": "magnetide-water-scorpion-b10", "name_ja": "ジバタガメ", "tier": "中盤", "element": "磁力", "flavor_ja": "前あしが赤と青の磁石になった水辺の狩人。獲物の鉄分を引きよせ、はなさず抱えこんで離さない。", "img": "gacha10/magnetide-water-scorpion-b10.png"}, {"id": "resonance-cicada-warden-b10", "name_ja": "キョウメイゼミ", "tier": "中盤", "element": "音響（共鳴）", "flavor_ja": "腹の共鳴ぶくろをふるわせ、空気をびりびり震わせる大蝉。その鳴き声は岩をもくだく音の刃となる。", "img": "gacha10/resonance-cicada-warden-b10.png"}, {"id": "crystalline-mantis-blademaster-b10", "name_ja": "ショウエンカマキリ", "tier": "中盤", "element": "結晶（石英）", "flavor_ja": "両腕が透きとおった水晶の刃に育ったカマキリ。光をあやつり、構えたその一閃は何もかもを断ち切る。", "img": "gacha10/crystalline-mantis-blademaster-b10.png"}, {"id": "molten-alloy-longhorn-b10", "name_ja": "ガッキンカミキリ", "tier": "終盤", "element": "合金（鋳造）", "flavor_ja": "とけた金属を流しこんで鋳られた巨大なカミキリ。長い触角は鍛えぬかれた鋼のムチ、ふれれば肌は焼けただれる。", "img": "gacha10/molten-alloy-longhorn-b10.png"}, {"id": "abyssal-rot-isopod-leviathan-b10", "name_ja": "フショクダイオウグソク", "tier": "終盤", "element": "腐敗（分解菌）", "flavor_ja": "深海の闇で死がいを喰らい、分解する巨大な等脚類。甲羅のすき間からは腐敗の菌があふれ、ふれた生命を朽ちさせる。", "img": "gacha10/abyssal-rot-isopod-leviathan-b10.png"}, {"id": "gravity-well-spider-sovereign-b10", "name_ja": "インリョクオオグモ", "tier": "ラスボス級", "element": "重力", "flavor_ja": "腹に小さな重力の井戸を宿す巨大なクモ。近づくものはみな引きずりこまれ、その糸からは二度と逃れられない。", "img": "gacha10/gravity-well-spider-sovereign-b10.png"}, {"id": "plasma-storm-locust-king-b10", "name_ja": "ライメイバッタオウ", "tier": "ラスボス級", "element": "プラズマ（雷）", "flavor_ja": "群れを率い、空を黒く染める雷の蝗王。その羽ばたきは嵐を呼び、ひとたび跳ねれば大地は雷火に焼かれる。", "img": "gacha10/plasma-storm-locust-king-b10.png"}, {"id": "spore-bloom-toadling-b10", "name_ja": "ホウシダケガエル", "tier": "序盤", "element": "毒・菌類", "flavor_ja": "傘がはじけ、胞子が霧となって肺に根を張る。咳が止まらぬ者はもう仲間だ。", "img": "gacha10/spore-bloom-toadling-b10.png"}, {"id": "tumor-slug-crawler-b10", "name_ja": "コブニクナメクジ", "tier": "序盤", "element": "毒・腐敗", "flavor_ja": "踏まれても潰れぬ。コブひとつ破れるごとに、また二つ膨らむのだ。", "img": "gacha10/tumor-slug-crawler-b10.png"}, {"id": "rust-blight-rhino-beetle-b10", "name_ja": "サビグサレカブト", "tier": "序盤", "element": "酸・腐敗", "flavor_ja": "鎧は錆び、酸は滴る。突かれた傷口から、そいつの腐りが移ってゆく。", "img": "gacha10/rust-blight-rhino-beetle-b10.png"}, {"id": "cordyceps-stag-host-b10", "name_ja": "キセイツノジカ", "tier": "中盤", "element": "生物・菌類", "flavor_ja": "鹿はとうに死んでいる。歩かせているのは、角からのびた菌糸の意思だ。", "img": "gacha10/cordyceps-stag-host-b10.png"}, {"id": "leech-swarm-hydra-b10", "name_ja": "ヒルムレヒュドラ", "tier": "中盤", "element": "毒・生物", "flavor_ja": "首を斬れば、こぼれた一匹一匹が新たな頭となって這い上がる。", "img": "gacha10/leech-swarm-hydra-b10.png"}, {"id": "mycelium-warden-bear-b10", "name_ja": "キンシモリグマ", "tier": "中盤", "element": "生物・菌類", "flavor_ja": "森の番人だったもの。今は森が、こいつを内側から着ている。", "img": "gacha10/mycelium-warden-bear-b10.png"}, {"id": "viral-capsid-tick-colossus-b10", "name_ja": "ウイルスマダニオウ", "tier": "終盤", "element": "生物・変異", "flavor_ja": "六角の殻に守られた腹は、ひとつ刺せば千の感染を撒き散らす精密な工場だ。", "img": "gacha10/viral-capsid-tick-colossus-b10.png"}, {"id": "parasite-queen-wasp-broodmother-b10", "name_ja": "キセイバチノジョオウ", "tier": "終盤", "element": "毒・寄生", "flavor_ja": "刺された傷の奥で卵が孵る。気づく頃には、お前自身が巣になっている。", "img": "gacha10/parasite-queen-wasp-broodmother-b10.png"}, {"id": "necrosis-mold-leviathan-b10", "name_ja": "エシモウリヴァイア", "tier": "ラスボス級", "element": "腐敗・闇", "flavor_ja": "その身は腐敗そのものが歩く山。触れたものはみな、その肉の一部になる。", "img": "gacha10/necrosis-mold-leviathan-b10.png"}, {"id": "blight-heart-world-serpent-b10", "name_ja": "エキビョウノダイジャ", "tier": "ラスボス級", "element": "疫病・生物", "flavor_ja": "とぐろの奥で疫の心臓が脈打つ。ひと巻きごとに、世界がひとつ病んでいく。", "img": "gacha10/blight-heart-world-serpent-b10.png"}, {"id": "voltaic-bubble-axolotl-b10", "name_ja": "デンキウーパー・バブルロード", "tier": "序盤", "element": "電気・電気分解", "flavor_ja": "えらの先で水を分解して、ぷくぷくの電気アワをまとうまんまるウーパー。", "img": "gacha10/voltaic-bubble-axolotl-b10.png"}, {"id": "surface-tension-seahorse-guard-b10", "name_ja": "ヒョウメンチョウリキ・タツノオトシゴ", "tier": "序盤", "element": "物理・表面張力", "flavor_ja": "水の膜をピンと張って盾にする、まんまるしっぽのタツノオトシゴ。", "img": "gacha10/surface-tension-seahorse-guard-b10.png"}, {"id": "magnet-scale-pangolin-b10", "name_ja": "ジリョクウロコ・センザンコウ", "tier": "序盤", "element": "物理・磁力", "flavor_ja": "うろこ一枚一枚が磁石。鉄くずをびっしりまとった頼れる丸まりやさん。", "img": "gacha10/magnet-scale-pangolin-b10.png"}, {"id": "inflating-pressure-pufferfish-b10", "name_ja": "アツリョクパンパン・フグロード", "tier": "中盤", "element": "物理・圧力", "flavor_ja": "ぱんぱんに膨らんで全身トゲ。中の空気をプシューと噴く圧力のかたまり。", "img": "gacha10/inflating-pressure-pufferfish-b10.png"}, {"id": "prism-fan-chameleon-b10", "name_ja": "プリズムマント・カメレオン", "tier": "中盤", "element": "物理・光学（分光）", "flavor_ja": "うろこのプリズムで光を七色に割る、極彩色のカメレオン。", "img": "gacha10/prism-fan-chameleon-b10.png"}, {"id": "seismic-namazu-warden-b10", "name_ja": "ジシン・オオナマズ", "tier": "中盤", "element": "地学・地震（地殻変動）", "flavor_ja": "身じろぎひとつで大地を裂く、地震を司る妖怪オオナマズ。", "img": "gacha10/seismic-namazu-warden-b10.png"}, {"id": "crystal-resonance-komainu-b10", "name_ja": "スイショウ・コマイヌ", "tier": "中盤", "element": "物理・共鳴（結晶振動）", "flavor_ja": "吼えると結晶が共鳴して震える、水晶でできた守りの狛犬。", "img": "gacha10/crystal-resonance-komainu-b10.png"}, {"id": "photosynthic-kodama-titan-b10", "name_ja": "ヒカリゴケ・コダマ", "tier": "終盤", "element": "生物・光合成（植物）", "flavor_ja": "葉のひとひらまで光を喰らう、森を背負った樹の巨霊。", "img": "gacha10/photosynthic-kodama-titan-b10.png"}, {"id": "comet-ice-whale-leviathan-b10", "name_ja": "スイセイ・コオリクジラ", "tier": "終盤", "element": "地学・天体（彗星）", "flavor_ja": "凍てつく塵をまとい、尾に光の尾をひいて泳ぐ彗星の鯨。", "img": "gacha10/comet-ice-whale-leviathan-b10.png"}, {"id": "radiant-spectrum-peacock-god-b10", "name_ja": "コウサイ・ホウオウジャク", "tier": "ラスボス級", "element": "物理・光学（回折・色彩）", "flavor_ja": "羽の一枚一枚が光を曲げる、虹を統べる極彩の神鳥。", "img": "gacha10/radiant-spectrum-peacock-god-b10.png"}]; const KEY="rika2_boss_swipe_gacha10";
let st=JSON.parse(localStorage.getItem(KEY)||"null")||{idx:0,dec:{}};
function save(){localStorage.setItem(KEY,JSON.stringify(st));}
const stage=document.getElementById("stage");
document.getElementById("total_n").textContent=BOSSES.length;
let card=null,startX=0,curX=0,dragging=false;

function counts(){const y=Object.values(st.dec).filter(v=>v==="yes").length;
  document.getElementById("done_n").textContent=Object.keys(st.dec).length;
  document.getElementById("yes_n").textContent=y;}

function build(idx){
  const b=BOSSES[idx]; const el=document.createElement("div"); el.className="card";
  el.innerHTML=`<div class="stamp yes">有り</div><div class="stamp no">無し</div>
    <div class="imgbox"><img src="${b.img}" alt=""></div>
    <div class="info"><div class="nm">${b.name_ja}<span class="tier t${b.tier}">${b.tier}</span></div>
    <div class="el">${b.element}</div><div class="fl">${b.flavor_ja}</div></div>`;
  el.addEventListener("pointerdown",down); el.addEventListener("pointermove",move);
  el.addEventListener("pointerup",up); el.addEventListener("pointercancel",up);
  return el;
}
function show(){
  if(card){card.remove();card=null;}
  if(st.idx>=BOSSES.length){document.getElementById("doneScreen").style.display="flex";finish();return;}
  document.getElementById("doneScreen").style.display="none";
  card=build(st.idx); stage.appendChild(card); counts();
}
function down(e){dragging=true;startX=e.clientX;curX=0;card.setPointerCapture(e.pointerId);card.style.transition="none";}
function move(e){if(!dragging)return;curX=e.clientX-startX;card.style.transform=`translateX(${curX}px) rotate(${curX/18}deg)`;
  card.querySelector(".yes").style.opacity=Math.max(0,Math.min(1,curX/90));
  card.querySelector(".no").style.opacity=Math.max(0,Math.min(1,-curX/90));}
function up(){if(!dragging)return;dragging=false;
  if(curX>90)decide("yes");else if(curX<-90)decide("no");
  else{card.style.transition=".2s";card.style.transform="";card.querySelector(".yes").style.opacity=0;card.querySelector(".no").style.opacity=0;}}
function decide(v){
  st.dec[BOSSES[st.idx].id]=v; save();
  const dir=v==="yes"?1:-1;
  card.style.transition=".3s ease-out";
  card.style.transform=`translateX(${dir*140}vw) rotate(${dir*25}deg)`;
  card.style.opacity="0";
  setTimeout(()=>{st.idx++;save();show();},260);
}
function undo(){if(st.idx<=0)return;st.idx--;delete st.dec[BOSSES[st.idx].id];save();show();}
function summaryText(){
  const yes=BOSSES.filter(b=>st.dec[b.id]==="yes"),no=BOSSES.filter(b=>st.dec[b.id]==="no");
  let s=`=== ボス選別 結果 (有り${yes.length} / 無し${no.length} / 計${BOSSES.length}) ===\n【有り】\n`;
  yes.forEach(b=>s+=`- ${b.name_ja} (${b.tier}/${b.element}) [${b.id}]\n`);
  s+="【無し】\n"; no.forEach(b=>s+=`- ${b.name_ja} (${b.tier}/${b.element}) [${b.id}]\n`);
  return s;
}
function finish(){
  const yes=BOSSES.filter(b=>st.dec[b.id]==="yes").length;
  document.getElementById("summary").textContent=`有り ${yes} 体 / 無し ${BOSSES.length-yes} 体`;
}
function copyOut(){const s=summaryText();const o=document.getElementById("out");o.style.display="block";o.value=s;
  if(navigator.clipboard)navigator.clipboard.writeText(s).then(()=>{const t=document.getElementById("toast");t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1500);},()=>{});o.select();}
document.getElementById("bNo").onclick=()=>{if(st.idx<BOSSES.length)decide("no");};
document.getElementById("bYes").onclick=()=>{if(st.idx<BOSSES.length)decide("yes");};
document.getElementById("bUndo").onclick=undo;
document.getElementById("bCopy").onclick=copyOut;
document.getElementById("copyBtn").onclick=copyOut;
document.getElementById("restartBtn").onclick=()=>{st={idx:0,dec:{}};save();show();};
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"&&st.idx<BOSSES.length)decide("no");
  else if(e.key==="ArrowRight"&&st.idx<BOSSES.length)decide("yes");else if(e.key==="Backspace")undo();});
show();
</script></body></html>
