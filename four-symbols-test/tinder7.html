<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>ボス選別 — 理科RPG2</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0f1014;color:#e7e7ea;font-family:system-ui,"Hiragino Kaku Gothic ProN",sans-serif;overflow:hidden;height:100dvh}
header{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;background:#1a1c22;border-bottom:1px solid #2c2f3a}
header b{color:#ffe27a}.count{font-size:13px;color:#9aa0ad}
.stage{position:relative;height:calc(100dvh - 150px);display:flex;align-items:center;justify-content:center;padding:10px}
.card{position:absolute;width:min(92vw,440px);max-height:100%;background:#1d1f26;border:1px solid #2c2f3a;border-radius:18px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5);touch-action:none}
.imgbox{aspect-ratio:1/1;
  background-image:linear-gradient(45deg,#cfcfcf 25%,transparent 25%),linear-gradient(-45deg,#cfcfcf 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#cfcfcf 75%),linear-gradient(-45deg,transparent 75%,#cfcfcf 75%);
  background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0;background-color:#e9e9e9}
.imgbox img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.info{padding:12px 16px}
.nm{font-size:22px;font-weight:800}
.nm .tier{font-size:14px;font-weight:700;padding:2px 10px;border-radius:999px;margin-left:8px;vertical-align:3px}
.t序盤{background:#2bd47a;color:#06210f}.t中盤{background:#4aa3ff;color:#04203f}.t終盤{background:#ff9a3c;color:#311600}.tラスボス級{background:#ff5a7a;color:#33000d}
.el{font-size:12px;color:#9aa0ad;margin-top:2px}
.fl{font-size:14px;color:#cfd3db;margin-top:8px;line-height:1.55}
.stamp{position:absolute;top:18px;font-size:34px;font-weight:900;padding:4px 14px;border:4px solid;border-radius:12px;opacity:0;transform:rotate(-15deg)}
.yes{left:18px;color:#2bd47a;border-color:#2bd47a}.no{right:18px;color:#ff5a7a;border-color:#ff5a7a}
.bar{position:fixed;bottom:0;left:0;right:0;height:90px;display:flex;align-items:center;justify-content:center;gap:22px;background:#13141a;border-top:1px solid #2c2f3a}
.fab{width:62px;height:62px;border-radius:50%;border:none;font-size:26px;cursor:pointer;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.fab.no{background:#2a1d23;color:#ff5a7a;border:2px solid #ff5a7a}.fab.yes{background:#16271c;color:#2bd47a;border:2px solid #2bd47a}
.fab.undo{width:48px;height:48px;font-size:18px;background:#23242c;color:#cfd3db;border:1px solid #3a3f4c}
.done{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.done h2{color:#ffe27a;margin:0 0 8px}
.btn{margin-top:14px;background:#ffe27a;color:#15161a;border:none;border-radius:10px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
#out{margin-top:12px;width:min(92vw,520px);height:160px;font-family:ui-monospace,monospace;font-size:11px;display:none;background:#0b0c10;color:#cfd3db;border:1px solid #3a3f4c;border-radius:8px;padding:8px}
.hint{font-size:11px;color:#6b7280;margin-top:6px}
.toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%);background:#2bd47a;color:#08210f;padding:8px 16px;border-radius:999px;font-weight:700;opacity:0;transition:.3s;pointer-events:none}.toast.show{opacity:1}
</style></head><body>
<header><div><b>ボス選別</b> <span style="font-size:12px;color:#9aa0ad">← 無し / 有り → ・ドラッグもOK</span></div>
  <div class="count"><span id="done_n">0</span>/<span id="total_n">0</span> ・有り<span id="yes_n">0</span></div></header>
<div class="stage" id="stage">
  <div class="done" id="doneScreen">
    <h2>選別おわり！</h2>
    <div id="summary" style="color:#cfd3db"></div>
    <button class="btn" id="copyBtn">結果をコピー</button>
    <div class="hint">コピーしたテキストをチャットに貼ってください（採用の系統を学習して次の50枚へ）。</div>
    <textarea id="out" readonly></textarea>
    <button class="btn" id="restartBtn" style="background:#3a3f4c;color:#e7e7ea">最初からやり直す</button>
  </div>
</div>
<div class="bar">
  <button class="fab no" id="bNo">✗</button>
  <button class="fab undo" id="bUndo">↶</button>
  <button class="fab yes" id="bYes">♥</button>
  <button class="btn" id="bCopy" style="position:fixed;right:12px;bottom:104px;padding:8px 12px;font-size:12px">途中保存コピー</button>
</div>
<div class="toast" id="toast">コピーしました！</div>
<script>
const BOSSES=[{"id": "gearwork-iron-hound-b7", "name_ja": "ギアハウンド・コギア", "tier": "序盤", "element": "歯車", "flavor_ja": "歯車の噛み合う音が近づくと逃げ場はない。骨の代わりに回る無数のコギアが、この鉄犬を永久に走らせ続ける。", "img": "gacha7/gearwork-iron-hound-b7.png"}, {"id": "ember-furnace-cub-b7", "name_ja": "ロカコ・ファーネス", "tier": "序盤", "element": "燃焼", "flavor_ja": "腹の炉で何かを燃やし続けるかぎり、この獣は止まらない。胸の格子から漏れる赤い熱が、近づく者を炙る。", "img": "gacha7/ember-furnace-cub-b7.png"}, {"id": "static-coil-serpent-b7", "name_ja": "コイルヴァイパー・セイデン", "tier": "序盤", "element": "電気", "flavor_ja": "巻かれた銅線に電流が走るたび、青白い火花が鱗を這う。とぐろを巻いた電磁石は、触れた者を弾き飛ばす。", "img": "gacha7/static-coil-serpent-b7.png"}, {"id": "magnetar-rhino-core-b7", "name_ja": "マグネドス・ラインゴ", "tier": "中盤", "element": "磁力", "flavor_ja": "近づく金属はすべて、この獣の鎧に吸い寄せられて装甲となる。角の磁極が空間そのものを歪める。", "img": "gacha7/magnetar-rhino-core-b7.png"}, {"id": "acid-tank-salamander-b7", "name_ja": "アシッドタンク・サラマ", "tier": "中盤", "element": "酸", "flavor_ja": "背中のタンクで煮える緑の酸が、滴るたびに鉄をも溶かす。這った跡には穴だけが残る。", "img": "gacha7/acid-tank-salamander-b7.png"}, {"id": "catalyst-reactor-ape-b7", "name_ja": "カタリスト・リアクトル", "tier": "中盤", "element": "触媒", "flavor_ja": "胸の反応炉が触媒を噛むたび、見えない力が何倍にも膨れ上がる。拳の一撃は連鎖して止まらない。", "img": "gacha7/catalyst-reactor-ape-b7.png"}, {"id": "circuit-board-wyrm-b7", "name_ja": "サーキット・ワイアム", "tier": "終盤", "element": "回路", "flavor_ja": "鱗に刻まれた回路を電流が駆けめぐり、思考そのものが攻撃となる。配線の竜は計算ずくで獲物を狩る。", "img": "gacha7/circuit-board-wyrm-b7.png"}, {"id": "crucible-alloy-chimera-b7", "name_ja": "クルーシブル・キメラ", "tier": "終盤", "element": "合金", "flavor_ja": "三つの金属の頭が、坩堝の首で一つに鋳られた怪物。流れる合金が冷えるたび、傷は鎧へと変わる。", "img": "gacha7/crucible-alloy-chimera-b7.png"}, {"id": "gravity-well-leviathan-b7", "name_ja": "グラビス・レヴィオン", "tier": "ラスボス級", "element": "重力", "flavor_ja": "胸の重力炉が空間を呑み、近づくものすべてを己の鎧に押し潰す。逃げようとしても、その身が前へ引かれていく。", "img": "gacha7/gravity-well-leviathan-b7.png"}, {"id": "fusion-titan-drake-b7", "name_ja": "フュージョン・タイドレイク", "tier": "ラスボス級", "element": "炎", "flavor_ja": "胸の人工太陽が灯るとき、世界は白く焼け落ちる。封じ込めの環がきしむ音は、終末への秒読みだ。", "img": "gacha7/fusion-titan-drake-b7.png"}, {"id": "copper-circuit-wyrmling-b7", "name_ja": "ガルヴァノ・ワイバーン", "tier": "序盤", "element": "電気", "flavor_ja": "回路のように走る銅の鱗から、ぱちぱちと青い電気を漏らす幼い竜。背骨に沿って電流が流れる。", "img": "gacha7/copper-circuit-wyrmling-b7.png"}, {"id": "ember-scale-drake-b7", "name_ja": "イグニス・ドレイク", "tier": "序盤", "element": "燃焼", "flavor_ja": "黒い鱗の隙間からマグマがのぞく、ずんぐりした竜。口からは絶え間なく炎をこぼしている。", "img": "gacha7/ember-scale-drake-b7.png"}, {"id": "moss-bark-grovewyrm-b7", "name_ja": "モス・グルームワーム", "tier": "序盤", "element": "生物", "flavor_ja": "樹皮の鱗に苔やシダを生やした、森に育った和の小竜。蔓が自らの体に巻きつく。", "img": "gacha7/moss-bark-grovewyrm-b7.png"}, {"id": "magnetite-horn-behemoth-b7", "name_ja": "マグネ・ベヒモス", "tier": "中盤", "element": "磁力", "flavor_ja": "磁鉄鉱の装甲に鉄片を吸いつけた巨獣。赤青の磁石の角を持ち、青い磁場の膜が体を覆う。", "img": "gacha7/magnetite-horn-behemoth-b7.png"}, {"id": "acid-fume-hydra-b7", "name_ja": "アシッド・ヒュドラ", "tier": "中盤", "element": "酸", "flavor_ja": "三つの首から強酸を滴らせる蛇竜。垂れた酸が自らの首や胸を焼き、湯気を立てる。", "img": "gacha7/acid-fume-hydra-b7.png"}, {"id": "prism-crystal-griffon-b7", "name_ja": "プリズム・グリフォン", "tier": "中盤", "element": "光", "flavor_ja": "結晶の羽毛が光を虹に分ける気高きグリフォン。胸と翼に屈折した七色の光がまとわりつく。", "img": "gacha7/prism-crystal-griffon-b7.png"}, {"id": "abyss-pressure-leviathan-b7", "name_ja": "アビス・リヴァイアサン", "tier": "終盤", "element": "圧力", "flavor_ja": "深海の重圧をまとう巨竜。胴に密着した圧縮水の殻が、その装甲をゆがめて見せる。", "img": "gacha7/abyss-pressure-leviathan-b7.png"}, {"id": "alloy-forge-chimera-b7", "name_ja": "アロイ・キメラ", "tier": "終盤", "element": "合金", "flavor_ja": "溶けた合金から鋳られたキメラ。クロムと青銅が脈打ち、継ぎ目から鍛冶の熱が漏れる。", "img": "gacha7/alloy-forge-chimera-b7.png"}, {"id": "gravity-void-dragon-emperor-b7", "name_ja": "グラヴィス・龍帝", "tier": "ラスボス級", "element": "重力", "flavor_ja": "重力をねじ曲げる漆黒の龍帝。とぐろを巻く体に、空間をゆがめる紫の歪みがまとわりつく。", "img": "gacha7/gravity-void-dragon-emperor-b7.png"}, {"id": "catalyst-genesis-wyrm-b7", "name_ja": "カタリスト・ジェネシス", "tier": "ラスボス級", "element": "触媒", "flavor_ja": "あらゆる反応を司る白金の創世竜。背に泡立つ触媒反応の光をまとい、体表を変質させ続ける。", "img": "gacha7/catalyst-genesis-wyrm-b7.png"}, {"id": "circuit-shell-crayfish-b7", "name_ja": "カイロザリ・ガニード", "tier": "序盤", "element": "電気", "flavor_ja": "回路の刻まれた殻に微弱な電流を走らせ、ハサミの先で青い火花を散らす。触れた者の神経を痺れさせるという。", "img": "gacha7/circuit-shell-crayfish-b7.png"}, {"id": "acid-drip-trilobite-b7", "name_ja": "サンエキ・トリロ", "tier": "序盤", "element": "酸", "flavor_ja": "古い金属を溶かしながら這い進む。殻の隙間からしたたる酸が、触れたものを静かに腐らせていく。", "img": "gacha7/acid-drip-trilobite-b7.png"}, {"id": "crystal-prism-isopod-b7", "name_ja": "クリスタ・ダンゴ", "tier": "序盤", "element": "結晶", "flavor_ja": "丸まれば鉱石の塊にしか見えない重装の虫。背の紫水晶が内側からほのかに光る。", "img": "gacha7/crystal-prism-isopod-b7.png"}, {"id": "gear-claw-swimcrab-b7", "name_ja": "ハグルマ・ワタリガー", "tier": "中盤", "element": "歯車", "flavor_ja": "体じゅうの歯車が噛み合い、カチカチと時を刻みながら横ばいに迫る。ハサミの噛み合わせは鋼鉄をも砕く。", "img": "gacha7/gear-claw-swimcrab-b7.png"}, {"id": "magnet-sting-hornet-b7", "name_ja": "ジリョク・ホーネス", "tier": "中盤", "element": "磁力", "flavor_ja": "鉄粉をまとった重装のスズメバチ。磁力で金属を引き寄せ、磁化した針で甲冑ごと貫く。", "img": "gacha7/magnet-sting-hornet-b7.png"}, {"id": "catalyst-foam-mantis-b7", "name_ja": "ショクバイ・カマギス", "tier": "中盤", "element": "触媒", "flavor_ja": "鎌の表面で反応を加速させる触媒の虫。刃にまとわりつく泡が、ふれた物質を一瞬で変質させる。", "img": "gacha7/catalyst-foam-mantis-b7.png"}, {"id": "alloy-fortress-hermit-b7", "name_ja": "ガッキン・ヤドカリオン", "tier": "終盤", "element": "合金", "flavor_ja": "合金の要塞を背負って歩く巨大ヤドカリ。継ぎ目から漏れる炉の光が、その殻の中の高熱を物語る。", "img": "gacha7/alloy-fortress-hermit-b7.png"}, {"id": "optic-lens-scorpion-b7", "name_ja": "コウガク・スコルピス", "tier": "終盤", "element": "光", "flavor_ja": "全身のレンズで光を集め、尾の先に灼熱の一点を結ぶ。狙われた者は焦点の白光に焼かれる。", "img": "gacha7/optic-lens-scorpion-b7.png"}, {"id": "combustion-furnace-beetle-b7", "name_ja": "ネンショウ・カブトーガ", "tier": "ラスボス級", "element": "燃焼", "flavor_ja": "体内に炉を抱える巨大甲虫。継ぎ目から炎を噴き、灼けた角の一突きで全てを焼き尽くす。", "img": "gacha7/combustion-furnace-beetle-b7.png"}, {"id": "pressure-deepsea-tortoise-b7", "name_ja": "アツリョク・ガメイデス", "tier": "ラスボス級", "element": "圧力", "flavor_ja": "深海の水圧を殻にまとう巨獣。近づくものを押し潰す圧の膜が、その甲羅のふちにゆらめく。", "img": "gacha7/pressure-deepsea-tortoise-b7.png"}, {"id": "ember-cracked-hellhound-b7", "name_ja": "獄炎獣グレンファング", "tier": "序盤", "element": "燃焼", "flavor_ja": "ひび割れた体の奥で溶岩がたぎる地獄の番犬。吐く息は燃焼の熱で岩をも溶かす。", "img": "gacha7/ember-cracked-hellhound-b7.png"}, {"id": "bone-scarab-revenant-b7", "name_ja": "屍甲虫ネクロスカラベ", "tier": "序盤", "element": "毒", "flavor_ja": "死骸を取り込んで甲殻と化した不死の虫。継ぎ目から滴る毒は触れた草を枯らす。", "img": "gacha7/bone-scarab-revenant-b7.png"}, {"id": "cinder-imp-swarmbrute-b7", "name_ja": "煉獄鬼インフェルノブルート", "tier": "序盤", "element": "炎", "flavor_ja": "炭のようにくすぶる下級の煉獄鬼。群れて炎を撒き、灰の中から何度でも這い出る。", "img": "gacha7/cinder-imp-swarmbrute-b7.png"}, {"id": "magma-shell-tortoise-demon-b7", "name_ja": "溶岩甲鬼マグマローダ", "tier": "中盤", "element": "圧力", "flavor_ja": "山のごとき甲羅の内に溶岩を抱えた地獄の獣。重さと熱の圧で大地を陥没させる。", "img": "gacha7/magma-shell-tortoise-demon-b7.png"}, {"id": "abyssal-toxin-hydra-b7", "name_ja": "瘴毒の三首竜ペスティヒュドラ", "tier": "中盤", "element": "毒", "flavor_ja": "三つの頭から猛毒を滴らせる深淵の竜。纏う瘴気は近づく者の肺を焼く。", "img": "gacha7/abyssal-toxin-hydra-b7.png"}, {"id": "iron-gravetomb-knightbeast-b7", "name_ja": "黒鉄の墓獣グレイヴロード", "tier": "中盤", "element": "重力", "flavor_ja": "墓所の鉄鎧と化した亡者の戦獣。纏う重い闇が周囲の重力を歪め、膝を屈させる。", "img": "gacha7/iron-gravetomb-knightbeast-b7.png"}, {"id": "obsidian-crystal-wyvern-b7", "name_ja": "黒晶のワイヴァーンオブシディオン", "tier": "終盤", "element": "結晶", "flavor_ja": "黒い結晶の鎧を纏う飛竜。砕けた牙のような鱗が赤く脈打ち、咆哮で岩を割る。", "img": "gacha7/obsidian-crystal-wyvern-b7.png"}, {"id": "soulflame-acid-cerberus-b7", "name_ja": "蝕炎の獄犬ケルベロアシッド", "tier": "終盤", "element": "酸", "flavor_ja": "三つの口から溶ける酸を垂らす地獄の番犬。眼窩に灯る魂の炎が獲物を惑わす。", "img": "gacha7/soulflame-acid-cerberus-b7.png"}, {"id": "infernal-throne-archdemon-b7", "name_ja": "獄王アビスローン", "tier": "ラスボス級", "element": "闇", "flavor_ja": "煉獄の玉座より立ち上がる獄の王。割れた装甲から漏れる地獄火が、纏う闇に照り返す。", "img": "gacha7/infernal-throne-archdemon-b7.png"}, {"id": "void-rot-leviathan-b7", "name_ja": "深淵の腐獣ヴォイドリヴァイア", "tier": "ラスボス級", "element": "重力", "flavor_ja": "深淵の底で腐り続ける異形の巨獣。纏う闇が空間ごと引き寄せ、光すら呑み込む。", "img": "gacha7/void-rot-leviathan-b7.png"}, {"id": "lantern-spirit-koi-serpent-b7", "name_ja": "提灯ヒカリ蛇神", "tier": "序盤", "element": "光", "flavor_ja": "夜祭の提灯に宿った蛇の神。鱗の一枚一枚が灯となり、近づく者を温かな光で照らす。", "img": "gacha7/lantern-spirit-koi-serpent-b7.png"}, {"id": "static-spark-beetle-knight-b7", "name_ja": "帯電カブト騎甲虫", "tier": "序盤", "element": "電気", "flavor_ja": "落雷を喰らって帯電したカブトムシの王。角に走る火花は触れた相手を痺れさせる。", "img": "gacha7/static-spark-beetle-knight-b7.png"}, {"id": "rust-bog-acid-toad-b7", "name_ja": "腐酸ヒキガエル妖", "tier": "序盤", "element": "酸", "flavor_ja": "捨てられた金属を溶かし喰らう沼の妖。よだれは鉄をも溶かす強い酸。", "img": "gacha7/rust-bog-acid-toad-b7.png"}, {"id": "magnetite-twin-hydra-b7", "name_ja": "磁極ヒュドラ磁鉄竜", "tier": "中盤", "element": "磁力", "flavor_ja": "正極と負極の二つの首を持つ磁鉄の竜。引き寄せ、退ける力で獲物を絡め取る。", "img": "gacha7/magnetite-twin-hydra-b7.png"}, {"id": "gear-clockwork-wyvern-b7", "name_ja": "歯車仕掛けワイバーン", "tier": "中盤", "element": "歯車", "flavor_ja": "止まらぬ歯車で動き続ける機械竜。噛み合う無数の歯車が時を刻むように襲いくる。", "img": "gacha7/gear-clockwork-wyvern-b7.png"}, {"id": "resonance-bell-cell-jelly-b7", "name_ja": "共鳴ベル細胞クラゲ", "tier": "中盤", "element": "音", "flavor_ja": "一つの細胞がベルとなって鳴り響く生き物。震える膜の音が骨まで揺らす。", "img": "gacha7/resonance-bell-cell-jelly-b7.png"}, {"id": "gravity-well-void-leviathan-b7", "name_ja": "重力ボイド・リヴァイア", "tier": "終盤", "element": "重力", "flavor_ja": "胸の奥に潰れた星を抱く獣。近づく光も物も、その身に引き込んでいく。", "img": "gacha7/gravity-well-void-leviathan-b7.png"}, {"id": "crystal-prism-chimera-b7", "name_ja": "結晶プリズム・キメラ", "tier": "終盤", "element": "結晶", "flavor_ja": "あらゆる光を七色に砕く宝石の獣。その身は触れれば切れる無数の結晶でできている。", "img": "gacha7/crystal-prism-chimera-b7.png"}, {"id": "plasma-arc-thunder-king-b7", "name_ja": "プラズマ雷帝魔獣", "tier": "ラスボス級", "element": "電気", "flavor_ja": "雷とプラズマを身にまとう獣の王。咆哮のたび、全身から白き稲妻が奔る。", "img": "gacha7/plasma-arc-thunder-king-b7.png"}, {"id": "catalyst-alloy-world-dragon-b7", "name_ja": "触媒合金・世界竜", "tier": "ラスボス級", "element": "合金", "flavor_ja": "あらゆる反応を司る合金の世界竜。その鋼の体は触媒となり、世界の化学を統べる。", "img": "gacha7/catalyst-alloy-world-dragon-b7.png"}]; const KEY="rika2_boss_swipe_gacha7";
let st=JSON.parse(localStorage.getItem(KEY)||"null")||{idx:0,dec:{}};
function save(){localStorage.setItem(KEY,JSON.stringify(st));}
const stage=document.getElementById("stage");
document.getElementById("total_n").textContent=BOSSES.length;
let card=null,startX=0,curX=0,dragging=false;

function counts(){const y=Object.values(st.dec).filter(v=>v==="yes").length;
  document.getElementById("done_n").textContent=Object.keys(st.dec).length;
  document.getElementById("yes_n").textContent=y;}

function build(idx){
  const b=BOSSES[idx]; const el=document.createElement("div"); el.className="card";
  el.innerHTML=`<div class="stamp yes">有り</div><div class="stamp no">無し</div>
    <div class="imgbox"><img src="${b.img}" alt=""></div>
    <div class="info"><div class="nm">${b.name_ja}<span class="tier t${b.tier}">${b.tier}</span></div>
    <div class="el">${b.element}</div><div class="fl">${b.flavor_ja}</div></div>`;
  el.addEventListener("pointerdown",down); el.addEventListener("pointermove",move);
  el.addEventListener("pointerup",up); el.addEventListener("pointercancel",up);
  return el;
}
function show(){
  if(card){card.remove();card=null;}
  if(st.idx>=BOSSES.length){document.getElementById("doneScreen").style.display="flex";finish();return;}
  document.getElementById("doneScreen").style.display="none";
  card=build(st.idx); stage.appendChild(card); counts();
}
function down(e){dragging=true;startX=e.clientX;curX=0;card.setPointerCapture(e.pointerId);card.style.transition="none";}
function move(e){if(!dragging)return;curX=e.clientX-startX;card.style.transform=`translateX(${curX}px) rotate(${curX/18}deg)`;
  card.querySelector(".yes").style.opacity=Math.max(0,Math.min(1,curX/90));
  card.querySelector(".no").style.opacity=Math.max(0,Math.min(1,-curX/90));}
function up(){if(!dragging)return;dragging=false;
  if(curX>90)decide("yes");else if(curX<-90)decide("no");
  else{card.style.transition=".2s";card.style.transform="";card.querySelector(".yes").style.opacity=0;card.querySelector(".no").style.opacity=0;}}
function decide(v){
  st.dec[BOSSES[st.idx].id]=v; save();
  const dir=v==="yes"?1:-1;
  card.style.transition=".3s ease-out";
  card.style.transform=`translateX(${dir*140}vw) rotate(${dir*25}deg)`;
  card.style.opacity="0";
  setTimeout(()=>{st.idx++;save();show();},260);
}
function undo(){if(st.idx<=0)return;st.idx--;delete st.dec[BOSSES[st.idx].id];save();show();}
function summaryText(){
  const yes=BOSSES.filter(b=>st.dec[b.id]==="yes"),no=BOSSES.filter(b=>st.dec[b.id]==="no");
  let s=`=== ボス選別 結果 (有り${yes.length} / 無し${no.length} / 計${BOSSES.length}) ===\n【有り】\n`;
  yes.forEach(b=>s+=`- ${b.name_ja} (${b.tier}/${b.element}) [${b.id}]\n`);
  s+="【無し】\n"; no.forEach(b=>s+=`- ${b.name_ja} (${b.tier}/${b.element}) [${b.id}]\n`);
  return s;
}
function finish(){
  const yes=BOSSES.filter(b=>st.dec[b.id]==="yes").length;
  document.getElementById("summary").textContent=`有り ${yes} 体 / 無し ${BOSSES.length-yes} 体`;
}
function copyOut(){const s=summaryText();const o=document.getElementById("out");o.style.display="block";o.value=s;
  if(navigator.clipboard)navigator.clipboard.writeText(s).then(()=>{const t=document.getElementById("toast");t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1500);},()=>{});o.select();}
document.getElementById("bNo").onclick=()=>{if(st.idx<BOSSES.length)decide("no");};
document.getElementById("bYes").onclick=()=>{if(st.idx<BOSSES.length)decide("yes");};
document.getElementById("bUndo").onclick=undo;
document.getElementById("bCopy").onclick=copyOut;
document.getElementById("copyBtn").onclick=copyOut;
document.getElementById("restartBtn").onclick=()=>{st={idx:0,dec:{}};save();show();};
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"&&st.idx<BOSSES.length)decide("no");
  else if(e.key==="ArrowRight"&&st.idx<BOSSES.length)decide("yes");else if(e.key==="Backspace")undo();});
show();
</script></body></html>
