<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>ボス選別 — 理科RPG2</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0f1014;color:#e7e7ea;font-family:system-ui,"Hiragino Kaku Gothic ProN",sans-serif;overflow:hidden;height:100dvh}
header{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;background:#1a1c22;border-bottom:1px solid #2c2f3a}
header b{color:#ffe27a}.count{font-size:13px;color:#9aa0ad}
.stage{position:relative;height:calc(100dvh - 150px);display:flex;align-items:center;justify-content:center;padding:10px}
.card{position:absolute;width:min(92vw,440px);max-height:100%;background:#1d1f26;border:1px solid #2c2f3a;border-radius:18px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5);touch-action:none}
.imgbox{aspect-ratio:1/1;
  background-image:linear-gradient(45deg,#cfcfcf 25%,transparent 25%),linear-gradient(-45deg,#cfcfcf 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#cfcfcf 75%),linear-gradient(-45deg,transparent 75%,#cfcfcf 75%);
  background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0;background-color:#e9e9e9}
.imgbox img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.info{padding:12px 16px}
.nm{font-size:22px;font-weight:800}
.nm .tier{font-size:14px;font-weight:700;padding:2px 10px;border-radius:999px;margin-left:8px;vertical-align:3px}
.t序盤{background:#2bd47a;color:#06210f}.t中盤{background:#4aa3ff;color:#04203f}.t終盤{background:#ff9a3c;color:#311600}.tラスボス級{background:#ff5a7a;color:#33000d}
.el{font-size:12px;color:#9aa0ad;margin-top:2px}
.fl{font-size:14px;color:#cfd3db;margin-top:8px;line-height:1.55}
.stamp{position:absolute;top:18px;font-size:34px;font-weight:900;padding:4px 14px;border:4px solid;border-radius:12px;opacity:0;transform:rotate(-15deg)}
.yes{left:18px;color:#2bd47a;border-color:#2bd47a}.no{right:18px;color:#ff5a7a;border-color:#ff5a7a}
.bar{position:fixed;bottom:0;left:0;right:0;height:90px;display:flex;align-items:center;justify-content:center;gap:22px;background:#13141a;border-top:1px solid #2c2f3a}
.fab{width:62px;height:62px;border-radius:50%;border:none;font-size:26px;cursor:pointer;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.fab.no{background:#2a1d23;color:#ff5a7a;border:2px solid #ff5a7a}.fab.yes{background:#16271c;color:#2bd47a;border:2px solid #2bd47a}
.fab.undo{width:48px;height:48px;font-size:18px;background:#23242c;color:#cfd3db;border:1px solid #3a3f4c}
.done{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.done h2{color:#ffe27a;margin:0 0 8px}
.btn{margin-top:14px;background:#ffe27a;color:#15161a;border:none;border-radius:10px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
#out{margin-top:12px;width:min(92vw,520px);height:160px;font-family:ui-monospace,monospace;font-size:11px;display:none;background:#0b0c10;color:#cfd3db;border:1px solid #3a3f4c;border-radius:8px;padding:8px}
.hint{font-size:11px;color:#6b7280;margin-top:6px}
.toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%);background:#2bd47a;color:#08210f;padding:8px 16px;border-radius:999px;font-weight:700;opacity:0;transition:.3s;pointer-events:none}.toast.show{opacity:1}
</style></head><body>
<header><div><b>ボス選別</b> <span style="font-size:12px;color:#9aa0ad">← 無し / 有り → ・ドラッグもOK</span></div>
  <div class="count"><span id="done_n">0</span>/<span id="total_n">0</span> ・有り<span id="yes_n">0</span></div></header>
<div class="stage" id="stage">
  <div class="done" id="doneScreen">
    <h2>選別おわり！</h2>
    <div id="summary" style="color:#cfd3db"></div>
    <button class="btn" id="copyBtn">結果をコピー</button>
    <div class="hint">コピーしたテキストをチャットに貼ってください（採用の系統を学習して次の50枚へ）。</div>
    <textarea id="out" readonly></textarea>
    <button class="btn" id="restartBtn" style="background:#3a3f4c;color:#e7e7ea">最初からやり直す</button>
  </div>
</div>
<div class="bar">
  <button class="fab no" id="bNo">✗</button>
  <button class="fab undo" id="bUndo">↶</button>
  <button class="fab yes" id="bYes">♥</button>
  <button class="btn" id="bCopy" style="position:fixed;right:12px;bottom:104px;padding:8px 12px;font-size:12px">途中保存コピー</button>
</div>
<div class="toast" id="toast">コピーしました！</div>
<script>
const BOSSES=[{"id": "acid-droplet-slime-b18", "name_ja": "とけとけスライム", "tier": "序盤", "element": "酸", "flavor_ja": "ふれたものをじわっと溶かす、いちばん基本の酸スライム。胃液みたいなにおいがする。", "img": "gacha_b18/acid-droplet-slime-b18.png"}, {"id": "jelly-bubble-blob-b18", "name_ja": "あわあわゼリー", "tier": "序盤", "element": "空気", "flavor_ja": "中にいっぱいの空気つぶ。つつくとぷるぷる震えて泡を出す、いちばん弱い相手。", "img": "gacha_b18/jelly-bubble-blob-b18.png"}, {"id": "mud-ooze-creeper-b18", "name_ja": "どろどろウーズ", "tier": "序盤", "element": "土", "flavor_ja": "地面からにじみ出た泥のかたまり。のろいけど踏ん張りが強い、序盤の壁役。", "img": "gacha_b18/mud-ooze-creeper-b18.png"}, {"id": "magnet-ferrofluid-slime-b18", "name_ja": "じせいスライム", "tier": "中盤", "element": "磁性", "flavor_ja": "磁石に反応してトゲトゲに逆立つ黒い流体。S極とN極で形を変える、中盤の変則スライム。", "img": "gacha_b18/magnet-ferrofluid-slime-b18.png"}, {"id": "crystal-geode-slime-b18", "name_ja": "けっしょうスライム", "tier": "中盤", "element": "結晶", "flavor_ja": "体の中から鉱物の結晶が育っていくスライム。割ると中はジオードのよう。中盤の硬い相手。", "img": "gacha_b18/crystal-geode-slime-b18.png"}, {"id": "metal-mercury-puddle-b18", "name_ja": "はがねスライム", "tier": "中盤", "element": "金属", "flavor_ja": "室温で液体の金属でできた、つるつる鏡面のスライム。攻撃をはじき返す、中盤の硬骨漢。", "img": "gacha_b18/metal-mercury-puddle-b18.png"}, {"id": "toxic-sludge-king-b18", "name_ja": "どくおうウーズ", "tier": "終盤", "element": "毒", "flavor_ja": "よどんだ毒の沼が意思を持った巨大ウーズ。触れたものを汚染する、終盤の汚れたボス。", "img": "gacha_b18/toxic-sludge-king-b18.png"}, {"id": "lava-magma-slime-b18", "name_ja": "ようがんスライム", "tier": "終盤", "element": "溶岩", "flavor_ja": "火山の溶岩がどろりと固まりかけて目覚めた巨大スライム。表面は冷えて中は灼熱、終盤の重量級ボス。", "img": "gacha_b18/lava-magma-slime-b18.png"}, {"id": "prism-crystal-overlord-b18", "name_ja": "プリズムスライム王", "tier": "ラスボス級", "element": "結晶・光", "flavor_ja": "あらゆる鉱物と光を取り込んで君臨する結晶スライムの王。光を曲げて七色に砕く、終局の支配者。", "img": "gacha_b18/prism-crystal-overlord-b18.png"}, {"id": "primordial-ooze-titan-b18", "name_ja": "げんしょのスライム", "tier": "ラスボス級", "element": "原初", "flavor_ja": "すべてのスライムの源流、星が生まれる前の原始の海から這い出た超巨大ウーズ。あらゆる属性を呑み込む、真の終焉。", "img": "gacha_b18/primordial-ooze-titan-b18.png"}, {"id": "spark-tail-kobold-b18", "name_ja": "ビリかみコボルト", "tier": "序盤", "element": "電気", "flavor_ja": "銅のコイルを腕に巻いた小鬼。槍先にパチパチと静電気をためて突いてくる。群れで湧く序盤の定番。", "img": "gacha_b18/spark-tail-kobold-b18.png"}, {"id": "acid-pot-goblin-b18", "name_ja": "すっぱつぼゴブリン", "tier": "序盤", "element": "化学", "flavor_ja": "胸に酸の壺を縛りつけた小鬼。あふれた酸を投げつけてくる。割ると壺ごと弾けて道連れに。", "img": "gacha_b18/acid-pot-goblin-b18.png"}, {"id": "gear-scrap-imp-b18", "name_ja": "ハグルマこおに", "tier": "序盤", "element": "物理", "flavor_ja": "拾った歯車をボルトで体に打ちつけたチビ鬼。ゼンマイ仕掛けでガチャガチャ動く。理科の力学の入門役。", "img": "gacha_b18/gear-scrap-imp-b18.png"}, {"id": "magnet-fist-orc-b18", "name_ja": "じりょくオーク", "tier": "中盤", "element": "磁力", "flavor_ja": "両拳を巨大な磁石にしたオーク。落ちた鉄くずを腕に吸いつけ、鉄の鎧をまとって殴る。N極S極を狙え。", "img": "gacha_b18/magnet-fist-orc-b18.png"}, {"id": "ember-bellows-goblin-b18", "name_ja": "ふいごゴブリン", "tier": "中盤", "element": "火/燃焼", "flavor_ja": "背中のふいごで炉に風を送り、肩の口火から炎を吹くゴブリン鍛冶。燃焼の単元を背負った中ボス格。", "img": "gacha_b18/ember-bellows-goblin-b18.png"}, {"id": "crystal-shard-kobold-pack-b18", "name_ja": "けっしょうコボルト", "tier": "中盤", "element": "鉱物/結晶", "flavor_ja": "体から結晶が生えたコボルト。結晶のツルハシで鉱脈を掘る。鉱物・地学の入り口になる群れの敵。", "img": "gacha_b18/crystal-shard-kobold-pack-b18.png"}, {"id": "voltaic-pile-warlord-b18", "name_ja": "でんちオーガ", "tier": "終盤", "element": "電気", "flavor_ja": "胸に電池の山を組みこんだ大鬼の頭目。銅と亜鉛から電気をしぼり、雷をまとった鉄棍をふるう。電池の単元の壁。", "img": "gacha_b18/voltaic-pile-warlord-b18.png"}, {"id": "catalyst-alchemist-hobgoblin-b18", "name_ja": "れんきんホブゴブリン", "tier": "終盤", "element": "化学/触媒", "flavor_ja": "背に蒸留器をしょったゴブリンの錬金術師。触媒で薬液を反応させ、毒や酸を作り出す終盤の幹部。", "img": "gacha_b18/catalyst-alchemist-hobgoblin-b18.png"}, {"id": "iron-titan-goblin-king-b18", "name_ja": "てつのゴブリンキング", "tier": "ラスボス級", "element": "物理/合金", "flavor_ja": "歯車仕掛けの鉄鎧で全身を固めた小鬼の王。巨体を蒸気と歯車で動かし、ひと振りで城門を砕く。小鬼軍団の総大将。", "img": "gacha_b18/iron-titan-goblin-king-b18.png"}, {"id": "thunderforge-orc-emperor-b18", "name_ja": "らいてつオーク帝", "tier": "ラスボス級", "element": "電磁/物理", "flavor_ja": "電磁石の肩当てから雷をしぼり、鉄槌に蓄える大鬼の帝王。磁力で鉄くずを吸い、雷光をまとって君臨する終局の敵。", "img": "gacha_b18/thunderforge-orc-emperor-b18.png"}, {"id": "rust-pebble-golem-b18", "name_ja": "サビ石ゴーレム", "tier": "序盤", "element": "鉄", "flavor_ja": "川原の石が鉄サビにくっつかれて立ち上がった、ずんぐり岩のゴーレム。殴ると赤い粉がほろほろ落ちる。", "img": "gacha_b18/rust-pebble-golem-b18.png"}, {"id": "salt-crystal-sentry-b18", "name_ja": "塩クリスタル番兵", "tier": "序盤", "element": "結晶", "flavor_ja": "立方体の塩のかたまりを積み上げた番兵。割れた断面まできっちり四角いのが理科ポイント。", "img": "gacha_b18/salt-crystal-sentry-b18.png"}, {"id": "circuit-scrap-imp-b18", "name_ja": "回路スクラップ小鬼", "tier": "序盤", "element": "回路", "flavor_ja": "捨てられた基板や銅線が組み合わさって生まれた小鬼。通電すると胸のLEDがチカチカ光る。", "img": "gacha_b18/circuit-scrap-imp-b18.png"}, {"id": "lava-shell-brute-b18", "name_ja": "溶岩殻ブルート", "tier": "中盤", "element": "溶岩", "flavor_ja": "冷えて固まった黒い岩の鎧の下で、まだマグマが煮えたぎる重量級ゴーレム。割れ目から熱がにじむ。", "img": "gacha_b18/lava-shell-brute-b18.png"}, {"id": "magnetite-warden-b18", "name_ja": "磁鉄ウォーデン", "tier": "中盤", "element": "磁鉄", "flavor_ja": "磁鉄鉱の体に砂鉄と釘がびっしり吸い付いた門番。近づくと体毛のように鉄くずが逆立つ。", "img": "gacha_b18/magnetite-warden-b18.png"}, {"id": "gear-clockwork-knight-b18", "name_ja": "歯車クロックワーク騎士", "tier": "中盤", "element": "合金", "flavor_ja": "中身がぜんまい仕掛けの動く鎧の騎士。胸の歯車がカチカチ噛み合い、止まるとぜんまいを巻き直す。", "img": "gacha_b18/gear-clockwork-knight-b18.png"}, {"id": "quartz-spire-colossus-b18", "name_ja": "石英スパイア・コロッサス", "tier": "終盤", "element": "結晶", "flavor_ja": "岩盤に巨大な石英の結晶が突き出した山のようなコロッサス。胸の結晶コアが脈打って光る。", "img": "gacha_b18/quartz-spire-colossus-b18.png"}, {"id": "alloy-fortress-gargoyle-b18", "name_ja": "合金フォートレス・ガーゴイル", "tier": "終盤", "element": "合金", "flavor_ja": "高強度合金で鋳造された要塞のような重ガーゴイル。翼は広げず背に畳み、塊として身構える。", "img": "gacha_b18/alloy-fortress-gargoyle-b18.png"}, {"id": "molten-core-titan-b18", "name_ja": "溶融コア・タイタン", "tier": "ラスボス級", "element": "溶岩", "flavor_ja": "黒いスラグの装甲の奥で金属が白熱するまで燃え続ける巨神。亀裂から溶けた金属の川が流れる。", "img": "gacha_b18/molten-core-titan-b18.png"}, {"id": "primordial-mantle-sovereign-b18", "name_ja": "原初マントル・ソヴリン", "tier": "ラスボス級", "element": "結晶", "flavor_ja": "地球の奥深く、岩石・金属・結晶・マグマすべてを取り込んで君臨する大地の王。胸の結晶コアが世界の鼓動のように光る。", "img": "gacha_b18/primordial-mantle-sovereign-b18.png"}, {"id": "bone-rattle-hound-b18", "name_ja": "ガラガラホネイヌ", "tier": "序盤", "element": "闇", "flavor_ja": "墓場をうろつく骨だけの番犬。あばらのすき間から青白い霊気をにじませ、近づく者にカタカタと牙を鳴らす。序盤に立ちはだかる最初の不死獣。", "img": "gacha_b18/bone-rattle-hound-b18.png"}, {"id": "venom-crawl-skull-spider-b18", "name_ja": "ドクズイクモ", "tier": "序盤", "element": "毒", "flavor_ja": "われた頭がい骨を腹に背負う骨の蜘蛛。八本の脚で地をつかみ、紫の毒液をしたたらせながらにじり寄る。かみつかれると毒がまわる序盤の難敵。", "img": "gacha_b18/venom-crawl-skull-spider-b18.png"}, {"id": "frost-grave-imp-b18", "name_ja": "コオリボウズ", "tier": "序盤", "element": "氷", "flavor_ja": "墓の冷気から生まれた小さな亡霊。ちぢこまった体に霜をまとい、ふれると芯まで凍えるつめたい息をはく。序盤の足止め役。", "img": "gacha_b18/frost-grave-imp-b18.png"}, {"id": "plague-bone-vulture-b18", "name_ja": "エキビョウガラス", "tier": "中盤", "element": "毒", "flavor_ja": "腐肉をついばむ骨のはげ鷹。折りたたんだ翼から病の瘴気をたれ流し、くちばしの先から黒い毒液をしたたらせる。中盤の疫病使い。", "img": "gacha_b18/plague-bone-vulture-b18.png"}, {"id": "obsidian-wraith-knight-b18", "name_ja": "コクヨウムシャ", "tier": "中盤", "element": "闇", "flavor_ja": "黒曜石の鎧をまとった亡霊の騎士。かぶとのおくで紫の鬼火がゆれ、よろいのすき間から影がにじみ出る。剣を地に突き立て静かに待ちかまえる中盤の壁。", "img": "gacha_b18/obsidian-wraith-knight-b18.png"}, {"id": "graviton-tomb-golem-b18", "name_ja": "オモシボセキ", "tier": "中盤", "element": "重力", "flavor_ja": "墓石と骨が押し固まって生まれた重い石像の魔物。まわりの空気すらおのれに引き寄せ、にぶい一撃で大地を沈める。中盤に重くのしかかる墓守。", "img": "gacha_b18/graviton-tomb-golem-b18.png"}, {"id": "soul-lantern-revenant-b18", "name_ja": "タマシイランタン", "tier": "終盤", "element": "闇", "flavor_ja": "あつめた魂を鉄のランタンに閉じこめる骨の魔導士。ぼろぼろの喪服から青い燐光をくゆらせ、しずかに死者の力をあやつる。終盤の知略の亡霊。", "img": "gacha_b18/soul-lantern-revenant-b18.png"}, {"id": "permafrost-bone-mammoth-b18", "name_ja": "ヒョウケツマンモス", "tier": "終盤", "element": "氷", "flavor_ja": "氷河からよみがえった骨のマンモス。あばらに氷をつめこみ、踏みしめるたびに大地を凍てつかせる。すべてを白く閉ざす終盤の巨獣。", "img": "gacha_b18/permafrost-bone-mammoth-b18.png"}, {"id": "abyss-throne-deathlord-b18", "name_ja": "メイフメツノオウ", "tier": "ラスボス級", "element": "闇", "flavor_ja": "無数の頭がい骨を玉座にした不死の王。四本の腕で死の軍勢をしたがえ、眼窩には冥府の紫炎がもえる。すべての亡者を統べるラスボス級の支配者。", "img": "gacha_b18/abyss-throne-deathlord-b18.png"}, {"id": "gravewell-void-dragon-b18", "name_ja": "シボウリュウ", "tier": "ラスボス級", "element": "重力", "flavor_ja": "死の引力をその身に宿す骨の古竜。胸の奥にうずまく虚空がすべてを飲みこみ、翼をたたんで地をつかむ。世界を押しつぶすラスボス級の終焉竜。", "img": "gacha_b18/gravewell-void-dragon-b18.png"}, {"id": "ember-whelp-dragon-b18", "name_ja": "ねつぼうりゅう（熱暴竜）", "tier": "序盤", "element": "火", "flavor_ja": "体温が上がりすぎた幼い竜。熱が体表から逃げる様子は『発熱』そのもの。割れたウロコの間から熱気がもれる。", "img": "gacha_b18/ember-whelp-dragon-b18.png"}, {"id": "fledge-griffon-b18", "name_ja": "かぜきりワシジシ（風斬鷲獅子）", "tier": "序盤", "element": "風", "flavor_ja": "翼の周りの空気の流れが見える幼いグリフォン。風がはねを伝う様子で空気の動きを学ぶ。", "img": "gacha_b18/fledge-griffon-b18.png"}, {"id": "crystal-cockatrice-b18", "name_ja": "けっしょうトリヘビ（結晶鶏蛇）", "tier": "序盤", "element": "地", "flavor_ja": "石化のにらみのかわりに、体の表面に鉱物の結晶が育つコカトリス。結晶のでき方を見せる。", "img": "gacha_b18/crystal-cockatrice-b18.png"}, {"id": "static-manticore-b18", "name_ja": "せいでんマンティコア（静電獅子）", "tier": "中盤", "element": "雷", "flavor_ja": "毛が逆立ち、体に静電気をまとうマンティコア。たまった電気が体表で放電する。", "img": "gacha_b18/static-manticore-b18.png"}, {"id": "mire-cerberus-b18", "name_ja": "どろぬまケルベロス（泥沼番犬）", "tier": "中盤", "element": "水", "flavor_ja": "三つの頭をもつ泥沼の番犬。水が泥をふくみ流れ落ちる様子で、水のはたらきを学ぶ。", "img": "gacha_b18/mire-cerberus-b18.png"}, {"id": "fungal-minotaur-b18", "name_ja": "ほうしミノタウロス（胞子牛人）", "tier": "中盤", "element": "毒", "flavor_ja": "体に菌類が生え、胞子をまとう牛頭の戦士。菌のふえ方と胞子のはたらきを示す。", "img": "gacha_b18/fungal-minotaur-b18.png"}, {"id": "magma-chimera-b18", "name_ja": "ようがんキメラ（溶岩混獣）", "tier": "終盤", "element": "火", "flavor_ja": "体に溶岩の割れ目が走る三つ首のキメラ。冷え固まる岩とマグマで火山と岩石を学ぶ。", "img": "gacha_b18/magma-chimera-b18.png"}, {"id": "frost-wyvern-b18", "name_ja": "れいきワイバーン（冷気飛竜）", "tier": "終盤", "element": "氷", "flavor_ja": "体表に霜と氷をまとう飛竜。吐く息が白くこおる様子で、状態変化と熱を学ぶ。", "img": "gacha_b18/frost-wyvern-b18.png"}, {"id": "thunder-dragon-sovereign-b18", "name_ja": "らいていりゅうおう（雷帝竜王）", "tier": "ラスボス級", "element": "雷", "flavor_ja": "雷をその身にまとう竜の王。全身を走る稲妻で、電流・電圧・放電のすべてを支配する。", "img": "gacha_b18/thunder-dragon-sovereign-b18.png"}, {"id": "verdant-cockatrice-tyrant-b18", "name_ja": "しんらコカトリス（森羅鶏蛇帝）", "tier": "ラスボス級", "element": "地", "flavor_ja": "石化のひとにらみで森も岩も支配するコカトリスの帝王。生命と鉱物が同居する終局の幻獣。", "img": "gacha_b18/verdant-cockatrice-tyrant-b18.png"}]; const KEY="rika2_boss_swipe_gacha_b18";
let st=JSON.parse(localStorage.getItem(KEY)||"null")||{idx:0,dec:{}};
function save(){localStorage.setItem(KEY,JSON.stringify(st));}
const stage=document.getElementById("stage");
document.getElementById("total_n").textContent=BOSSES.length;
let card=null,startX=0,curX=0,dragging=false;

function counts(){const y=Object.values(st.dec).filter(v=>v==="yes").length;
  document.getElementById("done_n").textContent=Object.keys(st.dec).length;
  document.getElementById("yes_n").textContent=y;}

function build(idx){
  const b=BOSSES[idx]; const el=document.createElement("div"); el.className="card";
  el.innerHTML=`<div class="stamp yes">有り</div><div class="stamp no">無し</div>
    <div class="imgbox"><img src="${b.img}" alt=""></div>
    <div class="info"><div class="nm">${b.name_ja}<span class="tier t${b.tier}">${b.tier}</span></div>
    <div class="el">${b.element}</div><div class="fl">${b.flavor_ja}</div></div>`;
  el.addEventListener("pointerdown",down); el.addEventListener("pointermove",move);
  el.addEventListener("pointerup",up); el.addEventListener("pointercancel",up);
  return el;
}
function show(){
  if(card){card.remove();card=null;}
  if(st.idx>=BOSSES.length){document.getElementById("doneScreen").style.display="flex";finish();return;}
  document.getElementById("doneScreen").style.display="none";
  card=build(st.idx); stage.appendChild(card); counts();
}
function down(e){dragging=true;startX=e.clientX;curX=0;card.setPointerCapture(e.pointerId);card.style.transition="none";}
function move(e){if(!dragging)return;curX=e.clientX-startX;card.style.transform=`translateX(${curX}px) rotate(${curX/18}deg)`;
  card.querySelector(".yes").style.opacity=Math.max(0,Math.min(1,curX/90));
  card.querySelector(".no").style.opacity=Math.max(0,Math.min(1,-curX/90));}
function up(){if(!dragging)return;dragging=false;
  if(curX>90)decide("yes");else if(curX<-90)decide("no");
  else{card.style.transition=".2s";card.style.transform="";card.querySelector(".yes").style.opacity=0;card.querySelector(".no").style.opacity=0;}}
function decide(v){
  st.dec[BOSSES[st.idx].id]=v; save();
  const dir=v==="yes"?1:-1;
  card.style.transition=".3s ease-out";
  card.style.transform=`translateX(${dir*140}vw) rotate(${dir*25}deg)`;
  card.style.opacity="0";
  setTimeout(()=>{st.idx++;save();show();},260);
}
function undo(){if(st.idx<=0)return;st.idx--;delete st.dec[BOSSES[st.idx].id];save();show();}
function summaryText(){
  const yes=BOSSES.filter(b=>st.dec[b.id]==="yes"),no=BOSSES.filter(b=>st.dec[b.id]==="no");
  let s=`=== ボス選別 結果 (有り${yes.length} / 無し${no.length} / 計${BOSSES.length}) ===\n【有り】\n`;
  yes.forEach(b=>s+=`- ${b.name_ja} (${b.tier}/${b.element}) [${b.id}]\n`);
  s+="【無し】\n"; no.forEach(b=>s+=`- ${b.name_ja} (${b.tier}/${b.element}) [${b.id}]\n`);
  return s;
}
function finish(){
  const yes=BOSSES.filter(b=>st.dec[b.id]==="yes").length;
  document.getElementById("summary").textContent=`有り ${yes} 体 / 無し ${BOSSES.length-yes} 体`;
}
function copyOut(){const s=summaryText();const o=document.getElementById("out");o.style.display="block";o.value=s;
  if(navigator.clipboard)navigator.clipboard.writeText(s).then(()=>{const t=document.getElementById("toast");t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1500);},()=>{});o.select();}
document.getElementById("bNo").onclick=()=>{if(st.idx<BOSSES.length)decide("no");};
document.getElementById("bYes").onclick=()=>{if(st.idx<BOSSES.length)decide("yes");};
document.getElementById("bUndo").onclick=undo;
document.getElementById("bCopy").onclick=copyOut;
document.getElementById("copyBtn").onclick=copyOut;
document.getElementById("restartBtn").onclick=()=>{st={idx:0,dec:{}};save();show();};
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"&&st.idx<BOSSES.length)decide("no");
  else if(e.key==="ArrowRight"&&st.idx<BOSSES.length)decide("yes");else if(e.key==="Backspace")undo();});
show();
</script></body></html>
