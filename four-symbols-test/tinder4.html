<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>ボス選別 — 理科RPG2</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0f1014;color:#e7e7ea;font-family:system-ui,"Hiragino Kaku Gothic ProN",sans-serif;overflow:hidden;height:100dvh}
header{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;background:#1a1c22;border-bottom:1px solid #2c2f3a}
header b{color:#ffe27a}.count{font-size:13px;color:#9aa0ad}
.stage{position:relative;height:calc(100dvh - 150px);display:flex;align-items:center;justify-content:center;padding:10px}
.card{position:absolute;width:min(92vw,440px);max-height:100%;background:#1d1f26;border:1px solid #2c2f3a;border-radius:18px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5);touch-action:none}
.imgbox{aspect-ratio:1/1;
  background-image:linear-gradient(45deg,#cfcfcf 25%,transparent 25%),linear-gradient(-45deg,#cfcfcf 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#cfcfcf 75%),linear-gradient(-45deg,transparent 75%,#cfcfcf 75%);
  background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0;background-color:#e9e9e9}
.imgbox img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.info{padding:12px 16px}
.nm{font-size:22px;font-weight:800}
.nm .tier{font-size:14px;font-weight:700;padding:2px 10px;border-radius:999px;margin-left:8px;vertical-align:3px}
.t序盤{background:#2bd47a;color:#06210f}.t中盤{background:#4aa3ff;color:#04203f}.t終盤{background:#ff9a3c;color:#311600}.tラスボス級{background:#ff5a7a;color:#33000d}
.el{font-size:12px;color:#9aa0ad;margin-top:2px}
.fl{font-size:14px;color:#cfd3db;margin-top:8px;line-height:1.55}
.stamp{position:absolute;top:18px;font-size:34px;font-weight:900;padding:4px 14px;border:4px solid;border-radius:12px;opacity:0;transform:rotate(-15deg)}
.yes{left:18px;color:#2bd47a;border-color:#2bd47a}.no{right:18px;color:#ff5a7a;border-color:#ff5a7a}
.bar{position:fixed;bottom:0;left:0;right:0;height:90px;display:flex;align-items:center;justify-content:center;gap:22px;background:#13141a;border-top:1px solid #2c2f3a}
.fab{width:62px;height:62px;border-radius:50%;border:none;font-size:26px;cursor:pointer;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.fab.no{background:#2a1d23;color:#ff5a7a;border:2px solid #ff5a7a}.fab.yes{background:#16271c;color:#2bd47a;border:2px solid #2bd47a}
.fab.undo{width:48px;height:48px;font-size:18px;background:#23242c;color:#cfd3db;border:1px solid #3a3f4c}
.done{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.done h2{color:#ffe27a;margin:0 0 8px}
.btn{margin-top:14px;background:#ffe27a;color:#15161a;border:none;border-radius:10px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
#out{margin-top:12px;width:min(92vw,520px);height:160px;font-family:ui-monospace,monospace;font-size:11px;display:none;background:#0b0c10;color:#cfd3db;border:1px solid #3a3f4c;border-radius:8px;padding:8px}
.hint{font-size:11px;color:#6b7280;margin-top:6px}
.toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%);background:#2bd47a;color:#08210f;padding:8px 16px;border-radius:999px;font-weight:700;opacity:0;transition:.3s;pointer-events:none}.toast.show{opacity:1}
</style></head><body>
<header><div><b>ボス選別</b> <span style="font-size:12px;color:#9aa0ad">← 無し / 有り → ・ドラッグもOK</span></div>
  <div class="count"><span id="done_n">0</span>/<span id="total_n">0</span> ・有り<span id="yes_n">0</span></div></header>
<div class="stage" id="stage">
  <div class="done" id="doneScreen">
    <h2>選別おわり！</h2>
    <div id="summary" style="color:#cfd3db"></div>
    <button class="btn" id="copyBtn">結果をコピー</button>
    <div class="hint">コピーしたテキストをチャットに貼ってください（採用の系統を学習して次の50枚へ）。</div>
    <textarea id="out" readonly></textarea>
    <button class="btn" id="restartBtn" style="background:#3a3f4c;color:#e7e7ea">最初からやり直す</button>
  </div>
</div>
<div class="bar">
  <button class="fab no" id="bNo">✗</button>
  <button class="fab undo" id="bUndo">↶</button>
  <button class="fab yes" id="bYes">♥</button>
  <button class="btn" id="bCopy" style="position:fixed;right:12px;bottom:104px;padding:8px 12px;font-size:12px">途中保存コピー</button>
</div>
<div class="toast" id="toast">コピーしました！</div>
<script>
const BOSSES=[{"id": "obsidian-earth-wyvern-b4", "name_ja": "黒鉄のワイバーン", "tier": "序盤", "element": "土", "flavor_ja": "鉄を喰らうと言われる黒鉄竜。翼に走る鉱脈が鈍く光り、ひと睨みで岩肌をも砕く。", "img": "gacha4/obsidian-earth-wyvern-b4.png"}, {"id": "verdant-thorn-basilisk-b4", "name_ja": "翠棘のバジリスク", "tier": "序盤", "element": "木", "flavor_ja": "視線で獲物を痺れさせる森の蛇竜。背の棘は生きた茨で、近づく者を絡め取る。", "img": "gacha4/verdant-thorn-basilisk-b4.png"}, {"id": "ember-cockatrice-b4", "name_ja": "焔翼のコカトリス", "tier": "序盤", "element": "火", "flavor_ja": "鳴くだけで草木を焦がす鶏竜。冠の炎は怒りで燃え盛り、羽ばたきは火の粉を撒く。", "img": "gacha4/ember-cockatrice-b4.png"}, {"id": "storm-griffon-monarch-b4", "name_ja": "雷羽のグリフォン", "tier": "中盤", "element": "風", "flavor_ja": "嵐を従える空の王。羽ばたきが雷鳴を呼び、その爪は鋼の鎧をも引き裂く。", "img": "gacha4/storm-griffon-monarch-b4.png"}, {"id": "abyssal-hydra-b4", "name_ja": "深淵のヒュドラ", "tier": "中盤", "element": "水", "flavor_ja": "首を斬れば二つに増える沼の覇者。五つの顎が同時に襲い、毒の息が水面を腐らせる。", "img": "gacha4/abyssal-hydra-b4.png"}, {"id": "auric-qilin-sage-b4", "name_ja": "黄金の麒麟", "tier": "中盤", "element": "光", "flavor_ja": "聖なる炎をまとう神獣。その歩みは大地を浄め、邪なる者の前にのみ角を向ける。", "img": "gacha4/auric-qilin-sage-b4.png"}, {"id": "glacial-frost-wyrm-b4", "name_ja": "氷牙の霜竜", "tier": "終盤", "element": "氷", "flavor_ja": "息吹ひとつで湖を凍てつかせる古竜。鱗は氷河そのもので、近づく熱を残らず奪う。", "img": "gacha4/glacial-frost-wyrm-b4.png"}, {"id": "infernal-chimera-b4", "name_ja": "業火の合成獣", "tier": "終盤", "element": "火", "flavor_ja": "三つの頭が火と毒を吐き分ける合成の魔獣。獅子の咆哮と竜の業火で全てを焼き尽くす。", "img": "gacha4/infernal-chimera-b4.png"}, {"id": "void-twin-dragon-b4", "name_ja": "双頭の冥竜", "tier": "ラスボス級", "element": "闇", "flavor_ja": "二つの頭が表裏の闇を司る滅びの竜。片方が眠る間ももう一方が見張り、隙は無い。", "img": "gacha4/void-twin-dragon-b4.png"}, {"id": "world-end-elder-dragon-b4", "name_ja": "終焉の古龍", "tier": "ラスボス級", "element": "オメガ", "flavor_ja": "天地の理を束ねる最古の龍。その一咆は星を震わせ、あらゆる属性を従える生きた終焉。", "img": "gacha4/world-end-elder-dragon-b4.png"}, {"id": "ash-imp-swarmlord-b4", "name_ja": "灰燼の小鬼王", "tier": "序盤", "element": "火", "flavor_ja": "群れの先頭に立つ小さき鬼の王。体の裂け目から溶岩の光がもれ、近づくだけで肌がじりじりと焼ける。", "img": "gacha4/ash-imp-swarmlord-b4.png"}, {"id": "bone-marrow-ghoul-b4", "name_ja": "腐骨の喰鬼", "tier": "序盤", "element": "毒", "flavor_ja": "墓場に棲む痩せこけた屍鬼。あばらをのぞかせ、紫の瘴気をしたたらせながら獲物ににじり寄る。", "img": "gacha4/bone-marrow-ghoul-b4.png"}, {"id": "shard-sentinel-golem-b4", "name_ja": "晶片の番ゴーレム", "tier": "序盤", "element": "土", "flavor_ja": "鉱脈の入口を守る小ぶりの石像。胸の結晶核が脈打つたび、体の青いひびが光を放つ。", "img": "gacha4/shard-sentinel-golem-b4.png"}, {"id": "iron-ogre-warden-b4", "name_ja": "鉄甲の獄鬼", "tier": "中盤", "element": "土", "flavor_ja": "黒鉄の鎧をまとった巨躯の獄鬼。棘付きの鉄棍を片手に振り上げ、地を踏むたびに大地が震える。", "img": "gacha4/iron-ogre-warden-b4.png"}, {"id": "abyss-chimera-fiend-b4", "name_ja": "深淵の合成獣", "tier": "中盤", "element": "闇", "flavor_ja": "獅子と竜蛇と蠍を継ぎ合わせた異形の合成獣。三つの頭がそれぞれの牙と毒で同時に襲いかかる。", "img": "gacha4/abyss-chimera-fiend-b4.png"}, {"id": "rampart-siege-construct-b4", "name_ja": "城砦の砲撃構造体", "tier": "中盤", "element": "鋼", "flavor_ja": "脚を生やした移動要塞。胴に並ぶ砲身から琥珀色の砲火を放ち、行く手の全てを薙ぎ払う重機械。", "img": "gacha4/rampart-siege-construct-b4.png"}, {"id": "infernal-gatekeeper-b4", "name_ja": "獄門の魔将", "tier": "終盤", "element": "火", "flavor_ja": "地獄の門を統べる魔将。炎をまとう大剣を携え、燃えさかる翼を広げると周囲が業火に包まれる。", "img": "gacha4/infernal-gatekeeper-b4.png"}, {"id": "colossus-of-the-rift-b4", "name_ja": "断層の巨像", "tier": "終盤", "element": "雷", "flavor_ja": "大地の断層から目覚めた巨像。岩塊の肩を青き雷で繋ぎとめ、一歩ごとに雷光が大地を裂く。", "img": "gacha4/colossus-of-the-rift-b4.png"}, {"id": "abyssal-titan-overlord-b4", "name_ja": "奈落の魔王ティターン", "tier": "ラスボス級", "element": "闇", "flavor_ja": "奈落の底より顕れし魔王。六本の角と三対の闇翼を広げ、その掌に世界を呑む暗黒の球を編む。", "img": "gacha4/abyssal-titan-overlord-b4.png"}, {"id": "world-ender-war-machine-b4", "name_ja": "終焉の機神兵器", "tier": "ラスボス級", "element": "鋼", "flavor_ja": "全てを終わらせるために造られし機神。四腕に砲を備え、胸の炉心を赤熱させながら鋼の咆哮をあげる。", "img": "gacha4/world-ender-war-machine-b4.png"}, {"id": "gale-griffon-wraith-b4", "name_ja": "颶風のグリフォン霊", "tier": "序盤", "element": "風", "flavor_ja": "嵐の谷に棲む半透明の幻獣。風そのものが鷲と獅子の姿をとり、爪は不可視の刃となって獲物を切り裂く。", "img": "gacha4/gale-griffon-wraith-b4.png"}, {"id": "venom-hydra-whelp-b4", "name_ja": "猛毒のヒュドラ仔", "tier": "序盤", "element": "毒", "flavor_ja": "沼地に生まれたばかりの幼いヒュドラ。三つの首から滴る紫の毒は触れた草木を瞬時に枯らす。小さくとも侮れぬ猛毒の魔物。", "img": "gacha4/venom-hydra-whelp-b4.png"}, {"id": "tide-serpent-elemental-b4", "name_ja": "潮流の水精蛇", "tier": "序盤", "element": "水", "flavor_ja": "清流に宿る精霊が蛇の姿をとったもの。透き通る水の身体で岩をも貫く水流の牙を持つ。", "img": "gacha4/tide-serpent-elemental-b4.png"}, {"id": "rot-chimera-beast-b4", "name_ja": "腐敗のキメラ獣", "tier": "中盤", "element": "腐敗", "flavor_ja": "幾つもの死骸を継ぎ合わせて蘇った合成獣。腐臭をまとい、触れたものを朽ち果てさせる。荒野を徘徊する醜悪な魔獣。", "img": "gacha4/rot-chimera-beast-b4.png"}, {"id": "frost-wyvern-b4", "name_ja": "氷雪のワイバーン", "tier": "中盤", "element": "氷", "flavor_ja": "万年雪の峰に巣くう氷の竜。吐く息は触れる端から凍てつき、翼の一振りで吹雪を巻き起こす。", "img": "gacha4/frost-wyvern-b4.png"}, {"id": "iron-fang-golem-beast-b4", "name_ja": "鋼牙の金属獣ゴーレム", "tier": "中盤", "element": "金属", "flavor_ja": "古の鍛冶場で命を得た鋼の獣。全身が鉄板と歯車で組まれ、その牙は岩盤をも噛み砕く。", "img": "gacha4/iron-fang-golem-beast-b4.png"}, {"id": "ember-phoenix-dragon-b4", "name_ja": "業火の鳳竜", "tier": "終盤", "element": "火", "flavor_ja": "火山の奥底で千年を生き、炎を翼に宿した荘厳な幻竜。一たび羽ばたけば天が紅蓮に染まる。", "img": "gacha4/ember-phoenix-dragon-b4.png"}, {"id": "earth-colossus-titan-b4", "name_ja": "大地の巨像ティターン", "tier": "終盤", "element": "地", "flavor_ja": "山脈そのものが意思を持って起き上がった巨像。一歩ごとに大地が揺れ、その拳は城壁を砕く。", "img": "gacha4/earth-colossus-titan-b4.png"}, {"id": "abyssal-storm-wyrm-b4", "name_ja": "嵐淵の三幻竜", "tier": "ラスボス級", "element": "風", "flavor_ja": "天空の彼方より降臨する三つ首の嵐の幻竜。三つの顎が放つ暴風と雷は、空をも引き裂く終局の災厄。", "img": "gacha4/abyssal-storm-wyrm-b4.png"}, {"id": "infernal-iron-demon-construct-b4", "name_ja": "獄炎の鋼鉄魔神", "tier": "ラスボス級", "element": "金属", "flavor_ja": "地獄の炉で鍛えられた鋼鉄の魔神。継ぎ目から溶岩を噴き、四本の腕で全てを薙ぎ払う。これに挑む者は覚悟せよ。", "img": "gacha4/infernal-iron-demon-construct-b4.png"}, {"id": "tadpole-acorn-knight-b4", "name_ja": "おたまナイト", "tier": "序盤", "element": "水", "flavor_ja": "池の浅瀬で見つけたくるみのからをよろいにした、はじめての小さな騎士。しっぽをふってちょこちょこ進む練習相手。", "img": "gacha4/tadpole-acorn-knight-b4.png"}, {"id": "magnet-puff-cat-b4", "name_ja": "じしゃくにゃん", "tier": "序盤", "element": "雷", "flavor_ja": "しっぽが小さなじしゃくになっているまんまるネコ。クリップやピンを体にくっつけて、じまんげに歩いてくる。", "img": "gacha4/magnet-puff-cat-b4.png"}, {"id": "lantern-tsukumo-yokai-b4", "name_ja": "ちょうちんおばけ", "tier": "序盤", "element": "火", "flavor_ja": "夜道に置き忘れられた古い提灯がばけたもの。まっぷたつに裂けた口で笑い、中の火をゆらしてふらりと近づく。", "img": "gacha4/lantern-tsukumo-yokai-b4.png"}, {"id": "thunder-raijin-tanuki-b4", "name_ja": "なるかみダヌキ", "tier": "中盤", "element": "雷", "flavor_ja": "背中に雷太鼓をしょった化け狸。バチを打ち鳴らすたびに空がゴロゴロ鳴り、いなずまが太鼓の輪をかけめぐる中盤の難敵。", "img": "gacha4/thunder-raijin-tanuki-b4.png"}, {"id": "coolant-mech-mantis-b4", "name_ja": "クーラント・マンティス", "tier": "中盤", "element": "氷", "flavor_ja": "刃のうでから冷却剤の霧を吹き出す、つや消し白の機械カマキリ。間合いを凍らせてから一気に切りこむ精密な刺客。", "img": "gacha4/coolant-mech-mantis-b4.png"}, {"id": "spore-flesh-bell-b4", "name_ja": "ほうしのつりがね", "tier": "中盤", "element": "毒", "flavor_ja": "天井からぶら下がる、つりがねの形をした菌のかたまり。ひだから緑の胞子をふきこぼし、揺れるたびに毒の霧が広がっていく。", "img": "gacha4/spore-flesh-bell-b4.png"}, {"id": "tesla-sentinel-mech-b4", "name_ja": "テスラ・センチネル", "tier": "終盤", "element": "雷", "flavor_ja": "両腕のテスラ砲から絶え間なく稲妻を放つ、巨大な人型機兵。胸の炉が満ちると、紫の雷を扇状にまき散らす終盤の砲台。", "img": "gacha4/tesla-sentinel-mech-b4.png"}, {"id": "pressure-deep-horror-b4", "name_ja": "しんかいのあぎと", "tier": "終盤", "element": "闇", "flavor_ja": "光の届かぬ水圧の底からせり上がる、巨大なあごの怪物。からだじゅうに散った青白い光で獲物を惑わせ、ガラスのような牙でのみこむ。", "img": "gacha4/pressure-deep-horror-b4.png"}, {"id": "sun-radiance-lion-divine-b4", "name_ja": "こうりんの聖獅子", "tier": "ラスボス級", "element": "光", "flavor_ja": "夜明けとともに天から降り立つという光の聖獅子。たてがみは太陽そのもので、ひと吠えで闇をはらい、戦場を黄金の光で満たす最終決戦級の霊獣。", "img": "gacha4/sun-radiance-lion-divine-b4.png"}, {"id": "tide-dragon-divine-b4", "name_ja": "うしおの龍神", "tier": "ラスボス級", "element": "水", "flavor_ja": "海と空のあわいを泳ぐという潮の龍神。うろこは澄んだ水でできており、にぎった満ち潮の珠をかかげれば、大海原がそのままおしよせる最終決戦級の神獣。", "img": "gacha4/tide-dragon-divine-b4.png"}, {"id": "spore-imp-b4", "name_ja": "ホウシのこびと", "tier": "序盤", "element": "毒", "flavor_ja": "じめじめした洞窟のすみで生まれた菌のこびと。ふれると小さなホウシをぱっとまき散らして、ふわふわ逃げていく。", "img": "gacha4/spore-imp-b4.png"}, {"id": "paper-microbe-b4", "name_ja": "ゾウリむしのかみさま", "tier": "序盤", "element": "水", "flavor_ja": "池の水一てきの中にすむ、いちばん小さな生きもの。たくさんの毛をいっせいに動かしてスイスイ泳ぎ、こっそり王さまを名のっている。", "img": "gacha4/paper-microbe-b4.png"}, {"id": "geode-pup-b4", "name_ja": "ジオードの子犬", "tier": "序盤", "element": "土", "flavor_ja": "ただの灰色の石ころに見えて、われ目の中はキラキラの紫水晶でいっぱい。なでると少しだけ口を開けて中身を見せてくれる。", "img": "gacha4/geode-pup-b4.png"}, {"id": "magnet-hound-b4", "name_ja": "じりょくのいぬ", "tier": "中盤", "element": "雷", "flavor_ja": "頭がU字じしゃくの形をした鉄の犬。近づく金属を体に貼りつけて鎧にする。まわりには見えない力の線がうずまいている。", "img": "gacha4/magnet-hound-b4.png"}, {"id": "soundwave-bat-b4", "name_ja": "おとなみコウモリ", "tier": "中盤", "element": "風", "flavor_ja": "まっくらでも音のはね返りで物を見るコウモリのばけもの。鳴き声を波にして放ち、ぶつけてしびれさせる。", "img": "gacha4/soundwave-bat-b4.png"}, {"id": "crystal-knight-b4", "name_ja": "けっしょうのきし", "tier": "中盤", "element": "氷", "flavor_ja": "規則正しく並んだ結晶が、よろい武者の形に育ったもの。日の光をあびると体じゅうから虹色の光をはなつ。", "img": "gacha4/crystal-knight-b4.png"}, {"id": "aurora-serpent-b4", "name_ja": "オーロラのへび", "tier": "終盤", "element": "雷", "flavor_ja": "夜空のオーロラがそのまま生きものになった大蛇。太陽からとどいた小さな粒が空気にぶつかって光り、体をかたちづくる。", "img": "gacha4/aurora-serpent-b4.png"}, {"id": "mycelia-treant-b4", "name_ja": "きょうせいの森人", "tier": "終盤", "element": "木", "flavor_ja": "木とキノコと小さな生きものが、たがいに助け合って一つの巨人になった森のぬし。根の下では光る糸が森じゅうに栄養を配っている。", "img": "gacha4/mycelia-treant-b4.png"}, {"id": "gravity-maw-b4", "name_ja": "じゅうりょくの口", "tier": "ラスボス級", "element": "闇", "flavor_ja": "あらゆる物も光ものみこむ、宇宙にあいた底なしの口。近づくものはぐにゃりと引きのばされ、回りながら吸いこまれていく。", "img": "gacha4/gravity-maw-b4.png"}, {"id": "thunderbird-myth-b4", "name_ja": "らいめいの巨鳥", "tier": "ラスボス級", "element": "雷", "flavor_ja": "羽ばたきが雷鳴を、まばたきがいなずまを生むという伝説の大鳥。空気がはげしくこすれてプラズマとなり、体をつつむ。", "img": "gacha4/thunderbird-myth-b4.png"}]; const KEY="rika2_boss_swipe_v1";
let st=JSON.parse(localStorage.getItem(KEY)||"null")||{idx:0,dec:{}};
function save(){localStorage.setItem(KEY,JSON.stringify(st));}
const stage=document.getElementById("stage");
document.getElementById("total_n").textContent=BOSSES.length;
let card=null,startX=0,curX=0,dragging=false;

function counts(){const y=Object.values(st.dec).filter(v=>v==="yes").length;
  document.getElementById("done_n").textContent=Object.keys(st.dec).length;
  document.getElementById("yes_n").textContent=y;}

function build(idx){
  const b=BOSSES[idx]; const el=document.createElement("div"); el.className="card";
  el.innerHTML=`<div class="stamp yes">有り</div><div class="stamp no">無し</div>
    <div class="imgbox"><img src="${b.img}" alt=""></div>
    <div class="info"><div class="nm">${b.name_ja}<span class="tier t${b.tier}">${b.tier}</span></div>
    <div class="el">${b.element}</div><div class="fl">${b.flavor_ja}</div></div>`;
  el.addEventListener("pointerdown",down); el.addEventListener("pointermove",move);
  el.addEventListener("pointerup",up); el.addEventListener("pointercancel",up);
  return el;
}
function show(){
  if(card){card.remove();card=null;}
  if(st.idx>=BOSSES.length){document.getElementById("doneScreen").style.display="flex";finish();return;}
  document.getElementById("doneScreen").style.display="none";
  card=build(st.idx); stage.appendChild(card); counts();
}
function down(e){dragging=true;startX=e.clientX;curX=0;card.setPointerCapture(e.pointerId);card.style.transition="none";}
function move(e){if(!dragging)return;curX=e.clientX-startX;card.style.transform=`translateX(${curX}px) rotate(${curX/18}deg)`;
  card.querySelector(".yes").style.opacity=Math.max(0,Math.min(1,curX/90));
  card.querySelector(".no").style.opacity=Math.max(0,Math.min(1,-curX/90));}
function up(){if(!dragging)return;dragging=false;
  if(curX>90)decide("yes");else if(curX<-90)decide("no");
  else{card.style.transition=".2s";card.style.transform="";card.querySelector(".yes").style.opacity=0;card.querySelector(".no").style.opacity=0;}}
function decide(v){
  st.dec[BOSSES[st.idx].id]=v; save();
  const dir=v==="yes"?1:-1;
  card.style.transition=".3s ease-out";
  card.style.transform=`translateX(${dir*140}vw) rotate(${dir*25}deg)`;
  card.style.opacity="0";
  setTimeout(()=>{st.idx++;save();show();},260);
}
function undo(){if(st.idx<=0)return;st.idx--;delete st.dec[BOSSES[st.idx].id];save();show();}
function summaryText(){
  const yes=BOSSES.filter(b=>st.dec[b.id]==="yes"),no=BOSSES.filter(b=>st.dec[b.id]==="no");
  let s=`=== ボス選別 結果 (有り${yes.length} / 無し${no.length} / 計${BOSSES.length}) ===\n【有り】\n`;
  yes.forEach(b=>s+=`- ${b.name_ja} (${b.tier}/${b.element}) [${b.id}]\n`);
  s+="【無し】\n"; no.forEach(b=>s+=`- ${b.name_ja} (${b.tier}/${b.element}) [${b.id}]\n`);
  return s;
}
function finish(){
  const yes=BOSSES.filter(b=>st.dec[b.id]==="yes").length;
  document.getElementById("summary").textContent=`有り ${yes} 体 / 無し ${BOSSES.length-yes} 体`;
}
function copyOut(){const s=summaryText();const o=document.getElementById("out");o.style.display="block";o.value=s;
  if(navigator.clipboard)navigator.clipboard.writeText(s).then(()=>{const t=document.getElementById("toast");t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1500);},()=>{});o.select();}
document.getElementById("bNo").onclick=()=>{if(st.idx<BOSSES.length)decide("no");};
document.getElementById("bYes").onclick=()=>{if(st.idx<BOSSES.length)decide("yes");};
document.getElementById("bUndo").onclick=undo;
document.getElementById("bCopy").onclick=copyOut;
document.getElementById("copyBtn").onclick=copyOut;
document.getElementById("restartBtn").onclick=()=>{st={idx:0,dec:{}};save();show();};
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"&&st.idx<BOSSES.length)decide("no");
  else if(e.key==="ArrowRight"&&st.idx<BOSSES.length)decide("yes");else if(e.key==="Backspace")undo();});
show();
</script></body></html>
