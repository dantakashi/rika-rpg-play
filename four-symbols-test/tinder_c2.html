<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>ボス選別 — 理科RPG2</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0f1014;color:#e7e7ea;font-family:system-ui,"Hiragino Kaku Gothic ProN",sans-serif;overflow:hidden;height:100dvh}
header{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;background:#1a1c22;border-bottom:1px solid #2c2f3a}
header b{color:#ffe27a}.count{font-size:13px;color:#9aa0ad}
.stage{position:relative;height:calc(100dvh - 150px);display:flex;align-items:center;justify-content:center;padding:10px}
.card{position:absolute;width:min(92vw,440px);max-height:100%;background:#1d1f26;border:1px solid #2c2f3a;border-radius:18px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5);touch-action:none}
.imgbox{aspect-ratio:1/1;
  background-image:linear-gradient(45deg,#cfcfcf 25%,transparent 25%),linear-gradient(-45deg,#cfcfcf 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#cfcfcf 75%),linear-gradient(-45deg,transparent 75%,#cfcfcf 75%);
  background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0;background-color:#e9e9e9}
.imgbox img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.info{padding:12px 16px}
.nm{font-size:22px;font-weight:800}
.nm .tier{font-size:14px;font-weight:700;padding:2px 10px;border-radius:999px;margin-left:8px;vertical-align:3px}
.t序盤{background:#2bd47a;color:#06210f}.t中盤{background:#4aa3ff;color:#04203f}.t終盤{background:#ff9a3c;color:#311600}.tラスボス級{background:#ff5a7a;color:#33000d}
.el{font-size:12px;color:#9aa0ad;margin-top:2px}
.fl{font-size:14px;color:#cfd3db;margin-top:8px;line-height:1.55}
.stamp{position:absolute;top:18px;font-size:34px;font-weight:900;padding:4px 14px;border:4px solid;border-radius:12px;opacity:0;transform:rotate(-15deg)}
.yes{left:18px;color:#2bd47a;border-color:#2bd47a}.no{right:18px;color:#ff5a7a;border-color:#ff5a7a}
.bar{position:fixed;bottom:0;left:0;right:0;height:90px;display:flex;align-items:center;justify-content:center;gap:22px;background:#13141a;border-top:1px solid #2c2f3a}
.fab{width:62px;height:62px;border-radius:50%;border:none;font-size:26px;cursor:pointer;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.fab.no{background:#2a1d23;color:#ff5a7a;border:2px solid #ff5a7a}.fab.yes{background:#16271c;color:#2bd47a;border:2px solid #2bd47a}
.fab.undo{width:48px;height:48px;font-size:18px;background:#23242c;color:#cfd3db;border:1px solid #3a3f4c}
.done{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.done h2{color:#ffe27a;margin:0 0 8px}
.btn{margin-top:14px;background:#ffe27a;color:#15161a;border:none;border-radius:10px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
#out{margin-top:12px;width:min(92vw,520px);height:160px;font-family:ui-monospace,monospace;font-size:11px;display:none;background:#0b0c10;color:#cfd3db;border:1px solid #3a3f4c;border-radius:8px;padding:8px}
.hint{font-size:11px;color:#6b7280;margin-top:6px}
.toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%);background:#2bd47a;color:#08210f;padding:8px 16px;border-radius:999px;font-weight:700;opacity:0;transition:.3s;pointer-events:none}.toast.show{opacity:1}
</style></head><body>
<header><div><b>ボス選別</b> <span style="font-size:12px;color:#9aa0ad">← 無し / 有り → ・ドラッグもOK</span></div>
  <div class="count"><span id="done_n">0</span>/<span id="total_n">0</span> ・有り<span id="yes_n">0</span></div></header>
<div class="stage" id="stage">
  <div class="done" id="doneScreen">
    <h2>選別おわり！</h2>
    <div id="summary" style="color:#cfd3db"></div>
    <button class="btn" id="copyBtn">結果をコピー</button>
    <div class="hint">コピーしたテキストをチャットに貼ってください（採用の系統を学習して次の50枚へ）。</div>
    <textarea id="out" readonly></textarea>
    <button class="btn" id="restartBtn" style="background:#3a3f4c;color:#e7e7ea">最初からやり直す</button>
  </div>
</div>
<div class="bar">
  <button class="fab no" id="bNo">✗</button>
  <button class="fab undo" id="bUndo">↶</button>
  <button class="fab yes" id="bYes">♥</button>
  <button class="btn" id="bCopy" style="position:fixed;right:12px;bottom:104px;padding:8px 12px;font-size:12px">途中保存コピー</button>
</div>
<div class="toast" id="toast">コピーしました！</div>
<script>
const BOSSES=[{"id": "puff-spark-cub-c2", "name_ja": "ピカぽふ", "tier": "序盤", "element": "電気", "flavor_ja": "ほっぺに電気をためる、ぷにっと丸い子獣。なでると静電気でパチッとする。", "img": "gacha_c2/puff-spark-cub-c2.png"}, {"id": "bubble-otter-tot-c2", "name_ja": "あわっこ", "tier": "序盤", "element": "泡", "flavor_ja": "あわのコートをまとった、ぷるぷるの子カワウソ。さわるとふわっとはじける。", "img": "gacha_c2/bubble-otter-tot-c2.png"}, {"id": "glow-moth-bun-c2", "name_ja": "ぽわが", "tier": "序盤", "element": "光", "flavor_ja": "やわらかい光をともす、まんまるの子ガ。暗いところでぽわっと光る。", "img": "gacha_c2/glow-moth-bun-c2.png"}, {"id": "gem-hopper-kit-c2", "name_ja": "こりんこ", "tier": "序盤", "element": "結晶", "flavor_ja": "せなかに小さなクリスタルがはえた、ぴょこぴょこ跳ねる子ウサギ。", "img": "gacha_c2/gem-hopper-kit-c2.png"}, {"id": "thunder-pup-flare-c2", "name_ja": "らいキュン", "tier": "中盤", "element": "電気", "flavor_ja": "やんちゃで元気いっぱい、ちょっと強そうな子イヌ。走ると体に電気が走る。", "img": "gacha_c2/thunder-pup-flare-c2.png"}, {"id": "prism-fox-shine-c2", "name_ja": "ひかりつね", "tier": "中盤", "element": "光", "flavor_ja": "毛なみに虹色の光がはしる、ちょっと凛々しい子ギツネの精。", "img": "gacha_c2/prism-fox-shine-c2.png"}, {"id": "foam-seal-splash-c2", "name_ja": "もこあざ", "tier": "中盤", "element": "泡", "flavor_ja": "もこもこの泡をまとった、まんまるの子アザラシ。ころんと転がってくる。", "img": "gacha_c2/foam-seal-splash-c2.png"}, {"id": "crystal-bear-aura-c2", "name_ja": "きらクマ", "tier": "終盤", "element": "結晶", "flavor_ja": "せなかに大きなクリスタルのよろいをまとった、頼れる子グマの守り手。", "img": "gacha_c2/crystal-bear-aura-c2.png"}, {"id": "storm-tiger-bolt-c2", "name_ja": "いかずちトラ", "tier": "終盤", "element": "電気", "flavor_ja": "しま模様にいなずまが走る、強くてかわいい子トラ。吠えると雷が鳴る。", "img": "gacha_c2/storm-tiger-bolt-c2.png"}, {"id": "radiant-dragon-pudge-c2", "name_ja": "ひかりゅう・キング", "tier": "ラスボス級", "element": "光", "flavor_ja": "まんまるでかわいいのに、光をまとう竜の王さま。にこっと笑うとあたりが輝く。", "img": "gacha_c2/radiant-dragon-pudge-c2.png"}, {"id": "ember-hatchling-drake-c2", "name_ja": "ちびボウえん", "tier": "序盤", "element": "火", "flavor_ja": "たまごから出たばかりのちびドラゴン。火をはく練習中で、いつもポンッと小さく燃えてはびっくりする。", "img": "gacha_c2/ember-hatchling-drake-c2.png"}, {"id": "puddle-baby-kelpie-c2", "name_ja": "みずたまケルピー", "tier": "序盤", "element": "水", "flavor_ja": "水たまりから生まれた子ケルピー。たてがみがしずくでできていて、走るとぴちゃぴちゃ音がする。", "img": "gacha_c2/puddle-baby-kelpie-c2.png"}, {"id": "sprout-pebble-golem-c2", "name_ja": "ころりんゴーレム", "tier": "序盤", "element": "地", "flavor_ja": "頭からふたばが生えた赤ちゃんゴーレム。ころんと転がって移動する。なでると土のにおいがする。", "img": "gacha_c2/sprout-pebble-golem-c2.png"}, {"id": "breeze-chick-griffon-c2", "name_ja": "ぴよグリフォン", "tier": "序盤", "element": "風", "flavor_ja": "わたげみたいにふわふわな子グリフォン。風がふくとからだの羽がそよそよ揺れて、まだ上手に飛べない。", "img": "gacha_c2/breeze-chick-griffon-c2.png"}, {"id": "spark-cub-kirin-c2", "name_ja": "ぱちぱちキリン", "tier": "中盤", "element": "雷", "flavor_ja": "毛をなでるとぱちっと静電気が走る子キリン。喜ぶと背中にちいさな稲妻が走ってぴかっと光る。", "img": "gacha_c2/spark-cub-kirin-c2.png"}, {"id": "glimmer-baby-phoenix-c2", "name_ja": "ひなフェニックス", "tier": "中盤", "element": "光", "flavor_ja": "夜明けの色をした子フェニックス。よろこぶとからだ全体がぽわっと光って、まわりがほんのり明るくなる。", "img": "gacha_c2/glimmer-baby-phoenix-c2.png"}, {"id": "fizzy-bubble-leviatot-c2", "name_ja": "あわぷくリヴァ", "tier": "中盤", "element": "水", "flavor_ja": "あわをまといながら生まれた子の海蛇。げっぷをするとぷくぷくとシャボン玉が出てくる。", "img": "gacha_c2/fizzy-bubble-leviatot-c2.png"}, {"id": "crystal-fawn-unicorn-c2", "name_ja": "きらりユニコ", "tier": "終盤", "element": "結晶", "flavor_ja": "ひたいに小さな水晶がはえた子ユニコーン。歩くたびに背中の結晶がきらきら虹色にかがやく。", "img": "gacha_c2/crystal-fawn-unicorn-c2.png"}, {"id": "lava-pup-salamander-c2", "name_ja": "ぽかぽかサラ", "tier": "終盤", "element": "火", "flavor_ja": "からだのひびから溶岩の光がもれる子サラマンダー。さわるとぽかぽかで、冬にだきしめると気持ちいい。", "img": "gacha_c2/lava-pup-salamander-c2.png"}, {"id": "starlight-baby-dragon-king-c2", "name_ja": "おひめドラゴ", "tier": "ラスボス級", "element": "光", "flavor_ja": "星のかけらから生まれた竜の王子さま。まだちびっこだが、ほほえむと夜空みたいに全身がきらめき、すべての幻獣がひれ伏す。", "img": "gacha_c2/starlight-baby-dragon-king-c2.png"}, {"id": "puni-mizutama-droplet-c2", "name_ja": "みずたまぷにン", "tier": "序盤", "element": "水", "flavor_ja": "ぷにっと押すとふるふる揺れる、水のしずくが生まれた小さな精霊。さわると指がひんやりする。", "img": "gacha_c2/puni-mizutama-droplet-c2.png"}, {"id": "mochi-marshmallow-sprite-c2", "name_ja": "もちまろ", "tier": "序盤", "element": "光", "flavor_ja": "もちもちでほんのり光る。抱きしめると中からあったかい光がにじみ出る、おひさまのおもち。", "img": "gacha_c2/mochi-marshmallow-sprite-c2.png"}, {"id": "awabuku-foam-pup-c2", "name_ja": "あわぶくワン", "tier": "序盤", "element": "泡", "flavor_ja": "もこもこの泡でできた子犬。なでると小さなあわが体からプチプチはじけて笑う。", "img": "gacha_c2/awabuku-foam-pup-c2.png"}, {"id": "puru-jelly-tadpole-c2", "name_ja": "ぷるたま", "tier": "序盤", "element": "水", "flavor_ja": "中の色がすけて見えるぷるぷるのおたまじゃくし。ゆれるたびに体の色がきらきら混ざる。", "img": "gacha_c2/puru-jelly-tadpole-c2.png"}, {"id": "puni-prism-blob-c2", "name_ja": "プリズムぷよ", "tier": "中盤", "element": "光", "flavor_ja": "光をあびると体の中で虹色にきらめくぷよぷよ。角度を変えるたび色がかわる、にじのゼリー。", "img": "gacha_c2/puni-prism-blob-c2.png"}, {"id": "mochi-dango-trio-c2", "name_ja": "だんごもち", "tier": "中盤", "element": "光", "flavor_ja": "三色のおもちがくっついた、もちもちの三兄弟精霊。つなぎ目がほんのり光る縁起もの。", "img": "gacha_c2/mochi-dango-trio-c2.png"}, {"id": "awa-bubble-jelly-queen-c2", "name_ja": "あわひめジェリー", "tier": "中盤", "element": "泡", "flavor_ja": "泡の冠とドレスをまとった、ぷるんとしたゼリーのおひめさま。歩くたびに泡のすそがふわり。", "img": "gacha_c2/awa-bubble-jelly-queen-c2.png"}, {"id": "puni-aqua-king-slime-c2", "name_ja": "ぷにキング", "tier": "終盤", "element": "水", "flavor_ja": "小さなしずくたちを率いる、どっしりぷるぷるのスライム王。王冠は固まった水の宝石。", "img": "gacha_c2/puni-aqua-king-slime-c2.png"}, {"id": "mochi-lumen-guardian-c2", "name_ja": "ひかりもちガーディアン", "tier": "終盤", "element": "光", "flavor_ja": "やわらかいおもちで組まれた光の番人。胸の灯がともる限り、みんなを守るやさしい巨体。", "img": "gacha_c2/mochi-lumen-guardian-c2.png"}, {"id": "puni-ocean-jelly-monarch-c2", "name_ja": "ぷにゼリー大帝", "tier": "ラスボス級", "element": "水", "flavor_ja": "あらゆるぷにぷにを束ねる、虹色に輝く巨大ゼリーの大帝。やさしいのに、その存在はけたちがい。", "img": "gacha_c2/puni-ocean-jelly-monarch-c2.png"}, {"id": "ember-wispling-c2", "name_ja": "ぽちっとファイ", "tier": "序盤", "element": "炎", "flavor_ja": "うまれたばかりの ちいさな ほのおの せいれい。ぽわぽわの あったかい たいおんで、なでると きもちいい。", "img": "gacha_c2/ember-wispling-c2.png"}, {"id": "puddle-droplet-pixie-c2", "name_ja": "しずくのぷるりん", "tier": "序盤", "element": "水", "flavor_ja": "ぷるぷる ゆれる みずの ようせい。さわると ひんやり つめたくて、ころころ ころがるのが だいすき。", "img": "gacha_c2/puddle-droplet-pixie-c2.png"}, {"id": "breezy-puffball-sprite-c2", "name_ja": "そよかぜポフ", "tier": "序盤", "element": "風", "flavor_ja": "ふわふわ ころころ そらを ころがる かぜの せいれい。くしゃみで みんなを すこし おしちゃう、おちゃめな こ。", "img": "gacha_c2/breezy-puffball-sprite-c2.png"}, {"id": "sparkly-seed-bud-c2", "name_ja": "ふたばのめぶき", "tier": "序盤", "element": "草", "flavor_ja": "つちの なかから ひょっこり めを だした わかい いのちの せいれい。たいようが だいすきで、いつも うえを むいている。", "img": "gacha_c2/sparkly-seed-bud-c2.png"}, {"id": "zappy-bolt-fairy-c2", "name_ja": "びりびりピカル", "tier": "中盤", "element": "雷", "flavor_ja": "じっと できない げんきいっぱいの かみなりの ようせい。びりっと さわると みんな はねちゃう。わるぎは ないよ。", "img": "gacha_c2/zappy-bolt-fairy-c2.png"}, {"id": "glimmer-light-wisp-c2", "name_ja": "きらりウィスプ", "tier": "中盤", "element": "光", "flavor_ja": "やさしい ひかりを まとった しあわせの せいれい。そばに いるだけで、まわりが ぽかぽか あかるくなる。", "img": "gacha_c2/glimmer-light-wisp-c2.png"}, {"id": "frosty-snow-poff-c2", "name_ja": "こおりのゆきまる", "tier": "中盤", "element": "氷", "flavor_ja": "ほっぺが ぽっと あかい、さむがりやの こおりの せいれい。なかよしの あいてには、つめたい ゆきだまを そっと わたす。", "img": "gacha_c2/frosty-snow-poff-c2.png"}, {"id": "bubbly-soap-elf-c2", "name_ja": "あわあわシャボン", "tier": "終盤", "element": "水", "flavor_ja": "ぷかぷか はじける あわの ようせい。にじいろの シャボンを とばして あそぶのが だいすきな、いたずらっこ。", "img": "gacha_c2/bubbly-soap-elf-c2.png"}, {"id": "crystal-gem-cherub-c2", "name_ja": "きらめきクリスタ", "tier": "終盤", "element": "結晶", "flavor_ja": "ひかりを あびると しゃらしゃら かがやく、たからものの せいれい。きれいな ものが だいすきで、つい あつめちゃう。", "img": "gacha_c2/crystal-gem-cherub-c2.png"}, {"id": "grand-rainbow-spirit-king-c2", "name_ja": "にじいろプリズマ", "tier": "ラスボス級", "element": "光", "flavor_ja": "すべての ひかりの いろを おさめる、せいれいたちの やさしい おうさま。おこると にじが きえるけど、ふだんは とっても あったかい。", "img": "gacha_c2/grand-rainbow-spirit-king-c2.png"}, {"id": "spark-axolotl-pup-c2", "name_ja": "ぴりりウーパー", "tier": "序盤", "element": "電気", "flavor_ja": "頭のふさふさエラから小さな電気をパチパチ出す赤ちゃんウーパー。なでると静電気でくっつく。", "img": "gacha_c2/spark-axolotl-pup-c2.png"}, {"id": "bubble-frog-hopling-c2", "name_ja": "あわっぴょん", "tier": "序盤", "element": "空気", "flavor_ja": "のどの袋をふくらませてシャボン玉をぷくぷく出すカエル。鳴くたびに泡がはじける。", "img": "gacha_c2/bubble-frog-hopling-c2.png"}, {"id": "frost-seal-pup-c2", "name_ja": "こおりアザラシ", "tier": "序盤", "element": "氷", "flavor_ja": "体じゅうに霜をまとった真っ白なアザラシの赤ちゃん。さわるとひんやり、寝てばかりの序盤の敵。", "img": "gacha_c2/frost-seal-pup-c2.png"}, {"id": "splash-otter-kit-c2", "name_ja": "ぱしゃカワウソ", "tier": "序盤", "element": "水", "flavor_ja": "いつもぬれてつやつや、両手でぱしゃぱしゃ水遊びするカワウソの子。元気いっぱいの序盤の敵。", "img": "gacha_c2/splash-otter-kit-c2.png"}, {"id": "lantern-jelly-floof-c2", "name_ja": "ぽわんクラゲ", "tier": "中盤", "element": "光", "flavor_ja": "体の中からやわらかく光る、ぷにぷにのクラゲ。暗いところでぼうっと光って道を照らす。", "img": "gacha_c2/lantern-jelly-floof-c2.png"}, {"id": "coral-seahorse-foal-c2", "name_ja": "さんごタツノコ", "tier": "中盤", "element": "結晶", "flavor_ja": "背中からサンゴの結晶が育つ、ずんぐりタツノオトシゴ。しっぽを巻いて踏ん張る中盤の相手。", "img": "gacha_c2/coral-seahorse-foal-c2.png"}, {"id": "ember-frog-tadpole-c2", "name_ja": "ぽかぽカエル", "tier": "中盤", "element": "炎", "flavor_ja": "おなかがぽかぽか温かい、ほのおをまとったカエル。寒い日はみんなが集まってくる中盤の敵。", "img": "gacha_c2/ember-frog-tadpole-c2.png"}, {"id": "thunder-axolotl-elder-c2", "name_ja": "ばちばちウーパー", "tier": "終盤", "element": "電気", "flavor_ja": "あの赤ちゃんが立派に育った姿。エラから本気の稲妻を放つ、終盤の手ごわいウーパー。", "img": "gacha_c2/thunder-axolotl-elder-c2.png"}, {"id": "tide-seal-guardian-c2", "name_ja": "うずしおアザラシ", "tier": "終盤", "element": "水", "flavor_ja": "渦潮をまとう海の番人アザラシ。ふだんは穏やかだが、本気を出すと潮の流れを操る終盤の壁。", "img": "gacha_c2/tide-seal-guardian-c2.png"}, {"id": "prism-jelly-sovereign-c2", "name_ja": "にじいろクラゲ王", "tier": "ラスボス級", "element": "光", "flavor_ja": "光を七色に分けて降りそそぐ、かわいくも荘厳なクラゲの王。海の底でいちばん明るく輝く存在。", "img": "gacha_c2/prism-jelly-sovereign-c2.png"}, {"id": "komainu-pup-spark-c2", "name_ja": "ちびこま電(でん)", "tier": "序盤", "element": "電気", "flavor_ja": "神社をまもる子こま犬。背中でパチパチ電気をためて、しっぽをふるとちいさな雷が走る。なつっこい。", "img": "gacha_c2/komainu-pup-spark-c2.png"}, {"id": "inari-kit-flame-c2", "name_ja": "こぎつね灯(ともし)", "tier": "序盤", "element": "炎", "flavor_ja": "おいなりさんのおつかいの子ぎつね。しっぽのさきに小さな炎をともして、夜道をてらしてくれる。", "img": "gacha_c2/inari-kit-flame-c2.png"}, {"id": "mame-tanuki-bubble-c2", "name_ja": "まめだぬ泡(あわ)", "tier": "序盤", "element": "水", "flavor_ja": "おなかをポンとたたくと、あわあわの泡がふくらむ豆だぬき。まんまるでおっちょこちょい。", "img": "gacha_c2/mame-tanuki-bubble-c2.png"}, {"id": "mame-tengu-leaf-c2", "name_ja": "まめ天狗(てんぐ)", "tier": "序盤", "element": "風", "flavor_ja": "はっぱのうちわでそよ風をおこす豆天狗。鼻はまだ小さいけれど、いばりんぼで一人前のつもり。", "img": "gacha_c2/mame-tengu-leaf-c2.png"}, {"id": "kappa-tot-droplet-c2", "name_ja": "ちび河童(かっぱ)", "tier": "中盤", "element": "水", "flavor_ja": "頭のお皿にお水をためた子河童。お皿が乾くと元気がなくなるので、いつもみずみずしい。きゅうりが大すき。", "img": "gacha_c2/kappa-tot-droplet-c2.png"}, {"id": "yuki-usagi-crystal-c2", "name_ja": "ゆきうさ晶(しょう)", "tier": "中盤", "element": "氷", "flavor_ja": "雪のひにあらわれる、ふわふわの妖怪うさぎ。耳のさきに小さな氷のけっしょうがそだつ。さわるとひんやり。", "img": "gacha_c2/yuki-usagi-crystal-c2.png"}, {"id": "chochin-bake-glow-c2", "name_ja": "ちょうちんポッ", "tier": "中盤", "element": "光", "flavor_ja": "おまつりの夜にコロコロ笑う、ちょうちんの妖怪。中からぽわっと明るくひかって、迷子をてらしてくれる。", "img": "gacha_c2/chochin-bake-glow-c2.png"}, {"id": "kaminari-baby-storm-c2", "name_ja": "らいの子(こ)", "tier": "終盤", "element": "電気", "flavor_ja": "太鼓をたたいて雷をならす、ちびっこの雷さま。元気いっぱいで、はりきると体じゅうにビリビリ電気が走る。", "img": "gacha_c2/kaminari-baby-storm-c2.png"}, {"id": "oni-pup-ember-c2", "name_ja": "ちび鬼炎(おにび)", "tier": "終盤", "element": "炎", "flavor_ja": "金棒のさきに小さな炎をともす、子鬼の見習い。こわそうに見えて、本当はさみしがりやでがんばりや。", "img": "gacha_c2/oni-pup-ember-c2.png"}, {"id": "kyubi-mochi-spirit-c2", "name_ja": "もち九尾(きゅうび)", "tier": "ラスボス級", "element": "光", "flavor_ja": "九つのしっぽをもつ、もちもちの大妖怪。やさしい光をまとっているけれど、本気をだすと社じゅうが金色にかがやく。", "img": "gacha_c2/kyubi-mochi-spirit-c2.png"}]; const KEY="rika2_boss_swipe_gacha_c2";
let st=JSON.parse(localStorage.getItem(KEY)||"null")||{idx:0,dec:{}};
function save(){localStorage.setItem(KEY,JSON.stringify(st));}
const stage=document.getElementById("stage");
document.getElementById("total_n").textContent=BOSSES.length;
let card=null,startX=0,curX=0,dragging=false;

function counts(){const y=Object.values(st.dec).filter(v=>v==="yes").length;
  document.getElementById("done_n").textContent=Object.keys(st.dec).length;
  document.getElementById("yes_n").textContent=y;}

function build(idx){
  const b=BOSSES[idx]; const el=document.createElement("div"); el.className="card";
  el.innerHTML=`<div class="stamp yes">有り</div><div class="stamp no">無し</div>
    <div class="imgbox"><img src="${b.img}" alt=""></div>
    <div class="info"><div class="nm">${b.name_ja}<span class="tier t${b.tier}">${b.tier}</span></div>
    <div class="el">${b.element}</div><div class="fl">${b.flavor_ja}</div></div>`;
  el.addEventListener("pointerdown",down); el.addEventListener("pointermove",move);
  el.addEventListener("pointerup",up); el.addEventListener("pointercancel",up);
  return el;
}
function show(){
  if(card){card.remove();card=null;}
  if(st.idx>=BOSSES.length){document.getElementById("doneScreen").style.display="flex";finish();return;}
  document.getElementById("doneScreen").style.display="none";
  card=build(st.idx); stage.appendChild(card); counts();
}
function down(e){dragging=true;startX=e.clientX;curX=0;card.setPointerCapture(e.pointerId);card.style.transition="none";}
function move(e){if(!dragging)return;curX=e.clientX-startX;card.style.transform=`translateX(${curX}px) rotate(${curX/18}deg)`;
  card.querySelector(".yes").style.opacity=Math.max(0,Math.min(1,curX/90));
  card.querySelector(".no").style.opacity=Math.max(0,Math.min(1,-curX/90));}
function up(){if(!dragging)return;dragging=false;
  if(curX>90)decide("yes");else if(curX<-90)decide("no");
  else{card.style.transition=".2s";card.style.transform="";card.querySelector(".yes").style.opacity=0;card.querySelector(".no").style.opacity=0;}}
function decide(v){
  st.dec[BOSSES[st.idx].id]=v; save();
  const dir=v==="yes"?1:-1;
  card.style.transition=".3s ease-out";
  card.style.transform=`translateX(${dir*140}vw) rotate(${dir*25}deg)`;
  card.style.opacity="0";
  setTimeout(()=>{st.idx++;save();show();},260);
}
function undo(){if(st.idx<=0)return;st.idx--;delete st.dec[BOSSES[st.idx].id];save();show();}
function summaryText(){
  const yes=BOSSES.filter(b=>st.dec[b.id]==="yes"),no=BOSSES.filter(b=>st.dec[b.id]==="no");
  let s=`=== ボス選別 結果 (有り${yes.length} / 無し${no.length} / 計${BOSSES.length}) ===\n【有り】\n`;
  yes.forEach(b=>s+=`- ${b.name_ja} (${b.tier}/${b.element}) [${b.id}]\n`);
  s+="【無し】\n"; no.forEach(b=>s+=`- ${b.name_ja} (${b.tier}/${b.element}) [${b.id}]\n`);
  return s;
}
function finish(){
  const yes=BOSSES.filter(b=>st.dec[b.id]==="yes").length;
  document.getElementById("summary").textContent=`有り ${yes} 体 / 無し ${BOSSES.length-yes} 体`;
}
function copyOut(){const s=summaryText();const o=document.getElementById("out");o.style.display="block";o.value=s;
  if(navigator.clipboard)navigator.clipboard.writeText(s).then(()=>{const t=document.getElementById("toast");t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1500);},()=>{});o.select();}
document.getElementById("bNo").onclick=()=>{if(st.idx<BOSSES.length)decide("no");};
document.getElementById("bYes").onclick=()=>{if(st.idx<BOSSES.length)decide("yes");};
document.getElementById("bUndo").onclick=undo;
document.getElementById("bCopy").onclick=copyOut;
document.getElementById("copyBtn").onclick=copyOut;
document.getElementById("restartBtn").onclick=()=>{st={idx:0,dec:{}};save();show();};
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"&&st.idx<BOSSES.length)decide("no");
  else if(e.key==="ArrowRight"&&st.idx<BOSSES.length)decide("yes");else if(e.key==="Backspace")undo();});
show();
</script></body></html>
