<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>ボス選別 — 理科RPG2</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0f1014;color:#e7e7ea;font-family:system-ui,"Hiragino Kaku Gothic ProN",sans-serif;overflow:hidden;height:100dvh}
header{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;background:#1a1c22;border-bottom:1px solid #2c2f3a}
header b{color:#ffe27a}.count{font-size:13px;color:#9aa0ad}
.stage{position:relative;height:calc(100dvh - 150px);display:flex;align-items:center;justify-content:center;padding:10px}
.card{position:absolute;width:min(92vw,440px);max-height:100%;background:#1d1f26;border:1px solid #2c2f3a;border-radius:18px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5);touch-action:none}
.imgbox{aspect-ratio:1/1;
  background-image:linear-gradient(45deg,#cfcfcf 25%,transparent 25%),linear-gradient(-45deg,#cfcfcf 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#cfcfcf 75%),linear-gradient(-45deg,transparent 75%,#cfcfcf 75%);
  background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0;background-color:#e9e9e9}
.imgbox img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.info{padding:12px 16px}
.nm{font-size:22px;font-weight:800}
.nm .tier{font-size:14px;font-weight:700;padding:2px 10px;border-radius:999px;margin-left:8px;vertical-align:3px}
.t序盤{background:#2bd47a;color:#06210f}.t中盤{background:#4aa3ff;color:#04203f}.t終盤{background:#ff9a3c;color:#311600}.tラスボス級{background:#ff5a7a;color:#33000d}
.el{font-size:12px;color:#9aa0ad;margin-top:2px}
.fl{font-size:14px;color:#cfd3db;margin-top:8px;line-height:1.55}
.stamp{position:absolute;top:18px;font-size:34px;font-weight:900;padding:4px 14px;border:4px solid;border-radius:12px;opacity:0;transform:rotate(-15deg)}
.yes{left:18px;color:#2bd47a;border-color:#2bd47a}.no{right:18px;color:#ff5a7a;border-color:#ff5a7a}
.bar{position:fixed;bottom:0;left:0;right:0;height:90px;display:flex;align-items:center;justify-content:center;gap:22px;background:#13141a;border-top:1px solid #2c2f3a}
.fab{width:62px;height:62px;border-radius:50%;border:none;font-size:26px;cursor:pointer;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.fab.no{background:#2a1d23;color:#ff5a7a;border:2px solid #ff5a7a}.fab.yes{background:#16271c;color:#2bd47a;border:2px solid #2bd47a}
.fab.undo{width:48px;height:48px;font-size:18px;background:#23242c;color:#cfd3db;border:1px solid #3a3f4c}
.done{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.done h2{color:#ffe27a;margin:0 0 8px}
.btn{margin-top:14px;background:#ffe27a;color:#15161a;border:none;border-radius:10px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
#out{margin-top:12px;width:min(92vw,520px);height:160px;font-family:ui-monospace,monospace;font-size:11px;display:none;background:#0b0c10;color:#cfd3db;border:1px solid #3a3f4c;border-radius:8px;padding:8px}
.hint{font-size:11px;color:#6b7280;margin-top:6px}
.toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%);background:#2bd47a;color:#08210f;padding:8px 16px;border-radius:999px;font-weight:700;opacity:0;transition:.3s;pointer-events:none}.toast.show{opacity:1}
</style></head><body>
<header><div><b>ボス選別</b> <span style="font-size:12px;color:#9aa0ad">← 無し / 有り → ・ドラッグもOK</span></div>
  <div class="count"><span id="done_n">0</span>/<span id="total_n">0</span> ・有り<span id="yes_n">0</span></div></header>
<div class="stage" id="stage">
  <div class="done" id="doneScreen">
    <h2>選別おわり！</h2>
    <div id="summary" style="color:#cfd3db"></div>
    <button class="btn" id="copyBtn">結果をコピー</button>
    <div class="hint">コピーしたテキストをチャットに貼ってください（採用の系統を学習して次の50枚へ）。</div>
    <textarea id="out" readonly></textarea>
    <button class="btn" id="restartBtn" style="background:#3a3f4c;color:#e7e7ea">最初からやり直す</button>
  </div>
</div>
<div class="bar">
  <button class="fab no" id="bNo">✗</button>
  <button class="fab undo" id="bUndo">↶</button>
  <button class="fab yes" id="bYes">♥</button>
  <button class="btn" id="bCopy" style="position:fixed;right:12px;bottom:104px;padding:8px 12px;font-size:12px">途中保存コピー</button>
</div>
<div class="toast" id="toast">コピーしました！</div>
<script>
const BOSSES=[{"id": "pika-puff-mascot-c4", "name_ja": "ピカぷくん", "tier": "序盤", "element": "電気", "flavor_ja": "ほっぺをこすると、ぱちぱち静電気がはじける電気のマスコット。なでると毛がぶわっと逆立つ。", "img": "gacha_c4/pika-puff-mascot-c4.png"}, {"id": "bubblo-tot-c4", "name_ja": "あわぽよ", "tier": "序盤", "element": "泡", "flavor_ja": "プニプニの泡でできた精霊。さわるとシャボンの香りがして、ぷるんと弾む。", "img": "gacha_c4/bubblo-tot-c4.png"}, {"id": "glow-fawn-lumi-c4", "name_ja": "ぽわホタル", "tier": "序盤", "element": "光", "flavor_ja": "しっぽのランタンがふんわり光る、夜道を照らしてくれる小さな相棒。さみしがりや。", "img": "gacha_c4/glow-fawn-lumi-c4.png"}, {"id": "crysti-cub-c4", "name_ja": "きらこぐま", "tier": "序盤", "element": "結晶", "flavor_ja": "背中の宝石をぷるぷる震わせて喜ぶ、人なつっこい結晶のこぐま。みがくとよく光る。", "img": "gacha_c4/crysti-cub-c4.png"}, {"id": "flamio-pup-c4", "name_ja": "ぽちメラ", "tier": "中盤", "element": "炎", "flavor_ja": "いつもぽかぽか、ちょっぴり熱い元気いっぱいの炎の子犬。やる気になると毛が燃える。", "img": "gacha_c4/flamio-pup-c4.png"}, {"id": "thunder-bun-zap-c4", "name_ja": "ビリうさ", "tier": "中盤", "element": "電気", "flavor_ja": "耳の先からビリビリ放電する、いたずら好きの電気うさぎ。すばやくて捕まえにくい。", "img": "gacha_c4/thunder-bun-zap-c4.png"}, {"id": "aqua-otter-pearl-c4", "name_ja": "みずたまカワ", "tier": "中盤", "element": "水", "flavor_ja": "いつも水玉をだいじに抱えている、まんまる水のカワウソ。ころんと転がるのが得意。", "img": "gacha_c4/aqua-otter-pearl-c4.png"}, {"id": "prismo-foxling-c4", "name_ja": "にじいろキツ", "tier": "終盤", "element": "光", "flavor_ja": "光をプリズムのようにわけて、もふもふの尾を虹色にきらめかせる気高い精霊。すこし気どり屋。", "img": "gacha_c4/prismo-foxling-c4.png"}, {"id": "geo-mole-gemma-c4", "name_ja": "ジオもぐっち", "tier": "終盤", "element": "結晶", "flavor_ja": "背中に地層の宝石をしょった、どっしり頼れる地学のもぐら。地面を掘ると宝石が育つ。", "img": "gacha_c4/geo-mole-gemma-c4.png"}, {"id": "star-leo-cosmo-c4", "name_ja": "おほしさまレオ", "tier": "ラスボス級", "element": "光", "flavor_ja": "星空のたてがみをまとった、ちいさくも気高い光の獣の王さま。なでると宇宙の音がきこえる。", "img": "gacha_c4/star-leo-cosmo-c4.png"}, {"id": "spark-hatchling-drake-c4", "name_ja": "ピリピリちびドラゴン", "tier": "序盤", "element": "電気", "flavor_ja": "怒るとほっぺがバチバチ光る、生まれたてのちびドラゴン。なでると静電気でピリッとくる。", "img": "gacha_c4/spark-hatchling-drake-c4.png"}, {"id": "bubble-griffin-chick-c4", "name_ja": "あわあわ子グリフォン", "tier": "序盤", "element": "水", "flavor_ja": "羽ばたくたびに泡がプクプク。まだ飛べなくて、地面でぴょこぴょこ跳ねる子グリフォン。", "img": "gacha_c4/bubble-griffin-chick-c4.png"}, {"id": "pebble-golem-baby-c4", "name_ja": "ころころ赤ちゃんゴーレム", "tier": "序盤", "element": "結晶", "flavor_ja": "石ころから生まれたばかりのちびゴーレム。よちよち歩きで、肩のキラキラ結晶を自慢げに見せてくる。", "img": "gacha_c4/pebble-golem-baby-c4.png"}, {"id": "ember-phoenix-fledgling-c4", "name_ja": "ぽっぽちびフェニックス", "tier": "序盤", "element": "炎", "flavor_ja": "あくびをするとちっちゃな火がポッと出る、ふわふわのちびフェニックス。寒い日はみんなのカイロ役。", "img": "gacha_c4/ember-phoenix-fledgling-c4.png"}, {"id": "glow-kirin-calf-c4", "name_ja": "ぴかぴか子キリン", "tier": "中盤", "element": "光", "flavor_ja": "角がぼんやり光る、おとなしい子キリン。なつくと体ごとほんのり明るくなる。", "img": "gacha_c4/glow-kirin-calf-c4.png"}, {"id": "fizz-hydra-pup-c4", "name_ja": "シュワシュワちびヒドラ", "tier": "中盤", "element": "泡", "flavor_ja": "三つの頭がいつもケンカするけど、すぐ仲直りするおっちょこちょいのちびヒドラ。体からシュワシュワ音がする。", "img": "gacha_c4/fizz-hydra-pup-c4.png"}, {"id": "frost-kraken-tot-c4", "name_ja": "つるつる子クラーケン", "tier": "中盤", "element": "氷", "flavor_ja": "さわると体がひんやりつるつる。深い海から来た、人見知りな子クラーケン。", "img": "gacha_c4/frost-kraken-tot-c4.png"}, {"id": "leaf-leviathan-sprout-c4", "name_ja": "もりもり子リヴァイアサン", "tier": "終盤", "element": "植物", "flavor_ja": "背中から葉っぱが生える、おっとりした子リヴァイアサン。日なたぼっこが大好きで、よく寝てしまう。", "img": "gacha_c4/leaf-leviathan-sprout-c4.png"}, {"id": "magnet-cerberus-pup-c4", "name_ja": "くっつき子ケルベロス", "tier": "終盤", "element": "磁石", "flavor_ja": "三つの頭がいつも別の方を向く、元気いっぱいの子ケルベロス。近づくと体に小物がくっついてくる。", "img": "gacha_c4/magnet-cerberus-pup-c4.png"}, {"id": "prism-celestial-wyrmling-c4", "name_ja": "にじいろ天竜のあかちゃん", "tier": "ラスボス級", "element": "光", "flavor_ja": "伝説の天竜の、生まれたばかりのあかちゃん。まだちっちゃいのに、体じゅうから七色の光がこぼれる特別な子。", "img": "gacha_c4/prism-celestial-wyrmling-c4.png"}, {"id": "jelly-droplet-puni-c4", "name_ja": "ぷにしずく", "tier": "序盤", "element": "水", "flavor_ja": "雨上がりの水たまりから生まれた、ぷにぷにのしずくスライム。さわるとぷるんと弾んで、ちょっと冷たい。", "img": "gacha_c4/jelly-droplet-puni-c4.png"}, {"id": "mochi-bun-sprite-c4", "name_ja": "もちまるくん", "tier": "序盤", "element": "光", "flavor_ja": "つきたてのおもちから生まれた、ぽわぽわ光るもちの子。やさしく握るとびよーんと伸びて、ほんのり温かい。", "img": "gacha_c4/mochi-bun-sprite-c4.png"}, {"id": "soap-bubble-puff-c4", "name_ja": "あわぷくちゃん", "tier": "序盤", "element": "泡", "flavor_ja": "せっけんの泡から生まれた、にじいろにキラキラ光る泡の子。ふわっと弾むと、まわりに小さなあわがぷちぷち出る。", "img": "gacha_c4/soap-bubble-puff-c4.png"}, {"id": "puni-tadpole-gel-c4", "name_ja": "ぷよオタマ", "tier": "序盤", "element": "水", "flavor_ja": "池のすみで生まれた、ゼリーみたいなぷよぷよオタマ。しっぽをふってぴょこぴょこ泳ぎ、つつくとぷるんと震える。", "img": "gacha_c4/puni-tadpole-gel-c4.png"}, {"id": "dew-jelly-cat-mochi-c4", "name_ja": "もちにゃこ", "tier": "中盤", "element": "水", "flavor_ja": "水たまりとおもちが混ざって生まれた、ねこの形のぷにスライム。なでるとびよーんと伸び、しっぽの先からしずくがぽとり。", "img": "gacha_c4/dew-jelly-cat-mochi-c4.png"}, {"id": "bubble-bunny-foam-c4", "name_ja": "あわウサ", "tier": "中盤", "element": "泡", "flavor_ja": "おふろのあわから生まれた、もこもこのあわウサギ。ぴょんと跳ねるたびに、体じゅうのあわがぷちぷちはじける。", "img": "gacha_c4/bubble-bunny-foam-c4.png"}, {"id": "glow-mochi-frog-c4", "name_ja": "ぴかもちガエル", "tier": "中盤", "element": "光", "flavor_ja": "ひだまりのおもちから生まれた、おなかがぽわっと光るもちガエル。ぺたんと座ってにこにこし、つつくとぷにっとへこむ。", "img": "gacha_c4/glow-mochi-frog-c4.png"}, {"id": "rainbow-jelly-pudding-king-c4", "name_ja": "ぷるぷるプリン王", "tier": "終盤", "element": "水", "flavor_ja": "あまいゼリーの国をおさめる、ぷるんと大きなプリンの王さま。えらそうにふんぞり返るたび、にじいろの体がぷるぷる揺れる。", "img": "gacha_c4/rainbow-jelly-pudding-king-c4.png"}, {"id": "prism-bubble-whale-puni-c4", "name_ja": "あわくじらルン", "tier": "終盤", "element": "泡", "flavor_ja": "泡の海をただよう、まんまる大きな泡のクジラ。背中のあわをぷくぷくふくらませながら、のんびりぷかぷか進む。", "img": "gacha_c4/prism-bubble-whale-puni-c4.png"}, {"id": "great-puni-mochi-deity-c4", "name_ja": "おおもちぷにさま", "tier": "ラスボス級", "element": "光", "flavor_ja": "もちの世界をやさしく見守る、とほうもなく大きなもちの大精霊。ぽわぽわ光りながらにこにこ笑い、近づくと体ぜんぶがぷるんと揺れる。", "img": "gacha_c4/great-puni-mochi-deity-c4.png"}, {"id": "ember-wisp-sprite-c4", "name_ja": "ぽっとびちゃん", "tier": "序盤", "element": "炎", "flavor_ja": "ろうそくのほのおから生まれたちいさな精霊。ぽっと灯ると、あったかい笑顔でとことこついてくる。", "img": "gacha_c4/ember-wisp-sprite-c4.png"}, {"id": "dewdrop-water-fairy-c4", "name_ja": "しずくのフェアリィ", "tier": "序盤", "element": "水", "flavor_ja": "あさつゆのひとしずくが、ぷるんと命をもった妖精。さわると、ちゃぷんと音がしそう。", "img": "gacha_c4/dewdrop-water-fairy-c4.png"}, {"id": "breeze-puff-sprite-c4", "name_ja": "そよかぜぷう", "tier": "序盤", "element": "風", "flavor_ja": "そよ風がくるくる丸まってできた、ふわふわの精霊。近づくと、ほっぺをくすぐる風をおくる。", "img": "gacha_c4/breeze-puff-sprite-c4.png"}, {"id": "spark-bolt-pixie-c4", "name_ja": "ぴりっとくん", "tier": "序盤", "element": "雷", "flavor_ja": "かみなりのかけらがはじけてできた、げんきいっぱいの妖精。さわると、ぱちっとしびれてくすぐったい。", "img": "gacha_c4/spark-bolt-pixie-c4.png"}, {"id": "glimmer-light-fairy-c4", "name_ja": "きらりんフェアリィ", "tier": "中盤", "element": "光", "flavor_ja": "あさひのひとすじから生まれた、やさしい光の妖精。そばにいると、心がぽかぽかあかるくなる。", "img": "gacha_c4/glimmer-light-fairy-c4.png"}, {"id": "bubble-foam-spirit-c4", "name_ja": "あわまろ", "tier": "中盤", "element": "泡", "flavor_ja": "せっけんの泡がいくつも合わさってできた、ぷかぷか精霊。ぷちんとはじけそうで、なかなかはじけない。", "img": "gacha_c4/bubble-foam-spirit-c4.png"}, {"id": "crystal-gleam-sprite-c4", "name_ja": "きらめきクリス", "tier": "中盤", "element": "結晶", "flavor_ja": "どうくつの結晶から、こつんと生まれた精霊。光をあてると、きらきら七色にかがやく。", "img": "gacha_c4/crystal-gleam-sprite-c4.png"}, {"id": "blaze-flare-djinn-c4", "name_ja": "ぼうぼうジン", "tier": "終盤", "element": "炎", "flavor_ja": "たくさんのほのおの精霊がぎゅっと集まって生まれた、ちょっぴり強い炎の親分。胸をはった笑顔がたのもしい。", "img": "gacha_c4/blaze-flare-djinn-c4.png"}, {"id": "tempest-storm-pixie-c4", "name_ja": "あらしのピコ", "tier": "終盤", "element": "雷", "flavor_ja": "あらしの真ん中で生まれた、いたずら好きの妖精。ぴかっと光って、ごろごろ笑う。", "img": "gacha_c4/tempest-storm-pixie-c4.png"}, {"id": "prism-radiant-fairy-queen-c4", "name_ja": "ひかりの妖精女王プリズマ", "tier": "ラスボス級", "element": "光", "flavor_ja": "すべての光の妖精をたばねる、やさしくも気高い女王さま。ほほえむだけで、あたりが七色にかがやく。", "img": "gacha_c4/prism-radiant-fairy-queen-c4.png"}, {"id": "bubble-axolotl-pop-c4", "name_ja": "アワウパー", "tier": "序盤", "element": "水・泡", "flavor_ja": "ぷかぷか泡を吹きながらにっこり笑う、まんまるウーパールーパーの精霊。エラのもこもこ泡がきらきら光る。", "img": "gacha_c4/bubble-axolotl-pop-c4.png"}, {"id": "spark-frog-fizzy-c4", "name_ja": "ピカガエル", "tier": "序盤", "element": "電気", "flavor_ja": "ほっぺに電気をためてピカッと光る、ちっちゃくて元気なカエルのモンスター。なでると軽くしびれる。", "img": "gacha_c4/spark-frog-fizzy-c4.png"}, {"id": "puddle-seal-pup-c4", "name_ja": "ぷにアザラシ", "tier": "序盤", "element": "水・氷", "flavor_ja": "まんまるでぷにぷに、背中にうっすら氷の粉をまとった子アザラシ。ころんと転がって甘えてくる。", "img": "gacha_c4/puddle-seal-pup-c4.png"}, {"id": "candy-jelly-glow-c4", "name_ja": "ぷかリンクラゲ", "tier": "序盤", "element": "光・発光", "flavor_ja": "中からふんわり光る、ゼリーみたいにぷるぷるしたキャンディ色のクラゲ。ぽよぽよ歩いてついてくる。", "img": "gacha_c4/candy-jelly-glow-c4.png"}, {"id": "otter-stone-skipper-c4", "name_ja": "コロリカワウソ", "tier": "中盤", "element": "水・流れ", "flavor_ja": "おなかに小石を抱えてご機嫌な、まるっこいカワウソ。体には流れる水のリボンがまとわりつく。", "img": "gacha_c4/otter-stone-skipper-c4.png"}, {"id": "seahorse-curl-bubbler-c4", "name_ja": "くるりタツノコ", "tier": "中盤", "element": "水・泡", "flavor_ja": "おなかぽってり、しっぽをくるんと巻いて立つカラフルなタツノオトシゴ。体に泡の粒がくっついてキラキラ。", "img": "gacha_c4/seahorse-curl-bubbler-c4.png"}, {"id": "frog-leaf-dewdrop-c4", "name_ja": "つゆだまガエル", "tier": "中盤", "element": "植物・水滴", "flavor_ja": "背中から若葉を生やし、体じゅうに朝つゆをまとった元気なアマガエル。葉っぱとつゆが体にくっついている。", "img": "gacha_c4/frog-leaf-dewdrop-c4.png"}, {"id": "axolotl-flame-emberfin-c4", "name_ja": "ぽかぽかウパ", "tier": "終盤", "element": "炎・熱", "flavor_ja": "エラが小さな炎になった、ぽかぽか温かいウーパールーパーの上位種。なでると毛布みたいにあったかい。", "img": "gacha_c4/axolotl-flame-emberfin-c4.png"}, {"id": "seal-crystal-frostpup-c4", "name_ja": "こおりアザラシ姫", "tier": "終盤", "element": "結晶・氷", "flavor_ja": "頭に氷の結晶の冠をいただいた、つやつやのアザラシ姫。背中の宝石みたいな結晶が体にしっかり生えている。", "img": "gacha_c4/seal-crystal-frostpup-c4.png"}, {"id": "jelly-king-auroragel-c4", "name_ja": "オーロラのぷるりん王", "tier": "ラスボス級", "element": "光・電気", "flavor_ja": "体の中をオーロラと電気の光が渦巻く、にっこり笑う巨大クラゲの王さま。おっきいのにぷるぷるで優しい。", "img": "gacha_c4/jelly-king-auroragel-c4.png"}, {"id": "chibi-komainu-spark-c4", "name_ja": "ぴかこまいぬ", "tier": "序盤", "element": "電気", "flavor_ja": "じんじゃの入り口にいる、まんまるな子どもの狛犬。なでると静電気でしっぽの毛がぴーんと逆立つ。元気いっぱいで、よく豆狸とけんかして転がっている。", "img": "gacha_c4/chibi-komainu-spark-c4.png"}, {"id": "kogitsune-inari-flame-c4", "name_ja": "ちびこぎつね", "tier": "序盤", "element": "炎", "flavor_ja": "おいなりさんのおつかいをする、ちっちゃな子狐。しっぽの毛先がぽっと温かい炎の色にゆれる。あぶらあげが大好きで、見つけるとぱたぱた走ってくる。", "img": "gacha_c4/kogitsune-inari-flame-c4.png"}, {"id": "mametanuki-bubble-c4", "name_ja": "まめだぬき", "tier": "序盤", "element": "泡", "flavor_ja": "葉っぱを頭にのせた、まんまるの豆狸。お腹をぽんっと叩くと、しゃぼん玉がぷくぷくわいてくる。なまけものだけど、いざというとき泡で身を守る。", "img": "gacha_c4/mametanuki-bubble-c4.png"}, {"id": "chibi-kappa-water-c4", "name_ja": "ちびかっぱ", "tier": "序盤", "element": "水", "flavor_ja": "川辺にすむ、おだんごみたいな子河童。頭のお皿の水がこぼれると元気がなくなるので、いつも大事そうに首をかしげている。きゅうりをあげるとよろこぶ。", "img": "gacha_c4/chibi-kappa-water-c4.png"}, {"id": "mame-tengu-wind-c4", "name_ja": "まめてんぐ", "tier": "中盤", "element": "風", "flavor_ja": "山おくでくらす、ちっちゃな天狗。手のうちわをぱたぱたあおいで、つむじ風をおこすのが得意。鼻が高いのがじまんで、すぐ得意げになる。", "img": "gacha_c4/mame-tengu-wind-c4.png"}, {"id": "yukidaruma-bake-c4", "name_ja": "ゆきんこだるま", "tier": "中盤", "element": "氷", "flavor_ja": "雪のふる夜にうまれる、まんまるの雪の精。さわるとひんやり、でも心はぽかぽか。春が近づくとちょっとずつ小さくなって、また冬を待つ。", "img": "gacha_c4/yukidaruma-bake-c4.png"}, {"id": "chochin-obake-glow-c4", "name_ja": "ちょうちんこぞう", "tier": "中盤", "element": "光", "flavor_ja": "夜道をてらしてくれる、人なつっこい提灯のお化け。中からぽわっと光って、迷子をおうちまで案内する。ひとつ目だけど、こわくない。", "img": "gacha_c4/chochin-obake-glow-c4.png"}, {"id": "karakuri-tama-gear-c4", "name_ja": "からくりだま", "tier": "終盤", "element": "結晶", "flavor_ja": "むかしの職人がつくった、からくり人形の妖精。背中のねじを巻くと、体の歯車がカチカチ動いて結晶がきらめく。古いけれど、いちばん物知り。", "img": "gacha_c4/karakuri-tama-gear-c4.png"}, {"id": "kitsune-ouji-ninetail-c4", "name_ja": "きゅうびのおうじ", "tier": "終盤", "element": "炎", "flavor_ja": "九つのしっぽをもつ、ちびっこ狐の王子さま。しっぽの先に金色の狐火をともし、まわりをふんわり照らす。小さくても、いちばんの位をもつ気高い妖怪。", "img": "gacha_c4/kitsune-ouji-ninetail-c4.png"}, {"id": "ryujin-mame-thunder-c4", "name_ja": "まめりゅうじん", "tier": "ラスボス級", "element": "雷", "flavor_ja": "海と空をつかさどる、ちっちゃくてもえらい龍神さま。たてがみに雷雲をまとい、にぎった宝玉でいなずまをあやつる。とぐろを巻いてねむると、空に雨をふらせる。", "img": "gacha_c4/ryujin-mame-thunder-c4.png"}]; const KEY="rika2_boss_swipe_gacha_c4";
let st=JSON.parse(localStorage.getItem(KEY)||"null")||{idx:0,dec:{}};
function save(){localStorage.setItem(KEY,JSON.stringify(st));}
const stage=document.getElementById("stage");
document.getElementById("total_n").textContent=BOSSES.length;
let card=null,startX=0,curX=0,dragging=false;

function counts(){const y=Object.values(st.dec).filter(v=>v==="yes").length;
  document.getElementById("done_n").textContent=Object.keys(st.dec).length;
  document.getElementById("yes_n").textContent=y;}

function build(idx){
  const b=BOSSES[idx]; const el=document.createElement("div"); el.className="card";
  el.innerHTML=`<div class="stamp yes">有り</div><div class="stamp no">無し</div>
    <div class="imgbox"><img src="${b.img}" alt=""></div>
    <div class="info"><div class="nm">${b.name_ja}<span class="tier t${b.tier}">${b.tier}</span></div>
    <div class="el">${b.element}</div><div class="fl">${b.flavor_ja}</div></div>`;
  el.addEventListener("pointerdown",down); el.addEventListener("pointermove",move);
  el.addEventListener("pointerup",up); el.addEventListener("pointercancel",up);
  return el;
}
function show(){
  if(card){card.remove();card=null;}
  if(st.idx>=BOSSES.length){document.getElementById("doneScreen").style.display="flex";finish();return;}
  document.getElementById("doneScreen").style.display="none";
  card=build(st.idx); stage.appendChild(card); counts();
}
function down(e){dragging=true;startX=e.clientX;curX=0;card.setPointerCapture(e.pointerId);card.style.transition="none";}
function move(e){if(!dragging)return;curX=e.clientX-startX;card.style.transform=`translateX(${curX}px) rotate(${curX/18}deg)`;
  card.querySelector(".yes").style.opacity=Math.max(0,Math.min(1,curX/90));
  card.querySelector(".no").style.opacity=Math.max(0,Math.min(1,-curX/90));}
function up(){if(!dragging)return;dragging=false;
  if(curX>90)decide("yes");else if(curX<-90)decide("no");
  else{card.style.transition=".2s";card.style.transform="";card.querySelector(".yes").style.opacity=0;card.querySelector(".no").style.opacity=0;}}
function decide(v){
  st.dec[BOSSES[st.idx].id]=v; save();
  const dir=v==="yes"?1:-1;
  card.style.transition=".3s ease-out";
  card.style.transform=`translateX(${dir*140}vw) rotate(${dir*25}deg)`;
  card.style.opacity="0";
  setTimeout(()=>{st.idx++;save();show();},260);
}
function undo(){if(st.idx<=0)return;st.idx--;delete st.dec[BOSSES[st.idx].id];save();show();}
function summaryText(){
  const yes=BOSSES.filter(b=>st.dec[b.id]==="yes"),no=BOSSES.filter(b=>st.dec[b.id]==="no");
  let s=`=== ボス選別 結果 (有り${yes.length} / 無し${no.length} / 計${BOSSES.length}) ===\n【有り】\n`;
  yes.forEach(b=>s+=`- ${b.name_ja} (${b.tier}/${b.element}) [${b.id}]\n`);
  s+="【無し】\n"; no.forEach(b=>s+=`- ${b.name_ja} (${b.tier}/${b.element}) [${b.id}]\n`);
  return s;
}
function finish(){
  const yes=BOSSES.filter(b=>st.dec[b.id]==="yes").length;
  document.getElementById("summary").textContent=`有り ${yes} 体 / 無し ${BOSSES.length-yes} 体`;
}
function copyOut(){const s=summaryText();const o=document.getElementById("out");o.style.display="block";o.value=s;
  if(navigator.clipboard)navigator.clipboard.writeText(s).then(()=>{const t=document.getElementById("toast");t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1500);},()=>{});o.select();}
document.getElementById("bNo").onclick=()=>{if(st.idx<BOSSES.length)decide("no");};
document.getElementById("bYes").onclick=()=>{if(st.idx<BOSSES.length)decide("yes");};
document.getElementById("bUndo").onclick=undo;
document.getElementById("bCopy").onclick=copyOut;
document.getElementById("copyBtn").onclick=copyOut;
document.getElementById("restartBtn").onclick=()=>{st={idx:0,dec:{}};save();show();};
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"&&st.idx<BOSSES.length)decide("no");
  else if(e.key==="ArrowRight"&&st.idx<BOSSES.length)decide("yes");else if(e.key==="Backspace")undo();});
show();
</script></body></html>
