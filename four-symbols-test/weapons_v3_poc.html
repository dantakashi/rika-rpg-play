<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>武器 v3 レビュー — 理科RPG2</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0f1014;color:#e7e7ea;font-family:system-ui,"Hiragino Kaku Gothic ProN",sans-serif;padding-bottom:96px}
header{position:sticky;top:0;z-index:5;padding:10px 14px;background:#1a1c22;border-bottom:1px solid #2c2f3a}
header b{color:#ffe27a}.sub{font-size:12px;color:#9aa0ad;margin-top:4px;line-height:1.5}
.w{margin:16px 10px;border-top:1px solid #23252e;padding-top:10px}
.wh{display:flex;align-items:baseline;gap:10px;margin:0 4px 8px}
.wh .nm{font-size:17px;font-weight:800}
.wh .badge{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;background:#2c2f3a;color:#ffe27a}
.wh .none{margin-left:auto;font-size:12px;background:#2a1d23;color:#ff7a92;border:1px solid #ff5a7a;border-radius:8px;padding:5px 10px;cursor:pointer}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cand{background:#1d1f26;border:2px solid #2c2f3a;border-radius:12px;overflow:hidden;cursor:pointer;position:relative}
.cand .ib{aspect-ratio:1/1;background:#e9e9e9;display:flex;align-items:center;justify-content:center}
.cand img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.cand .v{font-size:10px;color:#9aa0ad;padding:4px 6px;text-align:center}
.cand.pick{border-color:#2bd47a;box-shadow:0 0 0 2px #2bd47a inset}
.cand.pick::after{content:"採用";position:absolute;top:6px;left:6px;background:#2bd47a;color:#06210f;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px}
.w.noned{opacity:.5}.w.noned .none{background:#ff5a7a;color:#33000d}
@media(max-width:560px){.row{grid-template-columns:repeat(2,1fr)}}
.bar{position:fixed;bottom:0;left:0;right:0;height:76px;display:flex;align-items:center;justify-content:center;gap:12px;background:#13141a;border-top:1px solid #2c2f3a;padding:0 12px}
.cnt{font-size:13px;color:#cfd3db}.cnt b{color:#2bd47a;font-size:18px}
.btn{background:#ffe27a;color:#15161a;border:none;border-radius:10px;padding:11px 16px;font-size:14px;font-weight:700;cursor:pointer}
#out{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);width:min(94vw,620px);height:180px;display:none;background:#0b0c10;color:#cfd3db;border:1px solid #3a3f4c;border-radius:8px;padding:8px;font-family:ui-monospace,monospace;font-size:11px}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:#2bd47a;color:#08210f;padding:8px 16px;border-radius:999px;font-weight:700;opacity:0;transition:.3s;pointer-events:none}.toast.show{opacity:1}
</style></head><body>
<header><b>武器 v3 レビュー</b>（POC・各<span id="ncand">4</span>枚から1枚選ぶ）
  <div class="sub">v3の3本柱＝①輪郭バリエ(杖を属性で出し分け) ②レア度で格(UR/LRは輪郭を解放して派手に) ③1武器4枚。<br>
  各武器でベストを1枚タップ→「採用」。どれもダメなら「全部ダメ」。下のボタンで結果をコピーしてチャットに貼ってください。<b>方向OKなら「v3でGO」だけでも可。</b></div></header>
<div id="root"></div>
<div class="bar">
  <div class="cnt">採用 <b id="pickn">0</b>/<span id="total">0</span></div>
  <button class="btn" id="copyBtn">結果をコピー</button>
</div>
<textarea id="out" readonly></textarea>
<div class="toast" id="toast">コピーしました！</div>
<script>
const W=[{"id": "eq257", "name_ja": "天魔滅却の大剣", "tier": "LR", "cls": "greatsword", "grade": "high", "cands": [{"img": "weap_v3poc/eq257_v0.jpg", "variant": "flamberge", "end": 0.56}, {"img": "weap_v3poc/eq257_v1.jpg", "variant": "winged", "end": 0.56}, {"img": "weap_v3poc/eq257_v2.jpg", "variant": "broad", "end": 0.56}, {"img": "weap_v3poc/eq257_v3.jpg", "variant": "flamberge", "end": 0.56}]}, {"id": "eq284", "name_ja": "大地震撼・制圧の大戦槌", "tier": "LR", "cls": "hammer", "grade": "high", "cands": [{"img": "weap_v3poc/eq284_v0.jpg", "variant": "ornate", "end": 0.56}, {"img": "weap_v3poc/eq284_v1.jpg", "variant": "double", "end": 0.56}, {"img": "weap_v3poc/eq284_v2.jpg", "variant": "maul", "end": 0.56}, {"img": "weap_v3poc/eq284_v3.jpg", "variant": "ornate", "end": 0.56}]}, {"id": "eq116", "name_ja": "終焉の杖", "tier": "UR", "cls": "staff", "grade": "high", "cands": [{"img": "weap_v3poc/eq116_v0.jpg", "variant": "horns", "end": 0.62}, {"img": "weap_v3poc/eq116_v1.jpg", "variant": "gnarled", "end": 0.62}, {"img": "weap_v3poc/eq116_v2.jpg", "variant": "wing", "end": 0.62}, {"img": "weap_v3poc/eq116_v3.jpg", "variant": "horns", "end": 0.62}]}, {"id": "eq269", "name_ja": "氷獄の極寒杖", "tier": "LR", "cls": "staff", "grade": "high", "cands": [{"img": "weap_v3poc/eq269_v0.jpg", "variant": "crystal", "end": 0.56}, {"img": "weap_v3poc/eq269_v1.jpg", "variant": "crescent", "end": 0.56}, {"img": "weap_v3poc/eq269_v2.jpg", "variant": "wing", "end": 0.56}, {"img": "weap_v3poc/eq269_v3.jpg", "variant": "crystal", "end": 0.56}]}, {"id": "eq293", "name_ja": "裁きと慈悲の聖杖", "tier": "LR", "cls": "staff", "grade": "high", "cands": [{"img": "weap_v3poc/eq293_v0.jpg", "variant": "cross", "end": 0.56}, {"img": "weap_v3poc/eq293_v1.jpg", "variant": "wing", "end": 0.56}, {"img": "weap_v3poc/eq293_v2.jpg", "variant": "trident", "end": 0.56}, {"img": "weap_v3poc/eq293_v3.jpg", "variant": "cross", "end": 0.56}]}]; const KEY="rika2_weapon_v3poc";
let st=JSON.parse(localStorage.getItem(KEY)||"{}");
const root=document.getElementById("root");
document.getElementById("total").textContent=W.length;
W.forEach(w=>{
  const box=document.createElement("div");box.className="w";box.id="w_"+w.id;
  if(st[w.id]==="NONE")box.classList.add("noned");
  box.innerHTML=`<div class="wh"><span class="nm">${w.name_ja}</span>
    <span class="badge">${w.tier} / ${w.cls}</span>
    <span class="none" data-id="${w.id}">全部ダメ</span></div>`;
  const row=document.createElement("div");row.className="row";
  w.cands.forEach((c,k)=>{
    const el=document.createElement("div");el.className="cand"+(st[w.id]===k?" pick":"");
    el.innerHTML=`<div class="ib"><img src="${c.img}" loading="lazy" alt=""></div><div class="v">${c.variant} (end${c.end})</div>`;
    el.onclick=()=>{st[w.id]=k;box.classList.remove("noned");localStorage.setItem(KEY,JSON.stringify(st));render();};
    row.appendChild(el);
  });
  box.appendChild(row);root.appendChild(box);
});
document.querySelectorAll(".none").forEach(b=>b.onclick=e=>{e.stopPropagation();const id=b.dataset.id;st[id]=(st[id]==="NONE")?undefined:"NONE";if(st[id]===undefined)delete st[id];localStorage.setItem(KEY,JSON.stringify(st));render();});
function render(){
  let n=0;
  W.forEach(w=>{
    const box=document.getElementById("w_"+w.id);
    box.classList.toggle("noned",st[w.id]==="NONE");
    box.querySelectorAll(".cand").forEach((el,k)=>el.classList.toggle("pick",st[w.id]===k));
    if(typeof st[w.id]==="number"||st[w.id]==="NONE")n++;
  });
  document.getElementById("pickn").textContent=n;
}
function copyOut(){
  let s=`=== 武器 v3 POC 結果 ===\n`;
  W.forEach(w=>{const v=st[w.id];
    if(v==="NONE")s+=`- ${w.name_ja} [${w.id}] => 全部ダメ\n`;
    else if(typeof v==="number")s+=`- ${w.name_ja} [${w.id}] => 採用 v${v} (${w.cands[v].variant})\n`;
    else s+=`- ${w.name_ja} [${w.id}] => 未選択\n`;});
  const o=document.getElementById("out");o.style.display="block";o.value=s;o.select();
  if(navigator.clipboard)navigator.clipboard.writeText(s).then(()=>{const t=document.getElementById("toast");t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1400);},()=>{});
}
document.getElementById("copyBtn").onclick=copyOut;
render();
</script></body></html>
