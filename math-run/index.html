<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>割れる数ラン 🦍🏃💥</title>
<style>
  /* ============================================================
     割れる数ラン — 数学バカゲー第2弾
     章＝99までの素数。迫る2つの壁(数字)のうち「割り切れる方」へ
     ゴリラの群れを左右レーン移動で走り込ませて壁をブチ破る。
     ・正解＝止まらず連続スクロール＋ゴリラ+1（稀に別サルやバナナが混じる）
     ・間違うと即ゲームオーバー。正解で加速。
     出題は mathbank.js の divisible(p, level)。
     ============================================================ */
  :root{ --ink:#1f2430; --paper:#fff7e6; --line:#e6d3a8; --green:#27a35a; --red:#e0533d;
    --blue:#2f7de1; --gold:#e3a32a; }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; color:var(--ink); overflow:hidden;
    font-family:"Yu Gothic","Meiryo",system-ui,sans-serif; user-select:none; -webkit-user-select:none;
    background:linear-gradient(180deg,#cfe9ff 0%,#eaf7ff 40%,#f6ecd0 100%);}
  .wrap{ width:min(560px,100%); margin:0 auto; padding:10px; }
  h1{ margin:.2em 0; font-size:clamp(22px,6vw,34px); text-align:center; }
  .sub{ text-align:center; color:#6b6250; margin:0 0 8px; font-size:13px; }
  .panel{ background:var(--paper); border:3px solid var(--line); border-radius:16px; padding:14px;
    box-shadow:0 6px 0 rgba(0,0,0,.08); }
  button{ font:inherit; color:inherit; cursor:pointer; }

  /* ---- 章選択 ---- */
  .chapInfo{ text-align:center; font-size:13px; color:#6b6250; margin:0 0 10px; }
  .chapGrid{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
  .chap{ position:relative; padding:12px 0; border:3px solid var(--line); border-radius:12px;
    background:#fffdf5; font-size:20px; font-weight:800; text-align:center; }
  .chap small{ display:block; font-weight:400; color:#9a8a64; font-size:10px; margin-top:2px; min-height:12px; }
  .chap:active{ transform:scale(.96); }

  /* ---- プレイ ---- */
  .hud{ display:flex; align-items:center; gap:8px; font-weight:800; margin-bottom:8px; font-size:14px; }
  .hud .big{ font-size:20px; color:var(--blue); }
  .hud .sp{ margin-left:auto; color:var(--red); }
  .track{ position:relative; width:100%; height:62vh; min-height:340px; border-radius:14px; overflow:hidden;
    background:linear-gradient(180deg,#bfe3ff 0%,#9fd0f5 60%,#7bbe6e 60%,#69b25e 100%);
    border:3px solid var(--line); touch-action:none; }
  .laneLine{ position:absolute; top:0; bottom:0; left:50%; width:0; border-left:4px dashed rgba(255,255,255,.6); }
  /* 壁（青/赤） */
  .wall{ position:absolute; width:44%; height:14%; display:flex; align-items:center; justify-content:center;
    font-size:clamp(26px,8vw,44px); font-weight:900; color:#fff; border-radius:10px;
    text-shadow:0 2px 4px rgba(0,0,0,.35); box-shadow:inset 0 -6px 0 rgba(0,0,0,.18); will-change:top; }
  #wallL{ left:3%; background:linear-gradient(180deg,#5aa0ff,#2f7de1); }
  #wallR{ right:3%; background:linear-gradient(180deg,#ff7a6a,#e0533d); }
  /* ゴリラの群れ（走者） */
  .runner{ position:absolute; bottom:4%; width:44%; left:3%; transition:left .1s ease;
    display:flex; flex-wrap:wrap-reverse; justify-content:center; align-content:flex-end;
    max-height:48%; overflow:hidden; line-height:1; will-change:left, transform; }
  .runner .mob{ font-size:clamp(18px,5vw,26px); }
  .runner.burst{ animation:burst .42s forwards; }
  @keyframes burst{ to{ transform:translateY(-30px) scale(1.5) rotate(16deg); opacity:0; } }
  /* 爆散して飛ぶゴリラ（ゲームオーバー報酬演出） */
  .proj{ position:absolute; top:0; left:0; font-size:clamp(20px,6vw,30px); z-index:6;
    will-change:transform; pointer-events:none; }
  .plus1{ position:absolute; bottom:24%; transform:translateX(-50%); font-weight:900; color:#1d7a42;
    font-size:24px; text-shadow:0 2px 0 #fff; pointer-events:none; animation:floatup .6s forwards; }
  @keyframes floatup{ to{ transform:translate(-50%,-46px); opacity:0; } }
  .callout{ position:absolute; left:0; right:0; bottom:1%; text-align:center; font-weight:900;
    font-size:clamp(15px,4.5vw,22px); color:#1f2430; text-shadow:0 1px 0 #fff; pointer-events:none; }
  .tapHint{ position:absolute; left:0; right:0; top:8px; text-align:center; color:#fff; font-weight:700;
    font-size:13px; text-shadow:0 1px 2px rgba(0,0,0,.4); pointer-events:none; }

  /* ---- 結果 ---- */
  .result h2{ text-align:center; font-size:26px; margin:.2em 0; }
  .result .big{ text-align:center; font-size:clamp(30px,9vw,46px); color:var(--red); font-weight:900; margin:.1em 0; }
  .stat{ display:flex; justify-content:space-between; padding:7px 4px; border-bottom:1px dashed var(--line); font-size:15px; }
  .newrec{ text-align:center; color:var(--gold); font-weight:800; font-size:18px; margin:6px 0; }
  .btns{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; }
  .btns button{ padding:14px; font-size:17px; font-weight:700; border-radius:13px; border:3px solid var(--line); background:#fffdf5; }
  .btns .primary{ color:#fff; background:var(--green); border:none; box-shadow:0 4px 0 #1d7a42; }
  .hidden{ display:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>割れる数ラン 🦍🏃💥</h1>
  <p class="sub">迫る2つの壁の「割り切れる方」へ走れ！ ゴリラを増やせ！</p>

  <!-- 章選択 -->
  <div id="chapSel" class="panel">
    <p class="chapInfo">章を選ぶ（章の数字で<b>割り切れる</b>方の壁を破る）</p>
    <div class="chapGrid" id="chapGrid"></div>
  </div>

  <!-- プレイ -->
  <div id="play" class="panel hidden">
    <div class="hud">
      <span>章 <span class="big" id="chapNum">2</span> で割れる方へ</span>
      <span class="sp" id="speed">SPEED ▲1</span>
    </div>
    <div class="track" id="track">
      <div class="laneLine"></div>
      <div class="wall" id="wallL">0</div>
      <div class="wall" id="wallR">0</div>
      <div class="runner" id="runner"></div>
      <div class="tapHint">← → / A・D / 画面の左右タップ</div>
      <div class="callout" id="callout"></div>
    </div>
    <p style="text-align:center;margin:8px 0 0;font-weight:800;">🦍 ゴリラ <span id="score">1</span> 体</p>
  </div>

  <!-- 結果 -->
  <div id="result" class="panel result hidden">
    <h2>ドカーン💥</h2>
    <div class="big" id="overText">ゴリラ 1 体！</div>
    <div id="newrec" class="newrec hidden">🏆 章ベスト更新！</div>
    <div class="stat"><span>集めたゴリラ</span><span id="rScore">1</span></div>
    <div class="stat"><span>最高スピード</span><span id="rSpeed">▲1</span></div>
    <div class="stat"><span>章ベスト</span><span id="rBest">0</span></div>
    <div class="btns">
      <button class="primary" id="retryBtn">もう1回！</button>
      <button onclick="toChapters()">章をえらぶ</button>
    </div>
  </div>
</div>

<script src="mathbank.js"></script>
<script>
/* ===== 章選択 ===== */
function bestKey(p){ return 'run_best_' + p; }
function getBest(p){ return parseInt(localStorage.getItem(bestKey(p))||'0',10); }
function buildChapters(){
  const grid = document.getElementById('chapGrid'); grid.innerHTML='';
  MathBank.PRIMES.forEach(p=>{
    const b=document.createElement('button'); b.className='chap';
    const best=getBest(p);
    b.innerHTML = p + '<small>' + (best?'★'+best:'') + '</small>';
    b.onclick = ()=> startRun(p);
    grid.appendChild(b);
  });
}
function toChapters(){
  running=false;
  document.getElementById('result').classList.add('hidden');
  document.getElementById('play').classList.add('hidden');
  document.getElementById('chapSel').classList.remove('hidden');
  buildChapters();
}

/* ===== 状態 ===== */
const $ = (id)=>document.getElementById(id);
const CROWD_CAP = 120;             // 描画するゴリラ上限（超人速で到達しない前提の安全弁）
const VARIANTS = ['🐵','🦧','🙈','🙉','🙊','🍌']; // 混入する別サル・バナナ
const MIX_RATE = 0.05;             // 5%で混入、95%は基本ゴリラ
let chapter=2, lane=0, score=1, crowdN=0;
let progress=0, speedFrac=0.58, maxStep=1, correctLane=0;
let running=false, lastT=0;

function startRun(p){
  chapter=p; lane=0; score=1; crowdN=0; progress=0; maxStep=1; speedFrac=0.58;
  $('chapSel').classList.add('hidden');
  $('result').classList.add('hidden');
  $('play').classList.remove('hidden');
  $('chapNum').textContent=p;
  $('callout').textContent=p+' で割れる方へ！';
  $('runner').className='runner'; $('runner').innerHTML=''; $('runner').style.opacity='1';
  document.querySelectorAll('.proj').forEach(e=>e.remove());
  addMob();                              // 最初の1体
  $('score').textContent=score;
  positionRunner();
  newProblem(); resetWallTop();
  running=true; lastT=performance.now();
  requestAnimationFrame(loop);
}

function level(){ return 1 + Math.floor(score/4); }

function newProblem(){
  const q = MathBank.divisible(chapter, level());
  correctLane = q.answer;
  $('wallL').textContent = q.choices[0];
  $('wallR').textContent = q.choices[1];
}
function resetWallTop(){ progress = progress - Math.floor(progress); placeWalls(); }

function placeWalls(){
  const top = -16 + progress * 80;       // progress 0→1 で top -16%→64%（走者に到達）
  $('wallL').style.top = top + '%';
  $('wallR').style.top = top + '%';
}

function positionRunner(){ $('runner').style.left = (lane===0?3:53) + '%'; }
function setLane(l){ if(!running || lane===l) return; lane=l; positionRunner(); }

function addMob(){
  if(crowdN >= CROWD_CAP) return;
  const s=document.createElement('span'); s.className='mob';
  s.textContent = Math.random()<MIX_RATE ? VARIANTS[Math.floor(Math.random()*VARIANTS.length)] : '🦍';
  $('runner').appendChild(s); crowdN++;
}
function floatPlus(){
  const f=document.createElement('span'); f.className='plus1'; f.textContent='+1';
  f.style.left = (lane===0?25:75) + '%';
  $('track').appendChild(f);
  setTimeout(()=>f.remove(), 600);
}

function loop(t){
  if(!running) return;
  const dt = Math.min(0.05, (t-lastT)/1000); lastT=t;
  progress += speedFrac * dt;
  if(progress >= 1){
    if(lane === correctLane){          // 正解：止まらず連続スクロール
      onCorrect();
      progress -= 1;
      newProblem();
    } else {                           // 不正解：即ゲームオーバー
      return gameOver();
    }
  }
  placeWalls();
  requestAnimationFrame(loop);
}

function onCorrect(){
  score++; addMob(); floatPlus(); beep(660,0.045);
  $('score').textContent = score;
  speedFrac = Math.min(2.6, 0.58 + score*0.045);   // どんどん加速
  maxStep = Math.max(maxStep, Math.round((speedFrac-0.58)/0.045)+1);
  $('speed').textContent = 'SPEED ▲' + maxStep;
}

function gameOver(){
  running=false; boom();
  burstGorillas(showResultScreen);     // 集めたゴリラが爆散＝報酬演出 → 結果
}

// 集めたゴリラを四方へ爆散させ、画面（トラック）内で2回反射してから飛び去る。
// 集めた数が多いほど派手＝記録更新の報酬。
function burstGorillas(done){
  const track=$('track');
  const W=track.clientWidth, H=track.clientHeight, size=28;
  const mobs=[...$('runner').querySelectorAll('.mob')];
  const N=Math.max(mobs.length,1);
  $('runner').style.opacity='0';
  const cx=(lane===0?0.25:0.75)*W, cy=H*0.82;
  const parts=[];
  for(let i=0;i<N;i++){
    const el=document.createElement('span'); el.className='proj';
    el.textContent = mobs[i] ? mobs[i].textContent : '🦍';
    track.appendChild(el);
    const ang=Math.random()*Math.PI*2, spd=160+Math.random()*460;
    parts.push({ el, x:cx+(Math.random()*46-23), y:cy+(Math.random()*22-11),
      vx:Math.cos(ang)*spd, vy:-(160+Math.random()*460),
      rot:Math.random()*360, vr:Math.random()*1600-800, b:0, alive:true });
  }
  const G=1100; let last=performance.now(), t0=last;
  function tick(t){
    const dt=Math.min(0.04,(t-last)/1000); last=t; let any=false;
    for(const p of parts){
      if(!p.alive) continue; any=true;
      p.vy+=G*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.rot+=p.vr*dt;
      if(p.b<2){                                   // 2回まで壁で反射
        if(p.x<0){ p.x=0; p.vx=-p.vx; p.b++; popMaybe(); }
        else if(p.x>W-size){ p.x=W-size; p.vx=-p.vx; p.b++; popMaybe(); }
        if(p.y<0){ p.y=0; p.vy=-p.vy*0.9; p.b++; popMaybe(); }
        else if(p.y>H-size){ p.y=H-size; p.vy=-p.vy*0.9; p.b++; popMaybe(); }
      }
      p.el.style.transform=`translate(${p.x}px,${p.y}px) rotate(${p.rot}deg)`;
      if(p.b>=2 && (p.x<-size*2||p.x>W+size*2||p.y>H+size*2)){ p.alive=false; p.el.remove(); }
    }
    if(any && (t-t0)<2300) requestAnimationFrame(tick);
    else { parts.forEach(p=>{ if(p.el) p.el.remove(); }); if(done) done(); }
  }
  requestAnimationFrame(tick);
}
let _lastPop=0;
function popMaybe(){ const n=performance.now(); if(n-_lastPop>70){ _lastPop=n; tone(260+Math.random()*260,0.04,'square'); } }

function showResultScreen(){
  $('play').classList.add('hidden');
  $('result').classList.remove('hidden');
  $('overText').textContent = 'ゴリラ ' + score + ' 体！';
  $('rScore').textContent = score;
  $('rSpeed').textContent = '▲' + maxStep;
  const prev=getBest(chapter);
  if(score>prev){ localStorage.setItem(bestKey(chapter), score); $('newrec').classList.remove('hidden'); }
  else $('newrec').classList.add('hidden');
  $('rBest').textContent = Math.max(prev, score);
}

/* ===== 入力 ===== */
document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A') setLane(0);
  if(e.key==='ArrowRight'||e.key==='d'||e.key==='D') setLane(1);
});
const track=$('track');
track.addEventListener('pointerdown', (e)=>{
  const r=track.getBoundingClientRect();
  setLane((e.clientX-r.left) < r.width/2 ? 0 : 1);
});
$('retryBtn').onclick = ()=> startRun(chapter);

/* ===== 効果音 ===== */
let actx=null;
function tone(f,d,ty){ try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
  const o=actx.createOscillator(),g=actx.createGain(); o.frequency.value=f; o.type=ty||'square';
  g.gain.value=0.06; o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+d);}catch(e){} }
function beep(f,d){ tone(f,d,'square'); }
function boom(){ tone(90,0.4,'sawtooth'); setTimeout(()=>tone(60,0.5,'sawtooth'),60); }

buildChapters();
</script>
</body>
</html>
