<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>プラスマイナス 🌡️</title>
<style>
  /* ============================================================
     プラスマイナス — 数感覚ミニゲーム（軸: 数直線感覚 / 負の数）
     中1最大の壁＝負の数。数直線(温度計)の上で
       くらべ: 「−7 と −3、大きいのは？」（−5は−2より小さいの直感）
       すすむ: 「−3 ℃ から 5 上がると？」＝たし算ひき算を線上の移動で
     を体感する。数直線は目盛り＋数字を見せる“道具”として使う。
     ※自己ベストのみ記録（順位は出さない＝成長を見せる設計）。
     ============================================================ */
  :root{ --ink:#1f2430; --paper:#fff7e6; --line:#e6d3a8; --green:#27a35a; --red:#e0533d;
    --blue:#2f7de1; --gold:#e3a32a; --purple:#7c3aed; }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; color:var(--ink); overflow-x:hidden;
    font-family:"Yu Gothic","Meiryo",system-ui,sans-serif; user-select:none; -webkit-user-select:none;
    background:linear-gradient(180deg,#e7f0ff 0%,#eef0ff 45%,#f6ecd0 100%);}
  .wrap{ width:min(560px,100%); margin:0 auto; padding:10px 12px 26px; }
  h1{ margin:.3em 0 .1em; font-size:clamp(22px,6vw,32px); text-align:center; }
  .sub{ text-align:center; color:#6b6250; margin:0 0 10px; font-size:13px; }
  .panel{ background:var(--paper); border:3px solid var(--line); border-radius:16px; padding:14px;
    box-shadow:0 6px 0 rgba(0,0,0,.08); }
  button{ font:inherit; color:inherit; cursor:pointer; }
  .hidden{ display:none; }

  .lvlGrid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .lvl{ padding:16px 8px; border:3px solid var(--line); border-radius:13px; background:#fffdf5;
    font-size:17px; font-weight:800; text-align:center; line-height:1.3; }
  .lvl small{ display:block; font-weight:600; color:#9a8a64; font-size:11px; margin-top:4px; min-height:13px; }
  .lvl:active{ transform:scale(.96); }

  .hud{ display:flex; align-items:center; gap:8px; font-weight:800; margin-bottom:4px; font-size:14px; }
  .hud .sc{ margin-left:auto; color:var(--blue); font-size:18px; }
  .q{ text-align:center; font-size:14px; color:#6b6250; font-weight:700; margin:6px 0 2px; min-height:18px; }
  .qbig{ text-align:center; font-size:clamp(26px,8vw,40px); font-weight:900; color:var(--purple); margin:0 0 12px; line-height:1.1; }

  /* 数直線（目盛り・数字つき＝道具） */
  .lineBox{ position:relative; padding:40px 16px 34px; touch-action:none; }
  .nline{ position:relative; height:8px; border-radius:4px; background:var(--ink); cursor:crosshair; }
  .tick{ position:absolute; top:-6px; width:2px; height:20px; background:#b9a877; transform:translateX(-50%); }
  .tick.zero{ background:var(--ink); width:4px; height:30px; top:-12px; }
  .tlab{ position:absolute; top:18px; transform:translateX(-50%); font-size:12px; font-weight:800; color:#6b6250; }
  .tlab.zero{ color:var(--ink); font-size:14px; }
  .hintTap{ position:absolute; top:8px; left:0; right:0; text-align:center; font-size:12px; color:#9a8a64; font-weight:700; }
  .token{ position:absolute; top:-34px; transform:translateX(-50%); font-size:26px; line-height:1; transition:left .6s cubic-bezier(.2,.85,.2,1); pointer-events:none; }
  .gmark{ position:absolute; top:-30px; transform:translateX(-50%); font-size:22px; line-height:1; pointer-events:none; }

  /* くらべ（2択） */
  .cmp{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .cmp button{ padding:22px 8px; border-radius:14px; border:3px solid var(--line); background:#fffdf5;
    font-size:30px; font-weight:900; color:var(--ink); }
  .cmp button:active{ transform:scale(.95); }

  .fb{ text-align:center; font-size:21px; font-weight:900; min-height:28px; margin:10px 0 0; }
  .fb .pts{ color:var(--gold); }
  .fb.fx-good{ color:#1d7a42; animation:pop .5s; } .fb.fx-bad{ color:#9a8a64; }
  @keyframes pop{ 0%{transform:scale(.7)} 40%{transform:scale(1.25)} 70%{transform:scale(.95)} 100%{transform:scale(1)} }
  .dots{ display:flex; gap:6px; justify-content:center; margin-top:8px; }
  .dots i{ width:10px; height:10px; border-radius:50%; background:#e6d3a8; display:inline-block; }
  .dots i.on{ background:var(--green); }

  .result h2{ text-align:center; font-size:22px; margin:.2em 0; }
  .result .big{ text-align:center; font-size:clamp(34px,10vw,50px); color:var(--purple); font-weight:900; margin:.1em 0; }
  .newrec{ text-align:center; color:var(--gold); font-weight:800; font-size:18px; margin:6px 0; }
  .stat{ display:flex; justify-content:space-between; padding:7px 4px; border-bottom:1px dashed var(--line); font-size:15px; }
  .btns{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; }
  .btns button{ padding:14px; font-size:16px; font-weight:700; border-radius:13px; border:3px solid var(--line); background:#fffdf5; }
  .btns .primary{ color:#fff; background:var(--green); border:none; box-shadow:0 4px 0 #1d7a42; }
</style>
</head>
<body>
<button id="portalBackBtn" title="数学ポータルへ戻る" style="position:fixed;top:8px;left:8px;z-index:99999;border:2px solid #e6d3a8;background:#fff7e6;color:#241c12;border-radius:999px;height:34px;padding:0 12px;font-size:13px;font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer">← もどる</button>
<script>
  document.getElementById('portalBackBtn').addEventListener('click',function(){ location.href='../index.html'; });
</script>

<div class="wrap">
  <h1>プラスマイナス 🌡️</h1>
  <p class="sub">マイナスの数を数直線で感じよう。−5は−2より「小さい」！</p>

  <!-- レベル選択 -->
  <div id="lvlSel" class="panel">
    <div class="lvlGrid" id="lvlGrid"></div>
    <p style="text-align:center;font-size:12px;color:#9a8a64;margin:12px 0 0">★＝そのレベルの自己ベスト。前の自分をこえよう！</p>
  </div>

  <!-- プレイ -->
  <div id="play" class="panel hidden">
    <div class="hud">
      <span id="lvlName">−10〜10</span>
      <span class="sc">⭐ <span id="score">0</span></span>
    </div>
    <div class="q" id="qkind">どっちが大きい？</div>
    <div class="qbig" id="qbig">—</div>

    <!-- 数直線（すすむ用） -->
    <div class="lineBox hidden" id="lineBox">
      <div class="hintTap" id="hintTap">線をタップして答える 👆</div>
      <div class="nline" id="nline"></div>
    </div>

    <!-- くらべ（2択） -->
    <div class="cmp hidden" id="cmp">
      <button id="cmpA" onclick="answerCmp(0)">0</button>
      <button id="cmpB" onclick="answerCmp(1)">0</button>
    </div>

    <div class="fb" id="fb"></div>
    <div class="dots" id="qDots"></div>
  </div>

  <!-- 結果 -->
  <div id="result" class="panel result hidden">
    <h2 id="rTitle">クリア！</h2>
    <div class="big" id="rScore">0</div>
    <div id="newrec" class="newrec hidden">🏆 自己ベスト更新！</div>
    <div class="stat"><span>このレベルのベスト</span><span id="rBest">0</span></div>
    <div class="stat"><span>せいかい</span><span id="rCorrect">0</span> 問</div>
    <div class="btns">
      <button class="primary" id="retryBtn">もう1回！</button>
      <button id="toLvlBtn">レベルをえらぶ</button>
    </div>
  </div>
</div>

<script>
/* ===== 定数・状態 ===== */
const $=(id)=>document.getElementById(id);
const ROUND=10;
const LEVELS=[
  { id:'a', name:'−10〜10', lo:-10, hi:10, jump:7, emoji:'🟢' },
  { id:'b', name:'−15〜15', lo:-15, hi:15, jump:11, emoji:'🟣' },
];
let level=LEVELS[0], qIdx=0, score=0, correct=0, locked=false;
let cur=null;   // { kind:'cmp'|'move', ... , answer }

const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
function bestKey(l){ return 'ns_best_negative_'+l.id; }
function getBest(l){ return parseInt(localStorage.getItem(bestKey(l))||'0',10); }
function valToPct(v){ return (v-level.lo)/(level.hi-level.lo)*100; }

/* ===== レベル選択 ===== */
function buildLevels(){
  const g=$('lvlGrid'); g.innerHTML='';
  LEVELS.forEach(l=>{
    const best=getBest(l);
    const b=document.createElement('button'); b.className='lvl';
    b.innerHTML=l.emoji+' '+l.name+'<small>'+(best?('★ '+best):'はじめて')+'</small>';
    b.onclick=()=>startLevel(l);
    g.appendChild(b);
  });
}
function toLevels(){
  $('result').classList.add('hidden'); $('play').classList.add('hidden');
  $('lvlSel').classList.remove('hidden'); buildLevels();
}

/* ===== 数直線の目盛りを描く ===== */
function buildLine(){
  const ln=$('nline'); ln.innerHTML='';
  for(let v=level.lo; v<=level.hi; v++){
    const pct=valToPct(v);
    const t=document.createElement('div'); t.className='tick'+(v===0?' zero':''); t.style.left=pct+'%'; ln.appendChild(t);
    if(v===0 || v%5===0){ // 5の倍数と0に数字
      const lab=document.createElement('div'); lab.className='tlab'+(v===0?' zero':''); lab.style.left=pct+'%'; lab.textContent=v; ln.appendChild(lab);
    }
  }
}

/* ===== プレイ ===== */
function startLevel(l){
  level=l; qIdx=0; score=0; correct=0;
  $('lvlSel').classList.add('hidden'); $('result').classList.add('hidden');
  $('play').classList.remove('hidden');
  $('lvlName').textContent=l.emoji+' '+l.name;
  $('score').textContent='0';
  buildLine(); buildDots();
  newQuestion();
}
function buildDots(){ const d=$('qDots'); d.innerHTML=''; for(let i=0;i<ROUND;i++) d.appendChild(document.createElement('i')); }
function markDots(){ [...$('qDots').children].forEach((e,i)=>e.classList.toggle('on', i<qIdx)); }

function newQuestion(){
  locked=false;
  $('fb').className='fb'; $('fb').textContent='';
  // マーカー類を消す
  [...$('nline').querySelectorAll('.token,.gmark')].forEach(e=>e.remove());
  $('cmpA').style.background='#fffdf5'; $('cmpB').style.background='#fffdf5';

  // くらべ と すすむ を交互に（偶数=くらべ / 奇数=すすむ）
  const kind = (qIdx%2===0) ? 'cmp' : 'move';
  if(kind==='cmp'){
    let a=rnd(level.lo,level.hi), b=rnd(level.lo,level.hi);
    while(a===b) b=rnd(level.lo,level.hi);
    // 少なくとも片方は負になりやすく（負の数の練習なので）
    if(a>=0 && b>=0 && Math.random()<0.7){ a=-Math.abs(rnd(1,Math.abs(level.lo))); }
    cur={ kind, a, b, answer:(a>b?0:1) };
    $('qkind').textContent='どっちが大きい？';
    $('qbig').textContent='';
    $('cmpA').textContent=fmt(a); $('cmpB').textContent=fmt(b);
    $('cmp').classList.remove('hidden'); $('lineBox').classList.add('hidden');
  } else {
    // すすむ: s ＋ d（dは正負）。結果が範囲内になるよう調整。
    let s, d, res, guard=0;
    do{ s=rnd(level.lo, level.hi); d=rnd(-level.jump, level.jump); res=s+d; guard++; }
    while((d===0 || res<level.lo || res>level.hi) && guard<60);
    if(d===0) d=1, res=s+1;
    cur={ kind, s, d, answer:res };
    // 温度計の言い回し or 式
    if(Math.random()<0.5){
      const verb = d>=0 ? (d+'上がると') : (Math.abs(d)+'下がると');
      $('qkind').textContent='気温の変化（数直線でうごかそう）';
      $('qbig').textContent='🌡️ '+fmt(s)+'℃ から '+verb+'？';
    } else {
      $('qkind').textContent='計算して、答えの場所をタップ';
      $('qbig').textContent=fmt(s)+' '+(d>=0?('＋ '+d):('− '+Math.abs(d)))+' ＝ ？';
    }
    $('cmp').classList.add('hidden'); $('lineBox').classList.remove('hidden');
    $('hintTap').style.visibility='visible';
    // 出発点トークンを置く
    placeMark('gmark', s, '🔵');
  }
}
function fmt(v){ return (v>0?('+'+v):(''+v)); }   // 正の数は +、負は −、0は0

function placeMark(cls, val, emoji){
  const ln=$('nline'); const m=document.createElement('div'); m.className=cls;
  m.style.left=valToPct(val)+'%'; m.textContent=emoji; ln.appendChild(m); return m;
}

/* くらべ の回答 */
function answerCmp(idx){
  if(locked||cur.kind!=='cmp') return; locked=true;
  const ok=(idx===cur.answer);
  // 数直線（くらべ用に一時表示）で位置を見せる
  $('lineBox').classList.remove('hidden'); $('hintTap').style.visibility='hidden';
  placeMark('gmark', cur.a, '🅰️'); placeMark('gmark', cur.b, '🅱️');
  (idx===0?$('cmpA'):$('cmpB')).style.background = ok ? '#bfe7c8' : '#f3c0b6';
  if(!ok) (cur.answer===0?$('cmpA'):$('cmpB')).style.background='#bfe7c8';
  finish(ok, ok?gradePts():0, '大きいのは '+fmt(cur.a>cur.b?cur.a:cur.b)+'（右にあるほど大きい）');
}

/* すすむ の回答：線をタップ→整数にスナップ */
$('nline').addEventListener('pointerdown',(e)=>{
  if(locked || !cur || cur.kind!=='move') return; locked=true;
  const r=$('nline').getBoundingClientRect();
  let frac=(e.clientX-r.left)/r.width; frac=Math.max(0,Math.min(1,frac));
  const val=Math.round(level.lo+frac*(level.hi-level.lo));
  $('hintTap').style.visibility='hidden';
  placeMark('gmark', val, '⬇️');           // 自分の答え
  const diff=Math.abs(val-cur.answer);
  const ok=(diff===0); const pts = ok?gradePts() : (diff===1?Math.round(gradePts()*0.4):0);
  if(diff>0) correct=correct; // noop（correctはok時のみ下のfinishで+）
  // 正解トークンを出発点からスライドして見せる（溜め）
  const tok=placeMark('token', cur.s, '🌡️');
  void tok.offsetWidth;
  setTimeout(()=>{ tok.style.left=valToPct(cur.answer)+'%'; }, 30);
  setTimeout(()=>finish(ok, pts, 'こたえは '+fmt(cur.answer)), 700);
}, {passive:false});

function gradePts(){ return 100; }  // 1問の基礎点（速度ボーナスは付けず、考える時間を尊重）

function finish(ok, pts, revealMsg){
  score+=pts; $('score').textContent=score;
  if(ok) correct++;
  beep(ok?820:300,.08, ok?'sine':'sawtooth');
  if(ok){ setTimeout(()=>beep(1120,.09),90); }
  const fb=$('fb'); fb.className='fb '+(ok?'fx-good':'fx-bad');
  fb.innerHTML=(ok?'せいかい！⭕ ':'ざんねん ')+'<span class="pts">+'+pts+'</span><br><span style="font-size:13px;font-weight:700;color:#6b6250">'+revealMsg+'</span>';
  qIdx++; markDots();
  setTimeout(()=>{ if(qIdx>=ROUND) showResult(); else newQuestion(); }, ok?1500:2100);
}

/* ===== 結果 ===== */
function showResult(){
  $('play').classList.add('hidden'); $('result').classList.remove('hidden');
  $('rTitle').textContent=level.emoji+' '+level.name+' クリア！';
  $('rScore').textContent=score; $('rCorrect').textContent=correct;
  const prev=getBest(level);
  if(score>prev){ localStorage.setItem(bestKey(level), score); $('newrec').classList.remove('hidden'); }
  else $('newrec').classList.add('hidden');
  $('rBest').textContent=Math.max(prev,score);
}
$('retryBtn').onclick=()=>startLevel(level);
$('toLvlBtn').onclick=toLevels;

/* ===== 効果音 ===== */
let actx=null;
function beep(f,d,ty){ try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
  const o=actx.createOscillator(),g=actx.createGain(); o.frequency.value=f; o.type=ty||'sine';
  g.gain.value=0.05; o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+(d||.06)); }catch(e){} }

buildLevels();
</script>

<!-- まなびハブ: 学習日・プレイ時間の記録（全アプリ共通／同一オリジンのlocalStorageを共有） -->
<script>
(function(){
  var APP='numsense', KEY='manabi_hub_v1';
  function ld(){ try{return JSON.parse(localStorage.getItem(KEY))||{};}catch(e){return{};} }
  function sv(h){ try{localStorage.setItem(KEY,JSON.stringify(h));}catch(e){} }
  function today(){ var d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
  var h=ld(); h.play=h.play||{}; h.days=h.days||{}; h.days[today()]=true; h.lastApp=APP; h.lastSeen=Date.now(); sv(h);
  var acc=0, last=Date.now();
  function flush(){ if(acc<1)return; var g=ld(); g.play=g.play||{}; g.play[APP]=(g.play[APP]||0)+Math.round(acc); acc=0; g.days=g.days||{}; g.days[today()]=true; sv(g); }
  setInterval(function(){ var n=Date.now(); if(!document.hidden) acc+=(n-last)/1000; last=n; if(acc>=15) flush(); },1000);
  document.addEventListener('visibilitychange',function(){ last=Date.now(); if(document.hidden) flush(); });
  window.addEventListener('pagehide',flush); window.addEventListener('beforeunload',flush);
})();
</script>
</body>
</html>
