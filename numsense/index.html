<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>数の第六感 🔮</title>
<style>
  /* ============================================================
     数の第六感（Number Sense Lab）= 数学ポータル（ポータルの中のポータル）
     数感覚を育てるミニゲームを1つに束ねるハブ。
     ・各ゲームの自己ベストだけ表示（順位は出さない＝成長を見せる設計）
     ・既存の数学ゲーム(ゴリラ/ラン/マージ)へのリンクも下に置く
     ============================================================ */
  :root{ --ink:#241c33; --paper:#fff7e6; --line:#e6d3a8; --purple:#7c3aed; --green:#27a35a;
    --blue:#2f7de1; --gold:#e3a32a; --muted:#7a6f8a; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{ margin:0; min-height:100vh; color:var(--ink); overflow-x:hidden;
    font-family:"Yu Gothic","Meiryo",system-ui,sans-serif; user-select:none; -webkit-user-select:none;
    background:linear-gradient(180deg,#efe6ff 0%,#e7eeff 40%,#f6ecd0 100%);}
  .wrap{ width:min(580px,100%); margin:0 auto; padding:8px 12px 30px; }

  .hero{ text-align:center; padding:14px 6px 8px; }
  .hero h1{ margin:.1em 0; font-size:clamp(26px,8vw,38px); letter-spacing:1px;
    background:linear-gradient(90deg,#7c3aed,#2f7de1); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .hero .en{ font-size:12px; color:var(--muted); font-weight:700; letter-spacing:2px; }
  .hero .lead{ font-size:13px; color:#5a5168; margin:8px 4px 0; line-height:1.6; }
  .hero .lead b{ color:var(--purple); }

  .sec-t{ font-size:13px; font-weight:800; color:var(--muted); margin:18px 4px 8px; letter-spacing:.5px; }

  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:11px; }
  .card{ position:relative; display:flex; flex-direction:column; gap:3px; text-align:left;
    background:var(--paper); border:3px solid var(--line); border-radius:16px; padding:12px 12px 11px;
    box-shadow:0 5px 0 rgba(0,0,0,.07); cursor:pointer; color:inherit; }
  .card:active{ transform:translateY(2px); box-shadow:0 3px 0 rgba(0,0,0,.07); }
  .card .emo{ font-size:30px; line-height:1; }
  .card .ttl{ font-size:15px; font-weight:800; margin-top:3px; line-height:1.2; }
  .card .tag{ font-size:10.5px; font-weight:700; color:#fff; background:var(--purple); border-radius:999px;
    padding:2px 8px; align-self:flex-start; margin-top:2px; }
  .card .best{ font-size:12px; font-weight:700; color:var(--gold); margin-top:5px; min-height:16px; }
  .card .best.none{ color:var(--muted); }
  .card .beta{ position:absolute; right:8px; top:8px; background:#f87171; color:#fff; font-size:9px; font-weight:800;
    padding:2px 6px; border-radius:999px; }
  .card.soon{ opacity:.6; cursor:default; }
  .card.soon:active{ transform:none; box-shadow:0 5px 0 rgba(0,0,0,.07); }
  .card .soonbadge{ position:absolute; right:8px; top:8px; background:#facc15; color:#3b2c00; font-size:9px; font-weight:800;
    padding:2px 6px; border-radius:999px; }

  /* 既存ゲームへのリンク（小さめ） */
  .links{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:9px; }
  .link{ display:flex; flex-direction:column; align-items:center; gap:4px; text-decoration:none; color:inherit;
    background:rgba(255,255,255,.5); border:2px solid var(--line); border-radius:13px; padding:10px 4px; }
  .link:active{ transform:scale(.95); }
  .link .e{ font-size:24px; } .link .n{ font-size:11px; font-weight:700; text-align:center; }

  /* 数感覚レベル（自己参照の成長メーター＝じゅんいではない） */
  .levelCard{ background:linear-gradient(135deg,#7c3aed,#2f7de1); color:#fff; border-radius:16px;
    padding:13px 15px; margin:6px 0 2px; box-shadow:0 6px 16px rgba(124,58,237,.28); }
  .levelCard .lvl-top{ display:flex; align-items:center; gap:10px; }
  .levelCard .lvl-badge{ font-size:22px; font-weight:900; background:rgba(255,255,255,.22);
    border-radius:10px; padding:3px 12px; min-width:64px; text-align:center; }
  .levelCard .lvl-name{ font-size:13px; font-weight:800; opacity:.95; }
  .levelCard .lvl-pts{ margin-left:auto; font-size:12px; font-weight:800; opacity:.92; }
  .levelCard .lvl-bar{ height:10px; border-radius:6px; background:rgba(255,255,255,.25); overflow:hidden; margin:9px 0 5px; }
  .levelCard .lvl-bar > i{ display:block; height:100%; width:0%; background:#ffe08a; border-radius:6px; transition:width .6s cubic-bezier(.2,.85,.2,1); }
  .levelCard .lvl-sub{ font-size:11.5px; font-weight:700; opacity:.95; }

  .footnote{ font-size:11px; color:var(--muted); text-align:center; margin-top:18px; line-height:1.7; }
</style>
</head>
<body>
<button id="portalBackBtn" title="まなびポータルへ戻る" style="position:fixed;top:8px;left:8px;z-index:99999;border:2px solid #e6d3a8;background:#fff7e6;color:#241c12;border-radius:999px;height:34px;padding:0 12px;font-size:13px;font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer">🏠 ポータル</button>
<script>
  // 数学ポータル → まなびポータル（親）。dev=launcher.html / 本番=index.html。
  document.getElementById('portalBackBtn').addEventListener('click',function(){
    fetch('../launcher.html',{method:'HEAD'}).then(function(r){ location.href = r.ok ? '../launcher.html' : '../index.html'; })
      .catch(function(){ location.href='../index.html'; });
  });
</script>

<div class="wrap">
  <div class="hero">
    <div class="en">NUMBER SENSE LAB</div>
    <h1>数の第六感 🔮</h1>
    <p class="lead">計算する前に、答えが<b>「だいたい見える」</b>力をきたえる小さなゲーム集。<br>遊ぶほど、だれでも数の勘がするどくなるよ。</p>
  </div>

  <!-- 数感覚レベル（あそぶほど上がる自分だけの成長メーター） -->
  <div class="levelCard" id="levelCard">
    <div class="lvl-top">
      <span class="lvl-badge" id="lvlBadge">10級</span>
      <span class="lvl-name">きみの数感覚レベル<br><span style="font-weight:700;font-size:11px;opacity:.9">あそぶほど上がるよ</span></span>
      <span class="lvl-pts" id="lvlPts">✦ 0</span>
    </div>
    <div class="lvl-bar"><i id="lvlFill"></i></div>
    <div class="lvl-sub" id="lvlSub">まずは1ゲーム遊んでみよう！</div>
  </div>

  <div class="sec-t">👀 数感覚ゲーム（だいたい見える力）</div>
  <div class="grid" id="gameGrid"></div>

  <div class="sec-t">🧮 けいさん・パズル</div>
  <div class="grid" id="extGrid"></div>

  <p class="footnote">★は<b>きみの自己ベスト</b>。だれかと比べる点数じゃないよ。<br>前の自分をちょっとずつこえていこう。</p>
</div>

<script>
/* ===== ゲーム一覧 ===== */
// ready:false は「準備中」表示（まだ作っていないゲーム）。
const GAMES = [
  { id:'numline',  title:'数直線シュート', emoji:'🎯', tag:'数直線・桁', file:'games/numline.html',  beta:true,  ready:true },
  { id:'negative', title:'プラスマイナス',  emoji:'🌡️', tag:'負の数',     file:'games/negative.html', beta:true,  ready:true },
  { id:'reach2000',title:'¥2000で足りる？',emoji:'🛒', tag:'見積もり',   file:'games/reach2000.html',beta:true,  ready:true },
  { id:'flash',    title:'フラッシュ道場',  emoji:'⚡', tag:'瞬間把握・量',file:'games/flash.html',    beta:true,  ready:true },
  { id:'arienai',  title:'ありえない検出',  emoji:'🚫', tag:'桁・概算',   file:'games/arienai.html',  ready:true },
  { id:'yomi',     title:'先によみ',        emoji:'🔮', tag:'桁(オーダー)',file:'games/yomi.html',     ready:true },
  { id:'recipe',   title:'レシピ拡大',      emoji:'🍙', tag:'割合・比例', file:'games/recipe.html',   ready:true },
  { id:'ratiobar', title:'わりあいバー',    emoji:'📊', tag:'割合',       file:'games/ratiobar.html', ready:true },
];

// 各ゲームの自己ベスト = localStorage の "ns_best_<id>..." を全部見て最大値（ステージ別ベストの代表）。
function gameBest(id){
  let max=0, found=false;
  const pre='ns_best_'+id;
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k && k.indexOf(pre)===0){ const v=parseInt(localStorage.getItem(k)||'0',10); if(!isNaN(v)){ found=true; if(v>max)max=v; } }
  }
  return found?max:null;
}

// 既存の数学ゲーム（けいさん・パズル）も「数の第六感」に統合。フォルダは親階層。
const EXT_GAMES = [
  { title:'ゴリラ大砲',     emoji:'🦍', tag:'たし算・大小',   href:'../math-gorilla/index.html' },
  { title:'割れる数ラン',   emoji:'🏃', tag:'わり算・倍数',   href:'../math-run/index.html' },
  { title:'そすうマージ',   emoji:'🔢', tag:'素因数・合体',   href:'../prime-merge/index.html' },
];

function buildExtGrid(){
  const g=document.getElementById('extGrid'); if(!g) return; g.innerHTML='';
  EXT_GAMES.forEach(game=>{
    const card=document.createElement('a'); card.className='card'; card.href=game.href;
    card.innerHTML =
      '<span class="emo">'+game.emoji+'</span>'+
      '<span class="ttl">'+game.title+'</span>'+
      '<span class="tag">'+game.tag+'</span>'+
      '<span class="best none">▶ あそぶ</span>';
    g.appendChild(card);
  });
}

function buildGrid(){
  const g=document.getElementById('gameGrid'); g.innerHTML='';
  GAMES.forEach(game=>{
    const card=document.createElement(game.ready?'a':'div');
    card.className='card'+(game.ready?'':' soon');
    if(game.ready) card.href=game.file;
    const best=gameBest(game.id);
    card.innerHTML =
      '<span class="emo">'+game.emoji+'</span>'+
      '<span class="ttl">'+game.title+'</span>'+
      '<span class="tag">'+game.tag+'</span>'+
      '<span class="best'+(best==null?' none':'')+'">'+(best==null?'はじめて':('★ ベスト '+best))+'</span>'+
      (game.ready ? (game.beta?'<span class="beta">β版</span>':'') : '<span class="soonbadge">準備中</span>');
    g.appendChild(card);
  });
}
// 数感覚レベル＝全ゲームの自己ベスト合計を、級→段の固定ラダーに写す（順位ではない＝自分の成長）。
const TIERS=[
  {name:'10級',need:0},{name:'9級',need:250},{name:'8級',need:550},{name:'7級',need:900},
  {name:'6級',need:1300},{name:'5級',need:1800},{name:'4級',need:2400},{name:'3級',need:3100},
  {name:'2級',need:3900},{name:'1級',need:4800},{name:'初段',need:5900},{name:'二段',need:7200},
  {name:'三段',need:8700},{name:'四段',need:10400},{name:'五段',need:12300},{name:'六段',need:14500},
  {name:'七段',need:17000},{name:'名人',need:20000}
];
function totalPoints(){
  let t=0;
  for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i);
    if(k && k.indexOf('ns_best_')===0){ const v=parseInt(localStorage.getItem(k)||'0',10); if(!isNaN(v)) t+=v; } }
  return t;
}
function renderLevel(){
  const pts=totalPoints();
  let idx=0; for(let i=0;i<TIERS.length;i++){ if(pts>=TIERS[i].need) idx=i; }
  const cur=TIERS[idx], next=TIERS[idx+1];
  document.getElementById('lvlBadge').textContent=cur.name;
  document.getElementById('lvlPts').textContent='✦ '+pts;
  const fill=document.getElementById('lvlFill'), sub=document.getElementById('lvlSub');
  if(pts===0){
    fill.style.width='0%'; sub.textContent='まずは1ゲーム遊んでみよう！';
  } else if(next){
    const into=pts-cur.need, span=next.need-cur.need;
    fill.style.width=Math.max(6, Math.min(100, Math.round(into/span*100)))+'%';
    sub.textContent='あと '+(next.need-pts)+' ポイントで「'+next.name+'」';
  } else { fill.style.width='100%'; sub.textContent='さいこう「名人」に到達！すごい！'; }
}

buildGrid();
buildExtGrid();
renderLevel();
</script>

<!-- まなびハブ: 学習日・プレイ時間の記録（全アプリ共通／同一オリジンのlocalStorageを共有） -->
<script>
(function(){
  var APP='numsense', KEY='manabi_hub_v1';
  function ld(){ try{return JSON.parse(localStorage.getItem(KEY))||{};}catch(e){return{};} }
  function sv(h){ try{localStorage.setItem(KEY,JSON.stringify(h));}catch(e){} }
  function today(){ var d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
  var h=ld(); h.play=h.play||{}; h.days=h.days||{}; h.days[today()]=true; h.lastApp=APP; h.lastSeen=Date.now(); sv(h);
  var acc=0, last=Date.now();
  function flush(){ if(acc<1)return; var g=ld(); g.play=g.play||{}; g.play[APP]=(g.play[APP]||0)+Math.round(acc); acc=0; g.days=g.days||{}; g.days[today()]=true; sv(g); }
  setInterval(function(){ var n=Date.now(); if(!document.hidden) acc+=(n-last)/1000; last=n; if(acc>=15) flush(); },1000);
  document.addEventListener('visibilitychange',function(){ last=Date.now(); if(document.hidden) flush(); });
  window.addEventListener('pagehide',flush); window.addEventListener('beforeunload',flush);
})();
</script>
</body>
</html>
