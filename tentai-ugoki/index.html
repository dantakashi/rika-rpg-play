<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>天体の動き</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1020; color: #f2f4f8; overflow: hidden;
    font-family: "UD デジタル 教科書体 NK-R", "UD デジタル 教科書体 NK", "BIZ UDPGothic", "Yu Gothic", "Hiragino Sans", sans-serif; }
  #wrap { display: flex; flex-direction: column; height: 100%; }
  #top { display: flex; align-items: baseline; gap: 2vw; padding: 1.2vh 2vw 0.4vh; }
  #title { font-size: 4.4vh; font-weight: bold; }
  #sub { font-size: 2.8vh; color: #ffd76a; }
  #no { margin-left: auto; font-size: 2.4vh; color: #9fb0cc; }
  canvas { flex: 1; width: 100%; min-height: 0; display: block; }
  #bar { display: flex; flex-wrap: wrap; align-items: center; gap: 0.8vw; padding: 1vh 2vw 1.4vh; background: #121a30; }
  button { font: inherit; font-size: 2.5vh; color: #f2f4f8; background: #24314f; border: 0.3vh solid #3d4f7a;
    border-radius: 1vh; padding: 0.5vh 1.2vw; cursor: pointer; }
  button.on { background: #ffd76a; color: #1a1a1a; border-color: #ffd76a; }
  .sp { width: 1.2vw; }
  #extra { display: flex; flex-wrap: wrap; gap: 0.5vw; margin-left: auto; align-items: center; }
  #list { position: fixed; inset: 0; background: rgba(8,12,26,0.96); display: none; padding: 4vh 6vw; overflow: auto; }
  #list.open { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.6vh 1.6vw; align-content: start; }
  #list button { text-align: left; font-size: 3vh; padding: 1.4vh 1.2vw; }
</style>
</head>
<body>
<div id="wrap">
  <div id="top"><div id="title"></div><div id="sub"></div><div id="no"></div></div>
  <canvas id="cv"></canvas>
  <div id="bar">
    <button id="prev">◀</button><button id="next">▶</button><button id="menu">一覧</button>
    <span class="sp"></span>
    <button id="play">停止</button><button id="reset">最初</button>
    <span class="sp"></span>
    <button class="spd" data-k="0.3">おそい</button><button class="spd on" data-k="1">ふつう</button><button class="spd" data-k="3">はやい</button>
    <div id="extra"></div>
  </div>
</div>
<div id="list"></div>
<script>
'use strict';
// 中3「地球と宇宙」（東書 R7 p.190〜237）の提示用。←→ で場面、スペースで再生・停止。
// 周期: 地球の自転1日・公転365日／月の公転27.3日・満ち欠け29.5日／金星の公転225日。黄道の星座と月は p.210 の図。
const cv = document.getElementById('cv'), g = cv.getContext('2d');
const TAU = Math.PI * 2, rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
let W = 0, H = 0, U = 1;          // U = 画面の短い辺 / 100
let cur = 0, day = 0, playing = true, speed = 1, last = 0;
const C = { sun: '#ffb020', earth: '#3f8cff', night: '#14254d', moon: '#f3f0df', venus: '#ffe9a8', line: '#4a5a80', text: '#f2f4f8', dim: '#9fb0cc', hi: '#ffd76a', red: '#ff6b5a' };
const FF = getComputedStyle(document.body).fontFamily;

function fit() {
  const r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1;
  cv.width = r.width * d; cv.height = r.height * d; g.setTransform(d, 0, 0, d, 0, 0);
  W = r.width; H = r.height; U = Math.min(W, H) / 100;
}
function text(s, x, y, size, col, align) {
  g.font = `${size * U}px ${FF}`; g.fillStyle = col || C.text; g.textAlign = align || 'center'; g.textBaseline = 'middle'; g.fillText(s, x, y);
}
function disc(x, y, r, col) { g.beginPath(); g.arc(x, y, r, 0, TAU); g.fillStyle = col; g.fill(); }
function ring(x, y, r, col, w) { g.beginPath(); g.arc(x, y, r, 0, TAU); g.strokeStyle = col || C.line; g.lineWidth = w || 0.25 * U; g.stroke(); }
function seg(x0, y0, x1, y1, col, w, dash) {
  g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.strokeStyle = col; g.lineWidth = w || 0.25 * U;
  if (dash) g.setLineDash([U, U]); g.stroke(); g.setLineDash([]);
}
function arrow(x0, y0, x1, y1, col, w) {
  const a = Math.atan2(y1 - y0, x1 - x0), L = 2.2 * U;
  g.strokeStyle = g.fillStyle = col; g.lineWidth = w || 0.4 * U;
  g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
  g.beginPath(); g.moveTo(x1, y1); g.lineTo(x1 - L * Math.cos(a - 0.4), y1 - L * Math.sin(a - 0.4));
  g.lineTo(x1 - L * Math.cos(a + 0.4), y1 - L * Math.sin(a + 0.4)); g.fill();
}
// 北極の上から見た図。角度は反時計回りが＋（画面では y を逆にする）
const pos = (cx, cy, r, a) => [cx + r * Math.cos(a), cy - r * Math.sin(a)];
function arcArrow(cx, cy, r, a0, a1, col) {              // 反時計回りの矢印（a0→a1）
  g.beginPath(); g.arc(cx, cy, r, -a0, -a1, true); g.strokeStyle = col; g.lineWidth = 0.4 * U; g.stroke();
  const [x, y] = pos(cx, cy, r, a1); arrow(x + Math.sin(a1), y + Math.cos(a1), x - Math.sin(a1), y - Math.cos(a1), col);
}
function sunDisc(x, y, r) {
  const gr = g.createRadialGradient(x, y, r * 0.2, x, y, r * 1.8);
  gr.addColorStop(0, '#fff3c0'); gr.addColorStop(0.5, C.sun); gr.addColorStop(1, 'rgba(255,176,32,0)');
  disc(x, y, r * 1.8, gr); disc(x, y, r, C.sun);
}
function litBall(x, y, r, sx, sy, colDay, colNight) {     // 太陽の光が (sx,sy) から当たる球
  const a = Math.atan2(sy - y, sx - x);
  disc(x, y, r, colNight);
  g.beginPath(); g.arc(x, y, r, a - Math.PI / 2, a + Math.PI / 2); g.closePath(); g.fillStyle = colDay; g.fill();
}
// 地球から見た形。ph: 0＝光っていない（新月）〜 π＝全部（満月）。right＝右側が光る
function phase(x, y, r, ph, right, col) {
  disc(x, y, r, '#1b2238');
  const k = Math.cos(ph);
  g.save(); g.translate(x, y); if (!right) g.scale(-1, 1);
  g.beginPath(); g.arc(0, 0, r, -Math.PI / 2, Math.PI / 2);
  g.ellipse(0, 0, Math.abs(k) * r, r, 0, Math.PI / 2, -Math.PI / 2, k > 0);        // 細いときは右を通り、太いときは左を通る
  g.closePath(); g.fillStyle = col; g.fill(); g.restore();
  ring(x, y, r, '#55648a', 0.15 * U);
}
function panel(x, y, w, h, title) {
  g.fillStyle = 'rgba(18,26,48,0.9)'; g.strokeStyle = C.line; g.lineWidth = 0.2 * U;
  g.beginPath(); g.roundRect(x, y, w, h, 1.5 * U); g.fill(); g.stroke();
  if (title) text(title, x + w / 2, y + 3 * U, 3, C.dim);
}
const fmt = (v, n) => v.toFixed(n === undefined ? 0 : n);
const clock = h => { h = ((Math.round(h) % 24) + 24) % 24; return h === 0 ? '午前0時' : h < 12 ? `午前${h}時` : h === 12 ? '正午' : `午後${h - 12}時`; };
const MD = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
function monthDay(d) { d = Math.floor(((d % 365) + 365) % 365); let m = 0; while (d >= MD[m]) { d -= MD[m]; m++; } return [m + 1, d + 1]; }
const dateStr = d => { const [m, dd] = monthDay(d); return `${m}月${dd}日`; };
function rng(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }

// ---- 天球 ----
const EPS = 23.4;
const decl = d => EPS * Math.sin(TAU * (d - 79) / 365);                  // d＝1月1日からの日数。3月21日ごろ 0
function vec(lat, dec, Hdeg) {                                           // 北・東・上。H は南中からの角（西へ＋）
  const p = rad(lat), dl = rad(dec), h = rad(Hdeg);
  return [Math.cos(p) * Math.sin(dl) - Math.sin(p) * Math.cos(dl) * Math.cos(h), -Math.cos(dl) * Math.sin(h),
          Math.sin(p) * Math.sin(dl) + Math.cos(p) * Math.cos(dl) * Math.cos(h)];
}
function dome(cx, cy, R, compass) {                                      // 少し南寄りのななめ上から見る
  const ct = Math.cos(rad(22)), st = Math.sin(rad(22));
  const P = ([n, e, z]) => [cx + R * (n * ct - e * st), cy + R * (0.26 * (n * st + e * ct) - 0.966 * z)];
  g.beginPath(); for (let t = 0; t <= 360; t += 4) { const [x, y] = P([Math.cos(rad(t)), Math.sin(rad(t)), 0]); t ? g.lineTo(x, y) : g.moveTo(x, y); }
  g.fillStyle = '#1f3a2c'; g.fill(); g.strokeStyle = '#5c7f6a'; g.lineWidth = 0.25 * U; g.stroke();
  g.beginPath(); g.arc(cx, cy, R, Math.PI, 0); g.strokeStyle = '#6f7fa6'; g.stroke();
  seg(...P([-1, 0, 0]), ...P([1, 0, 0]), '#55648a', 0.2 * U, true); seg(...P([0, -1, 0]), ...P([0, 1, 0]), '#55648a', 0.2 * U, true);
  seg(cx, cy, ...P([0, 0, 1]), '#55648a', 0.2 * U, true);
  if (compass !== false) [['南', [-1, 0, 0], -4, 0], ['北', [1, 0, 0], 4, 0], ['東', [0, 1, 0], -2, 4], ['西', [0, -1, 0], 3, -3]].forEach(([s, v, dx, dy]) => { const [x, y] = P(v); text(s, x + dx * U, y + dy * U, 3.6); });
  text('天頂', cx, cy - 0.966 * R - 3.5 * U, 3, C.dim);
  g.fillStyle = '#fff'; g.fillRect(cx - 0.5 * U, cy - 4 * U, U, 4 * U); disc(cx, cy - 5 * U, 1 * U, '#fff');
  return P;
}
function domePath(P, lat, dc, col, w, dash) {
  g.beginPath(); let pen = false;
  for (let h = -180; h <= 180; h += 2) { const v = vec(lat, dc, h); if (v[2] >= 0) { const [x, y] = P(v); pen ? g.lineTo(x, y) : g.moveTo(x, y); pen = true; } else pen = false; }
  g.strokeStyle = col; g.lineWidth = w * U; if (dash) g.setLineDash([U, U]); g.stroke(); g.setLineDash([]);
}
const LATS = [['東京', 35.7], ['北極付近', 85], ['赤道', 0], ['シドニー', -33.9]];
const DATES = [['春分', 79], ['夏至', 171], ['秋分', 265], ['冬至', 355]];

// ---- 星 ----（赤経は時、赤緯は度）
const ORION = [[5.92, 7.4], [5.42, 6.3], [5.53, -0.3], [5.60, -1.2], [5.68, -1.9], [5.80, -9.7], [5.24, -8.2]];
const ORION_L = [[0, 1], [0, 4], [1, 2], [2, 3], [3, 4], [4, 5], [2, 6], [5, 6]];
const CAS = [[0.15, 59.1], [0.68, 56.5], [0.95, 60.7], [1.43, 60.2], [1.91, 63.7]];
const DIPPER = [[11.06, 61.8], [11.03, 56.4], [11.90, 53.7], [12.26, 57.0], [12.90, 56.0], [13.40, 54.9], [13.79, 49.3]];
const DIPPER_L = [[0, 1], [1, 2], [2, 3], [3, 0], [3, 4], [4, 5], [5, 6]];
const chain = n => Array.from({ length: n - 1 }, (_, i) => [i, i + 1]);
const FIGS = [[ORION, ORION_L, 'オリオン座'], [CAS, chain(5), 'カシオペヤ座'], [DIPPER, DIPPER_L, '北斗七星']];
const POLARIS = [2.53, 89.3];
const RAND = (() => { const r = rng(7), a = []; for (let i = 0; i < 170; i++) a.push([r() * 24, deg(Math.asin(r() * 2 - 1)), 0.5 + r() * 0.6]); return a; })();
const starVec = (lat, ra, dec, lst) => vec(lat, dec, (lst - ra) * 15);     // lst＝その場所の星の時刻（時）

// ---------------------------------------------------------------- 場面
const SCENES = [];

// 地球の自転と方位、時刻（p.203 図3）
SCENES.push({
  title: '地球の自転', sub: '1日に1回', rate: 0.125,
  draw() {
    const cx = W * 0.56, cy = H * 0.5, r = 26 * U, a = TAU * day;          // 0時＝太陽の反対側（右）
    for (let i = -2; i <= 2; i++) arrow(W * 0.06, cy + i * 9 * U, W * 0.2, cy + i * 9 * U, C.sun, 0.5 * U);
    text('太陽の光', W * 0.13, cy - 24 * U, 3.4, C.sun);
    litBall(cx, cy, r, -1e6, cy, C.earth, C.night);
    disc(cx, cy, 0.9 * U, '#fff'); text('北極', cx + 5 * U, cy + 3 * U, 2.8);
    arcArrow(cx, cy, r + 4 * U, rad(-70), rad(-20), C.dim); text('自転の向き', cx + r * 0.75, cy + r + 6 * U, 3, C.dim);
    const [x, y] = pos(cx, cy, r * 0.7, a);
    const L = 8 * U, n = [cx - x, cy - y], nl = Math.hypot(...n), nx = n[0] / nl, ny = n[1] / nl;   // 北＝北極の向き
    const ex = -Math.sin(a), ey = -Math.cos(a);                                                     // 東＝自転で進む向き
    arrow(x, y, x + nx * L, y + ny * L, '#fff'); text('北', x + nx * (L + 2.5 * U), y + ny * (L + 2.5 * U), 3);
    arrow(x, y, x + ex * L, y + ey * L, C.hi); text('東', x + ex * (L + 2.5 * U), y + ey * (L + 2.5 * U), 3, C.hi);
    text('西', x - ex * 5 * U, y - ey * 5 * U, 2.6, C.dim); text('南', x - nx * 5 * U, y - ny * 5 * U, 2.6, C.dim);
    disc(x, y, 1.6 * U, C.red);
    const h = (day % 1) * 24;
    const name = h < 3 ? '真夜中' : h < 9 ? '朝' : h < 15 ? '昼' : h < 21 ? '夕方' : '真夜中';
    const px = W * 0.8, py = H * 0.2, pw = 27 * U; panel(px, py, pw, 30 * U);
    text(`${Math.floor(h)}時`, px + pw / 2, py + 9 * U, 8, C.hi); text(name, px + pw / 2, py + 20 * U, 6);
    text(`${Math.floor(day) + 1}日目`, px + pw / 2, py + 27 * U, 3, C.dim);
  }
});

// 太陽の1日の動き・1年の動き（p.200 図2・p.215 図4）
function sunDome(s, lat, cx, cy, R) {
  const yearMode = s.mode === 1;
  const d = yearMode ? s.d0 + day * 40 : s.d0, hour = yearMode ? 12 : (day % 1) * 24, dec = decl(d);
  const P = dome(cx, cy, R, Math.abs(lat) < 84);
  [[EPS, '6月'], [0, '3月・9月'], [-EPS, '12月']].forEach(([dc, n]) => { domePath(P, lat, dc, '#55648a', 0.3, true);
    const v = vec(lat, dc, 0); if (v[2] > 0.03) { const [x, y] = P(v); text(n, x, y - 3 * U, 2.4, C.dim); } });
  domePath(P, lat, dec, C.hi, 0.7);
  const v = vec(lat, dec, (hour - 12) * 15);
  if (v[2] >= 0) { const [x, y] = P(v); sunDisc(x, y, 2.4 * U); }
  return { d, hour, dec, up: v[2] >= 0, yearMode };
}
SCENES.push({
  title: '太陽の動き（天球）', sub: '東京', rate: 0.25, mode: 0, d0: 79,
  groups() { return [[['1日', () => { this.mode = 0; }], ['1年', () => { this.mode = 1; }]], DATES.map(([n, d]) => [n, () => { this.d0 = d; }])]; },
  draw() {
    const cx = W * 0.4, cy = H * 0.66, R = 40 * U, r = sunDome(this, 35.7, cx, cy, R);
    const px = W * 0.74, py = H * 0.12, pw = 38 * U, ph = 52 * U; panel(px, py, pw, ph);
    text(dateStr(r.d), px + pw / 2, py + 9 * U, 6.5, C.hi);
    text(r.yearMode ? '正午ごろ' : `${Math.floor(r.hour)}時`, px + pw / 2, py + 20 * U, 5.5);
    text('南中高度', px + pw / 2, py + 32 * U, 3.4, C.dim); text(`${fmt(90 - 35.7 + r.dec)}°`, px + pw / 2, py + 41 * U, 7);
    if (!r.up) text('太陽は地平線の下', cx, cy + 16 * U, 3.4, C.dim);
  }
});

// 世界各地の太陽の動き（p.201 図6）
SCENES.push({
  title: '世界各地の太陽の動き', sub: '緯度がちがうと', rate: 0.25, mode: 0, d0: 79, li: 0,
  groups() { return [LATS.map(([n], i) => [n, () => { this.li = i; }]), DATES.map(([n, d]) => [n, () => { this.d0 = d; }])]; },
  draw() {
    const [name, lat] = LATS[this.li], cx = W * 0.4, cy = H * 0.66, R = 40 * U, r = sunDome(this, lat, cx, cy, R);
    const px = W * 0.74, py = H * 0.12, pw = 38 * U, ph = 46 * U; panel(px, py, pw, ph);
    text(name, px + pw / 2, py + 8 * U, 6, C.hi);
    text(lat >= 0 ? `北緯${fmt(lat)}°` : `南緯${fmt(-lat)}°`, px + pw / 2, py + 17 * U, 4);
    text(dateStr(r.d), px + pw / 2, py + 28 * U, 5); text(`${Math.floor(r.hour)}時`, px + pw / 2, py + 38 * U, 5.5);
    if (!r.up) text('太陽は地平線の下', cx, cy + 16 * U, 3.4, C.dim);
  }
});

// 星の1日の動き・東西南北の空（p.207 図1）
SCENES.push({
  title: '星の1日の動き', sub: '東西南北の空', rate: 1 / 24,
  draw() {
    const lst0 = 4.0, lst = lst0 + day * 24, lat = 35.7;                 // 午後8時にオリオン座が東の空にある日
    const views = [['北の空', 0, '西', '東'], ['南の空', 180, '東', '西'], ['東の空', 90, '北', '南'], ['西の空', 270, '南', '北']];
    const pw = W * 0.34, ph = H * 0.44, gx = W * 0.03, gy = H * 0.02;
    views.forEach(([name, az0, l, r], k) => {
      const x0 = W * 0.04 + (k % 2) * (pw + gx), y0 = H * 0.02 + Math.floor(k / 2) * (ph + gy);
      g.save(); g.beginPath(); g.rect(x0, y0, pw, ph); g.clip();
      g.fillStyle = '#060a18'; g.fillRect(x0, y0, pw, ph);
      const yh = y0 + ph * 0.86, sc = pw / 120;                           // 横120°を1枚に
      const Q = (ra, dec, t) => { const [n, e, z] = starVec(lat, ra, dec, t); if (z < 0) return null;
        let da = ((deg(Math.atan2(e, n)) - az0 + 540) % 360) - 180; if (Math.abs(da) > 75) return null;
        return [x0 + pw / 2 + da * sc, yh - deg(Math.asin(z)) * sc]; };
      const trail = (ra, dec, col, w) => { g.beginPath(); let pen = false;
        for (let b = 2; b >= 0; b -= 0.25) { const q = Q(ra, dec, lst - b); if (q) { pen ? g.lineTo(...q) : g.moveTo(...q); pen = true; } else pen = false; }
        g.strokeStyle = col; g.lineWidth = w; g.stroke(); };
      RAND.forEach(([ra, dec, m]) => { trail(ra, dec, 'rgba(160,180,220,0.35)', 0.12 * U); const q = Q(ra, dec, lst); if (q) disc(q[0], q[1], m * 0.35 * U, '#dfe6f5'); });
      FIGS.forEach(([st, ln, nm]) => { const q = st.map(([ra, dec]) => Q(ra, dec, lst));
        st.forEach(([ra, dec]) => trail(ra, dec, 'rgba(255,215,106,0.45)', 0.18 * U));
        ln.forEach(([i, j]) => { if (q[i] && q[j]) seg(...q[i], ...q[j], '#ffd76a', 0.2 * U); });
        q.forEach(p => p && disc(p[0], p[1], 0.6 * U, '#fff3c0'));
        if (q[0] && q.every(Boolean)) text(nm, q[0][0], q[0][1] - 3 * U, 2.4, C.hi); });
      const pq = Q(...POLARIS, lst); if (pq) { disc(pq[0], pq[1], 0.8 * U, '#fff'); text('北極星', pq[0], pq[1] - 3 * U, 2.6); }
      g.fillStyle = '#16261d'; g.fillRect(x0, yh, pw, ph);
      text(name, x0 + pw / 2, yh + (y0 + ph - yh) / 2, 3.4); text(l, x0 + 4 * U, yh + (y0 + ph - yh) / 2, 2.8, C.dim); text(r, x0 + pw - 4 * U, yh + (y0 + ph - yh) / 2, 2.8, C.dim);
      g.restore(); g.strokeStyle = C.line; g.lineWidth = 0.2 * U; g.strokeRect(x0, y0, pw, ph);
    });
    const px = W * 0.78, py = H * 0.1, pw2 = 32 * U; panel(px, py, pw2, 40 * U);
    text(clock(20 + day * 24), px + pw2 / 2, py + 9 * U, 5.5, C.hi);
    text('1時間に15°', px + pw2 / 2, py + 21 * U, 4.2); text('線＝2時間ぶん', px + pw2 / 2, py + 31 * U, 3, C.dim);
  }
});

// 星の1日の動き・天球（p.207 図2・図3）
SCENES.push({
  title: '星の1日の動き（天球）', sub: '地軸を中心に回って見える', rate: 1 / 12, li: 0,

    const cx = W * 0.36, cy = H * 0.5, yr = day / 365;
    sunDisc(cx, cy, 3 * U);
    PL.forEach(([n, T, col], i) => { const R = (8 + i * 5.2) * U, a = TAU * yr / T + i * 0.9; ring(cx, cy, R, '#33405f', 0.18 * U);
      const [x, y] = pos(cx, cy, R, a); disc(x, y, (i > 3 ? 1.9 : 1.3) * U, col); text(n, x, y - 3.2 * U, 2.4, col); });
    const px = W * 0.68, py = H * 0.06, pw = 52 * U, ph = 82 * U; panel(px, py, pw, ph);
    text(`地球の ${fmt(yr, 1)} 年`, px + pw / 2, py + 7 * U, 5.5, C.hi); text('1回まわるのにかかる時間', px + pw / 2, py + 15 * U, 3, C.dim);
    PL.forEach(([n, T, col], i) => { const y = py + (23 + i * 7) * U; text(n, px + 4 * U, y, 3.6, col, 'left');
      text(`${T}年`, px + 35 * U, y, 3.6, C.text, 'right'); text(`${Math.floor(yr / T)}回`, px + pw - 4 * U, y, 3.6, C.hi, 'right'); });
    text('※軌道の大きさは実際とちがう', px + pw / 2, py + ph - 4 * U, 2.6, C.dim);
  }
});

// 黒点の移動と太陽の自転（p.194 図1・図2）
const SPOTS = [[10, 18, 1.6], [70, -12, 1.1], [150, 25, 1.3], [215, -20, 1.8], [290, 8, 1.0]];   // 経度・緯度・大きさ
SCENES.push({
  title: '黒点の動き', sub: '太陽も自転している', rate: 1.5,
  draw() {
    const cx = W * 0.4, cy = H * 0.5, R = 34 * U, rot = 360 * day / 27;
    const gr = g.createRadialGradient(cx - R * 0.2, cy - R * 0.2, R * 0.1, cx, cy, R); gr.addColorStop(0, '#ffe08a'); gr.addColorStop(1, '#f59a1c'); disc(cx, cy, R, gr);
    SPOTS.forEach(([lon, lat, s]) => { const l = rad(lon + rot), c = Math.cos(l); if (c <= 0.03) return;
      const x = cx + R * Math.cos(rad(lat)) * Math.sin(l), y = cy - R * Math.sin(rad(lat));
      g.beginPath(); g.ellipse(x, y, s * U * 1.6 * c, s * U * 1.6, 0, 0, TAU); g.fillStyle = '#3a2410'; g.fill(); });
    text('東', cx - R - 5 * U, cy, 4); text('西', cx + R + 5 * U, cy, 4); arrow(cx - 10 * U, cy + R + 5 * U, cx + 10 * U, cy + R + 5 * U, C.dim);
    const px = W * 0.74, py = H * 0.16, pw = 38 * U, ph = 40 * U; panel(px, py, pw, ph);
    text(`${Math.floor(day) + 1}日目`, px + pw / 2, py + 9 * U, 6.5, C.hi);
    text('中央では円形', px + pw / 2, py + 21 * U, 3.8); text('端ではだ円形', px + pw / 2, py + 28 * U, 3.8); text('→ 太陽は球体', px + pw / 2, py + 35 * U, 3.4, C.dim);
  }
});

// ---------------------------------------------------------------- 進行
const $ = id => document.getElementById(id);
function show(i) {
  cur = (i + SCENES.length) % SCENES.length; day = 0;
  const s = SCENES[cur];
  $('title').textContent = s.title; $('sub').textContent = s.sub; $('no').textContent = `${cur + 1} / ${SCENES.length}`;
  const ex = $('extra'); ex.innerHTML = '';
  (s.groups ? s.groups() : []).forEach((grp, gi) => {
    if (gi) { const sp = document.createElement('span'); sp.className = 'sp'; ex.appendChild(sp); }
    const bs = grp.map(([label, fn], k) => { const b = document.createElement('button'); b.textContent = label;
      b.onclick = () => { fn(); day = 0; bs.forEach(x => x.classList.toggle('on', x === b)); }; ex.appendChild(b); return b; });
    bs[0].click();
  });
  $('list').classList.remove('open');
}
function frame(t) {
  const dt = Math.min(0.1, (t - last) / 1000 || 0); last = t;
  if (playing) day += dt * SCENES[cur].rate * speed;
  g.clearRect(0, 0, W, H); SCENES[cur].draw();
  requestAnimationFrame(frame);
}
function setPlay(p) { playing = p; $('play').textContent = p ? '停止' : '再生'; }
$('prev').onclick = () => show(cur - 1); $('next').onclick = () => show(cur + 1);
$('play').onclick = () => setPlay(!playing); $('reset').onclick = () => { day = 0; };
$('menu').onclick = () => $('list').classList.toggle('open');
SCENES.forEach((s, i) => { const b = document.createElement('button'); b.textContent = `${i + 1}　${s.title}`; b.onclick = () => show(i); $('list').appendChild(b); });
if (location.protocol.startsWith('http')) { const b = document.createElement('button'); b.textContent = '← ポータル'; b.onclick = () => { location.href = '../index.html'; }; $('list').appendChild(b); }
document.querySelectorAll('.spd').forEach(b => b.onclick = () => { speed = +b.dataset.k; document.querySelectorAll('.spd').forEach(x => x.classList.toggle('on', x === b)); });
addEventListener('keydown', e => { if (e.key === 'ArrowRight') show(cur + 1); else if (e.key === 'ArrowLeft') show(cur - 1); else if (e.key === ' ') { e.preventDefault(); setPlay(!playing); } else if (e.key === 'Escape') $('list').classList.remove('open'); });
addEventListener('resize', fit);
fit();
const q = new URLSearchParams(location.search);       // 確認用: ?s=場面&t=日数&b=押すボタンの番号（カンマ区切り）&stop=1
show((+q.get('s') || 1) - 1);
if (q.get('b')) q.get('b').split(',').forEach(n => $('extra').querySelectorAll('button')[+n].click());
if (q.get('t')) day = +q.get('t');
if (q.get('stop')) setPlay(false);
requestAnimationFrame(frame);
</script>
