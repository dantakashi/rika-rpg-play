<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">

<title>生物B1 中1植物(観察/花/葉根/分類)</title>
<style>
:root{--bg:#12151c;--card:#1c2230;--ink:#e8ecf5;--sub:#9aa5b8;--gold:#e7b34c;--ok:#3dbb7c;--warn:#e0a83a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Yu Gothic UI","Hiragino Sans",system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
header{position:sticky;top:0;background:#12151cee;padding:10px 14px;border-bottom:1px solid #2a3245;z-index:5}
.bar{height:8px;background:#2a3245;border-radius:4px;overflow:hidden;margin-top:6px}
.bar>div{height:100%;background:var(--gold);width:0%;transition:width .25s}
.hrow{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub)}
main{flex:1;display:flex;justify-content:center;padding:14px}
.stage{width:100%;max-width:640px}
.unitcard,.card{background:var(--card);border:1px solid #2a3245;border-radius:14px;padding:18px 16px;margin-bottom:10px}
.uid{color:var(--gold);font-size:13px;letter-spacing:.04em}
h2{font-size:18px;margin:4px 0 2px}
.meta{color:var(--sub);font-size:12px;margin-bottom:8px}
.q{background:#232c40;border-left:4px solid var(--gold);border-radius:0 8px 8px 0;padding:10px 12px;margin:7px 0;font-size:16.5px;line-height:1.75}
.li{padding:7px 4px;font-size:15.5px;line-height:1.7;border-bottom:1px dashed #2a3245}
.ctx{color:var(--sub);font-size:12.5px;line-height:1.6;margin-top:10px;border-top:1px solid #2a3245;padding-top:8px}
.ctx .q,.ctx .li{background:none;border:none;font-size:12.5px;padding:2px 0;color:var(--sub)}
.btns{display:flex;gap:8px;margin-top:14px}
.btns button{flex:1;padding:14px 4px;font-size:15px;border:none;border-radius:12px;color:#fff;font-weight:700;cursor:pointer}
.b-ok{background:var(--ok)}.b-warn{background:var(--warn);color:#241a03}.b-skip{background:#39415552}
.b-yes{background:var(--ok)}.b-no{background:#c75454}
.tags{display:none;margin-top:10px;gap:6px;flex-wrap:wrap}
.tags.open{display:flex}
.tag{padding:8px 10px;border-radius:20px;border:1px solid var(--gold);color:var(--gold);font-size:13px;cursor:pointer;background:none}
.tag.on{background:var(--gold);color:#241a03;font-weight:700}
textarea{width:100%;margin-top:8px;background:#101420;color:var(--ink);border:1px solid #2a3245;border-radius:8px;padding:10px;font-size:15px;min-height:64px;display:none}
textarea.open{display:block}
.send{display:none;margin-top:8px;width:100%;padding:12px;border:none;border-radius:12px;background:var(--gold);color:#241a03;font-weight:700;font-size:15px;cursor:pointer}
.send.open{display:block}
.nav{display:flex;justify-content:space-between;margin-top:4px}
.nav button{background:none;border:none;color:var(--sub);font-size:14px;padding:10px;cursor:pointer}
.big{font-size:22px;font-weight:800;margin:6px 0}
.done{white-space:pre-wrap;background:#101420;border:1px solid #2a3245;border-radius:8px;padding:10px;font-size:12px;max-height:200px;overflow:auto;margin-top:10px}
.exbtn{width:100%;padding:14px;border:none;border-radius:12px;font-weight:700;font-size:16px;margin-top:10px;cursor:pointer}
.summary{color:var(--sub);font-size:14px;line-height:1.9}
.col{margin:9px 0;border:1px dashed var(--gold);border-radius:10px;background:#1a2130;overflow:hidden}
.col>summary{list-style:none;cursor:pointer;padding:11px 13px;color:var(--gold);font-weight:700;font-size:14.5px}
.col>summary::-webkit-details-marker{display:none}
.col>summary::before{content:"▸ ";}
.col[open]>summary::before{content:"▾ ";}
.colbody{padding:2px 13px 12px}
.colbody .q{background:#12161f;border-left-color:#5a6b8c;font-size:15px}
</style></head><body>

</header>

<script>
const ITEMS = [{"type": "unit", "uid": "u_bio_01", "name": "生物を観察する・分類の視点", "n": 11, "nc": 3}, {"type": "card", "uid": "u_bio_01", "id": "u_bio_01-R", "title": "レディネスチェック", "meta": "", "screenHtml": "<div class=\"li\">- 【01-R1】[既存・小学校] がけの地層を見る時に大切なことは？ → <b>安全に見る</b>（選: 下を掘り続ける／石を投げる／安全に見る／走って近づく）</div>\n<div class=\"li\">- 【01-R2】[既存・小学校] ホウセンカの体にある部分は？ → <b>根・くき・葉</b>（選: 根・くき・葉／羽・足・目／石・砂・水／火・音・光）</div>\n<div class=\"q\">つまずいたときの誘いコピー（弱点表示ではなく招待状のトーン・憲法第2.5条・2.6条＝楽アピールで誘わない）:</div>\n<div class=\"q\">「<b>観察のしかたを見にいくと、このあとの理科の実験ぜんぶがやりやすくなるよ</b>」→ 該当の教えるカードへのボタンがそっと光る</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_01", "id": "01-P1", "title": "予想（Predict）", "meta": "どれを選んでも正誤なし・「なるほど」で次へ", "screenHtml": "<div class=\"q\">同じタンポポを、2人の生徒がスケッチした。</div>\n<div class=\"q\">1人は、写真みたいにかげをつけて、こまかく描き込んだ。</div>\n<div class=\"q\">もう1人は、うすい線1本で形をかいて、横に「気づいたこと」を言葉で書いた。</div>\n<div class=\"q\">あとで別の人が「これ、どんな植物だったの？」と知りたいとき、役に立つのはどっちだと思う？</div>\n<div class=\"q\">「描き込んだほう」／「うすい線と言葉のほう」／「どっちも同じくらい」</div>", "ctxHtml": "<div class=\"li\">※図: cimg/u_bio_01/p1_two_students.png（新規・AI場面イメージ＝2人の生徒が同じタンポポを観察してかいている場面。※かいたスケッチの中身は見せない＝答えを先渡ししない）</div>\n<div class=\"q\"></div>\n<div class=\"q\"></div>"}, {"type": "card", "uid": "u_bio_01", "id": "01-P2", "title": "おどろき（Observe）", "meta": "図: card_sketch_good_bad.png（新規・カードサイズ＝左「うすい線1本＋言葉のメモ」・右「かげをこくつけて描き込みすぎ」の2つのスケッチの見くらべ・印なし。どちらが正解かの印はつけない＝おどろきの本文で明かす）", "screenHtml": "<div class=\"q\">同じタンポポを見てかいたのに——2枚のスケッチが伝えてくれる中身は、まるでちがう。</div>\n<div class=\"q\">写真みたいに描き込んだほうは、かげの線が何本も重なって、葉が本当は何色なのか、毛がどっちを向いているのか、もう読み取れない。</div>\n<div class=\"q\">うすい線1本のほうは、横に「葉のふちはギザギザ・裏に白い毛」と書きそえてある。じょうずには見えないのに、あとで読むと、こっちのほうが本物の特徴が正確に残っているんだ。</div>\n<div class=\"q\">じょうずでこまかい絵のほうが、かえって伝わらない。役に立つのは、うすい線と言葉のほう——同じものを見たのに、逆転する。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_01", "id": "01-P3", "title": "たね明かし（Explain）", "meta": "", "screenHtml": "<div class=\"q\">理科の観察は、見たことを正確に「<b>記録</b>」して残す作業。</div>\n<div class=\"q\">だからスケッチには決まりがある——細い線ではっきり、かげはつけない、大きさや色や気づきは言葉でそえる。</div>\n<div class=\"q\">小さいものを見るときの<b>ルーペ</b>の使い方にも決まりがある。</div>\n<div class=\"q\">ぜんぶ「あとで正しく伝わる」ためのもの。ここから、その決まりを1つずつ見ていくよ。</div>", "ctxHtml": "<div class=\"li\">---</div>"}, {"type": "card", "uid": "u_bio_01", "id": "01-T1", "title": "理科のスケッチは「記録」", "meta": "（種別: 概念／図: card_sketch_good_bad.png を再掲＝2つのスケッチの見くらべ・印なし）", "screenHtml": "<div class=\"q\">理科のスケッチは、絵ではなく「<b>記録</b>」。</div>\n<div class=\"q\">あとで読んだ人に、見たものが正しく伝わることが目的なんだ。</div>\n<div class=\"q\">だから、図工の時間の絵とはねらいがちがう。じょうずさや、きれいさは競わない。</div>\n<div class=\"q\">「この形」「この大きさ」「この色」が、あとで読む人にちゃんと伝わるか——それだけを考えてかく。</div>\n<details class=\"col\"><summary>なんで写真みたいに描いちゃダメなの？</summary><div class=\"colbody\"><div class=\"q\">写真みたいに描き込むと、線がたくさん重なって、どれが本当の輪郭（りんかく）か分からなくなる。</div>\n<div class=\"q\">それに、こく描き込むほど時間がかかって、肝心の「気づいたこと」を書く前に観察が終わってしまう。</div>\n<div class=\"q\">うすい線1本＋言葉、のほうが、じつは早くて、正確に伝わる——だから理科ではこのやり方なんだ。</div></div></details>", "ctxHtml": "<div class=\"q\"></div>"}, {"type": "card", "uid": "u_bio_01", "id": "01-T2", "title": "スケッチの線のきまり——細い線1本ではっきり", "meta": "（種別: 概念／図なし）", "screenHtml": "<div class=\"q\">スケッチの線には、はっきりした決まりがある。</div>\n<div class=\"q\">・<b>細い線を1本で、はっきりかく</b>（同じ線を何度もなぞらない）。</div>\n<div class=\"q\">・<b>線を重ねない</b>。ごちゃごちゃすると、形が読み取れなくなる。</div>\n<div class=\"q\">・<b>かげ（影）はつけない</b>。ぬりつぶさない。輪郭の線だけで形を伝える。</div>\n<div class=\"q\">「うすく、細く、1本で」——これがスケッチの線の基本だよ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_01", "id": "01-T3", "title": "言葉でそえる——スケッチは絵＋言葉", "meta": "（種別: 概念／図なし）", "screenHtml": "<div class=\"q\">スケッチは、絵だけで終わらせない。横に「<b>言葉</b>」をそえる。</div>\n<div class=\"q\">・<b>大きさ</b>（およそ何cmか）</div>\n<div class=\"q\">・<b>色</b>（絵はぬらないので、色は言葉で書く）</div>\n<div class=\"q\">・<b>気づいたこと</b>（毛が生えている・ギザギザ など）</div>\n<div class=\"q\">・<b>日づけ</b>と<b>場所</b>（いつ・どこで見たか）</div>\n<div class=\"q\">絵で形を、言葉でそれ以外を伝える。この2つがそろって、はじめて「あとで読める記録」になるんだ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_01", "id": "01-Q1", "title": "確認クイズ・セット1（スケッチのきまりの節目・3問の類題・すべて新規下書き・4択）", "meta": "", "screenHtml": "<div class=\"li\">- Q1 [新規] 理科のスケッチの「線」のかき方で、正しいのはどれ？ → <b>細い線を1本で、はっきりかく</b>（選: 細い線を1本で、はっきりかく／同じ線を何度もなぞって、こくする／太いふででぬる／点々をつなげてかく）</div>\n<div class=\"li\">- Q2 [新規] 理科のスケッチで正しいのはどれ？ → <b>見えたものを、かげをつけずにかく</b>（選: 見えたものを、かげをつけずにかく／写真のように、かげをつけて立体的にかく／すきな色をぬって、きれいにしあげる／大きくはでに、目立つようにかざる）</div>\n<div class=\"li\">- Q3 [新規] 観察して気づいたこと（大きさや色）は、スケッチでどうするとよい？ → <b>言葉で書きそえる</b>（選: 言葉で書きそえる／色をぬって表す／大きくかいて表す／書かずに、絵だけでわかるようにする）</div>", "ctxHtml": "<div class=\"li\">※3問とも「理科のスケッチで正しいのはどれ」を問う同型・同難度の類題セット（線／かげ／そえる言葉の3つの決まりを同じ4択形式で）。この節目は「正しいやり方 vs まちがったやり方」の選び分けが本題なので4択（憲法4.7条の例外＝内容が選び分けを要求する時）。</div>"}, {"type": "card", "uid": "u_bio_01", "id": "01-T4", "title": "ルーペの使い方——目に近づけて持つ", "meta": "（種別: 概念／図: card_loupe_use.png 新規・カードサイズ＝ルーペを目のすぐ前に持ち、見るもの（または顔）を前後に動かしてピントを合わせる模式図・印なし）", "screenHtml": "<div class=\"q\">小さいものを大きく見る道具が<b>ルーペ</b>（虫めがね）。使い方に決まりがある。</div>\n<div class=\"q\">・ルーペは<b>目に近づけて</b>持つ（目から遠ざけて持たない）。</div>\n<div class=\"q\">・そのまま、<b>見るものを前後に動かして</b>、いちばんはっきり見えるところ（ピント）で止める。</div>\n<div class=\"q\">・見るものが動かせないとき（木の葉など）は、<b>自分の顔のほう</b>を前後に動かす。</div>\n<div class=\"q\">そして、いちばん大事な安全のこと——<b>ルーペで太陽をぜったいに見ない</b>。目をいためるから、これだけは必ず守る。</div>\n<details class=\"col\"><summary>なんで目に近づけるの？</summary><div class=\"colbody\"><div class=\"q\">ルーペを目から離して持つと、見えるはんいがせまくなって、手も動いてブレやすい。</div>\n<div class=\"q\">目のすぐ前に固定すれば、見えるはんいが広くなって、ピントも合わせやすい。</div>\n<div class=\"q\">だから「ルーペは目の近くで固定して、見るものを動かす」——このやり方が決まりになっているんだ。</div></div></details>", "ctxHtml": "<div class=\"q\"></div>"}, {"type": "card", "uid": "u_bio_01", "id": "01-Q2", "title": "確認クイズ・セット2（ルーペの使い方の節目・3問の類題・すべて新規下書き・4択）", "meta": "", "screenHtml": "<div class=\"li\">- Q1 [新規] ルーペの正しい持ち方はどれ？ → <b>目に近づけて持つ</b>（選: 目に近づけて持つ／目からできるだけ遠ざけて持つ／見るものにくっつけて、目からはなす／顔の横で持つ）</div>\n<div class=\"li\">- Q2 [新規] ルーペでいちばんはっきり見える所（ピント）を合わせるとき、動かすのはどれ？ → <b>見るもの、または顔を前後に動かす</b>（選: 見るもの、または顔を前後に動かす／ルーペだけを大きく左右にふる／目を細めたり開いたりする／何も動かさず、じっと待つ）</div>\n<div class=\"li\">- Q3 [新規] ルーペを使うとき、ぜったいにやってはいけないのはどれ？ → <b>ルーペで太陽を見る</b>（選: ルーペで太陽を見る／ルーペで葉を見る／ルーペで花のつくりを見る／ルーペで石のもようを見る）</div>", "ctxHtml": "<div class=\"li\">※3問とも「ルーペの正しい使い方はどれ」を問う同型・同難度の類題セット（持ち方／ピントの合わせ方／安全 を同じ4択形式で）。安全（太陽を見ない）を必ず1問入れる。</div>"}, {"type": "card", "uid": "u_bio_01", "id": "01-T5", "title": "なぜ決まりがあるのか——観察は「記録して残す」作業", "meta": "（種別: 達成の先出し）", "screenHtml": "<div class=\"q\">ここまでの決まりは、ぜんぶ1つのことのためにある——観察は「<b>正確に記録して残す</b>」作業だから。</div>\n<div class=\"q\">細い線1本でかくのも、かげをつけないのも、言葉をそえるのも、ルーペを目に近づけるのも、</div>\n<div class=\"q\">「あとで別の人が読んでも、見たものが正しく伝わる」ためなんだ。</div>\n<div class=\"q\">これが、理科の観察のやり方だよ。</div>\n<div class=\"q\">このあとの理科では、いろんな生き物や実験をこのやり方で記録していく。1つ身につけば、ぜんぶで使える。</div>", "ctxHtml": "<div class=\"li\">---</div>"}, {"type": "check", "uid": "u_bio_01", "id": "u_bio_01-確認1", "textHtml": "<b>確認クイズを4択にした件</b>: カーネル指定どおり4択×3同型で書いた（「正しいやり方 vs まちがったやり方」を選び分けるのが本題＝憲法4.7条の例外解釈）。憲法の既定は2択（できた感優先）なので、ここを2択（○✕＝「このやり方は正しい？」）に寄せるべきかは判断をあおぎたい。→ <b>推奨: 4択のまま</b>（手順の学習は「正しい1つを、まぎらわしい候補から選ぶ」経験そのものに価値があり、○✕だと『正しい説明を1つ見せて○』になって、まちがったやり方との対比が消えるため）。"}, {"type": "check", "uid": "u_bio_01", "id": "u_bio_01-確認2", "textHtml": "<b>レディネスを2問に絞った件</b>: 既存プールに観察技能の下位diff問題が無いため、R1（観察の安全）・R2（生き物は部分でできている）の2問だけにした。この2問で前提の呼び起こしとして十分か（もう1問足すなら、小学校の「身近な生き物の観察経験」系をどれか追加できる）。→ <b>推奨: 2問</b>（このユニットは観察の最初の一歩で、重い前提を積む必要がないため。憲法は2〜3問を許容）。"}, {"type": "check", "uid": "u_bio_01", "id": "u_bio_01-確認3", "textHtml": "<b>全問[新規]の作問候補化</b>: 【01-Q1】【01-Q2】の6問を、将来 QUESTION_DB の観察技能問題（現在ゼロ）として正式作問する対象に上げてよいか（カーネルnotesの「将来の問題作成候補として要マーク」の実体化）。 ---"}, {"type": "unit", "uid": "u_bio_02", "name": "花のつくり", "n": 11, "nc": 4}, {"type": "card", "uid": "u_bio_02", "id": "u_bio_02-R", "title": "レディネスチェック", "meta": "", "screenHtml": "<div class=\"li\">- 【02-R1】[既存・小学校] 花粉を作る花の部分は？ → <b>おしべ</b>（選: おしべ／めしべ／根／葉）</div>\n<div class=\"li\">- 【02-R2】[既存・小学校] 花粉がつく花の部分は？ → <b>めしべ</b>（選: 葉／めしべ／根／くき）</div>\n<div class=\"li\">- 【02-R3】[既存・小学校] おしべの先にある粉は？ → <b>花粉</b>（選: でんぷん／土／水／花粉）</div>\n<div class=\"q\">つまずいたときの誘いコピー（弱点表示ではなく招待状のトーン・憲法第2.5条／2.6条＝楽アピールで誘わない）:</div>\n<div class=\"q\">「<b>おしべ・めしべ・花粉を思い出しておくと、このあとの『花のどこが実になるか』の話がつながりやすくなるよ</b>」→ 該当の教えるカードへのボタンがそっと光る</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_02", "id": "02-P1", "title": "予想（Predict）", "meta": "どれを選んでも正誤なし・「なるほど」で次へ／図: cimg/u_bio_02/p_flower_fruit.png（新規・実物イメージ＝サクラの花と、しばらくあとの赤いサクランボを並べた写真ふう。矢印やラベルは入れない＝どの部分がふくらんだかは示さない）", "screenHtml": "<div class=\"q\">花がさいたあと、しばらくすると花びらは落ちて、かわりに実（み）ができる。</div>\n<div class=\"q\">サクラなら、あの赤いサクランボ。</div>\n<div class=\"q\">あの実は、花のどの部分がふくらんでできたと思う？</div>\n<div class=\"q\">「花びらが集まってふくらんだ」／「めしべの下がふくらんだ」／「おしべがふくらんだ」</div>", "ctxHtml": "<div class=\"q\"></div>"}, {"type": "card", "uid": "u_bio_02", "id": "02-P2", "title": "おどろき（Observe）", "meta": "図: 同上 p_flower_fruit.png を使い、この画面で初めて「めしべの根もと」に印をつけて見せてよい（おどろきの瞬間＝たね明かしの一歩手前）", "screenHtml": "<div class=\"q\">実になるのは——<b>めしべのいちばん下の、ふくらんだところ</b>だったんだ。</div>\n<div class=\"q\">花びらでも、おしべでもない。</div>\n<div class=\"q\">花が終わると花びらは落ちて、めしべの根もとだけが育って実になる。</div>\n<div class=\"q\">つまり、花がさくのは、きれいに見せるためじゃなくて、<b>実と種をつくるため</b>だったんだ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_02", "id": "02-P3", "title": "たね明かし（Explain）", "meta": "", "screenHtml": "<div class=\"q\">花は外側から、がく → 花弁（花びら）→ おしべ → めしべ の順に並んでいる。</div>\n<div class=\"q\">まん中のめしべの下のふくらみを<b>子房（しぼう）</b>といって、これが育つと実（果実）になる。</div>\n<div class=\"q\">子房の中にある小さなつぶ（<b>胚珠（はいしゅ）</b>）が育つと種子になる。</div>\n<div class=\"q\">花のつくりは、実と種をつくるしくみそのものなんだ。今回は、その中身を開けて見ていくよ。</div>", "ctxHtml": "<div class=\"li\">---</div>"}, {"type": "card", "uid": "u_bio_02", "id": "02-T1", "title": "花のつくり——外側から4つ", "meta": "（種別: 概念／図: card_flower_parts.png 新規・カードサイズ＝花の縦断面で がく・花弁・おしべ・めしべ の位置。名前のラベルだけ・印なし教える用）", "screenHtml": "<div class=\"q\">花を外側から見ていくと、決まった順番で4つの部分が並んでいる。</div>\n<div class=\"q\">外側から、<b>がく → 花弁（花びら）→ おしべ → めしべ</b>。</div>\n<div class=\"q\">いちばん外のがくは、つぼみのとき中を守っている。</div>\n<div class=\"q\">その内側に花弁、さらに内側におしべ、そしていちばんまん中にめしべが1本立っている。</div>\n<div class=\"q\">「外から、がく・花弁・おしべ・めしべ」——この並び順が、花のつくりの土台だよ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_02", "id": "02-T2", "title": "めしべの中身——柱頭・子房・胚珠", "meta": "（種別: 概念／図: card_flower_parts.png と同じ図の、めしべ部分の拡大を併記可）", "screenHtml": "<div class=\"q\">まん中のめしべを、もう少しくわしく見てみよう。めしべは、上・下・中で名前がちがう。</div>\n<div class=\"q\">・先のねばねばした部分＝<b>柱頭（ちゅうとう）</b>（ここに花粉がつく）</div>\n<div class=\"q\">・下のふくらんだ部分＝<b>子房（しぼう）</b></div>\n<div class=\"q\">・子房の中の小さなつぶ＝<b>胚珠（はいしゅ）</b></div>\n<div class=\"q\">上から柱頭、下がふくらんで子房、その子房の中に胚珠。</div>\n<div class=\"q\">このあと大事になるのは、下の2つ——子房と胚珠なんだ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_02", "id": "02-Q1", "title": "確認クイズ・セット1（花のつくりの節目・3問の類題・すべて4択）", "meta": "", "screenHtml": "<div class=\"li\">- Q1 [既存・入門] 花のつくりを外側から順に正しく並べたものはどれか。 → <b>がく→花弁→おしべ→めしべ</b>（選: めしべ→おしべ→花弁→がく／花弁→がく→おしべ→めしべ／がく→花弁→おしべ→めしべ／おしべ→めしべ→花弁→がく）</div>\n<div class=\"li\">- Q2 [新規] めしべの先の、花粉がつくねばねばした部分を何という？ → <b>柱頭</b>（選: 柱頭／子房／がく／やく）</div>\n<div class=\"li\">- Q3 [新規] めしべの下のふくらんだ部分（中に胚珠がある）を何という？ → <b>子房</b>（選: 子房／柱頭／花弁／がく）</div>", "ctxHtml": "<div class=\"li\">※T1〜T2で教えた「花の各部の名前・位置」だけを問う同型・同難度（入門）の類題セット。この節目は<b>似た部分（がく・柱頭・子房・やく…）の選び分け</b>が本題なので4択のまま（憲法4.7条の例外＝内容が選び分けを要求する時）。1問目は既存流用、2〜3問目は同型の新規。</div>"}, {"type": "card", "uid": "u_bio_02", "id": "02-T3", "title": "受粉——花粉がめしべの柱頭につく", "meta": "（種別: 概念／図なし）", "screenHtml": "<div class=\"q\">おしべの先（やく）でつくられた花粉が、めしべの先の柱頭につくこと。これを<b>受粉（じゅふん）</b>という。</div>\n<div class=\"q\">花粉が柱頭につくと、その花はいよいよ実と種をつくりはじめる。</div>\n<div class=\"q\">受粉は、実と種づくりの「スタートの合図」なんだ。</div>\n<details class=\"col\"><summary>花粉はどうやってめしべまで行くの？</summary><div class=\"colbody\"><div class=\"q\">おしべの花粉が、自分でめしべまで歩いていくわけじゃない。運び屋がいるんだ。</div>\n<div class=\"q\">サクラやアブラナは、みつを吸いにきた<b>虫</b>が体に花粉をつけて、次の花へ運んでいく（虫が運ぶ花＝虫媒花）。</div>\n<div class=\"q\">一方、マツやスギは、花粉を<b>風</b>に飛ばしてもらう（風が運ぶ花＝風媒花）。春に飛ぶスギ花粉は、まさにこれ。運び方がちがうと、花の形もちがってくるんだ。</div></div></details>", "ctxHtml": "<div class=\"q\"></div>"}, {"type": "card", "uid": "u_bio_02", "id": "02-T4", "title": "花のあと——子房は果実、胚珠は種子", "meta": "（種別: 概念／図: card_ovary_to_fruit.png 新規・カードサイズ＝左に受粉後のめしべ〔子房・胚珠〕、右に育った実の断面〔果実・種子〕を置き、子房→果実・胚珠→種子を対応させた対比図・印なし）", "screenHtml": "<div class=\"q\">受粉がすむと、花のどこが育つのか。ここがこのユニットの山場だよ。</div>\n<div class=\"q\">・<b>子房 → 果実（実）</b>：めしべの下のふくらみ（子房）が、そのまま育って実になる。</div>\n<div class=\"q\">・<b>胚珠 → 種子（たね）</b>：子房の中のつぶ（胚珠）が、育って種になる。</div>\n<div class=\"q\">だから、<b>種は必ず実の中にできる</b>。子房の中に胚珠があったんだから、子房が育った実の中に、胚珠が育った種が入っている——ぴったり対応しているんだ。</div>\n<div class=\"q\">リンゴの芯にある種、ミカンの中の種。あれは全部、もとは胚珠だったんだよ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_02", "id": "02-T5", "title": "果実をつくらない花——裸子植物", "meta": "（種別: 対比で締め／図: card_naked_seed.png 新規・カードサイズ＝左に被子植物のめしべ断面〔子房が胚珠を包む〕、右にマツのりん片〔胚珠がむき出し〕を並べた対比図・印なし）", "screenHtml": "<div class=\"q\">ここまでは、胚珠が子房に包まれている花の話だった（こういう仲間を<b>被子植物（ひししょくぶつ）</b>という）。</div>\n<div class=\"q\">ところが、マツやスギには<b>子房がない</b>。胚珠が、りん片の上に<b>むき出し</b>でついているんだ。</div>\n<div class=\"q\">胚珠がむき出しの仲間を<b>裸子植物（らししょくぶつ）</b>という。「裸（はだか）の種」と書くとおり、胚珠がむき出しなのが名前の由来。</div>\n<div class=\"q\">子房がないと、どうなるか——<b>子房が育ってできる果実が、できない</b>。マツには、サクラのような実がならないんだ。</div>\n<div class=\"q\">「子房があるか、ないか」。これが、被子植物と裸子植物を分ける、いちばんの目じるしだよ。</div>\n<details class=\"col\"><summary>マツの花って、どこにあるの？</summary><div class=\"colbody\"><div class=\"q\">マツにも花はある。でも、花びらもがくもないから、ぼくらが「花」と思っている形とはぜんぜんちがう。</div>\n<div class=\"q\">枝の先の、緑や赤っぽいまつぼっくりの赤ちゃんのようなもの——あれがマツの花（雌花）。そのりん片に、胚珠がむき出しでついている。</div>\n<div class=\"q\">秋にひろう茶色いまつぼっくりは、その雌花が育ったすがた。うろこ（りん片）のすき間に、種がはさまっているんだ。</div></div></details>", "ctxHtml": "<div class=\"q\"></div>"}, {"type": "card", "uid": "u_bio_02", "id": "02-Q2", "title": "確認クイズ・セット2（子房・胚珠・裸子の「機能」の節目・3問の類題・すべて新規・2択）", "meta": "", "screenHtml": "<div class=\"li\">- Q1 [新規] 受粉したあと、めしべの下のふくらみ（子房）は、育って何になる？ → <b>果実（実）</b>（選: 果実（実）／種子（たね））</div>\n<div class=\"li\">- Q2 [新規] 受粉したあと、子房の中の胚珠は、育って何になる？ → <b>種子（たね）</b>（選: 種子（たね）／果実（実））</div>\n<div class=\"li\">- Q3 [新規] マツには子房がない。だから、サクラにはできて、マツにはできないものは？ → <b>果実（実）</b>（選: 果実（実）／種子（たね））</div>", "ctxHtml": "<div class=\"li\">※T4〜T5で教えた「どこが何になるか」を問う同型・同難度の類題セット。カードを読んだあとの<b>できた感・ここまで進んだご褒美</b>が主目的なので、既定どおり2択（憲法4.7条）。3問とも「子房・胚珠・果実・種子の対応」という同じ機能を、少しずつ角度を変えて問う。</div>\n<div class=\"li\">※設計メモ: Q3は「子房がない → 子房が育つ果実もできない」という【02-T5】の機能ロジックを、暗記でなく引き算の考え方で確かめる問い。マツも種子（もとは胚珠）はつくるので、消えるのは「実」のほうだと読ませる。Q1・Q2の「子房→果実／胚珠→種子」と同じ対応の応用＝真の類題（同概念・同形式・同難度）。</div>\n<div class=\"li\">---</div>"}, {"type": "check", "uid": "u_bio_02", "id": "u_bio_02-確認1", "textHtml": "<b>確認クイズの節目の割り当て（§2.0【設計判断1】）</b>: カーネルの「セット1に胚珠・子房が何になるか」を、教える順（T4で変化を教える）に合わせて<b>セット1＝花の各部の識別（T2後）／セット2＝子房→果実・胚珠→種子＋裸子の機能（T5後）</b>に組み替えました。この並びでよいですか。（意図: 教える前に問わない・難所は最後にまとめて確認）"}, {"type": "check", "uid": "u_bio_02", "id": "u_bio_02-確認2", "textHtml": "<b>セット1を4択のまま／セット2を2択にした判断（憲法4.7条）</b>: セット1は「がく・柱頭・子房・やく」など似た部分の選び分けが本題なので4択、セット2は難所のできた感（ほめ）を優先して2択にしました。この使い分けでよいですか。"}, {"type": "check", "uid": "u_bio_02", "id": "u_bio_02-確認3", "textHtml": "<b>裸子植物の確認をセット2 Q3（2択・マツに実ができない）で機能ロジックに組み込みました</b>。裸子植物を「マツはどの仲間か→裸子植物」型の既存4択（quiz-engine.js に実在・入門）で別に問う形のほうがよければ差し替えます。どちらが好みですか。"}, {"type": "check", "uid": "u_bio_02", "id": "u_bio_02-確認4", "textHtml": "<b>図版4枚の作り方（付録）</b>: card_flower_parts / card_ovary_to_fruit / card_naked_seed は matplotlib 自作（位置・対応が意味を持つため）、p_flower_fruit は実物イメージなので AI 生成（Sol）を予定しています。P1/P2 のサクラ→サクランボは実物イメージのままでよいですか（オーナー実写に差し替えも可）。 ---"}, {"type": "unit", "uid": "u_bio_03", "name": "葉・根のつくり、種子をつくらない植物", "n": 11, "nc": 3}, {"type": "card", "uid": "u_bio_03", "id": "u_bio_03-R", "title": "レディネスチェック", "meta": "", "screenHtml": "<div class=\"li\">- 【03-R1】[既存・入門] 花のつくりを外側から順に正しく並べたものはどれか。 → <b>がく→花弁→おしべ→めしべ</b>（選: めしべ→おしべ→花弁→がく／花弁→がく→おしべ→めしべ／がく→花弁→おしべ→めしべ／おしべ→めしべ→花弁→がく）</div>\n<div class=\"li\">- 【03-R2】[既存・入門] 受粉したあと、成長して果実になる部分はどれか。 → <b>子房</b>（選: やく／柱頭／花弁／子房）</div>\n<div class=\"li\">- 【03-R3】[既存・入門] 受粉したあと、成長して種子になる部分はどれか。 → <b>胚珠</b>（選: 胚珠／子房／がく／やく）</div>\n<div class=\"q\">つまずいたときの誘いコピー（弱点表示ではなく招待状のトーン・憲法第2.5条・2.6条）:</div>\n<div class=\"q\">「<b>花のつくりを見なおしておくと、このあとの「種子をつくらない植物」の話がくっきりするよ</b>」→ 該当の教えるカードへのボタンがそっと光る</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_03", "id": "03-P1", "title": "予想（Predict）", "meta": "どれを選んでも正誤なし・「なるほど」で次へ ※図: cimg/u_bio_03/p1_moss_fern.png（ジメジメした所に生えるコケとシダの場面イメージ・答えは写さない）", "screenHtml": "<div class=\"q\">タンポポやサクラは、種子（たね）で仲間をふやす。</div>\n<div class=\"q\">じゃあ、ジメジメした所に生えるコケや、シダには、種子ってあると思う？</div>\n<div class=\"q\">「ある」／「ない」／「花はさくけど種子はない」</div>", "ctxHtml": "<div class=\"q\"></div>"}, {"type": "card", "uid": "u_bio_03", "id": "03-P2", "title": "おどろき（Observe）", "meta": "図: cimg/u_bio_03/p2_spore_sori.png（シダの葉の裏についた粒々＝胞子のうの拡大イメージだけ。しくみの説明・ラベルは載せない）", "screenHtml": "<div class=\"q\">コケにもシダにも、種子はないんだ。花もさかない。</div>\n<div class=\"q\">かわりに、シダの葉の裏を見ると、こまかい粉のような小さなつぶがびっしりついている。</div>\n<div class=\"q\">このつぶをまき散らして、コケやシダは仲間をふやしている。</div>\n<div class=\"q\">種子がなくても、ちゃんとふえる、別のやり方を持っているんだ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_03", "id": "03-P3", "title": "たね明かし（Explain）", "meta": "", "screenHtml": "<div class=\"q\">この、粉のような小さなつぶを<b>胞子（ほうし）</b>という。</div>\n<div class=\"q\">植物には、種子で仲間をふやす仲間（<b>種子植物</b>）と、種子をつくらず胞子でふえる仲間（シダ・コケ）がいる。</div>\n<div class=\"q\">シダ・コケは、花もさかず、種子もつくらない。かわりに胞子でふえる。</div>\n<div class=\"q\">このユニットでは、まず葉と根のつくりを見て、そのあと、この「種子をつくらない植物」を見にいくよ。</div>", "ctxHtml": "<div class=\"li\">---</div>"}, {"type": "card", "uid": "u_bio_03", "id": "03-T1", "title": "葉のつくり——葉脈と気孔", "meta": "（種別: 概念／図: card_leaf.png 新規・カードサイズ＝葉に通るすじ（葉脈）と、葉の裏の小さな穴（気孔）の位置だけ・印なし）", "screenHtml": "<div class=\"q\">葉をよく見ると、すじがたくさん通っている。</div>\n<div class=\"q\">このすじを<b>葉脈（ようみゃく）</b>という。中に、水や養分の通り道が通っているんだ。</div>\n<div class=\"q\">それから、葉の裏には、目に見えないくらい小さな穴がたくさんあいている。</div>\n<div class=\"q\">この穴を<b>気孔（きこう）</b>という。ここから、水蒸気や気体が出入りするんだ。気孔は、葉の表より<b>裏に多い</b>。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_03", "id": "03-T2", "title": "根のつくり——根毛と、2つのタイプ", "meta": "（種別: 概念／図: card_root.png 新規・カードサイズ＝根の先の細い毛（根毛）と、根の形が2タイプあることだけ・印なし・分類名は書かない）", "screenHtml": "<div class=\"q\">根の先を虫めがねで見ると、細い毛がたくさん生えている。</div>\n<div class=\"q\">この毛を<b>根毛（こんもう）</b>という。根毛が土のすき間に入りこんで、水を吸っているんだ。</div>\n<div class=\"q\">毛がたくさんあるぶん、土とふれる面が広くなって、水を吸いやすい。</div>\n<div class=\"q\">それから、根の形をくらべると、大きく2つのタイプがある。太い1本の根から細い根が出るタイプと、細い根が同じくらいの太さでたくさん広がるタイプ。この2タイプの名前と見分け方は、つぎに植物を仲間分けするときにくわしくやるよ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_03", "id": "03-Q1", "title": "確認クイズ・セット1（葉・根のつくりの節目・4択の類題3問）", "meta": "", "screenHtml": "<div class=\"li\">- Q1 [既存・入門] 葉に見られる、すじのように通っている維管束の通り道を何というか。 → <b>葉脈</b>（選: 根毛／子房／葉脈／気孔）</div>\n<div class=\"li\">- Q2 [新規] 根の先にたくさん生えていて、水を吸うのに役立つ細い毛を何というか。 → <b>根毛</b>（選: 根毛／葉脈／気孔／子房）</div>\n<div class=\"li\">- Q3 [新規] 葉の裏に多くあって、水蒸気や気体が出入りする小さな穴を何というか。 → <b>気孔</b>（選: 気孔／根毛／葉脈／胚珠）</div>", "ctxHtml": "<div class=\"li\">※3問とも「葉・根のつくりの名前を選び分ける」同型・同難度（入門）でそろえた類題セット。似たつくりの名前の中から正しいものを選ぶのが本題なので4択のまま（憲法4.7条の例外＝内容が選び分けを要求する時。u_bio_08【08-Q1】と同じ判断）。</div>\n<div class=\"li\">※設計メモ: Q1は既存プール（bio_plant・junior・行169）を原文どおり引用。Q2（根毛）・Q3（気孔）は既存に同難度・同形式の入門4択がそろわず（根毛の既存は行180＝mid、気孔の既存は行164＝選択肢に説明つき/なしが混じり第4.6条の「異質な選択肢」に触れる）、Q1と同じ「◯◯を何というか」の単語えらび4択で[新規]をそろえた（第4.2条）。選択肢は葉脈・根毛・気孔・子房・胚珠という同じつくり語のプールから引き、品詞・長さをそろえた（第4.6条）。答えの並びは葉脈・根毛・気孔でカンの偏りを避けた。</div>\n<div class=\"li\">---</div>"}, {"type": "card", "uid": "u_bio_03", "id": "03-T3", "title": "種子をつくらない植物——シダとコケ", "meta": "（種別: 概念／図なし・P1/P2で実物は見せた）", "screenHtml": "<div class=\"q\">ここからが、このユニットの本題。</div>\n<div class=\"q\">世の中の植物が、ぜんぶ種子で仲間をふやすわけじゃない。</div>\n<div class=\"q\">シダ（イヌワラビなど）やコケ（ゼニゴケなど）は、<b>花もさかず、種子もつくらない</b>。</div>\n<div class=\"q\">タンポポやサクラのように、めしべ・おしべ・子房・胚珠があって種子ができる——そういうつくりを、そもそも持っていないんだ。</div>\n<div class=\"q\">じゃあ、種子がないのに、どうやって仲間をふやしているんだろう。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_03", "id": "03-T4", "title": "かわりに胞子でふえる", "meta": "（種別: 概念／図: card_spore_plant.png 新規・カードサイズ＝シダの胞子のうから胞子がとび出す流れ・コケの胞子のうも並べる・花粉や種子とは分けて描く・印なし）", "screenHtml": "<div class=\"q\">答えが、導入で見た<b>胞子（ほうし）</b>。</div>\n<div class=\"q\">シダは、葉の裏にある<b>胞子のう</b>という小さなふくろの中で胞子をつくる。ふくろがはじけて、胞子が飛び散る。</div>\n<div class=\"q\">コケも、細い柄の先にある胞子のうから胞子をとばす。</div>\n<div class=\"q\">飛んだ胞子が、しめった地面に落ちて育つと、また新しいシダやコケになる。</div>\n<div class=\"q\">種子植物は種子で、シダ・コケは胞子で——<b>ふえ方がちがう</b>、というのが、植物の仲間を見分ける大事な目じるしになるんだ。</div>\n<details class=\"col\"><summary>胞子ってどんなつぶ？</summary><div class=\"colbody\"><div class=\"q\">胞子は、種子よりずっと小さくて軽い。目に見えないくらいの粉のようなつぶで、風にのって遠くまで飛んでいく。</div>\n<div class=\"q\">種子には、芽が出るときの養分（お弁当のような部分）が入っているけれど、胞子にはそれがない。そのぶん、たくさんつくって、たくさん飛ばす作戦なんだ。</div></div></details>", "ctxHtml": "<div class=\"q\"></div>"}, {"type": "card", "uid": "u_bio_03", "id": "03-Q2", "title": "確認クイズ・セット2（種子をつくらない植物・胞子の節目・4択の類題3問）", "meta": "", "screenHtml": "<div class=\"li\">- Q1 [既存・入門] 次のうち、種子をつくらず胞子でふえる植物はどれか。 → <b>イヌワラビ</b>（選: イヌワラビ／エンドウ／イチョウ／アブラナ）</div>\n<div class=\"li\">- Q2 [新規] 次のうち、種子をつくらず胞子でふえる植物はどれか。 → <b>ゼニゴケ</b>（選: ゼニゴケ／サクラ／マツ／タンポポ）</div>\n<div class=\"li\">- Q3 [新規] シダやコケが、種子のかわりに、まき散らして仲間をふやすつぶを何というか。 → <b>胞子</b>（選: 胞子／種子／花粉／果実）</div>", "ctxHtml": "<div class=\"li\">※3問とも「種子をつくらず胞子でふえる植物・胞子」を問う同型・同難度（入門）の類題セット。</div>\n<div class=\"li\">※設計メモ: Q1は既存プール（bio_plant・junior・行159）を原文どおり引用（シダの例＝イヌワラビ）。Q2は同型の[新規]（コケの例＝ゼニゴケ／まちがいの選択肢はすべて種子植物にそろえた）。Q3は胞子（T4の核心の語）の単語えらび4択で、選択肢を胞子・種子・花粉・果実というふえ方に関わる語でそろえた。3問とも「種子をつくらず胞子でふえる」という同じ1つの概念を、植物さがし2問＋語の確認1問で問う入門4択（第4.2条）。答えの並びはイヌワラビ・ゼニゴケ・胞子でカンの偏りを避けた。</div>\n<div class=\"li\">---</div>"}, {"type": "card", "uid": "u_bio_03", "id": "03-T5", "title": "シダとコケのちがい——体のつくりで見分ける", "meta": "（種別: 概念／図: card_fern_moss_compare.png 新規・カードサイズ＝シダ（根・茎・葉の区別あり）とコケ（区別なし・仮根）の対比・印なし）", "screenHtml": "<div class=\"q\">同じ「胞子でふえる仲間」でも、シダとコケは体のつくりがちがう。</div>\n<div class=\"q\">シダには、<b>根・茎・葉のはっきりした区別がある</b>。水や養分の通り道（維管束）も通っていて、けっこう植物らしい形をしている。</div>\n<div class=\"q\">いっぽうコケには、根・茎・葉の区別がない。根のように見える部分（仮根）はあるけれど、これはおもに体を地面にとめておくためのもの。水は、体の表面全体からしみこませて取り入れているんだ。</div>\n<div class=\"q\">ふえ方（胞子）は同じでも、体のつくりを見ると、シダとコケは見分けられる。これが、種子をつくらない植物の中の分かれ道だよ。</div>\n<details class=\"col\"><summary>もっと先の世界を見る</summary><div class=\"colbody\"><div class=\"q\">コケやシダのなかまは、じつは大むかしから地上にいる、とても古い植物。</div>\n<div class=\"q\">まだ地上に花も種子もなかったころ、いちばん先に陸に広がったのが、コケやシダの祖先だった。大きなシダが森をつくっていた時代もある。その森がうもれてできたのが、いまの石炭のもと。</div>\n<div class=\"q\">種子や花をつける植物が広がるのは、それよりずっとあとの話。植物がどう移りかわってきたかは、高校や、その先で待っているよ。</div></div></details>", "ctxHtml": "<div class=\"q\"></div>\n<div class=\"li\">---</div>"}, {"type": "check", "uid": "u_bio_03", "id": "u_bio_03-確認1", "textHtml": "<b>確認クイズ・セット1を4択にした判断</b>: 葉脈/根毛/気孔など、似たつくりの名前を選び分けるのが本題なので、u_bio_08【08-Q1】と同じく4択のままにしました（憲法4.7条は「既定2択・選び分けを要求する時だけ4択」）。ここは2択より4択が合っている、という判断でよいですか？"}, {"type": "check", "uid": "u_bio_03", "id": "u_bio_03-確認2", "textHtml": "<b>根の2タイプの名前を出さないこと</b>: T2で「根に2タイプの形がある」ことだけ地ならしし、主根・側根・ひげ根の名前は次の u_bio_04（分類）に回しました（カーネルnotes準拠）。この線引きでよいですか？"}, {"type": "check", "uid": "u_bio_03", "id": "u_bio_03-確認3", "textHtml": "<b>図版6枚</b>（cimg 2枚＝実物イメージ・matplotlib 4枚＝つくりの模式図）: この構成で作ってよいですか。とくに P2 の「シダの葉の裏の胞子のう」の実物イメージ（Sol生成）は、理科的に正しく見えるかを画像入りタップシートで最終確認いただきたいです。 ---"}, {"type": "unit", "uid": "u_bio_04", "name": "植物の分類表をつくる", "n": 11, "nc": 3}, {"type": "card", "uid": "u_bio_04", "id": "u_bio_04-R", "title": "レディネスチェック", "meta": "", "screenHtml": "<div class=\"li\">- 【04-R1】[既存・elementary] 芽ばえで最初に開く葉は？ → <b>子葉</b>（選: 花びら／本葉／子葉／実）</div>\n<div class=\"li\">- 【04-R2】[既存・入門] 受粉したあと、成長して種子になる部分はどれか。 → <b>胚珠</b>（選: 胚珠／子房／がく／やく）</div>\n<div class=\"li\">- 【04-R3】[既存・入門] コケ植物について正しい説明はどれか。 → <b>根・茎・葉の区別がはっきりしない</b>（選: 維管束が発達している／根・茎・葉の区別がはっきりしない／種子でふえる／花を咲かせる）</div>\n<div class=\"q\">つまずいたときの誘いコピー（弱点表示ではなく招待状のトーン・憲法第2.5条・2.6条＝楽アピールで誘わない）:</div>\n<div class=\"q\">「<b>子葉や種子のでき方を見なおしておくと、このあとの仕分けの話がつながりやすくなるよ</b>」→ 該当の教えるカードへのボタンがそっと光る</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_04", "id": "04-P1", "title": "予想（Predict）", "meta": "どれを選んでも正誤なし・「なるほど」で次へ／図: cimg/u_bio_04/p_ine_himawari.png（新規AI生成・イネとヒマワリを並べた実物イメージ・分類名や答えは入れない）", "screenHtml": "<div class=\"q\">田んぼのイネと、庭のヒマワリ。同じ植物なのに、葉のすじの形も、根の形もずいぶんちがう。</div>\n<div class=\"q\">この2つ、どこを見れば、スパッと別のなかまに分けられると思う？</div>\n<div class=\"q\">「葉のすじ（葉脈）の形」／「花の大きさや色」／「せの高さ」</div>", "ctxHtml": "<div class=\"q\"></div>"}, {"type": "card", "uid": "u_bio_04", "id": "04-P2", "title": "おどろき（Observe）", "meta": "", "screenHtml": "<div class=\"q\">じつは、いちばんの決め手は——芽が出たときの最初の葉（子葉）の枚数。</div>\n<div class=\"q\">子葉が1枚ならイネのなかま、2枚ならヒマワリのなかま。</div>\n<div class=\"q\">そして、この子葉の枚数が決まると、ほかの見分けポイントもいっしょに決まる。子葉が1枚のなかまは、葉のすじが平行で、根はひげ根。2枚のなかまは、葉のすじが網目で、根は太い1本と細い枝。<b>ぜんぶセットで決まる</b>んだ。1か所見れば、残りも読める。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_04", "id": "04-P3", "title": "たね明かし（Explain）", "meta": "", "screenHtml": "<div class=\"q\">葉のすじで分けても、花で分けても、まちがいじゃない。どれも、いい見方。</div>\n<div class=\"q\">でも理科には、みんなが同じように使える分け方がある。それが <b>「YES か NO かの線を1本ずつ引いて、表にする」</b> やり方。</div>\n<div class=\"q\">種子でふえる／ふえない。子房がある／ない。子葉が1枚／2枚。</div>\n<div class=\"q\">線を引いていくと、それぞれの枝に見分けポイントがセットでくっついてくる。分類は覚えるより、線を引いて仕分けるんだ。今回は、その表をいっしょに作っていくよ。</div>", "ctxHtml": "<div class=\"li\">---</div>"}, {"type": "card", "uid": "u_bio_04", "id": "04-T1", "title": "分類は「YES/NO の線を1本ずつ引く」", "meta": "（種別: 概念・メタ構造の先渡し／図: card_dichotomy_method.png 新規matplotlib・たくさんの植物に線を1本引いて2グループに分ける模式・具体の分類名は入れない・印なし）", "screenHtml": "<div class=\"q\">たくさんの植物を、いきなり全部おぼえようとすると、こんがらがる。</div>\n<div class=\"q\">そこで、こう考える。まず1本の線を引いて、大きく2つに分ける。次に、分けた片方にまた線を引いて2つに分ける。これをくり返すと、植物が枝分かれの表になる。</div>\n<div class=\"q\">この「線を1本ずつ引いて仕分ける」やり方は、火成岩を表にしたときと同じ。1本の線では「ある／ない」「1枚／2枚」のように、YES か NO かで分かれる問いを使う。</div>\n<div class=\"q\">つぎのカードから、その線を1本ずつ引いていくよ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_04", "id": "04-T2", "title": "1本目の線——種子でふえる？ ふえない？", "meta": "（種別: 概念・1軸=1本目の線／図: card_seed_line.png 新規matplotlib・種子でふえるグループ（花をつける代表）と胞子でふえるグループ（シダ・コケの代表）を1本の線で分けた模式・印なし）", "screenHtml": "<div class=\"q\">いちばん最初に引く線は、<b>種子でふえる／ふえない</b>。</div>\n<div class=\"q\">花をさかせて種子をつくってふえる植物を <b>種子植物</b> という。アブラナやマツのなかまだ。</div>\n<div class=\"q\">一方、種子をつくらず、胞子でふえるのがシダ植物とコケ植物。前に習ったとおり、花も種子もつくらないなかまだね。</div>\n<div class=\"q\">だから1本目の線は「種子をつくるか、胞子か」。ここで種子植物と、シダ・コケが分かれる。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_04", "id": "04-T3", "title": "2本目の線——子房がある？ ない？（被子・裸子）", "meta": "（種別: 概念・1軸=2本目の線／図: card_shibou_line.png 新規matplotlib・子房に包まれた胚珠（被子）とむき出しの胚珠（裸子）の模式・印なし）", "screenHtml": "<div class=\"q\">つぎは、種子植物のグループにもう1本、線を引く。決め手は <b>子房があるか、ないか</b>。</div>\n<div class=\"q\">花のめしべの根もとのふくらみが子房で、その中に胚珠が入っている。胚珠が子房に包まれているなかまを <b>被子植物</b> という。アブラナやサクラ、タンポポがそれ。</div>\n<div class=\"q\">いっぽう、子房がなくて、胚珠がむき出しでついているなかまを <b>裸子植物</b> という。マツやイチョウがなかまだ。「裸」は、はだかという意味。胚珠がはだかでついているんだね。</div>\n<div class=\"q\">だから2本目の線は「子房に包まれているか、むき出しか」。ここで被子植物と裸子植物が分かれる。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_04", "id": "04-Q1", "title": "確認クイズ・セット1（種子・被子/裸子の線引きの節目・3問の類題・すべて既存流用・4択）", "meta": "", "screenHtml": "<div class=\"li\">- Q1 [既存・入門] 次のうち、種子をつくらず胞子でふえる植物はどれか。 → <b>イヌワラビ</b>（選: イヌワラビ／エンドウ／イチョウ／アブラナ）</div>\n<div class=\"li\">- Q2 [既存・入門] マツはどの植物の仲間か？ → <b>裸子植物</b>（選: シダ植物／コケ植物／裸子植物／被子植物）</div>\n<div class=\"li\">- Q3 [既存・入門] 裸子植物の例として正しいものはどれか。 → <b>マツ</b>（選: ツツジ／マツ／アブラナ／タンポポ）</div>", "ctxHtml": "<div class=\"li\">※3問とも「大きなグループへの仕分け（種子植物か胞子か・被子か裸子か）」を問う同型・同難度（入門）でそろえた類題セット。この節目はいくつかのグループから選び分けるのが本題なので4択のまま（憲法4.7条の例外＝内容が選び分けを要求する時）。</div>"}, {"type": "card", "uid": "u_bio_04", "id": "04-T4", "title": "3本目の線——子葉が1枚？ 2枚？（単子葉・双子葉）", "meta": "（種別: 概念・1軸=3本目の線／図: card_mono_di_compare.png 新規matplotlib・単子葉/双子葉の子葉・葉脈・根の形・花弁のセット対比表・印なし）", "screenHtml": "<div class=\"q\">最後にもう1本。被子植物のグループに線を引く。決め手は <b>子葉が1枚か、2枚か</b>。</div>\n<div class=\"q\">子葉が1枚のなかまを <b>単子葉類</b>、2枚のなかまを <b>双子葉類</b> という。イネやトウモロコシは単子葉類、ヒマワリやアブラナは双子葉類だ。</div>\n<div class=\"q\">ここがこのユニットのいちばんおもしろいところ。子葉の枚数が決まると、ほかの見分けポイントも <b>セットでついてくる</b>。</div>\n<div class=\"q\">・単子葉類（子葉1枚）＝葉のすじは平行（平行脈）・根はひげ根</div>\n<div class=\"q\">・双子葉類（子葉2枚）＝葉のすじは網目（網状脈）・根は太い主根と細い側根</div>\n<div class=\"q\">だから、どれか1つ見れば、残りも読める。バラバラに覚えなくていいんだ。</div>\n<details class=\"col\"><summary>根のちがい、もっと見る？</summary><div class=\"colbody\"><div class=\"q\">ひげ根は、太い根がなく、細い根が同じくらいの太さでたくさん広がる根（イネなど単子葉類）。</div>\n<div class=\"q\">主根と側根は、真ん中に太い1本（主根）があって、そこから細い根（側根）が枝分かれする根（ヒマワリなど双子葉類）。</div>\n<div class=\"q\">このユニットで見分けに使うのは、この「根の形」まで。根や茎を輪切りにした断面の中で、水の管と養分の管がどこに並んでいるか——というつくりの中身は、また別のユニットでくわしくやるよ。</div></div></details>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_04", "id": "04-Q2", "title": "確認クイズ・セット2（単子葉・双子葉の見分けセットの節目・3問の類題・すべて既存流用・4択）", "meta": "", "screenHtml": "<div class=\"li\">- Q1 [既存・入門] ホウセンカのなかまのように、子葉が2枚の植物を何というか。 → <b>双子葉類</b>（選: 双子葉類／単子葉類／裸子植物／コケ植物）</div>\n<div class=\"li\">- Q2 [既存・入門] 細い根が多数広がる根は？ → <b>ひげ根</b>（選: 主根／側根／根毛／ひげ根）</div>\n<div class=\"li\">- Q3 [既存・入門] 双子葉類の葉に多く見られる、網の目のように広がった葉脈を何というか。 → <b>網状脈</b>（選: 平行脈／輪状脈／放射脈／網状脈）</div>", "ctxHtml": "<div class=\"li\">※3問とも【04-T4】で束ねた「子葉・根・葉脈のセットでの見分け」を問う同型・同難度（入門）の類題。子葉→根→葉脈と、セットの中の別々のポイントを1問ずつ確かめて、「1つ見れば残りも読める」を体で確かめる。この節目も見分けポイントの選び分けが本題なので4択のまま（憲法4.7条の例外）。</div>"}, {"type": "card", "uid": "u_bio_04", "id": "04-T5", "title": "表の完成——枝ごとに見分けポイントがそろう", "meta": "（種別: 達成の先出し／図: card_plant_dichotomy.png 新規matplotlib・完成した植物分類の樹形図＝種子でふえる/ふえない→子房ある/ない→子葉1枚/2枚、各枝に代表植物と見分けポイント・印なし）", "screenHtml": "<div class=\"q\">これで、線が3本引けた。植物の分類表が1枚に完成する。</div>\n<div class=\"q\">・1本目：種子でふえる（種子植物）／胞子でふえる（シダ・コケ）</div>\n<div class=\"q\">・2本目：（種子植物のうち）子房がある（被子植物）／ない（裸子植物）</div>\n<div class=\"q\">・3本目：（被子植物のうち）子葉1枚（単子葉類）／2枚（双子葉類）</div>\n<div class=\"q\">それぞれの枝に、葉脈・根・花弁の見分けポイントがセットでくっついている。</div>\n<div class=\"q\">植物の名前を1つ渡されても、「種子は？ 子房は？ 子葉は？」と線をたどれば、どのなかまか読める。表がひけて、なかまをたどれればOK。覚えるより、仕分けるんだ。</div>\n<details class=\"col\"><summary>もう1本、線を引ける？を見る</summary><div class=\"colbody\"><div class=\"q\">じつは双子葉類には、もう1本、線を引ける。花弁（花びら）のようす。</div>\n<div class=\"q\">タンポポやアサガオのように、花弁がたがいにくっついている花を <b>合弁花類</b>。アブラナやサクラのように、花弁が1枚ずつ離れている花を <b>離弁花類</b> という。</div>\n<div class=\"q\">線は、引こうと思えばまだまだ引ける。分類は、決め手を決めて線を引く——このやり方さえつかめば、新しいなかまが出てきても仕分けられるよ。</div></div></details>", "ctxHtml": "<div class=\"li\">---</div>"}, {"type": "check", "uid": "u_bio_04", "id": "u_bio_04-確認1", "textHtml": "<b>中1／中2の線引き（構造変更④・要最終チェック）</b>: このユニットでは、単子葉/双子葉の見分けを「子葉の枚数・葉脈の形・根の形（ひげ根／主根と側根）の名前」までで止め、<b>茎や根を輪切りにした断面での道管・師管の内外配置は中2 u_bio_08 に譲りました</b>（T4のコラムでも「断面の中身は別ユニット」と明言し、先渡ししていません）。この分担でよいでしょうか。「根の形の名前」を中1の見分けポイントとして出すことも問題ないでしょうか。"}, {"type": "check", "uid": "u_bio_04", "id": "u_bio_04-確認2", "textHtml": "<b>確認クイズを4択（既存流用）のままにした点</b>: 憲法4.7条は既定2択ですが、この単元は「いくつかのグループから選び分ける（種子/胞子・被子/裸子・単子葉/双子葉の見分け）」が本題なので、4.7条の例外（内容が選び分けを要求する時）として既存の入門4択をそのまま流用しました。2択に組み直す必要はないでしょうか。"}, {"type": "check", "uid": "u_bio_04", "id": "u_bio_04-確認3", "textHtml": "<b>合弁花類・離弁花類をコラム（T5・任意）に逃がした点</b>: 本線を「3本の線」に軽く保つため、双子葉類のさらに1本の線（花弁のくっつき）はコラムにしました。本線に入れず任意でよいでしょうか。 ---"}];
const KEY = "rika2_review_" + "\u751f\u7269B1 \u4e2d1\u690d\u7269(\u89b3\u5bdf/\u82b1/\u8449\u6839/\u5206\u985e)";
let res = {}; try{ res = JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){}
let pos = +(localStorage.getItem(KEY+"_pos")||0);
const tappable = ITEMS.filter(i=>i.type!=="unit").length;
function save(){ localStorage.setItem(KEY, JSON.stringify(res)); localStorage.setItem(KEY+"_pos", pos); }
function doneCount(){ return Object.keys(res).length; }
function header(){
  document.getElementById("hcount").textContent = doneCount()+" / "+tappable;
  document.getElementById("hbar").style.width = (100*doneCount()/tappable)+"%";
}
function go(d){ pos=Math.max(0,Math.min(ITEMS.length,pos+d)); save(); render(); window.scrollTo(0,0); }
function mark(id, verdict){
  const t=[...document.querySelectorAll(".tag.on")].map(x=>x.textContent);
  const note=(document.getElementById("note")||{}).value||"";
  res[id]={v:verdict,tags:t,note:note}; save(); go(1);
}
function render(){
  header();
  const st=document.getElementById("stage");
  if(pos>=ITEMS.length){ st.innerHTML=exportView(); return; }
  const it=ITEMS[pos];
  const nav='<div class="nav"><button onclick="go(-1)">← まえへ</button><button onclick="go(1)">とばす →</button></div>';
  if(it.type==="unit"){
    st.innerHTML='<div class="unitcard"><div class="uid">'+it.uid+'</div><div class="big">'+it.name+'</div>'+
    '<div class="summary">カード '+it.n+'枚 ＋ 確認 '+it.nc+'件。<br>読む→ピンとくれば ◎OK、引っかかれば ✏。<br>迷ったら ⏭あとで（いつでも戻れる）。</div>'+
    '<div class="btns"><button class="b-ok" onclick="go(1)">はじめる</button></div></div>'+nav;
    return;
  }
  const prev=res[it.id];
  const badge=prev?('<span style="color:var(--gold)">［回答済: '+prev.v+'］</span>'):'';
  if(it.type==="card"){
    st.innerHTML='<div class="card"><div class="uid">'+it.uid+'｜【'+it.id+'】'+badge+'</div>'+
    '<h2>'+it.title+'</h2><div class="meta">'+it.meta+'</div>'+ it.screenHtml +
    (it.ctxHtml?('<div class="ctx">'+it.ctxHtml+'</div>'):'')+
    '<div class="btns">'+
    '<button class="b-ok" onclick="mark(\''+it.id+'\',\'OK\')">◎ OK</button>'+
    '<button class="b-warn" onclick="openWarn()">✏ 気になる</button>'+
    '<button class="b-skip" onclick="mark(\''+it.id+'\',\'あとで\')">⏭</button></div>'+
    '<div class="tags" id="tags">'+
    ['ことばが大人','ことばが幼い','教室でこう言わない','理科的にあやしい','長い','その他']
      .map(t=>'<button class="tag" onclick="this.classList.toggle(\'on\')">'+t+'</button>').join('')+'</div>'+
    '<textarea id="note" placeholder="ひとこと（任意・1語でもOK）"></textarea>'+
    '<button class="send" id="send" onclick="mark(\''+it.id+'\',\'気になる\')">この内容で送る</button>'+nav;
  } else {
    st.innerHTML='<div class="card"><div class="uid">'+it.uid+'｜確認 '+badge+'</div>'+
    '<div class="q">'+it.textHtml+'</div>'+
    '<div class="btns">'+
    '<button class="b-yes" onclick="mark(\''+it.id+'\',\'はい\')">はい</button>'+
    '<button class="b-no" onclick="mark(\''+it.id+'\',\'いいえ\')">いいえ</button>'+
    '<button class="b-skip" onclick="mark(\''+it.id+'\',\'あとで\')">⏭</button></div>'+
    '<textarea id="note" class="open" placeholder="補足（任意）"></textarea>'+nav;
  }
}
function openWarn(){
  document.getElementById("tags").classList.add("open");
  document.getElementById("note").classList.add("open");
  document.getElementById("send").classList.add("open");
}
function exportView(){
  const out={sheet:"\u751f\u7269B1 \u4e2d1\u690d\u7269(\u89b3\u5bdf/\u82b1/\u8449\u6839/\u5206\u985e)",done:doneCount(),total:tappable,answers:res};
  const s=JSON.stringify(out,null,1);
  const warn=Object.entries(res).filter(([k,v])=>v.v==="気になる"||v.v==="いいえ").length;
  const esc=s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
  return '<div class="unitcard"><div class="big">おつかれさまでした 🎉</div>'+
  '<div class="summary">回答 '+doneCount()+'/'+tappable+'（✏気になる・いいえ: '+warn+'件）<br>'+
  '<b>下の枠の中身が結果のすべて</b>です。「📋 結果をコピー」→ Claudeに貼り付けで回収完了。<br>'+
  '<span style="color:var(--warn)">※このHTMLファイル自体には回答は保存されません（回答はこのブラウザの中）。必ずコピーか💾で外に出してください。</span></div>'+
  '<button class="exbtn" style="background:var(--gold);color:#241a03" onclick="navigator.clipboard.writeText(document.getElementById(\'exp\').value).then(()=>this.textContent=\'✓ コピーしました（Claudeに貼ってください）\')">📋 結果をコピー</button>'+
  '<button class="exbtn" style="background:#2a3245;color:#e8ecf5" onclick="dl()">💾 review_result.json で保存</button>'+
  '<textarea id="exp" class="open done" readonly>'+esc+'</textarea>'+
  '<div class="nav"><button onclick="go(-1)">← もどる</button><button onclick="pos=0;go(0)">最初から見直す</button></div></div>';
}
function dl(){
  const b=new Blob([document.getElementById("exp").value],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(b);
  a.download="review_result.json"; a.click();
}
render();
</script></body></html>
