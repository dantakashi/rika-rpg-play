<style>
:root{--bg:#12151c;--card:#1c2230;--ink:#e8ecf5;--sub:#9aa5b8;--gold:#e7b34c;--ok:#3dbb7c;--warn:#e0a83a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Yu Gothic UI","Hiragino Sans",system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}

.btns{display:flex;gap:8px;margin-top:14px}

.b-ok{background:var(--ok)}.b-warn{background:var(--warn);color:#241a03}.b-skip{background:#39415552}

.tags{display:none;margin-top:10px;gap:6px;flex-wrap:wrap}

textarea{width:100%;margin-top:8px;background:#101420;color:var(--ink);border:1px solid #2a3245;border-radius:8px;padding:10px;font-size:15px;min-height:64px;display:none}
textarea.open{display:block}
.send{display:none;margin-top:8px;width:100%;padding:12px;border:none;border-radius:12px;background:var(--gold);color:#241a03;font-weight:700;font-size:15px;cursor:pointer}
.send.open{display:block}

.exbtn{width:100%;padding:14px;border:none;border-radius:12px;font-weight:700;font-size:16px;margin-top:10px;cursor:pointer}
.summary{color:var(--sub);font-size:14px;line-height:1.9}
.col{margin:9px 0;border:1px dashed var(--gold);border-radius:10px;background:#1a2130;overflow:hidden}
.col>summary{list-style:none;cursor:pointer;padding:11px 13px;color:var(--gold);font-weight:700;font-size:14.5px}

  <div class="hrow"><span id="htitle">化学バッチ7 タップ検収（u_chem_01/03/04＝金属/白い粉/気体）</span><span id="hcount"></span></div>

<script>
const ITEMS = [{"type": "unit", "uid": "u_chem_01", "name": "ものの見分け方", "n": 11, "nc": 0}, {"type": "card", "uid": "u_chem_01", "id": "u_chem_01-R", "title": "レディネスチェック", "meta": "", "screenHtml": "<div class=\"li\">- 【01-R1】[新規] はじめて見るものを安全に調べるとき、最初にするならどちら？ → <b>見た目をよく見る</b>（選: 見た目をよく見る／なめてみる）</div>\n<div class=\"li\">- 【01-R2】[新規] 同じ色のものは、どれも同じ材料でできている。（○✕） → <b>✕</b></div>\n<div class=\"li\">- 【01-R3】[新規] 形がちがっても、同じ材料でできているものはある。（○✕） → <b>○</b></div>\n<div class=\"q\">つまずいたときの誘いコピー:</div>\n<div class=\"q\">「<b>ものを見るコツから始めると、5つの仕分けがもっとおもしろくなるよ</b>」</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_chem_01", "id": "01-P1", "title": "予想（Predict）", "meta": "どれを選んでも正誤なし・「なるほど」で次へ／図: cimg/u_chem_01/p1_five_items.png 生成予定", "screenHtml": "<div class=\"q\">ここに5つのものがある。</div>\n<div class=\"q\"><b>1円玉・木のわりばし・アルミホイル・ガラスのコップ・鉄くぎ。</b></div>\n<div class=\"q\">金属だと思うものを、金属の箱へ入れてみよう。</div>\n<div class=\"q\">分けたあとで、いちばん近い考えも選んでみて。</div>\n<div class=\"q\">「見た目で光っている」／「かたい」／「たたくと音がする」</div>", "ctxHtml": "<div class=\"q\"></div>"}, {"type": "card", "uid": "u_chem_01", "id": "01-P2", "title": "おどろき（Observe）", "meta": "図: cimg/u_chem_01/p2_shine_magnet.png 生成予定", "screenHtml": "<div class=\"q\">みがいたプラスチックは、ぴかっと光る。でも、金属ではない。</div>\n<div class=\"q\">銅やアルミニウムは金属。でも、ふつうの磁石にはつかない。</div>\n<div class=\"q\"><b>光るだけでも、磁石につくだけでも、金属とは決められない。</b></div>\n<div class=\"q\">では、何を調べれば見分けられるんだろう？</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_chem_01", "id": "01-P3", "title": "たね明かし（Explain）", "meta": "図: card_metal_four_properties.png 新規・印なし", "screenHtml": "<div class=\"q\">金属には、金属だけがぜんぶ持つ<b>4つの性質のセット</b>がある。</div>\n<div class=\"q\"><b>みがくと光る。電気を通す。熱をよく伝える。たたくとうすく広がる。</b></div>\n<div class=\"q\">1つだけで決めず、この4つがそろうかを調べる。</div>\n<div class=\"q\">これが、金属と非金属の見分け方だよ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_chem_01", "id": "01-T1", "title": "金属が持つ、4つの性質", "meta": "（種別: 概念／図: card_metal_four_properties.png 新規・4マス・印なし）", "screenHtml": "<div class=\"q\">金属が持つ4つの性質を、ひとつずつ見てみよう。</div>\n<div class=\"q\">① みがくと、金属らしい光り方をする。これを<b>金属光沢</b>という。</div>\n<div class=\"q\">② <b>電気を通す。</b>電気の通り道に使える。</div>\n<div class=\"q\">③ <b>熱をよく伝える。</b>一部を温めると、熱がほかの部分へ伝わりやすい。</div>\n<div class=\"q\">④ たたくと、割れずに<b>うすく広がる</b>。これを<b>展性（てんせい）</b>という。</div>\n<div class=\"q\">金属は、この4つをぜんぶ持っているんだ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_chem_01", "id": "01-T2", "title": "見た目と磁石だけでは決まらない", "meta": "（種別: 概念／図: cimg/u_chem_01/t2_magnet_samples.png 生成予定）", "screenHtml": "<div class=\"q\">光って見えるものでも、4つの性質がそろわないなら金属ではない。</div>\n<div class=\"q\">反対に、表面がくもっていても、みがくと金属光沢が出る金属もある。</div>\n<div class=\"q\">磁石につくのは、鉄など<b>一部の金属だけ</b>。銅やアルミニウムは金属でも磁石につかない。</div>\n<div class=\"q\">だから、<b>磁石につくことは、金属を見分ける条件ではない。</b></div>\n<div class=\"q\">見るのは、4つの性質がそろうかどうかだよ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_chem_01", "id": "01-T3", "title": "非金属は、4つの性質がそろわない", "meta": "（種別: 概念／図: card_metal_nonmetal_sort.png 新規・2グループ・印なし）", "screenHtml": "<div class=\"q\"><b>非金属</b>は、金属ではないもののなかま。</div>\n<div class=\"q\">木・ガラス・プラスチック・ゴムなどは、金属の4つの性質がぜんぶはそろわない。</div>\n<div class=\"q\">たとえば、ガラスは光って見えることがある。でも、たたくとうすく広がらず、割れてしまう。</div>\n<div class=\"q\">1つの見た目ではなく、性質のセットで見ると分けられるんだ。</div>\n<div class=\"q\">5つを分けると、金属は<b>1円玉・アルミホイル・鉄くぎ</b>。非金属は<b>木のわりばし・ガラスのコップ</b>になる。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_chem_01", "id": "01-Q1", "title": "確認クイズ・セット1（金属と非金属の見分けの節目・2択3問）", "meta": "", "screenHtml": "<div class=\"li\">- Q1 [新規] 銅には、金属光沢・電気を通す・熱をよく伝える・たたくとうすく広がる、という4つの性質がある。（○✕） → <b>○</b></div>\n<div class=\"li\">- Q2 [既存・入門] 問題文「金属はすべて磁石に引きつけられる。」（○✕） → <b>✕</b></div>\n<div class=\"li\">- Q3 [新規] 金属かどうかは、金属が持つ4つの性質がそろうかを調べて見分ける。（○✕） → <b>○</b></div>", "ctxHtml": "<div class=\"li\">※設計メモ: Q2はquiz-engine.js 1597行を原文どおり流用。既存851・852・1596行は入門4択、870・871行は基礎4択なので、2択・入門の同型3問には混ぜない。1597行を核に[新規]2問を足し、○✕○にした。最初に正しい4点セットを答え、Q2のあとには「磁石につくのは鉄など一部だけ」とすぐ表示する。</div>"}, {"type": "card", "uid": "u_chem_01", "id": "01-T4", "title": "有機物と無機物", "meta": "（種別: 概念／図: cimg/u_chem_01/t4_burn_samples.png 生成予定）", "screenHtml": "<div class=\"q\">ものの分け方には、もう1つある。今度は、燃やしたときに出るものを見る。</div>\n<div class=\"q\">炭素をふくみ、燃やすと二酸化炭素を出す物質を<b>有機物</b>という。砂糖やプラスチックがこのなかま。</div>\n<div class=\"q\"><b>有機物ではない物質を無機物</b>という。</div>\n<div class=\"q\">食塩・ガラス・金属は無機物のなかま。だから、<b>金属はすべて無機物</b>なんだ。</div>\n<div class=\"q\">実際に燃やして確かめるのは、先生といっしょに、換気できる場所で。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_chem_01", "id": "01-Q2", "title": "確認クイズ・セット2（有機物と無機物の節目・2択3問）", "meta": "", "screenHtml": "<div class=\"li\">- Q1 [新規] 砂糖は炭素をふくみ、燃やすと二酸化炭素を出す。砂糖はどちら？ → <b>有機物</b>（選: 有機物／無機物）</div>\n<div class=\"li\">- Q2 [新規] 鉄は、燃やしても二酸化炭素を出さない。鉄はどちら？ → <b>無機物</b>（選: 有機物／無機物）</div>\n<div class=\"li\">- Q3 [新規] プラスチックは炭素をふくみ、燃やすと二酸化炭素を出す。プラスチックはどちら？ → <b>有機物</b>（選: 有機物／無機物）</div>", "ctxHtml": "<div class=\"li\">※設計メモ: 既存849・850行は入門4択、872行は基礎4択で、2択・同難度の3問がそろわない。原文を変えて2択にせず、入門相当の[新規]を「燃やした結果から有機物か無機物かを選ぶ」同型でそろえた。答えは有機物・無機物・有機物で一方だけに寄せない。</div>"}, {"type": "card", "uid": "u_chem_01", "id": "01-T5", "title": "締め——見た目ではなく、性質を調べる", "meta": "（種別: 達成の先出し／図: card_metal_nonmetal_sort.png 再掲）", "screenHtml": "<div class=\"q\">5つのものを分けるカギは、見た目でも、磁石でもなかった。</div>\n<div class=\"q\">金属は、<b>金属光沢・電気を通す・熱をよく伝える・たたくとうすく広がる（展性）</b>の4つがそろう。</div>\n<div class=\"q\">非金属は、その4つがぜんぶはそろわない。金属は無機物のなかまでもある。</div>\n<div class=\"q\">ものの正体は、<b>性質を1つずつ調べて見分ける</b>。この見方は、ほかのものにも使えるよ。</div>\n<div class=\"q\">次は、見た目がそっくりなものを、別の性質で見分けにいく。</div>", "ctxHtml": ""}, {"type": "unit", "uid": "u_chem_03", "name": "白い粉の正体をさぐる", "n": 11, "nc": 2}, {"type": "card", "uid": "u_chem_03", "id": "u_chem_03-R", "title": "レディネスチェック", "meta": "", "screenHtml": "<div class=\"li\">- 【03-R1】[既存・入門] 鉄・銅・アルミニウムなど金属に共通する性質はどれ？ → <b>電気を通しやすい</b>（選: 熱を伝えにくい／電気を通しやすい／軽くて必ず水に浮く／磁石に必ずくっつく）（quiz-engine.js 851行）</div>\n<div class=\"li\">- 【03-R2】[既存・入門] 次のうち、金属ではないものはどれ？ → <b>炭素</b>（選: 鉄／銅／炭素／アルミニウム）（quiz-engine.js 852行）</div>\n<div class=\"li\">- 【03-R3】[既存・入門] 燃やすと二酸化炭素を出す、炭素をふくむ物質を何という？ → <b>有機物</b>（選: 金属／無機物／水溶液／有機物）（quiz-engine.js 849行）</div>\n<div class=\"q\">つまずいたときの誘いコピー:</div>\n<div class=\"q\">「<b>性質で見分ける話を見なおしておくと、白い粉の正体をしぼる道すじが見えやすくなるよ</b>」→ 前提ユニットの該当カードへのボタンがそっと光る</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_chem_03", "id": "03-P1", "title": "予想（Predict）", "meta": "どれを選んでも正誤なし・「なるほど」で次へ／図: cimg/u_chem_03/three_white_powders.png 生成予定", "screenHtml": "<div class=\"q\">目の前に、見た目がそっくりな白い粉が三つある。</div>\n<div class=\"q\">正体は、砂糖・食塩・かたくり粉。この見た目だけで、どれがどれか当てられると思う？</div>\n<div class=\"q\">「見ただけで当てられそう」／「さわればわかりそう」／「何かをして反応を見ないと決められなさそう」</div>", "ctxHtml": "<div class=\"q\"></div>"}, {"type": "card", "uid": "u_chem_03", "id": "03-P2", "title": "おどろき（Observe）", "meta": "図: card_white_powder_matrix.png（新規・反応マトリクスの結果を順に表示）", "screenHtml": "<div class=\"q\">見ただけでは、ほとんど区別できない。</div>\n<div class=\"q\">ところが、調べ方を変えると——結果が分かれた。</div>\n<div class=\"q\">水にとかす。加熱する。ヨウ素液をたらす。</div>\n<div class=\"q\">かたくり粉のデンプンは青むらさきに変わり、砂糖は熱すると、とけてから黒くこげる。食塩は熱してもほとんど変わらない。</div>\n<div class=\"q\">同じ白い粉なのに、どうして反応が分かれるんだろう？</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_chem_03", "id": "03-P3", "title": "たね明かし（Explain）", "meta": "図: card_white_powder_matrix.png（新規・三つの結果をまとめて表示）", "screenHtml": "<div class=\"q\">白い粉が同じに見えても、<b>性質は物質ごとに決まっている</b>。</div>\n<div class=\"q\">だから性質は、物質の<b>指紋</b>みたいに使える。</div>\n<div class=\"q\">一つの結果だけで決めず、水へのとけ方・熱したときの変化・薬品への反応を組み合わせる。</div>\n<div class=\"q\">そうすると、候補が少しずつしぼれて、白い粉の正体にたどりつけるんだ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_chem_03", "id": "03-T1", "title": "見た目が同じでも、性質はちがう", "meta": "（種別: 概念／図: cimg/u_chem_03/powder_closeup.png 生成予定）", "screenHtml": "<div class=\"q\">砂糖・食塩・かたくり粉は、どれも白い粉に見える。</div>\n<div class=\"q\">でも、物質がちがえば、水や熱、薬品に対する性質も変わる。</div>\n<div class=\"q\">見分ける手がかりは、見た目の外にもあるんだ。</div>\n<div class=\"q\"><b>性質は物質の指紋</b>。いくつかの性質を調べれば、正体をしぼれるよ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_chem_03", "id": "03-T2", "title": "調べ方その1——水にとかす", "meta": "（種別: 実験／図: cimg/u_chem_03/dissolving_test.png 生成予定）", "screenHtml": "<div class=\"q\">三つの粉を別々の水に入れ、同じようにかき混ぜる。</div>\n<div class=\"q\">砂糖と食塩は水にとける。かたくり粉は、水に入れてもとけず、白くにごる。</div>\n<div class=\"q\">「とけるか、とけないか」は、一つ目の手がかりになる。</div>\n<div class=\"q\">使う粉は少しだけ。口には入れずに調べよう。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_chem_03", "id": "03-T3", "title": "調べ方その2——加熱する", "meta": "（種別: 実験／図: cimg/u_chem_03/heating_sugar.png 生成予定）", "screenHtml": "<div class=\"q\">砂糖を熱すると、まずとける。さらに熱すると、黒くこげる。</div>\n<div class=\"q\">これは、砂糖が有機物だとわかる手がかりになる。食塩は同じように熱しても、ほとんど変わらない。</div>\n<div class=\"q\">かたくり粉も、強く熱すると黒くこげる。だから加熱だけで決めず、水へのとけ方やヨウ素液の結果も合わせて見る。</div>\n<div class=\"q\">加熱するときは少しだけ。試験管（しけんかん）の口を人のいない方へ向け、先生の指示にそって進めるよ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_chem_03", "id": "03-T4", "title": "調べ方その3——ヨウ素液でためす", "meta": "（種別: 実験／図: card_starch_iodine_teach.png 新規・教える用=印なし）", "screenHtml": "<div class=\"q\">かたくり粉にふくまれる<b>デンプン</b>にヨウ素液をたらすと、<b>青むらさき</b>に変わる。</div>\n<div class=\"q\">砂糖と食塩では、この色の変化は起きない。</div>\n<div class=\"q\">だから、青むらさきになった粉は、デンプンをふくむとわかるんだ。</div>\n<div class=\"q\">ヨウ素液も少しだけ使って、ゆっくり色を見よう。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_chem_03", "id": "03-Q1", "title": "確認クイズ・セット1（薬品・加熱での見分けの節目・入門4択の類題3問）", "meta": "", "screenHtml": "<div class=\"li\">- Q1 [新規] かたくり粉にヨウ素液をたらした。起こる変化はどれ？ → <b>青むらさきになる</b>（選: 黒くこげる／青むらさきになる／水にとけて透明になる／ほとんど変わらない）</div>\n<div class=\"li\">- Q2 [新規] 砂糖を加熱し続けた。起こる変化はどれ？ → <b>とけてから黒くこげる</b>（選: 青むらさきになる／ほとんど変わらない／とけてから黒くこげる／食塩のつぶになる）</div>\n<div class=\"li\">- Q3 [新規] 食塩にヨウ素液をたらした。起こる変化はどれ？ → <b>ほとんど変わらない</b>（選: ほとんど変わらない／青むらさきになる／黒くこげる／とけてあめ色になる）</div>", "ctxHtml": "<div class=\"li\">※設計メモ: 3問とも「白い粉に決まった調べ方をしたときの変化を選ぶ」入門4択の同型・同難度。[新規]はDB外の下書き。既存プールでは、行853が入門、行872・873が基礎で難度が割れ、真の類題3連にならない。4択例外は、似た薬品・反応の選び分けが本題だから。正答位置は2番・3番・1番に分散した。ヨウ素液の色は「青むらさき」で統一した。</div>"}, {"type": "card", "uid": "u_chem_03", "id": "03-Q2", "title": "確認クイズ・セット2（安全な調べ方の手順の節目・入門4択の類題3問）", "meta": "", "screenHtml": "<div class=\"li\">- Q1 [新規] 白い粉の正体を調べるとき、使う量として正しいのはどれ？ → <b>少量ずつ使う</b>（選: 少量ずつ使う／できるだけ多く使う／容器いっぱいに使う／量は決めなくてよい）</div>\n<div class=\"li\">- Q2 [新規] 粉を試験管に入れて加熱するとき、正しいのはどれ？ → <b>口を人のいない方へ向ける</b>（選: 口を自分に向ける／粉を試験管いっぱいに入れる／口を人のいない方へ向ける／のぞきこみながら熱する）</div>\n<div class=\"li\">- Q3 [新規] 白い粉の正体を調べるとき、してはいけないのはどれ？ → <b>口に入れて味をみる</b>（選: 見た目をよく見る／口に入れて味をみる／水にとかしてみる／ヨウ素液をたらす）</div>", "ctxHtml": "<div class=\"li\">※設計メモ: 3問とも「白い粉を安全に調べる手順」を問う入門4択の同型・同難度。<b>このユニットのT2〜T4で実際に示した安全行動（少量ずつ／加熱時の口の向き／味見しない）にそろえた真の類題</b>。正答位置は1番・3番・2番に分散。★もとSolは既存707（試験管の液体加熱）・708（におい）を流用したが、（a）707/708はカーネル上 <b>u_chem_05〔器具の使い方〕の指定問題</b>＝後続ユニットの先渡し・重複、（b）このユニットは「液体の加熱」「におい」を教えていない＝直前に教えた操作の類題になっていない、の2点（二次検収L5）で[新規]に全面差し替え。既存707/708は u_chem_05 側に温存。[新規]4問はDB外の下書き（新規歓迎の方針でDB追加候補）。</div>"}, {"type": "card", "uid": "u_chem_03", "id": "03-T5", "title": "締め——結果を組み合わせて、正体をしぼる", "meta": "（種別: まとめ／図: card_white_powder_matrix.png 新規・反応マトリクス）", "screenHtml": "<div class=\"q\">一つの調べ方だけで決めず、結果を組み合わせる。</div>\n<div class=\"q\">水にとけず、ヨウ素液で青むらさきになるなら、かたくり粉。</div>\n<div class=\"q\">水にとけ、加熱すると、とけてから黒くこげるなら、砂糖。水にとけ、加熱してもほとんど変わらないなら、食塩。</div>\n<div class=\"q\">見た目が同じでも、性質という指紋をいくつか集めれば、正体はしぼれる。</div>\n<div class=\"q\">次は、気体にもそれぞれの性質があることを使って、目に見えない気体の正体を見分けにいくよ。</div>", "ctxHtml": ""}, {"type": "check", "uid": "u_chem_03", "id": "u_chem_03-確認1", "textHtml": "【03-Q1】【03-Q2】はどちらも入門4択の[新規]×3（計6問）にしました（既存の実験安全問題は u_chem_05 と重複するため使わず、このユニットで教えた手順の類題に統一）。この[新規]6問の採用でよいか。"}, {"type": "check", "uid": "u_chem_03", "id": "u_chem_03-確認2", "textHtml": "カーネルの導入Oには「砂糖だけ加熱で黒くこげる」とありますが、かたくり粉のデンプンも強く加熱すると黒くこげます。本文T3に「かたくり粉も強く熱すると黒くこげる→加熱だけで決めず水・ヨウ素液も合わせる」を足し、決め手はヨウ素液に置きました（二次検収の素朴概念対策）。この扱いでよいか（東書の実験の流れと合うか現物確認をお願いします）。"}, {"type": "unit", "uid": "u_chem_04", "name": "気体を集めて見分ける", "n": 11, "nc": 1}, {"type": "card", "uid": "u_chem_04", "id": "u_chem_04-R", "title": "レディネスチェック", "meta": "", "screenHtml": "<div class=\"li\">- 【04-R1】[既存・入門] 鉄・銅・アルミニウムなど金属に共通する性質はどれ？ → <b>電気を通しやすい</b>（選: 熱を伝えにくい／電気を通しやすい／軽くて必ず水に浮く／磁石に必ずくっつく）〔quiz-engine.js 851行〕</div>\n<div class=\"li\">- 【04-R2】[既存・入門] 燃やすと二酸化炭素を出す、炭素をふくむ物質を何という？ → <b>有機物</b>（選: 金属／無機物／水溶液／有機物）〔quiz-engine.js 849行〕</div>\n<div class=\"li\">- 【04-R3】[既存・入門] 白い粉を区別するとき、最初に安全でない調べ方はどれ？ → <b>なめて味を調べる</b>（選: 見た目を見る／水に溶けるか調べる／加熱したときの変化を見る／なめて味を調べる）〔quiz-engine.js 853行〕</div>\n<div class=\"q\">つまずいたときの誘いコピー:</div>\n<div class=\"q\">「<b>物質の性質を見なおしておくと、目に見えない気体の正体もしぼりやすくなるよ</b>」→ 前提ユニットのカードへのボタンがそっと光る</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_chem_04", "id": "04-P1", "title": "予想（Predict）", "meta": "（図: `cimg/u_chem_04/p1_invisible_gas.png` 生成予定） ※どれを選んでも正誤なし・「なるほど」で次へ", "screenHtml": "<div class=\"q\">炭酸飲料を開けると、シュッと気体が出ていく。</div>\n<div class=\"q\">気体は目に見えないし、空気の中へ広がってしまう。</div>\n<div class=\"q\">実験で気体ができたら、どうやってびんの中に残せると思う？</div>\n<div class=\"q\">「空気にまざって集められない気がする」／「何かでびんにためられそう」／「水をうまく使えばいけそう」</div>", "ctxHtml": "<div class=\"q\"></div>"}, {"type": "card", "uid": "u_chem_04", "id": "04-P2", "title": "おどろき（Observe）", "meta": "（図: `cimg/u_chem_04/p2_gas_bottles.png` 生成予定・3つのびんだけを見せ、方法名は入れない）", "screenHtml": "<div class=\"q\">どの気体も同じ集め方、ではない。</div>\n<div class=\"q\">水の中で集める気体もあれば、上向きのびんや下向きのびんに集める気体もある。</div>\n<div class=\"q\">しかも、どれを使うかは<b>2つの手がかり</b>だけで決まる。</div>\n<div class=\"q\">その2つは、気体のどんな性質だろう？</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_chem_04", "id": "04-P3", "title": "たね明かし（Explain）", "meta": "（図: `card_gas_collection_map.png` 新規・matplotlib自作）", "screenHtml": "<div class=\"q\">手がかりは、<b>水にとけるか</b>と、<b>空気より重いか軽いか</b>。</div>\n<div class=\"q\">水にとけにくいなら、水の中で集める。</div>\n<div class=\"q\">水にとけやすいなら、空気より重いか軽いかで、びんの向きが決まる。</div>\n<div class=\"q\">集めたあとは、その気体だけが見せる反応で正体を見分ける。性質がわかれば、集め方も見分け方も決まるんだ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_chem_04", "id": "04-T1", "title": "手がかりは2つ——水と空気", "meta": "（種別: 概念／図: `card_gas_two_clues.png` 新規・matplotlib自作）", "screenHtml": "<div class=\"q\">気体の集め方を決めるときは、順番に2つを見る。</div>\n<div class=\"q\">① <b>水にとけにくいか、とけやすいか。</b></div>\n<div class=\"q\">② 水にとけやすいなら、<b>空気より重いか、軽いか。</b></div>\n<div class=\"q\">気体の名前から集め方を丸暗記するのではなく、この2つの性質から選べるんだ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_chem_04", "id": "04-T2", "title": "2つの手がかりから、3つの集め方へ", "meta": "（種別: 実験／図: `card_gas_collection_map.png`＋既存 `gas_gen`）", "screenHtml": "<div class=\"q\"><b>水にとけにくい</b> → 水と気体を入れかえる<b>水上置換法（すいじょうちかんほう）</b>。酸素や水素に使う。</div>\n<div class=\"q\"><b>水にとけやすく、空気より重い</b> → 気体を下にためる<b>下方置換法（かほうちかんほう）</b>。塩化水素に使う。</div>\n<div class=\"q\"><b>水にとけやすく、空気より軽い</b> → 気体を上にためる<b>上方置換法（じょうほうちかんほう）</b>。アンモニアに使う。</div>\n<div class=\"q\">二酸化炭素は、空気より重いので下方置換法で集められる。水にあまりとけないので、水上置換法でも集められるよ。</div>\n<div class=\"q\">まず水を見る。水が使えないときだけ空気との重さを見る。これが、3つの集め方を選ぶ流れだよ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_chem_04", "id": "04-Q1", "title": "確認クイズ・セット1（気体の集め方の節目・4択の類題3問）", "meta": "", "screenHtml": "<div class=\"li\">- Q1 [既存・基礎] 水に溶けにくい気体を集めるのに適した方法はどれか？ → <b>水上置換法</b>（選: 上方置換法／水上置換法／下方置換法／ろ過）〔quiz-engine.js 714行〕</div>\n<div class=\"li\">- Q2 [既存・基礎] アンモニアを集気びんに集めるときの正しい方法は？ → <b>上方置換法</b>（選: 下方置換法／水上置換法／上方置換法／蒸留）〔quiz-engine.js 715行〕</div>\n<div class=\"li\">- Q3 [既存・基礎] 塩化水素を集気びんに集めるときの正しい方法は？ → <b>下方置換法</b>（選: 下方置換法／上方置換法／水上置換法／再結晶）〔quiz-engine.js 716行〕</div>", "ctxHtml": "<div class=\"li\">※設計メモ: 3問ともexperiment・基礎の既存問題で、集め方を選ぶ同型。4択を使う理由は、3つの集め方の選び分けがこの節目の本題だから。正答位置は2番目・3番目・1番目。714〜716行を現物照合し、問題文・選択肢・括弧を原文どおり引用した。</div>"}, {"type": "card", "uid": "u_chem_04", "id": "04-T3", "title": "反応で見分ける——酸素と水素", "meta": "（種別: 実験／図: `card_gas_reactions.png` 新規・matplotlib自作）", "screenHtml": "<div class=\"q\">集めた気体は、色だけでは見分けにくい。そこで、その気体だけが見せる反応を使う。</div>\n<div class=\"q\"><b>酸素</b>の中に火のついた線香を入れると、線香が<b>激しく燃える</b>。</div>\n<div class=\"q\"><b>水素</b>に火を近づけると、<b>ポンと音を立てて燃える</b>。</div>\n<div class=\"q\">火を使う確かめ方は、先生の指示のもとで行う。水素は、はじめに出てくる気体をそのままためず、空気が混じらないようにしてから少量で確かめる。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_chem_04", "id": "04-T4", "title": "反応で見分ける——二酸化炭素とアンモニア", "meta": "（種別: 実験／図: `card_gas_reactions.png` 新規・matplotlib自作）", "screenHtml": "<div class=\"q\"><b>二酸化炭素</b>を石灰水に通すと、石灰水が<b>白くにごる</b>。</div>\n<div class=\"q\"><b>アンモニア</b>には刺激のあるにおいがあり、しめらせた赤色リトマス紙を<b>青色</b>に変える。</div>\n<div class=\"q\">気体のにおいを調べるときは、容器に顔を近づけない。先生の指示のもと、換気した場所で、手で少しずつあおいでかぐ。</div>\n<div class=\"q\">塩素やアンモニアなどを直接吸いこまないように、この方法で安全に確かめよう。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_chem_04", "id": "04-Q2", "title": "確認クイズ・セット2（気体の見分け方の節目・4択の類題3問）", "meta": "", "screenHtml": "<div class=\"li\">- Q1 [既存・入門] 酸素の性質として正しいものはどれか。 → <b>ものを燃やすはたらきがある</b>（選: 刺激臭がある／ものを燃やすはたらきがある／石灰水を白くにごらせる／空気より軽い）〔quiz-engine.js 778行〕</div>\n<div class=\"li\">- Q2 [既存・入門] 発生した気体を石灰水に通すと白くにごった。この気体はどれか。 → <b>二酸化炭素</b>（選: 水素／窒素／二酸化炭素／酸素）〔quiz-engine.js 779行〕</div>\n<div class=\"li\">- Q3 [既存・入門] 火を近づけるとポンと音を立てて燃える気体は、次のどれですか。 → <b>水素</b>（選: 水素／酸素／二酸化炭素／アンモニア）〔quiz-engine.js 780行〕</div>", "ctxHtml": "<div class=\"li\">※設計メモ: 3問ともexperiment・入門の既存問題で、反応や性質から気体を選ぶ同型。4種類から正体を見分けることが本題なので4択を使う。正答位置は2番目・3番目・1番目。778〜780行を現物照合し、原文どおり引用した。32行の○✕、717行と724行の発生方法も確認したが、形式と問う内容がそろわないため、このセットには混ぜていない。</div>"}, {"type": "card", "uid": "u_chem_04", "id": "04-T5", "title": "締め——性質から集め方も正体も決まる", "meta": "（種別: まとめ／図: `card_gas_collection_and_test.png` 新規・matplotlib自作）", "screenHtml": "<div class=\"q\">気体を集めるときは、<b>水にとけるか</b>を見る。水が使えないなら、<b>空気より重いか軽いか</b>を見る。</div>\n<div class=\"q\">気体を見分けるときは、線香、ポンという音、石灰水、においとリトマス紙のような、<b>その気体だけが見せる反応</b>を見る。</div>\n<div class=\"q\">集め方も見分け方も、おおもとは気体の性質。気体の名前と方法をばらばらにせず、2つの手がかりと反応から選べるようになった。</div>\n<div class=\"q\">次は、気体を発生させる器具や、量をはかる器具の使い方へ進むよ。</div>", "ctxHtml": ""}, {"type": "check", "uid": "u_chem_04", "id": "u_chem_04-確認1", "textHtml": "なし（既存図 `gas_gen` は `rika2/note_figures/gas_gen.png` に実在確認済み＝Claude一次で解決）。"}];
const KEY = "rika2_review_" + "\u5316\u5b66\u30d0\u30c3\u30c17 \u30bf\u30c3\u30d7\u691c\u53ce\uff08u_chem_01/03/04\uff1d\u91d1\u5c5e/\u767d\u3044\u7c89/\u6c17\u4f53\uff09";
let res = {}; try{ res = JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){}
let pos = +(localStorage.getItem(KEY+"_pos")||0);
const tappable = ITEMS.filter(i=>i.type!=="unit").length;
function save(){ localStorage.setItem(KEY, JSON.stringify(res)); localStorage.setItem(KEY+"_pos", pos); }
function doneCount(){ return Object.keys(res).length; }
function header(){
  document.getElementById("hcount").textContent = doneCount()+" / "+tappable;
  document.getElementById("hbar").style.width = (100*doneCount()/tappable)+"%";
}
function go(d){ pos=Math.max(0,Math.min(ITEMS.length,pos+d)); save(); render(); window.scrollTo(0,0); }
function mark(id, verdict){
  const t=[...document.querySelectorAll(".tag.on")].map(x=>x.textContent);
  const note=(document.getElementById("note")||{}).value||"";
  res[id]={v:verdict,tags:t,note:note}; save(); go(1);
}
function render(){
  header();
  const st=document.getElementById("stage");
  if(pos>=ITEMS.length){ st.innerHTML=exportView(); return; }
  const it=ITEMS[pos];
  const nav='<div class="nav"><button onclick="go(-1)">← まえへ</button><button onclick="go(1)">とばす →</button></div>';
  if(it.type==="unit"){
    st.innerHTML='<div class="unitcard"><div class="uid">'+it.uid+'</div><div class="big">'+it.name+'</div>'+
    '<div class="summary">カード '+it.n+'枚 ＋ 確認 '+it.nc+'件。<br>読む→ピンとくれば ◎OK、引っかかれば ✏。<br>迷ったら ⏭あとで（いつでも戻れる）。</div>'+
    '<div class="btns"><button class="b-ok" onclick="go(1)">はじめる</button></div></div>'+nav;
    return;
  }
  const prev=res[it.id];
  const badge=prev?('<span style="color:var(--gold)">［回答済: '+prev.v+'］</span>'):'';
  if(it.type==="card"){
    st.innerHTML='<div class="card"><div class="uid">'+it.uid+'｜【'+it.id+'】'+badge+'</div>'+
    '<h2>'+it.title+'</h2><div class="meta">'+it.meta+'</div>'+ it.screenHtml +
    (it.ctxHtml?('<div class="ctx">'+it.ctxHtml+'</div>'):'')+
    '<div class="btns">'+
    '<button class="b-ok" onclick="mark(\''+it.id+'\',\'OK\')">◎ OK</button>'+
    '<button class="b-warn" onclick="openWarn()">✏ 気になる</button>'+
    '<button class="b-skip" onclick="mark(\''+it.id+'\',\'あとで\')">⏭</button></div>'+
    '<div class="tags" id="tags">'+
    ['ことばが大人','ことばが幼い','教室でこう言わない','理科的にあやしい','長い','その他']
      .map(t=>'<button class="tag" onclick="this.classList.toggle(\'on\')">'+t+'</button>').join('')+'</div>'+
    '<textarea id="note" placeholder="ひとこと（任意・1語でもOK）"></textarea>'+
    '<button class="send" id="send" onclick="mark(\''+it.id+'\',\'気になる\')">この内容で送る</button>'+nav;
  } else {
    st.innerHTML='<div class="card"><div class="uid">'+it.uid+'｜確認 '+badge+'</div>'+
    '<div class="q">'+it.textHtml+'</div>'+
    '<div class="btns">'+
    '<button class="b-yes" onclick="mark(\''+it.id+'\',\'はい\')">はい</button>'+
    '<button class="b-no" onclick="mark(\''+it.id+'\',\'いいえ\')">いいえ</button>'+
    '<button class="b-skip" onclick="mark(\''+it.id+'\',\'あとで\')">⏭</button></div>'+
    '<textarea id="note" class="open" placeholder="補足（任意）"></textarea>'+nav;
  }
}
function openWarn(){
  document.getElementById("tags").classList.add("open");
  document.getElementById("note").classList.add("open");
  document.getElementById("send").classList.add("open");
}
function exportView(){
  const out={sheet:"\u5316\u5b66\u30d0\u30c3\u30c17 \u30bf\u30c3\u30d7\u691c\u53ce\uff08u_chem_01/03/04\uff1d\u91d1\u5c5e/\u767d\u3044\u7c89/\u6c17\u4f53\uff09",done:doneCount(),total:tappable,answers:res};
  const s=JSON.stringify(out,null,1);
  const warn=Object.entries(res).filter(([k,v])=>v.v==="気になる"||v.v==="いいえ").length;
  const esc=s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
  return '<div class="unitcard"><div class="big">おつかれさまでした 🎉</div>'+
  '<div class="summary">回答 '+doneCount()+'/'+tappable+'（✏気になる・いいえ: '+warn+'件）<br>'+
  '<b>下の枠の中身が結果のすべて</b>です。「📋 結果をコピー」→ Claudeに貼り付けで回収完了。<br>'+
  '<span style="color:var(--warn)">※このHTMLファイル自体には回答は保存されません（回答はこのブラウザの中）。必ずコピーか💾で外に出してください。</span></div>'+
  '<button class="exbtn" style="background:var(--gold);color:#241a03" onclick="navigator.clipboard.writeText(document.getElementById(\'exp\').value).then(()=>this.textContent=\'✓ コピーしました（Claudeに貼ってください）\')">📋 結果をコピー</button>'+
  '<button class="exbtn" style="background:#2a3245;color:#e8ecf5" onclick="dl()">💾 review_result.json で保存</button>'+
  '<textarea id="exp" class="open done" readonly>'+esc+'</textarea>'+
  '<div class="nav"><button onclick="go(-1)">← もどる</button><button onclick="pos=0;go(0)">最初から見直す</button></div></div>';
}
function dl(){
  const b=new Blob([document.getElementById("exp").value],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(b);
  a.download="review_result.json"; a.click();
}
render();
</script></body></html>
