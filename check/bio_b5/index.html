<script>
const ITEMS = [{"type": "unit", "uid": "u_bio_19", "name": "生物の多様性と進化 本文フル", "n": 12, "nc": 4}, {"type": "card", "uid": "u_bio_19", "id": "u_bio_19-R", "title": "レディネスチェック", "meta": "", "screenHtml": "<div class=\"li\">- 【19-R1】[既存・入門] 次のうち、背骨をもたない動物(無脊椎動物)はどれか。 → <b>こんちゅう</b>（選: こんちゅう／魚／カエル／ネコ）</div>\n<div class=\"li\">- 【19-R2】[既存・入門] 子は親と似たすがたで生まれ、乳で育てられる動物のなかまはどれか。 → <b>哺乳類</b>（選: 哺乳類／魚類／両生類／鳥類）</div>\n<div class=\"li\">- 【19-R3】[既存・入門] カエルは、子(オタマジャクシ)のときと親で、呼吸のしかたが変わる。（○✕） → <b>○</b></div>\n<div class=\"q\">つまずいたときの誘いコピー（弱点表示ではなく招待状のトーン・憲法第2.5条・2.6条）:</div>\n<div class=\"q\">「<b>セキツイ動物の5つのなかまを見なおしておくと、このあとの“現れた順”の話がつながりやすくなるよ</b>」→ 該当の教えるカードへのボタンがそっと光る</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_19", "id": "19-P1", "title": "予想（Predict）", "meta": "どれを選んでも正誤なし・「なるほど」で次へ　図: cimg/u_bio_19/p1_whale.png（AI・クジラが海を泳ぐ場面・ひれの中は見せない＝答えを先渡ししない）", "screenHtml": "<div class=\"q\">クジラは、生まれてから死ぬまで、ずっと海で泳いで暮らす。</div>\n<div class=\"q\">あの大きなひれの中の骨は、どんな形になっていると思う？</div>\n<div class=\"q\">「魚のヒレみたいな細い骨」／「骨は入っていない」／「ヒトの手みたいな指の骨」</div>", "ctxHtml": "<div class=\"q\"></div>"}, {"type": "card", "uid": "u_bio_19", "id": "19-P2", "title": "おどろき（Observe）", "meta": "図: card_homologous.png（新規・カードサイズ＝ヒトの腕・クジラのひれ・コウモリの翼を並べ、同じ骨を同じ色でぬり分けた比較図・印なし）", "screenHtml": "<div class=\"q\">レントゲンで中を見ると——クジラのひれには、ヒトの手とそっくりな「指の骨」がちゃんと並んでいる。</div>\n<div class=\"q\">泳ぐのに指はいらないのに、手と同じ骨組みが残っている。</div>\n<div class=\"q\">コウモリの翼にも、ヒトの腕にも、同じ骨組みが見つかる。</div>\n<div class=\"q\">まるで、もとは同じ骨組みを、海・空・陸それぞれの暮らし用に作り変えたみたいなんだ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_19", "id": "19-P3", "title": "たね明かし（Explain）", "meta": "", "screenHtml": "<div class=\"q\">見た目もはたらきもちがうのに、骨組みが共通しているつくりを<b>相同器官（そうどうきかん）</b>という。</div>\n<div class=\"q\">これは、同じ祖先から長い時間をかけて枝分かれし、それぞれの暮らしに合わせて体を変えてきた証拠。</div>\n<div class=\"q\">世代をかさねて、生き物のなかま（集団）が少しずつ変わっていくことを<b>進化</b>という。</div>\n<div class=\"q\">1匹が一生のあいだに変わるんじゃなく、代を重ねて集団が変わっていく。ここから、そのしくみを見ていくよ。</div>", "ctxHtml": "<div class=\"li\">---</div>"}, {"type": "card", "uid": "u_bio_19", "id": "19-T1", "title": "進化とは——代を重ねて集団が変わる", "meta": "（種別: 概念／図: card_evolution_generations.png 新規・カードサイズ＝1匹の矢印ではなく、何世代もの集団の帯が、世代を追うごとに少しずつ形を変えていく図・印なし）", "screenHtml": "<div class=\"q\">進化は、<b>1匹の生き物が一生のうちに姿を変えること</b>ではない。</div>\n<div class=\"q\">親から子、子から孫…と<b>世代をかさねるうちに、なかま（集団）全体が少しずつ変わっていく</b>こと。</div>\n<div class=\"q\">一世代ぶんの変化はほんのわずか。でも何万年、何百万年と積み重なると、ずいぶんちがう姿になる。</div>\n<div class=\"q\">だから、今生きている1匹をどれだけ見ても、進化そのものは見えない。長い時間の流れの中で起きることなんだ。</div>\n<details class=\"col\"><summary>なんで少しずつ変わるの？</summary><div class=\"colbody\"><div class=\"q\">世代をかさねると、なかまの中には少しずつちがう体をもつものが出てくる。</div>\n<div class=\"q\">その中で、暮らしている場所に合ったちがいをもつものが多く生き残り、子孫を残していく——という考え方がある。</div>\n<div class=\"q\">このしくみ（自然選択）は、高校の生物でくわしく習うよ。気になったら「自然選択」でさがしてみて。</div></div></details>", "ctxHtml": "<div class=\"q\"></div>"}, {"type": "card", "uid": "u_bio_19", "id": "19-T2", "title": "生物の歴史——水中から陸上へ", "meta": "（種別: 概念／図: card_vertebrate_order.png 新規・カードサイズ＝水→陸の帯の上に生き物を並べた図・T3と共用・印なし）", "screenHtml": "<div class=\"q\">生き物は、はじめから陸にいたわけではない。</div>\n<div class=\"q\">大昔、いちばん最初の生き物は<b>水中で生まれた</b>。</div>\n<div class=\"q\">そこから長い時間をかけて、体のつくりを変えながら、少しずつ<b>陸上へ広がっていった</b>。</div>\n<div class=\"q\">水の中だけだった世界から、陸の上でも暮らせるなかまが現れてきた——これが生き物の歴史の大きな流れだよ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_19", "id": "19-T3", "title": "セキツイ動物が現れた順", "meta": "（種別: 概念／図: card_vertebrate_order.png ＝水→陸の帯の上に、現れた順で5グループを並べる・印なし）", "screenHtml": "<div class=\"q\">背骨をもつなかま（セキツイ動物）も、この「水から陸へ」の流れにそって現れてきた。</div>\n<div class=\"q\">現れた順は——<b>魚類 → 両生類 → は虫類 → 鳥類・ほ乳類</b>。</div>\n<div class=\"q\">最初は水中でくらす<b>魚類</b>。次に、子は水中・親は陸上でくらす<b>両生類</b>。</div>\n<div class=\"q\">それから、陸上でも卵をうめる<b>は虫類</b>が現れ、さらに<b>鳥類・ほ乳類</b>へと続いていく。</div>\n<div class=\"q\">水中のなかまから、陸上のなかまへ。並び順が、そのまま水から陸への道すじになっているんだ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_19", "id": "19-Q1", "title": "確認クイズ・セット1（進化と生物の歴史の節目・3問の類題・すべて新規下書き・4択）", "meta": "", "screenHtml": "<div class=\"li\">- Q1 [新規] 「進化」の説明として正しいものはどれ？ → <b>世代をかさねて、生き物のなかま（集団）が少しずつ変わること</b>（選: 1匹の生き物が、一生のうちに姿を変えること／世代をかさねて、生き物のなかま（集団）が少しずつ変わること／まわりの色に合わせて、体の色をさっと変えること／死んだ生き物が、長い時間をかけて化石になること）</div>\n<div class=\"li\">- Q2 [新規] セキツイ動物が地球上に現れた順に、正しく並んでいるのはどれ？ → <b>魚類 → 両生類 → は虫類 → 鳥類・ほ乳類</b>（選: 魚類 → 両生類 → は虫類 → 鳥類・ほ乳類／鳥類・ほ乳類 → は虫類 → 両生類 → 魚類／両生類 → 魚類 → は虫類 → 鳥類・ほ乳類／は虫類 → 魚類 → 両生類 → 鳥類・ほ乳類）</div>\n<div class=\"li\">- Q3 [新規] 生き物がくらす場所は、長い歴史の中でどのように広がってきた？ → <b>はじめは水中で、やがて陸上へ広がった</b>（選: はじめは水中で、やがて陸上へ広がった／はじめは陸上で、やがて水中へ移った／はじめから、水中と陸上に同じくらいいた／はじめは空をとび、やがて水中へおりた）</div>", "ctxHtml": "<div class=\"li\">※T1〜T3のあと。3問とも「進化とは何か／現れた順／水から陸への流れ」を問う同型・同難度でそろえた類題セット。用語と順番の選び分けが本題なので4択（憲法4.7条の例外＝内容が選び分けを要求する時）。</div>\n<div class=\"li\">※設計メモ: 3問とも選択肢の形式をそろえた（Q1・Q3は「〜こと」「はじめは〜、やがて〜」の同形フレーズ、Q2は「〇類→〇類」の並び）＝異質な選択肢での消去法を封じる（憲法4.6条）。Q1の誤答「1匹が一生で姿を変える」は素朴概念そのもの＝T1で裏返した内容を選び分けさせて定着させる（教えた直後に“正しい組成の誤り版”を見せる4.3条には当たらない＝素朴概念は「正しく教えた事実」ではなく最初から誤りだから、対比に置ける）。練習プール genre＝bio_human に進化問が無いため新規（カーネル・オーナー確定）。※Q1「進化とは何か」は全DBにも近い問が無い（別genre bio_cell 行256は「進化」という語を答えさせる語句問で、本Q1の“定義の選び分け”とは設問型が異なる＝差別化できている）。</div>"}, {"type": "card", "uid": "u_bio_19", "id": "19-T4", "title": "進化の証拠①——相同器官", "meta": "（種別: 概念／図: card_homologous.png ＝P2と共用・ヒトの腕/クジラのひれ/コウモリの翼を同じ骨は同色でぬり分け・印なし）", "screenHtml": "<div class=\"q\">ヒトの腕、クジラのひれ、コウモリの翼。</div>\n<div class=\"q\">はたらきも見た目もぜんぜんちがうのに、中の<b>骨組みは共通</b>している。</div>\n<div class=\"q\">このように、見かけはちがっても骨組みがもとは同じつくりを<b>相同器官</b>という。</div>\n<div class=\"q\">なぜ共通なのか——<b>もとは同じ骨組みを、それぞれの暮らし（泳ぐ・飛ぶ・つかむ）に合わせて作り変えた跡</b>だから。</div>\n<div class=\"q\">同じもとの体を、海・空・陸用にリフォームしたあとが残っている。これが、<b>共通の祖先から枝分かれしてきた証拠</b>になるんだ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_19", "id": "19-T5", "title": "進化の証拠②——シソチョウ", "meta": "（種別: 概念／図: card_archaeopteryx.png 新規・カードサイズ＝シソチョウの体に、は虫類の特徴（歯・つめ・尾の骨）と鳥類の特徴（羽毛・つばさ）をラベルで対比・印なし）", "screenHtml": "<div class=\"q\">むかしの地層から見つかった化石に、<b>シソチョウ（始祖鳥）</b>がいる。</div>\n<div class=\"q\">このシソチョウ、<b>は虫類の特徴と鳥類の特徴の両方</b>をもっている。</div>\n<div class=\"q\">は虫類っぽいところ＝口に<b>歯</b>があり、つばさの先に<b>つめ</b>、長い<b>尾の骨</b>。</div>\n<div class=\"q\">鳥類っぽいところ＝体に<b>羽毛</b>があり、<b>つばさ</b>をもつ。</div>\n<div class=\"q\">今のなかまではきっちり分かれている2つのグループが、大昔はひとつながりだった——その途中をつなぐ姿が化石に残っていたんだ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_19", "id": "19-T6", "title": "多様性——枝分かれの結果、今のたくさんの種類がいる", "meta": "（種別: 達成の先出し／図: card_diversity_tree.png 新規・カードサイズ＝1つの共通の祖先から枝分かれして、今の多様な生き物につながる樹形図・印なし）", "screenHtml": "<div class=\"q\">ここまでをつなげると、1本の線が見えてくる。</div>\n<div class=\"q\">生き物は水中で生まれ、長い時間をかけて陸へ広がり、代を重ねて少しずつ変わってきた（進化）。</div>\n<div class=\"q\">その証拠が、骨組みの共通する相同器官と、途中をつなぐシソチョウ。</div>\n<div class=\"q\">そして、<b>進化で何度も枝分かれをくり返した結果</b>が、今の地球にいるたくさんの種類の生き物（多様性）なんだ。</div>\n<div class=\"q\">今いるいろんな生き物は、もとをたどれば枝分かれの先どうし。そう思って見ると、生き物のつながりが見えてくるよ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_19", "id": "19-Q2", "title": "確認クイズ・セット2（進化の証拠の節目・3問の類題・すべて新規下書き・4択）", "meta": "", "screenHtml": "<div class=\"li\">- Q1 [新規（※既存 bio_cell 行257とほぼ重複＝出どころ明記）] ヒトの腕・クジラのひれ・コウモリの翼のように、見た目やはたらきはちがうのに、骨組みが共通しているつくりを何という？ → <b>相同器官</b>（選: 相同器官／消化器官／生殖器官／感覚器官）</div>\n<div class=\"li\">- Q2 [新規] 相同器官があることは、何を表していると考えられている？ → <b>もとは同じ祖先から、枝分かれしてきたこと</b>（選: もとは同じ祖先から、枝分かれしてきたこと／それぞれがまったくべつべつに生まれてきたこと／今まさに1匹ずつ姿を変えていること／生き物どうしが食べ合っていること）</div>\n<div class=\"li\">- Q3 [新規] シソチョウ（始祖鳥）は、どの2つのなかまの特徴をあわせもっている？ → <b>は虫類と鳥類</b>（選: は虫類と鳥類／魚類と両生類／両生類とほ乳類／ほ乳類と鳥類）</div>", "ctxHtml": "<div class=\"li\">※T4〜T5のあと。証拠を読みとる問いなので、少し考える。冒頭に <b>「今回は少し難しめ！ がんばって！」</b> を表示（憲法4.7条）。3問とも「相同器官とは何か／それが示すこと／シソチョウの特徴」を問う同型・同難度でそろえた類題セット。</div>\n<div class=\"li\">※設計メモ: Q1は「〇〇器官」、Q3は「〇類と〇類」、Q2は「〜こと」で選択肢の形式をそろえた（憲法4.6条）。Q2の誤答「今まさに1匹ずつ姿を変えている」は素朴概念（進化＝一生で変わる）を証拠解釈の場面でも再点検させる置き方。練習プール genre＝bio_human に進化問が無いため新規（カーネル確定）。⚠<b>ただしQ1（相同器官）は別genre bio_cell の行257「はたらきは違っても、もとは同じものから変化したと考えられる器官を何という？→相同器官（例:ヒトの腕・クジラのひれ・コウモリの翼）」とほぼ同一概念・例示まで重複する</b>（4.5条＝出どころ明記）。差別化: 本Q1は例を設問文にうめこみ選択肢を「〇〇器官」でそろえた入門4択・行257は diff＝senior の語句問。<b>行257を[既存・入門]として原文どおり引用する案は、diff＝senior を入門類題セットに混ぜて4.2条（難度混在NG）を破るため採らない</b>（類題セットの同難度を優先）。DB追加時の重複整理（行257を💮受け皿に温存するか、bio_human へ入門版を新規登録するか）は§1.5でオーナー確認に回す。</div>\n<div class=\"li\">---</div>"}, {"type": "check", "uid": "u_bio_19", "id": "u_bio_19-確認1", "textHtml": "<b>確認クイズ6問のDB正式追加</b>: ⚠訂正——「進化問がDBにゼロ」は誤りでした。<b>このユニットの練習プール genre＝bio_human には無い</b>が、<b>別genre bio_cell には進化2問が実在</b>します（行256「進化」語句問・行257「相同器官」問＝ともに diff＝senior。行1883の遺伝問も選択肢に進化を含む）。とくに<b>行257は【19-Q2】Q1（相同器官・例示も同じ）とほぼ重複</b>します。そのうえで【19-Q1】【19-Q2】の6問を bio_human へDB追加の下書き元にして良いか（良ければ Codex 下書き→data-reviewer監査→6レンズ検収の順）。difficulty は junior（入門）〜mid（基礎）のどちらで登録するか。<b>また bio_cell の既存2問（行256/257）は💮テストの受け皿候補にもなります</b>——(a) bio_human へ入門版を新規登録して行257はそのまま温存、(b) 行257を bio_human 側の入門版へ整理し直す、のどちらにするか。"}, {"type": "check", "uid": "u_bio_19", "id": "u_bio_19-確認4", "textHtml": "<b>既存DB問の表記正規化2件（表記割れの是正候補・勝手に直していません＝憲法4.6条）</b>: 生徒がレディネスで漢字表記を見た直後に、教えるカードで仮名表記を読む<b>表記割れ</b>があります。現行『新しい科学』は仮名開き（哺・椎が教育漢字外）で、新規本文の側（ほ乳類／セキツイ動物）が正。原稿ではレディネスの既存流用【19-R1】【19-R2】を<b>原文どおり引用</b>（哺乳類／無脊椎動物）していますが、DB側を直せば割れが消えます: - (4-1) 行2219『<b>哺乳類</b>』→『<b>ほ乳類</b>』（問題文・選択肢とも）。 - (4-2) 行2218『<b>無脊椎動物</b>』→『<b>無セキツイ動物</b>』（本文・解説・hint内の「脊椎」もあわせて）。 - 是正GOが出たら、DBと<b>そのDB問を引用している全原稿</b>を同期します（本ユニットのレディネス引用も更新）。GOが無ければ原稿は今の原文どおり引用のまま（本文の新規側は ほ乳類／セキツイ動物 で統一済み）。"}, {"type": "check", "uid": "u_bio_19", "id": "u_bio_19-確認2", "textHtml": "<b>図版5枚の作り方</b>: 相同器官の比較図・セキツイ動物の登場順の図・シソチョウの特徴対比図・進化の世代帯・多様性の樹形図は、いずれも「向き・順番・共通性が意味を持つ図」なので matplotlib 自作（note_figures方式）で起こす予定です（生成AIに描かせない・憲法7条改正）。P1のクジラだけは「ざっくり場面イメージ・ひれの中は見せない」なので AI画像（Sol・cimg）候補。この振り分けで良いか。"}, {"type": "check", "uid": "u_bio_19", "id": "u_bio_19-確認3", "textHtml": "<b>シソチョウの化石イメージ</b>: T5 は模式図（matplotlib・特徴ラベル対比）で書きました。実物化石の写真は使えない（著作権・憲法7条）ため模式図一択ですが、この方針で良いか。 ---"}, {"type": "unit", "uid": "u_bio_20", "name": "生態系のしくみ", "n": 11, "nc": 4}, {"type": "card", "uid": "u_bio_20", "id": "u_bio_20-R", "title": "レディネスチェック", "meta": "", "screenHtml": "<div class=\"li\">- 【20-R1】[既存・入門] 植物が光合成を行うために必要な3つの組み合わせはどれか。 → <b>光・二酸化炭素・水</b>（選: 光・二酸化炭素・水／酸素・窒素・光／水・酸素・暗やみ／デンプン・酸素・光）</div>\n<div class=\"li\">- 【20-R2】[既存・未修] 砂糖やプラスチックのように、炭素をふくみ、燃やすと二酸化炭素を出す物質のなかまを何という？ → <b>有機物</b>（選: 金属／無機物／有機物／水溶液）</div>\n<div class=\"li\">- 【20-R3】[既存・未修] 食塩や鉄のように、有機物でない物質を無機物という。（○✕） → <b>○</b></div>\n<div class=\"q\">※R2・R3 は化学「身のまわりの物質」の予習プール（DB上の diff は unlearned）から引いたが、有機物・無機物の区別は中2で習う既習内容なので前提として置いてよい（出どころは§20.5でオーナー確認）。</div>\n<div class=\"q\">つまずいたときの誘いコピー（弱点表示ではなく招待状のトーン・憲法第2.5条・2.6条）:</div>\n<div class=\"q\">「<b>有機物と無機物のちがいを見なおしておくと、このあとの3つの役の話がつながりやすくなるよ</b>」→ 該当の教えるカードへのボタンがそっと光る</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_20", "id": "20-P1", "title": "予想（Predict）", "meta": "どれを選んでも正誤なし・「なるほど」で次へ／図: cimg/u_bio_20/p_forest_floor.png（Sol・森の地面に落ち葉がつもっている場面イメージ・答えは先渡ししない）", "screenHtml": "<div class=\"q\">森の木は、毎年どっさり落ち葉を落とす。何十年、何百年ぶんも積もったら、森の地面は落ち葉でうまってしまいそう。</div>\n<div class=\"q\">でも、実際の森の地面。落ち葉って、そんなに深く積もってるかな？</div>\n<div class=\"q\">「毎年ぶん、どんどん深く積もっている」／「あまり積もっていない」／「石のようにかたまっている」</div>", "ctxHtml": "<div class=\"q\"></div>"}, {"type": "card", "uid": "u_bio_20", "id": "20-P2", "title": "おどろき（Observe）", "meta": "", "screenHtml": "<div class=\"q\">実際の森の地面は、落ち葉でうまってなんかいない。積もった落ち葉は、いつのまにか消えて土になっている。</div>\n<div class=\"q\">消しているのは、カビや細菌、ミミズ。落ち葉や動物の死がいを、少しずつ分解して土にもどしているんだ。</div>\n<div class=\"q\">もし森から、この「分解する係」が全員いなくなったら——落ち葉も死がいも分解されずに、地面にずっと積もり続ける。そうじする係のいない森は、うもれてしまう。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_20", "id": "20-P3", "title": "たね明かし（Explain）", "meta": "図: fig_eco_cycle.png（新規・matplotlib・生産者→消費者→分解者→無機物（土にもどる）→生産者 の輪・カードサイズ・印なし）", "screenHtml": "<div class=\"q\">生きものは、3つの役に分かれて、物をぐるぐる回している。</div>\n<div class=\"q\">植物みたいに、自分で養分をつくる係が<b>生産者</b>。それを食べる動物が<b>消費者</b>。死がいや落ち葉を土にもどす係が<b>分解者</b>。</div>\n<div class=\"q\">このひとまとまり全体を<b>生態系</b>という。生態系は、3つの役でまわる大きな輪なんだ。今回は、その輪のしくみを見ていくよ。</div>", "ctxHtml": "<div class=\"li\">---</div>"}, {"type": "card", "uid": "u_bio_20", "id": "20-T1", "title": "生態系——生きものとまわりの環境をひとまとめに見る", "meta": "（種別: 概念／図なし）", "screenHtml": "<div class=\"q\">森には、木や草、虫や鳥、土の中の生きものがいる。そして、それを取りまく水・空気・土がある。</div>\n<div class=\"q\">この、ある場所の生きもの全部と、まわりの環境（水・空気・土）を、ひとまとめにして見たものを<b>生態系</b>という。</div>\n<div class=\"q\">生きものは、まわりの環境とも、ほかの生きものとも、たがいに関わり合って生きている。生態系は、その関わり合いぜんぶをふくんだ「まとまり」なんだ。</div>\n<details class=\"col\"><summary>生態系ってどこまでが1つ？</summary><div class=\"colbody\"><div class=\"q\">生態系の大きさは、決まっていない。1つの池を生態系と見ることもできるし、森ぜんぶ、地球ぜんぶを1つの生態系と見ることもできる。</div>\n<div class=\"q\">どこまでを1まとまりとして見るかは、何を調べたいかによって変わる。小さくも大きくも切り取れる、というのが大切なところなんだ。</div></div></details>", "ctxHtml": "<div class=\"q\"></div>"}, {"type": "card", "uid": "u_bio_20", "id": "20-T2", "title": "生産者——自分で養分をつくる係", "meta": "（種別: 概念／図: photosynthesis.png（既存・下敷き＝§20.5でオーナー確認））", "screenHtml": "<div class=\"q\">植物は、光合成で、二酸化炭素と水（どちらも無機物）から、自分の養分（有機物）をつくり出す。</div>\n<div class=\"q\">森の中で、自分で養分をつくれるのは植物だけ。だから植物は、物の流れの「出発点」になる。</div>\n<div class=\"q\">この、自分で養分をつくり出す係を<b>生産者</b>という。養分を生み出す係、と覚えておくと忘れにくいよ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_20", "id": "20-T3", "title": "消費者——食べて養分をもらう係", "meta": "（種別: 概念／図なし）", "screenHtml": "<div class=\"q\">動物は、光合成ができない。自分で養分をつくれないんだ。</div>\n<div class=\"q\">そのかわり、動物はほかの生きものを食べて、養分をもらう。草を食べる、虫を食べる、その虫を鳥が食べる——こうやって、生産者がつくった養分が、食べることで次々に受けわたされていく。</div>\n<div class=\"q\">この、ほかの生きものを食べて養分をもらう係を<b>消費者</b>という。生産者がつくった養分を、食べて消費する係、というわけ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_20", "id": "20-T4", "title": "分解者——物を土にもどす折り返し役", "meta": "（種別: 概念／図: cimg/u_bio_20/t4_decomposers.png（Sol・たおれた木や落ち葉にキノコ・カビが生えている場面イメージ・印なし））", "screenHtml": "<div class=\"q\">ここで、いちばん地味だけど、輪をつなぐ大事な係が出てくる。カビ・キノコ・細菌だ。</div>\n<div class=\"q\">カビやキノコのなかまを<b>菌類</b>、目に見えないくらい小さな生きものを<b>細菌類</b>という。どちらも、死がいや落ち葉（有機物）を分解して、無機物（水や養分）にもどすはたらきをする。その無機物が土にもどっていくんだ。</div>\n<div class=\"q\">この、有機物を無機物にもどす係を<b>分解者</b>という。分解者が有機物を無機物にもどすから、その無機物をまた生産者（植物）が使える。つまり分解者は、輪の「折り返し」——出口から入口へ物をわたす係なんだ。これが、生態系の輪が閉じるしくみだよ。</div>\n<details class=\"col\"><summary>カビやキノコは植物のなかま？</summary><div class=\"colbody\"><div class=\"q\">土から生えているし、動かないから、植物のなかまに見えるかもしれない。でも、カビやキノコには葉緑体がない。自分で光合成して養分をつくることができないんだ。</div>\n<div class=\"q\">だから植物ではなく、菌類というべつのなかま。種子でなく、胞子でふえるのも植物とちがうところだよ。</div></div></details>", "ctxHtml": "<div class=\"q\"></div>"}, {"type": "card", "uid": "u_bio_20", "id": "20-Q1", "title": "確認クイズ・セット1（3つの役の見分け・3問の類題・すべて既存流用・4択）", "meta": "", "screenHtml": "<div class=\"li\">- Q1 [既存・入門] 植物のように、無機物から有機物をつくる生物を何というか。 → <b>生産者</b>（選: 生産者／消費者／分解者／捕食者）</div>\n<div class=\"li\">- Q2 [既存・入門] 動物のように、ほかの生物を食べて生活する生物を何というか。 → <b>消費者</b>（選: 消費者／生産者／分解者／無機物）</div>\n<div class=\"li\">- Q3 [既存・入門] 落ち葉や死がいを分解する細菌や菌類などを何というか。 → <b>分解者</b>（選: 分解者／生産者／一次消費者／肉食動物）</div>", "ctxHtml": "<div class=\"li\">※3問とも「あるはたらきをする生物を何というか」を問う同型・同難度（入門）でそろえた類題セット。この節目は生産者・消費者・分解者の3つの役の選び分けが本題なので4択（憲法4.7条の例外＝内容が選び分けを要求する時）。</div>\n<div class=\"li\">※設計メモ: Q2の選択肢に「無機物」が1つだけ生物でない語として混じる（他は3つとも役の名前）。消去法を許しかねない軽い異質さ（憲法4.6条）＝§20.5でDB是正候補としてオーナー確認に回す（原稿は原文どおり引用）。</div>"}, {"type": "card", "uid": "u_bio_20", "id": "20-T5", "title": "3つの役で物が回る——だから森は落ち葉でうまらない", "meta": "（種別: 達成の先出し／図: fig_eco_cycle.png（【20-P3】と同じ輪の図））", "screenHtml": "<div class=\"q\">これで、はじめの「なんで森は落ち葉でうまらないの？」の答えが出そろった。</div>\n<div class=\"q\">生産者（植物）が養分をつくり → 消費者（動物）が食べて受けわたし → 分解者（カビ・キノコ・細菌）が死がいや落ち葉を無機物にもどす → その無機物をまた生産者が使う。</div>\n<div class=\"q\">3つの役で、物がぐるぐる回っている。分解者が落ち葉を無機物にもどして土にかえしてくれるから、森は落ち葉でうまらない。これが、生態系の輪のしくみだよ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_20", "id": "20-Q2", "title": "確認クイズ・セット2（分解者の見分け・具体例・3問の類題・4択）", "meta": "", "screenHtml": "<div class=\"li\">- Q1 [既存・入門] 次のうち、分解者のなかまにあたるものはどれか。 → <b>カビやキノコ（菌類）</b>（選: カビやキノコ（菌類）／イネ（植物）／ウサギ（草食動物）／ワシ（肉食動物））</div>\n<div class=\"li\">- Q2 [新規] 森の地面で、落ち葉や動物の死がいを分解して土にもどしているのはどれか。 → <b>土の中の細菌</b>（選: ススキ／バッタ／土の中の細菌／モズ）</div>\n<div class=\"li\">- Q3 [新規] つぎの生物のうち、死がいやふんを無機物にまで分解するはたらきをするのはどれか。 → <b>シイタケ（キノコ）</b>（選: イネ／カエル／シイタケ（キノコ）／タカ）</div>", "ctxHtml": "<div class=\"li\">※3問とも「つぎのうち、分解者のはたらきをする生物はどれか」を問う同型・同難度（入門）でそろえた類題セット。生産者（植物）・消費者（動物）とまぎれやすい分解者を、具体的な生きもので見分ける（難所＝分解者の回収）。分解者を4つの生きものから選び分けるので4択（憲法4.7条の例外）。</div>\n<div class=\"li\">※設計メモ: Q2・Q3 は Q1（既存）と同じ「4つの生きものから分解者を1つ選ぶ」形式でそろえた新規下書き。まぎらわしさを出すため、選択肢は生産者（植物＝ススキ・イネ）・消費者（動物＝バッタ・モズ・カエル・タカ）を1つずつまぜ、分解者（細菌・キノコ）を正解にした。DBには入れない（原稿の下書き）。</div>\n<div class=\"li\">---</div>"}, {"type": "check", "uid": "u_bio_20", "id": "u_bio_20-確認1", "textHtml": "<b>レディネスR2・R3 の出どころ</b>: 有機物・無機物の定義を、化学「身のまわりの物質」の予習プール（DB diff＝unlearned）から引いた。中2既習の内容だが、DBタグは予習扱い。このまま流用でよいか／別の既習問題に差し替えたいか。"}, {"type": "check", "uid": "u_bio_20", "id": "u_bio_20-確認2", "textHtml": "<b>【20-Q1】Q2 の選択肢「無機物」</b>: 4つの選択肢のうち1つだけ生物でない語（他3つは役の名前）で、消去法を許しかねない軽い異質さ（憲法4.6条）。DB是正候補として「無機物」→「捕食者」など役の名前にそろえるか。是正GOが出たら、DB→この引用原稿を同期する（勝手には直さない）。"}, {"type": "check", "uid": "u_bio_20", "id": "u_bio_20-確認3", "textHtml": "<b>T2の図版 photosynthesis.png の再利用可否</b>: カーネルは既存流用（生産者＝光合成の下敷き）を指定。ただし u_bio_08 で、A4まとめ図（note_figures）の使い回しは①1画面の情報過多②学年バッジが出る、の2点で不適と判断した前例がある。photosynthesis.png も同種なら、T2はカードサイズの新規図（または図なし）に切り替えたい。現物を見て判断をお願いしたい。"}, {"type": "check", "uid": "u_bio_20", "id": "u_bio_20-確認4", "textHtml": "<b>【20-Q2】の新規2問（Q2・Q3）</b>: 分解者を具体的な生きもので見分けるための書き下ろし。この形式・難度でよいか（採用されれば「よみときの道」でなく通常の練習プールへ追加も可）。 ---"}, {"type": "unit", "uid": "u_bio_21", "name": "食物連鎖・食物網", "n": 12, "nc": 4}, {"type": "card", "uid": "u_bio_21", "id": "u_bio_21-R", "title": "レディネスチェック", "meta": "", "screenHtml": "<div class=\"li\">- 【21-R1】[既存・入門] 植物のように、無機物から有機物をつくる生物を何というか。 → <b>生産者</b>（選: 生産者／消費者／分解者／捕食者）〔quiz-engine.js 102行〕</div>\n<div class=\"li\">- 【21-R2】[既存・入門] 動物のように、ほかの生物を食べて生活する生物を何というか。 → <b>消費者</b>（選: 消費者／生産者／分解者／無機物）〔quiz-engine.js 103行〕</div>\n<div class=\"li\">- 【21-R3】[既存・入門] 落ち葉や死がいを分解する細菌や菌類などを何というか。 → <b>分解者</b>（選: 分解者／生産者／一次消費者／肉食動物）〔quiz-engine.js 105行〕</div>\n<div class=\"q\">つまずいたときの誘いコピー（弱点表示ではなく招待状のトーン・憲法第2.5条・2.6条＝楽アピールで誘わない）:</div>\n<div class=\"q\">「<b>生産者・消費者・分解者の役割を見なおしておくと、このあとの食べる・食べられるの話がつながりやすくなるよ</b>」→ 該当の教えるカードへのボタンがそっと光る</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_21", "id": "21-P1", "title": "予想（Predict）", "meta": "どれを選んでも正誤なし・「なるほど」で次へ／図: card_food_chain.png（新規・カードサイズ＝草→バッタ→カエル→ヘビの一本の矢印だけ。網の目は見せない＝答えを先渡ししない）", "screenHtml": "<div class=\"q\">草をバッタが食べ、そのバッタをカエルが食べ、カエルをヘビが食べる。</div>\n<div class=\"q\">こんなふうに、食べる・食べられるは一本の鎖みたいにつながっている。</div>\n<div class=\"q\">じゃあ、ヘビはカエルだけを食べて生きているのかな？　バッタも、草しか食べないのかな？</div>\n<div class=\"q\">「1種類だけを食べている」／「いくつかの種類を食べている」／「考えたことがない」</div>", "ctxHtml": "<div class=\"q\"></div>"}, {"type": "card", "uid": "u_bio_21", "id": "21-P2", "title": "おどろき（Observe）", "meta": "図: card_food_web.png（新規・カードサイズ＝同じ草・バッタ・カエル・ヘビに、クモ・トンボ・ネズミが加わり、1つの生きものから何本もの矢印が出て網の目になった絵。矢印は食べられる→食べる）", "screenHtml": "<div class=\"q\">実は、カエルはバッタもクモもトンボも食べる。ヘビもカエルだけでなくネズミも食べる。</div>\n<div class=\"q\">1本の鎖じゃない。1つの生きものから、何本もの矢印が出ている。</div>\n<div class=\"q\">たくさんの鎖がからみ合って、自然界は「網の目」になっているんだ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_21", "id": "21-P3", "title": "たね明かし（Explain）", "meta": "", "screenHtml": "<div class=\"q\">「食べる・食べられる」が、鎖のようにひとつながりになったものを<b>食物連鎖（しょくもつれんさ）</b>という。</div>\n<div class=\"q\">でも自然界では、どの生きものも1種類だけを食べるわけじゃない。</div>\n<div class=\"q\">だから、たくさんの食物連鎖が網の目のようにからみ合う。これを<b>食物網（しょくもつもう）</b>というんだ。</div>\n<div class=\"q\">今回は、この鎖と網のしくみ、そして矢印の向きと数のつり合いを見ていくよ。</div>", "ctxHtml": "<div class=\"li\">---</div>"}, {"type": "card", "uid": "u_bio_21", "id": "21-T1", "title": "食物連鎖——食べる・食べられるの鎖", "meta": "（種別: 概念／図: card_food_chain.png 再掲・印なし）", "screenHtml": "<div class=\"q\">生きものは、食べる・食べられるでつながっている。</div>\n<div class=\"q\">草をバッタが食べ、バッタをカエルが食べ、カエルをヘビが食べる。</div>\n<div class=\"q\">このように、食べる・食べられるの関係が鎖のようにひとつながりになったものを<b>食物連鎖</b>という。</div>\n<div class=\"q\">どの鎖も、出発点は植物のように自分で養分をつくる生きもの（生産者）なんだ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_21", "id": "21-T2", "title": "矢印の向き——食べられる側から食べる側へ", "meta": "（種別: 概念／図: card_food_chain.png 再掲・矢印に注目・印なし）", "screenHtml": "<div class=\"q\">食物連鎖を矢印で表すときは、向きが決まっている。</div>\n<div class=\"q\">矢印は、<b>食べられる側から、食べる側へ</b>向ける（草→バッタ→カエル→ヘビ）。</div>\n<div class=\"q\">この矢印は、養分が移っていく向きを表しているんだ。食べられた生きものの養分が、食べた生きものへ移る。</div>\n<div class=\"q\">だから、向きを逆にはしない。ここは見た目がにているぶん、取りちがえやすいところだよ。</div>\n<details class=\"col\"><summary>矢印はエサの向き？　養分の向き？</summary><div class=\"colbody\"><div class=\"q\">「ヘビ→カエル」と書きたくなるかもしれない（ヘビがカエルを食べるから）。でも矢印は逆。</div>\n<div class=\"q\">矢印がさしているのは「エサにする相手」じゃなくて、「養分が移っていく先」。</div>\n<div class=\"q\">食べられたカエルの養分が、食べたヘビへ移る。だから矢印は「カエル→ヘビ」。向きは養分の流れで決まる、と考えると忘れにくいよ。</div></div></details>", "ctxHtml": "<div class=\"q\"></div>"}, {"type": "card", "uid": "u_bio_21", "id": "21-T3", "title": "鎖の並び——生産者から消費者へ", "meta": "（種別: 概念／図なし）", "screenHtml": "<div class=\"q\">食物連鎖の並びには、名前がついている。</div>\n<div class=\"q\">出発点は、光合成で養分をつくる植物＝<b>生産者</b>。</div>\n<div class=\"q\">その生産者を直接食べる草食動物を<b>一次消費者</b>という。</div>\n<div class=\"q\">さらに、その一次消費者を食べる肉食動物を<b>二次消費者</b>という。</div>\n<div class=\"q\">生産者 → 一次消費者 → 二次消費者、と養分が受けわたされていくんだ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_21", "id": "21-Q1", "title": "確認クイズ・セット1（食物連鎖の意味と用語の節目・3問の類題・すべて既存流用・4択）", "meta": "", "screenHtml": "<div class=\"li\">- Q1 [既存・入門] 生物どうしの「食べる・食べられる」のつながりを何というか。 → <b>食物連鎖</b>（選: 食物連鎖／細胞分裂／光合成／肺循環）〔quiz-engine.js 104行〕</div>\n<div class=\"li\">- Q2 [既存・入門] 植物などの生産者を食べる、草食動物のなかまを何というか。 → <b>一次消費者</b>（選: 二次消費者／一次消費者／生産者／分解者）〔quiz-engine.js 111行〕</div>\n<div class=\"li\">- Q3 [既存・入門] 一次消費者(草食動物)を食べる肉食動物のなかまを何というか。 → <b>二次消費者</b>（選: 生産者／分解者／二次消費者／一次消費者）〔quiz-engine.js 112行〕</div>", "ctxHtml": "<div class=\"li\">※3問とも「食物連鎖の登場人物・用語の名前を答える」同型・同難度（入門）でそろえた類題セット。この節目は用語の選び分けが本題なので4択のまま（憲法4.7条の例外＝内容が選び分けを要求する時）。</div>"}, {"type": "card", "uid": "u_bio_21", "id": "21-T4", "title": "食物網——鎖がからみ合う網の目", "meta": "（種別: 概念／図: card_food_web.png 再掲・印なし）", "screenHtml": "<div class=\"q\">ここで、導入で見た網の目にもどろう。</div>\n<div class=\"q\">実際の自然界では、どの生きものも1種類だけを食べているわけじゃない。</div>\n<div class=\"q\">カエルはバッタもクモもトンボも食べるし、そのカエルもヘビやサギに食べられる。</div>\n<div class=\"q\">だから、1本の食物連鎖では書ききれない。たくさんの食物連鎖が網の目のようにからみ合う。これが<b>食物網</b>なんだ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_21", "id": "21-T5", "title": "数のつり合い——食べられる側ほど数が多い", "meta": "（種別: 概念／図: card_number_pyramid.png 新規・カードサイズ＝生産者を底にした三角・上ほど数が少ない・印なし）", "screenHtml": "<div class=\"q\">食物網の中では、生きものの数にきまりがある。</div>\n<div class=\"q\"><b>食べられる側ほど数が多く、食べる側ほど数が少ない</b>。</div>\n<div class=\"q\">生産者（植物）がいちばん多く、一次消費者（草食動物）、二次消費者（肉食動物）と、上にいくほど数がへっていく。</div>\n<div class=\"q\">これを図にすると、生産者を底にした三角（数量ピラミッド）の形になる。</div>\n<details class=\"col\"><summary>なんで上ほど数が少ないの？</summary><div class=\"colbody\"><div class=\"q\">上の動物ほど、下のたくさんの生きものを食べないと生きていけない。</div>\n<div class=\"q\">1ぴきの肉食動物が生きるには、たくさんの草食動物がいる。その草食動物が生きるには、もっとたくさんの植物がいる。</div>\n<div class=\"q\">だから、支える下ほど数が多く、支えられる上ほど数が少なくなる。三角の形になるのはそのためだよ。</div></div></details>", "ctxHtml": "<div class=\"q\"></div>"}, {"type": "card", "uid": "u_bio_21", "id": "21-T6", "title": "つり合いはもどる——くずれても時間でもどる", "meta": "（種別: 概念／図なし）", "screenHtml": "<div class=\"q\">この数のつり合いは、一時的にくずれても、時間がたつともとにもどっていく。</div>\n<div class=\"q\">たとえば、草食動物が一時的にふえると、食べられる植物がへる。</div>\n<div class=\"q\">すると、エサの植物がへった草食動物もへっていく。</div>\n<div class=\"q\">草食動物がへれば植物はまたふえて、もとのつり合いにもどる。これが生態系のつり合いのしくみだよ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_21", "id": "21-Q2", "title": "確認クイズ・セット2（食物網と数量のつり合いの節目・3問の類題・すべて既存流用・4択）", "meta": "", "screenHtml": "<div class=\"li\">- Q1 [既存・基礎] 食物網とは何を表したものか。 → <b>複数の食物連鎖が網の目のようにつながった関係</b>（選: 複数の食物連鎖が網の目のようにつながった関係／一つの細胞のつくり／血液の流れ／花のつくり）〔quiz-engine.js 107行〕</div>\n<div class=\"li\">- Q2 [既存・基礎] 生態系で、ふつう数量が最も多いのはどれか。 → <b>生産者</b>（選: 生産者／一次消費者／二次消費者／大型の肉食動物）〔quiz-engine.js 113行〕</div>\n<div class=\"li\">- Q3 [既存・基礎] ある草原で草食動物が一時的にふえると、食べられる植物の数はどうなるか。 → <b>へる</b>（選: ふえる／変わらない／二酸化炭素に変わってなくなる／へる）〔quiz-engine.js 114行〕</div>", "ctxHtml": "<div class=\"li\">※3問とも「食物網と数量のつり合い」を問う同型・同難度（基礎）でそろえた類題セット。値やしくみの選び分けが本題なので4択のまま（憲法4.7条の例外）。</div>\n<div class=\"li\">---</div>"}, {"type": "check", "uid": "u_bio_21", "id": "u_bio_21-確認1", "textHtml": "<b>図版3枚の作り方</b>: card_food_chain（一本鎖）・card_food_web（網の目）・card_number_pyramid（数量ピラミッド）をmatplotlib（note_figures方式）で起こす方針でよいか。矢印の向き・生きものの個数が意味を持つ図なのでAI生成でなくmatplotlib自作を既定にした（憲法第7条）。生きものは実写でなく簡単な模式アイコン（草・バッタ・カエル・ヘビ・クモ・トンボ・ネズミ）で描く＝著作権リスクゼロ。"}, {"type": "check", "uid": "u_bio_21", "id": "u_bio_21-確認2", "textHtml": "<b>食物網の図に入れる生きもの</b>: 草・バッタ・カエル・ヘビに加えて、クモ・トンボ・ネズミ・サギを入れて網の目にする案でよいか（地域の田んぼ・草原で身近な組み合わせ）。差しかえ希望があれば指定を。"}, {"type": "check", "uid": "u_bio_21", "id": "u_bio_21-確認3", "textHtml": "<b>確認クイズ2セットとも4択のまま</b>: 用語・値の選び分けが本題のため、既定2択（憲法4.7条）ではなく既存4択を流用した。この判断でよいか（u_bio_08の【08-Q1】と同じ扱い）。"}, {"type": "check", "uid": "u_bio_21", "id": "u_bio_21-確認4", "textHtml": "<b>【21-Q2】Q1のDB是正候補（憲法4.6条・選択肢の水準がそろっていない）</b>: 「食物網とは何を表したものか。」の正答「複数の食物連鎖が網の目のようにつながった関係」だけが一文で長く・唯一「食物連鎖」に触れる選択肢で、誤答3つ（一つの細胞のつくり／血液の流れ／花のつくり）は短い無関係な名詞句。内容を知らなくても「長い＆唯一テーマに触れる選択肢」を選べば当たる＝消去法で解ける異質選択肢（憲法4.6条違反）。原稿では原文どおり引用したままにしてある（勝手に直さない）。是正案は2つ——(A) 誤答を「複数の細胞が集まった関係」「複数の血管がつながった関係」など<b>同型フレーズ</b>にそろえてDB是正する〔quiz-engine.js 107行〕／(B) この問題をQ2セットから外し、数量のつり合いで同型の既存3問〔quiz-engine.js 113行「数量が最も多いのは」・114行「草食動物がふえると植物は」・119行「肉食動物が減ると草食動物は」〕に組み替える。どちらでいくか（是正GOが出たらDB→本原稿の引用を同期）。 ---"}, {"type": "unit", "uid": "u_bio_22", "name": "炭素の循環", "n": 11, "nc": 3}, {"type": "card", "uid": "u_bio_22", "id": "u_bio_22-R", "title": "レディネスチェック", "meta": "", "screenHtml": "<div class=\"li\">- 【22-R1】[既存・入門] 植物のように、無機物から有機物をつくる生物を何というか。 → <b>生産者</b>（選: 生産者／消費者／分解者／捕食者）</div>\n<div class=\"li\">- 【22-R2】[既存・入門] 動物のように、ほかの生物を食べて生活する生物を何というか。 → <b>消費者</b>（選: 消費者／生産者／分解者／無機物）</div>\n<div class=\"li\">- 【22-R3】[既存・入門] 落ち葉や生物の死がいを分解して土にかえす生物のことを、生態系の中で何とよぶか。 → <b>分解者</b>（選: 生産者／分解者／一次消費者／二次消費者）</div>\n<div class=\"q\">つまずいたときの誘いコピー（弱点表示ではなく招待状のトーン・憲法第2.5条・2.6条＝楽アピールで誘わない）:</div>\n<div class=\"q\">「<b>生産者・消費者・分解者の役割を見なおしておくと、このあとの炭素のめぐりがつながりやすくなるよ</b>」→ u_bio_20 の該当カードへのボタンがそっと光る</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_22", "id": "22-P1", "title": "予想（Predict）", "meta": "どれを選んでも正誤なし・「なるほど」で次へ／図: cimg/u_bio_22/p_breath.png（新規AI・寒い日に息を白く吐く場面のイメージだけ。答え＝この先のめぐりは載せない）", "screenHtml": "<div class=\"q\">いま、はあっと息を吐いた。その息の中には、<b>二酸化炭素</b>がまざっている。</div>\n<div class=\"q\">その二酸化炭素にふくまれる<b>炭素</b>という原子は、このあとどこへ行くと思う？</div>\n<div class=\"q\">「空気の中に散らばって、それっきり」／「雨といっしょに地面にしみこむ」／「言われてみると見当がつかない」</div>", "ctxHtml": "<div class=\"q\"></div>"}, {"type": "card", "uid": "u_bio_22", "id": "22-P2", "title": "おどろき（Observe）", "meta": "図: card_carbon_journey.png（新規・カードサイズ＝1個の炭素●が「息→葉→動物→息」とひとまわりする簡易ループだけ。光合成・呼吸などのしくみの名前はまだ入れない＝たね明かしは次のE以降）", "screenHtml": "<div class=\"q\">その炭素、空気に散らばって終わり——ではないんだ。</div>\n<div class=\"q\">植物がその二酸化炭素を吸いこんで、葉や実の中の養分（有機物）に姿を変える。</div>\n<div class=\"q\">その実を動物が食べれば、炭素は動物の体の一部になる。</div>\n<div class=\"q\">そして動物が息を吐けば、炭素はまた二酸化炭素になって空気へもどる。</div>\n<div class=\"q\">同じ炭素の原子が、気体→植物→動物→気体と、姿を変えながらぐるぐる回っている。</div>\n<div class=\"q\">いま吐いた息の炭素は、大むかし、恐竜の体の一部だったかもしれないんだ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_22", "id": "22-P3", "title": "たね明かし（Explain）", "meta": "", "screenHtml": "<div class=\"q\">炭素は、<b>二酸化炭素（気体）</b>と<b>有機物（生きものの体）</b>のあいだを、行ったり来たりしている。</div>\n<div class=\"q\">植物が二酸化炭素をとりこんで有機物にし、生きものが呼吸や分解でまた二酸化炭素にもどす。</div>\n<div class=\"q\">この行き来を<b>炭素の循環（じゅんかん）</b>というんだ。</div>\n<div class=\"q\">ここから、その行き来の入口と出口を、一つずつ見ていくよ。</div>", "ctxHtml": "<div class=\"li\">---</div>"}, {"type": "card", "uid": "u_bio_22", "id": "22-T1", "title": "炭素は、姿を変える——でも同じ原子", "meta": "（種別: 概念／図: card_carbon_forms.png 新規・カードサイズ＝同じ炭素●が、空気中では二酸化炭素、生きものの中では有機物になっている対比・印なし）", "screenHtml": "<div class=\"q\">炭素という原子は、いる場所によって、まったくちがう姿に見える。</div>\n<div class=\"q\">空気の中では、酸素とくっついて<b>二酸化炭素</b>という気体になっている。</div>\n<div class=\"q\">生きものの体の中では、<b>有機物</b>（養分や体をつくる物質）の一部になっている。</div>\n<div class=\"q\">気体と、体の一部。見た目はぜんぜんちがう。でも、中にいる<b>炭素は同じ原子</b>なんだ。</div>\n<div class=\"q\">この「同じ炭素」を見失わずに追いかけると、めぐりの全体が見えてくるよ。</div>\n<details class=\"col\"><summary>今の息の炭素、もとは何だった？</summary><div class=\"colbody\"><div class=\"q\">炭素は、なくなったり新しく生まれたりしない。地球ができたころからある炭素が、姿を変えながら、ずっと回りつづけている。</div>\n<div class=\"q\">だから、いま吐いた息の炭素も、たどれば大むかしの海や、恐竜や、大昔の森の一部だった可能性がある。同じ原子が、何億年も使い回されているんだ。</div>\n<div class=\"q\">どこまでさかのぼれるか、興味があったら調べてみて。</div></div></details>", "ctxHtml": "<div class=\"q\"></div>"}, {"type": "card", "uid": "u_bio_22", "id": "22-T2", "title": "入口＝光合成——植物が二酸化炭素をとりこむ", "meta": "（種別: 概念／図なし）", "screenHtml": "<div class=\"q\">空気中の炭素が、生きものの中に入る<b>入口</b>は、植物の<b>光合成</b>。</div>\n<div class=\"q\">植物は、空気中の二酸化炭素をとりこんで、光のエネルギーを使い、養分（有機物）をつくる。</div>\n<div class=\"q\">このとき、二酸化炭素の中にいた炭素が、植物の体の一部にうつる。</div>\n<div class=\"q\">つまり光合成は、<b>気体の炭素→生きものの炭素</b>へと入れる、めぐりの入口なんだ。</div>\n<div class=\"q\">光合成で養分をつくれるのは、生産者（植物や植物プランクトンなど）だけ。だから炭素が生きものの世界に入る入口は、生産者だけにあるんだ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_22", "id": "22-T3", "title": "出口＝呼吸——生きものが二酸化炭素を出す", "meta": "（種別: 概念／図なし）", "screenHtml": "<div class=\"q\">生きものの中に入った炭素が、また空気にもどる<b>出口</b>は、<b>呼吸</b>。</div>\n<div class=\"q\">生きものは、体の中の有機物を分解してエネルギーをとり出す。このとき二酸化炭素ができて、体の外へ出る。</div>\n<div class=\"q\">呼吸をするのは動物だけじゃない。<b>植物も、昼も夜も、ずっと呼吸をしている</b>。</div>\n<div class=\"q\">（光合成は光のある昼だけ。呼吸はそれとは別で、植物も一日じゅう続けている。）</div>\n<div class=\"q\">だから炭素が空気にもどる出口は、動物にも植物にも、どちらにもあるんだ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_22", "id": "22-Q1", "title": "確認クイズ・セット1（入口＝光合成／出口＝呼吸の節目・3問の類題・4択）", "meta": "", "screenHtml": "<div class=\"li\">- Q1 [既存・基礎] 植物が大気中の二酸化炭素を取りこんで、自分のからだの養分（有機物）をつくるはたらきを何というか。 → <b>光合成</b>（選: 分解／蒸散／光合成／呼吸）</div>\n<div class=\"li\">- Q2 [既存・基礎] 生物が有機物を分解してエネルギーを取り出すとき、炭素を二酸化炭素として大気へもどす働きを何といいますか。 → <b>呼吸</b>（選: 受粉／呼吸／光合成／蒸散）</div>\n<div class=\"li\">- Q3 [新規] 植物が、昼も夜も、体の中の有機物を分解して二酸化炭素を出しつづけているはたらきを何というか。 → <b>呼吸</b>（選: 光合成／呼吸／蒸散／消化）</div>", "ctxHtml": "<div class=\"li\">※3問とも「炭素を動かすはたらきを名前で選ぶ」同型・同難度（基礎）でそろえた類題セット。光合成・呼吸・蒸散・分解といった<b>にた用語の選び分け</b>が本題なので4択のまま（憲法4.7条の例外＝内容が選び分けを要求する時）。</div>\n<div class=\"li\">※設計メモ: Q1（入口＝光合成）→Q2（出口＝呼吸）→Q3（植物も呼吸する＝出口の再確認）と、入口と出口を一巡させ、最後に「植物も呼吸する」という誤概念つぶしを重ねた。Q3は既存プールに同型が無いため新規（DB追加はしない・原稿の下書きのみ）。Q3の選択肢は他2問と同じ「はたらきの名前」でそろえた（憲法4.6条）。</div>"}, {"type": "card", "uid": "u_bio_22", "id": "22-T4", "title": "分解者の呼吸も、出口——だから輪が閉じる", "meta": "（種別: 概念／図なし）", "screenHtml": "<div class=\"q\">生きものが死んだあとの体や、落ち葉・ふんの中にも、炭素は有機物として残っている。</div>\n<div class=\"q\">それを食べて分解するのが、<b>分解者</b>（菌類や細菌）。</div>\n<div class=\"q\">分解者も、有機物を分解するときに呼吸をして、炭素を二酸化炭素として空気にもどす。</div>\n<div class=\"q\">つまり、分解者の呼吸も、めぐりの<b>出口</b>の一つ。</div>\n<div class=\"q\">これで、生きものの中に入った炭素は、動物・植物・分解者の呼吸で、ぜんぶ空気にもどる道ができた。<b>残さず出口までつながって、めぐりの輪が閉じるんだ。</b></div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_22", "id": "22-T5", "title": "炭素の循環——入口と出口で、ぐるぐる回る", "meta": "（種別: たね明かし・達成の先出し／図: card_carbon_cycle.png 新規・カードサイズ＝大気の二酸化炭素↔植物（光合成でとりこむ／呼吸で出す）↔動物（食べる／呼吸で出す）↔分解者（分解して出す）の矢印循環・炭素を●で追える・印なし）", "screenHtml": "<div class=\"q\">ここまでを1枚につなげると、こうなる。</div>\n<div class=\"q\"><b>入口</b>は、植物の光合成（二酸化炭素→有機物）。</div>\n<div class=\"q\"><b>出口</b>は、動物・植物・分解者の呼吸（有機物→二酸化炭素）。</div>\n<div class=\"q\">炭素は、この入口から生きものの世界に入り、食べる・食べられるを通って体から体へ移り、呼吸の出口から空気にもどる。そしてまた光合成で入る。</div>\n<div class=\"q\">姿は二酸化炭素と有機物に変わるけれど、炭素という原子はなくならず、入口と出口をめぐって回りつづける。<b>これが、炭素の循環のしくみだよ。</b></div>\n<div class=\"q\">図の●を、入口から出口まで指でたどれればOK。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_22", "id": "22-Q2", "title": "確認クイズ・セット2（炭素の循環の全体像と分解者の役割の節目・3問の類題・4択）", "meta": "", "screenHtml": "<div class=\"li\">- Q1 [既存・基礎] 炭素が、二酸化炭素や有機物のすがたで生物と大気・土の間を行き来する流れを何というか。 → <b>炭素の循環</b>（選: 炭素の循環／水の循環／窒素の固定／食物連鎖）</div>\n<div class=\"li\">- Q2 [新規] 菌類や細菌（分解者）が、死がいや落ち葉の有機物を分解して、炭素を二酸化炭素として大気へもどすはたらきを何というか。 → <b>呼吸</b>（選: 光合成／呼吸／発芽／蒸散）</div>\n<div class=\"li\">- Q3 [既存・基礎] 菌類や細菌が分解者とよばれるのは、死がいやふんなどの有機物を最終的に何に変えるからか。 → <b>二酸化炭素や水などの無機物</b>（選: 二酸化炭素や水などの無機物／デンプンなどの有機物／酸素だけ／タンパク質）</div>", "ctxHtml": "<div class=\"li\">※3問とも「炭素の循環と分解者のはたらきを、正しい言葉で選ぶ」同型・同難度（基礎）でそろえた類題セット。にた用語（循環／呼吸／無機物と有機物）の選び分けが本題なので4択のまま（憲法4.7条の例外）。全体像はT5、分解者の呼吸はT4で教えたばかりの内容。</div>\n<div class=\"li\">※設計メモ: Q1（めぐり全体の名前）→Q2（分解者の出口＝呼吸）→Q3（分解者の産物＝無機物）と、全体→分解者のはたらき→分解者の産物、へ一歩ずつ絞る。カーネルSet2指定の3問（循環の名前／二酸化炭素にもどすはたらき＝呼吸／有機物を何に変えるか）にそろえた。Q2は分解者を主語にした呼吸の naming が既存プールに無い（既存268は「生物が」でSet1に使用済み）ため新規（DB追加はしない・原稿の下書きのみ）。Q2の選択肢は他2問とそろえて「はたらき・物質の名前」で統一（憲法4.6条）。</div>\n<div class=\"li\">---</div>"}, {"type": "check", "uid": "u_bio_22", "id": "u_bio_22-確認1", "textHtml": "<b>確認クイズの難度（カーネルからの調整）</b>: カーネルは Set1＝入門(junior) 指定でしたが、quiz-engine.js を実測すると <b>bio_eco の入門(junior)に光合成・呼吸・炭素の循環の問題が1問も無く</b>（入門は生産者・消費者・分解者・食物連鎖・分類のみ）、これらの naming 問題はすべて基礎(mid)にありました。憲法4.2条（真の類題）を優先し、Set1・Set2 とも<b>基礎(mid)でそろえました</b>。この難度でよいか、ご確認ください（画面表記は「基礎」）。もし入門でそろえたい場合は、Set1 を新規の入門3問（例:「植物が二酸化炭素をとりこむのは光合成か呼吸か」等の2択）で書き下ろすことも可能です。"}, {"type": "check", "uid": "u_bio_22", "id": "u_bio_22-確認2", "textHtml": "<b>確認クイズを4択のままにした判断</b>: 光合成・呼吸・蒸散・分解といった<b>にた用語の選び分け</b>が本題のため、憲法4.7条の例外として4択のままにしました（既定は2択）。この判断でよいか。"}, {"type": "check", "uid": "u_bio_22", "id": "u_bio_22-確認3", "textHtml": "<b>図版4枚（すべて新規）</b>: 既存 photosynthesis.png は<b>A4ノート図＋「中1 植物」バッジ付き＋実験・まとめまで載っており、①1画面の情報過多②学年バッジが出る③この先のしくみを先に見せてしまう</b>ため、u_bio_08 と同じ理由で<b>使わず</b>、教える情報に絞った新規カード図に差し替えました（付録参照）。P1のみ AI画像（Sol）、残り3枚は matplotlib（炭素●の向き・循環の矢印が意味を持つため・憲法7条改正）。この方針でよいか。 ---"}, {"type": "unit", "uid": "u_bio_23", "name": "生態系と人間の影響", "n": 12, "nc": 3}, {"type": "card", "uid": "u_bio_23", "id": "u_bio_23-R", "title": "レディネスチェック", "meta": "", "screenHtml": "<div class=\"li\">- 【23-R1】[既存・入門] 自然界では食物連鎖が1本ではなく、あみの目のように複雑にからみ合っている。このつながりを何というか。 → <b>食物網</b>（選: 食物網／食物連鎖／生態系／個体群）〔quiz-engine.js L1892〕</div>\n<div class=\"li\">- 【23-R2】[既存・入門] 食物連鎖の数量のつり合いがくずれても、ふつう時間がたつと再びもとのようなつり合いにもどっていく。（○✕）→ <b>○</b>〔L1897〕</div>\n<div class=\"li\">- 【23-R3】[既存・入門] 植物が光合成のときに空気中からとり入れ、生物が呼吸のときに出している気体はどれか。 → <b>二酸化炭素</b>（選: 二酸化炭素／酸素／水素／ちっ素）〔L1902〕</div>\n<div class=\"q\">つまずいたときの誘いコピー（弱点表示ではなく招待状のトーン・憲法第2.5条・2.6条）:</div>\n<div class=\"q\">「<b>つり合いと炭素のめぐりを見なおしておくと、このあとの人間の影響の話がつながりやすくなるよ</b>」→ 該当の教えるカードへのボタンがそっと光る</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_23", "id": "23-P1", "title": "予想（Predict）", "meta": "どれを選んでも正誤なし・「なるほど」で次へ", "screenHtml": "<div class=\"q\">日本の池や川で、もともといなかったブラックバスやアメリカザリガニが大繁殖して、問題になっている。</div>\n<div class=\"q\">もとからいたメダカやフナが、たくさんいた池なのに。</div>\n<div class=\"q\">外から1種類入っただけで、なんでそんなに大ごとになると思う？</div>\n<div class=\"q\">「しばらくすれば元どおりになる」／「池全体が大きく変わってしまう」／「1種類くらいでは何も変わらない」</div>", "ctxHtml": "<div class=\"q\"></div>"}, {"type": "card", "uid": "u_bio_23", "id": "23-P2", "title": "おどろき（Observe）", "meta": "図: card_gairai_boom.png（新規・matplotlib・カードサイズ＝外来種が急に増え在来種が減っていく数量の変化だけ。「つり合いを崩す」という説明ラベルはまだ載せない・印なし）", "screenHtml": "<div class=\"q\">外来種には、その場所での天敵がいないことが多い。</div>\n<div class=\"q\">だから、数をおさえるものがなく、爆発的に増えていく。</div>\n<div class=\"q\">増えた外来種は、もとからいた在来種を食べたり、すみかをうばったりする。</div>\n<div class=\"q\">池にいたメダカやフナは、どんどん減っていくんだ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_23", "id": "23-P3", "title": "たね明かし（Explain）", "meta": "", "screenHtml": "<div class=\"q\">食物網は、食べる・食べられるの関係が、あみの目のようにつながっている。</div>\n<div class=\"q\">長い時間をかけて、その数のつり合いがとれている。</div>\n<div class=\"q\">そこへ人間が外から1種類持ちこむと、そのつり合いが大きくかたむいてしまう。</div>\n<div class=\"q\">そして、外来種だけじゃない。人間が生態系にあたえる影響は、どれも「つり合いをくずす」という1つの話でつながっている。今回は、それを見にいくよ。</div>", "ctxHtml": "<div class=\"li\">---</div>"}, {"type": "card", "uid": "u_bio_23", "id": "23-T1", "title": "人間の影響は、ぜんぶ「つり合いをくずす」話", "meta": "（種別: 見取り図の先出し／図: card_balance_human.png 新規・カードサイズ＝てんびんの片側に「生態系のつり合い（食物網・炭素の循環）」、人間の手が外来種・二酸化炭素・酸性雨のおもりをのせて傾ける模式図・用語カード付き・印なし）", "screenHtml": "<div class=\"q\">外来種、地球温暖化、酸性雨……人間が生態系にあたえる影響は、名前がたくさんあって、ばらばらに見える。</div>\n<div class=\"q\">でも、根っこは1つ。ぜんぶ「生態系のつり合いをくずす」話なんだ。</div>\n<div class=\"q\">食物網や炭素の循環は、長い時間をかけてつり合いがとれている。そこへ人間が横から手を出すと、そのつり合いがかたむく。</div>\n<div class=\"q\">この1本の見方で読むと、ばらばらだった言葉が、つながって見えてくるよ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_23", "id": "23-T2", "title": "外来種——人が持ちこんで住みついた生きもの", "meta": "（種別: 概念／図なし・P2のcard_gairai_boomを振り返りに再掲可）", "screenHtml": "<div class=\"q\">もともとその場所にいなかったのに、人間の活動で持ちこまれて住みついた生きものを<b>外来種</b>という。</div>\n<div class=\"q\">外来種には、その土地での天敵がいないことが多い。だから数をおさえるものがなく、爆発的に増えることがある。</div>\n<div class=\"q\">増えた外来種は、もとからいた<b>在来種</b>を食べたり、えさやすみかをうばったりする。</div>\n<div class=\"q\">こうして、長い時間かけてできた食物網のつり合いが、大きくかたむいてしまうんだ。</div>\n<details class=\"col\"><summary>身近な外来種を見る</summary><div class=\"colbody\"><div class=\"q\">日本の池や川にいるブラックバスやアメリカザリガニ、アライグマ、セイヨウタンポポも外来種。</div>\n<div class=\"q\">もともと日本にはいなかったのに、人が持ちこんで住みついた。</div>\n<div class=\"q\">見なれた生きものの中にも、外から来たものがまざっているんだ。</div></div></details>", "ctxHtml": "<div class=\"q\"></div>"}, {"type": "card", "uid": "u_bio_23", "id": "23-T3", "title": "地球温暖化——二酸化炭素が増えて気温が上がる", "meta": "（種別: 概念／図: card_carbon_warming.png 新規・カードサイズ＝炭素の循環の輪（光合成で吸う⇄呼吸で出す）に、化石燃料・森林伐採から二酸化炭素が余分に足される矢印。出口過剰の模式図・印なし）", "screenHtml": "<div class=\"q\">石油や石炭などの化石燃料を燃やすと、二酸化炭素が出る。森林を切ると、光合成で二酸化炭素を吸う力がへる。</div>\n<div class=\"q\">どちらも、空気中の二酸化炭素を増やすほうにはたらく。</div>\n<div class=\"q\">炭素の循環では、光合成で吸う量と、呼吸などで出る量がつり合っていた。そこへ人間が二酸化炭素を出しすぎると、輪のバランスがくずれる。</div>\n<div class=\"q\">二酸化炭素などが増えると、地球全体の平均気温が少しずつ上がる。これが<b>地球温暖化</b>なんだ。</div>\n<details class=\"col\"><summary>なんで二酸化炭素で気温が上がるの？</summary><div class=\"colbody\"><div class=\"q\">二酸化炭素などの気体には、地面から宇宙へにげる熱の一部を、とどめるはたらきがある（温室効果）。</div>\n<div class=\"q\">ちょうど、ふとんが体の熱をにがさないのと似ている。</div>\n<div class=\"q\">この気体が増えると、にげる熱がへって、地球の気温が上がっていく——というしくみだよ。</div></div></details>", "ctxHtml": "<div class=\"q\"></div>"}, {"type": "card", "uid": "u_bio_23", "id": "23-Q1", "title": "確認クイズ・セット1（外来種・温暖化・酸性雨の見分け・T3のあと・3問の類題・すべて既存流用・4択）", "meta": "", "screenHtml": "<div class=\"li\">- Q1 [既存・入門] もともとその地域にいなかったのに、人間の活動によって持ちこまれて住みついた生物を何というか。 → <b>外来種(外来生物)</b>（選: 外来種(外来生物)／在来種／分解者／生産者）〔L1906〕</div>\n<div class=\"li\">- Q2 [既存・入門] 二酸化炭素などの気体が増えることで、地球全体の平均気温が少しずつ上がっていく現象を何というか。 → <b>地球温暖化</b>（選: 地球温暖化／酸性雨／赤潮／食物連鎖）〔L1910〕</div>\n<div class=\"li\">- Q3 [既存・入門] 工場や自動車から出る排気ガスなどが原因で、雨が酸性に変化する現象を何というか。 → <b>酸性雨</b>（選: 酸性雨／地球温暖化／オゾン層の破壊／赤潮）〔L1909〕</div>", "ctxHtml": "<div class=\"li\">※3問とも「人間が生態系に起こす問題を、説明から名前で選ぶ」junior同型・同難度でそろえた類題セット。名前のにた用語（在来種／赤潮など）から選び分けるので4択のまま（憲法4.7条の例外＝内容が選び分けを要求する時）。</div>"}, {"type": "card", "uid": "u_bio_23", "id": "23-T4", "title": "酸性雨や赤潮も——つり合いをくずす仲間", "meta": "（種別: 概念／図なし）", "screenHtml": "<div class=\"q\">人間の影響は、外来種と温暖化のほかにもある。</div>\n<div class=\"q\">工場や自動車の排気ガスがとけて、雨が強い酸性になることがある。これが<b>酸性雨</b>。森林を枯らしたり、湖の生きものに害をあたえたりする。</div>\n<div class=\"q\">生活排水などで海の栄養分が増えすぎると、プランクトンが大発生して海が赤くなり、魚や貝が死ぬことがある。これが<b>赤潮</b>。</div>\n<div class=\"q\">名前はちがっても、どれも「生態系のつり合いをくずす」仲間として整理できるんだ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_23", "id": "23-T5", "title": "保全と自然浄化——つり合いをもどす力と、その限り", "meta": "（種別: 概念／図なし）", "screenHtml": "<div class=\"q\">くずれかけたつり合いを、できるだけこわさず、もどす。そのための人間側の工夫が<b>保全</b>。</div>\n<div class=\"q\">生態系には、もともと「もどす力」がある。よごれた水を、生きもののはたらきで少しずつきれいにしていく——これが<b>自然浄化</b>。</div>\n<div class=\"q\">でも、その力にも限りがある。人間がよごしすぎると、もどす力が追いつかない。</div>\n<div class=\"q\">だから、つり合いをくずしすぎない工夫が、人間の側にも出てくる、というわけ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_23", "id": "23-T6", "title": "3R——ごみや資源の使いすぎをへらす3つの工夫", "meta": "（種別: 概念／図なし）", "screenHtml": "<div class=\"q\">保全のための、身近でできる工夫が<b>3R</b>。ごみや資源の使いすぎをへらす、3つの考え方だよ。</div>\n<div class=\"q\">・リデュース……ごみそのものをへらす</div>\n<div class=\"q\">・リユース……くり返し使う</div>\n<div class=\"q\">・リサイクル……資源にもどして、もう一度使う</div>\n<div class=\"q\">どれも、限りある資源とつり合いを、大事に使うための工夫なんだ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_23", "id": "23-Q2", "title": "確認クイズ・セット2（つり合いを崩す例と、もどす力・工夫のことば・T6のあと・3問の類題・すべて既存流用・4択）", "meta": "", "screenHtml": "<div class=\"li\">- Q1 [既存・入門] 海や湖で栄養分が増えすぎてプランクトンが大量発生し、水の色が変わって魚などが死ぬことがある。このうち海で赤っぽくなる現象を何というか。 → <b>赤潮</b>（選: 赤潮／酸性雨／オゾン層破壊／食物網）〔L1913〕</div>\n<div class=\"li\">- Q2 [既存・入門] 自然界で生物のはたらきによって、よごれた水がきれいになっていくことを何というか。 → <b>自然浄化</b>（選: 自然浄化／光合成／物質循環の停止／富栄養化）〔L1914〕</div>\n<div class=\"li\">- Q3 [既存・入門] 人間の活動が生態系にあたえる影響を減らすため、限りある資源をくり返し使う取り組みを何というか。 → <b>リサイクル(再利用)</b>（選: リサイクル(再利用)／食物連鎖／自然浄化／光合成）〔L1916〕</div>", "ctxHtml": "<div class=\"li\">※3問とも同genre・junior・4択の用語識別でそろえた類題。T4（赤潮）とT5（自然浄化・保全）で出てきた言葉を、説明から名前で選ぶ同型3連。</div>\n<div class=\"li\">---</div>"}, {"type": "check", "uid": "u_bio_23", "id": "u_bio_23-確認1", "textHtml": "<b>確認クイズ set2 の組み直し</b>: カーネルは set2 を「外来種の問題＋森林の役割（mid帯）」と想定。しかし mid帯の該当問題は形式（外来種1907＝4択／森林1912＝○✕）と難度が割れ、真の類題（憲法4.2条）にならない。そこで <b>junior4択の用語識別3連（赤潮／自然浄化／リサイクル）</b> に組み直した。この差し替えでよいか。（set1＝外来種/温暖化/酸性雨 はカーネル想定どおり junior4択で実在＝そのまま採用）"}, {"type": "check", "uid": "u_bio_23", "id": "u_bio_23-確認2", "textHtml": "<b>図版3枚（すべて matplotlib 予定）</b>: card_gairai_boom（P2・数量変化のみ）／card_balance_human（T1・てんびん見取り図）／card_carbon_warming（T3・炭素の輪＋出口過剰）。この3枚の作図でよいか（外来種は著作権のため写真でなくシルエット模式図）。"}, {"type": "check", "uid": "u_bio_23", "id": "u_bio_23-確認3", "textHtml": "<b>温暖化コラムの踏み込み</b>: T3コラムで「温室効果＝地面から宇宙へにげる熱をとどめる／ふとんの比喩」まで触れた。温室効果は東書中3で扱う範囲だが、この説明の深さ・比喩が中学向けとして適切か（本線・確認クイズでは温室効果のしくみは問わない＝コラムどまり・憲法3.5条）。 ---"}];
const KEY = "rika2_review_" + "\u751f\u7269B5 \u4e2d3\u9032\u5316\u751f\u614b\u7cfb(19\u9032\u5316/20\u751f\u614b\u7cfb/21\u98df\u7269\u9023\u9396/22\u70ad\u7d20\u5faa\u74b0/23\u4eba\u9593\u306e\u5f71\u97ff)";
let res = {}; try{ res = JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){}
let pos = +(localStorage.getItem(KEY+"_pos")||0);
const tappable = ITEMS.filter(i=>i.type!=="unit").length;
function save(){ localStorage.setItem(KEY, JSON.stringify(res)); localStorage.setItem(KEY+"_pos", pos); }
function doneCount(){ return Object.keys(res).length; }
function header(){
  document.getElementById("hcount").textContent = doneCount()+" / "+tappable;
  document.getElementById("hbar").style.width = (100*doneCount()/tappable)+"%";
}
function go(d){ pos=Math.max(0,Math.min(ITEMS.length,pos+d)); save(); render(); window.scrollTo(0,0); }
function mark(id, verdict){
  const t=[...document.querySelectorAll(".tag.on")].map(x=>x.textContent);
  const note=(document.getElementById("note")||{}).value||"";
  res[id]={v:verdict,tags:t,note:note}; save(); go(1);
}
function render(){
  header();
  const st=document.getElementById("stage");
  if(pos>=ITEMS.length){ st.innerHTML=exportView(); return; }
  const it=ITEMS[pos];
  const nav='<div class="nav"><button onclick="go(-1)">← まえへ</button><button onclick="go(1)">とばす →</button></div>';
  if(it.type==="unit"){
    st.innerHTML='<div class="unitcard"><div class="uid">'+it.uid+'</div><div class="big">'+it.name+'</div>'+
    '<div class="summary">カード '+it.n+'枚 ＋ 確認 '+it.nc+'件。<br>読む→ピンとくれば ◎OK、引っかかれば ✏。<br>迷ったら ⏭あとで（いつでも戻れる）。</div>'+
    '<div class="btns"><button class="b-ok" onclick="go(1)">はじめる</button></div></div>'+nav;
    return;
  }
  const prev=res[it.id];
  const badge=prev?('<span style="color:var(--gold)">［回答済: '+prev.v+'］</span>'):'';
  if(it.type==="card"){
    st.innerHTML='<div class="card"><div class="uid">'+it.uid+'｜【'+it.id+'】'+badge+'</div>'+
    '<h2>'+it.title+'</h2><div class="meta">'+it.meta+'</div>'+ it.screenHtml +
    (it.ctxHtml?('<div class="ctx">'+it.ctxHtml+'</div>'):'')+
    '<div class="btns">'+
    '<button class="b-ok" onclick="mark(\''+it.id+'\',\'OK\')">◎ OK</button>'+
    '<button class="b-warn" onclick="openWarn()">✏ 気になる</button>'+
    '<button class="b-skip" onclick="mark(\''+it.id+'\',\'あとで\')">⏭</button></div>'+
    '<div class="tags" id="tags">'+
    ['ことばが大人','ことばが幼い','教室でこう言わない','理科的にあやしい','長い','その他']
      .map(t=>'<button class="tag" onclick="this.classList.toggle(\'on\')">'+t+'</button>').join('')+'</div>'+
    '<textarea id="note" placeholder="ひとこと（任意・1語でもOK）"></textarea>'+
    '<button class="send" id="send" onclick="mark(\''+it.id+'\',\'気になる\')">この内容で送る</button>'+nav;
  } else {
    st.innerHTML='<div class="card"><div class="uid">'+it.uid+'｜確認 '+badge+'</div>'+
    '<div class="q">'+it.textHtml+'</div>'+
    '<div class="btns">'+
    '<button class="b-yes" onclick="mark(\''+it.id+'\',\'はい\')">はい</button>'+
    '<button class="b-no" onclick="mark(\''+it.id+'\',\'いいえ\')">いいえ</button>'+
    '<button class="b-skip" onclick="mark(\''+it.id+'\',\'あとで\')">⏭</button></div>'+
    '<textarea id="note" class="open" placeholder="補足（任意）"></textarea>'+nav;
  }
}
function openWarn(){
  document.getElementById("tags").classList.add("open");
  document.getElementById("note").classList.add("open");
  document.getElementById("send").classList.add("open");
}
function exportView(){
  const out={sheet:"\u751f\u7269B5 \u4e2d3\u9032\u5316\u751f\u614b\u7cfb(19\u9032\u5316/20\u751f\u614b\u7cfb/21\u98df\u7269\u9023\u9396/22\u70ad\u7d20\u5faa\u74b0/23\u4eba\u9593\u306e\u5f71\u97ff)",done:doneCount(),total:tappable,answers:res};
  const s=JSON.stringify(out,null,1);
  const warn=Object.entries(res).filter(([k,v])=>v.v==="気になる"||v.v==="いいえ").length;
  const esc=s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
  return '<div class="unitcard"><div class="big">おつかれさまでした 🎉</div>'+
  '<div class="summary">回答 '+doneCount()+'/'+tappable+'（✏気になる・いいえ: '+warn+'件）<br>'+
  '<b>下の枠の中身が結果のすべて</b>です。「📋 結果をコピー」→ Claudeに貼り付けで回収完了。<br>'+
  '<span style="color:var(--warn)">※このHTMLファイル自体には回答は保存されません（回答はこのブラウザの中）。必ずコピーか💾で外に出してください。</span></div>'+
  '<button class="exbtn" style="background:var(--gold);color:#241a03" onclick="navigator.clipboard.writeText(document.getElementById(\'exp\').value).then(()=>this.textContent=\'✓ コピーしました（Claudeに貼ってください）\')">📋 結果をコピー</button>'+
  '<button class="exbtn" style="background:#2a3245;color:#e8ecf5" onclick="dl()">💾 review_result.json で保存</button>'+
  '<textarea id="exp" class="open done" readonly>'+esc+'</textarea>'+
  '<div class="nav"><button onclick="go(-1)">← もどる</button><button onclick="pos=0;go(0)">最初から見直す</button></div></div>';
}
function dl(){
  const b=new Blob([document.getElementById("exp").value],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(b);
  a.download="review_result.json"; a.click();
}
render();
</script></body></html>
