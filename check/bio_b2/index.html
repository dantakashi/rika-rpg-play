<style>

<script>
const ITEMS = [{"type": "unit", "uid": "u_bio_05", "name": "動物の分類", "n": 12, "nc": 4}, {"type": "card", "uid": "u_bio_05", "id": "u_bio_05-R", "title": "レディネスチェック", "meta": "", "screenHtml": "<div class=\"li\">- 【05-R1】[既存・入門] ホウセンカのなかまのように、子葉が2枚の植物を何というか。 → <b>双子葉類</b>（選: 双子葉類／単子葉類／裸子植物／コケ植物）　＝quiz-engine.js 155行</div>\n<div class=\"li\">- 【05-R2】[既存・入門] トウモロコシやイネのように、子葉が1枚の植物を何というか。 → <b>単子葉類</b>（選: 裸子植物／単子葉類／双子葉類／シダ植物）　＝quiz-engine.js 156行</div>\n<div class=\"li\">- 【05-R3】[既存・入門] 双子葉類の葉に多く見られる、網の目のように広がった葉脈を何というか。 → <b>網状脈</b>（選: 平行脈／輪状脈／放射脈／網状脈）　＝quiz-engine.js 170行</div>\n<div class=\"q\">つまずいたときの誘いコピー（弱点表示ではなく招待状のトーン・憲法第2.5条・2.6条＝楽アピールで誘わない）:</div>\n<div class=\"q\">「<b>植物のなかま分けを見なおしておくと、このあとの動物のなかま分けがつながりやすくなるよ</b>」→ 該当の教えるカードへのボタンがそっと光る</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_05", "id": "05-P1", "title": "予想（Predict）", "meta": "どれを選んでも正誤なし・「なるほど」で次へ", "screenHtml": "<div class=\"q\">クジラは、海の中をおよいで、体も魚みたいな形をしている。</div>\n<div class=\"q\">じゃあ、クジラは魚のなかまだと思う？</div>\n<div class=\"q\">「魚のなかま」／「魚とはちがうなかま」／「見たことはあるけど、分からない」</div>", "ctxHtml": "<div class=\"q\"></div>"}, {"type": "card", "uid": "u_bio_05", "id": "05-P2", "title": "おどろき（Observe）", "meta": "図: cimg/u_bio_05/p2_whale.png（新規・AI生成＝クジラが海をおよぐイメージ。答え＝肺呼吸や乳育ては絵に出さない・水面での息つぎも描かない＝驚きを先にばらさない）", "screenHtml": "<div class=\"q\">じつは、クジラは魚じゃない。</div>\n<div class=\"q\">魚のなかまなら、えらで呼吸して、たまごを産む。</div>\n<div class=\"q\">でもクジラは、<b>肺</b>で息をする。だから、ときどき水面まで息つぎに上がってくる。</div>\n<div class=\"q\">しかも、子どもを<b>乳</b>で育てる。これは、ヒトと同じなかま——哺乳類の特徴なんだ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_05", "id": "05-P3", "title": "たね明かし（Explain）", "meta": "", "screenHtml": "<div class=\"q\">海にいて、魚みたいな形でも、クジラは魚じゃない。</div>\n<div class=\"q\">見た目じゃなく、<b>体のしくみ</b>でなかまが決まるからだよ。</div>\n<div class=\"q\">動物も、植物と同じように、体のつくりでなかま分けする。</div>\n<div class=\"q\">まず、背骨があるか/ないか。背骨があるなかまは、<b>呼吸のしかた・子の生まれ方・体温・体の表面</b>を手がかりに、5つに分かれる。</div>\n<div class=\"q\">今回は、その仕分け方を1つずつ見ていくよ。</div>", "ctxHtml": "<div class=\"li\">---</div>"}, {"type": "card", "uid": "u_bio_05", "id": "05-T1", "title": "1回目の分け方——背骨があるか、ないか", "meta": "（種別: 概念／図: card_backbone_split.png 新規・matplotlib・カードサイズ＝背骨がある代表数体／ない代表数体を左右に分けた1本目の線・印なし）", "screenHtml": "<div class=\"q\">動物を仕分ける、1回目の分け方から。</div>\n<div class=\"q\">体の中に、<b>背骨</b>があるか、ないか。これで大きく2つに分かれる。</div>\n<div class=\"q\">背骨があるなかまを<b>脊椎動物（せきついどうぶつ）</b>という。魚・カエル・ヘビ・ハト・イヌ・ヒト——みんな背中に骨が通っている。</div>\n<div class=\"q\">背骨がないなかまは<b>無脊椎動物（むせきついどうぶつ）</b>。こん虫・イカ・ミミズがそう。</div>\n<div class=\"q\">まずはこの分け方で、動物はすっぱり2つに分かれるんだ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_05", "id": "05-T2", "title": "背骨があるなかまは、5つに分かれる", "meta": "（種別: 概念／図: card_vertebrate_5groups.png 新規・matplotlib・カードサイズ＝5グループ名と代表動物の一覧・呼吸/体温などの決め手はまだ載せない・印なし）", "screenHtml": "<div class=\"q\">背骨があるなかま（脊椎動物）を、さらに5つに分ける。</div>\n<div class=\"q\"><b>魚類</b>（サバ・メダカ）、<b>両生類</b>（カエル・イモリ）、<b>は虫類</b>（トカゲ・ヘビ・カメ）、<b>鳥類</b>（ハト・スズメ）、<b>哺乳類</b>（イヌ・クジラ・ヒト）。</div>\n<div class=\"q\">この5つの名前が、仕分けの土台になる。</div>\n<div class=\"q\">見た目はバラバラだけど、次のカードから、何を手がかりに分けるのかを1つずつ見ていくよ。</div>\n<details class=\"col\"><summary>鳥は恐竜のなかま？を見る</summary><div class=\"colbody\"><div class=\"q\">鳥類は、大むかしの恐竜から分かれてきたなかま、と考えられている。</div>\n<div class=\"q\">骨のつくりをくらべると、鳥と、肉食恐竜のなかまはよく似ている。羽毛のあとが見つかった恐竜の化石もある。</div>\n<div class=\"q\">だから「恐竜はぜんぶほろびた」とは言い切れない。空をとんでいる鳥が、恐竜の生き残り——そう見ると、公園のハトも少しちがって見えるかもしれない。</div></div></details>", "ctxHtml": "<div class=\"q\"></div>"}, {"type": "card", "uid": "u_bio_05", "id": "05-T3", "title": "手がかり①——呼吸のしかた", "meta": "（種別: 概念／図: card_breathing.png 新規・matplotlib・カードサイズ＝魚のえら／陸の動物の肺／両生類の「子はえら・親は肺と皮ふ」の対比・印なし）", "screenHtml": "<div class=\"q\">仕分けの手がかり、1つ目は<b>呼吸のしかた</b>。</div>\n<div class=\"q\">水の中でくらす魚類は、<b>えら</b>で呼吸する。えらで、水にとけた酸素を取り入れるんだ。</div>\n<div class=\"q\">陸でくらす は虫類・鳥類・哺乳類は、<b>肺</b>で呼吸する。</div>\n<div class=\"q\">とくべつなのは両生類。カエルは、子（オタマジャクシ）のときは水の中で<b>えら</b>、親になると<b>肺と皮ふ</b>で呼吸する。育つとちゅうで、呼吸のしかたが変わるんだ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_05", "id": "05-T4", "title": "手がかり②——子の生まれ方", "meta": "（種別: 概念／図なし）", "screenHtml": "<div class=\"q\">手がかりの2つ目は、<b>子の生まれ方</b>。</div>\n<div class=\"q\">たまごで生まれるのが<b>卵生（らんせい）</b>。親と似たすがたで生まれるのが<b>胎生（たいせい）</b>。</div>\n<div class=\"q\">5つのなかまのうち、<b>胎生は哺乳類だけ</b>。あとの4つ（魚類・両生類・は虫類・鳥類）はぜんぶ卵生だ。</div>\n<div class=\"q\">導入で見たクジラを思い出してみよう。子どもを産んで、乳で育てる＝胎生。だからクジラは、海にいても哺乳類なんだ。これが、見た目にだまされないための、注目する点だよ。</div>\n<details class=\"col\"><summary>たまごを産む哺乳類？を見る</summary><div class=\"colbody\"><div class=\"q\">「哺乳類＝胎生」と習うけど、じつは例外がいる。オーストラリアにすむ<b>カモノハシ</b>は、哺乳類なのに<b>たまごを産む</b>。</div>\n<div class=\"q\">でも、生まれた子は親の乳で育つ。だからカモノハシは哺乳類のなかま。</div>\n<div class=\"q\">自然は、教科書のきれいな区切りをときどきはみ出す。それでも「乳で育てる」という哺乳類の芯は、ちゃんと通っているんだ。</div></div></details>", "ctxHtml": "<div class=\"q\"></div>"}, {"type": "card", "uid": "u_bio_05", "id": "05-T5", "title": "手がかり③——体温と体の表面（そして1枚の表へ）", "meta": "（種別: 概念＋まとめ／図: card_animal_dichotomy.png 新規・matplotlib・カードサイズ＝背骨あり/なし→脊椎動物5グループを、呼吸・子の生まれ方・体温・体の表面の4つの手がかりでならべた分類表・印なし）", "screenHtml": "<div class=\"q\">最後の手がかりは、<b>体温</b>と<b>体の表面</b>。</div>\n<div class=\"q\">まわりの温度がかわると体温もかわるなかまを<b>変温動物</b>（魚類・両生類・は虫類）、まわりがかわっても体温をほぼ一定にたもつなかまを<b>恒温動物</b>（鳥類・哺乳類）という。</div>\n<div class=\"q\">体の表面も手がかりになる。魚類とは虫類は<b>うろこ</b>、両生類は<b>しめった皮ふ</b>、鳥類は<b>羽毛</b>、哺乳類は<b>毛</b>。</div>\n<div class=\"q\">ここまでの手がかりを1枚の表にまとめたのが、この図。呼吸・子の生まれ方・体温・体の表面——4つの手がかりを横に読むと、5つのなかまが見分けられる。これが、動物を仕分けるしくみだよ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_05", "id": "05-Q1", "title": "確認クイズ・セット1（脊椎動物の見分けの節目・3問の類題・すべて既存流用・入門4択）", "meta": "", "screenHtml": "<div class=\"li\">- 【05-Q1a】[既存・入門] 子はえら、親は肺で呼吸する動物は？ → <b>両生類</b>（選: 両生類／魚類／は虫類／哺乳類）　＝quiz-engine.js 207行（手がかり①呼吸）</div>\n<div class=\"li\">- 【05-Q1b】[既存・入門] 親と似たすがたの子を産み、乳で育てる『胎生』の動物のなかまはどれか。 → <b>哺乳類</b>（選: は虫類／魚類／哺乳類／鳥類）　＝quiz-engine.js 209行（手がかり②子の生まれ方）</div>\n<div class=\"li\">- 【05-Q1c】[既存・入門] うろこでおおわれ、陸上に殻のある卵をうむなかまはどれですか。 → <b>は虫類</b>（選: 哺乳類／は虫類／両生類／鳥類）　＝quiz-engine.js 208行（手がかり③体の表面＋卵生）</div>", "ctxHtml": "<div class=\"li\">※3問とも「呼吸・子の生まれ方・体の表面という手がかりから、どのなかまかを答える」入門4択の同型・同難度でそろえた類題セット。選択肢はすべてなかまの名前（魚類・両生類・は虫類・鳥類・哺乳類）で形式もそろえた（憲法4.6条）。この節目は「どのなかまか」を選び分けるのが本題なので4択のまま（憲法4.7条の例外＝内容が選び分けを要求する時）。</div>"}, {"type": "card", "uid": "u_bio_05", "id": "05-T6", "title": "背骨がないなかま——節足動物と軟体動物", "meta": "（種別: 概念／図: card_invertebrate_compare.png 新規・matplotlib・カードサイズ＝節足動物［体が外骨格でおおわれ、あしに節がある］と軟体動物［内臓が外とう膜に包まれる］の対比・印なし）", "screenHtml": "<div class=\"q\">1回目に分けた、もう一方——背骨がないなかま（無脊椎動物）も見ておこう。</div>\n<div class=\"q\">数がとても多いけど、代表は2つ。</div>\n<div class=\"q\"><b>節足動物</b>は、体の外側がかたい<b>外骨格</b>でおおわれ、あしに<b>節（ふし）</b>がある。こん虫・エビ・カニ・クモがなかま。</div>\n<div class=\"q\"><b>軟体動物</b>は、内臓が<b>外とう膜</b>というやわらかいまくに包まれている。イカ・タコ・貝がなかま。背骨も外骨格もない。</div>\n<div class=\"q\">背骨のあるなかまも、ないなかまも、けっきょくは「体のつくりを手がかりに、なかま分けする」。植物のときと、やっていることは同じなんだ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_05", "id": "05-Q2", "title": "確認クイズ・セット2（無脊椎動物の節目・応用4択・すべて既存流用）", "meta": "⚠ **セット構成が未確定＝オーナー判断待ち（§5.5-2）。真の類題3連が組めていない**", "screenHtml": "<div class=\"li\">- 【05-Q2a】[既存・応用] こん虫やエビ・カニのように、からだやあしに節があり外骨格をもつ無脊椎動物のなかまを何というか。 → <b>節足動物</b>（選: 節足動物／軟体動物／環形動物／刺胞動物）　＝quiz-engine.js 232行</div>\n<div class=\"li\">- 【05-Q2b】[既存・応用] イカやタコ、貝のように内臓が外とう膜でつつまれた無脊椎動物のなかまを何というか。 → <b>軟体動物</b>（選: 軟体動物／節足動物／環形動物／刺胞動物）　＝quiz-engine.js 233行</div>\n<div class=\"li\">- 【05-Q2c】[既存・応用] こん虫類のからだは、おもにいくつの部分に分かれているか。 → <b>頭部・胸部・腹部の3つ</b>（選: 頭部・腹部の2つ／1つ／頭部・胸部・腹部・尾部の4つ／頭部・胸部・腹部の3つ）　＝quiz-engine.js 234行</div>\n<div class=\"q\">  ⚠ <b>【05-Q2c】は類題破れ（憲法4.2条＝概念ちがい）＝そのまま採用しない前提の&quot;仮置き&quot;。オーナー判断（§5.5-2）が済むまで確定版に含めない。</b> Q2a/Q2b は「体のつくり→<b>なかまの名</b>（分類名）」を問い選択肢も分類名でそろうが、Q2c は「こん虫の体が<b>いくつの部分</b>に分かれるか」という<b>別概念</b>を問い、選択肢も「頭部・胸部・腹部の3つ」等の<b>部位数フレーズ</b>で形式が異質。さらに Q2c が問う「頭部・胸部・腹部の3つ」は【05-T6】が教えていない内容（T6は外骨格・節・外とう膜のみ）で、教えた範囲の類題にもなっていない。<b>この場でQ2cを勝手に入門へ替えたり削ったりせず、判断が要る点として§5.5-2に上げる。</b></div>", "ctxHtml": "<div class=\"li\">※この節目は少し難しめ。冒頭に <b>「今回は少し難しめ！ がんばって！」</b> を表示（憲法4.7条）。<b>当初は「3問とも同型・同難度の類題セット」と書いていたが、敵対検収で類題破れが確定した</b>（このあと）。<b>Q2a／Q2b は真の類題</b>（どちらも「体のつくりの説明→無脊椎動物のなかま名を答える」・選択肢がすべて分類名＝節足動物／軟体動物／環形動物／刺胞動物でそろう・憲法4.2/4.6条を満たす）。<b>しかし Q2c は概念も形式もちがう</b>（後述）ため、このセットは真の3連になっていない。<b>結論の確定はオーナーに回す（§5.5-2）</b>。難度そのもの（入門ではなく応用でそろえた点）は、既存プールに入門の節足/軟体同型がないための選択で、憲法4.7条の難度予告で受ける。</div>\n<div class=\"li\">※設計メモ（敵対検収・2026-07-14反映）: セット2は既存プールの都合で<b>応用（senior）</b>でそろえた（入門プールに『節足動物か軟体動物か』の同型がなく、既存の同型類題は応用にまとまっているため）。カーネルは「脊椎動物クイズと形式・難度をそろえる（入門）」と書いていたが、DBを実測すると入門の節足/軟体の同型は組めない。<b>難度の選択（応用）自体は、実在の同型類題を原文どおり引く方が無理に新規で入門をでっち上げるより誠実</b>と判断し、憲法4.7条の予告で受けた。<b>ただし『同型3連』は成立していない</b>——quiz-engine.js の senior・bio_human・無脊椎系を実測すると、「体のつくり→分類名（なかま名）を答える／選択肢＝分類名」型は Q2a（節足動物・232行）と Q2b（軟体動物・233行）の<b>2問しか実在しない</b>（234行は「部位数」を問う別概念、235行「外骨格を何というか」は&quot;構造の名&quot;を答える別概念で、いずれもQ2a/Q2bの類題ではない）。したがって<b>プールから真の同型第3問は取れない</b>。この空きを Q2c（部位数）で埋めていたのが類題破れの正体。<b>是正の選択肢はオーナー判断（§5.5-2）</b>＝(a)無脊椎の分類を問う応用3連を新規に書き下ろす／(b)セット2をQ2a・Q2bの<b>2問構成</b>にする。</div>\n<div class=\"li\">---</div>"}, {"type": "check", "uid": "u_bio_05", "id": "u_bio_05-確認1", "textHtml": "<b>カーネル T4 の分割（子の生まれ方を独立カードに）</b>: カーネルは「子の生まれ方＋体温＋体表」を1枚（T4）にしていましたが、1カード1軸（憲法3.3条）に沿って <b>T4「子の生まれ方」／T5「体温・体表＋まとめ表」の2枚</b>に割りました。子の生まれ方を独立させたのは、導入の「クジラ＝胎生・乳で育てる」驚きを回収する決め手だからです。この分割でよいですか。（骨格は T1〜T6 の6枚）"}, {"type": "check", "uid": "u_bio_05", "id": "u_bio_05-確認2", "textHtml": "<b>確認クイズ・セット2は「真の類題3連」が組めていません＝構成のご判断が要ります（敵対検収で確定）</b>: - <b>何が起きているか</b>: 無脊椎の確認クイズを応用3問で置きましたが、Q2a（節足動物）とQ2b（軟体動物）は「体のつくり→なかまの名を答える／選択肢＝分類名」でそろった真の類題なのに対し、<b>Q2c（こん虫の体はいくつの部分に分かれるか）は概念も形式もちがう別問題</b>でした（選択肢が「頭部・胸部・腹部の3つ」等の部位数フレーズ・憲法4.2条の概念ちがい）。さらにQ2cの内容（頭部・胸部・腹部の3つ）は【05-T6】で教えていません（T6は外骨格・節・外とう膜まで）。 - <b>なぜ第3問を差し替えなかったか</b>: quiz-engine.js を実測すると、Q2a/Q2bと同型（体のつくり→分類名）の応用問題は<b>この2問しか実在せず</b>、プールから真の同型第3問を取れないためです（234行=部位数・別概念、235行=「外骨格を何というか」＝構造の名で、どちらも類題ではない）。勝手にQ2cを入門へ替えたり削ったりはしていません。 - <b>ご判断ください（どちらか）</b>: (a) 無脊椎の分類を問う<b>応用3連を新規に書き下ろす</b>（DBに1〜2問追加＝作問が発生）／(b) セット2を <b>Q2a・Q2bの2問構成</b>にする（新規作問なし・「2択×2問」ではなく「4択×2問」）。※現在は暫定でQ2cを仮置きしていますが、確定版には含めない前提です。 - なお難度（入門ではなく応用でそろえた点）自体は、入門プールに節足/軟体の同型がないための選択で、セット2冒頭に「今回は少し難しめ！」と予告しています（憲法4.7条）。両セットを入門にそろえ直す案が良ければ、それも(a)の書き下ろしで対応できます。"}, {"type": "check", "uid": "u_bio_05", "id": "u_bio_05-確認3", "textHtml": "<b>図版6点の作り方（AI 1点＋matplotlib 5点）</b>: P2のクジラだけ実物イメージ＝AI生成（cimg/u_bio_05/p2_whale.png）、残り5点（分類の線・一覧・対比・まとめ表）は数値・分類構造が意味を持つので matplotlib 自作、で進めてよいですか（憲法第7条の使い分け）。まとめ表 card_animal_dichotomy は「教える用＝印なし」で作ります。"}, {"type": "check", "uid": "u_bio_05", "id": "u_bio_05-確認4", "textHtml": "<b>コラム2点の内容</b>: T2に「鳥は恐竜のなかま？」（中学を超える理科の地平・第3.5条）、T4に「たまごを産む哺乳類＝カモノハシ」（カリキュラムの正直な但し書き）を、本線を汚さない折りたたみコラムで置きました。中3を天井にする方針の範囲内か、確認をお願いします（どちらも本線・確認クイズでは問いません）。 ---"}, {"type": "unit", "uid": "u_bio_06", "name": "細胞のつくり", "n": 11, "nc": 3}, {"type": "card", "uid": "u_bio_06", "id": "u_bio_06-R", "title": "レディネスチェック", "meta": "", "screenHtml": "<div class=\"li\">- 【06-R1】[既存・小学校] ホウセンカの体にある部分は？ → <b>根・くき・葉</b>（選: 根・くき・葉／羽・足・目／石・砂・水／火・音・光）</div>\n<div class=\"li\">- 【06-R2】[既存・小学校] 根の主なはたらきはどれですか？ → <b>水を吸う</b>（選: 日光を受ける／実を作る／花粉を作る／水を吸う）</div>\n<div class=\"li\">- 【06-R3】[既存・小学校] 植物も生き物としてしていることはどれ？ → <b>呼吸する</b>（選: 人と話す／歩いて移動する／発電する／呼吸する）</div>\n<div class=\"q\">つまずいたときの誘いコピー（弱点表示ではなく招待状のトーン・憲法第2.5条／第2.6条＝楽アピールで誘わない）:</div>\n<div class=\"q\">「<b>生き物のからだのつくりを思い出しておくと、このあとの「もっと小さく見た話」がつながりやすくなるよ</b>」→ 該当の教えるカードへのボタンがそっと光る</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_06", "id": "06-P1", "title": "予想（Predict）", "meta": "どれを選んでも正誤なし・「なるほど」で次へ／図なし", "screenHtml": "<div class=\"q\">生きものはぜんぶ、細胞という小さな部屋でできている。</div>\n<div class=\"q\">じゃあ、自分の体は、いくつの細胞でできてると思う？</div>\n<div class=\"q\">「数百くらい」／「数百万くらい」／「数十兆くらい」</div>", "ctxHtml": "<div class=\"q\"></div>"}, {"type": "card", "uid": "u_bio_06", "id": "06-P2", "title": "おどろき（Observe）", "meta": "図: cimg/u_bio_06/o_onion_micro.png（玉ねぎの皮を顕微鏡で見た像＝レンガのような部屋がびっしり並ぶ・答えの部品名は入れない）", "screenHtml": "<div class=\"q\">答えは、数十兆個。</div>\n<div class=\"q\">玉ねぎのうすい皮を1枚はがして顕微鏡でのぞくと、レンガみたいな部屋がびっしり並んでる。</div>\n<div class=\"q\">ヒトの体も同じで、この部屋が数十兆集まってできてるんだ。</div>\n<div class=\"q\">この部屋1個が、生きものをつくるいちばん小さな単位。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_06", "id": "06-P3", "title": "たね明かし（Explain）", "meta": "", "screenHtml": "<div class=\"q\">この小さな部屋を<b>細胞（さいぼう）</b>という。</div>\n<div class=\"q\">細胞をよく見ると、まん中に<b>核（かく）</b>があって、まわりを<b>細胞膜（さいぼうまく）</b>が包んでる。ここまでは植物も動物も同じ。</div>\n<div class=\"q\">ちがいは、植物だけが持ってる部品にある。</div>\n<div class=\"q\">部品名は覚えるより、まず「どっちが持ってるか」で仕分けると見えてくるよ。今回は、その分け方を見にいくよ。</div>", "ctxHtml": "<div class=\"li\">---</div>"}, {"type": "card", "uid": "u_bio_06", "id": "06-T1", "title": "細胞——生きものをつくる小さな部屋", "meta": "（種別: 概念・1軸=植物も動物も共通の部品／図: card_cell_common.png 新規・カードサイズ＝1個の細胞の模式図に核・細胞膜・細胞質だけ・植物専用の部品は描かない・印なし）", "screenHtml": "<div class=\"q\">生きものの体は、どれも細胞という小さな部屋が集まってできている。植物も動物も、そこは同じ。</div>\n<div class=\"q\">細胞を見ると、まん中に丸い<b>核</b>があって、そのまわりを<b>細胞膜</b>といううすい膜が包んでいる。膜の内側の、核以外のところを<b>細胞質（さいぼうしつ）</b>という。</div>\n<div class=\"q\">核・細胞膜・細胞質——この3つは、植物の細胞にも動物の細胞にもある。まずはここが「共通の部品」なんだ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_06", "id": "06-T2", "title": "核——細胞の中の目印", "meta": "（種別: 概念・1軸=核／図: cimg/u_bio_06/t2_stained_nucleus.png 新規・カードサイズ＝染色液で赤く染まった核が見える細胞の像・印なし）", "screenHtml": "<div class=\"q\">核は、細胞の中にふつう1個だけある丸い部品。</div>\n<div class=\"q\">そのままでは色がうすくて見えにくいけど、<b>酢酸カーミン液（さくさんカーミンえき）</b>という染色液をたらすと、核だけが赤くそまって、はっきり見える。</div>\n<div class=\"q\">だから顕微鏡で細胞を観察するときは、この染色液で核を染めてから見ることが多いんだ。核は、植物にも動物にもある共通の部品だよ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_06", "id": "06-T3", "title": "植物だけが持つ部品——ここで2つに分ける", "meta": "（種別: 概念・1軸=植物専用の線引き／図: card_cell_compare.png 新規・カードサイズ＝植物細胞と動物細胞の並置模式図・共通部品は同じ色／植物専用の部品は別の色でハイライト・印なし）", "screenHtml": "<div class=\"q\">ここが今回のいちばん大切なところ。植物の細胞だけが持っていて、動物の細胞にはない部品が3つある。</div>\n<div class=\"q\">・<b>細胞壁（さいぼうへき）</b>……細胞のいちばん外側をかこむ、じょうぶなかべ。</div>\n<div class=\"q\">・<b>葉緑体（ようりょくたい）</b>……緑色のつぶ。ここで光合成をする。</div>\n<div class=\"q\">・<b>液胞（えきほう）</b>……中に水や養分をためておく袋。</div>\n<div class=\"q\">動物の細胞には、この3つがない。だから「細胞壁・葉緑体・液胞があれば植物の細胞」と、2つに分けられるんだ。</div>\n<details class=\"col\"><summary>なんで植物だけ？</summary><div class=\"colbody\"><div class=\"q\">植物は動きまわらず、その場に立って生きている。だから、自分の体を支える固いかべ（細胞壁）がいる。動物は動いて動きまわるから、細胞をかたいかべで固めない。</div>\n<div class=\"q\">葉緑体は、光を受けて自分で栄養をつくる部品。植物は自分でごはんを作れるから持っている。動物は食べて栄養をとるので、葉緑体はいらない。</div>\n<div class=\"q\">「持っている／いない」には、こういう暮らし方のちがいが出ているんだ。</div></div></details>", "ctxHtml": "<div class=\"q\"></div>"}, {"type": "card", "uid": "u_bio_06", "id": "06-Q1", "title": "確認クイズ・セット1（共通部品と核の節目・T1／T2のあと・3問の類題・すべて新規下書き・○✕）", "meta": "", "screenHtml": "<div class=\"li\">- Q1 [新規] 核は、植物の細胞にも動物の細胞にもある。（○✕） → <b>○</b></div>\n<div class=\"li\">- Q2 [新規] 核は、そのままでは見えにくいので、染色液で染めて見やすくする。（○✕） → <b>○</b></div>\n<div class=\"li\">- Q3 [新規] 核は、1個の細胞の中にふつう10個くらい入っている。（○✕） → <b>✕</b>（ふつう1個）</div>", "ctxHtml": "<div class=\"li\">※3問とも「核・共通部品の性質」を問う同型・同難度の類題。この節目は覚えたことを確かめる「できた感」が目的なので2択（○✕）でそろえた（憲法第4.7条＝既定2択）。</div>\n<div class=\"li\">※設計メモ: 3問とも「核」1本にそろえた同概念セット（憲法第4.2条）。答えは○○✕で、すべて同じ側を押すと解けない配置にした（憲法第4.7条＝カン全通しを避ける）。教えたばかりの正しい中身（核は共通・染色液で染まる）を誤答として見せていない（憲法第4.3条）。既存プールに核を直接問う同概念×3の入門問がそろわなかったため新規で書き下ろした（quiz-engine.js の核関連はimageTap L1437・染色液4択 L1863/L2237・genetics系のみ＝同型3連が組めない）。</div>"}, {"type": "card", "uid": "u_bio_06", "id": "06-T4", "title": "部屋が集まって役割分担する——単細胞と多細胞", "meta": "（種別: 概念・1軸=細胞の集まり方／図: card_cell_organize.png 新規・カードサイズ＝細胞→組織→器官→個体の階層1本図・印なし）", "screenHtml": "<div class=\"q\">生きものには、たった1個の細胞で体ができているものもいる。ゾウリムシがそう。こういう生きものを<b>単細胞生物（たんさいぼうせいぶつ）</b>という。</div>\n<div class=\"q\">一方、ヒトや植物のように、たくさんの細胞が集まって体をつくっている生きものを<b>多細胞生物（たさいぼうせいぶつ）</b>という。</div>\n<div class=\"q\">多細胞生物では、細胞がただ集まっているだけじゃなくて、役割分担をしている。同じはたらきの細胞が集まって<b>組織（そしき）</b>になり、いくつかの組織が集まって<b>器官（きかん）</b>になり、器官が集まって1つの体（<b>個体</b>）になる。</div>\n<div class=\"q\">細胞 → 組織 → 器官 → 個体。小さな部屋から、体まで、この順で組み上がっているんだ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_06", "id": "06-Q2", "title": "確認クイズ・セット2（植物だけが持つ部品の線引きの節目・T3のあと・3問の類題・すべて新規下書き・4択）", "meta": "", "screenHtml": "<div class=\"li\">- Q1 [新規] 植物の細胞だけにあって、動物の細胞にはないものはどれ？ → <b>細胞壁</b>（選: 細胞壁／核／細胞膜／細胞質）</div>\n<div class=\"li\">- Q2 [新規] 植物の細胞にあって、光合成を行う緑色のつぶはどれ？ → <b>葉緑体</b>（選: 葉緑体／液胞／核／細胞膜）</div>\n<div class=\"li\">- Q3 [新規] 植物の細胞で発達していて、中に水や養分をためている袋はどれ？ → <b>液胞</b>（選: 液胞／葉緑体／細胞壁／核）</div>", "ctxHtml": "<div class=\"li\">※3問とも「植物の細胞だけにある部品を選ぶ」同型・同難度の類題。この節目は細胞壁・葉緑体・液胞の3つを選び分けるのが本題なので4択にした（憲法第4.7条の例外＝内容が選び分けを要求する時）。</div>\n<div class=\"li\">※設計メモ: 3問とも「植物専用部品を選ぶ」1本にそろえた同概念・同形式セット（憲法第4.2条）。誤答選択肢はすべて「細胞の部品名」でそろえ、1つだけ文形式・1つだけ長いといった異質な選択肢を作っていない（憲法第4.6条）。DB内に近い趣旨の入門○✕がある（L2236「細胞壁は、動物の細胞にも植物の細胞にも同じようにある。」answer:false／L1861 同趣旨）。ただし○✕は同概念×3の類題がそろわない（2問が実質重複）ため、選び分けの4択で新規に組んだ。</div>"}, {"type": "card", "uid": "u_bio_06", "id": "06-T5", "title": "締め——顕微鏡でのぞくと全部つながる", "meta": "（種別: 達成の先出し／図なし）", "screenHtml": "<div class=\"q\">これで、生きものの体のつくりが1本につながった。</div>\n<div class=\"q\">生きものはぜんぶ、細胞という小さな部屋でできている → まん中に核、まわりを細胞膜（ここは植物も動物も共通）→ 植物だけは、そのうえに細胞壁・葉緑体・液胞を持つ → その部屋が集まって、組織・器官・個体になる。</div>\n<div class=\"q\">共通の部品か、植物だけの部品か。この2つに分けられればOK。この「仕分けの見方」は、これからいろんな生き物の体を読むときにも効いてくるよ。</div>\n<details class=\"col\"><summary>細胞の中をもっと見ると</summary><div class=\"colbody\"><div class=\"q\">実は、細胞の中には核や葉緑体のほかにも、もっと小さいつくりがいくつもある。栄養からエネルギーを取り出す部品などもあって、中学ではそこまでは習わない。</div>\n<div class=\"q\">でも、顕微鏡の性能が上がるほど、細胞の中はどんどんにぎやかに見えてくる。興味があったら、「細胞のつくり もっとくわしく」で調べてみると、まだ先の世界が待ってるよ。</div></div></details>\n<div class=\"q\">〔任意ボタン: 「くわしく見る（別のタブが開くよ）」＝東京書籍web「細胞の観察」コンテンツへ。開かなくても本編はここで完結する（憲法第8条）〕</div>", "ctxHtml": "<div class=\"q\"></div>\n<div class=\"q\"></div>\n<div class=\"li\">---</div>"}, {"type": "check", "uid": "u_bio_06", "id": "u_bio_06-確認1", "textHtml": "<b>確認クイズを新規で書いた点</b>: カーネルは「既存bio_cell入門×3」を指定していましたが、プールに①核を直接問う同概念×3（Set1用）②植物専用部品を選ぶ同型×3（Set2用）がそろわなかったため、両セットとも [新規] で書き下ろしました（既存の核問題はimageTap／染色液4択が各1問ずつ、植物専用の○✕は実質2問が重複）。この方針でよいか。採用GOが出れば【06-Q2】はDB追加候補にできます。"}, {"type": "check", "uid": "u_bio_06", "id": "u_bio_06-確認2", "textHtml": "<b>図版2枚がAI生成（cimg）</b>: 【06-P2】玉ねぎの皮の顕微鏡像・【06-T2】染色した核の像は、実物イメージなのでSol生成の想定ですが、<b>顕微鏡像はAIだと核の数や配置が不正確になりやすい</b>ため、<b>学校の顕微鏡で撮ったオーナー実写が理想</b>です（玉ねぎ表皮・酢酸カーミン染色は定番プレパラート）。実写に差し替える／AI生成でいく、どちらにしますか（同名ファイルで差し替え可）。"}, {"type": "check", "uid": "u_bio_06", "id": "u_bio_06-確認3", "textHtml": "<b>染色液の表記</b>: 【06-T2】で「酢酸カーミン液」を出しました。東書は酢酸カーミン液・酢酸オルセイン液の両方を挙げます。既存問題（L1863/L2237）は「酢酸カーミン液」なので合わせましたが、授業で酢酸オルセイン液を主に使っていれば併記します。 ---"}, {"type": "unit", "uid": "u_bio_07", "name": "光合成のしくみ", "n": 11, "nc": 4}, {"type": "card", "uid": "u_bio_07", "id": "u_bio_07-R", "title": "レディネスチェック", "meta": "", "screenHtml": "<div class=\"li\">- 【07-R1】[既存・小学校] 根の主なはたらきはどれですか？ → <b>水を吸う</b>（選: 日光を受ける／実を作る／花粉を作る／水を吸う）〔quiz-engine.js L372〕</div>\n<div class=\"li\">- 【07-R2】[既存・小学校] くきは何を上へ運ぶ？ → <b>水</b>（選: 水／花粉／種／土）〔quiz-engine.js L373〕</div>\n<div class=\"li\">- 【07-R3】[既存・小学校] でんぷんを調べる液は？ → <b>ヨウ素液</b>（選: 石けん水／食塩水／ヨウ素液／水道水）〔quiz-engine.js L403〕</div>\n<div class=\"q\">つまずいたときの誘いコピー（弱点表示ではなく招待状のトーン・憲法第2.5条／楽アピールで誘わない・第2.6条）:</div>\n<div class=\"q\">「<b>根とくきのはたらきを見なおしておくと、このあと『水がどこで使われるか』の話がつながりやすくなるよ</b>」→ 該当の教えるカードへのボタンがそっと光る</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_07", "id": "07-P1", "title": "予想（Predict）", "meta": "どれを選んでも正誤なし・「なるほど」で次へ", "screenHtml": "<div class=\"q\">植物は、日光を浴びて栄養（デンプン）をつくる。</div>\n<div class=\"q\">じゃあ、一晩まっくらな箱に入れておいた葉と、しっかり光を当てた葉。</div>\n<div class=\"q\">デンプンができているのは、どっちの葉だと思う？</div>\n<div class=\"q\">「両方できている」／「光を当てた葉だけ」／「暗い箱の葉だけ」</div>", "ctxHtml": "<div class=\"q\"></div>"}, {"type": "card", "uid": "u_bio_07", "id": "07-P2", "title": "おどろき（Observe）", "meta": "図: cimg/u_bio_07/p2_iodine_leaves.png（新規AI生成・カードサイズ＝2枚の葉。光を当てた葉は青むらさきに染まり、暗い箱の葉は染まっていない。実物の色だけを見せ、光合成のしくみ・式は載せない）", "screenHtml": "<div class=\"q\">どちらの葉も、あたためたエタノールで緑色をぬいてから、ヨウ素液をたらしてみる。</div>\n<div class=\"q\">すると——光を当てた葉だけが、青むらさきに染まった。</div>\n<div class=\"q\">暗い箱の葉は、染まらない。デンプンができていなかったんだ。</div>\n<div class=\"q\">光がないと、植物は栄養をつくれない。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_07", "id": "07-P3", "title": "たね明かし（Explain）", "meta": "", "screenHtml": "<div class=\"q\">葉が光を受けて、水と二酸化炭素からデンプンと酸素をつくる。これが<b>光合成</b>だよ。</div>\n<div class=\"q\">つくる場所は、葉の細胞の中の<b>葉緑体（ようりょくたい）</b>。</div>\n<div class=\"q\">入るのは水と二酸化炭素、できるのはデンプンと酸素。</div>\n<div class=\"q\">この「何が入って何が出るか」の1本の流れをつかめば、光合成の実験はぜんぶ読める。</div>\n<div class=\"q\">そして——植物は光合成だけじゃなく、動物と同じように<b>呼吸</b>もしているんだ。</div>\n<div class=\"q\">今回は、その光合成のしくみと、植物の呼吸を見ていくよ。</div>", "ctxHtml": "<div class=\"li\">---</div>"}, {"type": "card", "uid": "u_bio_07", "id": "07-T1", "title": "光合成——葉緑体で、水と二酸化炭素からデンプンと酸素", "meta": "（種別: 概念／図: card_photo_flow.png 新規・matplotlib・カードサイズ＝左から「水・二酸化炭素」→「葉緑体」→「デンプン・酸素」の1本の流れ・矢印1本・印なし）", "screenHtml": "<div class=\"q\">葉が光を受けると、<b>水</b>と<b>二酸化炭素</b>を材料にして、<b>デンプン</b>と<b>酸素</b>をつくる。</div>\n<div class=\"q\">このはたらきを<b>光合成</b>という。</div>\n<div class=\"q\">光合成が行われるのは、葉の細胞の中にある緑色のつぶ、<b>葉緑体</b>。葉が緑に見えるのも、この葉緑体のおかげなんだ。</div>\n<div class=\"q\">大事なのは、入るものと出るものを分けて見ること。</div>\n<div class=\"q\"><b>入る（材料）＝水・二酸化炭素／出る（できるもの）＝デンプン・酸素</b>。</div>\n<div class=\"q\">この1本の流れをつかめば、光合成の実験はぜんぶ読めるようになるよ。</div>\n<details class=\"col\"><summary>できたデンプンはどこへ行く？</summary><div class=\"colbody\"><div class=\"q\">葉でできたデンプンは、そのままだと水にとけなくて運べない。</div>\n<div class=\"q\">だから、水にとけやすい糖に変えてから、師管という管を通って、体じゅうに運ばれる。</div>\n<div class=\"q\">運ばれた先で、成長に使われたり、実や根にたくわえられたりするんだ。</div></div></details>", "ctxHtml": "<div class=\"q\"></div>"}, {"type": "card", "uid": "u_bio_07", "id": "07-T2", "title": "光合成に必要なもの——光・水・二酸化炭素", "meta": "（種別: 概念／図なし）", "screenHtml": "<div class=\"q\">光合成をするには、3つがそろわないといけない。</div>\n<div class=\"q\"><b>光・水・二酸化炭素</b>の3つ。どれか1つでも足りないと、デンプンはできない。</div>\n<div class=\"q\">これは、1つずつ条件を変えて確かめられる。</div>\n<div class=\"q\">たとえば、葉の一部だけアルミはくでおおって光を当てないと、その部分にはデンプンができない。</div>\n<div class=\"q\">ほかの条件は同じで、光だけをなくしたのにデンプンができない。だから「光がいる」とわかるんだ。</div>\n<div class=\"q\">水がいることも、二酸化炭素がいることも、同じやり方で確かめられる。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_07", "id": "07-T3", "title": "確かめ方——ヨウ素液・石灰水・BTB液", "meta": "（種別: 概念／図: card_photo_check.png 新規・matplotlib・カードサイズ＝「デンプン→ヨウ素液→青むらさき」「二酸化炭素→石灰水→白くにごる」の対応を並べた表・印なし）", "screenHtml": "<div class=\"q\">光合成で何ができたか、何が使われたかは、薬品で確かめられる。</div>\n<div class=\"q\"><b>デンプンができたか → ヨウ素液</b>。デンプンがあると青むらさきになる。</div>\n<div class=\"q\"><b>二酸化炭素が使われたか → 石灰水やBTB液</b>。石灰水は二酸化炭素があると白くにごる。BTB液は二酸化炭素がとけると黄色（酸性側）に近づく。</div>\n<div class=\"q\">薬品ごとに「何を確かめるか」が決まっている。だから、どの薬品を使えばいいかで、調べたいものが見えてくるんだ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_07", "id": "07-Q1", "title": "確認クイズ・セット1（光合成の材料と生成物の節目・3問の類題・4択）", "meta": "", "screenHtml": "<div class=\"li\">- Q1 [既存・入門] 植物の光合成で、材料として使われるものの組み合わせはどれか。 → <b>二酸化炭素と水</b>（選: 二酸化炭素と水／酸素とデンプン／窒素と酸素／水素と酸素）〔quiz-engine.js L49〕</div>\n<div class=\"li\">- Q2 [既存・入門] 光合成によって、植物が出す気体はどれか。 → <b>酸素</b>（選: 窒素／水素／二酸化炭素／酸素）〔quiz-engine.js L162〕</div>\n<div class=\"li\">- Q3 [新規] 光合成でつくられる栄養（養分）は何か。 → <b>デンプン</b>（選: デンプン／タンパク質／食塩／水）</div>", "ctxHtml": "<div class=\"li\">※3問とも「光合成に何が入って、何ができるか（材料と生成物）」を問う同型・同難度でそろえた類題セット。この節目は水・二酸化炭素・デンプン・酸素の選び分けが本題なので、4択のまま（憲法4.7条の例外＝内容が選び分けを要求する時）。</div>\n<div class=\"li\">※設計メモ: Q1が「入る（材料）」、Q2・Q3が「出る（できるもの）」で、3問とも〈光合成の物質の出入り〉という同じ概念・同じ4択形式・同じ入門難度にそろえた（憲法4.2）。既存の入門に「光合成でできる養分＝デンプン」を単独で問う同型が無いため、Q3のみ[新規]で書き下ろした（DBには追加しない・原稿の下書き）。選択肢はすべて「物質名」1語でそろえ、1つだけ長い・文形式といった異質な選択肢を作っていない（憲法4.6）。</div>"}, {"type": "card", "uid": "u_bio_07", "id": "07-T4", "title": "植物も呼吸している", "meta": "（種別: 概念／図なし）", "screenHtml": "<div class=\"q\">ここで、ひとつふしぎなことがある。</div>\n<div class=\"q\">植物は昼、光合成で酸素を出している。じゃあ、光のない夜、植物は何をしているんだろう。</div>\n<div class=\"q\">じつは植物も、動物と同じように<b>呼吸</b>をしている。</div>\n<div class=\"q\">酸素を吸って、二酸化炭素を出す。昼も夜も、ずっとだよ。</div>\n<div class=\"q\">「植物は酸素を出す係」と習ったから、と思うかもしれない。それはよくある考え方だ。</div>\n<div class=\"q\">でも植物も生きているから、呼吸をして、生きるためのエネルギーを取り出しているんだ。</div>\n<details class=\"col\"><summary>昼は呼吸してないの？</summary><div class=\"colbody\"><div class=\"q\">昼も、植物はちゃんと呼吸している。</div>\n<div class=\"q\">光合成が目立つだけで、呼吸が止まっているわけじゃないんだ。</div></div></details>", "ctxHtml": "<div class=\"q\"></div>"}, {"type": "card", "uid": "u_bio_07", "id": "07-T5", "title": "締め——光合成と呼吸は、気体の出入りが逆向き", "meta": "（種別: 達成の先出し／図: card_photo_respire.png 新規・matplotlib・カードサイズ＝光合成「水・二酸化炭素→デンプン・酸素」と呼吸「酸素→二酸化炭素」を上下にならべ、気体の出入りが逆向きだと矢印で対比・印なし）", "screenHtml": "<div class=\"q\">最後に、光合成と呼吸をならべてみよう。</div>\n<div class=\"q\"><b>光合成</b>は、水と二酸化炭素からデンプンと酸素をつくる。</div>\n<div class=\"q\"><b>呼吸</b>は、その逆。酸素を使って、二酸化炭素を出す。</div>\n<div class=\"q\">出入りする気体が、ちょうど逆向きなんだ。</div>\n<div class=\"q\">昼は光合成と呼吸の両方、夜は呼吸だけ。</div>\n<div class=\"q\">でも昼は光合成のほうがさかんで、呼吸より光合成の量のほうが多い。</div>\n<div class=\"q\">だから昼は、見た目には二酸化炭素を吸って酸素を出しているように見えるよ。</div>\n<div class=\"q\">これが、植物の中で毎日おきている気体の出入りだよ。光合成と呼吸で、どの気体が出入りするかを読めればOK。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_07", "id": "07-Q2", "title": "確認クイズ・セット2（光合成と呼吸の関係の節目・3問の類題・4択）", "meta": "", "screenHtml": "<div class=\"li\">- Q1 [既存・基礎] 光合成と呼吸について正しい説明はどれか。 → <b>植物は光合成も呼吸も行う</b>（選: 植物は光合成も呼吸も行う／植物は昼だけ呼吸を行う／植物は夜だけ光合成を行う／植物は呼吸を行わない）〔quiz-engine.js L56〕</div>\n<div class=\"li\">- Q2 [既存・基礎] 植物の呼吸について正しい説明はどれか。 → <b>一日中、酸素を取り入れ二酸化炭素を出す</b>（選: 昼だけ呼吸する／夜だけ光合成する／呼吸はしない／一日中、酸素を取り入れ二酸化炭素を出す）〔quiz-engine.js L178〕</div>\n<div class=\"li\">- Q3 [既存・基礎] 光が十分にあたる昼の植物では、光合成と呼吸のどちらのはたらきが多くなるか。 → <b>光合成の量のほうが多い</b>（選: 光合成の量のほうが多い／呼吸の量のほうが多い／光合成も呼吸も止まっている／光合成と呼吸の量がつねに等しい）〔quiz-engine.js L179〕</div>", "ctxHtml": "<div class=\"li\">※この節目は少し難しめ。冒頭に <b>「今回は少し難しめ！ がんばって！」</b> を表示（憲法4.7条＝入門より一段上の基礎でそろえたため）。3問とも「植物の光合成と呼吸の関係」を問う同型・同難度（基礎）の類題セット。素朴概念（植物は呼吸しない／昼だけ働く）を裏返す確認になっている。</div>\n<div class=\"li\">※設計メモ: 3問とも基礎（mid）・4択・「光合成と呼吸の関係」で概念/形式/難度をそろえた（憲法4.2）。既存の入門（junior）には「植物の呼吸で出入りする気体」を単独で問う同型が乏しく、光合成の気体は【07-Q1】Q2で使い切ったため、セット2は基礎で3問そろえた（→§7.5オーナー確認1）。Q3（昼は光合成の量のほうが多い）の根拠は、コラムでなく本線T5に明記した（「昼は光合成のほうがさかんで、呼吸より光合成の量のほうが多い」）ので、コラムを開かない生徒も本線だけで解ける（憲法3.5＝確認クイズはコラムの中身を問わない）。誤答選択肢に混ざる「呼吸はしない／呼吸を行わない」は、T4で裏返した素朴概念そのものなので、教えた正しい事実を誤りとして見せているわけではない（憲法4.3に抵触しない）。Q2の正答肢だけ他より長いのは既存DBの原文どおり（憲法4.6の観点＝軽微・消去法では解けない同種の主張文なので許容範囲。DB是正は要さない）。</div>\n<div class=\"li\">---</div>"}, {"type": "check", "uid": "u_bio_07", "id": "u_bio_07-確認1", "textHtml": "<b>確認クイズ・セット2を「基礎（mid）」3問でそろえた</b>件。カーネル指定は「入門/基礎×3」だが、光合成の気体は【07-Q1】で使ったため、呼吸まわりで同型・同難度がそろうのは基礎（mid）だった。そこで入門より一段上とわかるよう冒頭に「少し難しめ！ がんばって！」を付けた（憲法4.7）。この構成でよいか。"}, {"type": "check", "uid": "u_bio_07", "id": "u_bio_07-確認2", "textHtml": "<b>【07-Q1】Q3を[新規]で書き下ろした</b>件（既存の入門に「光合成でできる養分＝デンプン」を単独で問う同型が無いため）。選択肢「デンプン／タンパク質／食塩／水」で採用してよいか。だめなら[既存・入門]でそろえ直す（その場合セット1は「材料」1問＋「出す気体」1問の2問に減る）。"}, {"type": "check", "uid": "u_bio_07", "id": "u_bio_07-確認3", "textHtml": "<b>P2のヨウ素液反応の図をAI生成（cimg/u_bio_07/p2_iodine_leaves.png）にする</b>件。青むらさきの実物色を見せたいので、t3_phenol（フェノールフタレイン実物色）と同じくSol生成→理科的正確性の目視ゲート→タップ検収の流れを想定。matplotlib模式図でなくAI画像でよいか。"}, {"type": "check", "uid": "u_bio_07", "id": "u_bio_07-確認4", "textHtml": "<b>図版4枚の生成</b>（P2＝AI生成／T1・T3・T5＝matplotlib自作）。出荷前に実生成が必要。 ---"}];
const KEY = "rika2_review_" + "\u751f\u7269B2 \u4e2d1\u52d5\u7269+\u4e2d2\u7d30\u80de\u5149\u5408\u6210(05\u52d5\u7269\u5206\u985e/06\u7d30\u80de/07\u5149\u5408\u6210)";
let res = {}; try{ res = JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){}
let pos = +(localStorage.getItem(KEY+"_pos")||0);
const tappable = ITEMS.filter(i=>i.type!=="unit").length;
function save(){ localStorage.setItem(KEY, JSON.stringify(res)); localStorage.setItem(KEY+"_pos", pos); }
function doneCount(){ return Object.keys(res).length; }
function header(){
  document.getElementById("hcount").textContent = doneCount()+" / "+tappable;
  document.getElementById("hbar").style.width = (100*doneCount()/tappable)+"%";
}
function go(d){ pos=Math.max(0,Math.min(ITEMS.length,pos+d)); save(); render(); window.scrollTo(0,0); }
function mark(id, verdict){
  const t=[...document.querySelectorAll(".tag.on")].map(x=>x.textContent);
  const note=(document.getElementById("note")||{}).value||"";
  res[id]={v:verdict,tags:t,note:note}; save(); go(1);
}
function render(){
  header();
  const st=document.getElementById("stage");
  if(pos>=ITEMS.length){ st.innerHTML=exportView(); return; }
  const it=ITEMS[pos];
  const nav='<div class="nav"><button onclick="go(-1)">← まえへ</button><button onclick="go(1)">とばす →</button></div>';
  if(it.type==="unit"){
    st.innerHTML='<div class="unitcard"><div class="uid">'+it.uid+'</div><div class="big">'+it.name+'</div>'+
    '<div class="summary">カード '+it.n+'枚 ＋ 確認 '+it.nc+'件。<br>読む→ピンとくれば ◎OK、引っかかれば ✏。<br>迷ったら ⏭あとで（いつでも戻れる）。</div>'+
    '<div class="btns"><button class="b-ok" onclick="go(1)">はじめる</button></div></div>'+nav;
    return;
  }
  const prev=res[it.id];
  const badge=prev?('<span style="color:var(--gold)">［回答済: '+prev.v+'］</span>'):'';
  if(it.type==="card"){
    st.innerHTML='<div class="card"><div class="uid">'+it.uid+'｜【'+it.id+'】'+badge+'</div>'+
    '<h2>'+it.title+'</h2><div class="meta">'+it.meta+'</div>'+ it.screenHtml +
    (it.ctxHtml?('<div class="ctx">'+it.ctxHtml+'</div>'):'')+
    '<div class="btns">'+
    '<button class="b-ok" onclick="mark(\''+it.id+'\',\'OK\')">◎ OK</button>'+
    '<button class="b-warn" onclick="openWarn()">✏ 気になる</button>'+
    '<button class="b-skip" onclick="mark(\''+it.id+'\',\'あとで\')">⏭</button></div>'+
    '<div class="tags" id="tags">'+
    ['ことばが大人','ことばが幼い','教室でこう言わない','理科的にあやしい','長い','その他']
      .map(t=>'<button class="tag" onclick="this.classList.toggle(\'on\')">'+t+'</button>').join('')+'</div>'+
    '<textarea id="note" placeholder="ひとこと（任意・1語でもOK）"></textarea>'+
    '<button class="send" id="send" onclick="mark(\''+it.id+'\',\'気になる\')">この内容で送る</button>'+nav;
  } else {
    st.innerHTML='<div class="card"><div class="uid">'+it.uid+'｜確認 '+badge+'</div>'+
    '<div class="q">'+it.textHtml+'</div>'+
    '<div class="btns">'+
    '<button class="b-yes" onclick="mark(\''+it.id+'\',\'はい\')">はい</button>'+
    '<button class="b-no" onclick="mark(\''+it.id+'\',\'いいえ\')">いいえ</button>'+
    '<button class="b-skip" onclick="mark(\''+it.id+'\',\'あとで\')">⏭</button></div>'+
    '<textarea id="note" class="open" placeholder="補足（任意）"></textarea>'+nav;
  }
}
function openWarn(){
  document.getElementById("tags").classList.add("open");
  document.getElementById("note").classList.add("open");
  document.getElementById("send").classList.add("open");
}
function exportView(){
  const out={sheet:"\u751f\u7269B2 \u4e2d1\u52d5\u7269+\u4e2d2\u7d30\u80de\u5149\u5408\u6210(05\u52d5\u7269\u5206\u985e/06\u7d30\u80de/07\u5149\u5408\u6210)",done:doneCount(),total:tappable,answers:res};
  const s=JSON.stringify(out,null,1);
  const warn=Object.entries(res).filter(([k,v])=>v.v==="気になる"||v.v==="いいえ").length;
  const esc=s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
  return '<div class="unitcard"><div class="big">おつかれさまでした 🎉</div>'+
  '<div class="summary">回答 '+doneCount()+'/'+tappable+'（✏気になる・いいえ: '+warn+'件）<br>'+
  '<b>下の枠の中身が結果のすべて</b>です。「📋 結果をコピー」→ Claudeに貼り付けで回収完了。<br>'+
  '<span style="color:var(--warn)">※このHTMLファイル自体には回答は保存されません（回答はこのブラウザの中）。必ずコピーか💾で外に出してください。</span></div>'+
  '<button class="exbtn" style="background:var(--gold);color:#241a03" onclick="navigator.clipboard.writeText(document.getElementById(\'exp\').value).then(()=>this.textContent=\'✓ コピーしました（Claudeに貼ってください）\')">📋 結果をコピー</button>'+
  '<button class="exbtn" style="background:#2a3245;color:#e8ecf5" onclick="dl()">💾 review_result.json で保存</button>'+
  '<textarea id="exp" class="open done" readonly>'+esc+'</textarea>'+
  '<div class="nav"><button onclick="go(-1)">← もどる</button><button onclick="pos=0;go(0)">最初から見直す</button></div></div>';
}
function dl(){
  const b=new Blob([document.getElementById("exp").value],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(b);
  a.download="review_result.json"; a.click();
}
render();
</script></body></html>
