<script>
const ITEMS = [{"type": "unit", "uid": "u_bio_14", "name": "細胞分裂と成長", "n": 11, "nc": 4}, {"type": "card", "uid": "u_bio_14", "id": "u_bio_14-R", "title": "レディネスチェック", "meta": "", "screenHtml": "<div class=\"li\">- 【14-R1】[既存・入門] 生物のからだをつくる、いちばん小さな単位を何という？ → <b>細胞</b>（選: 細胞／器官／組織／個体）</div>\n<div class=\"li\">- 【14-R2】[既存・基礎] 細胞の中にあり、遺伝に関係する染色体を含む部分はどれか。 → <b>核</b>（選: 核／細胞膜／液胞／細胞壁）</div>\n<div class=\"li\">- 【14-R3】[既存・入門] 形やはたらきが同じ細胞がたくさん集まったまとまりを何という？ → <b>組織</b>（選: 組織／器官／個体／細胞質）</div>\n<div class=\"q\">つまずいたときの誘いコピー（弱点表示ではなく招待状のトーン・憲法第2.5条・2.6条＝楽アピールで誘わない）:</div>\n<div class=\"q\">「<b>細胞のつくりを見なおしておくと、このあとの「細胞がふえる」話がつながりやすくなるよ</b>」→ 該当の教えるカードへのボタンがそっと光る</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_14", "id": "14-P1", "title": "予想（Predict）", "meta": "どれを選んでも正誤なし・「なるほど」で次へ・図なし（答えを先渡ししないため）", "screenHtml": "<div class=\"q\">生まれたばかりの赤ちゃんが、大人になるまでに、背はぐんとのびる。</div>\n<div class=\"q\">このとき、体をつくっている小さな細胞は、どうなっていると思う？</div>\n<div class=\"q\">「細胞ひとつひとつが、大きくふくらむ」／「細胞の数が、ふえる」／「その両方がおきている」</div>", "ctxHtml": "<div class=\"q\"></div>"}, {"type": "card", "uid": "u_bio_14", "id": "14-P2", "title": "おどろき（Observe）", "meta": "図: cimg/u_bio_14/p2_root_tip.png（新規・AI＝タマネギの根の先を染めて顕微鏡で見た場面。先っぽの一点に、ひものような染色体が見えている細胞がぎっしり集まっている絵だけ。しくみの説明や答えの文字は載せない）", "screenHtml": "<div class=\"q\">タマネギの根の先だけを染めて、顕微鏡でのぞいてみる。</div>\n<div class=\"q\">すると——先っぽのせまい一点にだけ、核の中のひも（染色体）が見えている細胞が、ぎっしり集まっている。</div>\n<div class=\"q\">根がのびるのは、この決まった場所で細胞が<b>まっぷたつに分かれて数をふやしている</b>から。</div>\n<div class=\"q\">細胞ひとつひとつがふくらんでいるんじゃなくて、<b>数がふえていた</b>んだ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_14", "id": "14-P3", "title": "たね明かし（Explain）", "meta": "", "screenHtml": "<div class=\"q\">1個の細胞が2個に分かれることを<b>細胞分裂</b>という。</div>\n<div class=\"q\">体をつくる細胞の分裂は、とくに<b>体細胞分裂</b>とよぶ。</div>\n<div class=\"q\">そして、生き物が大きくなるのは「<b>分裂で数がふえる → ふえた細胞が大きくなる</b>」の2段構え。</div>\n<div class=\"q\">分かれる前に、核の中の染色体をこっそりコピーしておくしくみもある。そのおかげで、分裂しても染色体の数は変わらない。今回は、この2つを順に見ていくよ。</div>", "ctxHtml": "<div class=\"li\">---</div>"}, {"type": "card", "uid": "u_bio_14", "id": "14-T1", "title": "成長の正体は、2段構え", "meta": "（種別: 概念／図: card_growth_2step.png 新規・matplotlib・カードサイズ＝小さい細胞が2個に分かれて数がふえ、そのあとそれぞれが大きくなる、を左から右へ・印なし）", "screenHtml": "<div class=\"q\">「大きくなる＝細胞がふくらむ」だと思っていた人、多いはず。これ、けっこう「え！？」ってなるところだよ。</div>\n<div class=\"q\">ほんとうは、生き物が大きくなるときは、まず<b>細胞が分かれて数がふえる</b>。</div>\n<div class=\"q\">そのあとで、ふえた細胞ひとつひとつが<b>大きくなる</b>。</div>\n<div class=\"q\">この「<b>数がふえる → 大きくなる</b>」の2段構えが、成長の正体なんだ。</div>\n<details class=\"col\"><summary>根のどこがのびるの？</summary><div class=\"colbody\"><div class=\"q\">根が、先っぽでのびているのか、根もとでのびているのか——じつは、たしかめる方法がある。</div>\n<div class=\"q\">根に、同じ間かくで印をつけて、しばらく育ててみる。すると、<b>先の近くの印だけ間かくが広がって</b>、根もとの印はほとんど動かない。</div>\n<div class=\"q\">だから、細胞がさかんに分かれてふえているのは「根の先の近く」だとわかる。さっき顕微鏡でのぞいたとき、先っぽにぎっしり細胞が集まっていたのも、この場所なんだ。</div></div></details>", "ctxHtml": "<div class=\"q\"></div>"}, {"type": "card", "uid": "u_bio_14", "id": "14-T2", "title": "細胞分裂——1個が2個に分かれる", "meta": "（種別: 概念／図なし）", "screenHtml": "<div class=\"q\">細胞が数をふやすやり方は、シンプルだ。</div>\n<div class=\"q\"><b>1個の細胞が、2個に分かれる</b>。これを<b>細胞分裂</b>という。</div>\n<div class=\"q\">分かれたそれぞれが、また2個に……とくり返して、細胞はどんどんふえていく。</div>\n<div class=\"q\">なかでも、体をつくる細胞がふえるときの分裂を<b>体細胞分裂</b>とよぶ。ふつうに体が成長したり、きずが治ったりするのは、この体細胞分裂だよ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_14", "id": "14-T3", "title": "分かれる前に、染色体をコピーする", "meta": "（種別: 概念／図: card_replicate.png 新規・matplotlib・カードサイズ＝染色体1本 → 同じものがもう1本コピーされて2本 → 2つの細胞に半分こ、を矢印1本ずつで・印なし）", "screenHtml": "<div class=\"q\">細胞分裂には、大事な下じゅんびがある。</div>\n<div class=\"q\">分かれる前に、核の中の染色体を、そっくり同じものにもう1組<b>コピー</b>しておくんだ。これを<b>複製</b>という。</div>\n<div class=\"q\">たとえるなら、<b>設計図をコピーしてから半分こ</b>するようなもの。</div>\n<div class=\"q\">もとの染色体と、コピーした染色体。この2組を、分裂で2つの細胞に1組ずつ配る。</div>\n<div class=\"q\">だから、分かれたあとの細胞にも、ちゃんと同じ設計図がそろっているんだ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_14", "id": "14-T4", "title": "だから、数は変わらない", "meta": "（種別: 概念／図なし）", "screenHtml": "<div class=\"q\">ここが、複製のうれしいところ。</div>\n<div class=\"q\">分かれる前に染色体を1組コピーして、2組にしてから半分こする。</div>\n<div class=\"q\">すると、分裂したあとの細胞1個がもつ染色体の数は、<b>分裂する前とぴったり同じ</b>になる。</div>\n<div class=\"q\">ふえても、ふえても、1個1個の細胞がもつ染色体の数は変わらない。</div>\n<div class=\"q\"><b>これが、体のどの細胞も同じ設計図をもっていられるしくみだよ。</b></div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_14", "id": "14-T5", "title": "分裂のようす——順番で見る", "meta": "（種別: 概念／図: card_mitosis_steps.png 新規・matplotlib・カードサイズ＝①染色体が見えてくる → ②中央に一列に並ぶ → ③両側へ分かれる → ④中央に仕切り（細胞板）ができて2個の細胞に、を矢印1本ずつ・印なし。植物細胞の分かれ方＝くびれでなく仕切りで描く）", "screenHtml": "<div class=\"q\">体細胞分裂が進むようすを、順番で見てみよう。</div>\n<div class=\"q\">① ふだんは見えにくい染色体が、<b>太く短くまとまって見えてくる</b>。</div>\n<div class=\"q\">② その染色体が、細胞の<b>まん中に一列に並ぶ</b>。</div>\n<div class=\"q\">③ 並んだ染色体が、<b>両側へ分かれて</b>いく。</div>\n<div class=\"q\">④ 細胞のまん中に<b>仕切り（細胞板）ができて</b>、<b>2個の細胞に分かれる</b>。</div>\n<div class=\"q\">この①→②→③→④の流れがわかれば、顕微鏡で分裂のどの場面を見ているか、読み取れるようになるよ。</div>\n<details class=\"col\"><summary>動物の細胞はどう分かれる？</summary><div class=\"colbody\"><div class=\"q\">植物の細胞（タマネギの根もそう）は、まん中に仕切り（細胞板）ができて2つに分かれる。</div>\n<div class=\"q\">動物の細胞にはこの仕切りがなくて、外側からきゅっと<b>くびれて</b>2つに分かれるんだ。分かれ方が、植物と動物でちょっとちがうんだね。</div></div></details>", "ctxHtml": "<div class=\"q\"></div>\n<div class=\"li\">---</div>"}, {"type": "card", "uid": "u_bio_14", "id": "14-Q1", "title": "確認クイズ・セット1（成長と細胞分裂の節目＝T1〜T2のあと・3問の類題・すべて既存流用・4択）", "meta": "", "screenHtml": "<div class=\"li\">- Q1 [既存・入門] 生き物がからだを大きくしたり、きずをなおしたりするとき、細胞はどうなるか。 → <b>数がふえる</b>（選: 数がふえる／急に小さくなる／色が変わる／固まって動かなくなる）</div>\n<div class=\"li\">- Q2 [既存・入門] 細胞が2つに分かれて数がふえることを何という？ → <b>細胞分裂</b>（選: 細胞分裂／受精／蒸散／発芽）</div>\n<div class=\"li\">- Q3 [既存・入門] 細胞分裂のとき、核の中に現れて染色液でよく染まる、ひものようなつくりを何という？ → <b>染色体</b>（選: 染色体／葉緑体／液胞／細胞壁）</div>", "ctxHtml": "<div class=\"li\">※3問とも「成長→分裂→染色体」を一巡する同型・同難度（入門）の類題セット。用語や事実を1つずつ選ぶ形で、いま読んだ流れをそのまま確かめる。既定は2択（憲法第4.7条）だが、生物の用語は似た候補から1つを選び分ける必要があるため、既存問題の4択のまま採用した（→§14.5でオーナー確認）。</div>\n<div class=\"li\">※設計メモ: Q1（line2240）→Q2（line1870）→Q3（line1871）はすべて bio_cell・入門。カーネル指定は「基礎（mid）×3」だったが、基礎の細胞分裂まわりは「染色体1問＋単細胞・核など概念バラバラ」で真の類題が3問そろわない。入門には「成長＝数がふえる → 細胞分裂 → 染色体」とT1〜T2の流れにぴったり重なる同型3連があるため、こちらを採用した（憲法第4.2条＝概念・難度をそろえる方を優先・第4.7条＝節目のご褒美は軽めでよい）。</div>"}, {"type": "card", "uid": "u_bio_14", "id": "14-Q2", "title": "確認クイズ・セット2（複製と染色体数の節目＝T3〜T4のあと・3問の類題・既存1＋新規2・4択）", "meta": "", "screenHtml": "<div class=\"li\">- Q1 [既存・応用] 体細胞分裂の前後で、1個の細胞がもつ染色体の数はどうなるか。 → <b>変わらない</b>（選: 半分になる／変わらない／つねに2倍／なくなる）</div>\n<div class=\"li\">- Q2 [新規] 体細胞分裂の前後で、染色体の数が変わらないのはなぜか。 → <b>分裂の前に染色体が複製され、それが2つに分けられるから</b>（選: 分裂の前に染色体が複製され、それが2つに分けられるから／分裂のたびに染色体が半分ずつ減っていくから／分裂のたびに染色体が新しくつくり直されるから／分裂のときに染色体がぜんぶなくなってしまうから）</div>\n<div class=\"li\">- Q3 [新規] 体細胞分裂でふえた細胞は、もとの細胞と遺伝の情報がどうなっているか。 → <b>もとの細胞と同じになっている</b>（選: もとの細胞と同じになっている／もとの細胞の半分になっている／もとの細胞の2倍になっている／まったく別のものになっている）</div>", "ctxHtml": "<div class=\"li\">※この節目は少し考えるところ。冒頭に <b>「今回は少し難しめ！ がんばって！」</b> を表示（憲法第4.7条＝難度が上がるセットは先に予告して励ます）。3問とも「複製 → だから数（と情報）が変わらない」という同じ因果を、応用の4択でそろえた類題セット。</div>\n<div class=\"li\">※設計メモ: Q1（line100・bio_cell・応用）は「数は変わらない」の結論そのもの。応用の pool で「複製 → 数不変」を問う真の同型は line100 の1問だけ（line304 は受験／line135・1874 は基礎）なので、T3の「複製」とT4の「情報が同じ」を問うQ2・Q3を新規で書き下ろして応用3連にそろえた（憲法第4条＝既存で同型がそろわなければ新規で書き下ろす・DBには入れない）。Q2の誤答「半分ずつ減る」は「変わらない」を選ばせるための素直な否定で、減数分裂を教えるものではない（本線で減数分裂は扱わない・§14.0）。</div>\n<div class=\"li\">---</div>"}, {"type": "check", "uid": "u_bio_14", "id": "u_bio_14-確認1", "textHtml": "<b>確認クイズの4択／2択</b>: 【14-Q1】【14-Q2】とも既存・新規いずれも4択にしてある（生物の用語は似た候補から選び分ける必要があるため）。憲法第4.7条の「既定は2択（節目のご褒美は軽めに）」に寄せて、【14-Q1】を2択（例: 「数がふえる／大きくふくらむ」の2択）に組み直す案もあります。<b>4択のままでよいか／一部を2択にするか</b>、判断をください（u_bio_08・u_chem_23では「4択でok」でした）。"}, {"type": "check", "uid": "u_bio_14", "id": "u_bio_14-確認2", "textHtml": "<b>導入P2の図（タマネギの根の先の顕微鏡像）</b>: これはAI画像（cimg・Sol生成）で作る予定です。器具・染色の色・染色体の見え方が中学理科の観察として正しいか、生成後にClaudeが目視ゲートを通し、画像入りタップシートで採否を決めていただきます。<b>この方針でよいか</b>。オーナー実写（実際にタマネギの根を染めた顕微鏡写真）があれば、あとから同名ファイルで差し替え可能です。"}, {"type": "check", "uid": "u_bio_14", "id": "u_bio_14-確認3", "textHtml": "<b>新規作問2問（【14-Q2】Q2・Q3）</b>: 応用の「複製→数・情報が変わらない」を問う下書きです。DBには入れていません。<b>この2問を練習プール（QUESTION_DB・bio_cell・応用）に追加してよいか</b>、判断をください。"}, {"type": "check", "uid": "u_bio_14", "id": "u_bio_14-確認4", "textHtml": "<b>レディネスR2の「染色体」語（先渡し懸念）</b>: R2（→核）の問題文に「遺伝に関係する<b>染色体</b>を含む部分はどれか」とあり、染色体は東書配列では本ユニット（体細胞分裂の観察）が初出のため、レディネスの時点では未習の語です（敵対検収の指摘）。答えは中2既習の「核」なので機能はしますが、厳密には初出語の先渡しです。<b>（A）このまま残す（染色体は文中の手がかりで、答えは核だから可）／（B）染色体を含まない別の『核』の既存問題に差し替える</b>、どちらにするか判断をください。旧R3（DNA・後続ユニット初出）は今回、中2既習の「組織」問題に差し替え済みです。 ---"}, {"type": "unit", "uid": "u_bio_15", "name": "無性生殖・有性生殖", "n": 11, "nc": 4}, {"type": "card", "uid": "u_bio_15", "id": "u_bio_15-R", "title": "レディネスチェック", "meta": "", "screenHtml": "<div class=\"li\">- 【15-R1】[既存・小学校] 花粉を作る花の部分は？ → <b>おしべ</b>（選: おしべ／めしべ／根／葉）</div>\n<div class=\"li\">- 【15-R2】[既存・小学校] 花粉がつく花の部分は？ → <b>めしべ</b>（選: 葉／めしべ／根／くき）</div>\n<div class=\"li\">- 【15-R3】[既存・小学校] 花粉がめしべの先につくことを何といいますか？ → <b>受粉</b>（選: 発芽／蒸発／受粉／反射）</div>\n<div class=\"q\">つまずいたときの誘いコピー（弱点表示ではなく招待状のトーン・第2.5条／楽アピールで誘わない・第2.6条）:</div>\n<div class=\"q\">「<b>花から実ができる話を見なおしておくと、このあとの『ふえ方』の話がつながりやすくなるよ</b>」→ 該当の教えるカードへのボタンがそっと光る</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_15", "id": "15-P1", "title": "予想（Predict）", "meta": "どれを選んでも正誤なし・「なるほど」で次へ ※図: cimg/u_bio_15/p1_strawberry_runner.png（イチゴが地面をはう『ランナー』をのばして先に子株ができている情景だけ。子株が親とそっくりかどうかは示さない＝答えを先渡ししない）", "screenHtml": "<div class=\"q\">イチゴは、地面をはう『<b>ランナー</b>』というくきをのばして、その先に子株をつくる。</div>\n<div class=\"q\">このランナーでできた子株は、親のイチゴとくらべて、どうなってると思う？</div>\n<div class=\"q\">「親そっくり」／「少しずつちがう」／「まったくの別もの」</div>", "ctxHtml": "<div class=\"q\"></div>"}, {"type": "card", "uid": "u_bio_15", "id": "15-P2", "title": "おどろき（Observe）", "meta": "図: cimg/u_bio_15/p2_strawberry_compare.png（ランナーでふえた子株＝形も実もそろってそっくり／タネから育てた株＝実の大きさが1株ずつバラバラ、の対比イメージ）", "screenHtml": "<div class=\"q\">ランナーでできた子株は、味も形も、親と<b>完全に同じコピー</b>だった。</div>\n<div class=\"q\">ところが——同じイチゴでも、<b>タネから育てる</b>と、実の大きさも甘さも1株ずつ<b>バラバラ</b>になる。</div>\n<div class=\"q\">同じ生き物なのに、ふえ方によって「そっくり」にも「バラバラ」にもなる。</div>\n<div class=\"q\">このちがいは、どこから生まれるんだろう？</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_15", "id": "15-P3", "title": "たね明かし（Explain）", "meta": "", "screenHtml": "<div class=\"q\">生き物のふえ方には、大きく2つある。</div>\n<div class=\"q\">タネを使わず、親の体の一部などから子ができるふえ方が<b>無性生殖</b>——子は親のコピー。</div>\n<div class=\"q\">オスとメスの<b>生殖細胞</b>が合体して子ができるふえ方が<b>有性生殖</b>——2人ぶんの情報を混ぜるから、子は親と少しずつちがう。</div>\n<div class=\"q\">「そっくりか、混ざるか」が2つのふえ方の分かれ道なんだ。今回は、この2つを見ていくよ。</div>", "ctxHtml": "<div class=\"li\">---</div>"}, {"type": "card", "uid": "u_bio_15", "id": "15-T1", "title": "生き物のふえ方には2種類ある", "meta": "（種別: 概念／図: card_repro_types.png 新規・カードサイズ＝ふえ方が無性生殖／有性生殖の2つに枝分かれする見取り図・印なし）", "screenHtml": "<div class=\"q\">生き物のふえ方は、大きく2つに分けられる。</div>\n<div class=\"q\">ひとつは<b>無性生殖</b>。受精をせずに、親の体の一部などから子ができる。</div>\n<div class=\"q\">もうひとつは<b>有性生殖</b>。2つの生殖細胞が受精して子ができる。</div>\n<div class=\"q\">分かれ道は、子が「親のコピー」になるか、「親と少しずつちがう」になるか。まずはこの2つを、1つずつ見ていくよ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_15", "id": "15-T2", "title": "無性生殖——受精なし・親のコピー", "meta": "（種別: 概念／図: card_asexual_copies.png 新規・カードサイズ＝ミカヅキモが2つに分かれて同じ形が並ぶ／ジャガイモの親いもから同じ子いもができる、親と同じコピーが並ぶ模式図・印なし）", "screenHtml": "<div class=\"q\">無性生殖は、<b>受精をしない</b>ふえ方。</div>\n<div class=\"q\">ジャガイモは、いもから芽を出して新しい株になる。ミカヅキモは、体が2つに分かれてふえる。</div>\n<div class=\"q\">どれも、親の体の一部やそのものから子ができる。だから、できた子は親と<b>まったく同じ形質</b>を受けつぐ＝親のコピーになる。</div>\n<div class=\"q\">ランナーでふえたイチゴの子株が、親とそっくりだったのは、これが無性生殖だからなんだ。</div>\n<details class=\"col\"><summary>畑でわざとコピーを作る話を見る</summary><div class=\"colbody\"><div class=\"q\">農家や園芸では、<b>さし木</b>や<b>株分け</b>で、わざと無性生殖を使うことがある。</div>\n<div class=\"q\">甘くておいしい木が1本できたら、そのえだを切って植えれば、同じ味の木を何本もふやせる。タネから育てるとバラバラになってしまうけど、コピーなら味も形もそろう。</div>\n<div class=\"q\">「そっくりにふやせる」という無性生殖の性質を、人がうまく利用しているんだ。</div></div></details>", "ctxHtml": "<div class=\"q\"></div>"}, {"type": "card", "uid": "u_bio_15", "id": "15-T3", "title": "有性生殖——生殖細胞どうしの受精でふえる", "meta": "（種別: 概念／図: card_sexual_flow.png 新規・カードサイズ＝生殖細胞○＋生殖細胞○ → 受精 → 受精卵、の前半の流れ・旧課程の2語は入れず『生殖細胞』表記・印なし ※T4と同じ流れ図の前半）", "screenHtml": "<div class=\"q\">もうひとつの有性生殖は、<b>生殖細胞</b>を使うふえ方。</div>\n<div class=\"q\">オスの生殖細胞と、メスの生殖細胞、2種類の細胞が合体する。この合体を<b>受精</b>という。</div>\n<div class=\"q\">受精してできた1つの細胞を<b>受精卵</b>という。これが子の体のスタートになる。</div>\n<div class=\"q\">花でいうと、めしべに花粉がつく「受粉」のあと、中で生殖細胞どうしが受精する。受粉と受精は、つながっているけど別のできごとなんだ。</div>\n<details class=\"col\"><summary>生殖細胞の名前を見る</summary><div class=\"colbody\"><div class=\"q\">生殖細胞には、種類ごとに名前がついている。</div>\n<div class=\"q\">動物では、オスとメスの生殖細胞という。植物の花では、めしべの中にある<b>卵細胞</b>と、花粉から出てくる<b>精細胞</b>という。</div>\n<div class=\"q\">名前はちがっても、はたらきは同じ——受精して、子の体のもとになる細胞だよ。</div></div></details>", "ctxHtml": "<div class=\"q\"></div>"}, {"type": "card", "uid": "u_bio_15", "id": "15-T4", "title": "受精のあと——受精卵が分裂して親のすがたへ", "meta": "（種別: 概念／図: card_sexual_flow.png 新規・再掲＝生殖細胞○＋○ → 受精 → 受精卵 → 分裂をくり返す → からだ、の全体の流れ・印なし）", "screenHtml": "<div class=\"q\">受精でできた受精卵は、そのあとどうなるんだろう。</div>\n<div class=\"q\">受精卵は、<b>細胞分裂をくり返して</b>、細胞の数をふやしていく。</div>\n<div class=\"q\">ふえた細胞は、やがて形やはたらきのちがう細胞に分かれ、親と同じようなすがたの体へと育っていく。</div>\n<div class=\"q\">この、受精卵が体になるまでの育ちの流れを<b>発生</b>という。これが有性生殖で子ができるまでのしくみだよ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_15", "id": "15-Q1", "title": "確認クイズ・セット1（無性生殖と有性生殖の区別・4択の類題3問・すべて既存流用）", "meta": "", "screenHtml": "<div class=\"li\">- Q1 [既存・基礎] 親と同じ形質の子が、受精をせずにできるふえ方はどれか。 → <b>無性生殖</b>（選: 無性生殖／有性生殖／受粉／減数分裂）</div>\n<div class=\"li\">- Q2 [既存・基礎] 雌雄の生殖細胞が受精して子をつくる生殖を何というか。 → <b>有性生殖</b>（選: 無性生殖／有性生殖／栄養生殖／分裂）</div>\n<div class=\"li\">- Q3 [既存・基礎] 受精を行わずに、親のからだの一部などから新しい個体ができる生殖を何という？ → <b>無性生殖</b>（選: 有性生殖／栄養生殖／無性生殖／減数分裂）</div>", "ctxHtml": "<div class=\"li\">※【15-T1】〜【15-T3】のあと。3問とも「受精のあり／なしで、ふえ方の名前を答える」同型・同難度（基礎）の用語同定4択でそろえた（第4.2条）。この節目は無性生殖／有性生殖の<b>名前の選び分け</b>が本題なので4択のまま（第4.7条の例外＝内容が選び分けを要求する）。</div>\n<div class=\"li\">※設計メモ: 3問とも bio_cell・mid（画面表記「基礎」）＝quiz-engine.js の該当行（Q1=「親と同じ形質の子が、受精をせずに…」／Q2=「雌雄の生殖細胞が受精して…」／Q3=「受精を行わずに、親のからだの一部などから…」）を原文どおり引用（選択肢の順・語まで）。カーネル指定の3問がそのまま同型・同難度でそろう（第4.2条充足）。答えの並びは無性・有性・無性でカンの偏りを避けた。※選択肢の距離語（減数分裂・栄養生殖）はこのユニットで教えない語だが、いずれも<b>誤答の選択肢</b>（正解を選ばせない距離）であり、既習語の先渡し（第5条）にはあたらない。行番号はDB更新でずれるためIDにしない（検収時に原文一致を再照合すること）。</div>"}, {"type": "card", "uid": "u_bio_15", "id": "15-Q2", "title": "確認クイズ・セット2（受精と発生・4択の類題3問・既存2問＋新規1問）", "meta": "", "screenHtml": "<div class=\"li\">- Q1 [既存・基礎] 動物の生殖細胞どうしが合体することを何というか。 → <b>受精</b>（選: 受精／分裂／発芽／蒸散）</div>\n<div class=\"li\">- Q2 [新規] 生殖細胞どうしが受精してできた、子の体のもとになる1つの細胞を何というか。 → <b>受精卵</b>（選: 受精卵／生殖細胞／胚珠／染色体）</div>\n<div class=\"li\">- Q3 [既存・基礎] 受精卵が細胞分裂をくり返して、親と同じようなからだに育っていく過程を何という？ → <b>発生</b>（選: 発生／蒸散／呼吸／成長）</div>", "ctxHtml": "<div class=\"li\">※【15-T4】のあと。3問とも「受精のあとに起こることの名前を答える」同型・同難度（基礎）の用語同定4択（受精 → 受精卵 → 発生 の流れをたどる）。</div>\n<div class=\"li\">※設計メモ: Q1・Q3は bio_cell・mid（基礎）の既存を原文どおり引用（Q1=「動物の生殖細胞どうしが合体することを…」／Q3=「受精卵が細胞分裂をくり返して…」）。カーネルは「受精・発生の同型3連」を指定するが、既存プールにこの2問のあいだをつなぐ「受精卵」の用語同定4択が同難度で見当たらないため、<b>中間の1問（受精卵）を[新規]で書き下ろして同型3連にそろえた</b>（第4.2条・新規作問は歓迎の方針）。受精→受精卵→発生の順で流れをたどる並びにし、Q2の誤答（生殖細胞・胚珠・染色体）は単一の明確な偽（第4.6条＝接ぎ木・複合選択肢にしない）。DBには入れず原稿の下書きのみ。</div>"}, {"type": "card", "uid": "u_bio_15", "id": "15-T5", "title": "なぜ2人ぶんを混ぜるとよい？——子が少しずつちがう＝多様", "meta": "（種別: 概念・達成の先出し／図: card_diversity.png 新規・カードサイズ＝そっくりな子が並ぶ無性生殖と、少しずつちがう子が並ぶ有性生殖の対比・印なし）", "screenHtml": "<div class=\"q\">最後に、有性生殖の「2人ぶんを混ぜる」がなぜ役に立つのかを見てみよう。</div>\n<div class=\"q\">コピー（無性生殖）だと、子はみんな親と同じ。もし親が弱い相手（ある病気など）に出あうと、子も同じように弱い。</div>\n<div class=\"q\">有性生殖だと、子は1匹ずつ少しずつちがう。環境が変わったとき、その中に生きのこれる子がいるかもしれない。</div>\n<div class=\"q\">「少しずつちがう子がたくさんいる」ことを、生き物の<b>多様性</b>という。これが、有性生殖の大きな強みなんだ。</div>\n<details class=\"col\"><summary>もっと知りたい？——バナナの話を見る</summary><div class=\"colbody\"><div class=\"q\">みんながよく食べるバナナには、タネがない。だから、さし木のようなやり方（無性生殖）で、同じ遺伝子のバナナばかりをふやしている。</div>\n<div class=\"q\">つまり、世界中のバナナの多くが「コピー」。すると、ある病気が広がると、みんな同じように弱くて、いっせいにやられてしまう心配がある。実際に、そういう病気がバナナを追いつめたことがある。</div>\n<div class=\"q\">「みんな同じ」の弱さと、「少しずつちがう」の強さ——多様性が大事だといわれるのは、こういうことなんだ。</div></div></details>", "ctxHtml": "<div class=\"q\"></div>\n<div class=\"li\">---</div>"}, {"type": "check", "uid": "u_bio_15", "id": "u_bio_15-確認1", "textHtml": "<b>既存A4図 plant_structure を使わない判断</b>: カーネルは「既存流用: plant_structure（花のつくり）」を挙げるが、u_bio_08 と同じ理由（A4まとめ図＝1画面の情報過多・学年バッジが画面に出る・第7条）で<b>使わず、教える用の情報量に絞った新規カード図に差し替え</b>た。この判断でよいか（花のつくり自体はレディネス【15-R1】〜R3と先修u_bio_02で担保）。"}, {"type": "check", "uid": "u_bio_15", "id": "u_bio_15-確認2", "textHtml": "<b>【15-Q2】Q2を[新規]で足した</b>: 「受精→受精卵→発生」の同型3連をそろえるため、中間の「受精卵」を問う4択を新規に1問書いた（既存プールに同難度の同型が見当たらないため）。この作問でGOか。"}, {"type": "check", "uid": "u_bio_15", "id": "u_bio_15-確認3", "textHtml": "<b>T5のバナナ・クローンのコラム</b>: 多様性の意義を「理科の地平」として本線外のコラムで見せた（進化・自然選択の<b>しくみには踏み込まず</b>、中3範囲の多様性どまり）。この位置・内容で見せてよいか。"}, {"type": "check", "uid": "u_bio_15", "id": "u_bio_15-確認4", "textHtml": "<b>図版6枚の生成GO</b>: 下の付録の6枚（cimg 2枚＝AI生成／matplotlib 4枚）の作り方でGENしてよいか（cimg 2枚は生成後に理科的正確性の目視ゲート＋タップ検収）。 ---"}, {"type": "unit", "uid": "u_bio_16", "name": "染色体の受けつがれ方", "n": 10, "nc": 3}, {"type": "card", "uid": "u_bio_16", "id": "u_bio_16-R", "title": "レディネスチェック", "meta": "", "screenHtml": "<div class=\"li\">- 【16-R1】[既存・基礎] 細胞分裂のとき、核の中で見やすくなるひも状のつくりの名前は？ → <b>染色体</b>（選: 染色体／気孔／師管／柔毛）</div>\n<div class=\"li\">- 【16-R2】[既存・基礎] 動物の生殖細胞どうしが合体することを何というか。 → <b>受精</b>（選: 受精／分裂／発芽／蒸散）</div>\n<div class=\"li\">- 【16-R3】[既存・応用] 体が成長するときに細胞がふえる、染色体の数が前後で変わらない細胞分裂を何という？ → <b>体細胞分裂</b>（選: 受精／分化／体細胞分裂／減数分裂）</div>\n<div class=\"q\">つまずいたときの誘いコピー（弱点表示ではなく招待状のトーン・憲法第2.5条・2.6条＝楽アピールで誘わない）:</div>\n<div class=\"q\">「<b>体細胞分裂で数が変わらないことを見なおしておくと、このあとの『半分になる』話がつながりやすくなるよ</b>」→ 該当の教えるカードへのボタンがそっと光る</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_16", "id": "16-P1", "title": "予想（Predict）", "meta": "どれを選んでも正誤なし・「なるほど」で次へ／図なし（予想段階なので答えを先渡ししない・憲法第3.2条）", "screenHtml": "<div class=\"q\">生きものは、親から子へ染色体を受けついでいる。</div>\n<div class=\"q\">もし父と母が、自分の染色体をぜんぶ（フルセット）子に渡したとしたら、</div>\n<div class=\"q\">子の染色体の数はどうなると思う？</div>\n<div class=\"q\">「親と同じ数」／「親の2倍」／「半分」</div>", "ctxHtml": "<div class=\"q\"></div>"}, {"type": "card", "uid": "u_bio_16", "id": "16-P2", "title": "おどろき（Observe）", "meta": "図: card_meiosis_doubling.png（新規・カードサイズ＝染色体の数が代ごとに 2→4→8… と倍々にふくれる絵と、実際は数が一定にとどまる線の対比。減数分裂という語・しくみは載せない）", "screenHtml": "<div class=\"q\">ぜんぶ渡すと、子は父の分＋母の分で<b>2倍</b>。その子（孫）はさらに2倍で<b>4倍</b>……と、代を重ねるたびに倍、倍、倍とふくれて、すぐに細胞に入りきらなくなってしまう。</div>\n<div class=\"q\">でも実際は、何代たっても染色体の数は変わらない。</div>\n<div class=\"q\">生殖細胞をつくるとき、あらかじめ数を<b>半分</b>にしておく、特別な分裂があるからなんだ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_16", "id": "16-P3", "title": "たね明かし（Explain）", "meta": "", "screenHtml": "<div class=\"q\">生殖細胞をつくるときだけ染色体の数が半分になる分裂を<b>減数分裂（げんすうぶんれつ）</b>という。</div>\n<div class=\"q\">父からきた半分と、母からきた半分が、受精で合わさると、数はちょうどもとにもどる。</div>\n<div class=\"q\">減数分裂の「半分にしておく」と、受精の「合わせてもどす」は、いつもセットではたらいているんだ。</div>\n<div class=\"q\">今回は、この「半分渡し→受精でもどす」のしくみを見ていくよ。</div>", "ctxHtml": "<div class=\"li\">---</div>"}, {"type": "card", "uid": "u_bio_16", "id": "16-T1", "title": "なぜ半分にする？——渡しすぎると倍々にふくれる", "meta": "（種別: 概念／図なし・P2の図を下敷きに言葉で結論づけ）", "screenHtml": "<div class=\"q\">もし、父と母が自分の染色体をぜんぶ子に渡したら、どうなるか。</div>\n<div class=\"q\">子は、父の分と母の分で2倍。その子（孫）はさらに2倍で4倍。</div>\n<div class=\"q\">代を重ねるたびに倍、倍、倍とふくらんで、すぐに細胞に入りきらなくなってしまう。</div>\n<div class=\"q\">だから生きものは、子をつくるとき、あらかじめ染色体の数を<b>半分</b>にしておく。</div>\n<div class=\"q\">この「半分にしておく」しくみがあるから、何代たっても数は変わらないんだ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_16", "id": "16-T2", "title": "減数分裂——生殖細胞をつくるときだけ半分になる", "meta": "（種別: 概念／図: card_meiosis_halve.png 新規・カードサイズ＝1個の細胞（染色体4本）が分裂して、染色体2本の生殖細胞になる・印なし）", "screenHtml": "<div class=\"q\">生殖細胞（子のもとになる細胞）をつくるときだけ行われる、特別な分裂がある。</div>\n<div class=\"q\">この分裂では、染色体の数がもとの<b>半分</b>になる。これを<b>減数分裂</b>という。</div>\n<div class=\"q\">ふつうの体の細胞がふえる体細胞分裂では数は変わらないのに、生殖細胞をつくるときだけは半分に減らす。</div>\n<div class=\"q\">だから「数が減る分裂」で減数分裂。名前がそのまましくみを表しているんだ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_16", "id": "16-T3", "title": "受精でもとにもどる——半分＋半分", "meta": "（種別: 概念／図: card_meiosis_fertilize.png 新規・カードサイズ＝父の生殖細胞（染色体2本）＋母の生殖細胞（染色体2本）→受精卵（4本）に色玉でもどる・印なし）", "screenHtml": "<div class=\"q\">半分になった生殖細胞は、受精で出会う。</div>\n<div class=\"q\">父からきた半分と、母からきた半分。この2つが合わさると、染色体の数はちょうどもとにもどる。</div>\n<div class=\"q\">減数分裂の「半分にしておく」と、受精の「合わせてもどす」は、いつもセットではたらいている。</div>\n<div class=\"q\">これが、代を重ねても染色体の数が変わらないしくみだよ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_16", "id": "16-T4", "title": "体細胞分裂と減数分裂——数を保つほう／半分にするほう", "meta": "（種別: 概念・対比／図: card_mitosis_vs_meiosis.png 新規・カードサイズ＝左＝体細胞分裂（4本→4本・数不変）／右＝減数分裂（4本→2本・半減）を並置・印なし）", "screenHtml": "<div class=\"q\">2つの分裂を並べてみる。</div>\n<div class=\"q\"><b>体細胞分裂</b>は、体が成長するときの分裂。染色体をコピーしてから2つに分けるので、数は前後で<b>変わらない</b>。</div>\n<div class=\"q\"><b>減数分裂</b>は、生殖細胞をつくるときだけの分裂。数はもとの<b>半分</b>になる。</div>\n<div class=\"q\">同じ「分裂」でも、数を保つほうと、半分にするほう。役割がちがう2種類があるんだ。</div>\n<details class=\"col\"><summary>なんで2種類あるの？を見る</summary><div class=\"colbody\"><div class=\"q\">体をつくったり大きくしたりするときは、どの細胞も同じ設計でそろっていてほしい。だから体細胞分裂は、数を変えずにそっくりコピーする。</div>\n<div class=\"q\">でも、子をつくるときに同じことをすると、数が倍々にふくらんでしまう。だから生殖細胞をつくるときだけは、先に半分に減らしておく。</div>\n<div class=\"q\">目的がちがうから、分裂も2種類あるんだ。</div></div></details>", "ctxHtml": "<div class=\"q\"></div>\n<div class=\"li\">---</div>"}, {"type": "card", "uid": "u_bio_16", "id": "16-Q1", "title": "確認クイズ・セット1（減数分裂とは・T1〜T2のあと・3問の類題・4択）", "meta": "", "screenHtml": "<div class=\"li\">- Q1 [既存・応用] 生殖細胞をつくるときに行われる、特別な細胞分裂を何という？ → <b>減数分裂</b>（選: 体細胞分裂／減数分裂／二分裂／出芽）</div>\n<div class=\"li\">- Q2 [既存・応用] 分裂のあと、できた細胞の染色体の数が半分になる細胞分裂を何という？ → <b>減数分裂</b>（選: 分化／減数分裂／体細胞分裂／受精）</div>\n<div class=\"li\">- Q3 [新規・応用] 生殖細胞ができるときだけ起こり、染色体の数がもとの半分になる分裂を何という？ → <b>減数分裂</b>（選: 減数分裂／体細胞分裂／受精／発生）</div>", "ctxHtml": "<div class=\"li\">※3問とも「生殖細胞をつくるとき染色体が半分になる分裂＝何か」を問う同型・同難度（応用）の類題セット。この節目は減数分裂／体細胞分裂／受精などの用語の選び分けが本題なので4択のまま（憲法第4.7条の例外＝内容が選び分けを要求するとき）。</div>\n<div class=\"li\">※設計メモ: Q1＝line 95／Q2＝line 248（ともに応用・同型の用語同定4択）。Q3は既存プールに応用の同型が2問しかないため、同概念・同形式・同難度の真の類題を1問書き下ろした（減数分裂を別の言い回しで同定・DBには入れない）。選択肢は3問とも「減数分裂を含む分裂用語の4択」で形式をそろえた（第4.6条）。</div>"}, {"type": "card", "uid": "u_bio_16", "id": "16-Q2", "title": "確認クイズ・セット2（受精でもとにもどる／体細胞分裂との対比・T3〜T4のあと・3問の類題・4択）", "meta": "", "screenHtml": "<div class=\"li\">- Q1 [既存・受験] 体細胞分裂の前後で染色体の数は。 → <b>変わらない</b>（選: 変わらない／半分になる／2倍になる／0になる）</div>\n<div class=\"li\">- Q2 [既存・受験] 生殖細胞ができる減数分裂では、染色体の数はどうなりますか。 → <b>もとの細胞の半分になる</b>（選: もとの細胞の半分になる／もとの細胞と変わらない／もとの細胞の2倍になる／ばらばらになって数えられない）</div>\n<div class=\"li\">- Q3 [既存・受験] 染色体の数が半分になった2つの生殖細胞が受精すると、できた受精卵の染色体数はどうなりますか。 → <b>親の体細胞ともとの数に戻る</b>（選: 半分のまま変わらない／親の体細胞ともとの数に戻る／親の4倍にふえる／なくなってしまう）</div>", "ctxHtml": "<div class=\"li\">※この節目は少し難しめ。冒頭に <b>「今回は少し難しめ！ がんばって！」</b> を表示（憲法第4.7条）。3問とも「その場面で染色体の数はどうなるか」を問う同型・同難度（受験）で、体細胞分裂＝変わらない／減数分裂＝半分／受精＝もとにもどる、の3つを並べて対比する類題セット。</div>\n<div class=\"li\">※設計メモ: Q1＝line 304／Q2＝line 351／Q3＝line 352（3問とも受験・同型の「染色体の数はどうなる」outcome問）。セット2が受験（セット1は応用）＝難度が上がるので、第4.7条どおり冒頭に励ましバナーを出す。3問で体細胞分裂・減数分裂・受精の帳尻（不変／半減／復元）がそろい、T3・T4の対比をそのまま確認できる。Q1の誤答「半分になる」は減数分裂側の事実で、教えたばかりの正しい内容を偽として見せる形ではない（第4.3条セーフ）。→ セット2を受験プールから引いてよいかは §16.5 でオーナー確認。</div>\n<div class=\"li\">---</div>"}, {"type": "check", "uid": "u_bio_16", "id": "u_bio_16-確認1", "textHtml": "<b>図の染色体数を小さな模型の数にする件</b>: card 図はすべて「染色体4本→2本」のような小さい数で「半分になる／もどる」の帳尻だけを見せ、実在のヒト46本は出さない方針（第3.3条＝減らす仕掛けの理解が主・暗記に寄せない）でよいか。46本を1回だけ添える（実感づけ）ほうがよければ、その旨。"}, {"type": "check", "uid": "u_bio_16", "id": "u_bio_16-確認2", "textHtml": "<b>確認クイズ・セット2を受験（supreme）プールから引く件</b>: セット2（染色体数の帳尻・不変／半減／復元）は、既存プールで3問が同型・同難度でそろうのが受験の line 304/351/352 だったため受験3連にし、第4.7条どおり「少し難しめ！」の励ましを冒頭に出す設計。応用でそろえ直したい場合は、応用の同型が不足するので一部を新規書き下ろしに切り替える（可否をご判断ください）。"}, {"type": "check", "uid": "u_bio_16", "id": "u_bio_16-確認3", "textHtml": "<b>レディネス R3（体細胞分裂＝数が変わらない）が応用（senior）である件</b>: 本ユニットの驚きが効くための核心の前提だが、既存プールに下位diffの体細胞分裂・染色体数の問がなく応用が最下位。このまま応用を前提チェックに置いてよいか（下げたい場合は新規で入門の易しい版を書き下ろす）。 ---"}, {"type": "unit", "uid": "u_bio_17", "name": "遺伝の規則性", "n": 11, "nc": 3}, {"type": "card", "uid": "u_bio_17", "id": "u_bio_17-R", "title": "レディネスチェック", "meta": "", "screenHtml": "<div class=\"li\">- 【17-R1】[既存・基礎] 細胞分裂のとき、核の中で見やすくなるひも状のつくりの名前は？ → <b>染色体</b>（選: 染色体／気孔／師管／柔毛）</div>\n<div class=\"li\">- 【17-R2】[既存・応用] 生殖細胞をつくるときに行われる、特別な細胞分裂を何という？ → <b>減数分裂</b>（選: 体細胞分裂／減数分裂／二分裂／出芽）</div>\n<div class=\"li\">- 【17-R3】[既存・基礎] 雌雄の生殖細胞が受精して子をつくる生殖を何というか。 → <b>有性生殖</b>（選: 無性生殖／有性生殖／栄養生殖／分裂）</div>\n<div class=\"q\">つまずいたときの誘いコピー（弱点表示ではなく招待状のトーン・憲法第2.5条・2.6条＝楽アピールで誘わない）:</div>\n<div class=\"q\">「<b>生殖細胞と減数分裂を見なおしておくと、このあとの『遺伝子が分かれて入る』話がつながりやすくなるよ</b>」→ 該当の教えるカードへのボタンがそっと光る</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_17", "id": "17-P1", "title": "予想（Predict）", "meta": "どれを選んでも正誤なし・「なるほど」で次へ（図: card_mendel_cross_q.png＝親[丸]×親[しわ]→子[ぜんぶ丸]→孫[？]・孫の割合は伏せる）", "screenHtml": "<div class=\"q\">丸い種子ばかりできるエンドウと、しわの種子ばかりできるエンドウ。</div>\n<div class=\"q\">この2つをかけ合わせると、できた「子」はぜんぶ丸い種子になった。</div>\n<div class=\"q\">その丸い子どうしを、もう一回かけ合わせる。できる「孫」の種子は、どんな割合になると思う？</div>\n<div class=\"q\">「ぜんぶ丸」／「丸としわが半分ずつ」／「丸が多いけど、しわもまざる」</div>", "ctxHtml": "<div class=\"q\"></div>"}, {"type": "card", "uid": "u_bio_17", "id": "17-P2", "title": "おどろき（Observe）", "meta": "図: card_mendel_f2.png（新規・カードサイズ＝孫にたくさんの丸と少しのしわがまざり、およそ3:1・数える前の「まざって出た」おどろきだけ。表・しくみは載せない）", "screenHtml": "<div class=\"q\">孫の種子を数えてみると——丸：しわ＝およそ3:1。</div>\n<div class=\"q\">子では消えていたはずのしわが、孫でまたあらわれた。</div>\n<div class=\"q\">しかも何回やっても、だいたい3:1に近づく。</div>\n<div class=\"q\">バラバラに伝わるはずの遺伝のもとから、決まった割合が毎回出てくるんだ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_17", "id": "17-P3", "title": "たね明かし（Explain）", "meta": "", "screenHtml": "<div class=\"q\">生き物の特徴を子に伝える「遺伝のもと」を、遺伝子という。</div>\n<div class=\"q\">生殖細胞ができるとき、対になった遺伝子は1つずつに分かれて、別々の生殖細胞に入る。</div>\n<div class=\"q\">父からの遺伝子と母からの遺伝子を、くじを引き合わせるみたいに組み合わせて数えると、この3:1が自然に出てくる。</div>\n<div class=\"q\">なんで偶然の組み合わせから、決まった割合が生まれるのか。そのしくみを見ていくよ。</div>", "ctxHtml": "<div class=\"li\">---</div>"}, {"type": "card", "uid": "u_bio_17", "id": "17-T1", "title": "同じ確からしさで、組み合わせて数える", "meta": "（種別: 地ならし／図: cimg/u_bio_17/lottery.png＝2つの箱からくじを1本ずつ引く場面イメージ・AI生成予定）", "screenHtml": "<div class=\"q\">くじ引きを思い出してみよう。中身が2種類のくじが、たくさん入った箱。どっちを引くかは「同じ確からしさ」——どちらも同じくらい引きやすい。</div>\n<div class=\"q\">こういう箱を2つ用意して、それぞれから1本ずつ引いて組み合わせる。何通りかの組み合わせができるね。</div>\n<div class=\"q\">全部が同じ確からしさなら、たくさんくり返したときの割合は、<b>組み合わせを数えるだけ</b>で見当がつく。</div>\n<div class=\"q\">この「同じ確からしさで組み合わせて、数えて割合を出す」考え方を、これから遺伝で使うよ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_17", "id": "17-T2", "title": "対立形質と、出るほう・隠れるほう", "meta": "（種別: 概念／図: cimg/u_bio_17/pea_seeds.png＝エンドウの丸い種子としわの種子の実物イメージ・AI生成予定）", "screenHtml": "<div class=\"q\">生き物のもつ色や形などの特徴を、形質という。</div>\n<div class=\"q\">エンドウの種子の「丸」と「しわ」のように、対になっていて同時には出ない形質を、対立形質という。</div>\n<div class=\"q\">丸い純系としわの純系をかけ合わせると、子はぜんぶ丸だった。子に出てくるほう（丸）を<b>顕性形質</b>、隠れて出てこないほう（しわ）を<b>潜性形質</b>という。</div>\n<div class=\"q\">しわの形質は、消えたわけじゃない。子の中にかくれていて、孫でまたあらわれるんだ。</div>\n<details class=\"col\"><summary>昔の呼び方を見る</summary><div class=\"colbody\"><div class=\"q\">顕性形質・潜性形質は、昔は「優性形質・劣性形質」と呼ばれていた。</div>\n<div class=\"q\">でも「優」「劣」の字だと、丸のほうがしわより優れている、みたいに読めてしまう。</div>\n<div class=\"q\">本当は、どちらが出やすいかのちがいで、良い・悪いの話じゃない。だから今は「顕（あらわれる）」「潜（かくれる）」の字を使う。</div></div></details>", "ctxHtml": "<div class=\"q\"></div>"}, {"type": "card", "uid": "u_bio_17", "id": "17-Q1", "title": "確認クイズ・セット1（形質・顕性・対立形質の節目・3問の類題・すべて既存流用・4択）", "meta": "", "screenHtml": "<div class=\"li\">- Q1 [既存・応用] 生物がもつ色や形などの特徴のうち、遺伝によって親から子へ伝わるものを何という？ → <b>形質</b>（選: 形質／器官／組織／刺激）</div>\n<div class=\"li\">- Q2 [既存・応用] エンドウの種子の形のように、対立形質を交配したとき子に現れるほうの形質を何という？ → <b>顕性形質</b>（選: 顕性形質／潜性形質／無性形質／中間形質）</div>\n<div class=\"li\">- Q3 [既存・応用] 丸い種子としわの種子のように、一方しか現れない対になる形質を何という？ → <b>対立形質</b>（選: 顕性形質／対立形質／分離形質／潜性形質）</div>", "ctxHtml": "<div class=\"li\">※3問とも「遺伝の用語を答える」同型・同難度（応用）でそろえた類題セット。この節目は似た用語（形質／顕性形質／潜性形質／対立形質）の選び分けが本題なので4択のまま（憲法4.7条の例外＝内容が選び分けを要求する時）。</div>"}, {"type": "card", "uid": "u_bio_17", "id": "17-T3", "title": "分離の法則——対の遺伝子が1つずつに分かれる", "meta": "（種別: 概念／図: card_gene_separation.png 新規・カードサイズ＝Aaの細胞から、Aが入った生殖細胞とaが入った生殖細胞が半分ずつできる・矢印1本ぶんの1軸）", "screenHtml": "<div class=\"q\">なんで孫でしわが復活するんだろう。そのカギが、遺伝子の伝わり方にある。</div>\n<div class=\"q\">遺伝子は対（2つで1組）になっている。丸の子は、丸の遺伝子と、かくれているしわの遺伝子を1つずつ持っている。丸の遺伝子を<b>A</b>、しわの遺伝子を<b>a</b>と書くと、この子は <b>Aa</b> だ（Aがあるから、見た目は丸）。</div>\n<div class=\"q\">生殖細胞ができるとき、この対の遺伝子（Aとa）は1つずつに分かれて、別々の生殖細胞に入る。これを<b>分離の法則</b>という。</div>\n<div class=\"q\">だから Aa の子からは、Aが入った生殖細胞と、aが入った生殖細胞が、半分ずつできるんだ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_17", "id": "17-T4", "title": "くじ引きの組み合わせ表（パネット表）", "meta": "（種別: 概念／図: card_mendel_punnett.png 新規・カードサイズ＝父Aa×母Aaの2×2表・4マスにAA／Aa／Aa／aa・丸のマスと しわのマスを色分け・見出し「組み合わせの表」・行/列は生殖細胞の昔の呼び名でなく遺伝子A・aで示す）", "screenHtml": "<div class=\"q\">孫の割合を、数えてみよう。丸の子（Aa）どうしをかけ合わせる。</div>\n<div class=\"q\">父の生殖細胞はAかa、母の生殖細胞もAかa。このA・aを、くじを引き合わせるみたいに組み合わせる表を作る。</div>\n<div class=\"q\">たてが父のA・a、よこが母のA・a。マスをうめると、<b>AA・Aa・Aa・aa</b> の4通りができる。</div>\n<div class=\"q\">どの組み合わせも、同じ確からしさ（さっきのくじ引きと同じ考え方）で出てくるよ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_17", "id": "17-T5", "title": "だから丸：しわ＝およそ3:1", "meta": "（種別: 達成の先出し／図: card_ratio_3to1.png 新規・カードサイズ＝4マスをAA1・Aa2・aa1と数え、Aをもつ3マス＝丸、aaの1マス＝しわ、丸:しわ=3:1）", "screenHtml": "<div class=\"q\">表の4マスを数えると、AAが1つ・Aaが2つ・aaが1つ。だから <b>AA:Aa:aa＝1:2:1</b>。</div>\n<div class=\"q\">Aを1つでも持てば、見た目は丸（顕性）になる。だから、丸（AA・Aa）：しわ（aa）＝<b>3:1</b>。</div>\n<div class=\"q\">これが、孫でおよそ3:1が毎回出てくるしくみだよ。</div>\n<div class=\"q\">バラバラに分かれた遺伝子が、たくさん組み合わさると、決まった割合になる——数えれば、ちゃんと出てくるんだ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_17", "id": "17-Q2", "title": "確認クイズ・セット2（分離の法則と3:1の節目・3問の類題・すべて既存流用・4択）", "meta": "", "screenHtml": "<div class=\"li\">- Q1 [既存・応用] 生殖細胞ができるとき、対になっている遺伝子が分かれてそれぞれ別の生殖細胞に入る。この法則を何という？ → <b>分離の法則</b>（選: 分離の法則／慣性の法則／質量保存の法則／フックの法則）</div>\n<div class=\"li\">- Q2 [既存・応用] F1(すべて丸)どうしを自家受粉させたとき、孫(F2)に現れる顕性形質と潜性形質のおよその数の比は？ → <b>顕性：潜性＝3:1</b>（選: 顕性：潜性＝3:1／顕性：潜性＝1:1／顕性：潜性＝2:1／顕性：潜性＝1:2:1）</div>\n<div class=\"li\">- Q3 [既存・受験] Aa×Aaの子に現れる顕性:潜性の比は。 → <b>3:1</b>（選: 3:1／1:1／1:3／すべて顕性）</div>", "ctxHtml": "<div class=\"li\">※この節目は少し難しめ。冒頭に <b>「今回は少し難しめ！ がんばって！」</b> を表示（憲法4.7条）。3問とも「分離の法則」と、そこから出る「3:1」を問う同概念の4択でそろえた（比の選び分けが本題なので4択）。難易度は応用2問＋受験1問（Q3）＝下の設計メモ参照。</div>\n<div class=\"li\">※設計メモ: 3問とも「分離の法則→3:1」という同じ節目の理解を、法則の名前（Q1）→比を言葉で（Q2）→比を記号Aa×Aaで（Q3）と角度を変えて問う類題セット。Q3のみ受験（supreme）で、Q1・Q2は応用（senior）＝<b>わずかな難度差がある</b>。カーネル指定どおり採用したが、この難度混在をそのままにするか、Q3を応用の別問題に差し替えるかは §17.5 でオーナー確認する。出どころ＝quiz-engine.js bio_cell（Q1=line89／Q2=line91／Q3=line296）。</div>\n<div class=\"li\">---</div>"}, {"type": "check", "uid": "u_bio_17", "id": "u_bio_17-確認1", "textHtml": "<b>確認クイズ・セット2（【17-Q2】）の難度混在</b>: カーネル指定の3問は応用2問＋受験1問（Q3＝Aa×Aaの3:1）です。憲法4.2は「難度ちがいの混在＝真の類題ではない」としています。①このまま3問（法則名→言葉の比→記号の比、と角度違いの類題として応用寄り2＋受験1）で出す ②Q3を応用（senior）の別の3:1問題か新規に差し替えて3問とも応用でそろえる——どちらがよいですか？（案①推し＝Q3の「Aa×Aa」の記号は、直前のT4・T5でちょうど教えた形なので、教えた直後に手を動かして確かめる価値がある。難度差はわずか。） - <b>あわせて確認したいDB是正候補（表記割れ・1点）</b>: 上の【17-Q2】Q2だけが「F1(すべて丸)どうしを自家受粉させた…孫(F2)…」とF1/F2の符号を使っています。本ユニット本線（P1〜P3・T1〜T5）は世代を一貫して『子』『孫』の日本語で書いており、この既存流用クイズだけ表記が割れます（F1/F2は高校生物の記法。東京書籍『新しい科学』の中学範囲では『子』『孫』が標準＝中3天井の方針からも外側）。[既存・応用]の原文なので原稿では勝手に直さず、DB是正候補として回します（憲法4.6）。是正案＝本線の表記に合わせ <b>「すべて丸の子どうしをかけ合わせたとき、孫に現れる顕性形質と潜性形質のおよその数の比は？」</b> とし、F1/F2を落とす。是正GOが出たらDB→全引用原稿を同期します。上の難度混在（案①/②）と一緒に判断できます。"}, {"type": "check", "uid": "u_bio_17", "id": "u_bio_17-確認2", "textHtml": "<b>T2に対立形質・形質までまとめて入れた点</b>: カーネルのT2は「顕性・潜性」1軸ですが、確認クイズ・セット1が形質・顕性・対立形質の3語を問うため、T2でこの語彙の束（対立形質＝対で同時に出ない／そのうち出るほう＝顕性・隠れるほう＝潜性）を一度に立てました。1カード1軸をわずかに超えますが、確認クイズの範囲を直前で教えるための最小限です。これでよいですか？"}, {"type": "check", "uid": "u_bio_17", "id": "u_bio_17-確認3", "textHtml": "<b>図版の遺伝子記号の表記</b>: 新規カード図では、生殖細胞を昔の図（mendel.png）のような古い呼び名では書かず、遺伝子の記号A・aで示します（憲法6.2＝生殖の単元で古い呼び名を使わない方針との整合）。この方針でよいですか？（必要なら「精細胞／卵細胞」と添えることも可能です。） ---"}, {"type": "unit", "uid": "u_bio_18", "name": "遺伝子の本体", "n": 9, "nc": 3}, {"type": "card", "uid": "u_bio_18", "id": "u_bio_18-R", "title": "レディネスチェック", "meta": "", "screenHtml": "<div class=\"li\">- 【18-R1】[既存・未修] 生物が子をつくるとき、子は親から「遺伝子」を受けつぐ。（○✕） → <b>○</b>（quiz-engine.js L1476・truefalse）</div>\n<div class=\"li\">- 【18-R2】[既存・未修] 染色体には、親から子へ伝わる遺伝の情報がふくまれている。（○✕） → <b>○</b>（quiz-engine.js L2245・truefalse）</div>\n<div class=\"li\">- 【18-R3】[既存・未修] これは細胞の図です。中心にある、遺伝の情報が入った丸い部分『核』をタッチしよう → <b>核</b>（quiz-engine.js L1437・imageTap／scene:cell）</div>\n<div class=\"q\">つまずいたときの誘いコピー（弱点表示ではなく招待状のトーン・憲法第2.5条／2.6条＝楽アピールで誘わない）:</div>\n<div class=\"q\">「<b>遺伝子や染色体のことを見なおしておくと、このあとの“本体は何か”の話がつながりやすくなるよ</b>」→ 該当の教えるカードへのボタンがそっと光る</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_18", "id": "18-P1", "title": "予想（Predict）", "meta": "どれを選んでも正誤なし・「なるほど」で次へ／図なし", "screenHtml": "<div class=\"q\">体をつくる細胞1個は、目に見えないくらい小さい。</div>\n<div class=\"q\">その細胞の中の「核」には、遺伝の情報をのせた物がしまってある。</div>\n<div class=\"q\">それをひものように全部ほどいて、まっすぐのばしたら、どれくらいの長さになると思う？</div>\n<div class=\"q\">「1mmくらい」／「1cmくらい」／「2mくらい」</div>", "ctxHtml": "<div class=\"q\"></div>"}, {"type": "card", "uid": "u_bio_18", "id": "18-P2", "title": "おどろき（Observe）", "meta": "図: fig_dna_length（新規・matplotlib・カードサイズ＝小さな細胞1個と、そこからほどけた約2mのひもを身長と見くらべる図。数値2mが意味を持つ＝自作。P1の予想の答えはこのO段階で初めて出す）", "screenHtml": "<div class=\"q\">のばすと、その長さはおよそ2m。</div>\n<div class=\"q\">目に見えないくらい小さい細胞1個の核の中に、身長より長いひもが、くしゃくしゃに折りたたまれてしまってある。</div>\n<div class=\"q\">このひもこそ、遺伝の情報が書き込まれた物、DNAなんだ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_18", "id": "18-P3", "title": "たね明かし（Explain）", "meta": "", "screenHtml": "<div class=\"q\">前の章で、形や性質（形質）を決めていた「遺伝子」。</div>\n<div class=\"q\">その遺伝子の正体、つまり本体になっている物が、このDNA（デオキシリボ核酸）だよ。</div>\n<div class=\"q\">DNAは、核の中の染色体にふくまれている。</div>\n<div class=\"q\">生き物の形や性質の設計図が、この1本のひもに書き込まれているんだ。</div>\n<div class=\"q\">今回は、その遺伝子の本体＝DNAを見ていくよ。</div>", "ctxHtml": "<div class=\"li\">---</div>"}, {"type": "card", "uid": "u_bio_18", "id": "18-T1", "title": "遺伝子の本体は、DNAという物質", "meta": "（種別: 概念／図なし）", "screenHtml": "<div class=\"q\">前の章では、親の形や性質を子に伝える「遺伝子」を習ったね。</div>\n<div class=\"q\">じゃあ、その遺伝子って、実際は何でできているんだろう。</div>\n<div class=\"q\">遺伝子の本体になっている物、それが<b>DNA</b>という物質なんだ。</div>\n<div class=\"q\">DNAは長い1本のひも。そのひものあちこちの部分が、形や性質を伝える1つ1つの遺伝子だよ。</div>\n<div class=\"q\">これが、遺伝子とDNAのつながりのしくみだよ。</div>\n<details class=\"col\"><summary>遺伝子とDNAはどうちがうの？</summary><div class=\"colbody\"><div class=\"q\">DNAは長い1本のひも。そのひものあちこちに、「目の色を決める」「花の色を決める」みたいに、形質を決める情報のまとまりがならんでいる。</div>\n<div class=\"q\">その情報のまとまり1つ1つが遺伝子。</div>\n<div class=\"q\">だから、DNA＝物そのもの、遺伝子＝そのひもの上の情報、と分けて考えるとすっきりするよ。</div></div></details>", "ctxHtml": "<div class=\"q\"></div>"}, {"type": "card", "uid": "u_bio_18", "id": "18-T2", "title": "DNAはどこにある？——核の中の染色体", "meta": "（種別: 概念／図: fig_dna_nest（新規・matplotlib・カードサイズ＝細胞→核→染色体→DNAへだんだんズームインする入れ子の図・印なし・1軸））", "screenHtml": "<div class=\"q\">DNAは、体のどこにあるんだろう。</div>\n<div class=\"q\">細胞の中には核がある。核の中には染色体がある。その染色体をつくっているのが、DNAだよ。</div>\n<div class=\"q\">細胞 → 核 → 染色体 → DNA、と、だんだん小さいものが入れ子になっている。</div>\n<div class=\"q\">つまりDNAは、細胞の核の中の、染色体にふくまれているんだ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_18", "id": "18-T3", "title": "DNAは、生き物の設計図", "meta": "（種別: 概念／図なし）", "screenHtml": "<div class=\"q\">DNAには、何が書き込まれているんだろう。</div>\n<div class=\"q\">目の色、髪の毛のようす、背の高さ……生き物の形や性質を決める情報が、ずらりと書き込まれている。</div>\n<div class=\"q\">だからDNAは、生き物の体をつくるための設計図のようなもの。</div>\n<div class=\"q\">この設計図を親から子へわたすことで、形や性質が伝わっていくんだ。</div>\n<details class=\"col\"><summary>DNAってどんな形なの？</summary><div class=\"colbody\"><div class=\"q\">DNAをうんと拡大すると、2本のひもがねじれてからみ合った、ねじれたはしごみたいな形をしている（二重らせんという）。</div>\n<div class=\"q\">このはしごの段の並び方が、そのまま「情報」になっている。</div>\n<div class=\"q\">形の細かい話は高校でくわしく習うよ。今は「情報が書き込まれた1本のひも」と分かっていればじゅうぶんだよ。</div></div></details>", "ctxHtml": "<div class=\"q\"></div>"}, {"type": "card", "uid": "u_bio_18", "id": "18-Q1", "title": "確認クイズ・セット1（遺伝子とDNAの見分け・3問・すべて既存流用・4択）", "meta": "", "screenHtml": "<div class=\"li\">- Q1 [既存・応用] 親のもつ形質(からだの特徴)を子に伝えるはたらきをするものを何という？ → <b>遺伝子</b>（選: 遺伝子／栄養分／酸素／色素）〔quiz-engine.js L99・diff senior＝応用〕</div>\n<div class=\"li\">- Q2 [既存・基礎] 細胞の核に主に含まれ、遺伝情報を担うものはどれか。 → <b>DNA</b>（選: デンプン／塩化ナトリウム／DNA／石灰水）〔quiz-engine.js L134・diff mid＝基礎〕</div>\n<div class=\"li\">- Q3 [既存・受験] 遺伝子の本体である物質は。 → <b>DNA</b>（選: タンパク質／デンプン／脂質／DNA）〔quiz-engine.js L299・diff supreme＝受験〕</div>", "ctxHtml": "<div class=\"li\">※T1〜T3の節目。3問とも「遺伝子・DNAという用語を、説明から選び当てる」同型セット。<b>遺伝子（はたらき）→DNA（核の中の物質）→遺伝子の本体＝DNA</b> と、このユニットの主役を一巡できるように並べた。選び分けが物質・用語の同定なので4択のまま（憲法4.7条の例外＝内容が選び分けを要求する時）。</div>\n<div class=\"li\">※設計メモ（要オーナー判断・§18.5に再掲）: この3問はカーネル指定の既存3問（L99/L134/L299）。<b>難易度タグが応用/基礎/受験とばらつく</b>点が憲法4.2条（同難度でそろえる）に触れる可能性がある。ただし実際の課題は3問とも「説明→用語を当てる」同一形式・同一の認知負荷で、diffタグの差は名目的と判断してカーネルどおり採用した。オーナーが「同難度でそろえたい／確認クイズは2択（4.7条の既定）にしたい」を選ぶ場合の<b>代替2択セット（新規）</b>を§18.5に用意した。</div>\n<div class=\"li\">---</div>"}, {"type": "card", "uid": "u_bio_18", "id": "18-T4", "title": "DNAの研究は、暮らしの中で役に立っている", "meta": "（種別: 達成の先出し・広げる／図: cimg/u_bio_18/research_use.png（AI生成予定・Sol＝品種改良や医療でDNAの知識が使われる身近な場面イメージ・実物差し替え可能））", "screenHtml": "<div class=\"q\">このDNAのしくみは、いまいろんなところで役に立っている。</div>\n<div class=\"q\">病気に強い作物をつくる品種改良、病気の原因を調べる医療、事件の犯人を見つける調査……。</div>\n<div class=\"q\">どれも、DNAにのった情報を読み取る技術が土台にある。</div>\n<div class=\"q\">目に見えない1本のひもの研究が、身のまわりの暮らしを変えているんだ。</div>\n<div class=\"q\">遺伝子の本体はDNA。核の中の染色体にあって、生き物の設計図になっている——これが今回のしくみだよ。</div>", "ctxHtml": "<div class=\"li\">---</div>"}, {"type": "check", "uid": "u_bio_18", "id": "u_bio_18-確認1", "textHtml": "<b>DNAの長さ「約2m」の数値照合</b>（憲法6.3条）: 導入O（【18-P2】）と図 fig_dna_length の「およそ2m」は、ヒト1細胞のDNAをほどいた全長の一般的な概数（東書もこの水準で扱う）。「およそ」は落としていないが、<b>手元教科書の記載値との最終照合</b>をお願いしたい（現物と食い違えば図と本文を同期修正）。"}, {"type": "check", "uid": "u_bio_18", "id": "u_bio_18-確認2", "textHtml": "<b>確認クイズ【18-Q1】の難易度タグのばらつき</b>: カーネル指定の既存3問（応用L99／基礎L134／受験L299）は、実際の課題（説明→用語同定）は同型・同負荷だが<b>diffタグが3段に分かれている</b>。このまま採用でよいか。もし「同難度でそろえたい」または「確認クイズは既定2択にしたい（憲法4.7条＝“できた感”のご褒美）」なら、下の<b>代替2択セット（新規・下書き）</b>に差し替える。 - 代替Q1 [新規・2択] 前の章で習った「遺伝子」。その本体になっている物質は、次のどっち？ → <b>DNA</b>（選: DNA／デンプン） - 代替Q2 [新規・2択] DNAがふくまれているのは、細胞の中のどこ？ → <b>核（の中の染色体）</b>（選: 核／細胞のいちばん外がわ） - 代替Q3 [新規・2択] DNAには、生き物の何が書き込まれている？ → <b>形や性質を決める情報（設計図）</b>（選: 形や性質を決める情報／その日の気温の記録） - ※代替3問とも同型・同難度（2択）でそろえてある。DBには入れない下書き。"}, {"type": "check", "uid": "u_bio_18", "id": "u_bio_18-確認3", "textHtml": "<b>T4の図（研究の活用イメージ）</b>: cimg/u_bio_18/research_use.png はAI生成（Sol）を想定。品種改良・医療・調査のどれを1枚のイメージにするのがよいか（実物写真への差し替えも将来可能）。 ---"}];
const KEY = "rika2_review_" + "\u751f\u7269B4 \u4e2d3\u7d30\u80de\u751f\u6b96\u907a\u4f1d(14\u7d30\u80de\u5206\u88c2/15\u751f\u6b96/16\u6e1b\u6570\u5206\u88c2/17\u907a\u4f1d/18DNA)";
let res = {}; try{ res = JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){}
let pos = +(localStorage.getItem(KEY+"_pos")||0);
const tappable = ITEMS.filter(i=>i.type!=="unit").length;
function save(){ localStorage.setItem(KEY, JSON.stringify(res)); localStorage.setItem(KEY+"_pos", pos); }
function doneCount(){ return Object.keys(res).length; }
function header(){
  document.getElementById("hcount").textContent = doneCount()+" / "+tappable;
  document.getElementById("hbar").style.width = (100*doneCount()/tappable)+"%";
}
function go(d){ pos=Math.max(0,Math.min(ITEMS.length,pos+d)); save(); render(); window.scrollTo(0,0); }
function mark(id, verdict){
  const t=[...document.querySelectorAll(".tag.on")].map(x=>x.textContent);
  const note=(document.getElementById("note")||{}).value||"";
  res[id]={v:verdict,tags:t,note:note}; save(); go(1);
}
function render(){
  header();
  const st=document.getElementById("stage");
  if(pos>=ITEMS.length){ st.innerHTML=exportView(); return; }
  const it=ITEMS[pos];
  const nav='<div class="nav"><button onclick="go(-1)">← まえへ</button><button onclick="go(1)">とばす →</button></div>';
  if(it.type==="unit"){
    st.innerHTML='<div class="unitcard"><div class="uid">'+it.uid+'</div><div class="big">'+it.name+'</div>'+
    '<div class="summary">カード '+it.n+'枚 ＋ 確認 '+it.nc+'件。<br>読む→ピンとくれば ◎OK、引っかかれば ✏。<br>迷ったら ⏭あとで（いつでも戻れる）。</div>'+
    '<div class="btns"><button class="b-ok" onclick="go(1)">はじめる</button></div></div>'+nav;
    return;
  }
  const prev=res[it.id];
  const badge=prev?('<span style="color:var(--gold)">［回答済: '+prev.v+'］</span>'):'';
  if(it.type==="card"){
    st.innerHTML='<div class="card"><div class="uid">'+it.uid+'｜【'+it.id+'】'+badge+'</div>'+
    '<h2>'+it.title+'</h2><div class="meta">'+it.meta+'</div>'+ it.screenHtml +
    (it.ctxHtml?('<div class="ctx">'+it.ctxHtml+'</div>'):'')+
    '<div class="btns">'+
    '<button class="b-ok" onclick="mark(\''+it.id+'\',\'OK\')">◎ OK</button>'+
    '<button class="b-warn" onclick="openWarn()">✏ 気になる</button>'+
    '<button class="b-skip" onclick="mark(\''+it.id+'\',\'あとで\')">⏭</button></div>'+
    '<div class="tags" id="tags">'+
    ['ことばが大人','ことばが幼い','教室でこう言わない','理科的にあやしい','長い','その他']
      .map(t=>'<button class="tag" onclick="this.classList.toggle(\'on\')">'+t+'</button>').join('')+'</div>'+
    '<textarea id="note" placeholder="ひとこと（任意・1語でもOK）"></textarea>'+
    '<button class="send" id="send" onclick="mark(\''+it.id+'\',\'気になる\')">この内容で送る</button>'+nav;
  } else {
    st.innerHTML='<div class="card"><div class="uid">'+it.uid+'｜確認 '+badge+'</div>'+
    '<div class="q">'+it.textHtml+'</div>'+
    '<div class="btns">'+
    '<button class="b-yes" onclick="mark(\''+it.id+'\',\'はい\')">はい</button>'+
    '<button class="b-no" onclick="mark(\''+it.id+'\',\'いいえ\')">いいえ</button>'+
    '<button class="b-skip" onclick="mark(\''+it.id+'\',\'あとで\')">⏭</button></div>'+
    '<textarea id="note" class="open" placeholder="補足（任意）"></textarea>'+nav;
  }
}
function openWarn(){
  document.getElementById("tags").classList.add("open");
  document.getElementById("note").classList.add("open");
  document.getElementById("send").classList.add("open");
}
function exportView(){
  const out={sheet:"\u751f\u7269B4 \u4e2d3\u7d30\u80de\u751f\u6b96\u907a\u4f1d(14\u7d30\u80de\u5206\u88c2/15\u751f\u6b96/16\u6e1b\u6570\u5206\u88c2/17\u907a\u4f1d/18DNA)",done:doneCount(),total:tappable,answers:res};
  const s=JSON.stringify(out,null,1);
  const warn=Object.entries(res).filter(([k,v])=>v.v==="気になる"||v.v==="いいえ").length;
  const esc=s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
  return '<div class="unitcard"><div class="big">おつかれさまでした 🎉</div>'+
  '<div class="summary">回答 '+doneCount()+'/'+tappable+'（✏気になる・いいえ: '+warn+'件）<br>'+
  '<b>下の枠の中身が結果のすべて</b>です。「📋 結果をコピー」→ Claudeに貼り付けで回収完了。<br>'+
  '<span style="color:var(--warn)">※このHTMLファイル自体には回答は保存されません（回答はこのブラウザの中）。必ずコピーか💾で外に出してください。</span></div>'+
  '<button class="exbtn" style="background:var(--gold);color:#241a03" onclick="navigator.clipboard.writeText(document.getElementById(\'exp\').value).then(()=>this.textContent=\'✓ コピーしました（Claudeに貼ってください）\')">📋 結果をコピー</button>'+
  '<button class="exbtn" style="background:#2a3245;color:#e8ecf5" onclick="dl()">💾 review_result.json で保存</button>'+
  '<textarea id="exp" class="open done" readonly>'+esc+'</textarea>'+
  '<div class="nav"><button onclick="go(-1)">← もどる</button><button onclick="pos=0;go(0)">最初から見直す</button></div></div>';
}
function dl(){
  const b=new Blob([document.getElementById("exp").value],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(b);
  a.download="review_result.json"; a.click();
}
render();
</script></body></html>
