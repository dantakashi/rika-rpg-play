<style>
:root{--bg:#12151c;--card:#1c2230;--ink:#e8ecf5;--sub:#9aa5b8;--gold:#e7b34c;--ok:#3dbb7c;--warn:#e0a83a}

.tags{display:none;margin-top:10px;gap:6px;flex-wrap:wrap}

.send{display:none;margin-top:8px;width:100%;padding:12px;border:none;border-radius:12px;background:var(--gold);color:#241a03;font-weight:700;font-size:15px;cursor:pointer}

.exbtn{width:100%;padding:14px;border:none;border-radius:12px;font-weight:700;font-size:16px;margin-top:10px;cursor:pointer}

.col{margin:9px 0;border:1px dashed var(--gold);border-radius:10px;background:#1a2130;overflow:hidden}

<script>
const ITEMS = [{"type": "unit", "uid": "u_bio_09", "name": "消化のしくみ", "n": 11, "nc": 4}, {"type": "card", "uid": "u_bio_09", "id": "u_bio_09-R", "title": "レディネスチェック", "meta": "", "screenHtml": "<div class=\"li\">- 【09-R1】[既存・基礎]（並べ替え） 食べ物が消化・吸収されて通る器官を、口から順に並べよう。 → <b>口 → 胃 → 小腸 → 大腸</b>（items: 口／胃／小腸／大腸）</div>\n<div class=\"li\">- 【09-R2】[既存・入門] 消化された養分の多くが吸収される器官はどこか。 → <b>小腸</b>（選: 食道／小腸／大腸／胃）</div>\n<div class=\"q\">つまずいたときの誘いコピー（弱点表示ではなく招待状のトーン・憲法第2.5条／楽アピールで誘わない第2.6条）:</div>\n<div class=\"q\">「<b>食べ物の通り道を思い出しておくと、このあとの消化の話がつながりやすくなるよ</b>」→ 該当の教えるカードへのボタンがそっと光る</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_09", "id": "09-P1", "title": "予想（Predict）", "meta": "どれを選んでも正誤なし・「なるほど」で次へ", "screenHtml": "<div class=\"q\">ごはんを口に入れて、飲みこまずに、ずっと噛んでいると——</div>\n<div class=\"q\">だんだん<b>甘く</b>なってくる。</div>\n<div class=\"q\">なんで甘くなると思う？</div>\n<div class=\"q\">「食べているうちに、あじに慣れて甘く感じるだけ」／「歯ですりつぶされて、米の中の甘い部分が出てくる」／「口の中で、ごはんが別のものに変わっている」</div>", "ctxHtml": "<div class=\"q\"></div>"}, {"type": "card", "uid": "u_bio_09", "id": "09-P2", "title": "おどろき（Observe）", "meta": "図: cimg/u_bio_09/rice_chewing.png（新規・カードサイズ＝ごはんを口でよく噛んでいる身近な場面のイメージだけ。しくみ・答えは描かない）", "screenHtml": "<div class=\"q\">ごはんの正体は<b>デンプン</b>。デンプンそのものは甘くない。</div>\n<div class=\"q\">でも、だ液の中の<b>アミラーゼ</b>というものが、そのデンプンを<b>麦芽糖（ばくがとう）</b>という甘い糖に切りかえている。</div>\n<div class=\"q\">つまり口の中で、もう<b>消化</b>が始まっているんだ。噛むほど甘くなるのは、その「はさみ」が働いた証拠。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_09", "id": "09-P3", "title": "たね明かし（Explain）", "meta": "", "screenHtml": "<div class=\"q\">食べ物は大きすぎて、そのままでは体に取りこめない。</div>\n<div class=\"q\">だから消化液の中の<b>消化酵素（しょうかこうそ）</b>が、栄養を小さく切る。これが消化のしくみだよ。</div>\n<div class=\"q\">デンプンはブドウ糖へ、タンパク質はアミノ酸へ、脂肪は脂肪酸とモノグリセリドへ。</div>\n<div class=\"q\">酵素の名前は「<b>どの栄養を切るはさみか</b>」で見ていくと、名前と栄養の対応が1本につながる。今回はそこを見にいくよ。</div>", "ctxHtml": "<div class=\"li\">---</div>"}, {"type": "card", "uid": "u_bio_09", "id": "09-T1", "title": "消化＝食べ物を吸える小ささに切ること", "meta": "（種別: 概念／図: card_digest_tract.png 新規・matplotlib・カードサイズ＝口→食道→胃→小腸→大腸の1本道・器官名だけ・印なし）", "screenHtml": "<div class=\"q\">食べ物は、口から入って、決まった1本の道を通って進んでいく。</div>\n<div class=\"q\"><b>口 → 食道 → 胃 → 小腸 → 大腸</b>。この1本道を<b>消化管（しょうかかん）</b>という。</div>\n<div class=\"q\">食べ物は大きすぎて、そのままでは体に入れない。この道を進みながら、少しずつ小さく切られていく。この、栄養を吸える小ささに切っていくことが<b>消化</b>だよ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_09", "id": "09-T2", "title": "消化酵素＝栄養を切るはさみ", "meta": "（種別: 概念／図: card_enzyme_cut.png 新規・matplotlib・カードサイズ＝大きい栄養のかたまりが酵素で小さく切られる模式図・印なし）", "screenHtml": "<div class=\"q\">栄養を切っているのは、消化液の中の<b>消化酵素</b>。</div>\n<div class=\"q\">はさみが1本ずつ切るものを持っているように、消化酵素も<b>決まった栄養だけ</b>を切る。</div>\n<div class=\"q\">・<b>アミラーゼ</b>（だ液など）→ <b>デンプン</b>を切る</div>\n<div class=\"q\">・<b>ペプシン</b>（胃液）→ <b>タンパク質</b>を切る</div>\n<div class=\"q\">・<b>リパーゼ</b>（すい液）→ <b>脂肪</b>を切る</div>\n<div class=\"q\">名前を「どの栄養を切るはさみか」で見ると、3つの対応がそのまま覚えられるんだ。</div>\n<details class=\"col\"><summary>なんで決まった栄養しか切れないの？</summary><div class=\"colbody\"><div class=\"q\">消化酵素は、切る相手の形が決まっている。鍵と鍵穴みたいに、形がぴったり合う栄養にだけくっついて、そこを切る。</div>\n<div class=\"q\">だからアミラーゼはデンプン専門、ペプシンはタンパク質専門。ほかの栄養には手を出さない。</div>\n<div class=\"q\">このしくみは、もっと先の理科でくわしく出てくるよ。</div></div></details>", "ctxHtml": "<div class=\"q\"></div>"}, {"type": "card", "uid": "u_bio_09", "id": "09-Q1", "title": "確認クイズ・セット1（酵素と栄養の対応の節目・3問の類題・4択）", "meta": "", "screenHtml": "<div class=\"li\">- Q1 [既存・入門] 胃液にふくまれ、タンパク質を分解する消化酵素はどれか。 → <b>ペプシン</b>（選: ペプシン／アミラーゼ／リパーゼ／カタラーゼ）</div>\n<div class=\"li\">- Q2 [新規] デンプンを分解する消化酵素はどれか。 → <b>アミラーゼ</b>（選: アミラーゼ／ペプシン／リパーゼ／カタラーゼ）</div>\n<div class=\"li\">- Q3 [新規] 脂肪を分解する消化酵素はどれか。 → <b>リパーゼ</b>（選: リパーゼ／アミラーゼ／ペプシン／カタラーゼ）</div>", "ctxHtml": "<div class=\"li\">※3問とも「Xを分解する消化酵素はどれか」の同型・同難度（入門）でそろえた類題セット。この節目は酵素の選び分けが本題なので4択のまま（憲法第4.7条の例外＝内容が選び分けを要求する時）。既存の同型（【09-Q1-a】）に、同じ形の新規2問をそろえた。</div>\n<div class=\"li\">※設計メモ: Q1の出どころ＝quiz-engine.js line195（bio_human・diff:&#x27;junior&#x27;＝画面表記「入門」）。既存の類題として line194「アミラーゼを含む消化液は？→だ液」も同分野入門に実在するが、そちらは「消化液を選ぶ」形で答えの品詞がずれる（4.2の概念そろえ）ため、本セットは「酵素を選ぶ」1形式にそろえ、Q2・Q3を同型で新規に書き下ろした。line194は練習プールの兄弟問題として活きる。</div>"}, {"type": "card", "uid": "u_bio_09", "id": "09-T3", "title": "消化の最終形＝分解された栄養の姿", "meta": "（種別: 概念／図なし・分解の対応をカード内に文字で）", "screenHtml": "<div class=\"q\">消化酵素に切られ続けると、栄養は最後にいちばん小さい姿になる。</div>\n<div class=\"q\">・<b>デンプン → ブドウ糖</b></div>\n<div class=\"q\">・<b>タンパク質 → アミノ酸</b></div>\n<div class=\"q\">・<b>脂肪 → 脂肪酸とモノグリセリド</b></div>\n<div class=\"q\">ここまで小さくなって、はじめて体の中に取りこめる。切る相手（栄養）と、切られたあとの姿（最終形）を、上下でセットにして見るとつながるよ。</div>\n<details class=\"col\"><summary>胆汁（たんじゅう）って酵素なの？</summary><div class=\"colbody\"><div class=\"q\">胆汁は肝臓でつくられる消化液だけど、じつは消化酵素はふくんでいない。</div>\n<div class=\"q\">胆汁は、大きな脂肪のかたまりを細かい粒にばらすはたらきをする。細かくなると、リパーゼがたくさんの面を切れて、消化が進みやすくなる。</div>\n<div class=\"q\">自分では切らないけれど、リパーゼの仕事を助ける係なんだ。</div></div></details>", "ctxHtml": "<div class=\"q\"></div>"}, {"type": "card", "uid": "u_bio_09", "id": "09-T4", "title": "吸収の場所＝小腸の柔毛", "meta": "（種別: 概念／図: card_villi.png 新規・matplotlib・カードサイズ＝小腸のかべの柔毛の断面＝表面積が大きい＋ブドウ糖/アミノ酸→毛細血管・脂肪酸→リンパ管の行き先・印なし）", "screenHtml": "<div class=\"q\">小さくなった栄養は、<b>小腸</b>のかべから体に取りこまれる。これが<b>吸収</b>。</div>\n<div class=\"q\">小腸のかべには、<b>柔毛（じゅうもう）</b>という小さな突起がびっしり生えている。突起がたくさんあると、栄養にふれる面が大きくなって、効率よく吸収できるんだ。</div>\n<div class=\"q\">吸収された栄養の行き先は2つに分かれる。</div>\n<div class=\"q\">・<b>ブドウ糖・アミノ酸</b> → 柔毛の中の<b>毛細血管</b>へ</div>\n<div class=\"q\">・<b>脂肪酸とモノグリセリド</b> → 再び脂肪になって<b>リンパ管</b>へ</div>\n<details class=\"col\"><summary>なんで脂肪だけリンパ管なの？</summary><div class=\"colbody\"><div class=\"q\">ブドウ糖やアミノ酸は水にとけやすいので、そのまま毛細血管の血液に入って運ばれる。</div>\n<div class=\"q\">脂肪は水にとけにくい。だから血管にそのまま入れず、いったんリンパ管という別の道を通って、あとから血液に合流する。</div>\n<div class=\"q\">とけやすいか・とけにくいかで、通る道が分かれているんだ。</div></div></details>", "ctxHtml": "<div class=\"q\"></div>"}, {"type": "card", "uid": "u_bio_09", "id": "09-Q2", "title": "確認クイズ・セット2（吸収のしくみの節目・3問の類題・4択）", "meta": "", "screenHtml": "<div class=\"li\">- Q1 [既存・入門] 小腸のかべにあり、養分を吸収する表面積を広げている小さな突起の名前は？ → <b>柔毛（柔突起）</b>（選: 柔毛（柔突起）／肺胞／じん臓／気孔）</div>\n<div class=\"li\">- Q2 [新規] 小腸の柔毛がたくさんあることの利点はどれか。 → <b>養分にふれる表面積が大きくなる</b>（選: 養分にふれる表面積が大きくなる／水の量がふえる／消化が止まる／酸素が増える）</div>\n<div class=\"li\">- Q3 [新規] 小腸の柔毛で吸収されたブドウ糖やアミノ酸が入るのはどこか。 → <b>毛細血管</b>（選: 毛細血管／リンパ管／気孔／胆のう）</div>", "ctxHtml": "<div class=\"li\">※3問とも「小腸の柔毛による吸収のしくみ」を問う同型・同難度（入門）でそろえた類題セット。柔毛のつくり・利点・行き先の選び分けが本題なので4択のまま（憲法第4.7条の例外）。</div>\n<div class=\"li\">※設計メモ: Q1の出どころ＝quiz-engine.js line197（bio_human・diff:&#x27;junior&#x27;＝「入門」）。Q2は同分野 line288（supreme「小腸の柔毛があることの利点は→表面積が広がる」）と同じ考えを入門にならして新規化（既存は受験diffのため難度がそろわない＝4.2）。Q3は同分野 line216（mid「ブドウ糖やアミノ酸が吸収されて入るのは→毛細血管」）と同じ問いを入門にそろえて新規化（既存は基礎diffで、柔毛セットの入門3連にそろえるため）。line216・288は練習プールの兄弟問題として活きる。リンパ管はT4で教えた行き先の一方（脂肪酸の道）なので、ブドウ糖の行き先を問うQ3の妥当な誤答になる（憲法第4.3条＝誤った組成を見せる型ではない）。</div>"}, {"type": "card", "uid": "u_bio_09", "id": "09-T5", "title": "締め——食べたものが体の一部になるまで", "meta": "（種別: 達成の先出し／図: card_digest_map.png 新規・matplotlib・カードサイズ＝消化管の1本道に、各器官で働く消化酵素と分解される栄養、最後の吸収の行き先を並べた総まとめ図・印なし）", "screenHtml": "<div class=\"q\">これで、食べたものが体に入るまでの流れが1本につながった。</div>\n<div class=\"q\">口・胃・小腸で、消化酵素がそれぞれの栄養を小さく切る（消化）→ デンプンはブドウ糖、タンパク質はアミノ酸、脂肪は脂肪酸とモノグリセリドへ → 小腸の柔毛から体に入る（吸収）。</div>\n<div class=\"q\">酵素の名前を「どの栄養を切るはさみか」で見れば、名前・栄養・分解後の姿が、まとめてわかるようになる。この見方は、このあとの呼吸や血液の話ともつながっていくよ。</div>", "ctxHtml": "<div class=\"li\">---</div>"}, {"type": "check", "uid": "u_bio_09", "id": "u_bio_09-確認1", "textHtml": "<b>レディネスを2問にした点</b>: このユニットの新語（酵素名・分解後の姿・柔毛）を先渡しせずに済ませると、前提として置けるのは小学校既習の「消化管の順」「小腸で吸収」の2点にほぼ絞られました（憲法第5条）。「ごはんが甘くなる＝だ液のはたらき」も小学校で触れますが、それはP2のおどろきの核なので、先に見せないためレディネスから外しています。2問で十分か、もう1問（例: 「食べ物から養分をとることを何という？」系の小学校問）を足すか。"}, {"type": "check", "uid": "u_bio_09", "id": "u_bio_09-確認2", "textHtml": "<b>確認クイズの4択維持</b>: 既定2択（第4.7条）に対し、両セットとも「酵素の選び分け」「柔毛のつくり・行き先の選び分け」が本題のため4択にしました。既存流用の兄弟問題も4択です。この判断でよいか（u_bio_08と同じ扱い）。"}, {"type": "check", "uid": "u_bio_09", "id": "u_bio_09-確認3", "textHtml": "<b>「はさみ」の比喩</b>: 酵素を「決まった栄養だけを切るはさみ」で束ねました（カーネルの創作の核）。切るという行為に写す機能する比喩として使っていますが、現場で生徒に届く言い方かどうか、実感とのズレがあれば赤入れをお願いします。"}, {"type": "check", "uid": "u_bio_09", "id": "u_bio_09-確認4", "textHtml": "<b>図版5枚</b>: 新規matplotlib4枚＋P2のイメージ写真1枚（Sol生成）。過不足の判断（落とすならどれか）。 ---"}, {"type": "unit", "uid": "u_bio_10", "name": "呼吸・血液循環", "n": 11, "nc": 4}, {"type": "card", "uid": "u_bio_10", "id": "u_bio_10-R", "title": "レディネスチェック", "meta": "", "screenHtml": "<div class=\"li\">- 【10-R1】[既存・入門] 小腸の内側にある、養分の吸収面積を広げるつくりはどれか。 → <b>柔毛</b>（選: 柔毛／肺胞／気孔／腎臓）〔quiz-engine.js line 65〕</div>\n<div class=\"li\">- 【10-R2】[既存・入門] だ液に含まれ、デンプンを分解する消化酵素はどれか。 → <b>アミラーゼ</b>（選: アミラーゼ／ペプシン／ヘモグロビン／インスリン）〔line 63〕</div>\n<div class=\"li\">- 【10-R3】[既存・入門] 胃で主にタンパク質の消化に関わる消化酵素はどれか。 → <b>ペプシン</b>（選: ペプシン／アミラーゼ／リパーゼ／胆汁）〔line 64〕</div>\n<div class=\"q\">つまずいたときの誘いコピー（弱点表示ではなく招待状のトーン・憲法第2.5条／第2.6条＝楽アピールで誘わない）:</div>\n<div class=\"q\">「<b>吸収のしくみを見なおしておくと、このあとの『養分と酸素を運ぶ話』がつながりやすくなるよ</b>」→ 該当の教えるカードへのボタンがそっと光る</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_10", "id": "10-P1", "title": "予想（Predict）", "meta": "どれを選んでも正誤なし・「なるほど」で次へ ／図: cimg/u_bio_10/p1_hold_breath.png（AI生成予定・息を止めている場面のイメージ・答えは載せない）", "screenHtml": "<div class=\"q\">息を止めていられるのは、がんばってもせいぜい1分くらい。</div>\n<div class=\"q\">食べものなら何時間も食べなくてもだいじょうぶなのに、酸素はほんの少しも止められない。</div>\n<div class=\"q\">なんで、そんなにひんぱんに酸素を吸わなきゃいけないんだと思う？</div>\n<div class=\"q\">「酸素は動くのにたくさん使うから」／「肺がすぐにしぼんでしまうから」／「二酸化炭素を出すためだけ」</div>", "ctxHtml": "<div class=\"q\"></div>"}, {"type": "card", "uid": "u_bio_10", "id": "10-P2", "title": "おどろき（Observe）", "meta": "", "screenHtml": "<div class=\"q\">体をつくっている細胞は、数十兆個。その一つひとつが、休みなく酸素を使って、養分からエネルギーをとり出している。</div>\n<div class=\"q\">しかも、使う酸素は貯金ができない。少しでも配るのが止まると、細胞はエネルギーをつくれなくなる。</div>\n<div class=\"q\">だから体は、24時間ずっと、全身のすみずみへ酸素を配り続けている。その配達をやっているのが、血液なんだ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_10", "id": "10-P3", "title": "たね明かし（Explain）", "meta": "", "screenHtml": "<div class=\"q\">肺で酸素を受け取った血液が、心臓のポンプで全身へ送られ、細胞に酸素を渡して、二酸化炭素を受け取って帰ってくる。</div>\n<div class=\"q\">この行ったり来たりが、血液循環。</div>\n<div class=\"q\">血管には「心臓から出ていく血管」と「心臓へもどってくる血管」の2種類がある。</div>\n<div class=\"q\">今回は、肺での呼吸から、心臓・血液・血管・循環までを、一本の線でつないでいくよ。</div>", "ctxHtml": "<div class=\"li\">---</div>"}, {"type": "card", "uid": "u_bio_10", "id": "10-T1", "title": "呼吸——肺で酸素を取り入れ、二酸化炭素を出す", "meta": "（種別: 概念／図: card_lung_alveoli.png 新規・カードサイズ＝肺胞1つとまわりの毛細血管、酸素が血液へ・二酸化炭素が血液から出る矢印だけ・印なし）", "screenHtml": "<div class=\"q\">息を吸うと、空気は気管を通って肺に入る。</div>\n<div class=\"q\">肺の中は、気管の先が枝分かれして、そのいちばん先に小さなふくろがぶどうの房のようにたくさんついている。このふくろを<b>肺胞（はいほう）</b>という。</div>\n<div class=\"q\">肺胞のまわりには、細い血管（毛細血管）がびっしり巻きついている。</div>\n<div class=\"q\">ここで、空気中の酸素が血液に取り入れられ、血液が運んできた二酸化炭素が空気中へ出される。この気体の出し入れが<b>呼吸</b>だよ。</div>\n<div class=\"q\">肺胞は数がとても多い。小さく分けるほど、空気とふれる面の合計は広くなる。だから酸素と二酸化炭素の出し入れがはかどるんだ。（小腸の柔毛と同じ、表面積を広げる工夫だね。）</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_10", "id": "10-T2", "title": "細胞の呼吸——酸素は、細胞が使うために運ばれる", "meta": "（種別: 概念／図なし）", "screenHtml": "<div class=\"q\">肺で取り入れた酸素は、なんのために運ばれるんだろう。</div>\n<div class=\"q\">体の細胞は、運ばれてきた酸素を使って、養分を分解し、そこからエネルギーをとり出している。このとき、二酸化炭素と水ができる。</div>\n<div class=\"q\">細胞が酸素を使ってエネルギーをとり出すこのはたらきを、<b>細胞の呼吸</b>という。</div>\n<div class=\"q\">肺でする呼吸（酸素を取り入れる）と、細胞でする呼吸（酸素を使う）は、別のこと。肺は入口、細胞は使う場所。この2つがつながって、はじめて「息を吸う理由」がそろうんだ。</div>\n<details class=\"col\"><summary>細胞のどこで酸素を使うの？</summary><div class=\"colbody\"><div class=\"q\">細胞の中には、酸素を使ってエネルギーをとり出す、専用の小さな部屋のようなつくりがある。ミトコンドリアという名前がついている。</div>\n<div class=\"q\">中学では「細胞が酸素を使ってエネルギーをとり出す」まででじゅうぶん。もっと先の理科では、この部屋の中で何が起きているかを、くわしく調べていくことになるよ。</div></div></details>", "ctxHtml": "<div class=\"q\"></div>"}, {"type": "card", "uid": "u_bio_10", "id": "10-T3", "title": "血管の名前は「向き」で決まる", "meta": "（種別: 概念／図: card_vessel_direction.png 新規・カードサイズ＝心臓を中心に、出ていく血管と、もどってくる血管を矢印の向きだけで示す・血液の色はつけない・印なし）", "screenHtml": "<div class=\"q\">血管には2種類ある。名前は、血液の<b>向き</b>で決まる。</div>\n<div class=\"q\">心臓から<b>出ていく</b>血液が流れる血管を<b>動脈</b>という。</div>\n<div class=\"q\">心臓へ<b>もどってくる</b>血液が流れる血管を<b>静脈</b>という。</div>\n<div class=\"q\">動脈と静脈は、体のすみずみで、とても細い血管（毛細血管）でつながっている。ここで細胞と、酸素・養分・二酸化炭素のやりとりをするんだ。</div>\n<div class=\"q\">ここでのポイントはひとつだけ。<b>動脈か静脈かは「向き」で決まる</b>、ということ。酸素が多いか少ないか（血液の色）とは、いったん切りはなして覚えるといい。その理由は、最後のカードでわかるよ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_10", "id": "10-T4", "title": "血液の成分——4つの役割", "meta": "（種別: 概念／図: card_blood_cells.png 新規・カードサイズ＝赤血球・白血球・血小板・血しょうを並べ、それぞれの役割を1行ずつ・印なし）", "screenHtml": "<div class=\"q\">血液は、赤い液体がただ流れているわけじゃない。役割のちがう成分が混ざっている。</div>\n<div class=\"q\">・<b>赤血球</b>……酸素を運ぶ。中にふくまれる<b>ヘモグロビン</b>が酸素とくっついて、全身へ届ける。</div>\n<div class=\"q\">・<b>白血球</b>……体に入った細菌などの異物を取りこんで分解し、体を守る。</div>\n<div class=\"q\">・<b>血小板</b>……出血したとき、血液を固めて止血する。</div>\n<div class=\"q\">・<b>血しょう</b>……血液の液体の部分。養分や不要物、二酸化炭素をとかして運ぶ。</div>\n<div class=\"q\">赤血球・白血球・血小板は固形の成分、血しょうは液体の成分。この2つに分けて見られればOKだよ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_10", "id": "10-Q1", "title": "確認クイズ・セット1（血液の成分の節目・3問の類題・すべて既存流用・4択）", "meta": "", "screenHtml": "<div class=\"li\">- Q1 [既存・入門] 血液の成分のうち、酸素を運ぶはたらきをするものはどれか。 → <b>赤血球</b>（選: 血小板／血しょう／赤血球／白血球）〔line 201〕</div>\n<div class=\"li\">- Q2 [既存・入門] 体内に入った細菌などの異物を取りこんで分解し、体を守る血液の成分はどれですか。 → <b>白血球</b>（選: 酸素を運ぶ赤血球／出血を止める血小板／養分を運ぶ血しょう／白血球）〔line 202〕</div>\n<div class=\"li\">- Q3 [既存・入門] 出血したときに血液を固めて止血に関わる成分はどれか。 → <b>血小板</b>（選: 血小板／赤血球／白血球／ヘモグロビン）〔line 203〕</div>", "ctxHtml": "<div class=\"li\">※3問とも「どの血液成分が、その役割をするか」を問う同型・同難度（入門）でそろえた類題セット。この節目は4つの成分の選び分けが本題なので4択のまま（憲法第4.7条の例外＝内容が選び分けを要求する時。u_bio_08【08-Q1】と同じ扱い）。</div>\n<div class=\"li\">※設計メモ: 3問とも「役割→成分」を問う入門の同概念・同難度セット。答えは赤血球・白血球・血小板の3種でばらけさせ、成分ごとの役割を1回で確かめられるようにした。選択肢の言い回しは既存問題を原文どおり引用しているため、Q2だけ選択肢が「成分＋役割」の説明形になっている（A案＝既存流用の構造的な性質。量産フェーズで言い回しをそろえるかは持ち越し・憲法第4.6条の是正候補としてオーナー確認§10.5-1に記載）。</div>"}, {"type": "card", "uid": "u_bio_10", "id": "10-T5", "title": "2つのループ——肺循環と体循環（ここで「向き」と「色」を重ねる）", "meta": "（種別: 概念／図: card_circulation.png 新規・カードサイズ＝心臓を中心に、肺循環と体循環の2つのループを色分け・動脈血=赤／静脈血=青・印なし）", "screenHtml": "<div class=\"q\">血液は、心臓を出発して、大きく2つのループを回っている。</div>\n<div class=\"q\">・<b>肺循環</b>……心臓 → 肺 → 心臓。肺で酸素を受け取って、心臓へもどるループ。</div>\n<div class=\"q\">・<b>体循環</b>……心臓 → 全身 → 心臓。全身の細胞に酸素を渡して、二酸化炭素を受け取って、心臓へもどるループ。</div>\n<div class=\"q\">ここで、はじめて血液の色を重ねる。酸素を多くふくむ血液を<b>動脈血</b>（赤）、二酸化炭素を多くふくむ血液を<b>静脈血</b>（青）という。</div>\n<div class=\"q\">さて、ここが最初に切りはなしておいた理由。<b>肺へ向かう血管（肺動脈）には、酸素の少ない静脈血が流れている。</b> 心臓から出ていく向きだから名前は「動脈」、でも中身はこれから肺で酸素をもらう静脈血——名前と中身が逆に見えるんだ。</div>\n<div class=\"q\">これが起きるのは、<b>血管の名前は「向き」で、血液の名前は「酸素の多い少ない」で決まる</b>から。2つは別のものさし。だから【10-T3】で先に「向き」だけを覚えておいたんだ。</div>\n<div class=\"q\">これが、血液循環のしくみだよ。向きで血管を、色で血液を、それぞれ見分けられればOK。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_10", "id": "10-Q2", "title": "確認クイズ・セット2（2つの循環の節目・3問の類題・既存2＋新規1・4択）", "meta": "", "screenHtml": "<div class=\"li\">- Q1 [既存・基礎] 心臓と肺の間だけをめぐる血液の流れを何といいますか。 → <b>肺循環</b>（選: 肺循環／体循環／消化／反射）〔line 71〕</div>\n<div class=\"li\">- Q2 [新規・基礎] 心臓から出て全身をめぐり、また心臓へもどる血液の流れを何というか。 → <b>体循環</b>（選: 肺循環／体循環／消化／呼吸）</div>\n<div class=\"li\">- Q3 [既存・基礎] 心臓から送り出された血液が肺を通り、また心臓へもどる血液の道すじを何といいますか。 → <b>肺循環</b>（選: 体循環／門脈循環／リンパ循環／肺循環）〔line 218〕</div>", "ctxHtml": "<div class=\"li\">※3問とも「この血液の流れ（道すじ）を何というか」を問う同型・同難度（基礎）でそろえた類題セット。肺循環・体循環の選び分けが本題なので4択。</div>\n<div class=\"li\">※設計メモ: Q1・Q3はどちらも肺循環（心臓と肺のあいだ）を、問題文と選択肢のならびを変えて2つの角度から確かめる既存問題。Q2は、その対になる体循環（心臓と全身のあいだ）を問う同型を、既存プールに基礎の「体循環を答えさせる」問題が無かったため新規で書き下ろした（Q1のミラー・同概念/同形式/同難度）。DBには追加しない下書き。</div>\n<div class=\"li\">---</div>"}, {"type": "check", "uid": "u_bio_10", "id": "u_bio_10-確認1", "textHtml": "<b>【10-Q1】Q2の選択肢の形式</b>: 既存問題（line 202）の選択肢が「酸素を運ぶ赤血球／出血を止める血小板／…」と説明つきで、Q1・Q3の素の成分名（赤血球／白血球…）と形式がそろっていません（憲法第4.6条＝形式をそろえる）。原文どおり引用していますが、DB是正で選択肢を素の成分名にそろえる候補にしますか？（勝手には直しません。是正GOが出たらDB→引用原稿を同期。）"}, {"type": "check", "uid": "u_bio_10", "id": "u_bio_10-確認2", "textHtml": "<b>血管の向き（動脈／静脈）の難所を、確認クイズに入れるか</b>: カーネルの確認クイズ配置は「血液の成分」「2つの循環」の2セットで、血管の向きは練習プール（応用）に持たせました。この単元いちばんの難所（動脈／静脈と動脈血／静脈血の混同）なので、<b>Set1の前あたりに「向き」の入門2択セットを1つ足したほうが安心</b>、という判断もありえます。足す場合は【10-T3】直後に2択×2〜3（新規）を追加します。カーネル準拠（2セット・向きは練習側）のままでよいか、1セット足すか、ご判断ください。"}, {"type": "check", "uid": "u_bio_10", "id": "u_bio_10-確認3", "textHtml": "<b>【10-T2】細胞の呼吸の深さ</b>: 中2の範囲として「細胞が酸素を使い、養分を分解してエネルギーをとり出す。二酸化炭素と水ができる」までにとどめ、ミトコンドリアは任意コラムに逃がしました（本線・確認クイズでは問いません）。この線引きでよいか、東書の記述との最終照合をお願いします。"}, {"type": "check", "uid": "u_bio_10", "id": "u_bio_10-確認4", "textHtml": "<b>図版5枚の作り方</b>: card_lung_alveoli／card_vessel_direction／card_blood_cells／card_circulation は、矢印の向き・成分の対応・2ループの色分けが意味を持つため <b>matplotlib（note_figures方式）</b> で起こす予定です（憲法第7条）。P1のイメージ（息を止める場面）だけ AI画像（Sol）。この2本立てでよいか。 ---"}, {"type": "unit", "uid": "u_bio_11", "name": "排出のしくみ", "n": 11, "nc": 4}, {"type": "card", "uid": "u_bio_11", "id": "u_bio_11-R", "title": "レディネスチェック", "meta": "", "screenHtml": "<div class=\"li\">- 【11-R1】[既存・入門] 血液が血管の中を流れて全身をめぐることを何というか。 → <b>血液の循環</b>（選: 血液の循環／消化／蒸散／光合成）</div>\n<div class=\"li\">- 【11-R2】[既存・入門] 血液の成分のうち、酸素を全身へ運ぶはたらきが大きいのはどれか。 → <b>赤血球</b>（選: 赤血球／白血球／血小板／血しょう）</div>\n<div class=\"li\">- 【11-R3】[既存・入門] 消化されてできた養分を、おもに吸収するのはどの器官か。 → <b>小腸</b>（選: 小腸／食道／気管／ぼうこう）</div>\n<div class=\"q\">つまずいたときの誘いコピー（弱点表示ではなく招待状のトーン・憲法第2.5条・2.6条＝楽アピールで誘わない）:</div>\n<div class=\"q\">「<b>血液が全身をめぐるしくみを見なおしておくと、このあとの『ゴミを捨てる話』がつながりやすくなるよ</b>」→ 該当の教えるカードへのボタンがそっと光る</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_11", "id": "11-P1", "title": "予想（Predict）", "meta": "どれを選んでも正誤なし・「なるほど」で次へ", "screenHtml": "<div class=\"q\">体は、食べた養分を使ってエネルギーを取り出す。そのとき、いらないゴミも出る。</div>\n<div class=\"q\">とくにタンパク質を使うと、<b>アンモニア</b>というものができる。</div>\n<div class=\"q\">このアンモニア、体はどうしていると思う？</div>\n<div class=\"q\">「そのまま体の外に出す」／「体の中にためておく」／「別のものに変えてから出す」</div>", "ctxHtml": "<div class=\"q\"></div>"}, {"type": "card", "uid": "u_bio_11", "id": "11-P2", "title": "おどろき（Observe）", "meta": "図なし（設計メモ参照＝この段階の図は答えを先渡ししてしまう・憲法第7条）", "screenHtml": "<div class=\"q\">アンモニアは、<b>ほんの少しでも体に毒</b>。ためておくことも、そのまま流すこともできない。</div>\n<div class=\"q\">だから体は、わざわざ<b>肝臓（かんぞう）</b>で毒の少ない<b>尿素（にょうそ）</b>に<b>作りかえて</b>から捨てている。</div>\n<div class=\"q\">いらないゴミを、そのまま出すんじゃなくて、一度&quot;作りかえて&quot;から出しているんだ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_11", "id": "11-P3", "title": "たね明かし（Explain）", "meta": "", "screenHtml": "<div class=\"q\">細胞が出したいらないもの（不要物）を、体の外に出すことを<b>排出（はいしゅつ）</b>という。</div>\n<div class=\"q\">アンモニアは肝臓で尿素に作りかえられ、その尿素を<b>腎臓（じんぞう）</b>が血液からこし取って<b>尿（にょう）</b>にする。</div>\n<div class=\"q\">血液から不要物をこし取る腎臓は、いわば<b>血液のフィルター</b>。</div>\n<div class=\"q\">「どこで作りかえて、どこでこし取るか」——この2つに分ければ、排出はすっきりわかる。今回は、その2つを見ていくよ。</div>", "ctxHtml": "<div class=\"li\">---</div>"}, {"type": "card", "uid": "u_bio_11", "id": "11-T1", "title": "排出——不要物を体の外へ出す", "meta": "（種別: 概念／図なし）", "screenHtml": "<div class=\"q\">体の細胞は、養分と酸素を使ってエネルギーを取り出す。そのとき、いらないもの（不要物）が出る。</div>\n<div class=\"q\">この不要物を体の外に出すことを<b>排出</b>という。</div>\n<div class=\"q\">不要物のうち、<b>二酸化炭素</b>は、血液が運んで<b>肺</b>から出す（前に習ったね）。</div>\n<div class=\"q\">それ以外の不要物は、おもに<b>腎臓</b>が尿にして出す。あせ（皮ふ）からも少し出るよ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_11", "id": "11-T2", "title": "肝臓——有害なものを無害に作りかえる", "meta": "（種別: 概念／図なし・1軸=肝臓のはたらき）", "screenHtml": "<div class=\"q\">タンパク質を使うと出るアンモニアは、そのままだと体に有害。</div>\n<div class=\"q\">そこではたらくのが<b>肝臓</b>。アンモニアを、害の少ない<b>尿素</b>に作りかえる。</div>\n<div class=\"q\">肝臓は、有害なものを害の少ないものに変える場所なんだ。</div>\n<div class=\"q\">（肝臓は、ほかにも養分を一時的にたくわえるなど、たくさんの仕事をしている大きな臓器だよ。）</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_11", "id": "11-T3", "title": "腎臓——血液のフィルター", "meta": "（種別: 概念／図なし・1軸=腎臓のはたらき／コラム付き）", "screenHtml": "<div class=\"q\">肝臓で作られた尿素は、血液にのって全身をめぐる。これを取り除くのが<b>腎臓</b>。</div>\n<div class=\"q\">腎臓は、血液から尿素や、余分な水・塩分をこし取って、<b>尿</b>にする。</div>\n<div class=\"q\">血液が腎臓を通るたびに、少しずつきれいになっていく。</div>\n<div class=\"q\">だから腎臓は、血液のフィルターといえるんだ。</div>\n<details class=\"col\"><summary>腎臓の中はどうなってる？</summary><div class=\"colbody\"><div class=\"q\">腎臓の中には、血液をこすためのとても細かいつくりが、片方だけで100万個くらいつまっている。</div>\n<div class=\"q\">血液をまず「ざっと」こしてから、体にまだ必要な水や養分だけをもう一度もどす——そんな細かいしくみが入っているんだ。</div>\n<div class=\"q\">その細かいつくりの名前やはたらきは、高校でくわしく習うよ。興味があったら、名前をさがしてみて。</div></div></details>", "ctxHtml": "<div class=\"q\"></div>"}, {"type": "card", "uid": "u_bio_11", "id": "11-T4", "title": "尿の道——腎臓から体の外へ", "meta": "（種別: 概念／図なし・1軸=尿の通り道）", "screenHtml": "<div class=\"q\">腎臓でできた尿は、<b>輸尿管（ゆにょうかん）</b>という管を通って、<b>ぼうこう</b>にためられる。</div>\n<div class=\"q\">ぼうこうにたまった尿は、まとめて体の外に出される。</div>\n<div class=\"q\">腎臓 → 輸尿管 → ぼうこう → 体外。これが尿の通り道だよ。</div>\n<details class=\"col\"><summary>あせと尿のなぜ？を見る</summary><div class=\"colbody\"><div class=\"q\">腎臓は、体の水が多いか少ないかで、尿の量も変えている。</div>\n<div class=\"q\">あせをたくさんかいた日に尿が少なくなるのは、体が水を出しすぎないように<b>調節</b>しているからなんだ。</div></div></details>", "ctxHtml": "<div class=\"q\"></div>"}, {"type": "card", "uid": "u_bio_11", "id": "11-T5", "title": "締め——排出が1本の線でつながる", "meta": "（種別: 達成の先出し／図: card_excretion.png 新規・カードサイズ＝アンモニア→肝臓で尿素→腎臓でこし取る→尿の1本の流れ図・印なし）", "screenHtml": "<div class=\"q\">これで、排出のしくみが1本の線でつながった。</div>\n<div class=\"q\">タンパク質を使う → 有害なアンモニアができる → <b>肝臓</b>で尿素に作りかえる → <b>腎臓</b>が血液からこし取る → 尿になって体の外へ。</div>\n<div class=\"q\">「どこで作りかえて、どこでこし取るか」の2つがつかめれば、排出はわかる。</div>\n<div class=\"q\">二酸化炭素は肺、それ以外の不要物は腎臓。この役割分担も、あわせて頭のすみに置いておくと、後がわかりやすくなるよ。</div>", "ctxHtml": "<div class=\"li\">---</div>"}, {"type": "card", "uid": "u_bio_11", "id": "11-Q1", "title": "確認クイズ・セット1（肝臓と腎臓の役割分担の節目＝T2・T3のあと・4択の類題3問）", "meta": "", "screenHtml": "<div class=\"li\">- Q1 [既存・入門] 食べ物の養分を一時的にたくわえたり、体に害のある物質を無害にしたりする、はたらきの多い臓器はどれか。 → <b>肝臓</b>（選: 肝臓／肺／耳／ぼうこう）</div>\n<div class=\"li\">- Q2 [新規] 血液から尿素や余分な水をこし取って、尿をつくる臓器はどれか。 → <b>腎臓</b>（選: 腎臓／肝臓／肺／心臓）</div>\n<div class=\"li\">- Q3 [新規] 有害なアンモニアを、害の少ない尿素に作りかえる臓器はどれか。 → <b>肝臓</b>（選: 肝臓／腎臓／ぼうこう／肺）</div>", "ctxHtml": "<div class=\"li\">※【11-T2】【11-T3】のあと。3問とも「排出にかかわる器官の役割」を問う同型・同難度（入門）でそろえた類題。この節目は<b>肝臓／腎臓の選び分け</b>が本題（このユニットの難所）なので4択のまま（憲法4.7条の例外＝内容が選び分けを要求する時）。</div>\n<div class=\"li\">※設計メモ: Q1＝行2229（bio_human・junior＝入門）を原文どおり流用（【11-T2】の「無害にする＝肝臓」に一致）。Q2・Q3は[新規]で、Q1と同じ「器官を選ぶ4択・入門・単一の器官名の選択肢（憲法4.6条＝品詞・長さをそろえる）」の同型にした。Q2の誤答に肝臓、Q3の誤答に腎臓を必ず入れて、肝臓／腎臓の選び分けを本題にしている。答えは 肝臓／腎臓／肝臓（位置は選択肢内でばらす）。既存の じん臓 問（行2211）は<b>予習</b>なので入門セットには混ぜられない（憲法4.2条＝難度ちがい禁止）ため、腎臓は[新規]の入門で書き下ろした。</div>"}, {"type": "card", "uid": "u_bio_11", "id": "11-Q2", "title": "確認クイズ・セット2（排出の全体像の節目＝T4のあと・○✕の類題3問）", "meta": "", "screenHtml": "<div class=\"li\">- Q1 [新規] 細胞が出した二酸化炭素は肺から、それ以外の不要物の多くは腎臓から尿として体の外に出される。（○✕） → <b>○</b></div>\n<div class=\"li\">- Q2 [新規] 腎臓でつくられた尿は、輸尿管を通ってぼうこうにためられ、体の外に出される。（○✕） → <b>○</b></div>\n<div class=\"li\">- Q3 [新規] 二酸化炭素は、腎臓で血液からこし取られて、尿にまざって体の外に出される。（○✕） → <b>✕</b></div>", "ctxHtml": "<div class=\"li\">※【11-T4】のあと。2択×3問（憲法4.7条の既定＝できた感・ここまで進んだご褒美）。3問とも「不要物と排出先の対応／尿の通り道」を問う同型・同難度（入門相当）。</div>\n<div class=\"li\">※設計メモ: 既存プールに基礎（mid）の排出問が無いため、カーネル指定の「不要物と排出先の対応／尿ができる順路」を入門相当の[新規]○✕でそろえた。Q1＝対応（二酸化炭素=肺／その他=腎臓）、Q2＝尿の通り道（輸尿管→ぼうこう→体外）、Q3の✕文は「二酸化炭素の排出先を腎臓と取りちがえる」単一の明確な偽（憲法4.6条）。【11-T1】で教えた「二酸化炭素=肺」を裏返した文で、組成や順序を刷り込む型（憲法4.3条）ではない。答えの並びは ○○✕。</div>\n<div class=\"li\">---</div>"}, {"type": "check", "uid": "u_bio_11", "id": "u_bio_11-確認1", "textHtml": "<b>確認クイズが[新規]5問中心になる点</b>: 既存プールに排出の問題がほぼ無く（じん臓＝予習1問・肝臓＝入門1問のみ・難度が割れて同型3連にならない）、カーネルの「不足は新規で補う」指定どおり入門相当の[新規]でそろえました。この5問（肝臓/腎臓の選び分け4択2問＋排出全体像○✕3問）をDBに正式追加してよいか（追加すれば bio_human・排出の入門問がここで増える）。"}, {"type": "check", "uid": "u_bio_11", "id": "u_bio_11-確認2", "textHtml": "<b>セット1を4択にした点</b>: 肝臓／腎臓の選び分け＝このユニットの難所なので、憲法4.7条の例外として4択にしました（既定の2択より、器官の取りちがえを直接ためせる）。この判断でOKか。"}, {"type": "check", "uid": "u_bio_11", "id": "u_bio_11-確認3", "textHtml": "<b>T5（締め）を1枚足した点</b>: カーネル骨格はT1〜T4ですが、2つの仕事を1本の流れ図で回収する達成カード（新概念なし・手本 u_bio_08 と同じ形）を足しました。card_excretion もここに置いています。この構成でよいか。"}, {"type": "check", "uid": "u_bio_11", "id": "u_bio_11-確認4", "textHtml": "<b>図版が card_excretion 1枚だけの点</b>: P段階の図は答えを先渡ししてしまう（憲法7条）ため置かず、腎臓・肝臓の位置図はAI生成だと臓器の形をまちがえるおそれがあるため、<b>向きと順序が意味を持つ流れ図1枚（matplotlib）</b>に絞りました。もう少し図がほしければ、T4の「尿の道（腎臓→輸尿管→ぼうこう→体外）」の順路図をmatplotlibで追加できます（要否をご判断ください）。 ---"}, {"type": "unit", "uid": "u_bio_12", "name": "刺激と反応", "n": 10, "nc": 4}, {"type": "card", "uid": "u_bio_12", "id": "u_bio_12-R", "title": "レディネスチェック", "meta": "", "screenHtml": "<div class=\"li\">- 【12-R1】[新規] つぎのうち、音を聞き取る体の部分はどれか。 → <b>耳</b>（選: 目／耳／鼻／舌）</div>\n<div class=\"li\">- 【12-R2】[新規] 熱いなべにうっかりさわったとき、その「熱さ」を感じ取る体の部分はどれか。 → <b>皮ふ</b>（選: 皮ふ／かみの毛／つめ／ほね）</div>\n<div class=\"q\">つまずいたときの誘いコピー（弱点表示ではなく招待状のトーン・第2.5条）:</div>\n<div class=\"q\">「<b>体のどこで何を感じているか、思い出しておくと、このあとの話がつながりやすくなるよ</b>」→ 該当の教えるカードへのボタンがそっと光る</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_12", "id": "12-P1", "title": "予想（Predict）", "meta": "どれを選んでも正誤なし・「なるほど」で次へ／図: cimg/u_bio_12/p1_hot_pot.png（新規AI・熱いなべに手がふれる瞬間の場面／答え＝経路は見せない）", "screenHtml": "<div class=\"q\">熱いなべに、うっかり手がふれてしまった。</div>\n<div class=\"q\">すると、「あつい！」と思うより先に、手がぱっと引っこんでいる。</div>\n<div class=\"q\">ふつうは、考えてから体を動かすはずなのに。</div>\n<div class=\"q\">なんで、考える前に動けるんだろう？</div>\n<div class=\"q\">「本当は一瞬で考えている」／「体が先に動いて、あとで気づく」／「手が自分で決めて動いている」</div>", "ctxHtml": "<div class=\"q\"></div>"}, {"type": "card", "uid": "u_bio_12", "id": "12-P2", "title": "おどろき（Observe）", "meta": "図なし（時間差の驚きは文で見せる・経路の図はたね明かし以降）", "screenHtml": "<div class=\"q\">調べてみると——じつは、手を引っこめたあとで「あつい！」と感じている。</div>\n<div class=\"q\">感じるより先に、もう体は動いていたんだ。</div>\n<div class=\"q\">「あつい」と気づく場所（脳）まで信号がとどくのを、待っていない。</div>\n<div class=\"q\">なのに、ちゃんと手は引っこんでいる。信号は、どこを通っているんだろう？</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_12", "id": "12-P3", "title": "たね明かし（Explain）", "meta": "", "screenHtml": "<div class=\"q\">外からのしげき（熱・光・音など）を<b>刺激</b>という。刺激は、目や耳や皮ふで受け取られ、<b>神経</b>を通って信号として伝わる。</div>\n<div class=\"q\">ふだんの反応は、信号が脳まで行って、脳で判断してから命令が出る——という遠回り。</div>\n<div class=\"q\">でも、とっさに手を引っこめるときは、信号が脳まで行かず、<b>脊髄（せきずい）</b>で折り返す近道を通る。だから速い。これを<b>反射</b>という。</div>\n<div class=\"q\">今回は、この「感じて、動く」しくみと、遠回り・近道の分かれ道を見ていくよ。</div>", "ctxHtml": "<div class=\"li\">---</div>"}, {"type": "card", "uid": "u_bio_12", "id": "12-T1", "title": "感覚器官——刺激を受け取る入口", "meta": "（種別: 概念／図: card_sense_organs.png 新規・カードサイズ＝目・耳・鼻・舌・皮ふと、受け取る刺激の対応・印なし）", "screenHtml": "<div class=\"q\">外からの刺激を受け取る体の部分を、まとめて<b>感覚器官（かんかくきかん）</b>という。</div>\n<div class=\"q\">目は光を、耳は音を、鼻はにおいを、舌は味を受け取る。皮ふは、温度やいたみ、ふれた感じを受け取る。</div>\n<div class=\"q\">感覚器官ごとに、受け取れる刺激が決まっているんだ。</div>\n<div class=\"q\">どの感覚器官も、受け取った刺激をそのまま体の中へ——信号にして送り出す入口なんだ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_12", "id": "12-T2", "title": "神経の道——受け取る神経・命令する神経・中心", "meta": "（種別: 概念／図なし）", "screenHtml": "<div class=\"q\">受け取った刺激の信号は、<b>神経</b>という道を通って伝わる。神経には役わりのちがう2種類がある。</div>\n<div class=\"q\">感覚器官が受け取った信号を、体の中心へ伝えるのが<b>感覚神経</b>。</div>\n<div class=\"q\">中心からの命令を、筋肉へ伝えるのが<b>運動神経</b>。</div>\n<div class=\"q\">そして、信号を判断して命令を出す中心が、<b>脳と脊髄（せきずい）</b>。この2つをまとめて<b>中枢神経（ちゅうすうしんけい）</b>という。</div>\n<div class=\"q\">感覚神経で受け取り、中枢神経で判断し、運動神経で命令する。信号は、この順に流れていくんだ。</div>\n<details class=\"col\"><summary>中枢のほかの神経は？を見る</summary><div class=\"colbody\"><div class=\"q\">中枢神経（脳と脊髄）から、体のすみずみへ枝分かれして伸びていく神経を、まとめて<b>末しょう神経（まっしょうしんけい）</b>という。</div>\n<div class=\"q\">感覚神経も運動神経も、この末しょう神経のなかま。「中心（中枢）」と「そこから伸びる道（末しょう）」の2つに分けて呼んでいる、というわけ。</div></div></details>", "ctxHtml": "<div class=\"q\"></div>\n<div class=\"li\">---</div>"}, {"type": "card", "uid": "u_bio_12", "id": "12-Q1", "title": "確認クイズ・セット1（感覚器官と神経の種類の節目・3問の類題・すべて既存流用・4択）", "meta": "", "screenHtml": "<div class=\"li\">- Q1 [既存・基礎] 目や耳のように、外界からの刺激を受け取る器官を何というか。 → <b>感覚器官</b>（選: 感覚器官／運動器官／消化器官／排出器官）</div>\n<div class=\"li\">- Q2 [既存・基礎] 感覚器官で受け取った刺激の信号を中枢へ伝える神経はどれか。 → <b>感覚神経</b>（選: 感覚神経／運動神経／交感神経のみ／中枢神経）</div>\n<div class=\"li\">- Q3 [既存・基礎] 脳とせきずいをまとめて何という？ → <b>中枢神経</b>（選: 末しょう神経／感覚神経／運動神経／中枢神経）</div>", "ctxHtml": "<div class=\"li\">※3問とも「はたらきから、その器官・神経の名前を選ぶ」同型・同難度（基礎）でそろえた類題セット。似た名前の神経（感覚神経／運動神経／中枢神経／末しょう神経）を選び分けるのが本題なので4択のまま（第4.7条の例外＝内容が選び分けを要求する時）。</div>\n<div class=\"li\">※設計メモ: 3問とも既存プール（bio_human・mid＝画面表記「基礎」）の用語同定4択。感覚器官（T1）→感覚神経（T2の受け取る側）→中枢神経（T2の中心）と、カードの流れどおりに並べた。カーネルは第1セットを「入門×3」と指定するが、神経の種類を答える既存問題は基礎にしか実在しないため、同難度でそろえる原則（第4.2条）を優先し基礎×3にそろえた（§12.0調整3）。★Q2の選択肢「交感神経のみ」は、他の3つ（感覚神経／運動神経／中枢神経）と形がわずかにそろっていない（第4.6条）＝<b>DB是正候補としてオーナー確認に回す</b>（勝手に直さない・§12.5）。原稿では原文どおり引用。</div>\n<div class=\"li\">---</div>"}, {"type": "card", "uid": "u_bio_12", "id": "12-T3", "title": "意識する反応——脳を通る遠回り", "meta": "（種別: 概念／図: card_reflex_path.png 新規・上下2段の対比図の上段＝意識する反応の経路／印なし）", "screenHtml": "<div class=\"q\">ふだん、考えてする動きは、信号がこの順に流れる。</div>\n<div class=\"q\">刺激 → 感覚器官 → <b>感覚神経</b> → 脊髄 → <b>脳</b>（ここで判断する）→ 脊髄 → <b>運動神経</b> → 筋肉。</div>\n<div class=\"q\">「ボールが来た、右へよけよう」と、脳で判断してから命令が出る。</div>\n<div class=\"q\">脳まで行って、判断して、もどってくる。だからこれは、少し時間のかかる<b>遠回り</b>なんだ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_12", "id": "12-T4", "title": "反射——脊髄で折り返す近道", "meta": "（種別: 概念／図: card_reflex_path.png 新規・同じ図の下段＝反射の経路／印なし）", "screenHtml": "<div class=\"q\">ところが、熱いものに手がふれたときは、ちがう道を通る。</div>\n<div class=\"q\">刺激 → 感覚器官 → 感覚神経 → <b>脊髄（ここで折り返す）</b> → 運動神経 → 筋肉。</div>\n<div class=\"q\">信号が<b>脳まで行かず、脊髄で折り返して</b>命令が出る。だから、考えるより先に手が引っこむ。</div>\n<div class=\"q\">このような、意識とは関係なく起こるすばやい反応を<b>反射</b>という。脳を通らない近道だから、速いんだ。</div>\n<details class=\"col\"><summary>なんで脳を通さない近道があるの？を見る</summary><div class=\"colbody\"><div class=\"q\">熱いものにふれたとき、脳で「あつい」と判断してから命令を出していたら、そのあいだにやけどしてしまう。</div>\n<div class=\"q\">脊髄で折り返す近道なら、脳の判断を待たずに、一瞬で手を引っこめられる。</div>\n<div class=\"q\">危ないものから体をすばやく守るための、近道——これが反射のしくみだよ。</div></div></details>", "ctxHtml": "<div class=\"q\"></div>"}, {"type": "card", "uid": "u_bio_12", "id": "12-Q2", "title": "確認クイズ・セット2（反応と反射の節目・3問の類題・4択）", "meta": "", "screenHtml": "<div class=\"li\">- Q1 [既存・基礎] 熱いものに思わず手を引っこめるような、意識とは関係なく起こるすばやい反応を何といいますか。 → <b>反射</b>（選: 感覚／反射／記憶／意識的な反応）</div>\n<div class=\"li\">- Q2 [既存・基礎] 熱いものに思わず手を引っこめる反射で、命令の信号を出す中枢はおもにどこですか。 → <b>せきずい</b>（選: 小脳／延髄／せきずい／大脳）</div>\n<div class=\"li\">- Q3 [新規] つぎのうち、反射にあてはまるのはどれか。 → <b>こんろの火にうっかりふれて、思わず手を引っこめる</b>（選: こんろの火にうっかりふれて、思わず手を引っこめる／青信号を見て、横断歩道をわたる／名前をよばれて、声のほうをふり向く／とけいを見て、時こくを読み取る）</div>", "ctxHtml": "<div class=\"li\">※この節目は少し難しめ。冒頭に <b>「今回は少し難しめ！ がんばって！」</b> を表示（第4.7条）。3問とも「反射とはどんな反応か・その信号はどこで折り返すか」を問う同型・同難度（基礎）。反射と意識する反応を区別するのが本題なので4択。</div>\n<div class=\"li\">※設計メモ: Q1（反射という名前）→Q2（折り返す中枢＝せきずい）と、既存の基礎2問で「何が・どこで」を確かめる。Q3は「反射の例を選ぶ」＝カーネル指定の同型だがプールに実在しないため[新規]（カーネル「同型が薄ければ新規×1〜2」指定どおり）。Q3の3つの誤答は、どれも脳で判断してからする<b>意識的な反応</b>で、答えだけが<b>反射</b>（単一の明確な区別・第4.6条）。選択肢はすべて「〜する」場面の形にそろえた。答えの並びはQ1=反射（2番目）・Q2=せきずい（3番目）・Q3=1番目でカンの偏りを避けた。Q2の既存選択肢「延髄」は反射に関わる中枢の一つだが、東書の本文が「せきずい」を反射の代表中枢として扱うためそのまま採用（原文引用）。</div>\n<div class=\"li\">---</div>"}, {"type": "check", "uid": "u_bio_12", "id": "u_bio_12-確認1", "textHtml": "<b>【12-Q1】Q2 の選択肢「交感神経のみ」のDB是正</b>: 他の3つ（感覚神経／運動神経／中枢神経）が「○○神経」の名前なのに、1つだけ「交感神経のみ」と“のみ”がついて形がそろわない（第4.6条＝異質な選択肢は消去法で解けてしまう）。また交感神経は中学の範囲を超える語。<b>「運動神経」等の素直な神経名に是正してよいか</b>（GOが出たらDB→引用原稿を同期。出るまでは原文のまま）。"}, {"type": "check", "uid": "u_bio_12", "id": "u_bio_12-確認2", "textHtml": "<b>レディネスを[新規]日常2問にした判断</b>: 既存プールの下位diff問はほぼ「感覚器官」を答えにする問題で、T1で初めて教える語の先渡しになる（第5条）。そこで語を出さない日常2問（耳・皮ふ）に置きかえた。<b>この方針でよいか</b>（既存流用にこだわらず、先渡し回避を優先した）。"}, {"type": "check", "uid": "u_bio_12", "id": "u_bio_12-確認3", "textHtml": "<b>確認クイズを2セットとも基礎（mid）でそろえた判断</b>: カーネルは第1セットを「入門」指定だが、神経の種類を答える既存問題は基礎にしか無く、同難度そろえ（第4.2条）を優先して基礎×3にした。<b>問題ないか</b>。"}, {"type": "check", "uid": "u_bio_12", "id": "u_bio_12-確認4", "textHtml": "<b>図版</b>: card_reflex_path（意識する反応＝脳を通る遠回り／反射＝脊髄で折り返す近道の上下対比・矢印つき・印なし）を matplotlib で新規作成予定（数値でなく経路の向きが意味を持つ図＝第7条の自作①）。P1の場面図（熱いなべに手）とT1の対応図はイメージ寄り＝AI生成／matplotlibの候補。<b>この3枚で過不足ないか</b>（落とす図があればご指示を）。 ---"}, {"type": "unit", "uid": "u_bio_13", "name": "骨と筋肉のはたらき", "n": 11, "nc": 4}, {"type": "card", "uid": "u_bio_13", "id": "u_bio_13-R", "title": "レディネスチェック", "meta": "", "screenHtml": "<div class=\"li\">- 【13-R1】[既存・入門] 刺激を受け取る目・耳・鼻などをまとめて何というか。 → <b>感覚器官</b>（選: 感覚器官／運動器官／消化器官／排出器官）</div>\n<div class=\"li\">- 【13-R2】[既存・入門] 脳やせきずいのように、判断や命令を行う神経をまとめて何といいますか。 → <b>中枢神経</b>（選: 中枢神経／運動神経／感覚神経／末しょう神経）</div>\n<div class=\"li\">- 【13-R3】[既存・入門] 熱いものに手がふれたとき、思わず手を引っこめるようなすばやい反応を何といいますか。 → <b>反射</b>（選: 反射／記憶／消化／呼吸）</div>\n<div class=\"q\">つまずいたときの誘いコピー（弱点表示ではなく招待状のトーン・憲法第2.5条・2.6条）:</div>\n<div class=\"q\">「<b>刺激と命令の流れをもう一度見ておくと、このあと『命令を受けた筋肉がどう動くか』がつながりやすくなるよ</b>」→ 前ユニットの該当カードへのボタンがそっと光る</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_13", "id": "13-P1", "title": "予想（Predict）", "meta": "どれを選んでも正誤なし・「なるほど」で次へ", "screenHtml": "<div class=\"q\">うでを曲げると、内側の「力こぶ」がかたく盛り上がる。さわるとわかるよ。</div>\n<div class=\"q\">じゃあ、うでをまっすぐ伸ばすとき、この力こぶはどうなってると思う？</div>\n<div class=\"q\">「もっとかたくなる」／「やわらかく、力がぬける」／「変わらない」</div>", "ctxHtml": "<div class=\"li\">※図: cimg/u_bio_13/p1_arm_flex.png（新規・AI・カードサイズ＝うでを曲げて、内側の力こぶがかたく盛り上がっている場面。伸ばしたときの答えは見せない）</div>\n<div class=\"q\"></div>"}, {"type": "card", "uid": "u_bio_13", "id": "13-P2", "title": "おどろき（Observe）", "meta": "図: cimg/u_bio_13/p2_arm_extend.png（新規・AI・カードサイズ＝うでをまっすぐ伸ばして、内側の力こぶがやわらかくゆるみ、うでの外側がかたくなっている場面。中の筋肉のしくみは描かない）", "screenHtml": "<div class=\"q\">うでを伸ばすと——力こぶはやわらかくなって、力がぬける。</div>\n<div class=\"q\">かわりに、うでの<b>外側</b>がかたくなる。</div>\n<div class=\"q\">曲げると内側がかたい。伸ばすと外側がかたい。かたくなる場所が、入れかわるんだ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_13", "id": "13-P3", "title": "たね明かし（Explain）", "meta": "図: card_arm_pair.png（新規・matplotlib）", "screenHtml": "<div class=\"q\">じつは筋肉は、<b>縮む</b>ことしかできない。縮んで、つないだ骨を引っぱる。</div>\n<div class=\"q\">押しもどす力は出せないんだ。</div>\n<div class=\"q\">だから、曲げる筋肉と伸ばす筋肉が<b>2つでペア</b>になっている。</div>\n<div class=\"q\">曲げるときは内側が縮んで骨を引く。伸ばすときは外側が縮んで、逆に引く。</div>\n<div class=\"q\">交代で縮んで、うでを曲げたり伸ばしたりしている。これが体を動かすしくみだよ。</div>\n<div class=\"q\">今回は、この「縮む筋肉のペア」と、筋肉・骨をつなぐ<b>けん</b>、曲がる場所の<b>関節</b>を見ていくよ。</div>", "ctxHtml": "<div class=\"li\">---</div>"}, {"type": "card", "uid": "u_bio_13", "id": "13-T1", "title": "筋肉は縮むことしかできない", "meta": "（種別: 概念／図: card_muscle_contract.png 新規・matplotlib・カードサイズ＝筋肉が縮んで短く太くなり、つないだ骨を矢印で引っぱる図・印なし）", "screenHtml": "<div class=\"q\">筋肉は、縮んで短くなる。このとき、つながった骨をぐいっと引っぱる。</div>\n<div class=\"q\">できるのは、この「引っぱる」だけ。押して骨をもどす、ということはできない。</div>\n<div class=\"q\">だから、うでを曲げた筋肉が、そのままうでを伸ばしもどすことはできないんだ。</div>\n<div class=\"q\">のばすのは、別の筋肉の仕事になる。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_13", "id": "13-T2", "title": "曲げる筋肉と伸ばす筋肉のペア", "meta": "（種別: 概念／図: card_arm_pair.png 新規・matplotlib・カードサイズ＝曲げたうでと伸ばしたうでを並べ、内側と外側の筋肉のどちらが縮む・ゆるむかを2色で示す。けんと関節も描く・印なし）", "screenHtml": "<div class=\"q\">筋肉は引っぱるだけ。だから、うでの内側と外側に、逆向きに引く筋肉が<b>ペア</b>でついている。</div>\n<div class=\"q\">うでを曲げるとき——内側（力こぶ）の筋肉が縮んで、骨を引く。外側はゆるむ。</div>\n<div class=\"q\">うでを伸ばすとき——今度は外側が縮んで、逆に引く。内側はゆるむ。</div>\n<div class=\"q\">片方が縮むと、もう片方はゆるむ。この交代で、曲げ伸ばしができるんだ。</div>\n<div class=\"q\">力こぶをさわりながら、うでを曲げたり伸ばしたりすると、かたさの入れかわりが手でわかるよ。</div>\n<details class=\"col\"><summary>なんで2つもいるの？</summary><div class=\"colbody\"><div class=\"q\">筋肉は引っぱることしかできない。押しもどす力は出せない。</div>\n<div class=\"q\">だから、縮めたうでをもとにもどすには、反対側からもう1本が引っぱり返すしかない。</div>\n<div class=\"q\">「引く筋肉」しか作れないから、逆向きにもう1本——というわけで、ペアが必要になるんだ。</div></div></details>", "ctxHtml": "<div class=\"q\"></div>"}, {"type": "card", "uid": "u_bio_13", "id": "13-T3", "title": "けん——筋肉と骨をつなぐ", "meta": "（種別: 概念／図: card_tendon_bone.png 新規・matplotlib・カードサイズ＝筋肉→けん→骨のつながりの模式図。けんが骨につく部分を示す・印なし）", "screenHtml": "<div class=\"q\">縮んだ筋肉の力は、どうやって骨まで届くんだろう。</div>\n<div class=\"q\">筋肉のはしは、じょうぶな「ひも」のようなつくりで骨につながっている。これを<b>けん</b>という。</div>\n<div class=\"q\">筋肉が縮むと、その力がけんを通って骨に伝わり、骨が引っぱられる。</div>\n<div class=\"q\">けんが、筋肉の力を骨まで伝えているんだ。</div>\n<details class=\"col\"><summary>身近なけんはどこ？</summary><div class=\"colbody\"><div class=\"q\">かかとの少し上を指でさわると、太くてかたいすじにふれる。これが「アキレスけん」。</div>\n<div class=\"q\">ふくらはぎの筋肉と、かかとの骨をつないでいるけんだよ。</div>\n<div class=\"q\">つま先立ちをすると、ふくらはぎが縮んで、このけんがかかとを引き上げている。</div></div></details>", "ctxHtml": "<div class=\"q\"></div>"}, {"type": "card", "uid": "u_bio_13", "id": "13-T4", "title": "関節——曲がる場所", "meta": "（種別: 概念／図: card_joint_lever.png 新規・matplotlib・カードサイズ＝関節を支点にして、けんに引かれた骨がてこのように動く模式図・印なし）", "screenHtml": "<div class=\"q\">骨と骨のつなぎ目で、体を曲げられる部分を<b>関節</b>という。ひじ・ひざ・指の付け根が関節だよ。</div>\n<div class=\"q\">筋肉がけんで骨を引くと、この関節を<b>支点</b>にして、骨が「てこ」のように動く。</div>\n<div class=\"q\">関節があるから、まっすぐな骨でも、曲げ伸ばしができるんだ。</div>", "ctxHtml": ""}, {"type": "card", "uid": "u_bio_13", "id": "13-T5", "title": "骨のしごと", "meta": "（種別: 概念／図: card_bone_roles.png 新規・matplotlib・カードサイズ＝骨が体を支えるすがたと、頭がい骨が脳・ろっ骨が心臓や肺を囲んで守るすがたを並べた模式図・印なし）", "screenHtml": "<div class=\"q\">骨には、体を動かすほかに2つのしごとがある。ひとつは、体をしっかり<b>支える</b>こと。</div>\n<div class=\"q\">もうひとつは、頭がい骨が脳を、ろっ骨が心臓や肺を囲むように、<b>大事な部分を守る</b>こと。</div>\n<div class=\"q\">骨は、動くための「柱」であり、守るための「入れもの」でもあるんだ。</div>", "ctxHtml": "<div class=\"li\">---</div>"}, {"type": "card", "uid": "u_bio_13", "id": "13-Q1", "title": "確認クイズ・セット1（筋肉のペアのしくみ・T1〜T2のあと・3問の類題・4択）", "meta": "", "screenHtml": "<div class=\"li\">- Q1 [既存・基礎] うでを曲げのばしするとき、対になった2つの筋肉はどのように働きますか。 → <b>一方が縮むともう一方がゆるむ</b>（選: 筋肉は骨を動かさない／一方が縮むともう一方がゆるむ／両方が同時に縮む／両方が同時にゆるむ）</div>\n<div class=\"li\">- Q2 [新規] うでを曲げるとき、内側の力こぶの筋肉と、外側の筋肉はどうなっているか。 → <b>内側が縮み、外側がゆるむ</b>（選: 内側が縮み、外側がゆるむ／内側がゆるみ、外側が縮む／両方とも縮む／両方ともゆるむ）</div>\n<div class=\"li\">- Q3 [新規] うでをまっすぐ伸ばすとき、内側の筋肉と、外側の筋肉はどうなっているか。 → <b>内側がゆるみ、外側が縮む</b>（選: 内側が縮み、外側がゆるむ／内側がゆるみ、外側が縮む／両方とも縮む／両方ともゆるむ）</div>", "ctxHtml": "<div class=\"li\">※この節目はこのユニットの難所（筋肉は縮むだけなのに曲げ伸ばしできる理由）。冒頭に <b>「今回は少し難しめ！ がんばって！」</b> を表示（憲法4.7条）。3問とも「対になった筋肉が交代で縮む／ゆるむ」を問う同型・同難度（基礎）でそろえた類題。選択肢は4つの状態を選び分ける必要があるため4択（憲法4.7条の例外）。</div>\n<div class=\"li\">※設計メモ: 既存プールの「筋肉のはたらき」入門問題（line1848「骨を引っぱって動かしているのは→筋肉」・line2216「力を出しているのは→筋肉」）は &quot;どのつくりが力を出すか&quot; を問うもので、このセットの &quot;ペアがどう動くか&quot; とは概念がちがう（憲法4.2条＝混ぜない）。よってこの2問はセットに入れず練習プールに残す。難所のペアを問う既存問題は line228（基礎）1問のみ＝薄いので Q2・Q3 を [新規] で同型に書き下ろした（カーネルnotes「不足は新規で補い[新規]と明記」に対応）。Q2・Q3 は line228 と同じ「内側／外側の縮む・ゆるむ」を、曲げる場合・伸ばす場合で問う真の類題（同概念・同形式・同難度）。</div>"}, {"type": "card", "uid": "u_bio_13", "id": "13-Q2", "title": "確認クイズ・セット2（けん・関節・骨のはたらき・T3〜T5のあと・3問の類題・○✕）", "meta": "", "screenHtml": "<div class=\"li\">- Q1 [新規] 筋肉と骨をつないでいる、じょうぶなひものようなつくりを、けんという。（○✕） → <b>○</b></div>\n<div class=\"li\">- Q2 [新規] 骨と骨のつなぎ目で、体を曲げたり動かしたりできる部分を、関節という。（○✕） → <b>○</b></div>\n<div class=\"li\">- Q3 [新規] 骨には、体を支えたり、脳や心臓などの大事な部分を守ったりするはたらきはない。（○✕） → <b>✕</b></div>", "ctxHtml": "<div class=\"li\">※3問とも「けん・関節・骨のはたらき」を問う同型・同難度（基礎）でそろえた○✕の類題。カードを読んだ節目のごほうび＝「できた感」を渡すセット（憲法4.7条＝既定2択の○✕）。</div>\n<div class=\"li\">※設計メモ: 既存プールに「けん」を問う問題はなく（quiz-engine.js grep で確認）、関節は line2558（○✕・未修）が1問あるのみ。line2558 は「関節は曲がらない部分である（✕）」という否定形で難度も未修のため、difficulty をそろえて 3問を [新規] の○✕で書き下ろした。Q3 だけを✕にして「全部○」でのカン当たりを防ぎつつ、✕の内容（骨は支え・守るはたらきが「ない」）は直前に教えた内容の素直な否定＝誤概念を植えない（憲法4.3条）。</div>\n<div class=\"li\">---</div>"}, {"type": "check", "uid": "u_bio_13", "id": "u_bio_13-確認1", "textHtml": "<b>確認クイズ・セット1を4択にした件</b>: このユニットの難所（筋肉のペア）は「内側が縮む／外側が縮む／両方縮む／両方ゆるむ」の4状態を選び分けさせたく、憲法4.7条の例外（内容が選び分けを要求する時）として4択にしています。冒頭に「今回は少し難しめ！ がんばって！」を付けました。この方針でよいか（それとも2択×2問などに軽くするか）。"}, {"type": "check", "uid": "u_bio_13", "id": "u_bio_13-確認2", "textHtml": "<b>確認クイズ・セット1に既存の「力を出すのは筋肉」（入門）を入れなかった件</b>: これらは &quot;どのつくりが力を出すか&quot; で、ペアの動き（このセットの概念）とは別なので外し、練習プールに残しました（憲法4.2条の類題そろえ）。難所のペアを問う新規2問を書き下ろしています。この判断でよいか。"}, {"type": "check", "uid": "u_bio_13", "id": "u_bio_13-確認3", "textHtml": "<b>図版6枚</b>: P用はAI画像（うでを曲げた／伸ばした場面のイメージ・答えは見せない）、T用はmatplotlib（縮む筋肉・ペア・けん・関節のてこ＝向きや位置が意味を持つ図）で作る計画です。カードサイズ・印なし。この振り分けでよいか（実物写真に後から差し替え可能）。"}, {"type": "check", "uid": "u_bio_13", "id": "u_bio_13-確認4", "textHtml": "<b>「けん」のひらがな表記</b>: カーネル指定どおり教科書表記のひらがな「けん」で通しています（「腱」は使わない）。よいか。 ---"}];
const KEY = "rika2_review_" + "\u751f\u7269B3 \u4e2d2\u4eba\u4f53(09\u6d88\u5316/10\u547c\u5438\u5faa\u74b0/11\u6392\u51fa/12\u523a\u6fc0\u53cd\u5fdc/13\u9aa8\u7b4b\u8089)";
let res = {}; try{ res = JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){}
let pos = +(localStorage.getItem(KEY+"_pos")||0);
const tappable = ITEMS.filter(i=>i.type!=="unit").length;
function save(){ localStorage.setItem(KEY, JSON.stringify(res)); localStorage.setItem(KEY+"_pos", pos); }
function doneCount(){ return Object.keys(res).length; }
function header(){
  document.getElementById("hcount").textContent = doneCount()+" / "+tappable;
  document.getElementById("hbar").style.width = (100*doneCount()/tappable)+"%";
}
function go(d){ pos=Math.max(0,Math.min(ITEMS.length,pos+d)); save(); render(); window.scrollTo(0,0); }
function mark(id, verdict){
  const t=[...document.querySelectorAll(".tag.on")].map(x=>x.textContent);
  const note=(document.getElementById("note")||{}).value||"";
  res[id]={v:verdict,tags:t,note:note}; save(); go(1);
}
function render(){
  header();
  const st=document.getElementById("stage");
  if(pos>=ITEMS.length){ st.innerHTML=exportView(); return; }
  const it=ITEMS[pos];
  const nav='<div class="nav"><button onclick="go(-1)">← まえへ</button><button onclick="go(1)">とばす →</button></div>';
  if(it.type==="unit"){
    st.innerHTML='<div class="unitcard"><div class="uid">'+it.uid+'</div><div class="big">'+it.name+'</div>'+
    '<div class="summary">カード '+it.n+'枚 ＋ 確認 '+it.nc+'件。<br>読む→ピンとくれば ◎OK、引っかかれば ✏。<br>迷ったら ⏭あとで（いつでも戻れる）。</div>'+
    '<div class="btns"><button class="b-ok" onclick="go(1)">はじめる</button></div></div>'+nav;
    return;
  }
  const prev=res[it.id];
  const badge=prev?('<span style="color:var(--gold)">［回答済: '+prev.v+'］</span>'):'';
  if(it.type==="card"){
    st.innerHTML='<div class="card"><div class="uid">'+it.uid+'｜【'+it.id+'】'+badge+'</div>'+
    '<h2>'+it.title+'</h2><div class="meta">'+it.meta+'</div>'+ it.screenHtml +
    (it.ctxHtml?('<div class="ctx">'+it.ctxHtml+'</div>'):'')+
    '<div class="btns">'+
    '<button class="b-ok" onclick="mark(\''+it.id+'\',\'OK\')">◎ OK</button>'+
    '<button class="b-warn" onclick="openWarn()">✏ 気になる</button>'+
    '<button class="b-skip" onclick="mark(\''+it.id+'\',\'あとで\')">⏭</button></div>'+
    '<div class="tags" id="tags">'+
    ['ことばが大人','ことばが幼い','教室でこう言わない','理科的にあやしい','長い','その他']
      .map(t=>'<button class="tag" onclick="this.classList.toggle(\'on\')">'+t+'</button>').join('')+'</div>'+
    '<textarea id="note" placeholder="ひとこと（任意・1語でもOK）"></textarea>'+
    '<button class="send" id="send" onclick="mark(\''+it.id+'\',\'気になる\')">この内容で送る</button>'+nav;
  } else {
    st.innerHTML='<div class="card"><div class="uid">'+it.uid+'｜確認 '+badge+'</div>'+
    '<div class="q">'+it.textHtml+'</div>'+
    '<div class="btns">'+
    '<button class="b-yes" onclick="mark(\''+it.id+'\',\'はい\')">はい</button>'+
    '<button class="b-no" onclick="mark(\''+it.id+'\',\'いいえ\')">いいえ</button>'+
    '<button class="b-skip" onclick="mark(\''+it.id+'\',\'あとで\')">⏭</button></div>'+
    '<textarea id="note" class="open" placeholder="補足（任意）"></textarea>'+nav;
  }
}
function openWarn(){
  document.getElementById("tags").classList.add("open");
  document.getElementById("note").classList.add("open");
  document.getElementById("send").classList.add("open");
}
function exportView(){
  const out={sheet:"\u751f\u7269B3 \u4e2d2\u4eba\u4f53(09\u6d88\u5316/10\u547c\u5438\u5faa\u74b0/11\u6392\u51fa/12\u523a\u6fc0\u53cd\u5fdc/13\u9aa8\u7b4b\u8089)",done:doneCount(),total:tappable,answers:res};
  const s=JSON.stringify(out,null,1);
  const warn=Object.entries(res).filter(([k,v])=>v.v==="気になる"||v.v==="いいえ").length;
  const esc=s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
  return '<div class="unitcard"><div class="big">おつかれさまでした 🎉</div>'+
  '<div class="summary">回答 '+doneCount()+'/'+tappable+'（✏気になる・いいえ: '+warn+'件）<br>'+
  '<b>下の枠の中身が結果のすべて</b>です。「📋 結果をコピー」→ Claudeに貼り付けで回収完了。<br>'+
  '<span style="color:var(--warn)">※このHTMLファイル自体には回答は保存されません（回答はこのブラウザの中）。必ずコピーか💾で外に出してください。</span></div>'+
  '<button class="exbtn" style="background:var(--gold);color:#241a03" onclick="navigator.clipboard.writeText(document.getElementById(\'exp\').value).then(()=>this.textContent=\'✓ コピーしました（Claudeに貼ってください）\')">📋 結果をコピー</button>'+
  '<button class="exbtn" style="background:#2a3245;color:#e8ecf5" onclick="dl()">💾 review_result.json で保存</button>'+
  '<textarea id="exp" class="open done" readonly>'+esc+'</textarea>'+
  '<div class="nav"><button onclick="go(-1)">← もどる</button><button onclick="pos=0;go(0)">最初から見直す</button></div></div>';
}
function dl(){
  const b=new Blob([document.getElementById("exp").value],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(b);
  a.download="review_result.json"; a.click();
}
render();
</script></body></html>
