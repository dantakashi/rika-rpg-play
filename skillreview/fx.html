<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>理科RPG2 スキルエフェクト プレビュー（アイコン）</title>
<style>
:root{ --bg1:#0b1020; --panel:#1a2336; --line:#2b3756; --ink:#e8eefc; --sub:#9fb0d6; --good:#34d399; --bad:#f87171; --warn:#fbbf24; --mp:#38bdf8; --gold:#f4c95d; --gold-d:#b9821f; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:linear-gradient(160deg,var(--bg1),#070a14);color:var(--ink);font-family:-apple-system,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;overflow:hidden;}
body{display:flex;flex-direction:column;}
#gamewrap{flex:0 0 auto;height:clamp(330px,50vh,500px);display:flex;justify-content:center;position:relative;border-bottom:2px solid #000;}
#app{max-width:460px;width:100%;height:100%;margin:0 auto;display:flex;flex-direction:column;position:relative;will-change:transform;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 12px;font-size:12px;color:var(--sub);flex:0 0 auto;} .topbar b{color:var(--ink);}
.stage{flex:1 1 auto;position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:6px 10px 4px;min-height:0;overflow:hidden;background:radial-gradient(125% 80% at 50% -8%,rgba(96,165,250,.18),transparent 58%),radial-gradient(120% 72% at 50% 118%,rgba(20,52,92,.55),transparent 60%),linear-gradient(180deg,#0a1424,#070b16);}
.enemy-row{display:flex;gap:26px;justify-content:center;align-items:flex-end;flex:0 0 auto;padding-top:4px;}
.enemy-card{position:relative;text-align:center;}
.enemy-card.tgt .eimg{outline:2px dashed var(--warn);outline-offset:3px;}
.eimg{margin:0 auto;display:flex;align-items:center;justify-content:center;border-radius:13px;border:1px solid var(--line);box-shadow:0 6px 12px rgba(0,0,0,.5);background:radial-gradient(circle at 50% 35%,#243049,#121a2c);}
.eimg .emo{line-height:1;filter:drop-shadow(0 6px 14px rgba(0,0,0,.6));}
.enemy-card.hitflash .eimg{animation:hitflash .25s;}
@keyframes hitflash{0%,100%{filter:none}45%{filter:brightness(2.6) drop-shadow(0 0 12px #fff)}}
.ename{font-size:10px;font-weight:700;margin-top:3px;}
.ebar{height:6px;border-radius:5px;background:#0008;border:1px solid var(--line);overflow:hidden;margin:3px auto 0;width:96px;} .ebar i{display:block;height:100%;} .ebar.hp i{background:linear-gradient(90deg,#f87171,#ef4444);transition:width .25s;}
.dtot{position:absolute;left:50%;top:-20px;transform:translateX(-50%);font-size:13px;font-weight:900;color:var(--warn);text-shadow:0 2px 6px #000;opacity:0;transition:opacity .3s;white-space:nowrap;pointer-events:none;}
.mid{flex:1 1 auto;position:relative;min-height:6px;} .combo-badge{position:absolute;right:8px;top:4px;font-size:11px;color:var(--warn);font-weight:700;text-shadow:0 1px 3px #000;} .combo-badge b{font-size:18px;}
.panel{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);border-radius:14px 14px 0 0;padding:7px 12px 9px;box-shadow:0 -6px 18px #0006;}
.party{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;}
.ally-card{background:#161f30;border:1px solid var(--line);border-radius:9px;padding:4px 4px 3px;text-align:center;position:relative;}
.ally-card.active{border-color:var(--warn);box-shadow:0 0 0 2px var(--warn);background:#26210f;}
.ac-emoji{font-size:18px;line-height:1.1;} .ac-name{font-size:10px;font-weight:700;display:block;} .ac-role{font-size:8px;color:var(--sub);}
.ac-bar{height:5px;border-radius:3px;background:#0007;margin-top:2px;overflow:hidden;} .ac-bar i{display:block;height:100%;transition:width .25s;} .ac-bar.hp i{background:linear-gradient(90deg,#34d399,#10b981);} .ac-bar.atb i{background:linear-gradient(90deg,#ffe39c,#e6b34d);}
.ac-shield{position:absolute;right:2px;top:1px;font-size:11px;line-height:1;opacity:0;transition:opacity .2s;} .ally-card.shielded .ac-shield{opacity:1;}
.ac-fx{position:absolute;left:50%;top:-4px;transform:translateX(-50%);font-size:14px;font-weight:900;pointer-events:none;animation:dmgFloat 1s ease-out forwards;white-space:nowrap;} .ac-fx.heal{color:var(--good);text-shadow:0 2px 6px #000;} .ac-fx.hit{color:var(--bad);text-shadow:0 2px 6px #000;} .ally-card.hitflash{animation:hitflash .25s;}
.efx{position:absolute;left:50%;top:6px;transform:translateX(-50%);font-weight:900;pointer-events:none;animation:dmgFloat 1.1s ease-out forwards;white-space:nowrap;text-shadow:0 2px 6px #000;} .efx.crit{color:var(--warn);font-size:26px;} .efx.norm{color:#fff;font-size:18px;}
@keyframes dmgFloat{0%{opacity:0;transform:translate(-50%,4px) scale(.8)}12%{opacity:1}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-40px) scale(1.1)}}
.phase-hint{font-size:12px;color:var(--sub);text-align:center;min-height:15px;margin:5px 0 2px;} .phase-hint b{color:var(--ink);}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:50;}
#hud{position:absolute;left:8px;top:28px;font-size:11px;color:#9aa0ad;font-family:ui-monospace,monospace;text-shadow:0 1px 2px #000;z-index:60;}
#review{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#0c0d12;}
#rtool{position:sticky;top:0;z-index:5;background:#12141a;border-bottom:1px solid #2c2f3a;padding:7px 10px;display:flex;gap:7px;align-items:center;flex-wrap:wrap;} #rtool .t{font-size:12px;color:#9aa0ad;margin-right:auto;} #rtool .t b{color:#ffe27a;}
#rtool button{background:#2c2f3a;color:#e7e7ea;border:none;border-radius:8px;padding:7px 11px;font-size:12px;font-weight:700;cursor:pointer;} #rtool button.on{background:#ffe27a;color:#15161a;} #rtool button.go{background:#2bd47a;color:#06210f;}
.sec{font-size:13px;font-weight:800;color:#8fd6ff;padding:10px 12px 4px;border-top:1px solid #1c2230;} .sec.en{color:#ff9a8f;}
.fxrow{display:flex;align-items:center;gap:7px;padding:6px 10px;border-bottom:1px solid #14171f;flex-wrap:wrap;}
.fxrow .nm{flex:1 1 120px;min-width:0;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fxrow .el{font-size:10px;padding:1px 7px;border-radius:99px;border:1px solid;flex:0 0 auto;}
.fxrow .play{background:#222d45;color:#cfe0ff;border:1px solid #2c3242;border-radius:8px;padding:6px 11px;font-size:12px;font-weight:700;cursor:pointer;flex:0 0 auto;} .fxrow .play:active{transform:scale(.95);}
.vbtn{width:30px;height:30px;border-radius:7px;border:1px solid #2c3242;background:#1b2230;color:#cfe0ff;font-size:13px;font-weight:800;cursor:pointer;flex:0 0 auto;} .vbtn.sel{background:#2bd47a;color:#06210f;border-color:#2bd47a;}
.fxrow .allbad{border:1px solid #5a2630;background:#241318;color:#ff8a98;border-radius:7px;padding:6px 9px;font-size:11px;font-weight:700;cursor:pointer;flex:0 0 auto;} .fxrow .allbad.sel{background:#ff5a6e;color:#330309;}
.fxrow .okbadge{font-size:10px;font-weight:800;color:#2bd47a;border:1px solid #1f6b45;background:#0e1a12;border-radius:99px;padding:3px 9px;flex:0 0 auto;}
.fxrow.picked{background:#0e1a12;} .fxrow.bad{background:#1d0f12;}
#csvout{width:100%;height:170px;display:none;background:#0b0c10;color:#cfd3db;border:0;border-top:1px solid #2c2f3a;padding:8px;font-family:ui-monospace,monospace;font-size:11px;}
.el.炎{border-color:#ff8a4a;color:#ffb88a}.el.氷{border-color:#7ad0ff;color:#bfe6ff}.el.雷{border-color:#ffe27a;color:#fff0a8}.el.光{border-color:#fff3b0;color:#fffbe6}.el.土{border-color:#d8a85a;color:#ecc890}.el.毒{border-color:#a3e635;color:#cdee8a}.el.闇{border-color:#b07bff;color:#d2b8ff}.el.聖{border-color:#7CFC8A;color:#bdf5c6}.el.無{border-color:#5b6a86;color:#aebbd4}

/* ===== スキルエフェクト・プレビュー(下半分) ===== */
#sktool{position:sticky;top:0;z-index:5;background:#12141a;border-bottom:1px solid #2c2f3a;padding:6px 8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
#sktool .lab{font-size:10px;color:#9aa0ad;}
#sktool button{background:#2c2f3a;color:#e7e7ea;border:none;border-radius:7px;padding:5px 9px;font-size:11px;font-weight:700;cursor:pointer;}
#sktool button.on{background:#ffe27a;color:#15161a;}
#sktool .vsel button.on{background:#6ea0ff;color:#06122a;}
#sktool .chip{background:#1b2230;color:#cdd8f0;border:1px solid #2c3242;border-radius:13px;padding:4px 9px;font-size:11px;cursor:pointer;}
#sktool .chip.on{background:#2a3a66;border-color:#6ea0ff;color:#fff;}
#skillgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:9px;}
.skcell{background:#101831;border:1px solid #283455;border-radius:11px;padding:7px 4px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;user-select:none;-webkit-user-select:none;}
.skcell:active{transform:scale(.95);border-color:#6ea0ff;}
.skcell .disc{width:54px;height:54px;border-radius:50%;overflow:hidden;background:#0c1326;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #33406b;font-size:26px;}
.skcell .disc img{width:100%;height:100%;object-fit:contain;}
.skcell .nm{font-size:10px;font-weight:700;line-height:1.15;color:#e6edff;}
.skcell .el{font-size:8px;color:#8ea0c8;}
#skdesc{position:fixed;inset:0;z-index:120;background:#000a;display:none;align-items:center;justify-content:center;padding:20px;}
#skdesc.show{display:flex;}
#skdesc .box{background:#141d35;border:1px solid #34406b;border-radius:14px;padding:16px 18px;max-width:340px;color:#e6edff;}
#skdesc .dn{font-size:16px;font-weight:800;margin-bottom:4px;}
#skdesc .dmeta{font-size:11px;color:#9fb3da;margin-bottom:8px;}
#skdesc .deff{font-size:13px;line-height:1.5;}
#skdesc .dfx{font-size:10px;color:#7e8db5;margin-top:8px;font-family:ui-monospace,monospace;}
#skdesc .dclose{margin-top:12px;text-align:center;}
#skdesc button{background:#2a3a66;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-weight:700;cursor:pointer;}
</style>
<script src="fx_data.js"></script></head>
<body>
<div id="gamewrap"><div id="app">
  <div class="topbar"><span><b>そうぐう！ プラズマ・ゴーレム×2</b></span><span style="color:#9aa0ad">単体技は左に当たります</span></div>
  <div class="stage" id="stage">
    <div class="enemy-row">
      <div class="enemy-card tgt" id="foe0"><div class="dtot"></div><div class="eimg" style="width:104px;height:104px;"><span class="emo" style="font-size:68px">👾</span></div><div class="ename">ゴーレムL</div><div class="ebar hp"><i style="width:78%"></i></div></div>
      <div class="enemy-card" id="foe1"><div class="dtot"></div><div class="eimg" style="width:104px;height:104px;"><span class="emo" style="font-size:68px">👹</span></div><div class="ename">ゴーレムR</div><div class="ebar hp"><i style="width:64%"></i></div></div>
    </div>
    <div class="mid"><div class="combo-badge">🔥<b>5</b> COMBO</div></div>
  </div>
  <div class="panel">
    <div class="party" id="party">
      <div class="ally-card active" data-role="dps"><div class="ac-shield">🛡</div><span class="ac-emoji">🔥</span><span class="ac-name">アタッカー</span><span class="ac-role">火力</span><div class="ac-bar hp"><i style="width:82%"></i></div><div class="ac-bar atb"><i style="width:72%"></i></div></div>
      <div class="ally-card" data-role="break"><div class="ac-shield">🛡</div><span class="ac-emoji">❄️</span><span class="ac-name">ブレイカー</span><span class="ac-role">妨害</span><div class="ac-bar hp"><i style="width:70%"></i></div><div class="ac-bar atb"><i style="width:40%"></i></div></div>
      <div class="ally-card" data-role="wall"><div class="ac-shield">🛡</div><span class="ac-emoji">🛡️</span><span class="ac-name">ガーダー</span><span class="ac-role">壁</span><div class="ac-bar hp"><i style="width:92%"></i></div><div class="ac-bar atb"><i style="width:90%"></i></div></div>
      <div class="ally-card" data-role="heal"><div class="ac-shield">🛡</div><span class="ac-emoji">✨</span><span class="ac-name">ヒーラー</span><span class="ac-role">回復</span><div class="ac-bar hp"><i id="healhp" style="width:44%"></i></div><div class="ac-bar atb"><i style="width:64%"></i></div></div>
    </div>
    <div class="phase-hint" id="phaseHint"><b>▼ 下の一覧から再生</b></div>
  </div>
  <canvas id="fx"></canvas><div id="hud">fps -- / particles --</div>
</div></div>
<div id="review">
  <div id="sktool">
    <span class="lab">案</span><span class="vsel"><button data-v="0" class="on">①</button><button data-v="1">②</button><button data-v="2">③</button><button data-v="3">④</button></span>
    <button id="slow">🐢スロー</button><button id="loop">⟳ループ</button>
    <span class="lab">｜役割</span><span id="roleFilt"></span>
    <a href="index.html" class="chip" style="text-decoration:none;">🎨 一覧</a>
    <span class="lab" id="skhint" style="margin-left:auto;">タップ=発動／長押し=説明</span>
  </div>
  <div id="skillgrid"></div>
</div>
<div id="skdesc"><div class="box"><div class="dn"></div><div class="dmeta"></div><div class="deff"></div><div class="dfx"></div><div class="dclose"><button>とじる</button></div></div></div>
<script>
const app=document.getElementById('app'),cv=document.getElementById('fx'),ctx=cv.getContext('2d');
const foeCards=[document.getElementById('foe0'),document.getElementById('foe1')];
const foeImgs=foeCards.map(c=>c.querySelector('.eimg'));
const allyEls={};document.querySelectorAll('.ally-card').forEach(c=>allyEls[c.dataset.role]=c);
const TAU=Math.PI*2,rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
let CW=460,CH=460;
function fit(){const r=app.getBoundingClientRect();CW=cv.width=Math.round(r.width);CH=cv.height=Math.round(r.height);}
window.addEventListener('resize',fit);fit();
function centerOf(el){const e=el.getBoundingClientRect(),c=cv.getBoundingClientRect();return{x:e.left+e.width/2-c.left,y:e.top+e.height/2-c.top};}
const PAL={炎:['#ff7b3a','#ffb05a','#ffe27a','#fff'],氷:['#7ad0ff','#bfe3ff','#dff4ff','#fff'],雷:['#ffe27a','#fff6b0','#ffd24a','#fff'],光:['#fffbe6','#ffe9a8','#fff','#ffd86b'],土:['#d8a85a','#a87a40','#e8c98a','#caa46a'],毒:['#a3e635','#7CFC8A','#caff70','#dfffa0'],闇:['#9a6bff','#6b3bd0','#b07bff','#d2b8ff'],聖:['#7CFC8A','#d6ffe0','#ffe9a8','#fff'],無:['#cfe0ff','#bfe3ff','#fff','#9fb0d6']};
const LV={low:{p:0.5,fx:0.55,sh:0.5},med:{p:1,fx:1,sh:1},high:{p:1.9,fx:1.45,sh:1.6}};
let FOES=[],curRole='dps';
// ===== engine =====
let ps=[],draws=[],shake=0,flash=0,flashCol='#fff',tint=0,tintCol='#7CFC8A';const MAXP=2200;
function addDraw(dur,fn){draws.push({age:0,dur,fn})}
function burst(x,y,o){const n=Math.min(o.n,MAXP-ps.length),dir=o.dir==null?0:o.dir,spread=o.spread==null?TAU:o.spread;
  for(let i=0;i<n;i++){const a=dir-spread/2+Math.random()*spread,s=o.spd*(0.4+Math.random()*0.8);
    ps.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:o.life*(0.7+Math.random()*0.6),max:o.life,size:o.size*(0.6+Math.random()*0.8),col:Array.isArray(o.col)?pick(o.col):o.col,grav:o.grav||0,drag:o.drag==null?0.94:o.drag,kind:o.kind||'dot',rot:Math.random()*TAU,vr:rnd(-6,6)});}}
function updateParticles(dt){for(let i=ps.length-1;i>=0;i--){const p=ps[i];p.life-=dt;if(p.life<=0){ps.splice(i,1);continue;}p.vx*=p.drag;p.vy=p.vy*p.drag+p.grav*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;}
  for(let i=draws.length-1;i>=0;i--){draws[i].age+=dt;if(draws[i].age>=draws[i].dur)draws.splice(i,1);}}
function drawParticles(){ctx.globalCompositeOperation='lighter';
  for(const p of ps){if(!isFinite(p.x)||!isFinite(p.y)||!isFinite(p.size)){p.life=0;continue;}const a=Math.max(0,Math.min(1,p.life/p.max));ctx.globalAlpha=a;
    if(p.kind==='streak'){const ang=Math.atan2(p.vy,p.vx),len=p.size*2.4+Math.hypot(p.vx,p.vy)*0.03;ctx.strokeStyle=p.col;ctx.lineWidth=p.size*0.5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-Math.cos(ang)*len,p.y-Math.sin(ang)*len);ctx.stroke();}
    else if(p.kind==='spark'){ctx.fillStyle=p.col;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillRect(-p.size*0.18,-p.size*1.1,p.size*0.36,p.size*2.2);ctx.restore();}
    else{const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.size*1.6);g.addColorStop(0,p.col);g.addColorStop(0.4,p.col);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.size*1.6,0,TAU);ctx.fill();}}
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';}
// primitives
function ring(x,y,col,big,delay){delay=delay||0;const dur=big?0.55:0.4;addDraw(dur+delay,(a)=>{if(a<delay)return;const t=(a-delay)/dur,al=(1-t);ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=al*0.9;ctx.strokeStyle=col;ctx.lineWidth=(big?9:5)*(1-t*0.6);ctx.beginPath();ctx.arc(x,y,(big?120:70)*t+8,0,TAU);ctx.stroke();ctx.restore();ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';});}
function chargeGlow(x,y,col,dur,big){addDraw(dur,(a)=>{const t=a/dur,al=Math.sin(t*Math.PI),r=(big?30:17)*(0.5+t*0.5);ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=al;const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'#fff');g.addColorStop(0.4,col);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();ctx.restore();ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';});}
function shieldDome(c,col,dur,big){const R=big?90:60;addDraw(dur,(a)=>{const t=a/dur,al=Math.min(Math.min(1,t*4),Math.min(1,(1-t)*4));ctx.save();ctx.translate(c.x,c.y-6);ctx.globalCompositeOperation='lighter';const segs=big?6:24,sh=0.6+0.4*Math.sin(a*14);ctx.globalAlpha=al*0.42*sh;ctx.fillStyle=col;ctx.beginPath();for(let i=0;i<=segs;i++){const ang=-Math.PI/2+i/segs*TAU,rr=R*(1+(big?0.04*Math.sin(i*1.7+a*6):0)),px=Math.cos(ang)*rr,py=Math.sin(ang)*rr*0.95;i?ctx.lineTo(px,py):ctx.moveTo(px,py);}ctx.closePath();ctx.fill();ctx.globalAlpha=al*0.9;ctx.lineWidth=big?4:2.4;ctx.strokeStyle=big?'#bff4ff':'#cfeaff';ctx.stroke();ctx.restore();ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';});}
function beamCol(E,col,big){const w=big?34:22;addDraw(big?0.6:0.4,(a)=>{const dur=big?0.6:0.4,t=a/dur,al=Math.sin(Math.min(1,t*1.6)*Math.PI)*0.95;ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=al;const g=ctx.createLinearGradient(E.x-w,0,E.x+w,0);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(0.5,col);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(E.x-w,0,w*2,E.y+10);ctx.restore();ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';});}

    if(arch==='機動・速度')fam='dash';
    else if(arch==='構え・自己強化'){fam='buff';kind=/不屈|金剛|踏止|耐|捨て身/.test(nm)?'endure':'atk';}
    else {fam='slash'; if(arch==='多段斬')kind='multi';}
    if(hi&&/滅却|超必殺|覇道|羅刹|無双|阿修羅|鬼神/.test(nm))fam='ultimate';
  } else if(role==='妨害'){ onRole='break';
    if(arch==='状態異常'){
      if(/毒|ポイズン|ベノム|疫|プレイグ|ペスト|スポイル/.test(nm+eff))fam='dot';
      else if(/眠|スリプ|ナップ/.test(nm)){fam='status';kind='sleep';}
      else if(/麻痺|まひ|パラライ/.test(nm+eff))fam='stun';
      else if(/遅延|ディレイ|スロウ|鈍|クイックダウン|テンペスト/.test(nm)){fam='status';kind='clock';}
      else if(/呪|カース|マレフィ|ナイトメア/.test(nm))fam='curse';
      else if(/鎧|アーマー/.test(nm)){fam='debuff';kind='armor';}
      else if(/弱体|ウィーク/.test(nm)){fam='debuff';kind='atk';}
      else fam='curse';
    } else if(arch==='魔法・範囲'){fam=hi?'bigmag':'burst';aoe=true;}
    else { if(/ドレイン|ドレイ|サイフォン|リーチ/.test(nm))fam='drain'; else fam='bolt'; }
  } else if(role==='壁'){ onRole='wall';
    if(arch==='挑発・威圧'){ if(/威圧|喝|恫喝|睨|萎縮|牽制/.test(nm)){fam='debuff';kind='atk';} else fam='taunt'; }
    else if(arch==='庇護'||arch==='陣・結界'){fam='shield';party=true;}
    else if(arch==='盾撃'){fam=/震|地鳴|轟|大地/.test(nm)?'quake':'bash';aoe=aoe||/震|全体/.test(nm+eff);}
    else {fam='shield'; party=/全体|みんな|味方全員/.test(eff)||/号令|守護結界|陣/.test(nm);}
  } else if(role==='回復'){ onRole='heal';
    if(arch==='蘇生'){fam='revive';party=aoe;}
    else if(arch==='状態回復・防御'){ if(/エスナ|パージ|キュア|浄化|アンフリーズ/.test(nm))fam='cleanse'; else {fam='shield';kind='ward';} party=aoe; }
    else { if(/ホーリー|セイクリッド|ジャッジ|グレア|グリマー|シャイン|裁き/.test(nm)&&/ダメージ|敵/.test(eff)){fam='beam';el='光';}
           else if(/リジェネ|継続|慈雨|雨/.test(nm))fam='regen'; else fam='heal'; party=aoe; }
  }
  if(!VAR[fam])fam='bolt';
  return {tpl:fam,fam,el,aoe,lv,kind,party,onRole};
}
let selVar=0, curSkill=null, lastPlay=null;
function playSkill(d){
  ps.length=0;draws.length=0;timers.length=0;shake=0;flash=0;tint=0;fxAge=0;prevAge=0;fit();resetScene();
  FOES=[centerOf(foeImgs[0]),centerOf(foeImgs[1])];
  const s=specForSkill(d); curRole=s.onRole;
  document.querySelectorAll('.ally-card').forEach(c=>c.classList.toggle('active',c.dataset.role===curRole));
  const fam=s.fam, vfns=VAR[fam]||VAR.bolt, r=(vfns[selVar]||vfns[0])(s);
  curId='sk';curVar=selVar;curSkill=d;lastPlay=function(){playSkill(d);};
  document.getElementById('phaseHint').innerHTML='<b>'+d.n+'</b> 案'+(selVar+1)+' <span style="color:#9aa0ad">['+fam+'/'+s.el+(s.aoe?'/全体':'')+(s.party?'/全体がけ':'')+']</span>';
  fx={dur:r.dur};
}
// ===== 下半分: アイコン4列グリッド =====
const grid=document.getElementById('skillgrid');
let roleF='all';
function buildGrid(){
  grid.innerHTML='';
  SKILLDATA.filter(d=>roleF==='all'||d.r===roleF).forEach(d=>{
    const c=document.createElement('div');c.className='skcell';
    c.innerHTML='<div class="disc"><img loading="lazy" src="../skill_icons/'+d.f+'.png" alt="" onerror="this.parentNode.textContent=String.fromCodePoint(10024)"></div><div class="nm">'+d.n+'</div><div class="el">'+d.el+(d.t?' · '+d.t:'')+'</div>';
    let lp=null,moved=false;
    const start=function(){moved=false;lp=setTimeout(function(){lp=null;showDesc(d);},480);};
    const end=function(){ if(lp){clearTimeout(lp);lp=null;if(!moved)playSkill(d);} };
    c.addEventListener('touchstart',function(){start();},{passive:true});
    c.addEventListener('touchmove',function(){moved=true;});
    c.addEventListener('touchend',function(e){e.preventDefault();end();});
    c.addEventListener('mousedown',start);
    c.addEventListener('mouseup',end);
    c.addEventListener('mouseleave',function(){if(lp){clearTimeout(lp);lp=null;}});
    grid.appendChild(c);
  });
}
function showDesc(d){
  const s=specForSkill(d); const box=document.getElementById('skdesc');
  box.querySelector('.dn').textContent=d.n;
  box.querySelector('.dmeta').textContent=d.r+' ・ '+d.el+' ・ '+(d.t||'')+' ・ '+d.arch;
  box.querySelector('.deff').textContent=d.eff||'(効果データなし)';
  box.querySelector('.dfx').textContent='エフェクト: '+s.fam+' / '+s.el+(s.aoe?' / 全体':'')+(s.party?' / 全体がけ':'')+'（案'+(selVar+1)+'）';
  box.classList.add('show');
}
document.getElementById('skdesc').addEventListener('click',function(e){ if(e.target===this||e.target.tagName==='BUTTON')this.classList.remove('show'); });
document.querySelectorAll('#sktool .vsel button').forEach(function(b){b.onclick=function(){selVar=+b.dataset.v;document.querySelectorAll('#sktool .vsel button').forEach(function(x){x.classList.toggle('on',x===b);});if(curSkill)playSkill(curSkill);};});
var rf=document.getElementById('roleFilt');[['all','全'],['火力','火力'],['妨害','妨害'],['壁','壁'],['回復','回復']].forEach(function(p){var b=document.createElement('button');b.className='chip'+(p[0]==='all'?' on':'');b.textContent=p[1];b.onclick=function(){roleF=p[0];document.querySelectorAll('#roleFilt button').forEach(function(x){x.classList.toggle('on',x===b);});buildGrid();};rf.appendChild(b);});
document.getElementById('slow').onclick=function(){slow=!slow;this.classList.toggle('on',slow);};
document.getElementById('loop').onclick=function(){loop=!loop;this.classList.toggle('on',loop);};
buildGrid();
requestAnimationFrame(frame);
</script></body></html>
