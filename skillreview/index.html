:"LR","m":"天から降り注ぐ光の柱の中に大きな不死鳥の羽と癒やしの十字、足元に広がる回復の光波、荘厳な後光"},{"f":"sk287","n":"✨聖王の祝祭","r":"回復","fam":"浄化＋超回復(全体・最上位)","el":"光","t":"LR","m":"後光を放つ荘厳な三重の黄金光輪と翠白の治癒の波紋が広がり、外周で全異常符が一斉に砕け金の輝点が舞う"},{"f":"sk288","n":"✨大天使の加護","r":"回復","fam":"女神級・複合蘇生(LR)","el":"光","t":"LR","m":"中央に光る守りの聖印、その上で広げた一対の大天使の翼、翼に沿って待機の光輪が巡る"},{"f":"sk289","n":"✨生命の奔流","r":"回復","fam":"浄化＋緊急特大回復(単体・最上位)","el":"光","t":"LR","m":"中央に光り輝く翠白の癒やしの十字が大きく立ち、奔流する治癒の光に巻かれて異常符が砕け散る"},{"f":"sk290","n":"✨救世の宝冠","r":"回復","fam":"予防＋全体HoT(全体・最上位)","el":"光","t":"LR","m":"黄金白に輝く荘厳な宝冠が中央に大きく構え、六角バリアの光膜と治癒のしずくの波紋を放つ"},{"f":"sk291","n":"✨天恵の戴冠","r":"回復","fam":"LR複合(王の祝福)","el":"光","t":"LR","m":"黄金の宝冠から降る聖光しずくと前進矢印、加護と進軍を併せた王の祝福"},{"f":"sk292","n":"✨復活の聖光","r":"回復","fam":"LR複合(王の祝福)","el":"光","t":"LR","m":"立ち昇る不死鳥の光羽に貫かれた聖光の杖頭、再生の輝き"},{"f":"sk293","n":"✨裁きと慈悲","r":"回復","fam":"LR複合(王の祝福)","el":"光","t":"LR","m":"天秤を抱く聖光の十字、片側は裁きの剣光・片側は癒やしの光"},{"f":"sk294","n":"✨万雨の祝福","r":"回復","fam":"LR複合(王の祝福)","el":"毒","t":"LR","m":"後光の雲から降る黄緑を帯びた浄化の癒やし雨、砕ける毒符"},{"f":"sk295","n":"✨疾風の慈愛","r":"回復","fam":"LR複合(王の祝福)","el":"風","t":"LR","m":"翠の風渦に乗って降る癒やしのしずくと舞う羽根、疾走の風線"}];
const RC = { 'C':'#9fb0d6','R':'#60a5fa','SR':'#2dd4bf','SSR':'#fb923c','UR':'#fbbf24','LR':'#ff6b6b' };
const ROLES = ['火力','妨害','壁','回復'];
const ELS = ['火','氷','雷','光','闇','地','毒','風','水','無'];
let fRole='all', fEl='all', fRing='UR', q='';

function mkChip(parent,label,val,cur,on){ const b=document.createElement('button'); b.className='chip'+(val===cur?' on':''); b.textContent=label; b.onclick=()=>on(val); parent.appendChild(b); }

function buildFilters(){
 const r=document.getElementById('fRole'); r.innerHTML=''; mkChip(r,'すべて','all',fRole,v=>{fRole=v;render();}); ROLES.forEach(x=>mkChip(r,x,x,fRole,v=>{fRole=v;render();}));
 const e=document.getElementById('fEl'); e.innerHTML=''; mkChip(e,'すべて','all',fEl,v=>{fEl=v;render();}); ELS.forEach(x=>mkChip(e,x,x,fEl,v=>{fEl=v;render();}));
 const ring=document.getElementById('fRing'); ring.innerHTML='';
 const none=document.createElement('span'); none.className='rb'+(fRing==='none'?' on':''); none.style.background='#16203a'; none.title='枠なし'; none.onclick=()=>{fRing='none';apply();}; ring.appendChild(none);
 Object.keys(RC).forEach(k=>{ const s=document.createElement('span'); s.className='rb'+(fRing===k?' on':''); s.style.background=RC[k]; s.title=k; s.onclick=()=>{fRing=k;apply();}; ring.appendChild(s); });
}
function apply(){ document.documentElement.style.setProperty('--ring', fRing==='none'?'transparent':RC[fRing]); buildFilters(); }

function render(){
 buildFilters();
 const g=document.getElementById('grid'); g.innerHTML='';
 let list=DATA.filter(d=>(fRole==='all'||d.r===fRole)&&(fEl==='all'||d.el===fEl)&&(!q||d.n.includes(q)));
 document.getElementById('cnt').textContent='（'+list.length+' / '+DATA.length+'）';
 if(!list.length){ g.innerHTML='<div class="empty">該当なし</div>'; return; }
 const byRole={}; list.forEach(d=>{ (byRole[d.r]=byRole[d.r]||[]).push(d); });
 const order = fRole==='all'?ROLES:[fRole];
 order.forEach(role=>{ const arr=byRole[role]; if(!arr)return;
  const h=document.createElement('div'); h.className='sech'; h.textContent=role+'（'+arr.length+'）'; g.appendChild(h);
  arr.forEach(d=>{ const c=document.createElement('div'); c.className='card';
   c.innerHTML='<div class="disc"><img loading="lazy" src="../skill_icons/'+d.f+'.png" alt="" onerror="this.parentNode.textContent=\'✨\'"></div>'+
    '<div class="nm">'+d.n+'</div>'+
    '<div class="meta">'+d.el+' ・ <span class="tier">'+d.t+'</span></div>'+
    '<div class="meta">'+d.fam+'</div>'+
    '<div class="fid">'+d.f+'</div>';
   g.appendChild(c);
  });
 });
}
document.getElementById('q').addEventListener('input',e=>{q=e.target.value.trim();render();});
apply(); render();
</script></body></html>
