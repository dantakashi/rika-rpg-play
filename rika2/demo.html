<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>理科RPG2（β）体験版</title>
<!--
  ============================================================
   理科RPG2 体験版（β）＝ demo.html
   ⚠ これは「使い捨ての試作（β）」。数値(ステ/敵HP/ドロップ率/装備メイン値)・スキル構成・15ステージは
      全部【仮】。実装と『聖典』が食い違うときは つねに【聖典が正】。
      demo の数字やスキル並びを“設計の真実”として引用しないこと（過去ドリフトの原因はここ）。

   ── 設計の正典＝聖典（新しい会話は まずここから・この順で）──
     ① rpg_v3/_docs/RIKA2_FOUNDATION_2026-06-21.docx     戦闘/ステ/装備/ダメージ式/レア度ladder の土台
     ② rpg_v3/_docs/RIKA2_CONFIRMED_LOG_2026-06-21.docx  オーナー確定事項のログ
     ③ rpg_v3/_docs/RIKA2_SKILLS_MASTER.json             全295スキル(正規の装備名/stat/range/tier)
     ＋ rpg_v3/_docs/RIKA2_HACKNSLASH_DESIGN_2026-06-22.docx  ハクスラ化(ループ/報酬/装備ドロップ)の設計
     索引・読む順・廃止ドキュメント一覧 → rpg_v3/_docs/RIKA2_CANON.md（最初に開く地図）
     最新の引き継ぎ                    → rpg_v3/_docs/HANDOFF_RIKA2_2026-06-23.md

   ── コードの目次 ──
   §1設定 §2教科/問題 §3敵/味方/スキル/アイテム/状態異常 §4状態 §5ループ §6コマンド
   §7対象選択 §8全画面出題 §9敵+状態異常 §10演出 §11描画 §12長押し説明 §M体験版画面(タイトル/ホーム/マップ/クリア)
  ============================================================
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reggae+One&family=M+PLUS+Rounded+1c:wght@700;800&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{ --bg1:#0b1020; --panel:#1a2336; --line:#2b3756; --ink:#e8eefc; --sub:#9fb0d6;
    --good:#34d399; --bad:#f87171; --warn:#fbbf24; --charge:#e6b34d; --mp:#38bdf8; --gold:#f4c95d; --gold-d:#b9821f;
    --bounce:cubic-bezier(.5,1.75,.75,1.25); }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:linear-gradient(160deg,var(--bg1),#070a14); color:var(--ink);
    font-family:-apple-system,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif; overflow:hidden;}
  #app{max-width:480px; margin:0 auto; height:100vh; height:100dvh; display:flex; flex-direction:column; position:relative;}
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:5px 12px; font-size:12px; color:var(--sub); flex:0 0 auto;}
  .topbar>span:first-child{display:flex; align-items:center; flex:1 1 auto; min-width:0;}   /* タイトルは縮めて…、ボタンは常に出す */
  .topbar>span:first-child b{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .topbar>span:last-child{flex:0 0 auto;}
  .topbar b{color:var(--ink);}
  .gear{background:var(--panel); border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:4px 9px; font-size:13px; white-space:nowrap;}
  /* テスト用デバッグ枠(生徒テスター向け・誤操作しにくいよう囲って明示) */
  .debug-box{width:100%; max-width:320px; margin:12px auto 0; border:1px dashed var(--warn); border-radius:10px; background:rgba(58,42,20,.4); padding:9px 10px;}
  .debug-box .dtt{font-size:12px; color:var(--warn); font-weight:700; text-align:center; margin-bottom:7px;}
  .debug-box .drow{display:flex; gap:7px; flex-wrap:wrap; justify-content:center;}
  .debug-box button{flex:1 1 auto; min-width:92px; background:var(--panel); border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:7px 6px; font-size:12px;}
  .debug-box .dver{text-align:center; font-size:10px; color:var(--sub); margin-top:7px;}
  /* ===== ホーム画面＝拠点(A案:王道RPG・横長Chromebook対応・装備ドロップ主軸 / 2026-06-23) ===== */
  #screen-home{padding:0;}
  #homeBody{margin:0; max-width:none; width:100%; align-self:stretch; min-height:100%; display:flex; flex-direction:column; text-align:left;}
  .nh{--gold:#f4c95d; --gold-d:#b9821f; flex:1; display:flex; flex-direction:column; min-height:100%; padding:12px 15px 13px; position:relative; overflow:hidden; background:radial-gradient(120% 80% at 30% 28%,#1b2a4d 0%,#0c1326 55%,#070a14 100%);}
  .nh::before{content:""; position:absolute; inset:0; pointer-events:none; background:radial-gradient(60% 52% at 32% 42%,rgba(244,201,93,.12),transparent 70%);}
  .nh>*{position:relative; z-index:1;}
  .nh button{font-family:inherit; cursor:pointer;}
  .nh-top{display:flex; align-items:center; justify-content:space-between; gap:8px; flex:0 0 auto;}
  .nh-prof{display:flex; align-items:center; gap:8px; background:rgba(255,255,255,.05); border:1px solid rgba(160,200,255,.16); padding:4px 12px 4px 4px; border-radius:30px;}
  .nh-prof .av{width:28px; height:28px; border-radius:50%; background:linear-gradient(150deg,#2a3a5e,#1a2336); display:flex; align-items:center; justify-content:center; font-size:15px; border:1px solid rgba(244,201,93,.4);}
  .nh-prof .nm{font-size:12px; font-weight:800; color:var(--ink); font-family:'Zen Kaku Gothic New',sans-serif;}
  .nh-prof .lv{font-size:10px; color:var(--sub);}
  .nh-loot{display:flex; align-items:center; gap:5px; background:rgba(244,201,93,.1); border:1px solid rgba(244,201,93,.4); color:var(--gold); font-size:13px; font-weight:800; padding:5px 13px; border-radius:30px;}
  .nh-mid{flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;}
  .nh-char{flex:0 0 auto; position:relative; display:flex; align-items:center; justify-content:center;}
  .nh-char .glow{position:absolute; width:200px; height:200px; border-radius:50%; background:radial-gradient(circle,rgba(244,201,93,.3),transparent 66%);}
  .nh-char .emo{font-size:118px; line-height:1; filter:drop-shadow(0 10px 22px rgba(0,0,0,.55)); animation:nhFloat 3.6s ease-in-out infinite;}
  @keyframes nhFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .nh-panel{width:100%; max-width:430px; display:flex; flex-direction:column; gap:9px;}
  .nh-title{text-align:center; font-family:'Reggae One',cursive; font-size:30px; line-height:1; color:#fff; text-shadow:0 2px 12px rgba(244,201,93,.4);}
  .nh-title span{color:var(--gold);}
  .nh-title small{display:block; font-family:'Zen Kaku Gothic New',sans-serif; font-weight:700; font-size:9px; letter-spacing:5px; color:var(--gold); margin-top:4px;}
  .nh-gear{display:flex; align-items:center; gap:8px; width:100%; text-align:left; background:rgba(255,255,255,.05); border:1px solid rgba(160,200,255,.16); border-radius:11px; padding:8px 12px; color:var(--ink); font-size:12px; font-weight:800; font-family:'Zen Kaku Gothic New',sans-serif;}
  .nh-gear .nh-gslots{display:flex; gap:4px; flex-wrap:wrap;}
  .nh-gear .nh-gslot{display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; border-radius:6px; background:rgba(0,0,0,.28); border:1px solid rgba(160,200,255,.22); font-size:15px; line-height:1; overflow:hidden;}   /* ★装備の枠＝あとで<img>に差し替え可 */
  .nh-gear .nh-gslot img{width:100%; height:100%; object-fit:contain;}
  .nh-gear .nh-gslot.acc{font-size:12px;}
  .nh-gear .to{margin-left:auto; color:var(--gold); font-size:11px;}
  .nh-chg{display:flex; align-items:center; gap:8px; width:100%; background:rgba(255,255,255,.05); border:1px solid rgba(244,201,93,.32); border-radius:11px; padding:6px;}
  .nh-chg .ar{flex:0 0 auto; width:36px; height:32px; display:flex; align-items:center; justify-content:center; font-size:15px; color:var(--gold); background:rgba(244,201,93,.1); border:0; border-radius:8px;}
  .nh-chg .who{flex:1; text-align:center; font-size:14px; font-weight:800; color:var(--ink); font-family:'Zen Kaku Gothic New',sans-serif;}
  .nh-chg .who small{display:block; font-size:10px; color:var(--gold); font-weight:700;}
  .nh-cta{--bounce:cubic-bezier(.5,1.75,.65,1); display:flex; align-items:center; justify-content:center; gap:9px; width:100%; padding:15px; border-radius:14px; border:0; border-bottom:4px solid var(--gold-d); background:linear-gradient(180deg,#f7d579,#dca22f); color:#3a230a; font-family:'Reggae One',cursive; font-size:21px; box-shadow:0 6px 22px rgba(244,201,93,.32); transition:transform .14s var(--bounce);}
  .nh-cta:active{transform:scale(.97) translateY(2px); border-bottom-width:2px;}
  .nh-review{display:flex; align-items:center; justify-content:center; gap:7px; width:100%; padding:10px; border-radius:12px; border:1px solid var(--gold); background:rgba(244,201,93,.1); color:var(--gold); font-size:14px; font-weight:800; font-family:'Zen Kaku Gothic New',sans-serif;}   /* ★復習=大事なのでホームにも(冒険の下に) */
  .nh-review:active{transform:scale(.97);}
  .nh-subs{display:flex; gap:8px; margin-top:9px; flex:0 0 auto;}
  .nh-subs button{flex:1; min-width:0; background:rgba(255,255,255,.05); border:1px solid rgba(160,200,255,.15); border-radius:12px; padding:9px 3px 8px; color:var(--ink); font-size:11px; font-weight:800; font-family:'Zen Kaku Gothic New',sans-serif;}
  .nh-subs button .e{display:block; font-size:18px; margin-bottom:2px;}
  .nh-subs button:active{transform:scale(.95);}
  .nh-subs button.soon{opacity:.5;}
  /* 横長Chromebook(11.6"): 立ち絵を左に大きく、メニューを右に */
  @media (min-width:680px){
    .nh-mid{flex-direction:row; align-items:center; gap:24px; padding:0 12px;}
    .nh-char{flex:0 0 44%;}
    .nh-char .emo{font-size:150px;}
    .nh-char .glow{width:248px; height:248px;}
    .nh-panel{flex:1; max-width:none;}
    .nh-title{text-align:left; font-size:34px;}
    .nh-title small{letter-spacing:6px;}
  }
  @media (prefers-reduced-motion:reduce){ .nh-char .emo{animation:none;} .nh-cta{transition:none;} }

  .stage{flex:1 1 auto; position:relative; display:flex; flex-direction:column; justify-content:space-between; padding:6px 10px 4px; min-height:0; overflow:hidden;}
  .enemy-row{display:flex; gap:8px; justify-content:center; align-items:flex-end; flex-wrap:wrap; flex:0 0 auto;}
  .enemy-card{position:relative; text-align:center;}
  .eimg{margin:0 auto; display:flex; align-items:center; justify-content:center; border-radius:13px; overflow:hidden; border:1px solid var(--line); box-shadow:0 6px 12px rgba(0,0,0,.5); max-height:48vh;}
  .eimg img{width:100%; height:100%; object-fit:cover; display:block;}
  .enemy-card.dead{opacity:.28; filter:grayscale(1);}
  .enemy-card.targetable .eimg{outline:3px dashed var(--warn); outline-offset:2px; cursor:pointer; animation:tpulse 1s infinite;}
  @keyframes tpulse{50%{outline-color:#fff;}}
  .ename{font-size:10px; font-weight:700; margin-top:2px; line-height:1.1;}
  .ebar{height:7px; border-radius:5px; background:#0008; border:1px solid var(--line); overflow:hidden; margin:2px auto 0;}
  .ebar i{display:block; height:100%;} .ebar.hp i{background:linear-gradient(90deg,#f87171,#ef4444);}
  .echg{height:4px; border-radius:3px; background:#0008; overflow:hidden; margin:2px auto 0;} .echg i{display:block; height:100%; background:linear-gradient(90deg,#fb7185,#e11d48);}
  .eattr{font-size:9px; padding:1px 6px; border-radius:99px; font-weight:700; border:1px solid; display:inline-block; margin-top:2px;}
  .ailments{display:flex; gap:3px; justify-content:center; flex-wrap:wrap; margin-top:2px; min-height:13px;}
  .ail{font-size:10px; padding:0 5px; border-radius:6px; background:#0009; border:1px solid var(--line); line-height:1.4;}
  .efx{position:absolute; left:50%; top:0; transform:translateX(-50%); font-weight:900; pointer-events:none; animation:dmgFloat .9s ease-out forwards; white-space:nowrap; text-shadow:0 2px 6px #000;}
  .efx.crit{color:var(--warn);} .efx.norm{color:#fff;} .efx.dot{color:#a3e635; font-size:15px;}
  .enemy-card.hitflash .eimg{animation:hitflash .3s;}

  .mid{flex:1 1 auto; position:relative; min-height:10px;}
  .combo-badge{position:absolute; right:8px; top:4px; font-size:11px; color:var(--warn); font-weight:700; text-shadow:0 1px 3px #000;}
  .combo-badge b{font-size:20px;}

  .panel{flex:0 0 auto; background:var(--panel); border:1px solid var(--line); border-radius:14px 14px 0 0; padding:9px 12px 13px; box-shadow:0 -6px 18px #0006;}
  .party{display:grid; grid-template-columns:repeat(4,1fr); gap:5px; margin-bottom:9px;}
  .ally-card{background:#161f30; border:1px solid var(--line); border-radius:9px; padding:5px 4px 4px; text-align:center; position:relative; transition:.1s;}
  .ally-card.active{border-color:var(--warn); box-shadow:0 0 0 2px var(--warn); background:#26210f;}
  .ally-card.downed{opacity:.42; filter:grayscale(1);}
  .ac-emoji{font-size:18px; line-height:1.1;} .ac-name{font-size:10px; font-weight:700; display:block;} .ac-role{font-size:8px; color:var(--sub); margin-bottom:1px;}
  .ac-bar{height:5px; border-radius:3px; background:#0007; margin-top:2px; overflow:hidden;} .ac-bar i{display:block; height:100%;}
  .ac-bar.hp i{background:linear-gradient(90deg,#34d399,#10b981);} .ac-bar.mp i{background:linear-gradient(90deg,#7dd3fc,#38bdf8);} .ac-bar.atb i{background:linear-gradient(90deg,#ffe39c,#e6b34d);}
  .ac-mp{font-size:8px; color:var(--mp); margin-top:2px;}
  .ac-shield{position:absolute; right:2px; top:1px; font-size:9px; line-height:1; max-width:88%; text-align:right; word-break:break-all;}
  .ac-down{position:absolute; inset:0; display:none; align-items:center; justify-content:center; font-size:24px;} .ally-card.downed .ac-down{display:flex;}
  .ac-fx{position:absolute; left:50%; top:-4px; transform:translateX(-50%); font-size:15px; font-weight:900; pointer-events:none; animation:dmgFloat .9s ease-out forwards; white-space:nowrap;}
  .ac-fx.heal{color:var(--good);} .ac-fx.hit{color:var(--bad);} .ally-card.hitflash{animation:hitflash .3s;}

  .phase-hint{font-size:12px; color:var(--sub); text-align:center; min-height:16px; margin-bottom:7px;} .phase-hint b{color:var(--ink);}
  .cmd-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:7px;}
  .cmd{display:flex; flex-direction:column; align-items:center; gap:2px; justify-content:center; padding:11px 4px; border-radius:11px; background:#222d45; border:1px solid var(--line); color:var(--ink); font-size:14px; font-weight:700; transition:transform .06s;}
  .cmd:active{transform:scale(.95);} .cmd .ico{font-size:19px;} .cmd .sub{font-size:8px; color:var(--sub); font-weight:400;}
  .cmd.atk{background:linear-gradient(180deg,#f7d579,#dca22f); border-color:var(--gold-d); color:#3a230a;}   /* 攻撃=金(ホームの主役色と統一) */
  .cmd.atk .ac-role,.cmd.atk .sub{color:#6a4a12;}
  .cmd.def{background:linear-gradient(180deg,#1e3a4f,#13283a); border-color:#0e7490;}
  .cmd.skill{background:linear-gradient(180deg,#143a2e,#0e2a22); border-color:#0f766e;}
  .cmd.item{background:linear-gradient(180deg,#3a2a14,#2a1f0e); border-color:#b45309;}
  .cmd:disabled{opacity:.35; filter:grayscale(.5);}
  .list{display:grid; gap:7px;}
  .skill-scroll{max-height:42vh; overflow-y:auto; padding-right:2px; -webkit-overflow-scrolling:touch;}
  .li{display:flex; align-items:center; gap:10px; padding:11px; border-radius:11px; background:#1d2a3f; border:1px solid var(--line); color:var(--ink); text-align:left;}
  .li:active{transform:scale(.98);} .li .ii{font-size:22px;} .li .nn{font-weight:700; font-size:15px;} .li .dd{font-size:11px; color:var(--sub);}
  .li .badge{margin-left:auto; font-size:10px; padding:3px 8px; border-radius:99px; white-space:nowrap; text-align:center; line-height:1.3;}
  .badge.q{background:rgba(244,201,93,.13); color:var(--gold); border:1px solid rgba(244,201,93,.4);} .badge.free{background:#13283a; color:#7dd3fc; border:1px solid #0e7490;}
  .badge.mp{background:#0c2a3a; color:#38bdf8; border:1px solid #0284c7;} .badge.aoe{background:#3a1c1c; color:#fca5a5; border:1px solid #b91c1c;}
  .li:disabled{opacity:.4; filter:grayscale(.6);}
  .back-btn{margin-top:2px; width:100%; padding:10px; border-radius:11px; background:#222d45; border:1px solid var(--line); color:var(--sub); font-size:14px;}
  .li.dis{opacity:.4; filter:grayscale(.6);}
  .lp-hint{text-align:center; font-size:10px; color:var(--sub); opacity:.6; margin-top:7px;}
  .info-modal{position:absolute; inset:0; z-index:50; background:rgba(4,7,14,.74); display:none; align-items:center; justify-content:center; padding:24px;}
  .info-modal.show{display:flex;}
  .info-card{background:var(--panel); border:1px solid var(--warn); border-radius:16px; padding:18px 18px 14px; max-width:340px; width:100%; box-shadow:0 12px 40px #000a; animation:savorPop .2s ease-out;}
  .info-ttl{font-size:18px; font-weight:800; margin-bottom:8px;}
  .info-fl{font-size:13px; color:var(--warn); font-style:italic; margin-bottom:10px; line-height:1.5;}
  .info-ef{font-size:14px; color:var(--ink); line-height:1.6; background:#0c1220; border:1px solid var(--line); border-radius:11px; padding:11px;}
  .info-close{text-align:center; font-size:11px; color:var(--sub); margin-top:11px;}

  .qoverlay{position:absolute; inset:0; z-index:85; background:linear-gradient(160deg,#0c1326,#070a14); display:none; flex-direction:column; padding:14px;}   /* ★出題の器=画面(.screen60)/ドロワー(70/71)より上・あいことば(9999)より下(問題側申し送り2026-06-24)。生きてる問題が将来のメニューに覆われないよう */
  .qoverlay.show{display:flex;}
  .qctx{font-size:12px; color:var(--sub); text-align:center; margin-bottom:8px;} .qctx b{color:var(--ink);}
  .qq{font-size:21px; font-weight:800; text-align:center; line-height:1.5; padding:6px 4px;}
  .qimg{flex:1 1 auto; min-height:60px; margin:10px 0; border:2px dashed var(--line); border-radius:14px; display:flex; align-items:center; justify-content:center; color:var(--sub); font-size:13px; background:#ffffff05;}
  .tiles{display:grid; grid-template-columns:1fr 1fr; gap:9px;}
  .tile{display:flex; align-items:center; gap:9px; padding:16px 12px; border-radius:12px; color:#fff; font-size:16px; font-weight:700; text-align:left; border:3px solid transparent; text-shadow:0 1px 2px #0007;}
  .tile:active{transform:scale(.97);} .tile .shape{font-size:18px;} .tile.ok{border-color:#fff; box-shadow:0 0 0 3px var(--good);} .tile.ng{opacity:.45;}
  .typewrap{display:flex; gap:8px;} .typewrap input{flex:1; padding:15px; font-size:20px; border-radius:12px; background:#0c1220; border:1px solid var(--line); color:var(--ink); font-family:"Courier New",monospace; text-align:center;}
  .typewrap button{padding:0 20px; border-radius:12px; background:#6d28d9; color:#fff; border:none; font-size:17px; font-weight:700;}
  .qfeed{flex:0 0 auto; margin-top:10px;} .qfeed .desc{font-size:14px; color:var(--ink); background:#0c1220; border:1px solid var(--line); border-radius:11px; padding:11px; line-height:1.55;}
  .qfeed .next{width:100%; margin-top:9px; padding:13px; border-radius:11px; background:linear-gradient(180deg,#f7d579,#dca22f); color:#3a230a; border:none; border-bottom:3px solid var(--gold-d); font-size:16px; font-weight:800;}
  .qfeed .wrongttl{color:var(--bad); font-weight:800; text-align:center; margin-bottom:6px; font-size:16px;}

  .dmg{position:absolute; left:50%; top:14%; transform:translateX(-50%); font-size:30px; font-weight:900; color:#fff; pointer-events:none; animation:dmgFloat .9s ease-out forwards;}
  @keyframes dmgFloat{0%{opacity:0; transform:translate(-50%,8px) scale(.6);}20%{opacity:1; transform:translate(-50%,-4px) scale(1.1);}100%{opacity:0; transform:translate(-50%,-40px) scale(1);}}
  .shake{animation:shake .28s;} @keyframes shake{0%,100%{transform:translate(0,0);}20%{transform:translate(-7px,3px);}40%{transform:translate(6px,-3px);}60%{transform:translate(-5px,2px);}80%{transform:translate(4px,-2px);}}
  .hitflash{animation:hitflash .3s;} @keyframes hitflash{0%,100%{filter:none;}40%{filter:brightness(2.2) drop-shadow(0 0 14px #fff);}}
  .particle{position:absolute; width:8px; height:8px; border-radius:50%; pointer-events:none;}
  .savor-banner{position:absolute; left:0; right:0; top:24%; text-align:center; pointer-events:none; z-index:5;}
  .savor-banner .big{display:inline-block; font-size:24px; font-weight:900; padding:7px 16px; border-radius:14px; background:rgba(10,14,28,.82); border:1px solid var(--warn); color:var(--warn); text-shadow:0 2px 8px #000; animation:savorPop .35s ease-out;}
  .savor-banner small{font-size:13px; color:#fff;}
  @keyframes savorPop{from{transform:scale(.6); opacity:0;}to{transform:scale(1); opacity:1;}}
  .flash-good{animation:fg .25s;} @keyframes fg{0%{background:rgba(52,211,153,.10);}100%{background:transparent;}}

  .tuner{position:absolute; inset:0; background:rgba(5,8,16,.95); z-index:40; padding:16px; overflow:auto; display:none;}
  .tuner.show{display:block;} .tuner h2{margin:4px 0 12px; font-size:17px;} .tuner h3{font-size:13px; color:var(--warn); margin:16px 0 8px;}
  .trow{margin-bottom:13px;} .trow label{font-size:13px; color:var(--sub); display:flex; justify-content:space-between;} .trow label b{color:var(--ink);}
  .trow input[type=range]{width:100%; margin-top:5px;} .trow.chk{display:flex; align-items:center; gap:8px;} .trow.chk label{flex:1; justify-content:flex-start;}
  .killgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .tnote{font-size:11px; color:var(--sub); line-height:1.5; margin-bottom:12px;}
  .tclose{width:100%; padding:13px; border-radius:11px; background:#222d45; color:var(--ink); border:1px solid var(--line); font-size:16px; font-weight:700; margin-top:6px;}
  .gearbig{background:#10162a; border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:14px;}

  /* ===== §M 体験版の画面(タイトル/マップ/クリア) ===== */
  .screen{position:absolute; inset:0; z-index:60; background:linear-gradient(160deg,#0c1326,#070a14); display:none; flex-direction:column; padding:22px 18px; overflow-y:auto;}
  .screen.show{display:flex;}
  .scr-inner{margin:auto 0; width:100%; max-width:440px; align-self:center; text-align:center;}
  .title-inner{display:flex; flex-direction:column; align-items:center; gap:10px;}
  .title-emoji{font-size:28px; letter-spacing:6px; filter:saturate(1.1);}
  .game-title{font-family:'Reggae One',cursive; font-size:48px; font-weight:400; margin:4px 0 0; letter-spacing:1px; color:#fff; text-shadow:0 2px 16px rgba(244,201,93,.5);}
  .game-title span{color:var(--gold);}
  .game-sub{font-size:11px; color:var(--gold); font-weight:700; letter-spacing:3px; margin:6px 0 2px;}
  .title-party{display:flex; gap:10px; justify-content:center; margin:12px 0 2px;}
  .title-party span{width:48px; height:48px; border-radius:12px; background:rgba(255,255,255,.05); border:1px solid rgba(244,201,93,.3); display:flex; align-items:center; justify-content:center; font-size:26px;}
  .title-lead{font-size:14px; color:var(--sub); line-height:1.7; margin:6px 0 14px;}
  .title-note{font-size:12px; color:var(--sub); opacity:.8; margin-top:14px; line-height:1.6;}
  .scr-ttl{font-size:24px; font-weight:900; margin:6px 0 4px;}
  .scr-sub{font-size:14px; color:var(--sub); line-height:1.6; margin-bottom:10px;}
  .big-emoji{font-size:54px; line-height:1; margin-bottom:6px;}
  .scr-btn{display:block; width:100%; max-width:320px; margin:9px auto 0; padding:13px; border-radius:12px; background:#222d45; border:1px solid var(--line); color:var(--ink); font-size:15px; font-weight:700;}
  .scr-btn.primary{background:linear-gradient(180deg,#f7d579,#dca22f); border:0; border-bottom:4px solid var(--gold-d); color:#3a230a; font-family:'Reggae One',cursive;}
  .scr-btn.big{font-size:18px; padding:16px;}
  .scr-btn:active{transform:scale(.97);}
  .scr-btns{margin-top:16px;}
  /* マップ */
  .map-list{display:grid; gap:11px; margin-top:8px;}
  .stage-card{display:flex; align-items:center; gap:13px; text-align:left; padding:13px 15px; border-radius:14px; background:#161f30; border:1px solid var(--line); color:var(--ink);}
  .stage-card:active{transform:scale(.985);}
  .stage-card.cleared{border-color:var(--good); background:#10241c;}
  .stage-card.locked{opacity:.55; filter:grayscale(.6);}
  .stage-card .sc-emoji{font-size:30px; flex:0 0 auto; width:38px; text-align:center;}
  .stage-card .sc-mid{flex:1 1 auto; min-width:0;}
  .stage-card .sc-name{font-size:17px; font-weight:800; line-height:1.2;}
  .stage-card .sc-theme{font-size:11px; color:var(--sub); margin-top:2px;}
  .stage-card .sc-flag{flex:0 0 auto; font-size:12px; font-weight:800; color:var(--warn); white-space:nowrap;}
  .stage-card.cleared .sc-flag{color:var(--good);}
  .stage-card.locked .sc-flag{color:var(--sub);}
  /* ドロップ */
  .drop-card{margin:14px auto 0; max-width:340px; background:#10162a; border:1px solid var(--line); border-radius:14px; padding:14px;}
  .drop-label{font-size:13px; color:var(--sub); margin-bottom:8px;}
  .drop-name{display:inline-block; font-size:17px; font-weight:800; padding:6px 14px; border-radius:99px; border:1.5px solid; margin-bottom:8px;}
  .drop-note{font-size:11px; color:var(--sub); line-height:1.5;}
  /* ホーム */
  .home-party{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:14px 0 12px;}
  .home-card{background:#161f30; border:1px solid var(--line); border-radius:12px; padding:10px 4px 8px; text-align:center;}
  .home-card .hc-emoji{font-size:24px; line-height:1;}
  .home-card .hc-name{font-size:12px; font-weight:800; margin-top:2px;}
  .home-card .hc-role{font-size:10px; color:var(--sub);}
  .home-card .hc-dots{margin:5px 0 3px; display:flex; gap:4px; justify-content:center;}
  .acc-dot{width:9px; height:9px; border-radius:50%; display:inline-block;}
  .acc-dot.empty{background:transparent; border:1px dashed var(--line);}
  .home-card .hc-pct{font-size:10px; color:var(--warn); font-weight:700;}
  .home-info{font-size:13px; color:var(--sub); text-align:center; margin-bottom:6px;}
  .home-info b{color:var(--ink);}
  /* 装飾品つけ替え */
  .acc-sub{font-size:12px; color:var(--sub); text-align:center; margin:2px 0 12px;}
  .acc-list{display:grid; gap:9px;}
  .acc-row{background:#161f30; border:1px solid var(--line); border-radius:12px; padding:10px 12px;}
  .ar-head{display:flex; align-items:center; gap:8px; margin-bottom:7px;}
  .ar-emoji{font-size:18px;} .ar-name{font-size:14px; font-weight:800;} .ar-pct{margin-left:auto; font-size:12px; color:var(--warn); font-weight:700;}
  .ar-slots{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .aslot{display:flex; flex-direction:column; align-items:flex-start; gap:1px; padding:8px 10px; border-radius:10px; background:#0c1220; border:1px solid var(--line); color:var(--ink); text-align:left; min-height:42px;}
  .aslot.sel{border-color:var(--warn); box-shadow:0 0 0 2px var(--warn);}
  .aslot-r{font-size:10px; font-weight:800;} .aslot-n{font-size:12px;}
  .aslot-b{font-size:10px; color:var(--good); line-height:1.3; margin-top:1px;}
  .aslot-empty{font-size:13px; color:var(--sub); align-self:center; margin:auto;}
  .chip-b{display:block; font-size:10px; color:var(--good); margin-top:1px;}
  .drop-bonus{font-size:12px; color:var(--good); margin-top:3px; font-weight:600;}
  .acc-invwrap{margin-top:14px; background:#10162a; border:1px solid var(--line); border-radius:12px; padding:11px;}
  .acc-invttl{font-size:12px; color:var(--sub); margin-bottom:8px;}
  .acc-inv{display:flex; flex-wrap:wrap; gap:7px;}
  .acc-chip{font-size:12px; padding:6px 11px; border-radius:99px; background:#1d2a3f; border:1.5px solid var(--line); color:var(--ink);}
  .acc-chip.remove{background:#3a1c1c; border-color:#b91c1c; color:#fca5a5;}
  .acc-hint{font-size:12px; color:var(--sub); padding:4px 2px;}
  /* そうび: キャラ選択ハブ＋装備スロット */
  .equip-hub{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin:12px 0;}
  .equip-card{background:#161f30; border:1px solid var(--line); border-radius:12px; padding:11px 6px 9px; text-align:center; color:var(--ink);}
  .equip-card:active{transform:scale(.98);}
  .equip-card .ec-skills{font-size:16px; letter-spacing:1px; margin:4px 0 2px; min-height:18px;}
  .estat{font-size:12px; color:var(--sub); text-align:center; background:#10162a; border:1px solid var(--line); border-radius:10px; padding:7px; margin:6px 0 10px;}
  .eq-secttl{font-size:12px; color:var(--warn); font-weight:700; margin:10px 0 6px;}
  .gslot-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .gslot{display:flex; flex-direction:column; align-items:flex-start; gap:1px; padding:8px 10px; border-radius:10px; background:#0c1220; border:1px solid var(--line); color:var(--ink); text-align:left;}
  .gslot.sel{border-color:var(--warn); box-shadow:0 0 0 2px var(--warn);}
  .gs-slot{font-size:10px; color:var(--sub);} .gs-skill{font-size:13px; font-weight:700;} .gs-tag{font-size:10px; font-weight:800;}
  .gs-b{font-size:10px; color:var(--good); line-height:1.3;}
  .drop-scroll{max-height:34vh; overflow-y:auto;}
  /* あいことばゲート(β・ソフトな鍵) */
  .passgate{position:absolute; inset:0; z-index:9999; background:linear-gradient(160deg,#0c1326,#070a14); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center;}
  .passgate.hide{display:none;}
  .pg-emoji{font-size:42px; line-height:1;}
  .pg-ttl{font-size:24px; font-weight:900; margin:12px 0 4px;}
  .pg-sub{font-size:13px; color:var(--sub); margin-bottom:18px;}
  .pg-input{width:100%; max-width:260px; padding:13px; font-size:18px; text-align:center; border-radius:12px; background:#0c1220; border:1px solid var(--line); color:var(--ink);}
  .pg-btn{width:100%; max-width:260px; margin-top:11px; padding:13px; border-radius:12px; background:linear-gradient(180deg,#f7d579,#dca22f); border:0; border-bottom:3px solid var(--gold-d); color:#3a230a; font-size:16px; font-weight:800;}
  .pg-err{color:var(--bad); font-size:13px; margin-top:10px; min-height:18px;}

  /* Chromebook 11.6"(1366x768 横長)最適化: 広い画面では拡大して横を使う(生徒の実機)。スマホ縦は従来どおり。 */
  @media (min-width:680px){
    #app{ max-width:min(1040px,96vw); }
    /* マップ=横長は複数列グリッド／全画面の中身は広げる */
    #screen-map .scr-inner{ max-width:none; }
    .map-list{ grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); }
    /* 全画面出題=横長で文字が間延びしないよう中身を中央820pxに寄せる */
    .qoverlay{ padding-left:max(14px,calc((100% - 820px)/2)); padding-right:max(14px,calc((100% - 820px)/2)); }
    /* タイトル/クリア等のカードは中央寄せのまま(広い背景に置く) */
    .ename{font-size:12px;} .eattr{font-size:11px;} .ail{font-size:11px;}
    .ac-emoji{font-size:23px;} .ac-name{font-size:12px;} .ac-role{font-size:10px;} .ac-mp{font-size:10px;} .ac-bar{height:7px;} .party{gap:8px;} .ac-shield{font-size:11px;}
    .cmd{font-size:16px; padding:14px 6px;} .cmd .ico{font-size:23px;} .cmd .sub{font-size:10px;}
    .phase-hint{font-size:14px;}
    .li .nn{font-size:16px;} .li .dd{font-size:12px;} .li .ii{font-size:26px;}
    .qq{font-size:25px;} .qctx{font-size:14px;} .qimg{font-size:15px;}
    .tile{font-size:18px; padding:19px 16px;} .tile .shape{font-size:20px;}
    .typewrap input{font-size:23px;}
    .savor-banner .big{font-size:30px;} .combo-badge b{font-size:24px;}
  }

  /* ===== §I もちもの台帳(インベントリ)＋装備詳細ドロワー＋装備3カラム(2026-06-24) =====
     世界観モチーフ＝理科室の実験ノート: 方眼の下地＋六角(周期表セル)のアイテム枠。
     レア度色は --rc 変数で受ける(全6レア度C〜LRに耐える)。紫グラデは使わない。 */
  /* 方眼ノートの下地(インベントリ/そうび画面の共通の地) */
  #screen-inventory::before,#screen-accessory::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
    background-image:linear-gradient(rgba(160,200,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(160,200,255,.035) 1px,transparent 1px);
    background-size:24px 24px;}
  #screen-inventory .scr-inner,#screen-accessory .scr-inner{position:relative;z-index:1;}
  /* 絞り込みチップ(試験管ラベル感のpill) */
  .chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0 0;}
  .chips.sub{margin-top:6px;}
  .chip{font-size:12px;font-weight:800;padding:6px 13px;border-radius:99px;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--sub);transition:transform .12s var(--bounce);min-height:34px;}
  .chip:active{transform:scale(.94);}
  .chip[aria-pressed="true"]{background:rgba(244,201,93,.12);border-color:var(--gold);color:var(--gold);}
  .chip.r[aria-pressed="true"]{background:color-mix(in srgb,var(--rc) 16%,transparent);border-color:var(--rc);color:var(--rc);}
  /* インベントリのヘッダ */
  .inv-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px;}
  .inv-head h2{font-family:'Reggae One',cursive;font-size:23px;font-weight:400;margin:0;color:#fff;}
  .inv-head .count{font-size:12px;color:var(--sub);} .inv-head .count b{color:var(--gold);font-size:16px;}
  /* アイテムカード(.gcard)＝周期表セルの標本。レア度=上辺3px＋六角サムネ地。枠優先(影は乱用しない) */
  .inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:10px;margin:12px 0;}
  .gcard{position:relative;background:#10162a;border:1px solid var(--line);border-top:3px solid var(--rc,var(--line));border-radius:12px;padding:9px 6px 8px;text-align:center;color:var(--ink);overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .12s var(--bounce);min-height:118px;}
  .gcard::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(160,200,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(160,200,255,.04) 1px,transparent 1px);background-size:11px 11px;pointer-events:none;}
  .gcard:active{transform:scale(.96);}
  .gcard.worn{box-shadow:0 0 0 2px rgba(244,201,93,.5);}
  .gcard .thumb{position:relative;z-index:1;width:54px;height:54px;margin:1px auto 4px;clip-path:polygon(25% 4%,75% 4%,98% 50%,75% 96%,25% 96%,2% 50%);
    background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--rc,#60a5fa) 22%,#0c1326),#0c1326 72%);display:flex;align-items:center;justify-content:center;font-size:26px;line-height:1;overflow:hidden;}
  .gcard .thumb img{width:100%;height:100%;object-fit:contain;}   /* ★本番アートはここに<img>差込 */
  .gcard .rr{position:relative;z-index:1;font-size:10px;font-weight:800;color:var(--rc);line-height:1.2;}
  .gcard .gn{position:relative;z-index:1;font-size:11px;font-weight:800;line-height:1.22;}
  .gcard .gm{position:relative;z-index:1;font-size:10px;color:var(--gold);font-weight:700;}
  .gcard .gb{position:relative;z-index:1;font-size:9px;color:var(--good);}
  .gcard .eq{position:absolute;top:5px;right:5px;width:19px;height:19px;border-radius:6px;background:var(--gold);color:#3a230a;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;z-index:2;}
  .gcard .slotpip{position:absolute;bottom:4px;left:5px;font-size:11px;z-index:2;opacity:.8;}   /* スロット=左下(NEWを左上に空ける) */
  .gcard .newdot{position:absolute;top:4px;left:4px;width:9px;height:9px;border-radius:50%;background:var(--bad);box-shadow:0 0 5px var(--bad);z-index:4;}   /* NEW=新着の赤ドット */
  .gcard .upbadge{position:absolute;bottom:3px;right:4px;font-size:13px;z-index:3;filter:drop-shadow(0 0 3px rgba(244,201,93,.8));}   /* ✨つけ得 */
  .inv-more{grid-column:1/-1;margin:4px 0 2px;padding:11px;border-radius:11px;background:#1d2a3f;border:1px solid var(--line);color:var(--ink);font-size:13px;font-weight:700;}
  .inv-more:active{transform:scale(.98);}
  .sortlbl{font-size:11px;color:var(--sub);align-self:center;margin-right:2px;}
  .chip.newchip[aria-pressed="true"]{background:rgba(248,113,113,.14);border-color:var(--bad);color:#fca5a5;}
  .inv-empty{grid-column:1/-1;text-align:center;color:var(--sub);font-size:13px;padding:26px 0;}
  /* 売却モード */
  .inv-head-r{display:flex;align-items:center;gap:8px;flex:0 0 auto;}
  .gold{display:inline-flex;align-items:center;gap:3px;font-size:13px;color:var(--gold);font-weight:800;background:rgba(244,201,93,.1);border:1px solid rgba(244,201,93,.4);padding:4px 11px;border-radius:30px;white-space:nowrap;}
  .chip.selltgl.on{background:#3a1c1c;border-color:#b91c1c;color:#fca5a5;}
  .sell-hint{font-size:12px;color:var(--sub);background:rgba(244,201,93,.06);border:1px dashed rgba(244,201,93,.35);border-radius:9px;padding:7px 11px;margin:8px 0 0;line-height:1.5;}
  .sell-hint b{color:var(--gold);}
  .gcard.locked{opacity:.5;filter:grayscale(.55);}
  .gcard.sel{box-shadow:0 0 0 2px var(--good);}
  .gcard .sellchk{position:absolute;top:5px;right:5px;width:19px;height:19px;border-radius:6px;background:var(--good);color:#06281c;font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:center;z-index:2;}
  .gcard .eq.lock{background:#0c1220;border:1px solid var(--line);color:var(--sub);}
  .gcard .gm.sellg{color:var(--gold);}
  .sellbar{display:flex;align-items:center;gap:8px;margin:10px 0 2px;flex-wrap:wrap;}
  .sell-go{flex:1;min-width:170px;padding:12px;border-radius:11px;border:0;border-bottom:3px solid var(--gold-d);background:linear-gradient(180deg,#f7d579,#dca22f);color:#3a230a;font-weight:800;font-size:14px;transition:transform .12s var(--bounce);}
  .sell-go:active{transform:scale(.97);}
  .sell-go:disabled{opacity:.5;filter:grayscale(.5);background:#2a3450;color:var(--sub);border-bottom-color:var(--line);}
  .inv-toast{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);z-index:6;background:rgba(8,12,24,.94);border:1px solid var(--gold);color:var(--gold);font-size:13px;font-weight:800;padding:8px 18px;border-radius:20px;box-shadow:0 6px 20px #0008;}
  .inv-toast.sale{display:flex;align-items:center;gap:10px;white-space:nowrap;}
  .toast-undo{background:var(--gold);color:#3a230a;border:0;border-radius:8px;padding:6px 13px;font-weight:800;font-size:12px;min-height:30px;}
  /* ⭐ロック(お気に入り) */
  .gcard .lockbtn{position:absolute;top:4px;right:4px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1;color:var(--sub);z-index:3;background:rgba(0,0,0,.3);border:1px solid transparent;border-radius:7px;}
  .gcard .lockbtn.on{color:var(--gold);background:rgba(244,201,93,.16);border-color:rgba(244,201,93,.45);}
  .gcard.fav{box-shadow:0 0 0 1px rgba(244,201,93,.45);}   /* ロック品=控えめ金枠(装備中.wornより薄い) */
  .gcard .eq.lock{background:#0c1220;border:1px solid var(--line);color:var(--sub);}
  /* 誤売却アンドゥ・バー */
  .undo-bar{display:flex;align-items:center;justify-content:center;gap:9px;font-size:12px;color:var(--sub);background:rgba(244,201,93,.07);border:1px dashed rgba(244,201,93,.32);border-radius:9px;padding:6px 12px;margin:8px 0 0;}
  .undo-bar b{color:var(--ink);} .undo-bar .chip{padding:5px 13px;min-height:30px;color:var(--gold);border-color:var(--gold);}
  /* ⚡おまかせ装備 */

// ★スキルレベル(v0.9): 装備で決まる想定(プロト=tunerのskillLevel 1-3で操作)。lvAxis でレベルの伸び方を指定:
//   'power'=効力UP&MP増 / 'dur'=効き時間UP&MP増 / 'eff'=効果そのままMP減 / 無指定=レベルなし(ふさわしくない技)。
//   run は L={lv,pow,dur} を受け取り、効力は ×L.pow、持続は ×L.dur。数値は全て仮(本番で調整)。
const LV_POW=[1,1.5,2.1], LV_DUR=[1,1.4,1.8], LV_MPUP=[1,1.4,1.85], LV_MPDN=[1,0.78,0.6];
function skLevelable(s){ return !!(s.lvAxis && s.lvAxis!=='none'); }
function _lvi(){ return Math.max(0,Math.min(2,skillLevel-1)); }
function skL(s){ if(!skLevelable(s)) return {lv:0,pow:1,dur:1}; const i=_lvi();
  return { lv:i+1, pow:(s.lvAxis==='power'?LV_POW[i]:1), dur:(s.lvAxis==='dur'?LV_DUR[i]:1) }; }
function skMp(s){ if(!skLevelable(s)) return s.mp; const i=_lvi(); return Math.round(s.mp*(s.lvAxis==='eff'?LV_MPDN[i]:LV_MPUP[i])); }
function skAxisHint(s){ return s.lvAxis==='power'?'レベルUPで効力UP・MP増':(s.lvAxis==='dur'?'レベルUPで効き時間UP・MP増':(s.lvAxis==='eff'?'レベルUPで効果そのまま・MP減':'レベルなし')); }

/* ===================== §4 状態 ===================== */
let encIdx=0, enemies=[], allies=[], combo=0, items={hpPotion:3,mpPotion:2};   // items=消耗品の「持ち越し在庫」(永続=ACC_KEYに保存・戦闘ごとにリセットしない)。初期在庫は控えめ(MP薬は渋め=切り札の精神)。補充はショップ(1個1万)のみ
let phase='charging', stateTimer=0, pendingAction=null, activeAlly=null, _advancing=false, _lastEnemyActed=false;
function aliveEnemies(){ return enemies.filter(e=>e.alive); }
// curMetaFlat(メタステの装備相当フラット補正)とcurLoadout(役割別スキル)を反映。最終ステ=(素＋装備メイン＋ボーナス＋メタ補正)×装飾品%×固有バフ。
function makeAllies(){ const mflat=curMetaFlat||{}; allies = ALLY_DEFS.map(d=>{
  const skills = (curLoadout&&curLoadout[d.id]) ? curLoadout[d.id].slice() : buildLoadout(d.id);   // メタステは固定/通常ステは装備スキル
  const accm = 1 + accPctFor(d.id)/100, bf = d.buff||{};   // 装飾品メイン=全コア+%／bf=キャラ固有バフ(最終ステ倍率)
  const fin=(key,base)=>Math.round((base + accFlat(d.id,key) + (mflat[key]||0)) * accm * (bf[key]||1));   // ★装備のメインステ＋ボーナスが大半・素は微々
  const str=fin('str',d.str), int=fin('int',d.int), def=fin('def',d.def), hpMax=fin('hp',d.hpMax), mpMax=fin('mp',d.mpMax);
  const spd=Math.min(2.2, (d.spd + gearSpd(d.id)) * (bf.spd||1));   // ★足装備のすばやさ＋固有バフ(上限2.2≒1秒床の精神)
  return { ...d, skills, str, int, def, hpMax, mpMax, spd, hp:hpMax, mp:mpMax, baseResist:accResistFor(d.id), charge:0, downed:false,   // baseResist=装飾品の異常耐性(常時)
    powerUp:0, weakBlade:false, shield:0, defending:false, endure:false, counter:false,
    haste:null, focus:null, amp:null, regen:null, atkBuff:null, reduce:null, statusResist:null, ail:{}, taunt:0, cover:0, thorns:null, fade:0, quickReady:false, _tossBonus:0 }; }); }
function clearAllyBuffs(a){ a.powerUp=0; a.weakBlade=false; a.shield=0; a.defending=false; a.endure=false; a.counter=false; a.haste=null; a.focus=null; a.amp=null; a.regen=null; a.atkBuff=null; a.reduce=null; a.statusResist=null; a.ail={}; a.taunt=0; a.cover=0; a.thorns=null; a.fade=0; a.quickReady=false; a._tossBonus=0; }
function curEncounters(){ return STAGES[curStage].encounters; }
function setEncounter(i){ const defs=curEncounters()[i] || curEncounters()[0]; const mul=STAGES[curStage].enemyMul||1; const hpMul=STAGES[curStage].hpMul||1;   // hpMul=HPだけの倍率(攻撃力は据置で削れる)
  enemies = defs.map((ref,idx)=>{ const m=MONSTER_DB[ref]; const hp=Math.round(m.hp*mul*hpMul);
    return { ...m, attrs:m.attrs.slice(), resist:(m.resist?Object.assign({},m.resist):null),
      hp:hp, hpMax:hp, def:Math.round((m.def||0)*Math.min(mul,1.5)), atk:Math.round(m.atk*mul),   // enemyMul=段階強化(defは割合なので伸びを抑える)
      charge:0, alive:true, idx:idx, ail:{}, spMeter:0 }; });
  buildEnemies(); }
let gameState='title';   // ★体験版の進行状態: 'title'|'map'|'battle'|'clear'|'complete'|'defeat'。battle以外はupdate()停止。
// 1ステージ分の戦闘を初期化(味方フル・第1ウェーブ)。難度cfgはstartStageで適用済み。
function startBattle(){ encIdx=0; stageDrops=[]; setEncounter(0); makeAllies(); combo=0;   // ★items(消耗品)は持ち越し在庫=ここでリセットしない(ショップで買った切り札を戦闘に持ち込む)
  phase='charging'; stateTimer=0; pendingAction=null; activeAlly=null; _advancing=false; _lastEnemyActed=false;   // curQ/answered は問題側(quiz-engine)の状態＝ゲーム側は触らない(Quiz.askが毎問リセット)
  buildParty(); hideOverlay(); bumpCombo(); renderCommand(); }
function resetAll(){ startStage(curStage); }   // 「もう一度」＝今のステージをやり直す

/* ===================== §5 メインループ ===================== */
let last=performance.now();
function loop(now){ let dt=(now-last)/1000; last=now; if(dt>0.1)dt=0.1; update(dt); updateUI(); requestAnimationFrame(loop); }
const THINK=['command','skillmenu','itemmenu','targeting','question','miss'];
function update(dt){
  if(gameState!=='battle'||_advancing) return;   // 戦闘中のみ進める(タイトル/マップ/クリア画面では停止)。_advancing中(撃破→次ウェーブ待ち)も停止＝空コマンド/レース防止
  // 状態異常/バフは実時間tick(=charging/savor/enemyActの間だけ進む＝問題を解いてる/選んでる間は停止)。slow×毒の矛盾を避けるためdt依存。
  if(phase==='charging'||phase==='savor'||phase==='enemyAct') tickStatuses(dt);
  if(_advancing) return;   // tickStatusesの毒killで撃破された可能性→以降の遷移をスキップ
  const fillEnemy = (phase==='charging'||phase==='savor'||(THINK.includes(phase)&&!cfg.freezeOnThink));
  if(fillEnemy) enemies.forEach(e=>{ if(!e.alive)return; let rate=1;
    if(e.ail){ if(e.ail.sleep||e.ail.freeze||e.ail.timestop)rate=0; else{ if(e.ail.paralyze)rate=Math.min(rate,e.ail.paralyze.mul); if(e.ail.slow)rate=Math.min(rate,e.ail.slow.mul); } }
    e.charge += dt*100/cfg.enemyIntervalSec*rate; });
  if(phase==='charging'){
    allies.forEach(a=>{ if(a.quickReady&&!a.downed){ a.quickReady=false; a.charge=100; } });   // 先駆け: すぐ手番が回る
    allies.forEach(a=>{ if(!a.downed){ const hm=a.haste?a.haste.mul:1; a.charge += dt*100*a.spd*hm/cfg.chargeSec; } });
    const eReady = enemies.find(e=>e.alive && e.charge>=100);
    const ally = allies.find(a=>!a.downed && a.charge>=100);
    // 敵が連続2回動かない: 味方が手番待ちなら敵の2連を1回挟む(ハメ防止)。味方が居なければ敵は続けて動ける。
    if(eReady && !(ally && _lastEnemyActed)){ _lastEnemyActed=true; enemyAttack(eReady); return; }
    if(ally){ _lastEnemyActed=false; ally.charge=100; ally.defending=false; activeAlly=ally; phase='command'; renderCommand(); }   // defending=自分の次の手番で解除(残留しない)
  } else if(phase==='savor'){
    stateTimer-=dt; if(stateTimer<=0){ const er=enemies.find(e=>e.alive&&e.charge>=100); if(er){ _lastEnemyActed=true; enemyAttack(er); return; } phase='charging'; renderCommand(); }
  } else if(phase==='enemyAct'){
    stateTimer-=dt; if(stateTimer<=0){ phase='charging'; renderCommand(); }
  }
}

/* ===================== §6 コマンド ===================== */
function renderCommand(){
  const area=document.getElementById('cmdArea'), hint=document.getElementById('phaseHint');
  if(phase==='charging'){ hint.textContent='⚡ 行動ゲージを溜めています…'; area.innerHTML=`<div style="text-align:center;color:var(--sub);padding:14px 0;font-size:14px;">準備できた味方から動きます</div>`; return; }
  if(phase==='enemyAct'){ hint.textContent='— 敵のターン —'; area.innerHTML=`<div style="text-align:center;color:var(--sub);padding:14px 0;font-size:14px;">…</div>`; return; }
  if(phase==='savor'){ hint.textContent='✨ …'; area.innerHTML=`<div style="text-align:center;color:var(--sub);padding:14px 0;font-size:14px;">（演出中）</div>`; return; }
  if(phase==='command'){ const a=activeAlly; hint.innerHTML=`▶ <b>${a.emoji} ${a.name}</b> の番`;
    area.innerHTML=`<div class="cmd-grid">
      <button class="cmd atk" data-info="cmd:attack" onclick="chooseAttack()"><span class="ico">⚔️</span>攻撃</button>
      <button class="cmd def" data-info="cmd:defend" onclick="chooseDefend()"><span class="ico">🛡️</span>防御</button>
      <button class="cmd skill" data-info="cmd:skill" onclick="openSkills()"><span class="ico">✨</span>スキル</button>
      <button class="cmd item" data-info="cmd:item" onclick="openItems()"><span class="ico">🎒</span>アイテム</button>
    </div><div class="lp-hint">💡 ボタンや状態異常を長押しで説明</div>`; return; }
  if(phase==='skillmenu'){ renderSkillMenu(); return; }
  if(phase==='itemmenu'){ renderItemMenu(); return; }
  if(phase==='targeting'){ renderTargeting(); return; }
}
function chooseAttack(){ if(phase!=='command')return; beginAction({kind:'attack', scope:'enemy', needsQuiz:true}); }
function chooseDefend(){ if(phase!=='command')return; activeAlly.defending=true; bigSavor('🛡️ 防御の構え'); afterAction(activeAlly.name+'は身を守った'); }
function openSkills(){ if(phase!=='command')return; phase='skillmenu'; renderSkillMenu(); }
function renderSkillMenu(){ const area=document.getElementById('cmdArea'), a=activeAlly;
  document.getElementById('phaseHint').innerHTML=`✨ <b>${a.name}</b> のスキル`;
  area.innerHTML=`<div class="list skill-scroll">`+a.skills.map(id=>{ const s=SKILLS[id]; const mp=skMp(s);
    const comboOk=!s.combo||combo>=s.combo, mpOk=a.mp>=mp, ok=comboOk&&mpOk;
    const why=!mpOk?`<span class="badge mp">MP不足</span>`:(!comboOk?`<span class="badge free">コンボ${s.combo}必要</span>`:(s.scope==='allEnemies'?`<span class="badge aoe">全体</span>`:(s.needsQuiz?`<span class="badge q">要・問題</span>`:`<span class="badge free">即発動</span>`)));
    return `<button class="li${ok?'':' dis'}" data-info="skill:${id}" onclick="selectSkill('${id}')"><span class="ii">${s.emoji}</span>
      <span><span class="nn">${s.name}</span> <span class="badge mp" style="margin:0;">${skLevelable(s)?'Lv'+skL(s).lv+'・':''}MP${mp}</span></span>${why}</button>`;
  }).join('')+`</div><button class="back-btn" onclick="backToCommand()">◀ もどる</button>`; }
function selectSkill(id){ if(phase!=='skillmenu')return; const s=SKILLS[id], a=activeAlly; if(!s||a.mp<skMp(s))return; if(s.combo&&combo<s.combo)return;
  beginAction({kind:'skill', skill:s, scope:s.scope, needsQuiz:s.needsQuiz}); }
function openItems(){ if(phase!=='command')return; phase='itemmenu'; renderItemMenu(); }
function renderItemMenu(){ const area=document.getElementById('cmdArea');
  document.getElementById('phaseHint').textContent='🎒 アイテム（行動ゲージ消費・正解で30%に軽減）';
  area.innerHTML=`<div class="list">`+ITEM_DEFS.map(it=>{ const n=items[it.id]||0;
    return `<button class="li${n>0?'':' dis'}" data-info="item:${it.id}" onclick="selectItem('${it.id}')"><span class="ii">${it.emoji}</span>
      <span><span class="nn">${it.name}</span> ×${n}</span><span class="badge q">問題で軽減</span></button>`;
  }).join('')+`</div><button class="back-btn" onclick="backToCommand()">◀ もどる</button>`; }
function selectItem(id){ if(phase!=='itemmenu')return; const it=ITEM_DEFS.find(x=>x.id===id); if(!it||(items[id]||0)<=0)return;
  beginAction({kind:'item', item:it, scope:'none', needsQuiz:true}); }
function backToCommand(){ if(['skillmenu','itemmenu','targeting'].includes(phase)){ phase='command'; renderCommand(); } }
function afterAction(hint){ document.getElementById('phaseHint').textContent=hint; if(activeAlly) activeAlly.charge=0; activeAlly=null; phase='savor'; stateTimer=cfg.actionSec; renderCommand(); }

/* ===================== §7 対象選択 ===================== */
function beginAction(act){ act.targetIdx=null; pendingAction=act;
  if(act.scope==='enemy'){ const al=aliveEnemies();
    if(al.length===0){ afterAction(activeAlly?activeAlly.name+'は空を切った':'…'); return; }   // 敵ゼロ保険(毒で全滅直後にコマンドへ流入した場合)
    if(al.length>1){ phase='targeting'; renderTargeting(); return; }
    act.targetIdx = al[0].idx; }
  proceedAction(); }
function renderTargeting(){ document.getElementById('phaseHint').innerHTML='🎯 <b>だれを狙う？</b>（敵をタップ）';
  document.getElementById('cmdArea').innerHTML=`<button class="back-btn" onclick="backToCommand()">◀ やめる</button>`; }
function onPickTarget(idx){ if(phase!=='targeting')return; const e=enemies[idx]; if(!e||!e.alive)return; pendingAction.targetIdx=idx; proceedAction(); }
function proceedAction(){ const act=pendingAction, c=activeAlly;
  if(act.needsQuiz){ startQuestion(); }
  else { if(act.kind==='skill'){ c.mp-=skMp(act.skill); act.skill.run(c, enemies[act.targetIdx], skL(act.skill)); } afterAction(c.name+'は'+(act.skill?act.skill.name:'行動')+'を使った'); checkWin(); } }

/* ===================== §8 全画面出題（カフート式・1ソルバー） ===================== */
function questionSubjects(){ const act=pendingAction;
  if(act.scope==='enemy' && act.targetIdx!=null) return enemies[act.targetIdx].attrs;
  const u=new Set(); aliveEnemies().forEach(e=>e.attrs.forEach(s=>u.add(s))); return u.size?[...u]:['chemistry']; }
// ── 戦闘から問題を呼ぶ＝出題範囲(敵attrs)＋文脈＋結果ハンドラを渡して Quiz.ask に委譲 ──
function startQuestion(){ phase='question'; Quiz.ask({ subjects:questionSubjects(), grades:STAGES[curStage].grades, ctxFn:buildQuizCtx, onResult:resolveAnswer, onContinue:afterMiss }); }   // grades=ステージの学年帯(§5合意)。問題側がフォールバックするので空でも安全
function buildQuizCtx(q){ const subj=SUBJECTS[q.s], a=activeAlly, act=pendingAction, tgt=(act&&act.targetIdx!=null)?enemies[act.targetIdx]:null;   // qは Quiz.ask が渡す(問題側グローバルcurQに依存しない)
  if(!act) return `${subj.emoji}<b>${subj.jp}</b>の問題`;
  if(act.kind==='attack') return `<b>${a.emoji}${a.name}</b> → ${tgt?tgt.name:'敵'}　｜　${subj.emoji}<b>${subj.jp}</b>の問題`;
  if(act.kind==='skill') return `<b>${act.skill.emoji}${act.skill.name}</b>${act.scope==='allEnemies'?'(全体)':(tgt?'→'+tgt.name:'')}（正解で発動）　｜　${subj.emoji}${subj.jp}`;
  return `<b>${act.item.emoji}${act.item.name}</b>（正解で行動消費30%）　｜　${subj.emoji}${subj.jp}`; }

// ★resolveAnswer＝Quiz から渡される『戦闘側の結果ハンドラ』(onResult)。問題UI/解説はQuizが持つ＝ここは戦闘反映だけ。
function resolveAnswer(correct){ const act=pendingAction, c=activeAlly; if(!act)return;
  if(correct){ combo++; bumpCombo();
    // ★MP回復は『通常攻撃の正解』だけ＝スキルは純コスト→低コスト状態異常(まひ等)の永続化を防止(レビュー残対応)
    if(act.kind==='attack'){ if(c) c.mp=Math.min(c.mpMax,c.mp+cfg.mpPerCorrect); doAttack(c, enemies[act.targetIdx]); if(c) c.charge=0; }
    else if(act.kind==='skill'){ c.mp-=skMp(act.skill); act.skill.run(c, enemies[act.targetIdx], skL(act.skill)); c.charge=c._tossBonus||0; c._tossBonus=0; }   // 突進など「自ゲージ+」は手番後の0リセットの代わりに少し残す
    else if(act.kind==='item'){ useItem(act.item,true,c); }
    document.getElementById('phaseHint').textContent='COMBO '+combo+'！';
    pendingAction=null; activeAlly=null; phase='savor'; stateTimer=cfg.savorSec; renderCommand(); checkWin();
  } else { combo=0; bumpCombo();
    if(act.kind==='item'){ useItem(act.item,false,c); } else if(c){ c.charge=Math.max(0,c.charge-cfg.missDropPct); }   // 誤答=行動ゲージ−%だけ・HPは無罰(不可侵)。解説はQuiz→つぎへでafterMiss
    phase='miss'; } }
function afterMiss(){ hideOverlay(); pendingAction=null; activeAlly=null; phase='charging'; renderCommand(); }
function useItem(it,correct,c){ items[it.id]=Math.max(0,(items[it.id]||0)-1); saveAcc(); it.run(); const cost=correct?it.gaugeCost*0.3:it.gaugeCost; if(c) c.charge=Math.max(0,c.charge-cost); }   // ★在庫は永続=使ったら即保存(切り札を消費)。誤答でもit.run()は走る=回復は必ず効く(無罰)

/* ===================== §9 ダメージ計算 ＋ 敵 ＋ 状態異常エンジン ===================== */
// ★土台(⑧)のダメージ計算: 防御=割合式 K/(防+K)・各ヒット個別9999上限・会心は単純×1.5(序盤率10%)。
const DMG_CAP=9999, DMG_FLOOR=1, DEF_K=1000;
function mitig(def){ return DEF_K/(Math.max(0,def||0)+DEF_K); }   // 被ダメ率(0〜1)。防御が高いほど小さい。
// 被ダメUP倍率: 防御低下(kind:'defdown')を掛け合わせ・暴走防止に上限。
function vulnMult(e){ let v=1; if(e&&e.ail){ Object.keys(e.ail).forEach(t=>{ const a=e.ail[t]; if(a&&a.kind==='defdown')v*=a.mul; }); } return Math.min(v,2.0); }
function comboBonus(){ return Math.min(combo*0.04, 0.6); }   // コンボ加算(最大+60%・仮)
function statVal(c,key){ let v=(key==='int'?(c.int||0):key==='def'?(c.def||0):(c.str||0)); if(key==='str'&&c.atkBuff)v*=c.atkBuff.mul; return v; }   // 火力=ちから(str)/魔法=かしこさ(int)。闘気はstrに乗る。
// ★属性キラー: 一旦保留(2026-06-22オーナー判断)。コードは残すが killers を全て1.0にして実質無効(1倍)。
//   再有効化したいときは killers の値(physics等)を1.5などに戻すだけでOK。敵のattrsで最大の倍率が乗る。
function killer(e){ let m=1; if(e&&e.attrs){ e.attrs.forEach(a=>{ const k=killers[a]||1; if(k>m)m=k; }); } return m; }
// スキル/攻撃の与ダメ共通処理: 攻撃ステ×倍率×会心×(1+コンボ+与ダメ%)×K/(防+K)×被ダメUP×属性キラー(現1倍) → 9999上限/最低1。
function fdmg(c,statKey,mult,e,opts){ opts=opts||{}; if(!e||!e.alive)return 0;
  const atk=statVal(c,statKey); const crit=(Math.random()*100 < (c.crit||10)); const cm=crit?1.5:1;
  let dmg=atk*mult*cm*(1+comboBonus()+(opts.dealt||0))*mitig(e.def)*vulnMult(e)*killer(e);
  dmg=Math.max(DMG_FLOOR,Math.min(DMG_CAP,Math.floor(dmg))); dealEnemyTarget(e,dmg,crit); return dmg; }
function doAttack(c,e){ if(!e)return; const d=fdmg(c, c.atkStat||'str', 1.0, e); screenShake(); bigSavor('⚔️ こうげき '+fmt(d)); }   // 通常攻撃(主属性×1.0)＝唯一のMP回復手段(正解で+MP・resolveAnswerで加算)
function lowAlly(){ return allies.filter(a=>!a.downed).sort((x,y)=>x.hp/x.hpMax-y.hp/y.hpMax)[0]; }
// 回復: 戦闘不能が居れば蘇生優先(HP40%)、いなければ最もHP割合の低い味方を回復。amount=実数(上限1500)。
function healOne(amount){ let t=allies.find(a=>a.downed);
  if(t){ t.downed=false; t.hp=Math.floor(t.hpMax*0.4); spawnAllyFx(t,'蘇生！','heal'); return; }
  t=lowAlly(); if(!t)return; const h=Math.min(1500,Math.max(1,Math.floor(amount))); t.hp=Math.min(t.hpMax,t.hp+h); spawnAllyFx(t,'+'+h,'heal'); }
function healAlly(ratio){ ratio=ratio||0.30; const t=allies.find(a=>a.downed)||lowAlly(); if(!t)return; healOne(t.hpMax*ratio); }   // アイテム用(割合回復)

// 状態異常を付与。dot=継続時間ﾘﾌﾚｯｼｭ(火力一定・エスカレートしない)／その他=overrideで強さ/時間を上書き。
function applyAilment(e,type,override){ const base=AILMENTS[type]; if(!base||!e||!e.alive)return; const d=Object.assign({},base,override||{}); e.ail=e.ail||{};
  let dur=d.dur;   // 敵耐性で持続DOWN／弱体(ailamp)中は効きやすく長持ち。ailamp自身は対象外。
  if(type!=='ailamp'){ const rs=(e.resist&&e.resist[type])||0; let m=1-rs; if(e.ail.ailamp)m*=e.ail.ailamp.mul; dur=Math.max(1, dur*m); }
  if(d.kind==='dot'){ const cur=e.ail[type]; e.ail[type]={ kind:'dot', pps:d.pps, remain:dur, acc:cur?cur.acc:0, t:cur?cur.t:0 }; }
  else { e.ail[type]=Object.assign({}, d, {remain:dur}); } }
// 実時間tick(問題中は呼ばれない=停止)。敵DoT＋味方バフ持続＋味方やけど(敵特殊由来・非致死)。
function tickStatuses(dt){ let died=false;
  enemies.forEach(e=>{ if(!e.alive||!e.ail)return;
    Object.keys(e.ail).forEach(type=>{ const a=e.ail[type]; if(!a)return; a.remain-=dt;   // if(!a): 反復中に他のtickで消えた枠を踏まない
      if(a.remain<=0){ delete e.ail[type]; return; }
      if(a.kind==='dot' && e.alive){ const dmg=e.hpMax*a.pps*dt; e.hp=Math.max(0,e.hp-dmg); a.acc=(a.acc||0)+dmg; a.t=(a.t||0)+dt;
        if(a.t>=0.6){ spawnEnemyFx(e,'☠'+Math.max(1,Math.round(a.acc)),'dot'); a.acc=0; a.t=0; }
        if(e.hp<=0){ e.alive=false; spawnEnemyFx(e,'☠ たおした','dot'); died=true; onEnemyDeath(e); } }   // クリアは反復後(下) ＝ 反復中に e.ail を壊さない(クラッシュ防止)
    });
    if(!e.alive) e.ail={};
  });
  allies.forEach(a=>{ if(a.downed)return;
    ['haste','focus','amp','regen','atkBuff','reduce','statusResist'].forEach(k=>{ if(a[k]){ a[k].remain-=dt; if(a[k].remain<=0)a[k]=null; } });
    ['taunt','cover','fade'].forEach(k=>{ if(a[k]>0) a[k]=Math.max(0,a[k]-dt); });   // ヘイト系(秒)
    if(a.thorns){ a.thorns.remain-=dt; if(a.thorns.remain<=0)a.thorns=null; }
    if(a.regen){ const amt=a.regen.flat*dt; a.hp=Math.min(a.hpMax,a.hp+amt); a._rgA=(a._rgA||0)+amt; a._rgT=(a._rgT||0)+dt; if(a._rgT>=0.7){ spawnAllyFx(a,'+'+Math.max(1,Math.round(a._rgA)),'heal'); a._rgA=0; a._rgT=0; } }   // リジェネ/慈雨=毎秒一定回復
    if(a.ail) Object.keys(a.ail).forEach(type=>{ const x=a.ail[type]; if(!x)return; x.remain-=dt; if(x.remain<=0){ delete a.ail[type]; return; }
      if(x.kind==='dot'){ const dmg=a.hpMax*x.pps*dt; a.hp=Math.max(1,a.hp-dmg); x.acc=(x.acc||0)+dmg; x.t=(x.t||0)+dt; if(x.t>=0.7){ spawnAllyFx(a,'🔥'+Math.max(1,Math.round(x.acc)),'hit'); x.acc=0; x.t=0; } } });   // 味方DoTは最低HP1(やさしさ・無罰の精神)
  });
  if(died) checkWin(); }
// 敵の行動失敗(まひ/混乱)。
function enemyWillFail(e){ let p=0; if(e.ail){ if(e.ail.paralyze)p=Math.max(p,e.ail.paralyze.failChance||0); if(e.ail.confuse)p=Math.max(p,e.ail.confuse.fail||0); } return Math.random()<p; }
function enemyAtkMul(e){ return (e&&e.ail&&e.ail.atkdown)?e.ail.atkdown.mul:1; }   // 攻撃低下で敵の与ダメ×mul
function enemyAttack(e){ e.charge=0;
  const alive=allies.filter(a=>!a.downed); if(!alive.length){ phase='lose'; showEnd(false); return; }
  if(enemyWillFail(e)){ spawnEnemyFx(e,'…失敗','dot'); phase='enemyAct'; stateTimer=0.6; renderCommand(); return; }
  // 全体攻撃ボス: 毎手番 味方全員を攻撃(かばう対象外=AoE)。全体回復/被ダメ軽減で対策。
  if(e.aoeAttack){ alive.forEach(t=>{ const raw=Math.floor((e.atk*0.6+Math.random()*e.atk*0.2)*enemyAtkMul(e)); applyEnemyDamageToAlly(e,t,raw,true); });
    bigSavor('🐉 '+e.name+'の全体攻撃！'); screenShake();
    if(allies.every(a=>a.downed)){ phase='lose'; showEnd(false); return; } phase='enemyAct'; stateTimer=0.8; renderCommand(); return; }
  // 特殊(ボス・封印で無効化)。specEvery回ごとに発動。
  if(e.special){ e.spMeter=(e.spMeter||0)+1;
    if(e.spMeter>=(e.specEvery||3)){ e.spMeter=0; if(!(e.ail&&e.ail.seal)){ doEnemySpecial(e); return; } } }
  // ヘイト: 挑発中の味方が居れば狙い固定／いなければ気配消し中は避ける／その中で防御(挑発)を優先
  let pool=alive.filter(a=>a.taunt>0);
  if(!pool.length){ const nonFade=alive.filter(a=>!(a.fade>0)); pool=nonFade.length?nonFade:alive; }
  const def=pool.filter(a=>a.defending); const target=def.length?def[ri(def.length)]:pool[ri(pool.length)];
  if(e.ail&&e.ail.blind&&Math.random()<e.ail.blind.miss){ spawnAllyFx(target,'MISS','heal'); phase='enemyAct'; stateTimer=0.6; renderCommand(); return; }
  let dmg=Math.floor((e.atk+Math.random()*e.atk*0.4)*enemyAtkMul(e));   // 攻撃低下(atkdown)で被ダメ減
  applyEnemyDamageToAlly(e,target,dmg);
  if(allies.every(a=>a.downed)){ phase='lose'; showEnd(false); return; }
  phase='enemyAct'; stateTimer=0.7; renderCommand(); }
// 味方に状態異常を付与(状態異常ボス用)。味方の状態異常耐性(プロテス/守りの祈祷/マナシールド)でレジスト/短縮。
function applyAllyAilment(ally,type){ if(!ally||ally.downed)return; const base=AILMENTS[type]; if(!base)return;
  const res=Math.min(0.5, (ally.baseResist||0) + (ally.statusResist?ally.statusResist.pct:0));   // 装飾品の常時耐性＋スキルの耐性バフ(上限50%)
  let durMul=1; if(res>0){ if(Math.random()<res){ spawnAllyFx(ally,'レジスト','heal'); return; } durMul=1-res*0.5; }
  ally.ail=ally.ail||{}; const dur=Math.max(2, base.dur*durMul);
  if(base.kind==='dot'){ ally.ail[type]={kind:'dot', pps:base.pps, remain:dur, acc:0, t:0}; }
  else { ally.ail[type]=Object.assign({},base,{remain:dur}); }
  spawnAllyFx(ally, base.emoji, 'hit'); }
// ボスの特殊行動。curse=状態異常を味方にばらまく(浄化/耐性で対策)。それ以外=全体ダメージ。封印で止められる。
function doEnemySpecial(e){ const alive=allies.filter(a=>!a.downed); if(!alive.length){ phase='lose'; showEnd(false); return; }
  if(e.special==='curse'){ bigSavor('😈 '+e.name+'の呪い！');
    const shuffled=alive.slice().sort(()=>Math.random()-0.5); const n=Math.min(2,shuffled.length);
    for(let k=0;k<n;k++) applyAllyAilment(shuffled[k], Math.random()<0.5?'poison':'burn');
    alive.forEach(t=>{ const dmg=Math.floor(e.atk*0.4*enemyAtkMul(e)); applyEnemyDamageToAlly(e,t,dmg,true); });   // 軽い全体ダメも
    screenShake(); if(allies.every(a=>a.downed)){ phase='lose'; showEnd(false); return; } phase='enemyAct'; stateTimer=0.9; renderCommand(); return; }
  bigSavor('⚠️ '+e.name+'の特殊！');
  alive.forEach(t=>{ const dmg=Math.floor((e.atk*0.7+Math.random()*e.atk*0.3)*enemyAtkMul(e)); applyEnemyDamageToAlly(e,t,dmg,true); });
  if(e.special==='judgment'){ const t=allies.filter(a=>!a.downed).sort((x,y)=>x.hp/x.hpMax-y.hp/y.hpMax)[0]; if(t){ t.ail=t.ail||{}; t.ail.burn={kind:'dot',pps:0.03,remain:8,acc:0,t:0}; spawnAllyFx(t,'🔥やけど','hit'); } }
  screenShake();
  if(allies.every(a=>a.downed)){ phase='lose'; showEnd(false); return; }
  phase='enemyAct'; stateTimer=0.9; renderCommand(); }
// 味方への被ダメ適用: 防御(挑発+軽減)→シールド吸収→カウンター反射→不屈(致死耐え・HP1)→down。
function applyEnemyDamageToAlly(e,target,dmg,isAoE){
  // かばう: 単体攻撃のみ・他の味方への攻撃を かばう中の壁が肩代わり(軽減つき)。AoE(特殊の全体)は対象にしない=壁が4連で即死しない。
  if(!isAoE){ const cov=allies.find(a=>!a.downed && a.cover>0 && a!==target); if(cov){ spawnAllyFx(target,'🛡かばう','heal'); target=cov; dmg=Math.floor(dmg*0.7); } }
  dmg=Math.max(1,Math.floor(dmg*mitig(target.def)));                                  // ★割合防御(まもり)＝被ダメ率 K/(防+K)
  if(target.reduce && target.reduce.remain>0) dmg=Math.max(1,Math.floor(dmg*(1-target.reduce.pct)));   // 堅守などの被ダメ軽減
  if(target.defending){ dmg=Math.floor(dmg*0.3); target.defending=false; }
  if(target.shield>0){ const ab=Math.min(target.shield,dmg); target.shield-=ab; dmg-=ab; }
  if(target.counter && dmg>0){ target.counter=false; const ref=Math.floor(dmg*0.6)+Math.floor((target.str||0)*0.5);
    if(e&&e.alive){ dealEnemyTarget(e,ref,false); bigSavor('↩️ カウンター '+fmt(ref)); if(e.hp<=0)checkWin(); } }
  if(target.thorns && dmg>0 && e && e.alive){ const ref=Math.floor(dmg*target.thorns.pct); if(ref>0){ dealEnemyTarget(e,ref,false); spawnEnemyFx(e,'🌵'+fmt(ref),'dot'); if(e.hp<=0)checkWin(); } }   // とげの鎧(持続反射)
  let newHp=target.hp-dmg;
  if(newHp<=0 && target.endure){ target.endure=false; newHp=1; spawnAllyFx(target,'不屈！','heal'); }
  target.hp=Math.max(0,newHp);
  if(dmg>0) spawnAllyFx(target,'-'+dmg,'hit'); flashAlly(target);
  if(target.hp<=0){ target.downed=true; target.charge=0; clearAllyBuffs(target); }
  screenShake(); }

/* ===================== §10 演出 ===================== */
function dealEnemyTarget(e,dmg,crit){ if(!e||!e.alive)return; e.hp=Math.max(0,e.hp-dmg);
  if(e.ail&&e.ail.sleep&&e.ail.sleep.breakOnHit) delete e.ail.sleep;   // 眠りは殴ると起きる
  spawnEnemyFx(e,fmt(dmg),crit?'crit':'norm'); flashEnemy(e);
  if(e.hp<=0){ e.alive=false; e.ail={}; onEnemyDeath(e); } }
function checkWin(){ if(aliveEnemies().length===0 && !_advancing){ _advancing=true; setTimeout(()=>{ _advancing=false; nextEncounter(); }, cfg.savorSec*1000*0.7); } }
function nextEncounter(){ encIdx++; if(encIdx>=curEncounters().length){ stageClear(); return; }
  activeAlly=null; pendingAction=null; _lastEnemyActed=false;   // 前ウェーブの手番/対象を残さない(targetIdxが新ウェーブの別敵を指す事故を防ぐ)
  setEncounter(encIdx); allies.forEach(a=>{ a.downed=false; a.hp=a.hpMax; a.mp=a.mpMax; a.charge=0; clearAllyBuffs(a); });
  combo=0; bumpCombo(); bigSavor('✓ 撃破！ つぎの相手だ'); phase='charging'; renderCommand(); }
function spawnEnemyFx(e,text,cls){ const card=document.getElementById('enemy-'+e.idx); if(!card)return; const f=document.createElement('div'); f.className='efx '+(cls||'norm');
  if(cls==='crit') f.style.fontSize='30px'; else if(cls!=='dot') f.style.fontSize='22px'; f.textContent=text; card.appendChild(f); setTimeout(()=>f.remove(),900);
  if(cls==='crit'||cls==='norm'){ const stage=document.getElementById('stage'); const r=card.getBoundingClientRect(), s=stage.getBoundingClientRect();
    for(let i=0;i<(cls==='crit'?12:7);i++){ const p=document.createElement('div'); p.className='particle'; p.style.background=cls==='crit'?'#fbbf24':'#f87171';
      p.style.left=(r.left-s.left+r.width/2)+'px'; p.style.top=(r.top-s.top+r.height/2)+'px'; stage.appendChild(p);
      const ang=Math.random()*Math.PI*2, dist=24+Math.random()*44; p.animate([{transform:'translate(0,0)',opacity:1},{transform:`translate(${Math.cos(ang)*dist}px,${Math.sin(ang)*dist}px)`,opacity:0}],{duration:500,easing:'ease-out'}); setTimeout(()=>p.remove(),500); } } }
function flashEnemy(e){ const card=document.getElementById('enemy-'+e.idx); if(card){ card.classList.add('hitflash'); setTimeout(()=>card.classList.remove('hitflash'),300); } }
function spawnAllyFx(ally,text,cls){ const card=document.getElementById('ally-'+ally.id); if(!card)return; const f=document.createElement('div'); f.className='ac-fx '+(cls||''); f.textContent=text; card.appendChild(f); setTimeout(()=>f.remove(),900); }
function flashAlly(ally){ const card=document.getElementById('ally-'+ally.id); if(card){ card.classList.add('hitflash'); setTimeout(()=>card.classList.remove('hitflash'),300); } }
function bigSavor(html){ const stage=document.getElementById('stage'); const old=document.getElementById('savorBanner'); if(old)old.remove();

const _ailSig={}, _buffSig={};
function buildEnemies(){ const row=document.getElementById('enemyRow'); const n=enemies.length;
  for(const k in _ailSig)delete _ailSig[k];   // DOM作り直し＝アイコン差分キャッシュをリセット
  // 敵が少ないほど大きく(1体=最大・2体=横幅いっぱい)。幅(画面/敵数)と縦上限の小さい方＝はみ出さず最大化。
  const stage=document.getElementById('stage');
  const avail = (stage && stage.clientWidth>60 ? stage.clientWidth : Math.min((window.innerWidth||400)-24, window.innerWidth>=680?780:460)) - 4;
  const vh = window.innerHeight||700;

  const perW = Math.floor((avail - 8*(n-1))/Math.max(1,n));
  const sz = Math.max(74, Math.min(perW, maxH));
  row.innerHTML = enemies.map(e=>{ const ab=e.attrs.map(a=>{ const s=SUBJECTS[a]; return `<span class="eattr" style="color:${s.color};border-color:${s.color};background:${s.color}1a;">${s.emoji}${s.jp}</span>`; }).join(' ');
    const inner = /\.(png|jpg|webp)$/i.test(e.img)?`<img src="${e.img}" alt="${e.name}">`:`<span style="font-size:${Math.floor(sz*0.6)}px">${e.img}</span>`;
    return `<div class="enemy-card" id="enemy-${e.idx}" onclick="onPickTarget(${e.idx})">
      <div class="eimg" style="width:${sz}px;height:${sz}px;">${inner}</div>
      <div class="ename">${e.name}</div><div>${ab}</div>
      <div class="ailments" id="eail-${e.idx}"></div>
      <div class="ebar hp" style="width:${sz}px;"><i id="ehp-${e.idx}"></i></div>
      <div class="echg" style="width:${sz}px;"><i id="echg-${e.idx}"></i></div>

function buildParty(){ for(const k in _buffSig)delete _buffSig[k]; document.getElementById('party').innerHTML=allies.map(a=>`

    <div class="ac-emoji">${a.emoji}</div><span class="ac-name">${a.name}</span><div class="ac-role">${a.role}</div>
    <div class="ac-bar hp"><i id="hp-${a.id}"></i></div>
    <div class="ac-bar mp"><i id="mp-${a.id}"></i></div>
    <div class="ac-bar atb"><i id="atb-${a.id}"></i></div>
    <div class="ac-shield" id="sh-${a.id}"></div><div class="ac-down">💀</div></div>`).join(''); }
function pct(v,max){ return Math.max(0,Math.min(100,v/max*100)); }
function allyBuffIcons(a){ let s=''; if(a.taunt>0)s+='😤'; if(a.reduce)s+='🔰'; if(a.atkBuff)s+='🔆'; if(a.statusResist)s+='🟣'; if(a.endure)s+='🪨'; if(a.regen)s+='🌿'; if(a.shield>0)s+='🛡'; if(a.cover>0)s+='🛡'; if(a.fade>0)s+='👻'; if(a.defending)s+='🛡️'; if(a.ail&&a.ail.poison)s+='☠️'; if(a.ail&&a.ail.burn)s+='🔥'; return s; }
function updateUI(){
  enemies.forEach(e=>{ const hp=document.getElementById('ehp-'+e.idx), ch=document.getElementById('echg-'+e.idx), card=document.getElementById('enemy-'+e.idx); if(!card)return;
    if(hp) hp.style.width=pct(e.hp,e.hpMax)+'%'; if(ch) ch.style.width=Math.min(100,e.charge)+'%';

const SAVE_KEY='rika2_demo_v1';
let progress={ unlocked:0, cleared:[], lead:0, gold:0 };   // unlocked=解放済みの最大ステージidx / cleared=クリア済みidx配列 / lead=ホームの看板キャラidx(覚える) / gold=ゴールド(聖典の通貨・売却/ショップ用)

/* ===================== §A レア度＋ボーナス＋装飾品(集めのエンドの種) ===================== */
// ★レア度ラダー=聖典どおり C / R / SR / SSR / UR / LR（UC=アンコモンは聖典に無い・廃止）。試作は C・R のみドロップ(SR以降は重み0=後日)。
const RARITY = {
  C:{   jp:'コモン',       col:'#9fb0d6', pct:1.0, w:62 },
  R:{   jp:'レア',         col:'#60a5fa', pct:2.0, w:38 },
  SR:{  jp:'スーパーレア', col:'#2dd4bf', pct:3.0, w:0 },
  SSR:{ jp:'SSレア',       col:'#fb923c', pct:4.5, w:0 },
  UR:{  jp:'ウルトラレア', col:'#fbbf24', pct:6.0, w:0 },
  LR:{  jp:'レジェンド',   col:'#ff6b6b', pct:8.0, w:0 },
};
const ACC_BASE = ['お守り','リング','ペンダント','ブレス','アミュレット','まが玉','バッジ','イヤリング'];
// ★ボーナスステータス(FOUNDATION ⑦の指輪ボーナス枠より・プロトで効くもの)。加算コア＋loot系(レア率/ドロップ率)＋異常耐性。
const BONUS_DEFS = { str:{jp:'ちから',pct:false}, int:{jp:'かしこさ',pct:false}, def:{jp:'まもり',pct:false}, hp:{jp:'最大HP',pct:false}, mp:{jp:'最大MP',pct:false},
  accRare:{jp:'レア率',pct:true}, accDrop:{jp:'ドロップ率',pct:true}, resist:{jp:'異常耐性',pct:true} };
const BONUS_POOL = ['str','int','def','hp','mp','accRare','accDrop','resist'];
const BONUS_VAL = { str:{C:4,R:24,SR:60,SSR:110,UR:175,LR:260}, int:{C:4,R:24,SR:60,SSR:110,UR:175,LR:260}, def:{C:3,R:16,SR:40,SSR:72,UR:115,LR:170},
  hp:{C:40,R:200,SR:480,SSR:850,UR:1350,LR:2000}, mp:{C:3,R:12,SR:26,SSR:44,UR:68,LR:100},
  accRare:{C:2,R:6,SR:10,SSR:15,UR:21,LR:30}, accDrop:{C:2,R:6,SR:10,SSR:15,UR:21,LR:30}, resist:{C:3,R:7,SR:11,SSR:16,UR:22,LR:30} };
const BONUS_COUNT = { C:1, R:2, SR:2, SSR:3, UR:3, LR:4 };
function rollBonuses(rarity){ const n=BONUS_COUNT[rarity]||1; const pool=BONUS_POOL.slice(); const out=[];
  for(let i=0;i<n && pool.length;i++){ const t=pool.splice(Math.floor(Math.random()*pool.length),1)[0];
    const base=(BONUS_VAL[t]&&BONUS_VAL[t][rarity])||0; out.push({ t, v:Math.max(1, Math.round(base*(0.85+Math.random()*0.3))) }); }   // ±15%のばらつき(loot感)
  return out; }
function accBonuses(a){ return (a&&a.bonuses)||[]; }
function bonusText(b){ const d=BONUS_DEFS[b.t]||{jp:b.t}; return d.jp+'+'+b.v+(d.pct?'%':''); }
// ★Phase1: 装備(武器/頭/胴/足)＝スキルを変える＝ビルドが変わる。★聖典どおり役割ロックなし＝スロット別の共通プール(誰でも装備可)。
const GEAR_SLOTS = ['武器','頭','胴','足'];
const GEAR_POOL = {   // スロット別に全役割のスキルを混在(C〜R帯のみ・regenallはSSR専用なので除外)
  '武器':['honoo','rensan','yamiuchi','thunder','tateuchi','holy'],
  '頭':['touki','poison','iatsu','regen','esna','protes','inori','higo','chain','armorbreak','acidrain'],
  '胴':['fukutsu','drain','provoke','heal','healall','manashield'],
  '足':['tosshin','delay','kenshu','jiu','slow'],
};
// ★聖典の固有装備名(MASTER.jsonのequip)。装備はこの名前で表示し、スキルは中身として併記。
const SKILL_EQUIP = { honoo:'ほのおの小太刀', rensan:'疾風の双剣', yamiuchi:'不意打ちの短刀', touki:'闘気の頭巾', fukutsu:'不屈の胸当て', tosshin:'突進の戦靴',
  thunder:'雷鳴の杖', poison:'毒の頭巾', drain:'吸命の外套', delay:'時詠みの靴', tateuchi:'鉄盾の打突', iatsu:'威圧の兜', provoke:'挑発の胸当て', kenshu:'堅守の具足',
  holy:'聖光の杖', regen:'再生の冠', heal:'癒やしのローブ', jiu:'慈雨の靴', esna:'浄化の聖典', protes:'予防の聖典', inori:'祈祷の頭巾', manashield:'魔法耐性のローブ',
  healall:'見習いの祈りローブ', higo:'庇護の旗印', slow:'鈍足の魔靴', chain:'束縛の呪本', armorbreak:'鎧朽ちの魔本', acidrain:'酸の魔本' };
function equipName(g){ return (g&&g.equip) || (g&&SKILL_EQUIP[g.skillId]) || (g&&SKILLS[g.skillId]?SKILLS[g.skillId].name:'装備'); }
// ★④ 装備のメインステ=スキルのstat(決定論)・値はレア度。★⑤ 各スキルのrange(出現帯)＝聖典。
const STAT_JP = { str:'ちから', int:'かしこさ', def:'まもり', hp:'最大HP', mp:'最大MP', spd:'すばやさ' };
const SKILL_STAT = { honoo:'str', rensan:'str', yamiuchi:'str', touki:'str', tateuchi:'str',
  thunder:'int', holy:'int', poison:'int', drain:'int', regen:'int', heal:'int', esna:'int', protes:'int', manashield:'int', healall:'int', chain:'int', armorbreak:'int', acidrain:'int',
  iatsu:'def', inori:'def', higo:'def', fukutsu:'hp', provoke:'hp', tosshin:'spd', delay:'spd', kenshu:'spd', jiu:'spd', slow:'spd' };
const SKILL_RANGE = { honoo:'C〜R', rensan:'C〜R', yamiuchi:'C〜R', fukutsu:'C〜R', tosshin:'C〜R', poison:'C〜R', delay:'C〜R', tateuchi:'C〜R', iatsu:'C〜R', kenshu:'C〜R', holy:'C〜R', regen:'C〜R', heal:'C〜R', jiu:'C〜R', esna:'C〜R', protes:'C〜R', healall:'C〜R', higo:'C〜R', slow:'C〜R',
  touki:'C〜R〜SSR', inori:'C〜R〜SSR', thunder:'C〜R〜UR', drain:'C〜R〜UR', provoke:'C〜R〜UR', manashield:'C〜R〜UR', chain:'C〜R〜UR', armorbreak:'C〜R〜UR', acidrain:'C〜R〜UR' };
const MAIN_VAL = { str:{C:7,R:80,SR:200,SSR:380,UR:600,LR:900}, int:{C:7,R:80,SR:200,SSR:380,UR:600,LR:900}, def:{C:8,R:55,SR:130,SSR:240,UR:380,LR:560},
  hp:{C:120,R:700,SR:1700,SSR:3000,UR:4800,LR:7200}, mp:{C:6,R:35,SR:80,SSR:140,UR:210,LR:310}, spd:{C:0.03,R:0.07,SR:0.11,SSR:0.16,UR:0.23,LR:0.32} };   // ★装備のメインステ=ステの大半。CとRの差が大きい(R=今のプロト最上位の手応え)
const RARITY_ORDER = ['C','R','SR','SSR','UR','LR'];
function rangeIncludes(range,rarity){ const p=(range||'C〜R').split('〜'); const lo=RARITY_ORDER.indexOf(p[0]), hi=RARITY_ORDER.indexOf(p[p.length-1]), i=RARITY_ORDER.indexOf(rarity); return i>=0 && i>=lo && i<=hi; }
function rollMain(skillId,rarity){ const stat=SKILL_STAT[skillId]||'str'; const base=(MAIN_VAL[stat]&&MAIN_VAL[stat][rarity])||0;
  const v= stat==='spd' ? Math.round(base*100)/100 : Math.max(1, Math.round(base*(0.9+Math.random()*0.2))); return {stat, v}; }
function mainText(g){ if(!g||!g.main)return ''; const m=g.main; return (STAT_JP[m.stat]||m.stat)+'+'+(m.stat==='spd'?m.v.toFixed(2):m.v); }
function gearSpd(cid){ let v=0; equippedItems(cid).forEach(it=>{ if(it.main&&it.main.stat==='spd')v+=it.main.v; }); return v; }   // 足装備のすばやさ
let accInv = [];                       // 装飾品: [{id, rarity, base, bonuses}]
let accEquip = { ares:[null,null], sera:[null,null], gai:[null,null], mina:[null,null] };  // 装飾品2枠=accのid
let gearInv = [];                      // 装備: [{id, kind:'gear', slot, skillId, equip, rarity, bonuses}] ※役割ロックなし
let gearEquip = { ares:{武器:null,頭:null,胴:null,足:null}, sera:{武器:null,頭:null,胴:null,足:null}, gai:{武器:null,頭:null,胴:null,足:null}, mina:{武器:null,頭:null,胴:null,足:null} };
let _accSeq = 1;
const ACC_KEY='rika2_demo_acc_v1';
function _freshGearEquip(){ return { ares:{武器:null,頭:null,胴:null,足:null}, sera:{武器:null,頭:null,胴:null,足:null}, gai:{武器:null,頭:null,胴:null,足:null}, mina:{武器:null,頭:null,胴:null,足:null} }; }
function loadAcc(){ try{ const s=JSON.parse(localStorage.getItem(ACC_KEY)); if(s){ accInv=s.inv||[]; accEquip=Object.assign({ares:[null,null],sera:[null,null],gai:[null,null],mina:[null,null]}, s.equip||{}); gearInv=s.gearInv||[]; gearEquip=Object.assign(_freshGearEquip(), s.gearEquip||{}); _accSeq=s.seq||1; newIds=new Set(s.newIds||[]);   // ★NEW(新着)バッジの永続
  if(s.items) items=Object.assign({hpPotion:0,mpPotion:0}, s.items);   // ★消耗品の持ち越し在庫(永続)。旧セーブ(s.items無し)は初期在庫のまま=救済
  [].concat(accInv,gearInv).forEach(it=>{ if(it&&!RARITY[it.rarity]) it.rarity='R'; });   // 旧UC等の廃止レア度→Rに救済
  } }catch(e){} }
function saveAcc(){ try{ localStorage.setItem(ACC_KEY, JSON.stringify({inv:accInv, equip:accEquip, gearInv, gearEquip, seq:_accSeq, newIds:[...newIds], items})); }catch(e){} }
function accById(id){ return accInv.find(a=>a.id===id); }
function gearById(id){ return gearInv.find(g=>g.id===id); }
function accPctFor(cid){ let p=0; (accEquip[cid]||[]).forEach(id=>{ const a=id!=null?accById(id):null; if(a)p+=RARITY[a.rarity].pct; }); return p; }   // 装飾品メイン=全コア+%(2枠)
// その人に装備中の全アイテム(装飾品2＋装備4)。ボーナスはここから合算。
function equippedItems(cid){ const out=[]; (accEquip[cid]||[]).forEach(id=>{ const a=id!=null?accById(id):null; if(a)out.push(a); }); const g=gearEquip[cid]||{}; GEAR_SLOTS.forEach(s=>{ const it=g[s]!=null?gearById(g[s]):null; if(it)out.push(it); }); return out; }
function allEquippedItems(){ let out=[]; ALLY_DEFS.forEach(a=>{ out=out.concat(equippedItems(a.id)); }); return out; }
function accFlat(cid,stat){ let v=0; equippedItems(cid).forEach(it=>{ accBonuses(it).forEach(b=>{ if(b.t===stat)v+=b.v; }); if(it.main&&it.main.stat===stat)v+=it.main.v; }); return v; }   // ★加算コア=ボーナス＋装備のメインステ(④)
function accResistFor(cid){ let v=0; equippedItems(cid).forEach(it=>accBonuses(it).forEach(b=>{ if(b.t==='resist')v+=b.v; })); return Math.min(50,v)/100; }
function accMetaSum(type){ let v=0; allEquippedItems().forEach(it=>accBonuses(it).forEach(b=>{ if(b.t===type)v+=b.v; })); return v; }   // レア率/ドロップ率=全装備合算
function slotSkill(cid,slot){ const g=gearEquip[cid]&&gearEquip[cid][slot]; const it=g!=null?gearById(g):null; return it?it.skillId:null; }   // ★装備が無い枠は空(スキル無し)
function buildLoadout(cid){ return ['jab'].concat(GEAR_SLOTS.map(s=>slotSkill(cid,s)).filter(Boolean)); }   // 通常ステ=ジャブ＋装備したスキルだけ(初期は裸＝武器1本のみ)
function rollRarity(){ const rareB=accMetaSum('accRare'); const ks=Object.keys(RARITY);
  const w={}; ks.forEach(k=>{ w[k]=RARITY[k].w * (k==='C'?1:(1+rareB/100)); });   // レア率%でC以外(=良レア)に寄せる。試作はC/Rのみ重みあり
  const tot=ks.reduce((s,k)=>s+w[k],0); let x=Math.random()*tot; for(const k of ks){ x-=w[k]; if(x<0)return k; } return 'C'; }
function dropAccessory(){ const rarity=rollRarity(); const base=ACC_BASE[Math.floor(Math.random()*ACC_BASE.length)]; const a={ id:_accSeq++, rarity, base, bonuses:rollBonuses(rarity) }; if(rIdx(rarity)>=rIdx('SSR'))a.locked=true; newIds.add(a.id); accInv.push(a); saveAcc(); return a; }   // ★高レア(SSR+)は自動ロック／NEW(新着)に登録
function dropGear(){ const slot=GEAR_SLOTS[Math.floor(Math.random()*GEAR_SLOTS.length)]; const rarity=rollRarity();   // ★役割ロックなし=スロット別共通プール
  const okPool=GEAR_POOL[slot].filter(sid=>rangeIncludes(SKILL_RANGE[sid],rarity));   // ★⑤ rangeに合うスキルだけ(そのレア度に出るスキル)
  const pool=okPool.length?okPool:GEAR_POOL[slot]; const skillId=pool[Math.floor(Math.random()*pool.length)];
  const g={ id:_accSeq++, kind:'gear', slot, skillId, equip:SKILL_EQUIP[skillId], rarity, main:rollMain(skillId,rarity), bonuses:rollBonuses(rarity) };   // ★④ main付与
  if(rIdx(rarity)>=rIdx('SSR'))g.locked=true;   // ★高レア(SSR+)は自動ロック=誤売却防止
  newIds.add(g.id); gearInv.push(g); saveAcc(); return g; }   // ★NEW(新着)に登録
// ★初期装備=各キャラ コモンの武器1本だけ(裸スタート)。何を初期にするかは設計判断。
const STARTER = { ares:'honoo', sera:'thunder', gai:'tateuchi', mina:'holy' };
function grantStarters(){ Object.keys(STARTER).forEach(cid=>{ const skillId=STARTER[cid]; const g={ id:_accSeq++, kind:'gear', slot:'武器', skillId, equip:SKILL_EQUIP[skillId], rarity:'C', main:rollMain(skillId,'C'), bonuses:[] }; gearInv.push(g); gearEquip[cid]['武器']=g.id; }); saveAcc(); }
// ★ドロップ=装飾品 or 装備(半々)。報酬1個。
function rollDrop(){ if(Math.random()<0.5) return { kind:'acc', item:dropAccessory() }; return { kind:'gear', item:dropGear() }; }
// ★パズドラ式: 敵ごとにドロップ判定→演出→最後に結果表示。1ステージで1個は確定・1フロアで2個以上も可。
let stageDrops = [];   // このステージ(全ウェーブ)のドロップ
function enemyIsBoss(e){ return !!(e && (e.special || e.aoeAttack || e.hpMax>=4000)); }
function onEnemyDeath(e){ if(!e || e._dropped) return; e._dropped=true;
  const chance = enemyIsBoss(e) ? 1.0 : 0.55;
  if(Math.random() < chance){ const d=rollDrop(); stageDrops.push(d); spawnDropFx(e, d); } }

function eqPoolSortChips(){ const c=(k,l)=>`<button class="chip" aria-pressed="${eqPoolSort===k}" onclick="eqSetPoolSort('${k}')">${l}</button>`;
  return `<div class="chips sub"><span class="sortlbl">ならべ替え</span>${c('power','評価順')}${c('fit','合う順')}${c('rarity','レア度')}${c('new','新着')}</div>`; }
function poolFit(cid,it){ return (it.skillId!==undefined)?gearFitness(cid,it):accFitness(cid,it); }   // 合う順=このキャラへの適合度(評価とは別軸=混ぜない)

  else if(eqPoolSort==='rarity') L.sort((a,b)=>rIdx(b.rarity)-rIdx(a.rarity)||itemPower(b)-itemPower(a));
  else if(eqPoolSort==='new') L.sort((a,b)=>b.id-a.id);
  else L.sort((a,b)=>itemPower(b)-itemPower(a)||rIdx(b.rarity)-rIdx(a.rarity));   // 'power'(評価順)=既定

    const cards=list.length?list.map(x=>gearPoolCard(x,cid)).join(''):`<div class="inv-empty">この役割の そうびは まだ無いよ</div>`;

  } else { const si=equipSel.slot;

function gearPoolCard(x,cid){ const rc=RARITY[x.rarity].col, sk=SKILLS[x.skillId];
