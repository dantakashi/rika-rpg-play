<title>理科RPG2（β）体験版</title>
<!--
  ============================================================
   理科RPG2 戦闘リズム試作（ATB「落ち着いて解く」型） v0.10
   設計: rpg_v3/_docs/RIKA_BATTLE_ATB_DESIGN_2026-06-18.md (§9)
   スキル設計: rpg_v3/_docs/RIKA2_SKILLS_ROSTER_2026-06-18.md ＋ 追加候補=RIKA2_SKILL_CANDIDATES_2026-06-18.md
   v0.10 = ATB操作(ディレイ砲/号令/先駆け)＋状態異常シナジー(追い討ち/毒の連鎖)
   v0.11 = 守りのデバフ・耐性崩し(候補カタログ§4)＋★敵耐性システム:
     ・威圧(敵の攻撃力DOWN=atkdown・守りのデバフ)/蝕み(弱体ailamp=状態異常が効きやすく長持ち)
     ・★敵耐性 resist:{type:0..1} を導入(木=毒/岩=眠り氷まひ/オメガ=状態異常全般)。
       applyAilmentで 持続×(1-耐性)×(弱体中は×1.6)。蝕みで耐性ボスを崩す駆け引き。
     ・「まず増やす→balance時に取捨選択」方針。数値は仮。不可侵維持。
   v0.12 = バランス調整(オーナー承認): 毒の連鎖(detonate)の起爆倍率 1.6→0.8
     (敵の最大HP約95%の実質一撃を是正＝積む3手で約48%maxHPの強コンボに)。
   v0.9 = スキルレベル＋ヘイト一式(オーナーFB・検証目的=可能性とゲームへの馴染みの確認):
     ・★スキルレベル(1-3・装備で決まる想定/プロトはtunerで操作): lvAxis で伸び方を指定
       'power'=効力UP&MP増 / 'dur'=効き時間UP&MP増 / 'eff'=効果そのままMP減 / 無指定=レベルなし。
       run は L={lv,pow,dur} を受け取る。数値は全て仮(本番でバランス調整・似たスキルは取捨選択)。
     ・★ヘイト一式: 挑発(狙いを壁に固定)/かばう(単体攻撃を肩代わり・軽減)/とげの鎧(被弾で反射)/
       気配消し(狙われにくく)。敵の対象選択をヘイトで操作＝壁ガイが主役に。
   既出: v0.8スキル30実装 / v0.8.1 長押し説明＋確率を濁す
   v0.8.1 = 説明文の整理＋長押し説明＋確率を濁す(オーナーFB):
     ・画面の薄い小文字の説明(.dd/.sub)を撤去＝ボタンを すっきり。
     ・要素(スキル/アイテム/コマンド/状態異常アイコン)を【長押し or 右クリック】→
       フレーバーテキスト＋実効果を説明モーダルで表示(§12)。
     ・状態異常の付与確率は敵耐性がある前提で「小確率/中確率/高確率」と濁す
       (内部の確率値は不変・表示だけ濁す)。
   v0.8 = スキル30案を全実装＋バランス調整＋レビュー残対応:
     ・全31スキルを役割に配分(火力アレス/妨害セラ/壁ガイ/回復ミナ)。sleep付与スキルも実装(死にコード解消)。
     ・状態異常を拡張: 毒/やけど(DoT)・まひ/鈍足(ゲージ速度)・眠り/こおり/時間停止(停止)・
       防御低下/弱点露呈(被ダメUP)・封印(特殊封じ)・暗闇(命中DOWN)・混乱(行動失敗)
     ・敵の特殊行動(ボス)＝封印で止める／浄化で味方状態異常を治す（防御スキルに意味を持たせる）
     ・★MP経済修正(レビュー残): MP回復は「通常攻撃の正解」だけ→低コスト状態異常の永続化を遮断
     ・バフ持続(加速/集中/魔力増幅/リジェネ)＝実時間tick。誤答で味方HPは減らさない(無罰・不可侵)
     ・nit対応: defending=次の自手番で解除／updateUIの状態異常アイコンは差分更新／resizeはデバウンス
   既出: v0.5パーティ基盤 / v0.6複数敵+対象選択+AoE / v0.7状態異常エンジン+DoT+Chromebook最適化
   §目次 §1設定 §2教科/問題 §3敵/味方/スキル/アイテム/状態異常 §4状態 §5ループ §6コマンド §7対象選択 §8全画面出題 §9敵+状態異常 §10演出 §11描画
  ============================================================
-->
<style>
  :root{ --bg1:#0b1020; --panel:#1a2336; --line:#2b3756; --ink:#e8eefc; --sub:#9fb0d6;
    --good:#34d399; --bad:#f87171; --warn:#fbbf24; --charge:#8b5cf6; --mp:#38bdf8; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:linear-gradient(160deg,var(--bg1),#070a14); color:var(--ink);
    font-family:-apple-system,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif; overflow:hidden;}
  #app{max-width:480px; margin:0 auto; height:100vh; height:100dvh; display:flex; flex-direction:column; position:relative;}
  .topbar{display:flex; align-items:center; justify-content:space-between; padding:5px 12px; font-size:12px; color:var(--sub); flex:0 0 auto;}
  .topbar b{color:var(--ink);}
  .gear{background:var(--panel); border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:4px 9px; font-size:13px;}

  .stage{flex:1 1 auto; position:relative; display:flex; flex-direction:column; justify-content:space-between; padding:6px 10px 4px; min-height:0; overflow:hidden;}
  .enemy-row{display:flex; gap:8px; justify-content:center; align-items:flex-end; flex-wrap:wrap; flex:0 0 auto;}
  .enemy-card{position:relative; text-align:center;}
  .eimg{margin:0 auto; display:flex; align-items:center; justify-content:center; border-radius:13px; overflow:hidden; border:1px solid var(--line); box-shadow:0 6px 12px rgba(0,0,0,.5); max-height:48vh;}
  .eimg img{width:100%; height:100%; object-fit:cover; display:block;}
  .enemy-card.dead{opacity:.28; filter:grayscale(1);}
  .enemy-card.targetable .eimg{outline:3px dashed var(--warn); outline-offset:2px; cursor:pointer; animation:tpulse 1s infinite;}
  @keyframes tpulse{50%{outline-color:#fff;}}
  .ename{font-size:10px; font-weight:700; margin-top:2px; line-height:1.1;}
  .ebar{height:7px; border-radius:5px; background:#0008; border:1px solid var(--line); overflow:hidden; margin:2px auto 0;}
  .ebar i{display:block; height:100%;} .ebar.hp i{background:linear-gradient(90deg,#f87171,#ef4444);}
  .echg{height:4px; border-radius:3px; background:#0008; overflow:hidden; margin:2px auto 0;} .echg i{display:block; height:100%; background:linear-gradient(90deg,#fb7185,#e11d48);}
  .eattr{font-size:9px; padding:1px 6px; border-radius:99px; font-weight:700; border:1px solid; display:inline-block; margin-top:2px;}
  .ailments{display:flex; gap:3px; justify-content:center; flex-wrap:wrap; margin-top:2px; min-height:13px;}
  .ail{font-size:10px; padding:0 5px; border-radius:6px; background:#0009; border:1px solid var(--line); line-height:1.4;}
  .efx{position:absolute; left:50%; top:0; transform:translateX(-50%); font-weight:900; pointer-events:none; animation:dmgFloat .9s ease-out forwards; white-space:nowrap; text-shadow:0 2px 6px #000;}
  .efx.crit{color:var(--warn);} .efx.norm{color:#fff;} .efx.dot{color:#a3e635; font-size:15px;}
  .enemy-card.hitflash .eimg{animation:hitflash .3s;}

  .mid{flex:1 1 auto; position:relative; min-height:10px;}
  .combo-badge{position:absolute; right:8px; top:4px; font-size:11px; color:var(--warn); font-weight:700; text-shadow:0 1px 3px #000;}
  .combo-badge b{font-size:20px;}

  .panel{flex:0 0 auto; background:var(--panel); border:1px solid var(--line); border-radius:14px 14px 0 0; padding:9px 12px 13px; box-shadow:0 -6px 18px #0006;}
  .party{display:grid; grid-template-columns:repeat(4,1fr); gap:5px; margin-bottom:9px;}
  .ally-card{background:#161f30; border:1px solid var(--line); border-radius:9px; padding:5px 4px 4px; text-align:center; position:relative; transition:.1s;}
  .ally-card.active{border-color:var(--warn); box-shadow:0 0 0 2px var(--warn); background:#26210f;}
  .ally-card.downed{opacity:.42; filter:grayscale(1);}
  .ac-emoji{font-size:18px; line-height:1.1;} .ac-name{font-size:10px; font-weight:700; display:block;} .ac-role{font-size:8px; color:var(--sub); margin-bottom:1px;}
  .ac-bar{height:5px; border-radius:3px; background:#0007; margin-top:2px; overflow:hidden;} .ac-bar i{display:block; height:100%;}
  .ac-bar.hp i{background:linear-gradient(90deg,#34d399,#10b981);} .ac-bar.mp i{background:linear-gradient(90deg,#7dd3fc,#38bdf8);} .ac-bar.atb i{background:linear-gradient(90deg,#c4b5fd,#8b5cf6);}
  .ac-mp{font-size:8px; color:var(--mp); margin-top:2px;}
  .ac-shield{position:absolute; right:2px; top:1px; font-size:9px; line-height:1; max-width:88%; text-align:right; word-break:break-all;}
  .ac-down{position:absolute; inset:0; display:none; align-items:center; justify-content:center; font-size:24px;} .ally-card.downed .ac-down{display:flex;}
  .ac-fx{position:absolute; left:50%; top:-4px; transform:translateX(-50%); font-size:15px; font-weight:900; pointer-events:none; animation:dmgFloat .9s ease-out forwards; white-space:nowrap;}
  .ac-fx.heal{color:var(--good);} .ac-fx.hit{color:var(--bad);} .ally-card.hitflash{animation:hitflash .3s;}

  .phase-hint{font-size:12px; color:var(--sub); text-align:center; min-height:16px; margin-bottom:7px;} .phase-hint b{color:var(--ink);}
  .cmd-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:7px;}
  .cmd{display:flex; flex-direction:column; align-items:center; gap:2px; justify-content:center; padding:11px 4px; border-radius:11px; background:#222d45; border:1px solid var(--line); color:var(--ink); font-size:14px; font-weight:700; transition:transform .06s;}
  .cmd:active{transform:scale(.95);} .cmd .ico{font-size:19px;} .cmd .sub{font-size:8px; color:var(--sub); font-weight:400;}
  .cmd.atk{background:linear-gradient(180deg,#3b2a55,#2a1f40); border-color:#6d28d9;}
  .cmd.def{background:linear-gradient(180deg,#1e3a4f,#13283a); border-color:#0e7490;}
  .cmd.skill{background:linear-gradient(180deg,#143a2e,#0e2a22); border-color:#0f766e;}
  .cmd.item{background:linear-gradient(180deg,#3a2a14,#2a1f0e); border-color:#b45309;}
  .cmd:disabled{opacity:.35; filter:grayscale(.5);}
  .list{display:grid; gap:7px;}
  .skill-scroll{max-height:42vh; overflow-y:auto; padding-right:2px; -webkit-overflow-scrolling:touch;}
  .li{display:flex; align-items:center; gap:10px; padding:11px; border-radius:11px; background:#1d2a3f; border:1px solid var(--line); color:var(--ink); text-align:left;}
  .li:active{transform:scale(.98);} .li .ii{font-size:22px;} .li .nn{font-weight:700; font-size:15px;} .li .dd{font-size:11px; color:var(--sub);}
  .li .badge{margin-left:auto; font-size:10px; padding:3px 8px; border-radius:99px; white-space:nowrap; text-align:center; line-height:1.3;}
  .badge.q{background:#3b2a55; color:#d8b4fe; border:1px solid #6d28d9;} .badge.free{background:#13283a; color:#7dd3fc; border:1px solid #0e7490;}
  .badge.mp{background:#0c2a3a; color:#38bdf8; border:1px solid #0284c7;} .badge.aoe{background:#3a1c1c; color:#fca5a5; border:1px solid #b91c1c;}
  .li:disabled{opacity:.4; filter:grayscale(.6);}
  .back-btn{margin-top:2px; width:100%; padding:10px; border-radius:11px; background:#222d45; border:1px solid var(--line); color:var(--sub); font-size:14px;}
  .li.dis{opacity:.4; filter:grayscale(.6);}
  .lp-hint{text-align:center; font-size:10px; color:var(--sub); opacity:.6; margin-top:7px;}
  .info-modal{position:absolute; inset:0; z-index:50; background:rgba(4,7,14,.74); display:none; align-items:center; justify-content:center; padding:24px;}
  .info-modal.show{display:flex;}
  .info-card{background:var(--panel); border:1px solid var(--warn); border-radius:16px; padding:18px 18px 14px; max-width:340px; width:100%; box-shadow:0 12px 40px #000a; animation:savorPop .2s ease-out;}
  .info-ttl{font-size:18px; font-weight:800; margin-bottom:8px;}
  .info-fl{font-size:13px; color:var(--warn); font-style:italic; margin-bottom:10px; line-height:1.5;}
  .info-ef{font-size:14px; color:var(--ink); line-height:1.6; background:#0c1220; border:1px solid var(--line); border-radius:11px; padding:11px;}
  .info-close{text-align:center; font-size:11px; color:var(--sub); margin-top:11px;}

  .qoverlay{position:absolute; inset:0; z-index:30; background:linear-gradient(160deg,#0c1326,#070a14); display:none; flex-direction:column; padding:14px;}
  .qoverlay.show{display:flex;}
  .qctx{font-size:12px; color:var(--sub); text-align:center; margin-bottom:8px;} .qctx b{color:var(--ink);}
  .qq{font-size:21px; font-weight:800; text-align:center; line-height:1.5; padding:6px 4px;}
  .qimg{flex:1 1 auto; min-height:60px; margin:10px 0; border:2px dashed var(--line); border-radius:14px; display:flex; align-items:center; justify-content:center; color:var(--sub); font-size:13px; background:#ffffff05;}
  .tiles{display:grid; grid-template-columns:1fr 1fr; gap:9px;}
  .tile{display:flex; align-items:center; gap:9px; padding:16px 12px; border-radius:12px; color:#fff; font-size:16px; font-weight:700; text-align:left; border:3px solid transparent; text-shadow:0 1px 2px #0007;}
  .tile:active{transform:scale(.97);} .tile .shape{font-size:18px;} .tile.ok{border-color:#fff; box-shadow:0 0 0 3px var(--good);} .tile.ng{opacity:.45;}
  .typewrap{display:flex; gap:8px;} .typewrap input{flex:1; padding:15px; font-size:20px; border-radius:12px; background:#0c1220; border:1px solid var(--line); color:var(--ink); font-family:"Courier New",monospace; text-align:center;}
  .typewrap button{padding:0 20px; border-radius:12px; background:#6d28d9; color:#fff; border:none; font-size:17px; font-weight:700;}
  .qfeed{flex:0 0 auto; margin-top:10px;} .qfeed .desc{font-size:14px; color:var(--ink); background:#0c1220; border:1px solid var(--line); border-radius:11px; padding:11px; line-height:1.55;}
  .qfeed .next{width:100%; margin-top:9px; padding:13px; border-radius:11px; background:#6d28d9; color:#fff; border:none; font-size:16px; font-weight:700;}
  .qfeed .wrongttl{color:var(--bad); font-weight:800; text-align:center; margin-bottom:6px; font-size:16px;}

  .dmg{position:absolute; left:50%; top:14%; transform:translateX(-50%); font-size:30px; font-weight:900; color:#fff; pointer-events:none; animation:dmgFloat .9s ease-out forwards;}
  @keyframes dmgFloat{0%{opacity:0; transform:translate(-50%,8px) scale(.6);}20%{opacity:1; transform:translate(-50%,-4px) scale(1.1);}100%{opacity:0; transform:translate(-50%,-40px) scale(1);}}
  .shake{animation:shake .28s;} @keyframes shake{0%,100%{transform:translate(0,0);}20%{transform:translate(-7px,3px);}40%{transform:translate(6px,-3px);}60%{transform:translate(-5px,2px);}80%{transform:translate(4px,-2px);}}
  .hitflash{animation:hitflash .3s;} @keyframes hitflash{0%,100%{filter:none;}40%{filter:brightness(2.2) drop-shadow(0 0 14px #fff);}}
  .particle{position:absolute; width:8px; height:8px; border-radius:50%; pointer-events:none;}
  .savor-banner{position:absolute; left:0; right:0; top:24%; text-align:center; pointer-events:none; z-index:5;}
  .savor-banner .big{display:inline-block; font-size:24px; font-weight:900; padding:7px 16px; border-radius:14px; background:rgba(10,14,28,.82); border:1px solid var(--warn); color:var(--warn); text-shadow:0 2px 8px #000; animation:savorPop .35s ease-out;}
  .savor-banner small{font-size:13px; color:#fff;}
  @keyframes savorPop{from{transform:scale(.6); opacity:0;}to{transform:scale(1); opacity:1;}}
  .flash-good{animation:fg .25s;} @keyframes fg{0%{background:rgba(52,211,153,.10);}100%{background:transparent;}}

  .tuner{position:absolute; inset:0; background:rgba(5,8,16,.95); z-index:40; padding:16px; overflow:auto; display:none;}
  .tuner.show{display:block;} .tuner h2{margin:4px 0 12px; font-size:17px;} .tuner h3{font-size:13px; color:var(--warn); margin:16px 0 8px;}
  .trow{margin-bottom:13px;} .trow label{font-size:13px; color:var(--sub); display:flex; justify-content:space-between;} .trow label b{color:var(--ink);}
  .trow input[type=range]{width:100%; margin-top:5px;} .trow.chk{display:flex; align-items:center; gap:8px;} .trow.chk label{flex:1; justify-content:flex-start;}
  .killgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .tnote{font-size:11px; color:var(--sub); line-height:1.5; margin-bottom:12px;}
  .tclose{width:100%; padding:13px; border-radius:11px; background:#6d28d9; color:#fff; border:none; font-size:16px; font-weight:700; margin-top:6px;}
  .gearbig{background:#10162a; border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:14px;}

  /* ===== §M 体験版の画面(タイトル/マップ/クリア) ===== */
  .screen{position:absolute; inset:0; z-index:60; background:linear-gradient(160deg,#0c1326,#070a14); display:none; flex-direction:column; padding:22px 18px; overflow-y:auto;}
  .screen.show{display:flex;}
  .scr-inner{margin:auto 0; width:100%; max-width:440px; align-self:center; text-align:center;}
  .title-inner{display:flex; flex-direction:column; align-items:center; gap:10px;}
  .title-emoji{font-size:30px; letter-spacing:4px;}
  .game-title{font-size:40px; font-weight:900; margin:2px 0 0; letter-spacing:2px; background:linear-gradient(90deg,#f87171,#fbbf24,#34d399,#60a5fa); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .game-sub{font-size:14px; color:var(--warn); font-weight:700; margin-bottom:4px;}
  .title-lead{font-size:14px; color:var(--sub); line-height:1.7; margin:6px 0 14px;}
  .title-note{font-size:12px; color:var(--sub); opacity:.8; margin-top:14px; line-height:1.6;}
  .scr-ttl{font-size:24px; font-weight:900; margin:6px 0 4px;}
  .scr-sub{font-size:14px; color:var(--sub); line-height:1.6; margin-bottom:10px;}
  .big-emoji{font-size:54px; line-height:1; margin-bottom:6px;}
  .scr-btn{display:block; width:100%; max-width:320px; margin:9px auto 0; padding:13px; border-radius:12px; background:#222d45; border:1px solid var(--line); color:var(--ink); font-size:15px; font-weight:700;}
  .scr-btn.primary{background:linear-gradient(180deg,#3b2a55,#2a1f40); border-color:#6d28d9;}
  .scr-btn.big{font-size:18px; padding:16px;}
  .scr-btn:active{transform:scale(.97);}
  .scr-btns{margin-top:16px;}
  /* マップ */
  .map-list{display:grid; gap:11px; margin-top:8px;}
  .stage-card{display:flex; align-items:center; gap:13px; text-align:left; padding:13px 15px; border-radius:14px; background:#161f30; border:1px solid var(--line); color:var(--ink);}
  .stage-card:active{transform:scale(.985);}
  .stage-card.cleared{border-color:var(--good); background:#10241c;}
  .stage-card.locked{opacity:.55; filter:grayscale(.6);}
  .stage-card .sc-emoji{font-size:30px; flex:0 0 auto; width:38px; text-align:center;}
  .stage-card .sc-mid{flex:1 1 auto; min-width:0;}
  .stage-card .sc-name{font-size:17px; font-weight:800; line-height:1.2;}
  .stage-card .sc-theme{font-size:11px; color:var(--sub); margin-top:2px;}
  .stage-card .sc-flag{flex:0 0 auto; font-size:12px; font-weight:800; color:var(--warn); white-space:nowrap;}
  .stage-card.cleared .sc-flag{color:var(--good);}
  .stage-card.locked .sc-flag{color:var(--sub);}
  /* ドロップ */
  .drop-card{margin:14px auto 0; max-width:340px; background:#10162a; border:1px solid var(--line); border-radius:14px; padding:14px;}
  .drop-label{font-size:13px; color:var(--sub); margin-bottom:8px;}
  .drop-name{display:inline-block; font-size:17px; font-weight:800; padding:6px 14px; border-radius:99px; border:1.5px solid; margin-bottom:8px;}
  .drop-note{font-size:11px; color:var(--sub); line-height:1.5;}
  /* ホーム */
  .home-party{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:14px 0 12px;}
  .home-card{background:#161f30; border:1px solid var(--line); border-radius:12px; padding:10px 4px 8px; text-align:center;}
  .home-card .hc-emoji{font-size:24px; line-height:1;}
  .home-card .hc-name{font-size:12px; font-weight:800; margin-top:2px;}

<script>
/* ===================== §1 設定 ===================== */
const cfg = { chargeSec:4.5, savorSec:1.3, actionSec:0.8, enemyIntervalSec:9.0, missDropPct:30, freezeOnThink:true, mpPerCorrect:12 };
function lerp(a,b,t){ return a+(b-a)*t; }
function onGear(v){ const t=(+v)/100; gearV.textContent=v;
  cfg.chargeSec=+lerp(4.5,1.4,t).toFixed(2); cfg.enemyIntervalSec=+lerp(9.0,4.0,t).toFixed(2);
  charge.value=cfg.chargeSec; chargeV.textContent=cfg.chargeSec.toFixed(1);
  enemyInt.value=cfg.enemyIntervalSec; enemyV.textContent=cfg.enemyIntervalSec.toFixed(1); }
let killers = { physics:1.0, chemistry:1.0, biology:1.0, earth:1.0 };   // ★属性キラー=一旦保留(全1.0=1倍/無効)。値を上げれば再有効化。killer()でfdmgに乗る。
let skillLevel = 1;   // ★装備で決まる想定のスキルレベル(1-3)。プロトでは調整パネルで操作。
const fmt = n => Math.round(n).toLocaleString();
const ri  = n => Math.floor(Math.random()*n);

/* ===================== §2 教科(属性)と問題 ===================== */
const SUBJECTS = { physics:{jp:'物理',emoji:'⚙️',color:'#60a5fa'}, chemistry:{jp:'化学',emoji:'⚗️',color:'#34d399'},
  biology:{jp:'生物',emoji:'🌿',color:'#a3e635'}, earth:{jp:'地学',emoji:'🪨',color:'#fbbf24'} };
const QUESTIONS = [
  { s:'chemistry', type:'typing', q:"「水素分子」の化学式を書こう", answer:"H2", accept:["h2"], desc:"水素原子2個でできた、最も軽い無色の気体。" },
  { s:'chemistry', type:'typing', q:"「水素イオン」の化学式を書こう", answer:"H+", accept:["h+"], desc:"水素原子が電子を1個失った陽イオン。酸性の正体。" },
  { s:'chemistry', type:'choice', q:"点火時に開くねじは？", choices:["空気調節ねじ","ガス調節ねじ","元栓","コック"], answer:1, desc:"元栓・コックを開けた後、マッチの火を近づけながらガス調節ねじを開けて点火する。" },
  { s:'chemistry', type:'choice', q:"1種類に分かれる変化は？", choices:["還元","中和","分解","化合"], answer:2, desc:"1種類の物質が複数に分かれる変化が分解。加熱や電流によって起こる。" },
  { s:'chemistry', type:'choice', q:"固体の説明として正しいものはどれ？", choices:["形も体積もほぼ決まっている","形は決まらず体積も決まらない","入れ物いっぱいに広がる","必ず透明である"], answer:0, desc:"固体は形と体積がほぼ決まっている状態です。" },
  { s:'chemistry', type:'typing', q:"「酸素分子」の化学式を書こう", answer:"O2", accept:["o2"], desc:"酸素原子2個でできた気体。ものを燃やすはたらきがある。" },
  { s:'chemistry', type:'typing', q:"「ナトリウムイオン」の化学式を書こう", answer:"Na+", accept:["na+"], desc:"ナトリウム原子が電子1個を失った陽イオン。" },
  { s:'chemistry', type:'choice', q:"炎を青くする操作は？", choices:["ガス調節ねじを閉じる","元栓を閉じる","空気調節ねじを開けて空気を増やす","水をかける"], answer:2, desc:"オレンジの炎は空気（酸素）不足。空気調節ねじを開けて空気を増やすと完全燃焼し青い炎になる。" },
  { s:'chemistry', type:'choice', q:"物質が酸素と結びつく化学変化を何というか。", choices:["還元","分解","蒸発","酸化"], answer:3, desc:"物質が酸素と結びつく変化を酸化、酸化物が酸素をうばわれる変化を還元という。" },
  { s:'chemistry', type:'choice', q:"水のような液体の説明として正しいものはどれ？", choices:["形も体積も決まっている","入れ物に合わせて形が変わる","必ず空気中に広がる","つかんでも形がくずれない"], answer:1, desc:"液体は体積はほぼ決まっていますが、形は入れ物に合わせて変わります。" },
  { s:'chemistry', type:'typing', q:"「窒素分子」の化学式を書こう", answer:"N2", accept:["n2"], desc:"空気の約8割をしめる気体。窒素原子2個でできる。" },
  { s:'chemistry', type:'typing', q:"「カリウムイオン」の化学式を書こう", answer:"K+", accept:["k+"], desc:"カリウム原子が電子1個を失った陽イオン。" },
  { s:'chemistry', type:'choice', q:"試験管に入れた液体を加熱するとき、正しい操作はどれか？", choices:["口を自分に向ける","一点だけを強く熱し続ける","試験管の口を人のいない方へ向ける","液体を満杯まで入れる"], answer:2, desc:"突沸して中身が飛び出す危険があるため、口は人のいない方向へ向ける。" },
  { s:'chemistry', type:'choice', q:"酸化のうち、熱や光を出しながら激しく進むものを何というか。", choices:["燃焼","還元","蒸留","溶解"], answer:0, desc:"熱や光を出す激しい酸化を燃焼という。木炭やマグネシウムの燃焼など。" },
  { s:'chemistry', type:'choice', q:"気体の説明として正しいものはどれ？", choices:["形だけ決まっている","体積だけ決まっている","入れ物いっぱいに広がる","必ず目で見える"], answer:2, desc:"気体は形も体積も決まらず、入れ物いっぱいに広がります。" },
  { s:'chemistry', type:'typing', q:"「ヘリウム」の化学式を書こう", answer:"He", accept:["he"], desc:"原子1個で安定している気体（単原子分子）。風船に使われることがあり、空気より軽い。" },
  { s:'chemistry', type:'typing', q:"「カルシウムイオン」の化学式を書こう", answer:"Ca2+", accept:["ca2+"], desc:"カルシウム原子が電子2個を失った陽イオン。塩化カルシウムなどにふくまれる。" },
  { s:'chemistry', type:'choice', q:"薬品のにおいを確認するときの正しい方法はどれか？", choices:["鼻を直接つけて深く吸う","手であおいでかぐ","加熱してからかぐ","容器を振ってからかぐ"], answer:1, desc:"有害な気体もあるため、手であおいで少量を確認する。" },
  { s:'chemistry', type:'choice', q:"酸化物が酸素をうばわれる化学変化を何というか。", choices:["燃焼","還元","酸化","化合"], answer:1, desc:"酸化銅が炭素によって酸素をうばわれ銅になるような変化が還元。酸化と還元は同時に起こる。" },

  { s:'chemistry', type:'typing', q:"「塩素分子」の化学式を書こう", answer:"Cl2", accept:["cl2"], desc:"黄緑色で刺激臭のある有毒な気体。塩素原子2個。" },
  { s:'chemistry', type:'typing', q:"「マグネシウムイオン」の化学式を書こう", answer:"Mg2+", accept:["mg2+"], desc:"マグネシウム原子が電子2個を失った陽イオン。金属原子は電子を失って陽イオンになりやすい。" },
  { s:'chemistry', type:'choice', q:"液体を加熱する前に沸騰石を入れる理由はどれか？", choices:["早く沸騰させるため","急な沸騰（突沸）を防ぐため","色をつけるため","においを消すため"], answer:1, desc:"沸騰石は突沸を防ぎ、おだやかに沸騰させるために入れる。" },
  { s:'chemistry', type:'choice', q:"結びついて1つになる変化は？", choices:["還元","蒸発","化合","分解"], answer:2, desc:"鉄と硫黄が結びついて硫化鉄ができるように、結びついて別の物質ができる変化を化合という。" },
  { s:'chemistry', type:'choice', q:"水が氷になる変化を何という？", choices:["凝固","融解","蒸発","昇華"], answer:0, desc:"液体が固体になる変化を凝固といいます。" },
  { s:'chemistry', type:'typing', q:"「水分子」の化学式を書こう", answer:"H2O", accept:["h2o"], desc:"水素2・酸素1からできる。すべての生物に不可欠。" },
  { s:'chemistry', type:'typing', q:"「亜鉛イオン」の化学式を書こう", answer:"Zn2+", accept:["zn2+"], desc:"亜鉛原子が電子2個を失った陽イオン。酸と反応すると水溶液中でZn2+になる。" },

  { s:'chemistry', type:'typing', q:"「銅イオン」の化学式を書こう", answer:"Cu2+", accept:["cu2+"], desc:"水溶液中で青色を示す陽イオン。塩化銅や硫酸銅の水溶液で見られる。" },
  { s:'chemistry', type:'choice', q:"メスシリンダーで体積をはかるとき、目盛りの読み方はどれか？", choices:["上から見下ろして読む","液面の最も高い所を読む","液面の最も低い所を真横から読む","斜め上から読む"], answer:2, desc:"目の高さを液面に合わせ、へこんだ最下部を真横から読む。" },

  { s:'physics', type:'choice', q:"地球が物体を引く力を何という？", choices:["重力","摩擦力","弾性力","磁力"], answer:0, desc:"地球が物体を地球の中心へ向かって引く力を重力という。" },
  { s:'physics', type:'choice', q:"電圧の単位はどれ？", choices:["V","A","N","J"], answer:0, desc:"電圧の単位はボルトで、記号はVで表す。" },
  { s:'physics', type:'choice', q:"速さ3m/sで10秒進むと、進む距離は何m？", choices:["3m","10m","13m","30m"], answer:3, desc:"距離=速さ×時間なので、3m/s×10s=30m。" },
  { s:'physics', type:'choice', q:"光の向き変化の名は？", choices:["反射","屈折","凝結","放電"], answer:1, desc:"光が異なる物質へ進むとき、進む向きが変わる現象を屈折という。" },
  { s:'physics', type:'choice', q:"運動を妨げる力は？", choices:["摩擦力","浮力","重力","電力"], answer:0, desc:"接している面の間で、すべりをさまたげる向きにはたらく力を摩擦力という。" },
  { s:'physics', type:'choice', q:"抵抗の単位はどれ？", choices:["Ω","A","V","m/s"], answer:0, desc:"抵抗の単位はオームで、記号はΩで表す。" },
  { s:'physics', type:'choice', q:"距離60mを速さ12m/sで進むと、かかる時間は何秒？", choices:["5秒","12秒","48秒","720秒"], answer:0, desc:"時間=距離÷速さなので、60m÷12m/s=5s。" },
  { s:'physics', type:'choice', q:"凸レンズに平行な光を当てると、光は主にどこに集まる？", choices:["焦点","中心の真上","レンズの端","光源の後ろ"], answer:0, desc:"凸レンズに軸に平行な光を当てると、屈折して焦点に集まる。" },
  { s:'physics', type:'choice', q:"ばねやゴムがもとの形に戻ろうとしてはたらく力を何という？", choices:["弾性力","電流","圧力","音波"], answer:0, desc:"変形したばねやゴムがもとの形に戻ろうとしてはたらく力を弾性力という。" },
  { s:'physics', type:'choice', q:"直列回路で、各部分を流れる電流について正しいものはどれ？", choices:["どこでも同じ大きさ","電源から遠いほど大きい","枝分かれごとに必ず0になる","抵抗と無関係に変わる"], answer:0, desc:"直列回路では電流の通り道が1本なので、各部分を流れる電流は同じ大きさになる。" },
  { s:'physics', type:'choice', q:"一定の速さで一直線上を進む運動を何という？", choices:["等速直線運動","自由落下だけ","反射","放電"], answer:0, desc:"速さが一定で、向きも変わらず一直線上を進む運動を等速直線運動という。" },
  { s:'physics', type:'choice', q:"音は何によって生じる？", choices:["物体の振動","物体の色","光の反射","水の蒸発"], answer:0, desc:"音は物体が振動することで発生し、空気などを通して伝わる。" },
  { s:'physics', type:'choice', q:"水中の物体にはたらく、上向きの力を何という？", choices:["浮力","摩擦力","重力","電圧"], answer:0, desc:"水や空気などの中にある物体には、上向きの浮力がはたらく。" },
  { s:'physics', type:'choice', q:"並列回路で、各枝に加わる電圧について正しいものはどれ？", choices:["電源の電圧と等しい","枝が多いほど必ず0になる","電流と必ず同じ単位になる","抵抗があると電圧は存在しない"], answer:0, desc:"並列回路では、それぞれの枝に電源と同じ電圧が加わる。" },
  { s:'physics', type:'choice', q:"力の向きに物体を動かしたときの仕事を求める式はどれ？", choices:["仕事=力×移動距離","仕事=電圧÷電流","仕事=面積÷力","仕事=振動数×音速"], answer:0, desc:"力の向きに物体が動いたとき、仕事[J]=力[N]×移動距離[m]で求める。" },
  { s:'physics', type:'choice', q:"音の大きさに最も関係が深いものはどれ？", choices:["振幅","振動数","温度の単位","光の速さ"], answer:0, desc:"音の大きさは振動の幅である振幅が大きいほど大きくなる。" },
  { s:'physics', type:'choice', q:"磁石が鉄を引きつける力はどれ？", choices:["磁力","重力","浮力","圧力"], answer:0, desc:"磁石が鉄などを引きつけたり、磁石どうしが引き合ったり反発したりする力を磁力という。" },
  { s:'physics', type:'choice', q:"電力の単位はどれ？", choices:["W","A","V","Ω"], answer:0, desc:"電力の単位はワットで、記号はWで表す。電力は電気器具が1秒あたりに使う電気エネルギーの量を表す。" },
  { s:'physics', type:'choice', q:"10Nの力で物体を力の向きに2m動かした。仕事は何J？", choices:["5J","10J","20J","40J"], answer:2, desc:"仕事=力×移動距離なので、10N×2m=20J。" },
  { s:'physics', type:'choice', q:"音の高さに最も関係が深いものはどれ？", choices:["振動数","質量","面積","電圧"], answer:0, desc:"音の高さは1秒間の振動回数である振動数が多いほど高くなる。" },
  { s:'physics', type:'choice', q:"静止を続ける2力は？", choices:["2力がつり合っている","2力が同じ向きである","力がまったくない","重力だけが2倍になる"], answer:0, desc:"物体が静止し続ける場合、はたらく力がつり合っていることがある。2力のつり合いでは大きさが等しく向きが反対になる。" },
  { s:'physics', type:'choice', q:"電流が流れる導線のまわりにできるものはどれ？", choices:["磁界","真空","焦点","水圧"], answer:0, desc:"電流が流れる導線のまわりには磁界ができる。" },
  { s:'physics', type:'choice', q:"40Jの仕事を8秒で行ったときの仕事率は何W？", choices:["5W","8W","32W","320W"], answer:0, desc:"仕事率=仕事÷時間なので、40J÷8s=5W。" },
  { s:'physics', type:'choice', q:"真空中で音が伝わらない理由として正しいものはどれ？", choices:["音を伝える物質がないから","光がないから","温度が必ず0度だから","重力がないから"], answer:0, desc:"音は空気や水などの物質の振動として伝わるため、真空中では伝わらない。" },
  { s:'physics', type:'choice', q:"ばねののびと加えた力の関係として、範囲内で正しいものはどれ？", choices:["力が大きいほどのびは大きい","力が大きいほどのびは小さい","のびは力と無関係","力を加えると必ず縮む"], answer:0, desc:"ばねは限度内で、加えた力が大きいほどのびが大きくなる。" },
  { s:'physics', type:'choice', q:"電磁石を強くする方法として正しいものはどれ？", choices:["コイルの巻き数を増やす","電流を小さくする","鉄しんを必ず外す","導線を切る"], answer:0, desc:"電磁石は、コイルの巻き数を増やしたり電流を大きくしたりすると強くなる。" },
  { s:'physics', type:'choice', q:"道具を使っても、摩擦などを無視すると変わらない量はどれ？", choices:["必要な仕事の総量","必ず必要な力","必ず移動距離","物体の質量が0になること"], answer:0, desc:"滑車や斜面などを使うと力の大きさや動かす距離は変えられるが、摩擦を無視すると仕事の総量は変わらない。" },
  { s:'physics', type:'choice', q:"空気中の音の速さとして最も近い値はどれ？", choices:["約34m/s","約340m/s","約3400m/s","約30万km/s"], answer:1, desc:"中学理科では、空気中の音の速さをおよそ340m/sとして扱う。" },
  { s:'physics', type:'choice', q:"圧力を大きくする方法として正しいものはどれ？", choices:["同じ力で押す面積を小さくする","同じ力で押す面積を大きくする","力を0にする","物体の色を変える"], answer:0, desc:"圧力は力を面積で割った量なので、同じ力なら面積が小さいほど圧力は大きい。" },
  { s:'physics', type:'choice', q:"抵抗3Ωに6Vの電圧を加えると、流れる電流は何A？", choices:["0.5A","2A","3A","18A"], answer:1, desc:"オームの法則V=IRより、I=V÷R=6V÷3Ω=2A。" },
  { s:'physics', type:'choice', q:"等速の距離時間グラフは？", choices:["原点を通る直線","水平な直線だけ","ぎざぎざの線だけ","必ず円"], answer:0, desc:"速さが一定なら、進んだ距離は時間に比例するため、距離-時間グラフは直線になる。" },
  { s:'physics', type:'choice', q:"水面にうつった景色が見える主な理由はどれ？", choices:["水面で光が反射するから","水が音を吸収するから","水が電気を流すから","水が重力を消すから"], answer:0, desc:"水面で光が反射し、その反射した光が目に入るため景色が見える。" },
  { s:'physics', type:'choice', q:"大気の重さによって生じる圧力を何という？", choices:["大気圧","水圧","電圧","音圧"], answer:0, desc:"空気にも重さがあり、その重さによって大気圧が生じる。" },
  { s:'biology', type:'choice', q:"花のつくりで、花粉をつくる部分はどれか。", choices:["おしべ","めしべ","がく","花弁"], answer:0, desc:"おしべの先にあるやくで花粉がつくられます。めしべは受粉後に種子や果実に関係する部分です。" },
  { s:'biology', type:'choice', q:"だ液に含まれ、デンプンを分解する消化酵素はどれか。", choices:["アミラーゼ","ペプシン","ヘモグロビン","インスリン"], answer:0, desc:"だ液中のアミラーゼはデンプンを分解します。消化酵素は決まった物質にはたらく性質があります。" },
  { s:'biology', type:'choice', q:"細胞の中にあり、遺伝に関係する染色体を含む部分はどれか。", choices:["核","細胞膜","液胞","細胞壁"], answer:0, desc:"核には染色体があり、遺伝に関係する情報を含みます。多くの細胞で重要なはたらきを調節しています。" },
  { s:'biology', type:'choice', q:"植物のように、無機物から有機物をつくる生物を何というか。", choices:["生産者","消費者","分解者","捕食者"], answer:0, desc:"植物は光合成によって有機物をつくるため、生態系の生産者と呼ばれます。" },
  { s:'biology', type:'choice', q:"受粉とは、花粉がどこにつくことか。", choices:["めしべの柱頭","子房","胚珠","花弁"], answer:0, desc:"受粉は花粉がめしべの柱頭につくことです。その後、胚珠が種子になり、子房が果実になります。" },
  { s:'biology', type:'choice', q:"胃で主にタンパク質の消化に関わる消化酵素はどれか。", choices:["ペプシン","アミラーゼ","リパーゼ","胆汁"], answer:0, desc:"胃液に含まれるペプシンはタンパク質の消化に関わります。胆汁は消化酵素ではありません。" },
  { s:'biology', type:'choice', q:"植物細胞にあり、動物細胞にはふつう見られないつくりはどれか。", choices:["細胞壁","細胞膜","細胞質","核"], answer:0, desc:"植物細胞には細胞壁や葉緑体、大きな液胞が見られます。細胞膜、細胞質、核は動物細胞にも見られます。" },
  { s:'biology', type:'choice', q:"動物のように、ほかの生物を食べて生活する生物を何というか。", choices:["消費者","生産者","分解者","無機物"], answer:0, desc:"動物は植物やほかの動物を食べて有機物を得るため、消費者と呼ばれます。" },
  { s:'biology', type:'choice', q:"光合成で主にデンプンがつくられる場所はどこか。", choices:["葉緑体","細胞壁","根毛","道管"], answer:0, desc:"光合成は葉の細胞にある葉緑体で行われます。光を受けて二酸化炭素と水からデンプンなどをつくります。" },
  { s:'biology', type:'choice', q:"小腸の内側にある、養分の吸収面積を広げるつくりはどれか。", choices:["柔毛","肺胞","気孔","腎臓"], answer:0, desc:"小腸の内側には柔毛があり、表面積を広げて消化された養分を効率よく吸収します。" },
  { s:'biology', type:'choice', q:"1つの細胞からできている生物を何というか。", choices:["単細胞生物","多細胞生物","脊椎動物","被子植物"], answer:0, desc:"単細胞生物は1つの細胞だけで生命活動を行います。ゾウリムシやミカヅキモなどが例です。" },
  { s:'biology', type:'choice', q:"生物どうしの「食べる・食べられる」のつながりを何というか。", choices:["食物連鎖","細胞分裂","光合成","肺循環"], answer:0, desc:"食物連鎖は生物どうしの食べる・食べられる関係を表します。実際の自然界では多くの連鎖が網の目のようにつながります。" },
  { s:'biology', type:'choice', q:"植物の光合成で、材料として使われるものの組み合わせはどれか。", choices:["二酸化炭素と水","酸素とデンプン","窒素と酸素","水素と酸素"], answer:0, desc:"光合成では二酸化炭素と水を材料にしてデンプンなどをつくり、酸素を放出します。" },
  { s:'biology', type:'choice', q:"肺でガス交換をする小袋は？", choices:["肺胞","心房","柔毛","腎小体"], answer:0, desc:"肺胞は非常に薄い壁をもつ小さな袋で、まわりの毛細血管との間で気体の交換を行います。" },
  { s:'biology', type:'choice', q:"精子と卵が合体することを何というか。", choices:["受精","分裂","発芽","蒸散"], answer:0, desc:"受精は精子と卵が合体することです。受精によってできた細胞を受精卵といいます。" },
  { s:'biology', type:'choice', q:"落ち葉や死がいを分解する細菌や菌類などを何というか。", choices:["分解者","生産者","一次消費者","肉食動物"], answer:0, desc:"分解者は生物の死がいやふんなどの有機物を分解し、物質を自然界に戻すはたらきをします。" },
  { s:'biology', type:'choice', q:"植物の葉で、水蒸気が主に出入りする小さな穴を何というか。", choices:["気孔","維管束","根毛","胚珠"], answer:0, desc:"気孔は葉の表皮にある小さな穴で、蒸散や気体の出入りに関係します。" },
  { s:'biology', type:'choice', q:"血液中で酸素を運ぶはたらきが大きい成分はどれか。", choices:["赤血球","白血球","血小板","血しょう"], answer:0, desc:"赤血球にはヘモグロビンが含まれ、酸素と結びついて全身へ運びます。" },
  { s:'biology', type:'choice', q:"親と同じ形質の子が、受精をせずにできるふえ方はどれか。", choices:["無性生殖","有性生殖","受粉","減数分裂"], answer:0, desc:"無性生殖では受精をせずに新しい個体ができます。親と同じ形質になりやすいことが特徴です。" },
  { s:'biology', type:'choice', q:"食物連鎖のはじめに位置することが多い生物はどれか。", choices:["植物","肉食動物","分解者","大型の魚"], answer:0, desc:"多くの食物連鎖は、光合成で有機物をつくる植物から始まります。植物は生産者です。" },
  { s:'biology', type:'choice', q:"根から吸収した水や無機養分を運ぶ管はどれか。", choices:["道管","師管","気孔","子房"], answer:0, desc:"道管は根から吸収した水や無機養分を上へ運びます。師管は光合成でできた養分を運びます。" },
  { s:'biology', type:'choice', q:"背骨をもつ動物を何というか。", choices:["脊椎動物","無脊椎動物","節足動物","軟体動物"], answer:0, desc:"背骨をもつ動物を脊椎動物といいます。魚類、両生類、は虫類、鳥類、哺乳類が含まれます。" },
  { s:'biology', type:'choice', q:"核内で見やすいひも状のものは？", choices:["染色体","気孔","師管","柔毛"], answer:0, desc:"細胞分裂のとき、核の中の染色体が見えやすくなります。染色体には遺伝に関係する情報が含まれます。" },
  { s:'biology', type:'choice', q:"食物網とは何を表したものか。", choices:["複数の食物連鎖が網の目のようにつながった関係","一つの細胞のつくり","血液の流れ","花のつくり"], answer:0, desc:"自然界では生物が一種類だけを食べるとは限らないため、食物連鎖が複雑につながった食物網として考えます。" },
  { s:'biology', type:'choice', q:"胚珠が子房内にある植物は？", choices:["被子植物","裸子植物","シダ植物","コケ植物"], answer:0, desc:"被子植物は胚珠が子房に包まれている種子植物です。裸子植物は胚珠がむき出しです。" },
  { s:'biology', type:'choice', q:"心臓から全身へ血液を送り出す部屋はどれか。", choices:["左心室","右心室","左心房","右心房"], answer:0, desc:"左心室は酸素を多く含む血液を全身へ送り出します。心臓の中でも壁が厚い部屋です。" },
  { s:'biology', type:'choice', q:"植物細胞だけにあるつくりは？", choices:["核","細胞膜","細胞壁","細胞質"], answer:2, desc:"細胞壁・葉緑体・大きな液胞は植物の細胞に見られ、動物の細胞にはありません。細胞壁はからだを支えます。" },
  { s:'biology', type:'choice', q:"自然界で分解者が少なくなると起こりやすいことはどれか。", choices:["死がいや落ち葉が分解されにくくなる","光合成がすべて止まる","動物がすべて生産者になる","酸素が水に変わる"], answer:0, desc:"分解者は死がいや落ち葉を分解して物質の循環を支えます。少なくなると有機物が分解されにくくなります。" },
  { s:'biology', type:'choice', q:"単子葉類に多く見られる葉脈の特徴はどれか。", choices:["平行脈","網状脈","葉脈がない","輪状に広がる脈"], answer:0, desc:"単子葉類の葉脈は平行脈が多く、双子葉類は網状脈が多いです。" },
  { s:'biology', type:'choice', q:"全身から心臓へ戻った血液が最初に入る部屋はどれか。", choices:["右心房","右心室","左心房","左心室"], answer:0, desc:"全身をめぐった血液は大静脈を通って右心房に戻ります。その後、右心室から肺へ送られます。" },
  { s:'biology', type:'choice', q:"植物が光合成を行う、細胞内の緑色の粒を何というか。", choices:["葉緑体","核","液胞","細胞膜"], answer:0, desc:"葉緑体は緑色の色素(クロロフィル)をふくみ、光合成を行う場所です。" },
  { s:'biology', type:'choice', q:"外来種について正しい説明はどれか。", choices:["もともとその地域にいなかったが、人の活動などで入ってきた生物","必ず絶滅した生物","すべての地域にもともといる生物","光合成をしない植物"], answer:0, desc:"外来種はもともとその地域にいなかった生物が人の活動などで入ってきたものです。在来の生物に影響することがあります。" },
  { s:'biology', type:'choice', q:"ヨウ素液を使って調べる物質はどれか。", choices:["デンプン","酸素","タンパク質","二酸化炭素"], answer:0, desc:"ヨウ素液はデンプンがあると青紫色に変化します。光合成でデンプンができたかを調べる実験に使います。" },
  { s:'biology', type:'choice', q:"心臓と肺を往復する流れは？", choices:["肺循環","体循環","消化","反射"], answer:0, desc:"肺循環は心臓と肺の間をめぐる血液の流れです。全身をめぐる流れは体循環です。" },

let _lastQ=null;
function drawQuestion(subjects){ const cand=QUESTIONS.filter(q=>subjects.includes(q.s)); let pool=cand.filter(q=>q!==_lastQ); if(!pool.length)pool=cand.length?cand:QUESTIONS;
  const q=pool[Math.floor(Math.random()*pool.length)]; _lastQ=q; return q; }

// ★スキルレベル(v0.9): 装備で決まる想定(プロト=tunerのskillLevel 1-3で操作)。lvAxis でレベルの伸び方を指定:
//   'power'=効力UP&MP増 / 'dur'=効き時間UP&MP増 / 'eff'=効果そのままMP減 / 無指定=レベルなし(ふさわしくない技)。
//   run は L={lv,pow,dur} を受け取り、効力は ×L.pow、持続は ×L.dur。数値は全て仮(本番で調整)。
const LV_POW=[1,1.5,2.1], LV_DUR=[1,1.4,1.8], LV_MPUP=[1,1.4,1.85], LV_MPDN=[1,0.78,0.6];
function skLevelable(s){ return !!(s.lvAxis && s.lvAxis!=='none'); }
function _lvi(){ return Math.max(0,Math.min(2,skillLevel-1)); }
function skL(s){ if(!skLevelable(s)) return {lv:0,pow:1,dur:1}; const i=_lvi();
  return { lv:i+1, pow:(s.lvAxis==='power'?LV_POW[i]:1), dur:(s.lvAxis==='dur'?LV_DUR[i]:1) }; }
function skMp(s){ if(!skLevelable(s)) return s.mp; const i=_lvi(); return Math.round(s.mp*(s.lvAxis==='eff'?LV_MPDN[i]:LV_MPUP[i])); }
function skAxisHint(s){ return s.lvAxis==='power'?'レベルUPで効力UP・MP増':(s.lvAxis==='dur'?'レベルUPで効き時間UP・MP増':(s.lvAxis==='eff'?'レベルUPで効果そのまま・MP減':'レベルなし')); }

/* ===================== §4 状態 ===================== */
let encIdx=0, enemies=[], allies=[], combo=0, items={hpPotion:3,mpPotion:3};
let phase='charging', stateTimer=0, curQ=null, answered=false, pendingAction=null, activeAlly=null, _advancing=false, _lastEnemyActed=false;
function aliveEnemies(){ return enemies.filter(e=>e.alive); }
// curStatMul(メタ装備のステ倍率)とcurLoadout(役割別スキル)を反映して味方を作る。通常ステは sm=1 / loadout=既定。
function makeAllies(){ const sm=curStatMul||1; allies = ALLY_DEFS.map(d=>{
  const skills = (curLoadout&&curLoadout[d.id]) ? curLoadout[d.id].slice() : d.skills.slice();
  const acc = 1 + accPctFor(d.id)/100;   // ★装飾品=全コアステータス+%(2枠合算)
  const str=Math.round(d.str*sm*acc), int=Math.round(d.int*sm*acc), def=Math.round(d.def*sm*acc), hpMax=Math.round(d.hpMax*sm*acc), mpMax=Math.round(d.mpMax*sm*acc);
  return { ...d, skills, str, int, def, hpMax, mpMax, hp:hpMax, mp:mpMax, charge:0, downed:false,
    powerUp:0, weakBlade:false, shield:0, defending:false, endure:false, counter:false,
    haste:null, focus:null, amp:null, regen:null, atkBuff:null, reduce:null, statusResist:null, ail:{}, taunt:0, cover:0, thorns:null, fade:0, quickReady:false, _tossBonus:0 }; }); }
function clearAllyBuffs(a){ a.powerUp=0; a.weakBlade=false; a.shield=0; a.defending=false; a.endure=false; a.counter=false; a.haste=null; a.focus=null; a.amp=null; a.regen=null; a.atkBuff=null; a.reduce=null; a.statusResist=null; a.ail={}; a.taunt=0; a.cover=0; a.thorns=null; a.fade=0; a.quickReady=false; a._tossBonus=0; }
function curEncounters(){ return STAGES[curStage].encounters; }
function setEncounter(i){ const defs=curEncounters()[i] || curEncounters()[0]; const mul=STAGES[curStage].enemyMul||1;
  enemies = defs.map((ref,idx)=>{ const m=MONSTER_DB[ref]; const hp=Math.round(m.hp*mul);
    return { ...m, attrs:m.attrs.slice(), resist:(m.resist?Object.assign({},m.resist):null),
      hp:hp, hpMax:hp, def:Math.round((m.def||0)*Math.min(mul,1.5)), atk:Math.round(m.atk*mul),   // enemyMul=段階強化(defは割合なので伸びを抑える)
      charge:0, alive:true, idx:idx, ail:{}, spMeter:0 }; });
  buildEnemies(); }
let gameState='title';   // ★体験版の進行状態: 'title'|'map'|'battle'|'clear'|'complete'|'defeat'。battle以外はupdate()停止。
// 1ステージ分の戦闘を初期化(味方フル・第1ウェーブ)。難度cfgはstartStageで適用済み。
function startBattle(){ encIdx=0; setEncounter(0); makeAllies(); combo=0; items={hpPotion:3,mpPotion:3};
  phase='charging'; stateTimer=0; curQ=null; answered=false; pendingAction=null; activeAlly=null; _advancing=false; _lastEnemyActed=false;
  buildParty(); hideOverlay(); bumpCombo(); renderCommand(); }
function resetAll(){ startStage(curStage); }   // 「もう一度」＝今のステージをやり直す

/* ===================== §5 メインループ ===================== */
let last=performance.now();
function loop(now){ let dt=(now-last)/1000; last=now; if(dt>0.1)dt=0.1; update(dt); updateUI(); requestAnimationFrame(loop); }
const THINK=['command','skillmenu','itemmenu','targeting','question','miss'];
function update(dt){
  if(gameState!=='battle'||_advancing) return;   // 戦闘中のみ進める(タイトル/マップ/クリア画面では停止)。_advancing中(撃破→次ウェーブ待ち)も停止＝空コマンド/レース防止
  // 状態異常/バフは実時間tick(=charging/savor/enemyActの間だけ進む＝問題を解いてる/選んでる間は停止)。slow×毒の矛盾を避けるためdt依存。
  if(phase==='charging'||phase==='savor'||phase==='enemyAct') tickStatuses(dt);
  if(_advancing) return;   // tickStatusesの毒killで撃破された可能性→以降の遷移をスキップ
  const fillEnemy = (phase==='charging'||phase==='savor'||(THINK.includes(phase)&&!cfg.freezeOnThink));
  if(fillEnemy) enemies.forEach(e=>{ if(!e.alive)return; let rate=1;
    if(e.ail){ if(e.ail.sleep||e.ail.freeze||e.ail.timestop)rate=0; else{ if(e.ail.paralyze)rate=Math.min(rate,e.ail.paralyze.mul); if(e.ail.slow)rate=Math.min(rate,e.ail.slow.mul); } }
    e.charge += dt*100/cfg.enemyIntervalSec*rate; });
  if(phase==='charging'){
    allies.forEach(a=>{ if(a.quickReady&&!a.downed){ a.quickReady=false; a.charge=100; } });   // 先駆け: すぐ手番が回る
    allies.forEach(a=>{ if(!a.downed){ const hm=a.haste?a.haste.mul:1; a.charge += dt*100*a.spd*hm/cfg.chargeSec; } });
    const eReady = enemies.find(e=>e.alive && e.charge>=100);
    const ally = allies.find(a=>!a.downed && a.charge>=100);
    // 敵が連続2回動かない: 味方が手番待ちなら敵の2連を1回挟む(ハメ防止)。味方が居なければ敵は続けて動ける。
    if(eReady && !(ally && _lastEnemyActed)){ _lastEnemyActed=true; enemyAttack(eReady); return; }
    if(ally){ _lastEnemyActed=false; ally.charge=100; ally.defending=false; activeAlly=ally; phase='command'; renderCommand(); }   // defending=自分の次の手番で解除(残留しない)
  } else if(phase==='savor'){
    stateTimer-=dt; if(stateTimer<=0){ const er=enemies.find(e=>e.alive&&e.charge>=100); if(er){ _lastEnemyActed=true; enemyAttack(er); return; } phase='charging'; renderCommand(); }
  } else if(phase==='enemyAct'){
    stateTimer-=dt; if(stateTimer<=0){ phase='charging'; renderCommand(); }
  }
}

/* ===================== §6 コマンド ===================== */

}

/* ===================== §7 対象選択 ===================== */
function beginAction(act){ act.targetIdx=null; pendingAction=act;
  if(act.scope==='enemy'){ const al=aliveEnemies();
    if(al.length===0){ afterAction(activeAlly?activeAlly.name+'は空を切った':'…'); return; }   // 敵ゼロ保険(毒で全滅直後にコマンドへ流入した場合)
    if(al.length>1){ phase='targeting'; renderTargeting(); return; }
    act.targetIdx = al[0].idx; }
  proceedAction(); }
function renderTargeting(){ document.getElementById('phaseHint').innerHTML='🎯 <b>だれを狙う？</b>（敵をタップ）';
  document.getElementById('cmdArea').innerHTML=`<button class="back-btn" onclick="backToCommand()">◀ やめる</button>`; }
function onPickTarget(idx){ if(phase!=='targeting')return; const e=enemies[idx]; if(!e||!e.alive)return; pendingAction.targetIdx=idx; proceedAction(); }
function proceedAction(){ const act=pendingAction, c=activeAlly;
  if(act.needsQuiz){ startQuestion(); }
  else { if(act.kind==='skill'){ c.mp-=skMp(act.skill); act.skill.run(c, enemies[act.targetIdx], skL(act.skill)); } afterAction(c.name+'は'+(act.skill?act.skill.name:'行動')+'を使った'); checkWin(); } }

/* ===================== §8 全画面出題（カフート式・1ソルバー） ===================== */
const TILE=[{c:'#e0413e',s:'▲'},{c:'#1368ce',s:'◆'},{c:'#d89e00',s:'●'},{c:'#26890c',s:'■'}];
function shuffleOrder(n){ const a=[]; for(let i=0;i<n;i++)a.push(i); for(let i=n-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }   // 選択肢の表示順シャッフル(Fisher-Yates)
function questionSubjects(){ const act=pendingAction;
  if(act.scope==='enemy' && act.targetIdx!=null) return enemies[act.targetIdx].attrs;
  const u=new Set(); aliveEnemies().forEach(e=>e.attrs.forEach(s=>u.add(s))); return u.size?[...u]:['chemistry']; }
function startQuestion(){ phase='question'; answered=false; curQ=drawQuestion(questionSubjects()); renderQuestionOverlay(); }
function renderQuestionOverlay(){ const q=curQ, subj=SUBJECTS[q.s], a=activeAlly, act=pendingAction;
  let ctx, tgt = act.targetIdx!=null ? enemies[act.targetIdx] : null;
  if(act.kind==='attack') ctx=`<b>${a.emoji}${a.name}</b> → ${tgt?tgt.name:'敵'}　｜　${subj.emoji}<b>${subj.jp}</b>の問題`;
  else if(act.kind==='skill') ctx=`<b>${act.skill.emoji}${act.skill.name}</b>${act.scope==='allEnemies'?'(全体)':(tgt?'→'+tgt.name:'')}（正解で発動）　｜　${subj.emoji}${subj.jp}`;
  else ctx=`<b>${act.item.emoji}${act.item.name}</b>（正解で行動消費30%）　｜　${subj.emoji}${subj.jp}`;
  document.getElementById('qctx').innerHTML=ctx;
  document.getElementById('qq').textContent=q.q;
  document.getElementById('qimg').innerHTML=`<div style="text-align:center;"><div style="font-size:62px;line-height:1;">${subj.emoji}</div><div style="font-size:13px;color:${subj.color};margin-top:8px;font-weight:700;">${subj.jp}</div></div>`;
  document.getElementById('qfeed').innerHTML='';
  const ans=document.getElementById('qans');
  if(q.type==='choice'){ const order=shuffleOrder(q.choices.length);   // ★表示順をシャッフル(正解が常に先頭にならないように)。data-i/onclickは元のindexのまま＝判定はそのまま正しい。
    ans.innerHTML=`<div class="tiles">`+order.map((oi,pos)=>{ const t=TILE[pos%4];
      return `<button class="tile" data-i="${oi}" style="background:${t.c};" onclick="answerChoice(${oi})"><span class="shape">${t.s}</span>${q.choices[oi]}</button>`; }).join('')+`</div>`; }
  else ans.innerHTML=`<div class="typewrap"><input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="答えを入力" onkeydown="if(event.key==='Enter')answerTyping()"><button onclick="answerTyping()">決定</button></div>`;
  document.getElementById('qOverlay').classList.add('show');
  if(q.type==='typing') setTimeout(()=>{ const el=document.getElementById('ans'); if(el)el.focus(); },40); }
function hideOverlay(){ document.getElementById('qOverlay').classList.remove('show'); }
function answerChoice(i){ if(phase!=='question'||answered)return; answered=true;
  document.querySelectorAll('.tile').forEach(b=>{ const bi=+b.dataset.i; if(bi===curQ.answer)b.classList.add('ok'); else b.classList.add('ng'); b.disabled=true; });
  setTimeout(()=>resolveAnswer(i===curQ.answer),460); }
function answerTyping(){ if(phase!=='question'||answered)return; const el=document.getElementById('ans'); if(!el)return;
  const norm=s=>(s||'').trim().toLowerCase().replace(/\s+/g,''); const ok=norm(el.value)===norm(curQ.answer)||(curQ.accept||[]).map(norm).includes(norm(el.value));
  answered=true; el.disabled=true; resolveAnswer(ok); }
function resolveAnswer(correct){ const act=pendingAction, c=activeAlly; if(!act)return;
  if(correct){ combo++; bumpCombo(); hideOverlay();
    // ★MP回復は『通常攻撃の正解』だけ＝スキルは純コスト→低コスト状態異常(まひ等)の永続化を防止(レビュー残対応)
    if(act.kind==='attack'){ if(c) c.mp=Math.min(c.mpMax,c.mp+cfg.mpPerCorrect); doAttack(c, enemies[act.targetIdx]); if(c) c.charge=0; }
    else if(act.kind==='skill'){ c.mp-=skMp(act.skill); act.skill.run(c, enemies[act.targetIdx], skL(act.skill)); c.charge=c._tossBonus||0; c._tossBonus=0; }   // 突進など「自ゲージ+」は手番後の0リセットの代わりに少し残す
    else if(act.kind==='item'){ useItem(act.item,true,c); }
    document.getElementById('phaseHint').textContent='COMBO '+combo+'！';
    pendingAction=null; activeAlly=null; phase='savor'; stateTimer=cfg.savorSec; renderCommand(); checkWin();
  } else { combo=0; bumpCombo();
    if(act.kind==='item'){ useItem(act.item,false,c); } else if(c){ c.charge=Math.max(0,c.charge-cfg.missDropPct); }   // 誤答=行動ゲージ−%だけ・HPは無罰(不可侵)
    document.querySelectorAll('.tile').forEach(b=>b.disabled=true);
    document.getElementById('qfeed').innerHTML=`<div class="wrongttl">おしい！ 正解は「${answerLabel(curQ)}」</div>
      <div class="desc">💡 ${curQ.desc}</div><button class="next" onclick="afterMiss()">つぎへ ▶</button>`;
    document.getElementById('qctx').innerHTML='まちがえても大丈夫。HPは減りません。'; phase='miss'; } }
function afterMiss(){ hideOverlay(); pendingAction=null; activeAlly=null; phase='charging'; renderCommand(); }
function useItem(it,correct,c){ items[it.id]=Math.max(0,(items[it.id]||0)-1); it.run(); const cost=correct?it.gaugeCost*0.3:it.gaugeCost; if(c) c.charge=Math.max(0,c.charge-cost); }

/* ===================== §9 ダメージ計算 ＋ 敵 ＋ 状態異常エンジン ===================== */
// ★土台(⑧)のダメージ計算: 防御=割合式 K/(防+K)・各ヒット個別9999上限・会心は単純×1.5(序盤率10%)。
const DMG_CAP=9999, DMG_FLOOR=1, DEF_K=1000;
function mitig(def){ return DEF_K/(Math.max(0,def||0)+DEF_K); }   // 被ダメ率(0〜1)。防御が高いほど小さい。
// 被ダメUP倍率: 防御低下(kind:'defdown')を掛け合わせ・暴走防止に上限。
function vulnMult(e){ let v=1; if(e&&e.ail){ Object.keys(e.ail).forEach(t=>{ const a=e.ail[t]; if(a&&a.kind==='defdown')v*=a.mul; }); } return Math.min(v,2.0); }
function comboBonus(){ return Math.min(combo*0.04, 0.6); }   // コンボ加算(最大+60%・仮)
function statVal(c,key){ let v=(key==='int'?(c.int||0):key==='def'?(c.def||0):(c.str||0)); if(key==='str'&&c.atkBuff)v*=c.atkBuff.mul; return v; }   // 火力=ちから(str)/魔法=かしこさ(int)。闘気はstrに乗る。
// ★属性キラー: 一旦保留(2026-06-22オーナー判断)。コードは残すが killers を全て1.0にして実質無効(1倍)。
//   再有効化したいときは killers の値(physics等)を1.5などに戻すだけでOK。敵のattrsで最大の倍率が乗る。
function killer(e){ let m=1; if(e&&e.attrs){ e.attrs.forEach(a=>{ const k=killers[a]||1; if(k>m)m=k; }); } return m; }
// スキル/攻撃の与ダメ共通処理: 攻撃ステ×倍率×会心×(1+コンボ+与ダメ%)×K/(防+K)×被ダメUP×属性キラー(現1倍) → 9999上限/最低1。
function fdmg(c,statKey,mult,e,opts){ opts=opts||{}; if(!e||!e.alive)return 0;
  const atk=statVal(c,statKey); const crit=(Math.random()*100 < (c.crit||10)); const cm=crit?1.5:1;
  let dmg=atk*mult*cm*(1+comboBonus()+(opts.dealt||0))*mitig(e.def)*vulnMult(e)*killer(e);
  dmg=Math.max(DMG_FLOOR,Math.min(DMG_CAP,Math.floor(dmg))); dealEnemyTarget(e,dmg,crit); return dmg; }
function doAttack(c,e){ if(!e)return; const d=fdmg(c, c.atkStat||'str', 1.0, e); screenShake(); bigSavor('⚔️ こうげき '+fmt(d)); }   // 通常攻撃(主属性×1.0)＝唯一のMP回復手段(正解で+MP・resolveAnswerで加算)
function answerLabel(q){ return q.type==='choice'?q.choices[q.answer]:q.answer; }
function lowAlly(){ return allies.filter(a=>!a.downed).sort((x,y)=>x.hp/x.hpMax-y.hp/y.hpMax)[0]; }
// 回復: 戦闘不能が居れば蘇生優先(HP40%)、いなければ最もHP割合の低い味方を回復。amount=実数(上限1500)。
function healOne(amount){ let t=allies.find(a=>a.downed);
  if(t){ t.downed=false; t.hp=Math.floor(t.hpMax*0.4); spawnAllyFx(t,'蘇生！','heal'); return; }
  t=lowAlly(); if(!t)return; const h=Math.min(1500,Math.max(1,Math.floor(amount))); t.hp=Math.min(t.hpMax,t.hp+h); spawnAllyFx(t,'+'+h,'heal'); }
function healAlly(ratio){ ratio=ratio||0.30; const t=allies.find(a=>a.downed)||lowAlly(); if(!t)return; healOne(t.hpMax*ratio); }   // アイテム用(割合回復)

// 状態異常を付与。dot=継続時間ﾘﾌﾚｯｼｭ(火力一定・エスカレートしない)／その他=overrideで強さ/時間を上書き。
function applyAilment(e,type,override){ const base=AILMENTS[type]; if(!base||!e||!e.alive)return; const d=Object.assign({},base,override||{}); e.ail=e.ail||{};
  let dur=d.dur;   // 敵耐性で持続DOWN／弱体(ailamp)中は効きやすく長持ち。ailamp自身は対象外。
  if(type!=='ailamp'){ const rs=(e.resist&&e.resist[type])||0; let m=1-rs; if(e.ail.ailamp)m*=e.ail.ailamp.mul; dur=Math.max(1, dur*m); }
  if(d.kind==='dot'){ const cur=e.ail[type]; e.ail[type]={ kind:'dot', pps:d.pps, remain:dur, acc:cur?cur.acc:0, t:cur?cur.t:0 }; }
  else { e.ail[type]=Object.assign({}, d, {remain:dur}); } }
// 実時間tick(問題中は呼ばれない=停止)。敵DoT＋味方バフ持続＋味方やけど(敵特殊由来・非致死)。
function tickStatuses(dt){ let died=false;
  enemies.forEach(e=>{ if(!e.alive||!e.ail)return;
    Object.keys(e.ail).forEach(type=>{ const a=e.ail[type]; if(!a)return; a.remain-=dt;   // if(!a): 反復中に他のtickで消えた枠を踏まない
      if(a.remain<=0){ delete e.ail[type]; return; }
      if(a.kind==='dot' && e.alive){ const dmg=e.hpMax*a.pps*dt; e.hp=Math.max(0,e.hp-dmg); a.acc=(a.acc||0)+dmg; a.t=(a.t||0)+dt;
        if(a.t>=0.6){ spawnEnemyFx(e,'☠'+Math.max(1,Math.round(a.acc)),'dot'); a.acc=0; a.t=0; }
        if(e.hp<=0){ e.alive=false; spawnEnemyFx(e,'☠ たおした','dot'); died=true; } }   // クリアは反復後(下) ＝ 反復中に e.ail を壊さない(クラッシュ防止)
    });
    if(!e.alive) e.ail={};
  });
  allies.forEach(a=>{ if(a.downed)return;
    ['haste','focus','amp','regen','atkBuff','reduce','statusResist'].forEach(k=>{ if(a[k]){ a[k].remain-=dt; if(a[k].remain<=0)a[k]=null; } });
    ['taunt','cover','fade'].forEach(k=>{ if(a[k]>0) a[k]=Math.max(0,a[k]-dt); });   // ヘイト系(秒)
    if(a.thorns){ a.thorns.remain-=dt; if(a.thorns.remain<=0)a.thorns=null; }
    if(a.regen){ const amt=a.regen.flat*dt; a.hp=Math.min(a.hpMax,a.hp+amt); a._rgA=(a._rgA||0)+amt; a._rgT=(a._rgT||0)+dt; if(a._rgT>=0.7){ spawnAllyFx(a,'+'+Math.max(1,Math.round(a._rgA)),'heal'); a._rgA=0; a._rgT=0; } }   // リジェネ/慈雨=毎秒一定回復
    if(a.ail) Object.keys(a.ail).forEach(type=>{ const x=a.ail[type]; if(!x)return; x.remain-=dt; if(x.remain<=0){ delete a.ail[type]; return; }
      if(x.kind==='dot'){ const dmg=a.hpMax*x.pps*dt; a.hp=Math.max(1,a.hp-dmg); x.acc=(x.acc||0)+dmg; x.t=(x.t||0)+dt; if(x.t>=0.7){ spawnAllyFx(a,'🔥'+Math.max(1,Math.round(x.acc)),'hit'); x.acc=0; x.t=0; } } });   // 味方DoTは最低HP1(やさしさ・無罰の精神)
  });
  if(died) checkWin(); }
// 敵の行動失敗(まひ/混乱)。
function enemyWillFail(e){ let p=0; if(e.ail){ if(e.ail.paralyze)p=Math.max(p,e.ail.paralyze.failChance||0); if(e.ail.confuse)p=Math.max(p,e.ail.confuse.fail||0); } return Math.random()<p; }
function enemyAtkMul(e){ return (e&&e.ail&&e.ail.atkdown)?e.ail.atkdown.mul:1; }   // 攻撃低下で敵の与ダメ×mul
function enemyAttack(e){ e.charge=0;
  const alive=allies.filter(a=>!a.downed); if(!alive.length){ phase='lose'; showEnd(false); return; }
  if(enemyWillFail(e)){ spawnEnemyFx(e,'…失敗','dot'); phase='enemyAct'; stateTimer=0.6; renderCommand(); return; }
  // 全体攻撃ボス: 毎手番 味方全員を攻撃(かばう対象外=AoE)。全体回復/被ダメ軽減で対策。
  if(e.aoeAttack){ alive.forEach(t=>{ const raw=Math.floor((e.atk*0.6+Math.random()*e.atk*0.2)*enemyAtkMul(e)); applyEnemyDamageToAlly(e,t,raw,true); });
    bigSavor('🐉 '+e.name+'の全体攻撃！'); screenShake();
    if(allies.every(a=>a.downed)){ phase='lose'; showEnd(false); return; } phase='enemyAct'; stateTimer=0.8; renderCommand(); return; }
  // 特殊(ボス・封印で無効化)。specEvery回ごとに発動。
  if(e.special){ e.spMeter=(e.spMeter||0)+1;
    if(e.spMeter>=(e.specEvery||3)){ e.spMeter=0; if(!(e.ail&&e.ail.seal)){ doEnemySpecial(e); return; } } }
  // ヘイト: 挑発中の味方が居れば狙い固定／いなければ気配消し中は避ける／その中で防御(挑発)を優先
  let pool=alive.filter(a=>a.taunt>0);
  if(!pool.length){ const nonFade=alive.filter(a=>!(a.fade>0)); pool=nonFade.length?nonFade:alive; }
  const def=pool.filter(a=>a.defending); const target=def.length?def[ri(def.length)]:pool[ri(pool.length)];
  if(e.ail&&e.ail.blind&&Math.random()<e.ail.blind.miss){ spawnAllyFx(target,'MISS','heal'); phase='enemyAct'; stateTimer=0.6; renderCommand(); return; }
  let dmg=Math.floor((e.atk+Math.random()*e.atk*0.4)*enemyAtkMul(e));   // 攻撃低下(atkdown)で被ダメ減
  applyEnemyDamageToAlly(e,target,dmg);
  if(allies.every(a=>a.downed)){ phase='lose'; showEnd(false); return; }
  phase='enemyAct'; stateTimer=0.7; renderCommand(); }
// 味方に状態異常を付与(状態異常ボス用)。味方の状態異常耐性(プロテス/守りの祈祷/マナシールド)でレジスト/短縮。
function applyAllyAilment(ally,type){ if(!ally||ally.downed)return; const base=AILMENTS[type]; if(!base)return;
  let durMul=1; if(ally.statusResist){ if(Math.random()<ally.statusResist.pct){ spawnAllyFx(ally,'レジスト','heal'); return; } durMul=1-ally.statusResist.pct*0.5; }
  ally.ail=ally.ail||{}; const dur=Math.max(2, base.dur*durMul);
  if(base.kind==='dot'){ ally.ail[type]={kind:'dot', pps:base.pps, remain:dur, acc:0, t:0}; }
  else { ally.ail[type]=Object.assign({},base,{remain:dur}); }
  spawnAllyFx(ally, base.emoji, 'hit'); }
// ボスの特殊行動。curse=状態異常を味方にばらまく(浄化/耐性で対策)。それ以外=全体ダメージ。封印で止められる。
function doEnemySpecial(e){ const alive=allies.filter(a=>!a.downed); if(!alive.length){ phase='lose'; showEnd(false); return; }
  if(e.special==='curse'){ bigSavor('😈 '+e.name+'の呪い！');
    const shuffled=alive.slice().sort(()=>Math.random()-0.5); const n=Math.min(2,shuffled.length);
    for(let k=0;k<n;k++) applyAllyAilment(shuffled[k], Math.random()<0.5?'poison':'burn');
    alive.forEach(t=>{ const dmg=Math.floor(e.atk*0.4*enemyAtkMul(e)); applyEnemyDamageToAlly(e,t,dmg,true); });   // 軽い全体ダメも
    screenShake(); if(allies.every(a=>a.downed)){ phase='lose'; showEnd(false); return; } phase='enemyAct'; stateTimer=0.9; renderCommand(); return; }
  bigSavor('⚠️ '+e.name+'の特殊！');
  alive.forEach(t=>{ const dmg=Math.floor((e.atk*0.7+Math.random()*e.atk*0.3)*enemyAtkMul(e)); applyEnemyDamageToAlly(e,t,dmg,true); });
  if(e.special==='judgment'){ const t=allies.filter(a=>!a.downed).sort((x,y)=>x.hp/x.hpMax-y.hp/y.hpMax)[0]; if(t){ t.ail=t.ail||{}; t.ail.burn={kind:'dot',pps:0.03,remain:8,acc:0,t:0}; spawnAllyFx(t,'🔥やけど','hit'); } }
  screenShake();
  if(allies.every(a=>a.downed)){ phase='lose'; showEnd(false); return; }
  phase='enemyAct'; stateTimer=0.9; renderCommand(); }
// 味方への被ダメ適用: 防御(挑発+軽減)→シールド吸収→カウンター反射→不屈(致死耐え・HP1)→down。
function applyEnemyDamageToAlly(e,target,dmg,isAoE){
  // かばう: 単体攻撃のみ・他の味方への攻撃を かばう中の壁が肩代わり(軽減つき)。AoE(特殊の全体)は対象にしない=壁が4連で即死しない。
  if(!isAoE){ const cov=allies.find(a=>!a.downed && a.cover>0 && a!==target); if(cov){ spawnAllyFx(target,'🛡かばう','heal'); target=cov; dmg=Math.floor(dmg*0.7); } }
  dmg=Math.max(1,Math.floor(dmg*mitig(target.def)));                                  // ★割合防御(まもり)＝被ダメ率 K/(防+K)
  if(target.reduce && target.reduce.remain>0) dmg=Math.max(1,Math.floor(dmg*(1-target.reduce.pct)));   // 堅守などの被ダメ軽減
  if(target.defending){ dmg=Math.floor(dmg*0.3); target.defending=false; }
  if(target.shield>0){ const ab=Math.min(target.shield,dmg); target.shield-=ab; dmg-=ab; }
  if(target.counter && dmg>0){ target.counter=false; const ref=Math.floor(dmg*0.6)+Math.floor((target.str||0)*0.5);
    if(e&&e.alive){ dealEnemyTarget(e,ref,false); bigSavor('↩️ カウンター '+fmt(ref)); if(e.hp<=0)checkWin(); } }
  if(target.thorns && dmg>0 && e && e.alive){ const ref=Math.floor(dmg*target.thorns.pct); if(ref>0){ dealEnemyTarget(e,ref,false); spawnEnemyFx(e,'🌵'+fmt(ref),'dot'); if(e.hp<=0)checkWin(); } }   // とげの鎧(持続反射)
  let newHp=target.hp-dmg;
  if(newHp<=0 && target.endure){ target.endure=false; newHp=1; spawnAllyFx(target,'不屈！','heal'); }
  target.hp=Math.max(0,newHp);
  if(dmg>0) spawnAllyFx(target,'-'+dmg,'hit'); flashAlly(target);
  if(target.hp<=0){ target.downed=true; target.charge=0; clearAllyBuffs(target); }
  screenShake(); }

/* ===================== §10 演出 ===================== */
function dealEnemyTarget(e,dmg,crit){ if(!e||!e.alive)return; e.hp=Math.max(0,e.hp-dmg);
  if(e.ail&&e.ail.sleep&&e.ail.sleep.breakOnHit) delete e.ail.sleep;   // 眠りは殴ると起きる
  spawnEnemyFx(e,fmt(dmg),crit?'crit':'norm'); flashEnemy(e);
  if(e.hp<=0){ e.alive=false; e.ail={}; } }
function checkWin(){ if(aliveEnemies().length===0 && !_advancing){ _advancing=true; setTimeout(()=>{ _advancing=false; nextEncounter(); }, cfg.savorSec*1000*0.7); } }
function nextEncounter(){ encIdx++; if(encIdx>=curEncounters().length){ stageClear(); return; }
  activeAlly=null; pendingAction=null; _lastEnemyActed=false;   // 前ウェーブの手番/対象を残さない(targetIdxが新ウェーブの別敵を指す事故を防ぐ)
  setEncounter(encIdx); allies.forEach(a=>{ a.downed=false; a.hp=a.hpMax; a.mp=a.mpMax; a.charge=0; clearAllyBuffs(a); });
  combo=0; bumpCombo(); bigSavor('✓ 撃破！ つぎの相手だ'); phase='charging'; renderCommand(); }
function spawnEnemyFx(e,text,cls){ const card=document.getElementById('enemy-'+e.idx); if(!card)return; const f=document.createElement('div'); f.className='efx '+(cls||'norm');
  if(cls==='crit') f.style.fontSize='30px'; else if(cls!=='dot') f.style.fontSize='22px'; f.textContent=text; card.appendChild(f); setTimeout(()=>f.remove(),900);
  if(cls==='crit'||cls==='norm'){ const stage=document.getElementById('stage'); const r=card.getBoundingClientRect(), s=stage.getBoundingClientRect();
    for(let i=0;i<(cls==='crit'?12:7);i++){ const p=document.createElement('div'); p.className='particle'; p.style.background=cls==='crit'?'#fbbf24':'#f87171';
      p.style.left=(r.left-s.left+r.width/2)+'px'; p.style.top=(r.top-s.top+r.height/2)+'px'; stage.appendChild(p);
      const ang=Math.random()*Math.PI*2, dist=24+Math.random()*44; p.animate([{transform:'translate(0,0)',opacity:1},{transform:`translate(${Math.cos(ang)*dist}px,${Math.sin(ang)*dist}px)`,opacity:0}],{duration:500,easing:'ease-out'}); setTimeout(()=>p.remove(),500); } } }
function flashEnemy(e){ const card=document.getElementById('enemy-'+e.idx); if(card){ card.classList.add('hitflash'); setTimeout(()=>card.classList.remove('hitflash'),300); } }
function spawnAllyFx(ally,text,cls){ const card=document.getElementById('ally-'+ally.id); if(!card)return; const f=document.createElement('div'); f.className='ac-fx '+(cls||''); f.textContent=text; card.appendChild(f); setTimeout(()=>f.remove(),900); }
function flashAlly(ally){ const card=document.getElementById('ally-'+ally.id); if(card){ card.classList.add('hitflash'); setTimeout(()=>card.classList.remove('hitflash'),300); } }
function bigSavor(html){ const stage=document.getElementById('stage'); const old=document.getElementById('savorBanner'); if(old)old.remove();
  const b=document.createElement('div'); b.className='savor-banner'; b.id='savorBanner'; b.innerHTML=`<span class="big">${html}</span>`; stage.appendChild(b); setTimeout(()=>{ if(b.parentNode)b.remove(); }, Math.max(900,cfg.savorSec*1000)); }
function screenShake(){ const a=document.getElementById('app'); a.classList.add('shake'); setTimeout(()=>a.classList.remove('shake'),280); }
function bumpCombo(){ const b=document.getElementById('comboBadge'); b.style.display=combo>0?'block':'none'; document.getElementById('comboN').textContent=combo; }

/* ===================== §11 描画 ===================== */
const _ailSig={}, _buffSig={};
function buildEnemies(){ const row=document.getElementById('enemyRow'); const n=enemies.length;
  for(const k in _ailSig)delete _ailSig[k];   // DOM作り直し＝アイコン差分キャッシュをリセット
  // 敵が少ないほど大きく(1体=最大・2体=横幅いっぱい)。幅(画面/敵数)と縦上限の小さい方＝はみ出さず最大化。
  const stage=document.getElementById('stage');
  const avail = (stage && stage.clientWidth>60 ? stage.clientWidth : Math.min((window.innerWidth||400)-24, window.innerWidth>=680?780:460)) - 4;
  const vh = window.innerHeight||700;
  const maxH = Math.floor(vh * (n<=1?0.45 : n===2?0.40 : 0.32));   // 敵が少ないほど縦も大きく許可(1体=最大)。CSS max-height:48vhが最終安全網
  const perW = Math.floor((avail - 8*(n-1))/Math.max(1,n));
  const sz = Math.max(74, Math.min(perW, maxH));
  row.innerHTML = enemies.map(e=>{ const ab=e.attrs.map(a=>{ const s=SUBJECTS[a]; return `<span class="eattr" style="color:${s.color};border-color:${s.color};background:${s.color}1a;">${s.emoji}${s.jp}</span>`; }).join(' ');
    const inner = /\.(png|jpg|webp)$/i.test(e.img)?`<img src="${e.img}" alt="${e.name}">`:`<span style="font-size:${Math.floor(sz*0.6)}px">${e.img}</span>`;
    return `<div class="enemy-card" id="enemy-${e.idx}" onclick="onPickTarget(${e.idx})">
      <div class="eimg" style="width:${sz}px;height:${sz}px;">${inner}</div>
      <div class="ename">${e.name}</div><div>${ab}</div>
      <div class="ailments" id="eail-${e.idx}"></div>
      <div class="ebar hp" style="width:${sz}px;"><i id="ehp-${e.idx}"></i></div>
      <div class="echg" style="width:${sz}px;"><i id="echg-${e.idx}"></i></div>
    </div>`; }).join(''); }
function buildParty(){ for(const k in _buffSig)delete _buffSig[k]; document.getElementById('party').innerHTML=allies.map(a=>`
  <div class="ally-card" id="ally-${a.id}">
    <div class="ac-emoji">${a.emoji}</div><span class="ac-name">${a.name}</span><div class="ac-role">${a.role}</div>
    <div class="ac-bar hp"><i id="hp-${a.id}"></i></div>
    <div class="ac-bar mp"><i id="mp-${a.id}"></i></div>
    <div class="ac-bar atb"><i id="atb-${a.id}"></i></div>
    <div class="ac-shield" id="sh-${a.id}"></div><div class="ac-down">💀</div></div>`).join(''); }
function pct(v,max){ return Math.max(0,Math.min(100,v/max*100)); }
function allyBuffIcons(a){ let s=''; if(a.taunt>0)s+='😤'; if(a.reduce)s+='🔰'; if(a.atkBuff)s+='🔆'; if(a.statusResist)s+='🟣'; if(a.endure)s+='🪨'; if(a.regen)s+='🌿'; if(a.shield>0)s+='🛡'; if(a.cover>0)s+='🛡'; if(a.fade>0)s+='👻'; if(a.defending)s+='🛡️'; if(a.ail&&a.ail.poison)s+='☠️'; if(a.ail&&a.ail.burn)s+='🔥'; return s; }
function updateUI(){
  enemies.forEach(e=>{ const hp=document.getElementById('ehp-'+e.idx), ch=document.getElementById('echg-'+e.idx), card=document.getElementById('enemy-'+e.idx); if(!card)return;
    if(hp) hp.style.width=pct(e.hp,e.hpMax)+'%'; if(ch) ch.style.width=Math.min(100,e.charge)+'%';
    const al=document.getElementById('eail-'+e.idx); if(al){ const keys=e.ail?Object.keys(e.ail):[]; const sig=keys.join(',');
      if(_ailSig['e'+e.idx]!==sig){ _ailSig['e'+e.idx]=sig; al.innerHTML=keys.map(t=>AILMENTS[t]?`<span class="ail" data-info="ail:${t}">${AILMENTS[t].emoji}${AILMENTS[t].jp}</span>`:'').join(''); } }   // 差分更新(毎フレ再生成しない=低スペック実機の負荷減)
    card.classList.toggle('dead', !e.alive); card.classList.toggle('targetable', phase==='targeting' && e.alive); });
  allies.forEach(a=>{ const card=document.getElementById('ally-'+a.id); if(!card)return;
    document.getElementById('hp-'+a.id).style.width=pct(a.hp,a.hpMax)+'%';
    document.getElementById('mp-'+a.id).style.width=pct(a.mp,a.mpMax)+'%';
    document.getElementById('atb-'+a.id).style.width=Math.min(100,a.charge)+'%';
    const sh=document.getElementById('sh-'+a.id); if(sh){ const ic=allyBuffIcons(a); if(_buffSig[a.id]!==ic){ _buffSig[a.id]=ic; sh.textContent=ic; } }
    card.classList.toggle('active', activeAlly===a); card.classList.toggle('downed', a.downed); }); }
function showEnd(win){ if(win) stageClear(); else stageDefeat(); }   // 勝=ステージクリア / 負=敗北画面(体験版の進行管理へ)
function toggleTuner(show){ const t=document.getElementById('tuner'); if(t) t.classList.toggle('show',show); }   // 調整パネルは体験版では撤去(生徒に調整させない)。呼ばれても安全。

/* ===================== §M 体験版の進行（タイトル/マップ/クリア） ===================== */
const SAVE_KEY='rika2_demo_v1';
let progress={ unlocked:0, cleared:[] };   // unlocked=解放済みの最大ステージidx / cleared=クリア済みidx配列
function loadProgress(){ try{ const s=JSON.parse(localStorage.getItem(SAVE_KEY)); if(s&&typeof s.unlocked==='number'){ progress={ unlocked:s.unlocked, cleared:s.cleared||[] }; } }catch(e){} }
function saveProgress(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(progress)); }catch(e){} }
function isCleared(i){ return progress.cleared.indexOf(i)>=0; }

/* ===================== §A 装飾品(アクセサリ)＝集めのエンドの種(試作・C〜R) ===================== */
// 装飾品=1キャラ2枠(スキル無し)。メインステ=全コアステータス +k%(C1/UC1.5/R2)。SR以降と特殊スキル(復活等)は後日。
const ACC_RARITY = {
  C:{  jp:'コモン',     col:'#9fb0d6', pct:1.0, w:60 },
  UC:{ jp:'アンコモン', col:'#34d399', pct:1.5, w:28 },
  R:{  jp:'レア',       col:'#60a5fa', pct:2.0, w:12 },
  SR:{ jp:'スーパーレア', col:'#c084fc', pct:3.0, w:0 },   // 試作では落ちない(後日)
};
const ACC_BASE = ['お守り','リング','ペンダント','ブレス','アミュレット','まが玉','バッジ','イヤリング'];
let accInv = [];                       // 所持: [{id, rarity, base}]
let accEquip = { ares:[null,null], sera:[null,null], gai:[null,null], mina:[null,null] };  // 各2枠=accのid
let _accSeq = 1, accSel = null;        // accSel={cid,slot}
const ACC_KEY='rika2_demo_acc_v1';
function loadAcc(){ try{ const s=JSON.parse(localStorage.getItem(ACC_KEY)); if(s){ accInv=s.inv||[]; accEquip=Object.assign({ares:[null,null],sera:[null,null],gai:[null,null],mina:[null,null]}, s.equip||{}); _accSeq=s.seq||1; } }catch(e){} }
function saveAcc(){ try{ localStorage.setItem(ACC_KEY, JSON.stringify({inv:accInv, equip:accEquip, seq:_accSeq})); }catch(e){} }
function accById(id){ return accInv.find(a=>a.id===id); }
function accPctFor(cid){ let p=0; (accEquip[cid]||[]).forEach(id=>{ const a=id!=null?accById(id):null; if(a)p+=ACC_RARITY[a.rarity].pct; }); return p; }   // 全コア+%(2枠合算)
function rollAccRarity(){ const ks=Object.keys(ACC_RARITY); const tot=ks.reduce((s,k)=>s+ACC_RARITY[k].w,0); let x=Math.random()*tot; for(const k of ks){ x-=ACC_RARITY[k].w; if(x<0)return k; } return 'C'; }
function dropAccessory(){ const rarity=rollAccRarity(); const base=ACC_BASE[Math.floor(Math.random()*ACC_BASE.length)]; const a={ id:_accSeq++, rarity, base }; accInv.push(a); saveAcc(); return a; }

function showHome(){ gameState='home'; renderHome(); showScreen('home'); setTopbar(''); }
function renderHome(){ const cards=ALLY_DEFS.map(d=>{ const pct=accPctFor(d.id);
    const dots=(accEquip[d.id]||[null,null]).map(id=>{ const a=id!=null?accById(id):null; return a?`<span class="acc-dot" style="background:${ACC_RARITY[a.rarity].col};"></span>`:`<span class="acc-dot empty"></span>`; }).join('');
    return `<div class="home-card"><div class="hc-emoji">${d.emoji}</div><div class="hc-name">${d.name}</div><div class="hc-role">${d.role}</div><div class="hc-dots">${dots}</div><div class="hc-pct">全コア +${pct}%</div></div>`; }).join('');
  document.getElementById('homeBody').innerHTML=`
    <h2 class="scr-ttl">🏠 ホーム</h2>
    <div class="home-party">${cards}</div>
    <div class="home-info">もちもの 装飾品：<b>${accInv.length}</b>こ</div>
    <div class="scr-btns">
      <button class="scr-btn primary big" onclick="showMap()">▶ ぼうけんへ</button>
      <button class="scr-btn" onclick="showAccessory()">🔮 そうび（装飾品）</button>
    </div>`;
}
function showAccessory(){ gameState='accessory'; accSel=null; renderAccessory(); showScreen('accessory'); setTopbar(''); }
function renderAccessory(){
  const rows=ALLY_DEFS.map(d=>{ const pct=accPctFor(d.id);
    const slots=(accEquip[d.id]||[null,null]).map((id,si)=>{ const a=id!=null?accById(id):null; const sel=accSel&&accSel.cid===d.id&&accSel.slot===si;
      const inner=a?`<span class="aslot-r" style="color:${ACC_RARITY[a.rarity].col};">${ACC_RARITY[a.rarity].jp}</span><span class="aslot-n">${a.base} +${ACC_RARITY[a.rarity].pct}%</span>`:`<span class="aslot-empty">＋ 空き</span>`;
      return `<button class="aslot${sel?' sel':''}" onclick="selectSlot('${d.id}',${si})">${inner}</button>`; }).join('');
    return `<div class="acc-row"><div class="ar-head"><span class="ar-emoji">${d.emoji}</span><span class="ar-name">${d.name}</span><span class="ar-pct">全コア +${pct}%</span></div><div class="ar-slots">${slots}</div></div>`; }).join('');
  const equipped=new Set(); Object.values(accEquip).forEach(arr=>arr.forEach(id=>{ if(id!=null)equipped.add(id); }));
  const inv=accInv.filter(a=>!equipped.has(a.id));
  let invHtml;
  if(!accSel){ invHtml=`<div class="acc-hint">スロットをえらんでから、下のもちものをタップ</div>`; }
  else { const filled=accEquip[accSel.cid][accSel.slot]!=null;
    const rm=filled?`<button class="acc-chip remove" onclick="unequipSel()">✕ はずす</button>`:'';
    const chips=inv.length?inv.map(a=>`<button class="acc-chip" style="border-color:${ACC_RARITY[a.rarity].col};" onclick="equipAcc(${a.id})"><b style="color:${ACC_RARITY[a.rarity].col};">${ACC_RARITY[a.rarity].jp}</b> ${a.base} +${ACC_RARITY[a.rarity].pct}%</button>`).join(''):`<div class="acc-hint">あいてる装飾品がありません</div>`;
    invHtml=`<div class="acc-inv">${rm}${chips}</div>`; }
  document.getElementById('accBody').innerHTML=`
    <h2 class="scr-ttl">🔮 そうび（装飾品）</h2>
    <div class="acc-sub">装飾品は1人2つまで。全コアステータスが上がるよ。</div>
    <div class="acc-list">${rows}</div>
    <div class="acc-invwrap"><div class="acc-invttl">もちもの（${inv.length}）</div>${invHtml}</div>
    <div class="scr-btns"><button class="scr-btn" onclick="showHome()">◀ ホーム</button></div>`;
}
function selectSlot(cid,slot){ accSel={cid,slot}; renderAccessory(); }
function equipAcc(accId){ if(!accSel)return; Object.keys(accEquip).forEach(c=>accEquip[c].forEach((v,i)=>{ if(v===accId)accEquip[c][i]=null; })); accEquip[accSel.cid][accSel.slot]=accId; saveAcc(); renderAccessory(); }
function unequipSel(){ if(!accSel)return; accEquip[accSel.cid][accSel.slot]=null; saveAcc(); renderAccessory(); }

function showScreen(name){   // overlay表示の一元管理。battle時は全overlay非表示。
  ['title','home','map','accessory','clear','complete','defeat'].forEach(k=>{ const el=document.getElementById('screen-'+k); if(el) el.classList.toggle('show', k===name); });
}
function showTitle(){ gameState='title'; showScreen('title'); setTopbar(''); }
function showMap(){ gameState='map'; renderMap(); showScreen('map'); setTopbar(''); }
function renderMap(){ const g=document.getElementById('mapList');
  g.innerHTML=STAGES.map((st,i)=>{ const locked=i>progress.unlocked; const cl=isCleared(i);
    return `<button class="stage-card${locked?' locked':''}${cl?' cleared':''}" ${locked?'':`onclick="startStage(${i})"`}>
      <div class="sc-emoji">${locked?'🔒':st.emoji}</div>
      <div class="sc-mid">
        <div class="sc-name">${locked?'？？？':st.name}</div>
        <div class="sc-theme">STAGE ${i+1}${locked?'':'・'+st.theme+'のもんだい'}</div>
      </div>
      <div class="sc-flag">${cl?'✓ クリア':(locked?'ロック':'▶ ちょうせん')}</div>
    </button>`; }).join(''); }

function startStage(i){ if(i>progress.unlocked) return; curStage=i;
  const st=STAGES[i]; if(st.cfg){ cfg.chargeSec=st.cfg.chargeSec; cfg.enemyIntervalSec=st.cfg.enemyIntervalSec; }
  curStatMul = (st.meta&&st.meta.pow)||1; curLoadout = (st.meta&&st.meta.loadout)||null;   // ★メタ装備の自動切替(11〜)
  gameState='battle'; showScreen(''); setTopbar(`STAGE ${i+1}・${st.name}`);
  startBattle();
  if(st.meta&&st.meta.label) setTimeout(()=>bigSavor('🔧 メタ装備：'+st.meta.label),140); }

function stageClear(){ gameState='clear'; const st=STAGES[curStage];
  if(!isCleared(curStage)) progress.cleared.push(curStage);
  progress.unlocked=Math.max(progress.unlocked, Math.min(curStage+1, STAGES.length-1));
  saveProgress();
  const last=curStage>=STAGES.length-1;
  const acc=dropAccessory(); const ar=ACC_RARITY[acc.rarity];   // ★装飾品ドロップ(クリアごと・C〜R)
  document.getElementById('clearBody').innerHTML=`
    <div class="big-emoji">🏆</div>
    <h2 class="scr-ttl">STAGE ${curStage+1} クリア！</h2>
    <div class="scr-sub">${st.emoji} ${st.name}</div>
    <div class="drop-card">
      <div class="drop-label">🎁 装飾品を てにいれた！</div>
      <div class="drop-name" style="color:${ar.col};border-color:${ar.col};">［${ar.jp}］${acc.base}　＋全コア${ar.pct}%</div>
      <div class="drop-note">ホームの「そうび」で 1人2つまで つけられる</div>
    </div>
    <div class="scr-btns">
      ${ last ? `<button class="scr-btn primary" onclick="showComplete()">▶ けっか</button>`
             : `<button class="scr-btn primary" onclick="startStage(${curStage+1})">▶ つぎのステージへ</button>` }
      <button class="scr-btn" onclick="showMap()">🗺 マップへ</button>
      <button class="scr-btn" onclick="showHome()">🏠 ホーム</button>
    </div>`;
  showScreen('clear'); setTopbar('');
}
function stageDefeat(){ gameState='defeat';
  document.getElementById('defeatBody').innerHTML=`
    <div class="big-emoji">😵</div>
    <h2 class="scr-ttl">ぜんめつ…</h2>
    <div class="scr-sub">もういちど ちょうせんしよう（HPは へってもこわくない）</div>
    <div class="scr-btns">
      <button class="scr-btn primary" onclick="startStage(${curStage})">▶ もういちど</button>
      <button class="scr-btn" onclick="showMap()">🗺 マップへ</button>
    </div>`;
  showScreen('defeat'); setTopbar('');
}
function showComplete(){ gameState='complete';
  document.getElementById('completeBody').innerHTML=`
    <div class="big-emoji">🎉</div>
    <h2 class="scr-ttl">体験版クリア！</h2>
    <div class="scr-sub">15ステージ、ぜんぶ突破！<br>集めた装飾品で もっと上をめざそう。</div>
    <div class="scr-btns">
      <button class="scr-btn primary" onclick="showHome()">🏠 ホームへ</button>
      <button class="scr-btn" onclick="showMap()">🗺 マップへ</button>
    </div>`;
  showScreen('complete'); setTopbar('');
}
function setTopbar(txt){ const el=document.getElementById('tbStage'); if(el) el.textContent=txt;
  const back=document.getElementById('tbBack'); if(back) back.style.display=(gameState==='battle')?'inline-block':'none'; }

let _rzT=null; window.addEventListener('resize', ()=>{ clearTimeout(_rzT); _rzT=setTimeout(()=>{ try{ buildEnemies(); }catch(e){} }, 160); });   // デバウンス=連続resizeで演出が消えにくい

/* ===================== §12 長押しで説明（フレーバー＋実効果） ===================== */
// 画面の説明文(薄い小文字)は廃止し、要素(スキル/アイテム/コマンド/状態異常アイコン)を長押し→フレーバー＋実効果を表示。
const CMD_INFO = {
  'cmd:attack':{title:'⚔️ 攻撃', fl:'武器をふりかぶる。', ef:'問題が出る。正解で対象に通常攻撃。正解するとMPも少し回復する。'},
  'cmd:defend':{title:'🛡️ 防御', fl:'身構えて備える。', ef:'問題なし。次に受ける敵の攻撃を大きく軽減し、敵に狙われやすくなる。'},
  'cmd:skill':{title:'✨ スキル', fl:'技を選ぶ。', ef:'MPを使って技を出す。技ごとに「要・問題」か「即発動」かが違う。'},
  'cmd:item':{title:'🎒 アイテム', fl:'道具を使う。', ef:'行動ゲージを消費して使う。正解すると消費が30%に軽くなる。'},
};
const INFO = {};
function buildInfo(){
  Object.keys(SKILLS).forEach(id=>{ const s=SKILLS[id]; INFO['skill:'+id]={title:s.emoji+' '+s.name+'（MP'+s.mp+'）', fl:s.fl||'', ef:s.note||''}; });
  ITEM_DEFS.forEach(it=>{ INFO['item:'+it.id]={title:it.emoji+' '+it.name, fl:it.fl||'', ef:it.note||''}; });
  Object.keys(AILMENTS).forEach(t=>{ const a=AILMENTS[t]; INFO['ail:'+t]={title:a.emoji+' '+a.jp+'（状態異常）', fl:a.fl||'', ef:a.ef||''}; });
  Object.assign(INFO, CMD_INFO);
}
function showInfo(key){ let d;
  if(key.indexOf('skill:')===0){ const s=SKILLS[key.slice(6)]; if(!s)return;   // スキルは現在のレベル/MPを動的に表示
    const lv=skLevelable(s)?('Lv'+skL(s).lv):'レベル—';
    d={title:s.emoji+' '+s.name+'（'+lv+'・MP'+skMp(s)+'）', fl:s.fl, ef:s.note+'<br><span style="color:var(--sub);font-size:12px;">🎚 '+skAxisHint(s)+'</span>'}; }
  else d=INFO[key];
  if(!d)return; const m=document.getElementById('infoModal');
  m.innerHTML=`<div class="info-card"><div class="info-ttl">${d.title}</div>${d.fl?`<div class="info-fl">「${d.fl}」</div>`:''}<div class="info-ef">${d.ef}</div><div class="info-close">タップで閉じる</div></div>`;
  m.classList.add('show'); }
function hideInfo(){ document.getElementById('infoModal').classList.remove('show'); }
// 長押し(450ms)で説明。指が動いたら/離したらキャンセル。長押し直後のクリックは握りつぶす(本来の操作の誤発動を防ぐ)。
let _lpTimer=null, _lpFired=false, _lpXY=null;
function _lpDown(e){ const el=e.target.closest('[data-info]'); if(!el)return; _lpXY={x:e.clientX,y:e.clientY};
  _lpTimer=setTimeout(()=>{ _lpTimer=null; _lpFired=true; showInfo(el.getAttribute('data-info')); }, 450); }
function _lpEnd(){ if(_lpTimer){ clearTimeout(_lpTimer); _lpTimer=null; } }
function _lpMove(e){ if(_lpTimer&&_lpXY&&(Math.abs(e.clientX-_lpXY.x)>10||Math.abs(e.clientY-_lpXY.y)>10)){ clearTimeout(_lpTimer); _lpTimer=null; } }
document.addEventListener('pointerdown', _lpDown, true);
document.addEventListener('pointerup', _lpEnd, true);
document.addEventListener('pointercancel', _lpEnd, true);
document.addEventListener('pointermove', _lpMove, true);
document.addEventListener('click', (e)=>{ if(_lpFired){ _lpFired=false; e.stopPropagation(); e.preventDefault(); } }, true);
document.addEventListener('contextmenu', (e)=>{ const el=e.target.closest('[data-info]'); if(el){ e.preventDefault(); showInfo(el.getAttribute('data-info')); } });

/* ===== あいことばゲート(β・ソフトな鍵=ソースに見えるので本当の鍵ではない) ===== */
const PG_KEY='rika2_demo_pass_ok', PG_WORD='rikarika';
function pgCheck(){ const v=(document.getElementById('pgInput').value||'').trim().toLowerCase();
  if(v===PG_WORD){ try{ localStorage.setItem(PG_KEY,'1'); }catch(e){} document.getElementById('passgate').classList.add('hide'); }
  else { document.getElementById('pgErr').textContent='あいことばが ちがうみたい'; document.getElementById('pgInput').value=''; document.getElementById('pgInput').focus(); } }
function pgInit(){ let ok=false; try{ ok=localStorage.getItem(PG_KEY)==='1'; }catch(e){}
  if(ok){ document.getElementById('passgate').classList.add('hide'); }
  else { setTimeout(()=>{ const el=document.getElementById('pgInput'); if(el)el.focus(); },80); } }

buildInfo();
loadProgress();
loadAcc();
// 体験版は味方/敵の器を先に1回つくっておく(updateUIが空配列でも安全だが、初回描画のため)。curStage=0で仮初期化。
makeAllies(); buildParty(); setEncounter(0);
showTitle();
pgInit();
requestAnimationFrame(loop);
</script>
