/* ===================== §I もちもの台帳(インベントリ)＋装備詳細ドロワー(2026-06-24) =====================
   ★全6レア度(C〜LR)・全12ボーナスに耐える形: 色は RARITY[r].col(--rc)、レア度UIは RARITY_ORDER をループ、
     ボーナスは bonusText(未知tでも"t+v")で描画。アイコンは枠＝後で<img>差込(本番アート)。問題エンジンには無干渉。 */
const SLOT_PIP={ '武器':'🗡', '頭':'🎩', '胴':'🥋', '足':'👢' };
let invFilter={ tab:'gear', slot:'all', rarity:'all' };
let invMode='view';            // 'view'(見る)｜'sell'(売る)
let invSellSel=new Set();      // 売却に選んだアイテム('g'+id / 'a'+id)
let lastSale=null;             // ★直前の売却(誤売却アンドゥ用)={items:[{kind,item}], gold}。リロードで消える=即時ミス取り消し用
const SELL_VALUE={ C:10, R:60, SR:200, SSR:600, UR:1500, LR:4000 };   // ★売却額(仮・レア度依存・聖典のゴールド経済)。装備/装飾品 共通表。
function sellValue(it){ return (it&&SELL_VALUE[it.rarity])||0; }
function fmtGold(n){ return fmt(n||0); }
function addGold(n){ progress.gold=(progress.gold||0)+n; saveProgress(); }
function sellKey(kind,id){ return (kind==='gear'?'g':'a')+id; }
function rIdx(r){ return RARITY_ORDER.indexOf(r); }
let invSort='rarity';      // 並び替え: 'rarity'(レア度順)|'power'(強い順)|'new'(新しい順)
let invShown=0;            // ページング: 今表示している件数(性能=数百個でも一度に全部描かない)
const INV_PAGE=60;
let newIds=new Set();      // ★NEW(新着)バッジ: ドロップで追加・見たら外す(saveAcc/loadAccで永続)
// ── 総合力スコア(レア度/stat差を正規化した単一値)=並び替え・つけ得判定・将来のおまかせ装備の土台 ──
function itemPower(it){ if(!it)return 0;
  const isGear=(it.skillId!==undefined);
  let p = isGear ? (it.main ? it.main.v/((MAIN_VAL[it.main.stat]&&MAIN_VAL[it.main.stat].R)||it.main.v||1) : 0)
                 : (RARITY[it.rarity].pct/(RARITY.R.pct||2));   // R基準=1.0でstat種を超えて比較可
  accBonuses(it).forEach(b=>{ const ref=(BONUS_VAL[b.t]&&BONUS_VAL[b.t].R)||b.v||1; p+=(b.v/ref)*0.3; });   // ボーナスは控えめ加点(オーナー決定で重み0.3据置)
  return p; }
// ── 評価値(rating)＝itemPowerを画面表示用に「評価pt」＋金バーに。pt=絶対値(R≈100・100点満点ではない)／バー=Rを満タン基準=コモンが短く見える＝『コモンはRに勝てない』を可視化(オーナー要望②) ──
const RATING_REF=1.5;   // バー満タンの基準itemPower(≒最高ロールのR＝今のドロップ上限)。数字ptが上限への絶対距離・バーが一目の強弱。
function itemRatingPt(it){ return Math.round(itemPower(it)*100); }
function itemBarPct(it){ return Math.max(5, Math.min(100, Math.round(itemPower(it)/RATING_REF*100))); }   // 最低5%=コモンも線が見える
function ratingHtml(it){ return `<div class="rbar"><i style="width:${itemBarPct(it)}%"></i></div><div class="rpt">評価 ${itemRatingPt(it)}</div>`; }
function slotMinEquippedPower(slot){ let mn=Infinity; ALLY_DEFS.forEach(d=>{ const gid=gearEquip[d.id][slot]; const g=gid!=null?gearById(gid):null; mn=Math.min(mn, g?itemPower(g):0); }); return mn===Infinity?0:mn; }   // 空き枠=0
function accMinEquippedPower(){ let mn=Infinity; ALLY_DEFS.forEach(d=>{ (accEquip[d.id]||[null,null]).forEach(id=>{ const a=id!=null?accById(id):null; mn=Math.min(mn, a?itemPower(a):0); }); }); return mn===Infinity?0:mn; }
function isUpgrade(kind,it){ const mn=kind==='gear'?slotMinEquippedPower(it.slot):accMinEquippedPower(); return itemPower(it)>mn+1e-9; }   // ★同スロットで誰か(最弱)の強化になる=つけ得。役割ロックなしなので「全キャラ最弱」基準で一意判定
function allyById(cid){ return ALLY_DEFS.find(a=>a.id===cid); }
function leadCid(){ const li=Math.min(progress.lead||0, ALLY_DEFS.length-1); return ALLY_DEFS[li].id; }
function gearEquippedBy(id){ for(const c of Object.keys(gearEquip)) for(const s of GEAR_SLOTS) if(gearEquip[c][s]===id) return c; return null; }
function accEquippedBy(id){ for(const c of Object.keys(accEquip)) if((accEquip[c]||[]).indexOf(id)>=0) return c; return null; }
function previewStats(cid){ const d=allyById(cid), accm=1+accPctFor(cid)/100, bf=d.buff||{};   // 戦闘makeAlliesと同式(mflat除く)
  const fin=(key,base)=>Math.round((base+accFlat(cid,key))*accm*(bf[key]||1));
  return { str:fin('str',d.str), int:fin('int',d.int), def:fin('def',d.def), hp:fin('hp',d.hpMax), mp:fin('mp',d.mpMax),
    spd:Math.min(2.2,(d.spd+gearSpd(cid))*(bf.spd||1)), resist:accResistFor(cid) }; }
function showInventory(){ gameState='inventory'; invFilter={tab:'gear',slot:'all',rarity:'all',newOnly:false}; invMode='view'; invSort='rarity'; invShown=INV_PAGE; invSellSel.clear(); renderInventory(); showScreen('inventory'); setTopbar(''); }
function invSetTab(k){ invFilter={tab:k,slot:'all',rarity:'all',newOnly:false}; if(k==='item')invMode='view'; invShown=INV_PAGE; invSellSel.clear(); renderInventory(); }   // 売却の選択は絞り込みを変えたらリセット(見えてる物だけ売る=取り違え防止)
function invSetSlot(k){ invFilter.slot=k; invShown=INV_PAGE; invSellSel.clear(); renderInventory(); }
function invSetRarity(k){ invFilter.rarity=k; invShown=INV_PAGE; invSellSel.clear(); renderInventory(); }   // ★レア度で絞る→ぜんぶ選ぶ→売る=一括レア度売却の導線
function invSetSort(s){ invSort=s; invShown=INV_PAGE; renderInventory(); }
function invToggleNew(){ invFilter.newOnly=!invFilter.newOnly; invShown=INV_PAGE; invSellSel.clear(); renderInventory(); }
function invMore(){ invShown=(invShown||INV_PAGE)+INV_PAGE; renderInventory(); }   // ★ページング=数百個でも一度に全部描かない(性能)
function invSetMode(m){ invMode=m; invShown=INV_PAGE; invSellSel.clear(); renderInventory(); }
function invToggleSell(kind,id){ const k=sellKey(kind,id); if(invSellSel.has(k))invSellSel.delete(k); else invSellSel.add(k); renderInventory(); }
function invToggleLock(kind,id){ const it=kind==='gear'?gearById(id):accById(id); if(!it)return; it.locked=!it.locked;   // ★お気に入りロック=一括売却の盾
  if(it.locked) invSellSel.delete(sellKey(kind,id));   // ロックしたら売却選択から外す
  saveAcc(); renderInventory(); }
function invFilteredRaw(){   // 現在の絞り込み(タブ/スロット/レア度/新着)を適用した生リスト=台帳と売却で共有(ズレ防止)
  const kind=invFilter.tab==='acc'?'acc':'gear';
  let L=(kind==='acc'?accInv:gearInv).slice();
  if(kind==='gear'&&invFilter.slot!=='all') L=L.filter(x=>x.slot===invFilter.slot);
  if(invFilter.rarity!=='all') L=L.filter(x=>x.rarity===invFilter.rarity);
  if(invFilter.newOnly) L=L.filter(x=>newIds.has(x.id));
  return {kind, L}; }
function invSortList(L,kind){
  if(invSort==='power') return L.slice().sort((a,b)=>itemPower(b)-itemPower(a) || rIdx(b.rarity)-rIdx(a.rarity) || b.id-a.id);   // 強い順
  if(invSort==='new')   return L.slice().sort((a,b)=>b.id-a.id);                                                                 // 新しい順(id降順)
  return L.slice().sort((a,b)=>rIdx(b.rarity)-rIdx(a.rarity) || (kind==='gear'?GEAR_SLOTS.indexOf(a.slot)-GEAR_SLOTS.indexOf(b.slot):0) || a.id-b.id);   // レア度順(既定)
}
function invSellableList(){   // いま見えている(絞り込み後)、装備中でない・ロックしていない そうび/装飾品
  if(invFilter.tab==='item')return []; const {kind,L}=invFilteredRaw();
  return L.filter(x=>!x.locked && (kind==='gear'?gearEquippedBy(x.id):accEquippedBy(x.id))===null).map(x=>({kind,it:x})); }
function invSelectAllVisible(){ invSellableList().forEach(o=>invSellSel.add(sellKey(o.kind,o.it.id))); renderInventory(); }
function invSelectJunk(){ let n=0; invSellableList().forEach(o=>{ if(!isUpgrade(o.kind,o.it)){ invSellSel.add(sellKey(o.kind,o.it.id)); n++; } }); renderInventory(); if(!n)invToast('いらない物は 見あたらないよ（みんな つけ得！）'); }   // ★誰の強化にもならない(✨無し)非ロック非装備=ゴミだけ自動選択
function invClearSell(){ invSellSel.clear(); renderInventory(); }
function invSellTotal(){ let g=0,n=0; invSellSel.forEach(k=>{ const kind=k[0]==='a'?'acc':'gear', id=+k.slice(1), it=kind==='gear'?gearById(id):accById(id); if(it){ g+=sellValue(it); n++; } }); return {gold:g,count:n}; }
function invSellSelected(){ const {gold,count}=invSellTotal(); if(!count)return;
  if(!confirm(`そうび ${count}個を ${fmtGold(gold)}G で うりますか？\n（売ったあと「もどす」で 取り消せます）`)) return;
  const sold=[];   // ★実際に売れた物を記録=アンドゥ用
  invSellSel.forEach(k=>{ const kind=k[0]==='a'?'acc':'gear', id=+k.slice(1);
    if(kind==='gear'){ const it=gearById(id); if(it&&!it.locked&&gearEquippedBy(id)===null){ const i=gearInv.findIndex(x=>x.id===id); if(i>=0){ gearInv.splice(i,1); sold.push({kind:'gear',item:it}); } } }   // ★装備中/ロックは売らない(二重ガード)
    else { const it=accById(id); if(it&&!it.locked&&accEquippedBy(id)===null){ const i=accInv.findIndex(x=>x.id===id); if(i>=0){ accInv.splice(i,1); sold.push({kind:'acc',item:it}); } } } });
  const realGold=sold.reduce((s,o)=>s+sellValue(o.item),0);
  addGold(realGold); saveAcc(); invSellSel.clear(); lastSale={ items:sold, gold:realGold };
  renderInventory(); invSaleToast(sold.length, realGold); }
function invUndoSale(){ if(!lastSale)return;   // ★誤売却の取り消し=売った物を戻し、得たゴールドを返す(無罰)
  lastSale.items.forEach(o=>{ if(o.kind==='gear')gearInv.push(o.item); else accInv.push(o.item); });
  addGold(-lastSale.gold); saveAcc(); const n=lastSale.items.length; lastSale=null; renderInventory(); invToast(`↩️ ${n}個 もどした`); }
function invToast(msg){ const g=document.getElementById('invBody'); if(!g)return; const t=document.createElement('div'); t.className='inv-toast'; t.textContent=msg; g.appendChild(t); setTimeout(()=>{ if(t.parentNode)t.remove(); },1800); }
function invSaleToast(n,gold){ const g=document.getElementById('invBody'); if(!g)return; const t=document.createElement('div'); t.className='inv-toast sale';   // ★売却トースト=その場で「もどす」(数秒)
  t.innerHTML=`💰 ${n}個 うって +${fmtGold(gold)}G　<button class="toast-undo" onclick="invUndoSale()">↩️ もどす</button>`;
  g.appendChild(t); setTimeout(()=>{ if(t.parentNode)t.remove(); },6000); }
function renderInventory(){ const g=document.getElementById('invBody'); if(!g)return;
  const total=gearInv.length+accInv.length+(items.hpPotion||0)+(items.mpPotion||0);
  const tab=(k,l,n)=>`<button class="chip" aria-pressed="${invFilter.tab===k}" onclick="invSetTab('${k}')">${l} ${n}</button>`;
  const tabs=`<div class="chips">${tab('gear','🗡 そうび',gearInv.length)}${tab('acc','◆ 装飾品',accInv.length)}${tab('item','🧪 どうぐ',(items.hpPotion||0)+(items.mpPotion||0))}</div>`;
  let sub='';
  if(invFilter.tab==='gear'){ const sb=(k,l)=>`<button class="chip" aria-pressed="${invFilter.slot===k}" onclick="invSetSlot('${k}')">${l}</button>`;
    sub=`<div class="chips sub">${sb('all','すべて')}${GEAR_SLOTS.map(s=>sb(s,(SLOT_PIP[s]||'')+s)).join('')}</div>`; }
  let rar='';
  if(invFilter.tab!=='item'){ const present=new Set((invFilter.tab==='gear'?gearInv:accInv).map(x=>x.rarity));   // ★在庫にあるレア度だけ＝死にフィルタなし＝全6レア度に自動対応
    const rb=k=>{ if(k==='all') return `<button class="chip" aria-pressed="${invFilter.rarity==='all'}" onclick="invSetRarity('all')">レア度</button>`;
      if(!present.has(k)) return '';
      return `<button class="chip r" style="--rc:${RARITY[k].col};" aria-pressed="${invFilter.rarity===k}" onclick="invSetRarity('${k}')">${RARITY[k].jp}</button>`; };
    rar=`<div class="chips sub">${rb('all')}${RARITY_ORDER.map(rb).join('')}</div>`; }
  let sellBar='';
  if(invMode==='sell'&&invFilter.tab!=='item'){ const t=invSellTotal();
    sellBar=`<div class="sellbar"><button class="chip" onclick="invSelectJunk()" title="だれの強化にもならない物を自動で選ぶ">🗑 いらない物</button><button class="chip" onclick="invSelectAllVisible()">ぜんぶ選ぶ</button><button class="chip" onclick="invClearSell()">えらび直す</button>`
      +`<button class="sell-go" ${t.count?'':'disabled'} onclick="invSellSelected()">💰 ${t.count}個を うる（+${fmtGold(t.gold)}G）</button></div>`; }
  let sortRow='';
  if(invFilter.tab!=='item'){ const so=(k,l)=>`<button class="chip" aria-pressed="${invSort===k}" onclick="invSetSort('${k}')">${l}</button>`;
    sortRow=`<div class="chips sub"><span class="sortlbl">ならべ替え</span>${so('rarity','レア度')}${so('power','強い順')}${so('new','新しい順')}<button class="chip newchip" aria-pressed="${invFilter.newOnly}" onclick="invToggleNew()">✨新着</button></div>`; }
  const sellTgl=invFilter.tab!=='item'?`<button class="chip selltgl${invMode==='sell'?' on':''}" onclick="invSetMode('${invMode==='sell'?'view':'sell'}')">${invMode==='sell'?'✕ やめる':'💰 売る'}</button>`:'';
  const undoBar=lastSale?`<div class="undo-bar">↩️ さっき <b>${lastSale.items.length}個</b> 売った（+${fmtGold(lastSale.gold)}G）<button class="chip" onclick="invUndoSale()">もどす</button></div>`:'';
  g.innerHTML=`<div class="inv-head"><h2>🎒 もちもの台帳</h2><div class="inv-head-r"><span class="gold">💰 <b>${fmtGold(progress.gold)}</b></span>${sellTgl}</div></div>
    ${undoBar}
    ${invMode==='sell'?`<div class="sell-hint">うりたい そうびを えらんでね。<b>レア度でしぼって「ぜんぶ選ぶ」</b>で 一括も できるよ。<b>装備中・⭐ロックは うれません</b>。</div>`:''}
    ${tabs}${sub}${rar}${sortRow}
    <div class="inv-grid">${invCardsHtml()}</div>
    ${sellBar}
    <div class="scr-btns"><button class="scr-btn" onclick="showHome()">◀ ホーム</button><button class="scr-btn" onclick="showEquip()">🔮 そうびを組む →</button></div>`; }
function invCardsHtml(){
  if(invFilter.tab==='item'){ const cards=ITEM_DEFS.filter(it=>(items[it.id]||0)>0).map(it=>
      `<button class="gcard" style="--rc:var(--line);" onclick="openDetail('item','${it.id}')"><div class="thumb" style="background:#0c1326;">${it.emoji}</div><div class="rr" style="color:var(--sub);">×${items[it.id]}</div><div class="gn">${it.name}</div></button>`).join('');
    return cards||`<div class="inv-empty">どうぐが ありません</div>`; }
  const {kind,L:raw}=invFilteredRaw();
  if(!raw.length){ const filtered=(invFilter.rarity!=='all')||(kind==='gear'&&invFilter.slot!=='all')||invFilter.newOnly;
    return `<div class="inv-empty">${filtered?'あてはまる アイテムが ないよ':'まだ ないよ。冒険で あつめよう！'}</div>`; }
  const L=invSortList(raw,kind), total=L.length, shown=Math.min(invShown||INV_PAGE, total);
  const sell=(invMode==='sell');
  const slotMin={}; if(kind==='gear')GEAR_SLOTS.forEach(s=>slotMin[s]=slotMinEquippedPower(s)); const accMin=kind==='acc'?accMinEquippedPower():0;   // ★つけ得判定を1回だけ計算(性能)
  let html=L.slice(0,shown).map(x=>{ const rc=RARITY[x.rarity].col;
    const ico=kind==='gear'?(SKILLS[x.skillId]?SKILLS[x.skillId].emoji:'❔'):'◆';
    const nm=kind==='gear'?equipName(x):x.base;
    const gm=kind==='gear'?mainText(x):('全コア+'+RARITY[x.rarity].pct+'%');
    const pip=kind==='gear'?`<span class="slotpip">${SLOT_PIP[x.slot]||''}</span>`:'';
    const newDot=newIds.has(x.id)?`<span class="newdot" title="あたらしい"></span>`:'';
    const up=(itemPower(x)>(kind==='gear'?slotMin[x.slot]:accMin)+1e-9)?`<span class="upbadge" title="だれかの そうびより つよい＝つけ得">✨</span>`:'';   // ★つけ得=全キャラ同スロット最弱より強い
    const wc=kind==='gear'?gearEquippedBy(x.id):accEquippedBy(x.id), al=wc?allyById(wc):null;
    const lk=!!x.locked;   // ★お気に入りロック
    const star=`<span class="lockbtn${lk?' on':''}" onclick="event.stopPropagation();invToggleLock('${kind}',${x.id})" title="${lk?'ロック中(タップで解除)':'ロックする'}">${lk?'⭐':'☆'}</span>`;
    if(sell){
      if(al||lk){   // 装備中 or ロック中=売れない(保護)
        const onclick=al?`invToast('${al.name}が そうび中。はずすと うれるよ')`:`invToast('ロック中。⭐を タップで うれるよ')`;
        const badge=al?`<span class="eq lock" title="装備中">🔒</span>`:star;   // ロックは⭐(タップで解除)を出す
        return `<button class="gcard locked" style="--rc:${rc};" onclick="${onclick}">${newDot}${badge}${pip}${up}<div class="thumb">${ico}</div><div class="rr">${RARITY[x.rarity].jp}</div><div class="gn">${nm}</div><div class="gm sellg">💰${fmtGold(sellValue(x))}G</div></button>`; }
      const seld=invSellSel.has(sellKey(kind,x.id));
      return `<button class="gcard${seld?' sel':''}" style="--rc:${rc};" onclick="invToggleSell('${kind}',${x.id})">${newDot}${seld?`<span class="sellchk">✓</span>`:star}${pip}${up}<div class="thumb">${ico}</div><div class="rr">${RARITY[x.rarity].jp}</div><div class="gn">${nm}</div><div class="gm sellg">💰${fmtGold(sellValue(x))}G</div></button>`; }
    // view mode: 右上=装備中なら着用者emoji / それ以外は⭐ロックトグル
    const tr=al?`<span class="eq" title="${al.name}">${al.emoji}</span>`:star;
    return `<button class="gcard${al?' worn':''}${lk&&!al?' fav':''}" style="--rc:${rc};" onclick="openDetail('${kind}',${x.id})">${newDot}${tr}${pip}${up}<div class="thumb">${ico}</div><div class="rr">${RARITY[x.rarity].jp}</div><div class="gn">${nm}</div><div class="gm">${gm}</div></button>`;
  }).join('');
  if(shown<total) html+=`<button class="inv-more" onclick="invMore()">もっと見る（のこり ${total-shown}）</button>`;
  return html;
}
/* ── 装備詳細ドロワー(③・比較つき)＝インベントリ/そうび 両画面で共用 ── */
let dwKind=null, dwId=null, dwWhom=null, dwAccSlot=null;
function openDetail(kind,id,whom,accSlot){ dwKind=kind; dwId=id; dwAccSlot=(accSlot==null?null:accSlot);
  if(kind!=='item' && newIds.has(id)){ newIds.delete(id); saveAcc(); }   // ★詳細を開いたら既読化(NEWを外す)
  if(kind==='item'){ dwWhom=null; }
  else { const wc=kind==='gear'?gearEquippedBy(id):accEquippedBy(id); dwWhom=whom||wc||leadCid(); }   // 着用中ならその人/指定/看板キャラ
  renderDrawer(); document.getElementById('dwScrim').classList.add('open'); document.getElementById('detailDrawer').classList.add('open'); }
function closeDetail(){ document.getElementById('dwScrim').classList.remove('open'); document.getElementById('detailDrawer').classList.remove('open'); }
function dwBackdrop(e){ if(e.target.id==='detailDrawer') closeDetail(); }   // ★ワイド中央モーダルで余白(背景)タップ＝閉じる。カードは event.stopPropagation()。狭幅はカードが全面なので発火しない
function dwSetWhom(cid){ dwWhom=cid; dwAccSlot=null; renderDrawer(); }   // 比較相手を変えたら装飾品の指定枠はリセット(自動空き)
function rangeBarHtml(skillId){ const range=SKILL_RANGE[skillId]||'C〜R';
  return `<div class="rangebar">${RARITY_ORDER.map(r=>{ const on=rangeIncludes(range,r); return `<div class="rc${on?' on':''}"${on?` style="background:${RARITY[r].col};"`:''}>${r}</div>`; }).join('')}</div>`; }
function fmtMain(m){ return m.stat==='spd'?(+m.v).toFixed(2):fmt(m.v); }
function cmpRow(label,nowV,nextV,delta){ return `<div class="cmp-row"><span class="cmp-l">${label}</span><span class="cmp-v">${nowV} ▸ ${nextV}</span><span class="delta ${delta.cls}">${delta.txt}</span></div>`; }
function renderDrawer(){ const d=document.getElementById('detailDrawer'); if(!d)return;

    d.innerHTML=`<div class="dw-card" onclick="event.stopPropagation()"><button class="dw-x" onclick="closeDetail()">✕</button>
      <div class="dw-top"><div class="dw-thumb" style="--rc:var(--line);">${it?it.emoji:'🧪'}</div><div class="dw-htxt"><div class="dw-nm">${it?it.name:'どうぐ'}</div><div class="dw-slot">どうぐ ×${it?(items[it.id]||0):0}</div></div></div>

  const icon=isGear?(sk?sk.emoji:'❔'):'◆', nm=isGear?equipName(it):it.base, slotLabel=isGear?it.slot:'装飾品';

    <div class="dw-top"><div class="dw-thumb" style="--rc:${r.col};">${icon}</div>
      <div class="dw-htxt"><div class="dw-rr">［${r.jp}］</div><div class="dw-nm">${nm}</div><div class="dw-slot">${slotLabel}${wc?`・${allyById(wc).emoji}${allyById(wc).name}が装備中`:''}</div></div></div>`;
  if(isGear&&sk){ html+=`<div class="dw-sec"><div class="dw-sectt">スキル</div><div class="dw-skill"><div class="sk-h">${sk.emoji} ${sk.name}<span style="font-size:11px;color:var(--sub);font-weight:400;"> MP${sk.mp}</span></div><div class="sk-note">${sk.note}</div>${sk.fl?`<div class="sk-fl">「${sk.fl}」</div>`:''}</div></div>`; }
  html+=`<div class="dw-sec"><div class="dw-sectt">${isGear?'メインステ':'メインこうか'}</div><div class="dw-main">${isGear?mainText(it):'全コア +'+r.pct+'%'}</div>
    <div class="dw-rate"><div class="rbar2"><i style="width:${itemBarPct(it)}%"></i></div><span class="rnum">評価 ${itemRatingPt(it)}</span></div></div>`;
  const bs=accBonuses(it);
  if(bs.length){ html+=`<div class="dw-sec"><div class="dw-sectt">ボーナス</div><div class="dw-bon">${bs.map(b=>{ const def=BONUS_DEFS[b.t]||{pct:false}; return `<div class="brow${def.pct?' pct':''}"><span class="bi">✦</span><span>${bonusText(b)}</span></div>`; }).join('')}</div></div>`; }
  if(isGear){ html+=`<div class="dw-sec"><div class="dw-sectt">でやすさ（出現レア度）</div>${rangeBarHtml(it.skillId)}</div>`; }
  html+=`<div class="dw-sec"><div class="dw-sectt">だれに つける？</div><div class="dw-whom">${ALLY_DEFS.map(a=>`<button class="${a.id===dwWhom?'on':''}" onclick="dwSetWhom('${a.id}')"><span class="we">${a.emoji}</span>${a.name}</button>`).join('')}</div></div>`;
  html+=`<div class="dw-sec">${dwCompareHtml(it,isGear)}</div>`;
  html+=dwActHtml(it,isGear);
  d.innerHTML='<div class="dw-card" onclick="event.stopPropagation()">'+html+'</div>'; }   // ★ワイドの中央モーダル化で背景クリック閉じ可・狭幅は透明ラッパ
function dwCompareHtml(it,isGear){ const cid=dwWhom, ally=allyById(cid);
  if(isGear){ const cur=gearById((gearEquip[cid]||{})[it.slot]); let rows='';
    if(!cur){ rows=cmpRow(STAT_JP[it.main.stat],'—',fmtMain(it.main),{txt:'NEW',cls:'up'}); }
    else if(cur.id===it.id){ rows=cmpRow(STAT_JP[it.main.stat],fmtMain(it.main),fmtMain(it.main),{txt:'装備中',cls:'eqd'}); }
    else if(cur.main.stat!==it.main.stat){   // ★別ステは数値の大小を出さない＝誤誘導しない(両建て表示)
      rows=cmpRow(STAT_JP[cur.main.stat],fmtMain(cur.main),'0',{txt:'別ステ',cls:'eqd'})+cmpRow(STAT_JP[it.main.stat],'0',fmtMain(it.main),{txt:'別ステ',cls:'eqd'}); }
    else { const dv=it.main.v-cur.main.v, dd=it.main.stat==='spd'?dv.toFixed(2):Math.round(dv);
      rows=cmpRow(STAT_JP[it.main.stat],fmtMain(cur.main),fmtMain(it.main), dv>0?{txt:'▲+'+dd,cls:'up'}:dv<0?{txt:'▼'+dd,cls:'down'}:{txt:'±0',cls:'eqd'}); }
    const skNow=cur?SKILLS[cur.skillId]:null, skNew=SKILLS[it.skillId];   // ★装備=スキル。付け替えで使えるスキルが変わるのを明示
    const skLine=(skNew&&(!cur||cur.skillId!==it.skillId))?`<div class="cmp-sk">スキル: ${skNow?skNow.emoji+skNow.name:'なし'} → <b>${skNew.emoji}${skNew.name}</b></div>`:'';
    const h=cur?`いま ${ally.name} の【${it.slot}】は「${equipName(cur)}」。くらべると：`:`${ally.name} の【${it.slot}】は空き。つければ強くなる！`;
    return `<div class="dw-cmp"><div class="cmp-h">${h}</div>${skLine}${rows}</div>`; }
  const slots=accEquip[cid]||[null,null], filled=slots.filter(s=>s!=null).length;
  const note=slots.indexOf(it.id)>=0?`${ally.name} が装備中。`:(filled<2?`${ally.name} の空きスロットに付くよ。`:`${ally.name} は装飾品が2つ うまってる。1つめと 入れかわるよ。`);
  return `<div class="dw-cmp"><div class="cmp-h">${note}</div></div>`; }
function dwActHtml(it,isGear){ const cid=dwWhom, ally=allyById(cid);
  const worn=isGear?(gearEquip[cid]&&gearEquip[cid][it.slot]===it.id):((accEquip[cid]||[]).indexOf(it.id)>=0);
  let act;
  if(worn){ act=`<button class="dw-cta" disabled>✓ ${ally.name}が装備中</button><button class="dw-rm" onclick="dwUnequip()">✕ ${isGear?'きほんに戻す':'はずす'}</button>`; }
  else { act=`<button class="dw-cta" onclick="dwEquip()">＋ ${ally.name}に そうびする</button>`; }
  return `<div class="dw-act">${act}<button class="dw-rm" style="background:#222d45;border-color:var(--line);color:var(--sub);" onclick="closeDetail()">とじる</button></div>`; }
function equipOnto(cid,kind,id,accSlot){
  if(kind==='gear'){ const g=gearById(id); if(!g)return; const slot=g.slot;
    Object.keys(gearEquip).forEach(c=>GEAR_SLOTS.forEach(s=>{ if(gearEquip[c][s]===id)gearEquip[c][s]=null; }));   // どこに付いてても外して付け替え
    gearEquip[cid][slot]=id; }
  else { Object.keys(accEquip).forEach(c=>accEquip[c].forEach((v,i)=>{ if(v===id)accEquip[c][i]=null; }));
    let si=accSlot; if(si==null){ const arr=accEquip[cid]||[null,null]; si=arr.indexOf(null); if(si<0)si=0; } accEquip[cid][si]=id; }
  newIds.delete(id);   // ★装備したら既読化
  saveAcc(); }
function dwEquip(){ if(dwKind==='item')return; equipOnto(dwWhom,dwKind,dwId,dwAccSlot); dwAccSlot=null; afterDrawerChange(); }
function dwUnequip(){ const cid=dwWhom;
  if(dwKind==='gear'){ if(gearEquip[cid]) GEAR_SLOTS.forEach(s=>{ if(gearEquip[cid][s]===dwId)gearEquip[cid][s]=null; }); }
  else { (accEquip[cid]||[]).forEach((v,i)=>{ if(v===dwId)accEquip[cid][i]=null; }); }
  saveAcc(); afterDrawerChange(); }
function afterDrawerChange(){ renderDrawer();   // ドロワーは開いたまま状態更新(装備中表示に)
  if(gameState==='inventory') renderInventory(); else if(gameState==='equip') renderEquip(); }

/* ── ⚡おまかせ装備(段階4)=4人ぶん最強の組み合わせを自動で選ぶ＝順列爆発を消す決定打 ── */
const ROLE_WEIGHT={   // キャラ別の重視ステ(役割)＝fitnessの重み
  ares:{str:1.6,hp:0.5,def:0.3,spd:0.3,mp:0.2,int:0.1},   // 火力=ちから
  sera:{int:1.6,hp:0.4,def:0.3,spd:0.3,mp:0.3,str:0.1},   // 妨害=かしこさ
  gai: {def:1.3,hp:1.3,str:0.6,spd:0.2,mp:0.2,int:0.1},   // 壁=まもり/HP
  mina:{int:1.4,hp:0.6,def:0.3,spd:0.4,mp:0.3,str:0.1},   // 回復=かしこさ
};
function statNorm(stat,v){ const ref=(MAIN_VAL[stat]&&MAIN_VAL[stat].R)||(BONUS_VAL[stat]&&BONUS_VAL[stat].R)||v||1; return v/ref; }   // R基準=1.0でstat種を超えて比較
function gearFitness(cid,g){ const w=ROLE_WEIGHT[cid]||{}; let f=0;
  if(g.main) f+=statNorm(g.main.stat,g.main.v)*(w[g.main.stat]||0.1);
  accBonuses(g).forEach(b=>{ f+=statNorm(b.t,b.v)*(w[b.t]||0.05)*0.5; }); return f; }
function accFitness(cid,a){ const w=ROLE_WEIGHT[cid]||{}; let f=(RARITY[a.rarity].pct/(RARITY.R.pct||2))*0.8;   // 全コア+%=汎用
  accBonuses(a).forEach(b=>{ f+=statNorm(b.t,b.v)*(w[b.t]||0.05)*0.5; }); return f; }
function autoEquipPlan(){   // 貪欲割当=(キャラ,枠,装備)のfitness降順で 1装備1人・1枠1個 を埋める(役割ロックなしでも重み表で成立)
  const plan={}; ALLY_DEFS.forEach(d=>plan[d.id]={gear:{},acc:[null,null]});
  const usedG=new Set(); const ge=[];
  ALLY_DEFS.forEach(d=>GEAR_SLOTS.forEach(slot=>gearInv.filter(g=>g.slot===slot).forEach(g=>ge.push({cid:d.id,slot,id:g.id,fit:gearFitness(d.id,g)}))));
  ge.sort((a,b)=>b.fit-a.fit);
  ge.forEach(e=>{ if(plan[e.cid].gear[e.slot]!=null||usedG.has(e.id))return; plan[e.cid].gear[e.slot]=e.id; usedG.add(e.id); });
  const usedA=new Set(); const ae=[];
  ALLY_DEFS.forEach(d=>accInv.forEach(a=>ae.push({cid:d.id,id:a.id,fit:accFitness(d.id,a)})));
  ae.sort((a,b)=>b.fit-a.fit);
  ae.forEach(e=>{ const arr=plan[e.cid].acc; const free=arr.indexOf(null); if(free<0||usedA.has(e.id))return; arr[free]=e.id; usedA.add(e.id); });
  return plan; }
function autoEquipApplyNoSave(plan){ ALLY_DEFS.forEach(d=>{ GEAR_SLOTS.forEach(s=>gearEquip[d.id][s]=plan[d.id].gear[s]||null); accEquip[d.id]=[plan[d.id].acc[0]||null, plan[d.id].acc[1]||null]; }); }
function charPowerNum(cid){ const ps=previewStats(cid); return Math.round(ps.str+ps.int+ps.def+ps.hp/10); }   // ざっくり戦力(プレビュー表示用)
let autoPlan=null;
function showAutoEquip(){ const plan=autoEquipPlan();
  const before={}; ALLY_DEFS.forEach(d=>before[d.id]=charPowerNum(d.id));
  const sg=JSON.parse(JSON.stringify(gearEquip)), sa=JSON.parse(JSON.stringify(accEquip));   // 一時適用→計測→復元(保存しない)
  autoEquipApplyNoSave(plan);
  const after={}; ALLY_DEFS.forEach(d=>after[d.id]=charPowerNum(d.id));
  gearEquip=sg; accEquip=sa; autoPlan=plan;
  const rows=ALLY_DEFS.map(d=>{ const b=before[d.id],a=after[d.id],dv=a-b,pct=b>0?Math.round(dv/b*100):(a>0?100:0);
    return `<div class="ae-row"><span class="ae-c">${d.emoji} ${d.name}<small>${d.role}</small></span><span class="ae-v">${fmt(b)} ▸ <b>${fmt(a)}</b></span><span class="delta ${dv>0?'up':dv<0?'down':'eqd'}">${dv>0?'▲+'+pct+'%':dv<0?'▼'+pct+'%':'±0'}</span></div>`; }).join('');
  document.getElementById('autoModal').innerHTML=`<div class="info-card ae-card" onclick="event.stopPropagation()"><div class="info-ttl">⚡ おまかせ装備</div>
    <div class="ae-sub">いまの もちものから、4人ぶん いちばん 強くなる 組み合わせを じどうで えらぶよ。</div>
    <div class="ae-list">${rows}</div>
    <div class="ae-note">⭐ロックした そうびも 強ければ つかうよ。気に入らなければ「やめる」。</div>
    <div class="dw-act"><button class="dw-cta" onclick="applyAutoEquip()">これにする</button><button class="dw-rm" style="background:#222d45;border-color:var(--line);color:var(--sub);" onclick="hideAutoEquip()">やめる</button></div></div>`;
  document.getElementById('autoModal').classList.add('show'); }
function hideAutoEquip(){ document.getElementById('autoModal').classList.remove('show'); autoPlan=null; autoPlanOne=null; autoPlanOneCid=null; }
function applyAutoEquip(){ if(autoPlan){ autoEquipApplyNoSave(autoPlan); saveAcc(); } hideAutoEquip();
  if(gameState==='equip')renderEquip(); else if(gameState==='inventory')renderInventory(); else if(gameState==='home')renderHome(); }
// ── ⚡個人おまかせ「この子におすすめ」(オーナー要望④)=1人だけ最適化。他キャラ装備中は占有除外=余り物から(奪わない) ──
let autoPlanOne=null, autoPlanOneCid=null;
function autoEquipOnePlan(cid){
  const occG=new Set(); Object.keys(gearEquip).forEach(c=>{ if(c!==cid) GEAR_SLOTS.forEach(s=>{ if(gearEquip[c][s]!=null)occG.add(gearEquip[c][s]); }); });
  const occA=new Set(); Object.keys(accEquip).forEach(c=>{ if(c!==cid) (accEquip[c]||[]).forEach(id=>{ if(id!=null)occA.add(id); }); });
  const plan={gear:{},acc:[null,null]};
  GEAR_SLOTS.forEach(slot=>{ const cands=gearInv.filter(g=>g.slot===slot&&!occG.has(g.id)).sort((a,b)=>gearFitness(cid,b)-gearFitness(cid,a)); plan.gear[slot]=cands.length?cands[0].id:null; });
  const acands=accInv.filter(a=>!occA.has(a.id)).sort((a,b)=>accFitness(cid,b)-accFitness(cid,a));
  plan.acc=[acands[0]?acands[0].id:null, acands[1]?acands[1].id:null];
  return plan; }
function showAutoEquipOne(cid){ const d=allyById(cid), plan=autoEquipOnePlan(cid);
  const before=charPowerNum(cid);
  const sg=JSON.parse(JSON.stringify(gearEquip)), sa=JSON.parse(JSON.stringify(accEquip));   // 一時適用→計測→復元(保存しない)
  GEAR_SLOTS.forEach(s=>gearEquip[cid][s]=plan.gear[s]||null); accEquip[cid]=[plan.acc[0]||null,plan.acc[1]||null];
  const after=charPowerNum(cid);
  gearEquip=sg; accEquip=sa; autoPlanOne=plan; autoPlanOneCid=cid;
  const dv=after-before, pct=before>0?Math.round(dv/before*100):(after>0?100:0);
  document.getElementById('autoModal').innerHTML=`<div class="info-card ae-card" onclick="event.stopPropagation()"><div class="info-ttl">⚡ ${d.emoji}${d.name}におすすめ</div>
    <div class="ae-sub">いまの もちものから、<b>${d.name}</b>が いちばん 強くなる そうびを えらぶよ。（ほかの子が つけている物は そのまま）</div>
    <div class="ae-list"><div class="ae-row"><span class="ae-c">${d.emoji} ${d.name}<small>${d.role}</small></span><span class="ae-v">${fmt(before)} ▸ <b>${fmt(after)}</b></span><span class="delta ${dv>0?'up':dv<0?'down':'eqd'}">${dv>0?'▲+'+pct+'%':dv<0?'▼'+pct+'%':'±0'}</span></div></div>
    <div class="ae-note">${dv>0?'今より強くなるよ。':dv<0?'今のほうが強いかも。':'今と同じくらい。'} 気に入らなければ「やめる」。</div>
    <div class="dw-act"><button class="dw-cta" onclick="applyAutoEquipOne()">これにする</button><button class="dw-rm" style="background:#222d45;border-color:var(--line);color:var(--sub);" onclick="hideAutoEquip()">やめる</button></div></div>`;
  document.getElementById('autoModal').classList.add('show'); }
function applyAutoEquipOne(){ if(autoPlanOne&&autoPlanOneCid){ const cid=autoPlanOneCid;
    GEAR_SLOTS.forEach(s=>gearEquip[cid][s]=autoPlanOne.gear[s]||null); accEquip[cid]=[autoPlanOne.acc[0]||null,autoPlanOne.acc[1]||null]; saveAcc(); }

/* ===================== §12 長押しで説明（フレーバー＋実効果） ===================== */
// 画面の説明文(薄い小文字)は廃止し、要素(スキル/アイテム/コマンド/状態異常アイコン)を長押し→フレーバー＋実効果を表示。
const CMD_INFO = {
  'cmd:attack':{title:'⚔️ 攻撃', fl:'武器をふりかぶる。', ef:'問題が出る。正解で対象に通常攻撃。正解するとMPも少し回復する。'},
  'cmd:defend':{title:'🛡️ 防御', fl:'身構えて備える。', ef:'問題なし。次に受ける敵の攻撃を大きく軽減し、敵に狙われやすくなる。'},
  'cmd:skill':{title:'✨ スキル', fl:'技を選ぶ。', ef:'MPを使って技を出す。技ごとに「要・問題」か「即発動」かが違う。'},
  'cmd:item':{title:'🎒 アイテム', fl:'道具を使う。', ef:'行動ゲージを消費して使う。正解すると消費が30%に軽くなる。'},
};
const INFO = {};
function buildInfo(){
  Object.keys(SKILLS).forEach(id=>{ const s=SKILLS[id]; INFO['skill:'+id]={title:s.emoji+' '+s.name+'（MP'+s.mp+'）', fl:s.fl||'', ef:s.note||''}; });
  ITEM_DEFS.forEach(it=>{ INFO['item:'+it.id]={title:it.emoji+' '+it.name, fl:it.fl||'', ef:it.note||''}; });
  Object.keys(AILMENTS).forEach(t=>{ const a=AILMENTS[t]; INFO['ail:'+t]={title:a.emoji+' '+a.jp+'（状態異常）', fl:a.fl||'', ef:a.ef||''}; });
  Object.assign(INFO, CMD_INFO);
}
function showInfo(key){ let d;
  if(key.indexOf('skill:')===0){ const s=SKILLS[key.slice(6)]; if(!s)return;   // スキルは現在のレベル/MPを動的に表示
    const lv=skLevelable(s)?('Lv'+skL(s).lv):'レベル—';
    d={title:s.emoji+' '+s.name+'（'+lv+'・MP'+skMp(s)+'）', fl:s.fl, ef:s.note+'<br><span style="color:var(--sub);font-size:12px;">🎚 '+skAxisHint(s)+'</span>'}; }
  else d=INFO[key];
  if(!d)return; const m=document.getElementById('infoModal');
  m.innerHTML=`<div class="info-card"><div class="info-ttl">${d.title}</div>${d.fl?`<div class="info-fl">「${d.fl}」</div>`:''}<div class="info-ef">${d.ef}</div><div class="info-close">タップで閉じる</div></div>`;
  m.classList.add('show'); }
function hideInfo(){ document.getElementById('infoModal').classList.remove('show'); }
// 長押し(450ms)で説明。指が動いたら/離したらキャンセル。長押し直後のクリックは握りつぶす(本来の操作の誤発動を防ぐ)。
let _lpTimer=null, _lpFired=false, _lpXY=null;
function _lpDown(e){ const el=e.target.closest('[data-info]'); if(!el)return; _lpXY={x:e.clientX,y:e.clientY};
  _lpTimer=setTimeout(()=>{ _lpTimer=null; _lpFired=true; showInfo(el.getAttribute('data-info')); }, 450); }
function _lpEnd(){ if(_lpTimer){ clearTimeout(_lpTimer); _lpTimer=null; } }
function _lpMove(e){ if(_lpTimer&&_lpXY&&(Math.abs(e.clientX-_lpXY.x)>10||Math.abs(e.clientY-_lpXY.y)>10)){ clearTimeout(_lpTimer); _lpTimer=null; } }
document.addEventListener('pointerdown', _lpDown, true);
document.addEventListener('pointerup', _lpEnd, true);
document.addEventListener('pointercancel', _lpEnd, true);
document.addEventListener('pointermove', _lpMove, true);
document.addEventListener('click', (e)=>{ if(_lpFired){ _lpFired=false; e.stopPropagation(); e.preventDefault(); } }, true);
document.addEventListener('contextmenu', (e)=>{ const el=e.target.closest('[data-info]'); if(el){ e.preventDefault(); showInfo(el.getAttribute('data-info')); } });

/* ===== あいことばゲート(β・ソフトな鍵=ソースに見えるので本当の鍵ではない) ===== */
const PG_KEY='rika2_demo_pass_ok', PG_WORD='rikarika';
function pgCheck(){ const v=(document.getElementById('pgInput').value||'').trim().toLowerCase();
  if(v===PG_WORD){ try{ localStorage.setItem(PG_KEY,'1'); }catch(e){} document.getElementById('passgate').classList.add('hide'); }
  else { document.getElementById('pgErr').textContent='あいことばが ちがうみたい'; document.getElementById('pgInput').value=''; document.getElementById('pgInput').focus(); } }
function pgInit(){ let ok=false; try{ ok=localStorage.getItem(PG_KEY)==='1'; }catch(e){}
  if(ok){ document.getElementById('passgate').classList.add('hide'); }
  else { setTimeout(()=>{ const el=document.getElementById('pgInput'); if(el)el.focus(); },80); } }
