<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>戦国トレーナー 〜天下統一への道〜</title>
<style>
/* ============================================================
   戦国トレーナー β — パワプロ/ウマ娘型 歴史育成SLG
   §S1 ベース・テーマ / §S2 タイトル / §S3 育成メイン
   §S4 モーダル共通・クイズ / §S5 合戦 / §S6 結果・殿堂
   設計書: ../PLAN_SENGOKU_IKUSEI.md
   ============================================================ */
/* ===== §S1 ベース ===== */
:root{
  --ink:#2b1d0e; --paper:#f5ead3; --paper2:#efe0c0; --line:#c9b282;
  --indigo:#1d2438; --indigo2:#2a3450; --gold:#d8a823; --gold2:#f3cf5d;
  --red:#b3362a; --green:#2e8b57; --blue:#3a6ea5; --purple:#7a4f9d;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
body{
  min-height:100vh; color:var(--ink);
  font-family:"Yu Gothic","Hiragino Kaku Gothic ProN","Meiryo",system-ui,sans-serif;
  background:linear-gradient(180deg,#141a2c 0%,#1d2438 30%,#2a3450 100%);
  user-select:none; -webkit-user-select:none;
}
.serif{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;}
.wrap{width:min(520px,100%); margin:0 auto; padding:10px 12px 24px;}
button{font:inherit; color:inherit; cursor:pointer; border:none; background:none;}
.btn{display:block; width:100%; padding:14px; border-radius:14px; font-weight:800; font-size:17px; color:var(--ink);
  background:var(--paper); border:3px solid var(--line); box-shadow:0 4px 0 rgba(0,0,0,.25); transition:transform .06s;}
.btn:active{transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,.25);}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold)); border-color:#a87d12; color:#3a2a05;}
.btn.dim{opacity:.45; pointer-events:none;}
.note{font-size:12.5px; color:#6b5a3e; line-height:1.5;}
.scr{display:none;} .scr.on{display:block;}

/* ===== §S2 タイトル ===== */
#scr-title{text-align:center; color:var(--paper);}
.titleCrest{font-size:64px; margin-top:36px; filter:drop-shadow(0 4px 8px rgba(0,0,0,.5));}
.titleName{font-size:clamp(34px,9vw,46px); font-weight:900; letter-spacing:.12em; margin:6px 0 2px;
  background:linear-gradient(180deg,#f7e7ae,var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent;
  text-shadow:none;}
.titleSub{font-size:15px; letter-spacing:.3em; color:#cdbb88; margin-bottom:18px;}
.titlePolicy{margin:14px auto 18px; width:min(420px,94%); background:rgba(245,234,211,.1);
  border:1px solid rgba(216,168,35,.45); border-radius:12px; padding:10px 12px; font-size:13px; line-height:1.7; color:#e8dcbb; text-align:left;}
.titleBtns{width:min(360px,92%); margin:0 auto; display:grid; gap:10px;}
.verTag{margin-top:18px; font-size:11px; color:#7f8aa8;}

/* ===== §S3 育成メイン ===== */
.board{background:var(--paper); border-radius:18px; border:3px solid var(--line); overflow:hidden;}
.gHead{display:flex; align-items:center; gap:10px; padding:7px 10px 7px 12px;
  background:linear-gradient(180deg,var(--indigo2),var(--indigo)); color:var(--paper);}
.gYear{font-weight:900; font-size:18px; border:2px solid var(--gold); border-radius:10px;
  padding:1px 10px; background:rgba(243,207,93,.12); color:var(--gold2);}
.gTurn{font-weight:800; font-size:14px; color:#bfc8e0; flex:1;}
.gKoku{font-weight:800; font-size:14px; color:var(--gold2);}
.gPause{font-size:18px; padding:2px 8px; border-radius:8px; border:1px solid #5a647f; color:#bfc8e0;}
/* 中央ステージ: ビジュアル主役の大型表示（ウマ娘式・2026-06-12 生徒FB「写真枠が小さい」対応。
   絵は当面絵文字。将来ここを立ち絵画像に差し替える */
.stage{position:relative; height:212px; overflow:hidden;
  background:linear-gradient(180deg,#8fc0e6 0%,#cfe2f2 45%,#ece9d4 80%,var(--paper) 100%);}
.stageDeco{position:absolute; top:8px; left:12px; right:12px; display:flex; justify-content:space-between;
  font-size:24px; filter:drop-shadow(0 2px 2px rgba(0,0,0,.15));}
.stageCastle{position:absolute; left:12px; bottom:46px; text-align:center;}
.stageCastle .ce{display:block; line-height:1; transition:filter .4s;}
.stageCastle.t1 .ce{font-size:46px;} .stageCastle.t2 .ce{font-size:56px;} .stageCastle.t3 .ce{font-size:66px;}
.stageCastle.t4 .ce{font-size:76px; filter:drop-shadow(0 2px 6px rgba(0,0,0,.3));}
.stageCastle.t5 .ce{font-size:84px; filter:drop-shadow(0 0 12px rgba(243,207,93,.95)) saturate(1.7);}
.castleLbl{font-size:11px; font-weight:800; color:#4a5a44; background:rgba(245,234,211,.78); border-radius:999px; padding:1px 7px; margin-top:3px;}
.stageChar{position:absolute; left:55%; bottom:40px; transform:translateX(-50%); font-size:108px; line-height:1;
  filter:drop-shadow(0 6px 7px rgba(0,0,0,.3)); animation:charSway 3.2s ease-in-out infinite;}
.stageChar img{display:block; height:165px; width:auto;}
.stageChar img.hurt{filter:grayscale(.75) brightness(.9);}
.stageChar .injBadge{position:absolute; top:-4px; right:-16px; font-size:30px;}
.stageCastle .ce img{display:block; margin:0 auto; width:auto;}
.stageCastle.t1 .ce img{height:62px;} .stageCastle.t2 .ce img{height:78px;} .stageCastle.t3 .ce img{height:94px;}
.stageCastle.t4 .ce img{height:110px;}
.stageCastle.t5 .ce img{height:120px; filter:drop-shadow(0 0 12px rgba(243,207,93,.9));}
@keyframes charSway{0%,100%{margin-bottom:0}50%{margin-bottom:7px}}
.stageName{position:absolute; left:0; right:0; bottom:0; display:flex; align-items:center; gap:8px; padding:16px 14px 6px;
  background:linear-gradient(180deg,transparent,rgba(245,234,211,.96) 62%);}
.stageName .charName{font-size:19px;}
/* 勢力図: ミニ版は立ち絵の右下・タップで拡大（2026-06-12 生徒FB「今どこの領地か見たい」） */
.miniMapBtn{position:absolute; right:8px; bottom:44px; padding:0; text-align:center;}
.miniMapBtn .mlbl{display:block; font-size:9.5px; font-weight:800; color:#4a5a44;
  background:rgba(245,234,211,.78); border-radius:999px; padding:0 6px; margin-top:2px;}
.mapGrid{display:grid; grid-template-columns:repeat(6,1fr); gap:3px;
  background:#d4e5f0; border:2px solid var(--line); border-radius:10px; padding:8px;}
.mapCell{min-height:36px; border-radius:6px; background:#cfc8b4; display:flex; align-items:center; justify-content:center;
  font-size:12.5px; font-weight:800; color:#6f6648; line-height:1.1;}
.mapCell.own{background:#3a6ea5; color:#fff;}
.mapCell.ally{background:#2e8b57; color:#fff;}
.mapCell.war{box-shadow:0 0 0 2.5px var(--red);}
.mapGrid.mini{width:104px; padding:4px; gap:2px; border-radius:8px; opacity:.96; box-shadow:0 2px 5px rgba(0,0,0,.25);}
.mapGrid.mini .mapCell{min-height:11px; font-size:8px; border-radius:2px;}
.mapGrid.mini .mapCell.war{box-shadow:0 0 0 1.5px var(--red);}
.charRow{display:flex; gap:10px; padding:4px 12px 4px; align-items:center;}
.charInfo{flex:1;}
.charName{font-weight:900; font-size:17px;}
.moodTag{display:inline-block; margin-left:8px; font-size:12px; font-weight:800; padding:2px 8px; border-radius:999px; background:#ddd;}
.barWrap{margin-top:5px;}
.barLbl{display:flex; justify-content:space-between; font-size:11px; font-weight:700; color:#7a6845;}
.bar{height:13px; background:#ddd0b0; border-radius:8px; overflow:hidden; border:1px solid var(--line);}
.bar i{display:block; height:100%; border-radius:8px; background:linear-gradient(90deg,#7fd49a,#2e8b57); transition:width .3s;}
.bar i.low{background:linear-gradient(90deg,#f0b35e,#d96f30);}
.bar i.crit{background:linear-gradient(90deg,#e0533d,#b3362a);}
/* ステータスは下部1列×5枠（4ステ＋スキルP）。ランクと数値を横並び（ウマ娘式・2026-06-12 生徒FB） */
.statGrid{display:grid; grid-template-columns:repeat(5,1fr); gap:5px; padding:6px 10px 2px;}
#r-stats{grid-template-columns:repeat(4,1fr);}
.stat{display:flex; flex-direction:column; align-items:center; background:var(--paper2); border-radius:10px; padding:3px 2px 4px;}
.stat .sl{font-size:11px; font-weight:800; color:#7a6845;}
.stat .srow{display:flex; align-items:baseline; gap:3px;}
.stat .srk{font-size:19px; font-weight:900; line-height:1.15;}
.stat .sv2{font-size:11px; font-weight:800; color:#7a6845;} .stat .sv2 small{font-weight:600; color:#a09068;}
.rkF{color:#9aa0a6;} .rkE{color:#7f8aa8;} .rkD{color:#3a6ea5;} .rkC{color:#2e8b57;}
.rkB{color:#6b8e23;} .rkA{color:#d8a823;} .rkS{color:#e0533d;}
.rkSS{background:linear-gradient(90deg,#e0533d,#d8a823,#7a4f9d); -webkit-background-clip:text; background-clip:text; color:transparent;}
.stat .sv.up{color:var(--green); animation:pop .5s;}
@keyframes pop{0%{transform:scale(1.6)}100%{transform:scale(1)}}
/* コマンドは3×2・文字のみのシンプル表記（2026-06-12 生徒FBで絵文字・説明を削除） */
.cmdArea{padding:6px 10px 10px;}
.cmdGrid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
.cmd{position:relative; padding:15px 4px; border-radius:14px; border:3px solid var(--line);
  background:#fffdf4; text-align:center; box-shadow:0 3px 0 rgba(0,0,0,.12); transition:transform .06s;
  font-weight:900; font-size:15.5px;}
.cmd:active{transform:translateY(2px);}
.cmd.dim{opacity:.45; pointer-events:none;}
.cmd.urgent{animation:glow 1.2s infinite alternate; border-color:var(--red);}
.cmd .mates{position:absolute; top:-10px; right:-4px; display:flex; gap:1px;}
.cmd .mates span{font-size:13px; background:var(--paper); border:2px solid var(--line); border-radius:999px;
  width:22px; height:22px; display:flex; align-items:center; justify-content:center;}
.cmd .mates span.fr{border-color:var(--gold); background:#fff3c8; box-shadow:0 0 8px 2px rgba(243,207,93,.9); animation:glow 1.2s infinite alternate;}
@keyframes glow{from{box-shadow:0 0 4px 1px rgba(243,207,93,.6)}to{box-shadow:0 0 10px 3px rgba(243,207,93,1)}}
.cmd.rest{background:#eef6ff;} .cmd.trip{background:#f3ecff;}
.cmd.train{background:#fff3c8; border-color:var(--gold);}
.cmd.skill{background:#f3ecff;} .cmd.care{background:#eafbe9;} .cmd.skirmish{background:#ffeede;}
/* 鍛錬選択ポップアップ（家臣がいる選択肢は輝く） */
.trainOpt{display:flex; align-items:center; gap:10px; width:100%; padding:10px 12px; border-radius:12px;
  border:3px solid var(--line); background:#fffdf4; text-align:left; box-shadow:0 3px 0 rgba(0,0,0,.12); transition:transform .06s;}
.trainOpt:active{transform:translateY(2px);}
.trainOpt .toIcon{font-size:26px;}
.trainOpt .toBody{flex:1; line-height:1.35;} .trainOpt .toBody b{font-size:15.5px;}
.trainOpt .toBody small{display:block; font-size:11.5px; color:#7a6845;}
.trainOpt .toMates{display:flex; gap:2px;}
.trainOpt .toMates span{font-size:15px; background:var(--paper); border:2px solid var(--line); border-radius:999px;
  width:26px; height:26px; display:flex; align-items:center; justify-content:center;}
.trainOpt .toMates span.fr{border-color:var(--gold); background:#fff3c8; animation:glow 1.2s infinite alternate;}
.trainOpt.glowOpt{border-color:var(--gold); background:#fff8dc;
  box-shadow:0 0 10px 2px rgba(243,207,93,.65), 0 3px 0 rgba(0,0,0,.12);}
.subRow{display:flex; gap:8px; margin-top:8px;}
.subBtn{flex:1; padding:8px; border-radius:10px; border:2px solid var(--line); background:var(--paper2); font-size:12.5px; font-weight:700;}
/* 側近: ◯枠にアイコンのみ＋下に絆ゲージ（2026-06-12 生徒FBで名前省略） */
.bondRow{display:flex; gap:14px; padding:4px 12px 8px; justify-content:center;}
.bondC{position:relative; width:46px; height:46px; border-radius:999px; display:flex; align-items:center; justify-content:center;
  font-size:24px; background:var(--paper2); border:3px solid #cdbfa0;}
.bondC i{position:absolute; left:5px; right:5px; bottom:-2px; height:5px; border-radius:3px; background:#ddd0b0; overflow:hidden;}
.bondC i b{display:block; height:100%; background:linear-gradient(90deg,#f5b0c0,#e0533d);}
.bondC.mx{border-color:var(--gold); background:#fff3c8; box-shadow:0 0 8px 2px rgba(243,207,93,.7);}
/* 次の歴史イベント（体力バーの上） */
.nextEv2{font-size:11.5px; font-weight:800; color:#8a6605; margin-bottom:3px;}

/* ===== §S4 モーダル共通・クイズ ===== */
.ovl{position:fixed; inset:0; z-index:40; background:rgba(10,14,26,.78); display:none;
  align-items:flex-start; justify-content:center; overflow-y:auto; padding:18px 10px 40px;}
.ovl.on{display:flex;}
.box{width:min(500px,100%); background:var(--paper); border-radius:18px; border:3px solid var(--line);
  padding:16px; animation:rise .25s ease;}
@keyframes rise{from{transform:translateY(24px); opacity:0}to{transform:none; opacity:1}}
.box h2{margin:0 0 8px; font-size:20px;}
.evYear{font-size:13px; font-weight:800; color:var(--red); letter-spacing:.15em;}
/* イベントの絵文字アート（画像は将来差し替え・2026-06-11 ユーザー要望） */
.evArt{text-align:center; font-size:52px; line-height:1.25; letter-spacing:.1em; padding:10px 0 6px;
  background:linear-gradient(180deg,var(--paper2),transparent); border-radius:12px; margin:6px 0;}
.evText{font-size:15px; line-height:1.85; white-space:pre-wrap; margin:8px 0 14px;}
.fxLine{display:none; margin:-4px 0 12px; padding:8px 12px; border-radius:10px; background:#e8f6ec;
  border:2px solid var(--green); font-size:14px; font-weight:800; color:#1d6b40; line-height:1.7;}
.fxLine.on{display:block; animation:rise .3s ease;}
.qBadge{display:inline-block; font-size:12px; font-weight:800; color:#fff; background:var(--blue);
  border-radius:999px; padding:3px 12px; margin-bottom:8px;}
.qBadge.buyu{background:var(--red);} .qBadge.chiryaku{background:var(--blue);}
.qBadge.seiji{background:var(--green);} .qBadge.ninbo{background:var(--purple);}
.qHint{font-size:12px; color:#6b5a3e; background:var(--paper2); border-radius:8px; padding:6px 10px; margin-bottom:10px;}
.qText{font-size:16px; font-weight:700; line-height:1.8; white-space:pre-wrap; margin-bottom:12px;}
.choices{display:grid; gap:8px;}
.choice{padding:12px 12px; border:3px solid var(--line); border-radius:12px; background:#fffdf4;
  font-size:15px; font-weight:700; text-align:left; line-height:1.5; transition:transform .06s;}
.choice:active{transform:scale(.985);}
.choice.good{background:#d7f5e1; border-color:var(--green);}
.choice.bad{background:#fbdcd5; border-color:var(--red); animation:shake .3s;}
.choice.lock{pointer-events:none;}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.descBox{margin-top:12px; background:#fff8e4; border:2px solid var(--gold); border-radius:12px; padding:10px 12px;
  font-size:14px; line-height:1.75;}
.descBox b{color:#8a6605;}
.resLine{margin-top:12px; font-size:15.5px; font-weight:800; text-align:center; line-height:1.7; white-space:pre-wrap;}
.resLine .big{font-size:21px; color:var(--green);}
.resLine .fail{color:var(--red);}
.pushRow{display:grid; gap:8px; margin-top:12px;}
.pushNote{font-size:12px; color:#6b5a3e; text-align:center;}

/* ===== §S5 合戦絵巻（2026-06-12 生徒FB対応。設計: DESIGN_SENGOKU_BATTLE_V2.md） ===== */
.bField{position:relative; background:linear-gradient(180deg,#3a2430,#1d1622); border-radius:14px;
  padding:10px 12px 12px; color:var(--paper); margin:8px 0 10px; overflow:hidden; cursor:pointer;}
.bSky{text-align:center; font-size:12.5px; font-weight:800; color:#cdbb88; margin-bottom:6px;}
.bArmies{display:flex; align-items:center; justify-content:space-between; gap:6px;}
.bSide{text-align:left;} .bSide.foe{text-align:right;}
.bName{font-weight:900; font-size:13px;} .bName.en{color:#ff9d8a;}
.bHP{font-size:21px; font-weight:900; font-variant-numeric:tabular-nums;}
.bSide.foe .bHP{color:#ff9d8a;}
.bVsTag{font-size:14px; font-weight:900; color:var(--gold2);}
.bStrip{display:flex; align-items:center; justify-content:space-between; font-size:20px; margin:6px 0 4px; min-height:28px;}
.bStrip .bUnits{filter:drop-shadow(0 2px 3px rgba(0,0,0,.5)); letter-spacing:-3px;}
.bStrip .bUnits.foe{transform:scaleX(-1);}
.bClash{font-size:22px; animation:clashPulse 1.6s infinite;}
@keyframes clashPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25) rotate(10deg)}}
.btBar{height:14px; background:linear-gradient(90deg,#ff8d76,#b3362a); border-radius:9px; overflow:hidden; border:1px solid #5a4458;}
.btBar .me{display:block; height:100%; background:linear-gradient(90deg,#7fb6ff,#3a6ea5); border-right:3px solid #ffe9a8; transition:width .8s;}
/* 結果エフェクト4階調: 会心=大シェイク+フラッシュ / 有効=中 / 不発=小 / しくじり=被弾 */
.bField.fxBig{animation:shakeBig .6s;} .bField.fxMid{animation:shakeMid .45s;}
.bField.fxSmall{animation:dimSmall .5s;} .bField.fxBad{animation:shakeBad .5s;}
@keyframes shakeBig{0%,100%{transform:none}15%{transform:translate(-7px,3px) rotate(-1deg)}30%{transform:translate(7px,-3px) rotate(1deg)}45%{transform:translate(-6px,2px)}60%{transform:translate(6px,-2px)}75%{transform:translate(-3px,1px)}}
@keyframes shakeMid{0%,100%{transform:none}25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-2px,1px)}}
@keyframes dimSmall{0%,100%{filter:none}50%{filter:brightness(.7)}}
@keyframes shakeBad{0%,100%{transform:none}25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.bField.fxBig::after{content:''; position:absolute; inset:0; background:rgba(255,235,160,.45); animation:flashOut .6s forwards; pointer-events:none;}
@keyframes flashOut{from{opacity:1}to{opacity:0}}
.bCutin{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none;
  font-size:36px; font-weight:900; color:#fff3c8; letter-spacing:.04em;
  text-shadow:0 0 22px rgba(243,207,93,1), 0 0 6px rgba(255,255,255,.9), 0 3px 6px rgba(0,0,0,.7);
  opacity:0; transform:scale(.6); z-index:3;}
/* 会心カットイン: 集中線バースト＋スラムイン（演出強化第1弾・2026-06-14夜） */
.bCutin.on{animation:cutinSlam 1.3s forwards;}
.bCutin.on::before{content:''; position:absolute; inset:-40%; z-index:-1;
  background:repeating-conic-gradient(rgba(255,235,160,.30) 0deg 5deg, transparent 5deg 13deg);
  mask:radial-gradient(circle, transparent 18%, #000 42%, transparent 72%);
  -webkit-mask:radial-gradient(circle, transparent 18%, #000 42%, transparent 72%);
  animation:burstSpin 1.3s ease-out forwards;}
@keyframes cutinSlam{0%{opacity:0; transform:scale(2.6) rotate(-5deg)}22%{opacity:1; transform:scale(.92) rotate(1.5deg)}36%{transform:scale(1.08)}50%{transform:scale(1)}82%{opacity:1}100%{opacity:0; transform:scale(1.06)}}
@keyframes burstSpin{0%{opacity:0; transform:rotate(0) scale(.5)}18%{opacity:1}100%{opacity:0; transform:rotate(35deg) scale(1.3)}}
.bCaster{display:flex; justify-content:space-between; align-items:center; font-size:12px; font-weight:800; color:#8a6605;}
.bCaster .bFastTip{font-weight:600; color:#9a8660; font-size:11px;}
.bLog{min-height:70px; font-size:13.5px; line-height:1.65; background:#fff8e4; border:2px solid var(--gold);
  border-radius:10px; padding:8px 10px; margin:4px 0 10px;}
.bLog div{opacity:.5;} .bLog div.new{opacity:1; font-weight:700; animation:rise .3s;}
/* 采配ボタン（堅実/博打/搦め手のチップつき・参照ステ数値明記） */
.saihai{display:flex; align-items:center; gap:10px; width:100%; padding:9px 12px; border-radius:12px;
  border:3px solid var(--line); background:#fffdf4; text-align:left; box-shadow:0 3px 0 rgba(0,0,0,.12); transition:transform .06s;}
.saihai:active{transform:translateY(2px);}
.saihai .ti{font-size:22px;}
.saihai .tb{flex:1; line-height:1.3;} .saihai .tb b{font-size:14.5px;}
.saihai .tb small{display:block; font-size:11px; color:#7a6845;}
.saihai .chip{font-size:11px; font-weight:800; color:#fff; border-radius:999px; padding:3px 9px; white-space:nowrap;}

/* ===== §S6 結果・殿堂 ===== */
.rankBig{text-align:center; margin:8px 0;}
.rankBig .rk{font-size:52px; font-weight:900; letter-spacing:.08em;
  background:linear-gradient(180deg,#f7e7ae,var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent;}
.rankBig .rsub{font-size:13px; color:#7a6845; font-weight:700;}
.cardList{display:grid; gap:8px; margin-top:10px;}
.hallCard{display:flex; gap:10px; align-items:center; background:var(--paper2); border:2px solid var(--line); border-radius:12px; padding:8px 12px;}
.hallCard .hi{font-size:30px;} .hallCard .hb{flex:1; font-size:12.5px; line-height:1.55;}
.hallCard .hb b{font-size:14.5px;}
.hallCard .hr{font-weight:900; font-size:20px; color:#a87d12;}
.bookItem{background:var(--paper2); border:2px solid var(--line); border-radius:12px; padding:10px 12px; font-size:13.5px; line-height:1.7;}
.bookItem b{color:var(--red);}
.toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%); z-index:60;
  background:rgba(30,22,10,.92); color:#ffe9a8; font-weight:800; font-size:14px;
  padding:10px 18px; border-radius:999px; border:1px solid var(--gold); display:none; white-space:nowrap;}
.toast.on{display:block; animation:tin 2.4s forwards;}
@keyframes tin{0%{opacity:0; transform:translate(-50%,12px)}10%,80%{opacity:1; transform:translate(-50%,0)}100%{opacity:0}}
.closeX{position:sticky; top:0; float:right; font-size:20px; font-weight:900; color:#9a8660; padding:0 4px;}

/* ===== 画像第2便（2026-06-14配線）: 側近の顔・佐助・家紋・タイトル絵・戦場背景 ===== */
.titleArt{display:block; width:min(300px,82%); margin:26px auto 0; border-radius:18px;
  border:2px solid rgba(216,168,35,.55); box-shadow:0 8px 30px rgba(0,0,0,.45);}
.bondC img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; border-radius:999px;}
.bondC i{z-index:1;}
.mates img, .toMates img{height:20px; width:20px; object-fit:cover; border-radius:999px;
  vertical-align:-4px; border:1px solid var(--line); background:#fff;}
.rFaceBig{display:block; width:96px; height:96px; object-fit:cover; border-radius:999px;
  margin:0 auto 6px; border:3px solid var(--gold); background:#fff; box-shadow:0 3px 8px rgba(0,0,0,.25);}
.kamonImg{height:24px; width:24px; object-fit:contain; margin-left:auto; opacity:.9;}
.bCaster .sasukeImg{height:30px; width:30px; object-fit:cover; border-radius:999px;
  border:1.5px solid var(--gold); background:#fff8e4; vertical-align:middle; margin-right:5px;}
.evArt img{display:block; width:100%; border-radius:10px;}
.evArt.imgMode{padding:0; background:none;}

/* ===== 演出強化第1弾（2026-06-14夜・G1）: 友情特訓/大成功・ステ上昇フロート・タイトル ===== */
.titleArt{animation:keyArtFloat 6s ease-in-out infinite;}
@keyframes keyArtFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.resLine .big{display:inline-block;}
.resLine.crit .big{color:#b3801a; text-shadow:0 0 16px rgba(243,207,93,.95), 0 1px 0 #fff; animation:popBig .65s;}
.resLine.friend .big{background:linear-gradient(90deg,#e0533d,#d8a823,#2e8b57,#3a6ea5,#7a4f9d);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 0 8px rgba(243,207,93,.65)); animation:popBig .65s;}
@keyframes popBig{0%{transform:scale(.35)}55%{transform:scale(1.28)}75%{transform:scale(.96)}100%{transform:scale(1)}}
.stat{position:relative;}
.statPop{position:absolute; left:50%; top:-4px; font-size:15px; font-weight:900; color:#1d6b40;
  text-shadow:0 1px 0 #fff, 0 0 6px rgba(255,255,255,.9); pointer-events:none; white-space:nowrap;
  animation:floatUp 1.15s ease-out forwards; z-index:5;}
@keyframes floatUp{0%{opacity:0; transform:translate(-50%,8px) scale(.5)}22%{opacity:1; transform:translate(-50%,-2px) scale(1.2)}100%{opacity:0; transform:translate(-50%,-26px) scale(1)}}
.box.shaken{animation:shakeBad .45s;}
</style>

<script>
/* ============================================================
   エンジン
   §1 定数・状態 / §2 セーブ / §3 クイズ抽選 / §4 育成ターン
   §5 トレーニング解決 / §6 年表イベント / §7 合戦 / §8 終了評価
   §9 UI描画 / §10 殿堂・軍学帳
   ============================================================ */
const Game = (function(){
  /* ===== §1 定数・状態 ===== */
  const D = SENGOKU_DATA;
  // Codex生成の追加問題（questions_extra.js）があれば結合
  if (typeof SENGOKU_QUESTIONS_EXTRA !== 'undefined') D.QUESTIONS.push(...SENGOKU_QUESTIONS_EXTRA);

  // 育成中の偉人パック（シナリオ固有データは必ず H 経由で参照。将来ここが選択式になる）
  let H = D.HEROES.nobunaga;
  const MOODS = [
    { label:'絶不調', icon:'😵', mul:0.8, cls:'#e0533d' },
    { label:'不調',   icon:'😟', mul:0.9, cls:'#d96f30' },
    { label:'ふつう', icon:'😐', mul:1.0, cls:'#bbb' },
    { label:'好調',   icon:'😊', mul:1.1, cls:'#7fd49a' },
    { label:'絶好調', icon:'🔥', mul:1.2, cls:'#f3cf5d' },
  ];
  const STAT_KEYS = ['buyu','chiryaku','seiji','ninbo'];
  // 2026-06-12 生徒FB「体力が減らなすぎ」: 18→24に増。側近が同席する鍛錬は1人につき-2軽減（最低15）
  const TRAIN_COST = 24;
  function matePerks(genre, type){
    return (S.placement[genre]||[])
      .map(id=>H.retainers.find(x=>x.id===id))
      .filter(r=>r && r.perk && r.perk.type===type);
  }
  function trainCost(genre){
    const mates = (S.placement[genre]||[]).length;
    let c = TRAIN_COST - mates*2;
    matePerks(genre,'cost').forEach(r=>{ c -= r.perk.v; });
    // 偉人固有スキル等の全鍛錬コスト軽減（家康「忍耐」fx.costAll・2026-06-14夜）
    if (S.skills) Object.keys(S.skills).forEach(id=>{ const fx=skillFx(id); if (fx && fx.costAll) c -= fx.costAll; });
    return Math.max(12, c);
  }
  const RANKS = [ // [必要評価点, ランク名, ひとこと]（追憶の章ボーナス込み前提・2026-06-13改定）
    [0,'足軽','まだまだこれから。次はもっと学んでみよう！'],
    [210,'侍大将','戦場で名が知られ始めた。'],
    [360,'城主','一城のあるじ。側近たちが頼りにしている。'],
    [500,'国主','一国を治める大名。天下が見えてきた。'],
    [720,'大大名','天下にその名を轟かす大大名！'],
    [930,'天下人','見事、天下統一！ 歴史にきみの名が刻まれた！'],
  ];

  let S = null;        // 育成中の状態（runState）
  let P = loadPersist(); // 永続データ {hall:[], legacy:[], book:[]}

  function newRun(legacyIdx, tpy){
    const s = {
      hero:H.id, year:H.startYear,
      tpy: tpy===2?2:1, half:0, // v1.5 半年制（春/秋）。tpy=2でターン倍増・年表イベントは春に発火
      buyu:H.start.buyu, chiryaku:H.start.chiryaku, seiji:H.start.seiji, ninbo:H.start.ninbo,
      stamina:100, mood:2, koku:H.start.koku, wins:0, battles:0,
      injury:null, skillPt:0, skills:{}, trainStreak:0, chronicle:[], gstat:{},
      bonds:{}, bondMaxDone:{}, bondMidDone:{}, usedQ:[], placement:{}, correctTotal:0, answerTotal:0,
      pendingEventDone:{},
    };
    H.retainers.forEach(r=>s.bonds[r.id]=20);
    if (H.uniqueSkill) s.skills[H.uniqueSkill.id] = true; // 偉人固有スキルは最初から所持
    if (legacyIdx!=null && P.legacy[legacyIdx]){
      const lg = P.legacy[legacyIdx];
      s[lg.stat] += lg.val;
      toast(`📜 遺訓「${lg.name}」発動！ ${D.GENRES[lg.stat].label}+${lg.val}`);
      P.legacy.splice(legacyIdx,1); savePersist();
    }
    return s;
  }

  // 偉人の切り替え（育成開始前のみ呼ぶこと）
  function setHero(id){
    if (D.HEROES[id]) H = D.HEROES[id];
  }

  // スキルIDから効果を引く（D.SKILLSは効果コード直書きなので対象外。側近スキル/偉人固有用）
  function skillFx(id){
    if (H.uniqueSkill && H.uniqueSkill.id===id) return H.uniqueSkill.fx;
    for (const r of H.retainers){ if (r.skill && r.skill.id===id) return r.skill.fx; }
    return null;
  }
  function skillInfo(id){
    const s = D.SKILLS.find(x=>x.id===id); if (s) return s;
    if (H.uniqueSkill && H.uniqueSkill.id===id) return H.uniqueSkill;
    for (const r of H.retainers){ if (r.skill && r.skill.id===id) return r.skill; }
    return null;
  }

  /* ===== §2 セーブ ===== */
  const SAVE_KEY = 'sengoku_save_v1';
  function saveAll(){
    try{ localStorage.setItem(SAVE_KEY, JSON.stringify({run:S, persist:P})); }catch(e){}
  }
  function loadRaw(){
    try{ return JSON.parse(localStorage.getItem(SAVE_KEY)||'null'); }catch(e){ return null; }
  }
  function loadPersist(){
    const raw = loadRaw();
    const p = (raw && raw.persist) || {};
    return { hall:p.hall||[], legacy:p.legacy||[], book:p.book||[] };
  }
  function savePersist(){ saveAll(); }
  function hasRun(){ const r=loadRaw(); return !!(r && r.run); }
  function resume(){
    const raw = loadRaw();
    if (raw && raw.run){
      S = raw.run;
      H = D.HEROES[S.hero] || D.HEROES.nobunaga;
      S.hero = H.id;
      // 旧セーブの欠損補完（ケガ/スキルP=06-11、スキル/鍛錬連続/側近6人=06-13追加）
      S.injury = S.injury || null;
      S.skillPt = S.skillPt || 0;
      S.skills = S.skills || {};
      S.trainStreak = S.trainStreak || 0;
      S.chronicle = S.chronicle || [];
      S.gstat = S.gstat || {};
      S.bondMidDone = S.bondMidDone || {};
      S.tpy = S.tpy===2 ? 2 : 1; S.half = S.half||0; // 半年制（v1.5）以前のセーブは年制

      if (H.uniqueSkill && S.skills[H.uniqueSkill.id]==null) S.skills[H.uniqueSkill.id] = true;
      H.retainers.forEach(r=>{ if (S.bonds[r.id]==null) S.bonds[r.id]=20; });
      UI.show('game');
      if (S.epi){ UI.renderGame(); epilogueNext(); return; }
      turnStart(true);
    }
  }
  function clearRun(){ S=null; saveAll(); }

  /* ===== §3 クイズ抽選 =====
     通常特訓=易しめ（テンポ重視）／合戦=難しめ（決戦の重み）— 2026-06-11 教師FB */
  function diffWeights(kind){
    if (kind==='battle') return {1:20,2:55,3:25};
    const t = S.year - H.startYear;
    if (t<=10) return {1:85,2:15,3:0};
    if (t<=21) return {1:65,2:30,3:5};
    return {1:50,2:40,3:10};
  }
  function pickQuestion(genre, kind){
    const w = diffWeights(kind);
    let pool = D.QUESTIONS.map((q,i)=>({q,i})).filter(o=>o.q.genre===genre && !S.usedQ.includes(o.i));
    if (!pool.length){ // 使い切ったらこのジャンルの使用済みをリセット
      S.usedQ = S.usedQ.filter(i=>D.QUESTIONS[i].genre!==genre);
      pool = D.QUESTIONS.map((q,i)=>({q,i})).filter(o=>o.q.genre===genre);
    }
    // 難易度の重み抽選 → その難易度から1問（無ければ全体から）
    const r = Math.random()*100; let want = 1, acc = 0;
    for (const d of [1,2,3]){ acc += w[d]; if (r < acc){ want = d; break; } }
    let cand = pool.filter(o=>o.q.diff===want);
    if (!cand.length) cand = pool;
    const sel = cand[Math.floor(Math.random()*cand.length)];
    S.usedQ.push(sel.i);
    return sel;
  }
  // 選択肢シャッフル（出題ごとに正解位置をランダム化）
  function shuffled(q){
    const idx = [0,1,2,3].sort(()=>Math.random()-0.5);
    return { c: idx.map(i=>q.c[i]), a: idx.indexOf(q.a) };
  }

  /* ===== §4 育成ターン ===== */
  function failRate(){ // 体力依存の失敗率（%表示用）
    return Math.max(0, Math.round((42 - S.stamina) * 1.1));
  }
  function placeRetainers(){
    S.placement = {};
    // 6人化に伴い出現率を下げる（1人あたりの効果もtrainGain側で減・2026-06-13）
    H.retainers.forEach(r=>{
      if (Math.random() < 0.5){
        const keys = STAT_KEYS;
        // 80%で得意コマンドに寄る（2026-06-14 生徒FB「重複が狙えない」→得意率を強化）
        const k = Math.random()<0.8 ? r.fav : keys[Math.floor(Math.random()*keys.length)];
        (S.placement[k] = S.placement[k]||[]).push(r.id);
      }
    });
  }
  function timelineEvent(){ return H.timeline.find(e=>e.year===S.year); }

  function turnStart(restored){
    if (!restored) placeRetainers();
    else if (!S.placement || !Object.keys(S.placement).length) placeRetainers();
    // 気分の小イベント（やる気を日常的に動かす・2026-06-13 生徒FB対応）
    if (!restored && !timelineEvent() && Math.random()<0.12){
      if (Math.random()<0.5 && S.mood<4){ S.mood++; toast('☀️ 気持ちのいい朝だ。やる気UP！'); }
      else if (S.mood>0){ S.mood--; toast('🌧️ 長雨続きで、気分が少し沈む…'); }
    }
    saveAll();
    UI.renderGame();
    const ev = timelineEvent();
    if (ev && !S.pendingEventDone[ev.year]){
      // 350ms以内に先行クリック（doCommand側ガード）で消化済みなら二重発火しない
      setTimeout(()=>{ if (S && !S.pendingEventDone[ev.year]) fireEvent(ev); }, 350);
    }
  }
  function nextTurn(){
    // 半年制: 春→秋→翌年の春。年表イベントは春（年の最初のターン）にだけ発火する
    if ((S.tpy||1)===2 && !S.half){ S.half = 1; }
    else { S.half = 0; S.year++; }
    if (S.year > H.endYear){ endRun(false); return; } // 保険（finalで終わるはず）
    placeRetainers();
    turnStart();
  }
  /* v1.5 半年制の補正係数（_sim_test.js で経験校正・2026-06-14）。
     成長の多く（開始値・イベントfx・絆MAX・追憶・合戦の石高/勝利点）は固定値のため、
     ターン2倍でも評価点は約1.35倍・最終ステは約1.5倍にしか伸びない。
     HALF_SCORE で評価点を割って年制とランク基準を共有し、HALF_REQ でIF条件を引き上げる */
  const HALF_SCORE = 1.38;
  function scoreScale(){ return (S.tpy||1)===2 ? (H.halfScoreScale || HALF_SCORE) : 1; }
  // IF条件の倍率は成長余地が偉人ごとに違うため偉人パックで個別校正できる（既定1.75）
  function reqScale(){ return (S.tpy||1)===2 ? (H.halfReqScale || 1.75) : 1; }

  /* ===== §5 トレーニング解決 ===== */
  let cur = null; // 現在のクイズ文脈 {mode:'train'|'battle'|'review', genre, sel, sh, ...}

  // 未消化の年表イベントがあれば先に処理（連打・先行クリック対策）。発火したら true
  function guardEvent(){
    const ev = timelineEvent();
    if (ev && !S.pendingEventDone[ev.year]){ fireEvent(ev); return true; }
    return false;
  }
  function doCommand(k){
    if (guardEvent()) return;
    // ケガ中は治療が最優先（2026-06-11 ユーザー要望: ケガを直さないと次に進めない）
    if (S.injury && k!=='care'){ toast('🤕 ケガの体では無理はできぬ…。🌿薬師に診てもらおう'); return; }
    if (k==='care'){
      if (!S.injury){ toast('🌿 いまは元気そのものだ！'); return; }
      S.trainStreak = 0;
      S.injury = null;
      const heal = 40 + Math.floor(Math.random()*11);
      S.stamina = Math.min(100, S.stamina+heal);
      // 塞翁が馬: 治療が思わぬ福を呼ぶことがある（保健室を「ただの1回休み」にしない）
      if (Math.random() < 0.25){
        const lucks = [
          { t:'寝込んでいる間に『孫子』を読み込んだ！', fx:{chiryaku:12} },
          { t:'見舞いに来た家臣たちと、夜通し天下を語り合った。', fx:{ninbo:8}, bond:12 },
          { t:'療養先の湯の里で、豊かな米どころを見つけた！', fx:{koku:40} },
          { t:'体の芯から力がみなぎってきた。完全復活だ！', fx:{stamina:60, mood:2} },
        ];
        const l = lucks[Math.floor(Math.random()*lucks.length)];
        if (l.bond) H.retainers.forEach(r=>S.bonds[r.id]=Math.min(100, S.bonds[r.id]+l.bond));
        applyFx(l.fx);
        saveAll();
        UI.showEvent({ year:S.year, type:'story', title:'🌿 塞翁（さいおう）が馬！', art:'🌿🐴',
          text:`薬師（くすし）の手当てで、ケガはすっかり治った。\nそれどころか——\n\n${l.t}${l.bond?'\n（家臣みんなの絆もアップ！）':''}` },
          ()=>nextTurn(), l.fx);
        return;
      }
      S.mood = Math.min(4, S.mood+1);
      saveAll();
      toast(`🌿 薬師の手当てでケガが治った！ 体力+${heal}・やる気UP`);
      nextTurn(); return;
    }
    if (k==='skirmish'){ startSkirmish(); return; }
    if (k==='rest'){
      S.trainStreak = 0;
      let heal = 45 + Math.floor(Math.random()*11);
      Object.keys(S.skills||{}).forEach(id=>{ const fx=skillFx(id); if (fx && fx.restPlus) heal += fx.restPlus; });
      S.stamina = Math.min(100, S.stamina+heal);
      // 軍学帳があれば復習出題（ノーリスク）
      if (P.book.length){
        const bi = Math.floor(Math.random()*P.book.length);
        cur = { mode:'review', bookIdx:bi, genre:P.book[bi].genre };
        UI.openQuiz(P.book[bi], cur);
        toast(`😴 休息で体力+${heal}。軍学帳から復習だ！`);
        return;
      }
      toast(`😴 ゆっくり休んだ。体力+${heal}`);
      nextTurn(); return;
    }
    if (k==='trip'){
      S.trainStreak = 0;
      S.stamina = Math.min(100, S.stamina+25);
      S.mood = Math.min(4, S.mood+1);
      let k2 = 10+Math.floor(Math.random()*11);
      if (S.skills && S.skills.zeni) k2 = Math.round(k2*1.5);
      Object.keys(S.skills).forEach(id=>{ const fx=skillFx(id); if (fx && fx.tripKoku) k2 = Math.round(k2*fx.tripKoku); });
      S.koku += k2;
      toast(`🏯 領内を視察した。やる気UP！ 石高+${fmtKoku(k2)}`);
      nextTurn(); return;
    }
    // 鍛錬: クイズへ
    cur = { mode:'train', genre:k };
    const sel = pickQuestion(k);
    cur.sel = sel;
    UI.openQuiz(sel.q, cur);
  }

  function trainGain(q, opts){
    // 基本上昇量 = 9 + diff*2 + 乱数 → やる気 → 側近 → 友情（6人化に伴い1人あたり効果は減・2026-06-13）
    let g = 8 + q.diff*2 + Math.floor(Math.random()*4);
    g = g * MOODS[S.mood].mul;
    const mates = S.placement[cur.genre]||[];
    g += mates.length*2;
    matePerks(cur.genre,'gain').forEach(r=>{ g += r.perk.v; });
    Object.keys(S.skills||{}).forEach(id=>{ const fx=skillFx(id); if (fx && fx.trainAll) g += fx.trainAll; });
    let friend = false;
    mates.forEach(id=>{
      const r = H.retainers.find(x=>x.id===id);
      if (r.fav===cur.genre && S.bonds[id]>=80){ friend = true; }
    });
    if (friend) g *= 1.6;
    if (S.skills && S.skills.manabi) g *= 1.1;
    let crit = false;
    if (opts.correct && Math.random()<0.1){ crit = true; g *= 1.5; }
    if (opts.push) g *= 0.75; // 押し切りは8割弱の力（失敗率8%固定とセット・正解優位は維持）
    if (opts.half) g *= 0.6;
    return { gain:Math.round(g), friend, crit, mates };
  }

  function applyTraining(res, failed){
    const k = cur.genre;
    // 鍛錬の続けすぎでやる気が下がる（3連続から確率上昇・2026-06-13 生徒FB「やる気が動かない」対応）
    S.trainStreak = (S.trainStreak||0) + 1;
    if (S.trainStreak>=3 && S.mood>0 && Math.random() < 0.35 + 0.1*(S.trainStreak-3)){
      if (matePerks(k,'mood').length && Math.random()<0.5){
        S.moodMsg = '🦋 側近のはげましで、やる気の低下を防いだ！';
      } else {
        S.mood--;
        S.trainStreak = 2; // 続ければまた下がりうる
        S.moodMsg = '🔥 働き詰めで、やる気が下がった…（視察や休息で気分転換！）';
      }
    }
    if (failed){
      S.stamina = Math.max(0, S.stamina - trainCost(k) - 10);
      S.mood = Math.max(0, S.mood-1);
      S[k] = Math.max(1, S[k]-2);
    } else {
      S.stamina = Math.max(0, S.stamina - trainCost(k));
      S[k] += res.gain;
      // 副次上昇（主100%+副30%・2026-06-14 生徒FB「特化で詰む」対応）
      const sub = D.GENRES[k].sub;
      res.subGain = Math.max(1, Math.round(res.gain*0.3));
      if (sub==='koku' && matePerks(k,'kokuSub').length) res.subGain *= 2;
      if (sub==='koku') S.koku += res.subGain;
      else S[sub] += res.subGain;
      if (cur.lastCorrect) matePerks(k,'skillpt').forEach(r=>{ S.skillPt += r.perk.v; });
      res.subLabel = sub==='koku' ? `🌾石高+${fmtKoku(res.subGain)}` : `${D.GENRES[sub].label}+${res.subGain}`;
      // 絆上昇（6人化に伴い1回あたりを減）
      const uq = (H.uniqueSkill && S.skills[H.uniqueSkill.id]) ? (H.uniqueSkill.fx.bondPlus||0) : 0;
      res.mates.forEach(id=>{
        S.bonds[id] = Math.min(100, S.bonds[id] + 5 + (cur.lastCorrect?2:0) + uq);
      });
    }
    saveAll();
  }
  // やる気の変化メッセージを結果文に添える
  function takeMoodMsg(){
    if (!S.moodMsg) return '';
    const m = '\n' + S.moodMsg;
    S.moodMsg = null;
    return m;
  }
  // 絆イベント（絆50=中間イベント／絆MAX=ボーナス＋側近スキル授与）
  function checkBondMax(){
    for (const r of H.retainers){
      if (S.bonds[r.id]>=50 && S.bonds[r.id]<100 && !S.bondMidDone[r.id]){
        S.bondMidDone[r.id] = true;
        saveAll();
        UI.showEvent({ year:S.year, type:'story', title:`${r.icon} ${r.name}との語らい`, art:`${r.icon}💬`,
          text:r.midText || `${r.name}との絆が深まってきた。` }, ()=>UI.renderGame());
        return;
      }
    }
    for (const r of H.retainers){
      if (S.bonds[r.id]>=100 && !S.bondMaxDone[r.id]){
        S.bondMaxDone[r.id] = true;
        const fx = r.maxFx||{};
        STAT_KEYS.forEach(s=>{ if(fx[s]) S[s]+=fx[s]; });
        if (fx.stamina) S.stamina = Math.min(100, S.stamina+fx.stamina);
        if (fx.koku) S.koku += fx.koku;
        if (fx.mood) S.mood = Math.min(4, S.mood+fx.mood);
        S.skillPt += 5;
        S.chronicle.push({ y:S.year, t:r.name, r:'💖絆MAX' });
        let skillNote = '';
        if (r.skill){ S.skills[r.skill.id] = true; skillNote = `\n${r.skill.icon} 側近スキル「${r.skill.name}」を授かった！（${r.skill.desc}）`; }
        UI.showEvent({ year:S.year, type:'story', title:`${r.icon} ${r.name}・絆MAX！`, art:`${r.icon}💖`,
          text:r.maxText + '\n\n（ボーナスを獲得した！ ✨スキルP+5）' + skillNote }, ()=>UI.renderGame(), fx);
        saveAll();
        return;
      }
    }
  }

  /* 回答処理（クイズUIから呼ばれる） */
  function answer(choiceIdx){
    const correct = (choiceIdx === cur.sh.a);
    cur.lastCorrect = correct;
    // 学習レポート用: ジャンル別＋総数（全モード共通。学びのきろくのジャンル別%と総数のズレ防止）
    if (cur.genre && S && S.gstat){
      const gs = S.gstat[cur.genre] = S.gstat[cur.genre] || { a:0, c:0 };
      gs.a++; if (correct) gs.c++;
      S.answerTotal++; if (correct) S.correctTotal++;
    }
    if (cur.mode==='battle'){ return battleAnswer(correct); }
    if (cur.mode==='epilogue'){
      const E = S.epi;
      let text;
      if (correct){
        E.glow++;
        S[cur.genre] += 8; // 晩年の鍛錬（2026-06-14 生徒FB「選んだステの鍛錬効果」）
        text = D.EPILOGUE.okLines[Math.floor(Math.random()*D.EPILOGUE.okLines.length)]
          + `\n${D.GENRES[cur.genre].label}+8（人生の輝き ${E.glow}/5）`;
        if (cur.bookIdx!=null && P.book[cur.bookIdx]){ P.book.splice(cur.bookIdx,1); text += '\n📖 軍学帳から1ページ卒業！'; savePersist(); }
      } else {
        text = D.EPILOGUE.ngLines[Math.floor(Math.random()*D.EPILOGUE.ngLines.length)];
      }
      saveAll();
      return { correct, text, done:'next' };
    }
    if (cur.mode==='review'){
      if (correct){
        const item = P.book[cur.bookIdx];
        S[item.genre] = (S[item.genre]||0) + 5;
        cur.res = { gain:5 };
        P.book.splice(cur.bookIdx,1);
        savePersist();
        return { correct, text:`復習成功！ ${D.GENRES[item.genre].label}+5\n軍学帳から1ページ卒業！`, done:'next' };
      }
      return { correct, text:'まだ覚えきれていないようだ。解説を読んでおこう。\n（軍学帳に残しておくね）', done:'next' };
    }
    // train
    if (correct){
      const res = trainGain(cur.sel.q, {correct:true});
      cur.res = res;
      applyTraining(res, false);
      S.skillPt += 2;
      let t = `${D.GENRES[cur.genre].label}+${res.gain}・${res.subLabel}！ ✨スキルP+2`;
      if (res.crit) t = `🌟大成功！ ${t}`;
      if (res.friend) t = `🌈友情特訓！ ${t}`;
      // 大成功・友情特訓は気分も上がる（2026-06-13 やる気活性化）
      if ((res.crit || res.friend) && S.mood<4 && Math.random()<0.5){
        S.mood++; t += '\n😊 手応えあり！ やる気UP！';
      }
      t += takeMoodMsg();
      saveAll();
      return { correct, text:t, done:'next' };
    }
    // 不正解 → 軍学帳に記録し、押し切るか選ばせる
    addToBook(cur.sel.q);
    return { correct, push:true };
  }
  function addToBook(q){
    if (!P.book.some(b=>b.q===q.q)){
      P.book.push({ genre:q.genre, diff:q.diff, q:q.q, c:q.c, a:q.a, desc:q.desc });
      if (P.book.length>40) P.book.shift();
      savePersist();
    }
  }
  // 不正解後の選択: 押し切る or 学び直す
  // 押し切りの失敗率（2026-06-14 生徒FB: テンポ改善のため8%固定。低体力の無茶だけ+20%）
  function pushRate(){ return 8 + (S.stamina < 25 ? 20 : 0); }
  function pushThrough(){
    const fr = pushRate();
    const failed = Math.random()*100 < fr;
    if (failed){
      applyTraining(null, true);
      // 大失敗＝ケガ。ただしスキル「丈夫な体」なら半分の確率で耐える
      let t;
      if (S.skills && S.skills.joubu && Math.random()<0.5){
        t = `💥 大失敗！ 体力ガタ落ち・やる気ダウン・${D.GENRES[cur.genre].label}-2\n🩹 だが「丈夫な体」のおかげでケガは免れた！`;
      } else {
        S.injury = 1;
        t = `💥 大失敗！ 無理がたたって倒れ、ケガをしてしまった……\n体力ガタ落ち・やる気ダウン・${D.GENRES[cur.genre].label}-2\n\n🌿 まずは薬師（くすし）に診てもらおう`;
      }
      saveAll();
      return { failed:true, text:t };
    }
    const res = trainGain(cur.sel.q, {correct:false, push:true});
    cur.res = res;
    applyTraining(res, false);
    let t = `気合で押し切った！ ${D.GENRES[cur.genre].label}+${res.gain}・${res.subLabel}！`;
    if (res.friend) t = `🌈友情特訓！ ${t}`;
    return { failed:false, text:t + takeMoodMsg() };
  }
  function learnSafe(){
    const res = trainGain(cur.sel.q, {correct:false, half:true});
    cur.res = res;
    applyTraining(res, false);
    return { text:`解説をじっくり読んで学び直した。${D.GENRES[cur.genre].label}+${res.gain}・${res.subLabel}（軍学帳に記録）` + takeMoodMsg() };
  }

  /* ===== §6 年表イベント ===== */
  function fireEvent(ev){
    S.pendingEventDone[ev.year] = true;
    if (ev.type==='battle'){ startBattle(ev); return; }
    if (ev.type==='final'){ startFinal(ev); return; }
    if (ev.type==='story'){
      UI.showEvent(ev, ()=>{ applyFx(ev.effects); UI.renderGame(); saveAll(); }, ev.effects);
      return;
    }
    if (ev.type==='choice'){ UI.showChoiceEvent(ev); return; }
  }
  function applyFx(fx){
    if (!fx) return;
    STAT_KEYS.forEach(k=>{ if(fx[k]) S[k]=Math.max(1,S[k]+fx[k]); });
    if (fx.stamina) S.stamina = Math.max(0, Math.min(100, S.stamina+fx.stamina));
    if (fx.mood) S.mood = Math.max(0, Math.min(4, S.mood+fx.mood));
    if (fx.koku) S.koku = Math.max(10, S.koku+fx.koku);
  }
  function choiceFx(ev, idx){
    const ch = ev.choices[idx];
    applyFx(ch.fx);
    S.chronicle.push({ y:ev.year, t:ev.title.split(' — ')[0], r:'☑ '+ch.label });
    saveAll();
    return ch;
  }

  /* ===== §7 合戦絵巻（戦況→采配→クイズ→結果4階調。設計: DESIGN_SENGOKU_BATTLE_V2.md） ===== */
  let B = null;
  function playerPower(){
    return Math.round(S.buyu*2.2 + S.chiryaku*1.6 + S.ninbo*0.6 + S.koku/15);
  }
  const TIER_VAL = { kaishin:1.4, yuko:1.0, fuhatsu:0.35, shikujiri:0 };
  function startBattle(ev){
    B = { ev, round:0, max:ev.rounds.length, score:0,
      meHP:ev.army.me, foeHP:ev.army.foe, opt:null, last:null, skirmish:!!ev.skirmish };
    UI.openBattle(ev);
  }
  // 采配を選ぶ → その采配の参照ステに対応するジャンルから出題
  function battlePick(optIdx){
    const opt = B.ev.rounds[B.round].opts[optIdx];
    B.round++;
    B.opt = opt;
    cur = { mode:'battle', genre:opt.genre };
    const sel = pickQuestion(opt.genre, B.skirmish? null : 'battle');
    cur.sel = sel;
    UI.openQuiz(sel.q, cur);
  }
  function battleAnswer(correct){
    const opt = B.opt;
    // 搦め手（trick）は参照ステ90以上で合致が1段「化ける」
    const fit = Math.min(2, opt.fit + ((opt.style==='trick' && S[opt.stat]>=90) ? 1 : 0));
    let tier, kokozo = false;
    if (correct){
      tier = (opt.hist || fit===2) ? 'kaishin' : (fit===1 ? 'yuko' : 'fuhatsu');
    } else {
      addToBook(cur.sel.q);
      tier = (opt.style==='risky') ? 'shikujiri' : 'fuhatsu';
      // スキル「ここぞの度胸」: しくじりを1周に1回だけ不発に踏みとどまる
      if (tier==='shikujiri' && S.skills && S.skills.kokozo && !S.kokozoUsed){
        S.kokozoUsed = true; kokozo = true; tier = 'fuhatsu';
      }
    }
    // 内部スコア = 階調 × ステ補正(0.85〜1.2) × 博打ボーナス
    let val = TIER_VAL[tier];
    if (tier==='kaishin' || tier==='yuko'){
      val *= Math.max(0.85, Math.min(1.2, 1 + (S[opt.stat]-60)/400));
      if (opt.style==='risky') val *= 1.2;
      // 側近スキル（合戦の采配強化）・偉人固有スキル
      Object.keys(S.skills||{}).forEach(id=>{
        const fx = skillFx(id);
        if (!fx) return;
        if (fx.battleStat===opt.stat) val *= 1.12;
        if (fx.riskyBoost && opt.style==='risky') val *= fx.riskyBoost;
      });
    }
    B.score += val;
    // 兵力表示の増減（演出用マッピング。勝敗は内部スコアで判定）
    const E0 = B.ev.army.foe, M0 = B.ev.army.me;
    const foeCut = { kaishin:0.17, yuko:0.11, fuhatsu:0.05, shikujiri:0.02 }[tier];
    const meCut  = 0.04 + (tier==='shikujiri' ? (opt.style==='risky' ? 0.14 : 0.10) : 0);
    B.foeHP = Math.max(Math.round(E0*0.08), B.foeHP - Math.round(E0*foeCut));
    B.meHP  = Math.max(Math.round(M0*0.10), B.meHP - Math.round(M0*meCut));
    B.last = { tier, opt, correct };
    const head = { kaishin: opt.hist? '⚡ 史実の一手で会心！' : '⚡ 会心！',
      yuko:'⭕ 有効打！', fuhatsu:'😶 不発…', shikujiri:'💢 しくじり！' }[tier];
    let text = (tier==='kaishin'||tier==='yuko') ? `${head}\n${opt.ok}`
      : tier==='fuhatsu' ? `${head}\n「${opt.label}」は戦況に響かなかった…`
      : `${head}\n「${opt.label}」が裏目に出て、敵に押し込まれた！`;
    if (kokozo) text += '\n⚡「ここぞの度胸」で踏みとどまった！';
    return { correct, battle:true, last:(B.round>=B.max), text };
  }
  // 押し合いゲージ用: 現在の戦況（1.0=勝敗ライン）
  function battleProgress(){
    const ratio = playerPower()/B.ev.enemyPower;
    return (ratio*0.6 + 0.62*(B.score/B.max)) / 0.9;
  }
  function battleResult(){
    if (B.skirmish) return skirmishResult();
    S.battles++;
    const ratio = playerPower()/B.ev.enemyPower;
    const score = ratio*0.6 + (B.score/B.max)*0.62;
    const win = score >= 0.9;
    if (win){ S.wins++; S.skillPt += 8; applyFx(B.ev.winFx); }
    S.chronicle.push({ y:B.ev.year, t:B.ev.title.split(' — ')[0], r: win?'⚔️勝利':'💀敗北' });
    saveAll();
    return { win, text: win? B.ev.winText : B.ev.loseText };
  }

  /* ===== §7.5 小競り合い ＝ 1ラウンド版の合戦絵巻（石高とスキルP稼ぎ・敗北しても育成は続く） ===== */
  function startSkirmish(){
    const foe = H.skirmishFoes[Math.floor(Math.random()*H.skirmishFoes.length)];
    const situ = H.skirmishSitus[Math.floor(Math.random()*H.skirmishSitus.length)];
    S.trainStreak = 0;
    S.stamina = Math.max(0, S.stamina-14);
    startBattle({
      skirmish:true, year:S.year, title:`🚩 ${foe.name}`, intro:'',
      terrain:{ icon:'', label:situ.sky }, bg:situ.bg,
      enemyName:foe.name, enemyIcon:foe.icon, enemyPower:Math.max(40, playerPower()),
      army:{ me:Math.min(2500, 400+Math.round(S.koku)), foe:foe.army },
      meUnit:'🛡️', foeUnit:'🗡️',
      open:[ foe.text ],
      rounds:[ situ ],
    });
  }
  function skirmishResult(){
    const tier = B.last.tier;
    const win = (tier==='kaishin' || tier==='yuko');
    let text;
    if (win){
      let k = Math.round((12 + (S.year-H.startYear) + Math.random()*8) * (tier==='kaishin' ? 1.6 : 1.0));
      if (S.skills && S.skills.zeni) k = Math.round(k*1.5);
      S.koku += k; S.skillPt += 3;
      if (tier==='kaishin') S.mood = Math.min(4, S.mood+1);
      text = `🚩 勝利！ 石高+${fmtKoku(k)}・✨スキルP+3${tier==='kaishin' ? '・やる気UP' : ''}`;
    } else {
      S.mood = Math.max(0, S.mood-1);
      if (Math.random()*100 < failRate()/2 + 8){
        S.injury = 1;
        text = '💥 敗走の途中でケガをしてしまった……（🌿薬師で治療しよう）';
      } else {
        text = '🌀 戦果なし…兵を退いた。やる気DOWN';
      }
    }
    saveAll();
    return { win, text, skirmish:true };
  }
  // 敗北＝育成終了（パワプロ/ウマ娘式・2026-06-11 教師FB）
  function defeatEnd(){
    const ev = B.ev;
    endRun(false, `${ev.year}年「${ev.title.split(' — ')[0]}」`);
  }

  /* ===== §7.8 スキル習得（スキルP消費・その育成1周の間有効） ===== */
  function buySkill(id){
    if (!S) return;
    const sk = D.SKILLS.find(s=>s.id===id);
    if (!sk || S.skills[id]) return;
    if ((S.skillPt||0) < sk.cost){ toast('✨スキルPが足りない…鍛錬の正解や合戦で貯めよう！'); return; }
    S.skillPt -= sk.cost;
    S.skills[id] = true;
    saveAll();
    toast(`${sk.icon} スキル「${sk.name}」を習得した！`);
    UI.renderGame();
    UI.openSkill();
  }

  /* ===== 最終イベント（本能寺） ===== */
  function startFinal(ev){
    UI.showEvent(ev, ()=>{
      const survive = Object.entries(H.finalReq).every(([k,v])=>S[k]>=Math.round(v*reqScale()));
      const branch = survive? ev.survive : ev.fall;
      if (survive){ S.koku += 500; S.wins++; S.battles++; }
      S.survived = survive;
      S.chronicle.push({ y:H.endYear, t:branch.title.replace('【IF】',''), r: survive?'🌟IF達成':'🏁完走' });
      // 完走者は全偉人共通の「追憶の章」へ（ご褒美ゾーン）。敗北での育成終了は対象外
      UI.showEvent({year:H.endYear, type:'story', title:branch.title, text:branch.text}, ()=>startEpilogue(survive), survive? {koku:500}:null);
    });
  }

  /* ===== §7.9 追憶の章 — 全偉人共通のクリア後ボーナス（D.EPILOGUE・設計はウマ娘URAファイナルズ参照） ===== */
  function startEpilogue(survived){
    S.epi = { n:0, glow:0, survived:!!survived };
    saveAll();
    // 冒頭で「あなたのあゆみ」（chronicle）を年表として見せる＝物語性（2026-06-14 生徒FB）
    const walk = S.chronicle.length
      ? '\n\n——あなたのあゆみ——\n' + S.chronicle.map(c=>`${c.y}年 ${c.t} ${c.r}`).join('\n')
      : '';
    UI.showEvent({ year:S.year, title:D.EPILOGUE.intro.title, art:D.EPILOGUE.intro.art,
      text:D.EPILOGUE.intro.text + walk }, epilogueNext);
  }
  function epilogueNext(){
    const E = S.epi;
    if (!E) return;
    if (E.n >= 5){ finishEpilogue(); return; }
    E.n++;
    saveAll();
    UI.showEpilogueChoice(E.n);
  }
  // 回想するステータスを選ぶ → そのジャンルの「自分の記憶」（まちがい帳→出会った問題→全問）から出題
  function pickEpilogue(genre){
    cur = { mode:'epilogue', genre };
    const books = P.book.map((b,i)=>({b,i})).filter(o=>o.b.genre===genre);
    if (books.length){
      const sel = books[Math.floor(Math.random()*books.length)];
      cur.bookIdx = sel.i;
      UI.openQuiz(sel.b, cur);
      return;
    }
    let pool = S.usedQ.filter(i=>D.QUESTIONS[i].genre===genre);
    if (!pool.length) pool = D.QUESTIONS.map((q,i)=>i).filter(i=>D.QUESTIONS[i].genre===genre);
    const qi = pool[Math.floor(Math.random()*pool.length)];
    cur.qi = qi;
    UI.openQuiz(D.QUESTIONS[qi], cur);
  }
  function finishEpilogue(){
    const E = S.epi;
    const tier = D.EPILOGUE.tiers.find(t=>E.glow>=t.min);
    const fx = { buyu:tier.boost, chiryaku:tier.boost, seiji:tier.boost, ninbo:tier.boost };
    if (tier.koku) fx.koku = tier.koku;
    applyFx(fx);
    S.epi = null;
    saveAll();
    UI.showEvent({ year:S.year, title:`人生の総括 — ${tier.title}`, art:'🌅🕊️', artImg:D.EPILOGUE.intro.artImg,
      text:`（人生の輝き ${E.glow}/5）

${tier.text}` }, ()=>endRun(E.survived), fx);
  }

  /* ===== §8 終了評価 ===== fellLabel: 敗北で育成終了した合戦名（nullなら完走） */
  function endRun(survived, fellLabel){
    // 評価点はターン数で正規化（偉人ごとに育成期間が違ってもランク基準を共通にする）
    // 半年制（v1.5）はさらに HALF_SCORE で割り、年制と同じランク基準を共有する。
    // H.scoreNorm = 偉人別の校正係数（成長は育成年数に比例しないため、長い偉人は単純な年数割りだと不利。simで校正）
    let total = S.buyu + S.chiryaku + S.seiji + S.ninbo + Math.round(S.koku/12) + S.wins*25;
    total = Math.round(total * 32 / (H.endYear - H.startYear + 1) / scoreScale() * (H.scoreNorm||1));
    let rank = RANKS[0];
    for (const r of RANKS){ if (total>=r[0]) rank = r; }
    if (survived && rank[0]<590) rank = RANKS[4]; // IF生存は最低でも大大名
    // 遺訓: 最高ステに応じて獲得
    let bestK = 'buyu';
    STAT_KEYS.forEach(k=>{ if(S[k]>S[bestK]) bestK=k; });
    const legacy = { stat:bestK, val:Math.min(15, 5+Math.floor(S[bestK]/20)), name:H.legacyNames[bestK] };
    P.legacy.push(legacy); if (P.legacy.length>5) P.legacy.shift();
    // 殿堂入り
    P.hall.push({ name:H.name, rank:rank[1], total, tpy:S.tpy||1,
      stats:{buyu:S.buyu, chiryaku:S.chiryaku, seiji:S.seiji, ninbo:S.ninbo},
      koku:S.koku, wins:S.wins, battles:S.battles, survived:!!survived, fell:fellLabel||null,
      acc: S.answerTotal? Math.round(S.correctTotal/S.answerTotal*100):0,
      date:new Date().toLocaleDateString('ja-JP') });
    if (P.hall.length>30) P.hall.shift();
    const summary = { rank, total, legacy, survived:!!survived, fell:fellLabel||null, tpy:S.tpy||1,
      koku:S.koku, wins:S.wins, battles:S.battles,
      acc: S.answerTotal? Math.round(S.correctTotal/S.answerTotal*100):0,
      answered:S.answerTotal, gstat:S.gstat||{}, bookLeft:P.book.length,
      stats:{buyu:S.buyu, chiryaku:S.chiryaku, seiji:S.seiji, ninbo:S.ninbo} };
    clearRun(); savePersist();
    UI.showResult(summary);
  }

  /* 石高表示（内部値の1/10を万石として表示＝史実スケールに近づける） */
  function fmtKoku(k){ const v = k/10; return (v%1===0? v : v.toFixed(1)) + '万石'; }

  /* toast */
  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.remove('on');
    void t.offsetWidth; t.classList.add('on');
  }

  return { get S(){return S;}, get P(){return P;}, D, MOODS, STAT_KEYS, RANKS,
    newRun:(lg,tpy)=>{S=newRun(lg,tpy); saveAll();}, hasRun, resume, clearRun,
    failRate, pushRate, trainCost, doCommand, answer, pushThrough, learnSafe, checkBondMax, guardEvent, buySkill, setHero, epilogueNext, pickEpilogue, skillInfo,
    timelineEvent, nextTurn, turnStart, choiceFx, applyFx,
    battlePick, battleResult, battleProgress, defeatEnd, playerPower, toast, shuffled, fmtKoku,
    get cur(){return cur;}, get B(){return B;}, get H(){return H;}, saveAll };
})();

/* ============================================================ UI */
const UI = (function(){
  const D = Game.D;
  const $ = id=>document.getElementById(id);

  function show(name){
    ['title','game','result'].forEach(n=>$('scr-'+n).classList.toggle('on', n===name));
    if (name==='title') $('btn-resume').style.display = Game.hasRun()? 'block':'none';
  }

  /* ---- 育成開始（偉人選択 → 遺訓選択） ---- */
  function preStart(){
    if (Game.hasRun() && !confirm('育成中のデータがあります。最初からはじめると消えますが、よろしいですか？')) return;
    $('l-title').textContent = '⚔️ 育成する偉人を選ぶ';
    const body = $('l-body'); body.innerHTML='';
    Object.values(D.HEROES).forEach(h=>{
      body.insertAdjacentHTML('beforeend',
        `<button class="btn" style="display:flex; align-items:center; gap:10px; text-align:left;" onclick="UI.pickHero('${h.id}')">
         ${h.img? `<img src="${h.img}" alt="" style="height:72px; flex:none;">` : `<span style="font-size:40px;">${h.crest}</span>`}
         <span><b>${h.name}</b><br><small style="font-weight:600">${h.subtitle}<br>（${h.startYear}〜${h.endYear}年・${h.endYear-h.startYear+1}ターン）</small></span></button>`);
    });
    $('ovl-list').classList.add('on');
  }
  function pickHero(id){
    closeList();
    Game.setHero(id);
    chooseMode();
  }
  /* ---- v1.5 半年制の選択（一度でも完走していれば解放。初回は年制=実質チュートリアル） ---- */
  let runTpy = 1;
  function chooseMode(){
    runTpy = 1;
    const unlocked = Game.P.hall.some(h=>!h.fell);
    if (!unlocked){ chooseLegacy(); return; }
    const span = Game.H.endYear - Game.H.startYear + 1;
    $('l-title').textContent = '⏳ 育成の長さを選ぶ';
    $('l-body').innerHTML = `
      <button class="btn" onclick="UI.pickMode(1)">⚡ かけ足の生涯<br>
        <small style="font-weight:600">1ターン=1年・全${span}ターン（いままで通り）</small></button>
      <button class="btn gold" onclick="UI.pickMode(2)">🌗 じっくりの生涯<br>
        <small style="font-weight:600">1ターン=半年（🌸春/🍂秋）・全${span*2}ターン。育成も絆もスケール2倍！</small></button>
      <div class="note" style="text-align:center">🌗は完走経験者だけが選べる、たっぷり育成モード。ランクの基準はどちらも同じだ</div>`;
    $('ovl-list').classList.add('on');
  }
  function pickMode(t){ runTpy = t===2?2:1; closeList(); chooseLegacy(); }
  function chooseLegacy(){
    const lg = Game.P.legacy;
    if (!lg.length){ startRun(null); return; }
    // 遺訓選択モーダル
    $('l-title').textContent = '📜 遺訓を選ぶ（1枚だけ使える）';
    const body = $('l-body'); body.innerHTML='';
    lg.forEach((g,i)=>{
      const b = document.createElement('button');
      b.className='btn';
      b.innerHTML = `📜 ${g.name}<br><small style="font-weight:600">${D.GENRES[g.stat].icon} ${D.GENRES[g.stat].label}+${g.val} でスタート</small>`;
      b.onclick = ()=>{ closeList(); startRun(i); };
      body.appendChild(b);
    });
    const skip = document.createElement('button');
    skip.className='btn'; skip.textContent='使わずに始める';
    skip.onclick = ()=>{ closeList(); startRun(null); };
    body.appendChild(skip);
    $('ovl-list').classList.add('on');
  }
  function startRun(legacyIdx){
    Game.newRun(legacyIdx, runTpy);
    show('game');
    Game.turnStart();
  }
  function toTitle(){ show('title'); }
  // 中断＝セーブしてタイトルへ（「つづきから」で再開できる）
  function pauseToTitle(){
    Game.saveAll();
    show('title');
    Game.toast('💾 セーブしました。「つづきから」で再開できます');
  }

  /* ステータスのランク表記（F〜SS・最大300表記・ランクと数値は横並び。2026-06-12 生徒FB対応） */
  const STAT_MAX = 300;
  // 半年制（tpy=2）は成長量が約2倍になるため、ランク閾値と上限表記も2倍スケールで表示する
  function statRank(v, tpy){
    const m = tpy===2 ? 2 : 1;
    return v>=300*m?'SS' : v>=240*m?'S' : v>=180*m?'A' : v>=130*m?'B' : v>=90*m?'C' : v>=60*m?'D' : v>=30*m?'E' : 'F';
  }
  function statCell(k, v, tpy){
    const g = D.GENRES[k], r = statRank(v, tpy);
    return `<div class="stat"><span class="sl">${g.label}</span>
      <span class="srow"><b class="srk rk${r}">${r}</b><span class="sv2">${v}<small>/${STAT_MAX*(tpy===2?2:1)}</small></span></span></div>`;
  }

  /* 勢力図（mini=立ち絵の右下用 / 拡大はリスト overlay） */
  function mapHtml(mini){
    const S = Game.S; if (!S) return '';
    const H = Game.H;
    const next = H.timeline.find(e=>e.year>=S.year && (e.type==='battle'||e.type==='final'));
    const warLoc = next? H.map.battleLoc[next.year] : null;
    return `<span class="mapGrid ${mini?'mini':''}">` + H.map.provinces.map(p=>{
      const own = p.own && S.year>=p.own;
      const ally = p.ally && S.year>=p.ally;
      const war = (p.n===warLoc);
      return `<span class="mapCell ${own?'own':ally?'ally':''} ${war?'war':''}"
        style="grid-column:${p.c}; grid-row:${p.r}">${mini? (war?'⚔':'') : p.n+(war?'⚔️':'')}</span>`;
    }).join('') + `</span>`;
  }
  function openMap(){
    const S = Game.S; if (!S) return;
    const H = Game.H;
    const ownN = H.map.provinces.filter(p=>p.own && S.year>=p.own).length;
    const next = H.timeline.find(e=>e.year>=S.year && (e.type==='battle'||e.type==='final'));
    $('l-title').textContent = '🗾 勢力図';
    $('l-body').innerHTML = mapHtml(false) +
      `<div class="note" style="margin-top:8px;">🟦 織田領（いま${ownN}か国） ／ 🟩 同盟（徳川） ／ ⚔️ 次の合戦の地` +
      (next? `<br>📅 次の合戦: ${next.year}年「${next.title.split(' — ')[0]}」（${H.map.battleLoc[next.year]||'—'}）` : '<br>🎌 残る合戦はない') + `</div>`;
    $('ovl-list').classList.add('on');
  }

  /* 側近の顔（画像があればimg・なければ絵文字。◯枠/鍛錬バッジ共用） */
  function rFace(r){ return r.img ? `<img src="${r.img}" alt="${r.name}">` : r.icon; }

  /* ---- §9 育成画面の描画 ---- */
  function renderGame(){
    const S = Game.S; if (!S) return;
    const tpy = S.tpy||1, span = Game.H.endYear-Game.H.startYear+1;
    $('g-year').textContent = `${S.year}年` + (tpy===2 ? (S.half? '・秋':'・春') : '');
    $('g-turn').textContent = `${(S.year-Game.H.startYear)*tpy + (S.half||0) + 1}/${span*tpy}`;
    $('g-koku').textContent = `🌾 ${Game.fmtKoku(S.koku)}`;
    const m = Game.MOODS[S.mood];
    const mt = $('g-mood'); mt.textContent = m.icon+' '+m.label; mt.style.background = m.cls;
    const injured = !!S.injury;
    $('g-inj').style.display = injured? 'inline-block' : 'none';
    // 中央ステージ: 石高が増えるほど居城が立派になる
    const cs = Game.H.castles;
    let tier = 0;
    cs.forEach((c,i)=>{ if (S.koku>=c[0]) tier=i; });
    $('g-castlebox').className = 'stageCastle t'+(tier+1);
    const cimg = Game.H.castleImgs && Game.H.castleImgs[tier];
    $('g-castle').innerHTML = cimg ? `<img src="${cimg}" alt="${cs[tier][2]}">` : cs[tier][1];
    $('g-castlelbl').textContent = `居城: ${cs[tier][2]}`;
    $('g-heroname').textContent = Game.H.name;
    const km = $('g-kamon');
    if (Game.H.kamon){ km.src = Game.H.kamon; km.style.display='inline-block'; } else km.style.display='none';
    $('g-season').textContent = tpy===2 ? (S.half? '🍂':'🌸')
      : Game.H.seasons[(S.year-Game.H.startYear)%Game.H.seasons.length];
    // 立ち絵（画像があれば使用・なければ絵文字。ケガ中はグレー＋🤕バッジ）
    if (Game.H.img){
      $('g-face').innerHTML = `<img src="${Game.H.img}" alt="${Game.H.name}" class="${injured?'hurt':''}">`
        + (injured? '<span class="injBadge">🤕</span>' : '');
    } else {
      $('g-face').textContent = injured? '🤕' : (S.mood>=3 ? '😎' : (S.mood<=1 ? '🥱' : '🙂'));
    }
    // 体力
    const st = $('g-stam');
    st.style.width = S.stamina+'%';
    st.className = S.stamina<25? 'crit' : (S.stamina<45? 'low' : '');
    $('g-stam-n').textContent = `${S.stamina}/100`;
    // 勢力図ミニ（タップで拡大）
    $('g-minimap').innerHTML = mapHtml(true) + `<span class="mlbl">🗾 領地</span>`;
    // ステ（ランク表記）＋スキルP枠
    $('g-stats').innerHTML = Game.STAT_KEYS.map(k=>statCell(k, S[k], tpy)).join('') +
      `<div class="stat" onclick="UI.openSkill()"><span class="sl">スキルP</span>
        <span class="srow"><b class="srk" style="color:#7a4f9d">${S.skillPt||0}</b></span></div>`;
    // 側近（◯枠・顔画像があれば使用・絆ゲージ付き）
    $('g-bonds').innerHTML = Game.H.retainers.map(r=>{
      const v = S.bonds[r.id];
      return `<span class="bondC ${v>=80?'mx':''}" title="${r.name}" onclick="UI.openRetainer('${r.id}')">${rFace(r)}<i><b style="width:${v}%"></b></i></span>`;
    }).join('');
    // コマンド3×2・文字のみ（2026-06-12 生徒FB）。鍛錬の側近バッジだけ残す（友情特訓の合図）
    let mateIcons = '';
    Game.STAT_KEYS.forEach(k=>{
      (S.placement[k]||[]).forEach(id=>{
        const r = Game.H.retainers.find(x=>x.id===id);
        const fri = (r.fav===k && S.bonds[id]>=80);
        mateIcons += `<span class="${fri?'fr':''}" title="${r.name}">${rFace(r)}</span>`;
      });
    });
    const dimIf = c=>c?' dim':'';
    $('g-cmds').innerHTML =
      `<button class="cmd rest${dimIf(injured)}" onclick="Game.doCommand('rest')">休息</button>
      <button class="cmd train${dimIf(injured)}" onclick="UI.openTrain()">${mateIcons?`<div class="mates">${mateIcons}</div>`:''}鍛錬</button>
      <button class="cmd skill" onclick="UI.openSkill()">スキル</button>
      <button class="cmd care${injured?' urgent':' dim'}" onclick="Game.doCommand('care')">薬師</button>

  function openQuiz(q, ctx){
    ctx.sh = Game.shuffled(q);
    const g = D.GENRES[q.genre];
    const badge = $('q-badge');
    badge.textContent = `${g.icon} ${g.label}（${g.quizLabel}）★${q.diff}`;

    $('q-text').textContent = q.q;
    const box = $('q-choices'); box.innerHTML='';
    ctx.sh.c.forEach((c,i)=>{
      const b = document.createElement('button');
      b.className='choice'; b.textContent = ['①','②','③','④'][i]+' '+c;
      b.onclick = ()=>onAnswer(i, q, ctx);
      box.appendChild(b);
    });
    $('q-after').innerHTML='';
    $('ovl-quiz').classList.add('on');

  function onAnswer(i, q, ctx){
    const btns = [...$('q-choices').children];
    btns.forEach(b=>b.classList.add('lock'));
    btns[ctx.sh.a].classList.add('good');
    if (i!==ctx.sh.a) btns[i].classList.add('bad');
    const r = Game.answer(i);
    const after = $('q-after');
    let html = `<div class="descBox"><b>📖 解説</b><br>${q.desc}</div>`;
    if (r.push){
      // 不正解 → 押し切る / 学び直す の2択
      const fr = Game.pushRate();
      html += `<div class="pushRow">
        <button class="btn" onclick="UI.resolvePush(true)">💪 気合で押し切る（全力アップ・失敗率${fr}%）</button>
        <button class="btn" onclick="UI.resolvePush(false)">📖 学び直す（6割アップ・安全）</button>
        <div class="pushNote">まちがえても鍛錬はムダにならない。どちらでも力はつく！</div></div>`;
      after.innerHTML = html;
      return;
    }
    html += `<div class="resLine ${r.correct?'':'fail'} ${fxClass(r.text)}">${r.correct?'⭕ 正解！':'❌ ざんねん…'}<br><span class="${r.correct?'big':''}">${r.text}</span></div>`;
    html += `<div class="pushRow"><button class="btn gold" onclick="UI.quizDone()">つぎへ</button></div>`;
    after.innerHTML = html;
    after.scrollIntoView({behavior:'smooth', block:'end'});
  }
  // 友情特訓=虹文字・大成功=金文字（結果テキストから判定・演出強化第1弾）
  function fxClass(t){ return t.includes('友情特訓')? 'friend' : (t.includes('大成功')? 'crit' : ''); }
  function resolvePush(push){
    const r = push? Game.pushThrough() : Game.learnSafe();
    const after = $('q-after');
    after.innerHTML = `<div class="resLine ${r.failed?'fail':''} ${fxClass(r.text)}"><span class="${r.failed?'':'big'}">${r.text}</span></div>
      <div class="pushRow"><button class="btn gold" onclick="UI.quizDone()">つぎへ</button></div>`;
    if (r.failed){ // 大失敗はモーダルごと揺らす
      const box = document.querySelector('#ovl-quiz .box');
      box.classList.remove('shaken'); void box.offsetWidth; box.classList.add('shaken');
    }
    after.scrollIntoView({behavior:'smooth', block:'end'});
  }
  function quizDone(){
    $('ovl-quiz').classList.remove('on');
    const ctx = Game.cur;
    if (ctx.mode==='battle'){ battleResolve(); return; }
    if (ctx.mode==='epilogue'){ Game.epilogueNext(); return; }
    renderGame();
    if (ctx.res && ctx.res.gain) statPop(ctx.genre, ctx.res.gain); // ステ上昇を盤面にフロート表示
    Game.checkBondMax();
    setTimeout(()=>Game.nextTurn(), 250);

  function statPop(genre, gain){
    const i = Game.STAT_KEYS.indexOf(genre);

    if (!cell) return;
    const s = document.createElement('span');
    s.className = 'statPop'; s.textContent = `+${gain}`;
    cell.appendChild(s);
    setTimeout(()=>s.remove(), 1250);
  }

  /* （小競り合いのUIは合戦絵巻に統合 — §合戦絵巻を参照） */

  /* ---- 合戦絵巻（実況: 物見の佐助。タップ早送り・兵力カウントダウン・4階調エフェクト） ---- */
  const L = D.BATTLE_LINES;
  let castT = [], castFast = false, logLines = [];
  function clearCast(){ castT.forEach(clearTimeout); castT = []; }
  function battleFast(){ castFast = true; }
  function castWait(ms){ return castFast ? 90 : ms; }
  function addLog(t){
    logLines.push(t);
    if (logLines.length > 3) logLines.shift();
    $('b-log').innerHTML = logLines.map((l,i)=>`<div class="${i===logLines.length-1?'new':''}">${l}</div>`).join('');
  }
  // 実況を1行ずつ流す（早送り中は高速）
  function cast(lines, done){
    let i = 0;
    (function next(){
      if (i >= lines.length){ if (done) castT.push(setTimeout(done, castWait(450))); return; }
      addLog(lines[i++]);
      castT.push(setTimeout(next, castWait(1050)));
    })();
  }
  function fmtArmy(n){ return n.toLocaleString('ja-JP'); }
  function renderArmies(){
    const B = Game.B;
    $('b-mehp').textContent = fmtArmy(B.meHP);
    $('b-foehp').textContent = fmtArmy(B.foeHP);
    const units = (hp, max, icon)=> icon.repeat(Math.max(1, Math.ceil(hp/max*6)));
    $('b-meunits').textContent = units(B.meHP, B.ev.army.me, B.ev.meUnit||'🛡️');
    $('b-foeunits').textContent = units(B.foeHP, B.ev.army.foe, B.ev.foeUnit||'🗡️');
    $('b-tug').style.width = Math.max(8, Math.min(92, Math.round(Game.battleProgress()*50)))+'%';
  }
  // 兵力のカウントダウン演出
  function tickHP(side, to, done){
    const el = $(side==='me' ? 'b-mehp' : 'b-foehp');
    const from = parseInt(el.textContent.replace(/,/g,'')) || to;
    const steps = 16, d = (to-from)/steps;
    let i = 0;
    (function t(){
      i++;
      el.textContent = fmtArmy(Math.round(from + d*i));
      if (i < steps) castT.push(setTimeout(t, castWait(800)/steps));
      else { el.textContent = fmtArmy(to); if (done) castT.push(setTimeout(done, castWait(250))); }
    })();
  }
  function openBattle(ev){
    castFast = false; logLines = [];
    clearCast();
    $('b-year').textContent = `${ev.year}年`;
    $('b-title').textContent = ev.title;
    $('b-intro').textContent = ev.intro || '';
    $('b-intro').style.display = ev.intro ? 'block' : 'none';
    $('b-sky').textContent = `${ev.terrain.icon} ${ev.terrain.label}`.trim();
    $('b-mename').textContent = `${Game.H.armyIcon} ${Game.H.armyName}`;
    $('b-foename').textContent = `${ev.enemyIcon || '🔴'} ${ev.enemyName}`;
    $('b-castername').textContent = L.caster;
    $('b-log').innerHTML = ''; $('b-actions').innerHTML = '';
    $('b-cutin').className = 'bCutin';
    $('b-field').className = 'bField';
    // 戦場背景（画像第2便・2026-06-14）: 暗めのオーバーレイで実況テキストの可読性を確保
    $('b-field').style.backgroundImage = ev.bg
      ? `linear-gradient(180deg, rgba(26,18,30,.55), rgba(26,18,30,.78)), url('${ev.bg}')` : '';
    $('b-field').style.backgroundSize = 'cover';
    $('b-field').style.backgroundPosition = 'center';
    renderArmies();
    $('ovl-battle').classList.add('on');
    const opening = ev.skirmish ? ev.open : [L.casterIntro, ...ev.open, '⚠️ 負ければ育成終了の大一番だ！'];
    cast(opening, showRound);

  // 戦況を実況→采配ボタン（参照ステ数値・堅実/博打/搦め手チップを明記）
  function showRound(){
    const B = Game.B;
    const round = B.ev.rounds[B.round];
    cast([`📯 軍配${B.round+1}本目！ ${round.situ}`], ()=>{
      const chips = { safe:['堅実','#2e8b57'], risky:['博打','#b3362a'], trick:['搦め手','#7a4f9d'] };
      $('b-actions').innerHTML =
        `<div class="note" style="text-align:center;">どう采配する？（クイズに正解すれば采配が実行される）</div>` +
        round.opts.map((o,i)=>{
          const g = D.GENRES[o.stat];
          const c = chips[o.style];
          return `<button class="saihai" onclick="UI.pickSaihai(${i})">
            <span class="ti">${o.icon}</span>
            <span class="tb"><b>${o.label}</b><small>${g.icon}${g.label} ${Game.S[o.stat]}</small></span>
            <span class="chip" style="background:${c[1]}">${c[0]}</span></button>`;
        }).join('');

  function pickSaihai(i){
    $('b-actions').innerHTML = '';
    clearCast();
    $('ovl-battle').classList.remove('on');
    Game.battlePick(i);
  }
  // クイズから戻ったら、結果を4階調エフェクトで絵巻に反映
  function battleResolve(){
    const B = Game.B;
    castFast = false;
    $('ovl-battle').classList.add('on');
    const { tier, opt } = B.last;
    const field = $('b-field');
    field.className = 'bField';
    void field.offsetWidth;
    field.classList.add({ kaishin:'fxBig', yuko:'fxMid', fuhatsu:'fxSmall', shikujiri:'fxBad' }[tier]);
    if (tier==='kaishin'){
      const c = $('b-cutin');
      c.textContent = opt.hist ? '⚡ 史実の一手！' : '⚡ 会心！';
      c.className = 'bCutin on';
      castT.push(setTimeout(()=>{ c.className = 'bCutin'; }, castWait(1300)));
    }
    const lines = [];
    if (tier==='kaishin' || tier==='yuko') lines.push(`${opt.icon} ${opt.ok}`);
    if (tier==='kaishin' && opt.hist) lines.push(L.hist);
    lines.push(L[tier][Math.floor(Math.random()*L[tier].length)]);
    cast(lines, ()=>{
      tickHP('foe', B.foeHP, null);
      tickHP('me', B.meHP, ()=>{
        renderArmies();
        if (B.round < B.max){
          cast([L.mid[Math.floor(Math.random()*L.mid.length)]], showRound);
        } else {
          $('b-actions').innerHTML = `<button class="btn gold" onclick="UI.battleFinish()">⚔️ 決着！</button>`;
        }
      });
    });
  }
  function battleFinish(){
    $('b-actions').innerHTML = '';
    const r = Game.battleResult();
    const B = Game.B;
    if (r.skirmish){
      cast([r.win ? '🚩 敵を蹴散らしたーっ！ 見事な小競り合いだった！' : '🌀 痛み分け…ここは兵を退こう。'], ()=>{
        $('ovl-battle').classList.remove('on');
        showEvent({ year:Game.S.year, title: r.win ? '🚩 小競り合いに勝利！' : '🌀 退却…', text:r.text },
          ()=>{ renderGame(); setTimeout(()=>Game.nextTurn(), 250); });
      });
      return;
    }
    // 決着シーケンス: 勝ち=敵兵力が崩壊 / 負け=自軍が崩壊
    if (r.win) B.foeHP = Math.round(B.ev.army.foe*0.04);
    else B.meHP = Math.round(B.ev.army.me*0.05);
    tickHP(r.win ? 'foe' : 'me', r.win ? B.foeHP : B.meHP, null);
    cast(r.win ? L.winSeq : L.loseSeq, ()=>{
      renderArmies();
      $('ovl-battle').classList.remove('on');
      if (r.win){
        showEvent({ year:B.ev.year, title:'🎉 勝利！', text:r.text },
          ()=>{ renderGame(); setTimeout(()=>Game.nextTurn(), 250); }, B.ev.winFx);
      } else {
        showEvent({ year:B.ev.year, title:'💀 敗北……', text:r.text }, ()=>Game.defeatEnd());
      }
    });
  }

  /* ---- 結果 ---- */
  function showResult(sum){
    show('result');
    $('r-rank').textContent = sum.rank[1];
    $('r-sub').textContent = `評価点 ${sum.total} ／ ${sum.rank[2]}`;
    $('r-stats').innerHTML = Game.STAT_KEYS.map(k=>statCell(k, sum.stats[k], sum.tpy)).join('');
    $('r-summary').innerHTML =
      `🌾 石高 <b>${Game.fmtKoku(sum.koku)}</b> ／ ⚔️ 合戦 <b>${sum.wins}勝${sum.battles-sum.wins}敗</b> ／ 📝 クイズ正答率 <b>${sum.acc}%</b><br>` +
      (sum.fell? `💀 <b>${sum.fell}に敗れ、育成終了……</b><br>📖 軍学帳でまちがいを復習して、もう一度天下を目指そう！`
       : sum.survived? Game.H.endTexts.survived
       : Game.H.endTexts.completed);
    $('r-legacy').innerHTML = `📜 遺訓を獲得: <b>「${sum.legacy.name}」</b><br>次の育成で ${D.GENRES[sum.legacy.stat].icon}${D.GENRES[sum.legacy.stat].label}+${sum.legacy.val} できる！`;
    // 📚 学びのきろく（塾ゲーの本懐: 何を学んだかが残る・2026-06-14）
    const gl = Game.STAT_KEYS.map(k=>{
      const g = (sum.gstat||{})[k];
      if (!g || !g.a) return null;
      const rate = Math.round(g.c/g.a*100);
      const weak = (g.a>=3 && rate<60);
      return `${D.GENRES[k].quizLabel} <b style="${weak?'color:var(--red)':''}">${rate}%</b>${weak?'⚠':''}`;
    }).filter(Boolean).join(' ／ ');
    $('r-report').innerHTML = `📚 <b>学びのきろく</b><br>解いた問題 <b>${sum.answered}問</b>・正答率 <b>${sum.acc}%</b><br>`
      + (gl? `ジャンル別: ${gl}<br>` : '')
      + (sum.bookLeft? `📖 軍学帳に<b>${sum.bookLeft}問</b>残っています — 次の周で復習しよう！` : '📖 軍学帳はぜんぶ卒業！ おみごと！');
  }

  /* ---- §10 殿堂・軍学帳 ---- */
  function openHall(){
    $('l-title').textContent = '🏯 殿堂（育てた武将）';
    const body = $('l-body'); body.innerHTML='';
    if (!Game.P.hall.length){ body.innerHTML = '<div class="note">まだ誰も育成していません。育成を完了すると、武将がここに記録されます。（将来「戦争モード」で5人編成して戦えるようになる予定！）</div>'; }
    [...Game.P.hall].reverse().forEach(h=>{
      body.insertAdjacentHTML('beforeend',
        `<div class="hallCard"><div class="hi">${h.fell?'💀':h.survived?'🌟':'⚔️'}</div>
         <div class="hb"><b>${h.name}</b>（${h.date}）${h.fell?`<br><span style="color:var(--red);font-weight:700">${h.fell}で敗北</span>`:''}<br>
         ⚔️${h.stats.buyu} 🧠${h.stats.chiryaku} 🏛️${h.stats.seiji} 🤝${h.stats.ninbo} ／ 🌾${Game.fmtKoku(h.koku)} ／ ${h.wins}勝 ／ 正答率${h.acc}%</div>
         <div class="hr serif">${h.rank}</div></div>`);
    });
    $('ovl-list').classList.add('on');
  }
  function openBook(){
    $('l-title').textContent = `📖 軍学帳（まちがい帳）${Game.P.book.length}ページ`;
    const body = $('l-body'); body.innerHTML='';
    if (!Game.P.book.length){ body.innerHTML='<div class="note">まちがえた問題がここに記録されます。育成中に「😴休息」すると復習できて、正解すると卒業＆ボーナス！</div>'; }
    Game.P.book.forEach(b=>{
      const g = D.GENRES[b.genre];
      body.insertAdjacentHTML('beforeend',
        `<div class="bookItem">${g.icon} ${b.q}<br><b>答え: ${b.c[b.a]}</b><br><span class="note">${b.desc}</span></div>`);
    });
    $('ovl-list').classList.add('on');
  }
  function closeList(){ $('ovl-list').classList.remove('on'); }
  // 武将編成（βは予定表示のみ。持ち味バフは未実装＝今後の戦争モード/育成解放用）
  function openRoster(){
    $('l-title').textContent = '🎴 武将編成';
    const body = $('l-body');
    body.innerHTML = `<div class="note">育てた武将で戦う「戦争モード」を準備中！ いまは<b>織田信長と豊臣秀吉</b>を育成できる。残りも順次解放予定！</div>`;
    D.WARLORDS.forEach(w=>{
      body.insertAdjacentHTML('beforeend',
        `<div class="hallCard" style="${w.playable?'':'opacity:.62'}"><div class="hi">${w.icon}</div>
         <div class="hb"><b>${w.name}</b>「${w.title}」<br>持ち味: ${w.buff}</div>
         <div class="hr serif" style="font-size:12px;">${w.playable?'育成できる':'解放予定'}</div></div>`);
    });
    $('ovl-list').classList.add('on');
  }
  function openHowto(){
    $('l-title').textContent = '❓ 遊び方';
    $('l-body').innerHTML = `<div class="bookItem" style="font-size:14px;">
      <b style="color:#8a6605">⚔️ 偉人を選び、その人生を一緒に駆け抜けるゲームだ。（信長32年／秀吉37年）</b><br><br>
      🎯 <b>毎ターン、コマンドを1つ選ぶ</b>。⚔️鍛錬を選ぶと歴史クイズが出る。<b>時間制限はない</b>、じっくり考えよう。<br><br>
      ⭕ 正解するとステータスが大きく成長＋✨スキルPゲット。貯めたPは<b>スキル</b>（成長アップ・ケガ予防など）と交換できる！<br>
      ❌ 不正解でも「気合で押し切る」と同じだけ成長できる。ただし<b>失敗率</b>のぶんだけ大失敗のリスクが…！<br><br>
      😊 <b>やる気</b>は成長量に直結する。🔥鍛錬を続けすぎると下がるぞ——🏯視察で気分転換、🌟大成功や🌈友情特訓で上がる！<br><br>
      🤕 大失敗すると<b>ケガ</b>をする。ケガをしたら<b>🌿薬師（くすし）</b>で治療！ たまに「塞翁が馬」——ケガが思わぬ福を呼ぶことも…。<br><br>
      ❤️ 鍛錬は体力を使う。<b>体力25未満まで無理をすると、押し切りの失敗率が大幅に上がる</b>ぞ。😴休息でしっかり回復しよう（まちがえた問題の復習チャンスもある）。<br><br>
      🤝 側近（そっきん）がいる鍛錬は伸びやすく・<b>絆</b>も深まる。側近にはそれぞれ<b>固有ボーナス</b>があり（◯アイコンをタップで確認）、絆MAXで<b>側近スキル</b>を授かる。絆80以上の側近が得意鍛錬で輝いていたら<b>🌈友情特訓</b>で超成長！ 偉人自身も<b>固有スキル</b>を最初から持っているぞ。<br><br>
      🚩 <b>小競り合い</b>は腕試しのミニ合戦。勝てば石高（こくだか）と✨スキルPが稼げるぞ。<br><br>
      🏯 1560年・桶狭間など、<b>史実の合戦</b>が年表どおりに起こる。合戦は<b>「合戦絵巻」</b>——物見の佐助の実況で戦いが流れ、戦況が動いた瞬間にきみが<b>采配</b>を振る！ 選択肢には<b>堅実・博打・搦め手</b>の色がある。<b>戦況の文章をよく読み、自分の強いステータスと相談して選べ</b>。クイズに正解すれば采配は実行され、結果は会心⚡〜しくじり💢の4段階。史実と同じ采配を見抜けたら…？ <b>負けたらそこで育成終了</b>——まずは32年の完走を目指せ！<br><br>
      🔥 そして最終年——<b>ステータスを高く育てておくと、「もしも」の歴史（IFエンド）</b>が見られるかもしれない…。<br><br>
      📜 最後まで完走すると<b>「追憶の章」</b>へ！ 人生をふり返る5問に正解するほど総括がポジティブになり、<b>全ステータスが大幅アップ</b>してランクに上乗せされるぞ！信長なら本能寺、秀吉なら天下統一のその先で…。<br><br>
      🌗 一度でも完走すると、育成開始時に<b>「じっくりの生涯」（1ターン=半年・ターン数2倍）</b>が選べるようになる。たっぷり鍛えて、もっと高みを目指せ！</div>`;
    $('ovl-list').classList.add('on');
  }

  return { show, preStart, pickHero, pickMode, toTitle, pauseToTitle, renderGame, openQuiz, resolvePush, quizDone, openMap,
    showEpilogueChoice, pickEpilogueMem, openRetainer,
    showEvent, eventDone, showChoiceEvent, openBattle, battleFinish, battleFast, pickSaihai, showResult,
    openTrain, pickTrain, closeTrain, openSkill,
    openHall, openBook, closeList, openHowto, openRoster };
})();

/* 初期化 */
UI.show('title');
</script>
</body>
</html>
