<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>偉人トレーナー 〜歴史に名を刻め〜</title>
<style>
/* ============================================================
   偉人トレーナー β — パワプロ/ウマ娘型 歴史育成SLG（旧名: 戦国トレーナー）
   §S1 ベース・テーマ / §S2 タイトル / §S3 育成メイン
   §S4 モーダル共通・クイズ / §S5 合戦 / §S6 結果・殿堂
   設計書: ../PLAN_SENGOKU_IKUSEI.md
   ============================================================ */
/* ===== §S1 ベース ===== */
:root{
  --ink:#2b1d0e; --paper:#f5ead3; --paper2:#efe0c0; --line:#c9b282;
  --indigo:#1d2438; --indigo2:#2a3450; --gold:#d8a823; --gold2:#f3cf5d;
  --red:#b3362a; --green:#2e8b57; --blue:#3a6ea5; --purple:#7a4f9d;
  --goldhi:#f3cf5d; --bluehi:#6fa3ff; --redhi:#ff7a6a;   /* 合戦シーン演出の高輝度色（②⑤⑦・proto移植） */
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
body{
  min-height:100vh; color:var(--ink);
  font-family:"Yu Gothic","Hiragino Kaku Gothic ProN","Meiryo",system-ui,sans-serif;
  background:linear-gradient(180deg,#141a2c 0%,#1d2438 30%,#2a3450 100%);
  user-select:none; -webkit-user-select:none;
}
.serif{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;}
.wrap{width:min(520px,100%); margin:0 auto; padding:10px 12px 24px;}
button{font:inherit; color:inherit; cursor:pointer; border:none; background:none;}
.btn{display:block; width:100%; padding:14px; border-radius:14px; font-weight:800; font-size:17px; color:var(--ink);
  background:var(--paper); border:3px solid var(--line); box-shadow:0 4px 0 rgba(0,0,0,.25); transition:transform .06s;}
.btn:active{transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,.25);}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold)); border-color:#a87d12; color:#3a2a05;}
.btn.dim{opacity:.45; pointer-events:none;}
.note{font-size:12.5px; color:#6b5a3e; line-height:1.5;}
.scr{display:none;} .scr.on{display:block;}

/* ===== §S2 タイトル ===== */
#scr-title{text-align:center; color:var(--paper);}
.titleCrest{font-size:64px; margin-top:36px; filter:drop-shadow(0 4px 8px rgba(0,0,0,.5));}
.titleName{font-size:clamp(34px,9vw,46px); font-weight:900; letter-spacing:.12em; margin:6px 0 2px;
  background:linear-gradient(180deg,#f7e7ae,var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent;
  text-shadow:none;}
.titleSub{font-size:15px; letter-spacing:.3em; color:#cdbb88; margin-bottom:18px;}
.titlePolicy{margin:14px auto 18px; width:min(420px,94%); background:rgba(245,234,211,.1);
  border:1px solid rgba(216,168,35,.45); border-radius:12px; padding:10px 12px; font-size:13px; line-height:1.7; color:#e8dcbb; text-align:left;}
.titleBtns{width:min(360px,92%); margin:0 auto; display:grid; gap:10px;}
.verTag{margin-top:18px; font-size:11px; color:#7f8aa8;}

/* ===== §S2.5 ホーム画面（G1第2弾・2026-06-13 ウマ娘式ホーム） ===== */
#scr-home{color:var(--paper);}
.homeHead{display:flex; align-items:center; gap:8px; padding:4px 2px 10px;}
.homeHead .hTitle{font-weight:900; font-size:17px; letter-spacing:.08em; color:var(--gold2); flex:1;}
.homeRes{display:flex; align-items:center; gap:5px; font-weight:800; font-size:13.5px; color:#ffe9a8;
  background:rgba(245,234,211,.1); border:1px solid rgba(216,168,35,.45); border-radius:999px; padding:4px 12px;}
/* 育てた偉人の展示（自慢要素）。タップで殿堂へ */
.showcase{position:relative; border-radius:18px; border:2px solid rgba(216,168,35,.55); overflow:hidden;
  background:linear-gradient(180deg,#1d2438 0%,#2a3450 55%,#3a4666 100%); text-align:center; padding:16px 12px 0; width:100%;}
.showcase::before{content:''; position:absolute; inset:-20%;
  background:repeating-conic-gradient(rgba(216,168,35,.07) 0deg 6deg, transparent 6deg 16deg); pointer-events:none;}
.showcase .scChar{display:block; height:215px; width:auto; margin:6px auto 0;
  filter:drop-shadow(0 8px 14px rgba(0,0,0,.55)); animation:charSway 3.4s ease-in-out infinite;}
.showcase .scCrest{font-size:120px; line-height:215px; display:block;
  filter:drop-shadow(0 8px 14px rgba(0,0,0,.55));}
.showcase .scRank{position:absolute; top:10px; left:12px; text-align:left;}
.showcase .scRank .rk{display:block; font-size:30px; font-weight:900; line-height:1.1;
  background:linear-gradient(180deg,#f7e7ae,var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent;}
.showcase .scRank small{font-size:10.5px; font-weight:800; color:#9aa7c7;}
.showcase .scPower{position:absolute; top:10px; right:12px; text-align:right; font-weight:900;}
.showcase .scPower .pv{display:block; font-size:24px; color:#ffe9a8; line-height:1.1;}
.showcase .scPower small{font-size:10.5px; font-weight:800; color:#9aa7c7;}
.showcase .scName{position:absolute; left:0; right:0; bottom:0; padding:26px 12px 8px;
  background:linear-gradient(180deg,transparent,rgba(13,17,30,.92) 60%);}
.showcase .scName b{font-size:19px; letter-spacing:.1em;}
.showcase .scName small{display:block; font-size:11px; color:#bfc8e0; font-weight:700; margin-top:2px;}
/* お知らせ枠（他ゲーム連携のための常設枠） */
.noticeBox{margin:10px 0; background:rgba(245,234,211,.08); border:1px solid rgba(216,168,35,.4);
  border-radius:12px; padding:8px 12px; font-size:12.5px; line-height:1.65; color:#e8dcbb; text-align:left;}
.noticeBox b{color:var(--gold2);}
.homeBtns{display:grid; gap:10px; margin-top:10px;}
.homeBtns .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.homeBtns .btn{font-size:15.5px; padding:13px 8px;}
.homeBtns .btn.main{font-size:18px; padding:15px;}
/* セーブ＆ロード */
.saveTa{width:100%; min-height:84px; border-radius:10px; border:2px solid var(--line); background:#fffdf4;
  font-size:11px; padding:8px; word-break:break-all; color:var(--ink);}

/* ===== §S3 育成メイン ===== */
.board{background:var(--paper); border-radius:18px; border:3px solid var(--line); overflow:hidden;}
.gHead{display:flex; align-items:center; gap:10px; padding:7px 10px 7px 12px;
  background:linear-gradient(180deg,var(--indigo2),var(--indigo)); color:var(--paper);}
.gYear{font-weight:900; font-size:18px; border:2px solid var(--gold); border-radius:10px;
  padding:1px 10px; background:rgba(243,207,93,.12); color:var(--gold2);}
.gTurn{font-weight:800; font-size:14px; color:#bfc8e0; flex:1;}
.gKoku{font-weight:800; font-size:14px; color:var(--gold2);}
.gPause{font-size:18px; padding:2px 8px; border-radius:8px; border:1px solid #5a647f; color:#bfc8e0;}
/* 中央ステージ: ビジュアル主役の大型表示（ウマ娘式）。
   G1第2弾(2026-06-13): 城を「背景」に昇格＝住んでいる感。石高tierで空も豪華になる
   2026-06-13改: 城・人物を大型化し重ねる（ユーザー要望「城も人物も大きく・被ってOK」）。
   ※真の全画面背景化は縦長の城画像(第4便)納品後に board 背景として実装予定 */
.stage{position:relative; height:300px; overflow:hidden;
  background:linear-gradient(180deg,#9db8cc 0%,#cfdde8 45%,#ece9d4 80%,var(--paper) 100%);}
/* レイアウトB(2026-06-13): 城の全画面背景(縦長scene画像)。城スプライトは隠し、立ち絵が手前に立つ */
.stage.scene{height:360px; background:#1d2438 center 32%/cover no-repeat;}
.sceneCastleLbl{position:absolute; top:38px; left:10px; z-index:2; font-size:11px; font-weight:800; color:#fff;
  background:rgba(20,24,40,.6); border-radius:999px; padding:2px 10px; backdrop-filter:blur(2px);}
/* ===== レイアウトA（全画面オーバーレイ・2026-06-13）: 城シーンを盤面全体の背景にしUIを半透明で重ねる ===== */
.board.aLayout{position:relative; background-size:cover; background-position:center top; background-repeat:no-repeat;}
.board.aLayout .stage.sceneA{height:330px; background:transparent;}
.board.aLayout .gHead{background:linear-gradient(180deg,rgba(20,24,40,.72),rgba(20,24,40,.38));}
.board.aLayout .stageName{background:none;}
.board.aLayout .stageName .charName{color:#fff; text-shadow:0 2px 7px rgba(0,0,0,.95),0 0 3px rgba(0,0,0,.8);}
.board.aLayout .charRow{padding-top:2px;}
.board.aLayout .barLbl{color:#f3ead4; text-shadow:0 1px 3px rgba(0,0,0,.85);}
.board.aLayout .bondCap{color:#f3ead4; text-shadow:0 1px 3px rgba(0,0,0,.85);}
.board.aLayout .stat{background:rgba(245,234,211,.88);}
.board.aLayout .bondC{background:rgba(245,234,211,.9);}
.board.aLayout .cmd{background:rgba(255,253,244,.92);}
.board.aLayout .cmd.train{background:rgba(255,243,200,.95);}
.board.aLayout .cmd.rest{background:rgba(238,246,255,.93);}
.board.aLayout .cmd.skill{background:rgba(243,236,255,.93);}
.board.aLayout .cmd.care{background:rgba(234,251,233,.93);}
.board.aLayout .cmd.trip{background:rgba(243,236,255,.93);}
.board.aLayout .cmd.skirmish{background:rgba(255,238,222,.93);}
.board.aLayout .subBtn{background:rgba(239,224,192,.9);}
/* A: 省スペース化（2026-06-13 ユーザーFB「見切れる」）。側近を左縦列・キャラ大型化・足はパネルに重なる */
.board.aLayout .stage.sceneA{height:330px; overflow:visible; z-index:1;}
.board.aLayout .sceneCastleLbl{display:none;}         /* ④城名は省略（城は背景に見えている） */
.board.aLayout .stageDeco{display:none;}              /* 🚩季節デコは省略（季節はgHead年号で十分） */
.board.aLayout .kamonImg{display:none !important;}    /* ②家紋はまなび帳ボタンに置換 */
/* ⑤側近の顔（②iOS対策の決定版・2026-06-13）: 画像を枠より大きくするとiOS Safariがクリップできず枠外へはみ出す。
   → 拡大をやめ width/height:100% + object-fit:cover で枠ぴったり＝はみ出し原理的にゼロ。顔は object-position:top で上(顔)を見せる */
.board.aLayout .bondC .bf{overflow:hidden; clip-path:inset(0 round 9px);}
/* ⚠ 第2便CSS(.bondC img{position:absolute;inset:0;border-radius:999px})が枠.bfを飛び越えて.bondCいっぱいに広がる→aLayoutでは打ち消す。静的配置で.bf(枠)ぴったりに */
.board.aLayout .bondC .bf img{position:static; inset:auto; width:100%; height:100%; object-fit:cover; object-position:center top; border-radius:0;}
.board.aLayout .stageChar{bottom:-28px;}            /* 立ち絵を下げて次の枠に重ねる */
.board.aLayout .stageChar img{height:370px;}        /* キャラ大型化（ダイナミックさUP・2026-06-13） */
.board.aLayout .stageName{bottom:6px; padding-left:64px; padding-right:62px;} /* ①名前を下に寄せる・左右の列/ボタンを避ける */
.board.aLayout .bondCap{display:none;}
/* 側近の縦列（2026-06-13・ダイナミック化）: 顔を大きく（42px）＋適度な隙間。scene高を増やし6人でもパネル非干渉 */
.board.aLayout .bondRow{position:absolute; left:6px; top:52px; z-index:3; flex-direction:column; gap:3px; width:50px; padding:0; justify-content:flex-start;}
.board.aLayout .bondC{width:50px; max-width:50px; padding:2px;}
.board.aLayout .bondC .bn{display:none;} /* 縦列では名前は省略（タップで詳細） */
/* 改善②（2026-06-14）: ミニ絆ゲージ復活＝顔の下端に細い帯をオーバーレイ（列の高さは増やさない） */
.board.aLayout .bondC .bg2{position:absolute; left:5px; right:5px; bottom:4px; width:auto; height:4px; z-index:4; border:1px solid rgba(0,0,0,.5); box-shadow:0 1px 2px rgba(0,0,0,.55);}
.board.aLayout .bondC .bf{width:42px; height:42px;}
.board.aLayout .bondC .pin{top:-5px; right:-3px; font-size:12px;}
/* 次イベント枠・体力・ステ・コマンドは立ち絵の足の上(z:2)に重ねる */
.board.aLayout .charRow,.board.aLayout .statGrid,.board.aLayout .cmdArea{position:relative; z-index:2;}
.board.aLayout .charRow{margin-top:0;}
.stage.bgt2{background:linear-gradient(180deg,#8fc0e6 0%,#cfe2f2 45%,#ece9d4 80%,var(--paper) 100%);}
.stage.bgt3{background:linear-gradient(180deg,#7eb4e0 0%,#cde4ee 40%,#f0ead2 80%,var(--paper) 100%);}
.stage.bgt4{background:linear-gradient(180deg,#6d9fd4 0%,#d8e3da 38%,#f3e2b8 78%,var(--paper) 100%);}
.stage.bgt5{background:linear-gradient(180deg,#4a5f96 0%,#c2a96b 45%,#f3d999 75%,var(--paper) 100%);}
.stage.bgt5::before{content:''; position:absolute; inset:-30%;
  background:repeating-conic-gradient(rgba(255,240,190,.16) 0deg 7deg, transparent 7deg 18deg); pointer-events:none;}
.stageDeco{position:absolute; top:8px; left:12px; display:flex; gap:8px;
  font-size:24px; filter:drop-shadow(0 2px 2px rgba(0,0,0,.15)); z-index:2;}
/* 居城＝背景の主役。画面右奥にどっしり大きく構える（人物と重なってよい） */
.stageCastle{position:absolute; right:-22px; bottom:16px; text-align:center; z-index:0;}
.stageCastle .ce{display:block; line-height:1; transition:filter .4s;}
.stageCastle.t1 .ce{font-size:120px;} .stageCastle.t2 .ce{font-size:150px;} .stageCastle.t3 .ce{font-size:180px;}
.stageCastle.t4 .ce{font-size:205px; filter:drop-shadow(0 2px 6px rgba(0,0,0,.3));}
.stageCastle.t5 .ce{font-size:225px; filter:drop-shadow(0 0 14px rgba(243,207,93,.95)) saturate(1.4);}
.castleLbl{position:absolute; left:50%; transform:translateX(-50%); bottom:-20px; white-space:nowrap;
  font-size:11px; font-weight:800; color:#4a5a44; background:rgba(245,234,211,.82); border-radius:999px; padding:1px 8px;}
.stageCastle .ce img{display:block; margin:0 auto; width:auto;}
.stageCastle.t1 .ce img{height:175px;} .stageCastle.t2 .ce img{height:210px;} .stageCastle.t3 .ce img{height:240px;}
.stageCastle.t4 .ce img{height:265px;}
.stageCastle.t5 .ce img{height:285px; filter:drop-shadow(0 0 14px rgba(243,207,93,.9));}
/* 立ち絵＝主役。画面中央に大きく（城に重なる）。
   z-index は名前/文字より下（2026-06-13 ユーザー要望「文字が前・人物が後ろ」） */
.stageChar{position:absolute; left:50%; bottom:14px; transform:translateX(-50%); font-size:150px; line-height:1;
  filter:drop-shadow(0 6px 9px rgba(0,0,0,.4)); animation:charSway 3.2s ease-in-out infinite; z-index:1;}
.stageChar img{display:block; height:258px; width:auto; transition:filter .4s;}
.stageChar img.hurt{filter:grayscale(.75) brightness(.9) !important;}
/* 調子が立ち絵で見てわかる（表情差分が来るまでのCSS差分・G1第2弾） */
.stageChar img.m0{filter:grayscale(.6) brightness(.88);}
.stageChar img.m1{filter:grayscale(.3) brightness(.95);}
.stageChar img.m3{filter:saturate(1.12);}
.stageChar img.m4{filter:saturate(1.25) drop-shadow(0 0 10px rgba(243,207,93,.85));}
.stageChar .injBadge{position:absolute; top:-4px; right:-16px; font-size:30px;}
.stageChar .moodFx{position:absolute; top:-10px; left:-20px; font-size:26px;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.3)); animation:moodBob 1.6s ease-in-out infinite;}
@keyframes moodBob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-5px) rotate(6deg)}}
@keyframes charSway{0%,100%{margin-bottom:0}50%{margin-bottom:7px}}
/* 名前/調子は立ち絵より前面（z-index:3）。文字が前・人物が後ろ（2026-06-13 ユーザー要望） */
.stageName{position:absolute; left:0; right:0; bottom:0; z-index:3; pointer-events:none; display:flex; align-items:center; gap:8px; padding:24px 14px 6px;
  background:linear-gradient(180deg,transparent,rgba(245,234,211,.55) 40%,rgba(245,234,211,.97) 78%);}
.stageName .charName{font-size:19px; text-shadow:0 1px 3px rgba(255,255,255,.8);}
/* 勢力図: 日本地図SVG（G1第2弾・2026-06-13「社会科なので明確な地図必須」）。ミニ版は左上・タップで拡大 */
.miniMapBtn{position:absolute; right:8px; top:30px; padding:0; text-align:center; z-index:2;}
.miniMapBtn .mlbl{display:block; font-size:9.5px; font-weight:800; color:#4a5a44;
  background:rgba(245,234,211,.78); border-radius:999px; padding:0 6px; margin-top:2px;}
/* まなび帳ボタン（②家紋の位置・正方形角丸・問題数を通知バッジ） */
.bookBtn{position:absolute; right:10px; bottom:14px; z-index:5; cursor:pointer; width:48px; height:48px; border-radius:14px;
  background:rgba(245,234,211,.92); border:2px solid var(--line); box-shadow:0 3px 0 rgba(0,0,0,.18);
  display:flex; align-items:center; justify-content:center; transition:transform .06s;}
.bookBtn:active{transform:translateY(2px);}
.bookBtn .bbIcon{font-size:26px; line-height:1;}
.bookBtn .bbBadge{position:absolute; top:-7px; right:-7px; min-width:20px; height:20px; padding:0 5px; border-radius:999px;
  background:var(--red); color:#fff; font-size:11px; font-weight:900; display:flex; align-items:center; justify-content:center;
  border:2px solid var(--paper); box-shadow:0 1px 2px rgba(0,0,0,.3);}
/* 令制国マップ（japan_map.js・出典 Esri ジャパン「令制国の地図」を改変） */
.jmap{display:block; width:100%; height:auto; background:#bcd6e8; border:2px solid var(--line); border-radius:10px;}
.jmap .sea{fill:#bcd6e8;}
/* 下地: 全令制国を land 色で塗り、境界線を描く */
.jmap .land .bd{fill:#e9e2c8; stroke:#b6a884; stroke-width:.7; stroke-linejoin:round;}
/* 自軍/同盟の国の塗り */
.jmap .fl{stroke:#fff; stroke-width:.7; stroke-linejoin:round;}
.jmap .fl.own{fill:#3a6ea5;} .jmap .fl.ally{fill:#2e8b57;}
.jmap .pn{font-size:12px; font-weight:800; fill:#fff; text-anchor:middle; dominant-baseline:middle;
  font-family:inherit; paint-order:stroke; stroke:rgba(20,22,32,.55); stroke-width:2.5px; pointer-events:none;}
.jmap .warProv{fill:rgba(179,54,42,.55); stroke:var(--red); stroke-width:1; stroke-linejoin:round;}
.jmap .warMark{font-size:18px; text-anchor:middle; dominant-baseline:central;}
.jmap .warRing{fill:none; stroke:var(--red); stroke-width:2.5; animation:warPulse 1.4s infinite;}
@keyframes warPulse{0%,100%{stroke-opacity:1}50%{stroke-opacity:.2}}
/* ミニ地図は背景・枠なしで列島の形だけ（タップで拡大が前提なので小さくてよい・2026-06-13）。城背景の上に浮かせる */
.jmap.mini{width:78px; background:none; border:none; border-radius:0; box-shadow:none;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.5));}
.jmap.mini .land .bd{stroke:#7d6f4e; stroke-width:.7;}
.mapCredit{font-size:9px; color:#9a8c6a; text-align:right; margin-top:3px;}
/* 勢力図モーダルのズーム（＋/−＋スクロールでパン） */
.mapTools{display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:6px;}
.mapTools button{width:40px; height:40px; border-radius:10px; border:2px solid var(--line);
  background:var(--paper2); font-size:22px; font-weight:900; line-height:1; color:var(--ink);}
.mapTools button:active{transform:translateY(2px);}
.mapTools .zl{font-size:13px; font-weight:800; color:#6b5a3e; min-width:52px; text-align:center;}
.mapZoomWrap{width:100%; max-height:62vh; overflow:auto; -webkit-overflow-scrolling:touch;
  border:2px solid var(--line); border-radius:10px; background:#cfe2f0; touch-action:pan-x pan-y;}
.mapZoomWrap .jmap{border:none; border-radius:0; display:block;}
.charRow{display:flex; gap:10px; padding:4px 12px 4px; align-items:center;}
.charInfo{flex:1;}
.charName{font-weight:900; font-size:17px;}
.moodTag{display:inline-block; margin-left:8px; font-size:12px; font-weight:800; padding:2px 8px; border-radius:999px; background:#ddd;}
.barWrap{margin-top:4px;}
.barLbl{display:flex; justify-content:space-between; font-size:11px; font-weight:700; color:#7a6845;}
/* 体力バー: 文字をバー内に重ねる（③視認性が背景に左右されず省スペース） */
.bar{position:relative; height:18px; background:#ddd0b0; border-radius:9px; overflow:hidden; border:1px solid var(--line);}
.bar i{display:block; height:100%; border-radius:9px; background:linear-gradient(90deg,#7fd49a,#2e8b57); transition:width .3s;}
.bar .barTxt{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800;
  color:#234; text-shadow:0 1px 0 rgba(255,255,255,.6);}
.bar i.low{background:linear-gradient(90deg,#f0b35e,#d96f30);}
.bar i.crit{background:linear-gradient(90deg,#e0533d,#b3362a); animation:critBlink .9s ease-in-out infinite;}
/* ステータスは下部1列×5枠（4ステ＋スキルP）。ランクと数値を横並び（ウマ娘式・2026-06-12 生徒FB） */
/* ステータスは省スペースの1行（ラベル＋ランク＋値を横並び・2026-06-13 ユーザー要望「細く」） */
.statGrid{display:grid; grid-template-columns:repeat(5,1fr); gap:4px; padding:4px 10px 2px;}
#r-stats{grid-template-columns:repeat(4,1fr);}
.stat{display:flex; flex-direction:row; align-items:center; justify-content:center; gap:3px; background:var(--paper2); border-radius:8px; padding:3px 2px;}
.stat .sl{font-size:10px; font-weight:800; color:#7a6845;}
.stat .srow{display:flex; align-items:baseline; gap:2px;}
.stat .srk{font-size:15px; font-weight:900; line-height:1.1;}
.stat .sv2{font-size:10px; font-weight:800; color:#7a6845;} .stat .sv2 small{font-weight:600; color:#a09068; font-size:8px;}
.rkF{color:#9aa0a6;} .rkE{color:#7f8aa8;} .rkD{color:#3a6ea5;} .rkC{color:#2e8b57;}
.rkB{color:#6b8e23;} .rkA{color:#d8a823;} .rkS{color:#e0533d;}
.rkSS{background:linear-gradient(90deg,#e0533d,#d8a823,#7a4f9d); -webkit-background-clip:text; background-clip:text; color:transparent;}
.stat .sv.up{color:var(--green); animation:pop .5s;}
@keyframes pop{0%{transform:scale(1.6)}100%{transform:scale(1)}}
/* 改善④(2026-06-14): 体力が危険域(<25)で赤点滅 / スキルPが貯まるとスキルP枠が金に光る */
@keyframes critBlink{0%,100%{filter:brightness(1)}50%{filter:brightness(1.45)}}
.stat.hasPt{border:1px solid var(--gold); box-shadow:0 0 8px 1px rgba(243,207,93,.7); animation:glow 1.4s infinite alternate;}
/* コマンドは3×2・文字のみのシンプル表記（2026-06-12 生徒FBで絵文字・説明を削除）
   G1第2弾: 枠の大きさに対し文字が小さい → 17.5pxに拡大 */
.cmdArea{padding:6px 10px 10px;}
.cmdGrid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
/* コマンドは1行（絵文字を背景に大きく薄く、文字を上に重ねる＝省スペース・2026-06-13） */
.cmd{position:relative; padding:10px 4px; border-radius:13px; border:3px solid var(--line);
  background:#fffdf4; text-align:center; box-shadow:0 3px 0 rgba(0,0,0,.12); transition:transform .06s;
  font-weight:900; display:flex; align-items:center; justify-content:center; overflow:hidden;}
.cmd .ci{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); font-size:34px; opacity:.2; pointer-events:none;}
/* 第6便: コマンドを画像ボタンに（改善①）。絵柄は薄く敷いて文字の可読性を優先 */
.cmd .ci img{display:block; width:52px; height:52px; object-fit:contain;}
.cmd .ci.cimg{opacity:.5;}
.cmd .cl{position:relative; font-size:16px; line-height:1.1; text-shadow:0 1px 2px #fffdf4, 0 0 4px #fffdf4;}
.cmd:active{transform:translateY(2px);}
.cmd.dim{opacity:.45; pointer-events:none;}
.cmd.urgent{animation:glow 1.2s infinite alternate; border-color:var(--red);}
.cmd .mates{position:absolute; top:-10px; right:-4px; display:flex; gap:1px;}
.cmd .mates span{font-size:13px; background:var(--paper); border:2px solid var(--line); border-radius:999px;
  width:22px; height:22px; display:flex; align-items:center; justify-content:center;}
.cmd .mates span.fr{border-color:var(--gold); background:#fff3c8; box-shadow:0 0 8px 2px rgba(243,207,93,.9); animation:glow 1.2s infinite alternate;}
@keyframes glow{from{box-shadow:0 0 4px 1px rgba(243,207,93,.6)}to{box-shadow:0 0 10px 3px rgba(243,207,93,1)}}
.cmd.rest{background:#eef6ff;} .cmd.trip{background:#f3ecff;}
.cmd.train{background:#fff3c8; border-color:var(--gold);}
.cmd.skill{background:#f3ecff;} .cmd.care{background:#eafbe9;} .cmd.skirmish{background:#ffeede;}
/* 改善③(2026-06-14): 「鍛錬」を主役ボタンに＝全幅・大型・金で目立たせる */
.cmd.big{grid-column:1/-1; padding:15px 4px;}
.cmd.big .cl{font-size:21px; letter-spacing:.06em;}
.cmd.big .ci{font-size:48px; opacity:.26;}
.cmd.big .ci img{width:78px; height:78px;}
.cmd.big .ci.cimg{opacity:.55;}
.cmd.train.big{box-shadow:0 3px 0 rgba(0,0,0,.12), 0 0 0 1px var(--gold) inset, 0 0 12px 1px rgba(243,207,93,.5);}
/* 改善④(2026-06-14): スキルPが貯まったら スキルボタンが光る */
.cmd.skill.ready{border-color:var(--gold); animation:glow 1.3s infinite alternate;}
/* 鍛錬選択ポップアップ（家臣がいる選択肢は輝く） */
.trainOpt{display:flex; align-items:center; gap:10px; width:100%; padding:10px 12px; border-radius:12px;
  border:3px solid var(--line); background:#fffdf4; text-align:left; box-shadow:0 3px 0 rgba(0,0,0,.12); transition:transform .06s;}
.trainOpt:active{transform:translateY(2px);}
.trainOpt .toIcon{font-size:26px;}
.trainOpt .toBody{flex:1; line-height:1.35;} .trainOpt .toBody b{font-size:15.5px;}
.trainOpt .toBody small{display:block; font-size:11.5px; color:#7a6845;}
.trainOpt .toMates{display:flex; gap:2px;}
.trainOpt .toMates span{font-size:15px; background:var(--paper); border:2px solid var(--line); border-radius:999px;
  width:26px; height:26px; display:flex; align-items:center; justify-content:center;}
.trainOpt .toMates span.fr{border-color:var(--gold); background:#fff3c8; animation:glow 1.2s infinite alternate;}
.trainOpt.glowOpt{border-color:var(--gold); background:#fff8dc;
  box-shadow:0 0 10px 2px rgba(243,207,93,.65), 0 3px 0 rgba(0,0,0,.12);}
.subRow{display:flex; gap:8px; margin-top:8px;}
.subBtn{flex:1; padding:8px; border-radius:10px; border:2px solid var(--line); background:var(--paper2); font-size:14px; font-weight:800;}
/* 側近＝サポートカード風（改善#4・2026-06-13）。顔＋名前＋絆バー、配置中は青枠・友情は🌈 */
.bondCap{font-size:10.5px; font-weight:800; color:#9a8660; text-align:center; margin:2px 0 0;}
.bondRow{display:flex; gap:6px; padding:3px 10px 8px; justify-content:center;}
.bondC{position:relative; flex:1; max-width:58px; display:flex; flex-direction:column; align-items:center; gap:2px;
  background:var(--paper2); border:2px solid #cdbfa0; border-radius:10px; padding:4px 2px 5px; cursor:pointer;
  box-shadow:0 2px 0 rgba(0,0,0,.1); transition:transform .06s;}
.bondC:active{transform:translateY(2px);}
.bondC .bf{width:38px; height:38px; border-radius:8px; overflow:hidden; display:flex; align-items:center; justify-content:center; font-size:22px; background:#fff;}
.bondC .bf img{width:100%; height:100%; object-fit:cover;}
.bondC .bn{font-size:9px; font-weight:800; color:#6b5a3e; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.bondC .bg2{width:100%; height:5px; border-radius:3px; background:#ddd0b0; overflow:hidden;}
.bondC .bg2 b{display:block; height:100%; background:linear-gradient(90deg,#f5b0c0,#e0533d);}
.bondC.mx{border-color:var(--gold); background:#fff3c8; box-shadow:0 0 7px 1px rgba(243,207,93,.6);}
.bondC.placed{border-color:var(--blue);}
.bondC .pin{position:absolute; top:-7px; right:-3px; font-size:14px; filter:drop-shadow(0 1px 1px rgba(0,0,0,.3));}
/* 次の歴史イベント（体力バーの上） */
.nextEv2{font-size:11.5px; font-weight:800; color:#8a6605; margin-bottom:3px;}
/* 次イベント予告カード（改善#5・2026-06-13）。合戦は赤く緊張感 */
/* ⑦次イベントは1行（アイコン＋年/題＋のこりN） */
.nextEv{display:flex; align-items:center; gap:7px; margin-bottom:5px; padding:4px 10px;
  background:#fff8e4; border:2px solid var(--gold); border-radius:10px;}
.nextEv .neIcon{font-size:17px; line-height:1; flex:none;}
.nextEv .neBody{flex:1; min-width:0;}
.nextEv .neBody b{font-size:13px; color:#6b4e0a; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block;}
.nextEv .neCount{flex:none; font-size:11px; font-weight:800; color:#8a6605; white-space:nowrap;
  background:rgba(243,207,93,.3); border-radius:8px; padding:2px 8px; line-height:1.3;}
.nextEv .neCount b{font-size:15px; color:#6b4e0a;}
.nextEv.war{background:#fbe7e2; border-color:var(--red);}
.nextEv.war .neBody b, .nextEv.war .neCount, .nextEv.war .neCount b{color:#b3362a;}
.nextEv.war .neCount{background:rgba(179,54,42,.16);}
.nextEv.war.soon{animation:warSoon 1.3s infinite;}
@keyframes warSoon{0%,100%{box-shadow:0 0 0 0 rgba(179,54,42,.0)}50%{box-shadow:0 0 0 3px rgba(179,54,42,.35)}}

/* ===== §S4 モーダル共通・クイズ ===== */
.ovl{position:fixed; inset:0; z-index:40; background:rgba(10,14,26,.78); display:none;
  align-items:flex-start; justify-content:center; overflow-y:auto; padding:18px 10px 40px;}
.ovl.on{display:flex;}
.box{width:min(500px,100%); background:var(--paper); border-radius:18px; border:3px solid var(--line);
  padding:16px; animation:rise .25s ease;}
@keyframes rise{from{transform:translateY(24px); opacity:0}to{transform:none; opacity:1}}
.box h2{margin:0 0 8px; font-size:20px;}
.evYear{font-size:13px; font-weight:800; color:var(--red); letter-spacing:.15em;}
/* イベントの絵文字アート（画像は将来差し替え・2026-06-11 ユーザー要望） */
.evArt{text-align:center; font-size:52px; line-height:1.25; letter-spacing:.1em; padding:10px 0 6px;
  background:linear-gradient(180deg,var(--paper2),transparent); border-radius:12px; margin:6px 0;}
.evText{font-size:15px; line-height:1.85; white-space:pre-wrap; margin:8px 0 14px;}
.fxLine{display:none; margin:-4px 0 12px; padding:8px 12px; border-radius:10px; background:#e8f6ec;
  border:2px solid var(--green); font-size:14px; font-weight:800; color:#1d6b40; line-height:1.7;}
.fxLine.on{display:block; animation:rise .3s ease;}
.qBadge{display:inline-block; font-size:12px; font-weight:800; color:#fff; background:var(--blue);
  border-radius:999px; padding:3px 12px; margin-bottom:8px;}
.qBadge.buyu{background:var(--red);} .qBadge.chiryaku{background:var(--blue);}
.qBadge.seiji{background:var(--green);} .qBadge.ninbo{background:var(--purple);}
.qHint{font-size:12px; color:#6b5a3e; background:var(--paper2); border-radius:8px; padding:6px 10px; margin-bottom:10px;}
.qText{font-size:16px; font-weight:700; line-height:1.8; white-space:pre-wrap; margin-bottom:12px;}
.choices{display:grid; gap:8px;}
.choice{padding:12px 12px; border:3px solid var(--line); border-radius:12px; background:#fffdf4;
  font-size:15px; font-weight:700; text-align:left; line-height:1.5; transition:transform .06s;}
.choice:active{transform:scale(.985);}
.choice.good{background:#d7f5e1; border-color:var(--green);}
.choice.bad{background:#fbdcd5; border-color:var(--red); animation:shake .3s;}
.choice.lock{pointer-events:none;}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.descBox{margin-top:12px; background:#fff8e4; border:2px solid var(--gold); border-radius:12px; padding:10px 12px;
  font-size:14px; line-height:1.75;}
.descBox b{color:#8a6605;}
/* 折りたたみ（2026-06-14「文字が多い」対策）。合戦の解説/いきさつをたたんでテンポ重視・タップで展開 */
.fold{margin-top:12px; background:#fff8e4; border:2px solid var(--gold); border-radius:12px; overflow:hidden;}
.fold.dim{background:rgba(245,238,212,.92); border-color:var(--line);}
.fold>summary{list-style:none; cursor:pointer; padding:9px 12px; font-size:13.5px; font-weight:800; color:#8a6605;
  display:flex; align-items:center; gap:6px;}
.fold>summary::-webkit-details-marker{display:none;}
.fold>summary::after{content:'ひらく ▾'; margin-left:auto; font-size:11px; color:#a9925a; transition:transform .2s;}
.fold[open]>summary::after{content:'とじる ▴';}
.fold>.foldBody{padding:0 12px 11px; font-size:14px; line-height:1.78;}
.fold>.foldBody b{color:#8a6605;}
.resLine{margin-top:12px; font-size:15.5px; font-weight:800; text-align:center; line-height:1.7; white-space:pre-wrap;}
.resLine .big{font-size:21px; color:var(--green);}
.resLine .fail{color:var(--red);}
.pushRow{display:grid; gap:8px; margin-top:12px;}
.pushNote{font-size:12px; color:#6b5a3e; text-align:center;}

/* ===== §S5 合戦絵巻（2026-06-12 生徒FB対応。設計: DESIGN_SENGOKU_BATTLE_V2.md） ===== */
.bField{position:relative; background:linear-gradient(180deg,#3a2430,#1d1622); border-radius:14px;
  padding:10px 12px 12px; color:var(--paper); margin:8px 0 10px; overflow:hidden; cursor:pointer;}
.bSky{text-align:center; font-size:12.5px; font-weight:800; color:#cdbb88; margin-bottom:6px;}
/* G1第2弾(2026-06-13): 自軍/敵軍を「カード」化し兵力数値を最重要情報に。Codexレイアウト診断を反映 */
.bArmies{display:flex; align-items:stretch; justify-content:space-between; gap:6px;}
.bSide{text-align:left; flex:0 0 41%; padding:5px 9px; border-radius:10px;
  background:rgba(13,17,30,.42); border-bottom:3px solid #3a6ea5;}
.bSide.foe{text-align:right; border-bottom-color:var(--red);}
.bName{font-weight:900; font-size:13px;} .bName.en{color:#ff9d8a;}
/* 敵将の肖像（第3便・2026-06-13）。敵カードの名前の右に円形バストアップ */
.bFoeHead{display:flex; align-items:center; justify-content:flex-end; gap:6px;}
.bFoeFace{display:none; width:50px; height:50px; border-radius:999px; object-fit:cover; object-position:top center;
  border:2px solid var(--red); background:#2a1820; box-shadow:0 2px 7px rgba(0,0,0,.55); flex:none;}
.bHP{font-size:25px; font-weight:900; font-variant-numeric:tabular-nums;
  text-shadow:0 2px 3px rgba(0,0,0,.9), 1px 0 0 rgba(0,0,0,.6), -1px 0 0 rgba(0,0,0,.6);}
.bHP::after{content:'兵'; font-size:11px; font-weight:700; margin-left:2px; opacity:.7;}
.bSide.foe .bHP{color:#ff9d8a;}
.bVsTag{display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:900; color:var(--gold2);
  background:rgba(13,17,30,.7); border:1.5px solid var(--gold); border-radius:999px; width:34px; height:34px; align-self:center; flex:none;}
.bStrip{display:flex; align-items:center; justify-content:space-between; font-size:20px; margin:6px 0 4px; min-height:28px;}
.bStrip .bUnits{flex:0 0 42%; filter:drop-shadow(0 2px 3px rgba(0,0,0,.5)); letter-spacing:-3px; white-space:nowrap; overflow:hidden;}
.bStrip .bUnits.foe{transform:scaleX(-1); text-align:left;}
.bClash{font-size:22px; animation:clashPulse 1.6s infinite;}
@keyframes clashPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25) rotate(10deg)}}
/* 押し合いゲージ: 中央に金の「戦線」マーカー＝どちらが押しているか一目で */
.btBar{position:relative; height:15px; background:linear-gradient(90deg,#ff8d76,#b3362a); border-radius:9px; overflow:hidden; border:1px solid #5a4458;}
.btBar::after{content:''; position:absolute; left:50%; top:-2px; bottom:-2px; width:2px; transform:translateX(-50%);
  background:rgba(255,233,168,.55); z-index:2;}
.btBar .me{display:block; height:100%; background:linear-gradient(90deg,#7fb6ff,#3a6ea5); border-right:3px solid #ffe9a8;
  transition:width .85s cubic-bezier(.34,1.56,.64,1);} /* overshoot lurch＝押し合いの「うねり」が見える(research: narrate the change) */
/* 結果エフェクト4階調: 会心=大シェイク+フラッシュ / 有効=中 / 不発=小 / しくじり=被弾 */
/* 強さ --fx でラウンド逓増（R1=1 → 決戦=1.6）。会心ほど・終盤ほど大きく揺れ光る */
.bField.fxBig{animation:shakeBig calc(.46s + var(--fx,1)*.09s);} .bField.fxMid{animation:shakeMid .45s;}
.bField.fxSmall{animation:dimSmall .5s;} .bField.fxBad{animation:shakeBad .52s;}
@keyframes shakeBig{0%,100%{transform:none}
  15%{transform:translate(calc(var(--fx,1)*-7px),calc(var(--fx,1)*3px)) rotate(-1deg)}
  30%{transform:translate(calc(var(--fx,1)*7px),calc(var(--fx,1)*-3px)) rotate(1deg)}
  45%{transform:translate(calc(var(--fx,1)*-6px),2px)}60%{transform:translate(calc(var(--fx,1)*6px),-2px)}75%{transform:translate(-3px,1px)}}
@keyframes shakeMid{0%,100%{transform:none}25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-2px,1px)}}
@keyframes dimSmall{0%,100%{filter:none}50%{filter:brightness(.78)}}
@keyframes shakeBad{0%,100%{transform:none}20%{transform:translate(-5px,1px) rotate(.5deg)}40%{transform:translate(5px,-1px) rotate(-.5deg)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.bField.fxBig::after{content:''; position:absolute; inset:0; mix-blend-mode:screen; background:rgba(255,235,160,.5);
  animation:flashOut calc(.4s + var(--fx,1)*.12s) forwards; pointer-events:none;}
@keyframes flashOut{from{opacity:1}to{opacity:0}}
.bCutin{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none;
  font-size:36px; font-weight:900; color:#fff3c8; letter-spacing:.04em;
  text-shadow:0 0 22px rgba(243,207,93,1), 0 0 6px rgba(255,255,255,.9), 0 3px 6px rgba(0,0,0,.7);
  opacity:0; transform:scale(.6); z-index:3;}
/* 会心カットイン: 集中線バースト＋スラムイン（演出強化第1弾・2026-06-14夜） */
.bCutin.on{animation:cutinSlam 1.3s forwards;}
.bCutin.on::before{content:''; position:absolute; inset:-40%; z-index:-1;
  background:repeating-conic-gradient(rgba(255,235,160,.30) 0deg 5deg, transparent 5deg 13deg);
  mask:radial-gradient(circle, transparent 18%, #000 42%, transparent 72%);
  -webkit-mask:radial-gradient(circle, transparent 18%, #000 42%, transparent 72%);
  animation:burstSpin 1.3s ease-out forwards;}
@keyframes cutinSlam{0%{opacity:0; transform:scale(2.6) rotate(-5deg)}22%{opacity:1; transform:scale(.92) rotate(1.5deg)}36%{transform:scale(1.08)}50%{transform:scale(1)}82%{opacity:1}100%{opacity:0; transform:scale(1.06)}}
@keyframes burstSpin{0%{opacity:0; transform:rotate(0) scale(.5)}18%{opacity:1}100%{opacity:0; transform:rotate(35deg) scale(1.3)}}
/* ===== 合戦 演出強化 第2弾（2026-06-14夜・research: Vlambeer juice / Uma実況 / 栄冠采配 / comeback） ===== */
/* ① ワインドアップ(タメ): 結果直前に画面を一瞬沈ませ「衝撃が来る」予兆を作る */
.bField.windup{filter:brightness(.78) saturate(.85); transition:filter .12s;}
/* ② しくじり=別レジスタの「被弾」: 赤ヴィネット */
.bField.fxBad::after{content:''; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(circle, transparent 36%, rgba(150,8,8,.55)); animation:vignetteOut .8s forwards;}
@keyframes vignetteOut{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
/* ③ 兵力数のパルス＋落下するダメージ数（lasting trace＝爪痕を残す） */
@keyframes hpPulse{0%{transform:scale(1)}45%{transform:scale(1.14)}100%{transform:scale(1)}}
.bHP.pulse{animation:hpPulse .22s;}
.dmgFloat{position:absolute; top:2px; font-weight:900; font-size:17px; pointer-events:none; z-index:5;
  text-shadow:0 1px 3px rgba(0,0,0,.85); animation:dmgUp 1.1s ease-out forwards;}
.dmgFloat.foe{color:#ffd34d; right:8px;} .dmgFloat.me{color:#ff6b5a; left:8px;}
@keyframes dmgUp{0%{opacity:0; transform:translateY(8px) scale(.7)}20%{opacity:1; transform:translateY(-2px) scale(1.12)}100%{opacity:0; transform:translateY(-26px) scale(1)}}
/* ④ 勢いタグ: 押し合いの実況をバー上にふわっと（research: 数値でなく「変化」を語る） */
.swingTag{position:absolute; left:50%; top:-23px; transform:translateX(-50%); white-space:nowrap;
  font-size:13px; font-weight:900; color:#fff3c8; text-shadow:0 1px 4px rgba(0,0,0,.95); pointer-events:none; z-index:3;
  animation:swingUp 1.25s ease-out forwards;}
@keyframes swingUp{0%{opacity:0; transform:translate(-50%,7px) scale(.8)}25%{opacity:1; transform:translate(-50%,0) scale(1.12)}100%{opacity:0; transform:translate(-50%,-11px)}}
/* ⑤ ラストスパート(最終ラウンド): 戦場が紅潮しバーが脈打つ＝決戦の空気 */
.bField.lastSpurt{filter:saturate(1.32) brightness(.96) contrast(1.04);}
.bField.lastSpurt .btBar{animation:barPulse 1.1s infinite;}
@keyframes barPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,233,168,0)}50%{box-shadow:0 0 11px 2px rgba(255,233,168,.75)}}
.lastSpurtBanner{text-align:center; font-weight:900; font-size:14.5px; color:#b3362a; letter-spacing:.06em; margin:0 0 6px;
  background:#fbe7e2; border:2px solid var(--red); border-radius:10px; padding:5px; animation:logIn .4s ease-out;}
/* ⑥ 決着の全画面タメ→解放（peak-end＝最後の一撃が一番記憶に残る） */
.kessenVeil{position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center;
  background:rgba(8,6,12,.86); color:#ffe9a8; font-size:34px; font-weight:900;
  font-family:"Yu Mincho","Hiragino Mincho ProN",serif; opacity:0; pointer-events:none;}
.kessenVeil.on{animation:kessen 1.1s ease-out forwards;}
@keyframes kessen{0%{opacity:0; letter-spacing:.1em}22%{opacity:1}68%{opacity:1; letter-spacing:.45em}100%{opacity:0; letter-spacing:.55em}}
/* ⑦ 会心パーティクル（≤8・transform/opacityのみ） */
.bSpark{position:absolute; left:50%; top:46%; font-size:20px; pointer-events:none; z-index:4;
  animation:spark .66s ease-out forwards;}
@keyframes spark{0%{opacity:1; transform:translate(-50%,-50%) scale(.4)}100%{opacity:0; transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.1) rotate(var(--r))}}
/* ⑧ ノックバック: 殴られた側がのけぞる＝どちらが押したか一目 */
.bSide.knock{animation:knockFx .4s cubic-bezier(.34,1.56,.64,1);}
@keyframes knockFx{0%{transform:translateX(var(--kx,0))}100%{transform:translateX(0)}}
@keyframes softFade{0%{opacity:0}14%{opacity:1}80%{opacity:1}100%{opacity:0}}
/* アクセシビリティ(2026-06-14・Codexレビュー反映): モーション控えめ設定では揺れ・脈動・飛散・集中線まで止める
   （色フラッシュ/数字変化/フェードは残す＝情報は伝わるが酔いの原因を除く。学校端末・混在デバイス対策） */
@media (prefers-reduced-motion: reduce){
  .bField.fxBig,.bField.fxMid,.bField.fxBad,.bField.windup{animation:none !important; filter:none !important;}
  .btBar .me{transition:width .3s linear;}
  .bField.lastSpurt .btBar,.bSide.knock,.bClash{animation:none !important;}
  .bSpark{display:none !important;}              /* 火花の飛散を止める */
  .bCutin.on::before{display:none !important;}    /* 回る集中線を止める */
  .bCutin.on{animation:softFade .9s forwards !important;}
  .swingTag,.dmgFloat,.kessenVeil.on{animation:softFade 1.1s forwards !important;} /* 移動なしのフェードのみ */
}

@keyframes swingt{0%{opacity:0; transform:translateY(8px)}18%{opacity:1; transform:translateY(0)}80%{opacity:1}100%{opacity:0}}

<script>
/* ============================================================
   エンジン
   §1 定数・状態 / §2 セーブ / §3 クイズ抽選 / §4 育成ターン
   §5 トレーニング解決 / §6 年表イベント / §7 合戦 / §8 終了評価
   §9 UI描画 / §10 殿堂・まなび帳
   ============================================================ */
const Game = (function(){
  /* ===== §1 定数・状態 ===== */
  const D = SENGOKU_DATA;
  // Codex生成の追加問題（questions_extra.js）があれば結合
  if (typeof SENGOKU_QUESTIONS_EXTRA !== 'undefined') D.QUESTIONS.push(...SENGOKU_QUESTIONS_EXTRA);

  // 育成中の偉人パック（シナリオ固有データは必ず H 経由で参照。将来ここが選択式になる）
  let H = D.HEROES.nobunaga;
  const MOODS = [
    { label:'絶不調', icon:'😵', mul:0.8, cls:'#e0533d' },
    { label:'不調',   icon:'😟', mul:0.9, cls:'#d96f30' },
    { label:'ふつう', icon:'😐', mul:1.0, cls:'#bbb' },
    { label:'好調',   icon:'😊', mul:1.1, cls:'#7fd49a' },
    { label:'絶好調', icon:'🔥', mul:1.2, cls:'#f3cf5d' },
  ];
  const STAT_KEYS = ['buyu','chiryaku','seiji','ninbo'];
  // 2026-06-12 生徒FB「体力が減らなすぎ」: 18→24に増。側近が同席する鍛錬は1人につき-2軽減（最低15）
  const TRAIN_COST = 24;
  /* ===== 側近ロスター（Phase1 側近ガチャ化・2026-06-18）=====
     育成中に同席する側近の一覧。現状は偉人固定（roster()）にフォールバック。
     将来はプレイヤーの収集デッキ（P.deck）から解決した S.roster を返す（PLAN_IJIN_SIDEKICK_GACHA.md）。
     ※ body は H['retainers'] 表記（このあとの一括置換が自身に再帰しないため） */
  function roster(){ return (S && S.roster && S.roster.length) ? S.roster : (H ? H['retainers'] : []); }
  function matePerks(genre, type){
    return (S.placement[genre]||[])
      .map(id=>roster().find(x=>x.id===id))
      .filter(r=>r && r.perk && r.perk.type===type);
  }
  function trainCost(genre){
    const mates = (S.placement[genre]||[]).length;
    let c = TRAIN_COST - mates*2;
    matePerks(genre,'cost').forEach(r=>{ c -= r.perk.v; });
    // 偉人固有スキル等の全鍛錬コスト軽減（家康「忍耐」fx.costAll・2026-06-14夜）
    if (S.skills) Object.keys(S.skills).forEach(id=>{ const fx=skillFx(id); if (fx && fx.costAll) c -= fx.costAll; });
    return Math.max(12, c);
  }
  const RANKS = [ // [必要評価点, ランク名, ひとこと]（追憶の章ボーナス込み前提・2026-06-13改定）
    [0,'みならい','まだまだこれから。次はもっと学んでみよう！'],
    [210,'若手','名が知られ始め、まわりが注目しはじめた。'],
    [360,'一人前','一人前として、まわりから頼りにされる存在になった。'],
    [500,'中堅','大きな仕事を任される、たのもしい存在になった。'],
    [720,'名士','その名が広く知れわたる、ひとかどの人物になった！'],
    [930,'偉人','見事、歴史にその名を刻んだ！ きみの名は永遠に語り継がれる！'],
  ];

  let S = null;        // 育成中の状態（runState）
  let P = loadPersist(); // 永続データ {hall:[], legacy:[], book:[]}

  function newRun(legacyIdx, tpy){
    const s = {
      hero:H.id, year:H.startYear,
      tpy: tpy===2?2:1, half:0, // v1.5 半年制（春/秋）。tpy=2でターン倍増・年表イベントは春に発火
      buyu:H.start.buyu, chiryaku:H.start.chiryaku, seiji:H.start.seiji, ninbo:H.start.ninbo,
      stamina:100, mood:2, koku:H.start.koku, wins:0, battles:0,
      injury:null, skillPt:0, skills:{}, trainStreak:0, chronicle:[], gstat:{},
      bonds:{}, bondMaxDone:{}, bondMidDone:{}, usedQ:[], placement:{}, correctTotal:0, answerTotal:0,
      pendingEventDone:{},
    };
    roster().forEach(r=>s.bonds[r.id]=20);
    if (H.uniqueSkill) s.skills[H.uniqueSkill.id] = true; // 偉人固有スキルは最初から所持
    if (legacyIdx!=null && P.legacy[legacyIdx]){
      const lg = P.legacy[legacyIdx];
      s[lg.stat] += lg.val;
      toast(`📜 遺訓「${lg.name}」発動！ ${statName(lg.stat)}+${lg.val}`);
      P.legacy.splice(legacyIdx,1); savePersist();
    }
    return s;
  }

  // 偉人の切り替え（育成開始前のみ呼ぶこと）
  function setHero(id){
    if (D.HEROES[id]) H = D.HEROES[id];
  }

  // スキルIDから効果を引く（D.SKILLSは効果コード直書きなので対象外。側近スキル/偉人固有用）
  function skillFx(id){
    if (H.uniqueSkill && H.uniqueSkill.id===id) return H.uniqueSkill.fx;
    for (const r of roster()){ if (r.skill && r.skill.id===id) return r.skill.fx; }
    return null;
  }
  function skillInfo(id){
    const s = D.SKILLS.find(x=>x.id===id); if (s) return s;
    if (H.uniqueSkill && H.uniqueSkill.id===id) return H.uniqueSkill;
    for (const r of roster()){ if (r.skill && r.skill.id===id) return r.skill; }
    return null;
  }

  /* ===== §2 セーブ ===== */
  const SAVE_KEY = 'sengoku_save_v1';
  function saveAll(){
    try{ localStorage.setItem(SAVE_KEY, JSON.stringify({run:S, persist:P})); }catch(e){}
  }
  function loadRaw(){
    try{ return JSON.parse(localStorage.getItem(SAVE_KEY)||'null'); }catch(e){ return null; }
  }
  function loadPersist(){
    const raw = loadRaw();
    const p = (raw && raw.persist) || {};
    return { hall:p.hall||[], legacy:p.legacy||[], book:p.book||[], coins:p.coins||0 };
  }
  function savePersist(){ saveAll(); }

  /* セーブの書出/読込（機種変更・バックアップ用・G1第2弾 2026-06-13）。理科RPGのRIKA1:方式と同型 */
  const IO_PREFIX = 'SGK1:';
  function exportSave(){
    const raw = loadRaw() || { run:S, persist:P };
    return IO_PREFIX + btoa(unescape(encodeURIComponent(JSON.stringify(raw))));
  }
  function importSave(text){
    const t = (text||'').trim();
    if (!t.startsWith(IO_PREFIX)) return { ok:false, msg:'コードが「SGK1:」で始まっていません' };
    try{
      const data = JSON.parse(decodeURIComponent(escape(atob(t.slice(IO_PREFIX.length)))));
      if (!data || typeof data!=='object' || !data.persist) return { ok:false, msg:'コードの中身が読めませんでした' };
      localStorage.setItem(SAVE_KEY, JSON.stringify(data));
      return { ok:true };
    }catch(e){ return { ok:false, msg:'コードが壊れているようです（コピーが途中で切れていないか確認）' }; }
  }
  function hasRun(){ const r=loadRaw(); return !!(r && r.run); }
  function resume(){
    const raw = loadRaw();
    if (raw && raw.run){
      S = raw.run;
      H = D.HEROES[S.hero] || D.HEROES.nobunaga;
      S.hero = H.id;
      // 旧セーブの欠損補完（ケガ/スキルP=06-11、スキル/鍛錬連続/側近6人=06-13追加）
      S.injury = S.injury || null;
      S.skillPt = S.skillPt || 0;
      S.skills = S.skills || {};
      S.trainStreak = S.trainStreak || 0;
      S.chronicle = S.chronicle || [];
      S.gstat = S.gstat || {};
      S.bondMidDone = S.bondMidDone || {};
      S.tpy = S.tpy===2 ? 2 : 1; S.half = S.half||0; // 半年制（v1.5）以前のセーブは年制

      if (H.uniqueSkill && S.skills[H.uniqueSkill.id]==null) S.skills[H.uniqueSkill.id] = true;
      roster().forEach(r=>{ if (S.bonds[r.id]==null) S.bonds[r.id]=20; });
      UI.show('game');
      if (S.epi){ UI.renderGame(); epilogueNext(); return; }
      turnStart(true);
    }
  }
  function clearRun(){ S=null; saveAll(); }

  /* ===== §3 クイズ抽選 =====
     通常特訓=易しめ（テンポ重視）／合戦=難しめ（決戦の重み）— 2026-06-11 教師FB */
  function diffWeights(kind){
    if (kind==='battle') return {1:20,2:55,3:25};
    const t = S.year - H.startYear;
    if (t<=10) return {1:85,2:15,3:0};
    if (t<=21) return {1:65,2:30,3:5};
    return {1:50,2:40,3:10};
  }
  function pickQuestion(genre, kind){
    const ep = H.eraPref;
    const top = ep ? Object.keys(ep).filter(k=>ep[k]>=1) : [];  // 自時代(重み>=1)＝その偉人が生きた時代群。新偉人は自時代のみ(他0.01)、家康はsengoku/azuchi/edoを含む
    const w = diffWeights(kind);
    let pool = D.QUESTIONS.map((q,i)=>({q,i})).filter(o=>o.q.genre===genre && !S.usedQ.includes(o.i));
    if (!pool.length){ // 使い切ったらこのジャンルの使用済みをリセット
      S.usedQ = S.usedQ.filter(i=>D.QUESTIONS[i].genre!==genre);
      pool = D.QUESTIONS.map((q,i)=>({q,i})).filter(o=>o.q.genre===genre);
    }
    // 難易度の重み抽選 → その難易度から1問（無ければ全体から）
    const r = Math.random()*100; let want = 1, acc = 0;
    for (const d of [1,2,3]){ acc += w[d]; if (r < acc){ want = d; break; } }
    let cand = pool.filter(o=>o.q.diff===want);
    if (!cand.length) cand = pool;
    // 自分の時代を最優先（「自分の時代の問題が出ない」対策の本命）:
    // 候補に自時代問が1問でもあれば候補をそれだけに絞る。←重み0.01でも他時代問が大量(100問超)に
    //   あると合計が効いてしまい、自時代の未使用が残り少ないと他時代へ流れる現象を断つ。
    // 候補に自時代問が無ければ、自時代×ジャンル×難易度(無ければ難易度不問)の使用済みを回収して使う。
    // その時代にそのジャンルの問が全く無いときだけ、従来どおり他時代へフォールバックする。
    if (top.length){
      let own = cand.filter(o=>top.includes(o.q.era||'sengoku'));
      if (!own.length){
        let recyc = D.QUESTIONS.map((q,i)=>({q,i})).filter(o=>o.q.genre===genre && o.q.diff===want && top.includes(o.q.era||'sengoku'));
        if (!recyc.length) recyc = D.QUESTIONS.map((q,i)=>({q,i})).filter(o=>o.q.genre===genre && top.includes(o.q.era||'sengoku'));
        if (recyc.length){ const ids=new Set(recyc.map(o=>o.i)); S.usedQ=S.usedQ.filter(i=>!ids.has(i)); own=recyc; }
      }
      if (own.length) cand = own;
    }
    // 同一時代内は eraPref 重み（基本は均等）で抽選。eraPref が無い偉人は全時代等価
    const sel = ep ? weightedPick(cand, o=>ep[o.q.era||'sengoku'] ?? 1)
                   : cand[Math.floor(Math.random()*cand.length)];
    S.usedQ.push(sel.i);
    return sel;
  }
  function weightedPick(arr, wf){
    let sum = 0; const ws = arr.map(a=>{ const w = Math.max(0, wf(a)); sum += w; return w; });
    if (!sum) return arr[Math.floor(Math.random()*arr.length)];
    let r = Math.random()*sum;
    for (let i=0;i<arr.length;i++){ r -= ws[i]; if (r<0) return arr[i]; }
    return arr[arr.length-1];
  }
  // 選択肢シャッフル（出題ごとに正解位置をランダム化）
  function shuffled(q){
    const idx = [0,1,2,3].sort(()=>Math.random()-0.5);
    return { c: idx.map(i=>q.c[i]), a: idx.indexOf(q.a) };
  }

  /* ===== §4 育成ターン ===== */
  function failRate(){ // 体力依存の失敗率（%表示用）
    return Math.max(0, Math.round((42 - S.stamina) * 1.1));
  }
  function placeRetainers(){
    S.placement = {};
    // 6人化に伴い出現率を下げる（1人あたりの効果もtrainGain側で減・2026-06-13）
    roster().forEach(r=>{
      if (Math.random() < 0.5){
        const keys = STAT_KEYS;
        // 80%で得意コマンドに寄る（2026-06-14 生徒FB「重複が狙えない」→得意率を強化）
        const k = Math.random()<0.8 ? r.fav : keys[Math.floor(Math.random()*keys.length)];
        (S.placement[k] = S.placement[k]||[]).push(r.id);
      }
    });
  }
  function timelineEvent(){ return H.timeline.find(e=>e.year===S.year); }

  function turnStart(restored){
    if (!restored) placeRetainers();
    else if (!S.placement || !Object.keys(S.placement).length) placeRetainers();
    // 気分の小イベント（やる気を日常的に動かす・2026-06-13 生徒FB対応）
    if (!restored && !timelineEvent() && Math.random()<0.12){
      if (Math.random()<0.5 && S.mood<4){ S.mood++; toast('☀️ 気持ちのいい朝だ。やる気UP！'); }
      else if (S.mood>0){ S.mood--; toast('🌧️ 長雨続きで、気分が少し沈む…'); }
    }
    saveAll();
    UI.renderGame();
    const ev = timelineEvent();
    if (ev && !S.pendingEventDone[ev.year]){
      // 350ms以内に先行クリック（doCommand側ガード）で消化済みなら二重発火しない
      setTimeout(()=>{ if (S && !S.pendingEventDone[ev.year]) fireEvent(ev); }, 350);
    }
  }
  function nextTurn(){
    // 半年制: 春→秋→翌年の春。年表イベントは春（年の最初のターン）にだけ発火する
    if ((S.tpy||1)===2 && !S.half){ S.half = 1; }
    else { S.half = 0; S.year++; }
    if (S.year > H.endYear){ endRun(false); return; } // 保険（finalで終わるはず）
    placeRetainers();
    turnStart();
  }
  /* v1.5 半年制の補正係数（_sim_test.js で経験校正・2026-06-14）。
     成長の多く（開始値・イベントfx・絆MAX・追憶・合戦の石高/勝利点）は固定値のため、
     ターン2倍でも評価点は約1.35倍・最終ステは約1.5倍にしか伸びない。
     HALF_SCORE で評価点を割って年制とランク基準を共有し、HALF_REQ でIF条件を引き上げる */
  const HALF_SCORE = 1.38;
  function scoreScale(){ return (S.tpy||1)===2 ? (H.halfScoreScale || HALF_SCORE) : 1; }
  // IF条件の倍率は成長余地が偉人ごとに違うため偉人パックで個別校正できる（既定1.75）
  function reqScale(){ return (S.tpy||1)===2 ? (H.halfReqScale || 1.75) : 1; }

  /* ===== §5 トレーニング解決 ===== */
  let cur = null; // 現在のクイズ文脈 {mode:'train'|'battle'|'review', genre, sel, sh, ...}

  // 未消化の年表イベントがあれば先に処理（連打・先行クリック対策）。発火したら true
  function guardEvent(){
    const ev = timelineEvent();
    if (ev && !S.pendingEventDone[ev.year]){ fireEvent(ev); return true; }
    return false;
  }
  function doCommand(k){
    if (guardEvent()) return;
    // ケガ中は治療が最優先（2026-06-11 ユーザー要望: ケガを直さないと次に進めない）
    if (S.injury && k!=='care'){ toast('🤕 ケガの体では無理はできぬ…。🌿手当てを受けよう'); return; }
    if (k==='care'){
      if (!S.injury){ toast('🌿 いまは元気そのものだ！'); return; }
      S.trainStreak = 0;
      S.injury = null;
      const heal = 40 + Math.floor(Math.random()*11);
      S.stamina = Math.min(100, S.stamina+heal);
      // 塞翁が馬: 治療が思わぬ福を呼ぶことがある（保健室を「ただの1回休み」にしない）
      if (Math.random() < 0.25){
        const lucks = [
          { t:'寝込んでいる間に、たくさんの書物を読みふけった！', fx:{chiryaku:12} },
          { t:'見舞いに来た人たちと、夜通し語り合った。', fx:{ninbo:8}, bond:12 },
          { t:'療養先で、思いがけず豊かな実りの地を見つけた！', fx:{koku:40} },
          { t:'体の芯から力がみなぎってきた。完全復活だ！', fx:{stamina:60, mood:2} },
        ];
        const l = lucks[Math.floor(Math.random()*lucks.length)];
        if (l.bond) roster().forEach(r=>S.bonds[r.id]=Math.min(100, S.bonds[r.id]+l.bond));
        applyFx(l.fx);
        saveAll();
        UI.showEvent({ year:S.year, type:'story', title:'🌿 塞翁（さいおう）が馬！', art:'🌿🐴',
          text:`手当てのおかげで、ケガはすっかり治った。\nそれどころか——\n\n${l.t}${l.bond?'\n（みんなの絆もアップ！）':''}` },
          ()=>nextTurn(), l.fx);
        return;
      }
      S.mood = Math.min(4, S.mood+1);
      saveAll();
      toast(`🌿 手当てでケガが治った！ 体力+${heal}・やる気UP`);
      nextTurn(); return;
    }
    if (k==='skirmish'){ startSkirmish(); return; }
    if (k==='rest'){
      S.trainStreak = 0;
      let heal = 45 + Math.floor(Math.random()*11);
      Object.keys(S.skills||{}).forEach(id=>{ const fx=skillFx(id); if (fx && fx.restPlus) heal += fx.restPlus; });
      S.stamina = Math.min(100, S.stamina+heal);
      // まなび帳があれば復習出題（ノーリスク）
      if (P.book.length){
        const bi = Math.floor(Math.random()*P.book.length);
        cur = { mode:'review', bookIdx:bi, genre:P.book[bi].genre };
        UI.openQuiz(P.book[bi], cur);
        toast(`😴 休息で体力+${heal}。まなび帳から復習だ！`);
        return;
      }
      toast(`😴 ゆっくり休んだ。体力+${heal}`);
      nextTurn(); return;
    }
    if (k==='trip'){
      S.trainStreak = 0;
      S.stamina = Math.min(100, S.stamina+25);
      S.mood = Math.min(4, S.mood+1);
      let k2 = 10+Math.floor(Math.random()*11);
      if (S.skills && S.skills.zeni) k2 = Math.round(k2*1.5);
      Object.keys(S.skills).forEach(id=>{ const fx=skillFx(id); if (fx && fx.tripKoku) k2 = Math.round(k2*fx.tripKoku); });
      S.koku += k2;
      toast(`👀 まわりの様子を見て回った。やる気UP！ ${rName()}+${fmtKoku(k2)}`);
      nextTurn(); return;
    }
    // 鍛錬: クイズへ
    cur = { mode:'train', genre:k };
    const sel = pickQuestion(k);
    cur.sel = sel;
    UI.openQuiz(sel.q, cur);
  }

  function trainGain(q, opts){
    // 基本上昇量 = 9 + diff*2 + 乱数 → やる気 → 側近 → 友情（6人化に伴い1人あたり効果は減・2026-06-13）
    let g = 8 + q.diff*2 + Math.floor(Math.random()*4);
    g = g * MOODS[S.mood].mul;
    const mates = S.placement[cur.genre]||[];
    g += mates.length*2;
    matePerks(cur.genre,'gain').forEach(r=>{ g += r.perk.v; });
    Object.keys(S.skills||{}).forEach(id=>{ const fx=skillFx(id); if (fx && fx.trainAll) g += fx.trainAll; });
    let friend = false;
    mates.forEach(id=>{
      const r = roster().find(x=>x.id===id);
      if (r.fav===cur.genre && S.bonds[id]>=80){ friend = true; }
    });
    if (friend) g *= 1.6;
    if (S.skills && S.skills.manabi) g *= 1.1;
    let crit = false;
    if (opts.correct && Math.random()<0.1){ crit = true; g *= 1.5; }
    if (opts.push) g *= 0.75; // 押し切りは8割弱の力（失敗率8%固定とセット・正解優位は維持）
    if (opts.half) g *= 0.6;
    return { gain:Math.round(g), friend, crit, mates };
  }

  function applyTraining(res, failed){
    const k = cur.genre;
    // 鍛錬の続けすぎでやる気が下がる（3連続から確率上昇・2026-06-13 生徒FB「やる気が動かない」対応）
    S.trainStreak = (S.trainStreak||0) + 1;
    if (S.trainStreak>=3 && S.mood>0 && Math.random() < 0.35 + 0.1*(S.trainStreak-3)){
      if (matePerks(k,'mood').length && Math.random()<0.5){
        S.moodMsg = '🦋 側近のはげましで、やる気の低下を防いだ！';
      } else {
        S.mood--;
        S.trainStreak = 2; // 続ければまた下がりうる
        S.moodMsg = '🔥 働き詰めで、やる気が下がった…（視察や休息で気分転換！）';
      }
    }
    if (failed){
      S.stamina = Math.max(0, S.stamina - trainCost(k) - 10);
      S.mood = Math.max(0, S.mood-1);
      S[k] = Math.max(1, S[k]-2);
    } else {
      S.stamina = Math.max(0, S.stamina - trainCost(k));
      S[k] += res.gain;
      // 副次上昇（主100%+副30%・2026-06-14 生徒FB「特化で詰む」対応）
      const sub = D.GENRES[k].sub;
      res.subGain = Math.max(1, Math.round(res.gain*0.3));
      if (sub==='koku' && matePerks(k,'kokuSub').length) res.subGain *= 2;
      if (sub==='koku') S.koku += res.subGain;
      else S[sub] += res.subGain;
      if (cur.lastCorrect) matePerks(k,'skillpt').forEach(r=>{ S.skillPt += r.perk.v; });
      res.subLabel = sub==='koku' ? `${rIcon()}${rName()}+${fmtKoku(res.subGain)}` : `${statName(sub)}+${res.subGain}`;
      // 絆上昇（6人化に伴い1回あたりを減）
      const uq = (H.uniqueSkill && S.skills[H.uniqueSkill.id]) ? (H.uniqueSkill.fx.bondPlus||0) : 0;
      res.mates.forEach(id=>{
        S.bonds[id] = Math.min(100, S.bonds[id] + 5 + (cur.lastCorrect?2:0) + uq);
      });
    }
    saveAll();
  }
  // やる気の変化メッセージを結果文に添える
  function takeMoodMsg(){
    if (!S.moodMsg) return '';
    const m = '\n' + S.moodMsg;
    S.moodMsg = null;
    return m;
  }
  // 絆イベント（絆50=中間イベント／絆MAX=ボーナス＋側近スキル授与）
  function checkBondMax(){
    for (const r of roster()){
      if (S.bonds[r.id]>=50 && S.bonds[r.id]<100 && !S.bondMidDone[r.id]){
        S.bondMidDone[r.id] = true;
        saveAll();
        UI.showEvent({ year:S.year, type:'story', title:`🤝 側近 ${r.name}との語らい`, art:`${r.icon}💬`, faceImg:(r.img||('assets/r_'+H.id+'_'+r.id+'.jpg')),
          text:(r.midText || `${r.name}との絆が深まってきた。`)
            + (r.skill ? `\n\n💖 絆 ${S.bonds[r.id]}/100 — このまま深めれば、絆MAXで側近スキル「${r.skill.icon}${r.skill.name}」を授かれる！` : '') }, ()=>UI.renderGame());
        return;
      }
    }
    for (const r of roster()){
      if (S.bonds[r.id]>=100 && !S.bondMaxDone[r.id]){
        S.bondMaxDone[r.id] = true;
        const fx = r.maxFx||{};
        STAT_KEYS.forEach(s=>{ if(fx[s]) S[s]+=fx[s]; });
        if (fx.stamina) S.stamina = Math.min(100, S.stamina+fx.stamina);
        if (fx.koku) S.koku += fx.koku;
        if (fx.mood) S.mood = Math.min(4, S.mood+fx.mood);
        S.skillPt += 5;
        S.chronicle.push({ y:S.year, t:r.name, r:'💖絆MAX' });
        let skillNote = '';
        if (r.skill){ S.skills[r.skill.id] = true; skillNote = `\n${r.skill.icon} 側近スキル「${r.skill.name}」を授かった！（${r.skill.desc}）`; }
        UI.showEvent({ year:S.year, type:'story', title:`💖 側近 ${r.name}・絆MAX！`, art:`${r.icon}💖`, faceImg:(r.img||('assets/r_'+H.id+'_'+r.id+'.jpg')),
          text:r.maxText + '\n\n🎁 絆MAXのごほうび： ✨スキルP+5' + skillNote }, ()=>UI.renderGame(), fx);
        saveAll();
        return;
      }
    }
  }

  /* 回答処理（クイズUIから呼ばれる） */
  function answer(choiceIdx){
    const correct = (choiceIdx === cur.sh.a);
    cur.lastCorrect = correct;
    // 学習レポート用: ジャンル別＋総数（全モード共通。学びのきろくのジャンル別%と総数のズレ防止）
    if (cur.genre && S && S.gstat){
      const gs = S.gstat[cur.genre] = S.gstat[cur.genre] || { a:0, c:0 };
      gs.a++; if (correct) gs.c++;
      S.answerTotal++; if (correct) S.correctTotal++;
    }
    if (cur.mode==='battle'){ return battleAnswer(correct); }
    if (cur.mode==='epilogue'){
      const E = S.epi;
      let text;
      if (correct){
        E.glow++;
        S[cur.genre] += 8; // 晩年の鍛錬（2026-06-14 生徒FB「選んだステの鍛錬効果」）
        text = D.EPILOGUE.okLines[Math.floor(Math.random()*D.EPILOGUE.okLines.length)]
          + `\n${statName(cur.genre)}+8（人生の輝き ${E.glow}/5）`;
        if (cur.bookIdx!=null && P.book[cur.bookIdx]){ P.book.splice(cur.bookIdx,1); text += '\n📖 まなび帳から1ページ卒業！'; savePersist(); }
      } else {
        text = D.EPILOGUE.ngLines[Math.floor(Math.random()*D.EPILOGUE.ngLines.length)];
      }
      saveAll();
      return { correct, text, done:'next' };
    }
    if (cur.mode==='review'){
      if (correct){
        const item = P.book[cur.bookIdx];
        S[item.genre] = (S[item.genre]||0) + 5;
        cur.res = { gain:5 };
        P.book.splice(cur.bookIdx,1);
        savePersist();
        return { correct, text:`復習成功！ ${statName(item.genre)}+5\nまなび帳から1ページ卒業！`, done:'next' };
      }
      return { correct, text:'まだ覚えきれていないようだ。解説を読んでおこう。\n（まなび帳に残しておくね）', done:'next' };
    }
    // train
    if (correct){
      const res = trainGain(cur.sel.q, {correct:true});
      cur.res = res;
      applyTraining(res, false);
      S.skillPt += 2;
      let t = `${statName(cur.genre)}+${res.gain}・${res.subLabel}！ ✨スキルP+2`;
      if (res.crit) t = `🌟大成功！ ${t}`;
      if (res.friend) t = `🌈友情特訓！ ${t}`;
      // 大成功・友情特訓は気分も上がる（2026-06-13 やる気活性化）
      if ((res.crit || res.friend) && S.mood<4 && Math.random()<0.5){
        S.mood++; t += '\n😊 手応えあり！ やる気UP！';
      }
      t += takeMoodMsg();
      saveAll();
      return { correct, text:t, done:'next' };
    }
    // 不正解 → まなび帳に記録し、押し切るか選ばせる
    addToBook(cur.sel.q);
    return { correct, push:true };
  }
  function addToBook(q){
    if (!P.book.some(b=>b.q===q.q)){
      P.book.push({ genre:q.genre, diff:q.diff, era:q.era, q:q.q, c:q.c, a:q.a, desc:q.desc });
      if (P.book.length>40) P.book.shift();
      savePersist();
    }
  }
  // 不正解後の選択: 押し切る or 学び直す
  // 押し切りの失敗率（2026-06-14 生徒FB: テンポ改善のため8%固定。低体力の無茶だけ+20%）
  function pushRate(){ return 8 + (S.stamina < 25 ? 20 : 0); }
  function pushThrough(){
    const fr = pushRate();
    const failed = Math.random()*100 < fr;
    if (failed){
      applyTraining(null, true);
      // 大失敗＝ケガ。ただしスキル「丈夫な体」なら半分の確率で耐える
      let t;
      if (S.skills && S.skills.joubu && Math.random()<0.5){
        t = `💥 大失敗！ 体力ガタ落ち・やる気ダウン・${statName(cur.genre)}-2\n🩹 だが「丈夫な体」のおかげでケガは免れた！`;
      } else {
        S.injury = 1;
        t = `💥 大失敗！ 無理がたたって倒れ、ケガをしてしまった……\n体力ガタ落ち・やる気ダウン・${statName(cur.genre)}-2\n\n🌿 まずは手当てを受けよう`;
      }
      saveAll();
      return { failed:true, text:t };
    }
    const res = trainGain(cur.sel.q, {correct:false, push:true});
    cur.res = res;
    applyTraining(res, false);
    let t = `気合で押し切った！ ${statName(cur.genre)}+${res.gain}・${res.subLabel}！`;
    if (res.friend) t = `🌈友情特訓！ ${t}`;
    return { failed:false, text:t + takeMoodMsg() };
  }
  function learnSafe(){
    const res = trainGain(cur.sel.q, {correct:false, half:true});
    cur.res = res;
    applyTraining(res, false);
    return { text:`解説をじっくり読んで学び直した。${statName(cur.genre)}+${res.gain}・${res.subLabel}（まなび帳に記録）` + takeMoodMsg() };
  }

  /* ===== §6 年表イベント ===== */
  function fireEvent(ev){
    S.pendingEventDone[ev.year] = true;
    if (ev.type==='battle'){ startBattle(ev); return; }
    if (ev.type==='final'){ startFinal(ev); return; }
    if (ev.type==='story'){
      UI.showEvent(ev, ()=>{ applyFx(ev.effects); UI.renderGame(); saveAll(); }, ev.effects);
      return;
    }
    if (ev.type==='choice'){ UI.showChoiceEvent(ev); return; }
  }
  function applyFx(fx){
    if (!fx) return;
    STAT_KEYS.forEach(k=>{ if(fx[k]) S[k]=Math.max(1,S[k]+fx[k]); });
    if (fx.stamina) S.stamina = Math.max(0, Math.min(100, S.stamina+fx.stamina));
    if (fx.mood) S.mood = Math.max(0, Math.min(4, S.mood+fx.mood));
    if (fx.koku) S.koku = Math.max(10, S.koku+fx.koku);
  }
  function choiceFx(ev, idx){
    const ch = ev.choices[idx];
    applyFx(ch.fx);
    S.chronicle.push({ y:ev.year, t:ev.title.split(' — ')[0], r:'☑ '+ch.label });
    saveAll();
    return ch;
  }

  /* ===== §7 合戦絵巻（戦況→采配→クイズ→結果4階調。設計: DESIGN_SENGOKU_BATTLE_V2.md） ===== */
  let B = null;
  function playerPower(){
    return Math.round(S.buyu*2.2 + S.chiryaku*1.6 + S.ninbo*0.6 + S.koku/15);
  }
  const TIER_VAL = { kaishin:1.4, yuko:1.0, fuhatsu:0.35, shikujiri:0 };
  // 勝敗式の重み（地力寄り・2026-06-15 オーナー方針）。battleProgress と battleResult で共有＝係数が二度と食い違わない。
  const W_RATIO = 0.68, W_QUIZ = 0.42; // 地力(ratio)を重く・采配クイズを軽く。win = ratio*W_RATIO + 加重クイズ*W_QUIZ >= 0.9

  // ラウンド加重: 決戦(終盤)ほど重い＝最後まで勝敗が決まらない(消化試合を防ぐ・2026-06-14)。
  // 期待値(平均)は重みの正規化で不変＝難度バランスは維持。変えるのは「どのラウンドが効くか」だけ
  function roundWeights(n){
    if (n<=1) return [1];
    const arr=[]; for(let i=0;i<n;i++) arr.push(0.88 + 0.28*(i/(n-1))); // 0.88 → 1.16 に逓増（決戦が最重・接戦は決戦で決まる／バランスへの影響は最小に・sim検証済 2026-06-14）
    return arr;
  }
  function startBattle(ev){
    const weights = roundWeights(ev.rounds.length);
    B = { ev, round:0, max:ev.rounds.length, score:0,
      weights, wtot:weights.reduce((a,b)=>a+b,0), wsum:0,
      meHP:ev.army.me, foeHP:ev.army.foe, opt:null, last:null, skirmish:!!ev.skirmish };
    UI.openBattle(ev);
  }
  // 采配を選ぶ → その采配の参照ステに対応するジャンルから出題
  function battlePick(optIdx){
    const opt = B.ev.rounds[B.round].opts[optIdx];
    B.round++;
    B.opt = opt;
    cur = { mode:'battle', genre:opt.genre };
    const sel = pickQuestion(opt.genre, B.skirmish? null : 'battle');
    cur.sel = sel;
    UI.openQuiz(sel.q, cur);
  }
  function battleAnswer(correct){
    const opt = B.opt;
    // 搦め手（trick）は参照ステ90以上で合致が1段「化ける」
    const fit = Math.min(2, opt.fit + ((opt.style==='trick' && S[opt.stat]>=90) ? 1 : 0));
    let tier, kokozo = false;
    if (correct){
      tier = (opt.hist || fit===2) ? 'kaishin' : (fit===1 ? 'yuko' : 'fuhatsu');
    } else {
      addToBook(cur.sel.q);
      tier = (opt.style==='risky') ? 'shikujiri' : 'fuhatsu';
      // スキル「ここぞの度胸」: しくじりを1周に1回だけ不発に踏みとどまる
      if (tier==='shikujiri' && S.skills && S.skills.kokozo && !S.kokozoUsed){
        S.kokozoUsed = true; kokozo = true; tier = 'fuhatsu';
      }
    }
    // 内部スコア = 階調 × ステ補正(0.85〜1.2) × 博打ボーナス
    let val = TIER_VAL[tier];
    if (tier==='kaishin' || tier==='yuko'){
      val *= Math.max(0.85, Math.min(1.2, 1 + (S[opt.stat]-60)/400));
      if (opt.style==='risky') val *= 1.2;
      // 側近スキル（合戦の采配強化）・偉人固有スキル
      Object.keys(S.skills||{}).forEach(id=>{
        const fx = skillFx(id);
        if (!fx) return;
        if (fx.battleStat===opt.stat) val *= 1.12;
        if (fx.riskyBoost && opt.style==='risky') val *= fx.riskyBoost;
      });
    }
    B.score += val;
    B.wsum += val * (B.weights[B.round-1] || 1); // ラウンド加重スコア（決戦が最重＝勝敗判定の主役）
    // 兵力表示の増減（演出用マッピング。勝敗は内部スコアで判定）
    const E0 = B.ev.army.foe, M0 = B.ev.army.me;
    const foeCut = { kaishin:0.17, yuko:0.11, fuhatsu:0.05, shikujiri:0.02 }[tier];
    const meCut  = 0.04 + (tier==='shikujiri' ? (opt.style==='risky' ? 0.14 : 0.10) : 0);
    B.foeHP = Math.max(Math.round(E0*0.08), B.foeHP - Math.round(E0*foeCut));
    B.meHP  = Math.max(Math.round(M0*0.10), B.meHP - Math.round(M0*meCut));
    B.last = { tier, opt, correct };
    const head = { kaishin: opt.hist? '⚡ 史実の一手で会心！' : '⚡ 会心！',
      yuko:'⭕ 有効打！', fuhatsu:'😶 不発…', shikujiri:'💢 しくじり！' }[tier];
    let text = (tier==='kaishin'||tier==='yuko') ? `${head}\n${opt.ok}`
      : tier==='fuhatsu' ? `${head}\n「${opt.label}」は戦況に響かなかった…`
          + ((opt.style==='trick' && S[opt.stat]<90) ? `\n（搦め手は${statName(opt.stat)}が高い(90+)ほど化ける。鍛えて再挑戦だ）` : '')
      : `${head}\n「${opt.label}」が裏目に出て、敵に押し込まれた！`;
    if (kokozo) text += '\n⚡「ここぞの度胸」で踏みとどまった！';
    return { correct, battle:true, last:(B.round>=B.max), text };
  }
  // 戦況の現在値（1.0=勝敗ライン）。新合戦演出のシーン充填(renderMomentum)の唯一の供給源。
  // 係数は battleResult と必ず一致させること（地力寄り 0.72/0.34・2026-06-15 オーナー方針）。
  function battleProgress(){
    const ratio = playerPower()/B.ev.enemyPower;
    // 加重スコアを「総加重」で割る＝終盤の重い采配が未消化のうちは勝ちゾーン(0.9)に届かない＝早期に勝敗が見えない
    return (ratio*W_RATIO + W_QUIZ*(B.wsum/B.wtot)) / 0.9;
  }
  function battleResult(){
    if (B.skirmish) return skirmishResult();
    S.battles++;
    const ratio = playerPower()/B.ev.enemyPower;
    // 地力寄り（2026-06-15 オーナー方針）: 地力=ratio を重く、采配クイズを軽く。
    // ステの低い偉人は全問正解でも地力が足りないと勝てない＝「運ゲーでなく鍛錬の勝利」を担保。
    const score = ratio*W_RATIO + (B.wsum/B.wtot)*W_QUIZ;
    const win = score >= 0.9;
    if (win){ S.wins++; S.skillPt += 8; applyFx(B.ev.winFx); }
    S.chronicle.push({ y:B.ev.year, t:B.ev.title.split(' — ')[0], r: win?'⚔️勝利':'💀敗北' });
    saveAll();
    return { win, text: win? B.ev.winText : B.ev.loseText };
  }

  /* ===== §7.5 腕だめし ＝ 1ラウンド版の合戦絵巻（石高とスキルP稼ぎ・敗北しても育成は続く） ===== */
  function startSkirmish(){
    const foe = H.skirmishFoes[Math.floor(Math.random()*H.skirmishFoes.length)];
    const situ = H.skirmishSitus[Math.floor(Math.random()*H.skirmishSitus.length)];
    S.trainStreak = 0;
    S.stamina = Math.max(0, S.stamina-14);
    startBattle({
      skirmish:true, year:S.year, title:`🚩 ${foe.name}`, intro:'',
      terrain:{ icon:'', label:situ.sky }, bg:situ.bg,
      enemyName:foe.name, enemyIcon:foe.icon, enemyPower:Math.max(40, playerPower()),
      army:{ me:Math.min(2500, 400+Math.round(S.koku)), foe:foe.army },
      meUnit:'🛡️', foeUnit:'🗡️',
      open:[ foe.text ],
      rounds:[ situ ],
    });
  }
  function skirmishResult(){
    const tier = B.last.tier;
    const win = (tier==='kaishin' || tier==='yuko');
    let text;
    if (win){
      let k = Math.round((12 + (S.year-H.startYear) + Math.random()*8) * (tier==='kaishin' ? 1.6 : 1.0));
      if (S.skills && S.skills.zeni) k = Math.round(k*1.5);
      S.koku += k; S.skillPt += 3;
      if (tier==='kaishin') S.mood = Math.min(4, S.mood+1);
      text = `🚩 勝利！ ${rName()}+${fmtKoku(k)}・✨スキルP+3${tier==='kaishin' ? '・やる気UP' : ''}`;
    } else {
      S.mood = Math.max(0, S.mood-1);
      if (Math.random()*100 < failRate()/2 + 8){
        S.injury = 1;
        text = '💥 敗走の途中でケガをしてしまった……（🌿手当てで治療しよう）';
      } else {
        text = '🌀 戦果なし…兵を退いた。やる気DOWN';
      }
    }
    saveAll();
    return { win, text, skirmish:true };
  }
  // 敗北＝育成終了（パワプロ/ウマ娘式・2026-06-11 教師FB）
  function defeatEnd(){
    const ev = B.ev;
    endRun(false, `${ev.year<0?'':ev.year+'年'}「${ev.title.split(' — ')[0]}」`);
  }

  /* ===== §7.8 スキル習得（スキルP消費・その育成1周の間有効） ===== */
  function buySkill(id){
    if (!S) return;
    const sk = D.SKILLS.find(s=>s.id===id);
    if (!sk || S.skills[id]) return;
    if ((S.skillPt||0) < sk.cost){ toast('✨スキルPが足りない…鍛錬の正解や合戦で貯めよう！'); return; }
    S.skillPt -= sk.cost;
    S.skills[id] = true;
    saveAll();
    toast(`${sk.icon} スキル「${sk.name}」を習得した！`);
    UI.renderGame();
    UI.openSkill();
  }

  /* ===== 最終イベント（本能寺） ===== */
  function startFinal(ev){
    UI.showEvent(ev, ()=>{
      const survive = Object.entries(H.finalReq).every(([k,v])=>S[k]>=Math.round(v*reqScale()));
      const branch = survive? ev.survive : ev.fall;
      if (survive){ S.koku += 500; S.wins++; S.battles++; }
      S.survived = survive;
      S.chronicle.push({ y:H.endYear, t:branch.title.replace('【IF】',''), r: survive?'🌟IF達成':'🏁完走' });
      // 完走者は全偉人共通の「追憶の章」へ（ご褒美ゾーン）。敗北での育成終了は対象外
      UI.showEvent({year:H.endYear, type:'story', title:branch.title, text:branch.text}, ()=>startEpilogue(survive), survive? {koku:500}:null);
    });
  }

  /* ===== §7.9 追憶の章 — 全偉人共通のクリア後ボーナス（D.EPILOGUE・設計はウマ娘URAファイナルズ参照） ===== */
  function startEpilogue(survived){
    S.epi = { n:0, glow:0, survived:!!survived };
    saveAll();
    // 冒頭で「あなたのあゆみ」（chronicle）を年表として見せる＝物語性（2026-06-14 生徒FB）
    const walk = S.chronicle.length
      ? '\n\n——あなたのあゆみ——\n' + S.chronicle.map(c=>`${c.y}年 ${c.t} ${c.r}`).join('\n')
      : '';
    UI.showEvent({ year:S.year, title:D.EPILOGUE.intro.title, art:D.EPILOGUE.intro.art,
      text:D.EPILOGUE.intro.text + walk }, epilogueNext);
  }
  function epilogueNext(){
    const E = S.epi;
    if (!E) return;
    if (E.n >= 5){ finishEpilogue(); return; }
    E.n++;
    saveAll();
    UI.showEpilogueChoice(E.n);
  }
  // 回想するステータスを選ぶ → そのジャンルの「自分の記憶」（まちがい帳→出会った問題→全問）から出題
  function pickEpilogue(genre){
    cur = { mode:'epilogue', genre };
    const books = P.book.map((b,i)=>({b,i})).filter(o=>o.b.genre===genre);
    if (books.length){
      const sel = books[Math.floor(Math.random()*books.length)];
      cur.bookIdx = sel.i;
      UI.openQuiz(sel.b, cur);
      return;
    }
    let pool = S.usedQ.filter(i=>D.QUESTIONS[i].genre===genre);
    if (!pool.length) pool = D.QUESTIONS.map((q,i)=>i).filter(i=>D.QUESTIONS[i].genre===genre);
    const qi = pool[Math.floor(Math.random()*pool.length)];
    cur.qi = qi;
    UI.openQuiz(D.QUESTIONS[qi], cur);
  }
  function finishEpilogue(){
    const E = S.epi;
    const tier = D.EPILOGUE.tiers.find(t=>E.glow>=t.min);
    const fx = { buyu:tier.boost, chiryaku:tier.boost, seiji:tier.boost, ninbo:tier.boost };
    if (tier.koku) fx.koku = tier.koku;
    applyFx(fx);
    S.epi = null;
    saveAll();
    UI.showEvent({ year:S.year, title:`人生の総括 — ${tier.title}`, art:'🌅🕊️', artImg:D.EPILOGUE.intro.artImg,
      text:`（人生の輝き ${E.glow}/5）

${tier.text}` }, ()=>endRun(E.survived), fx);
  }

  /* ===== §8 終了評価 ===== fellLabel: 敗北で育成終了した合戦名（nullなら完走） */
  function endRun(survived, fellLabel){
    // 評価点はターン数で正規化（偉人ごとに育成期間が違ってもランク基準を共通にする）
    // 半年制（v1.5）はさらに HALF_SCORE で割り、年制と同じランク基準を共有する。
    // H.scoreNorm = 偉人別の校正係数（成長は育成年数に比例しないため、長い偉人は単純な年数割りだと不利。simで校正）
    let total = S.buyu + S.chiryaku + S.seiji + S.ninbo + Math.round(S.koku/12) + S.wins*25;
    total = Math.round(total * 32 / (H.endYear - H.startYear + 1) / scoreScale() * (H.scoreNorm||1));
    let rank = RANKS[0];
    for (const r of RANKS){ if (total>=r[0]) rank = r; }
    if (survived && rank[0]<590) rank = RANKS[4]; // IF生存は最低でも名士
    // 遺訓: 最高ステに応じて獲得
    let bestK = 'buyu';
    STAT_KEYS.forEach(k=>{ if(S[k]>S[bestK]) bestK=k; });
    const legacy = { stat:bestK, val:Math.min(15, 5+Math.floor(S[bestK]/20)), name:H.legacyNames[bestK] };
    P.legacy.push(legacy); if (P.legacy.length>5) P.legacy.shift();
    // 小判（永続通貨・G1第2弾 2026-06-13。つかいみちはv2ガチャ＝DESIGN_INFLATION.md）
    const coins = Math.max(5, Math.round(total/10)) + (survived?20:0);
    P.coins = (P.coins||0) + coins;
    // 殿堂入り
    P.hall.push({ name:H.name, hero:H.id, rank:rank[1], resStr:rIcon()+fmtKoku(S.koku), total, tpy:S.tpy||1,
      stats:{buyu:S.buyu, chiryaku:S.chiryaku, seiji:S.seiji, ninbo:S.ninbo},
      koku:S.koku, wins:S.wins, battles:S.battles, survived:!!survived, fell:fellLabel||null,
      acc: S.answerTotal? Math.round(S.correctTotal/S.answerTotal*100):0,
      date:new Date().toLocaleDateString('ja-JP') });
    if (P.hall.length>30) P.hall.shift();
    const summary = { rank, total, legacy, coins, survived:!!survived, fell:fellLabel||null, tpy:S.tpy||1,
      koku:S.koku, wins:S.wins, battles:S.battles,
      acc: S.answerTotal? Math.round(S.correctTotal/S.answerTotal*100):0,
      answered:S.answerTotal, gstat:S.gstat||{}, bookLeft:P.book.length,
      stats:{buyu:S.buyu, chiryaku:S.chiryaku, seiji:S.seiji, ninbo:S.ninbo} };
    clearRun(); savePersist();
    UI.showResult(summary);
  }

  /* 石高表示（内部値の1/10を万石として表示＝史実スケールに近づける） */

  // 表示地名 → 令制国名(SENGOKU_MAP.prov のキー)。大半は同名・地域名/都市名だけ代表国にあてる
  const MAPKEY = { '関東':'武蔵','江戸':'武蔵','大坂':'摂津','北陸':'加賀','九州':'筑前','四国':'讃岐','京':'山城' };

    // 同じ令制国に複数地名が来る場合は own>ally で集約

    H.map.provinces.forEach(p=>{
      const k = provKey(p.n); if (!M.prov[k]) return;
      const own = p.own && S.year>=p.own, ally = p.ally && S.year>=p.ally;
      const cur = state[k];
      if (own) state[k] = {cls:'own', n:p.n};
      else if (ally && (!cur || cur.cls!=='own')) state[k] = {cls:'ally', n:p.n};
    });
    // 自軍/同盟の国を色で塗る（下地の上に重ねる）

    });

    if (warLoc && M.prov[warLoc]){
      war += `<path class="warProv" d="${M.prov[warLoc]}"/>`;
      if (M.c[warLoc]){ const [x,y]=M.c[warLoc];

    }

    const sea = mini ? '' : `<rect class="sea" x="0" y="0" width="${M.vb[2]}" height="${M.vb[3]}"/>`;

      (next? `<br>📅 次の合戦: ${next.year}年「${next.title.split(' — ')[0]}」（${H.map.battleLoc[next.year]||'—'}）` : '<br>🎌 残る合戦はない') +

    applyMapZoom();
    $('ovl-list').classList.add('on');
  }
  function applyMapZoom(){
    const wrap = $('map-wrap'); if (!wrap) return;
    const svg = wrap.querySelector('svg');
    if (svg){ svg.style.width = (mapZoomLv*100)+'%'; svg.style.height = 'auto'; }
    const lbl = $('map-zl'); if (lbl) lbl.textContent = (mapZoomLv*100)+'%';
  }
  function mapZoom(d){
    const prev = mapZoomLv;
    mapZoomLv = Math.max(1, Math.min(4, mapZoomLv + d));
    if (mapZoomLv===prev) return;
    const wrap = $('map-wrap');
    // ズーム時に中心を保つようスクロール位置を補正
    const cx = wrap ? (wrap.scrollLeft + wrap.clientWidth/2) : 0;
    const cy = wrap ? (wrap.scrollTop + wrap.clientHeight/2) : 0;
    const ratio = mapZoomLv/prev;
    applyMapZoom();
    if (wrap){ wrap.scrollLeft = cx*ratio - wrap.clientWidth/2; wrap.scrollTop = cy*ratio - wrap.clientHeight/2; }
  }

  /* ---- クイズ ---- */
  function openQuiz(q, ctx){
    ctx.sh = Game.shuffled(q);
    const g = D.GENRES[q.genre];
    const badge = $('q-badge');
    badge.textContent = `${g.icon} ${g.label}（${g.quizLabel}）★${q.diff}`;
    badge.className = 'qBadge '+q.genre;
    $('q-text').textContent = q.q;
    const box = $('q-choices'); box.innerHTML='';
    ctx.sh.c.forEach((c,i)=>{
      const b = document.createElement('button');
      b.className='choice'; b.textContent = ['①','②','③','④'][i]+' '+c;
      b.onclick = ()=>onAnswer(i, q, ctx);
      box.appendChild(b);
    });
    $('q-after').innerHTML='';
    $('ovl-quiz').classList.add('on');
  }
  function onAnswer(i, q, ctx){
    const btns = [...$('q-choices').children];
    btns.forEach(b=>b.classList.add('lock'));
    btns[ctx.sh.a].classList.add('good');
    if (i!==ctx.sh.a) btns[i].classList.add('bad');
    const r = Game.answer(i);
    const after = $('q-after');
    // 解説は折りたたみ（合戦中はテンポ優先で閉じる／鍛錬や誤答では開いて学ぶ・2026-06-14）
    const dOpen = (ctx.mode!=='battle') || !r.correct;
    let html = `<details class="fold${dOpen?'':' dim'}"${dOpen?' open':''}><summary>📖 解説</summary><div class="foldBody">${q.desc}</div></details>`;
    if (r.push){
      // 不正解 → 押し切る / 学び直す の2択
      const fr = Game.pushRate();
      html += `<div class="pushRow">
        <button class="btn" onclick="UI.resolvePush(true)">💪 気合で押し切る（全力アップ・失敗率${fr}%）</button>
        <button class="btn" onclick="UI.resolvePush(false)">📖 学び直す（6割アップ・安全）</button>
        <div class="pushNote">まちがえても鍛錬はムダにならない。どちらでも力はつく！</div></div>`;
      after.innerHTML = html;
      return;
    }
    html += `<div class="resLine ${r.correct?'':'fail'} ${fxClass(r.text)}">${r.correct?'⭕ 正解！':'❌ ざんねん…'}<br><span class="${r.correct?'big':''}">${r.text}</span></div>`;
    html += `<div class="pushRow"><button class="btn gold" onclick="UI.quizDone()">つぎへ</button></div>`;
    after.innerHTML = html;
    after.scrollIntoView({behavior:'smooth', block:'end'});
  }
  // 友情特訓=虹文字・大成功=金文字（結果テキストから判定・演出強化第1弾）
  function fxClass(t){ return t.includes('友情特訓')? 'friend' : (t.includes('大成功')? 'crit' : ''); }
  function resolvePush(push){
    const r = push? Game.pushThrough() : Game.learnSafe();
    const after = $('q-after');
    after.innerHTML = `<div class="resLine ${r.failed?'fail':''} ${fxClass(r.text)}"><span class="${r.failed?'':'big'}">${r.text}</span></div>
      <div class="pushRow"><button class="btn gold" onclick="UI.quizDone()">つぎへ</button></div>`;
    if (r.failed){ // 大失敗はモーダルごと揺らす
      const box = document.querySelector('#ovl-quiz .box');
      box.classList.remove('shaken'); void box.offsetWidth; box.classList.add('shaken');
    }
    after.scrollIntoView({behavior:'smooth', block:'end'});
  }
  function quizDone(){
    $('ovl-quiz').classList.remove('on');
    const ctx = Game.cur;
    if (ctx.mode==='battle'){ battleResolve(); return; }
    if (ctx.mode==='epilogue'){ Game.epilogueNext(); return; }
    renderGame();
    if (ctx.res && ctx.res.gain) statPop(ctx.genre, ctx.res.gain, ctx.res); // ステ上昇を盤面にフロート表示
    Game.checkBondMax();
    setTimeout(()=>Game.nextTurn(), 250);
  }
  // ステ上昇の演出（改善#3・2026-06-13）。大成功/友情特訓は金の特大フロート＋枠はずみ
  function statPop(genre, gain, res){
    const i = Game.STAT_KEYS.indexOf(genre);
    const cell = document.querySelectorAll('#g-stats .stat')[i];
    if (!cell) return;
    const big = !!(res && (res.crit || res.friend));
    const s = document.createElement('span');
    s.className = 'statPop' + (big?' big':''); s.textContent = `+${gain}`;
    cell.appendChild(s);
    cell.classList.remove('bump'); void cell.offsetWidth; cell.classList.add('bump');
    const rk = cell.querySelector('.srk'); if (rk){ rk.classList.remove('flash'); void rk.offsetWidth; rk.classList.add('flash'); }
    setTimeout(()=>{ s.remove(); cell.classList.remove('bump'); }, 1350);
  }

  /* ---- §合戦シーン（②⑤⑦の新フォーマット・proto battle_proto2.html より移植・2026-06-15） ----

  const L = D.BATTLE_LINES;

  // ⑤紙芝居（採用＝案C「時間停止→急接近」＋着弾の1.5秒スロー）。別枠・肩越し視点・敵が遠近法で巨大化・弾ズーム。
