  /* ---- モード定義（見せ方の差分のみ。②領地＋⑤遠距離＋⑦勢力押し） ---- */
  const MODES = {};
  MODES['jin-atarashii'] = {
    name:'領地', ownVeil:true,
    HQ_ME:14, HQ_FOE:20, CASTLE:17,   // (r2,c0)/(r2,c6)/(r2,c3)  index=r*7+c
    buildSpread(hq, colMin, colMax){
      const order=[], seen=new Set([hq, this.CASTLE]); let frontier=[hq];
      while(frontier.length){ const next=[];
        for(const cell of frontier){ const r=Math.floor(cell/7), c=cell%7;
          [[r-1,c],[r+1,c],[r,c-1],[r,c+1]].forEach(([nr,nc])=>{
            if(nr<0||nr>4||nc<colMin||nc>colMax) return; const ni=nr*7+nc;
            if(seen.has(ni)) return; seen.add(ni); next.push(ni); }); }
        for(let i=next.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [next[i],next[j]]=[next[j],next[i]]; }
        order.push(...next); frontier=next; }
      return order;
    },
    setup(){
      const ev=Game.B.ev, cells=[];
      for(let i=0;i<35;i++){
        if(i===this.HQ_ME) cells.push(`<div class="terr-cell terr-hq me" data-i="${i}"><span class="hqi">${gi('terr_hq','🚩')}</span><span class="hql">本部</span></div>`);
        else if(i===this.HQ_FOE) cells.push(`<div class="terr-cell terr-hq foe" data-i="${i}"><span class="hqi">${gi('terr_hq','🚩')}</span><span class="hql">本部</span></div>`);
        else if(i===this.CASTLE) cells.push(`<div class="terr-cell terr-castle" data-i="${i}">${gi('terr_castle','🏯')}</div>`);
        else cells.push(`<div class="terr-cell" data-i="${i}"></div>`);
      }
      $('b-stage').innerHTML = `
        <div class="terr-field"></div>
        <div class="terr-tag" id="terr-tag">${foeName()}との大一番</div>
        <div class="terr-grid">${cells.join('')}</div>
        <div class="terr-flood" id="terr-flood"></div>`;
      mst.spreadMe=this.buildSpread(this.HQ_ME,0,2);   // 左本部→中央へ(col0-2)
      mst.spreadFoe=this.buildSpread(this.HQ_FOE,4,6);  // 右本部→中央へ(col4-6)
      this.renderMomentum();
    },
    renderMomentum(){
      const meN=Math.round(clamp(playerFill(),0,1)*mst.spreadMe.length);
      const foeN=Math.round(clamp(enemyFillAt(Game.B.round)/(WINLINE/FILLMAX),0,1)*mst.spreadFoe.length);
      const apply=(order,n,cls)=>order.forEach((idx,k)=>{ const c=document.querySelector(`.terr-cell[data-i="${idx}"]`); if(!c)return;
        const on=k<n;
        if(on && !c.classList.contains(cls)){ c.classList.add(cls,'cap'); setTimeout(()=>c.classList.remove('cap'),450); }
        else if(!on && c.classList.contains(cls)){ c.classList.remove(cls); } });
      apply(mst.spreadMe, meN, 'me'); apply(mst.spreadFoe, foeN, 'foe');
    },
    async onResult(res){
      const good=(res.tier==='kaishin'||res.tier==='yuko');
      await roundClash(res.tier, trustColor(prog(),'round').c);
      this.renderMomentum();
      const tag=$('terr-tag');
      if(good && curRatio()<0.7) tag.textContent='旗は進むが…兵力で押し返される、地力不足';
      else if(res.tier==='shikujiri') tag.textContent='しくじり…領地を切り取られた';
      else if(good) tag.textContent='本部より勢力を広げた！';
      else tag.textContent='戦線が伸び悩む…';
      tag.classList.remove('show'); void tag.offsetWidth; tag.classList.add('show');
      await wait(650);
    },
    async climax(win){
      const allyT=trustColor(prog(),'final');
      const revived=win && !battleTiers.some(t=>t==='kaishin'||t==='yuko');
      await finalClash(win, allyT.c, '守りは固いぞ。その程度では崩せぬ', revived);
      const cls=win?'me':'foe';
      const owned=i=>document.querySelector(`.terr-cell[data-i="${i}"]`).classList.contains(cls);
      const all=Array.from({length:35},(_,i)=>i).filter(i=>i!==this.HQ_ME && i!==this.HQ_FOE && i!==this.CASTLE && !owned(i));
      all.sort((a,b)=> win ? (a%7-b%7) : (b%7-a%7));   // 自本部側から城へ向けて一掃
      const path=[...all, this.CASTLE];
      const seq=(reduceMotion||fastFwd)?[path]:path.map(x=>[x]);
      for(const grp of seq){ for(const idx of grp){ const c=document.querySelector(`.terr-cell[data-i="${idx}"]`); if(!c)continue;
          if(idx===this.CASTLE){ c.classList.add(cls); c.textContent = win?'🏛️':'🏚️'; if(!win) c.classList.add('fall'); }
          else { c.classList.remove('me','foe'); c.classList.add(cls,'cap'); } }
        beep(win?'yuko':'shikujiri'); await wait((reduceMotion||fastFwd)?150:80); }
      $('terr-tag').textContent = win?'中央を制した——大一番を勝ち取った！':'拠点を明け渡した…無念！';
      $('terr-tag').classList.add('show');
      const flood=$('terr-flood'); flood.style.background = win ? trustFlood(allyT) : `radial-gradient(circle,${FOE_C},transparent 80%)`;
      if(win) spawnSparks('kaishin');
      fxHit(win?'kaishin':'shikujiri'); flood.classList.add('on');
      await wait(900);
    },
  };

  /* ---------- ⑤遠距離「放て！」(左下射手×右上の敵が接近・暗転なし・別枠紙芝居runKami) ---------- */
  MODES['teppo-atarashii'] = {
    name:'遠距離', ownVeil:true,

        <div class="rng-shooter" id="rng-shooter">${gi('rng_shooter','🔫')}</div><div class="rng-shooterlbl">${meName()} 鉄砲隊</div>

    },
    async onResult(res){

      this.renderMomentum();
      const tag=$('rng-tag');
      if(good && curRatio()<0.7) tag.textContent='狙いは良いが…弾が足らぬ、地力不足';
      else if(res.tier==='shikujiri') tag.textContent='照準が乱れた…';

      if(revived) await reviveBubble();   // 暗転なし・戦闘画面に佐助の吹き出しだけ
      const enemy=$('rng-enemy'), tag=$('rng-tag'), flood=$('rng-flood'), shooter=$('rng-shooter');
      tag.className='rng-tag big'; tag.textContent='放てッ——！'; void tag.offsetWidth; tag.classList.add('show');
      shooter.style.transform='translateX(-4px) rotate(-6deg)'; beep('kaishin');
      await wait(reduceMotion?120:420);
      await runKami(win);   // 別枠の紙芝居（案C＝時間停止→急接近＋着弾1.5秒スロー）
      if(win){
        enemy.style.opacity='0'; flood.style.background=trustFlood(allyT); spawnSparks('kaishin'); fxHit('kaishin');
        tag.className='rng-tag big'; tag.textContent='命中——敵本隊を撃ち崩した！'; void tag.offsetWidth; tag.classList.add('show');
        log(`🗣️ ${nShort()}「見事な一発！ 勝ち鬨——！」`);
      } else {
        enemy.style.transition='transform .45s'; enemy.style.transform='translate(-235px,205px) scale(1.4)';
        shooter.style.transform='translateX(10px) rotate(12deg)'; fxHit('shikujiri');

        tag.className='rng-tag'; tag.textContent='弾それて…突撃を受けた！'; void tag.offsetWidth; tag.classList.add('show');
        log(`🗣️ ${nShort()}「間合いを詰められた…。鍛えて出直しましょうぞ」`);
      }
      flood.classList.add('on');
      await wait(900);

  };

  /* ---------- ⑦勢力押し「鬨の壁」(兵列が押し合い→暗転→押し出す・武力以外にも転用) ---------- */
  MODES['toki-atarashii'] = {
    name:'勢力押し', ownVeil:true,
    // seam=50% ⟺ 勝利ライン。開幕は敵の大軍の壁、地力(ステータスボーナス)で押し返す
    share(){ const mf=playerFill(); return clamp(mf/(mf+(WINLINE/FILLMAX)), 0.06, 0.94); },
    setup(){
      const ev=Game.B.ev;
      $('b-stage').innerHTML = `
        <div class="push-field"></div>
        <div class="push-lbl"><span class="me">${meName()} ${ev.army.me.toLocaleString()}</span><span class="foe">${foeName()} ${ev.army.foe.toLocaleString()}</span></div>
        <div class="push-wall me" id="push-me"><div class="push-row" id="push-merow"></div></div>
        <div class="push-wall foe" id="push-foe"><div class="push-row" id="push-foerow"></div></div>

      $('push-foerow').innerHTML=gi('push_sol_foe','🗡️').repeat(clamp(Math.round(3+(1-sh)*11),3,14));   // 敵＝押している側ほど厚い大軍
    },
    async onResult(res){
      const good=(res.tier==='kaishin'||res.tier==='yuko');

      this.renderMomentum();
      if(!reduceMotion && good){ const st=$('b-stage'); st.classList.add('push-quake'); setTimeout(()=>st.classList.remove('push-quake'), res.tier==='kaishin'?440:250); }
      const tag=$('push-tag');
      if(good && curRatio()<0.7) tag.textContent='押し返すが…数で劣る、地力不足！';
      else if(res.tier==='shikujiri') tag.textContent='列が乱れ、押し込まれた…';

    async climax(win){

      const me=$('push-me'), foe=$('push-foe'), seam=$('push-seam'), flood=$('push-flood');
      if(win){ me.style.width='100%'; foe.style.width='0%'; seam.style.left='100%'; }
      else   { me.style.width='0%'; foe.style.width='100%'; seam.style.left='0%'; }
      if(!reduceMotion){ const st=$('b-stage'); st.classList.add('push-quake'); setTimeout(()=>st.classList.remove('push-quake'),600); }
      fxHit(win?'kaishin':'shikujiri'); beep(win?'kaishin':'shikujiri');
      await wait(reduceMotion?150:600);
      $('push-tag').textContent = win?'相手を押し切った——勝負あり！':'押し出された…無念！';
      $('push-tag').classList.add('show');
      flood.style.background = win ? trustFlood(allyT) : `radial-gradient(circle,${FOE_C},transparent 80%)`;
      if(win) spawnSparks('kaishin'); flood.classList.add('on');
      await wait(900);

  };

  /* ---- フロー制御（engine §7 が openBattle を呼ぶ→采配→クイズ→battleResolve→battleFinish） ---- */
  function headlineHTML(ev){
    const sky = `${(ev.terrain&&ev.terrain.icon)||''} ${(ev.terrain&&ev.terrain.label)||''}`.trim();
    const ct = ev.army ? `<span class="bArmyCt"><span class="me">${meName()} ${ev.army.me.toLocaleString()}</span> 対 <span class="foe">${ev.enemyName} ${ev.army.foe.toLocaleString()}</span></span>` : '';
    return `<span>${sky}</span>${ct}`;
  }
  async function openBattle(ev){
    fastFwd = fastPref; updateFastBtn(); battleIntro = true; battleTiers = []; mst = {};
    curMode = (ev.presentMode && MODES[ev.presentMode]) ? ev.presentMode : 'jin-atarashii';
    $('b-year').textContent = fmtYear(ev.year);
    $('b-title').textContent = ev.title;
    $('b-intro').innerHTML = ev.intro ? `<details class="fold dim"><summary>📜 いくさのいきさつ</summary><div class="foldBody">${ev.intro}</div></details>` : '';
    $('b-intro').style.display = ev.intro ? 'block' : 'none';
    $('b-headline').innerHTML = headlineHTML(ev);
    $('b-castername').textContent = nCaster();
    { const sk=document.querySelector('.sasukeImg'); if(sk) sk.style.display = (Game.H && Game.H.battleLines) ? 'none' : ''; }
    clearLog(); $('b-actions').innerHTML = '';
    MODES[curMode].setup();                 // intro=true → 両軍とも空
    $('ovl-battle').classList.add('on');
    const introLines = (ev.skirmish || casterIntroShown) ? [] : [nIntro()]; casterIntroShown = true;
    const opening = ev.skirmish ? ev.open : [...introLines, ...ev.open, '⚠️ 負ければ育成終了の大一番だ！'];
    await castLines(opening);
    await statusBonusIntro();               // ステータスボーナス→地力ぶんが満ちる
    showRound();
  }
  // 戦況を実況→采配ボタン（参照ステ数値・堅実/博打/搦め手チップを明記）
  function showRound(){
    const B=Game.B, round=B.ev.rounds[B.round];
    const isFinal = (!B.skirmish && B.max>1 && B.round===B.max-1);
    if(isFinal) reachCue();
    log((isFinal?'🔥 決戦！ ':`📯 采配${B.round+1}本目！ `)+round.situ);
    const chips={ safe:['堅実','#2e8b57'], risky:['博打','#b3362a'], trick:['搦め手','#7a4f9d'] };
    setTimeout(()=>{
      const head = isFinal ? `<div class="saihaiHead">🔥 決着の采配！ ここが正念場だ</div>` : `<div class="saihaiHead">⚔️ 采配 ${B.round+1}本目 — どう采配する？</div>`;
      $('b-actions').innerHTML = head +
        `<div class="note" style="text-align:center; margin-bottom:6px;">正解で采配が実行 ／ <b style="color:#2e8b57">堅実</b>=安定 <b style="color:#b3362a">博打</b>=一か八か <b style="color:#7a4f9d">搦め手</b>=高ステで化ける</div>` +
        round.opts.map((o,i)=>{ const g=D.GENRES[o.stat], c=chips[o.style];
          return `<button class="saihai" onclick="UI.pickSaihai(${i})"><span class="ti">${o.icon}</span><span class="tb"><b>${o.label}</b><small>${g.icon}${g.label} ${Game.S[o.stat]}</small></span><span class="chip" style="background:${c[1]}">${c[0]}</span></button>`;
        }).join('');
    }, fastFwd?60:600);
  }
  function pickSaihai(i){ $('b-actions').innerHTML=''; $('ovl-battle').classList.remove('on'); Game.battlePick(i); }
  // クイズから戻る（engineが B.last を確定済）→ tier POP→モード演出→次/決着
  async function battleResolve(){
    const B=Game.B; fastFwd = fastPref;
    $('ovl-battle').classList.add('on');
    const tier=B.last.tier, opt=B.last.opt;
    battleTiers.push(tier);
    await wait(reduceMotion?120:520);
    beep(tier); fxHit(tier); spawnSparks(tier);
    const head={ kaishin: opt.hist?'⚡ 史実の一手で会心！':'⚡ 会心！', yuko:'⭕ 有効打！', fuhatsu:'😶 不発…', shikujiri:'💢 しくじり！' }[tier];
    if(tier==='kaishin') cutin(opt.hist?'史実の一手ーっ！！':'会心！');
    log(`${head} ${(tier==='kaishin'||tier==='yuko')?opt.ok : tier==='fuhatsu'?`「${opt.label}」は戦況に響かなかった…` : `「${opt.label}」が裏目に…！`}`);
    await wait(reduceMotion?120:460);
    await MODES[curMode].onResult({tier});
    if(B.round < B.max){ setTimeout(showRound, fastFwd?120:300); }
    else { $('b-actions').innerHTML = `<button class="btn gold" onclick="UI.battleFinish()">⚔️ 決着をつける！</button>`; }
  }
  async function battleFinish(){
    $('b-actions').innerHTML = '';
    const r = Game.battleResult();
    const B = Game.B;
    if(r.skirmish){   // 腕だめしは大げさにしない（軽い決着）
      if(r.win){ spawnSparks('kaishin'); beep('kaishin'); } else { fxHit('shikujiri'); beep('shikujiri'); }
      log(r.win ? '🚩 相手を退けた！ 見事な腕だめし！' : '🌀 引き分け…今日はここまで。');
      await wait(reduceMotion?160:750);
      $('ovl-battle').classList.remove('on');
      showEvent({ year:Game.S.year, title: r.win ? '🚩 腕だめしに勝利！' : '🌀 退却…', text:r.text },
        ()=>{ renderGame(); setTimeout(()=>Game.nextTurn(), 250); });
      return;
    }
    await MODES[curMode].climax(r.win);
    $('ovl-battle').classList.remove('on');
    if(r.win){
      showEvent({ year:B.ev.year, title:'🎉 勝利！', text:r.text },
        ()=>{ renderGame(); setTimeout(()=>Game.nextTurn(), 250); }, B.ev.winFx);
    } else {
      showEvent({ year:B.ev.year, title:'💀 敗北……', text:r.text }, ()=>Game.defeatEnd());
    }
  }

  /* ---- 結果 ---- */
  function showResult(sum){
    show('result');
    $('r-rank').textContent = sum.rank[1];
    $('r-sub').textContent = `評価点 ${sum.total} ／ ${sum.rank[2]}`;
    $('r-stats').innerHTML = Game.STAT_KEYS.map(k=>statCell(k, sum.stats[k], sum.tpy)).join('');
    $('r-summary').innerHTML =
      `${Game.rIcon()} ${Game.rName()} <b>${Game.fmtKoku(sum.koku)}</b> ／ ⚔️ 勝負 <b>${sum.wins}勝${sum.battles-sum.wins}敗</b> ／ 📝 クイズ正答率 <b>${sum.acc}%</b><br>` +
      (sum.coins? `🪙 メダルを <b>${sum.coins}枚</b> 獲得！（ホームでたまっていく）<br>` : '') +
      (sum.fell? `💀 <b>${sum.fell}に敗れ、育成終了……</b><br>📖 まなび帳でまちがいを復習して、もう一度てっぺんを目指そう！`
       : sum.survived? Game.H.endTexts.survived
       : Game.H.endTexts.completed);
    $('r-legacy').innerHTML = `📜 遺訓を獲得: <b>「${sum.legacy.name}」</b><br>次の育成で ${D.GENRES[sum.legacy.stat].icon}${genreLabel(sum.legacy.stat)}+${sum.legacy.val} できる！`;
    // 📚 学びのきろく（塾ゲーの本懐: 何を学んだかが残る・2026-06-14）
    const gl = Game.STAT_KEYS.map(k=>{
      const g = (sum.gstat||{})[k];
      if (!g || !g.a) return null;
      const rate = Math.round(g.c/g.a*100);
      const weak = (g.a>=3 && rate<60);
      return `${D.GENRES[k].quizLabel} <b style="${weak?'color:var(--red)':''}">${rate}%</b>${weak?'⚠':''}`;
    }).filter(Boolean).join(' ／ ');
    $('r-report').innerHTML = `📚 <b>学びのきろく</b><br>解いた問題 <b>${sum.answered}問</b>・正答率 <b>${sum.acc}%</b><br>`
      + (gl? `ジャンル別: ${gl}<br>` : '')
      + (sum.bookLeft? `📖 まなび帳に<b>${sum.bookLeft}問</b>残っています — 次の周で復習しよう！` : '📖 まなび帳はぜんぶ卒業！ おみごと！');
  }

  // 偉人編成（βは予定表示のみ＝予告だけ。旧WARLORDS戦国カードは脱戦国で撤去＝今後の対戦モード用）
  function openRoster(){
