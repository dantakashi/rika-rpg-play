<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="鶏肉の食品群と対象の比較"><rect width="480" height="480" rx="24" fill="#faf6eb"/><g font-family="Yu Gothic, Meiryo, sans-serif" fill="#283d38"><text x="24" y="43" font-size="29" font-weight="bold">鶏肉</text><text x="24" y="76" font-size="20">1群：魚・肉・卵・豆</text><path d="M142 193Q120 140 174 119Q217 102 251 138Q281 170 319 189Q350 222 316 244Q277 261 236 235Q208 222 177 226Q147 222 142 193Z" fill="#e7b29d" stroke="#a37869" stroke-width="5"/><path d="M159 150q34-32 64 5M175 175q32-22 61 13M253 200l48 25" fill="none" stroke="#f5d5c3" stroke-width="6"/><rect x="22" y="280" width="436" height="134" rx="16" fill="#e6eee3"/><text x="40" y="313" font-size="22" font-weight="bold">にわとりの肉を食べる</text><text x="40" y="349" font-size="20">衣やソースを加えない例。</text><text x="40" y="386" font-size="18">卵は同じ1群。食べる対象が違う。</text><text x="24" y="450" font-size="17">形・大きさは模式図。食べる対象はこの例。</text></g></svg>
