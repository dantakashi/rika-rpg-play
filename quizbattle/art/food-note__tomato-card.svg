<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="トマトの食品群と果実の比較"><rect width="480" height="480" rx="24" fill="#faf6eb"/><g font-family="Yu Gothic, Meiryo, sans-serif" fill="#283d38"><text x="24" y="43" font-size="29" font-weight="bold">トマト</text><text x="24" y="76" font-size="20">3群：緑黄色野菜</text><ellipse cx="240" cy="165" rx="99" ry="76" fill="#db3934" stroke="#872c27" stroke-width="5"/><path d="M240 107l-38-20 17 31-41 5 47 12 17-21 25 22 39-14-43-6 15-29z" fill="#397544"/><path d="M239 108q-6-24 7-37" fill="none" stroke="#466b32" stroke-width="9"/><rect x="22" y="270" width="436" height="144" rx="16" fill="#e6eee3"/><text x="40" y="305" font-size="23" font-weight="bold">果実を食べる野菜</text><text x="40" y="340" font-size="22">赤い皮／熟した実</text><text x="40" y="380" font-size="18">りんごも赤い皮。食品群は違う。</text><text x="24" y="450" font-size="17">形・大きさは模式図。皮の色はこの例。</text></g></svg>
