<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" role="img"><title>ベテルギウスと冬の大三角</title><rect width="640" height="640" rx="24" fill="#101d35"/><g font-family="Yu Gothic,sans-serif" text-anchor="middle" fill="#f3f6ff"><text x="320" y="54" font-size="36" font-weight="bold">ベテルギウス</text><text x="320" y="98" font-size="26">冬の大三角をつくる星</text><path d="M165 190L480 245L295 360Z" fill="none" stroke="#7189ad" stroke-width="3"/><circle cx="165" cy="190" r="12" fill="#e3977b"/><circle cx="165" cy="190" r="25" fill="none" stroke="#f4ca64" stroke-width="4"/><text x="165" y="150" font-size="25">ベテルギウス</text><circle cx="480" cy="245" r="12" fill="#f5e9bf"/><text x="480" y="205" font-size="25">プロキオン</text><circle cx="295" cy="360" r="12" fill="#d4e9ff"/><text x="295" y="409" font-size="25">シリウスA</text><rect x="20" y="439" width="600" height="112" rx="14" fill="#1b2c47"/><text x="320" y="481" font-size="27" fill="#f4ca64">赤色超巨星。</text><text x="320" y="526" font-size="23">火星の地表の赤っぽさとは理由が違う。</text><text x="320" y="591" font-size="20">3つの星の組合せを示す模式図。</text><text x="320" y="622" font-size="18" fill="#b9c9df">実際の方角・角度・距離・星の直径は表さない。</text></g></svg>
