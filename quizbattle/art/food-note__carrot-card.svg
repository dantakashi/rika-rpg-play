<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="にんじんの食べる部分の比較"><rect width="480" height="480" rx="24" fill="#faf6eb"/><g font-family="Yu Gothic, Meiryo, sans-serif" fill="#283d38"><text x="24" y="43" font-size="29" font-weight="bold">にんじん</text><text x="24" y="76" font-size="20">3群：緑黄色野菜</text><path d="M187 117Q238 95 286 120Q272 193 225 257Q198 197 187 117Z" fill="#ea8d36" stroke="#a95827" stroke-width="5"/><ellipse cx="237" cy="118" rx="49" ry="13" fill="#eea653" stroke="#a95827" stroke-width="4"/><path d="M205 154l25 4M246 181l20-3M218 210l20 3" stroke="#b46429" stroke-width="4"/><rect x="22" y="280" width="436" height="134" rx="16" fill="#e6eee3"/><text x="40" y="313" font-size="23" font-weight="bold">太った根を食べる</text><text x="40" y="349" font-size="20">この札は葉を取り除いた根。</text><text x="40" y="386" font-size="18">じゃがいもは根ではなく茎。</text><text x="24" y="450" font-size="17">形・大きさ・部位の境界は模式図。</text></g></svg>
