<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="卵の食品群と対象の比較"><rect width="480" height="480" rx="24" fill="#faf6eb"/><g font-family="Yu Gothic, Meiryo, sans-serif" fill="#283d38"><text x="24" y="43" font-size="29" font-weight="bold">卵</text><text x="24" y="76" font-size="20">1群：魚・肉・卵・豆</text><path d="M194 112C156 111 125 178 131 211C137 258 221 263 239 219C253 182 229 112 194 112Z" fill="#e6cda5" stroke="#9e8869" stroke-width="5"/><ellipse cx="295" cy="207" rx="66" ry="45" fill="#fffdf2" stroke="#b9b3a0" stroke-width="4"/><ellipse cx="294" cy="207" rx="29" ry="24" fill="#eab74d" stroke="#c5973a" stroke-width="3"/><rect x="22" y="280" width="436" height="134" rx="16" fill="#e6eee3"/><text x="40" y="313" font-size="22" font-weight="bold">にわとりの卵を食べる</text><text x="40" y="349" font-size="20">卵黄を使うマヨネーズと比較。</text><text x="40" y="386" font-size="18">マヨネーズは6群。原料と群は別。</text><text x="24" y="450" font-size="17">形・大きさは模式図。食べる対象はこの例。</text></g></svg>
