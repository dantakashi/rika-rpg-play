<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" role="img"><title>イオと地球の月の大きさ比較</title><rect width="640" height="640" rx="24" fill="#101d35"/><g font-family="Yu Gothic,sans-serif" text-anchor="middle" fill="#f3f6ff"><text x="320" y="54" font-size="38" font-weight="bold">イオ</text><text x="320" y="98" font-size="25">地球の月と、同じ縮尺で比べよう</text><circle cx="160" cy="264" r="70" fill="#b6becb"/><circle cx="462" cy="264" r="73.387994" fill="#d4b958" stroke="#f4ca64" stroke-width="4"/><text x="160" y="399" font-size="28">地球の月</text><text x="462" y="399" font-size="28" fill="#f4ca64">イオ</text><rect x="25" y="425" width="590" height="136" rx="14" fill="#1b2c47"/><text x="320" y="466" font-size="29" fill="#f4ca64">月より大きい</text><text x="320" y="508" font-size="27">岩石の表面</text><text x="320" y="540" font-size="19">表面の性質は色の明暗では決められない。</text><text x="320" y="592" font-size="19">同じ体積の球にした平均半径で比較。</text><text x="320" y="622" font-size="18" fill="#b9c9df">色・模様は実際の見え方を再現していない。</text></g></svg>
