<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="わかめの分類と食べる部分"><rect width="480" height="480" rx="24" fill="#faf6eb"/><g font-family="Yu Gothic, Meiryo, sans-serif" fill="#283d38"><text x="24" y="43" font-size="29" font-weight="bold">わかめ</text><text x="24" y="76" font-size="20">2群：乳・小魚・海藻</text><path d="M238 256Q221 209 238 108" stroke="#425b39" stroke-width="10" fill="none"/><path d="M236 146Q175 149 163 114Q144 151 183 174Q211 188 232 175M233 193Q181 183 153 162Q131 208 183 224Q213 233 232 219M237 143Q279 153 298 113Q319 159 275 177Q252 185 234 174M234 198Q284 186 319 158Q343 204 289 226Q261 236 235 218" fill="#536f43" stroke="#385534" stroke-width="4"/><rect x="22" y="280" width="436" height="134" rx="16" fill="#e6eee3"/><text x="40" y="313" font-size="23" font-weight="bold">海藻を食べる</text><text x="40" y="349" font-size="20">この札は、わかめだけ。</text><text x="40" y="386" font-size="18">葉に見えても、陸上の葉野菜とは別。</text><text x="24" y="450" font-size="17">形・大きさは模式図。食べる対象はこの例。</text></g></svg>
