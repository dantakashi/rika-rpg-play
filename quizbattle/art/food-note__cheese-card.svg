<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="チーズの食品群と製法"><rect width="480" height="480" rx="24" fill="#faf6eb"/><g font-family="Yu Gothic, Meiryo, sans-serif" fill="#283d38"><text x="24" y="43" font-size="29" font-weight="bold">チーズ</text><text x="24" y="76" font-size="20">2群：乳・小魚・海藻</text><path d="M139 190l142-84 65 73-145 70z" fill="#f2cf63" stroke="#a88031" stroke-width="5"/><path d="M139 190v43l62 33v-17z" fill="#d5a73d" stroke="#a88031" stroke-width="5"/><path d="M201 249l145-70v42l-145 45z" fill="#e5ba4e" stroke="#a88031" stroke-width="5"/><path d="M183 166l94-55" stroke="#fff0aa" stroke-width="5"/><rect x="22" y="280" width="436" height="134" rx="16" fill="#e6eee3"/><text x="40" y="313" font-size="23" font-weight="bold">乳酸菌で発酵・熟成</text><text x="40" y="349" font-size="20">卵を加えないチーズの例。</text><text x="40" y="386" font-size="18">牛乳と同じ2群。製法が違う。</text><text x="24" y="450" font-size="17">形・大きさは模式図。材料・製法はこの例。</text></g></svg>
