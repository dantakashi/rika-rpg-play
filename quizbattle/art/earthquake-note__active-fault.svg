<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#234b66"/></marker></defs>
<rect width="480" height="360" rx="22" fill="#f7f3e8"/>
<g font-family="'Yu Gothic',sans-serif" fill="#172d40"><text x="24" y="38" font-size="23" font-weight="bold">活断層：過去の活動に注目</text>
<text x="24" y="68" font-size="16">断層の履歴と、地表の変化を比較</text><path d="M35 145H235V165H445V251H35Z" fill="#dfc8a4"/><path d="M35 145H235V165H445" fill="none" stroke="#384e45" stroke-width="4"/><path d="M235 145L304 251" stroke="#63433d" stroke-width="5"/><text x="337" y="225" font-size="18">断層</text><path d="M286 224H328" stroke="#63433d" stroke-width="2"/><path d="M58 101H423" stroke="#234b66" stroke-width="3" marker-end="url(#arrow)"/><circle cx="95" cy="101" r="6" fill="#b33d29"/><text x="57" y="128" font-size="14">過去の活動</text><circle cx="264" cy="101" r="6" fill="#b33d29"/><text x="226" y="128" font-size="14">後の活動</text><rect x="43" y="82" width="390" height="54" rx="8" fill="none" stroke="#b33d29" stroke-width="3"/><text x="33" y="278" font-size="17">繰り返した活動を、地層などから調べる。</text><text x="33" y="305" font-size="17">将来も活動する可能性がある断層。</text><text x="24" y="334" font-size="14">履歴の模式例。地表の痕跡が見えない場合もある。</text></g></svg>