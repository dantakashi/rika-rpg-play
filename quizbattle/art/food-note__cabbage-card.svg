<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="キャベツの分類と食べる部分"><rect width="480" height="480" rx="24" fill="#faf6eb"/><g font-family="Yu Gothic, Meiryo, sans-serif" fill="#283d38"><text x="24" y="43" font-size="29" font-weight="bold">キャベツ</text><text x="24" y="76" font-size="20">4群：その他の野菜・果物</text><ellipse cx="240" cy="182" rx="106" ry="73" fill="#abc988" stroke="#59774c" stroke-width="5"/><path d="M240 112C158 116 160 205 240 251C320 205 322 116 240 112M140 167Q189 147 240 251M340 167Q290 147 240 251M190 128Q227 150 240 251M290 128Q252 150 240 251" fill="none" stroke="#6d9256" stroke-width="4"/><rect x="22" y="280" width="436" height="134" rx="16" fill="#e6eee3"/><text x="40" y="313" font-size="23" font-weight="bold">重なった葉を食べる</text><text x="40" y="349" font-size="20">この札はドレッシングなし。</text><text x="40" y="386" font-size="18">ほうれんそうも葉。食品群は違う。</text><text x="24" y="450" font-size="17">形・大きさは模式図。食べる対象はこの例。</text></g></svg>
