<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="パンの原料と加工の比較"><rect width="480" height="480" rx="24" fill="#faf6eb"/><g font-family="Yu Gothic, Meiryo, sans-serif" fill="#283d38"><text x="24" y="43" font-size="29" font-weight="bold">パン</text><text x="24" y="76" font-size="20">5群：穀類・いも・砂糖</text><path d="M151 234V166Q130 130 169 113Q202 92 235 116Q273 91 309 117Q346 139 324 170V234Z" fill="#d9a459" stroke="#91652f" stroke-width="5"/><path d="M170 218v-51Q154 139 181 130Q204 116 234 137Q267 115 296 133Q319 143 305 168v50Z" fill="#f4deb0"/><g fill="#d9bd88"><circle cx="202" cy="160" r="6"/><circle cx="263" cy="161" r="7"/><circle cx="234" cy="195" r="5"/><circle cx="289" cy="199" r="5"/></g><rect x="22" y="280" width="436" height="134" rx="16" fill="#e6eee3"/><text x="40" y="313" font-size="22" font-weight="bold">小麦粉を酵母で発酵させる</text><text x="40" y="349" font-size="20">小麦粉・水・酵母・塩の例。</text><text x="40" y="386" font-size="18">この例は卵・乳を加えない。</text><text x="24" y="450" font-size="17">形・大きさは模式図。材料・製法はこの例。</text></g></svg>
