<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="きゅうりの食品群と果実の比較"><rect width="480" height="480" rx="24" fill="#faf6eb"/><g font-family="Yu Gothic, Meiryo, sans-serif" fill="#283d38"><text x="24" y="43" font-size="29" font-weight="bold">きゅうり</text><text x="24" y="76" font-size="20">4群：その他の野菜・果物</text><path d="M131 193Q178 131 306 109Q343 108 347 132Q345 151 317 158Q212 178 165 225Q137 242 122 222Q113 206 131 193Z" fill="#3a8050" stroke="#245634" stroke-width="5"/><path d="M142 207Q211 154 325 133" stroke="#82ad66" stroke-width="8" fill="none"/><g fill="#245634"><circle cx="168" cy="176" r="4"/><circle cx="209" cy="157" r="4"/><circle cx="255" cy="143" r="4"/><circle cx="287" cy="155" r="4"/><circle cx="184" cy="201" r="4"/></g><rect x="22" y="270" width="436" height="144" rx="16" fill="#e6eee3"/><text x="40" y="305" font-size="23" font-weight="bold">果実を食べる野菜</text><text x="40" y="340" font-size="22">緑の皮／未熟な実</text><text x="40" y="380" font-size="18">かぼちゃは3群。皮の色で分けない。</text><text x="24" y="450" font-size="17">形・大きさは模式図。皮の色はこの例。</text></g></svg>
