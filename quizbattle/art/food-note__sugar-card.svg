<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="砂糖の食品群と加工の比較"><rect width="480" height="480" rx="24" fill="#faf6eb"/><g font-family="Yu Gothic, Meiryo, sans-serif" fill="#283d38"><text x="24" y="43" font-size="29" font-weight="bold">砂糖</text><text x="24" y="76" font-size="20">5群：穀類・いも・砂糖</text><path d="M105 241L117 116M139 241L151 107" fill="none" stroke="#92a45d" stroke-width="18"/><path d="M108 211L124 213M112 173L128 175M116 136L132 138M143 203L159 205M147 162L163 164M150 124L166 126" stroke="#586e42" stroke-width="4"/><path d="M212 211Q285 176 362 211L344 247Q286 266 230 247Z" fill="#dbe5df" stroke="#7c9990" stroke-width="4"/><path d="M220 210L246 191L262 193L282 172L305 188L328 191L353 211Z" fill="#fff" stroke="#c4cbc4" stroke-width="2"/><path d="M256 201L261 197M283 192L288 187M307 204L312 199M285 211L290 206" stroke="#d5d8d0" stroke-width="3"/><rect x="22" y="280" width="436" height="134" rx="16" fill="#e6eee3"/><text x="40" y="313" font-size="22" font-weight="bold">さとうきびの茎から糖を取り出す</text><text x="40" y="349" font-size="20">白い粒状の砂糖を示した例。</text><text x="40" y="386" font-size="18">茎そのものを食べる野菜とは別。</text><text x="24" y="450" font-size="17">形・大きさは模式図。材料はこの例。</text></g></svg>
