<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="バターの食品群と製法"><rect width="480" height="480" rx="24" fill="#faf6eb"/><g font-family="Yu Gothic, Meiryo, sans-serif" fill="#283d38"><text x="24" y="43" font-size="29" font-weight="bold">バター</text><text x="24" y="76" font-size="20">6群：油脂・種実類</text><ellipse cx="240" cy="227" rx="141" ry="29" fill="#e8eeeb" stroke="#9caca4" stroke-width="4"/><path d="M153 158l151-29 42 40-151 33z" fill="#fff2a1" stroke="#b39b4f" stroke-width="5"/><path d="M153 158v59l42 27v-42z" fill="#e5cf75" stroke="#b39b4f" stroke-width="5"/><path d="M195 202l151-33v53l-151 22z" fill="#f1df88" stroke="#b39b4f" stroke-width="5"/><rect x="22" y="280" width="436" height="134" rx="16" fill="#e6eee3"/><text x="40" y="313" font-size="23" font-weight="bold">乳の脂肪から作る</text><text x="40" y="349" font-size="20">この札は、発酵させないバター。</text><text x="40" y="386" font-size="18">チーズと乳由来は同じ。群は違う。</text><text x="24" y="450" font-size="17">形・大きさは模式図。材料・製法はこの例。</text></g></svg>
