<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="マヨネーズの食品群と加工の比較"><rect width="480" height="480" rx="24" fill="#faf6eb"/><g font-family="Yu Gothic, Meiryo, sans-serif" fill="#283d38"><text x="24" y="43" font-size="29" font-weight="bold">マヨネーズ</text><text x="24" y="76" font-size="20">6群：油脂・種実類</text><path d="M198 133H280L302 173V242Q240 266 178 242V173Z" fill="#fff0b9" stroke="#a89868" stroke-width="4"/><rect x="200" y="111" width="78" height="28" rx="5" fill="#b64c3f"/><rect x="194" y="181" width="92" height="45" rx="8" fill="#fffdf0"/><text x="240" y="210" font-size="21" text-anchor="middle">マヨ</text><rect x="22" y="280" width="436" height="134" rx="16" fill="#e6eee3"/><text x="40" y="313" font-size="22" font-weight="bold">油に卵黄・酢などを混ぜる</text><text x="40" y="349" font-size="20">なたね油・卵黄・醸造酢・塩の例。</text><text x="40" y="386" font-size="18">卵を使っていても、食品群は6群。</text><text x="24" y="450" font-size="17">形・大きさは模式図。材料はこの例。</text></g></svg>
