<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" role="img" aria-labelledby="title desc"><title id="title">流星（光る現象）</title><desc id="desc">地球の大気中で見える光。現象を示す札。三段階の比較でこの札を枠で示す。必ず地上に届くわけではない。</desc><rect width="640" height="640" rx="24" fill="#101d35"/><g font-family="Yu Gothic,sans-serif" text-anchor="middle" fill="#f3f6ff"><text x="320" y="55" font-size="38" font-weight="bold">流星</text><text x="320" y="104" font-size="27">地球の大気中で見える光</text><path d="M225 150L390 268" stroke="#ef9a4f" stroke-width="29"/><path d="M244 158L390 268" stroke="#fff2bf" stroke-width="10"/><text x="320" y="328" font-size="32" font-weight="bold" fill="#f4ca64">この札は「現象」</text><text x="320" y="372" font-size="21">場所と、物体か現象かを比べよう</text><rect x="20" y="392" width="190" height="104" rx="12" fill="#1b2c47" stroke="#7088a8" stroke-width="2"/><text x="115" y="430" font-size="27" fill="#7088a8">流星物質</text><text x="115" y="470" font-size="22">宇宙の物体</text><rect x="225" y="392" width="190" height="104" rx="12" fill="#1b2c47" stroke="#f4ca64" stroke-width="5"/><text x="320" y="430" font-size="27" fill="#f4ca64">流星</text><text x="320" y="470" font-size="22">大気中の現象</text><rect x="430" y="392" width="190" height="104" rx="12" fill="#1b2c47" stroke="#7088a8" stroke-width="2"/><text x="525" y="430" font-size="27" fill="#7088a8">隕石</text><text x="525" y="470" font-size="22">地上の物体</text><text x="320" y="535" font-size="23">大気に入っても、地上に届かず</text><text x="320" y="566" font-size="23">消失する場合がある。</text><text x="320" y="610" font-size="18" fill="#b9c9df">模式例。同じ石の記録ではなく、縮尺も共通でない。</text></g></svg>
