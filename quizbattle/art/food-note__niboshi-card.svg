<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="煮干しの食品群と対象の比較"><rect width="480" height="480" rx="24" fill="#faf6eb"/><g font-family="Yu Gothic, Meiryo, sans-serif" fill="#283d38"><text x="24" y="43" font-size="29" font-weight="bold">煮干し</text><text x="24" y="76" font-size="20">2群：乳・小魚・海藻</text><path d="M130 168Q206 114 304 169L346 141v57l-42-25Q213 217 130 168Z" fill="#b9c5bd" stroke="#53695f" stroke-width="4"/><circle cx="157" cy="164" r="5" fill="#293b35"/><path d="M177 146q16 22 0 41M190 164l103 6" stroke="#75877e" stroke-width="3" fill="none"/><g transform="translate(-15 67) scale(.85)"><path d="M130 168Q206 114 304 169L346 141v57l-42-25Q213 217 130 168Z" fill="#b9c5bd" stroke="#53695f" stroke-width="4"/><circle cx="157" cy="164" r="5" fill="#293b35"/><path d="M177 146q16 22 0 41M190 164l103 6" stroke="#75877e" stroke-width="3" fill="none"/></g><rect x="22" y="280" width="436" height="134" rx="16" fill="#e6eee3"/><text x="40" y="313" font-size="22" font-weight="bold">小魚を骨ごと食べる</text><text x="40" y="349" font-size="20">いわしを煮て干した例。</text><text x="40" y="386" font-size="18">さけの切り身は1群。</text><text x="24" y="450" font-size="17">形・大きさは模式図。食べる対象はこの例。</text></g></svg>
