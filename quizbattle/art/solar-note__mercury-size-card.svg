<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" role="img"><title>水星と月の大きさ比較</title><rect width="640" height="640" rx="24" fill="#101d35"/><g font-family="Yu Gothic,sans-serif" text-anchor="middle" fill="#f3f6ff"><text x="320" y="54" font-size="38" font-weight="bold">水星</text><text x="320" y="98" font-size="25">地球の月と、同じ縮尺で比べよう</text><circle cx="150" cy="255" r="35" fill="#b6becb"/><circle cx="450" cy="255" r="49.141821" fill="#aeb6c3" stroke="#f4ca64" stroke-width="4"/><text x="150" y="405" font-size="28">地球の月</text><text x="450" y="405" font-size="28" fill="#f4ca64">水星</text><rect x="20" y="425" width="600" height="132" rx="14" fill="#1b2c47"/><text x="320" y="463" font-size="29" fill="#f4ca64">月より大きい</text><text x="320" y="502" font-size="22">地表の気圧は、地球の海面付近より低い。</text><text x="320" y="537" font-size="22">岩石の地面をもつ惑星。</text><text x="320" y="590" font-size="19">同じ体積の球にした平均半径で比較。</text><text x="320" y="621" font-size="18" fill="#b9c9df">色・模様は実際の見え方を再現していない。</text></g></svg>
