<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520"><rect width="800" height="520" rx="30" fill="#eef5fa"/><g fill="#18364a" font-family="Meiryo,sans-serif" text-anchor="middle"><text x="400" y="60" font-size="30" font-weight="bold">冬のシベリア高気圧</text><text x="400" y="112" font-size="23">シベリア・モンゴル方面の大陸</text><g fill="none" stroke="#548aaf" stroke-width="4"><ellipse cx="400" cy="240" rx="148" ry="84"/><ellipse cx="400" cy="240" rx="102" ry="58"/></g><text x="400" y="255" font-size="48" font-weight="bold">高</text><text x="400" y="356" font-size="22">地上の中心は周囲より気圧が高い</text><text x="400" y="409" font-size="23">冬を中心とする寒い時期</text><text x="400" y="459" font-size="23">大陸側に発達する高気圧</text><text x="400" y="501" font-size="16">形・大きさ・位置を再現した天気図ではなく、性質の模式図</text></g></svg>