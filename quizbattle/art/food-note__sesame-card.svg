<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="ごまの原料と加工の比較"><rect width="480" height="480" rx="24" fill="#faf6eb"/><g font-family="Yu Gothic, Meiryo, sans-serif" fill="#283d38"><text x="24" y="43" font-size="29" font-weight="bold">ごま</text><text x="24" y="76" font-size="20">6群：油脂・種実類</text><ellipse cx="240" cy="202" rx="133" ry="48" fill="#e7e9dd" stroke="#9ba58c" stroke-width="4"/><ellipse cx="150" cy="193" rx="10" ry="5" transform="rotate(20 150 193)" fill="#c3a46b" stroke="#917647" stroke-width="2"/><ellipse cx="174" cy="178" rx="10" ry="5" transform="rotate(-20 174 178)" fill="#c3a46b" stroke="#917647" stroke-width="2"/><ellipse cx="198" cy="204" rx="10" ry="5" transform="rotate(30 198 204)" fill="#c3a46b" stroke="#917647" stroke-width="2"/><ellipse cx="220" cy="183" rx="10" ry="5" transform="rotate(-30 220 183)" fill="#c3a46b" stroke="#917647" stroke-width="2"/><ellipse cx="244" cy="211" rx="10" ry="5" transform="rotate(30 244 211)" fill="#c3a46b" stroke="#917647" stroke-width="2"/><ellipse cx="269" cy="185" rx="10" ry="5" transform="rotate(-20 269 185)" fill="#c3a46b" stroke="#917647" stroke-width="2"/><ellipse cx="295" cy="205" rx="10" ry="5" transform="rotate(20 295 205)" fill="#c3a46b" stroke="#917647" stroke-width="2"/><ellipse cx="322" cy="190" rx="10" ry="5" transform="rotate(-30 322 190)" fill="#c3a46b" stroke="#917647" stroke-width="2"/><ellipse cx="181" cy="218" rx="10" ry="5" transform="rotate(-15 181 218)" fill="#c3a46b" stroke="#917647" stroke-width="2"/><ellipse cx="224" cy="224" rx="10" ry="5" transform="rotate(20 224 224)" fill="#c3a46b" stroke="#917647" stroke-width="2"/><ellipse cx="280" cy="223" rx="10" ry="5" transform="rotate(-25 280 223)" fill="#c3a46b" stroke="#917647" stroke-width="2"/><ellipse cx="245" cy="168" rx="10" ry="5" transform="rotate(10 245 168)" fill="#c3a46b" stroke="#917647" stroke-width="2"/><rect x="22" y="280" width="436" height="134" rx="16" fill="#e6eee3"/><text x="40" y="313" font-size="22" font-weight="bold">種子を粒の形で食べる</text><text x="40" y="349" font-size="20">いったごまを、そのまま使う例。</text><text x="40" y="386" font-size="18">植物油は、種子から取り出した油。</text><text x="24" y="450" font-size="17">形・大きさは模式図。材料・製法はこの例。</text></g></svg>
