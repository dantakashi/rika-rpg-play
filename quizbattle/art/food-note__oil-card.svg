<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="植物油の原料と加工の比較"><rect width="480" height="480" rx="24" fill="#faf6eb"/><g font-family="Yu Gothic, Meiryo, sans-serif" fill="#283d38"><text x="24" y="43" font-size="29" font-weight="bold">植物油</text><text x="24" y="76" font-size="20">6群：油脂・種実類</text><path d="M209 111h62v33l26 22v84H183v-84l26-22Z" fill="#f9f3c8" stroke="#8b996e" stroke-width="5"/><rect x="208" y="96" width="64" height="22" rx="4" fill="#78935b"/><path d="M190 182h100v60H190Z" fill="#e7c955"/><rect x="201" y="192" width="78" height="34" rx="5" fill="#fff9dc"/><text x="211" y="216" font-size="19">なたね</text><rect x="22" y="280" width="436" height="134" rx="16" fill="#e6eee3"/><text x="40" y="313" font-size="22" font-weight="bold">種子から油を取り出す</text><text x="40" y="349" font-size="20">この札は、なたね油の例。</text><text x="40" y="386" font-size="18">ごまの粒食とは加工の仕方が違う。</text><text x="24" y="450" font-size="17">形・大きさは模式図。材料・製法はこの例。</text></g></svg>
