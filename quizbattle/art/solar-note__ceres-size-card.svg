<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" role="img"><title>準惑星ケレスと月の大きさ比較</title><rect width="640" height="640" rx="24" fill="#101d35"/><g font-family="Yu Gothic,sans-serif" text-anchor="middle" fill="#f3f6ff"><text x="320" y="54" font-size="38" font-weight="bold">準惑星ケレス</text><text x="320" y="98" font-size="25">地球の月と、同じ縮尺で比べよう</text><circle cx="160" cy="260" r="110" fill="#b6becb"/><circle cx="470" cy="260" r="29.738114" fill="#f4ca64"/><text x="160" y="408" font-size="28">地球の月</text><text x="470" y="408" font-size="26" fill="#f4ca64">準惑星ケレス</text><rect x="20" y="429" width="600" height="130" rx="14" fill="#1b2c47"/><text x="320" y="464" font-size="29" fill="#f4ca64">月より小さい</text><text x="320" y="503" font-size="22">太陽を回る準惑星。自然衛星ではない。</text><text x="320" y="538" font-size="22">氷の多い地殻を考える研究もある。</text><text x="320" y="590" font-size="19">同じ体積の球にした平均半径で比較。</text><text x="320" y="621" font-size="18" fill="#b9c9df">円の形・色は、実際の外観を再現していない。</text></g></svg>
