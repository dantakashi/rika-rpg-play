<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" role="img" aria-labelledby="title desc"><title id="title">67Pすい星の核</title><desc id="desc">固体の核と、その周りの気体や塵のコマ・尾を区別する模式図。核を金色の枠で示す。実際の形や縮尺ではない。</desc><rect width="640" height="640" rx="24" fill="#101d35"/><g font-family="Yu Gothic,sans-serif" fill="#f3f6ff" text-anchor="middle"><text x="320" y="54" font-size="36" font-weight="bold">67Pすい星の核</text><text x="320" y="98" font-size="25">「核」と「周りに広がるもの」を比較</text><path d="M250 255Q400 160 602 164L602 268Q425 254 250 290Z" fill="#7096b5" opacity=".4"/><ellipse cx="239" cy="272" rx="112" ry="91" fill="#7096b5" opacity=".38"/><path d="M204 251Q187 218 219 213Q247 207 259 240Q298 224 301 258Q307 299 269 310Q228 324 210 295Q188 284 204 251Z" fill="#8d8179" stroke="#f4ca64" stroke-width="5"/><path d="M240 188L240 151M330 289L420 326M484 207L515 133" stroke="#d6e3f2" stroke-width="2" fill="none"/><text x="240" y="140" font-size="28" fill="#f4ca64">核：この札の対象</text><text x="469" y="357" font-size="26">コマ：核の周り</text><text x="544" y="126" font-size="26">尾</text><rect x="26" y="387" width="588" height="162" rx="14" fill="#1b2c47"/><text x="320" y="426" font-size="27" fill="#f4ca64" font-weight="bold">核は、氷や塵などからなる固体</text><text x="320" y="468" font-size="24">太陽に近づくと、氷が気体になり、</text><text x="320" y="505" font-size="24">塵も出て、コマや尾をつくる。</text><text x="320" y="582" font-size="21">尾は固体の核そのものではない。</text><text x="320" y="619" font-size="18" fill="#b9c9df">模式図。形・縮尺・尾の細かな構造は表さない。</text></g></svg>
