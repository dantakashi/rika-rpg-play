<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" role="img"><title>北極星と北の空</title><rect width="640" height="640" rx="24" fill="#101d35"/><g font-family="Yu Gothic,sans-serif" text-anchor="middle" fill="#f3f6ff"><text x="320" y="54" font-size="38" font-weight="bold">北極星</text><text x="320" y="98" font-size="26">現在の日本から、一晩の空を比べる</text><path d="M192 337A145 145 0 0 1 450 196M223 298A97 97 0 0 1 401 210" fill="none" stroke="#87a7ce" stroke-width="6"/><circle cx="320" cy="260" r="3" fill="#fff"/><circle cx="335" cy="254" r="11" fill="#ffe1a0"/><circle cx="320" cy="260" r="31" fill="none" stroke="#f4ca64" stroke-width="2" stroke-dasharray="6 6"/><text x="320" y="385" font-size="26" fill="#f4ca64">北極星は中心の近く</text><rect x="20" y="425" width="600" height="133" rx="14" fill="#1b2c47"/><text x="320" y="466" font-size="25">ほかの星は大きく位置を変える。</text><text x="320" y="505" font-size="25">北極星の位置の変化は小さい。</text><text x="320" y="540" font-size="22">完全に止まっているわけではない。</text><text x="320" y="590" font-size="20">北の方向を知る目印になる。</text><text x="320" y="622" font-size="18" fill="#b9c9df">動きの模式図。角度・速さ・時間の長さは縮尺でない。</text></g></svg>
