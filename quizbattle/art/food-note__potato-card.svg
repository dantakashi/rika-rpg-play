<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="じゃがいもの食べる部分の比較"><rect width="480" height="480" rx="24" fill="#faf6eb"/><g font-family="Yu Gothic, Meiryo, sans-serif" fill="#283d38"><text x="24" y="43" font-size="29" font-weight="bold">じゃがいも</text><text x="24" y="76" font-size="20">5群：穀類・いも・砂糖</text><path d="M139 155C163 104 255 111 296 136C350 166 335 229 279 243C223 263 157 239 135 201Q121 181 139 155Z" fill="#cba56a" stroke="#8c6b40" stroke-width="5"/><g fill="#86673f"><ellipse cx="175" cy="163" rx="9" ry="5"/><ellipse cx="249" cy="143" rx="8" ry="5"/><ellipse cx="290" cy="197" rx="9" ry="5"/><ellipse cx="214" cy="220" rx="7" ry="4"/></g><path d="M291 190l46-61" stroke="#526751" stroke-width="2"/><text x="340" y="123" font-size="20">目</text><rect x="22" y="280" width="436" height="134" rx="16" fill="#e6eee3"/><text x="40" y="313" font-size="23" font-weight="bold">地下の茎が太ったもの</text><text x="40" y="349" font-size="20">表面に芽の出る「目」がある。</text><text x="40" y="386" font-size="18">だいこんの根・胚軸とは違う。</text><text x="24" y="450" font-size="17">形・大きさ・部位の境界は模式図。</text></g></svg>
