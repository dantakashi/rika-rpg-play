<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="豆腐の食品群と加工の比較"><rect width="480" height="480" rx="24" fill="#faf6eb"/><g font-family="Yu Gothic, Meiryo, sans-serif" fill="#283d38"><text x="24" y="43" font-size="29" font-weight="bold">豆腐</text><text x="24" y="76" font-size="20">1群：魚・肉・卵・豆</text><ellipse cx="242" cy="242" rx="133" ry="25" fill="#d7e4df"/><path d="M140 160L277 128L348 164L210 200Z" fill="#fffdf0" stroke="#a5b4a3" stroke-width="3"/><path d="M140 160L210 200V251L140 210Z" fill="#e8e5cf" stroke="#a5b4a3" stroke-width="3"/><path d="M210 200L348 164V216L210 251Z" fill="#f2efdc" stroke="#a5b4a3" stroke-width="3"/><ellipse cx="97" cy="144" rx="16" ry="12" fill="#d6bd78"/><ellipse cx="106" cy="179" rx="16" ry="12" fill="#d6bd78"/><rect x="22" y="280" width="436" height="134" rx="16" fill="#e6eee3"/><text x="40" y="313" font-size="22" font-weight="bold">大豆から豆乳を取り、固める</text><text x="40" y="349" font-size="20">大豆・水・凝固剤で作る例。</text><text x="40" y="386" font-size="18">卵で固める「卵豆腐」とは別。</text><text x="24" y="450" font-size="17">形・大きさは模式図。材料はこの例。</text></g></svg>
