<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" role="img"><title>フォボスと月の大きさ比較</title><rect width="640" height="640" rx="24" fill="#101d35"/><g font-family="Yu Gothic,sans-serif" text-anchor="middle" fill="#f3f6ff"><text x="320" y="54" font-size="38" font-weight="bold">フォボス</text><text x="320" y="98" font-size="25">地球の月と、同じ縮尺で比べよう</text><circle cx="160" cy="260" r="110" fill="#b6becb"/><circle cx="470" cy="260" r="0.701508" fill="#f4ca64"/><path d="M470 197V245" stroke="#f4ca64" stroke-width="2"/><text x="470" y="179" font-size="23">ここに小さな円</text><text x="160" y="408" font-size="28">地球の月</text><text x="470" y="408" font-size="26" fill="#f4ca64">フォボス</text><rect x="20" y="429" width="600" height="130" rx="14" fill="#1b2c47"/><text x="320" y="464" font-size="29" fill="#f4ca64">月より小さい</text><text x="320" y="503" font-size="22">火星を回る自然衛星。</text><text x="320" y="538" font-size="22">小さな、不規則な形の天体。</text><text x="320" y="590" font-size="19">同じ体積の球にした平均半径で比較。</text><text x="320" y="621" font-size="18" fill="#b9c9df">円の形・色は、実際の外観を再現していない。</text></g></svg>
