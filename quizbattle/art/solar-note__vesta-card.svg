<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" role="img"><title>小惑星ベスタの分類と表面</title><rect width="640" height="640" rx="24" fill="#101d35"/><g font-family="Yu Gothic,sans-serif" text-anchor="middle" fill="#f3f6ff"><text x="320" y="54" font-size="38" font-weight="bold">小惑星ベスタ</text><text x="320" y="98" font-size="26">岩石の表面をもつ小惑星の具体例</text><path d="M225 211Q280 150 364 185Q435 213 416 285Q388 355 302 343Q225 339 214 284Z" fill="#9c9998" stroke="#f4ca64" stroke-width="4"/><ellipse cx="287" cy="241" rx="26" ry="18" fill="#747a86"/><ellipse cx="364" cy="279" rx="33" ry="24" fill="#747a86"/><text x="320" y="389" font-size="28" fill="#f4ca64">地球の月より小さい</text><rect x="20" y="425" width="600" height="132" rx="14" fill="#1b2c47"/><text x="320" y="466" font-size="26">太陽を回る、小惑星。</text><text x="320" y="506" font-size="24">内部の構造は研究が続いている。</text><text x="320" y="540" font-size="22">表面と、内部の核は区別しよう。</text><text x="320" y="590" font-size="20">内部を断定する断面図ではない。</text><text x="320" y="622" font-size="18" fill="#b9c9df">模式図。形・色・模様・縮尺は実物を再現していない。</text></g></svg>
