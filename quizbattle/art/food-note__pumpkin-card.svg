<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="かぼちゃの食品群と果実の比較"><rect width="480" height="480" rx="24" fill="#faf6eb"/><g font-family="Yu Gothic, Meiryo, sans-serif" fill="#283d38"><text x="24" y="43" font-size="29" font-weight="bold">かぼちゃ</text><text x="24" y="76" font-size="20">3群：緑黄色野菜</text><ellipse cx="207" cy="167" rx="96" ry="75" fill="#36654a" stroke="#254f38" stroke-width="5"/><path d="M206 95q-10-23 4-33" fill="none" stroke="#6e7441" stroke-width="14"/><path d="M177 101q-36 63 0 132M224 98q38 66 0 137" stroke="#65835a" stroke-width="5" fill="none"/><path d="M243 157L357 198Q335 267 243 222Z" fill="#eea23e" stroke="#28543c" stroke-width="9"/><path d="M266 175l60 27q-16 30-56 10z" fill="#f7ce79"/><rect x="22" y="270" width="436" height="144" rx="16" fill="#e6eee3"/><text x="40" y="305" font-size="23" font-weight="bold">果実を食べる野菜</text><text x="40" y="340" font-size="22">緑の皮／食べるのは果肉</text><text x="40" y="380" font-size="18">きゅうりも果実。食品群は違う。</text><text x="24" y="450" font-size="17">形・大きさは模式図。皮の色はこの例。</text></g></svg>
