<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" role="img" aria-labelledby="title desc"><title id="title">木星：4惑星の環の比較</title><desc id="desc">木星は巨大ガス惑星。木星・土星・天王星・海王星には環がある。環は説明のため強調し、実際の形・傾き・縮尺とは異なる。</desc><rect width="640" height="640" rx="24" fill="#101d35"/><g font-family="Yu Gothic,sans-serif" text-anchor="middle" fill="#f3f6ff"><text x="320" y="55" font-size="38" font-weight="bold">木星</text><text x="320" y="99" font-size="26">巨大ガス惑星</text><ellipse cx="320" cy="210" rx="170" ry="45" fill="none" stroke="#dae4ef" stroke-width="10"/><circle cx="320" cy="210" r="78" fill="#c9a883"/><path d="M150 210a170 45 0 0 0 340 0" fill="none" stroke="#dae4ef" stroke-width="10"/><text x="320" y="329" font-size="29" font-weight="bold" fill="#f4ca64">この4惑星には、どれも環がある</text><rect x="10" y="370" width="140" height="128" rx="12" fill="#1b2c47" stroke="#f4ca64" stroke-width="5"/><ellipse cx="80" cy="415" rx="49" ry="13" fill="none" stroke="#dae4ef" stroke-width="3"/><circle cx="80" cy="415" r="24" fill="#c9a883"/><path d="M31 415a49 13 0 0 0 98 0" fill="none" stroke="#dae4ef" stroke-width="3"/><text x="80" y="474" font-size="25">木星</text><rect x="170" y="370" width="140" height="128" rx="12" fill="#1b2c47" stroke="#8196b4" stroke-width="2"/><ellipse cx="240" cy="415" rx="49" ry="13" fill="none" stroke="#dae4ef" stroke-width="3"/><circle cx="240" cy="415" r="24" fill="#dec88d"/><path d="M191 415a49 13 0 0 0 98 0" fill="none" stroke="#dae4ef" stroke-width="3"/><text x="240" y="474" font-size="25">土星</text><rect x="330" y="370" width="140" height="128" rx="12" fill="#1b2c47" stroke="#8196b4" stroke-width="2"/><ellipse cx="400" cy="415" rx="49" ry="13" fill="none" stroke="#dae4ef" stroke-width="3"/><circle cx="400" cy="415" r="24" fill="#8cd0d4"/><path d="M351 415a49 13 0 0 0 98 0" fill="none" stroke="#dae4ef" stroke-width="3"/><text x="400" y="474" font-size="25">天王星</text><rect x="490" y="370" width="140" height="128" rx="12" fill="#1b2c47" stroke="#8196b4" stroke-width="2"/><ellipse cx="560" cy="415" rx="49" ry="13" fill="none" stroke="#dae4ef" stroke-width="3"/><circle cx="560" cy="415" r="24" fill="#7ca9dc"/><path d="M511 415a49 13 0 0 0 98 0" fill="none" stroke="#dae4ef" stroke-width="3"/><text x="560" y="474" font-size="25">海王星</text><text x="320" y="541" font-size="23">写真や絵で目立たなくても、環はある。</text><text x="320" y="577" font-size="21">巨大惑星の外側には、固体の地面はない。</text><text x="320" y="616" font-size="18" fill="#b9c9df">模式図：環を強調。形・傾き・大きさは比較しない。</text></g></svg>
