<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="だいこんの食べる部分の比較"><rect width="480" height="480" rx="24" fill="#faf6eb"/><g font-family="Yu Gothic, Meiryo, sans-serif" fill="#283d38"><text x="24" y="43" font-size="29" font-weight="bold">だいこん</text><text x="24" y="76" font-size="20">4群：その他の野菜・果物</text><path d="M188 113Q235 98 276 113L266 171H193Z" fill="#dbe7c9" stroke="#80916d" stroke-width="4"/><path d="M193 171h73Q260 228 223 257Q201 225 193 171Z" fill="#fffdf1" stroke="#80916d" stroke-width="4"/><ellipse cx="232" cy="113" rx="44" ry="10" fill="#e3eacd" stroke="#80916d" stroke-width="4"/><path d="M202 194l-11 7M254 198l12 7M211 219l-10 7M243 226l10 6" stroke="#80916d" stroke-width="3"/><path d="M279 140h28M273 212h34" stroke="#526751" stroke-width="2"/><text x="315" y="147" font-size="20">胚軸</text><text x="315" y="219" font-size="20">根</text><rect x="22" y="280" width="436" height="134" rx="16" fill="#e6eee3"/><text x="40" y="313" font-size="23" font-weight="bold">太った根と胚軸を食べる</text><text x="40" y="349" font-size="20">上部は胚軸、下部は根の例。</text><text x="40" y="386" font-size="18">にんじんも根を食べるが3群。</text><text x="24" y="450" font-size="17">形・大きさ・部位の境界は模式図。</text></g></svg>
