<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="りんごの食品群と果実の比較"><rect width="480" height="480" rx="24" fill="#faf6eb"/><g font-family="Yu Gothic, Meiryo, sans-serif" fill="#283d38"><text x="24" y="43" font-size="29" font-weight="bold">りんご</text><text x="24" y="76" font-size="20">4群：その他の野菜・果物</text><g transform="translate(0 24)"><path d="M239 110C149 65 123 147 153 213Q177 258 237 234Q297 258 326 209C358 126 300 77 239 110Z" fill="#c92d43" stroke="#85253a" stroke-width="5"/><path d="M239 113q-2-27 15-43" stroke="#795037" stroke-width="10" fill="none"/><path d="M253 86q22-31 49-10-23 23-49 10" fill="#477d42"/></g><rect x="22" y="270" width="436" height="144" rx="16" fill="#e6eee3"/><text x="40" y="305" font-size="23" font-weight="bold">食生活では果物</text><text x="40" y="340" font-size="22">赤い皮のりんごの例</text><text x="40" y="380" font-size="18">トマトは野菜。どちらも植物の果実。</text><text x="24" y="450" font-size="17">形・大きさは模式図。皮の色はこの例。</text></g></svg>
