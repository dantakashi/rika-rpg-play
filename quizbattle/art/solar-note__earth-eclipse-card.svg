<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" role="img"><title>地球と日食・月食</title><rect width="640" height="640" rx="24" fill="#101d35"/><g font-family="Yu Gothic,sans-serif" text-anchor="middle" fill="#f3f6ff"><text x="320" y="55" font-size="38" font-weight="bold">地球</text><text x="320" y="98" font-size="26">日食と月食で、役割を比べよう</text><rect x="20" y="130" width="600" height="185" rx="14" fill="#1b2c47"/><text x="65" y="162" font-size="24">日食</text><circle cx="130" cy="205" r="22" fill="#ffd56a"/><text x="130" y="255" font-size="27">太陽</text><text x="130" y="287" font-size="23">光を出す</text><circle cx="320" cy="205" r="22" fill="#cbd3df"/><text x="320" y="255" font-size="27">月</text><text x="320" y="287" font-size="23">光を遮る</text><rect x="427" y="172" width="166" height="132" rx="12" fill="none" stroke="#f4ca64" stroke-width="4"/><circle cx="510" cy="205" r="22" fill="#72b5e5"/><text x="510" y="255" font-size="27">地球</text><text x="510" y="287" font-size="23">影を受ける</text><path d="M162 205H278l-12 -7m12 7l-12 7" stroke="#f4ca64" stroke-width="3" fill="none"/><rect x="20" y="330" width="600" height="185" rx="14" fill="#1b2c47"/><text x="65" y="362" font-size="24">月食</text><circle cx="130" cy="405" r="22" fill="#ffd56a"/><text x="130" y="455" font-size="27">太陽</text><text x="130" y="487" font-size="23">光を出す</text><rect x="237" y="372" width="166" height="132" rx="12" fill="none" stroke="#f4ca64" stroke-width="4"/><circle cx="320" cy="405" r="22" fill="#72b5e5"/><text x="320" y="455" font-size="27">地球</text><text x="320" y="487" font-size="23">光を遮る</text><circle cx="510" cy="405" r="22" fill="#cbd3df"/><text x="510" y="455" font-size="27">月</text><text x="510" y="487" font-size="23">影を受ける</text><path d="M162 405H278l-12 -7m12 7l-12 7" stroke="#f4ca64" stroke-width="3" fill="none"/><text x="320" y="554" font-size="23">月の軌道は傾いているので、</text><text x="320" y="586" font-size="23">毎月起こるわけではない。</text><text x="320" y="622" font-size="18" fill="#b9c9df">位置と役割の模式図。大きさ・距離は縮尺ではない。</text></g></svg>
