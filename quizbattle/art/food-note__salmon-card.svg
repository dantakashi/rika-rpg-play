<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="さけの食品群と対象の比較"><rect width="480" height="480" rx="24" fill="#faf6eb"/><g font-family="Yu Gothic, Meiryo, sans-serif" fill="#283d38"><text x="24" y="43" font-size="29" font-weight="bold">さけ</text><text x="24" y="76" font-size="20">1群：魚・肉・卵・豆</text><path d="M132 194Q188 116 320 124L346 182Q248 179 177 246Z" fill="#e99b79" stroke="#9f6854" stroke-width="5"/><path d="M177 246Q248 179 346 182l-3 20Q252 199 188 260Z" fill="#718578" stroke="#53695f" stroke-width="4"/><path d="M169 161l33 57M211 142l31 46M256 130l25 43M301 126l19 43" stroke="#f9dbc1" stroke-width="7"/><rect x="22" y="280" width="436" height="134" rx="16" fill="#e6eee3"/><text x="40" y="313" font-size="22" font-weight="bold">魚の切り身を食べる</text><text x="40" y="349" font-size="20">骨ごと食べる小魚の例とは別。</text><text x="40" y="386" font-size="18">煮干しも魚。でも2群。</text><text x="24" y="450" font-size="17">形・大きさは模式図。食べる対象はこの例。</text></g></svg>
