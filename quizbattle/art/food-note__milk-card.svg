<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="牛乳の食品群と製法"><rect width="480" height="480" rx="24" fill="#faf6eb"/><g font-family="Yu Gothic, Meiryo, sans-serif" fill="#283d38"><text x="24" y="43" font-size="29" font-weight="bold">牛乳</text><text x="24" y="76" font-size="20">2群：乳・小魚・海藻</text><path d="M178 100h124l-12 145h-100z" fill="#fdfdf5" stroke="#789d9e" stroke-width="5"/><ellipse cx="240" cy="100" rx="62" ry="13" fill="#fff" stroke="#789d9e" stroke-width="5"/><path d="M190 140h100" stroke="#c8dddd" stroke-width="3"/><rect x="22" y="280" width="436" height="134" rx="16" fill="#e6eee3"/><text x="40" y="313" font-size="23" font-weight="bold">牛乳そのもの</text><text x="40" y="349" font-size="20">この札は、何も混ぜない牛乳。</text><text x="40" y="386" font-size="18">バターも乳由来。でも6群。</text><text x="24" y="450" font-size="17">形・大きさは模式図。材料・製法はこの例。</text></g></svg>
