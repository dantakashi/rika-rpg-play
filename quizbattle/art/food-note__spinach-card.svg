<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="ほうれんそうの分類と食べる部分"><rect width="480" height="480" rx="24" fill="#faf6eb"/><g font-family="Yu Gothic, Meiryo, sans-serif" fill="#283d38"><text x="24" y="43" font-size="29" font-weight="bold">ほうれんそう</text><text x="24" y="76" font-size="20">3群：緑黄色野菜</text><g stroke="#42784a" stroke-width="8" fill="none"><path d="M220 258L171 148M235 258L235 126M250 258L299 155"/></g><g fill="#417c4d" stroke="#285e39" stroke-width="4"><path d="M178 192Q113 172 142 109Q198 126 178 192Z"/><path d="M234 191Q186 148 234 99Q283 148 234 191Z"/><path d="M284 198Q267 125 328 120Q345 179 284 198Z"/></g><path d="M179 188l-25-57M234 185v-64M287 190l28-48" stroke="#8caf64" stroke-width="3" fill="none"/><rect x="22" y="280" width="436" height="134" rx="16" fill="#e6eee3"/><text x="40" y="313" font-size="23" font-weight="bold">葉や葉柄を食べる</text><text x="40" y="349" font-size="20">葉柄は葉と茎をつなぐ部分。</text><text x="40" y="386" font-size="18">キャベツは4群。同じ葉でも違う。</text><text x="24" y="450" font-size="17">形・大きさは模式図。食べる対象はこの例。</text></g></svg>
