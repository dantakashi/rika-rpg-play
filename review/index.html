<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>画像ティンダー検収</title>
<style>
  :root{--ok:#5b8a72;--ng:#c0564a;--fix:#4a6fb5}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;font-family:"Hiragino Maru Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:#2b2622;color:#f4ede2}
  .top{position:fixed;top:0;left:0;right:0;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;z-index:10;background:linear-gradient(#2b2622,#2b262200)}
  .top b{font-size:15px}
  #prog{font-weight:700;font-size:14px;color:#d8c9a8}
  .stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:64px 12px 130px}
  .card{position:absolute;width:min(92vw,540px);max-height:calc(100% - 190px);aspect-ratio:1/1;border-radius:20px;background:repeating-conic-gradient(#3a332d 0 25%,#453c34 0 50%) 0 0/28px 28px;box-shadow:0 10px 40px #000a;touch-action:none;user-select:none;overflow:hidden;transition:transform .25s,opacity .25s}
  .card.drag{transition:none}
  .card img{width:100%;height:100%;object-fit:contain;pointer-events:none}
  .card .label{position:absolute;left:0;right:0;bottom:0;padding:8px 12px;background:#000a;font-size:13px}
  .stamp{position:absolute;top:18px;font-size:30px;font-weight:900;padding:4px 14px;border:4px solid;border-radius:12px;opacity:0;transform:rotate(-12deg);pointer-events:none}
  .stamp.ok{left:14px;color:var(--ok);border-color:var(--ok)}
  .stamp.ng{right:14px;color:var(--ng);border-color:var(--ng);transform:rotate(12deg)}
  .bar{position:fixed;bottom:0;left:0;right:0;padding:12px 14px 22px;display:flex;gap:10px;z-index:10;background:linear-gradient(#2b262200,#2b2622 40%)}
  .bar button{flex:1;font:inherit;font-weight:800;font-size:15px;padding:14px 0;border-radius:14px;border:none;cursor:pointer;color:#fff}
  .b-ng{background:var(--ng)}.b-fix{background:var(--fix)}.b-ok{background:var(--ok)}.b-undo{background:#6b6259;flex:.6}
  .hint{position:fixed;bottom:92px;left:0;right:0;text-align:center;font-size:12px;color:#b7a98d;z-index:9}
  .overlay{position:fixed;inset:0;background:#000c;z-index:20;display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.on{display:flex}
  .panel{background:#f6f1e7;color:#3c302c;border-radius:16px;padding:16px;width:min(92vw,480px)}
  .panel textarea{width:100%;min-height:90px;font:inherit;font-size:14px;border:1px solid #d9c5ab;border-radius:10px;padding:8px}
  .panel .row{display:flex;gap:10px;margin-top:10px}
  .panel button{flex:1;font:inherit;font-weight:700;padding:12px 0;border-radius:12px;border:none;color:#fff;cursor:pointer}
  .done{position:fixed;inset:0;z-index:15;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:20px;text-align:center}
  .done.on{display:flex}
  .done .counts{font-size:16px;line-height:2}
  .done button{font:inherit;font-weight:800;font-size:16px;padding:14px 26px;border-radius:14px;border:none;background:var(--fix);color:#fff;cursor:pointer}
  .done textarea{width:min(92vw,520px);min-height:110px;font-size:12px;border-radius:10px;border:none;padding:8px;display:none}
</style>
</head>
<body>
<div class="top"><b id="title">画像ティンダー検収</b><span id="prog"></span></div>
<div class="stage" id="stage"></div>
<div class="hint">→スワイプ=採用　←スワイプ=不採用　ダブルタップ=✏修正コメント</div>
<div class="bar">
  <button class="b-undo" onclick="undo()">↩</button>
  <button class="b-ng" onclick="decide('NG')">✗ 不採用</button>
  <button class="b-fix" onclick="openFix()">✏ 修正</button>
  <button class="b-ok" onclick="decide('OK')">◎ 採用</button>
</div>
<div class="overlay" id="ov">
  <div class="panel">
    <b>✏ 修正コメント</b>（どう直してほしいか）
    <textarea id="fixnote" placeholder="例: もっと赤く／目を大きく／向きを右に"></textarea>
    <div class="row">
      <button style="background:#9aa2ab" onclick="closeFix()">やめる</button>
      <button style="background:var(--fix)" onclick="saveFix()">修正として記録</button>
    </div>
  </div>
</div>
<div class="done" id="done">
  <h2>完了！</h2>
  <div class="counts" id="counts"></div>
  <button onclick="copyResult(this)">📋 結果をコピー（チャットに貼り付け）</button>
  <textarea id="dump" readonly onclick="this.select()"></textarea>
</div>
<script>
// ===== バッチ定義（ここだけ差し替えれば使い回せる） =====
const SHEET = "敵画風見本スライム6体";       // シート名（保存キーにも使う）
const IMGDIR = "imgs/";                      // 画像フォルダ（このhtmlからの相対）
const ITEMS = [
  {f:"style_a_seisai.png",      t:"a: 精細ゲームCG"},
  {f:"style_b_anime.png",       t:"b: アニメ塗り・セルシェード"},
  {f:"style_c_chibi.png",       t:"c: ちびかわデフォルメ"},
  {f:"style_d_dark.png",        t:"d: ダーク油彩"},
  {f:"style_e_ehon.png",        t:"e: 水彩絵本風"},
  {f:"style_f_transparent.png", t:"f: 透過テスト（アニメ塗り・背景透明）"},
];
// =======================================================
const KEY="tinder_"+SHEET;
let st=JSON.parse(localStorage.getItem(KEY)||"{}");
let idx=Object.keys(st).filter(k=>!k.startsWith("_")).length ? nextUndone() : 0;
let history=[];
document.getElementById("title").textContent=SHEET;
function nextUndone(){for(let i=0;i<ITEMS.length;i++){if(!st[ITEMS[i].f])return i;}return ITEMS.length;}
function save(){localStorage.setItem(KEY,JSON.stringify(st));}
const stage=document.getElementById("stage");
let card=null,sx=0,sy=0,dx=0,dragging=false,lastTap=0;
function render(){
  stage.innerHTML="";
  document.getElementById("prog").textContent=Math.min(idx,ITEMS.length)+" / "+ITEMS.length;
  if(idx>=ITEMS.length){finish();return;}
  document.getElementById("done").classList.remove("on");
  const it=ITEMS[idx];
  card=document.createElement("div");card.className="card";
  card.innerHTML='<img src="'+IMGDIR+it.f+'" draggable="false">'+
    '<div class="stamp ok">採用</div><div class="stamp ng">不採用</div>'+
    '<div class="label">'+(idx+1)+"体目: "+it.t+"</div>";
  stage.appendChild(card);
  card.addEventListener("pointerdown",pd);
  card.addEventListener("pointermove",pm);
  card.addEventListener("pointerup",pu);
  card.addEventListener("pointercancel",pu);
}
function pd(e){
  const now=Date.now();
  if(now-lastTap<300){lastTap=0;openFix();return;}
  lastTap=now;
  dragging=true;sx=e.clientX;sy=e.clientY;dx=0;card.classList.add("drag");
  card.setPointerCapture(e.pointerId);
}
function pm(e){
  if(!dragging)return;
  dx=e.clientX-sx;const dy=e.clientY-sy;
  card.style.transform="translate("+dx+"px,"+(dy*0.3)+"px) rotate("+(dx/18)+"deg)";
  card.querySelector(".stamp.ok").style.opacity=dx>40?Math.min((dx-40)/80,1):0;
  card.querySelector(".stamp.ng").style.opacity=dx<-40?Math.min((-dx-40)/80,1):0;
}
function pu(){
  if(!dragging)return;dragging=false;card.classList.remove("drag");
  if(dx>90){decide("OK");}
  else if(dx<-90){decide("NG");}
  else{card.style.transform="";card.querySelectorAll(".stamp").forEach(s=>s.style.opacity=0);}
}
function decide(v,note){
  if(idx>=ITEMS.length)return;
  const it=ITEMS[idx];
  st[it.f]={v:v,t:it.t};if(note)st[it.f].note=note;
  history.push(it.f);save();
  if(card){card.style.transform="translate("+(v==="OK"?1:(v==="NG"?-1:0))*window.innerWidth+"px,-40px) rotate("+(v==="OK"?20:-20)+"deg)";card.style.opacity=0;}
  idx++;setTimeout(render,180);
}
function undo(){
  if(!history.length)return;
  const f=history.pop();delete st[f];save();
  idx=ITEMS.findIndex(it=>it.f===f);render();
}
function openFix(){if(idx>=ITEMS.length)return;document.getElementById("fixnote").value=(st[ITEMS[idx].f]&&st[ITEMS[idx].f].note)||"";document.getElementById("ov").classList.add("on");}
function closeFix(){document.getElementById("ov").classList.remove("on");}
function saveFix(){const n=document.getElementById("fixnote").value.trim();closeFix();decide("FIX",n||"(コメントなし)");}
function finish(){
  const c={OK:0,NG:0,FIX:0};Object.keys(st).forEach(k=>{if(!k.startsWith("_"))c[st[k].v]=(c[st[k].v]||0)+1;});
  document.getElementById("counts").innerHTML="◎採用 "+(c.OK||0)+"　✗不採用 "+(c.NG||0)+"　✏修正 "+(c.FIX||0);
  document.getElementById("done").classList.add("on");
}
function copyResult(btn){
  const out={sheet:SHEET,answers:st};const txt=JSON.stringify(out,null,1);
  const dump=document.getElementById("dump");dump.style.display="block";dump.value=txt;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>{btn.textContent="コピーしました ✓";},()=>{btn.textContent="下の欄を長押しでコピー";});
  }else{btn.textContent="下の欄を長押しでコピー";}
}
render();
</script>
</body>
</html>
