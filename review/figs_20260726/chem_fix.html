AAA"}, {"id": "chem_x_funnel_setup_dist", "name": "ろうと台とろうと.png", "label": "ろうと台にろうとをのせろ過する組み立ての図", "subject": "化学", "grade": "中1", "genre": "実験操作", "layer": "文字なし", "note": "先生の指摘「ろうとの先端が壁面についていない。ろうとの先端が歪に曲がっている。」→ 直しました。", "prompt": "内容:「ろうと台にろうとをのせて、ろ過の準備をした組み立て」中学1年の理科教材図。\n構成: ろうと台は、厚い長方形の平らな台板の上に垂直な金属の支柱が1本立ち、その途中に水平な長方形の棚板がついた形。棚板には丸い穴が2つあいている。手前の穴にガラスのろうと（円すい形の胴＋細長いあし）をのせ、おくの穴は空にする。ろうとの中には、四つ折りにして開いた円すい形のろ紙をぴったり入れる。ろうとのあしは棚板の下へ長くのび、その真下、台板の上にビーカーを1つ置く。あしのとがった先はビーカーの内側のかべに触れる。\n形状: 支柱に輪をつけた台にはしない。必ず穴のあいた水平な棚板の形にする。\n接触: ろうとは棚板の穴にはまり、ろ紙はろうとの内面に密着し、あしの先はビーカーのかべに接する。\n画風: 白背景・実物風の教材イラスト。\nあとで部分ごとにタッチさせるので、各部分が見分けられるように。図の中に文字は入れない。\n★今回の直し:\n**ろうとの足（細い管）の先を、受けるビーカーの内側のかべにぴったり接触させる**（前の版は離れていた）。\n足はまっすぐな細い管にする（前の版はゆがんで曲がっていた）。足の先を斜めに切った形にし、その斜めの面をかべに沿わせる。\n★器具の鉄則（必ず守る）:\n・**ガラスを突き抜けさせない**。ガラス管・ガラス棒・線香・温度計は、必ず器具の「口」から中へ入れる。試験管のかべ・ガラス板・フラスコの胴を貫いて刺さった形にしない。\n・**液を導く先は内壁に接触させる**。ろうとの足の先、液を伝わらせるガラス棒、注ぎ口は、受けるビーカーの**内側のかべにぴったりつける**（浮かせない）。\n・器具は実物の形のまま描く。ゆがんだ板・折れ曲がった管・脚の欠けた台にしない。", "img": "data:image/webp;base64,UklGRvwbAABXRUJQVlA4IPAbAACwwwCdASr4ATACPpVKoEylpColoXH58UASiWlu9KY90cy+P/nwAgWADn9+X/P/prUmumY3uOsk9P5t2S6vTD/9B4M9mn+/8E/kcoyc+KBf0PziJyv4qzZHlf9zzG/s3/H4D3o7i8nl2y6K8xh7dyf2L8UVn7SOOtg60MPbuVoYe3crQw9u5WBQuDcPPO7LorzGHt3K0MPbuVoYU/jCt48u2XRXmMPbuVoYe3coTrVPh57ZUV5jD27laGHt3K0MPEKx3RUJ8xoJ5dsuivMYXwUFAY3NCnjDMVX1vq9Dq1nF7/QfiYyorzGHt3J0Ejfe7sIHP5xSlPmCc/zN6oa5qmIPytDD2kBnRCLAEFM6XaLMEYrwky4Yu+9YscR6NHfv6RBZ4nyQBBLHjaQvmht26UUI0e3crQw9u5OMTiwBX4o3XFvyXKp1eEIWlEpk3ylIBCPB0Ejb3BD/TUP1X3ShprXqWuHt3K0MPbt6nCzqwkdmShkJ1aKDJ+bglLqLgkKYVNZi4/FmMYe3crQw9uf89+KmpLxa1p3YKL0vWpLRRAidzuop+cw6vMYe3crFFkpz2OqPQJ0FhqyoF57hGni3+XCLuZGn6TL8eeVCmwmnvC/1XgT/RNpWHofPzUzwClJdbPZDmVywQiRhaYE8u2XRXmHMkpGYjOpN8EiaBVl3hh5vozrqGbVS5SmDNirqz2OtgRwn419Wh5X7TVpZtn1JBlTeF07RUF4gfUIHcnnO+OTJIhB8USeJE8u2XRXmMJsQ627LiIyNr8QZRXxpMlZV5RUXzHkq4K4U4ec2H9ek3+76e/gfHXkg4RZScc2t4ETHDWhz0d+A893drMEkggmjYDorzGHt3Kz6Og6uzO92yGY6epcbp44K7NIajMCGrB0lyzyjSRSsVKxz8+DrOMrZDOJ79q4lUyvQwpiD8rQw9u5y/yF+sATUQMg ＋縦の筒＋下部の2つの調節ねじ、横から出るゴム管）を置く。青い炎がのび、その先が金網の中央のセラミックに届く。\n形状: 金網の中央は白いセラミック。石綿は使わない。\n接触: 金網は三脚の輪の上にのり、ビーカーの底は金網に接し、炎の先は金網に触れる。すきまを空けない。\n画風: 白背景・実物風の教材イラスト。金属は薄い灰色、水は薄い水色、炎は青。\nあとで部分ごとにタッチさせるので、各部分が見分けられるように。図の中に文字は入れない。\n★今回の直し:\n**三脚の脚は必ず3本すべて描く**（前の版は1本消えていた）。手前2本・奥1本が見えるように、少し斜め上から見た角度にする。\nガスバーナーは、下から順に「平たい円盤の台座／細い円筒の胴／同じ形のぎざぎざしたリング2つ／上へすぼまる円すい／細い筒」の形にする（前の版は形がくずれていた）。\n★器具の鉄則（必ず守る）:\n・**ガラスを突き抜けさせない**。ガラス管・ガラス棒・線香・温度計は、必ず器具の「口」から中へ入れる。試験管のかべ・ガラス板・フラスコの胴を貫いて刺さった形にしない。\n・**液を導く先は内壁に接触させる**。ろうとの足の先、液を伝わらせるガラス棒、注ぎ口は、受けるビーカーの**内側のかべにぴったりつける**（浮かせない）。\n・器具は実物の形のまま描く。ゆがんだ板・折れ曲がった管・脚の欠けた台にしない。", "img": "data:image/webp;base64,UklGRvwpAABXRUJQVlA4IPApAADQ4gCdASrwATACPpVGn0ylo6KoIbhp6QASiWlu4XIjBrS3f+Y0N1puVO6zKuR3sP43+Yr67+8e1l+Z5Z+z/Ug8C/R/pv4H/PfUmuWdyNaf0F/fL7n50X2fm59kvYD/WXxzvHU+/f8z9nfgC/oP+Z9Hv/w+9T30/X3/u9xr9tetZ6P37oDCU0w/LqBGmH5dQI0w/LqBGmH5dPO1hRwqnLXfP587YVlYrBarVd5YQ9VIw/t41Yg6ZP2XpLtl1AjTD8ZUrA0avRv39NxUoWjs9vuj0MzfgPSQjcodvJrtfWf///49A8i7KaYfl1AjTD8YdU0vckgWk4gEQoC94E9JKjv4GH5dQI0w/LqBGfIuwyPHF3pDFII9lNMPy6gRph+XQkHo+6f/g4k4ZcdUeht1YKtxiM1hPlKPdqZf2nIs217ZakJwxYcqgRph+XUCNMPepFHVLy91/mB3JU1C+L3UEz/l9YYWPM7Wiuy8zf5jgHZ2xI/FM1e+t4jey9JdsuoEaYfDu6VGtP89u9njFG9l6S7ZdQI0w+Hi0geiz63z4VDqbIdlNMPy6gRph7gEH+BKt0JAajyozQTEH5eku2XUBPVmEGYZUICRHtoABqs0/EUrLJnTdhqRECXc0ANM/vXNsluX6S7ZdQI0w98jcBB6KvzY7wAS/qL2qkQIahLlaBrASuD5ivqW/Wt4rrSaw7avXh6hIzPA1nj3fPm85pG7MUYW2ZhcnObV5oTRn3BXI3QQJTG1zS3OekaYfl1AjOkss1mz/yAKAfv1wL2cOsBFsqCI6843NItYifBrcMi4mxWSG5TnWkV1HRgfPGGCkeS88v9pRlL63OzdbR2F1D7zXCFID1JKPJrX/zq+YigWkvSXbLqBGeHADzukBBA12kixwHcmrZraYLZnXdMghP9Kc4yfIYebv/b0YACNOzYKlsbz8eOpiH6BHZpMCQ0E7BGT/k9gZbx2eHNPwAr8DKgfuINDlEnw720Cv4nF37oNhhdx0ECNMPy6GAG52HQhNPfATGjYOJ5lx1A8uSLZWfHfmalw5ZMxurBvmSCYS4z5PxVK/L2/+NwhueokZOBh2zFg+ULJr2aQpCf8eyCk1K32Io/DX3wnneAQ0etwdYISpNMnKaYfl1AjOt2UpLSgeAh45gz/wrlOiZ/UH2Di8kePKHhjlYecVUPq21Glz4aj3nuqrFPuVIidJiKn537fGIg/PGiRaK621vQb1fxbPjY1QI0w/LqBGdjxDZb7EqhfY1SCkHtUo8q07T1JCCgkqKcjx3/uH+m0/simIPy9JdstKr820i6VDPURu9kH3CuXx7BJIY1wR+ceQMkXlfznJcQI te": "先生の指摘「棒がガラス板を貫いている。図はぱっと見良い。」→ 直しました。", "prompt": "内容:「集気びんの中で物質を燃やす実験」中学1年の理科教材図。\n構成: 広口で円筒形の集気びんを1つ、机の上にまっすぐ立てる。びんの口は外に少し張り出したリムがある。底には少量の水が浅くたまる。びんの中に、細い金属の柄のついた燃えさじを上から入れ、さじにのせた物質が明るいオレンジ色の炎を上げて燃える。びんの口には丸く平らなガラスのふたを1枚、少しずらしてのせ、燃えさじの柄が通るすきまをつくる。燃えさじ1本・ふた1枚だけ。\n接触: 燃えさじはびんの中ほどまで入り、ふたはびんの口に触れてのっていること。\n画風: 白背景・実物風の教材イラスト。ガラスは薄い灰色の透明感、水は薄い水色。\nあとで部分ごとにタッチさせるので、各部分が見分けられるように。図の中に文字は入れない。\n★今回の直し:\n燃焼さじの棒が**ガラス板（ふた）を突き抜けている**のが誤り。\nふたは**取っ手のない平らな円いガラス板**のまま、**少しずらして口にすき間をあけ、そのすき間から燃焼さじを入れる**形にする。\n板に穴をあけない・棒を板に刺さない。\n★器具の鉄則（必ず守る）:\n・**ガラスを突き抜けさせない**。ガラス管・ガラス棒・線香・温度計は、必ず器具の「口」から中へ入れる。試験管のかべ・ガラス板・フラスコの胴を貫いて刺さった形にしない。\n・**液を導く先は内壁に接触させる**。ろうとの足の先、液を伝わらせるガラス棒、注ぎ口は、受けるビーカーの**内側のかべにぴったりつける**（浮かせない）。\n・器具は実物の形のまま描く。ゆがんだ板・折れ曲がった管・脚の欠けた台にしない。", "img": "data:image/webp;base64,UklGRrgVAABXRUJQVlA4IKwVAABQoQCdASp1ATACPpVIn0ylpCMrInJZkWASiWlu+vP1eyBp9/nyoS+Yt/dPTPiwoEeUKm1mZ0chdmJL5PYbrVMLfy2567kZnvsPGrTqv1po0+xdFJ/v+f01rHIi5w5EXCFZgWmRc4ciLnDkRc4cdpHrp9HDms+cORFzhyIo7wktnZFzhyIucORFzg3cJg1xFzhyIucORFzhuC8So4ijWORFzhyIucNw1q9yUoCL8Y/HLY94TF81kr5m+/aNGCruBi3aOzpTcxei60cL39ni/Jm87hniJ31klqsqvIQgrzfBlZ3JpZ8M4Sc4oZc44OTmP2eLftJltg46GxBf2YJ1dlJlmp+e1G2FKArvbimQCMdN7ui2/CG8F+aLikXTU6PbwusF7B97m9lNyvxj8cOzcKUlzb4jxEnJom7R44cx3JmBR4tQr7LOJ58D+VCNxdwvD0e5v6SYmYC3VoLgkb8Jfr1dcpl0Xo/aPrqBV29DNIHlKi/R8HBZUPBmtaNBpOhv5+EZr4mKE99JAaweztCb9Mqa2Ze42KnALL7CDZftzhmO7x2djuknfj504TzJ2FmtOY/Z4uyPWDLt6SKnXOCI0U4N3BVgGN15snSloj2pmlatORFzg1TYftZlKeB5UXqsQcfOR86Dx1eLN+V6o/kSvPpMO75w48Rd1BmQnh5aU7xPlJ2sSJJ7lHylRfh2X2gHTRCy2VhRgSwrHHW8zFPytkXOHBTb6alJOuBv0sk/pzvQF4Qfs8X761KKvzVsQmL7yiBkwY9hdIxTQ9X4x+ywzbhaRKe5xq8I+t11NPSy/qmDmPU+IEiz4SP2eJXHe4HLFU/pzilBxSMt8U2cnLZ7iKSX3MFjkRc47H/AdUj/jIyIdacS/Jf6FgglmK3dzDkRc1yLyq4p9WDgwVXyQLXvOb8lSiHjAvZhtQkbjznycyV7qXs+cORFw4duSYRw+K12EXhkkZhCZdVDAA2105KLdV91cUAs4V1z7fQc2I9Hhknv8glROKerq/GP2KPFjTuUY2/1/vcJCXkzSspayyN7zoyQ0HEvOHqpRTpgPQQIvxjtNJj4FSfQ2qabYb/5q76MHkn8pUX4bgzgPSceOvQZucQaf9THIi5waPEdUjGr3xuZqZu3Sf3Ijh0D1b0lfgAhm+ytLrrG3NYciLnBvLQ3KowGO+xUEr5jRWe5lwkFU const KEY = "figs_grid_chem_fix1";
let marks = {}, cmts = {};
try{const s=JSON.parse(localStorage.getItem(KEY)||"{}");marks=s.marks||{};cmts=s.cmts||{}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({marks:marks,cmts:cmts}))}catch(e){}}
function mark(id,m){marks[id]=marks[id]===m?"":m;save();render()}
function setc(id,v){cmts[id]=v;save();stat()}
function allOk(){CARDS.forEach(c=>{if(!marks[c.id])marks[c.id]="ok"});save();render()}
function zoom(s){document.getElementById("zoomimg").src=s;document.getElementById("zoom").style.display="flex"}
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function render(){
  const gs=[...new Set(CARDS.map(c=>c.subject+" "+c.grade+" "+c.genre))];
  document.getElementById("host").innerHTML=gs.map(g=>`
   <div class="grp">${esc(g)}</div>
   <div class="grid">${CARDS.filter(c=>c.subject+" "+c.grade+" "+c.genre===g).map(c=>`
    <div class="card ${marks[c.id]==='ok'?'ok':marks[c.id]==='ng'?'ng':''}">
      <img src="${c.img}" alt="${c.id}" onclick="zoom(this.src)">
      <div class="name">${esc(c.name)}<span class="tag">${esc(c.layer)}</span></div>
      <div class="desc">${esc(c.label)}</div>
      ${c.note?`<div class="cn">🔎 ${esc(c.note)}</div>`:""}
      <details><summary>発注文</summary><pre>${esc(c.prompt)}</pre></details>
      <div class="btns">
        <button class="${marks[c.id]==='ok'?'on-ok':''}" onclick="mark('${c.id}','ok')">◎</button>
        <button class="${marks[c.id]==='ng'?'on-ng':''}" onclick="mark('${c.id}','ng')">✕</button>
      </div>
      <input class="cmt" placeholder="✏ 気になる所" value="${esc(cmts[c.id]||'')}" oninput="setc('${c.id}',this.value)">
    </div>`).join("")}</div>`).join("");
  stat();
}
function stat(){
  const v=Object.values(marks);
  document.getElementById("stat").textContent=
    `◎${v.filter(x=>x==="ok").length} ✕${v.filter(x=>x==="ng").length} / ${CARDS.length}`;
  document.getElementById("out").value=text();
}
function text(){
  const L=["理科図版 検収結果 (化学の直し 17枚)"];
  CARDS.forEach(c=>{const m=marks[c.id]==="ok"?"◎":marks[c.id]==="ng"?"✕":"—";
    if(m==="✕"||cmts[c.id]) L.push(`${m} ${c.name} [${c.id}]`+(cmts[c.id]?`  ✏${cmts[c.id]}`:""));});
  const ok=CARDS.filter(c=>marks[c.id]==="ok").length, ng=CARDS.filter(c=>marks[c.id]==="ng").length;
  L.push(`（◎は省略。合計 ◎${ok} ✕${ng} 未${CARDS.length-ok-ng}）`);
  return L.join("\n");
}
function copyOut(){
  const t=text(),ta=document.getElementById("out");ta.value=t;
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(t).then(()=>alert("コピーしました。Claudeに貼ってください。"),
      ()=>{ta.select();try{document.execCommand("copy")}catch(e){};alert("コピーしました。")});
  }else{ta.removeAttribute("readonly");ta.select();ta.setSelectionRange(0,99999);
    let d=false;try{d=document.execCommand("copy")}catch(e){}
    ta.setAttribute("readonly","");alert(d?"コピーしました。":"下の枠を長押し→コピーしてください。")}
}
render();
</script></body></html>
