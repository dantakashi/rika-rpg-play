<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>コードで作図（自走ぶん）</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:"Yu Gothic UI","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;background:#F5F7FB;color:#3C3C3C;
  margin:0;padding:16px;font-weight:600;line-height:1.7}
h1{font-size:19px;margin:0 0 4px}
.note{font-size:14px;color:#5C5C5C;margin:0 0 12px}
.bar{position:sticky;top:0;background:#F5F7FB;padding:12px 0;z-index:9;border-bottom:2px solid #E5E5E5;margin-bottom:16px}
.bar button{border:none;background:#2C5CD6;color:#fff;border-radius:99px;padding:13px 22px;font-weight:800;
  font-size:16px;cursor:pointer;min-height:50px}
.bar button.ghost{background:#fff;color:#2C5CD6;border:2px solid #2C5CD6;margin-left:8px}
#stat{font-weight:800;margin-left:12px;font-size:15px}
.grp{font-size:16px;font-weight:800;margin:22px 0 8px;padding-left:8px;border-left:6px solid #3E7BFA}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:#fff;border:2px solid #E5E5E5;border-radius:16px;padding:12px}
.card.ok{border-color:#3E7BFA;background:#F4F8FF}
.card.ng{border-color:#CFCFCF;opacity:.5}
.card img{width:100%;display:block;border-radius:10px;cursor:zoom-in;background:#fff;border:1px solid #EEE}
.name{font-size:14px;font-weight:800;margin:8px 0 2px}
.meta{font-size:11px;color:#6E6E6E}
.tag{font-size:11px;background:#FFF2E0;color:#8A5A12;border-radius:99px;padding:2px 8px;margin-left:4px}
.desc{font-size:12px;color:#5C5C5C;margin:4px 0 0;min-height:32px}
.cn{margin:6px 0 0;background:#FFF6E5;border:1px solid #F0D9A8;border-radius:9px;padding:7px 9px;font-size:12px;color:#6B4E14}
details{font-size:12px;color:#5C5C5C;margin-top:6px}
details pre{white-space:pre-wrap;background:#FAFAFA;border:1px solid #EEE;border-radius:8px;padding:8px;font-size:11px}
.btns{display:flex;gap:8px;margin-top:8px}
.btns button{flex:1;border:2px solid #E5E5E5;background:#fff;border-radius:12px;padding:10px;min-height:48px;
  font-weight:800;cursor:pointer;font-size:14px;color:#5C5C5C}
.btns button.on-ok{background:#2C5CD6;border-color:#2C5CD6;color:#fff}
.btns button.on-ng{background:#EFEFEF;border-color:#CFCFCF;color:#3C3C3C}
.cmt{width:100%;margin-top:7px;border:2px solid #E5E5E5;border-radius:10px;padding:9px;font-size:14px;
  font-family:inherit;font-weight:600}
#outwrap{margin:22px 0 40px;background:#fff;border:2px solid #E5E5E5;border-radius:16px;padding:16px}
#out{width:100%;min-height:120px;font-family:ui-monospace,Consolas,monospace;font-size:12px;
  border:2px solid #E5E5E5;border-radius:10px;padding:10px;resize:vertical}
#zoom{position:fixed;inset:0;background:#000C;display:none;align-items:center;justify-content:center;z-index:99;
  cursor:zoom-out;padding:10px}
#zoom img{max-width:100%;max-height:100%;background:#fff;border-radius:8px}
</style></head><body>
<h1>🔬 コードで作図（自走ぶん）</h1>
<p class="note">教科書（東京書籍『新しい科学』）を読んでから発注文を書き直し、別のAIが教科書と突き合わせて検証したものです（全36枚）。<br>
見るところ＝<b>①理科として正しいか ②中学生に分かるか ③文字が要るのに無い／要らないのに有る</b>。<b>画像をクリックすると大きく見られます。</b><br>
気になる所は✏に一言。<b>全部に◎をつける必要はありません</b>——✕がついたものだけ作り直します。</p>
<div class="bar"><button onclick="copyOut()">📋 結果をコピー</button>
<button class="ghost" onclick="allOk()">残り全部に◎</button><span id="stat"></span></div>

<div id="outwrap"><p class="note">ボタンでコピーできなければ、この枠を長押し→全選択→コピーでも大丈夫です。</p>

const KEY = "figs_grid_selfrun1";
let marks = {}, cmts = {};
try{const s=JSON.parse(localStorage.getItem(KEY)||"{}");marks=s.marks||{};cmts=s.cmts||{}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({marks:marks,cmts:cmts}))}catch(e){}}
function mark(id,m){marks[id]=marks[id]===m?"":m;save();render()}
function setc(id,v){cmts[id]=v;save();stat()}
function allOk(){CARDS.forEach(c=>{if(!marks[c.id])marks[c.id]="ok"});save();render()}
function zoom(s){document.getElementById("zoomimg").src=s;document.getElementById("zoom").style.display="flex"}
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function render(){
  const gs=[...new Set(CARDS.map(c=>c.subject+" "+c.grade+" "+c.genre))];
  document.getElementById("host").innerHTML=gs.map(g=>`
   <div class="grp">${esc(g)}</div>
   <div class="grid">${CARDS.filter(c=>c.subject+" "+c.grade+" "+c.genre===g).map(c=>`
    <div class="card ${marks[c.id]==='ok'?'ok':marks[c.id]==='ng'?'ng':''}">
      <img src="${c.img}" alt="${c.id}" onclick="zoom(this.src)">
      <div class="name">${esc(c.name)}<span class="tag">${esc(c.layer)}</span></div>
      <div class="desc">${esc(c.label)}</div>
      ${c.note?`<div class="cn">🔎 ${esc(c.note)}</div>`:""}
      <details><summary>発注文</summary><pre>${esc(c.prompt)}</pre></details>
      <div class="btns">
        <button class="${marks[c.id]==='ok'?'on-ok':''}" onclick="mark('${c.id}','ok')">◎</button>
        <button class="${marks[c.id]==='ng'?'on-ng':''}" onclick="mark('${c.id}','ng')">✕</button>
      </div>
      <input class="cmt" placeholder="✏ 気になる所" value="${esc(cmts[c.id]||'')}" oninput="setc('${c.id}',this.value)">
    </div>`).join("")}</div>`).join("");
  stat();
}
function stat(){
  const v=Object.values(marks);
  document.getElementById("stat").textContent=
    `◎${v.filter(x=>x==="ok").length} ✕${v.filter(x=>x==="ng").length} / ${CARDS.length}`;
  document.getElementById("out").value=text();
}
function text(){
  const L=["理科図版 検収結果 (コードで作図（自走ぶん）)"];
  CARDS.forEach(c=>{const m=marks[c.id]==="ok"?"◎":marks[c.id]==="ng"?"✕":"—";
    if(m==="✕"||cmts[c.id]) L.push(`${m} ${c.name} [${c.id}]`+(cmts[c.id]?`  ✏${cmts[c.id]}`:""));});
  const ok=CARDS.filter(c=>marks[c.id]==="ok").length, ng=CARDS.filter(c=>marks[c.id]==="ng").length;
  L.push(`（◎は省略。合計 ◎${ok} ✕${ng} 未${CARDS.length-ok-ng}）`);
  return L.join("\n");
}
function copyOut(){
  const t=text(),ta=document.getElementById("out");ta.value=t;
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(t).then(()=>alert("コピーしました。Claudeに貼ってください。"),
      ()=>{ta.select();try{document.execCommand("copy")}catch(e){};alert("コピーしました。")});
  }else{ta.removeAttribute("readonly");ta.select();ta.setSelectionRange(0,99999);
    let d=false;try{d=document.execCommand("copy")}catch(e){}
    ta.setAttribute("readonly","");alert(d?"コピーしました。":"下の枠を長押し→コピーしてください。")}
}
render();
</script></body></html>
