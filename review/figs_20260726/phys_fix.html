イッチ・電流計・電圧計が見分けられるように。図の中に文字は入れない。\n★今回の直し（装置を中学校の形に正す）:\n発泡ポリスチレンのカップを1つ、断面が見えるように描く。中に水を入れ、**電熱線をひたす**。\nカップのふたから、①温度計 ②電熱線につながる導線2本 ③かき混ぜ棒 の3つだけを差しこむ。\n★導線と温度計は**ふたの穴から入れる**。カップのかべを貫かせない。\n電熱線は水の中に完全にひたし、カップの底や壁にふれさせない。\n外の回路は、電源・スイッチ・電流計を**1本道（直列）**につなぐ。電圧計だけは電熱線に**並列**につなぐ。\n★導線が交差したり、電池の＋と−が部品を通らずつながったりしないこと。\n図の中に文字は入れない。\n★器具・実験の鉄則（必ず守る）:\n・**ガラスや容器を突き抜けさせない**。管・棒・軸は必ず「口」から入れる。かべを貫く線を描かない。\n・**接触すべきものは接触させる**。離すべきものは離す。中途半端なすき間を作らない。\n・器具は実物の形のまま。ゆがんだ板・折れた管・脚の欠けた台にしない。", "img": "data:image/webp;base64,UklGRmovAABXRUJQVlA4IF4vAACQ8gCdASowAnUBPpVIn0ulpCMhpBNa0LASiWdu8n2C4bLO1btkLOkOPF+cfPb/s/VH/f/UP/yfpy9DPmA/a31X/SH/dPUA/t3/A61z0DPLj9mj91PS+6/TpL+xX+g9Kvkjjo6CfpG13fT+O/w/Mr+ffnnPB/U9/PzZ1FPHu/ggE/Tf7/5232Pm9/C/5b2A+FI+8f+H2CP5v/ivWP/1vLZRtf//3PfuB///dpJ83c5u5zdzm7nN3ObagGvcH72IcPDyPPac3c5u5zdzm7nN3Obuc3Jf68YukkOBcpKJSUSkolJRKSiUlEo4jMkisjqZOgYT1GbnZM6QNN3fmR0k86f/veReph36I8O4IdwQ7gh3BDt34CGQn3y0J4taFsGd4Okv2tAHwRqD+8XSmqbz9wxq4eVz9ieNvHfojw7gh3BDuCHcC977ewe5kiup3LDOVqKoEO4IdwQ7gh3BDt0RGuiu8FR+usiGC1QahIeRIdpzRWILfB16q0Y5hQPbQrg3iBvDntSlzLT2HZo/XCNoLKfWGikZgVzigOwpgnWAvRdrw9ju35D4kDWmTLUqOlSnYO+UphIzrWZk+u2wSlDh1wq/64Vz9ETMRjRHQy0cmgQkM8vs1M69Jsqxc7EyIpcVHb3y/QMqihnagUSjs2uBXOXLfc9Jf4/no+7AGtmtV/0alUGSe9wtVpMitrHhA8NuiUIiW6wrG3ArSg0RN79EeHV3+jSvcRci1zNTpknPrni4TUTqN1+WfVGgNQgfbIRZ+XuoplS+cdHM0OQn458TX6aAvgc/HX8EtGYGJm8GWzdGDdmZiBUJHWRwGlJQ3k3fCaJmXAO1STkXxvPwo/mIkEELnobWhwZzfUtdbDKW+iuV7K5DCHk7ZwQGHOBz9V0jw9l7J0qLCPVqdl2pSsYfKSiRs1ekL+LRKWSArzX6dMXNoZAvgaKSOGsYnJXVM0T64BN2Op+vdQL4JxRhiSB3ZudQr2gcXyMTtWe3zKko6NXTFvcUMUOH46/upeIFG5/K2pRTM34cfgGlJRI/0OtMEPX1kIs6E9ewUcHObhlKVSFZltQktYQIiarfaBW7cNSy5Ydz5SuokkS5p/FkQoDw1te5lBbOrxMUQmKl+CE+R7bP/HUZBtDa5gzkPRIeMtDmcjGwO4hCvwvwmuKfMXSA8g7RJEvpjbtveSEsGHSskx8O8CZH+Vz3mOW51RRAdjp3SK62c88mngzyma/I6fI+16zNmCr3SCdNDSOIyr60slcvJat7cgGwgK9pOrszJodCma1qIqnrGwep/ifQyYMFAqQbkb+O7mxan5nU/8hSGweT9Diq+vIhMBArxjBTL9BBvK1A+TGfF8oZZxWRiiHg/VuTKkDjbSA3nkUDy77oANqHn/QXksyJ3d+2DM7vVFLqyzpNSQM88qrc4epCGcJgO3wrLTsRIDF/+jlyMmLZ8eAGlB8fJb4RU const KEY = "figs_grid_phys_fix1";
let marks = {}, cmts = {};
try{const s=JSON.parse(localStorage.getItem(KEY)||"{}");marks=s.marks||{};cmts=s.cmts||{}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({marks:marks,cmts:cmts}))}catch(e){}}
function mark(id,m){marks[id]=marks[id]===m?"":m;save();render()}
function setc(id,v){cmts[id]=v;save();stat()}
function allOk(){CARDS.forEach(c=>{if(!marks[c.id])marks[c.id]="ok"});save();render()}
function zoom(s){document.getElementById("zoomimg").src=s;document.getElementById("zoom").style.display="flex"}
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function render(){
  const gs=[...new Set(CARDS.map(c=>c.subject+" "+c.grade+" "+c.genre))];
  document.getElementById("host").innerHTML=gs.map(g=>`
   <div class="grp">${esc(g)}</div>
   <div class="grid">${CARDS.filter(c=>c.subject+" "+c.grade+" "+c.genre===g).map(c=>`
    <div class="card ${marks[c.id]==='ok'?'ok':marks[c.id]==='ng'?'ng':''}">
      <img src="${c.img}" alt="${c.id}" onclick="zoom(this.src)">
      <div class="name">${esc(c.name)}<span class="tag">${esc(c.layer)}</span></div>
      <div class="desc">${esc(c.label)}</div>
      ${c.note?`<div class="cn">🔎 ${esc(c.note)}</div>`:""}
      <details><summary>発注文</summary><pre>${esc(c.prompt)}</pre></details>
      <div class="btns">
        <button class="${marks[c.id]==='ok'?'on-ok':''}" onclick="mark('${c.id}','ok')">◎</button>
        <button class="${marks[c.id]==='ng'?'on-ng':''}" onclick="mark('${c.id}','ng')">✕</button>
      </div>
      <input class="cmt" placeholder="✏ 気になる所" value="${esc(cmts[c.id]||'')}" oninput="setc('${c.id}',this.value)">
    </div>`).join("")}</div>`).join("");
  stat();
}
function stat(){
  const v=Object.values(marks);
  document.getElementById("stat").textContent=
    `◎${v.filter(x=>x==="ok").length} ✕${v.filter(x=>x==="ng").length} / ${CARDS.length}`;
  document.getElementById("out").value=text();
}
function text(){
  const L=["理科図版 検収結果 (物理の直し 9枚（情景系）)"];
  CARDS.forEach(c=>{const m=marks[c.id]==="ok"?"◎":marks[c.id]==="ng"?"✕":"—";
    if(m==="✕"||cmts[c.id]) L.push(`${m} ${c.name} [${c.id}]`+(cmts[c.id]?`  ✏${cmts[c.id]}`:""));});
  const ok=CARDS.filter(c=>marks[c.id]==="ok").length, ng=CARDS.filter(c=>marks[c.id]==="ng").length;
  L.push(`（◎は省略。合計 ◎${ok} ✕${ng} 未${CARDS.length-ok-ng}）`);
  return L.join("\n");
}
function copyOut(){
  const t=text(),ta=document.getElementById("out");ta.value=t;
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(t).then(()=>alert("コピーしました。Claudeに貼ってください。"),
      ()=>{ta.select();try{document.execCommand("copy")}catch(e){};alert("コピーしました。")});
  }else{ta.removeAttribute("readonly");ta.select();ta.setSelectionRange(0,99999);
    let d=false;try{d=document.execCommand("copy")}catch(e){}
    ta.setAttribute("readonly","");alert(d?"コピーしました。":"下の枠を長押し→コピーしてください。")}
}
render();
</script></body></html>
