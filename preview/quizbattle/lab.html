<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>題材パック検品ラボ</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #667085;
      --line: #d8dee9;
      --paper: #fff;
      --soft: #f2f5f9;
      --navy: #162d50;
      --blue: #246bce;
      --ok: #157347;
      --ok-bg: #e9f7ef;
      --bad: #b42318;
      --bad-bg: #fff0ee;
      --warn: #8a5a00;
      --warn-bg: #fff7df;
      --shadow: 0 10px 28px rgba(20, 37, 63, .09);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans JP", sans-serif; color: var(--ink); background: #e9eef5; }
    body { height: 100dvh; overflow: hidden; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }
    header {
      min-height: 68px; padding: 10px 18px; color: white; background: linear-gradient(120deg, #112746, #214f80);
      display: flex; align-items: center; gap: 16px; box-shadow: 0 4px 16px rgba(12, 31, 54, .2); z-index: 2;
    }
    .brand { min-width: 270px; }
    h1 { margin: 0; font-size: 20px; letter-spacing: .03em; }
    .subtitle { margin-top: 2px; font-size: 12px; color: #dbe9f8; }
    .dropbar {
      flex: 1; min-width: 280px; min-height: 46px; border: 1.5px dashed rgba(255,255,255,.58); border-radius: 12px;
      display: flex; align-items: center; justify-content: center; gap: 10px; padding: 6px 12px; background: rgba(255,255,255,.08);
      transition: .18s ease;
    }
    .dropbar.drag { border-color: #fff; background: rgba(255,255,255,.2); transform: translateY(-1px); }
    .dropbar strong { font-size: 14px; }
    .dropbar small { color: #dbe9f8; }
    .file-btn, .ghost-btn, .primary-btn {
      border: 0; border-radius: 9px; padding: 8px 12px; font-weight: 700; white-space: nowrap;
    }
    .file-btn { color: var(--navy); background: white; }
    .ghost-btn { color: var(--ink); background: #edf1f6; }
    .primary-btn { color: white; background: var(--blue); }
    .file-btn:focus-visible, button:focus-visible, select:focus-visible { outline: 3px solid #f9c74f; outline-offset: 2px; }
    .header-count { min-width: 114px; text-align: right; font-size: 12px; color: #dbe9f8; }
    .header-count strong { display: block; font-size: 18px; color: white; }
    #fileInput { display: none; }

    main { min-height: 0; padding: 12px; display: grid; grid-template-columns: minmax(220px, 270px) minmax(460px, 1fr) minmax(330px, 400px); gap: 12px; }
    .panel { min-width: 0; min-height: 0; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; }
    .panel-head { flex: 0 0 auto; min-height: 54px; padding: 11px 13px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 8px; background: #fbfcfe; }
    .panel-head h2 { margin: 0; font-size: 15px; }
    .panel-head p { margin: 2px 0 0; color: var(--muted); font-size: 11px; }
    .scroll { min-height: 0; overflow: auto; overscroll-behavior: contain; scrollbar-gutter: stable; }
    .empty { min-height: 180px; margin: auto; padding: 28px 18px; text-align: center; color: var(--muted); display: grid; place-content: center; }
    .empty .big { font-size: 34px; margin-bottom: 8px; }

    .pack-list { padding: 8px; }
    .pack-row {
      width: 100%; border: 1px solid transparent; background: transparent; text-align: left; border-radius: 10px; padding: 10px;
      display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 6px 8px; margin-bottom: 5px;
    }
    .pack-row:hover { background: var(--soft); }
    .pack-row.active { background: #edf5ff; border-color: #a9c9f3; }
    .pack-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 750; }
    .pack-file { grid-column: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 11px; }
    .pack-meta { color: var(--muted); font-size: 11px; }
    .status-dot { align-self: center; font-weight: 900; }
    .status-dot.ok { color: var(--ok); }
    .status-dot.bad { color: var(--bad); }
    .status-dot.error { color: var(--warn); }
    .list-actions { padding: 8px; border-top: 1px solid var(--line); display: flex; gap: 6px; }
    .list-actions button { flex: 1; font-size: 12px; }

    .summary { padding: 12px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: center; background: #fcfdff; }
    .summary-badge {
      width: 66px; height: 66px; flex: 0 0 auto; border-radius: 18px; display: grid; place-content: center; text-align: center; font-weight: 900; line-height: 1.05;
    }
    .summary-badge.pass { color: var(--ok); background: var(--ok-bg); border: 1px solid #9bd5b7; }
    .summary-badge.fail { color: var(--bad); background: var(--bad-bg); border: 1px solid #f0aaa4; }
    .summary-badge.error { color: var(--warn); background: var(--warn-bg); border: 1px solid #e9cc7c; }
    .summary-title { min-width: 0; }
    .summary-title h3 { margin: 0; font-size: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .summary-title p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
    .summary-stats { margin-left: auto; display: flex; gap: 6px; }
    .mini-stat { min-width: 62px; padding: 6px 8px; border-radius: 8px; background: var(--soft); text-align: center; font-size: 10px; color: var(--muted); }
    .mini-stat strong { display: block; color: var(--ink); font-size: 15px; }

    .checks { padding: 10px; display: grid; gap: 8px; }
    .check {
      border: 1px solid var(--line); border-radius: 11px; overflow: hidden; background: white;
    }
    .check.pass { border-color: #b7dec9; }
    .check.fail { border-color: #f1b5af; }
    .check-main { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; align-items: center; gap: 7px; padding: 9px 10px; }
    .check-mark { width: 26px; height: 26px; border-radius: 50%; display: grid; place-content: center; font-weight: 900; }
    .pass .check-mark { color: white; background: var(--ok); }
    .fail .check-mark { color: white; background: var(--bad); }
    .check-name { font-size: 13px; font-weight: 800; }
    .check-metric { margin-top: 1px; color: var(--muted); font-size: 11px; }
    .check-count { color: var(--muted); font-size: 11px; white-space: nowrap; }
    .findings { margin: 0; padding: 0 10px 9px 47px; list-style: none; color: #7d271f; font-size: 11px; }
    .findings li { margin: 3px 0; overflow-wrap: anywhere; }
    .findings li::before { content: "↳"; margin-left: -15px; margin-right: 5px; color: var(--bad); }
    .note { margin: 0 10px 9px 47px; color: var(--warn); font-size: 11px; }
    .collision-box { margin: 0 10px 10px 47px; padding: 8px; border-radius: 8px; color: #6c1c16; background: var(--bad-bg); font-size: 11px; }
    .collision-box strong { display: block; margin-bottom: 4px; }
    .collision-pair { display: inline-block; margin: 2px 4px 2px 0; padding: 3px 6px; border-radius: 6px; background: white; border: 1px solid #efb4ae; }
    .parse-error { margin: 14px; padding: 13px; border: 1px solid #e7c35e; border-radius: 10px; color: #6d4800; background: var(--warn-bg); overflow-wrap: anywhere; }

    .play-head-controls { display: flex; gap: 6px; }
    .play-head-controls button { padding: 6px 9px; font-size: 11px; }
    .play-wrap { min-height: 0; padding: 10px; display: grid; grid-template-rows: auto auto minmax(100px, 1fr); gap: 9px; }
    .field label { display: block; margin-bottom: 4px; color: var(--muted); font-size: 11px; font-weight: 700; }
    .field select { width: 100%; min-height: 36px; border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; background: white; }
    .play-status { padding: 8px 10px; border-radius: 9px; background: var(--soft); font-size: 12px; }
    .play-status strong { color: var(--blue); }
    .play-grid { min-height: 0; display: grid; grid-template-rows: minmax(90px, .9fr) minmax(90px, 1.1fr); gap: 8px; }
    .subbox { min-height: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
    .subhead { padding: 7px 9px; background: #f7f9fc; border-bottom: 1px solid var(--line); font-size: 11px; font-weight: 800; display: flex; justify-content: space-between; }
    .question-list, .candidate-list { padding: 7px; overflow: auto; }
    .question-list { display: grid; grid-template-columns: 1fr; gap: 5px; }
    .question-btn { border: 1px solid #bad0eb; border-radius: 8px; padding: 7px 8px; color: #174775; background: #f5f9ff; text-align: left; font-size: 11px; }
    .question-btn:hover { background: #e9f3ff; }
    .question-btn:disabled { cursor: default; color: #8b96a5; background: #f2f3f5; border-color: #ddd; text-decoration: line-through; }
    .candidate-list { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 5px; }
    .candidate { padding: 4px 7px; border: 1px solid var(--line); border-radius: 999px; background: white; font-size: 10px; }
    .candidate.secret { border-color: #e0a500; background: #fff5c9; }
    .answer-flash { display: inline-block; margin-left: 5px; padding: 1px 6px; border-radius: 999px; font-weight: 800; }
    .answer-flash.yes { color: var(--ok); background: var(--ok-bg); }
    .answer-flash.no { color: var(--bad); background: var(--bad-bg); }

    .moves-table { width: 100%; border-collapse: collapse; font-size: 11px; }
    .moves-table th, .moves-table td { padding: 6px 7px; border-bottom: 1px solid #edf0f4; text-align: left; }
    .moves-table th { position: sticky; top: 0; background: #f8fafc; z-index: 1; }
    .moves-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .metric-help { color: var(--muted); font-size: 10px; font-weight: 400; }

    .toast { position: fixed; left: 50%; bottom: 18px; z-index: 10; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; padding: 9px 14px; border-radius: 9px; color: white; background: #18263a; box-shadow: var(--shadow); transition: .2s ease; font-size: 12px; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 1050px) {
      main { grid-template-columns: 220px minmax(430px, 1fr); }
      .play-panel { grid-column: 1 / -1; max-height: 310px; }
      .play-wrap { grid-template-columns: 220px 180px 1fr; grid-template-rows: 1fr; }
      .play-grid { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
    }
    @media (max-width: 720px) {
      body { height: auto; min-height: 100dvh; overflow: auto; }
      .app { height: auto; min-height: 100dvh; display: block; }
      header { padding: 10px; flex-wrap: wrap; }
      .brand { min-width: 0; flex: 1; }
      .header-count { min-width: 80px; }
      .dropbar { order: 3; width: 100%; min-width: 0; justify-content: space-between; }
      .dropbar small { display: none; }
      main { display: grid; grid-template-columns: 1fr; padding: 8px; }
      .panel { min-height: 260px; max-height: none; }
      .pack-panel { min-height: 220px; max-height: 340px; }
      .result-panel { min-height: 520px; }
      .play-panel { grid-column: auto; min-height: 520px; max-height: none; }
      .play-wrap { grid-template-columns: 1fr; grid-template-rows: auto auto minmax(300px, 1fr); }
      .play-grid { grid-template-columns: 1fr; grid-template-rows: minmax(150px, 1fr) minmax(150px, 1fr); }
      .summary { align-items: flex-start; flex-wrap: wrap; }
      .summary-stats { width: 100%; margin: 0; }
      .mini-stat { flex: 1; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <h1>題材パック検品ラボ</h1>
        <div class="subtitle">あてっこ対戦・教師用 JSON チェッカー</div>
      </div>
      <div class="dropbar" id="dropZone">
        <div><strong>JSONをここへドロップ</strong> <small>（複数まとめて可）</small></div>
        <label class="file-btn" for="fileInput">ファイルを選ぶ</label>
        <input id="fileInput" type="file" accept=".json,application/json" multiple>
      </div>
      <div class="header-count"><strong id="passCount">0 / 0</strong>合格パック</div>
    </header>

    <main>
      <section class="panel pack-panel" aria-label="読み込んだパック">
        <div class="panel-head">
          <div><h2>読み込んだパック</h2><p>クリックして検品結果を表示</p></div>
        </div>
        <div class="scroll pack-list" id="packList">
          <div class="empty"><div><div class="big">📦</div>JSONファイルを読み込んでください</div></div>
        </div>
        <div class="list-actions">
          <button class="ghost-btn" id="clearBtn" type="button">すべて消す</button>
          <button class="ghost-btn" id="copyBtn" type="button">結果をコピー</button>
        </div>
      </section>

      <section class="panel result-panel" aria-label="検品結果">
        <div class="panel-head">
          <div><h2>合格条件 1〜6</h2><p>発注書 §2-1 に沿って機械検証</p></div>
        </div>
        <div class="scroll" id="resultView">
          <div class="empty"><div><div class="big">✓</div>選んだパックの○×と原因をここに表示します</div></div>
        </div>
      </section>

      <section class="panel play-panel" aria-label="試遊と手数">
        <div class="panel-head">
          <div><h2>手数・軽い試遊</h2><p>質問を選んで候補の減り方を確認</p></div>
          <div class="play-head-controls">
            <button class="ghost-btn" id="movesBtn" type="button">手数表</button>
            <button class="ghost-btn" id="playBtn" type="button">試遊</button>
          </div>
        </div>
        <div class="scroll" id="playView">
          <div class="empty"><div><div class="big">🎯</div>検品するパックを選んでください</div></div>
        </div>
      </section>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
  (() => {
    "use strict";

    const $ = (selector, root = document) => root.querySelector(selector);
    const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];
    const escapeHtml = (value) => String(value ?? "")
      .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;").replaceAll("'", "&#039;");
    const safeName = (item, index) => {
      if (item && typeof item.name === "string" && item.name.trim()) return item.name.trim();
      return `候補${index + 1}`;
    };
    const choose = (n, k) => {
      if (k < 0 || k > n) return 0;
      k = Math.min(k, n - k);
      let result = 1;
      for (let i = 1; i <= k; i++) result = result * (n - k + i) / i;
      return result;
    };
    const popcount = (value) => {
      let count = 0;
      while (value) { value &= value - 1; count++; }
      return count;
    };

    const state = {
      entries: [],
      selected: -1,
      mode: "play",
      play: null,
      toastTimer: null
    };

    const els = {
      fileInput: $("#fileInput"),
      dropZone: $("#dropZone"),
      packList: $("#packList"),
      resultView: $("#resultView"),
      playView: $("#playView"),
      passCount: $("#passCount"),
      clearBtn: $("#clearBtn"),
      copyBtn: $("#copyBtn"),
      movesBtn: $("#movesBtn"),
      playBtn: $("#playBtn"),
      toast: $("#toast")
    };

    function toast(message) {
      clearTimeout(state.toastTimer);
      els.toast.textContent = message;
      els.toast.classList.add("show");
      state.toastTimer = setTimeout(() => els.toast.classList.remove("show"), 1800);
    }

    function isObject(value) {
      return value !== null && typeof value === "object" && !Array.isArray(value);
    }

    function extractPacks(parsed) {
      if (Array.isArray(parsed)) return parsed;
      if (isObject(parsed) && Array.isArray(parsed.packs)) return parsed.packs;
      return [parsed];
    }

    async function readFiles(fileList) {
      const files = [...fileList].filter(file => file.name.toLowerCase().endsWith(".json") || file.type === "application/json");
      if (!files.length) {
        toast("JSONファイルが見つかりません");
        return;
      }
      for (const file of files) {
        try {
          const text = await file.text();
          const parsed = JSON.parse(text);
          const packs = extractPacks(parsed);
          packs.forEach((pack, index) => addEntry(pack, packs.length === 1 ? file.name : `${file.name} #${index + 1}`));
        } catch (error) {
          state.entries.push({
            filename: file.name,
            pack: null,
            error: `JSONを解析できません: ${error.message}`,
            report: null
          });
        }
      }
      if (state.selected < 0 && state.entries.length) state.selected = 0;
      renderAll();
      els.fileInput.value = "";
    }

    function addEntry(pack, filename) {
      if (!isObject(pack)) {
        state.entries.push({ filename, pack: null, error: "パックの最上位がJSONオブジェクトではありません。", report: null });
        return;
      }
      const entry = { filename, pack, error: null, report: null };
      entry.report = validatePack(pack);
      state.entries.push(entry);
    }

    function validatePack(pack) {
      const groups = Array.isArray(pack.groups) ? pack.groups : [];
      const questions = Array.isArray(pack.questions) ? pack.questions : [];
      const items = Array.isArray(pack.items) ? pack.items : [];
      const findings = [[], [], [], [], [], []];
      const notes = [[], [], [], [], [], []];

      const groupNames = groups.filter(value => typeof value === "string" && value.trim()).map(value => value.trim());
      const groupSet = new Set(groupNames);
      const groupCounts = new Map(groupNames.map(group => [group, 0]));
      const duplicateGroups = groupNames.filter((group, index) => groupNames.indexOf(group) !== index);

      if (!Array.isArray(pack.groups)) findings[0].push("groups が配列ではありません。");
      if (!Array.isArray(pack.items)) findings[0].push("items が配列ではありません。");
      if (items.length < 20 || items.length > 30) findings[0].push(`候補が ${items.length}件です（合格は20〜30件）。`);
      if (!groupNames.length) findings[0].push("有効な group がありません。");

      items.forEach((item, index) => {
        const name = safeName(item, index);
        if (!isObject(item)) {
          findings[0].push(`${name}: 候補がオブジェクトではありません。`);
          return;
        }
        if (typeof item.group !== "string" || !groupSet.has(item.group)) {
          findings[0].push(`${name}: group「${String(item.group ?? "")}」が groups にありません。`);
        } else {
          groupCounts.set(item.group, (groupCounts.get(item.group) || 0) + 1);
        }
      });
      for (const group of groupNames) {
        const count = groupCounts.get(group) || 0;
        if (count < 2) findings[0].push(`group「${group}」は ${count}件です（最低2件）。`);
      }

      if (!Array.isArray(pack.questions)) findings[1].push("questions が配列ではありません。");
      if (questions.length < 12 || questions.length > 18) findings[1].push(`質問が ${questions.length}件です（合格は12〜18件）。`);
      const validQuestions = questions.filter(isObject);
      const keys = validQuestions.map(question => typeof question.key === "string" ? question.key.trim() : "");
      const keySet = new Set(keys.filter(Boolean));
      validQuestions.forEach((question, index) => {
        if (!keys[index]) findings[1].push(`質問${index + 1}: key がありません。`);
        if (typeof question.text !== "string" || !question.text.trim()) findings[1].push(`質問「${keys[index] || index + 1}」: text がありません。`);
      });
      questions.forEach((question, index) => {
        if (!isObject(question)) findings[1].push(`質問${index + 1}: オブジェクトではありません。`);
      });
      const duplicateKeys = [...new Set(keys.filter((key, index) => key && keys.indexOf(key) !== index))];
      duplicateKeys.forEach(key => findings[1].push(`質問キー「${key}」が重複しています。`));

      const answerSets = items.map(item => new Set(isObject(item) && Array.isArray(item.yes) ? item.yes : []));
      const canCompare = items.length > 0 && keySet.size > 0 && duplicateKeys.length === 0;
      const collisionPairs = [];
      const collisionBuckets = new Map();
      if (canCompare) {
        items.forEach((item, index) => {
          const signature = [...keySet].map(key => answerSets[index].has(key) ? "1" : "0").join("");
          if (!collisionBuckets.has(signature)) collisionBuckets.set(signature, []);
          collisionBuckets.get(signature).push(index);
        });
        for (const bucket of collisionBuckets.values()) {
          if (bucket.length < 2) continue;
          for (let a = 0; a < bucket.length - 1; a++) {
            for (let b = a + 1; b < bucket.length; b++) {
              collisionPairs.push([safeName(items[bucket[a]], bucket[a]), safeName(items[bucket[b]], bucket[b])]);
            }
          }
        }
      } else {
        findings[2].push("有効で一意な質問キーがないため、答えの組み合わせを比較できません。");
      }
      collisionPairs.forEach(pair => findings[2].push(`${pair[0]} × ${pair[1]} が全質問で同じ答えです。`));

      const questionSplits = [];
      validQuestions.forEach((question, qIndex) => {
        const key = keys[qIndex];
        if (!key) return;
        let yes = 0;
        items.forEach((item, index) => { if (answerSets[index].has(key)) yes++; });
        const no = items.length - yes;
        questionSplits.push({ key, text: question.text || key, yes, no });
        if (yes === 0 || no === 0) findings[3].push(`「${question.text || key}」(${key}): はい ${yes}件 / いいえ ${no}件。`);
        else if (yes < 2 || no < 2) notes[3].push(`「${question.text || key}」: はい ${yes}件 / いいえ ${no}件（片側2件以上が望ましい）。`);
      });
      if (!questionSplits.length) findings[3].push("有効な質問がないため、はい／いいえの分離を確認できません。");

      if (duplicateGroups.length) findings[4].push(`groups の重複: ${[...new Set(duplicateGroups)].join("、")}`);
      if (duplicateKeys.length) findings[4].push(`質問キーの重複により答えを一意に扱えません: ${duplicateKeys.join("、")}`);
      const seenNames = new Map();
      items.forEach((item, index) => {
        const name = safeName(item, index);
        if (!isObject(item)) {
          findings[4].push(`${name}: 候補データが不正です。`);
          return;
        }
        if (typeof item.name !== "string" || !item.name.trim()) findings[4].push(`${name}: name がありません。`);
        const normalizedName = typeof item.name === "string" ? item.name.trim() : "";
        if (normalizedName) {
          if (seenNames.has(normalizedName)) findings[4].push(`候補名「${normalizedName}」が候補${seenNames.get(normalizedName) + 1}と候補${index + 1}で重複しています。`);
          else seenNames.set(normalizedName, index);
        }
        if (!Array.isArray(item.yes)) {
          findings[4].push(`${name}: yes が配列ではありません。`);
          return;
        }
        const localSeen = new Set();
        item.yes.forEach((key, yesIndex) => {
          if (typeof key !== "string") findings[4].push(`${name}: yes[${yesIndex}] が文字列ではありません。`);
          else if (!keySet.has(key)) findings[4].push(`${name}: 存在しない質問キー「${key}」を yes に指定しています。`);
          else if (localSeen.has(key)) findings[4].push(`${name}: yes に「${key}」が重複しています。`);
          localSeen.add(key);
        });
        if (!groupSet.has(item.group)) findings[4].push(`${name}: group「${String(item.group ?? "")}」が定義外です。`);

        if (canCompare && Array.isArray(item.yes)) {
          let remaining = items.map((_, i) => i);
          for (const key of keySet) {
            const targetAnswer = answerSets[index].has(key);
            remaining = remaining.filter(candidateIndex => answerSets[candidateIndex].has(key) === targetAnswer);
            if (!remaining.includes(index)) {
              findings[4].push(`${name}: 質問「${key}」への自身の答えで候補から消えます。`);
              break;
            }
          }
        }
      });
      if (!items.length) findings[4].push("候補がないため自己保持を確認できません。");

      const prefixResults = [];
      [15, 22].forEach(limit => {
        const counts = new Map(groupNames.map(group => [group, 0]));
        items.slice(0, limit).forEach(item => {
          if (isObject(item) && counts.has(item.group)) counts.set(item.group, counts.get(item.group) + 1);
        });
        const missing = groupNames.filter(group => (counts.get(group) || 0) < 2);
        prefixResults.push({ limit, actual: Math.min(limit, items.length), counts, missing });
        if (items.length < limit) {
          findings[5].push(`先頭${limit}件を作れません（全候補が${items.length}件）。`);
        }
        missing.forEach(group => findings[5].push(`先頭${limit}件の group「${group}」は ${counts.get(group) || 0}件です。`));
      });
      if (!groupNames.length) findings[5].push("group がないため先頭部分集合を確認できません。");

      const checks = [
        {
          name: "1. 候補数・group内訳",
          pass: findings[0].length === 0,
          metric: `${items.length}件 / group最少 ${groupCounts.size ? Math.min(...groupCounts.values()) : 0}件`,
          findings: findings[0], notes: notes[0]
        },
        {
          name: "2. 質問数",
          pass: findings[1].length === 0,
          metric: `${questions.length}件（合格 12〜18件）`,
          findings: findings[1], notes: notes[1]
        },
        {
          name: "3. 一意分離",
          pass: findings[2].length === 0,
          metric: collisionPairs.length ? `衝突 ${collisionPairs.length}ペア` : `${items.length}候補の答えがすべて別`,
          findings: findings[2], notes: notes[2], collisionPairs
        },
        {
          name: "4. 質問の両側分離",
          pass: findings[3].length === 0,
          metric: `${questionSplits.filter(q => q.yes > 0 && q.no > 0).length} / ${questions.length}問が両側に分離`,
          findings: findings[3], notes: notes[3]
        },
        {
          name: "5. 自己矛盾なし",
          pass: findings[4].length === 0,
          metric: findings[4].length ? `データ矛盾 ${findings[4].length}件` : `${items.length} / ${items.length}候補が自己保持`,
          findings: findings[4], notes: notes[4]
        },
        {
          name: "6. 先頭15・22件のgroup",
          pass: findings[5].length === 0,
          metric: prefixResults.map(result => `先頭${result.limit}: 最少${result.counts.size ? Math.min(...result.counts.values()) : 0}件`).join(" / "),
          findings: findings[5], notes: notes[5]
        }
      ];

      return {
        groups, groupNames, questions, items, keys: [...keySet], answerSets,
        groupCounts, questionSplits, collisionPairs, prefixResults, checks,
        pass: checks.every(check => check.pass)
      };
    }

    function renderAll() {
      renderPackList();
      renderSelected();
      const good = state.entries.filter(entry => entry.report && entry.report.pass).length;
      els.passCount.textContent = `${good} / ${state.entries.length}`;
    }

    function renderPackList() {
      if (!state.entries.length) {
        els.packList.innerHTML = '<div class="empty"><div><div class="big">📦</div>JSONファイルを読み込んでください</div></div>';
        return;
      }
      els.packList.innerHTML = state.entries.map((entry, index) => {
        const pack = entry.pack || {};
        const title = pack.title || pack.id || entry.filename;
        const status = entry.error ? "error" : entry.report.pass ? "ok" : "bad";
        const mark = entry.error ? "!" : entry.report.pass ? "○" : "×";
        const meta = entry.report ? `${entry.report.items.length}候補・${entry.report.questions.length}問` : "読込エラー";
        return `<button class="pack-row ${index === state.selected ? "active" : ""}" data-index="${index}" type="button">
          <span class="pack-title">${escapeHtml(title)}</span>
          <span class="status-dot ${status}">${mark}</span>
          <span class="pack-file">${escapeHtml(entry.filename)}</span>
          <span class="pack-meta">${escapeHtml(meta)}</span>
        </button>`;
      }).join("");
      $$(".pack-row", els.packList).forEach(button => button.addEventListener("click", () => {
        state.selected = Number(button.dataset.index);
        state.play = null;
        renderAll();
      }));
    }

    function renderSelected() {
      const entry = state.entries[state.selected];
      if (!entry) {
        els.resultView.innerHTML = '<div class="empty"><div><div class="big">✓</div>選んだパックの○×と原因をここに表示します</div></div>';
        els.playView.innerHTML = '<div class="empty"><div><div class="big">🎯</div>検品するパックを選んでください</div></div>';
        return;
      }
      if (entry.error) {
        els.resultView.innerHTML = `<div class="parse-error"><strong>${escapeHtml(entry.filename)}</strong><br>${escapeHtml(entry.error)}</div>`;
        els.playView.innerHTML = '<div class="empty"><div>JSONを直すと試遊できます</div></div>';
        return;
      }
      renderReport(entry);
      renderSide(entry);
    }

    function renderReport(entry) {
      const pack = entry.pack;
      const report = entry.report;
      const failedCount = report.checks.filter(check => !check.pass).length;
      const badgeClass = report.pass ? "pass" : "fail";
      const badgeText = report.pass ? "○<br>合格" : `×<br>${failedCount}項目`;
      const subject = typeof pack.subject === "string" ? pack.subject : "subject未設定";
      const groupText = report.groupNames.length ? report.groupNames.join("・") : "group未設定";
      els.resultView.innerHTML = `
        <div class="summary">
          <div class="summary-badge ${badgeClass}">${badgeText}</div>
          <div class="summary-title">
            <h3>${escapeHtml(pack.title || pack.id || entry.filename)}</h3>
            <p>${escapeHtml(subject)} ／ ${escapeHtml(groupText)}</p>
          </div>
          <div class="summary-stats">
            <div class="mini-stat"><strong>${report.items.length}</strong>候補</div>
            <div class="mini-stat"><strong>${report.questions.length}</strong>質問</div>
            <div class="mini-stat"><strong>${report.collisionPairs.length}</strong>衝突</div>
          </div>
        </div>
        <div class="checks">
          ${report.checks.map(renderCheck).join("")}
        </div>`;
    }

    function renderCheck(check) {
      const findingHtml = check.findings.length
        ? `<ul class="findings">${check.findings.map(item => `<li>${escapeHtml(item)}</li>`).join("")}</ul>`
        : "";
      const noteHtml = check.notes.length
        ? `<div class="note">参考: ${check.notes.map(escapeHtml).join(" ／ ")}</div>`
        : "";
      const collisionHtml = check.collisionPairs && check.collisionPairs.length
        ? `<div class="collision-box"><strong>同じ答えの衝突ペア</strong>${check.collisionPairs.map(pair => `<span class="collision-pair">${escapeHtml(pair[0])} ⇄ ${escapeHtml(pair[1])}</span>`).join("")}</div>`
        : "";
      return `<article class="check ${check.pass ? "pass" : "fail"}">
        <div class="check-main">
          <div class="check-mark">${check.pass ? "○" : "×"}</div>
          <div><div class="check-name">${escapeHtml(check.name)}</div><div class="check-metric">${escapeHtml(check.metric)}</div></div>
          <div class="check-count">${check.pass ? "合格" : `${check.findings.length}件`}</div>
        </div>
        ${findingHtml}${collisionHtml}${noteHtml}
      </article>`;
    }

    function initPlay(entry) {
      const report = entry.report;
      const secretIndex = report.items.length ? 0 : -1;
      state.play = {
        secretIndex,
        remaining: report.items.map((_, index) => index),
        used: [],
        last: null
      };
    }

    function renderSide(entry) {
      if (state.mode === "moves") renderMoves(entry);
      else renderPlay(entry);
    }

    function renderPlay(entry) {
      const report = entry.report;
      if (!state.play || state.play.secretIndex >= report.items.length) initPlay(entry);
      const play = state.play;
      if (!report.items.length || !report.keys.length) {
        els.playView.innerHTML = '<div class="empty"><div>有効な候補と質問がないため試遊できません</div></div>';
        return;
      }
      const answer = play.last ? `<span class="answer-flash ${play.last.answer ? "yes" : "no"}">${play.last.answer ? "はい" : "いいえ"}</span>` : "";
      els.playView.innerHTML = `
        <div class="play-wrap">
          <div class="field">
            <label for="secretSelect">秘密札（教師だけに表示）</label>
            <select id="secretSelect">${report.items.map((item, index) => `<option value="${index}" ${index === play.secretIndex ? "selected" : ""}>${escapeHtml(safeName(item, index))}｜${escapeHtml(isObject(item) ? item.group || "" : "")}</option>`).join("")}</select>
          </div>
          <div class="play-status">
            残り <strong>${play.remaining.length}件</strong> ／ ${play.used.length}問使用 ${answer}
            ${play.remaining.length === 1 ? `<br><strong>${escapeHtml(safeName(report.items[play.remaining[0]], play.remaining[0]))}</strong> に確定` : ""}
          </div>
          <div class="play-grid">
            <div class="subbox">
              <div class="subhead"><span>質問を選ぶ</span><span>${report.questions.length - play.used.length}問</span></div>
              <div class="question-list">
                ${report.questions.map((question, index) => {
                  const validQuestion = isObject(question);
                  const key = validQuestion && typeof question.key === "string" ? question.key : "";
                  const used = play.used.includes(key) || !key;
                  const text = validQuestion ? question.text || key || `質問${index + 1}` : `質問${index + 1}（データ不正）`;
                  return `<button class="question-btn" type="button" data-key="${escapeHtml(key)}" ${used ? "disabled" : ""}>${escapeHtml(text)}</button>`;
                }).join("")}
              </div>
            </div>
            <div class="subbox">
              <div class="subhead"><span>残った候補</span><button class="ghost-btn" id="resetPlayBtn" type="button">やり直す</button></div>
              <div class="candidate-list">
                ${play.remaining.map(index => `<span class="candidate ${index === play.secretIndex ? "secret" : ""}">${escapeHtml(safeName(report.items[index], index))}</span>`).join("")}
              </div>
            </div>
          </div>
        </div>`;

      $("#secretSelect", els.playView).addEventListener("change", event => {
        initPlay(entry);
        state.play.secretIndex = Number(event.target.value);
        renderPlay(entry);
      });
      $("#resetPlayBtn", els.playView).addEventListener("click", () => {
        const secretIndex = state.play.secretIndex;
        initPlay(entry);
        state.play.secretIndex = secretIndex;
        renderPlay(entry);
      });
      $$(".question-btn", els.playView).forEach(button => button.addEventListener("click", () => {
        askQuestion(entry, button.dataset.key);
      }));
    }

    function askQuestion(entry, key) {
      const report = entry.report;
      const play = state.play;
      const answer = report.answerSets[play.secretIndex].has(key);
      play.remaining = play.remaining.filter(index => report.answerSets[index].has(key) === answer);
      play.used.push(key);
      play.last = { key, answer };
      renderPlay(entry);
    }

    function computeMoveStats(report) {
      const qCount = report.keys.length;
      const n = report.items.length;
      if (!n || !qCount || qCount > 20) return null;
      const vectors = report.answerSets.map(set => {
        let bits = 0;
        report.keys.forEach((key, index) => { if (set.has(key)) bits |= (1 << index); });
        return bits;
      });
      const totalMasks = 1 << qCount;
      const shortest = Array(n).fill(Infinity);
      const unresolvedBySize = Array.from({ length: n }, () => Array(qCount).fill(0));

      for (let mask = 0; mask < totalMasks; mask++) {
        const size = popcount(mask);
        const counts = new Map();
        const signatures = vectors.map(vector => vector & mask);
        signatures.forEach(signature => counts.set(signature, (counts.get(signature) || 0) + 1));
        for (let i = 0; i < n; i++) {
          if (counts.get(signatures[i]) === 1) {
            if (size < shortest[i]) shortest[i] = size;
          } else if (size < qCount) {
            unresolvedBySize[i][size]++;
          }
        }
      }
      const average = unresolvedBySize.map(counts => counts.reduce((sum, count, size) => sum + count / choose(qCount, size), 0));
      return { shortest, average };
    }

    function renderMoves(entry) {
      const report = entry.report;
      if (!report.moveStats) report.moveStats = computeMoveStats(report);
      const stats = report.moveStats;
      if (!stats) {
        els.playView.innerHTML = '<div class="empty"><div>手数を計算できません。<br>有効な質問1〜20件と候補が必要です。</div></div>';
        return;
      }
      els.playView.innerHTML = `
        <div class="scroll" style="height:100%">
          <table class="moves-table">
            <thead><tr><th>秘密札</th><th class="num">最短</th><th class="num">平均*</th></tr></thead>
            <tbody>${report.items.map((item, index) => `
              <tr><td>${escapeHtml(safeName(item, index))}<br><span class="metric-help">${escapeHtml(isObject(item) ? item.group || "" : "")}</span></td>
              <td class="num">${Number.isFinite(stats.shortest[index]) ? stats.shortest[index] + "手" : "特定不可"}</td>
              <td class="num">${Number.isFinite(stats.shortest[index]) ? stats.average[index].toFixed(2) + "手" : "特定不可"}</td></tr>
            `).join("")}</tbody>
          </table>
          <div class="note" style="margin:9px">最短＝その札を1枚にする最小の質問数。平均＝質問順をランダムにしたとき、1枚に絞れるまでの正確な期待値。</div>
        </div>`;
    }

    function reportText(entry) {
      if (entry.error) return `${entry.filename}\n読込エラー: ${entry.error}`;
      const pack = entry.pack;
      const report = entry.report;
      const lines = [
        `【${report.pass ? "合格" : "不合格"}】${pack.title || pack.id || entry.filename}`,
        `ファイル: ${entry.filename}`,
        `候補 ${report.items.length}件 / 質問 ${report.questions.length}件 / 衝突 ${report.collisionPairs.length}ペア`
      ];
      report.checks.forEach(check => {
        lines.push(`${check.pass ? "○" : "×"} ${check.name}: ${check.metric}`);
        check.findings.forEach(finding => lines.push(`  - ${finding}`));
        check.notes.forEach(note => lines.push(`  - 参考: ${note}`));
      });
      return lines.join("\n");
    }

    els.fileInput.addEventListener("change", event => readFiles(event.target.files));
    ["dragenter", "dragover"].forEach(type => els.dropZone.addEventListener(type, event => {
      event.preventDefault();
      els.dropZone.classList.add("drag");
    }));
    ["dragleave", "drop"].forEach(type => els.dropZone.addEventListener(type, event => {
      event.preventDefault();
      els.dropZone.classList.remove("drag");
    }));
    els.dropZone.addEventListener("drop", event => readFiles(event.dataTransfer.files));
    els.clearBtn.addEventListener("click", () => {
      state.entries = [];
      state.selected = -1;
      state.play = null;
      renderAll();
    });
    els.copyBtn.addEventListener("click", async () => {
      if (!state.entries.length) return toast("コピーする結果がありません");
      const text = state.entries.map(reportText).join("\n\n");
      try {
        await navigator.clipboard.writeText(text);
        toast("検品結果をコピーしました");
      } catch {
        const area = document.createElement("textarea");
        area.value = text;
        area.style.position = "fixed";
        area.style.opacity = "0";
        document.body.append(area);
        area.select();
        document.execCommand("copy");
        area.remove();
        toast("検品結果をコピーしました");
      }
    });
    els.movesBtn.addEventListener("click", () => {
      state.mode = "moves";
      renderSelected();
    });
    els.playBtn.addEventListener("click", () => {
      state.mode = "play";
      renderSelected();
    });

    renderAll();
  })();
  </script>
</body>
</html>
