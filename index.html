<!DOCTYPE html>
<html lang="ja" class="notranslate" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="google" content="notranslate">
<title>まなびポータル</title>
<style>
  :root{
    --bg1:#0b1026; --bg2:#1a1040; --bg3:#2a1a55;
    --ink:#f5f7ff; --muted:#aab3d6; --glass:rgba(255,255,255,.10); --line:rgba(255,255,255,.18);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; height:100%; overflow:hidden;
    font-family:-apple-system,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,sans-serif;
    color:var(--ink); background:#05070f;}
  /* 画面外の背景（PC時にスマホ枠の外側を埋める） */
  .stage{position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(1200px 800px at 50% -10%, #16203f 0%, #070a16 60%, #04060e 100%);}
  /* スマホ枠 */
  .phone{position:relative; display:flex; flex-direction:column; width:100%; height:100%; max-width:372px; max-height:740px;
    overflow:hidden; border-radius:0;
    --blob1:#4f7cff; --blob2:#b14bff;
    background:linear-gradient(170deg,var(--bg1),var(--bg2) 55%,var(--bg3));
    transition:background .8s ease;}
  /* 時間帯で壁紙が変わる（上は暗めにして文字・枠の視認性を確保） */
  .phone.tod-morning{--blob1:#ffc27a; --blob2:#ffe08a; background:linear-gradient(170deg,#1d2a55,#37508f 52%,#e8a26a)}
  .phone.tod-day    {--blob1:#7cc4ff; --blob2:#34d3ee; background:linear-gradient(170deg,#15265e,#2f66c4 55%,#74b6ef)}
  .phone.tod-evening{--blob1:#ff9a5a; --blob2:#d96bb0; background:linear-gradient(170deg,#241246,#6a2f74 50%,#d97a55)}
  .phone.tod-night  {--blob1:#4f7cff; --blob2:#b14bff; background:linear-gradient(170deg,#070b1e,#121a3e 55%,#221a45)}
  @media(min-width:480px){
    .phone{border-radius:34px; box-shadow:0 26px 64px rgba(0,0,0,.6), 0 0 0 9px #0b0d18, 0 0 0 11px #20243a;
      height:min(94vh,720px);}
    .stage{padding:12px;}
  }
  /* 壁紙の装飾（ふわっと光る玉） */
  .phone::before,.phone::after{content:""; position:absolute; border-radius:50%; filter:blur(40px); opacity:.55; pointer-events:none;}
  .phone::before{width:260px;height:260px; background:var(--blob1); top:-60px; right:-60px; transition:background .8s ease;}
  .phone::after{width:240px;height:240px; background:var(--blob2); bottom:40px; left:-70px; transition:background .8s ease;}

  /* ステータスバー */
  .statusbar{position:relative; z-index:3; display:flex; align-items:center; justify-content:space-between;
    padding:12px 22px 4px; font-size:14px; font-weight:700; letter-spacing:.3px;}
  .statusbar .right{display:flex; gap:7px; align-items:center; opacity:.95}

  /* 時計（大きく） */
  .clockwrap{position:relative; z-index:3; text-align:center; margin-top:2px;}
  .clock{font-size:42px; font-weight:800; line-height:1; letter-spacing:1px; text-shadow:0 3px 18px rgba(0,0,0,.4)}
  .date{font-size:12px; color:var(--muted); margin-top:4px; font-weight:600}

  /* ページャ（横スワイプ領域） */
  .pager{position:relative; z-index:3; flex:1; min-height:0; display:flex; overflow:hidden;}
  .track{display:flex; width:200%; flex:0 0 200%; height:100%; transform:translateX(0); transition:transform .32s cubic-bezier(.22,.61,.36,1); touch-action:pan-y; will-change:transform;}
  .page{width:50%; height:100%; padding:14px 15px 0; display:flex; flex-direction:column; overflow-y:auto;
    -webkit-overflow-scrolling:touch; scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.25) transparent;}
  .page::-webkit-scrollbar, .news-list::-webkit-scrollbar{width:5px;}
  .page::-webkit-scrollbar-thumb, .news-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25); border-radius:99px;}
  .page{padding-bottom:14px;}  /* 末尾アプリ(社会)が下端でも見切れないよう余白 */

  /* アプリ：教科フレーム */
  .greet{font-size:13px; color:var(--muted); font-weight:700; margin:2px 4px 10px;}
  .frames{display:flex; flex-direction:column; gap:6px; align-content:start;}
  .frame{background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.025));
    border:1px solid var(--line); border-radius:18px; padding:6px 11px 9px;
    box-shadow:0 6px 18px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.10);}
  .frame-head{display:flex; align-items:center; gap:7px; margin:1px 2px 7px;
    font-size:11.5px; font-weight:800; letter-spacing:.4px; color:var(--ink); opacity:.92}
  .frame-head .dot-c{width:8px; height:8px; border-radius:50%; background:currentColor; box-shadow:0 0 9px currentColor;}
  .frame-head .em{font-size:13px}
  .grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px 4px; align-content:start;}
  .app{display:flex; flex-direction:column; align-items:center; gap:5px; cursor:pointer; border:0; background:none; color:inherit; padding:0;
    transition:transform .12s ease;}
  .app:active{transform:scale(.88)}
  /* パリッとした平面アイコン（外側の発光なし・くっきり） */
  .icon{width:54px; height:54px; border-radius:15px; display:flex; align-items:center; justify-content:center;
    font-size:28px; position:relative; overflow:hidden;
    box-shadow:0 3px 7px rgba(0,0,0,.40), inset 0 0 0 1px rgba(255,255,255,.16);}
  .icon .em{position:relative; z-index:1; line-height:1; filter:drop-shadow(0 1px 1px rgba(0,0,0,.4));}
  .label{font-size:11px; font-weight:700; text-align:center; line-height:1.2; text-shadow:0 1px 4px rgba(0,0,0,.5)}
  /* アイコン配色（ビビッド・くっきり） */
  .ic-rika {background:linear-gradient(160deg,#22e58c,#0b8a57)}
  .ic-eng  {background:linear-gradient(160deg,#a78bfa,#5b21b6)}
  .ic-gori {background:linear-gradient(160deg,#fbbf24,#c2410c)}
  .ic-run  {background:linear-gradient(160deg,#fb7185,#be123c)}
  .ic-merge{background:linear-gradient(160deg,#60a5fa,#1e40af)}
  .ic-data {background:linear-gradient(160deg,#34e0f0,#0e7490)}
  .ic-soon {background:linear-gradient(160deg,#5b667c,#2f3a4f)}
  .ic-sengoku{background:linear-gradient(160deg,#fb923c,#9a3412)}
  .ic-numsense{background:linear-gradient(160deg,#c084fc,#7c3aed)}
  .ic-quiz{background:linear-gradient(160deg,#f6d365,#b8860b)}
  .app.soon{cursor:default}
  .app.soon:active{transform:none}
  .badge-beta{position:absolute; right:-3px; top:-3px; background:#f87171; color:#fff; font-size:8px; font-weight:800;
    padding:2px 5px; border-radius:999px; letter-spacing:.05em;}
  .badge-soon{position:absolute; right:-3px; top:-3px; background:#facc15; color:#3b2c00; font-size:8px; font-weight:800;
    padding:1px 5px; border-radius:999px; box-shadow:0 2px 6px rgba(0,0,0,.4); z-index:2}

  /* プロフィールページ */
  .profile{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; text-align:center; gap:9px; padding:4px 20px 0;}
  .pf-avatar{width:80px;height:80px;border:0;cursor:pointer; border-radius:50%; color:inherit;
    background:linear-gradient(160deg,#334155,#1e293b);
    display:flex;align-items:center;justify-content:center;font-size:42px; box-shadow:inset 0 2px 0 rgba(255,255,255,.2), 0 8px 22px rgba(0,0,0,.4); transition:transform .1s}
  .pf-avatar:active{transform:scale(.93)}
  .pf-avatars{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; max-width:300px}
  .pf-avatars button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--glass);
    font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;color:inherit}
  .pf-avatars button.on{border-color:#ffd84d; box-shadow:0 0 0 2px rgba(255,216,77,.4)}
  .pf-name-row{display:flex;align-items:center;gap:8px}
  .pf-name{font-size:21px; font-weight:800}
  .pf-edit{background:none;border:0;color:var(--muted);font-size:15px;cursor:pointer;padding:2px}
  .pf-streak{display:inline-block;background:linear-gradient(160deg,#f59e0b,#b45309);color:#fff;
    padding:7px 16px;border-radius:999px;font-size:14px;font-weight:800;box-shadow:0 4px 12px rgba(245,158,11,.35)}
  .pf-section-t{align-self:flex-start;font-size:12px;font-weight:800;color:var(--muted);margin:5px 2px 0}
  .pf-total{align-self:flex-start;font-size:12.5px;color:var(--ink);font-weight:700}
  .pf-stats{width:100%;display:flex;flex-direction:column;gap:8px}
  .pf-stat{display:flex;align-items:center;gap:9px;text-align:left}
  .pf-stat .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    font-size:18px;flex:0 0 auto;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
  .pf-stat .meta{flex:1;min-width:0}
  .pf-stat .nm{font-size:12px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
  .pf-stat .nm .t{color:var(--muted);font-variant-numeric:tabular-nums}
  .pf-bar{height:7px;border-radius:999px;background:rgba(255,255,255,.12);margin-top:4px;overflow:hidden}
  .pf-bar > i{display:block;height:100%;border-radius:999px}
  .pf-note{font-size:11px;color:var(--muted);line-height:1.6;margin-top:3px}

  /* 保存うっかり防止トースト */
  .save-toast{position:absolute; left:12px; right:12px; bottom:48px; z-index:40;
    background:rgba(18,24,46,.97); border:1px solid var(--line); border-radius:14px; padding:11px 13px;
    box-shadow:0 12px 32px rgba(0,0,0,.55); display:flex; flex-direction:column; gap:9px;}
  .save-toast .st-text{font-size:12.5px; font-weight:700; line-height:1.55}
  .save-toast .st-btns{display:flex; gap:8px}
  .save-toast .st-btns button{flex:1; border-radius:10px; padding:8px; font-weight:800; font-size:13px; cursor:pointer; border:0}
  #stSave{background:#19c37d; color:#06281b}
  #stLater{background:var(--glass); color:inherit; border:1px solid var(--line)}

  /* ページドット */
  .dots{position:relative; z-index:3; display:flex; gap:9px; justify-content:center; padding:8px 0 max(10px, env(safe-area-inset-bottom));}
  .dot{width:8px;height:8px;border-radius:50%; background:rgba(255,255,255,.35); transition:all .2s; cursor:pointer}
  .dot.on{background:#fff; width:22px; border-radius:6px}

  .hint{position:absolute; bottom:54px; left:0; right:0; text-align:center; font-size:11px; color:var(--muted); z-index:3; pointer-events:none}
  @media(min-width:480px){ .hint{display:none} }

  /* 📢 アップデートのおしらせ（左からスライド・生徒向け） */
  .news-handle{position:absolute; left:0; top:44%; z-index:18; transform:translateY(-50%);
    background:linear-gradient(135deg,#4f7cff,#b14bff); color:#fff; border:0; cursor:pointer;
    padding:12px 5px; border-radius:0 13px 13px 0; font-size:11px; font-weight:800; line-height:1.3;
    writing-mode:vertical-rl; text-orientation:upright; letter-spacing:3px;
    box-shadow:3px 4px 14px rgba(0,0,0,.45);}
  .news-handle:active{transform:translateY(-50%) scale(.95)}
  .news-handle .nh-dot{position:absolute; right:-3px; top:-3px; width:11px; height:11px; border-radius:50%;
    background:#ff4d4d; box-shadow:0 0 0 2px #0b1026; display:none;}
  .news-handle.has-new .nh-dot{display:block;}
  .news-scrim{position:absolute; inset:0; z-index:24; background:rgba(4,6,14,.5); opacity:0; pointer-events:none; transition:opacity .28s;}
  .news-scrim.open{opacity:1; pointer-events:auto;}
  .news-drawer{position:absolute; top:0; bottom:0; left:0; width:86%; max-width:332px; z-index:25;
    background:linear-gradient(165deg,#141a38,#0c1024); border-right:1px solid var(--line);
    box-shadow:14px 0 40px rgba(0,0,0,.6); transform:translateX(-104%);
    transition:transform .3s cubic-bezier(.22,.61,.36,1); display:flex; flex-direction:column;}
  .news-drawer.open{transform:translateX(0);}
  .news-top{display:flex; align-items:center; justify-content:space-between; padding:16px 16px 10px;}
  .news-top .nt-title{font-size:17px; font-weight:800;}
  .news-close{background:var(--glass); border:1px solid var(--line); color:inherit; border-radius:999px; width:32px; height:32px; font-size:15px; cursor:pointer;}
  .news-list{flex:1; overflow-y:auto; padding:2px 16px 18px;}
  .news-item{background:rgba(255,255,255,.05); border:1px solid var(--line); border-radius:14px; padding:11px 13px; margin-bottom:11px;}
  .news-item .ni-date{font-size:11px; color:var(--muted); font-weight:700;}
  .news-item .ni-title{font-size:14px; font-weight:800; margin:3px 0 7px;}
  .news-item .ni-title .ni-new{background:#ff4d4d; color:#fff; font-size:9px; font-weight:800; padding:1px 6px; border-radius:999px; margin-left:6px; vertical-align:middle;}
  .news-item .ni-body{font-size:12.5px; line-height:1.7; color:#dfe6ff;}
  .news-item .ni-body div{margin:3px 0;}
  .news-empty{color:var(--muted); font-size:12.5px; text-align:center; padding:30px 10px;}
</style>
</head>
<body>
<div class="stage">
  <div class="phone" id="phone">
    <!-- ステータスバー -->
    <div class="statusbar">
      <span id="sb-time">--:--</span>
      <span class="right"><span>📶</span><span>🔋</span></span>
    </div>

    <!-- 時計 -->
    <div class="clockwrap">
      <div class="clock" id="bigClock">--:--</div>
      <div class="date" id="bigDate">　</div>
    </div>

    <!-- ページ（教科ページ＋プロフィールをJSで生成） -->
    <div class="pager" id="pager">
      <div class="track" id="track"><!-- JSで生成 --></div>
    </div>

    <!-- プロフィールページのひな型（JSが最後のページに使う） -->
    <template id="tpl-profile">
      <section class="page">
        <div class="profile">
          <button class="pf-avatar" id="pfAvatar" title="タップしてきせかえ">🧑‍🎓</button>
          <div class="pf-avatars" id="pfAvatars"><!-- きせかえ候補 --></div>
          <div class="pf-name-row">
            <span class="pf-name" id="pfName">プレイヤー</span>
            <button class="pf-edit" id="pfEdit" title="名前をかえる">✏️</button>
          </div>
          <div class="pf-streak" id="pfStreak">🔥 れんぞく 0日</div>
          <div class="pf-section-t">⏱️ あそんだ時間</div>
          <div class="pf-total" id="pfTotal">合計 0分</div>
          <div class="pf-stats" id="pfStats"><!-- ゲームごと --></div>
          <div class="pf-note">※ゲームで遊ぶと自動で記録されます。「データ」アプリの引っこしでも一緒に移せます。</div>
        </div>
      </section>
    </template>

    <!-- ドット -->
    <div class="dots" id="dots"><!-- JSで生成 --></div>
    <div class="hint">← よこにスワイプでページ切り替え →</div>

    <!-- 💾 保存うっかり防止トースト -->
    <div id="saveToast" class="save-toast" style="display:none">
      <div class="st-text" id="stText">💾 データを保存しておこう</div>
      <div class="st-btns">
        <button id="stSave">保存する</button>
        <button id="stLater">あとで</button>
      </div>
    </div>

    <!-- 💾 データ移行オーバーレイ -->
    <div id="dataOverlay" style="position:absolute;inset:0;z-index:50;background:rgba(5,7,15,.92);display:none;flex-direction:column;padding:18px;overflow:auto">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <div style="font-size:18px;font-weight:800">💾 データの保存・読込</div>
        <button id="dataClose" style="background:var(--glass);border:1px solid var(--line);color:inherit;border-radius:999px;width:34px;height:34px;font-size:16px;cursor:pointer">✕</button>
      </div>
      <div style="font-size:12px;color:var(--muted);line-height:1.7;margin-bottom:12px">理科RPGと英語（グラマー・ガード）の<b>両方のデータ</b>を1つの文字にまとめて保存できます。機種変更や万一のキャッシュ削除に備えて、コピー（またはファイル保存）しておくと、別の端末でも「読み込む」で元に戻せます。</div>
      <button id="dataExport" style="background:#19c37d;color:#06281b;border:0;border-radius:12px;padding:12px;font-weight:800;font-size:15px;cursor:pointer">📤 まとめて書き出す</button>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button id="dataCopy" style="flex:1;background:var(--glass);border:1px solid var(--line);color:inherit;border-radius:12px;padding:10px;font-weight:700;cursor:pointer">📋 コピー</button>
        <button id="dataDownload" style="flex:1;background:var(--glass);border:1px solid var(--line);color:inherit;border-radius:12px;padding:10px;font-weight:700;cursor:pointer">💾 ファイル保存</button>
      </div>
      <textarea id="dataBox" placeholder="「まとめて書き出す」で文字が出ます。読み込みたいときは、保存しておいた文字をここに貼り付けて「読み込む」。" style="width:100%;height:110px;margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:8px;font-size:12px;font-family:monospace;background:#0c1020;color:#dfe6ff;box-sizing:border-box"></textarea>
      <button id="dataImport" style="background:#4f7cff;color:#fff;border:0;border-radius:12px;padding:12px;font-weight:800;font-size:15px;cursor:pointer;margin-top:8px">📥 読み込む（両ゲームを上書き）</button>
      <div id="dataMsg" style="font-size:12px;margin-top:8px;min-height:18px"></div>
    </div>

    <!-- 📢 アップデートのおしらせ（左はしのタブ or 左→右スワイプで開く・生徒向け） -->
    <button class="news-handle" id="newsHandle" aria-label="おしらせを開く">おしらせ<span class="nh-dot"></span></button>
    <div class="news-scrim" id="newsScrim"></div>
    <aside class="news-drawer" id="newsDrawer" aria-hidden="true">
      <div class="news-top"><div class="nt-title">📢 おしらせ</div>
        <button class="news-close" id="newsClose" aria-label="閉じる">✕</button></div>
      <div class="news-list" id="newsList"></div>
    </aside>
  </div>
</div>

<script>
(function(){
  // ---- 起動コンテキスト判定 ----------------------------------------
  // 本番（配布リポジトリ）では launcher が index.html として配信され、
  // 理科RPG は rika.html に置かれる。開発時は launcher.html で開くので
  // 理科RPG は index.html のまま。両方で動くようにリンク先を切り替える。
  // 本番(配布)では launcher=index.html・理科=rika.html・英語/数学はルート直下(フラット)。
  // 開発では launcher.html で開き、理科=index.html・英語=_english_draft/配下(ネスト)。
  var path = location.pathname;
  var isProd = /(\/|index\.html?)$/.test(path); // 末尾が / か index.html → 本番ランチャー
  var RIKA  = isProd ? 'rika.html' : 'index.html';
  var ENG   = isProd ? 'grammar-guard.html' : '_english_draft/grammar-guard.html';
  var MERGE = 'prime-merge/index.html'; // dev/prod 両方にフォルダあり（2026-06-09 dev取込済）

  // アプリ一覧（catで教科に振り分け）。アプリが無い教科は「おたのしみに」を自動表示。
  var APPS = [
    // 数学はすべて「数の第六感」ポータルに統合（ゴリラ/ラン/マージは数の第六感の中から起動）。
    {key:'numsense', label:'数の第六感',   icon:'🔮', cls:'ic-numsense', href:'numsense/index.html', cat:'math', beta:true},
    {key:'eng',   label:'グラマー・ガード', icon:'🛡️', cls:'ic-eng',   href:ENG,                       cat:'english'},
    {key:'sengoku', label:'偉人トレーナー',  icon:'🗾', cls:'ic-sengoku', href:'sengoku/index.html',    cat:'social', beta:true},
    {key:'rika',  label:'理科RPG',        icon:'🧪', cls:'ic-rika',  href:RIKA,                      cat:'science'},
    {key:'rika2', label:'理科RPG2',       icon:'⚔️', cls:'ic-rika',  href:'rika2/demo.html',         cat:'science', beta:true},  // 体験版(あいことば付き・dev/prod共通の相対パス)
    {key:'quizbattle', label:'あてっこ対戦', icon:'🃏', cls:'ic-quiz', href:'quizbattle/index.html',  cat:'other'},  // 全教科105題材の対面カードバトル（2026-09-02 掲載・実体は rika2/apps/quizbattle/dist）
    {key:'data',  label:'データ',          icon:'💾', cls:'ic-data',  action:'data',                  cat:'tool'},
  ];

  // 教科ごとの「枠」。配列の順＝表示順。1ページに入りきらないぶんは次ページへ。
  var GROUPS = [
    {cat:'math',     em:'🔢', name:'数学',   color:'#fbbf24'},
    {cat:'japanese', em:'📖', name:'国語',   color:'#fb7185'},
    {cat:'english',  em:'🔤', name:'英語',   color:'#a78bfa'},
    {cat:'social',   em:'🌏', name:'社会',   color:'#fb923c'},
    {cat:'science',  em:'🔬', name:'理科',   color:'#26e58c'},
    {cat:'other',    em:'✨', name:'いろんな教科', color:'#94a3b8'},   // 教科をまたぐアプリの枠（あてっこ対戦が最初の住人・2026-09-02）
    {cat:'tool',     em:'⚙️', name:'ツール', color:'#34e0f0'},
  ];
  var FRAMES_PER_PAGE = 4; // 1ページに収める枠の数（縦に収まる範囲）

  var track = document.getElementById('track');

  function makeApp(a){
    var btn = document.createElement('button');
    btn.className = 'app' + (a.soon ? ' soon' : '');
    btn.innerHTML =
      '<div class="icon '+a.cls+'"><span class="em">'+a.icon+'</span>'+(a.soon?'<span class="badge-soon">準備中</span>':'')+(a.beta?'<span class="badge-beta">β版</span>':'')+'</div>'+
      '<div class="label">'+a.label+'</div>';
    if(a.action==='data'){ btn.addEventListener('click', function(){ document.getElementById('dataOverlay').style.display='flex'; }); }
    else if(!a.soon){ btn.addEventListener('click', function(){ location.href = a.href; }); }
    return btn;
  }
  function makeFrame(g){
    var apps = APPS.filter(function(a){ return a.cat === g.cat; });
    if(!apps.length){ apps = [{label:'おたのしみに', icon:'➕', cls:'ic-soon', soon:true}]; } // 未実装の教科
    var fr = document.createElement('div'); fr.className = 'frame';
    fr.innerHTML = '<div class="frame-head" style="color:'+g.color+'">'+
      '<span class="dot-c"></span><span class="em">'+g.em+'</span>'+
      '<span style="color:var(--ink)">'+g.name+'</span></div>';
    var grid = document.createElement('div'); grid.className = 'grid';
    apps.forEach(function(a){ grid.appendChild(makeApp(a)); });
    fr.appendChild(grid);
    return fr;
  }

  // 教科ページを生成（FRAMES_PER_PAGEごとに改ページ）→ 最後にプロフィールページ
  var totalPages = 0;
  for(var gi=0; gi<GROUPS.length; gi+=FRAMES_PER_PAGE){
    var sec = document.createElement('section'); sec.className = 'page';
    if(gi===0){
      var greet = document.createElement('div'); greet.className='greet'; greet.id='greet';
      greet.textContent='ようこそ！　遊ぶアプリをえらんでね';
      sec.appendChild(greet);
    }
    var framesEl = document.createElement('div'); framesEl.className='frames';
    GROUPS.slice(gi, gi+FRAMES_PER_PAGE).forEach(function(g){ framesEl.appendChild(makeFrame(g)); });
    sec.appendChild(framesEl); track.appendChild(sec); totalPages++;
  }
  track.appendChild(document.getElementById('tpl-profile').content.cloneNode(true)); totalPages++;

  // トラック幅・各ページ幅を動的に設定
  track.style.width = (totalPages*100)+'%';
  track.style.flex  = '0 0 '+(totalPages*100)+'%';
  var PW = 100/totalPages; // 1ページぶんの割合（トラック基準）
  [].slice.call(track.children).forEach(function(p){ p.style.width = PW+'%'; p.style.flex = '0 0 '+PW+'%'; });

  // ---- 時計 -------------------------------------------------------
  function pad(n){ return (n<10?'0':'')+n; }
  var WD=['日','月','火','水','木','金','土'];
  function tick(){
    var d=new Date();
    var hm=pad(d.getHours())+':'+pad(d.getMinutes());
    document.getElementById('sb-time').textContent=hm;
    document.getElementById('bigClock').textContent=hm;
    document.getElementById('bigDate').textContent=(d.getMonth()+1)+'月'+d.getDate()+'日（'+WD[d.getDay()]+'）';
    var h=d.getHours(), g='こんにちは', tod='tod-day';
    if(h<5){ g='こんばんは'; tod='tod-night'; }
    else if(h<10){ g='おはよう'; tod='tod-morning'; }
    else if(h<17){ g='こんにちは'; tod='tod-day'; }
    else if(h<19){ g='こんばんは'; tod='tod-evening'; }
    else { g='こんばんは'; tod='tod-night'; }
    document.getElementById('greet').textContent=g+'！　遊ぶアプリをえらんでね';
    var phone=document.getElementById('phone');
    phone.className='phone '+tod; // 時間帯で壁紙切替
  }
  tick(); setInterval(tick, 15000);

  // ---- 共通プロフィール（まなびハブ） ----------------------------
  // 全アプリ共通の localStorage キー manabi_hub_v1 に、各ゲームが
  // 学習日(days)とプレイ時間(play[ゲームkey])を記録する。ここではそれを表示。
  var HKEY='manabi_hub_v1';
  var GAME_META=[
    {key:'rika',  name:'理科RPG',        icon:'🧪', cls:'ic-rika'},
    {key:'gg',    name:'グラマー・ガード', icon:'🛡️', cls:'ic-eng'},
    {key:'gori',  name:'ゴリラ大砲',      icon:'🦍', cls:'ic-gori'},
    {key:'run',   name:'割れる数ラン',    icon:'🏃', cls:'ic-run'},
    {key:'merge', name:'そすうマージ',    icon:'🔢', cls:'ic-merge'},
    {key:'numsense', name:'数の第六感',   icon:'🔮', cls:'ic-numsense'},
    {key:'quizbattle', name:'あてっこ対戦', icon:'🃏', cls:'ic-quiz'},
  ];
  var AVATARS=['🧑‍🎓','👦','👧','🦊','🐱','🐼','🐸','🐯','🤖','🦖','🐧','🦉'];
  function hubLoad(){ try{return JSON.parse(localStorage.getItem(HKEY))||{};}catch(e){return{};} }
  function hubSave(h){ try{localStorage.setItem(HKEY,JSON.stringify(h));}catch(e){} }
  function dayKey(d){ return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
  function fmtDur(sec){ sec=Math.round(sec||0); if(sec<60)return sec+'秒'; var m=Math.floor(sec/60); if(m<60)return m+'分'; return Math.floor(m/60)+'時間'+(m%60)+'分'; }
  function calcStreak(days){ days=days||{}; var n=0,d=new Date(); for(;;){ if(days[dayKey(d)]){ n++; d.setDate(d.getDate()-1); } else break; } return n; }

  function renderProfile(){
    var hub=hubLoad(), play=hub.play||{};
    // 名前（manabi_hub優先→旧rika_hub→既定）
    var nm=hub.name; if(!nm){ try{ var rh=JSON.parse(localStorage.getItem('rika_hub_v1')||'{}'); nm=rh&&rh.name; }catch(e){} }
    var nameEl=document.getElementById('pfName'); if(nameEl) nameEl.textContent=nm||'プレイヤー';
    // アバター
    var av=hub.avatar||'🧑‍🎓';
    var avEl=document.getElementById('pfAvatar'); if(avEl) avEl.textContent=av;
    var picker=document.getElementById('pfAvatars');
    if(picker){
      if(!picker.dataset.built){ picker.dataset.built='1';
        AVATARS.forEach(function(e){
          var b=document.createElement('button'); b.textContent=e;
          b.addEventListener('click', function(){ var h=hubLoad(); h.avatar=e; hubSave(h); renderProfile(); });
          picker.appendChild(b);
        });
      }
      [].slice.call(picker.children).forEach(function(b){ b.className=(b.textContent===av?'on':''); });
    }
    // 名前編集
    var edit=document.getElementById('pfEdit');
    if(edit && !edit.dataset.bound){ edit.dataset.bound='1';
      edit.addEventListener('click', function(){
        var h=hubLoad(); var cur=h.name||nm||'';
        var v=window.prompt('名前を入力してね（12文字まで）', cur);
        if(v!=null){ h.name=v.trim().slice(0,12); hubSave(h); renderProfile(); }
      });
    }
    // 連続学習日数
    var st=document.getElementById('pfStreak'); if(st) st.textContent='🔥 れんぞく '+calcStreak(hub.days)+'日';
    // プレイ時間（ゲームごと・portalは除外）
    var max=1, total=0;
    GAME_META.forEach(function(g){ max=Math.max(max, play[g.key]||0); });
    Object.keys(play).forEach(function(k){ if(k!=='portal') total+=play[k]||0; });
    var totEl=document.getElementById('pfTotal'); if(totEl) totEl.textContent='合計 '+fmtDur(total);
    var stats=document.getElementById('pfStats');
    if(stats){ stats.innerHTML='';
      GAME_META.forEach(function(g){
        var sec=play[g.key]||0, pct=Math.round((sec/max)*100);
        var row=document.createElement('div'); row.className='pf-stat';
        row.innerHTML='<div class="ic '+g.cls+'">'+g.icon+'</div>'+
          '<div class="meta"><div class="nm"><span>'+g.name+'</span><span class="t">'+(sec?fmtDur(sec):'ーー')+'</span></div>'+
          '<div class="pf-bar"><i style="width:'+(sec?Math.max(6,pct):0)+'%;background:linear-gradient(90deg,#60a5fa,#a78bfa)"></i></div></div>';
        stats.appendChild(row);
      });
    }
  }

  // ポータルも「今日あそんだ日」として記録（プレイ時間は portal キーに別計上）
  (function(){
    var h=hubLoad(); h.play=h.play||{}; h.days=h.days||{}; h.days[dayKey(new Date())]=true; h.lastApp='portal'; h.lastSeen=Date.now(); hubSave(h);
    var acc=0,last=Date.now();
    function flush(){ if(acc<1)return; var g=hubLoad(); g.play=g.play||{}; g.play.portal=(g.play.portal||0)+Math.round(acc); acc=0; hubSave(g); }
    setInterval(function(){ var n=Date.now(); if(!document.hidden) acc+=(n-last)/1000; last=n; if(acc>=15) flush(); },1000);
    document.addEventListener('visibilitychange', function(){ last=Date.now(); if(document.hidden){ flush(); } else { renderProfile(); } });
    window.addEventListener('pagehide',flush); window.addEventListener('beforeunload',flush);
  })();

  renderProfile();

  // ---- ページ切り替え（スワイプ） ---------------------------------
  var pager=document.getElementById('pager');
  var dotsWrap=document.getElementById('dots');
  for(var di=0; di<totalPages; di++){
    var dd=document.createElement('span'); dd.className='dot'+(di===0?' on':''); dd.dataset.p=di; dotsWrap.appendChild(dd);
  }
  var dots=[].slice.call(dotsWrap.querySelectorAll('.dot'));
  var page=0, MAXP=totalPages-1;
  function go(p){
    page=Math.max(0,Math.min(MAXP,p));
    track.style.transform='translateX(-'+(page*PW)+'%)';
    dots.forEach(function(d,i){ d.classList.toggle('on', i===page); });
    if(page===MAXP) renderProfile(); // プロフィールページに来たら最新化
  }
  dots.forEach(function(d){ d.addEventListener('click', function(){ go(+d.dataset.p); }); });

  var sx=0, dx=0, drag=false;
  pager.addEventListener('touchstart', function(e){ sx=e.touches[0].clientX; dx=0; drag=true; }, {passive:true});
  pager.addEventListener('touchmove', function(e){ if(drag) dx=e.touches[0].clientX - sx; }, {passive:true});
  pager.addEventListener('touchend', function(){
    if(!drag) return; drag=false;
    if(Math.abs(dx)>50){ go(page + (dx<0?1:-1)); }
  });
  // マウスでも（PC確認用）
  pager.addEventListener('mousedown', function(e){ sx=e.clientX; dx=0; drag=true; });
  window.addEventListener('mousemove', function(e){ if(drag) dx=e.clientX - sx; });
  window.addEventListener('mouseup', function(){ if(!drag) return; drag=false; if(Math.abs(dx)>60){ go(page+(dx<0?1:-1)); } });

  // ---- 💾 両ゲーム共通のデータ保存・読込（機種変更の移行・要望#16理科共通） ----
  // 理科(chemical_rpg_save_v1)と英語(gg_v2_save_v1)は同一オリジンなのでlocalStorageを共有。
  // 両方を1文字列(RIKA1:+base64(JSON))にまとめて退避/復元する。
  var GG_KEY='gg_v2_save_v1', RIKA_KEY='chemical_rpg_save_v1', DPREFIX='RIKA1:';
  function dmsg(t,ok){ var m=document.getElementById('dataMsg'); if(m){ m.textContent=t; m.style.color=ok?'#7ee2a8':'#ff9a8a'; } }
  function b64e(s){ return btoa(unescape(encodeURIComponent(s))); }
  function b64d(s){ return decodeURIComponent(escape(atob(s))); }
  var ov=document.getElementById('dataOverlay'); // 「💾データ」アプリタイルから開く(クリック配線はAPPS生成側)
  document.getElementById('dataClose').addEventListener('click', function(){ ov.style.display='none'; });
  document.getElementById('dataExport').addEventListener('click', function(){
    try{
      var payload={ v:1, gg:localStorage.getItem(GG_KEY)||null, rika:localStorage.getItem(RIKA_KEY)||null };
      if(!payload.gg && !payload.rika){ dmsg('まだ保存できるデータがありません。',false); return; }
      document.getElementById('dataBox').value = DPREFIX + b64e(JSON.stringify(payload));
      dmsg('書き出しました。コピー or ファイル保存しておいてね。',true);
    }catch(e){ dmsg('書き出しに失敗しました。',false); }
  });
  document.getElementById('dataCopy').addEventListener('click', function(){
    var box=document.getElementById('dataBox'); if(!box.value){ document.getElementById('dataExport').click(); }
    if(!box.value) return;
    try{ box.select(); if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(box.value); } else { document.execCommand('copy'); } dmsg('コピーしました。',true); markBackup(); }
    catch(e){ dmsg('コピーできませんでした。長押しで選択してね。',false); }
  });
  document.getElementById('dataDownload').addEventListener('click', function(){
    var box=document.getElementById('dataBox'); if(!box.value){ document.getElementById('dataExport').click(); }
    if(!box.value) return;
    try{ var blob=new Blob([box.value],{type:'text/plain'}); var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='manabi-save.txt'; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },100); dmsg('ファイルに保存しました。',true); markBackup(); }
    catch(e){ dmsg('保存に失敗しました。',false); }
  });
  document.getElementById('dataImport').addEventListener('click', function(){
    var code=(document.getElementById('dataBox').value||'').trim();
    if(!code){ dmsg('読み込む文字を貼り付けてね。',false); return; }
    if(code.indexOf(DPREFIX)!==0){ dmsg('このデータは「まなびポータル」の保存ではないみたい。',false); return; }
    var p; try{ p=JSON.parse(b64d(code.slice(DPREFIX.length))); }catch(e){ dmsg('文字が壊れているようです。コピーし直してね。',false); return; }
    if(p.gg){ try{ JSON.parse(p.gg); }catch(e){ dmsg('英語データが壊れています。',false); return; } }
    if(p.rika){ try{ JSON.parse(p.rika); }catch(e){ dmsg('理科データが壊れています。',false); return; } }
    if(!window.confirm('この端末の理科・英語のデータを、読み込んだデータで上書きします。よろしいですか？')) return;
    try{
      if(p.gg) localStorage.setItem(GG_KEY, p.gg);
      if(p.rika) localStorage.setItem(RIKA_KEY, p.rika);
      dmsg('読み込みました！ 各ゲームを開くと反映されます。',true);
    }catch(e){ dmsg('読み込みに失敗しました。',false); }
  });

  // ---- 保存うっかり防止（バックアップの催促） ----------------------
  // バックアップ(コピー/ファイル保存)した日時を記録し、一定日数あいたら
  // ポータル起動時にやさしく案内する。「あとで」は数日スヌーズ。
  function markBackup(){ var h=hubLoad(); h.lastBackup=Date.now(); hubSave(h); }
  (function(){
    var DAY=86400000, REMIND_AFTER=7, SNOOZE=3;
    var hub=hubLoad();
    var hasData = !!(localStorage.getItem(RIKA_KEY) || localStorage.getItem(GG_KEY)) ||
      ['rika','gg','gori','run','merge'].some(function(k){ return ((hub.play||{})[k]||0) > 120; });
    var sinceBackup = hub.lastBackup ? (Date.now()-hub.lastBackup)/DAY : Infinity;
    var snoozing = hub.backupSnooze ? (Date.now()-hub.backupSnooze)/DAY < SNOOZE : false;
    var toast=document.getElementById('saveToast');
    if(hasData && sinceBackup>=REMIND_AFTER && !snoozing){
      document.getElementById('stText').textContent = '💾 ' +
        (isFinite(sinceBackup) ? ('保存してから'+Math.floor(sinceBackup)+'日たちました。') : 'まだ一度も保存していません。') +
        ' 機種変更にそなえて保存しておこう';
      toast.style.display='flex';
    }
    document.getElementById('stSave').addEventListener('click', function(){ toast.style.display='none'; document.getElementById('dataOverlay').style.display='flex'; });
    document.getElementById('stLater').addEventListener('click', function(){ var h=hubLoad(); h.backupSnooze=Date.now(); hubSave(h); toast.style.display='none'; });
  })();

  (function(){
    var drawer=document.getElementById('newsDrawer'), scrim=document.getElementById('newsScrim'),
        handle=document.getElementById('newsHandle'), listEl=document.getElementById('newsList'),
        closeBtn=document.getElementById('newsClose');
    if(!drawer||!handle) return;
    var latest = UPDATES.length ? UPDATES[0].date : '';
    function seenVal(){ return hubLoad().lastSeenUpdate; }
    function refreshDot(){ handle.className='news-handle'+((latest && seenVal()!==latest)?' has-new':''); }
    function render(){
      if(!UPDATES.length){ listEl.innerHTML='<div class="news-empty">まだおしらせはありません。</div>'; return; }
      var seen=seenVal();
      listEl.innerHTML = UPDATES.map(function(u){
        var isNew = (u.date===latest) && (seen!==latest);
        var body = (u.body||[]).map(function(b){ return '<div>'+b+'</div>'; }).join('');
        return '<div class="news-item"><div class="ni-date">'+String(u.date).replace(/-/g,'.')+'</div>'+
          '<div class="ni-title">'+u.title+(isNew?'<span class="ni-new">NEW</span>':'')+'</div>'+
          '<div class="ni-body">'+body+'</div></div>';
      }).join('');
    }
    function open(){ render(); drawer.classList.add('open'); scrim.classList.add('open'); drawer.setAttribute('aria-hidden','false');
      var h=hubLoad(); h.lastSeenUpdate=latest; hubSave(h); refreshDot(); }
    function close(){ drawer.classList.remove('open'); scrim.classList.remove('open'); drawer.setAttribute('aria-hidden','true'); }
    handle.addEventListener('click', open);
    closeBtn.addEventListener('click', close);
    scrim.addEventListener('click', close);
    // 左はし(26px以内)から右へスワイプで開く / 開いている時は左へスワイプで閉じる
    var tsx=0, tsy=0, edge=false;
    document.addEventListener('touchstart', function(e){ var t=e.touches[0]; tsx=t.clientX; tsy=t.clientY; edge=(tsx<=26); }, {passive:true});
    document.addEventListener('touchend', function(e){ var t=e.changedTouches[0]; var dx=t.clientX-tsx, dy=t.clientY-tsy;
      if(Math.abs(dx)<45 || Math.abs(dy)>Math.abs(dx)) return;
      if(!drawer.classList.contains('open')){ if(edge && dx>0) open(); }
      else if(dx<0){ close(); }
    }, {passive:true});
    refreshDot();
  })();
})();
</script>
