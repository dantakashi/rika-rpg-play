<!DOCTYPE html>
<html lang="ja" class="notranslate" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="google" content="notranslate">
<title>まなびポータル</title>
<style>
  :root{
    --bg1:#0b1026; --bg2:#1a1040; --bg3:#2a1a55;
    --ink:#f5f7ff; --muted:#aab3d6; --glass:rgba(255,255,255,.10); --line:rgba(255,255,255,.18);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; height:100%; overflow:hidden;
    font-family:-apple-system,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,sans-serif;
    color:var(--ink); background:#05070f;}
  /* 画面外の背景（PC時にスマホ枠の外側を埋める） */
  .stage{position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(1200px 800px at 50% -10%, #16203f 0%, #070a16 60%, #04060e 100%);}
  /* スマホ枠 */
  .phone{position:relative; width:100%; height:100%; max-width:440px; max-height:920px;
    overflow:hidden; background:linear-gradient(170deg,var(--bg1),var(--bg2) 55%,var(--bg3));
    border-radius:0;}
  @media(min-width:480px){
    .phone{border-radius:38px; box-shadow:0 30px 80px rgba(0,0,0,.6), 0 0 0 10px #0b0d18, 0 0 0 12px #20243a;
      height:min(92vh,900px);}
    .stage{padding:14px;}
  }
  /* 壁紙の装飾（ふわっと光る玉） */
  .phone::before,.phone::after{content:""; position:absolute; border-radius:50%; filter:blur(40px); opacity:.55; pointer-events:none;}
  .phone::before{width:260px;height:260px; background:#4f7cff; top:-60px; right:-60px;}
  .phone::after{width:240px;height:240px; background:#b14bff; bottom:40px; left:-70px;}

  /* ステータスバー */
  .statusbar{position:relative; z-index:3; display:flex; align-items:center; justify-content:space-between;
    padding:12px 22px 4px; font-size:14px; font-weight:700; letter-spacing:.3px;}
  .statusbar .right{display:flex; gap:7px; align-items:center; opacity:.95}

  /* 時計（大きく） */
  .clockwrap{position:relative; z-index:3; text-align:center; margin-top:6px;}
  .clock{font-size:62px; font-weight:800; line-height:1; letter-spacing:1px; text-shadow:0 3px 18px rgba(0,0,0,.4)}
  .date{font-size:14px; color:var(--muted); margin-top:6px; font-weight:600}

  /* ページャ（横スワイプ領域） */
  .pager{position:relative; z-index:3; flex:1; display:flex; overflow:hidden;}
  .track{display:flex; width:200%; flex:0 0 200%; height:100%; transform:translateX(0); transition:transform .32s cubic-bezier(.22,.61,.36,1); touch-action:pan-y; will-change:transform;}
  .page{width:50%; height:100%; padding:18px 18px 0; display:flex; flex-direction:column;}

  /* アプリグリッド */
  .greet{font-size:15px; color:var(--muted); font-weight:700; margin:6px 4px 14px;}
  .grid{display:grid; grid-template-columns:repeat(2,1fr); gap:18px 16px; align-content:start;}
  .app{display:flex; flex-direction:column; align-items:center; gap:9px; cursor:pointer; border:0; background:none; color:inherit; padding:0;
    transition:transform .12s ease;}
  .app:active{transform:scale(.9)}
  .icon{width:84px; height:84px; border-radius:22px; display:flex; align-items:center; justify-content:center;
    font-size:44px; box-shadow:0 8px 22px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.35);
    position:relative; overflow:hidden;}
  .icon::after{content:""; position:absolute; inset:0; background:linear-gradient(160deg,rgba(255,255,255,.30),transparent 45%);}
  .label{font-size:13px; font-weight:700; text-align:center; line-height:1.25; text-shadow:0 1px 4px rgba(0,0,0,.5)}
  .sub{font-size:10.5px; color:var(--muted); font-weight:600; margin-top:-4px}
  /* アイコン配色 */
  .ic-rika{background:linear-gradient(160deg,#19c37d,#0b8a57)}
  .ic-eng {background:linear-gradient(160deg,#8b5cf6,#5b21b6)}
  .ic-gori{background:linear-gradient(160deg,#fb923c,#c2410c)}
  .ic-run {background:linear-gradient(160deg,#fb7185,#be123c)}
  .ic-soon{background:linear-gradient(160deg,#64748b,#334155); opacity:.65}
  .app.soon{cursor:default}
  .app.soon:active{transform:none}
  .badge-soon{position:absolute; right:-4px; top:-4px; background:#facc15; color:#3b2c00; font-size:9px; font-weight:800;
    padding:2px 6px; border-radius:999px; box-shadow:0 2px 6px rgba(0,0,0,.4)}

  /* プロフィールページ（Coming soon） */
  .profile{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:14px; padding:0 26px;}
  .pf-avatar{width:110px;height:110px;border-radius:50%; background:linear-gradient(160deg,#334155,#1e293b);
    display:flex;align-items:center;justify-content:center;font-size:54px; box-shadow:inset 0 2px 0 rgba(255,255,255,.2), 0 10px 30px rgba(0,0,0,.4)}
  .pf-name{font-size:22px; font-weight:800}
  .pf-soon{display:inline-block; margin-top:4px; background:var(--glass); border:1px solid var(--line);
    padding:8px 16px; border-radius:999px; font-size:13px; font-weight:700; color:#ffe08a}
  .pf-desc{font-size:13px; color:var(--muted); line-height:1.7; max-width:300px}

  /* ページドット */
  .dots{position:relative; z-index:3; display:flex; gap:9px; justify-content:center; padding:16px 0 max(18px, env(safe-area-inset-bottom));}
  .dot{width:8px;height:8px;border-radius:50%; background:rgba(255,255,255,.35); transition:all .2s; cursor:pointer}
  .dot.on{background:#fff; width:22px; border-radius:6px}

  .hint{position:absolute; bottom:54px; left:0; right:0; text-align:center; font-size:11px; color:var(--muted); z-index:3; pointer-events:none}
  @media(min-width:480px){ .hint{display:none} }
</style>
</head>
<body>
<div class="stage">
  <div class="phone" id="phone">
    <!-- ステータスバー -->
    <div class="statusbar">
      <span id="sb-time">--:--</span>
      <span class="right"><span>📶</span><span>🔋</span></span>
    </div>

    <!-- 時計 -->
    <div class="clockwrap">
      <div class="clock" id="bigClock">--:--</div>
      <div class="date" id="bigDate">　</div>
    </div>

    <!-- ページ -->
    <div class="pager" id="pager">
      <div class="track" id="track">

        <!-- ページ1: アプリ -->
        <section class="page">
          <div class="greet" id="greet">ようこそ！　遊ぶアプリをえらんでね</div>
          <div class="grid" id="appgrid"><!-- JSで生成 --></div>
        </section>

        <!-- ページ2: プロフィール -->
        <section class="page">
          <div class="profile">
            <div class="pf-avatar">🧑‍🎓</div>
            <div class="pf-name" id="pfName">プレイヤー</div>
            <div class="pf-soon">✨ Coming Soon</div>
            <div class="pf-desc">ここに学習の記録・実績バッジ・全ゲーム共通プロフィールが表示される予定です。<br>今はまだ準備中だよ。</div>
          </div>
        </section>

      </div>
    </div>

    <!-- ドット -->
    <div class="dots">
      <span class="dot on" data-p="0"></span>
      <span class="dot" data-p="1"></span>
    </div>
    <div class="hint">← よこにスワイプでプロフィール →</div>
  </div>
</div>

<script>
(function(){
  // ---- 起動コンテキスト判定 ----------------------------------------
  // 本番（配布リポジトリ）では launcher が index.html として配信され、
  // 理科RPG は rika.html に置かれる。開発時は launcher.html で開くので
  // 理科RPG は index.html のまま。両方で動くようにリンク先を切り替える。
  // 本番(配布)では launcher=index.html・理科=rika.html・英語/数学はルート直下(フラット)。
  // 開発では launcher.html で開き、理科=index.html・英語=_english_draft/配下(ネスト)。
  var path = location.pathname;
  var isProd = /(\/|index\.html?)$/.test(path); // 末尾が / か index.html → 本番ランチャー
  var RIKA = isProd ? 'rika.html' : 'index.html';
  var ENG  = isProd ? 'grammar-guard.html' : '_english_draft/grammar-guard.html';

  var APPS = [
    {key:'rika', label:'理科RPG',        sub:'化学・物理…', icon:'🧪', cls:'ic-rika', href:RIKA},
    {key:'eng',  label:'グラマー・ガード', sub:'英語',       icon:'🛡️', cls:'ic-eng',  href:ENG},
    {key:'gori', label:'ゴリラ大砲',      sub:'数学',        icon:'🦍', cls:'ic-gori', href:'math-gorilla/index.html'},
    {key:'run',  label:'割れる数ラン',    sub:'数学',        icon:'🏃', cls:'ic-run',  href:'math-run/index.html'},
    {key:'soon', label:'おたのしみに',    sub:'',            icon:'➕', cls:'ic-soon', href:null, soon:true},
  ];

  var grid = document.getElementById('appgrid');
  APPS.forEach(function(a){
    var btn = document.createElement('button');
    btn.className = 'app' + (a.soon ? ' soon' : '');
    btn.innerHTML =
      '<div class="icon '+a.cls+'">'+a.icon+(a.soon?'<span class="badge-soon">準備中</span>':'')+'</div>'+
      '<div class="label">'+a.label+'</div>'+
      (a.sub?'<div class="sub">'+a.sub+'</div>':'');
    if(!a.soon){ btn.addEventListener('click', function(){ location.href = a.href; }); }
    grid.appendChild(btn);
  });

  // ---- 時計 -------------------------------------------------------
  function pad(n){ return (n<10?'0':'')+n; }
  var WD=['日','月','火','水','木','金','土'];
  function tick(){
    var d=new Date();
    var hm=pad(d.getHours())+':'+pad(d.getMinutes());
    document.getElementById('sb-time').textContent=hm;
    document.getElementById('bigClock').textContent=hm;
    document.getElementById('bigDate').textContent=(d.getMonth()+1)+'月'+d.getDate()+'日（'+WD[d.getDay()]+'）';
    var h=d.getHours(), g='こんにちは';
    if(h<5)g='こんばんは'; else if(h<11)g='おはよう'; else if(h<17)g='こんにちは'; else g='こんばんは';
    document.getElementById('greet').textContent=g+'！　遊ぶアプリをえらんでね';
  }
  tick(); setInterval(tick, 15000);

  // ---- 名前（ハブ共通プロフィールの種） ----------------------------
  try{
    var hub = JSON.parse(localStorage.getItem('rika_hub_v1')||'{}');
    if(hub && hub.name){ document.getElementById('pfName').textContent = hub.name; }
  }catch(e){}

  // ---- ページ切り替え（スワイプ） ---------------------------------
  var track=document.getElementById('track'), pager=document.getElementById('pager');
  var page=0, MAXP=1;
  var dots=[].slice.call(document.querySelectorAll('.dot'));
  function go(p){
    page=Math.max(0,Math.min(MAXP,p));
    track.style.transform='translateX(-'+(page*50)+'%)';
    dots.forEach(function(d,i){ d.classList.toggle('on', i===page); });
  }
  dots.forEach(function(d){ d.addEventListener('click', function(){ go(+d.dataset.p); }); });

  var sx=0, dx=0, drag=false;
  pager.addEventListener('touchstart', function(e){ sx=e.touches[0].clientX; dx=0; drag=true; }, {passive:true});
  pager.addEventListener('touchmove', function(e){ if(drag) dx=e.touches[0].clientX - sx; }, {passive:true});
  pager.addEventListener('touchend', function(){
    if(!drag) return; drag=false;
    if(Math.abs(dx)>50){ go(page + (dx<0?1:-1)); }
  });
  // マウスでも（PC確認用）
  pager.addEventListener('mousedown', function(e){ sx=e.clientX; dx=0; drag=true; });
  window.addEventListener('mousemove', function(e){ if(drag) dx=e.clientX - sx; });
  window.addEventListener('mouseup', function(){ if(!drag) return; drag=false; if(Math.abs(dx)>60){ go(page+(dx<0?1:-1)); } });
})();
</script>
</body>
</html>
