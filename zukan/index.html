<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>モンスター図鑑</title>
<style>
  :root{--bg:#241f1b;--card:#332c26;--ink:#f4ede2;--sub:#b7a98d;--acc:#d8a24a;--del:#c0564a}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:"Hiragino Maru Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:var(--ink)}
  header{position:sticky;top:0;z-index:10;background:linear-gradient(var(--bg) 82%,#241f1b00);padding:10px 14px 6px}
  header h1{font-size:17px;margin:0 0 6px;display:flex;align-items:baseline;gap:10px}
  header h1 small{font-size:12px;color:var(--sub);font-weight:400}
  .filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .chip{font:inherit;font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid #5a4f43;background:var(--card);color:var(--ink);cursor:pointer;white-space:nowrap}
  .chip.on{background:var(--acc);border-color:var(--acc);color:#241f1b;font-weight:700}
  select,input[type=search]{font:inherit;font-size:12px;padding:5px 8px;border-radius:10px;border:1px solid #5a4f43;background:var(--card);color:var(--ink)}
  input[type=search]{width:130px}
  .delbtn{font:inherit;font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px;border:2px solid var(--del);background:transparent;color:#e8a49b;cursor:pointer;margin-left:auto}
  .delbtn.on{background:var(--del);color:#fff}
  .fbtn{font:inherit;font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px;border:1px solid var(--acc);background:transparent;color:var(--acc);cursor:pointer}
  .fbtn.active{background:var(--acc);color:#241f1b}
  #fpanel{display:none;padding-top:5px}
  #fpanel.open{display:block}
  main{padding:4px 14px 90px}
  h2{font-size:14px;color:var(--acc);margin:18px 0 8px;border-bottom:1px solid #4a4036;padding-bottom:4px}
  h2 small{color:var(--sub);font-weight:400;font-size:11px;margin-left:8px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:8px}
  .cell{position:relative;background:var(--card);border-radius:10px;overflow:hidden;cursor:pointer;border:2px solid transparent}
  .cell img{display:block;width:100%;aspect-ratio:1/1;object-fit:contain;background:repeating-conic-gradient(#3a332d 0 25%,#413931 0 50%) 0 0/22px 22px}
  .cell .nm{font-size:10.5px;padding:3px 5px 2px;line-height:1.25;min-height:2.7em}
  .cell .tg{font-size:9px;color:var(--sub);padding:0 5px 4px}
  .cell.marked{border-color:var(--del)}
  .cell.marked::after{content:"🗑";position:absolute;top:4px;right:4px;font-size:16px;background:#0009;border-radius:8px;padding:2px 4px}
  .badge{position:absolute;top:4px;left:4px;font-size:9px;font-weight:700;padding:2px 6px;border-radius:8px;background:#0009;color:#ffd9a0}
  .empty{color:var(--sub);text-align:center;padding:40px 0}
  /* 拡大ビュー */
  .view{position:fixed;inset:0;z-index:30;background:#000d;display:none;align-items:center;justify-content:center;flex-direction:column;padding:16px}
  .view.on{display:flex}
  .view img{max-width:min(92vw,560px);max-height:66vh;object-fit:contain;border-radius:14px;background:repeating-conic-gradient(#3a332d 0 25%,#413931 0 50%) 0 0/28px 28px}
  .view .meta{margin-top:10px;text-align:center;font-size:14px;line-height:1.7}
  .view .meta .t{color:var(--sub);font-size:12px}
  .view .row{display:flex;gap:10px;margin-top:12px}
  .view button{font:inherit;font-weight:700;font-size:14px;padding:10px 20px;border-radius:12px;border:none;cursor:pointer;color:#fff}
  .v-close{background:#6b6259}.v-del{background:var(--del)}
  /* 削除依頼フッター */
  .delbar{position:fixed;bottom:0;left:0;right:0;z-index:20;background:linear-gradient(#241f1b00,#241f1b 40%);padding:14px;display:none;gap:10px;align-items:center;justify-content:center}
  .delbar.on{display:flex}
  .delbar b{color:#e8a49b}
  .delbar button{font:inherit;font-weight:800;font-size:14px;padding:12px 18px;border-radius:12px;border:none;cursor:pointer;color:#fff}
  .d-copy{background:var(--del)}.d-clear{background:#6b6259}
  .delbar textarea{position:fixed;bottom:70px;left:14px;right:14px;min-height:80px;font-size:11px;border-radius:10px;border:none;padding:8px;display:none}
</style>
</head>
<body>
<header>
  <h1>🗾 モンスター図鑑 <small id="cnt"></small></h1>
  <div class="filters">
    <button class="fbtn" id="ftoggle" onclick="toggleFilters()">🔍 しぼりこみ ▼</button>
    <button class="delbtn" id="delmode" onclick="toggleDel()">🗑 削除依頼モード</button>
  </div>
  <div id="fpanel">
    <div class="filters" id="fConcept"></div>
    <div class="filters" style="margin-top:5px">
      <span id="fClass"></span>
      <select id="fStyle"><option value="">画風: すべて</option></select>
      <select id="fMotion"><option value="">動き: すべて</option><option value="attack">attack</option><option value="idle">idle</option></select>
      <input type="search" id="fText" placeholder="🔍 なまえ検索">
    </div>
  </div>
</header>
<main id="main"></main>
<div class="view" id="view" onclick="closeView()">
  <img id="vimg" src="">
  <div class="meta" id="vmeta"></div>
  <div class="row">
    <button class="v-close" onclick="closeView()">とじる</button>
    <button class="v-del" id="vdel" onclick="markFromView(event)">🗑 削除依頼に入れる</button>
  </div>
</div>
<div class="delbar" id="delbar">
  <b id="delcnt"></b>
  <button class="d-copy" onclick="copyDel(this)">📋 削除依頼をコピー</button>
  <button class="d-clear" onclick="clearDel()">全解除</button>
  <textarea id="deldump" readonly onclick="this.select()"></textarea>
</div>

// ================================================
const CLASS_JP={cute:"かわいい",mob:"ざこ",midboss:"中ボス",boss:"ボス",neta:"ネタ"};
const CLASS_ORDER={cute:0,mob:1,midboss:2,boss:3,neta:4};
const KEY="zukan_del_v1";
let del=new Set(JSON.parse(localStorage.getItem(KEY)||"[]"));
let delMode=false, viewIdx=-1;
const F={g:"",c:"",s:"",m:"",q:""};

const concepts=[...new Set(DATA.map(d=>d.g))];
const styles=[...new Set(DATA.map(d=>d.s))].sort();
function chip(label,val,key,parent){
  const b=document.createElement("button");b.className="chip"+((F[key]===val)?" on":"");
  b.textContent=label;b.onclick=()=>{F[key]=(F[key]===val)?"":val;renderFilters();renderGrid();};
  parent.appendChild(b);
}
function renderFilters(){
  const fc=document.getElementById("fConcept");fc.innerHTML="";
  concepts.forEach(g=>chip(g+"("+DATA.filter(d=>d.g===g).length+")",g,"g",fc));
  const fl=document.getElementById("fClass");fl.innerHTML="";
  Object.keys(CLASS_ORDER).forEach(c=>{if(DATA.some(d=>d.c===c))chip(CLASS_JP[c],c,"c",fl);});
  updateFtoggle();
}
function activeFilterCount(){return ["g","c","s","m","q"].filter(k=>F[k]).length;}
function updateFtoggle(){
  const n=activeFilterCount();
  const open=document.getElementById("fpanel").classList.contains("open");
  const b=document.getElementById("ftoggle");
  b.textContent="🔍 しぼりこみ"+(n?"中("+n+")":"")+(open?" ▲":" ▼");
  b.classList.toggle("active",n>0);
}
function toggleFilters(){
  document.getElementById("fpanel").classList.toggle("open");
  updateFtoggle();
}
const selS=document.getElementById("fStyle");
styles.forEach(s=>{const o=document.createElement("option");o.value=s;o.textContent=s;selS.appendChild(o);});
selS.onchange=()=>{F.s=selS.value;updateFtoggle();renderGrid();};
document.getElementById("fMotion").onchange=e=>{F.m=e.target.value;updateFtoggle();renderGrid();};
document.getElementById("fText").oninput=e=>{F.q=e.target.value.trim();updateFtoggle();renderGrid();};

function filtered(){
  return DATA.map((d,i)=>({d,i})).filter(({d})=>
    (!F.g||d.g===F.g)&&(!F.c||d.c===F.c)&&(!F.s||d.s===F.s)&&(!F.m||d.m===F.m)&&
    (!F.q||d.n.includes(F.q)));
}
function delKey(d){return d.r+"/"+d.o;}
function renderGrid(){
  const list=filtered();
  document.getElementById("cnt").textContent=list.length+" / "+DATA.length+"体";
  const main=document.getElementById("main");main.innerHTML="";
  if(!list.length){main.innerHTML='<div class="empty">該当なし</div>';return;}
  // コンセプト→クラス→画風の順で並べる=そっくりさんが隣に来る
  const groups={};
  list.forEach(x=>{(groups[x.d.g]=groups[x.d.g]||[]).push(x);});
  concepts.filter(g=>groups[g]).forEach(g=>{
    const arr=groups[g].sort((a,b)=>(CLASS_ORDER[a.d.c]-CLASS_ORDER[b.d.c])||a.d.s.localeCompare(b.d.s)||a.d.n.localeCompare(b.d.n));
    const h=document.createElement("h2");h.innerHTML=g+"<small>"+arr.length+"体</small>";main.appendChild(h);
    const grid=document.createElement("div");grid.className="grid";
    arr.forEach(({d,i})=>{
      const c=document.createElement("div");c.className="cell"+(del.has(delKey(d))?" marked":"");
      c.innerHTML='<span class="badge">'+CLASS_JP[d.c]+'</span><img loading="lazy" src="'+IMGDIR+d.f+'"><div class="nm">'+d.n+'</div><div class="tg">'+d.s+"・"+d.m+'</div>';
      c.onclick=()=>{delMode?toggleMark(d):openView(i);};
      grid.appendChild(c);
    });
    main.appendChild(grid);
  });
}
function toggleMark(d){
  const k=delKey(d);del.has(k)?del.delete(k):del.add(k);
  localStorage.setItem(KEY,JSON.stringify([...del]));
  renderGrid();renderDelbar();
}
function toggleDel(){
  delMode=!delMode;
  document.getElementById("delmode").classList.toggle("on",delMode);
  renderDelbar();
}
function renderDelbar(){
  const bar=document.getElementById("delbar");
  bar.classList.toggle("on",delMode||del.size>0);
  document.getElementById("delcnt").textContent="🗑 "+del.size+"体";
}
function openView(i){
  viewIdx=i;const d=DATA[i];
  document.getElementById("vimg").src=IMGDIR+d.f;
  document.getElementById("vmeta").innerHTML="<b>"+d.n+"</b><br><span class='t'>"+d.g+"・"+CLASS_JP[d.c]+"・"+d.s+"・"+d.m+"・["+d.r+"]</span>";
  document.getElementById("vdel").textContent=del.has(delKey(d))?"🗑 削除依頼を取り消す":"🗑 削除依頼に入れる";
  document.getElementById("view").classList.add("on");
}
function closeView(){document.getElementById("view").classList.remove("on");}
function markFromView(ev){ev.stopPropagation();if(viewIdx<0)return;toggleMark(DATA[viewIdx]);closeView();}
function clearDel(){if(!confirm("削除依頼のマークを全部消す？"))return;del.clear();localStorage.setItem(KEY,"[]");renderGrid();renderDelbar();}
function copyDel(btn){
  const byRun={};[...del].forEach(k=>{const p=k.indexOf("/");const r=k.slice(0,p),f=k.slice(p+1);(byRun[r]=byRun[r]||[]).push(f);});
  const txt=JSON.stringify({zukan_delete:byRun});
  const dump=document.getElementById("deldump");dump.style.display="block";dump.value=txt;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>{btn.textContent="コピーしました ✓";},()=>{btn.textContent="下の欄を長押しでコピー";});
  }else{btn.textContent="下の欄を長押しでコピー";}
}
renderFilters();renderGrid();renderDelbar();
</script>
